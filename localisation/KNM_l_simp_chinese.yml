KNM_li_xj:0 "泥巴地里充满了恶作剧"
KNM_li_xj_dec:0 "给坏人们准备一个泥巴坑"
KNM_wqcgn_dec:0 "给朋友们布置大雾"
KNM_li_xj_showorhide:0 "把泥巴坑悄悄藏起来/找出来"
KNM_KNM_mcxmhtg_tt:0 "§Y$FRA_KNM_buy$§!：每次和幻想乡交换宝贝，大家都能额外留下一个新来的小妖精帮手（获得民用工厂）"
KNM_industrial_migration:0 "大铁房子搬家啦"
KNM_industrial_migration_desc:0 "那些大烟囱越来越近了，这里已经变得不安全。地精大叔们说，要是任由那些大卡车和铁管子留在边界，坏人们一下子就会把它们抢走，或者用炮弹炸得稀巴烂。大家得一起动员起来，帮地精大叔拆掉锅炉，用厚木板箱子将所有的机器都装起来，往安全的大后方运送。虽然这些大房子在地图上不见了，但只要机器还在，它们就会变成藏在深林里的隐形工坊，继续为大家制造防身的玩具。"

KNM_industrial_migration_desc_effect_tt:0 "该地区的所有§Y军用工厂§!、§Y民用工厂§!或§Y船厂§!将会被拆除，并转化为无法被敌军占领或轰炸的§Y地图外工厂§!。"
FRA_KNM_buy:0 "大南瓜交换协议"
FRA_KNM_buy_desc:0 "草地上长出来的南瓜比马车还要高，瓜肉也甜得像糖蜜。神社的大家和河童们总是觉得这些美味分外稀奇。大家不会在车间里敲打那些发烫的红铁，那直接将这些沉甸甸的大南瓜装满大竹筐，送去隔壁的神社。那些会喷火的铁筒、跑得飞快的卡车，还有能挡住子弹的箱子，全能用这些好吃的换回来。只要大家开开心心地种地，防卫平原的玩具就会多得数不过来。"

 KNM_spring_market:0 "平原上的大集市"
KNM_spring_market_mission:0 "平原上的大集市"
 KNM_spring_market_desc:0 "既然泥土里的甜南瓜收成如此丰硕，大叔们的铁鸟也造得那么快，林子里的新朋友更是排成了长长的队列，那大家就一齐来湖边办一个热闹的大集市。地精大叔们可以将新鲜的水果分给哨戒的队伍，河童们也会拿刚出炉的暖和零件来进行交换。湖畔的南瓜地越茂盛，换来的防身玩具就越多；神社的铁炉子烧得越旺，分给大家的小甜点就越香；森林里的小手拉得越多，整片平原就越安全。大家在这个暖洋洋的集市里高高兴兴地打闹，春风已经将每个人的心都连在了一块。"

 KNM_spring_market_effect_tt:0 "根据大平原的三方规模，大集市提供以下持续§Y120天§!的互惠增益：\n一、§Y雾之湖§!的每个民用工厂（当前：§G[?num_of_civilian_factories|Y0]§!个）：为§Y幻想乡§!和§Y小妖精联军§!提供地区最大工厂数：§G+0.1%§!，军用工厂建筑速度：§G+0.05%§!，且每月人口：§G+0.1%§!。\n二、§Y幻想乡§!的每个军用工厂（当前：§G[?FRA.num_of_military_factories|Y0]§!个）：为§Y雾之湖§!和§Y小妖精联军§!提供每周人力：§G+10%§!，稳定度和战争支持度：§G+0.05%§!。\n三、§Y小妖精联军§!的每个陆军师（当前：§G[?KFL.num_divisions]§!个）：\n为§Y幻想乡§!和§Y雾之湖§!提供陆军师损耗：§G-0.1%§!，补给范围：§G+0.1%§!，且工厂能源消耗：§G-0.1%§!。"

 KNM_spring_market_cooldown:0 "大集市刚刚结束，大家还在收拾摊子呢。§Y40天§!后才能再次举办。"

 KNM_spring_market_synergy_spirit:0 "§9春日集市·阳光照耀雾之湖§!"
 KNM_spring_market_synergy_spirit_desc:0 "湖边的大集市热闹非凡。每一座民用工厂都在为春天的联盟贡献力量，政治活力与建设热情正随着集市的歌声一同高涨。"

 KNM_spring_market_synergy_spirit2:0 "§9春日集市·来自妖精的礼物§!"
 KNM_spring_market_synergy_spirit2_desc:0 "军工厂的炉火在集市的欢声笑语中燃烧得更旺了，河童们的图纸也随着一筐筐南瓜流通到了整片雾之湖。"

 KNM_spring_market_synergy_spirit3:0 "§9春日集市·小妖精的口粮§!"
 KNM_spring_market_synergy_spirit3_desc:0 "甜甜的饼干让小妖精们精力充沛，一碗碗温水下肚，队伍的步伐也变得更加整齐有力了。"


