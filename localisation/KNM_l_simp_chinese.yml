###设定
KNM_GATHERING_STORM_DESC:0 "1936年的雾之湖，是一个建立在废墟与泡影之上的荒诞乐园。\n在这片幻想乡与德意志反复争夺的低地边界，伴随着伟大战争的尘埃落定与结界的破损，浓郁的魔法力在此处汇聚。数以千计无忧无虑的野生妖精自发迁徙而来，占据了这片终年大雾弥漫的沼泽与湖泊。\n年初，自称头等强的冰之妖精琪露诺，在一片乱哄哄的欢呼声中单方面宣告了联盟的成立。这片土地上的妖精不识字，看不懂地图，也看不懂任何官僚机构。在外界看来，这更像是一个幼稚可笑的儿童乐园。\n可是，隔壁大人物们的那些规矩，并不会因为妖精的天真而停下。\n在南边，红魔馆的古老城墙在阳光下折射着绯红的光芒，那是妖精们打滚和玩闹、做梦都想占领的草地。而在东边，魔导国境内无数黑沉沉的钢筋烟囱正没日没夜地吐着浓烟，重型卡车的轰鸣震动着冻土，冷风里带着刺鼻的焦味。这个连神明都会战栗的庞大亡灵帝国，其阴影已经逐渐逼近了结界的东端。\n大结界正在嗡鸣，寒风正穿过林隙。这群连“冬天”都熬不过去的自然生灵，已经被卷进了风雪中。是跟着琪露诺继续那场毫无防备的冒险，还是迎着即将落下的铁雨，去唤醒那股暖洋洋的风，让冰封的大地重新开花？\n低地的未来，现在掌握在您的手中。"
####人物####
  KNM_Cirno: "琪露诺"
  KNM_Cirno_desc: "§L雾之湖的雾气总是凉凉的，水面上那些结了冰的叶子，就是琪露诺喜欢的床。有时候，她会大摇大摆地在湖中心睡到太阳下山，让路过的妖怪误以为水底住着厉害的水怪。不过，她的小屋其实只是湖畔一间有些歪斜的冰屋。在这片潮湿的大水洼里，她是所有妖精公认的领袖。她有着一双亮晶晶的翅膀，和一肚子永远用不完的好胜心。她喜欢把水里的青蛙冻成硬邦邦的冰块，再放到水里看着它们慢慢融化。虽然每试三次总会有一只青蛙不幸在水里碎掉，但她依然乐此不疲，管这叫最伟大的结冰修行。她总是觉得自己最厉害，神社举行热闹的祭典时，她也总是最快跑过去，在参道旁摆起一个简陋的刨冰摊。对她来说，能把水冻成冰，再把冰分给大家，就是整个世界最有趣的事情了。§!"
  KNM_Sunny: "桑尼"
  KNM_Lunar: "露娜"
  KNM_Star: "斯塔"
  KNM_Daiyousei: "大妖精"
  KNM_Daiyousei_desc: "§4@KNM雾之湖§!的§7大妖精§!"
  KNM_Daiyousei_desc_1: "§4@KNM雾之湖§!的§7大妖精§!"
  KNM_Daiyousei_Desc:0 "§L在雾之湖畔，总能听见大妖精轻轻呼唤琪露诺的声音。她是一只比普通妖精要稍微大上一些、也稍微懂事一些的小家伙。当其他的妖精都在湖面上乱哄哄地泼水时，她总是静静地跟在那个自称最强的冰之妖精后面，帮她拉着飞快奔跑时快要掉下来的丝带。在那些微风轻抚的漫长午后，她会和琪露诺一起在树林里玩捉迷藏。即使琪露诺每次都躲到很远、甚至连晚饭时间都找不到的地方，她也依然会提着裙角，耐心地在落叶堆里寻找。她就像是雾之湖上温柔掠过的风，只要琪露诺在大声宣告自己的强大，她就会在一旁弯起眼睛，露出温和而信任的微笑。§!"
  KNM_Kijin_Seija: "鬼人正邪"
  KNM_Lilywhite: "莉莉白"
  KNM_Lilywhite_desc: "§L谁也不知道莉莉白的家在哪里。逢着冬深雪重的时节，林子里静悄悄的，她便像一片纯白的树叶，静静地隐没在妖怪之山西侧那些不为人知的深谷里。她对微小的温度变化有着敏锐的直觉。当春天的第一缕风越过山脊，那些还在冰雪下闭着眼睛睡觉的松鼠和草籽，就会听到她清脆的啼鸣。她是冬眠者耳边轻柔的唤醒声，可一旦春季过去，阳光变得刺眼或者叶子变黄，人们就再也见不到她的身影。据说她在那些寂静的季节里积攒了相当多闪亮的弹币和财宝，但对她而言，那些沉甸甸的黄金远不如第一朵花开时的香气。§!"
  KFL_Lilyblack: "莉莉黑"
  KNM_Lilyblack_desc:0 "§L当然，也没人知道莉莉黑是什么时候飞到这片林子里的。她穿着一身漆黑的裙子，翅膀也像秋天落下的枯叶，泛着黯淡的颜色。和那个整天在树梢上欢呼、做着暖烘烘美梦的莉莉白不同，她更喜欢在风大、叶落的季节里活动。当漫天飘起冰凉的雨雪，她可不会缩在被窝里发抖。她更懂得怎么在严寒里生存。大家被烟囱的煤灰熏得不知所措时，是她默默地带着大家在林子里寻找武器，教那些身体娇小的妖精将树叶编成挡雨的披风。她总是板着小脸，对莉莉白那些关于春天的甜美故事不屑一顾。可当风雪真的要压垮干草棚，她又是第一个冲在前头，用自己那双残破的翅膀，替大家挡下落下的冰雹。她嘴上说着嫌弃春天的话，心里却比谁都渴望看到那些小小的花朵重新在湖边发芽。§!"
