#结算事件
KNM_end_title:0 "§9看呀，那是春天的歌声§!"
KNM_end_tip:0 "博丽神社的石阶两旁，樱花树开得层层叠叠。\n那个白影子在树梢间飞快穿梭，花瓣顺着裙摆在风里飘得漫天都是。莉莉白拍打着干净的白色翅膀，对着整个山谷大声喊出心里分外骄傲的那句话：\n§9“春天来啦！春天来啦！”§!\n\n§4“等一下！本小姐才是第一个发现春天的人！”§!琪露诺大呼小叫地在后面追，手里还攥着一捧亮晶晶的冰屑。\n§7“琪露诺酱，跑慢点，要追不上了。”§!大妖精怀里抱着刚摘下的红樱桃，在后面扑腾着翅膀跟着。\n走廊下面，灵梦端着茶杯，热茶冒着白气。看着那群在院子上方飞过、将漫天花瓣洒在自己头上的小家伙，有些无奈地拍了拍衣角，也跟着弯起了嘴角。\n漫山遍野回荡着风吹树叶的沙沙声，还有大家清脆的笑闹。\n大结界外的那些战争，此时都远得像是一场很久以前的坏梦。在那些漫长、孤单的冷风里，莉莉白曾独自在风雪中哭泣，以为再也见不到那些熟悉的笑脸。可现在，一切回到了最初的模样。依旧是那个无忧无虑、天真烂漫的春之妖精，迎着温暖的太阳，去将花开的消息带给世界的每一个人。"
KNM_end_tip_2:0 "感谢您对钢铁萌心与雾之湖内容的喜爱与支持！\n是您的陪伴与选择，最终为这些娇小的妖精带回了漫山遍野的花开。"
KNM_end_close_button:0 "§9春——天——来——啦！§!"
KNM_end_close_button_TT:0 "§L大酱、琪露诺大人，还有大家……\n我们一起，把春天带回来了哦。§!"
KNM_cfcdsjjt_fascist_target_tt:0 "\n§R警告！！！！！！！！！！！！！！！！！！§!\n§L§9春天的宣告§!激怒了世界上所有的§8法西斯政权§!与§W封建势力§!！\n它们无法容忍春风动摇军心，已立刻获得对我们的§R【征服】§!战争目标！§!"
