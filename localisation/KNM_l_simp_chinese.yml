KNM_zdxyj_tt:0 "§Y整队小妖精§!追加效果:\n"
KNM_spring:0 "§9春天一定会来的!§!"
KNM_spring_desc:0 "风里全是香喷喷的花香。在春天的守护下，泥土变得又软又温和，庄稼和树木都长得飞快，大家的心里也总是热乎乎的。"
KNM_spring_tt:0 "§Y春天一定会来的§!追加效果:\n"
KNM_fra_army:0 "大家一起手拉手"
KNM_fra_army_desc:0 "既然大家已经和幻想乡的朋友们拉起了手，那就说明以后都是一家人了。不管是遇到多大的困难，只要大家靠在一起，就什么都不用怕啦！"
KNM_fra_army_tt:0 "§Y大家一起手拉手§!追加效果:\n"
KNM_KFL_army:0 "抓紧我的翅膀"
KNM_KFL_army_desc:0 "每一个在风雪里飞舞的小家伙都非常娇小，身子软绵绵的，甚至一阵大风都会让大家落进草丛中。可是，当无数的小翅膀同时拍打，当所有人拉起手，那股微弱的温度就会连成一片。面对那些黑漆漆的装甲车和刺眼的法术，只要大家搂紧了，迎着冷风大声歌唱，那股暖流便会汇成漫山遍野的春潮。整片荒原上都将是扑腾的小翅膀，直到每一个角落都能听见大家的歌声。"
KNM_KFL_army_tt:0 "§Y抓紧我的翅膀§!追加效果:\n"
KNM_bfbj:0 "冰封边境"

KNM_djdbxdnj:0 "大家都不想动脑筋"
KNM_djdbxdnj_desc:0 "这片湿地里可没有规矩。大家整天在湖边飞来飞去，去树林里捉迷藏，或者在草地上打滚。要是有人拿着大本子让大家去干活，大家多半一眨眼就全飞走了。由于谁也不识字，大家甚至连地图和报告都看不懂，签字的时候只能用泥巴按脚印。要想在这里建起整齐的房子，可是一件特别让人头疼的事情。"

KNM_bxjtxydq:0 "本小姐天下第一强"
KNM_bxjtxydq_desc:0 "琪露诺大人是雾之湖最能打的，能在一瞬间将肥肥的小鱼冻成冰块。跟着这么厉害的首领，大家心里都骄傲极了。不管是南边那个红颜色的大宅子，还是东边那些高高的铁管子，只要琪露诺大人一挥拳头，保准能把他们全打趴下。只要大家一齐大喊着往前冲，就觉得自己是无敌的。"

KNM_bxjtxydq1:0 "本小姐和大家都很强"
KNM_bxjtxydq1_desc:0 "琪露诺大人已经向整片湖泊宣告过了，在这片水面上，不仅她是最强，大家也全都是天下第一强！大喊大叫地往前冲，就算是天上开着大鸟的坏人，也会被这股闹哄哄的劲头吓得抱头鼠窜。看好了，我们就是聪明透顶、战无不胜的妖精同盟！"

KNM_dbzsmhy:0 "东边总是在冒黑烟"
KNM_dbzsmhy_desc:0 "靠近东边国境的天空总是阴沉沉的，连吹过来的风里都带着一股味。有时候，湖面上会落下一层黏糊糊的灰。那些高耸的管子一直在发出沉重的轰鸣，虽然不知道那是什么，但每次风里带上发苦的灰尘，大家的翅膀便觉得有些沉重，喉咙也总跟着发干。"
KNM_dbzsmhy2:0 "东边总是在冒黑烟"
KNM_dbzsmhy2_desc:0 "靠近东边国境的天空总是阴沉沉的，连吹过来的风里都带着一股味。有时候，湖面上会落下一层黏糊糊的灰。那些高耸的管子一直在发出沉重的轰鸣，虽然不知道那是什么，但每次风里带上发苦的灰尘，大家的翅膀便觉得有些沉重，喉咙也总跟着发干。"
####国策####
KNM_gdjg:0 "这里归大家管"
KNM_gdjg_desc:0 "搬到这片雾蒙蒙的水边已经好几天啦。虽然大家还没搞清楚地图上的路往哪儿走，但只要把碍眼的家伙全冻住，这儿不就是我们说了算吗？琪露诺大人拍着胸脯保证，一定要让南边那个红颜色的大宅子知道，谁才是这里的老大。既然这儿有这么多水，不冻成大冰块就太可惜了。"

KNM_bhsqdz:0 "湖水全给本小姐冻住！"
KNM_bhsqdz_desc:0 "雾气贴着湖面散开，冰凉的触感从脚底钻上来。琪露诺张开手，那些跳动的水珠就变成了亮闪闪的晶体。虽然大家没这种本事，但帮着把冰坨子推到岸边，铺成一条硬邦邦的长路，还是没问题的。等湖面冻结实了，大家就能在上头尽情打滚，再也不用担心弄湿翅膀了。"
KNM_qhmgdn:0 "去红魔馆门口大闹"
KNM_qhmgdn_desc:0 "南边那个红颜色的大宅子总是静悄悄的，一点也不热闹。大家商量好了，趁着红头发门卫打瞌睡，悄悄溜到围墙边上唱歌，还要将湖里的水泼到那些高高的窗户上。既然里面的人不肯出来，那就主动去门口吵架，看看谁先受不了那阵乱糟糟的翅膀声。"

KNM_ggcjdjd:0 "盖个超级大基地"
KNM_ggcjdjd_desc:0 "既然大家已经占领了这里的湖边，就得有个放宝贝的地方。大家去树林里捡树枝，去湖边捡亮闪闪的石头，还要去那些没人要的旧房子里搬木板。琪露诺大人说，要盖一个比树还要高的房子，里面要塞满大家喜欢的玩具。等这个基地盖好了，大家就有属于自己的家啦。"

KNM_btqhl:0 "夺回大家的宝贝！"
KNM_btqhl_desc:0 "红魔馆里的家伙简直太过分了。她们刚才出来扫了一圈地，就把大家辛辛苦苦捡来的漂亮石头和树枝全当成垃圾倒进湖里。那可是琪露诺大人好不容易才冻住的亮晶晶冰壳。既然那些心血被当成了垃圾，那就去把红魔馆那些擦得反光的窗户也变成垃圾。带上最硬的冰块，去敲开那扇黑漆漆的大铁门。"

KNM_jyngdyz:0 "红魔馆是我们的！"
KNM_jyngdyz_desc:0 "红魔馆里的草坪修得又平又整齐，不拿来打滚真是太浪费了。琪露诺大人已经决定，将那座红色的大宅子变成全幻想乡最大的冰霜乐园。那些穿黑白衣服的妖精女仆整天只知道擦窗户，看着就让人觉得没劲，还不如跟着大家一起玩。至于门口那个一直拦路的红头发门卫，她虽然拳头挥得很快，但也肯定挡不住漫山遍野的进攻。带上平时攒的硬石头和冰块，跟着琪露诺大人冲进那个大院子里吧。"

KNM_jyngdyz_tt:0 "我们将向@KMK§R红魔馆§!宣战！\n§R注意§!:请务必要在@KMK§R红魔馆§!解决§Y妖精叛乱§!前夺得胜利！"

KNM_zzctznl:0 "找找春天在哪里"
KNM_zzctznl_desc:0 "红魔馆的院子很大，但是现在到处都还是光秃秃的。虽然琪露诺大人带回来的冰块还没化完，但我觉得泥土里已经有东西在翻身了。我得飞去每一个花坛，钻进那些还没发芽的灌木丛里，看看第一片小叶子躲在哪儿。大家都在忙着搬家具和分红茶，这种寻找春天的小事，只要交给我一个妖精就好啦。"

KNM_hxyydygs:0 "好消息总要第一个说"
KNM_hxyydygs_desc:0 "我找到春天的小尾巴啦！这个暖洋洋的好消息，一定要第一个告诉琪露诺大人和大家。她们正在那个大房子里玩得那么开心，要是知道了春天也来了，肯定会蹦得更高。得飞得快快的，把这个好消息第一个告诉她们！"

KNM_drygxyx:0 "大人们也该笑一笑啦"
KNM_drygxyx_desc:0 "接下来要去人类的村子，那里的大人们总是穿着厚厚的衣服，看起来好辛苦。春天来了，大家就不用再怕冷了。飞到他们的屋顶上，大声地告诉他们这个消息，这样他们就不会再皱着眉头，可以开心地笑起来了。"

KNM_mfsyxzdb:0 "魔法使也想知道吧"
KNM_mfsyxzdb_desc:0 "春天是一种很厉害的魔法，那魔法使肯定会对这个消息感兴趣的。虽然她的房子总是乱糟糟的，但我知道在哪里。穿过那些大蘑菇，找到她的窗户，告诉她这个关于春天的大秘密。"

KNM_wfdn:0 "请不要把春天关起来"
KNM_wfdn_desc:0 "我好像飞得有点太远了。前面出现了一个好大好大的地方，比红魔馆还要大，也比人类的村子还要热闹。不过，那里的空气闻起来怪怪的，有种说不出来的感觉。\n悄悄地飞近一点，躲在云彩后面看一看。如果那里的人都像琪露诺大人和大家一样，只是喜欢玩闹和晒太阳，那就飞下去告诉他们春天来了，和他们做好朋友。但如果那里的人，表情都和以前红魔馆里的那个大姐姐一样，总是那么冰冷和严肃……那就得赶紧飞回去告诉琪露诺大人，这里有一个比红魔馆还要麻烦的大家伙。春天可不喜欢那种冷冰冰的地方。"

KNM_nfcdbcl:0 "暖风从东边吹来"
KNM_nfcdbcl_desc:0 "虽然灵梦一直皱着眉头说还没到时候，但能感觉到，东边那一块总是暖烘烘的，像是有个巨大的火炉藏在云彩后面。那些高高的、冒着烟的大管子一定就是春天的大树，它们长得那么高，肯定是为了最先抱住太阳。飞过去看一看，那一块儿是不是已经开满了五颜六色的花。如果那里有春天的种子，就带一点回来，种在红魔馆的泥土里。"

KNM_wyhqzlm:0 "我要回去找灵梦"
KNM_wyhqzlm_desc:0 "翅膀拍得好痛，风刮在脸上像小刀割一样，流出来的眼泪立刻就变凉了。手心里还攥着那些黑乎乎、带着点热热的湿泥巴，那里面有大酱，也有琪露诺大人。用尽全身的力气飞回去，飞向那个刷了红漆、铺着青瓦的博丽神社。灵梦虽然脾气很坏，但她是很厉害的巫女，一定知道该怎么把大家重新从泥土里变出来。去求求她，只要她肯帮手，我以后再也不在神社门前大呼小叫了。飞快一点，再飞快一点……"

KNM_wyqzhzz:0 "我要去找花种子"
KNM_wyqzhzz_desc:0 "手心里还有那些黑泥的脏味道，怎么洗也洗不干净。灵梦摸了摸我的头，说大酱和琪露诺大人这次是真的死掉了，再也醒不过来啦。可是我不相信。泥土是种子睡觉的地方，只要有了暖和的太阳，漂亮的种子，地里就一定会重新开出花来。我想，等红的小花、黄的小花都开满地的时候，大酱和琪露诺大人一定也会拍着翅膀，从泥里钻出来。离开这个冷冰冰的神社，去森林里，去山谷里，把藏在每一片叶子底下的暖风都攒起来。去找厉害的花种子，把真正的春天带回来。"

KNM_xnyz:0 "小鸟要站在最高处"
KNM_xnyz_desc:0 "那些大烟囱排出来的黑烟越来越重了，偶尔还能听到地底下传来闷雷一样的声音。小鸟们很害怕，我也很害怕。我们要让小松鼠、麻雀和各种各样的鸟儿，都飞到大结界边缘高高的树梢上站着。它们只要看到雾气里有奇怪的铁盒子在动，或者闻到那种难闻的焦味变浓了，就要大声叫起来。这样大家就能最先知道，冬天的恶劣天气是不是要过来捣乱了。"

KNM_stybxmg:0 "送魔理沙一包发光小蘑菇"
KNM_stybxmg_desc:0 "魔理沙的小木屋里堆满了瓶瓶罐罐。她说，她要用闪闪发光的粉末做一些很大很大的礼花，这样等天黑下来的时候，就能把东边的阴影全照亮。我从森林深处采集了好多发光的小蘑菇，还有冰块融化时留下的亮晶晶露水，这些都是能让礼花变得更响的材料。把这些全送去她家，堆在她的窗台上，她一定会高兴得在院子里转圈圈。"

KNM_blmsly:0 "帮灵梦扫落叶"
KNM_blmsly_desc:0 "灵梦这两天看起来好累，一直在神社的大门前叹气。那个透明的、保护大家的大结界，上面好像多了一些细细的裂缝，像快要碎掉的冰面。我知道大结界很重要，要是大结界坏了，东边那些怪怪物就会跑进来。我要带着森林里的妖精，帮灵梦把神社的院子扫得干干净净，还在井水边放上甜甜的野果。这样灵梦就不用分心去干活，可以专心地用她的符纸把那个大结界的裂缝补好。"

KNM_phdyqz:0 "排好队一起往前走"
KNM_phdyqz_desc:0 "大家平时总是乱哄哄地到处飞，一遇到狂风吹过来就吓得躲进草丛。这样是不行的，琪露诺大人不在了，大家得学着自己保护花朵。让大家都排好队，跟着风的节奏一起往前走。虽然大家走得歪歪扭扭的，但只要排成整齐的排子，就算大雾突然围过来，谁也不会和大家走散，还能一起把那些踩坏花草的家伙赶跑。"

KNM_sgxzcsd:0 "松果和橡子藏树洞"
KNM_sgxzcsd_desc:0 "春天虽然会来，但现在天空中总是飘着奇怪的烟，有时候阳光也会被挡住。要把森林里所有的松果、橡子还有地底下的吃的都找出来，统统搬进又深、又干燥的树洞里。就算外面的温度突然变冷，或者有坏家伙把路堵住不让大家出去，大家也依然有甜甜的坚果可以吃，肚子绝对不会发出饿得咕咕叫的声音。"

KNM_nbrhh:0 "让泥巴变得软乎乎"
KNM_nbrhh_desc:0 "东边那些笨重的大铁轮子要靠路面才能走得快。我想要让湖水从河道里漫出来，把那些平整的路全部浇得透透的，让泥土变成又湿又软的稀泥。如果那些泥巴能像融化的棉花糖那样，让那些笨重的大铁轮子陷在里头动弹不得，它们就再也没法往前动了。我们在旁边看着它们陷下去，那一定很有趣。这样，泥巴地里就能安心地长出新的小草了。"

KNM_hxws:0 "喝下一大杯温水"
KNM_hxws_desc:0 "大酱她们消逝在风雪里之后，留下来的小妖精整天躲在被窝里偷偷地哭，身体抖个不停。大家都知道那些灰意味着什么。去煮一大锅热腾腾的温水吧，在里面撒满干花和蜂蜜，给大家一人盛上一碗。大家捧着木碗，一边流着眼泪，一边小口喝着。当肚子里有了暖烘烘的温度，冻僵的手脚活动开来，大家才有力气把眼泪擦干，一起在这片冰凉的废墟上，重新把家盖起来。"

KNM_cypmdfz:0 "草叶铺满大房子"
KNM_cypmdfz_desc:0 "红魔馆里现在有好多空房间。我要带大家去森林里找干干净净的树叶，还有晒得香喷喷的干草，把它们整整齐齐地铺在每个房间的地上。这样，等新朋友来的时候，大家就可以挤在一起睡觉，谁也不会觉得冷。大家一起来动手，把空荡荡的房间都填满吧。"

KNM_dfzsht:0 "大石头房子送给河童"
KNM_dfzsht_desc:0 "湖边有些好大好大的石头房子，里面有大烟囱和烧得通红的炉子，河童们管它们叫“工厂”。那些铁疙瘩总是发出很响的噪声，妖精们根本不会用，只会看着它们发呆。灵梦说，河童们需要这些房子来做有用的工具。那我就把这些大房子全送给河童好啦！反正大家更喜欢在草地上晒太阳，用这些冷冰冰的房子换新朋友来陪我们，真是太划算啦。"

KNM_qsllqxpy:0 "去森林里请新朋友"
KNM_qsllqxpy_desc:0 "空出来的床位太多了，湖畔的草地上也冷清清的。让松鼠和麻雀飞去神社和魔法森林，告诉那里的妖精，我们这里有又大又暖和的床，还有分不完的松果和甜温水。只要她们愿意搬过来和我们一起住，就可以每天一起在平整的草坪上玩耍。快来吧，新朋友们，这里需要你们！"

KNM_djyqlgz:0 "大家一起来工作"
KNM_djyqlgz_desc:0 "新来的朋友和大家还不太熟悉，总是冷冰冰地缩在角落。这可不行，带着大家一起去湖边捡石头，去林子里找蘑菇，把被大雪压断的树枝清理干净。只要大家的小手都动起来，一起做有意思的事，说说话，原本陌生的小妖精也会变成最好的朋友，工作的速度也会变得飞快呢。"

KNM_hlzxdyh:0 "捧起第一朵花"
KNM_hlzxdyh_desc:0 "新朋友和老朋友现在都围在我的身边啦。在大平原最显眼的地方，挖开松软的泥土，大家一起用双手把第一粒花种子埋进去。只要大家一起对着泥土唱起叫醒春天的歌，那股暖融融的力量就会把寒风吹散。等第一朵花开出来的时候，大家就能明白，我们已经重新站起来了。"
#备战魔导国#
KNM_cbbpl:0 "小翅膀也可以不怕冷"
KNM_cbbpl_desc:0 "风雪把大结界撞得啪啪响，外面的灰色雾气已经贴到窗户上了。我知道，一味地躲在屋子里，那些变成泥土的朋友也永远不会醒过来。虽然我的身子很小，翅膀也很薄，但这一次，我再也不会害怕冬天的寒冷了。大家把厚衣服穿好，我们要准备出发了。"

KNM_bzyq:0 "大家抱在一起就不怕了"
KNM_bzyq_desc:0 "地精们已经把橡木棒擦得透亮透亮，大青蛙们也都在水里游来游去，等待着出发。妖精们手拉着手，互相把对方的身体搂住。虽然外面的天阴沉沉的，但只要我们的心跳在一起，那种暖烘烘的热气就能把所有的寒风都吹散。做好准备，我们去把春天抢回来。"

KNM_yqdbdt:0 "我们一起去打败冬天好不好"
KNM_yqdbdt_desc:0 "我飞回了大家商量事情的大厅。里面冷清清的，盟友们都在看着我。我想要问问那里的领袖和大家，愿不愿意跟我们一起去东边。那里有好多喷火的烟囱，也有会把人变成泥土的法术，但是只要我们合力把那个大铁房子拆掉，春天就会重新回来。如果大家一起去，冬天的坏天气一定一下子就被赶跑了。"

KNM_cglsct:0 "风吹过来的时候就是春天"
KNM_cglsct_desc:0 "森林里的风、山谷里的风，还有高空中的气流，现在都在我们的屁股后面使劲吹着。这股风很大很大，暖洋洋的，夹杂着桃花和泥土的香气。我们张开翅膀，顺着这股大风飞得飞快。当这股暖风刮到东边的时候，那些脏大烟囱和铁甲车也会被春天融化的。"

KNM_gsblx:0 "我们的歌声会比雷声还要响"
KNM_gsblx_desc:0 "东边的地平线上已经能看到密密麻麻的钢盔和铁轮子了。那里的喇叭在发出难听的噪音，像是在嘲笑我们的弱小。我深吸了一口暖乎乎的空气，用尽全身的力气大声唱起叫醒春天的歌。这歌声在云彩里横冲直撞，比他们的炮声还要响亮。要让那些冷酷的家伙听见，春天可不是那么好欺负的！"

KNM_ctll:0 "“春天来啦！”"
KNM_ctll_desc:0 "东边飘来的黑色雪花落个不停，平原已经静静地睡死在冰霜里。枯萎的草叶上落满了煤灰，风雪中听不见半点生命的声音。 \n可贴身藏着的那个小木盒里，那团湿漉漉的泥土，分明被体温焐得有了些许暖意。\n扇动着那双残破的翅膀。迎着漫天呼啸的冰雪与刺目的强光，一头冲向那些正在发出沉重轰鸣的钢铁，用沙哑得快要发不出声音的喉咙，对着这片死寂的荒野，大声喊出那句呼唤过无数遍的话。\n\n听好了：\n\n§9“春天来啦！”§！"
KNM_ctll_tt:0 "我们将向@DVL§0魔导国§!宣战！\n§R注意§!:这意味着我们将打响§R第二次“伟大战争”§!"

KNM_tytfs:0 "给泥土听一听风声"
KNM_tytfs_desc:0 "大酱以前最喜欢听湖边的风声了。我把装着黑泥的小口袋挂在高高的树梢上，让风轻轻地吹过去。风里有湖水的味道，也有大家以前玩耍时的喧闹。泥土里亮晶晶的粉末在微微发亮，我相信，只要一直听着这些熟悉的声音，那些睡着的灵魂就会慢慢记起回家的路。"
KNM_sjxs:0 "收集山谷中所有笑声"
KNM_sjxs_desc:0 "新来的妖精总是在林子里大笑，笑声在山谷里飘来飘去，分外好听。大酱和琪露诺大人以前也是这样，整天在水边闹个不停。我提着小竹篓，把这些快乐的声音都装进去，然后轻轻落在有了些许暖意的泥土上。。泥地里似乎有些痒乎乎的，冒出了几个小气泡，那一定是她们在泥里笑呢。"
KNM_sgdx:0 "树根底下的亮晶晶"
KNM_sgdx_desc:0 "琪露诺大人很喜欢冰，她以前总爱把亮晶晶的碎冰洒在大家头上。我在大树底下的落叶堆里，找到了好些没有化掉的小冰碴。大家把这些冰碴收集起来，小心翼翼地埋进黑泥里。凉呼呼的温度能让睡在里面的琪露诺大人觉得很舒服吧，她最怕热了。"
KNM_wzhdcg:0 "大家围着火堆唱歌吧"
KNM_wzhdcg_desc:0 "天色暗下来了，森林里燃起了暖和的篝火。新来的朋友和我们围成一个大圈，手拉着手唱歌。歌声飞到了树梢上，也落进了软和的泥土里。那些原本发凉的灰烬，在歌声和火光里变得温暖起来，好像有无数个小手在泥土里轻轻跟着歌声拍打。春天最喜欢听大家唱歌了。"
KNM_zqychmg:0 "再去一次红魔馆大门前"
KNM_zqychmg_desc:0 "我们再次回到了那扇红色大门前。现在这里很安静，门上的冰块早就融化了，空气里散发着泥土的香气。大酱琪露诺她们以前总爱在这里和门卫小姐玩闹，我想，她们的记忆一定有一大半留在了这里。我把那些黑泥洒在门槛旁的泥地上，让她们重温曾经喜欢跑来跑去的地方。"
KNM_ylcg:0 "眼泪擦干后就是晴天"
KNM_ylcg_desc:0 "灵梦说，哭泣是不能唤醒死者的。我想，如果我总是掉眼泪，大酱她们醒过来的时候也会跟着难过的。我用袖子把脸上的灰尘和泪水擦得干干净净。不会再哭了。要挺起胸脯，笑着迎接春天。大家看着我，也都跟着笑了起来，都觉得我变得比以前神气多了。"

KNM_cyxjnt:0 "春雨洗净了泥土"
KNM_cyxjnt_desc:0 "天空终于下起了细细的春雨。这些雨水很温和，顺着树叶和花瓣落进干裂的黑色泥土里，洗刷着那些残留的焦黑污渍。泥土变得松软而干净，散发出久违的清新气味。被雨水洗净的土地，终于可以重新作为新生命诞生的温床了，大家都很开心地在雨里拍着翅膀。"
KNM_gxyzwts:0 "给小叶子喂甜甜的水"
KNM_gxyzwts_desc:0 "大烟囱底下的那片小绿叶子现在长得很大了，但它需要更多营养。我从博丽神社后面的甜泉里挑来干净的水，一勺一勺地浇在它的根部。它贪婪地喝着水，叶片变得更加翠绿，表面还泛着亮闪闪的水珠。它在茁壮成长，也带着大家的心愿一起成长，摸起来暖乎乎的。"
KNM_zmxh:0 "种满漫山遍野的小花"
KNM_zmxh_desc:0 "光有一片叶子是不够的。必须让整片山谷都开满鲜花。新来的朋友们带着无数的花种子，在泥土里播撒。红色的花，黄色的花，还有蓝色的风铃草，它们很快就会把焦黑的废墟盖住。当花儿盛开的时候，土地里的死气就会被彻底净化干净，大地上全都是香喷喷的味道。"
KNM_nfcshy:0 "暖风吹散了黑烟"
KNM_nfcshy_desc:0 "东边残余的那些灰色雾气还在天边飘荡。我们不能让那些脏东西继续遮挡阳光。我带着所有的妖精一齐飞到高空中，挥舞着翅膀，招来最温和的南风。南风像一把大扫帚，把那些焦黑的烟雾全部吹散，让明晃晃的太阳重新照亮我们的平原，温暖每一个角落。"
KNM_hmghyzk:0 "去红魔馆花园里面做客"
KNM_hmghyzk_desc:0 "红魔馆的花园重新恢复了生机，里面的刺玫瑰开得比以前还要鲜红。我和大家带着新采的浆果去那里做客。那些妖精女仆们拉着我们的手，在开满鲜花的走廊上跑来跑去。红色的宅子不再像以前那样冷清，而是充满了欢声笑语。土地上的伤痕正在慢慢愈合。"

KNM_bqzxzgj:0 "白裙子现在干干净净了"
KNM_bqzxzgj_desc:0 "我的白裙子终于洗干净了。在清凉的泉水里揉搓了好多遍，上面的焦炭和灰尘全都不见了，又变得像雪花一样白。我把它晾在大树底下的藤蔓上，风一吹，它就跟着阳光一起飘动。是的，我已经准备好了。"


KNM_brad:0 "不让一朵小花在风里挨冻"
KNM_brad_desc:0 "大自然生来就是公平的。每一个小小的草芽，还有飞不快的小妖精，大家都应该分到一碗热热的甜茶和香喷喷的烤栗子。大个子的地精可以用肩膀背着那些飞不动的小家伙，带她们去最高最高的树梢上晒太阳。只要大家凑在一起，谁也不会在冬天的冷风里挨冻。大家都要吃得饱饱的、过得暖融融的才行。"
KNM_tygq:0 "太阳高高挂起的时候就睡觉"
KNM_tygq_desc:0 "干活应该是一件高高兴兴的事，要是觉得累了，就说明该睡觉啦。从现在开始，每当太阳升得高高的时候，大家就要把手里的铲子丢掉，在软和的草地上舒舒服服地睡个大午觉。地精们在铁房子里也能喝到甜甜的果汁，听小鸟唱歌。睡饱了，大家才能一直有力气呀。"
KNM_gbsty:0 "隔壁的朋友也来晒太阳吧"
KNM_gbsty_desc:0 "东边那些高高的房子里，一定有好多怕冷又没有花看的人。他们好辛苦啊。我们要把大铁门开得大大的，任何觉得身上冷冰冰、没有地方去的朋友，都可以来湖边躺在松软的草地上，喝一碗暖和的甘草茶。我们不种那些扎手的铁丝网，我们要用暖洋洋的春风把大家都迎进来。"
KNM_qtyz:0 "倾听每一片叶子在说什么"
KNM_qtyz_desc:0 "种什么花，大家要一起商量才好。在把新花种埋进地里之前，我们要先去听听小草叶在说什么，问问小小的风妖精有什么愿望。大家的想法都很重要，哪怕是小小的叹息也要听仔细。大家都点头了，大家才能一齐大声唱歌。这样，我们就能一直在一起啦。"
KNM_fxylc:0 "废墟变成温暖的游乐场"
KNM_fxylc_desc:0 "那些黑乎乎的大烟囱现在都倒啦，废墟也都被清理得干干净净。我们要往焦黑的泥土上铺满软乎乎的绿苔，在铁柱子上挂起高高的秋千。冷冰冰的战场不见了，这里现在是一个大大的、好玩的游乐场。妖精、地精，还有路过的人类，都可以在草地上打滚。大家在这片新草地上可以快快乐乐地玩耍。"

KNM_zgsj:0 "让整个世界都开满鲜花吧"
KNM_zgsj_desc:0 "我们湖边的春天太暖和了，多得都要从大门溢出来了。春风会把好多好种子带去大结界外面，飘到那些被黑烟封锁的灰色城市里。暖洋洋的力量会拥抱整片大地。明天早上，春天都会准时去叫醒每一个怕冷的人。"

KNM_cfcdsjjt:0 "春风吹到了世界尽头"
KNM_cfcdsjjt_desc:0 "我飞得很高很高，连云彩都在脚底下。大结界的大门已经被春风吹得宽宽的，外面的灰色平原上开始冒出一朵朵红色和蓝色的小花。听说外面的世界很大，有很多我们不知道的地方。那就要一直飞，飞到那些高高的大楼顶上，飞到冷清清的工厂里。把好闻的水果香气和漫天飞舞的花种子，带到每一个怕冷的人身边。听好啦，春风要吹到世界尽头去，大家再也不用害怕冬天了！"
KNM_cfcdsjjt2:0 "春风吹到了世界尽头"
KNM_cfcdsjjt2_desc:0 "我飞得很高很高，连云彩都在脚底下。大结界的大门已经被春风吹得宽宽的，外面的灰色平原上开始冒出一朵朵红色和蓝色的小花。听说外面的世界很大，有很多我们不知道的地方。那就要一直飞，飞到那些高高的大楼顶上，飞到冷清清的工厂里。把好闻的水果香气和漫天飞舞的花种子，带到每一个怕冷的人身边。听好啦，春风要吹到世界尽头去，大家再也不用害怕冬天了！"

KNM_djyqh:0 "大家一起大喊春天来啦"
KNM_djyqh_desc:0 "雾气彻底散了。大酱和琪露诺大人都在身边，大家的翅膀变回了亮闪闪的样子，再也不用和寒风打架了。我拉着大家的手，在天空中飞得很高很高。飞过神社，飞过森林，飞到红魔馆的大门前，像以前那样挥着手大声叫喊。这一次，所有人都会笑着听我们呼喊春天的到来。"

##莉莉白经济##
#农业
KNM_dlmchcd:0 "地里长出好多好吃的"
KNM_dlmchcd_desc:0 "只要趴在泥土上轻轻呼气，那些胖乎乎的根茎就会拼命往上钻。整片平原很快会盖满绿油油的叶子，松软的泥里藏着圆滚滚的土豆和饱满的麦粒。大家不需要像人类那样辛苦地翻地。跟着风唱歌的时候，种子自己就会找到舒服的位置睡下，一眨眼长成小山一样高的庄稼。"

KNM_dsytz:0 "大树一天就变得很高啦"
KNM_dsytz_desc:0 "盖木屋需要很多好木头，可谁也不想伤害那些有松鼠住着的树。甜甜的泉水浇在幼苗根部，它们在太阳底下一天就能窜到云彩里。这些新长出来的树木性格温和，树干又直又软。就算拿走一些做梁柱，它们也会开心地在旁边重新抽出亮晶晶的嫩芽。"

KNM_ydnghqtz:0 "大南瓜能换新铁铲"
KNM_ydnghqtz_desc:0 "种出来的南瓜比红魔馆的马车还要大，里面的瓜肉甜得像蜜糖。灵梦和人类村庄的大叔们总是缺粮食，正好用这些大南瓜和一袋袋金灿灿的麦子，去换他们手里那些闪闪发光的铁铲子。用吃不完的美味换来好用的工具，大家就不用自己去费劲地敲打那些烫手的红铁了。"

KNM_zjzdhh:0 "麦田一整年都是暖烘烘的"
KNM_zjzdhh_desc:0 "虽然外面的风有时候会变冷，但只要大家一起往泥土里吹暖气，这里的土地就永远不会结冰。麦田一整年都像春天那样暖和，麦穗沉得把杆子都压弯。不管是刮风还是下雪，只要歌声不停，地里的菜叶子就永远绿油油的，仓库也总是塞得满满当当。"

#资源
KNM_sgbsttsl:0 "老树根里的小礼物"
KNM_sgbsttsl_desc:0 "地底下的黑铁矿和铜矿藏得太深，大家的小手根本拿不动那些沉重的铁镐。好在森林里的古老大树很乐意帮忙。跑去抱抱它们的树干，树根在泥土里伸个懒腰，那些亮晶晶的矿石就会被轻轻顶到草地上。大家只要提着小篮子，像捡落叶一样捡起来就行。"

KNM_zjgmt:0 "地上有好多好多干木头"
KNM_zjgmt_desc:0 "活着的树木是大家的伞，谁也不许用锯子去拉疼它们。收集那些因为风大自己掉下来的干枯树枝，还有那些已经老得睡着了的枯木，整整齐齐地码在湖边。这些木头干透了，生火的时候只有一股好闻的松脂香气，适合拿来做各种好玩的东西。"

KNM_fgsb:0 "水底藏着亮晶晶小冰块"
KNM_fgsb_desc:0 "雾之湖的水底下藏着亮晶晶的水晶，在夜里像星星一样闪烁。那些蓝色的石头里藏着好听的风声和清凉的魔力。潜进凉呼呼的水里，发光的碎石子一粒粒捞上来，铺在秘密基地周围。周围的空气会变得清清爽爽，连东边飘过来的焦味都能被冲散。"

KNM_hhtk:0 "清香的草药换来了黑铁矿"
KNM_hhtk_desc:0 "河童们在山里挖出了好多黑乎乎、硬邦邦的铁矿石，可她们身上总有一股锈味。送去在山谷里采集的、闻起来甜丝丝的干草药，正好能治治她们因为干活熏坏的嗓子。作为交换，荷取会用大卡车把整箱整箱熔好的铁锭运到湖边。有了这些铁锭，地精们就能做更多有用的东西了。"

#工业
KNM_jgdj:0 "地精喜欢吵闹的铁屋子"
KNM_jgdj_desc:0 "红魔馆留下的那些大铁房子整天“咣当咣当”地乱响，里面还有黑乎乎的机油，妖精们光是走进去就会被熏得打喷嚏，根本没人想在里面干活。不过，住在附近的绿皮肤地精好像很喜欢这种热闹的地方。这些吵闹的工厂全送给地精住好啦！他们每天待在里面敲铁，把做好的盾牌送出来。作为回报，大家在厂门外放一筐筐刚刨出来的甜南瓜和金黄的麦子，让他们吃得肚子圆滚滚的。"

KNM_dxzf:0 "大树底下有座叶子工坊"
KNM_dxzf_desc:0 "地精们在铁房子里造好了硬铁片。在外面阳光正好的大树下，搭起用藤蔓编织的小木屋。大家坐在一起，亮晶晶的矿石和干花会和皮甲编织在一起。这里只有鸟儿的叫声和风吹过树叶的沙沙声。一边唱歌一边用双手把魔力揉进防具里，做出来的皮甲轻飘飘的，还香喷喷的。"

KNM_mcxmhtg:0 "大南瓜可以换铁轨"
KNM_mcxmhtg_desc:0 "湖边多出来的麦子和南瓜可以装满好几十个大竹筐，一路送给幻想乡的大家。她们看到这么多好吃的，眼睛都笑成了弯弯的月亮。她们会去跟河童商量，用大平板车运送那些亮闪闪的铁轨，一路上颠簸着送进我们的林子里。有了这些铁轨，地精们能用小矿车把矿石运得飞快，大家再也不用抱着沉沉的石头走路了。"

KNM_xjyc:0 "烟囱上面长满了小花"
KNM_xjyc_desc:0 "地精们工作的工厂顶上总是冒着灰蒙蒙的烟，把旁边的绿叶子都熏黑了。这可不行，春天可不喜欢脏兮兮的颜色。用清凉的湖水顺着高高的烟囱浇下去，黑乎乎的灰尘直接冲进地底下的深泥里。在烟囱口种上生命力强的小藤蔓，让废气变成香喷喷的青草味。这样，工厂也能变得亮亮堂堂的。"

##莉莉白军事线##
#陆军
KNM_djdz:0 "胖乎乎地精排在大前头"
KNM_djdz_desc:0 "东边那些坏家伙要是冲过来，肯定会带着硬邦邦的铁家伙。妖精们身体太小，不擅长跟他们硬碰硬。不过没关系，那些吃饱了红薯、穿着厚皮甲的地精们力气大得很，还特别喜欢挥舞大铁棒。地精排成整齐的队伍站在最前面，用大盾牌牢牢挡住坏人的路。我们在后面帮他们吹风加油就行。"

KNM_dmbby:0 "水里泡出硬邦邦的木棒"
KNM_dmbby_desc:0 "地精们喜欢用粗粗的木棒当武器，可那些木头一撞就容易裂开。那把林子里结实的橡木棒都搬到雾之湖深处的泉水里泡着吧。泉水里有琪露诺大人留下来的凉爽魔力，木头在里面泡上七天，就会缩得实实的，变得比铁还要硬，表面亮闪闪。地精们拿着亮晶晶的大木棒，一棒子下去能砸扁坏人的大铁盾。"

KNM_tmcsj:0 "小草会帮忙缠住坏人"
KNM_tmcsj_desc:0 "坏人们走路的时候总穿着重重的鞋子，踩在草地上发出难听的响声。跟地里的草儿和藤蔓说悄悄话，让它们在坏人经过的时候突然长高。细细长长的绿藤蔓会像小蛇一样，缠住他们的脚脖子和铁轮子。等他们急得在原地直跺脚、怎么也走不动的时候，大家就可以在树梢上开心地朝他们扔烂番茄了。"

KNM_djzmc:0 "大家在浓雾里开心捉迷藏"
KNM_djzmc_desc:0 "湖泊和森林里到处都是白蒙蒙的雾，坏人一走进来就会迷路，连自己的手指头都看不清。可大家最擅长在雾里飞了。大家分成好多个小队伍，手里拿着亮晶晶的羽毛，在雾里忽左忽右地发出笑声。等他们子弹全部打光、累得一屁股坐在地上时，地精们就可以冲上去抓住他们。"

#海军
KNM_mtbyq:0 "青藤扎好平整的大木筏"
KNM_mtbyq_desc:0 "这里不需要像河童那样造铁皮大船，那种大船在沼泽里一下子就会陷进泥里。去林子里挑粗粗的干木头，藤条将木头绑在一起，做成一个个平平扁扁的大木筏。这些木筏轻飘飘的，踩上去软和，就算在浅浅的水洼里也能像叶子一样滑行，永远都不会沉下去。"

KNM_lcz:0 "大青蛙是拉船小能手"
KNM_lcz_desc:0 "木筏上没有桨，大家飞在空中拉船太累。不过，雾之湖里住着好多和磨盘一样大的巨型青蛙。送给它们一些甜甜的荷花蜜，巨型青蛙长长的舌头会卷住木筏前面的藤条。只要在水里扑腾扑腾地往前游，大木筏就会像离弦的箭一样飞快地滑出去，在满是稀泥的河道里走得比什么都快。"

KNM_wqcgn:0 "大湖上面落满厚厚的白雾"
KNM_wqcgn_desc:0 "坏人要是开着船想从水路上过来，大家一齐张开翅膀，把湖面上的水汽拼命往他们脸上吹。白蒙蒙的浓雾遮住整个水面，让他们连方向盘都找不到。大木筏可以顺着水流的细微声音，在大雾里悄悄绕到他们船尾，用竹竿捅断所有的船桨，让他们只能在湖中心打转。"

KNM_hjb:0 "银闪闪小鱼换来铁板"
KNM_hjb_desc:0 "大木筏虽然走得快，但要是遇到坏人的火球，木头还是容易被烧焦。用大渔网在湖里捞好多肥美的小银鱼，用大木桶装好送到玄武泽。河童们最喜欢吃这种小鱼了，她们会用大卡车运送轻质铁甲板送到湖边。地精们用藤条将铁甲板固定在木筏的前头，这下子，木筏就再也不怕坏人的火球了。"

#空军
KNM_zcgrxq:0 "天上下起松果雨"
KNM_zcgrxq_desc:0 "飞在天上的小妖精，手里可拿不动沉甸甸的铁枪。不过，可以收集林子里的大松果，让地精们在上面绑上一点点魔理沙送的爆炸粉末。抱着这些松果飞到高高的云彩上面，对准下面那些黑糊糊的装甲车，像雨点一样扔下去。松果落地的时候会炸开，坚硬的松子和烟雾射得到处都是，让坏人们连眼睛都睁不开。"

KNM_fdgc:0 "高空中全是冷风"
KNM_fdgc_desc:0 "东边那些坏人会开着铁翅膀的大飞机在天上飞，发出难听的声音。大家一齐飞到高空中，拉着手围成大圈，对着飞过来的铁飞机拼命刮出冰凉的冷风。虽然不会琪露诺大人的魔法，但大家一起刮出来的冷风也足够冻结天空中的水汽。那些铁飞机的翅膀一结冰就会变得重重的，像死鸟一样栽进地上的泥巴里。"

KNM_dbb:0 "大乌鸦是神气活现的保镖"
KNM_dbb_desc:0 "天空中风太大的时候，大家娇小的翅膀有时候会飞得歪歪扭扭，还容易被坏人的大网兜住。大乌鸦和大家一起飞。它们的翅膀又宽又硬，飞起来的时候风呼呼地响。有它们在旁边飞着，坏人的小飞弹根本不敢靠近，大家就能安心在天上扔松果了。"

KNM_sym:0 "漂亮羽毛换来了起风符"
KNM_sym_desc:0 "收集了好多森林大乌鸦掉落的黑色硬羽毛，还有天空中彩虹鸟的彩羽毛，这些都是做扇子和魔法道具的好材料。把漂亮的羽毛装进小竹篓，送给幻想乡的大家，换取一叠折得整整齐齐的起风符。把这些符纸贴在翅膀上，大风就会在屁股后面使劲吹，飞得像闪电一样快，坏人的子弹怎么也追不上。"


####事件####
KNM.1.t:0 "那座红房子好烦人"
KNM.1.d:0 "湖面上的雾气厚得化不开。琪露诺坐在高高的冰堆上，晃着光溜溜的脚。大酱蹲在旁边，盯着远处那个巨大的红色影子。红魔馆的家伙们总是一副高高在上的样子，连走路的声音都带着那股让人不舒服的傲气。“她们总是说这片湖也是她们的地盘，可这明明是本小姐先看中的。”\n那个红头发的门卫最讨厌了，每次大家想去那边的草坪上打滚，她都会板着脸把人赶走。琪露诺拍了拍冰块，震下了一圈细细的白霜。“本小姐才是最强的！”她对着那个红色的轮廓大喊。妖精们在雾里乱成一团，有的忙着搓冰球，有的忙着去南边吹冷风。既然那些家伙不讲理，那就把那座大房子也一起冻成冰雕好了。"
KNM.1.a:0 "“看本小姐的厉害！”"

KNM.2222.t:0 "去把吸血鬼刺杀掉吧"
KNM.2222.d:0 "白蒙蒙的雾里钻出一个怪影子，走路的姿势扭来扭去，手插在兜里。琪露诺大人正忙着往湖里投冰块，那个家伙就这么大摇大摆地晃到了岸边。那件衣服的花纹全是反着的，盯着红魔馆尖屋顶的眼神里透着股要找茬的火气，嘴角挂着一丝让人不舒服的坏笑。\n“喂，你们这群只知道玩过家家的妖精，”那个家伙开口了，声音像是在拿枯树枝蹭地，听着让人耳朵发痒，“在这儿吹风多没意思。我打算去把那个红魔馆里的吸血鬼给宰了，让她也尝尝从房顶上掉下来的滋味。”\n她自称叫鬼人正邪，嘴里不停冒出要把地翻到天上这种疯话。大酱被吓得缩到了冰堆后头，琪露诺大人倒是一副很感兴趣的样子，歪着头盯着看。这个叫正邪的家伙挥舞着手臂，嚷嚷着刺杀之类的词儿，虽然走路的方式总像是要摔跟头，但那股要把一切都弄乱的劲头确实挺吓人。要是真的冲进那座红房子里，恐怕连那个爱睡觉的门卫都要被气醒。这种乱糟糟的事情，只要躲在雾里看热闹就好。"
KNM.2222.a:0 "“那家伙看起来好狂啊！”"

KNM.2.t:0 "冰块做的大椅子"
KNM.2.d:0 "湖岸边多了一排奇形怪状的冰墩墩。琪露诺得意地骑在高高的冰墩墩顶上，拍着手叫大家快来坐。大酱跑过来试了试，结果被冻得一下子跳了起来，捂着屁股在草地上乱蹦。有的妖精想去摸摸那些亮晶晶的尖角，结果手指头被粘在上面了，急得一边转圈一边哭。\n琪露诺叉着腰大笑，说这可是只有她才能做出来的宝贝。虽然大家被弄得手忙脚乱，有的甚至还在冰面上摔了好几个跟头，但湖边这下子变得亮亮堂堂的，看着就很有精神。既然琪露诺这么有兴致，大家也就开心地跟着在冰块中间玩起了捉迷藏。"
KNM.2.a:0 "“快看，这里有个更大的！”"

KNM.3.t:0 "红头发的在偷懒"
KNM.3.d:0 "趁着大雾，一群小妖精偷偷摸摸地靠近了红魔馆的铁门。那个红头发的门卫果然又靠在门柱上睡着了，嘴角挂着亮晶晶的东西，睡得可香了。大家互相挤眉弄眼地偷笑，有的妖精从兜里掏出几片皱巴巴的枯叶，悄悄放在她的帽子上。\n就在大家想更靠近一点的时候，里面那个穿女仆装的家伙好像走过来了，皮鞋踩在地板上的声音特别清脆。大家吓得呼啦一下散开了，像一群被惊动的小麻雀，在大雾里拍着翅膀乱撞。虽然没真的抓到什么好玩的，但看到那个门卫被惊醒时慌张的样子，大家就觉得这趟没白跑。"
KNM.3.a:0 "“下次一定要揪她的头发！”"

KNM.4.t:0 "这里就是秘密基地"
KNM.4.d:0 "湖边的草地上现在乱糟糟的，到处都是妖精们搬回来的“宝贝”。大酱拖着一块比她还大的旧木板，累得满头大汗。大酱她们找来了好多五颜六色的羽毛和干花，正忙着往那个歪歪扭扭的墙上贴。琪露诺飞在半空，指着湖边的冰块，让大家把它们搬过去垫在地基下面。虽然在别人眼里这只是一堆旧木头和破烂，但在大家心里，这可是最了不起的城堡。\n大家围着这堆东西飞来飞去，已经在商量晚上要在里面藏什么好吃的了。只要大家一直往上面叠东西，这个基地总有一天能盖到云彩上面去。"
KNM.4.a:0 "“快看，我捡到了亮闪闪的石头！”"

KNM.5.t:0 "我们的宝贝呢！？"
KNM.5.d:0 "大酱正蹲在湖边的泥坑里抹眼泪。刚才那个穿黑白围裙、总是拿着小刀的家伙又出来了。她走得特别快，手里的扫帚挥了几下，大家堆在湖边那一小堆亮晶晶的碎石子和干透了的漂亮树枝就不见了。那是大家攒了好久的宝贝，原本打算拿去装饰那个歪歪扭扭的基地。琪露诺大人气得翅膀都变了色，围着那个空荡荡的土坑转了好几圈。\n“她们凭什么把大家的东西当成垃圾扫走！”琪露诺大声嚷嚷着，手里已经变出了一个长满尖刺的大冰球。那些住在红魔馆里的家伙总是这样，觉得大家的心血都是碍眼的脏东西。既然她们这么爱干净，那就去把她们的大地毯全部弄湿。要把她们的茶杯都冻出裂缝，还要在那个门卫耳朵边上使劲吹冷风。\n这回可不是在玩捉迷藏，这是最最最认真的讨伐。大家已经把所有的冰块都搬到岸边了，只要琪露诺大人一挥手，就全往那座红魔馆房子里扔。"
KNM.5.a:0 "“这就去让她们好看！”"

KNM.6.t:0 "门卫小姐摆了个奇怪的姿势"
KNM.6.d:0 "雾气绕着红魔馆的大铁门转来转去，冷冰冰的空气里全是大家拍动翅膀的声音。琪露诺大人飞在最前头，蓝色的翅膀在雾里闪着亮亮的光。那个红头发的门卫这回没睡觉，她站在门前，两只手在空气里慢吞吞地画着圆圈，动作看起来像是在跳一种奇怪的舞。\n琪露诺大人说那种招式在本小姐面前一点用都没有，手指轻轻一弹，大铁门上的水汽就变成了亮闪闪的白霜。咔嚓咔嚓的声音响成一片，那是空气被冻结的动静。大酱她们已经叫嚷着往前冲了，无数的碎石子和冰块像雨点一样飞过去。\n我们要趁着那个人手忙脚乱的时候，从铁门的缝隙里钻进去，把那些平整的草坪全都踩乱。既然琪露诺大人已经把空气都变冷了，大家只要闭着眼冲锋就好啦。"
KNM.6.a:0 "“大家快跟上，本小姐要发威了！”"

KNM.7.t:0 "地毯软绵绵的真暖和"
KNM.7.d:0 "原本那些总是板着脸的家伙都不见了，整座红魔馆现在吵得像炸开了锅。我飞在那个垂着亮闪闪水晶的大吊灯下面，看着影子在红地毯上晃来晃去。琪露诺大人已经在二楼的楼梯扶手上冻了一层溜滑的冰，正领着大酱她们排队往下溜，开心的尖叫声在空荡荡的大厅里撞个不停。\n这里的空气闻起来有一股干花和红茶的味道，现在又添了一点湖水冰凉的气息。\n那些原本只知道擦窗户的妖精女仆，这会儿也把抹布扔在一边，好奇地凑过来抓起地上的冰渣子互相投掷。虽然那个一直拦路的门卫垂头丧气地坐在门槛上，但谁也没有去理会她。我一屁股坐在那个又大又软的椅子里，羽毛垫子陷下去的感觉真舒服，比湖边的石头要好得多。\n既然这房子已经归大家管了，那就先在这里美美地睡一觉，等醒了再去花园里拔那些碍事的刺玫瑰。"
KNM.7.a:0 "§4“这里以后就是大家的游乐场了！”§!"
KNM.7.b:0 "§9“春天怎么还没来？”§!"
KNM.7.c:0 "§1“不听话的就要被捉弄”§!"
KNM.7.f:0 "§O“为什么要安安静静的？”§!"

KNM.8.t:0 "这种味道是春天"
KNM.8.d:0 "红魔馆的长廊里现在全是我们这些湖边妖精的笑声。我坐在宽宽的大窗台上，看着阳光照在那些碎掉的冰渣子上，心里美滋滋的。虽然我只是个跟在琪露诺大人后头、连名字都排不上号的小湖精，但这种占领了大房子的感觉真的挺了不起。\n正当我打算在软和的地毯上打个滚的时候，一个白花花的影子从窗口轻飘飘地落了下来。她穿着一身雪白的裙子，金色的头发在风里一跳一跳的。她没有像我们一样大吵大闹，而是蹲在那些快要化掉的冰块旁边，伸出手指轻轻碰了碰。\n“那个，还没到春天吗？”她回过头问我，眼睛亮晶晶的。\n我愣住了。这时候，视线好像跟着她的动作一起飞到了半空中…………\n\n莉莉白觉得脚尖凉凉的，那是冰块变成水的味道。虽然院子里那些红色的花还没开，但她能感觉到，泥土里那些爱睡觉的小家伙已经在翻身了。对她来说，这整座巨大的红魔馆，还有这些吵吵闹闹的同伴，都像是春天到来前的一场热闹的梦。\n春天在哪儿呢？莉莉白拍了拍翅膀，让自己飞得高一点。她不在乎谁打赢了仗，也不在乎谁才是最强的，她只想在第一片嫩叶冒出来的时候，大声地告诉每一个人。那个属于她的、暖洋洋的时刻，一定就藏在这些化掉的冰水后面。莉莉白扬起脸，在微风里捕捉着那一点点属于花开的香气。"
KNM.8.a:0 "“春天要来啦！”"
fra_jiaqiang_tt:0 "当§Y@FRA[FRA.getname]§!与我们同阵营时，将会对ai进行适当强化"

KNM.9.t:0 "第一个绿点点"
KNM.9.d:0 "红魔馆里吵吵闹闹的，但那些声音飘不过花园的围墙。我把脸凑得很近，闻着湿泥土混合着冰雪融化的清甜味道。琪露诺大人留下的冰块正在慢慢变小，水滴顺着枯草的茎秆滑进地里。就在一块快要化完的冰片旁边，我看到了。一个小小的、倔强的绿点，从黑色的泥里探出头来，顶着一粒晶莹的水珠。\n这就是信号。春天悄悄地把信塞进了地里，只有我能找到。我张开翅膀，小心翼翼地为它挡住还有些凉意的风。心里有个声音在轻轻哼着歌，我知道，是时候去告诉大家，那个暖洋洋的季节，已经醒来了。"
KNM.9.a:0 "“找到你了。”"

KNM.10.t:0 "看呀看呀春天到啦"
KNM.10.d:0 "我飞进了红魔馆那个高高的大厅，这里现在比外面还要热闹。琪露诺大人正领着大家在铺着红地毯的楼梯上滑冰，冰碴子和妖精们的笑声一起飞得到处都是。\n“春天来了呀！”我绕着那个亮晶晶的大吊灯飞了一圈，大声地告诉她们。我能感觉到，自己的翅膀尖尖上，带着一股暖洋洋的、新泥土的味道。\n琪露诺大人从扶手上滑下来，稳稳地停在我面前。她呼出的气还是白色的，像一团小小的云。“春天？那种软绵绵的东西有什么好玩的，还是冰块最厉害啦！”她说着，又在光洁的地板上冻出了一小片冰，带着大酱她们继续玩了起来。\n大家好像对滑冰更感兴趣。我心里想着，一定是春天让大家变得更有精神了，才会玩得这么起劲。"
KNM.10.a:0 "“琪露诺大人好有精神呀！”"

KNM.11.t:0 "我要去告诉大家"
KNM.11.d:0 "人类的村子总是安安静静的。我轻飘飘地落在那个旧旧的鸟居下面，对着那些穿着厚衣服、缩着脖子走路的人们挥手。\n“春天已经来了哟！”我的声音在冷清的街道上弹来弹去。\n一个正在往屋里搬柴火的大叔停了下来，他抬头看了看灰蒙蒙的天，又搓了搓手。“春天？”他哈出一口白气，眉头皱了起来，“小姑娘，你看这风还是从北边吹的，地也还冻得跟石头一样硬。离春天，怕是还有好一阵子呢。”\n他说完，又抱起柴火急匆匆地走了。街上的人们只是对我笑了笑，就把自己裹得更紧了。\n我歪了歪头。大人们总是想得太多，连风吹的方向都要管。不过没关系，等太阳再暖和一点，他们就知道我说的是对的了。"
KNM.11.a:0 "“大人们总是想得太多啦。”"

KNM.12.t:0 "森林里也该知道了"
KNM.12.d:0 "魔法森林里的空气总是湿漉漉的，带着一股蘑菇和腐烂叶子的味道。我穿过那些奇形怪状的大树，找到了那个总是乱糟糟的房子。\n“魔理沙，春天来了！”我趴在窗户上，对着里面那个整天戴着大帽子的魔法使喊道。\n她正摆弄着桌上一堆瓶瓶罐罐，闻言只是懒洋洋地抬了下眼皮。“春天？”她嘀咕着，随手拿起旁边一个滴溜溜转的小东西看了一眼，“不对啊，这魔力的流向还是冬天的样子，一点活泛起来的意思都没有。”\n她没再理我，又低头忙自己的事情去了，嘴里还念叨着什么“又是哪个笨蛋搞出来的异变”。\n我拍了拍翅膀。魔法使总是喜欢盯着那些看不懂的东西，连身边这么明显的气息都闻不到。不过没关系，等森林里的花都开了，她总会发现的。"
KNM.12.a:0 "“魔法使的事情真难懂呀。”"

KNM.13.t:0 "春天在敲门"
KNM.13.d:0 "哨口的人放下了手里的文书，那个白色的身影正拍打着翅膀，悬停在半空中。莉莉白歪着头，好奇地打量着这座城市。她手里攥着一小截刚发芽的柳条，翠绿的颜色在灰色的城墙映衬下显得格外显眼。\n“春天已经在那边醒了哟。”她落在石砖地上，声音里满是清甜的喜气。守卫们对视了一眼，谁都认得这位总是准时报春的妖精。她看起来一点也不像那些传闻中到处捣乱的麻烦精，反而像是一缕能吹散冬寒的微风。\n红魔馆的变故早已传到了这里。那些占领了湖边的妖精们展现出了合作的意向。\n这个带着花香的使者，正在等待我们的回应。是张开双臂迎接这些小生命的加入，还是用更温和的方式，将她们纳入我们的羽翼之下？"
KNM.13.a:0 "让妖精们正式加入我们(§Y我们将吞并她们§!）"
KNM.13.b:0 "让她们作为附庸留在湖边"

KNM.14.t:0 "灵梦为什么不出来？"
KNM.14.d:0 "我在神社的台阶上蹦了好几圈，嗓子都喊得有点哑了。“灵梦，灵梦！春天真的到了呀！”可是神社的大门关得紧紧的，连条缝都没露出来。我明明感觉到空气里有一股暖乎乎的劲头，就像钻进刚晒好的被子里一样舒服。我趴在门缝往里看，灵梦正缩在那个叫被炉的大方桌下面，脸蛋冻得发青，怀里还抱着个没剩几粒米的空罐子。\n她瞪着眼看我，哈出一口长长的白气，像是要把我吹跑一样。“春个头啊，外面还在下大雪呢。”她指了指我背后。我回过头，一片凉丝丝的雪花刚好落在我鼻尖上。可是……那种暖烘烘的感觉是怎么回事呢？我吸了吸鼻子，那股味道一点也不像花香，反而带着点烧焦的木头的味道，从东边那个新出现的、阴森森的魔导国那边飘过来。\n春天好像变了个样子，变得一点也不温柔了。"
KNM.14.a:0 "“怎么还在下雪呀？”"

KNM.15.t:0 "又是一个倒霉日子"
KNM.15.d:0 "赛钱箱里比冰窖还干净，屋顶的漏缝里还在往里灌着雪籽。\n我把手缩在袖子里，恨不得把自己整个人都塞进快要熄火的被炉下面。那个春妖精在外面没完没了地尖叫，声音震得房梁上的灰土直往下掉。她在那儿又唱又跳，口口声声说春天到了。\n我推开一条门缝，夹着冰碴子的北风直接糊在脸上，院里那棵老樱树枯得像个被烧焦的骨架，哪儿来的半点绿意？这个笨蛋妖精感觉到的暖意，是南边那个魔导国在边境上扩建工坊排出来的热浪。那股邪门的魔力把空气弄得黏糊又潮湿的，闻起来全是腐烂的味道。\n她把灾难降临前的征兆当成了报春的喜讯，这大概就是当妖精最幸福也最可悲的地方了。"
KNM.15.a:0 "“那是死人的热气啊，笨蛋。”"

KNM.16.t:0 "空气突然变硬了"
KNM.16.d:0 "云彩后面藏着一股干巴巴的暖意，不像花朵绽放时的甜味，倒像是太阳把石头晒得太久了。我拍打着翅膀飞得很高，想要穿过那片灰蒙蒙的雾气去看看。灵梦总说那是坏东西，但我能感觉到，那股热乎乎的劲头就在东边跳动。\n就在我张开双手想要抱住那团暖风的时候，指尖触碰到了一层透明的、坚硬的空气。明明什么都看不见，可那里就像有一道挡住视线的厚玻璃。我用力拍了拍翅膀，整个人撞了上去，额头磕得生疼。这种感觉就像是在冰面上滑倒了，只是这堵墙长在半空。我贴着这层凉冰冰的隔阂，看到远处有好多冒着黑烟的长管子，它们一动不动地戳在灰色的影子里。那种暖意就是从那儿飘出来的，可它们看起来一点也不像活过来的样子。春天好像被关在了一个我飞不进去的笼子里。"
KNM.16.a:0 "“怎么飞不动了呀？”"

KNM.17.t: "大家一起飞过去"
KNM.17.d: "我拍打着酸溜溜的翅膀，落到红魔馆宽大的露台上时，琪露诺大人正领着大家把那些亮闪闪的盘子叠成高塔。我急得绕着她们转圈，大声说着那堵看不见的、比冰块还硬的空气墙。大酱停下手里的事，歪着头看我，眼睛里满是不相信。\n“莉莉酱一定是飞太快，撞到哪片厚云彩了吧？”琪露诺大人叉着腰，蓝色的翅膀在阳光下抖落一串冰晶。她扬起下巴，指着东边那团灰蒙蒙的雾气，“本小姐才是最强的，就算前面有山也能撞个窟窿。走，大家一起去瞧瞧！”\n于是，一大群妖精吵吵闹闹地飞上了天，像一串彩色的珠子。我跟在后头，心里的鼓点跳得咚咚响。我们越飞越高，穿过那片总是凉飕飕的林子。奇怪的是，之前那种硬邦邦的感觉不见了。空气变得又黏又重，带着一股子苦涩的、像是什么东西烧焦了的味道。原本色彩斑斓的地面渐渐褪了色，变成了一片望不到头的、死气沉沉的灰色。\n“看吧，哪有什么墙呀！”琪露诺大人在前面飞得更欢了。我也愣住了，之前的玻璃感确实消失了，取而代之的是一种让人喘不过气的燥热。春天，现在离我们好近好近，就在那些正吐着黑烟的巨大管子下面。大家欢快地在大雾里钻来钻去。"
KNM.17.a: "“原来真的能飞过来呀。”"

KNM.18.t:0 "慢慢逝去的季节"
KNM.18.d:0 "大酱拉过手来，指尖有些发凉，指缝里还卡着刚才在后花园里挖出来的草根。我想告诉她，我们已经找到第一个绿点点了。\n一圈惨绿色的虚影无声无息地漫过来。静悄悄的，连一丝风声都听不到。我的手心里突然变轻了。\n大酱突然走得很慢，翅膀不再扑腾，像是一片被雨淋湿的落叶，沉甸甸地贴在背上。\n“莉莉酱，我好像……有点飞不动了。”她冲我笑，可是那个笑容太浅了，像是在水里快要散开的影子。\n掌心里没了热气，指尖化作干枯的草茎，风一吹，就散成了碎碎的灰色粉末。琪露诺大人在前面停了下来，她低头看着自己冰蓝色的裙角，那些漂亮的颜色正一点点褪去，变成脏兮兮的铅灰色。她们静悄悄的，甚至没有发出一丝叫喊，只是迷迷糊糊地往地上倒去。\n天空中落下了大片大片灰屑。那些红色的缎带、绿色的裙角，都像是被秋霜打过的花瓣，无声无息地落进了泥土里。\n“大家…琪露诺大人？大酱？”我拍着翅膀，围着那堆灰转圈。“春天来啦！快醒醒呀！”\n我以为她们是在玩装睡的游戏。我蹲下身，用暖和的气息去吹那些灰。以前在湖边，只要我吹一吹，快要冻死的小草就会重新长出新叶子。我使劲地吸着气，大声地喊着春天到了。可是那些灰一动不动。眼泪落下去，冲开一小片深色，把那些灰弄湿了，变成了一滩黑糊糊、凉冰冰的稀泥。\n我用手去抠那些泥巴，想把她们重新捏出来，可是泥水太稀了，顺着我的指缝一直往下淌，怎么抓也抓不住。东边那些黑沉沉的管子还在冒着热气。那股风吹在脸上，黏糊糊的，呛得人直咳嗽。\n这根本不是春天。春天虽然暖和，但春天从来不把大家变成泥土。"

KNM.19.t:0 "灵梦的脸色很难看"
KNM.19.d:0 "我重重地摔在木地板上，身上全是雪和泥。我顾不上疼，连滚带爬地挪到灵梦脚边，把双手捧到她面前。\n“灵梦，你看看，大酱和琪露诺大人都在里面……她们变成这样了。”我大声朝她喊，“我们是妖精对不对？只要天气暖和了，我们总会重新从湖里长出来的。你最厉害了，帮我把她们变出来好不好？”\n我低下头，拼命往手心里的黑泥上吹气。我用尽了全身的力气，把暖烘烘的春风吹进去。可我吹了好多下，手心里的泥巴还是灰蒙蒙的，一点温度都没有，只是像一滩油腻腻的死灰一样粘在我的皮肤上。在那股刺鼻的焦味底下，似乎还藏着一星半点、转瞬即逝的湿泥气味。那感觉太轻了，一下子就被冷风吹得干干净净。\n灵梦没有像往常一样拿着扫帚把我赶出来，但也没去接我手中的泥巴。\n她挥了挥手，一把拍在我的手腕上。泥巴啪嗒一声掉在木地板上，碎成了好几瓣。\n“你们为什么要出去？”灵梦的声音大得可怕，连肩膀都在发抖，\n“谁给你们的胆子去绕过大结界？！”\n我吓得缩起脖子，眼泪混着脸上的灰往下淌：“因为东边有暖和的风……我们只是想去找春天……”\n“那不是春风！傻瓜！！！”灵梦红着眼睛朝我吼。她盯着地板上那摊散发着焦味的泥巴，攥着袖子的手抖个不停，“她们不会再醒过来了。这一次……她们是真的死掉了。”\n我呆呆地看着地板上那些变凉的泥巴。\n大结界外面……真的没有春天。"
KNM.19.a:0 "“大酱……琪露诺大人……大家…醒一醒呀……"

KNM.20.t:0 "不听话的笨蛋妖精"
KNM.20.d:0 "外头的雪还在下，赛钱箱上落了薄薄的一层白。我正打算去关门，一个白花花的、脏兮兮的身影突然从风雪里跌撞进来，在走廊上滚了好几圈。\n是莉莉白。她那身雪白的裙子全被熏黑了，翅膀破烂得像被火烧过的飞蛾。她哆哆嗦嗦地爬过来，手里捧着一摊散发着刺鼻焦味的湿泥，哭着嚷嚷说琪露诺和大妖精都在泥里，等春天暖和了就会重新醒过来。\n看着那摊混着黑灰的脏东西，我气得浑身发抖，一巴掌把她的手甩开。烂泥啪嗒一声落在木地板上，污迹顺着木头的纹路渗了进去。\n“你们为什么要出去？”我盯着她，声音冷得像外头的冰雹，\n“谁给你们的胆子去绕过大结界？！”\n这个笨蛋妖精缩成一团，哭得抽抽嗒嗒，还在指望着春天的到来。\n妖精往常哪里会真的散去？哪怕被冰雹砸烂，被野兽撕碎，过几天也依然会在湖边的草丛里重新长出翅膀，但帝国那不讲理的魔法不仅烧焦了她们的身子，连整片雾之湖的活气也被生生烫死了。水汽被毒烟熏黑，泥土被寒冬冻结。妖精本来就是跟着湖泊、跟着草木一齐长出来的。如今湖水干了，树林子焦黑一片，连魂灵都被沉甸甸地钉在炭灰里。只要那个不讲道理的骨头架子不走，这里就永远不会有春风。没有春风去呼唤，在这滩死泥里，她们便会永远沉睡下去。在这个世界上，连妖精也开始会真正死去了。\n“真是群笨蛋……”外头的风雪似乎又大了一些，把破旧的纸门撞得啪啪作响。\n我转过脸，看着空荡荡的院子，那棵老樱树在风雪里像一具干枯的骨架，什么都护不住。"
KNM.20.a:0 "“也许，她们不会再回来了。”"

KNM.21.t:0 "红浆果"
KNM.21.d:0 "博丽神社的后院这几天落满了枯叶，屋顶上还落着冰屑。我（灵梦）捏着酸痛的肩膀走出屋子，本来打算去拿扫帚，却在台阶下愣住了。\n院子已经被扫得干干净净，那些堆在墙角的落叶落得整整齐齐。井水边上用大叶子垫着，码着一小叠红彤彤的野浆果，上面还带着晶莹的晨露。\n一个雪白的小翅膀在鸟居后面的树丛里一闪而过。\n是莉莉白她们。\n自从那场大变故之后，这群劫后余生的小家伙就变得异常安静。她们不再像以前那样吵闹，反倒每天天不亮就跑来这里，用树枝笨拙地清理着院子，把这些洗干净的野果留下来，生怕打扰到我。\n我知道大结界上的裂缝每天都在变宽，外头那些魔导国的钢铁怪物正在沿着边界集结。我本以为这群妖精只会添乱，没想到她们是在用这种近乎傻气的办法，帮我节省体力去修补结界。\n看着那一小叠野浆果，我叹了口气。她们只是觉得把我照顾好了，春天就能早一点到。"
KNM.21.a:0 "“那就专心去补结界吧。”"

KNM.22.t:0 "小包裹"
KNM.22.d:0 "魔法森林的小木屋里，我（魔理沙）正对着一桌子干瘪的素材揉太阳穴。东边的风越来越冷，空气里总有股刺鼻的硫磺味。我急需一些能引发剧烈反应的魔力触媒，来制作能在夜里报警的高空照明弹，可这个季节森林里的活气全被压住了。\n“咚。”\n窗台上突然传来一声轻响。\n我推开窗，只看到一个用干草和藤蔓扎成的小包。打开一瞧，里面密密麻麻地码着一排新鲜得还在滴水的光蘑菇。这种蘑菇在湿冷的环境下生长，很不稳定，轻轻一碰就会爆发出强光。\n远处的大树后面，一个白衣服的身影缩回了脑袋。\n“又是妖精……”我自言自语。\n莉莉白大概还以为我是在做“驱散乌云的礼花”吧。她跑遍了森林湿冷又危险的地方，就为了帮我收集这些随时可能炸开的小火药。既然有了这些，今晚的哨戒照明弹就能多做二十发了。在那些重型装甲车辆开过来之前，我们至少能把这片森林的夜空彻底照亮。"
KNM.22.a:0 "“真是一份及时雨。”"

KNM.23.t:0 "大马路上全都是稀泥"
KNM.23.d:0 "从前线传回来的消息有些让人难以置信。\n东边边境的斥候报告，那些沿着大道缓缓推进的魔导国装甲侦察车，在距离大结界不到十里的低洼地带全部趴窝了。原本干燥结实的路面，不知何时变成了一片深达数尺的沼泽。\n根据目击，几天前有一大群妖精在湖边嬉闹，她们把河道上的泥沙挖开，任由湖水漫灌。她们在泥浆里打滚、泼水，把这片咽喉要道彻底变成了一滩稀泥。\n那些钢铁怪物的履带被胶着的黏土牢牢卡住，工兵们不得不冒着寒风，费力地试图把重型车辆从泥潭里拔出来。她们的进军速度被不可思议地拖慢了。\n在她们单纯的想法里，把路弄湿只是为了让那些“大铁盒子”陷进去，这样她们就可以在旁边看热闹，顺便保护小草。但这滩泥，确实为整个幻想乡争取了宝贵的备战时间。"
KNM.23.a:0 "“真是帮了大忙。”"

KNM.24.t:0 "河童送来新图纸"
KNM.24.d:0 "河城荷取跑上山的时候，脸上的机油都没来得及擦干净。她怀里抱着一叠刚画好的草图，上气不接下气地冲进院子。\n“那些湖边的妖精……把湖畔的所有工业车间和重型熔炉，全送给我们了！”\n我有些诧异地看着她。那些大房子原本是红魔馆在外面建的工坊，里面装满了精密的铸造机和锅炉。莉莉白昨天托小鸟送了一封信过来，上面用红红绿绿的果汁歪歪扭扭地画着几个图案。她在信里说，那些“大大笨笨的石头房子”里整天吵个不停，地上又没有可以打滚的草地，所以决定把这些“石头房子”全送给河童当玩具。\n荷取两眼放光。她说，车间里的重型蒸汽锅炉和锻造设备，比玄武泽现有的作坊还要先进，正好能用来批量组装防御用的铁家伙。至于代价，莉莉白在信纸的背面画了几个手拉手的小人。她只想要我们这边的妖精过去，陪她们一起玩，把空房间住满。\n这哪里是交换，这简直是把值钱的家底白送了过来。妖精们大概根本不知道那些车间和高炉意味着什么。可对我们来说，这些多出来的工业产线，简直就是雪中送炭。"
KNM.24.a:0 "“她们真的只要朋友吗？”"

KNM.25.t:0 "背起包袱去远方"
KNM.25.d:0 "一大早，我就看到神社后山的树林里乱哄哄的。平时整天在草丛里睡觉的几个小妖精，这会儿居然把她们平时收集的石头和树叶都塞进了小布包里，正排成一列往山下挪。\n“你们这是去哪儿？”我叫住她们。\n带头的小妖精回过头，一脸骄傲地拍了拍她那干瘪的包袱，说莉莉白派了小鸟来送信。信里说，湖那边有好多好大的空房子，地上铺着香香的干草，还有喝不完的茶和香喷喷的栗子，只要过去就能和大家一起玩。\n我看着这些甚至不知道大结界外头有多危险的小家伙。她们只是听到了“温水”和“朋友”，就高高兴兴地打算搬到那个时刻可能爆发冲突的边界去。我知道，因为河童们已经接管了那些工厂，我们作为大人的，不能在这时候把这些单纯的家伙拦下来。\n“在路上别乱跑，跟着鸟儿走。”我挥了挥手。\n她们清脆的笑声一瞬间就飘远了。看着她们单薄的背影，我只能希望，那些高耸的工厂里做出来的铁疙瘩，真的能在冬天彻底降临的时候，护住这些什么都不懂的妖精。"
KNM.25.a:0 "“一路上一定要安全啊。”"

KNM.26.t:0 "风雪里站着一个小影子"
KNM.26.d:0 "博丽神社的客房里，一整晚都亮着昏暗的烛火。\n大人物们围在木桌旁，激烈的争吵声顺着纸门缝隙传到走廊上。我（灵梦）看着桌上那几张画满了结界节点和防御阵线的旧图纸，眉头皱得很深。\n“我们应该关闭所有的通道，把大结界彻底锁死。”一个低沉的声音说，“外面的帝国是个会把神明都碾碎的疯子。让幻想乡和那种怪物对抗，是在拿所有人的性命去赌博。那些妖精在外面被烧成灰，是她们自己的愚蠢。”\n“可是，那个春之妖精，现在就抱着同伴的灰泥站在门外。”另一个声音打断了他，“如果我们今天把门锁上，看着那群连枪都拿不稳的小家伙去外面送死，那我们和外面那些冰冷的铁甲有什么区别？我们还是守护乐园的贤者吗？”\n桌子两边沉默了下去。\n纸门被轻轻推了开来。莉莉白抱着那只装着大妖精和琪露诺灰迹的木盒子，站在风雪灌进来的门廊里。她身上的白裙子沾满了灰，翅膀冻得直打哆嗦，但那双清澈的眼睛里，却透着一股让人不敢直视的决绝。\n“姐姐……大家……”她小声说，“我把大家都重新攒起来了。那边的风很冷，可是，如果把那个最大的铁房子砸碎，春天就会回来的。大酱和琪露诺大人，也一定会回来的。我要去和那个冬天打架了。大家……能借给我一点点春天吗？”\n我们这几天一直在用外面那些政客的逻辑去计算得失。可幻想乡哪里是个能用常理来束缚的地方？这里是乐园，是奇迹与不讲道理的生灵聚集的净土。如果连一个春之妖精为了寻找同伴都要独自走向风雪，而我们却只能躲在被炉里算账，那这片所谓的“净土”，其实早就在大雾里死掉了。"
KNM.26.a:0 "“走吧，我们跟你们一起去砸烂那个冬天。”"
KNM.26.b:0 "“这太危险了。抱歉，我们不能去。”"
KNM.invitedfra_tt:0 "当@KNM§9[KNM.GetName]§!与@DVL§0[DVL.GetName]§!爆发战争时，我国将会向@DVL§0[DVL.GetName]§!宣战。"

KNM.27.t:0 "渐渐在风雪中走远"
KNM.27.d:0 "博丽神社的纸门虚掩着，屋里的被炉和热茶散发着安稳的余温。\n\n我站在神社门前的台阶上，风雪劈头盖脸地砸下来，瞬间把脚下地面染上了一层霜白。回头看了看那扇透着火光的木门，深吸了一口气，将装有大家灰泥的木盒子揣回口袋里。\n\n灵梦没有出来送我。但我知道她此时一定靠在门后，用沉默的方式盯着我的背影。\n\n“莉莉，外面会很冷的。”大酱以前也总是这样唠叨。\n\n我拍了拍那双还带着黑灰、怎么也飞不直的翅膀，一步一步、歪歪扭扭地走下了石阶，整个人一头钻进了大结界外那片漫无边际的灰色死寂中。\n\n从神社的走廊望去，大雪纷扬。那个小小的白影子在漫天风雪里渐渐走远，像是一片在风里乱飘的黄叶，一晃眼就看不清了。石阶上一行小小的脚印，很快被落雪填平。结界边缘的冷风刮得人心疼，可她始终没有回头，一步一步，走进了那个连草根都会冻死的严冬里。\n\n这就是春之妖精。她要去把春天，强行拖回这个世界上来。"
KNM.27.a:0 "“那么……出发啦。”"


KNM.28.t:0 "春天马上就要来了"
KNM.28.d:0 "那些高大笨重的大烟囱终于全塌了。\n废墟周围的黑烟渐渐散去，露出了干净、蓝莹莹的天空。暖和的阳光穿过碎裂的铁板，斜斜地照在泥地上。\n我蹲下身，双手捧出口袋里的那一小包黑泥，轻轻摊在还残留着余热的土坑里。\n“大酱，琪露诺大人，烟囱倒了哦。”\n小声地对着泥土说话，凑过去，将春风一次次吹进松软的泥缝。可是，地上静悄悄的，期待中的喧闹并没有出现。等了很久，泥巴也依然只是泥巴。\n眼泪落在干裂的泥块上，晕开了一小片湿漉漉的深色。\n原来，灵梦说的是对的，被那种法术烫过之后，真的不会像以前那样一觉醒来就拍着翅膀在湖边乱飞了。\n脸颊贴在有些发凉的泥地上，指尖突然碰到一个软乎乎、热乎乎的小东西。\n睁开眼。\n就在眼泪流过的地方，一瓣指甲大小的嫩绿色叶片，正顶开焦黑的碎屑，悄悄探出头来。\n叶子在阳光下亮闪闪的，散发着一股好闻、清新的湖水香气。虽然大酱和琪露诺大人还没有回来，但它确实在呼吸，在努力地往有阳光的地方生长。\n这一瞬间突然明白了。\n妖精是不会真正消失的。她们只是变成了泥土，变成了风，变成了第一片钻出地表的绿芽。只要不断地吹出暖风，不断地呼唤春天，她们就会在很多年后的某一个春日里，再次从树洞和花丛里探出头来，大声叫喊着本小姐才是最强的。\n我拍了拍残破的翅膀，在泥土旁坐下，学着大树的样子闭上眼睛，静静地等待着。"
KNM.28.a:0 "“春天，马上就来到这里了。”"

KNM.29.t:0 "黑色小雪花"
KNM.29.d:0 "落下来的雪花是黑色的，闻起来黏糊糊的，带着刺鼻的焦味。刚刚才钻出地面的一点点小嫩芽，一碰到这些黑雪，叶尖就泛起了灰败的颜色。\n这让人有些慌神。好不容易才砸碎了那些喷火的大铁罐子，为什么天空还是不肯放晴呢？手指冻得发僵，翅膀也因为在浓烟里熏过，到现在还疼得根本飞不起来。身边已经没有可以帮忙的地精，好玩的小船也都在战斗中碎掉了。越来越多的黑雪落在肩膀上，冷得让人想要流眼泪。\n看着那个快要枯萎的绿色小点点，我终于一咬牙，整个人趴在了湿漉漉的泥地上。双手在胸口前合拢，用残破的翅膀把小嫩芽严严实实地护在身下。\n我的脸颊贴着冰凉的泥土，把最后一点温柔的气息，轻轻吐在小小的叶片上。\n绝对不能让它冻死。这是大家留下来唯一的希望了。\n意识渐渐模糊，身体冷得快要动弹不得。胸口下方的泥土里，却在此时传来了一下微弱的、清清楚楚的跳动。\n那是一下很轻的撞击，像以前大酱拉着我的手在湖边奔跑时的心跳。滚烫的眼泪流了出来，落在黑色的泥地里。只要这个小小的生命还在跳动，就一定要坚持下去。春天一定会来的。"
KNM.29.a:0 "“一定要……暖和起来啊……”"

KNM.30.t:0 "泥土里长出了小翅膀"
KNM.30.d:0 "阳光落在新翻开的泥土上，升腾起一股暖洋洋的湿气。\n我正拿着小水壶往刚铺好落叶的花坛里浇水，旁边的泥土却突然晃动了一下。一朵红色的郁金香花苞轻轻颤抖着，接着慢慢绽开，里面居然冒出了一个湿漉漉、亮闪闪的小脑袋。\n“哎呀……”那个小妖精揉了揉眼睛，迷迷糊糊地看着我。她身上还粘着泥土，背后的半透明翅膀软塌塌地贴在背上，就像刚从壳里钻出来的小鸡。\n我呆在原地，水壶里的水洒在脚面上也浑然不觉。\n接着，旁边的草丛里、花朵里、树皮的缝隙里，一个接一个的小脑袋探了出来。她们有的还在打哈欠，有的在好奇地摸着自己的鼻尖，全都是那些在大雾里消失不见的同伴。她们像普通的小草一样，在暖和的泥土里吸足了春天的雨水，就这么自然而然地重新长了出来。\n“莉莉酱？你怎么在哭呀？”那个小妖精拍了拍翅膀，摇摇晃晃地飞到我面前，用沾着泥的小手去擦我的脸。\n我摇了摇头，把她抱进怀里。原本冰凉的泥土，如今变得暖烘烘的，充满了生命的味道。她们真的回来了。虽然还很小，虽然有很多事情都记不清了，但她们确实回来了。"
KNM.30.a:0 "“欢迎回家！”"

KNM.31.t:0 "那个爱逞能的笨蛋醒了"
KNM.31.d:0 "湖中心的冰层开始发出清脆的开裂声。\n在阳光的照耀下，那座曾经被冻得结结实实的冰雕，正化成温暖的水流，顺着泥土的缝隙静静流淌。湖中心那朵由琪露诺大人的魔力结成、一直没有枯萎的巨大冰花，此时正像真正的莲花一样，在暖风里一层层绽开。\n我站在湖边，屏住呼吸，看着那朵冰花的中心。\n水汽散去，两个娇小的身影正并排躺在花蕊里。大酱最先揉着眼睛坐了起来，背后的绿翅膀扑腾了两下，上面还带着些许亮晶晶的冰屑。她转过头，看到了身旁的蓝衣服妖精，接着捂着嘴，眼泪一下子就流了出来。\n琪露诺大人慢慢睁开了眼睛。她那双冰蓝的眸子里还带着一丝睡意，下意识地想要拍着胸脯，像以前那样大喊本小姐才是最强的。\n可当她看到我那身洗得干干净净但依然有些残残破破的裙摆时，她的大眼睛忽闪了两下，猛地从花蕊里跳了出来，气呼呼地落在我的面前。\n“莉莉酱！你的翅膀怎么破了？是不是那些红魔馆的人干的？还是东边那些大烟囱里的家伙？！”琪露诺大人挥舞着小拳头，虽然身体比以前小了一圈，但那股骄傲和霸气一点都没变，“可恶！竟敢欺负我手下的人！本小姐现在就去把他们全部冻成冰棒！”\n大酱在一旁破涕为笑，拉着她那小小的手：“琪露诺酱，打架已经结束了，是莉莉白赢了哦。”\n“啊？本小姐还没发威呢，怎么就赢了？这不算！一定是本小姐在梦里帮了大忙！”琪露诺抓着脑袋，有些不甘心地嚷嚷着。\n我站在岸边，看着在暖风里大呼小叫的她，终于忍不住咯咯笑了起来。"
KNM.31.a:0 "“最强的琪露诺大人，早上好！”"

KNM.32.t:0 "院子里又变吵了"
KNM.32.d:0 "阳光落在木地板上，泛着暖烘烘的木头香气。前些日子被泥巴弄脏的那个角落，虽然还有一点洗不掉的深色痕迹，但现在看起来已经没那么刺眼了。\n我（灵梦）正拿着扫帚清理台阶上的花瓣，一阵急促而嘈杂的拍翅膀声音突然打碎了清晨的宁静。\n“灵梦！你看！本小姐说过了，我才是最强的！”\n蓝色的小影子从空中呼啸着落下来，差点一头撞进神社的茶室里。琪露诺叉着腰站在走廊上，虽然身体比以前小了一圈，背后的冰翅膀也还在往下掉着细碎的水花，但那张神气活现的笑脸却和以前一模一样。大妖精和好几个熟悉的小湖精紧跟在后面，吵闹地在院子里乱飞，手里还抓着刚摘下来的野果。\n莉莉白落在最后。她那身白裙子洗得干干净净，站在阳光下，亮堂地抿着嘴笑。\n我看着这群围着赛钱箱大呼小叫的家伙，扫帚在手心里转了又转。\n我想起她爬在我脚边哭泣的那天，浑身是泥，像个随时会碎掉的泥娃娃。那天我冷冰冰地对她说，她们回不来了，因为这片湖已经被毒害、被冻结，再也没有春天了。其实那时候，我是真的不相信她。她不过是一个普普通通、连冬天都熬不过去的春之妖精。身子那么小，翅膀那么软，我甚至觉得她还没飞出大结界就会冻死在某个无人知道的泥沟里。\n可她居然真的把整片湖都变回来了。\n这个连字都不会写的小家伙，硬是凭着一股没来由的傻气，拍打着她那双被火熏得残破的翅膀，把整个大平原的焦黑一点点洗净，把冰封的土地一寸寸温暖。\n我看着她，忽然觉得那双纤细的小手，比我想象的要重得多。\n“真是一群怎么也除不掉的杂草。”\n我叹了口气，有些无奈地把扫帚靠在墙边，嘴角却不自觉地往上扬了扬。看样子，今后的日子又要开始变得头疼了。"
KNM.32.a:0 "“别在我的院子里洒水，琪露诺！”"

KNM.33.t:0 "我们该出发了"
KNM.33.d:0 "最后一点焦炭的臭味从湖面散去，阳光终于彻底照亮了这片大平原。那些生满铁锈的机器残骸上，正爬满厚厚的绿苔。几朵娇嫩的小黄花从钢板缝隙里探出头来，在风里轻轻地晃。\n莉莉白站在红魔馆的露台上，白色裙角在暖风里晃动。指尖小心地触碰着花瓣，脸上是满足、单纯的笑容。妖精们正在不远处的花坛边，因为谁摘的水果更大而争论个不停。\n这场关于春天的远征，在今天，终于写下了最后的篇章。\n她抬起头，大口吸着甜丝丝的空气，拍打着翅膀飞上蔚蓝的天空。"
KNM.33.a:0 "“那么，就去给大家报春吧！”"


KNM.34.t:0 "他们在雪地里发抖"
KNM.34.d:0 "雪花打在边境线的边缘，发出细微的沙沙声。\n三个穿着沾满泥污和机油大衣的魔导国士兵，正顺着干枯的灌木丛，深一脚浅一脚地往前蹭。他们抱着的枪有些沉，手指已经被冻得有些发紫，关节很难弯曲。\n督战队的机枪就在后方，退回去就是枪毙。而在他们平日接受的帝国宣传里，结界里的妖怪会把人类塞进熔炉，或者剥皮抽筋当成祭品。他们本来已经做好了死在枪口下的准备，可实在太冷、太饿了。\n灌木丛突然动了动。\n士兵们慌忙举起枪，牙齿在风里不停打架。\n一个穿着破旧白裙子的小影子，在雪地里晃晃悠悠地飞了出来。她那双小翅膀在冷风里冻得直打哆嗦，怀里却抱着个比她脑袋还要大得多的粗瓦罐。\n莉莉白落在一根枯木上，吐着白气，完全没有理会那三个指向自己的黑漆漆枪口。她从瓦罐里掏出两个用树叶包着的烤栗子，放在旁边干净的雪地上。\n“吃点东西吧，外面好冷呀。”她小声说着，伸手拉了拉衣服。\n士兵们愣在原地。瞧着那个小小的白影子，手里的钢枪忽然多余了起来。平日里受过的训练和对怪物的仇恨，本该催促着他们在此刻扣动扳机。可是，那片盖在栗子上的枯叶还散发着一丝淡淡的松脂香气，以及属于泥土的、久违的热气。\n最前面的那个年轻士兵，手指在扳机上颤抖了很久。他慢慢蹲下身，用满是泥垢的手套抓起了雪地上的栗子。他粗暴地扯掉落叶，将干瘪的栗子塞进嘴里，甚至连壳都来不及吐干净。\n眼泪无声地顺着他的鼻翼流下来，打湿了领口上粗糙的呢子料。\n在远方，魔导国那些巨大的宣传喇叭还在风雪里声竭力嘶地喊着关于毁灭与征服的口号。但在这里，生硬的严冬被这一小团微弱的热气，无声地消融出了一道细小的裂缝。"
KNM.34.a:0 "“要……要再来一碗热茶吗？”"

KNM.35.t:0 "大家都在本子上写字"
KNM.35.d:0 "在刚被清理干净的大广场中央，泥土被大家合力翻开，种下了第一粒小小的花种。\n周围站满了人。新来的妖精们排成歪歪扭扭的队列，吃饱了烤栗子的地精们规规矩矩地举着橡木棒，还有几个从人类村庄过来的记录员。他们手里攥着笔，脸色严肃地盯着场地中央。\n我被大家推上了那个用废旧木箱搭成的小台子。风吹过来，台子有些晃，不得不蜷起光溜溜的脚趾，努力站稳。灵梦说，作为一个盟约的“首领”，在种下第一粒种子的时候，必须要对大家进行一次严肃的演说。\n我清了清嗓子，对着这片黑压压的脑袋大喊起来：“大家听好啦！泥土踩坏了就不好玩了，谁也不许去踩。还有，绝对不准偷偷把地底下的花种挖出来吃掉，因为那个很涩，一点都不甜。地精们要是乖乖听话不捣乱，今天晚上就能分到一整筐烤栗子！”\n台子底下安静了一瞬，那些记录员们开始在小本子上飞快地写着字，发出沙沙的声音。\n“……听到了吗？‘不准吃花种’，这真是对保障战时的核心农业储备、杜绝非理性消耗最接地气的阐释啊。”\n“分烤栗子更是高明，用食物的再分配，来保障异族劳工的协作积极性，这绝对是超越了传统社会层面的关怀政策……”\n我站在木箱上，看着那些一边念叨着听不懂的词、一边拼命记笔记的人，又低头看了看自己脏兮兮的脚尖。我根本听不懂什么他们在说什么，我只是知道，如果把种子吃了，明年春天就真的不会来了。我当不了什么伟大的领袖。我只是一个很累、翅膀很疼，想要睡着的妖精们快点醒过来的春之妖精。但如果这些奇怪的大人们只要记记笔记，就能送来更多的花种子，那我就在木箱上多站一会儿。我努力板起小脸，让自己看起来尽量像个严肃的领袖。"
KNM.35.a:0 "“听好啦，一定要每天浇水呀！”"

KNM.36.t:0 "大家一起喝甜水"
KNM.36.d:0 "红魔馆的后院里，一口比水桶还要大的铁锅正冒着白气。干枯的野菊花、干荷叶，还有一大罐蜂蜜，一股脑地被倒进了沸水里。空气里一时间满是香喷喷的甜味。\n幸存下来的妖精们在草棚里围坐成一圈，身上裹着灰色的毯子，看起来像一群在冬日里无家可归的难民。大家都垂着头，脸色发白。\n“没有琪露诺大人了，大平原的风又这么冷，我们是不是要冻死了呀……”\n一只小妖精捏着衣角小声抽泣。话还没说完，一大木碗热乎乎的蜂蜜甜茶就塞进了她的手里。莉莉白抱着木勺站在大锅旁，挨个给大家分着热水。\n小家伙们捧着木碗，缩着脖子试探着喝了一口。\n“咕嘟。”\n“哇！好甜！”\n吸鼻子的声音在一瞬间消失了。暖和的热水顺着喉咙流进肚子里，那些原本苍白的脸蛋，几乎在眨眼间就变得红扑扑的。\n“莉莉酱！我还要一碗！”\n“既然琪露诺大人变成泥土了，那今天晚上的南瓜布丁是不是可以多给我一块？”\n“凭什么给你！我现在飞得最高，我才是最强的，布丁应该给我！”\n刚刚还沉浸在悲痛中的妖精们，此刻已经因为抢布丁在毯子堆里打成了一团。\n扭打中，一碗暖烘烘的甜茶被不小心泼在了角落里。那个小小的木盒子静静地放在那里，里面装着从边境捧回来的、大酱和琪露诺大人的泥。\n“啊！别浪费喝的呀！泼到泥巴上了！”\n妖精们停下动作，凑过去看。被温水浇透的泥块没有像普通淤泥那样散开。那些干涸的泥巴像是一块干燥的海绵，很快地把甜水吸了进去。那一瞬间，泥土里散发出的焦糊味似乎弱了一些，隐约透出了一点点雨后湿润泥土的芬芳，但一晃眼就消失了。\n莉莉白看着变深了的泥块，有些留恋地用指尖碰了碰它，轻声说：“别怕哦，琪露诺大人、大酱，暖和的水已经分给大家了。”"
KNM.36.a:0 "“要给她们也留一碗呢。”"

KNM.37.t:0 "红茶里落进了小花瓣"
KNM.37.d:0 "圣杯王国的伦敦总是在下雨，但今天下午，一股没来由的暖风突然吹散了满城的浓雾。\n在一座铺着厚地毯、挂满祖先油画的贵族宅邸里，两位衣着考究的绅士正靠在红木椅子上，慢条斯理地谈论着最近的国债利率与远洋股票。\n一抹雪白的身影毫无预兆地从敞开的落地窗飞了进来，带进了一大片粉红色的樱花瓣和湿泥的味道。\n“噢，亨利，这是什么？”威廉勋爵放下绘有烫金花纹的茶杯，有些嫌恶地用手杖拨了拨飘到大理石桌面上的花瓣，“幻想乡送来的最新款发条玩偶？还是哪个落后殖民地进献的珍稀飞禽？”\n莉莉白落在一只精致的银质糖罐上，歪着头看着这两个打扮得像黑乌鸦一样的人类。她从小篮子里抓出一小把刚从泥土里刨出来的、湿漉漉的花种子，顺手丢进了威廉勋爵那杯昂贵的红茶里。\n“春天来啦！大家快晒太阳呀！”莉莉白拍着翅膀，对着他们大声喊。\n两位绅士面面相觑。他们不约而同地调整了一下领结，神色变得非常严肃。\n“威廉，看到了吗？”亨利爵士压低了声音，盯着那杯正飘着泥沙的红茶，“纯白无瑕的衣着代表了古老血统的骄傲，她刚才的动作……那是幻想乡的古老礼仪！她把珍贵的作物种子投进你的杯子里，这是在向我们进行农业投资！”\n“天哪，亨利，你真是个天才。这一定是一种全新的、具有垄断性质的奇特香料！”威廉勋爵激动得手指发颤，当即从口袋里掏出一张盖着家族印章的巨额支票，毕恭毕敬地递到莉莉白面前，“高贵的女士，这是五万圣杯盾的本票，我们将全额收购您手中所有的种子产权……”\n莉莉白看了看那张毫无温度的白纸，觉得一点都不好玩，转过身拍打着翅膀，飞快地从窗户钻回了蔚蓝的天空中，只留下两个手里捧着泥沙和枯叶、以为自己垄断了全球香料市场的绅士，还在对着窗外优雅地脱帽致敬。"
KNM.37.a:0 "“大乌鸦们的纸片一点都不甜。”"

KNM.38.t:0 "红围巾和超级大萝卜"
KNM.38.d:0 "在西伯利亚寒风呼啸的泥地里，两个穿着厚呢大衣的男人正对着一片冻坏的土豆地发愁。那是集体农庄的庄长和一位戴着红围巾的农艺师。\n“今年冬天的计划额度泡汤了，达瓦里希。”农艺师在表格上重重地画了个叉，“我们恐怕要去北边挖煤了。”\n一抹雪白的身影在风雪里掠过。莉莉白拍打着翅膀落在坚硬的冻土上。她好奇地看着这两个冻得直跺脚的人类，尤其是那条鲜艳的红围巾，看着就像神社里的符纸一样暖和。\n莉莉白趴下身子，对着泥土呼了一大口暖气。\n咔嚓咔嚓的声音响成了一片。冻土在几秒钟内融化，泥地里，一个个大得出奇的甜萝卜和土豆争先恐后地冒了出来，堆成了好几座小山。\n农艺师和庄长大吃一惊，笔掉在雪地里也顾不上捡。\n“……达瓦里希，这完全超出了播种计划。”庄长手忙脚乱地翻看报表，“这些萝卜本该在明年夏天成熟，现在才一月！表格上可没有妖精这一栏啊，我的报告该怎么写？”\n莉莉白飞下来，从小篮子里掏出一颗浸过温水、甜丝丝的红浆果，塞进了庄长的嘴里。\n庄长一下子闭了嘴。他嚼了嚼那颗浆果，脸上的愁容在清甜的味道里融化了。他看了看满地的萝卜，又看了看旁边那个在天空中翻跟头的小白影子，索性把手里写满公式的报表扔进了雪地里。他一屁股坐在大萝卜堆上，掰开一个甜美多汁的萝卜，大口嚼了起来。反正冬天已经过去了，去他的计划表格吧。"
KNM.38.a:0 "“那里的达瓦里希，表情好严肃呀。”"

KNM.39.t:0 "茶杯里长出绿嫩芽"
KNM.39.d:0 "大雾笼罩着临街的窄门，石板路上湿漉漉的，带着江水潮湿的腥气。\n昏暗的茶馆里，几个裹着粗布绑腿、大衣有些破损的军官围坐在缺角的方木桌旁。桌上搁着几块干硬的锅盔饼，盖碗茶里的粗茶渣泛着焦苦的涩味。由于连年的战事，大家都有些疲惫，靠在竹椅上沉默地抽着烟草。\n“格老子，这饼硬得能砸死鬼子，牙齿都要咬断喽。”\n话音刚落，一抹雪白的身影毫无预兆地从大雾里飞进来，轻飘飘落在装满茶渣的盖碗边缘。莉莉白歪着头，看着这些嘴里吐着白烟、愁眉苦脸的人类。她觉得这个地方全是浓雾，亲切得很，便高兴地对着茶碗吹了一大口暖气。\n茶碗里那些原本已经泡烂、发黑的苦茶渣突然在暖和的气息中舒展开来。它们吸饱了水分，在众人的注视下，迅速抽出一枚枚嫩绿的茶芽，散发出雨后新茶的清香。不仅如此，柜台上那株插在破泥罐里、早已干枯的腊梅枝，也突然绽开了一朵朵蜡黄、清香的花苞。\n茶馆里顿时安静得连一根针掉地上都能听见。\n“要得！要得！”老板最先反应过来，手里的旱烟袋啪嗒一声砸在地上，整个人差点从竹椅上翻过去，“青城山的仙姑下凡喽！这是仙术啊！”\n“莫瞎说，依我看这是峨眉山的仙子，专程送吉兆来喽！”旁边的军官猛地一拍大腿，激动得满脸通红，当即恭恭敬敬地从兜里摸出一包红糖和两粒花椒，用红纸包好递了过去，“仙姑，尝尝我们四川的土产……”\n莉莉白好奇地咬了一口花椒，麻得舌头直打颤，一连打了好几个响亮的喷嚏。她觉得这颗红红的小果子实在太古怪了，便扑腾着小翅膀，高高兴兴地重新飞回了浓雾深处。茶馆里，一群人正围着那杯长满嫩芽的盖碗茶，争论着这位“白衣仙姑”到底是哪座道观的护法。"
KNM.39.a:0 "“红红的小果子好麻呀。”"

KNM.40.t:0 "木桌子上长出新树枝"
KNM.40.d:0 "在市中心街角的一家小餐馆里，留声机正有气无力地放着欢快的爵士乐。\n柜台前，两个穿着旧风衣的职员正端着粗陶杯，对着里面黑糊糊的液体叹气。由于最近物资管制，现在的咖啡全是用劣质菊苣根磨出来的代用品，喝起来黏糊糊的，像一碗刷锅的水。\n“乔，我发誓，这杯黑水迟早要把我的胃给烧穿。喝完它，我整个人都在发昏。”\n话音刚落，一抹雪白的身影轻飘飘地从大开的窗户外飞了进来。莉莉白歪着头，看着这些在冷铁椅子里缩着脖子的人类，还有这个冷清清、连一点绿色都没有的屋子。她觉得他们实在太可怜了，便对着面前那张粗糙的松木长桌用力吹了一大口暖气。\n这张桌子是用原色松木拼成的。随着这股温柔的微风，木料缝隙里的松脂突然开始渗出甜丝丝的香气，紧接着，一抹抹嫩绿的松针在众人的注视下，活生生从木纹里钻了出去，甚至还长出了一小截毛茸茸的新树枝。\n餐馆里顿时一片寂静。\n“乔，”旁边的同伴眨了眨眼，手里的汤匙滑落进杯子里，“快，扇我一巴掌。我大概是被那杯代用咖啡毒出幻觉了。我看到桌子在发芽，还看到一个长着翅膀的小人在冲我们笑。”\n“啪！”一声清脆的耳光响过。\n“醒了吗？”\n“没有……那个小人还在。她甚至在咬你刚放在桌上的那一分硬币。”\n莉莉白用小牙齿咬了咬那枚硬币，硬邦邦的，差点崩了门牙。她嫌弃地把硬币吐在桌上，拍打着小翅膀，高高兴兴地重新飞回了窗外的夜空深处。\n“噢，她飞走了。幻觉消失了，谢天谢地，我刚才真的以为自己疯了……”乔揉着红肿的脸颊，松了一口气。\n然而当他们低下头时，那条长着松针、滴着新鲜松脂的新树枝依然结结实实地横在桌子上，散发着好闻的森林香气。\n还没等他们想明白，餐馆老板已经举着粗木棍气急败坏地从厨房里冲了过来，对着他们大声咆哮：“该死的！你们两个对我的桌子做了什么？！我的古董松木桌全毁了！你们今天必须赔偿我的损失！”\n只留下两个职员捂着脸，看着那张还在顽强抽芽的木桌，欲哭无泪。"
KNM.40.a:0 "“这个亮闪闪的圆片片，一点也不好吃。”"

KNM.41.t:0 "紫色缝隙里的怪姐姐"
KNM.41.d:0 "博丽大结界的边缘，空气里突然凭空裂开了一条黑乎乎、亮着无数紫色眼珠的恐怖缝隙。\n我正拉着大酱的手在草地上散步，一个穿着洋装、手里拿着折扇的漂亮女人，便慢吞吞地从那条缝隙里坐了出来。她用扇子遮住半张脸，用一种深不可测、听起来让人有些发毛的声音对我说：\n“小家伙，你最近带着大家在大结界上钻了好多洞呢。要是结界漏风了，我可是会很困扰的。”\n大酱被那些密密麻麻的眼珠子吓得直往我身后钻。但我看着那个坐在缝隙里、看起来懒洋洋的女人，完全感觉不到害怕。那些在黑色缝隙里转来转去的眼珠子，圆滚滚、亮晶晶的，看起来特别像地精大叔们喜欢玩的彩色弹珠。\n“大姐姐，你的弹珠真好看。你要吃刚摘下来的甜樱桃吗？”\n我从小篮子里端出一木碗甜茶，上面还飘着两颗洗得干干净净的红樱桃，垫着脚尖，高高地递到了她的跟前。\n那个漂亮的姐姐僵在了半空。她那双深邃、仿佛看透了千百年岁月的眼睛微微睁大，有些迟疑地盯着我手里那碗茶。她大概没料到有人会把她的隙间眼珠当成弹珠，更没料到这个擅自破开结界的“犯人”会大模大样地请她吃水果。\n最后，她有些挫败地叹了口气，用折扇在我的脑门上轻轻敲了敲。\n“真拿你们这些不长脑子的妖精没办法。”她接过木碗，嘴角带上了一丝有些放松的笑意，“看在这碗茶的份上，以后我把结界的隔阂弄得软和一些，让你们飞得更轻松些。不过，不许往我的缝隙里扔大蒜哦”\n说完，她便撑起阳伞，慢悠悠地缩回了那条黑乎乎的缝隙里。大结界似乎真的在一瞬间变软了，像是一层暖洋洋的、随时可以穿过去的透明薄膜。"
KNM.41.a:0 "“那个缝隙里的姐姐，其实不坏呢。”"

KNM.42.t:0 "亮晶晶的花朵冰雕"
KNM.42.d:0 "阳光透过树叶落在大草地上。我蹲在花坛边，刚用暖烘烘的气息吹开一朵小小的黄花，就高兴地拍着翅膀跳了起来。\n“春天来啦！大酱！琪露诺大人！”\n还没等我把手里的花瓣展示给大家看，一阵冷风就从屁股后面刮了过来。紧接着，那朵刚舒展开的小黄花就发出了咔嚓咔嚓的声音，被封在了一块亮晶晶的冰疙瘩里。\n“哈哈！这下子它就不会谢了！”\n琪露诺大人踩着冰块，得意洋洋地飘在半空。她挥舞着小拳头，大声宣布这是她最伟大的艺术品。大酱在一旁有些不好意思地拉着她的袖子。\n我气得在地上直跺脚，拍着翅膀在后面追她。冰块在阳光下反射着刺眼的光，我们在湖边的草地上绕了一圈又一圈。虽然我的花被冻坏了，但看着那块冰在暖和的阳光下慢慢化成亮晶晶的水滴，顺着草尖落进泥土里，大家最后还是在草地上笑成了一团。\n那时候的太阳，总是这么暖和。"
KNM.42.a:0 "“琪露诺大人最讨厌了！”"

KNM.43.t:0 "风车怎么不转了呢"
KNM.43.d:0 "平原上矗立着一栋栋奇形怪状的木房子，屋顶上还长着四片巨大、正在呼呼转动的木翅膀。那些本地的人类管它们叫风车。我觉得那些风车一定是某种受了伤、在痛苦挣扎的木头怪兽，因为它们在风里转动的时候，总是发出吱呀吱呀的刺耳惨叫。\n我飞了过去，落在其中一片巨大的木叶片上。我抱住那根粗糙的木头，用春风吹拂着它。木叶片上的水汽迅速化开，原本干枯的木料开始疯狂抽芽，长出大片大片绿油油的常春藤和亮晶晶的花苞。\n木翅膀越转越慢，最后被那些茂密的藤蔓彻底卡住，一动不动了。我有些得意，觉得这只怪兽终于被我的魔法治好、可以安静地晒太阳了。\n当那个缠着围巾的人类农夫揉着眼睛从磨坊里走出来时，他整个人都傻了。他看着自己那座在一瞬间开满了鲜花、彻底变成了一棵大绿树的磨坊，还有坐在叶片上友好朝他挥手的白色小妖精，手里的烟斗啪嗒一声掉在了泥地里。他可能这辈子都没想过，自家的风车也会有开花的一天。"
KNM.43.a:0 "“大木头怪兽，现在不疼啦。”"

KNM.44.t:0 "甜甜小松饼"
KNM.44.d:0 "地精们居住的乱石窟里光线暗淡，空气里弥漫着一股潮湿的泥土和劣质松脂的焦味。几十个皮肤粗糙、长着宽大耳朵的大家伙正围着一堆残火剔牙，脚边横七竖八地丢着缺口的铁镐。我抱着装满水果和松饼的竹筐，慢慢走了进去。\n领头的大地精猛地站了起来，他那宽大的肩膀几乎把背后的火光遮得严严实实，嗓音粗哑地吼着，问我是不是红魔馆派来催租的。但我丝毫没有退却，仰起头，将一块还带着炉灶余温的甜松饼递到他满是伤痕的掌心里。他迟疑了一下，塞进嘴里大嚼起来，原本紧绷着的厚嘴唇慢慢松弛了下来。\n“车间里太冷清了，大叔们愿意帮大家一起去干活吗？每天都有热乎乎的松饼呢。”\n我一边说着，一边伸出手，用帕子去擦他下巴上粘着的灰尘。他那宽大的身子僵了僵，有些无所适从地挪了动粗壮的脚踝，大眼睛盯着我手里那只散发着面粉香气的竹筐。周围的那些地精也慢慢放下了手里的铁锤，粗重的呼吸声在昏暗的石窟里此起彼伏。对于这些习惯了敲打冷铁、整日与灰土为伍的大块头来说，这点微不足道的香甜与干净，确实是他们很久没有见过的东西了。"
KNM.44.a:0 "“地精大叔们，其实很好商量呢。”"

KNM.45.t:0 "未来的花种"
KNM.45.d:0 "在靠近东边国境的一处泥泞战壕里，倒着一顶灰色、沉甸甸的铁帽子。\n铁帽子在泥水里泡得有些生锈，旁边还散落着几张浸湿了的、写满外国字的小纸片。我拍着翅膀落在铁帽子的边缘，本以为里面会像红魔馆大烟囱下面那样全是焦黑的毒药，却在帽子最深处的钢盔内衬缝隙里，发现了一粒干瘪的小种子。\n这是一粒矢车菊的种子。那些排放着黑烟、把大家变成泥土的坏人，在出门打仗的时候，口袋里居然也悄悄藏着一粒故乡的蓝色花种。\n他们也是喜欢花的。\n我看着这粒种子，手心有些发热。我把它从小帽子的钢盔里拿出来，埋进了战壕里潮湿的稀泥里。趴下身子，对着那块泥土吹了一口暖和的春气。\n嫩绿的小叶片几乎在眨眼间就顶开了稀泥，在泥地里开出了一朵小小的、蔚蓝色、像天空一样好看的野花。在那些生硬的钢铁和战火旁边，这朵小蓝花在风里轻轻晃动，散发着微弱的香气。\n“等不打仗了，这里也会开满蓝色的小花吧。”我对着小蓝花小声说着，拍着翅膀重新飞回了天空中。"
KNM.45.a:0 "“大家，其实都想要春天啊。”"

KNM.46.t:0 "地精大叔不高兴了"
KNM.46.d:0 "红魔馆外围的铁器车间里，今天安静得有些反常，听不见半点往日沉重的锻铁声。\n几十个地精正抱着胳膊坐在门外的碎石堆上，个个耷拉着嘴角，把沉重的铁锤随便扔在泥地里。高炉的烟囱已经冷了下去。\n前几天，妖精们为了让工厂看起来生机盎然，跑进去在所有的传动皮带和风口里塞满了茂密的青苔与牵牛花。结果，湿漉漉的草叶缠在传动带里，解都解不开，高炉的火也被湿青苔彻底闷死，炉温一降，什么铁也敲不出来了。\n“铁器需要烈火。风口塞满了湿草，炉子连火都升不起来，我们还怎么干活？”领头的地精指着那些被杂草卡住的铁管，粗声粗气地朝我嚷嚷，两只耳朵气得微微发抖。\n我知道自己做错了事，看着那些不冒烟的烟囱，不好意思地攥着裙角。我上前把白裙子挽到膝盖上面，蹲在黑乎乎的泥水洼里，跟着大叔们一起把管道里的湿草一根根扯出来。泥水黏在手掌上，又脏又黏，我的手指很快就被坚硬的铁构件割出了几道浅浅的红印。\n领头的地精看了看我，叹了口气，伸出长满厚茧的大手，一把将我从污水里拎到了干燥的木箱上。他自己蹲下身，两三下就用粗壮的手指扯断了那些缠绕在转轴深处的坚韧藤蔓。\n干完活，我从小篮子里掏出用干草包着、还温着的烤红薯，递到了他们沾满黑油的手掌里。\n“以后里面的机器全交给大家管，我们只在围墙外面种些吸烟的小花，再也不去碰里头的铁管了。”我用沾了温水的手帕，轻轻擦去他额头上的汗水。\n闻着烤红薯的香气，地精们互相看了看，原本紧绷着的绿脸慢慢松了下来。他们抓起红薯塞进嘴里，一边含糊不清地嘟囔着，一边重新拎起沉铁锤，在叮当的炉火声里敲打了起来。"
KNM.46.a:0 "“地精大叔们也很善良呢。”"

KNM.47.t:0 "这里总会开满小花"
KNM.47.d:0 "东边那条曾经满是战壕和铁丝网的边境线，如今已经变成了一片起伏的绿色山坡。\n我拍着翅膀落在山坡上。那些焦黑的泥土和难闻的煤烟气味全都不见了，空气里满是泥土湿润的芬芳。\n那顶曾经装过小花种、沉甸甸的灰色铁帽子，此刻正半埋在松软的草地里。里面的钢盔内衬早就被雨水洗得干干净净，几只淡黄色的小鸟正在里面筑巢，叽叽喳喳地唱着歌。\n铁帽子旁边，坐着一个穿着破烂衣服的普通人类。\n他的右袖管空荡荡的，在风里微微摆动。他不曾戴着钢盔，也未曾拿着那根生硬的铁枪，安静地坐在草地上，看着满山遍野、正迎风摇曳的蓝色矢车菊。\n听到翅膀拍动的声音，他转过已经被温和的阳光晒得有些黑红的脸，眼神里满是平静与温存，用那只仅剩的左手，轻轻折下一朵蓝色的小花，小心意意地放在了那顶生锈的铁帽子上。\n“谢谢你，小妖精。”他看着我，有些粗糙的脸上露出了温和的笑容，“我回家了。故乡的花，真的很美。”\n我其实听不懂他说的“故乡”和“家”是什么意思。但我能感觉到，他的手心是暖和的，他的心里也散去了那种冷冰冰的害怕。\n我冲他高兴地笑了笑，拍打着翅膀，在漫山遍野的蓝色花海里绕了一个圈，高高兴兴地飞向了高空。春风把这些蓝色的小花粉带得很远，很远。大家现在，全都暖和起来了。"
KNM.47.a:0 "“大叔，春天已经到啦。”"

KNM.48.t:0 "大雪人也是很温柔的"
KNM.48.d:0 "大雪铺天盖地落下来，寒风在光秃秃的树枝间发出呜呜的声音。\n我（莉莉白）抱着冻得发麻的手指，缩在一块大石头后面。我一直以为冬天全是坏东西，所以连带着也有些讨厌起眼前这个正坐在雪堆上、穿着白蓝色衣服的雪女大姐姐。\n蕾蒂·霍瓦特洛克拍了拍衣服上的雪花，慢吞吞地朝我走过来。她叹了一口气，伸出那只冰凉却意外地有些柔软的手，轻轻摸了摸我的脑袋。\n“小家伙，你把冬天和那些东边的怪物弄混了呢。”\n我有些委屈地缩了缩脖子：“可是……冬天的风会把大酱她们变成泥土，还会把小草熏黑，大家也都在发抖……”\n“冬天的风确实很冷，但那里面是有区别的。”蕾蒂摇了摇头，指向东边那片在阴影里蠕动的灰色雾气，“大自然的冬天，是让大家舒舒服服地睡个大午觉，等积雪融化的时候，春天才能更有力气地醒过来。那是温柔的睡眠。而东边那个冬天，是会把生命彻底掐断的、坏透了的冬。它抢走了你的春天，还不打算让大家醒过来。”\n她从雪地里刨出一根冻得结结实实的草根，指着上面白亮的霜花。\n“看，我的霜花只是在保护种子。我们要去打败的是那个不讲道理的坏冬天。让大家睡觉的好冬天可不是我们的敌人。听懂了吗，小春精？”\n我看着那根在霜花保护下完好无损的草根，有些懵懂地了点头。原来，大雪人是温柔的好冬天。而我们要去对付的，是东边那个抢走春天的坏冬天。等把那个坏冬天打跑了，好冬天就能安心地让大家睡觉啦。"
KNM.48.a:0 "“原来大雪也是在保护大家呀。”"

KNM.49.t:0 "草地上按了两个小手印"
KNM.49.d:0 "湖边的草坪上摆着一张有些开裂的矮木桌。\n我拿着一盒红红的朱砂，把它放在了木桌子中央。地精首领挠了挠大耳朵，有些局促地站在旁边。他粗壮的绿手指上还粘着陈旧的机油，宽大的脚板在泥地里不安地蹭着。\n灵梦站在旁边，她用笔在泛黄的纸张上写下了好多字。她说这是确立我们和地精大叔们共同生活的盟约。以后大家不用再躲着红魔馆的皮鞭，大家是一样的居民，可以平分地里收上来的土豆和水果。\n“俺不会写字。”地精首领瓮声瓮气地嘟囔着，有些不好意思地把大手往围裙后面缩。\n“没关系，按手印就好啦！”\n我高兴地伸出小手，在红红的朱砂里用力按了按，然后在纸张的右下角拍出了一个小小的、有些歪斜的红色掌印。\n地精首领看着那个还没有他一根手指大的红印，裂开大嘴笑了。他也伸出大手，小心翼翼地在我的小掌印旁边落了下去。那只大大的手掌，在纸面上留下了一个粗糙的印记。整个桌面似乎都跟着震了震。\n阳光落在粗糙的纸页上，一大一小两只掌印靠拢在一块，像是在泥土里并排长出来的两朵野花。在这片时常被风雪和黑烟笼罩的边界上，这片大草地，从今天起就是我们共同的家了。"
KNM.49.a:0 "“拉拉手，以后大家就是一家人啦。”"

KNM.50.t:0 "大小姐端着红茶看热闹"
KNM.50.d:0 "红魔馆二楼的长廊里，我（咲夜）看着底下闹哄哄的大厅，额头上的青筋正一跳一跳的。\n大厅名贵的红地毯上结了一层滑溜溜的冰，几个小影子正排着队从楼梯扶手上大呼小叫地滑下来，把昂贵的大吊灯撞得晃来晃去。\n“大小姐，妖精们已经把西侧的客房全铺满了干草和烂泥。如果再不采取措施，这栋宅子就要彻底变成沼泽了。”我握着腰间的飞刀，极力压抑着声音里的怒气。\n蕾米莉亚坐在红木椅子上，优雅地端起瓷杯，抿了一口红茶。她看着底下那个正在指挥地精搬木板、忙得满头大汗的白色小妖精，眼里反而带着一丝新奇。\n“算了，咲夜。反正平时这地方也太安静了。”她放下茶杯，有些慵懒地撑着下巴，“而且，你不觉得她们把大厅的吊灯擦得比你平时擦的还要亮吗？既然她们能把那些讨厌的黑烟挡在大门外面，让这里有些生气，那就随她们去吧。”\n我顺着她的视线看去。虽然大厅里一片狼藉，但原本死气沉沉的红魔馆，现在确实充满了清脆的笑声和温暖的风。我叹了口气，默默把飞刀收回了袖子里。\n“那么，我去给她们准备一些甜点和红茶，大小姐。”"
KNM.50.a:0 "“唉，今天也只能这样了。”"

KNM.51.t:0 "门卫小姐在画大圆圈"
KNM.51.d:0 "红魔馆的大铁门前，红美玲正扎着马步，两只手在半空中慢吞吞地画着大圆圈。\n“嘿……哈……这是太极，懂不懂？”她一边擦汗一边向旁边探头探脑的妖精们炫耀，“气沉丹田，万物皆空。只要本姑娘这一掌过去……”\n话音未落，莉莉白飞了过来，落在了她的绿帽子上。美玲的身子一僵，两只手还停在半空中画圆，眼珠子拼命往上翻，试图看清头顶上的小家伙。\n“门卫姐姐，你是在玩定住不许动的游戏吗？”莉莉白歪着头问。\n周围的妖精们以为这是一种新游戏，呼啦一下全飞了过来。有的学着美玲的样子扎马步，有的在半空中跟着乱画圆圈。几十个小翅膀嗡嗡响，在美玲身边绕成了一个乱糟糟的旋涡。\n“哎呀，别闹，我是在练功……哎呀，好痒！”美玲被妖精们的翅膀尖扫到脖子，痒得直缩脖子，脚下一滑，一屁股跌坐在地毯一样的草坪上。\n正当她揉着屁股叹气的时候，二楼的窗户推开了，咲夜面无表情地探出头，手里还拿着亮闪闪的飞刀。\n“美玲，大小姐问你，大清早在院子里带着妖精们转圈，是红魔馆的新娱乐项目吗？”\n美玲吓得一缩脖子，赶紧从怀里掏出两个热包子塞给莉莉白，合起双手拼命告饶：“仙姑们，求求你们快飞走吧，再闹下去，我今天晚上的饭盒就要被咲夜没收了！”\n莉莉白抱着包子，咯咯笑着飞走了，留下美玲一个人在草地上手忙脚乱地捡着帽子。"
KNM.51.a:0 "“包子香喷喷的，门卫姐姐真好玩。”"

KNM.52.t:0 "花朵都在朝土里长"
KNM.52.d:0 "鬼人正邪抱着胳膊站在刚种好的花田边，看着那些开得规规矩矩的迎春花，脸上满是不屑。\n“天天‘春天来啦’，烦都烦死了。凭什么春天就要在上头，冬天就得在底下待着？”\n她趁着妖精们都在睡觉，悄悄溜进花田，用手把那些刚长出来的小花一朵朵拔出来，倒着插回泥土里。她拍了拍手上的泥，看着那些花根朝天、花瓣朝地的滑稽模样，发出了得意的坏笑。这些人循规蹈矩地活着，全翻过来才好玩。\n第二天莉莉白一摇一摆地走过来，也不恼，只好奇地蹲下身，瞅着那几朵花看了好半天。\n“哇，正邪姐姐，你是在帮花朵挠痒痒吗？”莉莉白拉着正邪的袖子，把一碗甜甜的果汁递给她，“它们在土里一定很暖和。正邪姐姐心肠真好。”\n正邪僵在原地。原本打算看妖精们哭鼻子，可迎来的却是一张亮闪闪的笑脸。那股别扭脾气一瞬间被春风吹得散了架，有些气急败坏地夺过茶碗，一口气灌了下去。\n“多管闲事！我最讨厌甜东西了！”\n她大声嚷着，把空碗扔回莉莉白怀里，气呼呼地转过身走了，一路上还顺手把几朵倒插的花又给正了回来。"
KNM.52.a:0 "“正邪姐姐走起路来，像个不倒翁呢。”"

KNM.53.t:0 "大本子上有两朵小花"
KNM.53.d:0 "人类村庄的边界登记处里，桌上摊着一本厚厚的、泛黄的公文。登记员揉了揉发酸的太阳穴，盯着眼前的申请书。\n在“申请国名”那一栏里，什么字也没有。只有一个用泥巴印上去的、歪歪扭扭的脚丫子印，旁边还粘着两瓣已经干枯的小花。\n“听着，小家伙，”登记员指着那个泥印子，试图对飘在茶壶上的白色妖精讲道理，“这里必须写字。你们国家的正式名字到底叫什么？”\n莉莉白歪着头，咬着一根草茎：“花花！开满花的花花！”\n“……花花？”登记员叹了口气，在纸上落笔，“那就叫，花花乐园。那么，你们的签字……”\n莉莉白高兴地飞过来，一脚踩在旁边的墨水池里，接着“啪”地一声，在纸上按了一个黑乎乎的脚印。\n这份公文就这么被送到了外面那些势力的桌上。没过几天，隔壁的领袖们纷纷发来公函，甚至还有学者写了长长的文章，他们拍着桌子，非说“花花”这两个字大有深意，是什么对传统秩序的无情戏谑；而那个泥巴脚印，则是人地相依、血脉相连的无上昭示。”"
KNM.53.a:0 "“大家都觉得我们的名字很好听呢！”"

KNM.54.t:0 "大家突然变穷了是什么意思？"
KNM.54.d:0 "湖边的空地上，几只小妖精正围着一个挑着扁担的人类商贩，急得直拍翅膀。\n大妖精把一捧亮闪闪的硬币捧到商贩面前，想要换几包甜滋滋的红豆团子。这些硬币是之前从圣杯王国来的商人手里换来的，以前在人类村庄里好用得很。\n可商贩连连摆手，叹着气说：“不行啦，小祖宗们。隔壁海那边的圣杯王国没钱了，银行全倒闭了。现在这些硬币根本买不到团子，大家都吃不起饭了，这钱在外面已经不值钱了。”\n妖精们面面相觑，完全听不懂他在说什么。\n“硬币明明还是闪闪发光的呀，也沉甸甸的，怎么就不能换团子了呢？”\n商贩摇着头，挑起扁担走了。大家抱着一堆金属小圆片，有些发懵地坐在木头上。\n“我们好像变穷了。”大妖精吸了吸鼻子。\n“变穷是什么意思？”莉莉白歪着头问。\n“就是这些亮闪闪的圆片片死掉了，不能换好吃的了。”\n大妖精把怀里那些印着圣杯王国女王头像的纸钞拿了出来。这些原本能换来好几车红豆的漂亮纸张，现在连一张薄薄的饼都换不到了。大家看着这些废纸，觉得扔了怪可惜的。莉莉白伸手摸了摸，发现它们其实挺软和。\n“那我们把这些小纸片塞进树洞里，铺在小床上睡觉吧，一定很暖和。”\n大家一听，高兴得欢呼起来。虽然吃不到甜团子了，但今年的冬天，大家的小床肯定比以前要舒服得多。"
KNM.54.a:0 "“暖和的小纸片，比金币好用多啦。”"

KNM.55.t:0 "绝不向春风投降"
KNM.55.d:0 "从幻想乡吹来的那些暖风危险至极。报告显示，前线的士兵正在战壕里丢掉武器、看着刚发芽的花朵失声痛哭，后方兵工厂的劳工们也开始消极怠工、吵着要实行什么阳光和假期的制度。这是一场蓄谋已久的、针对帝国意志的无形打击。\n那群住在雾之湖的妖精，正在用这种不可思议的方式融化我们的工业与防线。如果放任这股邪风继续吹拂，我们的秩序和钢铁意志将在明天清晨彻底瓦解。大本营已经下达了绝对的命令：立刻出兵，彻底踏平那个叫作雾之湖的妖精巢穴，将这股该死的春风彻底掐灭在源头！"
KNM.55.a:0 "“那么……我们有把握吗？”"
KNM.55.b:0 "这已经不是我们要考虑的事情了"

KNM.56.t:0 "春天已然到来"
KNM.56.d:0 "沉闷的工厂汽笛今天清晨没有响起来。\n乔（工人）推开那扇布满红锈的铁窗户，原本习惯性地想要用衣袖去挡刺鼻的煤烟，却在暖和的微风吹在脸上时，愣在了原地。\n外头的废土上，原本用来运送煤炭的铁轨已经被一层松软的绿苔悄悄覆盖。几朵金灿灿的迎春花正从一台报废的高炉阀门里钻出来，在风里轻轻地晃。空气里难闻的硫磺味消散了，此刻全是湿润新泥和甜茶的清香。\n那个在天空中飞舞、大声叫喊的小白影子，当真把暖和的风吹进了千家万户的窗格。大伙瞅着窗外的迎春花，这才恍惚回过神来——日子原本可以不用过得像木偶那般生硬。人们在温暖的阳光下相视而笑，乔拍了拍大衣上的煤灰，嘴里哼起了一首他以为自己早就忘记了的、关于春天的儿歌。"
KNM.56.a:0 "“谢谢你，春之妖精！”"

KNM.60.t:0 "如果他们再也不会开花"
KNM.60.d:0 "大烟囱倒塌的废墟上，现在已经长满了绿油油的嫩叶，无数的迎春花开得像一片金色的海。大酱和琪露诺大人拉着手在前面跑着，大家都在大声欢笑。\n我拍着翅膀跟在后面，却在废墟的角落里，停在了一棵高大的橡树前。\n这棵老橡树的树皮全被大火烧焦了，黑乎乎的，像一具巨大的骨架。别的树都已经在春风里抽出了嫩芽，可它的枝丫依然干枯、发凉，上面落满了旧年的灰。\n我飞过去，抱住它那焦黑的树干，用尽全力呼出一口口春风。我吹了好多下，吹得喉咙都有些干涩，可老橡树一动不动，它的树干里听不到树液流动的声音，也看不见绿叶长出来。它已经彻底死去了。\n“莉莉，别吹啦，这棵树已经死掉啦，它不会再开花啦。”琪露诺在后面喊着，想要拉我走。\n摸着那些粗糙、焦黑的树皮，有些难过地低下了头。原来在大火里伤了根骨的老树，哪怕等来再暖和的春风，也是再也醒不过来了。\n我从小篮子里摘下一朵漂亮的野花，轻轻放在了老橡树黑乎乎的树根下。\n“对不起哦，老树大叔。”我小声地对它说着。\n虽然它再也听不见春天的歌声，但我知道，新长出来的那些绿草和花朵，会替它一起在阳光下长大。我擦干眼泪，拍打着翅膀，重新飞回了大家吵闹的笑声里。春天很美，但也有些树木，永远留在了那个冬天的废墟里。"
KNM.60.a:0 "“老树大叔……晚安哦。”"

KNM.61.t:0 "春天来啦，大家醒醒呀"
KNM.61.d:0 "湖边的草坪暖暖的，风吹过来全是甜丝丝的味道。\n琪露诺大人正跟大妖精在湖面上大呼小叫，冰花在阳光下折射出闪亮的颜色。大家都笑得好开心，声音传得好远。\n坐在大树的阴凉里，看着她们打闹。白裙子被风吹得轻轻飘动，背后那双在火光里受过伤的翅膀，现在已经感觉不到疼了。\n“莉莉酱！发什么呆呀？”大妖精抱着一捧红艳艳的果子，扑腾着翅膀落到身边。她瞪着眼睛盯着我背后的伤疤，用凉丝丝的手指轻轻戳了戳，“哎呀，这里怎么黑黑的？你是不是又背着大家，偷偷跑进大烟囱里去啦？”\n琪露诺大人也飞过来，对着那些伤疤用力吹了几口气，好像这样就能把灰尘吹掉一样。\n“本小姐不管！虽然颜色很难看，但只要莉莉酱还会飞，我就准许你继续跟着我！”她得意地叉着腰，把一小块冰屑塞进我的手心，“看，这是专门给你的奖赏，快点把这些脏东西洗干净，我们还要去比赛谁飞得快呢！”\n看着她们两张可爱的小脸，我心里好像一下子塞满了那种圆滚滚、热乎乎的满足感。\n她们真的什么都不记得了。\n不记得那场怎么也下不完的黑雪，不记得那些变成烂泥的小伙伴，也不记得我是怎么拖着残破的翅膀，在炮火里把大家一点点唤醒的。对她们来说，这只是稍微长了一点的午觉，睡醒了，就能继续在草地上玩耍。\n既然大家都这么开心，那就不用记得那些坏事啦。\n我把手心里那一小块闪着金光的冰紧紧攥住，用力拍动着那双有些笨拙的翅膀。\n“好！比赛就开始吧！”\n我喊着，一头扎进了那阵吵吵闹闹的笑声里。能听见她们的打闹声，能看到她们的笑容，能闻到这漫山遍野的花香……我就觉得，自己是世界上最幸福的妖精了。"
KNM.61.a:0 "“大家，都很开心！”"

KNM.62.t:0 "明年春天再见吧"
KNM.62.d:0 "繁花已经落尽，树梢上木叶成荫。温暖的春风正渐渐平息下去。\n远远望去，琪露诺大人和大酱正坐在湖畔的大石头上，分享着好吃的零食，清脆的笑声顺着平静的水面飘得很远。\n眼皮变得有些沉重了。作为春之妖精，每当春天的尾声悄悄到来，和煦的风平息下去，沉重的睡意就会在耳边呢喃，呼唤着回到山谷里，沉沉睡去，直到下一个春日。\n以前东边刮过来的毒雾，熏得翅膀发烫，根本无法安稳睡下。更重要的是，大酱和琪露诺大人的灰泥就贴在胸前。如果闭上眼睛，雾之湖最后的一点温度就会消失，手里的泥土也会彻底冻成坚硬的死石。为了护住最后的一点春天，只能用尽力气，在黑雪里拼命睁大双眼，一次也不敢睡去。\n可是这一次，心里一点也不害怕了。 \n大门外那些高耸的烟囱彻底倒了，那个不讲道理的坏冬天再也不会回来了。\n我知道，等明年的第一缕春风吹过山脊，我睁开眼睛的时候，琪露诺大人和大酱，一定已经手拉着手，在暖洋洋的湖边草地上等着我了。\n我的白裙子在微风里轻轻晃动。在一处铺满软和草叶的树洞里坐下，收起那双落了疤的翅膀，脸颊埋进带有阳光余温的落叶堆里，甜甜地闭上了眼睛。"
KNM.62.a:0 "“明年春天，再见吧。”"

KNM.63.t:0 "故事书里的春风"
KNM.63.d:0 "学堂里，新送来的桌椅散发着好闻的清香。窗外的阳光洒在书页上，泛着暖洋洋的金色。\n老先生翻开新编的历史本子，在上面一笔一画地写下关于那场伟大战争的字迹。\n凡人是会记得这一切的。那些在防线上留下的伤疤、在大雪中失去的亲友、以及在冰天雪地里挨饿的滋味，都刻在大人们的骨头上。人类的纸笔很重，历史也很长，大大小小的纪念册会留存那些生硬的教训，世世代代地传下去。\n“先生，妖精们也和我们一样受过伤吗？”坐在底下的孩子指着窗外问。\n窗外的集市上，琪露诺大人正指着一筐刚运来的樱桃，神气地嚷嚷着那是她用魔法冻出来的。大妖精和莉莉白拉着手在后面笑，手里还拿着没吃完的饼干。她们飞快地在人群里钻来钻去，脸上满是金灿灿的阳光。\n老先生看着她们无忧无虑的笑脸，摘下眼镜，揉了揉发酸的眼角。\n“不曾有过，孩子们。”他温和地合上了那本写满了泪水与废墟的本子，“妖精们不曾受过伤。她们只是在冬天里睡了很久的午觉，等睁开眼睛的时候，就把明晃晃的阳光和花朵，重新带回这个世界上了。” \n人类会默默背负起所有的记忆，建起沉重的纪念碑，将所有的苦难都记在纸上。但只要看到这些一无所知、依然在草地上大声打闹的小家伙，大人们就会觉得，手上的伤口不那么疼了。因为，这些一无所知、在春风里傻笑的孩子，就是这个世界重获和平的、分外珍贵的凭证。"
KNM.63.a:0 "“她们……只是睡了个午觉。”"

KNM.58.t:0 "别让大家受伤"
KNM.58.d:0 "车间里的风箱呼啦呼啦地响着，烧红的铁水在槽里翻滚，散发着刺鼻的焦铁味。\n一个绿皮肤的地精大叔正咬着牙，把一块烧红的铁砧按在案板上。大锤落下来的时候，火星像小雨点一样飞溅。突然，他发出了一声闷哼，粗壮的大手指被飞溅的火星烫到，瞬间冒出了一小股白烟，皮肉烧焦的味道在空气里散开。\n他却只是把手指含进嘴里吮了吮，红着眼，继续用力敲打着那块盾牌。\n我站在旁边，捧着香喷喷的甜点，在大火和汗水跟前，手里忽然有些发轻。原来地精大叔们每天都在忍受这样的疼痛，他们是在用自己的皮肉和骨头，在为大家制造挡子弹的铁家伙。这根本不是什么好玩的“敲铁游戏”。\n我走过去，拧干了凉丝丝的湿手帕，轻轻敷在他那根肿起来的大手指上。\n“对不起，大叔。我不知道这里这么疼。”我小声说。\n地精大叔看着我，有些局促地想把手缩回去，最后还是顺从地让我敷着。他粗声粗气地说：“铁器生来就是硬的，不烫就做不出好盾。妖精姑娘，别在这里待着了，这里到处都是灰，会弄脏你的白裙子。”\n我没有半点离开的意思，坐在满是灰尘的工具箱上，帮他一下下地吹着红肿的指关节。我决定了，以后每天都要送新鲜的草药膏过来，大铁锤要落下来，但伤口也必须治好。"
KNM.58.a:0 "“大铁锤，原来这么沉啊。”"

KNM.59.t:0 "有些脏东西是洗不掉的"
KNM.59.d:0 "门窗关得很严实，里面的火炉烧得很旺。\n我缩在暖和的草堆里，想要像以前那样飞上房顶去大喊，可刚张开翅膀，上面就抖落了许多黑乎乎、擦不掉的脏东西。大酱和琪露诺大人变成的泥巴就在旁边的盒子里，静悄悄的。\n我到井水边洗了很多次，冷水把手都冻红了，羽翼上的黑斑依然粘在上面，像一块块脏兮兮的补丁。\n“莉莉酱，别洗了，翅膀都要洗秃了。”大酱生前好像也对我说过类似的话。可我一闭上眼，满脑子都是那片黑压压的烟囱和漫天落下的碎屑。\n即使打败了那几个坏人，身上的灰也还是洗不干净。我抱着膝盖在水井边坐了很久。平原的风依然很冷，我不知道该怎么拖着这双变沉了的翅膀，去把那么大的世界都叫醒。我得在水井边多坐一会儿，等翅膀上的水干了，再出发。"
KNM.59.a:0 "“翅膀……变得沉甸甸的了。”"

KNM_corrupted_by_spring_spirit:0 "§R春风消磨了我们的意志§!"
KNM_corrupted_by_spring_spirit_desc:0 "春风正在让我们的兵工厂齿轮生锈，前线的士兵居然在战壕里抱着花朵哭泣，甚至连劳工们都开始抗议、吵着要睡觉！如果不消灭这股风的源头，我们的纪律和荣光将彻底灰飞烟灭。"

KNM_blessed_by_spring_spirit:0 "§9春天已然到来§!"
KNM_blessed_by_spring_spirit_desc:0 "风突然变得暖洋洋的。冰雪融化成了清澈的溪流，土地里钻出了青草。工厂里的工人和地里的农夫觉得身上的疲惫在一瞬间消失了。窗外开出了金灿灿的小花，空气里全是甜茶和新泥的清香。大家觉得日子变得舒服多了，干活也更有了力气。"

KNM_spring.1.t:0 "风里有了一点点温度"
KNM_spring.1.d:0 "尽管天空依然被重重灰雾笼罩，厚厚的积雪也没有融化，但空气里的风悄悄变了。风掠过脸颊的时候，不再像刀子割一样疼，带上了一丝湿泥的气息。\n莉莉白在雪地里蹦了蹦，拍打着翅膀，本能地想要大喊。虽然放眼望去依然是漫天白茫茫的一片，连一片绿叶子都找不到，但地底下的根须已经醒了。这就是春天的脚步，它正藏在冰雪底下一边揉着眼睛，一边努力地想往上钻。大家擦了擦眼角的碎冰，知道最寒冷的日子已经撑过去了。"
KNM_spring.1.a:0 "“春天要来啦！”"

KNM_spring.2.t:0 "大家在冷水里拍浪花"
KNM_spring.2.d:0 "树荫变得茂密起来，头顶上的阳光总是隔着一层厚厚的铅灰色，照在身上不够暖和。大家戴上用草叶编成的小帽子，成群结队地往雾之湖里跳。\n湖水凉呼呼的，甚至有些刺骨，但这阻挡不了大家的兴致。妖精们在前面游得飞快，用碎冰互相打着水仗。只要大家泡在水里，大声地笑着，这就是属于妖精们的夏天。哪怕天不够晴，大家的心里也是暖洋洋的。"
KNM_spring.2.a:0 "“夏天也是暖和的！”"

KNM_spring.3.t:0 "橡子落在干草堆上面"
KNM_spring.3.d:0 "风里开始带上了落叶的焦脆气味。森林里的树叶慢慢变黄了，上面沾着些许擦不掉的灰色粉尘，但在夕阳下看过去，依然像是一片亮闪闪的金子。\n松鼠们忙着在树洞里藏坚果，大家也提着竹筐，在林子里捡那些掉落的橡子和饱满的松果。地精们在作坊外面烤着栗子，热气腾腾的香味和歌声一起飘得很远。秋天踩着干枯的叶子走过来了，它把沉甸甸的果实留给了大家，让每个人的肚皮都能过得饱饱的。"
KNM_spring.3.a:0 "“秋天有好多好吃的！”"

KNM_spring.4.t:0 "白雪落在大树的脚下"
KNM_spring.4.d:0 "大雪纷纷扬扬地落了下来。天空中落下了干净、冰凉的白雪，把那些脏兮兮的灰全盖在了底下。雪片轻飘飘地覆在枯草和松软的泥土上，把整个平原都变成了一张松软的白毯子。\n莉莉白缩在温暖的草棚里，看着窗外那个安静的世界。外面很冷，风也很大，但大家都知道，这只是大自然在让土地好好睡个午觉。等大家在雪被子里睡饱了，明年春天醒过来的时候，一定会比现在更有力气。好冬天是在保护大家，大家只需要闭上眼睛，在炉火旁做个好梦。"
KNM_spring.4.a:0 "“大家在被窝里睡个好觉吧。”"

KNM_spring.5.t:0 "风里全是花香的味道"
KNM_spring.5.d:0 "大结界外面的灰雾彻底散了，天空呈现出大海一样的透亮蓝色。暖洋洋的春风拂过平原，冰雪在一夜之间化成了清亮的小溪，在草丛里叮叮咚咚地流淌。\n莉莉白提着满地跑的裙子，在开满迎春花和风铃草的泥土上飞快地奔跑，扯着嗓子大喊春天的到来。大酱和琪露诺大人也在旁边跟着乱飞，把漫天洒下的粉色花瓣捧在手里。泥土现在松软而甜美，每一粒种子都在拼命破土。这是大家盼望了很久的、最美丽的春天。"
KNM_spring.5.a:0 "“春天真的来啦！”"

KNM_spring.6.t:0 "树荫底下有冰冰的甜水"
KNM_spring.6.d:0 "茂密的绿叶把太阳遮得严严实实，在草地上漏下碎金子一样的亮斑。湖水在烈日下泛着亮闪闪的波光，清凉得让人想要一头扎进去。\n大家戴着用大片荷叶折成的小帽子，在清澈见底的水里扑腾着翅膀。琪露诺大人在前面快活地踩着水花，用刚刚冻好的小甜冰分给大家吃。东边那些沉重的黑烟已经彻底消失了，天空中满是干干净净的蓝，照在身上的阳光暖烘烘的。没有了战争和寒冷，这就是属于大家的夏天。"
KNM_spring.6.a:0 "“夏天也太好玩啦！”"

KNM_spring.7.t:0 "树叶变成了金色叶子"
KNM_spring.7.d:0 "风里开始带上了落叶的焦脆气味。森林里的树叶全变成了纯净的金色和红色，一尘不染，在夕阳下像是一片亮闪闪的宝藏。\n小松鼠在树枝间飞快地跳跃，大家也提着大竹筐，在干爽的落叶堆里寻找那些饱满的橡子和松果。地精大叔们在作坊外面的草坪上烤着栗子，香喷喷的甜味随风飘出好远。秋天踩着干枯的叶子走过来了，它把沉甸甸的果实和饱满的南瓜，都慷慨地留给了大家。"
KNM_spring.7.a:0 "“秋天有吃不完的栗子呢。”"

KNM_spring.8.t:0 "雪花落在暖和屋顶上"
KNM_spring.8.d:0 "大雪纷纷扬扬地落了下来。天空中落下的全是干净、羽毛一样轻盈的白雪，把整片大地都装点得像一盘精致的小点心。\n莉莉白和大家围在暖和的草棚炉火旁，一边吃着甜呼呼的南瓜布丁，一边喝着热气腾腾的甘草茶。外面的雪地上，小动物的脚印一直延伸到远方。虽然天很冷，但大家心里都是热乎乎的。在雪被子下面，小草正做着关于花开的美梦。等大家睡醒了，明年春天，一定会更美丽。"
KNM_spring.8.a:0 "“晚安，好冬天。”"
####新闻####
KNM_news_event_background: "£KNM_news"
KNM_news.1.t:0 "$news_event_background$春之妖精开始进军"
KNM_news.1.d:0 "从西边吹来的风里夹着枯草的味道，掠过边境那些冷冰冰的钢铁炮管。\n\n雾之湖的小妖精们已经越过了边境，飞向那些吞吐着黑烟的巨大要塞。\n这个消息迅速传遍了世界的每一个角落。\n一个依靠歌唱春天存活的自然生灵，正面迎向了那个连神明都要战栗的亡灵帝国。\n\n有人说这是愚蠢的挣扎，\n也有人说这是一场注定无回的悲剧。\n可当第一片沾着黑灰的翅膀落在冰凉的铁轨上时，整片欧洲大陆的平静都被打破了。\n\n嬉闹的时代结束了。\n\n天空中，落满了黑色的雪。"
KNM_news.1.a:0 "春天，真的会回来吗？"

KNM_news.2.t:0 "$news_event_background$春风吹到了世界尽头"
KNM_news.2.d:0 "生硬而庞大的工业齿轮，在今天早晨，在世界的每一个角落突兀地停了下来。\n\n从伦敦湿冷阴郁的雨幕，到莫斯科严寒死寂的雪原，再到东方大雾弥漫的茶馆与战壕，一缕和煦的暖风越过了大结界的边缘，轻柔地吹散了遮蔽天空的黑色煤烟。在废铁与焦土之中，嫩绿的藤蔓和漫山遍野的小花开始疯狂生长，将那些死气沉沉的装甲车、要塞与钢筋水泥无声地包裹。\n\n工厂里疲惫的工人们推开了布满锈迹的窗户。温暖的阳光斜斜地照在他们布满灰尘的脸上，带来久违的暖气。\n大结界外的广袤废土，在这一天彻底被盎然的绿意所吞噬。在烟尘与大雪里咳个不停的世界，眼瞧着那个飞在天上、拍着翅膀大喊的小家伙，终于卸下了防备，枕着一缕花香，沉沉地睡了过去。"
KNM_news.2.a:0 "外面也变得暖和起来了"

