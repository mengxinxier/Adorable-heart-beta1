KNM_buy.1.t:0 "想要哪些会喷火的铁筒？"
KNM_buy.1.d:0 "这些长长的、沉甸甸的铁筒子可以从大老远的地方把大土块（炮弹）打出去，落在地上会发出巨响，把坏人们的靴子都炸飞。有了这些东西，地精大叔们就不用拿着木棒冲到前面和坏人硬碰硬了。大卡车正把我们大竹筐里金灿灿的麦子一车车送去神社作为交换。我们要选哪一种铁筒子来保护大平原呢？"
KNM_buy.1.a:0 "要那种能打好远的普通铁筒"
KNM_buy.1.a_tt:0 "大家会收到§Y200§!门§Y牵引式火炮§!"
KNM_buy.1.b:0 "要那种能对准天上的防空铁筒"
KNM_buy.1.b_tt:0 "大家会收到§Y200§!门§Y牵引式防空炮§!"
KNM_buy.1.c:0 "要那种能砸碎硬铁板的反坦克铁筒"
KNM_buy.1.c_tt:0 "大家会收到§Y200§!门§Y牵引式反坦克炮§!"

KNM_buy.2.t:0 "挑选跑得飞快的车子"
KNM_buy.2.d:0 "为了把好吃的坚果和松饼运到更远的前线，地精大叔们需要一些不用大青蛙拉、自己就会跑的大铁车子。这些车子的铁轮子转得可快了，跑起来的时候还会发出呼噜呼噜的声音，像是一只只跑得飞快的铁皮小怪兽。我们要选哪一种会跑的铁皮怪兽来帮大家运东西呢？"
KNM_buy.2.a:0 "要那种跑得快快的轻型车子"
KNM_buy.2.a_tt:0 "大家会收到§Y200§!辆§Y摩托化载具§!"
KNM_buy.2.b:0 "要那种穿着厚厚铁衣的重型车子"
KNM_buy.2.b_tt:0 "大家会收到§Y100§!辆§Y机械化载具§!"

KNM_buy.3.t:0 "看看哪种大箱子比较好"
KNM_buy.3.d:0 "幻想乡里做出了好多长着履带、像大乌龟一样硬的铁皮箱子。灵梦说，那些巨大的铁轮子可以帮我们挡住可怕的子弹。虽然这些冷冰冰的大家伙动起来的时候声音好响，还会冒黑烟，但只要能保护大家不受伤害，就是最好的盾牌。作为交换，大卡车正把我们刚收上来的、甜甜的南瓜一车车送去神社。地精大叔们已经钻进车里准备踩油门了，我们要选哪一种大箱子来保护大家呢？（我们需要先进行设计才能正常购买）"
KNM_buy.3.a:0 "要那种跑得快的小铁箱子"
KNM_buy.3.a_tt:0 "大家会收到§Y80§!辆§Y轻型坦克§!"
KNM_buy.3.b:0 "要那种不大不小的中型铁箱子"
KNM_buy.3.b_tt:0 "大家会收到§Y65§!辆§Y中型坦克§!"
KNM_buy.3.c:0 "要那种又重又硬的巨型铁箱子"
KNM_buy.3.c_tt:0 "大家会收到§Y40§!辆§Y重型坦克§!"

KNM_buy.4.t:0 "要选哪些能飞的铁鸟呢？"
KNM_buy.4.d:0 "幻想乡送来的铁翅膀大鸟太重了，里面全是不听话的齿轮，飞起来的时候声音还特别吵。要是没有地精大叔们在前面开，妖精们可坐不习惯。得先想想，大家需要哪种大鸟在天上陪着一起扔松果。\n（我们需要先进行设计才能正常购买）"
KNM_buy.4.a:0 "要那种飞得快、能在天上打架的铁鸟"
KNM_buy.4.a_tt:0 "大家会收到§Y80§!架§Y战斗机§!"
KNM_buy.4.b:0 "要那种能飞得很低、帮地上扔松果（炸弹）的铁鸟"
KNM_buy.4.b_tt:0 "大家会收到§Y60§!架§Y近距支援机§!"
#扩大
