FRA_KNM_buy_technology:0 "向幻想乡讨教好玩的点子"
FRA_KNM_buy_technology_desc:0 "幻想乡的大家脑子里总有数不清的聪明办法。送去竹筐里满满的甜南瓜和野果，换取她们在小纸片上写下的一些奇妙设计。这些点子能够帮地精大叔和大家把防身的玩具造得更快、更好看。只要有大卡车源源不断地送去物资，那些聪明的脑袋就会很乐意和大家分享秘密。"
KNM_buy_technology_flag:0 "正在向幻想乡的大家讨教新点子呢"
KNM_buy_tec_tt:0 "大卡车正载着大家的南瓜和团子，运去神社换取一个§Y随机研究加成卡§!。"

FRA_KNM_military_exercise:0 "和大家在草地上玩演习游戏"
FRA_KNM_military_exercise_desc:0 "东边那些坏人要是冲过来，大家可不能慌了手脚。跟神社、还有森林里的朋友们一起，在宽敞的草坪上进行联合演习。大家互相扮演对手，用泥巴和水枪模拟打仗。在打闹中，地精们能学会怎么把队伍排得更好，妖精们也能飞得更加整齐。只要多玩几次这样的游戏，大家就什么都不怕了。"
KNM_military_exercise_flag:0 "大家正和盟友在草地上玩打仗游戏呢"
KNM_exercise_tt:0 "大家正在和幻想乡进行联合演习，双方将获得§Y陆、海、空军经验§!。"

FRA_KNM_mas:0 "我们要开始钻研绝招了"
FRA_KNM_mas_desc:0 "地精大叔们虽然力气大，但如果只是闭着眼睛挥舞木棒，还是很容易吃亏的。大叔们决定利用空闲时间，和幻想乡的教官们一起坐在篝火旁，研究各种厉害的排兵布阵方法。大叔们越聊越兴奋，甚至在木板上画满了奇奇怪怪的阵线。这些绝招能使大家在地面上的防守变得像大石块一样稳固。"
KNM_mas_flag:0 "地精大叔们正在篝火旁研究绝招呢"
KNM_mas_tt:0 "地精们和盟友将获得长达一年的§Y陆军学说每日精通点数加成§!。"


KFL_xyj:0 "雨之妖精"
KNM_spring_ally.1.t:0 "森林里走出来了新朋友"
KNM_spring_ally.1.d:0 "莉莉白把消息带进了树林里。那些平时连打雷都会吓得躲在苔藓和树洞下面、偷偷看热闹的小妖精，这一次，居然一个接一个地飞了出来。她们个子小小的，翅膀跟刚发芽的嫩叶一样绿。由于常年没有阳光，她们的脸色有些苍白，身体也在微微发抖，但手里却都紧紧抓着粗糙的木棒。\n领头的那个小家伙吸了吸鼻子，伸手拍了拍莉莉白的手，声音虽然在发颤，却分外清楚：“大烟囱把我们的树叶都熏黑了，谁让她们抢走大家的春天呢。虽然我们很小，但这一次，大家一起去把春天拿回来！”"
KNM_spring_ally.1.a:0 "欢迎加入！春天是大家的！"

KNM_spring_ally.2.t:0 "小妖精们不想要国界线"
KNM_spring_ally.2.d:0 "战场终于安静了。小妖精们依然列队站在那片用翅膀守护过的土地上。那里曾经是敌人的钢铁要塞，现在长出了新的草芽。不过，天天盯着那些用石头堆出来的边界线实在太让人头疼了，大家已经在商量要怎么把两边的林子拼在一起。"
KNM_spring_ally.2.a:0 "干脆把两边的草地拼在一起吧"
KNM_spring_ally.2.b:0 "让她们自由地飞去任何地方"

KNM_spring_ally.3.t:0 "大家都是一家人了"
KNM_spring_ally.3.d:0 "新土地上，从前是废墟的地方已经开满了红的小花、黄的小花。小妖精们的家已经和雾之湖合在了一起。因为数边界线太麻烦，大家决定拆掉所有的篱笆，以后就在同一个大林子里睡觉。莉莉白站在新开垦的泥土上，能感觉到脚底下有细细的暖意往上钻——这些土地记住了她们的名字。"
KNM_spring_ally.3.a:0 "这里的花，以后也是我们的花！"

KNM_spring_alliance:0 "我们永远在一起"
KNM_spring_alliance_desc:0 "林子深处藏着好多身体小小的妖精。她们平日里胆子特别小，可现在，她们也想和大家一起去寻找春天。指引她们前进的方向。等冬天的黑烟彻底消散，大家就会手拉着手，在同一个大林子里盖起全新的家园。"

KNM_zhaoji_chunling_lianmeng:0 "叫上新朋友"
KNM_zhaoji_chunling_lianmeng_desc:0 "林子深处住着好多愿意一起玩闹的小伙伴。只要大家还守在树林边境，就能邀请她们组成一支庞大队伍。她们虽然个子小，但对地上的路熟得很，而且——等打架结束，带她们去过的草地，以后就都是大家的啦。§Y小妖精盟友可在任意战争中召集，合并后重置冷却，30天后可再次邀请。§!"

KNM_zhanling_zhuanyi_KFL:0 "给小家伙们指路"
KNM_zhanling_zhuanyi_KFL_desc:0 "小家伙们正在大雾里欢快地奔跑呢。直接将大家占领的土地交给她们，她们的林子就会变得越来越大。等打架结束，这些涂上了小花印记的草地，以后全都会变成我们的领地。"

KNM_KFL_created:0 "新朋友们已经到齐啦"
KNM_jiesuan_KFL:0 "大家一起手牵手"
KNM_jiesuan_KFL_desc:0 "打架已经结束啦。现在到了大家坐在一起吃栗子的时候。只要和这些新朋友抱在一起，她们之前占领的所有草地和林子，以后就全都是我们的新家园了。"

KNM_kfl_transfer_done_tt:0 "该州已移交小妖精联军管辖，战后合并时将成为§Y雾之湖§!宣称"
KNM_kfl_zhiyuan_tt:0 "§Y@KFL小妖精联军§!也能使用§Y大南瓜交换协议§!了！"

KNM_xsybcdyp:0 "小树叶编成大雨披"
KNM_xsybcdyp_desc:0 "那些刚从深林里跑出来的小雨妖精浑身都湿漉漉的，冷得直打哆嗦。大家去采摘大荷叶和橡树叶，用细藤蔓穿起来，给她们编织成防雨的小外衣。穿着这些软和的绿叶披风，就算在冰凉的雨雪里飞，翅膀也不会被淋湿了。大家也能暖烘烘地继续飞翔。"

KNM_xjxmb:0 "削尖小木棒"
KNM_xjxmb_desc:0 "地精大叔们可以用铁炉造大刀，但这些身体娇小的新朋友只能拿动小木棍。大家坐在篝火旁，用锋利的小石片将松树枝和桦树枝的尖端削得尖尖的。这些木棒虽然扎不透大坦克，但能戳坏敌人的履带和通风口，给那些冷冰冰的机械捣乱。"

KNM_mqbdjch:0 "麻雀来帮大家传话"
KNM_mqbdjch_desc:0 "战场上的黑烟太重了，小家伙们飞进去很容易迷路。那些住在森林里的麻雀和松鼠能充当我们的联络官。两声鸟鸣代表集合，三声松鼠叫代表躲进草丛。这样一来，大家就能像一大片彩色的云彩一样，整整齐齐地在雾气里飞舞。"

KNM_dgat:0 "大锅里熬着松子热汤"
KNM_dgat_desc:0 "赶路累了的时候，联军的小家伙们也需要好好休息。在边境的空地上架起几口大铁锅，咕嘟咕嘟地熬着放了松子和甜草的野菜热汤。飞累的小妖精们可以在这里落脚，喝上一大碗，让干瘪的肚子和冷得发硬的翅膀都重新暖和起来。"

KNM_tsdsz:0 "天上掉落好多小石子"
KNM_tsdsz_desc:0 "小妖精们飞得可快了，敌人的枪口很难瞄准她们。我们给她们的小布包里塞满从捞出来的、硬邦邦的“小石子”。只要她们飞到那些坏人的头顶上，就解开布包，将石子像下雨一样洒下去，砸得坏人们只能捂着钢盔缩在壕沟里。"

KNM_lqsbsk:0 "拉起手来就永远不松开"
KNM_lqsbsk_desc:0 "不管是从湖边来的，还是从森林深处走出来的，大家其实都是一样的妖精。既然已经站在一起了，就再也没有什么“你的林子”和“我的湖泊”。两边的队伍彻底合并在一起。只要大家手拉着手，那股暖和的春风就会变成坚固的屏障。"

KNM_focus1:0 "甜茶与阳光属于所有朋友"
KNM_focus1_desc:0 "在一些遥远的地方，大家会把所有的食物都放在一张桌子上平分，地里干活的人也都是自己的主人。琪露诺大人说，那些红色旗子下的朋友最懂分享了。去和他们见个面，告诉他们，真正的春天也是这样的，阳光对每个人都一样暖和。但是，大家也得互相提防着那些住在灰色城堡、把春天锁起来的坏首领。如果大家能达成共识，就能一起保护大平原的泥土，不让坏首领的霜冻害了大家的庄稼。"

KNM_focus2:0 "暖风吹拂过所有人的脸庞"
KNM_focus2_desc:0 "大平原上所有懂得分享的朋友都对我们点头了。那些红色旗子下的林子和农田，现在都和大家拉起了手。她们也同意，绝对不能让那些只知道抢夺和命令的坏首领把寒冬带过来。温暖的风现在变得好粗好壮，一浪一浪地往东边推。那些原本冷清清的红色边境线，现在都像雾之湖一样暖烘烘了。"

KNM_focus3:0 "小草们想一起商量"
KNM_focus3_desc:0 "在另一些地方，大家种什么庄稼、什么时候休息，都是聚在树荫底下一起拍手商量出来的。大家都觉得，这种人人都能说话的地方，最适合小花发芽了。去和这些蓝色旗子下的朋友拉起手，达成一个关于春天的约定。大家要互相守望，提防那些只会挥舞大鞭子、讨厌别人大声说话的冷酷头领。保护好大家的小院子，比什么都重要。"

KNM_focus4:0 "每朵小花都那么五彩缤纷"
KNM_focus4_desc:0 "那些喜欢在树荫底下商量事情的蓝色旗子，现在都和大家手拉着手。漫长的走访结束了，这片大陆上所有向往自由的朋友，都已经站在了春天的阵营里。灵梦也说，这种由大家共同用符纸和誓言筑起来的防御，比任何城墙都要结实。温暖的阳光现在已经洒满了每一个山头，任何想要重新将寒冬带回来的坏头领，都休想踏进大家的小院子一步。"

KNM_li_war:0 "大家都想要春天呀"
KNM_li_war_desc:0 "外面的冷风越来越大了。那些在烟囱下发抖的人类和妖精，一定也一直在盼着太阳重新照下来。\n送给那些红色旗子和蓝色旗子的朋友一朵小花吧。只要那些懂得分享和商量的好心人愿意和大家拉起手，暖洋洋的春风就能吹到更远的地方，\n彻底打跑那个抢走春天的坏坏冬天。"
KNM_call_to_war_c:0 "给§t[FROM.Getname]§!送一朵花"
KNM_call_to_war_c_tt:0 "解锁决议: §Y给红色旗子送一朵花§!"
KNM_call_to_war_d:0 "给§3[FROM.Getname]§!送一朵花"
KNM_call_to_war_dd_tt:0 "解锁决议: §Y给蓝色旗子送一朵花§!"

KNM_focus2_tooltip:0 "需要全部拥有§Y红色旗子政体§t（社会主义）§!§!的§Y非傀儡国家§!都同意了关于§9春天§!的提议。"
KNM_focus4_tooltip:0 "需要全部拥有§Y蓝色旗子政体§3（民主主义）§!§!的§Y非傀儡国家§!都同意了关于§9春天§!的提议。"
KNM_call_to_war_d_tt:0 "§L一起向这些友好的国家寄去一封信。大酱说，信纸上画着小花，她们一定能看懂。§!\n\n如果对方同意：\n§Y春天一定会来的§!追加效果：\n科研速度:§G+5.0%§!\n每日政治点数获取：§G+0.20§!"

KNM.57.t:0 "写在树叶上的外交邀请？"
KNM.57.d:0 "办公室里，壁炉里的火已经有些弱了，窗外还飘着薄薄的雾气。\n桌上放着一个用细草绳系着、干荷叶裹着的小包裹。送件的外交使者嘛……据守卫说，那只是一只在窗前拼命用嘴啄玻璃的黑色小乌鸦。\n拆开荷叶，里面静静躺着又一片宽大的树叶。绿色的叶片上用黑乎乎的泥巴按了一个小脚印，旁边还贴着几片晒干的黄色花瓣，和一颗捏扁了、散发着甜香味的红果子。\n随附的小纸条上，用红果汁歪歪扭扭地画着一个大大的太阳。\n这大概是那个被称为花花乐园的妖精国家送来的公函。那个总是大呼小叫的春之妖精，正在用她拙劣又天真的方式，向大家发出关于保护春天的邀请。\n在一整片被灰雾和战火熏得死气沉沉的大陆上，这片散发着甜味的橡树叶，确实带着一丝久违的、让人舒心的暖意。\n“给她们回信吧。”我放下这片叶子，拉了拉有些发凉的衣领，“顺便，送一些干净的白纸和钢笔去湖边。谁家正经国家会在树叶上写国书啊。”"
KNM.57.a:0 "“告诉她们，春天也是大家伙的朋友。”"
KNM.57.b:0 "“这……可能只是个恶作剧吧。”"
KNM_call_to_arms:0 "帮助春之妖精"

KNM_call_to_war_yes_tt:0 "我们将同意这个可爱的邀请，国家边境将向§Y花花乐园§!暂时敞开。\n之后那个“不讲道理的坏冬天”向她们§R宣战§!时，我们将能作为坚固的护盾加入这场春天的战斗。\n在未来，我们将获得一个效果可观的正面§Y民族精神§!。"
KNM_zmgct:0 "在每个§9春天§!里：\n"

KNM_KFL_transfer_tt:0 "将全部陆军转移给§Y@KFL[KFL.getname]§!"
KNM_KFL_transfer_1_tt:0 "将全部陆军转移给§Y@KNM[KNM.getname]§!"
KNM_KFL_transfer:0 "让小妖精来带头"
KNM_KFL_transfer_desc:0 "林子深处的新朋友们更熟悉前面的道路。既然已经达成了协议，就可以放心地将地精大叔们和小妖精的护卫队伍，都交给小妖精盟友来指挥。这能使大家在茂密的灌木丛里走得更快，避免在东边的灰雾里迷失方向。只要她们在前面指路，后方的防线就会变得更加安稳。"
KNM_KFL_transfer1:0 "大家都回到湖边来"
KNM_KFL_transfer1_desc:0 "前线的风雪暂时变小了。现在需要将所有的护卫和队伍，统统召回雾之湖的草地上。新老朋友聚在一起，重新数数人数，在温暖的炉火旁分着吃烤栗子和热茶。只有在这里重新整好队伍，大家才能在下一次严寒来临前，严严实实地守护好所有的花盆与树林。"

KNM_KFL_cooldown:0 "小家伙们已经在森林深处高高兴兴地玩耍去了，需要等上§Y30天§!才能重新整理好小包袱。"
KNM_KFL_independent_factory_tt:0 "§9如果小妖精们在林子里有了自己的家，那些藏在深林里的大铁房子，将来也会分给她们一半呢！§!\n§Y（若小妖精联军已独立，她们将额外获得雾之湖已搬迁工厂的一半数量）§!"
KNM_no_play_tt:0 "§R注意！！！（暂无内容）§!"

