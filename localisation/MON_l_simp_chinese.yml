GFX_HJJ_1_end_tip:0 "在满穗的引领下，新中国并未依靠单纯的武力征服世界，而是以汉文化的传播书写了人类历史的新篇章。她坚信“远人不服，则修文德以来之”，将汉文化的精髓——仁义、礼乐、和谐与包容，化作连接全球心灵的桥梁。\n\n从孔孟之道到现代科技，从汉字书法到东方哲学，华夏文明如春风化雨般滋润着每一片土地。世界各国的人民自愿学习汉语，身着汉服，践行中庸之道，不同种族在共同的文化认同下融为一体。战争被对话取代，冲突被理解消融。\n\n这不仅是中国的胜利，更是人类文明的一次伟大升华。一个“天下大同”的理想社会，在东方智慧的照耀下成为了现实。"
GFX_HJJ_2_end_tip:0 "铁拳砸向了华夏大地深处残留的“胡尘”——那些源自元清两代的异族文化习俗、经济特权与血缘融合被视作必须切除的毒瘤。通过雷霆手段，旧有的多元遗迹被暴力铲除，语言、服饰乃至血统被强行“纯化”，神州大地在阵痛中回归到一种极端的、排他的“纯粹汉家秩序”。在完成这场残酷的内部重塑后，这支被民族主义狂热武装到牙齿的军队走向世界。\n\n随着中华民族共和国的钢铁洪流横扫六合，曾经觊觎华夏的列强灰飞烟灭，一个以“汉家武德”为脊梁的超级帝国屹立于世界之巅。这条路线并非单纯的征服，而是一场迟到了百年的民族雪耻与复兴。\n\n在铁与血的洗礼下，华夏文明焕发出前所未有的刚健气质，尚武精神重新注入民族的血液。虽然世界在战栗中臣服，但对于华夏儿女而言，这是久违的安全与尊严。"
GFX_MGE_end_tip:0 "随着艾黛尔贾特将蒙古帝国的旗帜插遍全球七大洲，一个前所未有的治世正式降临。这条道路并非只有鲜花与掌声：为了打破旧世界的顽固壁垒，铁骑所过之处，旧有的国界、腐朽的王朝与僵化的体制被无情碾碎，无数城市在战火中重塑，传统的文化版图经历了剧烈甚至痛苦的重组。\n\n然而，在这破坏的阵痛之后，一个新的时代随之开启。从伦敦到广州，从纽约到撒马尔罕，阻碍人类交流的关卡被彻底拆除。草原的驿道连接了全球的港口，不同的文明在帝国的框架下以前所未有的速度碰撞、融合。曾经敌对的民族在她的领导下开始交融共生。旧日的仇恨被放下，取而代之的是对共同繁荣的渴望。\n\n虽然世界付出了沉重的代价，但一个真正意义上“四海一家”的全球化时代，在苏鲁锭的注视下成为了现实。"

GFX_HJJ_1_end_tip_2:0 "她让万邦归心，用千年文明的智慧点亮了全人类的未来。"
GFX_HJJ_2_end_tip_2:0 "四海之内，莫非汉土；率土之滨，莫非汉臣。一个由汉家主导的永久和平秩序，在剑锋之上得以确立。"
GFX_MGE_end_tip_2:0 "如今的世界，不再有国界的壁垒，只有人类共同的家园，万物在长生天的庇护下自由生长。"

