MON_start_game_text:0 "元神，启动！"
MON_his_page_01_title: "帝国初升"
MON_Country_History_Page_01: "在绵延的大兴安岭以西，万年的冰山融雪滋润出最优质草原，呼伦与贝尔的臂弯在此地相互缠绕，一万两千年前的创世之震与盘横苍穹的长生天之怒，构建出最初的天父地母创世传说，被远方神战所影响的源石矿脉依托着交织的融雪水网汇于星坠之湖，那是赋予兽族以智慧的创世之息。当远方的人类从泰加林的渔猎泥沼中闯入此地，狼族的幼崽已在月光下学习用利爪刻写力量的符文，当匈奴的箭镞尚未磨亮，羊族的毡帐已经向着大漠的远方驰骋，当鲜卑向着富饶的南方奔袭时，马娘的脚步已经跟随着匈人的足迹奔向更远的彼端。\n从大兴安岭到多瑙河畔，这一条东西横贯7600千米的草原上，人类的游牧部落和兽族的血脉氏族在其上纵横驰骋，放牧迁徙。受到中原王朝势力影响更多的人类部落更容易形成部落联盟式的统一汗王，但这种汗王往往因为，叛乱、分裂、中原王朝打压而昙花一现，匈奴因而远遁极西成就第一次上帝之鞭，突厥因而西迁造就奥斯曼的一时霸权，在一次次的兴起和衰落中，整个草原也在从科技与制度上得到升华，从“天可汗”引申出的草原共主成为人类在草原争霸中的政治共识。\n孛儿只斤•铁木真，这位仿佛应天运而生的传奇，凄苦的童年造就了他的坚韧的内心，坎坷的少年练就了他高超的手段，来自“苍狼白鹿”传说中的王者血脉铸就了他前进的力量，即使部落分崩离析，他也凭借着卓越的政治智慧和强大的统帅能力一统漠南人类诸部，并趁着又一次的兽族内部冲突的短暂疲软期一举击败羊狼两大氏族，随后在1206年遵照长生天的古老传说，在斡难河之源、青青草原的圣地召开了有史以来最大的“忽里勒台”，被人类众部落和兽族诸氏族共同推举为“成吉思汗”，意为“拥有海洋四方的可汗”，建国“也客·蒙古·兀鲁思”。\n在铁木真登基后，他依靠着联姻，改组等缓和的手段逐渐消弭各个部落汗王的影响力，打造属于孛儿只斤氏的“黄金家族”传说，在草原管理上实行军政合一的千户制，重塑部落体系，减弱部落间的隔阂；扩建中军护卫怯薛军，吸纳大量各个兽族氏族的年轻一代，杂糅的生活和战场上相互托付后背的情谊让新生代的兽族逐渐理解彼此，兽族的民族记忆由此交融，成为整体，在这些改革基础上，他还依据草原约定俗成的习俗和习惯，总结出了适应于草原的法典，史称《成吉思汗法典》。\n草原的物产总是如此匮乏，即使强如成吉思汗也免不了为草原的寒冬而担忧，贸易，劫掠，用注定无法渡过严寒的牧群换取更加能够保存的粮食，稀缺的盐分，亦或是更锋利的武器，在击败曾今的宿敌后成吉思汗也不免为蒙古帝国的未来而担忧，从现实情况的争权夺利的孩子们，嗷嗷待哺的部众，再到内心的征服欲都在不断的推动着帝国的扩张，从最弱的西夏开始，到大金、西辽、南宋，一个个的中原势力倒在了蒙古的铁蹄之下，一次次的西征也将蒙古帝国的版图推向了历史上一个前所未有的高度，从东方的朝鲜到西方的鲁塞尼亚，半个世界都臣服在蒙古帝国的铁蹄之下，随着蒙古的铁蹄而行的还有大量兽族的战士，成吉思汗在“忽里勒台”上许诺参军的兽族能够获得自治的草场和征服所获部分战利品成为了战士无谓的勇气。"

MON_his_page_02_title: "分裂续章"
MON_Country_History_Page_02: "再伟大的强者在面对亲情也会陷入两难的境地，从东道诸王于西道诸王分立的时刻，分裂的种子已经悄然种下，即使成吉思汗已立下遗命，但逝去之人怎能浇灭生者的欲望，更有“监国”权利的甘美与猜忌的野花争相绽放。\n最终，钓鱼城头的一声炮响，彻底打破虚与委蛇的政治游戏，双汗并立的笑谈在蒙古帝国中上演，一位草原可汗，在汉地自立挟汉地之民，北征草原也是历史的一大奇谈，然而现实终究是冰冷且物质的，这场名为“五汗之争”的闹剧以人口资源最拥实的忽必烈胜利而画上顿号。忽必烈确立统治，而生活在青青草原的兽族因现实条件而被卷入阿里不哥阵营，因此被胜利后忽必烈系统性清算。经此一乱蒙古帝国彻底分裂为钦察汗国、察合台汗国、窝阔台汗国、伊利汗国四大汗国和元朝。\n即使如此，内战仍在继续，史称“西北诸王叛乱”的数十年内战，依旧在不停蚕食蒙古的根基，无数的兽族战士与底层牧民被卷入王族的权利焚风之中灰飞烟灭，成吉思汗为兽族带来的团结在苦难的塑造下愈发弥坚，散乱的部族也在逐渐聚拢，然而这注定是一个漫长的过程，在整个草原游猎的兽族，都在期盼着属于自己的家园。但这个愿望在元朝的统治下终究无疾而终。不过期盼却有实现的可能，元庭在短短百年间，经历了无数大规模内斗，已走向日暮西陲，重新崛起的汉人政权已经重夺中原之地，草原已经逐渐失序，机会来了......\n草原统治崩溃的速度远比想象中的更快，自诩正统的北元王庭在“捕鱼儿海之战”中被一击打败，皇帝脱古思帖木儿西逃途中被阿里不哥后裔弑杀，完结了过去的轮回。\n在此期间，兽族其中的一支狼族迅速崛起，整合了游猎于整个草原的族人，统合部族，形成了狼王制度，经过与明廷的朝贡贸易和对丝绸之路的控制，建立起来了基础的经济体系。在武大狼任狼王期间，狼族已然成为了草原霸主，而这也让武大狼的野心逐渐膨胀，它扶持起来成吉思汗后裔为大汗，自领“太师”一职，欲借此掌控整个草原，东征兀良哈、西讨哈密、北伐布里亚特一统青青草原。而这也引起了明廷的担忧，愈发收紧了对狼族的贸易，而这一举动却反而激发了武大狼膨胀的野心，但它并没有因此失去理智，利用卓越的军事才能，抓住明廷的指挥失当，在土木堡围歼明军精锐，俘虏天子朱祁镇，威望达到巅峰，不过在之后的围攻北京城过程中，遭到了明廷的拼死反抗，加之劳师远征无奈北撤。\n威势达到巅峰的武大狼以不在满意在一个傀儡大汗之下，它一步步的试探大汗的底线，僭越“黄金家族”的威仪，终于，它还是迈出了那本不属于它的一步——称汗。\n武大狼打破了非“黄金家族”不可称汗的历史惯性，自称“大元天圣大可汗”，建年号“添元”，然而这引起了许多支持“黄金家族”统治之人的愤怒，为了压制愤怒和对权利的不安感催促着它对“黄金家族”的后裔展开了清洗，然而这一举措进一步加剧了众叛亲离的现状，即使是兽族内部也认为它是对“成吉思汗”的背叛，整个草原因此迅速分为了两派。\n当羊族首领软绵绵站出来时，反抗武大狼统治的力量迅速团结一致。即使军事才能如此卓越的武大狼，也是“巧妇难为无米之炊”，武大狼依靠着少数精锐，四处救火，但对于整个战局来说依旧于事无补，狼族渐渐被逼着向西迁徙，武大狼也在四处奔波中心力憔悴而亡，狼族的部分残部在其长子的带领下逃往阿尔泰山，放弃了大汗之位，重回狼族选王制。\n而在击败武大狼之后，众部落因失去共同的目标，再度分裂，期间有虽有达延汗依靠着反武大狼获得的威望和血脉的正统，短暂的一统草原，但这不过是“黄金家族”最后的回响了。"

MON_his_page_03_title: "末路的悲歌"
MON_Country_History_Page_03: "在达延汗之后，再无人能一统草原，青青草原就在分裂中走过百年，直到努尔哈赤异军突起，在“九部联军攻金之战”之中，他以少胜多，获得史诗大捷，也为他拉拢战败部落打下了基础，确立了东北地区的霸权。而这也是末路的开始。\n在努尔哈赤击败联军后，并没有进行反击，而是通过联姻拉拢等手段构建“满蒙第一同盟”，为了进一步削弱草原的力量，他联合科尔沁、内喀尔喀五部，压缩林丹汗生存空间，而林丹汗就是如今草原上能称得上大汗的人，而他也在后金的三次征伐下败亡与青海，夺取了元朝传国玉玺，因而如今的满清皇帝自称获“蒙古大汗”称号，承袭元朝法统，在强权的威逼下，整个青青草原除了远遁阿尔泰山的狼族俱以臣服在大清的铁蹄之下，\n在满清入关大战期间，兽蒙两族都被迫贡献了大量的兵员，在所谓的蒙八旗，兽八旗中被当成炮灰，换取满清天命所归的战绩。即使是在满清一统汉地之后，其地位依旧没有改变，在朝堂上冠冕堂皇的共治天下的虚假叙事背后，是蒙兽两族在满清的各个战场抛下的累累白骨。\n压迫带来了反抗的火焰，无数蒙、兽牧民为了逃离压迫的漩涡，选择离开青青草原，来到狼族守护着的最后净土——阿尔泰山，无数仇恨的种子在此汇聚，生根发芽，而这一次狼王终于完成先祖未尽的遗愿，他成为了蒙、兽联盟的守护者，汇聚的力量开始外溢，为了维持庞大牧民的生活，在狼王的带领下，他们跨过天山，征服中亚草原，压制沙俄扩张，重返青青草原，一切都仿佛欣欣向荣。\n然而，所有人都我知道，那一个国家的征伐终会到来，而它也如期而至，从满清初步平定汉地之后，对联盟的征伐就渐渐展开，为了与满清这尊庞然大物周旋，联盟依靠着羊族高超的毡帐技艺衍生出的“驼城战术”，在广袤的青青草原和西域戈壁间展开堡垒游击战，然而临时的堡垒依旧难以在重型红衣大炮的炮火下生存，不过即使如此也对满清造成了远超己方的伤亡。\n满清的人口如渊，国力更是联盟的数十倍，这场反抗的结局早已知道，即使联盟数次战役胜利，依旧无法真正战胜满清，但谁也没有想到这场战争会跨越70年，历经三代人，会打到满清八旗贵族家家缟素，会打到满清民怨沸腾，会打到联盟被“永绝根株”，在那最后一战中无数声“让孩子先走”，是蒙、兽两族脊梁最后的悲鸣。\n19世纪中叶，满清在外国的侵虐，与内部的起义交织下，逐渐分崩离析，生活在青青草原的蒙、兽两族后裔们驱逐了满清总督，短暂建立起了独立的青青草原联盟，在神州太祖的兵锋下，联盟在试探性的抵抗后，以内部自治为条件选择了像神州帝国臣服，建立了安北都司。不过在制度的建立阶段，神州为了更好的掌控青青草原，也为未来的分化埋下了伏笔，神州帝国规定安北都司总督由蒙古族人类担任，而同时从兽族中选举一名草原长专管兽族事务，人类总督若对兽族聚居地下发法令或行政命令必须草原长同意才能实行（朝廷直接下达的指令不受限制）。就这样数十年平安无事。\n1921年，俄国内战接近尾声，白卫军败局已定，虽然在圣杯的介入下保住了乌克兰，但圣杯给出的条件也是乌克兰不准再宣称俄罗斯统治权。而许多尚在远东作战的白军不愿意接受这个条件，宣布与基辅当局决裂，白军的残部逃入草原，此时的神州已经在时代的冲击下势力渐衰，即使是残部也难以组织起成规模的清缴，在密令安北都司紧盯他们后便默许白军进入青青草原，作为一支抵抗苏俄的有生力量而存在，自此白军在青青草原西部的杭爱山间驻扎了下来，但新势力的加入，是否会搅动“悲鸣战役”后死寂的青青草原哪？\n时间来到了1936年，平行的时间线开始缓缓流动……"
