mon_news.1.t:0"$news_event_background$草原居民驱逐北京的总督"
mon_news.1.d:0"随着最后一列满载伤兵的装甲列车轰鸣着驶过长城防线，标志着神州帝国在蒙古地区长达三十年的统治正式宣告终结。昨日深夜，一场由蒙古诸部联合发起的武装暴动攻陷了库伦的总督府。\n\n神州帝国末任安北总督琳迪斯在亲卫队的拼死掩护下，仅以身免，连夜向南突围。\n\n草原联盟发言人慢羊羊今日清晨发表《光复宣言》，宣称：“从今日起，草原不再向南方缴纳一粒粮食、一匹战马。这片土地重新属于它的儿子们。”宣言同时警告任何试图北上的军事力量将面临“不死不休的抵抗”。\n\n分析人士指出，此次暴动的成功不仅意味着神州帝国失去了重要的马匹产地与北方屏障，更可能引发连锁反应，导致西北边疆局势全面失控。\n\n北京方面尚未对此事作出正式回应，但据传内阁已陷入紧急争吵。而在莫斯科，克里姆林宫的目光正紧紧盯着这片新生的动荡之地。"
mon_news.1.a:0"我们不是叛乱者，我们是这片土地真正的主人。"
mon_news.1.b:0"又一块版图变色了"
mon_news.1.c:0"待我北征大军一至，定叫逆贼灰飞烟灭！"

mon_news.2.t:0"$news_event_background$流亡白军控制蒙古"
mon_news.2.d:0"据库伦方面的消息，神州帝国安北都司总督琳迪斯为镇压草原各部暴动，紧急授权流亡白俄领袖艾黛尔贾特调动白军介入。然而，当白俄铁骑以残酷手段平息民乱后，反而调转枪口，于昨夜凌晨发动突袭。\n\n忠于神州的守军猝不及防，防线迅速崩溃，安北都司宣告瓦解。艾黛尔贾特随即接管库伦，宣布废除一切神州官制，整合蒙古诸部王公与白俄军官团，正式登基为“大蒙古国大汗”。她在就职演说中宣称：“从今日起，蒙古将以铁与血开辟新纪元。”\n\n目前，新政权已全面控制漠南漠北全境，并开始整编一支兼具火力与机动性的混合军团。边境哨所报告，大量物资正被运往长城方向，战争阴云笼罩北方。"
mon_news.2.a:0"旧世界的灰烬，是我们新帝国的基石。"
mon_news.2.b:0"一个斯拉夫人成为蒙古大汗？有趣。"
mon_news.2.c:0"待我北征大军一至，定叫逆贼灰飞烟灭！"
mon_news.2.e:0"白色瘟疫在远东扩散，红军必须准备应对最坏的情况。"

mon_news.3.t:0"$news_event_background$安北都司拒绝效忠北京"
mon_news.3.d:0"危机的导火索由北京点燃。昨日，袁克定强行罢免深受草原各部拥戴的安北都司总督琳迪斯，改派其心腹党羽徐树铮接任。但是这一行为造成了意想不到的后果。在今日凌晨召开的紧急会议上，面对北京使臣的威逼利诱，年轻而果敢的军官孛儿只斤·别烈思挺身而出。她迅速说服了在场犹豫不决的安北都司官员和草原各部代表。在群情激愤之下，与会代表一致推举别烈思为新任总督，并当场撕毁袁克定的任免手谕，将北京使臣驱逐出境。\n\n正午时分，别烈思通过广播发表《护宪讨袁檄文》，正式宣布安北都司进入“非常状态”，组建“靖难军”。她誓言：“袁氏一日不下野复宪，我安北一日不休兵！”\n\n目前，原安北驻军大部已宣誓效忠别烈思，京绥铁路沿线已被切断。北京方面震怒，袁克定急令第三师北上“讨逆”，内战阴云笼罩华北。"
mon_news.3.a:0"我等举旗非为分裂，实为拯救神州于独裁深渊！"
mon_news.3.b:0"在东方荒漠中竟有人为宪政流血？"
mon_news.3.c:0"逆贼别烈思，名为护宪，实为割据！"

mon_news.4.t:0"$news_event_background$黄金家族后裔再次统治蒙古"
mon_news.4.d:0"蒙古高原的民主实验在今日戛然而止，取而代之的是铁腕与鲜血。草原长选举大会被一支身着黑色制服、佩戴倒卍字臂章的极端民族主义武装——“黑万字”强行接管。\n\n在黑洞洞的枪口下，草原各部代表被迫“全票通过”决议：重建“大元大蒙古兀鲁思”。黑万字实际领袖，黄金家族后裔孛儿只斤·伯雷帖木儿身着复刻的元朝帝服，手持苏鲁锭长枪，向全场宣告：“从今日起，不再有部落，只有臣民；不再有选举，只有圣旨。大元帝国将统合诸部，重立法度，恢复祖业！”\n\n黑万字随即展开清洗行动，任何质疑复辟的声音都被视为“叛国”，意图以恐怖手段强行整合蒙古诸部。\n\n北京方面对此震怒，斥责这是“赤裸裸的法西斯政变”；莫斯科则警告称，一个极端民族主义政权在边境崛起，将对西伯利亚构成直接威胁。随着黑万字团的铁蹄踏碎选票，草原正式进入了“新北元时代”。"
mon_news.4.a:0"黄金家族的铁骑将再次震撼世界！"
mon_news.4.b:0"又一个试图恢复昔日荣光的君主"
mon_news.4.c:0"待我北征大军一至，定叫逆贼灰飞烟灭！"

mon_news.5.t:0"$news_event_background$中国统一"
mon_news.5.d:0"在历经数年惨烈且混乱的军阀割据后，蒙古军队在草原长喜羊羊的领导下击败各路分裂势力，统一了中华大地。\n\n今日正午，喜羊羊在天安门广场举行建国大典。他宣布废除帝制，解散皇室，终结“君权神授”的旧时代，正式建立中华民国。\n\n“帝国已死，万民当立。”喜羊羊面对广场上数十万军民，声音平和却穿透云霄，“我们不再是大皇帝的子民，也不再是部落的奴隶。从今日起，这片土地属于每一个耕者、每一个织者、每一个守护家园的人。无论汉、蒙、回、藏，皆为共和公民！”\n\n喜羊羊的胜利被评论家称为“温和的奇迹”。他并未依靠恐怖统治，而是凭借卓越的统战能力，将原本四分五裂的蒙古骑兵、汉族边军、兽族民兵整合为一支纪律严明的“护国联军”。他的“草原智慧”——以包容化解仇恨，以共享利益换取忠诚，成功让无数死战到底的军阀放下了武器。神州大地自帝国崩溃以来首次实现了真正的统一。\n\n世界为之侧目。曾经被视为“割据者”的草原长，如今成为了终结两千年帝制、重塑东方秩序的“国父”。"
mon_news.5.a:0"从此神州无贵贱，四海皆兄弟。"
mon_news.5.b:0"东方的民主奇迹！"

mon_news.6.t:0"$news_event_background$中国统一"
mon_news.6.d:0"历史的巨轮在今日转向了全新的轨道。在历经数年惨烈的军阀混战后，蒙古草原长兔子率领的蒙古人民军彻底终结了腐朽的神州帝国及其各路割据势力。\n\n今日下午，兔子身着朴素的灰色布衣，佩戴红星徽章，在天安门城楼举行盛大开国大典。他庄严宣布了一个社会主义新中国的诞生。\n\n“从来就没有什么救世主，也不靠神仙皇帝！”兔子的声音通过无线电传遍大江南北，“过去，草原是王公的牧场，工厂是资本家的乐园，农田是地主的粮仓。从今日起，这片土地属于工人，属于农民，属于所有被压迫的人民！我们要建立一个没有剥削、人人平等的社会主义新中国！”\n\n兔子的胜利被视为“人民战争的奇迹”。他并未依赖单纯的军事征服，而是通过深入的土地改革和广泛的群众动员，将原本散沙般的农民、工人、牧民凝聚成一股不可阻挡的红色洪流。他的“胡萝卜加大棒”战术——对顽抗者雷霆打击，对投诚者宽大处理，并切实分田分地，使得敌军往往未战先溃，纷纷倒戈。\n\n世界为之震动。曾经被视为“只会种胡萝卜”的草原长，如今成为了东方红色巨人最伟大的领袖。"
mon_news.6.a:0"中国人民从此站起来了！"
mon_news.6.b:0"赤色风暴席卷了东亚"

mon_news.7.t:0"$news_event_background$中国统一"
mon_news.7.d:0"神州大动荡于今日迎来终局。蒙古草原长、狼族首领灰太狼消灭了最后一支中国的分裂势力。随后，灰太狼在紫禁城举行盛大典礼，正式宣布废除“神州帝国”旧号，重建大元帝国，并自封为“大元天统皇帝”。\n\n与历史上蒙古征服者的形象截然不同，灰太狼在就职诏书中明确宣示：“朕虽出草原，然心向华夏。大元非外来之政权，乃中华正统之延续。自今日起，蒙汉一体，再无征服者与被征服者之分，皆为朕之子民，共筑中华之基业。”\n\n灰太狼的统治风格被外界评价为“威权而务实”。他并未推行种族隔离或高压清洗，而是建立了一套高度集权的“军政合一”体制。他废除了议会与选举，强调“秩序高于自由，效率高于争论”，由皇帝直接任命各级官员，并依靠纪律严明的狼族骑兵与倒戈的前帝国官僚共同治理国家。对于反抗者，他雷霆镇压；对于顺从者，无论民族出身，皆予重用。\n\n“乱世需用重典，强国需立中枢。”灰太狼在接受外媒采访时坦言，“民主是太平盛世的游戏，如今的神州百废待兴，需要一个强有力的声音来指引方向。朕不要做征服者，朕要做的是让这片土地重新伟大的守护者。”"
mon_news.7.a:0"大元万岁，中华万岁！"
mon_news.7.b:0"从‘狼主’到‘皇帝’，他能否将野性转化为治理能力？"

mon_news.8.t:0"$news_event_background$中国统一"
mon_news.8.d:0"随着最后一股割据势力于昨日宣布无条件投降，历时数年的神州大分裂正式终结。[MON.Getleader]在北京向全国宣告神州帝国全境光复，四海归一。\n\n[MON.Getleader]及其麾下的“勤王军”先前攻入北京，成功从权臣手中“解救”了神州女皇蒋丽华，确立了“挟天子以令诸侯”的政治格局。[MON.Getleader]以北京为中枢，凭借女皇的正统法统与自身卓越的军事指挥能力，采取“先北后南、各个击破”的战略，逐一铲除了军阀势力。\n\n今日清晨[MON.Getleader]率领文武百官，在天坛举行盛大的“告祭天地”大典。他再次拥戴蒋丽华女皇亲自主持祭天，自居臣位，誓言“鞠躬尽瘁，辅佐圣主，直至天下大治”。\n\n“朕之江山，乃祖宗基业；太师之功，乃社稷之福。”蒋丽华在典礼上宣读诏书，正式册封[MON.Getleader]为“镇国太师”，赐九锡，许剑履上殿，位极人臣。\n\n[MON.Getleader]在随后的演说中强调：“神州之统一，非一人之功，乃天命所归，人心所向。今战乱已息，当务之急在于休养生息，重建家园。本太师愿做陛下手中最锋利的剑，守护这来之不易的和平。”"
mon_news.8.a:0"吾皇万岁，太师千岁！"
mon_news.8.b:0"这是曹操再世，还是孔明复生？"

mon_news.9.t:0"$news_event_background$中国统一"
mon_news.9.d:0"随着最后一股军阀势力于昨日投降，神州统一战争正式结束。\n\n先前，孛儿只斤·别烈思率军推翻袁克定政权，迎立蒋丽华女皇复位，并以太师身份总揽军政。在随后的统一战争中，她凭借卓越的军事才能扫平了各地割据势力，再度一统天下。蒋丽华女皇随即下旨，晋封别烈思为“镇国大元帅、首席太师”，赐“剑履上殿”殊荣，确立“君臣共治”的新体制。\n\n尽管有人劝她取而代之，正式称帝，但她誓言将继续以太师身份辅佐女皇，推行宪政，任何再言篡位者将被军法处置。\n\n国际观察家评论称，别烈思的选择不仅保全了神州帝国的法统连续性，更以一种罕见的政治道德赢得了国内外广泛尊重，为战后重建奠定了坚实基础。"
mon_news.9.a:0"吾皇万岁，太师千岁！"
mon_news.9.b:0"一位东方的辛辛纳图斯"

mon_news.10.t:0"$news_event_background$中国统一"
mon_news.10.d:0"神州历史上最具戏剧性的一幕今日在北京上演。在推翻袁克定暴政、扫平各路军阀并统一中国后，摄政太师孛儿只斤·别烈思并未选择继续维持“虚君实相”的格局，而是在群臣的再三恳请与“万民劝进”的浪潮中，接受了神州女皇蒋丽华的禅让，正式登基称帝，重建大元帝国。\n\n上午九时，禅让大典隆重举行。蒋丽华身着素服，手捧传国玉玺，宣读《退位诏书》，称“天命已移，德不配位”，自愿将江山社稷禅让于“功盖天地、德被四海”的太师别烈思。随后，别烈思身着大元礼制的冕服，接受百官朝贺，改国号为“大元”，年号“天宪”，意为“天命所归，宪政为本”。\n\n“朕受禅非为私欲，乃顺天应人，终结乱世。”别烈思手持宪法草案，向全场宣告，“新的大元并非专制的前元。皇帝为国家元首与象征，统而不治；实权归于民选议会与责任内阁。朕之使命，是守护这部宪法，守护四万万同胞之自由与权利。若有违宪者，虽朕亦当受审！”\n\n这一“君主立宪下的帝国复兴”模式，迅速获得了国内知识分子、民族资产阶级及各族民众的广泛支持。随着禅让大典的落幕，一个披着古老外衣、却拥有现代灵魂的新大元帝国，正式启航。"
mon_news.10.a:0"我们既有辉煌的过去，更有光明的未来！"
mon_news.10.b:0"真是奇迹"

mon_news.11.t:0"$news_event_background$中国统一"
mon_news.11.d:0"最后的抵抗在今晨熄灭。孛儿只斤·伯雷帖木儿——这位自称“大元皇帝”的疯狂军阀，终于将他沾满鲜血的战旗插上了中华大地。历时数年的血腥统一战争画上了句号。\n\n但这并非复兴的曙光，而是漫长黑夜的开始。\n\n伯雷帖木儿的胜利伴随着系统性的恐怖，身着黑衣，佩戴倒卍字臂章的黑万字特务，如同幽灵般穿梭于大街小巷，随意抓捕、拷打、处决任何疑似“心怀故国”的平民。图书馆被焚毁，学校被改为兵营，汉族传统文化遭打压。神州大地仿佛回到了最野蛮的部落时代，只不过这次，统治者掌握了现代化的机枪与坦克。\n\n“不要指望和平，”伯雷帖木儿在广播中用嘶哑的声音咆哮，“我们要的是征服！整个亚洲都将成为我们的牧场，所有异族都将成为我们的牛羊！反抗者，唯有死亡！”\n\n夜幕降临，曾经繁华的北京城如今死寂一片，只有巡逻队的皮靴声和远处偶尔传来的枪声打破沉默。无数家庭在黑暗中瑟瑟发抖，等待着不知何时会降临的厄运。神州，这个曾经辉煌的文明古国，此刻正窒息在黑色铁蹄之下，发出一声声无声的悲鸣。"
mon_news.11.a:0"顺我者昌，逆我者亡！"
mon_news.11.b:0"野蛮战胜了文明"

mon_news.12.t:0"$news_event_background$蒙古帝国归来"
mon_news.12.d:0"随着神州帝国最后一道防线崩溃，白俄流亡领袖、现任“蒙古大汗”艾黛尔贾特今日在北京前举行了盛大的登基典礼。她正式宣布蒙古帝国的重生。\n\n这不仅仅是一次政权的更迭，更是一份向整个世界——尤其是西方——发出的死亡宣战书。\n\n在典礼上，艾黛尔贾特身着融合了蒙古传统大袍与沙俄军装的奇特服饰，身后是整齐列队的“双头鹰怯薛军”——一支由哥萨克骑兵、蒙古铁骑和白俄重炮兵组成的混合恐怖军团。她手持军刀，用流利的蒙语、俄语和汉语向全世界广播：\n\n“东方的猎物已尽，神州的腐朽已被洗净。但草原的野心永不满足！”艾黛尔贾特的声音通过无线电传遍欧亚大陆，“七百年前，我们的祖先曾让半个地球在马蹄下颤抖；七百年后，我，艾黛尔贾特，将超越这一辉煌！”\n\n据悉，新政权已实施全国总动员，工业体系全面转向战时轨道。艾黛尔贾特甚至公开宣称：“如果世界不臣服，那就让世界在火焰中重生。”\n\n这一疯狂宣言瞬间引爆了国际社会的恐慌。从莫斯科到柏林，从伦敦到生命之树，紧急会议通宵达旦。人们意识到，一个融合了蒙古机动性、白俄复仇狂热和现代火力的战争怪物已经诞生，而它的獠牙，正死死盯着西方。"
mon_news.12.a:0"长生天指引着我们！"
mon_news.12.b:0"成吉思汗的幽灵复活了"

mon_news.13.t:0"$news_event_background$第二次蒙古西征"
mon_news.13.d:0"历史的钟摆在东方再次发生了剧烈的摆动。今日清晨，[Root.GetAdjective]政府通过国家广播电台向全世界发布了一份措辞强硬的《告世界书》，正式宣布终止与西方诸国的一切外交谈判，并即刻启动代号为“长生天之怒”的军事行动\n\n公告中未提及具体的战略目标或终战条件，仅以充满历史隐喻的语言宣告：“七百年前，我们的铁骑曾踏遍欧亚，建立了前所未有的秩序。那段历史并非陈迹，而是预言。今日，草原的雄鹰再次展翅，我们将跨越乌拉尔，饮马伏尔加，直至多瑙河畔。任何阻挡在马蹄前的势力，都将被历史的洪流碾碎。”\n\n据前线情报显示，[Root.GetAdjective]军队已在西部边境完成了史无前例的兵力集结。数以百万计的骑兵、机械化步兵及重装炮兵部队呈扇形展开，后勤补给线如血管般延伸至戈壁深处。不同于以往的局部冲突，此次动员涵盖了全国所有适龄男性，工业体系已全面转入战时轨道，整个国家仿佛变成了一台只为战争而生的巨大机器。\n\n值得注意的是，[Root.GetAdjective]军方在此次行动中展现出一种超越民族主义的狂热意识形态。宣传机器日夜不停地播送着“重建大蒙古世界帝国”的愿景，将西征描绘为“天命所归”的神圣使命。这种狂热的氛围不仅笼罩着军队，也渗透进了社会的每一个角落。\n\n消息传出，举世震惊。莫斯科立即宣布进入最高战备状态，红军远东及西伯利亚军区全线戒备；欧洲各国首都灯火通明，紧急召开国防会议；华盛顿与伦敦纷纷发表声明，谴责这一“对现代文明秩序的公然挑战”，并呼吁国际社会联合应对。\n\n随着第一缕硝烟在边境升起，世界意识到：那个曾经让地球颤抖的古老名字，如今带着现代化的武器与疯狂的野心，再次回来了。"
mon_news.13.a:0"从日出之地到日落之海，皆将成为我们的牧场。"
mon_news.13.b:0"上帝之鞭回归了……"

mon_news.14.t:0"$news_event_background$第二次红巾军起义"
mon_news.14.d:0"历史的幽灵在中原大地上再次显形，一场规模空前的起义在伯雷帖木儿统治下的“大元帝国”腹地全面爆发。起义军头裹红巾，手持步枪，高呼“驱逐胡虏，恢复中华”的古老口号，自称为“第二红巾军”。\n\n这场起义的导火索是伯雷帖木儿政权极度残酷的政治压迫与无休止的经济剥削，终于逼得走投无路的百姓揭竿而起。\n\n与历史上的红巾军不同，这次的起义者展现出了惊人的组织度与现代战术素养。据情报显示，起义军核心骨干中包括了前神州帝国军、国民革命军和红军军官。他们利用地道战、游击战袭扰大元补给线，处决控制区内残暴的蒙古达鲁花赤与汉奸官绅，开仓放粮，引得百万饥民响应。\n\n“伯雷帖木儿以为可以用铁骑踏碎一切，但他忘了，水能载舟，亦能覆舟！”一名起义领袖，前红军军官张伟在广播中激昂陈词，“今日之红巾，非为复一家王朝，乃为求生！我们要建立一个让汉人能像人一样活着的国家！”\n\n大都方面反应迟钝且傲慢。伯雷帖木儿起初认为这不过是“一群流民的骚乱”，仅派遣了少量地方驻军前往镇压。然而，当传回的消息显示整编制的“怯薛军”被愤怒的人海淹没，甚至连装备精良的“黑万字”特务团也在巷战中陷入重围时，大汗才意识到事态的严重性。\n\n目前，起义烽火已呈燎原之势，长江以北多处交通干线被切断，大元帝国的战争机器出现了停摆的迹象。这个依靠恐怖与高压维持的庞大帝国，正面临着自复辟以来最严峻的内部崩塌危机。"
mon_news.14.a:0"我们要用鲜血洗刷这片土地，让叛逆者知道什么是恐惧！"
mon_news.14.b:0"压迫越深，反抗越烈。"
mon_news.14.c:0"驱逐胡虏，恢复中华！"

mon_news.15.t:0"$news_event_background$中国走向军国主义"
mon_news.15.d:0"在刚刚结束的立宪大会上，前红巾军前线总指挥张伟将军，以压倒性票数被推举为新成立的“中华民族共和国”的最高领袖。\n\n张伟在就职演说中并未提及民主重建或经济复苏，而是发表了长达四十分钟的《铁血复兴宣言》。他面色冷峻，身着挂满勋章的深灰色军装，身后是整齐列队的精锐近卫师。\n\n“和平的幻想已经害苦了我们！”张伟的声音通过广播传遍大江南北，“百年的屈辱告诉我们，真理只在射程之内，尊严只在剑锋之上。在这个弱肉强食的世界，唯有绝对的武力才能守护中华民族的生存空间！从今日起，整个国家将是一部为战争而生的机器！”\n\n广场上，数万名青年挥舞着国旗，高呼“大统领万岁”、“华夏至上”。曾经的红巾军旗帜被收起，取而代之的是一种充满侵略性的黑色与赤红交织的新图腾。\n\n观察家指出，张伟的上台标志着中国走上了一条激进的军国主义道路。这个拥有庞大人口和工业潜力的巨人，如今已化身为一只蓄势待发的钢铁猛兽，其獠牙正指向四面八方。"
mon_news.15.a:0"一个危险的军事独裁者在东方诞生了"
mon_news.15.b:0"只有铁与血才能洗刷百年耻辱！"

mon_news.16.t:0"$news_event_background$一个共和新中国"
mon_news.16.d:0"随着伯雷帖木儿暴政的覆灭和第二次红巾军起义的辉煌胜利，神州的天空终于迎来了真正的黎明。在刚刚结束的“全国制宪会议”上，来自各行各业的代表齐聚一堂，共同做出了一个载入史册的决定：废除一切帝制与独裁残余，正式建立中华民国。\n\n最令人瞩目的是，大会一致推举满穗——这位曾在红巾军起义中以其卓越的后勤组织能力、人道主义关怀和坚定的民主信念而深受爱戴的女性领袖，担任共和国第一任总统。\n\n满穗身着朴素的青色汉服，胸前佩戴着一枚象征和平与丰收的麦穗徽章，在万众瞩目中走上主席台。她没有华丽的辞藻，只有真挚的话语：\n\n“同胞们，我们推翻了压迫者，不是为了让自己成为新的压迫者。”满穗的声音温和却充满力量，“我们流血牺牲，是为了让每一个孩子都能安心上学，让每一位老人都能老有所养，让每一双勤劳的手都能获得应有的尊严。从今天起，这个国家不再属于任何个人或家族，它属于你们——属于每一位中华儿女！”\n\n台下，掌声雷动，泪水与欢笑交织。人们看到的不再是一个高高在上的“统治者”，而是一位真正来自人民、服务人民的“公仆”。满穗微笑着向人群挥手，那一刻，仿佛整个神州都沐浴在春风之中。\n\n这是一个崭新的开始。一个曾经饱受战乱与专制之苦的古老国度，终于选择了民主与法治的道路，踏上了和平复兴的征程。"
mon_news.16.a:0"一个温和、理性且致力于和平的政权在东方诞生"
mon_news.16.b:0"一个自由、繁荣、和平的新中国！"

mon_news.17.t:0"$news_event_background$远东的白军临时政府"
mon_news.17.d:0"短暂的“蒙古汗国”政权在昨夜戛然而止。随着一声枪响划破库伦的寂静，白俄流亡军官帝弥托利发动了军事政变，成功推翻了自称“大蒙古大汗”的艾黛尔贾特。\n\n“据目击者称，政变发生得迅速而残酷。效忠帝弥托利的部队在深夜与艾黛尔贾特的亲卫队爆发了激烈交火。战斗仅持续了两个小时，艾黛尔贾特被帝弥托利亲手击毙。\n\n清晨，帝弥托利身着旧沙皇时代的军官礼服，胸前挂满勋章，向集结的军队发表演说。他并未宣布重建蒙古帝国，也未恢复神州法统，而是庄严宣告成立“远东白俄军政府”。\n\n“新政权的目标只有一个——莫斯科。\n\n“兄弟们，”帝弥托利在演说中怒吼，“擦干眼泪，擦亮刺刀。我们的家在乌拉尔山那边，不在这里！只要还有一个白俄士兵活着，俄罗斯的三色旗就终将重新飘扬在克里姆林宫上空！”"
mon_news.17.a:0"莫斯科在等待！"
mon_news.17.b:0"又一个流亡政权试图用武力改变版图"
mon_news.17.c:0"白色的毒蛇再次抬起头来！"

mon_news.18.t:0"$news_event_background$远东白军胜利反攻"
mon_news.18.d:0"历史在这一刻发生了不可思议的逆转。远东白俄军政府领袖帝弥托利率领的西征军突破乌拉尔防线后，于今晨完全控制莫斯科市区。随着克里姆林宫守军停止抵抗，苏维埃社会主义共和国联盟正式宣告瓦解。\n上午10时，帝弥托利在红场发表简短声明，宣布废除苏维埃制度，成立俄罗斯临时政府，并自任“护国摄政”。原苏联国旗被降下，取而代之的是代表俄罗斯的三色旗。对于前苏共官员及红军将领，新政府宣布将成立特别法庭进行审判，同时呼吁残余武装力量放下武器投降。\n国际社会对此反应迅速。圣杯等国表示将“密切关注事态发展”，并呼吁新政权保障人权；柏林方面则对苏维埃的崩溃表示“战略关切”。"
mon_news.18.a:0"赤色瘟疫已被铲除，伟大的俄罗斯再次站立！"
mon_news.18.b:0"他们怎么做到的？"



