MON_riji_tip:0 "§R193X年X月X日，库伦\n\n今日公祭，万人同悲。可真正刺痛我的，是昨夜独坐时翻出的那本旧笔记。\n\n1930年秋，中央士官学校第三教室。窗外桂花香，室内烟雾缭绕。黎星刻站在讲台上，挥舞着梁启超的《新民说》，眼睛亮得吓人：“诸君！宪政不是等来的，是争来的！”\n\n有人在角落冷笑：“争？拿什么争？枪还是笔？”\n\n有人立刻反驳：“若无笔启蒙，枪只会打向自己人！”\n\n我坐在窗边，用蒙文速记他们的争论，心里想的却是：若汉人真能践行“五族平等”，蒙古何须自外于国？\n\n那时我们相信，十年之内，神州必有议会、有民权、有真正的宪政。\n\n如今，他们死了。\n\n而我站在这里，举着刀，却再也听不到那间教室里的笑声了。§!"
