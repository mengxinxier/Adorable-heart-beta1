mon_flavor.52.t:0"反动宣传的不良影响"
mon_flavor.52.d:0""
mon_flavor.52.a:0""

mon_flavor.53.t:0"黑猫警长的备忘录（摘录）"
mon_flavor.53.d:0".......食猴鹰：此匪首背景复杂，疑与旧沙俄势力有染。其麾下掌握数架老式飞机，常如秃鹫般自天际发动突袭，对我方集结地与补给线造成严重威胁，制空权的缺失令我们极为被动。\n\n.........奶龙：完全无法渗透。他们的人见面只喊一句“我是奶龙”，我们派去的兄弟都对不上暗号，再也没回来……那不是匪帮，那是个邪教。\n\n........一只耳：凶残险恶，阴险狡诈，但凡当初没有枪口上抬五毫米都不至于变成现在这样.....从一个小偷集团变成草原专为复仇而生的匪盗。\n\n.........虹猫蓝兔：劫富济贫，尚存侠义。对他们，我常网开一面。近日他们传来消息，愿联手对付‘一只耳’，代价是默许他们在我们辖区内活动。此事，关乎律法底线。\n\n......草原警备队人手严重不足！已多次向琳迪斯总督请求扩大警员规模。\n\n........吾恐安北之忧，非匪，而在萧墙之内也。大批物资，包括燃油，不翼而飞。所有线索，最终都指向了边军的某些军官。"
mon_flavor.53.a:0"我们是在同时对抗土匪和同僚"

mon_flavor.54.t:0"黄金血脉，歧路同袍"
mon_flavor.54.d:0"安北都司衙署西院的灯，总在别处熄了之后还亮着。\n窗纸上，两个剪影又如皮影戏般对上。哥哥孛儿只斤·伯雷帖木儿高大的身躯堵在那幅巨大的手绘元朝地图前，指尖从安北都司如今的边界一路向南，狠狠划过长江，直戳到琼崖。\n“听见呼啸的风声了吗，别烈思？”他的声音刻意压得很低，每个音节都像在嚼着干硬的乌日沫，“这是长生天在催！南边的汉人自己都快拧断彼此的脖子了，这正是我们拿回东西的时候！看看这地图，看看我们的故土！”\n妹妹孛儿只斤·别烈思坐在书桌前，橘色的灯火将她一丝不苟的帝国校官制服镀上一层暖边，却化不开她脸上的清冷。她停下正规划改革方案的笔，没抬头。\n“大哥，你的汗国在数百年前就灭亡了。现在地图上的这个地方，叫安北都司。现在这里的牧民怕的是匪帮和流亡白军的黑枪，愁的是过冬的物资，不是谁的祖宗在哪里牧过马。”\n“祖宗？”伯雷帖木儿猛地转身，阴影在窗纸上剧烈晃动，“没有铁木真的征服，哪来的我们！没有黄金家族的荣耀，你，我，我们所有人，就什么都不是！只能穿着这身可笑的汉服，给偷走我们家园的人当看门狗！”\n“然后呢？”别烈思抬起头，目光如星，直直看向兄长被怒火烧亮的眼睛，“像一只耳一样做个土匪？还是学奶龙装神弄鬼？靠劫掠和恐吓，就能复兴我们曾经的家园？哥哥，我在北京看到的，是一个哪怕自己浑身脓疮，也在拼命生出新肉的巨人。黎星刻他们想的，是怎么治好它，让它真正强大，而不是把它如秃鹫一样将他分食过后，再退回草原去当一个可笑的马匪”\n“哦，你在军校时的那些老同学？革新？”伯雷帖木儿嗤笑一声，语调变得生硬刺耳，“他们是汉人的精英，他们的‘新世界’里，有没有我们蒙古的草原，都还是个问题！你被他们的漂亮话灌醉了，妹妹！忘了你的血是孛儿只斤的血！”\n“正因为我没忘，我才更怕！”别烈思的声音第一次有了起伏，她站起身，身姿挺拔如军校操练时的标枪，“我怕我们宝贵的血性，最后只留下匪帮的凶残，或者……变成你墙上这幅仅供哀之而不鉴之的遗照！你要恢复大元的荣光，可大元是怎么亡的？它的治下，可曾让草原上的牛羊更肥，让牧人的孩子都能活过冬天？”\n沉默骤然降临，只看得见灯影下的二人晃动着影子，缄默不语。\n伯雷帖木儿的脸在阴影里半明半暗，像是迅速冷却的熔岩。他最后看了一眼地图上那片辽阔的、虚幻的疆域，又看了看眼前穿着笔挺汉式军装、眼神却比草原鹰隼更锐利的妹妹。\n“……我们走的不是一条路，别烈思。”他的声音突然变得疲惫空洞，“你的路在南方，在那些报纸和空口号里。我的路，”他顿了顿，一字一句道，“在祖先马蹄踏过的每一寸草根下面……我们总会知道，谁是对的。”\n他不再说话，变成地图前一座冰冷的雕塑。别烈思也重新坐下，拿起笔，却久久没有再次落下。橘色的灯光将两人沉默的影子投在窗上，如同终幕的皮影戏一般，随着灯光的吹灭，任由黑暗涌来将一切吞没。"
mon_flavor.54.a:0"同根生，异梦行。"

mon_flavor.55.t:0"本是同根生"
mon_flavor.55.d:0"她没死。\n\n如今，她也到了辰龙京。\n\n已重组为情报机构的黑万字海外处的密电今日送抵紫禁城：“别烈思·孛儿只斤已于三日前在远洋共和国登陆，昨日与蒋丽华会面。”\n\n伯雷帖木儿坐在御书房深处，面前摊着华北剿匪地图。他看完电报，竟笑出声。\n\n “呵……我那妹妹，终于找到她的应许之地了？”\n\n他把电报纸丢给身旁的特务：“给远洋反建制媒体透露消息——别烈思不是什么民主斗士，她只是个输不起的野心家。当年在库伦，她举着‘宪政’旗号收买人心；当不上皇帝，就哭着跑去找汉人小女孩抱团取暖。”\n\n他起身，踱到墙边巨幅地图前，手指重重戳在美洲西海岸：“看，多讽刺——成吉思汗的直系后裔，如今寄居在一群明朝遗民的破议会里！”\n\n他转身，眼中毫无温度：“还有，放消息出去，就说若她肯回来，朕仍赐她亲王爵位，住王府，享俸禄。”\n\n特务叩首退下。\n\n伯雷帖木儿却久久未动。\n\n他顿了顿，声音低得像自语：\n\n “……你本该站在朕身边，而不是站在朕的对面。”\n\n可转瞬，他一脚踢翻火盆，火星四溅如血。"
mon_flavor.55.a:0"“既为敌，便无兄妹。”"
MON_bieliesipantao_tip:0"§C“他们说她是理想主义者……可理想主义者从不逃。他们战，他们死——他们唯独不逃。”\n——摘自黑万字内部简报《关于别烈思叛逃事件的定性》§!"

mon_flavor.56.t:0"献上忠诚"
mon_flavor.56.d:0"黑小虎走进了艾黛尔贾特的大帐。\n\n这位黑万字的实际掌控者，一身笔挺的黑色制服，胸前的倒卍字徽章在烛光下闪着寒光。他身后跟着十二名黑万字高层，人人面无表情，手按枪套，却无一人拔出武器。\n\n在大帐中央，黑小虎停下脚步，单膝跪地，动作标准得如同演练过千百遍。\n\n“黑万字全体，参见大汗。”他的声音低沉而清晰，没有一丝犹豫，“唯有强者，方能统领我等。艾黛尔贾特大汗，黑万字愿为您手中的刀，为您眼中的影。”\n\n艾黛尔贾特扶起黑小虎，将一把镶金的匕首赐给他。\n\n“从今往后，”她朗声道，“黑万字将是我的利爪。去吧，替我清除所有障碍，无论是汉人朝廷的残余势力，还是布尔什维克的窥探，亦或是……那些不听话的旧贵族。”\n\n黑小虎接过匕首，深深一鞠躬：“遵命，大汗。”\n\n帐外，风雪更紧。\n\n与此同时，和一部分忠于自己的部下逃到南察哈尔的伯雷帖木儿得知黑小虎已率黑万字全员倒戈，向艾黛尔贾特宣誓效忠时，手中的茶杯“啪”地一声摔得粉碎。\n\n“混蛋！叛徒！”伯雷帖木儿怒吼道，脸涨得通红，“他怎么能……怎么敢……去舔斯拉夫蛮子的靴子！”\n\n说罢颓然坐回椅上，眼神空洞。\n\n他明白，自己彻底输了。\n\n“罢了……”伯雷帖木儿长叹一声，仿佛瞬间苍老了十岁。"
mon_flavor.56.a:0"“传令下去，收拾残部……我们能去哪，就去哪吧。”"

mon_flavor.57.t:0"狼与鹰的盟约"
mon_flavor.57.d:0"库伦汗帐内，艾黛尔贾特屏退左右，只留狼族首领灰太狼一人。\n\n“灰太狼，”她先是一番赞许，“草原之上，唯有狼族配称勇士。你们的獠牙，曾让敌人闻风丧胆。”\n\n随即，她猛地展开西征地图，眼中燃起狂热：“但真正的猎场不在草原，而在西方！我要率领铁骑，一路打进莫斯科，重建横跨欧亚的帝国。这是千载难逢的伟业，只有追随我，狼族才能从看门狗变成世界的主人！”\n\n话音未落，她语气骤冷，手按枪柄逼近：“当然，路有两条。要么做我的先锋，共享荣耀；要么做我的地毯，永世不得翻身。我的白俄军团不介意多杀一群狼，你选哪条？”\n\n灰太狼沉默良久，目光在地图与枪口间游移。最终，他咬牙解下弯刀，双手高举，单膝跪地：\n\n“狼族只认最强的头狼。大汗，愿为您撕碎西方！”\n\n艾黛尔贾特满意一笑，扶起他："
mon_flavor.57.a:0"“好，那就开始狩猎吧。”"

mon_flavor.58.t:0"圣庙前的抉择"
mon_flavor.58.d:0"衍圣公府的门，在蒙古骑兵的马蹄前缓缓洞开。\n孔德成一袭素袍立于门槛内，神色平静得近乎漠然。身后是层层叠叠的飞檐与牌匾，历朝帝王用朱砂金粉写下的尊崇——墨迹犹新，而江山已换了无数主人。\n“远客临门，不胜荣幸。”他的声音像石子投入寂静庭院，惊起几只灰鸽。翅影掠过艾黛尔贾特肩章的银饰，和腰间那把从未离身的恰西克军刀。\n她翻身下马，靴跟砸在青石板上，发出与草原截然不同的声响。\n“衍圣公，”汉语生硬，字字清晰，“我听过你的名字。他们说，你是最后一块活着的牌位。”\n孔德成微微侧身：“牌位也好，活人也罢，总要见一见新朝的君。请。”\n穿过仪门碑亭，大成殿的檐角刺入暮色。孔德成一路如孔乙己那般说着什么“天命所归”“文武兼济”令人听不懂的话语，引得众人一轰而笑。艾黛尔贾特听着，嘴角浮起一丝意味不明的弧度。她在殿前停步，目光越过他，落在那尊至圣先师像上。\n“衍圣公，”她打断他，“你说了这么多，无非想告诉我——孔家很值钱。不止那些牌匾土地，还有——”她转过身，直视着他，“你们攒了两千年的那张脸。”\n孔德成的眼皮跳了一下。\n账册摊开在黄花梨桌案上，数字如蚂蚁爬满宣纸。\n艾黛尔贾特翻得很慢。她在看曲阜周边的田产，各地孔庙的祭田，那笔在银行里滚了近百年、连战火都没能撼动的“衍圣公基金”。\n她停在一页上：修葺孔庙，白银三万两，出自某盐商“自愿捐献”。底下小字批注：该商子嗣，可入孔家私塾读书。\n她合上账册，望向窗外。碧空已被墨色泼染，孔府家丁举着火把，把千年府邸照得亮如白昼。可那光，照不进孔德成的眼睛。\n“衍圣公，”她声音出奇平静，“你养的读书人，每年从这块土地上拿走多少粮？你收的‘捐献’，够买多少枪，喂饱多少匹马？”\n孔德成缓缓放下茶盏：“孔家所收，皆用于祭祀先圣、培育士子、修缮典籍。两千年来，朝代兴替而文脉不绝者，赖此而已。”\n“文脉。”她咀嚼这个词，像在品从未尝过的肉。“汉人的文脉养了你们两千年。可你们用它养了谁？养了那些跪在门口、求一张课桌的穷人孩子吗？”艾黛尔贾特笑了。那笑容短得几乎看不清，却让孔德成感到彻骨的凉意。\n她起身走向门口。夜风撩起她额前碎发，她站在门槛与夜色之间，背对着大成殿，背对着那尊沉睡了千年的圣人。\n“孔德成，”她没有回头，靴跟落在石阶上。“你的账册我看完了。你的东西，比我想象的要多得多。”"
mon_flavor.58.a:0"儒家虽迂腐，却可用作安抚汉人的工具。留此招牌，胜过千军万马的镇压。"
mon_flavor.58.b:0"什么圣人之后？不过是囤积居奇的肥羊！"

mon_flavor.59.t:0"解放者？征服者？"
mon_flavor.59.d:0"喀山的天空已被连日的战火染成灰红。对于这座城市残存的旧沙俄贵族而言，今日曾是期盼已久的“解放日”。随着蒙古帝国西征军突破苏军最后一道防线，前沙皇时代的地主与绅士们纷纷走出家门，整理起落满灰尘的礼服，准备迎接他们心目中的“白军救星”。\n维亚切斯拉夫·巴兰尼科夫爵士，这位曾在伏尔加河畔拥有广袤领地的老贵族，便是其中最狂热的一位。据邻居回忆，他在听到蒙军先锋部队抵达城郊的消息时，激动得热泪盈眶。“是米沙吗？我的米沙一定在其中！”他反复念叨着远在远东加入流亡军团的儿子，“他们回来了，带着三色旗，来终结布尔什维克的噩梦，恢复我们的荣耀。”\n然而，现实比布尔什维克的宣传更加残酷。\n当第一支“解放者”部队踏入喀山时，并没有出现军乐齐鸣或庄严的接管仪式。映入眼帘的，是肆无忌惮的火焰与鲜血。这支由蒙古人、汉人以及白俄流亡者组成的混合军团，并未执行任何军纪，而是迅速陷入了疯狂的掠夺。\n老巴兰尼科夫在混乱中找到了他的儿子——小巴兰尼科夫中尉。年轻人正指挥着一群士兵，闯入了巴兰尼科夫家族曾经辉煌的庄园，将酒窖中珍藏百年的伏特加砸碎在地，并将昔日属于农奴（如今是集体农庄庄员）的牲畜驱赶至屠宰点。\n“米沙！你在做什么？”老父亲冲上前去，试图抓住儿子沾满血污的手臂，“这是我们家的庄园！我们是贵族！我们怎么能像土匪一样对待自己的土地和人民？”\n小巴兰尼科夫猛地转过头，眼神中透着一种令老人陌生的狂热与冷漠。他甩开父亲的手，指着身后燃烧的宅邸和远处哀嚎的人群，大声说道：\n“父亲，醒醒吧！旧世界已经死了！没有什么贵族荣誉！大汗教导我们，这个世界只有猎手和猎物！蒙古人的伟大之处，就在于他们撕碎了所有虚伪的道德枷锁！这不是劫掠，这是‘新秩序’的洗礼！只要跟着大汗，我们就能成为新的主人，哪怕这意味着要烧掉过去的一切！”\n面对儿子这套混杂着社会达尔文主义与游牧征服逻辑的疯狂言论，老巴兰尼科夫愣住了。他看着儿子那张扭曲的脸，又看了看周围那些曾经同为俄国同胞、此刻却比蒙古人更加凶残的“白军”士兵，一股巨大的寒意从脚底直冲天灵盖。\n“你……你不是我的儿子……”老人颤抖着嘴唇，声音微弱得几乎被周围的嘈杂声淹没，“你是个怪物……”\n话音未落，老巴兰尼科夫双眼一翻，在极度震惊与绝望中昏厥倒地，重重地摔在满是碎玻璃和酒液的泥泞中。\n而小巴兰尼科夫只是冷漠地瞥了一眼倒地的父亲，挥了挥手示意士兵将其拖到一边，随即转身继续投入这场盛大的狂欢。"
mon_flavor.59.a:0"在这个疯狂的世界里，有时候最可怕的不是敌人的刀剑，而是当你日思夜想的“救世主”终于降临，却发现他们带来的不是复兴，而是比你曾遭受过的任何苦难都要深邃的黑暗。"

mon_flavor.60.t:0"双头鹰的阴影"
mon_flavor.60.d:0"克里姆林宫的穹顶上覆盖着厚厚的积雪，红场再次聚集了成千上万的民众。但这并非为了庆祝革命的胜利，而是为了见证一个旧时代的幽灵在鲜血与废墟中重生。\n帝弥托利通过广播向全世界正式宣告了俄罗斯帝国的复辟，并从幻想乡迎回了基辅大公国覆灭后流亡至此的阿纳斯塔西娅·罗曼诺夫女大公。\n今日上午，在圣母升天大教堂举行的加冕典礼上，阿纳斯塔西娅头戴沉重的皇冠，手捧权杖，在圣歌中被正式加冕为全俄罗斯女皇。\n然而，在这神圣的光环背后，权力的天平却发生了微妙的倾斜。\n就在加冕前夜，冬宫的一间密室里，帝弥托利与新任女皇进行了一次长达三小时的“私人谈话”。据在场的唯一目击者——皇室老管家回忆，对话的气氛起初是温馨的，但很快变得冰冷而压抑。\n“陛下，”帝弥托利并没有下跪，而是双手撑在地图桌上，目光如炬地注视着这位名义上的君主，“您回来了，这是俄罗斯的幸运。您的血统是神圣的，是凝聚这个破碎国家的唯一旗帜。人民需要看到皇冠，需要听到‘沙皇’这个词，这样他们才会忘记红色的噩梦，才会重新相信秩序。”\n阿纳斯塔西娅微微颔首，正欲开口谈论重建教会与恢复贵族议会的事宜，却被帝弥托利抬手打断。\n“但是，陛下，”他的声音低沉而充满压迫感，“您必须认清一个现实。这二十年，您在基辅和幻想乡的茶会中度过，而我在远东的冰原上与布尔什维克厮杀。我的士兵不认识您的家族徽章，他们只认识我手中的指挥刀。俄罗斯的军队、警察、情报网，乃至每一颗子弹，都效忠于我，而非皇冠。”\n他走近一步，几乎贴到了女皇的耳边，语气轻柔却暗藏杀机：“您可以保留您的头衔，享受您的尊荣，成为俄罗斯母亲神圣的象征。您可以签署我呈上来的每一份法令，可以在阳台上向民众挥手，可以在教堂里接受祈祷。除此之外，请勿插手任何政务。”\n帝弥托利从怀中掏出一份早已起草好的《摄政法案》，轻轻放在桌上：“签字吧，陛下。承认我为‘终身护国摄政王’，拥有除废黜君主外的一切权力。这是您回归的条件，也是罗曼诺夫家族继续存在的唯一保障。如果您拒绝……我想，历史可能会遗憾地记载，阿纳斯塔西娅女大公因‘突发心脏病’不幸离世，而俄罗斯将不得不寻找另一位更‘合适’的继承人。”\n阿纳斯塔西娅看着那份文件，她的手在颤抖，但最终，她拿起了笔。\n“为了俄罗斯……”她低声喃喃，签下了自己的名字。\n帝弥托利满意地收起文件，单膝跪地，行了一个标准得无可挑剔的臣子礼：“英明之举，陛下。从今往后，您将是俄罗斯的灵魂，而我，将是俄罗斯的大脑与拳头。我们将共同开创一个伟大的时代。”"
mon_flavor.60.a:0"俄罗斯母亲不需要沙皇的权力，她只需要沙皇的符号。"

mon_flavor.61.t:0"长生天梦碎"
mon_flavor.61.d:0"库伦的夜风裹挟着砂砾，抽打在蒙古包的厚毡上，发出沉闷的声响。帐篷内，炭火将伯雷帖木儿的影子拉得细长而扭曲，如同一条盘踞的巨龙。帝弥托利站在他面前，身后是沉默如铁的白俄军官团。他们曾是为了罗曼诺夫王朝流亡东方的孤臣，如今却成了夹在两个疯狂梦想之间的弃子。\n“帝弥托利，”伯雷帖木儿的声音低沉，带着不容置疑的威严，“你的士兵需要粮食，你的战车需要燃油。而大元帝国，需要一把锋利的刀来统一这片土地。”\n他站起身，走到地图前，手指重重地按在长城以南：“向我效忠。让白军成为大元的先锋。作为回报，当神州臣服之日，我将倾举国之力，助你们打回莫斯科，重建俄罗斯的荣耀。”\n帝弥托利的喉结滚动了一下。这是他们梦寐以求的条件——回家的路。他缓缓单膝跪地，身后的白俄军官们也随之跪下。没有激昂的誓言，只有膝盖撞击地面的闷响。从这一刻起，双头鹰的旗帜将暂时收起，取而代之的是大元的索永布旗。\n伯雷帖木儿满意地点了点头，但随即，他的眼神变得阴鸷如鹰：“不过，在这之前，有一块绊脚石必须搬开。”\n他转过身，盯着帝弥托利的眼睛：“艾黛尔贾特。”\n这个名字让帐篷内的空气瞬间凝固。\n“她是个疯子，”伯雷帖木儿冷冷地说道，语气中透着毫不掩饰的厌恶，“一个斯拉夫女人，却妄图戴上成吉思汗的皇冠，复兴什么‘蒙古帝国’。她不仅背叛了自己的血统，更是对我黄金家族尊严的亵渎。我的臣民可以接受白俄盟友，但绝不能接受一个被异族灵魂附体的‘大汗’。”\n帝弥托利低下了头。他何尝不知艾黛尔贾特的疯狂？那个女人早已忘记了自己是白俄流亡者，整日沉浸在成吉思汗的幻梦中。在她眼里，俄罗斯只是通往“新世界”的跳板，而白军不过是她实现野心的消耗品。\n“她必须死，”伯雷帖木儿的声音轻得像是在谈论天气，“而且必须由你的手去做。这是你投名状的最后一步。”\n帝弥托利沉默了片刻，最终缓缓开口：“遵命，大汗。”\n三天后的深夜，艾黛尔贾特的军帐里，烛火摇曳。她正对着地图喃喃自语。突然，门被撞开，黑衣人如影子般涌入。她想喊，喉咙却像被铁钳扼住。一柄短匕直刺入她的胸口，她踉跄后退，撞翻了案几，地图散落一地\n次日清晨，库伦城头，帝弥托利站在高台上，面对着他的士兵，也面对着远方北京的方向。\n“从今天起，”他的声音传遍全场，“我们是大元的利刃。我们的目标只有一个——统一神州，然后，回家。”\n台下，白俄士兵们齐声怒吼，声音中夹杂着对故乡的渴望和对现实的无奈。而在他们脚下，艾黛尔贾特的尸体已被草草掩埋，就像她那个荒诞的“蒙古帝国”梦一样，无声无息地消失在历史的尘埃中。"
mon_flavor.61.a:0"双头鹰折断了翅膀，甘愿沦为狼群的爪牙。"

mon_flavor.62.t:0"汉家血脉"
mon_flavor.62.d:0"一份名为《蒙汉同源考·高祖遗脉辨》的奏折被呈到了大元皇帝别烈思的案头。撰写者是一位小有名气的历史学家，他在文中大胆提出一个惊世骇俗的假说：成吉思汗的祖先并非传说中的苍狼白鹿，而是西汉高祖刘邦流落草原的后裔！虽然文中引用的证据多为牵强附会的野史和断章取义的诗词，缺乏确凿的考古支持，但这并不妨碍别烈思眼中迸发出狂热的光芒。\n\n“原来如此！原来如此！”别烈思在殿内来回踱步，兴奋得难以自抑，“朕一直觉得，朕能统一神州，不仅是天命所归，更是血脉使然！若朕真是汉高祖的后代，那大元帝国就不是异族征服，而是‘刘家天下’的回归！是汉蒙一家的终极证明！”\n\n她立即下旨，召集全国顶尖的历史学家、考古学家入宫“研讨”，学者们纷纷“挖掘”出各种“铁证”，从基因相似度到民俗巧合，硬生生将这一假说包装成了“无可辩驳的真理”。\n\n今日早朝，别烈思身着龙袍，庄严宣布：经朝廷考证，黄金家族实为汉高祖刘邦之嫡系分支。为正本清源，彰显正统，她决定改姓为“刘”，并废除蒙古旧名，启用全新的汉家名讳。\n\n“朕乃大汉子孙，今日重归汉姓，愿与天下臣民共筑万世基业！”别烈思目光灼灼地看向群臣，抛出了三个她亲自圈定的名字供太史局选定。"
mon_flavor.62.a:0"刘蕾"
mon_flavor.62.b:0"刘蓓丝"
mon_flavor.62.c:0"刘蓓"
MON_beileisi_liulei_tip:0"§C花蕾初绽，象征帝国如春日花朵般重新绽放，充满希望与生机。§!"
MON_beileisi_liubeisi_tip:0"§C‘蓓丝’既含汉意，又保留原音，体现蒙汉合璧，不忘根本。§!"
MON_beileisi_liubei_tip:0"§C简洁有力，如蓓蕾含苞，既有汉风又不失决断，象征蓄势待发。§!"

mon_flavor.63.t:0"孝陵祭文"
mon_flavor.63.d:0"秋风萧瑟，钟山苍松翠柏间，一场史无前例的祭祀大典正在举行。大元皇帝别烈思并未身着蒙古传统的质孙服，而是换上了一袭素净的汉式深衣，屏退左右侍卫，仅率数名文官，徒步登上明孝陵的神道。\n\n在明太祖朱元璋的陵寝前，别烈思整理衣冠，行三跪九叩大礼，姿态之恭敬，令随行的前朝遗老和在场百姓无不震惊。随后，她亲自展开一卷黄绫祭文，声音哽咽地朗读起来。\n\n“后学别烈思，敢昭告于大明太祖高皇帝之灵曰：”\n\n“昔者元室失德，视汉南如草芥，分四等以虐民，废科举以愚众，致使神州陆沉，生灵涂炭。高皇帝奋起淮右，驱除胡虏，恢复中华，实乃天命所归，人心所向。前元之亡，非战之罪，实乃自绝于天地，自弃于华夏！”\n\n“朕虽出黄金家族，然考诸史籍，究其本源，实乃汉家血脉流落草原者。昔日迷途，误信异说，行压迫之政；今日醒悟，方知华夏一体，蒙汉同源。朕之祖先，即高皇帝之远亲；朕之江山，即高皇帝之托付！”\n\n“朕今立誓：朕将带领华夏儿女，洗刷百年屈辱，重塑汉唐雄风。”"
mon_flavor.63.a:0"“若违此誓，天人共戮！”"

mon_flavor.64.t:0"狼主临阙"
mon_flavor.64.d:0"灰太狼的专车缓缓停在孔庙前。当这位狼王踏入这片儒家圣地时，空气中弥漫着一丝难以言喻的紧张。\n\n衍圣公孔德成早已率领孔氏全族及曲阜士绅，在孔庙大成殿前跪候多时。见灰太狼走近，孔德成伏地叩首，声音洪亮而恳切：\n\n“陛下受命于天，重建大元，一统神州。昔日元世祖尊孔崇儒，方有百年盛世。今陛下虽出狼族，然仁德布于四海，法度立于九州，实乃天命所归之真龙天子！孔家守庙两千载，愿为陛下祈福，祝国祚绵长。唯乞陛下开恩，保全衍圣公爵位，勿废祭祀，勿动庙产。若蒙恩准，天下士子必感念陛下再造之恩，争相归心，共筑太平！”\n\n孔德成抬起头，眼神中既有对权力的敬畏，也藏着一丝对“狼性”本能的恐惧。他偷偷观察着灰太狼的表情，等待着裁决。\n\n灰太狼身着融合了蒙古风格与现代军装的礼服，目光深邃地扫过这座古老的庙宇。他当然知道孔府里藏着历代帝王赏赐的无数珍宝，那是足以充实国库的巨大财富。但他更清楚，对于刚刚重建的大元帝国而言，人心的归附比黄金更重要。\n\n“衍圣公，”灰太狼缓缓开口，声音平稳而有力，“你把我比作真命天子，这马屁拍得倒是响亮。不过，我灰太狼可不是那种见到骨头就忘形的野狗。”"
mon_flavor.64.a:0"安抚衍圣公，确立“尊儒重道”国策。"
mon_flavor.64.b:0"嘲讽一番后离去"
MON_huitailang_yanshenggong_tip1:0"§C“圣人之后，理应优待。你的忠诚我收下了。”§!"
MON_huitailang_yanshenggong_tip2:0"§C“什么真命天子，不过是些陈腐的调调。我灰太狼靠的是爪牙和智慧打下的江山，不需要你们这些老古董来背书。孔府留着吧，但也别指望我会像前朝那样捧你们上天。”§!"

mon_flavor.65.t:0"圣裔归凡"
mon_flavor.65.d:0"窗外的春雪刚刚消融，摄政太师[MON.Getleader]正坐在堆满军情地图的案前，批阅着来自全国各地的急件。自“靖难”成功、扫平群雄以来，这位手握实权的太师已成为神州帝国真正的无冕之王。天子蒋丽华深居宫中，而天下大政，皆出自这方寸书房。\n\n副官轻手轻脚地走进来，双手呈上一份加急电报：“太师，曲阜衍圣公府发来的贺电。”\n\n太师停下手中的朱笔，漫不经心地接过电报。纸上满是溢美之词，用极其华丽的骈文歌颂太师“功盖周公、德超伊尹”，称其为“万世师表之守护者”、“再造华夏之圣人”，并恳请太师接受孔府献上的历代御赐珍宝，以表“拳拳拥戴之心”。字里行间，透着旧式士大夫那种根深蒂固的投机与谄媚，仿佛只要把马屁拍得足够响，那个传承了八百年的“衍圣公”爵位就能稳如泰山。\n\n太师扫了一眼，嘴角勾起一抹淡淡的冷笑。他没有读完，甚至没有第二眼多看，随手将那份沉甸甸的电报揉成一团，精准地丢进了脚边的废纸篓里。纸团在废弃的文件堆中弹了一下，彻底没了声息。\n\n“什么衍圣公，什么世袭罔替，”太师拍了拍手上的灰尘，声音平静得让人不寒而栗，“封建余孽的爵位，不该存在于新神州。”\n\n“传令下去，即刻废除‘衍圣公’爵位。孔氏后人不再享有亲王待遇，不再拥有独立司法权和免税田产。从今往后，孔德成及其继承人，改任‘大成至圣先师奉祀官’。”\n\n太师站起身，走到窗前，望着远方的天空：“告诉他，这个官职是国家的公务员，领国家薪水，守祖宗庙堂，除此之外，他和其他百姓没有任何区别。若敢再以‘公爷’自居，或以此爵位招摇撞骗，一律按律法严惩。”"
mon_flavor.65.a:0"在新神州，只有法律和职责，没有天生的贵族。"

mon_flavor.66.t:0"继续尊孔"
mon_flavor.66.d:0"空气凝重得仿佛能滴出水来。大元皇帝伯雷帖木儿端坐在原本属于衍圣公的太师椅上，手中把玩着一只从供桌上顺手拿起的玉杯，眼神中透着毫不掩饰的轻蔑与审视。在他脚下，衍圣公孔德成伏在地上，额头紧贴着冰冷的地砖，声音因极度的紧张而微微颤抖，却仍极力堆砌着最华丽的辞藻。\n“陛下乃天命所归，神武盖世，虽出草原，实承中华正统之运。”孔德成不敢抬头，只能对着地砖说话，“昔日元世祖忽必烈尊孔崇儒，封圣加号，方有百年盛世。今陛下重建大元，正是文脉复兴之时。孔家世受皇恩，守庙两千载，愿为陛下祈福，祝国祚绵长。唯乞陛下开恩，保全衍圣公爵位，勿废祭祀，勿动庙产，则儒家感念陛下再造之恩，天下士子必归心矣。”\n伯雷帖木儿听着这些陈词滥调，嘴角勾起一抹冷笑。他打心底里看不起这个只会磕头、满口仁义道德却手无缚鸡之力的“圣人后裔”。在他眼中，这些儒生不过是些软弱无用的两脚羊，所谓的“仁义”在铁骑面前不堪一击。他甚至有些冲动，想直接让人把这聒噪的老东西拖出去，把孔府的金银财宝搜刮一空，分给前线的将士。\n然而，当他目光扫过窗外那些噤若寒蝉却又暗中窥探的士绅百姓时，理智压住了暴虐。他想起了历史上那个庞大却短命的蒙元帝国——之所以能统治中原近百年，靠的不仅仅是屠刀，还有对儒家文化的利用。忽必烈当年保留衍圣公爵位，并非出于尊重，而是为了安抚汉人，让这群读书人成为统治的帮凶。\n“哼，”伯雷帖木儿冷哼一声，将玉杯重重地顿在桌上，吓得孔德成浑身一颤，“你这老东西，废话连篇。朕本不屑于你们这套虚伪的礼教。”\n他站起身，高大的阴影笼罩了孔德成：“但朕是个务实的人。朕知道，要统治这片土地，光靠马刀是不够的，还得靠你们这张嘴，靠你们手里的笔。既然前元有过‘尊孔’的先例，那朕也不妨做个顺水人情。”\n伯雷帖木儿俯下身，用一种居高临下的语气说道：“听好了，孔德成。朕留你这条狗，不是因为你是什么圣人之后，而是因为你对朕还有用。‘衍圣公’的爵位，朕准了！你的田产、你的特权，朕也照旧给你。但你要记住，从今往后，你不再是高高在上的‘公爷’，而是朕的一条看门狗！你要替朕告诉天下的读书人：顺我者昌，逆我者亡。若敢有二心，朕不仅撤了你的爵位，还要拆了这孔庙，让你们的祖宗永无宁日！”\n孔德成如蒙大赦，连连叩首，额头上渗出了冷汗：“谢陛下隆恩！谢陛下隆恩！草民……不，臣定当竭忠尽智，为陛下教化万民，绝不敢有丝毫懈怠！”\n伯雷帖木儿满意地转过身，大步走出大堂。他不需要尊重孔子，他只需要利用孔子。只要能让那些汉族精英乖乖纳税、乖乖服从，演一出“尊孔重道”的戏又何妨？\n“传令下去，”他对身后的将领吩咐道，“宣布朕继承元世祖遗志，尊崇儒术，保留衍圣公一切待遇。另外，让孔德成立刻写一篇《劝学篇》，告诉那些读书人，为大元效力才是最大的‘忠义’！”"
mon_flavor.66.a:0"让那些读书人去哄骗百姓吧，我们只管握紧刀柄。"

mon_flavor.67.t:0"彩虹屁"
mon_flavor.67.d:0"喜羊羊刚处理完最后一份关于全国粮食调配的文件，揉了揉有些发酸的太阳角。作为新中国的最高领袖，他刚刚完成了看似不可能的任务——在不流太多血的情况下，用智慧、谈判和一点点“青青草原式”的奇迹，统一了四分五裂的中国。\n\n“阁下，曲阜衍圣公府电报。”秘书递上一份长长的电文。\n\n喜羊羊接过电报，刚读了一句，嘴角就忍不住抽搐起来。\n\n“……喜领袖乃天降祥瑞，智圣再世，其谋略胜过诸葛孔明，其仁德超越尧舜禹汤……孔府上下，感泣涕零，愿奉领袖为‘万世智慧之主’，并拟在孔庙旁立‘喜圣碑’，永世传颂……”\n\n电文足足有三页纸，全是这种让人脸红心跳的溢美之词。衍圣公孔德成似乎把几千年来拍马屁的词汇都掏空了，甚至发明了许多新词，只为表达对新领袖的“无限崇拜”。\n\n喜羊羊看着看着，不禁哭笑不得。他放下电报，无奈地摇了摇头：“这也太夸张了吧？我只是做了该做的事，怎么就成‘智圣’了？还立碑？要是真立了，以后孩子们来参观，岂不是要对着我的雕像背课文？”\n\n他本想提笔回一封电报，让孔德成务实一点，别搞这些形式主义。但转念一想，最近为了统一大业，自己已经好几天没睡个好觉了，连去实验室研究新式青草蛋糕的时间都没有。为了这点事再去起草文件、开会讨论，实在太累了。\n\n“算了，”喜羊羊打了个大大的哈欠，顺手将那份充满“彩虹屁”的电报折好，塞进了抽屉的最底层，“只要他们不惹事，不浪费公款立碑，爱怎么说就怎么说吧。反正我也听不见。”\n\n他站起身，伸了个懒腰，对着秘书喊道：“通知食堂，今晚我要吃两碗青草面，加两个荷包蛋！吃饱了才有力气想明天的事。至于孔府的电报……就先让它在那儿待着吧，也许过阵子他们就忘了这茬了。”\n\n于是，一场可能引发政治讨论的“尊号风波”消弭于无形。衍圣公在曲阜翘首以盼回音，却不知北京的那位年轻领袖，此刻正忙着思考晚饭吃什么。"
mon_flavor.67.a:0"是啊，吃什么？"

mon_flavor.68.t:0"打倒孔家店"
mon_flavor.68.d:0"窗外的蝉鸣声声入耳，屋内却是一片清凉。兔子正审阅着来自全国各地的信件和电报。当目光落到一份来自山东曲阜的电报时，这位见惯了大风大浪的领袖也不禁停下了手中的笔，露出一幅不知是哭还是笑的表情。\n电报是衍圣公孔德成发来的。这位传承了八百年的“圣人后裔”，在电文中极尽诚恳之能事，不仅热烈拥护新政权，更笔锋一转，提出了一个令人大跌眼镜的请求：“……孔氏世受皇恩，然识时务者为俊杰。今红旗漫卷神州，大道归一。鄙人愿彻底抛弃封建余孽之身份，申请加入贵党！愿以衍圣公之名义，带头拥戴社会主义，改造思想，为人民服务。恳请组织考察批准……”\n电报后半部分还附上了孔德成连夜写成的《论儒家大同思想与共产主义的契合点》，引经据典，试图证明孔子其实是“最早的社会主义者”。\n“这老家伙，反应倒是快得惊人。”兔子摘下眼镜，揉了揉眉心，对着身边的秘书笑道，“想入党？想搞‘红色衍圣公’？这要是批了，以后党章里是不是得加一条‘世袭党员’？这岂不是成了天大的笑话？”\n他站起身，走到地图前，目光深邃：“封建的爵位，本来就是历史的垃圾堆里的东西。不管他是想真心改造，还是想换个马甲继续当老爷，这个‘衍圣公’的牌子，都不能再挂下去了。社会主义中国，不需要什么‘公侯伯子男’，只需要人民的勤务员。”\n兔子转过身，语气平静却不容置疑：“传令下去：\n第一，即刻废除‘衍圣公’爵位，收回一切封建特权、免税田产及私设武装。孔德成先生若真心想为人民服务，可以以普通公民的身份参加学习，通过考核后，作为一名普通劳动者接受组织的安排，但绝不可能因为‘血统’而特殊入党。\n第二，孔府、孔庙、孔林，这些是人类文化遗产，不是某一家一姓的私产。立即着手改造，拆除围墙，修缮古迹，将其改为公园和博物馆，向广大工农兵群众免费开放。\n第三，告诉孔德成，他的那篇‘大作’留作史料研究就好，别到处发了。要想真正融入新时代，就得放下架子，老老实实做个普通人。”\n命令很快传向曲阜。那个延续了八百多年的“天下第一家”的招牌，在这一刻被正式摘下。曾经戒备森严的孔府大门缓缓打开，第一次迎来了穿着粗布衣裳的普通百姓。"
mon_flavor.68.a:0"没有天生的贵族"

mon_flavor.69.t:0"务实之策"
mon_flavor.69.d:0"别烈思正揉着发胀的太阳穴,她习惯了面对冰冷的战报和严肃的军令，却没想到今天收到的第一份文件，竟是一封来自曲阜的、洋洋洒洒三千字的电报。\n\n衍圣公孔德成在电文中极尽阿谀奉承之能事，称别烈思为“千古第一女武圣”、“草原上的文殊菩萨”，声称孔府上下愿为女皇“焚香祷祝，世世效忠”。字里行间那种旧式文人特有的迂腐与投机，让这位向来雷厉风行的女皇忍不住噗嗤一笑，随即又无奈地摇了摇头。\n\n“这老家伙，倒是比谁都快。”别烈思将电报递给身边的侍从，嘴角挂着一丝哭笑不得的笑意，“把我比作文殊菩萨？我手上沾的血可不少，菩萨怕是容不下我。”\n\n她站起身，在殿内踱步。对于孔府，她并非没有考量。若是像对待军阀那样直接铲除，固然痛快，却会寒了天下读书人的心，给刚刚统一的局势增添不必要的动荡；若是全盘接受他的吹捧，又显得自己像个容易被糊弄的昏君。\n\n“罢了，”别烈思停下脚步，眼中闪过一丝务实的光芒，“他既然愿意低头，愿意做这个‘花瓶’，那朕就留着他。只要他不搞事，这‘衍圣公’的招牌，留着或许比拆了更有用。”\n\n她坐回桌前，亲自口授了一封回电，语气不卑不亢，既没有过度热情，也没有冷言冷语：\n\n“孔德成先生鉴：来电收悉。先生盛情，朕心领之。然朕乃一介武夫，靠将士用命方得今日，不敢妄称圣贤。先生世代守护华夏文脉，功在千秋。今神州初定，百废待兴，望先生继续恪守祖训，教化乡里，安抚民心。‘衍圣公’爵位及原有待遇，一律照旧，政府将予以保护。唯望先生勿尚空谈，多务实事，共筑太平。”\n\n电报发出后，别烈思伸了个懒腰，对着侍从笑道：“行了，这下那老家伙应该能安心睡觉了。我们也该去看看下一份关于粮食调配的报告了。”"
mon_flavor.69.a:0"此事平平无奇"

mon_flavor.70.t:0"东方的“牧首”"
mon_flavor.70.d:0"“……恭贺将军光复神圣罗斯……愿双头鹰与麒麟共舞……孔氏世守礼乐，愿为陛下祈福……衍圣公孔德成电”\n\n帝弥托利从堆积如山的公文中抬起头，手里还捏着半块没吃完的黑面包。他眯起眼睛，盯着副官手中的译电稿，眉头拧成了一个疙瘩：“孔德成？衍圣公？这是哪路神仙？某个中国政客的外号？”\n\n副官愣了一下，赶紧解释：“不，殿下。这是个……文化头衔。在中国，他们有个叫孔子的圣人，这孔德成是圣人的直系后代，世袭了八百年的爵位。在那边的读书人心里，他的地位大概……嗯，大概就像我们的全俄牧首一样，是管精神信仰的。”\n\n“哦！早说嘛！”帝弥托利大手一挥，语气豪爽得像是在分发伏特加：“既然是宗教领袖，礼数不能缺。传令财政部，拨一笔卢布作为‘教堂修缮基金’——虽然他们好像不叫教堂，叫什么庙？不管了，反正就是修房子的钱。再把一枚一等圣乔治勋章寄过去，封他个‘荣誉灵性顾问’的头衔。告诉他，他的祈祷我收到了，上帝保佑他的圣人，就像保佑俄罗斯一样。”\n\n说完，帝弥托利便不再多看那封充满骈文辞藻的电报一眼，转头又扎进了公文里：“行了，这事结了。以后这种外国宗教事务，让外交部去对接，别拿这种琐事烦我。”\n\n副官领命退下。在帝弥托利眼中，这位在中国显赫千年的“衍圣公”，不过是一个距离莫斯科万里之外、职能类似牧首的陌生神职人员。一份厚重的赏赐打发了这份热情，而帝弥托利的思绪，早已飞向了西部边境的防线。"
mon_flavor.70.a:0"一场完美的错位外交宣告完成"

mon_flavor.71.t:0"大义灭亲"
mon_flavor.71.d:0"“昏暗的灯光下，空气中弥漫着发霉的烟草味和焦虑的气息。这里曾是“黑万字”的秘密指挥中心，如今却成了困兽之斗的牢笼。伯雷帖木儿——这位曾经不可一世、试图重建大元帝国的“大汗”，此刻正焦躁地在地图前来回踱步。他身边，黑小虎正擦拭着手中的冲锋枪，眼神中满是不甘。\n\n“妹妹……不，那个女人！”伯雷帖木儿咬牙切齿，“她竟然敢背叛黄金家族的誓言！等我们重整旗鼓，一定要让她知道什么叫长幼有序！”\n\n突然，厚重的铁门被一声巨响踹开。刺眼的强光手电筒光束瞬间照亮了地下室，紧接着是整齐划一的皮靴声和拉栓声。一群全副武装的特种警察蜂拥而入，黑洞洞的枪口瞬间锁定了屋内的每一个人。\n\n“不许动！举起手来！”领队的警官声音冷冽如冰。\n\n黑小虎猛地跳起来，挡在伯雷帖木儿身前，枪口直指警察：“瞎了你们的狗眼！也不看看这是谁！这是别烈思的亲哥哥！你们这群奴才也敢闯进来？”\n\n他满脸嚣张，仿佛只要搬出这个名头，这些警察就会吓得跪地求饶：“快滚出去！否则我让陛下把你们全家都发配到西伯利亚挖煤！”\n\n领队警官没有丝毫退缩，甚至嘴角勾起一抹嘲讽的冷笑。他从怀中掏出一张盖着鲜红大印的文件，高高举起，声音在空旷的地下室里回荡：\n\n“看清楚了！这正是别烈思殿下亲自签署的一号逮捕令！罪名是：叛国罪、分裂国家罪、以及策划恐怖活动！”\n\n伯雷帖木儿的脸色瞬间煞白，双腿一软，瘫坐在椅子上。警官挥了挥手，身后的特警立刻上前，熟练地将伯雷帖木儿和黑小虎按倒在地，冰冷的手铐“咔嚓”一声锁住了他们的手腕。\n\n“不！我是黄金家族！我是大汗！”伯雷帖木儿被拖行在地，绝望地嘶吼着，“别烈思！你不得好死！你会遭天谴的！”\n\n“省省力气吧，”警官冷冷地看着他被拖出大门，“天谴没来，手铐先到了。带走！”"
mon_flavor.71.a:0"不容许任何亲情凌驾于法律之上"


mon_politics.1.t:0"神州崩溃"
mon_politics.1.d:0"最令人忧惧的变局终究还是来了——神州帝国轰然崩解，而草原的命运，亦如断线之鸢，飘摇于未知的风中。"
mon_politics.1.a:0"混乱是阶梯……"

mon_politics.2.t:0"辽满军投降"
mon_politics.2.d:0"我军以迅雷不及掩耳之势冲进了沈阳，俘虏了大半辽满军高层，东北已经是我们的囊中之物了。"
mon_politics.2.a:0"打得漂亮"

mon_politics.3.t:0"弥留之际"
mon_politics.3.d:0"漏风的帐篷内，一阵又一阵的咳嗽伴随着炭火迸裂的噼啪声；病榻前，油灯将伊欧尼亚斯·冯·弗雷斯贝尔古枯槁的面容映在帐壁上，每一次呼吸都沉重的如同破损的风箱。艾黛尔贾特与帝弥托利静立在侧，帐内只有苦涩的药味与死神身上随时垂下的镰刀。\n\n“时机……快到了。”老首领的声音从干裂的唇间挤出，鹰隼般的目光死死锁住北方，“北方的赤匪看似不可战胜，但他们内在的疾病正在侵蚀他们的力量。记住……我们的大业，在圣彼得堡的冬宫，在莫斯科的圣巴西尔大教堂.......”\n\n艾黛尔贾特却踏前一步，眼中燃烧着截然不同的火焰：“父亲，欧洲是一片烂泥潭。真正的天命在草原！在中原内乱、赤熊疲敝之际，长生天赐予的时机是重建我们的帝国——北至贝加尔湖南至两广地区，这才是属于弗雷斯贝尔古家族的冠冕！”\n\n“你……你这不知所谓的蠢货！”伊欧尼亚斯猛然咳嗽起来，随后举起手指，浑浊的双眸似要迸发火星般的颤抖地指着她，“至高无上的沙皇陛下赐予我们荣耀与姓名，你的血管里流淌着双头鹰赐予的忠诚！而你现在……竟想去做一群东亚蛮子的首领？！”\n\n“不是首领，是可汗。”艾黛尔贾特的声音冰冷而坚定，“用蒙古的怯薛们为我们夺取本应属于我们的土地，再用俄罗斯的意志统治它。这就是长生天赐予我的天命。”\n\n老将军用尽最后力气挥袖，仿佛要扫清这大逆不道的幻影：“滚！立刻……从我眼前消失！”\n\n随着帷幔的落下，将一老一少的身影隔开，如同一道深不见底的沟壑横在二者中间，艾黛尔贾特在帐外叹了口气，便随着几名上前询问的随从一并离开。\n\n伊欧尼亚斯向着帝弥托利胡乱抓去，用尽最后一丝力气说道：“听着……辅佐她.......她真的有能力带着你们重返莫斯科.......”他的瞳孔开始涣散，声音轻如耳语，但双眸仍旧如铜铃般瞪圆“若她要将这最后的血脉……葬送在不切实际的狂梦里……你必须阻止她.......用任何.......”\n\n风从帐帘的缝隙钻入，呜咽着掠过已无声息的病榻，吹动了帝弥托利额前的发丝。他低下头，用沙俄军官最标准的姿态，行了一个漫长而沉默的军礼。"
mon_politics.3.a:0"“我会的，殿下。”"

mon_politics.4.t:0"北特雷森反动派政变！"
mon_politics.4.d:0""
mon_politics.4.a:0"我们暂时管不了他们"
mon_politics.4.b:0"我们必须剿灭叛匪！"

mon_politics.5.t:0"梦"
mon_politics.5.d:0"草原那蚀骨的冬风裹挟着雪沫，拍打着这座临时营地。旗帜在冬月的注视下猎猎作响，远处山坡上成片幽绿狼眸冷冷的注视着这群陌生的人群，偶尔发出一两声长嚎刺破呼啸的风声，像是警戒，又像是呼唤着其他狼群。帐内，守夜的士兵或举着火把往返巡视，或是在帐外凝视着远方与狼群；艾黛尔贾特·冯·弗雷斯贝尔古穿着沙俄时期的军大衣——肩头的绶带已磨损脱线，再也无法维持住她的体面，正如同她的前辈们当年也没能抵挡住布尔什维克的洪流，在帐内炭火的氤氲中，她沉入了长生天独为他构筑的梦境——她化为了白海青矗立在大汗的旗杆上，凶戾的的鹰眼越过了千里，越过了簇拥的怯薛们，越过了如蝗灾般浩浩汤汤的蒙古铁骑，越过了不同城墙不同民族不同肤色的人们惊慌失措逃窜的胆怯行径；他看到了南宋的战船在烈火中沉入江底，看见桀骜不驯的中亚骑兵在黄沙中折戟，看见罗斯勇士的铮铮铁甲随坍塌的城墙一同化为了齑粉..........最终，目光从时间长河收起，聚焦在了忽里台大会上，那个正朝她微笑，并将一截用于祭祀长生天的白马马骨，向她抛来的男人——孛儿只斤·铁木真。一声狼嚎打断了长生天的梦境，艾黛尔贾特在营帐中听着手下结结巴巴叙述着远处的狼群叼来一根马腿骨后就离开的奇遇，梦境与现实在此刻轰然交汇。她凝视着那根来自狼群——抑或来自长生天的马骨，做出了必将撼动自己与整个蒙古命运的决定。"
mon_politics.5.a:0"这是长生天给我的神谕！我就是铁木真再世！"

mon_politics.6.t:0"总督衙门外的抗议"
mon_politics.6.d:0"琳迪斯签发的戒严令已下发多日，这天总督府门外已聚起黑压压的人群——牧民、商贩、连边军家属都来了。他们没带武器，只举着空粮袋、断缰绳和烧焦的税单，沉默地站着，像一片冻僵的怒火。\n\n最让琳迪斯心头一沉的，是人群最前头站着的草原长包包大人。他声音不高，却字字砸在人心上：“琳迪斯大人，我们不是来造反的。我们只想问一句：这日子，还能不能过？”\n\n底下顿时炸开锅。有人哭喊去年交了三回“边防捐”，羊圈都空了；有人说儿子被拉去南方镇压革命党，尸首都找不着；还有人指着府门：“连庙里的铜钟都被你们熔了铸子弹！”\n\n琳迪斯站在门口，手按佩枪，指节发白。身后数十名边军士兵已列阵待命，徐树铮低声催促：“大人，乱民聚众，法不容情，该清场了！”可她没动。她记得三年前初任总督，办了不少实事。这位包包大人还送过她一匹汗血宝马，说“草原敬重有骨气的官”。\n\n如今，骨头早被苛税啃光，只剩一张皮。"
mon_politics.6.a:0"开火！"
mon_politics.6.b:0"同意谈判"

mon_politics.7.t:0"安北都司保住了"
mon_politics.7.d:0"接下来七日，总督府议事厅昼夜不熄灯。琳迪斯没摆总督架子，撤了高座，与草原各族推举的代表围坐长案，茶凉了续，话断了接。她亲自执笔，逐条记录诉求——免税三年、停征丁壮、归还庙产、恢复牧区自治……\n\n双方争到第八夜，包包大人忽然起身，将一柄祖传弯刀放在案上：“若总督信得过草原，此刀可代兵符——我等愿以血誓，不叛神州。”\n\n琳迪斯沉默良久，解下腰间佩枪，与弯刀并置：“我亦以命担保，此约不毁。”\n\n第九日黎明，《北疆安民约》落印。草原诸部暂息干戈，仍奉神州正朔。"
mon_politics.7.a:0"太好了"

mon_politics.8.t:0"草原暴动"
mon_politics.8.d:0"枪声响起,琳迪斯看着子弹撕裂人群。第一轮齐射，前排倒下一片；第二轮，哭喊变成死寂。她原以为威慑足以驱散乱民——可当她看见包包大人胸前绽开的血花，那具庞大的身躯缓缓跪倒、却仍朝都督府方向撑着不肯全倒时，她就知道：完了。\n\n草原没被吓住，反而炸了。\n\n牧民烧了税所，狼族割了驿道，连一向恭顺的羊族都拿起了刀枪。边军出营平乱，反被击退，只能固守军营。\n\n琳迪斯困守孤城，电报发不出去，援军遥遥无期。幕僚们吵成一团：有人主弃城南撤，有人劝她自尽谢罪，不过还有不少人主张求助流亡白军——尽管他们没有他们的同胞苏联军队训练有素，但对抗没有专业训练的暴民绰绰有余。\n\n琳迪斯闭上眼。\n\n她知道，一旦引入白军，北疆将永无宁日。那些人不是兵，是野兽。可若不引……明日此时，她的头颅或许已在叛军马鞍上晃荡。"
mon_politics.8.a:0"我们的官兵能处置好"
mon_politics.8.b:0"求助白军"

mon_politics.9.t:0"白军政变"
mon_politics.9.d:0"琳迪斯犯了一个致命的错误：她以为自己在利用一群走投无路的流亡者，却忘了狼从来不会因为给了一口肉就变成狗。\n\n白军的行动快得惊人。他们以雷霆手段镇压了草原暴动，鲜血洗刷了每一座反抗的村落。但当最后一声枪响平息，这支军队并没有向总督府缴械复命，反而调转了枪口。\n\n深夜，总督府的大门被重炮轰开。\n\n琳迪斯在睡梦中被爆炸声惊醒，当她披衣冲出卧室时，看到的不是前来汇报战果的下属，而是端着刺刀、面无表情逼近的白俄士兵。而在队伍最前方，艾黛尔贾特一身戎装，皮靴踏过满地的碎瓷片，眼神中只有冰冷的野心。\n\n“你……你想干什么？”琳迪斯声音颤抖，“我是神州任命的总督！你敢造反？！”\n\n“造反？”艾黛尔贾特轻笑一声，笑声在空旷的大厅里回荡，令人毛骨悚然，“琳迪斯女士，你搞错了一件事。我从来就不是你的部下，也不是神州的臣民。我唯一的信仰，就是生存和征服。你给了我兵权，给了我地盘，现在，我只是拿回属于我的东西罢了。”\n\n她挥了挥手，几名白俄军官上前，粗暴地夺下了琳迪斯卫队的武器。\n\n“滚吧，”艾黛尔贾特指了指敞开的后门，那里是通往南方的密道，“趁我还没改变主意之前。”\n\n琳迪斯面如死灰，在亲信的搀扶下狼狈逃窜。她甚至不敢回头，生怕下一秒背后就会传来枪声。\n\n七日后，库伦。\n\n没有繁复的汉式礼仪，只有草原传统的祭天大典与东正教的祝圣仪式交织在一起。\n\n艾黛尔贾特身披绣有双头鹰徽的蒙古大袍，登基为“蒙古汗国”大汗。\n\n北疆的风雪呼啸而过，卷起新的旗帜——那是长生天与双头鹰的结合，象征着一种前所未有的、冷酷而强大的混合力量。"
mon_politics.9.a:0"引狼入室"

mon_politics.10.t:0"长风卷地"
mon_politics.10.d:0"数十年的憋屈，昨夜终于随着一声号角彻底炸开！\n\n那些穿着黑皮靴、说着我们听不懂的汉话、强征我们马匹和粮食的“总督府”老爷们，完了！昨晚，草原上的风不再是冷的，是热的——那是我们燃烧起来的怒火。各个部落的骑手像狼群一样从四面八方涌来，连那些原本给琳迪斯看大门的蒙古族边军兄弟，也调转枪口加入了我们。听说了琳迪斯连官印都来不及带，只在几个亲信的掩护下，连夜摸黑往长城以南逃窜。我们没追，因为没必要——让她回去告诉南边的那些大人物：草原不再是他们的牧场了！\n\n从今往后，草原的一草一木、一牛一马，都只属于草原的儿女们！谁再敢来收税、抓丁，就问问我们手里的弯刀答不答应！"
mon_politics.10.a:0"草原的风已经带来了自由的味道"

mon_politics.11.t:0"推选新草原长"
mon_politics.11.d:0"随着安北都司的官僚体制在战火中瓦解，古老的土地再次回到了牧民手中。但在庆祝胜利的篝火旁，一个迫切的问题正悬在每个人的心头：谁能接过这柄沉重的苏鲁锭长枪？\n\n在羊村的大礼堂中，三位截然不同的领袖正等待着氏族代表们的最终裁决。\n\n喜羊羊穿着简朴的学者长袍，他脖子上的铃铛声代表着智慧。他主张“科学兴蒙”，认为只有通过理性的教育与自由的社会，让草原与世界文明接轨，才能真正摆脱被奴役的命运。\n\n兔子则站在一面鲜红的旗帜下，他那双坚定的眼睛注视着最底层的牧民。他曾亲手烧毁地主的契约，主张建立工农联合公社。在他看来，唯有通过彻底的阶级觉醒与集体工业化，草原才能在列强的夹缝中挺起脊梁。\n\n而灰太狼披挂着狰狞的狼皮铠甲，指尖划过祖先留下的利刃。他毫不掩饰自己的野心——洗刷“悲鸣战役”的屈辱，重塑成吉思汗时代的铁血威权。他并不追求和平，他追求的是让整个欧亚大陆在狼嗥中再次颤栗。\n\n三条道路，三个未来。长生天的风已经吹起，而我们必须做出抉择。"
mon_politics.11.a:0"喜羊羊"
mon_politics.11.b:0"兔子"
mon_politics.11.c:0"灰太狼"
mon_politics.11.e:0"陷入僵局"

