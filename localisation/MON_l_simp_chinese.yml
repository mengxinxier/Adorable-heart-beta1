mon_flavor.33.b:0"只有获得许可证的人才能出入边境"
mon_flavor.33.c:0"只要求官兵加强来往人员审查即可"

mon_flavor.34.t:0"祭旗出征"
mon_flavor.34.d:0"雪未融，血未冷。\n\n今日，安北都司三万将士列阵于寒原之上。骑兵、步兵、炮队、兽族轻骑、汉蒙\n\n混编工兵营……旌旗如林，却只有一面大纛高悬中央——黑底金边，绣着断裂的锁链与展翅之鹰，下书四字：奉天靖难。\n\n别烈思立于点将台，着战时作训服，腰间佩剑是黎星刻当年所赠。她手中无酒，只捧一抔黄土。\n\n“今日祭旗，不祭神，不祭祖。”她的声音不高，却压过朔风，“祭所有被袁氏踩在脚下的理想，所有不肯低头的头颅，所有未能看到黎明的同袍。”\n\n她将黄土洒向空中。雪尘与灰烬共舞，如万千英灵俯瞰此地。\n\n“袁克定以为，草原只会放牧牛羊。”她猛然拔剑，直指南天，“今日，我们便让他看看——草原，也能放牧雷霆！”\n\n齐声怒吼，声震漠南。骑兵纵马绕坛三周，炮口齐鸣，连远处的狼群都为之噤声。"
mon_flavor.34.a:0"奉天靖难，誓讨袁贼！"

mon_flavor.35.t:0"摄政之责"
mon_flavor.35.d:0"北京城门洞开，未燃一炮。\n\n袁克定的“中央整备军”在居庸关溃散，她丰台兵工厂地下室被擒，身着睡衣，\n\n怀揣毒药却未敢吞。今日，她被五花大绑，押入紫禁城乾清宫——这座她曾以“摄政”之名盘踞的殿堂。\n\n蒋丽华端坐龙椅，别烈思·孛儿只斤立于丹墀之下，戎装未解，外衣尚带草原风沙。\n\n袁克定抬头，环顾四壁——昔日她在此签署通缉令、废议会、囚忠良。如今，金砖地上映出她蓬头垢面的倒影。她忽然苦笑：“成王败寇……我输得不冤。只是没想到，最后送我上殿的，是个蒙古女人。”\n\n别烈思未答。她只向天子微微颔首。\n\n蒋丽华开口，声音清越如磬：“袁克定，你囚朕于瀛台，焚宪章于午门，杀志士于暗巷——今日，非朕判你，乃神州公义判你。”\n\n她一挥手：“拖出去，交大理院公审。罪若属实，依律处决。”\n\n侍卫上前拖走袁克定。她挣扎回望，最后一眼，看见别烈思平静如水的侧脸。\n\n殿内重归寂静。\n\n少女天子缓缓起身，走下御阶，亲手将一枚蟠龙玉玺放入别烈思掌中：\n\n“孛儿只斤氏，汝以孤军起于北疆，联义师、清君侧、复社稷，功在宗庙，德被苍生。今神州未一，四方割据，朕年幼德薄，难理万机——特授汝为摄政大臣，总揽军政，代朕巡狩天下，完成统一之业。”\n\n别烈思单膝跪地，玉玺沉如山岳。\n\n真正的考验，此刻才开始。"
mon_flavor.35.a:0"她赢了战争，却接下了比战争更重的东西——一个破碎帝国的信任。"

mon_flavor.36.t:0"黄袍加身"
mon_flavor.36.d:0"她从未想过坐上龙椅。\n自库伦举义，她率边军南下，联奉天、破袁氏、清君侧、定中原；战后不揽权，不封亲，唯以摄政之名推行宪政、整肃吏治、兴办民学。五族百姓称她“安邦夫人”，士人赞她“今之木兰”，连昔日敌手亦叹：“若神州多一别烈思，何至百年沉沦？”\n可正因她功业太盛，部下寝食难安。\n今日清晨，未等朝议，三军将领、五族代表、各省督抚齐聚摄政府外，齐呼“请即帝位”。\n“大人，您已非人臣所能容！”汉人军官直言，“您平定天下，却拒称尊；您再造社稷，却甘居摄政。可天下人只认您！议会畏您，藩镇惧您，百姓仰您——若无帝号镇之，一旦您退，必生大乱！”\n兽族骑兵统领叩首泣血：“草原古谚：‘功盖山河者，不当为人臣。’您若不登基，便是置万民于危卵之上！”\n连蒙古王公也执意进言：“孛儿只斤氏血脉本贵，今又救国于倾覆——此非天命，何谓天命？”\n别烈思怒斥：“我志在靖难，不在九五！尔等此举，是毁我一生清名！”可无人退让。\n数名靖难元勋强行披黄袍于其身，抬御辇于阶下。宫门洞开，群臣山呼万岁，声震紫禁城垣。\n她终于闭目，泪落如雨："
mon_flavor.36.a:0"“……你们害苦了我啊。”"

mon_flavor.37.t:0"华夷大防"
mon_flavor.37.d:0"随着大元的旌旗再度在中原大地的地平线上升起，一种比寒风更凛冽的气息在汉地深处蔓延。这不再是数百年前那种处于封建枷锁下、盲目且迟钝的服从，而是一种在近代苦难、屈辱与启蒙中淬炼出的、前所未有的民族意识。\n\n在那些看似平静的村庄、烟囱林立的工厂以及学子的书斋里，人们正以前所未有的审视目光打量着这些归来的“征服者”。历史的记忆被重新唤醒：那是崖山的悲鸣，是百年间无数次反抗的余烬，更是对异族统治天然且深刻的抵触。这种愤怒不是火药桶，而是一场缓慢流动的岩浆。\n\n对于统治者而言，如果仅仅将这些顺民视为待割的麦子或补充征兵的数字，那将是毁灭性的误判。这种强烈的民族自豪感正化作地下电台里的代码、工厂流水线上的怠工，以及阴影中磨亮的尖刀。一旦愤怒值突破临界点，长城以南的每一座城市都将化作帝国统治的绞肉机，将所有的远征梦碎在人民战争的汪洋大海之中。"
mon_flavor.37.a:0"我们可以用刺刀教他们学会沉默"

mon_flavor.38.t:0"苍天可鉴"
mon_flavor.38.d:0"有人想给她披上龙袍。\n\n统一战争结束已两月。袁氏伏诛，割据平定，五族代表齐聚北京。朝野上下，皆称“安邦之功，古今罕有”。可别烈思仍居摄政府，每日批阅公文至深夜，力推《临时宪章》，筹备民选议会，拒受任何尊号。\n\n她的部下却坐不住了。\n\n十余名靖难旧将，趁夜决议“劝进”。他们备好玄金礼服，拟好登基诏书，甚至联络了蒙古王公与汉人士绅，欲在太和殿前发动“万民请愿”。\n\n“大人功盖天下，德震四海！”他们陈词，“若不即帝位，何以镇藩镇、慑宵小、安民心？议会软弱，天子年幼——唯有您登基，新邦方能永固！”\n\n别烈思正在批阅《边疆民族自治草案》，闻言掷笔而起。\n\n“荒谬！”她声音如刀，“苍天可鉴，我毕生所争，正是推翻逆臣！若因功高便自立为帝，与袁克定何异？与历代篡逆何异？”\n\n众将哑然。无人敢直视她的眼睛。\n\n黄袍被默默收起，劝进表焚于炉中。\n\n次日上午，别烈思照常出席宪政筹备会议，仿佛无事发生。"
mon_flavor.38.a:0"真正的权力，不是坐在龙椅上发号施令，而是拒绝龙椅，却依然被万人追随。"

mon_flavor.39.t:0"佛音再响"
mon_flavor.39.d:0"当蒙古远征军翻越葱岭时，迎接他们的并非只有紧闭的城门，还有沉睡在流沙下千年的寂静。在这条曾经连接长生天与文明核心的丝绸之路上，大汗的旗帜下不再只有刺刀的寒光，更多了一抹庄严的藏红。\n\n随着帝国宣布以佛教为国教，这场西征逐渐演变成了一场规模宏大的文化溯源。蒙古的铁蹄踏碎了当地苏丹的王座，而随之而来的并非另一场行政更迭，而是一次彻底的信仰置换。在艾黛尔贾特大汗的默许下，随军的喇嘛开始在每一个被收复的绿洲驻足。他们不再拆毁，而是开始挖掘。在那些曾被遗忘的千佛洞中，战士们放下枪炮，用粗茧的手拂去佛像面庞上的积尘。\n\n当第一声悠长的法号在喀什、撒马尔罕和巴米扬的晨曦中响起，那声音穿越了时空的阻隔，仿佛与千年之前玄奘足迹下的回响重叠。对于这片土地而言，这并非一场暴虐的置换，而是一场温柔的“唤醒”。西域那些失落已久的壁画在僧侣的守护下重获色彩，寺院的钟声与草原的牧歌交织在一起，构成了一种前所未有的和平愿景。\n\n在这个理想化的叙事中，苏鲁锭长枪成为了转经轮的支点。艾黛尔贾特试图向世界证明，蒙古帝国的回归不仅带来了征服，更带来了一个让万物在梵音中各得其所的新纪元。"
mon_flavor.39.a:0"长生天俯瞰众生，佛光普照万国。"

mon_flavor.40.t:0"第二次伊斯兰黄金时代"
mon_flavor.40.d:0"随着新蒙古帝国的兵锋跨过帕米尔高原。自13世纪那场毁灭性的蒙古西征以来，伊斯兰世界在动荡与分裂中逐渐失落了曾经的霸权，学术的星火一度在王权的更迭中黯淡。然而，当艾黛尔贾特——这位流亡而来的“长生天之女”将苏鲁锭长枪与新月旗帜并列时，历史的齿轮开始了疯狂的倒转。\n\n随着新蒙古帝国的兵锋跨过帕米尔高原，艾黛尔贾特下令保护那些在战火中摇摇欲坠的清真寺与图书馆。在布哈拉、撒马尔罕以及巴格达的废墟之上，蒙古帝国利用其庞大的版图优势，重新打通了断绝已久的商贸与学术命脉。这不是昔日劫掠式的破坏，而是一次由蒙古意志主导的全球秩序重组。在帝国横贯万里的版图上，原本匮乏的物产与断绝的商路被重新打通。兽族战士那曾经令人生畏的利爪，如今成为了丝绸之路上学者与天文器材的忠诚护卫，从天文学、医学到哲学，曾经在13世纪被旭烈兀亲手终结的辉煌，竟在七百年后由另一位“蒙古大汗”亲手重启。\n\n曾经在蒙古铁蹄下战栗的土地，如今在同样的铁蹄保护下重新焕发出伊斯兰文明全盛时期的光彩。从撒马尔罕到巴格达，被尘封的典籍被重新翻译，断绝的科学脉络得以接续。羊族的学者在清真寺的穹顶下研读几何学，白俄的军官与波斯的诗人共同探讨星象。大蒙古帝国不仅带来了征服，更用其庞大的体量与强权，终结了伊斯兰世界数百年的沉寂，开启了一个由蒙古武力支撑、智慧与信仰共鸣的伟大的“第二次黄金时代”。"
mon_flavor.40.a:0"一切赞颂悉归于安拉！让这个时代成为我们信仰的伟大时代！"

mon_flavor.41.t:0"吾即祭司王约翰"
mon_flavor.41.d:0"随着新蒙古帝国宣布确立东正教的至高地位，这场由艾黛尔贾特领衔的西征已然褪去了游牧征服的旧衣，披上了神圣洗礼的战袍。\n\n“我是阿尔法，我是欧米伽；我是首先的，我是最后的；我是初，我是终。”在二十世纪的滚滚硝烟中，那个曾让中世纪君王在梦呓中追寻的、统领东方无尽荒野的神圣君主——“祭司王约翰”，已然肉身降世。\n\n这个曾经困扰了中世纪欧洲数个世纪的东方传说，在20世纪的硝烟中以前所未有的姿态复活了。艾黛尔贾特宣称，蒙古帝国的建立并非历史的偶然，而是长生天之怒与天父旨意的终极合一。她那支由人类游牧部落与兽族血脉氏族构成的庞大军团，如今被重组为一支“草原十字军”。狼族战士那刻满符文的利爪与人类士兵的钢铁火炮，在东正教圣像画的注视下，形成了一种令人窒息的战争美学。\n\n这不再是单纯的领土扩张，而是一场旨在“净化”欧亚版图的神圣远征。从大兴安岭到多瑙河畔，十字架的旗帜与苏鲁锭长枪交相辉映，编织出一道笼罩欧亚大陆的神圣极光。祭司王约翰挥动着她的救世之剑，誓要在这片土地上建立起一个天父地母与圣灵同在的永恒国度。"
mon_flavor.41.a:0"“那坐在宝座上的说：看哪，我将一切都更新了。”"

mon_flavor.42.t:0"雪山论道的千年回响"
mon_flavor.42.d:0"当新蒙古帝国的西征大军再次踏上那条横贯东西的漫长古道时，艾黛尔贾特做出了一个深契草原宿命的抉择。她并未选择西方的十字，亦未皈依南方的佛号，而是翻开了那段尘封在《长春真人西游记》里的史诗：当年成吉思汗在雪山之巅接见丘处机，寻求“长生久视之方”。\n\n艾黛尔贾特在星坠之湖畔披上了玄色道袍，宣布长生天与“道”本为一体。她着重提到了当年丘处机对太祖铁木真的那一语千金的劝导——“欲统一天下者，必在乎不杀”。她宣称，昔日的蒙古帝国因未能完全领悟真人的“止杀”智慧，方使天命流转，令蒙古族陷入数百年分裂。而今日，她将接续这段跨越七百年的仙凡之缘，以道家“清静无为”的玄理，治愈草原久积的创伤。\n\n这场大远征不再是纯粹的杀伐，而是一场旨在“体道、行道、复道”的宏大调律。曾满怀戾气的兽族战士，开始在道家经典中寻找野性与自然的平衡。艾黛尔贾特试图建立一个顺应天理、万物各守其道的永恒汗国。从大兴安岭到多瑙河畔，古老的经文与游牧的哨音交织成一股不可名状的洪流，帝国呈现出一种宁静而恐怖的力量感——这不再是毁灭，而是为了重建寰宇阴阳平衡的神圣使命。"
mon_flavor.42.a:0"圣人执大象，天下往。"

mon_flavor.43.t:0"黑猫警长抗议"
mon_flavor.43.d:0"“此三匪，劫商旅、焚驿站、屠牧民，血债累累！今日授官，明日百姓何以信法？我们何以执法？”黑猫警长站在[MON.Getleader]的办公桌前，声音低沉，却字字如锤。\n\n[MON.Getleader]只淡淡道：“乱世用重典，亦需用非常人。他们熟悉戈壁，能控边患——你抓贼，他们防贼，有何不可？”\n\n“贼就是贼！”黑猫警长猛地拍案，“今日招安匪首，明日百姓便知——杀人放火，只要势大，便可当官！法律，从此成空文！”\n\n[MON.Getleader]不再言语，只挥了挥手。\n\n三日后，任命正式颁布。\n\n当夜，警备队队长办公室。\n\n黑猫警长独自坐在灯下，缓缓摘下肩章、警徽、配枪，一一摆上桌面。\n\n他留下一封信，仅八字：\n\n“法不可辱，职不可留。”\n\n次日清晨，他单骑出城，未带一卒，未留一语。\n\n库伦街头，只余传说：\n\n那个从不向权贵低头的黑猫，走了。\n\n而曾经的匪首，现在的执法者们，在酒馆里举杯大笑——\n\n他们的刀，如今有了官印。"
mon_flavor.43.a:0"当法律向刀剑低头，穿制服的人，便只剩两种：帮凶，或逃兵。"

mon_flavor.44.t:0"与匪帮的联系"
mon_flavor.44.d:0"戈壁深处，黑石谷。\n\n黑小虎勒马停在断崖边，黑万字的臂章在风沙中猎猎作响。他没带大队人马，只带了五个心腹——他知道，见食猴鹰，人多反而是侮辱。\n\n不出所料，崖顶一声唿哨,食猴鹰展翅飞下。\n\n“小虎！”食猴鹰跳下马，咧嘴一笑，露出金牙，“之前听说令尊不幸离世，我还为他烧了三炷香——用的是抢来的日本香。”\n\n黑小虎也笑了。他和食猴鹰相识七年，第一次见面是在库伦黑市，他替黑万字买枪，食猴鹰刚劫完一支都司边军的补给队。两人分赃不均，差点火并；结果喝了一夜酒，反倒成了“草原上最不像朋友的朋友”。\n\n“如今我代表大汗来谈正事。”黑小虎递过一卷羊皮诏书，“伯雷帖木儿登基，要整肃草原。你有两条路：死，或者——当官。”\n\n食猴鹰接过诏书，却没看，只盯着黑小虎的眼睛：“你保我？”\n\n“我保你。”\n\n食猴鹰大笑，拍他肩膀：“好！我信你！”\n\n他转身朝崖上吼：“把‘白鹰旗’烧了！”\n\n火光腾起，那面染满商旅鲜血的鹰旗化为灰烬。\n\n“我不只要归顺，”食猴鹰压低声音，“我还能让一只耳和奶龙也放下刀。”\n\n黑小虎一怔：“他们可比你难缠。”\n\n“一只耳欠我三条命，奶龙是我结拜兄弟。”食猴鹰冷笑，“再说了，有官身，谁还愿意过这种刀口舔血的生活？”\n\n黑小虎点头。他知道，这交易肮脏，但有效。\n\n三日后，库伦公告："
mon_flavor.44.a:0"“匪首食猴鹰、一只耳、奶龙率部归顺，授边防游击使，驻守南戈壁。”"

mon_flavor.45.t:0"[From.GetName]经受住了实战的考验"
mon_flavor.45.d:0"在跟随大部队四处征战的这段时间里，[From.GetRank][From.GetName]已经经历了数次实战考验，其指挥能力呈现显著跃升，已经成为了一名合格的前线指挥官。"
mon_flavor.45.a:0"祝贺你"

mon_flavor.46.t:0"稚嫩的军官团"
mon_flavor.46.d:0"鉴于流亡部队中专业前线指挥官极度短缺，我方已将大批下级军官破格擢升。然而他们缺乏实战历练，指挥能力尚未成熟，亟须通过真实作战环境加以锤炼与检验。"
mon_flavor.46.a:0"知道了"

mon_flavor.47.t:0"战火重燃"
mon_flavor.47.d:0"当第一声炮响划破宁静，沉睡的雄狮猛然睁眼。军营中，老兵拍案而起，新兵热血沸腾。舰艇引擎轰鸣，战机撕裂长空。\n“我们不是农夫，不是工匠——我们是成吉思汗的子孙！”"
mon_flavor.47.a:0"号角裂空，苍狼啸月！"

mon_flavor.48.t:0"不安定的和平"
mon_flavor.48.d:0"我蒙古铁骑以战养战，以血砺刃。然今四海升平，刀枪入库，马放南山。\n军营之中，昔日闻鼓而进、见旗而动的锐气日渐消磨。新兵操练懈怠，老兵沉溺安逸。舰艇停泊港内，战机蒙尘机库。纵有“长生天”之威，亦难振此萎靡之师。\n帝国虽广，若失其锋，终将如沙上之塔，一触即溃。"
mon_flavor.48.a:0"暂且休养，蓄势待发"

mon_flavor.49.t:0"开启大远征"
mon_flavor.49.d:0"在斡难河源头的祭坛前，艾黛尔贾特沉默地注视着脚下跪伏的人群。她的身份本应是这片土地的异邦人，但在这一刻，她是长生天选中的唯一容器。在她身侧，狼族的利爪紧握着印有符文的战旗，人类牧民的呼吸在严寒中凝结成冰森的雾气 。\n\n这是由绝望与狂信堆砌而成的恐怖图景。数百年以来，草原勇士们被迫在阿尔泰山的夹缝中残喘。但现在，所有的屈辱都在艾黛尔贾特的口令下转化为毁灭性的动能。她并不在乎血脉的正统，她只在乎将那个从大兴安岭延伸至多瑙河的宏大版图重新涂满鲜血 。\n\n这不是一场复国运动，这是一场病态的祭典。白军的野战炮与草原勇士的原始勇气被粗暴地糅合在一起，形成了一个跨越时代的战争怪物。当苏鲁锭长枪再次竖起时，整个欧亚大陆的旧秩序都将在那带着俄语口音的“成吉思汗”名号下战栗。"
mon_flavor.49.a:0"旧神已死，新主降临。大远征，即刻启程。"

mon_flavor.50.t:0"汉人的最后希望"
mon_flavor.50.d:0"远洋共和国，辰龙京，国会大堂。\n\n海风穿堂，烛影摇红。台下坐满了衣冠整肃的面孔——他们的祖辈在明末流亡于此，他们在此扎根三百年，奉华夏正朔，守礼乐衣冠。\n\n而今日，一位少女缓步登台。\n\n她身着素白衣裙，外披玄色斗篷，发髻简单，面容清瘦却目光如电——正是神州帝国末代天子，蒋丽华。\n\n一月前，中华大地的最后一片土地被重新崛起的蒙元占领。她乘英国商船，辗转南洋，终抵此地。\n\n此刻，她立于台上，声音清越而沉痛：\n\n“诸位父老，兄弟姐妹……你们，是汉人的最后希望。”\n\n全场寂然。\n\n“伯雷帖木儿不是复国，是灭种！他不仅要我们的土地，更要我们的魂！他烧书、杀人、毁祠堂，就是要让后世子孙忘记自己是谁！”\n\n“神州已无净土。唯此一隅，尚存华夏之魂！”\n\n“你们在此建共和而不弃礼教，用西法而不忘祖训——这，才是真正的文明火种！”\n\n她声音陡然激昂：“今日我以神州末帝之名，恳请诸君：积蓄力量，训练子弟，保存典籍！待中原有变，便是我等反攻之日！”\n\n“或许十年，或许百年……但只要你们还在，汉人的脊梁，就未断！”全场起立。\n\n老者拭泪，青年握拳，少年齐呼：“光复神州！再造华夏！”\n\n蒋丽华深深一躬，斗篷滑落，露出内衬上绣的一行小字：\n\n“留取丹心照汗青”\n\n窗外，太平洋怒涛拍岸，如千军万马奔腾西去——\n\n仿佛在回应，那尚未终结的誓言。"
mon_flavor.50.a:0"“我不求生见故国光复，但求死时，知火种未熄。”"

