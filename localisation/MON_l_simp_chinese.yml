gxc_hjj.1.t:0"重开中华天"
gxc_hjj.1.d:0"随着大元帝国最后一面索永布旗在城头落下，第二次红巾军起义宣告全面胜利！\n\n街头巷尾，锣鼓喧天。曾经被划分为“贱籍”的奴工、被强征的士兵、流亡的学子与普通农人，此刻紧紧相拥，喜极而泣。伯雷帖木儿的残暴统治已成历史，那个等级森严、人命如草芥的黑暗时代终于终结。\n\n“我们成功了！”一位老兵高举着生锈的步枪，对着欢呼的人海大喊，“从今往后，这天下不再姓孛儿只斤！这中华的天，是我们汉人自己重开的！”\n\n夜幕下，万家灯火通明。人们煮起“团结粥”，唱起新歌谣。没有盛大的阅兵，只有亿万普通人脸上久违的笑容与尊严。一个新的时代，在废墟与希望中正式降临。"
gxc_hjj.1.a:0"旧天已塌，新天重开。"

