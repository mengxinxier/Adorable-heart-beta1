mon_flavor.5.t:0"黑万字的阴影"
mon_flavor.5.d:0"在草原的暗面，一个幽灵悄然滋长。\n\n它的名字，叫“黑万字”——一个以扭曲的卍字符为徽记、以极端民族主义为纲领的秘密准军事组织。它的起源，可追溯至十年前：蒙古商人黑心虎在魏玛德国经商期间，亲眼目睹了纳粹党如何以铁腕、宣传与群众狂热重塑一个破碎的国家。他深受震撼，归国后便以“净化草原、驱逐异族、重建黄金秩序”为口号，仿照冲锋队（SA）与党卫军（SS）的模式，秘密组建了“黑万字”。\n\n早期的黑万字，不过是游走于边境的私兵团伙，靠走私军火、煽动排汉情绪壮大。但1935年，黑心虎在库伦一家茶馆被虹猫刺杀——据传，只因他策划炸毁汉蒙合办的青草铁路。\n\n其子黑小虎仓促继位。年轻人热血有余，谋略不足。无力驾驭组织内部的派系倾轧。短短两年，“黑万字”濒临分裂。\n\n就在此时，孛儿只斤·伯雷帖木儿出手了。\n\n这位黄金家族后裔以“正统继承者”身份介入，他为其注入新的灵魂——对他而言，目标从来不是“蒙古独立”，而是重建大元——一个以黄金家族为天命所归、统合汉、蒙、藏、回的新帝国。\n\n如今，“黑万字”已非昔日匪帮。它拥有地下兵工厂、青年训练营、秘密警察网络，甚至渗透进正规军。其冲锋队员身着黑袍，臂缠万字臂章，在夜色中突袭“不纯”村庄，焚烧“堕落”书籍，绑架“混血”家庭。\n\n然而组织内部仍并非铁板一块——黑小虎时常与贝尔纳黛特接触，在他看来只要蒙古能够复兴，管它是什么人领导。伯雷帖木儿则绝对排斥与贝尔纳黛特合作，在他看来，她不过是个披着贵族皮的乞丐，还是个曾经祖先曾被蒙古人奴役的斯拉夫蛮子，接受她，等于承认蒙古人无能——这是对成吉思汗之名最大的亵渎。"
mon_flavor.5.a:0"“他们忘了——当年是蒙古人教会斯拉夫人什么叫帝国。如今，竟要反过来当他们的学生？”"

mon_flavor.6.t:0"夜谈"
mon_flavor.6.d:0"草原长府邸内，火炉劈啪作响，将狼族族长灰太狼的身影放大投射在画着狼图腾的墙壁上，彷如一尊即将扑食的恶兽。\n\n“南边那龙椅上的小皇帝，快被自家的军阀撕碎了。”灰太狼低沉的声音像是在磨刀石上的锈铁一样喑哑，他的右手重重拍向了桌上的羊皮地图，在神州疆域划出五道深刻的裂痕。\n\n“这是我们拿回一切的时候了——拿回长城脚下，我们祖先的牧场！而不只是在这帐子里，像群快要老死的公羊般争吵！”\n\n羊族族长慢羊羊抚摸着梨花木拐杖光滑的曲线，眼皮都没抬：“你的狼骑即便能踏碎城墙，但是能踏出商路吗？我们七成的羊毛、三成的战马都要卖到南方。一旦开战，谁来养活草原的部众？用你的刀剑啃食风雪吗？”\n\n“我们可以抢！”\n\n“然后呢？抢一次，饿十年。你是在带领部落走向荣耀，还是带领整个草原走向坟墓？”\n\n“够了。”草原长包包大人终于开口，声音不高，却让屋内为之一静。他看向灰太狼：“狼王，你的勇气是草原的脊梁。但你可曾看清，我们身后的影子并不齐整？有多少部族，已经习惯了中原的茶叶与绸缎，甘愿做一只在圈里咩咩叫的肥羊？”\n\n他顿了顿，目光转向慢羊羊：“慢羊羊村长，你的智慧保障了草原的丰饶。但你以为，我们不断的示弱，他们就会开出更好的价钱吗？不，他们只会在宰杀肥羊时，夸赞它足够温顺。”\n\n最后，他的手指重重地点在地图北方，随即又指向地图东方：“你们都在盯着南方的群狼相争。但真正的威胁，来自北方和东方——那头已经从冬眠中苏醒的赤色巨熊和日渐崛起的樱花王座。它们饥肠辘辘，它们的目光，从未离开过这片草原。”包包大人站起身，身影在火光中显得异常高大。“我们要做的，不是在群狼撕咬时凑上去分肉，那样只会被一并撕碎。我们要让南方的汉人、北方的熊和东方的倭寇都明白——”"
mon_flavor.6.a:0"“这片草原的主人，筋骨里流淌的依然是苍狼与白鹿的血。无论是谁想伸手，都得先做好被咬断喉咙的准备。”"

mon_flavor.7.t:0"为难的总督"
mon_flavor.7.d:0"两份截然不同的电报，几乎同时送达，一先一后，沉重的落在琳迪斯总督的案头。\n\n第一份来自羊村：“奶与蜜尚不足哺育羔羊，何来余物供奉朝廷。”每一个字都如同千载寒晶，透露着一股拒人千里之外的寒意。\n\n第二份来自狼族边境：“我等依律征税，却遭狼骑冲击，铳与衣物尽被夺走。”最后一句几乎力透纸背：“甚言：‘草原的肉与皮毛，只给草原的生灵！’”\n\n琳迪斯缓缓向后靠去，她闭上眼，指尖用力揉进突突发疼的额角，仿佛这样就能把脑中那几近沸腾的焦虑按下去。来自中原的八百里加急电报虽然只有寥寥数字，但每个字都如同千钧秤砣：“安北粮饷，关乎大局，速办”。\n\n朝廷的重压不断加码，境内的生灵从数十年的镇压下露出獠牙，琳迪斯无力的瘫倒在椅背上，一股深深的疲惫感，顺着脊椎缓缓散开。"
mon_flavor.7.a:0"“我还能怎么办？”"

mon_flavor.8.t:0"蒙古治下的和平"
mon_flavor.8.d:0"当最后一名抵抗者的军旗在怯薛军的炮火下化为齑粉，自大兴安岭以西发源的“创世之息”终于吹遍了全球的每一个角落。从美洲大平原到西伯利亚，横贯万里的草原意志已不再仅仅是地理上的奇迹，而是统治全球的唯一法统。这是一个由枪炮、鲜血与法典编织而成的全球铁幕，将破碎的世界强行缝合。曾经阻塞文明动脉的关税与国境线在铁蹄下悉数崩塌，一条“超级丝绸之路”让物产空前地流动起来，世界在神圣法典的规范下告别了无序的竞争。长生天的意志带来了一种名为“蒙古治下的和平”的绝对寂静，饥馑与掠夺在高效的物资调配网络中成为了历史名词，全世界的生灵在同一个忽里勒台的旗帜下，第一次拥有了足以跨越星辰的集体愿景。然而，在这如镜面般平静的盛世湖水下，致命的暗流从未停止涌动：被强行剥离的民族记忆在千户区的深处悄然生长，而那种依靠大汗个人威望维持的恐怖平衡，正像一柄悬在人类头顶的苏鲁锭长枪，每一秒都在颤动。\n\n在大都那座由钢筋混凝土与纯金装饰而成的“大汗宫廷”高台，贝尔纳黛特独自注视着脚下的灯火。\n她还记得1936年那个寒冷的夜晚，她在杭爱山的破旧军帐里惊醒，梦见成吉思汗那抹令人胆寒的微笑。那时她只是一个流亡的白军军官，只求在远东的边缘地区求存；而现在，她成了人类历史上权势最盛的人。但讽刺的是，她感受不到任何胜利的温度。\n“这就是你要给我的启示吗？”她抚摸着腰间那柄沾满了无数文明鲜血的战刀，自言自语道。\n她亲手终结了长达数个世纪的纷争，将分散的火种聚拢成燎原的圣火，但她也比任何人都清楚，这圣火是以全世界的自由为薪柴才燃起的。她想起梦中成吉思汗的微笑，那微笑里不仅有对征服的嘉奖，似乎还藏着帝国崩解时的冷眼旁观。贝尔纳黛特发出一声细不可闻的叹息，那是跨越七百年的孤独在共鸣。她成功了，她让世界在她的呼吸中颤栗或欢呼，但此时她心中却浮现出一个挥之不去的念头——这种前所未有的繁荣与统一，究竟是文明进化的终极答案，还仅仅是在永恒的分裂轮回到来前，长生天赐予这片草原最后的一场盛大幻梦？她缓缓握紧了拳头，即便深知繁华背后即是深渊，她也必须在这幻梦破碎前，用尽余生去守住这来之不易的寰宇晨曦。\n“长生天见证了这一切，”贝尔纳黛特望着繁星，眼中闪过一丝疲惫，“我终究只是在这个冰冷的宇宙里，为苍狼与白鹿续写了一场永不醒来的血色南柯。”"
mon_flavor.8.a:0"长生天之下，万物归一。"

