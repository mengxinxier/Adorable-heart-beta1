mon_politics.16.t:0"太师之治"
mon_politics.16.d:0"厚重的朱红大门被缓缓推开，发出沉闷的声响，仿佛推开了一个时代的尘埃。[MON.Getleader]解下了腰间的弯刀，只身一人走进了这座象征着神州帝国最高权力的殿堂。殿外，是他的大军；殿内，是端坐在龙椅上、神色复杂的年轻女皇蒋丽华。\n\n空气中弥漫着檀香与紧张的气息。侍从们屏住呼吸，手按剑柄，生怕下一秒就会拔出武器。然而，[MON.Getleader]走到丹陛之下，并未像征服者那样昂首阔步，而是整了整衣冠，对着高高在上的女皇，深深地行了一个大礼。\n\n“陛下，”[MON.Getleader]的声音沉稳而清晰，回荡在空旷的大殿中，“臣自北疆而来，只为清君侧、安社稷，绝非为夺位篡权。”\n\n他抬起头，目光灼灼地注视着蒋丽华：“神州不可一日无君，正如苍鹰不可无首。臣愿尊奉陛下为天子，延续神州法统。只要陛下肯下旨，任命臣为‘摄政太师’，总揽军政以平定乱世，臣便此生誓死效忠，护陛下周全，护神州安宁。”\n\n蒋丽华看着眼前这个男人，眼中的恐惧逐渐消散，取而代之的是一种难以置信的震撼。她紧紧攥着龙椅扶手的手指慢慢松开，声音微颤却坚定：“若先生所言属实，朕……愿拜先生为太师，共图中兴。”"
mon_politics.16.a:0"吾皇万岁万岁万万岁，太师千岁千岁千千岁！"

mon_politics.17.t:0"密谋"
mon_politics.17.d:0""
mon_politics.17.a:0""

mon_politics.18.t:0"不速之客"
mon_politics.18.d:0"大会第七夜，僵局如冻土般坚硬。\n\n喜羊羊的宪政草案被王公们讥为“汉人糖衣”；兔子的土地纲领在喇嘛的诅咒中化为灰烬；灰太狼的宣言又被商团斥为“引火烧身”。三方票数胶着，草原无主——而真空，终将被暴力填满。\n\n凌晨三点，马蹄声撕裂寂静。\n\n他们来了。\n\n黑万字冲锋队——三百名黑袍战士，臂缠扭曲卍字符徽，腰佩弯刀，肩扛步枪，靴底踏碎象征五族和解的九色哈达，撞开礼堂大门。寒风卷雪涌入，火把映照出一张张冷峻如铁的脸。\n\n孛儿只斤·伯雷帖木儿缓步而入。貂裘下是定制军礼服，胸前别着成吉思汗金印复刻徽章。他未拔刀，未举枪，只冷冷扫视全场：\n\n “你们还在争论谁更‘温和’？谁更‘进步’？可笑！”\n\n他声音不高，却压过风雪：“草原不需要议会，不需要公社，更不需要向汉人乞怜的‘自治’！今日若不推我为蒙古大汗，黑万字便以火与血，清洗这软弱的时代！而你们——”他目光如刀，“要么跪下效忠，要么被历史碾碎。”\n\n室内死寂。\n\n只有火堆噼啪作响，像倒计时的钟。"
mon_politics.18.a:0"我们只好屈服"

mon_politics.19.t:0"侠之大者，为国为民"
mon_politics.19.d:0""
mon_politics.19.a:0""

mon_politics.20.t:0"北疆的抉择"
mon_politics.20.d:0"北京沦陷了——不是外敌，而是自内而溃。\n\n袁克定，那位曾以“太子”自居的袁世凯之女，如今端坐在紫禁城偏殿的临时摄政座上。年幼的皇帝反击失败，被软禁于紫禁城，内阁尽数下狱。今晨，“摄政大元帅府”便向库伦发出通电：便是撤换安北都司总督，由徐树铮接任。凡有异议者，以叛国论处。\n\n总督府内，气氛凝如寒铁。袁氏特使端坐上席，身后两名佩枪卫士目光如鹰。诸将垂首，无人敢语——毕竟，谁愿拿数万边军的性命，去赌一场胜算渺茫的勤王就在此时，一人霍然起身。\n\n“荒谬！”孛儿只斤·别烈思的声音如刀出鞘。她未着礼服，仍是一身洗得发白的士官学校旧制服，胸前却别着一枚早已被朝廷禁用的“革新同盟”徽章。“袁克定不过借清君侧之名，行曹丕篡汉之实！今日若低头，明日神州便再无宪政、无民权、无进步可言！”\n\n她直视特使，毫不退让：“南直隶已经举义，江南的革命党暗流涌动。安北铁骑，岂能为篡贼看门犬？我提议——即刻组建‘讨袁靖难军’，奉天子密诏（如有），清君侧，复国本！”\n\n厅内死寂。她的兄长伯雷帖木儿冷眼旁观，手指轻叩腰间弯刀——他或许不喜袁氏，但更厌恶“汉人宪政”。老将们则面露惶然：一边是枪口下的现实，一边是道义上的深渊。\n\n他们必须做出选择——顺从？反抗？还是在刀尖上跳舞？"
mon_politics.20.a:0"服从袁氏，接受新总督"
mon_politics.20.b:0"支持别烈思，宣布靖难"

mon_politics.21.t:0"只有沉默"
mon_politics.21.d:0"镇压结束了。\n没有凯歌，没有庆典，甚至连公告都只贴了一张——墨迹潦草，盖着怯薛大营的火漆印：“逆党悉平，安民如常。”\n可“常”早已不是从前的常。\n北京城的清晨，再听不到报童喊“号外！号外！”，只有黑万字巡逻队皮靴或怯薛军装甲车压过路面的回响。茶馆照开，却没人敢点《定军山》；私塾仍在，但先生教的第一句是：“长生天佑大元皇帝。”\n南京的秦淮河上，画舫依旧，可唱的不再是“桃花扇底江南梦”，而是新编的《成吉思汗颂》。歌女低头拨弦，眼角无泪——泪早流干了。她父亲因被怀疑“私通国民党叛逆”，被拖去雨花台，尸骨无存。\n在四川，村口的老树下，再不见老农聚谈收成。他们只是蹲着，抽烟，看地，一言不发。连孩童嬉闹都压低了声音，仿佛怕惊动什么。有人家门楣上还残留半片褪色的社会主义宣传标语，任风吹日晒，渐渐烂成灰。\n上海的报纸停了。不是被查封，是没人敢写了。最后一位主笔在印刷厂后巷被割喉，血浸透了未发的社论稿，标题是：“我们还能沉默多久？”\n而沉默，成了唯一的活法。\n人们不再提起那位流亡海外的少女天子，也不再谈论“民族，民权，民生”或“打土豪，分田地”。\n可他们忘不掉的，是汉人江山。\n不是议会、不是皇帝——而是千百年来，这片土地由汉家官吏治理，由汉家士子书写历史。纵有昏君奸臣，纵有改朝换代，终究是自家人的天下。\n如今呢？\n紫禁城龙椅上坐着蒙古大汗，地方官是达鲁花赤，连村塾教的都是“成吉思汗圣训”。孩子问：“咱们祖上是谁？”父亲只能答：“……是顺民。”\n于是人们沉默。\n他们不恨伯雷帖木儿残暴——乱世本无仁主；\n他们不怨神州旧朝覆灭——朝廷无道，世人皆知；\n他们只是……不甘。\n不甘这万里河山，从此要仰异族鼻息；\n不甘这千年礼乐，从此要向草原弯腰；\n不甘子孙后代，连“汉”字都不敢写在族谱上。\n紫禁城里，伯雷帖木儿说：“天下已定。”\n可他知道，也或许不知道——"
mon_politics.21.a:0"真正的征服，不是让人跪下，而是让人连“想站起来”的念头都不敢有。"

mon_politics.22.t:0"遍地狼烟"
mon_politics.22.d:0"镇压失败了。\n不是战术失误，不是兵力不足——而是人心不可压。\n黑万字在华北烧了三百个村子，可下一个雨夜，就有第三百零一个义军组织在废墟中成立；怯薛军在江南屠了七座书院，可逃出的学生带着油印机钻进山沟，三个月后，《民声报》已传遍浙东；元军在武汉枪决了“大汉青年团”首领，结果葬礼变成暴动，整条长江码头工人罢工三日，高呼：“汉魂不死！”\n最致命的是——人心溃了。\n城里的商人不再缴“顺民税”，乡下的保长开始藏匿“逆党”，连元军内部都有人偷偷把情报卖给地下组织。有人在墙上涂鸦：“狼吃羊，羊变火。”有人在米袋里塞纸条：“忍到春雷响。”\n他们忘了，汉人不是第一次跪在异族铁蹄之下。\n五胡乱华，衣冠南渡，汉家几近灭种，却有祖逖击楫中流，杨坚一统天下，终迎隋唐盛世；\n宋室南迁，临安苟安，汴梁父老泪尽胡尘，却有岳飞“还我河山”，文天祥“留取丹心”，薪火不灭；\n崖山之后，十万士民蹈海，华夏似已无望，可百年后，朱元璋一句“驱除胡虏，恢复中华”，应者云集，洪武日月重光；\n满清入关，扬州十日，嘉定三屠，剃发令下“留头不留发”，可汉人埋首二百年，终以金田村一举，扫清妖风！\n千百年来，汉人屡遭践踏，却从未真正屈服。\n因为他们的脊梁，不在膝盖，而在史书里、在祠堂中、在母亲教孩子的第一句“我是汉人”里。\n伯雷帖木儿拍碎了三张地图桌，怒吼：“给我烧！杀！夷平！”\n可他的将军们低头不语——兵不够了，粮断了，连怯薛军都开始出现逃兵。\n而远方，远洋共和国的广播每晚准时响起蒋丽华的声音：\n “同胞们，你们不是孤军。火种未熄，汉魂尚在。”\n更糟的是，别烈思从辰龙京发来公开信，题为《致我兄伯雷帖木儿书》：\n“你用刀剑筑起的帝国，终将被千万双手推倒。因为——人民不想活在恐惧之中。”\n紫禁城的灯光彻夜未熄。\n而城外，第一缕春风吹过中原大地——\n吹醒了冻土，也吹燃了那些本以为已熄的火。"
mon_politics.22.a:0"他们以为恐惧能让人屈服……却忘了，当人一无所有时，恐惧就失去了重量。"

mon_politics.23.t:0"红巾再起"
mon_politics.23.d:0"他们本不该联手。\n\n神州帝国的军官痛骂革命党是反贼，国民革命军的老兵憎恨红军的“赤化”，红军游击队则视前两者为“反动派走狗”。\n\n但如今，他们的残部，以及成千上万的汉人自发组成的义军联合起来\n\n神州帝国近卫军最后一支装甲连，仅剩七辆德国制二号坦克，炮管锈蚀却仍能怒吼；\n\n国民革命军第十九路军旧部，白发老兵抱着汉阳造，胸前别着褪色青天白日徽；\n\n红军鄂豫皖游击支队，衣衫褴褛，却人人臂缠红布条，高唱《国际歌》。\n\n在金陵的临时司令部，各路义军首领对视良久，最终，他们共同举起一条染血的红巾。\n\n“从今日起，不问主义，不争正统，只问——是不是汉人？”\n\n次日，檄文传遍天下：\n\n“吾等本不同路，然胡虏暴虐，屠我父老，毁我宗庙，禁我言语，断我史书！今虽政见各异，然血脉同源，耻辱共担。故合兵一处，复举红巾，号曰‘第二红巾军’！”\n\n大都地堡内，伯雷帖木儿盯着地图上骤然亮起的数十个红点，终于明白——\n\n他点燃的不是叛乱，而是积压的火山。\n\n而这一次，\n\n红巾所至，寸草不留。"
mon_politics.23.a:0"镇压这群反贼！"
mon_politics.23.b:0"§R驱逐胡虏，恢复中华！§!（切换到第二红巾军）"

mon_politics.24.t:0"安徽失陷"
mon_politics.24.d:0"庞雨本是桐城一介小吏，父死于黑万字清乡。他藏身山中三年，昼伏夜出，\n\n聚拢流民、溃兵、矿工、塾师，凡有血性者，皆纳为“安庆营”。\n\n起事那夜，安庆营五百人突袭府城。\n\n庞雨亲率敢死队攀城墙，腰间只缠三枚手榴弹。城门破时，他浑身浴血，左臂中弹，仍高举火把，吼出一句：“今日不复汉土，誓不还乡！”\n\n守城蒙古千户欲逃，被安庆百姓拖下马，乱石砸死。\n\n七日之内，安庆、庐州、芜湖、徽州……全省十六府尽数光复。\n\n庞雨不称王，不建号，只在巡抚衙门挂一木牌，上书：\n\n“安庆临时军政府——代天讨逆，复我汉疆。”"
mon_politics.24.a:0"“我想救这天下，但先得活下来。活下来，才有资格谈救。”"

mon_politics.25.t:0"赤潮再起"
mon_politics.25.d:0"上海，凌晨三点。\n\n杨树浦电厂的汽笛突然长鸣——不是故障，是信号。\n\n紧接着，闸北纱厂、南市码头、吴淞兵工厂……数百处工厂同时拉闸断电。\n\n黑暗中，红旗升起，口号如雷：\n\n“全世界无产者，联合起来！”\n\n“打倒蒙古贵族！解放工农大众！”\n\n领头者，正是陈克——红军残部联络员，三年来隐姓埋名，在租界当排字工人，暗中重建地下网络。\n\n“他们夺走我们的土地，还要我们跪着造枪炮去杀自己人！今天，我们不跪了！”\n\n工人们用铁棍砸开军械库，用消防水龙冲击警察局，用印刷机连夜印出《告全国同胞书》。\n\n外滩的霓虹灯下，赤旗猎猎，如血如焰。\n\n消息传至大都，伯雷帖木儿拍案而起：“赤匪？！不是早被剿干净了？！”\n\n他调阅档案——陈克的名字，竟在“已确认死亡”名单上。\n\n可此刻，上海全城广播正播放他的声音："
mon_politics.25.a:0"“同志们！压迫越深，反抗越烈！今日上海起义，明日全国燎原！”"

mon_politics.26.t:0"文登举旗"
mon_politics.26.d:0"文登城外，春寒料峭。\n\n陈新站在校场点将台上，一身青色军服，腰间无刀，只挂一柄左轮。台下三千“文登营”肃立，步枪、长矛、砍刀混杂，却列阵如铁。\n\n三年前，当地达鲁花赤为剿山匪，准他与刘民有组建团练。他们没争名分，只埋头做事：修堡寨、练乡勇、设义仓、办夜校。百姓不知他们是反元志士，只道是两个能办事的“汉人管事”。\n\n如今，天下已乱，时机到了。\n\n刘民有从账房匆匆赶来，手里攥着一卷纸，脸色发白：“粮秣只够半月，火药库存不足……若元军三日内到，我们守不住。”\n\n陈新没看他，只问：“百姓愿走吗？”\n\n“愿。”刘民有声音低沉，“昨夜我挨家问过。宁跟文登营死，不在蒙元治下活。”\n\n陈新点头。他知道，民心不是喊出来的，是用一碗粥、一场医、一次护村换来的。\n\n“今日起，文登营不再剿匪。”陈新声音不高，却压过风声，“我们，就是匪——专杀胡虏的匪！”\n\n全军齐吼，声震山海。\n\n刘民有没喊口号。他默默走到台侧，打开随身木箱——里面不是银子，是三百本新印的《民约浅说》。\n\n“每卒一本，”他对文书官说，“识字的教不识字的。我们要打天下，更要知道为何而打。”\n\n当夜，文登开仓放粮，蒙古达鲁花赤在府衙被百姓拖出，乱石砸死——没人下令，是自发的。\n\n陈新站在城楼上，望向大都方向。\n\n他知道，这一旗举起，便再无回头路。\n\n而刘民有在他身后轻声说：“若我们赢了，别变成他们。”\n\n陈新没答。\n\n但他解下腰间左轮，递给亲兵："
mon_politics.26.a:0"“传令——凡抢掠民财者，就地枪决。”"

mon_politics.27.t:0"别惹美术生"
mon_politics.27.d:0"四川多山，山如铁；蜀人多忍，忍如渊。\n\n邓名本不该在此。\n\n他原是北京知名美术学院的高材生，擅工笔，尤精人物。元军南下那年，他携一卷未完成的《神州群英图》流落巴蜀，靠替茶馆画门神、为亡人描遗像糊口。世人只道他手无缚鸡之力，却不知他胸中藏有丘壑。\n\n一日，他在雅安山中避雨，误入一支义军营地。\n\n那支队伍，本是神州帝国军和红军残部拼凑：\n\n双方同仇敌忾，却互不相容。粮少时抢饭，行军时争道，几次险些火并。\n\n邓名没带刀，只带了一支炭笔。\n\n他先为阵亡将士画像——无论穿帝国军装还是红军军装，皆以同等笔墨勾勒眉目，题名立碑。\n\n他再于篝火旁讲史：“朱元璋麾下，有儒生，有和尚，有农民，甚至还有蒙古人，可他们共举‘驱胡’大旗。今日我等，难道不如古人？”\n\n渐渐地，众人看他目光变了——这画师，竟能以人心为纸，以大义为墨，绘出一支新军。\n\n邓名不凭勇力，而用奇谋：\n\n——佯装内讧，诱敌深入，伏兵四起；\n\n——借山洪冲垮蒙古骑兵，以竹索飞渡夺其火炮；\n\n——更散播流言，称“伯雷帖木儿已死”，致敌军心溃散。\n\n捷报频传，川中震动。\n\n流民扶老携幼来投，乡绅献粮输马，连土司也遣子入营。\n\n众人拥邓名为主，欲奉“大明”旗号。\n\n邓名却摇头：“今日举义，非为复旧朝，只为汉人能挺直腰杆活着！”\n\n然百姓不管这些。\n\n他们只知——"
mon_politics.27.a:0"那个画师，用一支笔，把散沙捏成了铁拳。"

mon_politics.28.t:0"闽海举刀"
mon_politics.28.d:0"福建多山，多雾，多海寇，也多——活不下去的人。\n\n黄石本不该在此。\n\n他原是辽满军麾下一名低级军官，被迫随着自己长官降元，因通晓蒙汉双语，被派往福州督办“顺民籍”编纂。\n\n三年来，他替蒙古人清点户口、征收粮秣、绘制地图，却也在每份档案夹层里记下怯薛军换防时间、火药库位置、达鲁花赤的贪腐证据。他像一把藏在鞘里的刀，等一个拔出的时机。\n\n天下已乱，而福建，蒙古驻军不过三千，余者皆是收编的土匪与降兵，军心涣散。\n\n黄石不动声色，先以“剿匪”为名，向达鲁花赤申请组建“闽海团练”。他挑的全是死士：\n\n——前神州海军水兵，恨蒙古人拆了马尾船政；\n\n——国民革命军闽西残部，家属多死于清乡；\n\n——甚至还有海盗，只要肯听令，便许其“洗白”。\n\n他不讲大义，只算利益：“跟着蒙古人，你们是狗；跟着我，你们是爷。”\n\n起事那夜，他亲自带队突袭福州火药库。\n\n行动前，他对三百死士说：“此战若败，无人会知我们姓名；若胜——史书由胜者写，而我们，就是胜者。”\n\n三日之内，闽北七县易帜。\n\n土豪献粮，渔民献船，连蒙古降将都倒戈——因黄石早握其把柄，却未揭发，只道：“今日你助我，过往一笔勾销。”\n\n消息传至北京，伯雷帖木儿震怒：“区区文吏，也敢掀朕龙庭？！”\n\n可他不知道——"
mon_politics.28.a:0"最危险的敌人，从来不是挥刀的莽夫，而是那个替你数过十年账、画过百张图、却始终低着头的人。"

mon_politics.29.t:0"百户撼龙庭"
mon_politics.29.d:0"紫禁城，午夜。\n\n急促的脚步声撕裂寂静。一名太监扑入殿中：“陛下！急报——察哈尔……丢了！”\n\n伯雷帖木儿正在对着地图焦头烂额，闻言猛地转身，眼中寒光如刀：“什么？！察哈尔乃大都北门，驻军五千，堡寨十二座，三日之内就丢了？！”\n\n“是……是反贼突袭，里应外合！戍卒营、马场、驿站……一夜尽陷！如今阴山以南，皆竖‘汉’字红旗！”\n\n伯雷帖木儿一拳砸在地图上，震得烛火乱晃：“谁干的？！”\n\n太监低头，声音发颤：“回陛下……是……是原北境戍卒营百户，王斗。”\n\n“王斗？”伯雷帖木儿皱眉，“百户？哪个百户？！”\n\n“就是那个三年前从宣府流放来的汉军……平日沉默寡言，只知练兵屯田，连达鲁花赤都说他‘老实可用’……”\n\n伯雷帖木儿愣住。\n\n他想起来了——档案里确有此人：无背景，无功名，无党羽，只因在一次剿匪中“斩首七级”，被破格授百户，派去察哈尔看马。\n\n可就是这个“老实人”，在蒙古人眼皮底下，悄悄练出了一支铁军。\n\n——他不搞宣传，不拉帮派，只在烽燧下开垦荒地，秋收藏粮；\n\n——他不喊“复汉”，不举“共和”，只对部下说：“跟着我，有饭吃，有仇报，死了有人埋。”\n\n——他用三年时间，把三百戍卒，变成三千敢死之士；把废弃马场，变成火器库；把边民、矿奴、逃兵，拧成一股绳。\n\n如今，这股绳，勒向了大都的咽喉。\n\n伯雷帖木儿缓缓坐回椅中，脸色铁青。\n\n这场火，已经烧到了家门口。\n\n而点火的人，\n\n曾是他最瞧不起的——一个边军小兵。"
mon_politics.29.a:0"反贼在这里，在大都边上？"

mon_politics.30.t:0"赵瀚拿江西"
mon_politics.30.d:0"江西的土，是红的——一半是泥，一半是血。\n\n赵瀚本不该活到今天。\n\n十年前，前神州天子蒋丽华尚未登基，他还是个饿得啃树皮的孤儿。那年大旱，吉安府的粮仓堆满陈米，而他父母死在去粥棚的路上，手里攥着半块观音土。\n\n他没哭，只问了一句：“为什么他们有粮，我们只能等死？”\n\n没人答。\n\n于是他带着十几个饥民，夜袭庐陵县最大的粮绅——一把火烧了黄家粮仓，开仓放粮，当众砍下黄老爷的头，挂在城门上。\n\n官府通缉令上写：“庐陵赵贼，聚众作乱，形貌瘦弱，性极凶狡。”\n\n可百姓偷偷叫他“赵先生”。\n\n因为他分粮不抢粮，杀土豪不伤平民，还教孩子念：“人人生而平等。”\n\n如今，大元遍地狼烟。\n\n赵瀚知道，时机到了。\n\n他在井冈山下搭起高台，三千子弟肃立。\n\n他没穿锦袍，仍是一身洗白的粗布短打，脚踩草鞋，腰间别着那把杀了黄老爷的柴刀。\n\n“从今往后，我们叫——大同军！”\n\n他展开一面新旗：黑底红字，上书“大同”。\n\n“伯雷帖木儿说汉人该跪着活——我不信！”\n\n“蒙古贵族说土地是他们的——我偏要分给耕田的人！”\n\n“有人说乱世只能靠刀——可我要让刀，护住读书声、织布声、孩子的笑声！”\n\n全军齐吼：“大同！大同！”\n\n三日之内，吉安、抚州、赣州十七县响应。\n\n农民扛锄头来投，塾师带书入营，连小吏也送来地图。"
mon_politics.30.a:0"我不做救世主，只做点火的人——火种在百姓心里，不在龙椅上。"

mon_politics.31.t:0"D日"
mon_politics.31.d:0"博铺港的守军睡得很死。\n不是因为懈怠，是因为酒。\n蒙古千户昨夜娶了第七房小妾，全营喝到三更，连哨兵都抱着酒坛子打鼾。海风咸腥，吹不散满营的醉气。\n海面上，“丰城轮”已经停了引擎，随浪轻轻晃着。它本该三天前就到学园都市卸货，却在太平洋上绕了个大弯，把登记簿上的航线涂改成“台风避险”。\n甲板下，三百人挤在货舱里，汗味、机油味、火药味混在一起。没人说话。有个年轻后生忍不住干呕，被旁边的老兵一把捂住嘴，眼神警告：现在出声，死的不只是你。\n文德嗣站在船头，他没穿军装，只一身洗得发白的卡其布工装，像极了澳洲码头常见的华工。可腰后别着的左轮，和脚边那只装满雷管的铁盒，暴露了真相。\n“还有四十分钟涨潮。”马千瞩从无线电室钻出来，声音压得极低，“临高县的人说，哨塔换岗拖了十分钟——他们动手了。”\n果然，远处山坳里，一道微弱的红光闪了三下。\n那是约定的信号：路通了。\n小艇放下水时，几乎没发出声音。橡胶艇，学园都市华人联合会偷运给他们的，说是“救生设备”。\n他们的祖辈虽然长居海外，但从未忘记，自己的根在哪。\n登陆点选在废弃的盐场。滩涂软，但蒙古人嫌臭，从不巡逻。\n第一个踏上沙滩的是个黎族青年，他回头比了个手势：安全。\n接下来的两小时，像一场沉默的仪式。\n武器箱埋进沙丘，电台架在椰林深处，伤员包扎点设在破庙里。没人欢呼，没人拥抱。只有马千瞩蹲在泥地里，用炭笔在防水布上画防御图，一边画一边嘀咕：“炮台射界死角在东南角，得先炸掉瞭望塔……”\n天快亮时，第一声枪响从博铺港方向传来。\n不是交火，是义军在制造混乱——按计划，他们要假装内讧，引守军出来。\n文德嗣终于开口，对身边的王洛宾说：“去通知各队，按第二方案行动。记住，我们不是来占地盘的，是来送东西的。”\n王洛宾点头，转身跑进晨雾。他怀里揣的不是手榴弹，是一叠油印的小册子，封面印着：《简易战地医疗手册》。\n太阳升起时，“丰城轮”已调头离港。\n甲板上，几个学园都市水手假装擦洗栏杆，实则盯着岸上动静。船长叼着烟斗，对大副说：“告诉那些中国人，任务完成。下次……带印刷机来。”\n而海南岛上，第一批伤员正被抬进临时诊所。\n一个老中医颤抖着手，接过马千瞩递来的磺胺粉，眼泪掉进药碗里。\n他不懂什么主义，只知道——\n这药，能救命。\n没人放鞭炮庆祝。\n但海边的渔民看见，那艘锈迹斑斑的外国货轮走时，烟囱冒的烟，是直的——像一杆不肯弯的脊梁。"
mon_politics.31.a:0"摆在我们面前的任务是光荣、艰巨的。要完成这些任务，还需要我们付出很大的努力。"

mon_politics.32.t:0"九龙井出龙"
mon_politics.32.d:0"半个河南也丢了。\n\n伯雷帖木儿对这类失地急报已经习以为常，可他听到关于这支义军首领身份的汇报内容时还是感到十分诧异。\n\n“据当地人流言，那夜电闪雷鸣，鹿邑明道宫九龙井中水沸如汤。忽然一道金光冲天，两人自井中跃出——一人身着赭黄十二章宋代龙袍，头戴通天冠；另一人披山文甲，执青龙偃月刀，面如重枣！”\n\n伯雷帖木儿皱眉：“荒唐！莫非是朱元璋显圣？”\n\n“那人自称……‘沧州赵玖’，另一人自称‘杨沂中’，而且据贼军宣称，两人并非人类，而是……英灵。”\n\n满殿死寂。\n\n“英灵……杨沂中实有此人，为南宋和王，可是历史上何曾有过这么一个‘赵玖’，该名号从未见于史书。”黄尚说到。\n\n伯雷帖木儿沉默片刻，忽然大笑：“哈！既然杨沂中是南宋初年之人，那贼首莫非是赵构那懦夫？靖康之耻，弃父兄于北狩，杀岳飞以媚金——就这等人，也配化为英灵？”\n\n一名文官开口道：“理论上英灵召唤并不一定会召出我们历史上的人物，也可能来自其他世界线，比如另外一个平行世界可能存在着一个完全不同的宋朝……”\n\n不等他说完，伯雷帖木儿猛地拍案：“不用讲了，定是汉人装神弄鬼！或从古墓盗得龙袍，或借雷雨夜造谣惑众！区区邪术，也敢乱我大元？”\n\n他提笔朱批：“命怯薛左翼万户率三千精骑南下，剿灭‘赵玖妖党’。活捉者赏千金，斩首者授千户——朕倒要看看，这井里爬出的‘龙’，骨头硬不硬！”"
mon_politics.32.a:0"就算要假冒至少也冒充赵匡胤罢，冒充完颜构不是自找不痛快？"

mon_politics.33.t:0"血路与麦穗"
mon_politics.33.d:0"良不是生来就是恶人。\n他爹是前神州帝国北京军械库的技工，死于一场“意外”爆炸——实则是神州官员为掩盖贪污，故意引燃火药库。尸骨无存，抚恤被吞，良那年十四岁。\n从此，他不信天理，不信王法，只信刀快、钱硬、命贱。\n十年后，他成了关中道上最狠的“黑鹞子”——劫商队、绑肉票、替蒙古贵胄押送“童男童女”，手上沾的血，洗不净了。直到他遇到那名名为满穗的女孩。\n满穗被铁链锁着，和其他“货”一起往北走。夜里，她磨断麻绳，攥着藏了七天的碎瓷片，摸进良的帐篷。\n刀抵住他喉咙时，良醒了，却没动。\n“杀我，你活不过三天。”他声音沙哑，“外面有狼，有兵，有比我更坏的人。”\n满穗的手抖得厉害。\n良缓缓坐起，从怀里掏出一块干粮——那是他省下的口粮。“我的刀，沾过太多无辜人的血。你若要报仇，我不拦。”\n满穗的瓷片掉在地上。\n那一夜，她没走。\n因为良把最后一块馍掰成两半，把大的那半给了发烧的小女孩。\n转机在洛阳。\n他们押送的队伍被蒙古贵族接应。那夜，良亲眼看见那位“王爷”在帐中割食童肉，还笑着问：“这女娃细皮嫩肉，留着明晚炖汤。”\n良胃里翻江倒海。\n他想起满穗看他的眼神——不是恨，是失望。\n当夜，他放火烧了营帐。\n满穗持镰刀冲入火场，亲手割了那蒙古贵族的头。\n良断后，背上受伤的孩子，带满穗杀出重围。\n两人逃进秦岭深处，良教她使刀，她教他认字。\n他不再提过去，她也不再问。\n直到天下烽烟四起。\n满穗站在山崖上，望着远处燃烧的县城，忽然说：\n“我们不能再躲了。”\n良点头。\n他们在废庙里用炭灰和鸡血画了一面旗——\n上书：“新顺·李氏后裔，代天讨胡”。\n“李自成当年说‘均田免赋’，如今我们要说——汉人之子，不可为食！”满穗对聚集的流民高喊。\n良站在她身后，手按旧刀，却第一次挺直了腰。\n有人问：“你们真是李闯王后代？”\n满穗笑：“是不是不重要。重要的是——百姓需要一面旗，而我们，愿意扛起来。”\n当晚，义军攻下第一座蒙古粮仓。\n良亲手砸开地牢铁门，放出三百被囚孩童。\n满穗站在高处，点燃火把，火光照亮她眼角的泪。\n“从今日起，”她声音清亮如钟，"
mon_politics.33.a:0"“再无人敢把我们的孩子，当盘中餐！”"

mon_politics.34.t:0"精锐？老子打的就是精锐！"
mon_politics.34.d:0"山西西部，偏关。\n\n怯薛军“黑狼营”大营陷落的第三个小时，火还在烧。\n\n粮仓、马厩、火药库——全成了火炬。怯薛军士兵的尸体横七竖八倒在泥地里，有的还攥着没拆封的手榴弹。营门那面狼头大纛，被砍断旗杆，踩进了马粪堆。\n\n李云龙叼着半截皱巴巴的烟卷，一脚踹开营房大门，嗓门震得屋梁掉灰：“他娘的！这就是那伯雷小儿吹上天的‘怯薛精锐’？老子还以为个个是成吉思汗转世，结果连裤子都没穿利索就蹽了！”\n\n他身后，楚云飞缓步走入，他环顾满地狼藉，轻轻掸了掸袖口灰，语气平静：“云龙兄，慎言。怯薛军主力未损，此乃边防杂牌，多是收编的土匪。”\n\n“杂牌？”李云龙哈哈大笑，抄起地上一顶钢盔往地上一摔，“杂牌能配德械？杂牌能住砖房？杂牌能让山西老百姓交三成粮当‘顺民税’？”他指着门外一具尸体，“瞧见没？这狗日的手腕上还戴着银手镯！抢咱老乡的吧？”\n\n楚云飞没反驳，只弯腰拾起一张散落的命令文书，扫了一眼：“他们在调兵……目标是察哈尔的王斗义军。”\n\n“那就让他们调！”李云龙一把夺过文书，撕得粉碎，“老子今天端了他老窝，明天他就得从察哈尔回援——这叫围魏救赵，老子跟赵政委学的！”\n\n楚云飞终于露出一丝笑意：“你倒把《孙子兵法》用得挺活。”\n\n“少来文绉绉那一套！”李云龙拍他肩膀，“云飞兄，说真的，要不是你那套‘夜间渗透+火力压制’的打法，咱今晚得折一半人。你那些黄埔学的玩意儿，还真管用！”\n\n楚云飞望向窗外燃烧的营房，轻声道：“可若无你部敢打敢冲，我的计划只是纸上谈兵。”他顿了顿，“云龙兄，我们曾为主义而战，如今……只为百姓不跪。”\n\n李云龙沉默片刻，忽然咧嘴一笑：“行啊！那以后你出主意，我扛炸药包——不过得加一条：缴获的酒，老子先喝！”\n\n楚云飞摇头失笑：“依你。”"
mon_politics.34.a:0"整个晋西北乱成了一锅粥"

mon_politics.35.t:0"遗志"
mon_politics.35.d:0"张伟这辈子都忘不了那个下午。\n\n天阴得像浸了血的棉布，风里裹着硝烟和焦土味。他们这支被打散的红军残部刚在苏北收拢不到两百人，元军的骑兵就压了过来——黑万字旗猎猎作响，马蹄踏得大地发颤。\n\n陈世涛将军本可撤退。但他把最后一颗子弹留给了自己身前的机枪手，吼了一句：“顶住！让后面的百姓先走！”\n\n话音未落，三发子弹穿透了他的胸膛。\n\n他倒下时，一把攥住张伟的手，血从指缝里渗出来，声音断断续续：“……救中华……不是救一党一派……是救这片土地上的……人。”\n\n三天后，在一片芦苇荡边，张伟亲手埋了陈将军。没有棺木，只用染血的红旗裹身；没有哀乐，只有远处零星的枪声。\n\n葬礼上，张伟站在坟前，声音不高，却压住了所有啜泣：\n\n“今天，我们为被害的陈将军哀悼。明天，我们就要让凶手付出代价！”\n\n“我们绝不会允许，入侵者将华夏再次变成任人践踏的牧场。”\n\n“蒙古鞑子可以烧我们的村，杀我们的民，毁我们的史……但他们永远夺不走一件事——我们记得，我们反抗，我们绝不低头,我们将团结一致！让鞑子为他们的可耻行为作出回答！”\n\n从那天起，张伟摘下了“红军”的臂章。\n\n“主义可以争论，家园不能等待。”他对残部说，“从今往后，我们叫‘红巾军’——不分党派，不论出身，只要愿抗元、护民、守土，皆为袍泽。”\n\n终于，天下烽烟四起。\n\n红巾军自盐城举义，七日克扬州，半月下南京。\n\n所到之处，不开仓放粮，不设卡征税，只做三件事：驱胡吏、复汉俗、立乡约。\n\n至冬初，江苏全境光复。\n\n紫禁城震怒，而江淮百姓却在门楣悄悄贴上红纸——\n\n不是符咒，是一句新传开的话："
mon_politics.35.a:0"“红巾再起，胡虏将倾。”"

mon_politics.36.t:0"结束了"
mon_politics.36.d:0"“义军……全灭了。”\n消息传到茶馆时，老板手一抖，茶壶“哐当”砸在地上。\n没人说话。\n连蹲在门槛啃窝头的小孩都缩了缩脖子，把脸埋进破袄里。\n三个月前，这里还能听见悄悄话。\n“听说红巾军打到徐州了！”\n“我看这大元，是要完啊。”\n“嘘——小声点！”\n现在，连狗都不敢叫。\n伯雷帖木儿没开庆功宴。\n他只下了一道令：“逆地清源。”\n规则很简单：\n村里出过一个义军？全村男丁砍头，女的充营妓。\n家里搜出一本反书？满门吊死，房子烧成灰。\n街上巡逻的元军腰间挂着人耳串——据说是按“剿匪数”计功。\n茶馆说书人改讲《成吉思汗降妖记》，主角是个穿红衣服的吃人妖怪，最后被长生天净化。\n孩子们唱新童谣：\n\n“红巾红，血流空；\n顺民顺，有饭哄；\n莫问天，莫问宗，\n低头走路保祖宗。”\n\n夜深了。\n母亲给孩子盖被子，手指碰到他枕头下硬硬的东西。\n掀开一看，是一小块褪色的红布——不知从哪捡来的。\n她浑身发抖，想扔掉，又舍不得。\n最后，她把它缝进自己衣襟内衬，贴着心跳的位置。\n窗外，雪静静落下。\n像什么都没发生过。"
mon_politics.36.a:0"汉族，隐忍……"

mon_politics.37.t:0"翻身"
mon_politics.37.d:0"北京城门洞开，尘土飞扬。\n爱新觉罗·黄尚站在自家四合院的屋檐下，眯眼望着远处滚滚而来的铁骑——玄甲黑马，狼纛高扬，马鬃上系着象征“大元正统”的九斿白纛。那是蒙古人的军队，北京，又一次换了主人。\n黄尚心中并无惧意，反倒隐隐快意。\n他想起祖父讲过的故事：1855年，长毛贼“天兵”破城那日，没能来得及跟随咸丰帝逃到盛京的爱新觉罗皇族和八旗子弟被拖出府邸，当街斩首，血流成河。他的祖父躲在菜窖里七天七夜，靠啃萝卜活命，才侥幸逃过屠杀。后来神州帝国太祖蒋世渊挥师北伐，驱逐太平军，入主紫禁城，第一道谕旨便是：“满汉皆民，不得私相仇杀。”\n八旗子弟保住了命，却也彻底失了势。铁杆庄稼没了，旗饷停了，连祖传的弓马都成了摆设。百年来，他们沦为市井小民，靠教书、卖字、甚至蹬三轮维生。\n“如今轮到汉人尝这滋味了。”黄尚冷笑，“蒋氏倒行逆施，活该亡国。蒙古人来了也好，至少……不会比现在更糟。”\n他转身回屋，泡了壶茉莉花茶，准备看这场改朝换代的大戏。\n没过几天，院门就被敲响。\n两名使者立于门外，头戴钹笠冠，腰佩银牌，身后跟着四名怯薛亲卫，手捧黄绫卷轴。\n “长生天气力里，大福荫护助里——”\n黄尚心头一跳，慌忙跪地。\n使者展开圣旨宣读：\n “说与恁爱新觉罗·黄尚知道：\n如今长生天护佑，大元重兴。你家虽前番倒运，流落在街市上卖字拉车，却也守本分、知礼数，不曾胡行乱为——这般人家，正该用着！\n朕如今要查八旗旧户，收拢遗下子孙，好教他每出力办事。\n你既识得文书，又是前朝贵种，便教你做“宫廷事务副理”，正五品官身，月支俸银三十两，赐紫缰马一匹，许在京师住坐。\n钦此！”\n黄尚浑身颤抖。\n宫廷事务副理？正五品？紫缰？月俸？\n这是复起！\n他重重磕下头去，额头贴地，声音哽咽："
mon_politics.37.a:0"“臣……臣爱新觉罗·黄尚，叩谢吾皇天恩！”"

mon_politics.38.t:0"没文化搞不了文字狱"
mon_politics.38.d:0"大都，前门大街，“一壶春”茶馆。\n爱新觉罗·黄尚正坐在二楼雅座，啜着茉莉香片，眯眼打量街上来往的怯薛军。自打他被伯雷帖木儿征召，日子总算有了体面。可体面人最怕乱，尤其怕有人坏了这来之不易的太平。\n就在这时，他瞥见墙角新贴了一首墨迹未干的诗：\n\n胡尘蔽日久，汉帜卷西风。\n龙庭非故主，燕市有遗忠。\n百年血未冷，万里志难穷。\n待看春雷动，重燃旧火红。\n\n黄尚心头一紧——这哪是诗？分明是反元檄文！\n他立马起身，直奔紫禁城。\n御书房里，伯雷帖木儿听黄尚气喘吁吁念完那首诗，竟抚掌笑道：\n“好诗！‘待看春雷动’——气势雄浑！这人有才，该召入翰林院！”\n黄尚差点噎住。\n“——这帮蒙古蛮子，打仗是把好手，可论文字机锋，连前元那些色目官都不如！当年元末，多少反诗贴在街头，达官贵人还当是“咏景佳作”，结果红巾军都快打到城下了才醒过味来。如今倒好，新朝立国，皇帝竟也看不懂“胡尘”二字是骂谁！当年我满洲入关，太宗、世祖便令八旗子弟苦读汉书，习经史、通诗文。正因如此，才能识破那些“清风不识字”的隐语，镇住江南士子的笔锋。”\n他强压腹诽，躬身解释：“陛下……‘胡尘’是骂蒙古人如沙尘蔽日；‘汉帜卷西风’是要推翻大元；‘龙庭非故主’说您不配坐龙椅；‘旧火红’……恐是联络前朝逆贼啊！”"
mon_politics.38.a:0"哦，无所谓"
mon_politics.38.b:0"大胆！以后再发现有人发表此类大逆不道之言，诛九族！"
MON_wenziyu_tip:0"§C黄尚摇头叹气，心里却踏实了：\n这江山，终究还得靠我们这些“识字的人”来守。§!"

mon_politics.39.t:0"紧盯农村"
mon_politics.39.d:0"紫禁城西暖阁，炭火微红。\n\n爱新觉罗·黄尚跪在毡垫上，额头微汗——不是因热，而是因他即将说的这番话，关乎新朝百年根基。\n\n“陛下，”他声音沉稳，“臣近日巡查京畿州县，见乡野之间，人心浮动。茶馆酒肆，私语不断；村塾私塾，暗传‘汉帜重光’之谣。此非小事，实乃大患！”\n\n伯雷帖木儿正翻看边军奏报，闻言抬眼：“哦？区区村夫，能成何气候？”\n\n黄尚叩首，语气加重：“陛下可还记得长毛贼？洪杨之乱，起于广西一隅，不过数千烧炭工、拜上帝会众。若非清廷初时轻忽，任其坐大，何至山河沦陷？”\n\n他顿了顿，又压低声音：“当今赤党红军，亦是以农村为巢穴，昼伏夜出，煽动佃农，分田毁契。朝廷屡剿不绝，正因只重城池，不控乡野！”\n\n伯雷帖木儿眉头微皱，似有所思。\n\n黄尚趁势进言：“臣斗胆建策——效仿前清旧制，在每村设驻防小队，日则巡田查户，夜则盘诘生人；村中婚丧、集会、塾师授课，皆须报备。如此，则奸宄无藏身之地，叛逆未萌即灭！”\n\n他抬头，目光灼灼：“得城池易，得人心难；得人心难，控乡村更难！若放任乡野如散沙，今日一诗，明日一檄，后日便是燎原之火！”"
mon_politics.39.a:0"感觉没必要"
mon_politics.39.b:0"“准！着兵部拟《村寨驻防条例》，先在京畿、直隶试行。你督办此事。若有成效，推及全国！”"
MON_cunzhujun_tip:0"§C黄尚退出宫门，寒风扑面，他却心头滚烫。\n——我大清当年能坐稳天下二百余年，靠的不只是八旗铁骑，更是§R把朝廷的耳目，插进每一寸乡土§!。§!"

mon_politics.40.t:0"重建八旗"
mon_politics.40.d:0"爱新觉罗·黄尚再次请见伯雷帖木儿，声音低而坚定：“陛下，臣有一策，可固国本、联蒙满、抚汉绅——重建八旗制度。”\n\n伯雷帖木儿正擦拭一柄祖传弯刀，闻言冷笑：“八旗？那不是前清亡国之制么？如今朕光复大元，岂能拾人牙慧？”\n\n黄尚不慌不忙，叩首道：“陛下明鉴！八旗非亡国之制，实乃立国之基！昔清太祖、太宗以八旗统合满洲、蒙古、汉军，三族一体，如臂使指。上马则为兵，下马则为民；战时同进退，平时共耕牧。正因如此，方能以区区百万之众，定鼎中原二百余载！”\n\n他抬头，目光灼灼：“今日大元虽立，然根基未稳。蒙古诸部各怀异心，汉地士绅观望不前，满洲遗民散落如沙。若无一制以统之，终是散沙一盘！”\n\n伯雷帖木儿眉头微动：“你欲如何建？”\n\n“臣请设新八旗！”黄尚语速加快，\n\n“——正黄、正白二旗，专隶黄金家族及蒙古王公，为‘国族之柱’；\n\n——镶黄、镶白二旗，收编满洲旧裔，授田给饷，复其体面；\n\n——正红、正蓝、镶红、镶蓝四旗，择汉地忠顺士绅、商贾、军官入籍，赐‘旗籍’，免徭役，许参政！”\n\n他重重叩首：“如此，则蒙古知陛下不忘根本，满洲感陛下存续宗祀，汉绅见陛下开诚布公——三族同心，天下可定！”"
mon_politics.40.a:0"“不准！大元自有制度，何须效仿前清？”"
mon_politics.40.b:0"“准！重建新八旗，以固国本。”"
MON_xinbaqi_tip:0"§C黄尚出得宫门，夜风凛冽，他却热血沸腾。\n蒙古人或许不懂，但历史早已证明：\n单靠铁骑，只能打天下；唯有制度，才能坐天下。§!"

mon_politics.41.t:0"天数有变，神器更易"
mon_politics.41.d:0"乾清宫上，群臣跪满丹墀，声震宫阙：\n\n“请陛下禅位！天命已移，大清当兴！”\n\n三百余名重臣——八旗都统、汉军参政、蒙古王公——齐刷刷叩首，额头贴地，再不抬头。\n\n伯雷帖木儿端坐龙椅，手按弯刀，眼中怒火如焚：“朕以成吉思汗血脉，重立大元，尔等竟要朕将江山让与……一个前清余孽？！”\n\n镶黄旗都统昂然抬头：“陛下！非是余孽，乃是真龙归位！自黄尚公推行新八旗、镇汉逆、抚士绅、修律令，天下已安，四夷宾服。而陛下只知纵马草原，不解治国之道——此非天命转移之兆乎？”\n\n蒙古诸王默然——他们手握兵权，却失尽民心；粮饷、官吏、税赋，皆操于满人之手。反抗？不过是自取灭亡。\n\n伯雷帖木儿环顾四周，昔日怯薛亲卫竟也垂首不语。\n\n他知道，刀还在，但刀柄，已不在自己手中。\n\n殿角，爱新觉罗·黄尚伏地痛哭：“臣万死不敢受此大位！陛下乃开国雄主，臣不过一介奴才……”\n\n“住口！”群臣齐喝，“天命在尔，岂容推辞！”\n\n三日后，紫禁城换旗。\n\n索永布旗降下，黄龙旗冉冉升起。\n\n爱新觉罗·黄尚登基，改元“光复”，国号复称“大清”，颁诏天下：\n\n“自即日起，满洲为国族之首，蒙古次之，汉人又次之。凡八旗子弟，世袭俸禄，免徭役，掌军政要职；汉人虽可应试，不得居六部尚书、总督、将军之位。违者，以叛逆论！”\n\n而北京城头，重新响起了那句百年未绝的呼号："
mon_politics.41.a:0"“大清皇帝万岁！万岁！万万岁！”"
MON_daqingguilai_tip:0"§C伯雷帖木儿离京那日，回望紫禁城，冷笑：“满人以为自己能坐稳江山？\n——等着吧，待有朝一日汉人再起，第一个杀的，就是你们这些‘国族之首’。”§!"

mon_politics.42.t:0"俄罗斯的未来"
mon_politics.42.d:0"帝弥托利摄政王站在克里姆林宫乔治厅的中央，脚下是刚刚清扫干净的碎石与弹壳。反攻俄罗斯的伟大使命已经完成。现在，一个更棘手的问题摆在了这位“救国者”面前：新俄罗斯究竟该走向何方？\n\n大厅的两端，两股势力正在无声地对峙。\n\n左侧，是一群身着旧式礼服、眼含热泪的流亡归国贵族与前沙俄军官。他们手中捧着从伦敦和基辅寻回的罗曼诺夫家族族谱，高呼着“神圣罗斯”、“上帝与沙皇”。他们要求帝弥托利迎回流亡海外的阿纳斯塔西娅女大公，恢复君主专制或君主立宪制，让双头鹰皇冠重新戴在沙皇的头上。对他们而言，没有沙皇的胜利是不完整的，那只是另一场军事政变。\n\n右侧，则是帝弥托利的核心班底——那些在战壕里摸爬滚打十年的白军官兵。他们厌恶旧贵族的腐朽与无能，认为正是罗曼诺夫家族的软弱导致了革命的爆发。他们低声议论着“强人政治”、“秩序至上”，暗示帝弥托利应当顺势建立一个威权共和国，由他本人担任终身大总统。在他们眼中，帝弥托利才是真正拯救俄罗斯的人，他比任何坐在云端的帝王都更配得上权力的权杖。\n\n帝弥托利抚摸着桌案上那顶沉重的莫诺马赫皇冠复制品，又看了看自己手中紧握的元帅权杖。\n\n选择复辟帝国，能瞬间凝聚保守派、教会及底层农民的心，获得圣杯等老牌君主国的承认，但皇室可能成为掣肘，甚至在未来收回他的权力。\n\n选择建立军政府，他能掌握绝对的生杀大权，推行激进的工业化与军事改革，无需向任何人低头，但将被斥为“红色布尔什维克的白色翻版”，失去部分传统精英的支持，甚至引发新的保皇党叛乱。\n\n“俄罗斯不需要争论，”帝弥托利喃喃自语，“她需要的是方向。”"
mon_politics.42.a:0"俄罗斯只需要一个声音——那就是我的声音。"
mon_politics.42.b:0"天佑沙皇！"

mon_politics.43.t:0"中国的命运"
mon_politics.43.d:0"随着第二次俄国内战的终结，帝弥托利面临着一个关乎俄罗斯东方战略的根本性抉择。在反攻战争中，中国土地上的资源、兵工厂中的劳工以及仆从军里的鲜血，为白俄的胜利奠定了坚实基础。如今胜利在握，如何处置这片广袤的领土，克里姆林宫内部形成了两种截然不同的战略构想。\n\n第一种构想主张由亲俄政客组建一个表面独立的政权，保留中国的国号、国旗及形式上的议会制度。在这个架构下，莫斯科将通过派驻“高级顾问团”的方式，在外交、国防及重大经济政策上行使否决权。这种“间接统治”模式旨在利用民族主义情绪降低治理成本，通过维持“主权独立”的幻象来安抚民众，减少游击抵抗，同时争取西方国家的默认。然而，其代价是帝国对资源的汲取效率将大打折扣，且傀儡政权存在倒戈或阳奉阴违的潜在风险。\n\n第二种构想主张彻底废除中国的一切政治实体，将占领区改组为总督区，由莫斯科直接任命总督进行军事管制。在此模式下，当地法律将被帝国律法取代，资源将被无条件调运至核心工业区，人力将被强制征召编入辅助部队。这是一种赤裸裸的殖民统治，能最大化战争机器的效能，将东方彻底转化为帝国的血肉补给站。但其后果必然是激起剧烈的民族主义反抗，导致长期的治安战，并招致国际社会的强烈谴责与外交孤立。\n\n帝弥托利深知，这不仅仅是一个行政划分问题，更是决定帝国未来是成为一个松散的霸权联盟，还是一个高度集权的超级怪兽的关键一步。东方的秩序，即将由他的意志重新定义。"
mon_politics.43.a:0"建立一个亲俄的中国政权"
mon_politics.43.b:0"维持军事统治"

