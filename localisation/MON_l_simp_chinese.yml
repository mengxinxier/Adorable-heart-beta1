mon_politics.5.t:0"梦"
mon_politics.5.d:0"草原那蚀骨的冬风裹挟着雪沫，拍打着这座临时营地。旗帜在冬月的注视下猎猎作响，远处山坡上成片幽绿狼眸冷冷的注视着这群陌生的人群，偶尔发出一两声长嚎刺破呼啸的风声，像是警戒，又像是呼唤着其他狼群。帐内，守夜的士兵或举着火把往返巡视，或是在帐外凝视着远方与狼群；艾黛尔贾特·冯·弗雷斯贝尔古穿着军大衣——肩头的绶带已磨损脱线，再也无法维持住她作为白军军官的体面，正如同当年也没能抵挡住布尔什维克的洪流，在帐内炭火的氤氲中，她沉入了长生天独为他构筑的梦境——她化为了白海青矗立在大汗的旗杆上，凶戾的的鹰眼越过了千里，越过了簇拥的怯薛们，越过了如蝗灾般浩浩汤汤的蒙古铁骑，越过了不同城墙不同民族不同肤色的人们惊慌失措逃窜的胆怯行径；他看到了南宋的战船在烈火中沉入江底，看见桀骜不驯的中亚骑兵在黄沙中折戟，看见罗斯勇士的铮铮铁甲随坍塌的城墙一同化为了齑粉..........最终，目光从时间长河收起，聚焦在了忽里台大会上，那个正朝她微笑，并将一截用于祭祀长生天的白马马骨，向她抛来的男人——成吉思汗。一声狼嚎打断了长生天的梦境，弗雷斯贝尔古在营帐中听着手下结结巴巴叙述着远处的狼群叼来一根马腿骨后就离开的奇遇，梦境与现实在此刻轰然交汇。她凝视着那根来自狼群——抑或来自长生天的马骨，做出了必将撼动自己与整个蒙古命运的决定。"
mon_politics.5.a:0"这是长生天给我的神谕！我就是铁木真再世！"

