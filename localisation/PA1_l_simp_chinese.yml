  PA1_state_finance_category: "现实主义勇者的国家再建记"
  PA1_state_finance_category_desc: "艾尔孚利登局势危如累卵！\n身处地峡当口，却无守护此地之实力，中美洲的红色国度正走向联合，当其挥师南下，艾尔孚利登首当其冲，难以幸免。旧日的帝国对她的领主盘剥甚为酷烈，传闻新皇登基，若要树立威严，艾尔孚利登首当其冲，难以幸免。而艾尔孚利登空有繁荣的种植业和普遍的制造业基础，却无法发挥其实力，市人惫懒，贵种无能，藩主割据，艾尔孚利登正走向灭亡。\n国王陛下将王位禅让给号称现实主义勇者的相马一也，面对内外交困的局面，能否刷新吏治，整顿兵马，守卫疆土，甚至于将艾尔孚利登发扬光大呢？"
  PA1_hungry_people_become_bandits: "饥民变成流寇"
  PA1_financial_crisis_erupts: "财政危机爆发"
  PA1_financial_crisis_erupts_desc: "我们的国库空虚到已经无法发放工资了，人民心中的不满正在积累，当然可以选择忽视她，但迟早有一天，民意将倾覆无能的政府。"
  PA1_military_conspiracy: "军队阴谋酝酿"
  PA1_military_conspiracy_desc: "我们的政令已经无法上传下达，举国上下都在谈论着寻找一个合格的统治者，一场军事政变阴谋正在酝酿。"
  PA1_relief_for_the_starving_people: "赈济饥民"
  PA1_organize_self_rescue_for_hungry_people: "组织饥民自救"
  PA1_organize_self_rescue_for_hungry_people_desc: "战争的序曲已经奏响，周边国家的粮食出口骤然锐减，广泛种植经济作物的艾尔孚利登爆发了饥荒，我们不得不组织饥民去尝试一切可以吃的东西"
  PA1_investment_in_industrial_construction: "投资[FROM.GetName]建设"
  PA1_extortion_of_nobles: "勒索旧贵族"
  PA1_extortion_of_nobles_desc: "唯才令之后，我们建立了自己的一套班子，虽然旧贵族的势力依旧强大，但希望对抗帝国的艾尔孚利登势力走到了一起，是时候让这些老东西吐出一点东西了。"
  PA1_looking_for_new_supporters: "凝聚支持者"
  PA1_looking_for_new_supporters_desc: "我们的改革正触及旧势力的痛楚，不是所有人都能做到壮士断腕，相忍为国，我们必须团结一切可以站在一起的势力。"
  PA1_seeking_trade_partners: "寻求与[FROM.GetName]扩大经济合作"
  PA1_looking_for_gemstone_buyers: "对中美洲出售宝石"
  PA1_relying_on_imperial_trade: "依赖帝国贸易"
  PA1_relying_on_imperial_trade_desc: "帝国的盘剥是造成艾尔孚利登疲敝至此的原因之一，但她所提供的市场和贸易依旧让艾尔孚利登受益良多，我们必须把交出去的税收赚回来。"
  PA1_dealing_with_bandits: "调集领主剿匪"
  PA1_dealing_with_bandits_desc: "领主在各地尾大不掉，我们必须想办法消耗她们实力，在我们组建起一支强大的国民军之后，她们就只能臣服了。"
  PA1_using_empire_for_taxation: "利用帝国征税"

