#事件
  PA1_pol.01.t: "先从勇者开始"
  PA1_pol.01.d: "一骑飞马驰过城门，卫兵站得笔直，枪械擦拭得发亮。王宫广场上原本堆积在角落的垃圾被清理了，往来的市人行色匆匆。王宫大厅的气氛出奇地平静，国王艾尔伯特正坐在王座旁的侧位上，悠闲地喝着茶，他对女儿的归来显得毫不在意。\n“父亲，您将王国，将我，交给了一个来历不明的外人？”\n王座上坐着一位精干青年，穿着蹩脚的王室礼服，眼袋很深。他没有在批阅公文，沉静和呆滞的表情僵硬在脸上，周围的官员一反平常的皱眉沉思。\n“国事就应该交给年轻人去处理……毕竟他可是我和王后费尽心思招来的勇者殿下。”\n看上去只是为了应付场面，又或是为了避免女儿做出有损勇者威严的举动，国王很快离开大厅，似乎大厅的石柱马上要砸到他头上了似的。"
  PA1_pol.01.a: "他到底有什么魔力？"

  PA1_pol.02.t: "议事"
  PA1_pol.02.d: "勇者殿下此时端坐在王座上，面前摊开的是王国全年粮食需求和土地利用的图表，下面是满脸敬佩的官员计吏。他们所谈论的统计、分配、饥荒之类的话，乍听着吓人又乏味，如蜂群嗡嗡作响，吵得莉希雅头大不已，周边的官员大都昏昏欲睡，但她却捕捉到了几个关键的词语，“咖啡”、“棉花”、“改种”……\n“一也，棉花和咖啡不能动……就算是去掉它们，也没法立刻变出粮食来。”，话语逐渐模糊。\n“不错，我是想要削减棉花和咖啡等经济作物的种植面积，将其改种为高产粮食作物。”\n他怎么敢这样直接说出这种话？官员们面面相觑。左相大臣迅速低下了头，右相大臣则紧紧抓着自己的衣角，只有少数几位年轻官员面露焦虑，却也无言以对。相马一也的目光扫过这些脸。\n“诸君，那么你们有什么好办法吗？公主殿下，莉希雅？你有办法吗？”\n真是一个激进且愚蠢的家伙，莉希雅不由一阵胸闷，此时皱紧眉头不愿开口了。讨论匆匆结束，显得虎头蛇尾，勇者并未给出一个具体的执行方案，甚至没有任命负责此事的官员。"
  PA1_pol.02.a: "勇者好大言！"

  PA1_pol.03.t: "唯才令"
  PA1_pol.03.d: "第二天清晨，王都的公告栏和王室公文上正式张贴了《唯才令》。公文的措辞极为简洁，几乎不涉及具体的招募标准或职务描述，只要求“一切有志于救国之人，不论出身、性别，皆可来王宫述职”。\n “瞧，他被公主顶撞后，觉得颜面无光，所以急忙发布了这个命令，他以为治国是召集佣兵吗？”\n在王都的议政厅侧室，相马一也并未接见那些穿着华丽、前来“述职”的旧贵族子弟。他将官员递来的、装有所有述职者履历的羊皮卷交给莉希雅处理。一幕幕戏剧在宫廷上演，老国王依旧笑容满面，公主殿下面色铁青，接见着被“特殊”选拔的歪瓜裂枣。\n在众人看热闹的时候，勇者大人却和无名之辈混迹在一起，这些家伙没有背景，行事毫无顾忌。三天内，王室就收回了一笔被旧贵族长期侵占的矿产税。\n此时众人才惊觉一文不值《唯才令》竟成了勇者殿下的权杖。"
  PA1_pol.03.a: "他看着像一位国王了"

  PA1_pol.04.t: "法官与神棍"
  PA1_pol.04.d: "《唯才令》发布后，王宫迎来了一批“有胆量”应征的人。在相马一也面前，最引人注目的有两位：\n狂热的法官——哈克亚·库欧米，衣着华丽，但身上带着明显的腐败气息。他向相马一也行了一个夸张的、近乎阿谀奉承的大礼，随后呈上了一份详尽的赚钱大计。\n紧随其后的是自称“地上神灵”的女子——克拉丽丝。她行为疯癫，但她展现出的魔力强度和对元素控制的精妙，远超王国现有的大部分魔法师。\n“莉希雅殿下，这位哈克亚先生曾因贪腐被驱逐出法庭，而那位克拉丽丝女士的狂热异教思想，也早已被教会排斥。陛下若是启用他们，不仅无法获得士绅的支持，更会严重损害新王室的声誉……”，莉希雅公主对此不置可否，她显然对所谓“赚钱大计”更感兴趣。\n相马一也放下哈克亚的报告，平静地说道：“腐朽的法律需要精通漏洞的人去修补，衰弱的军力需要不可思议的力量去弥补。他们的品德我不予置评，但他们的能力是王国目前最需要的。”"
  PA1_pol.04.a: "勇者喜好神人"

  PA1_pol.05.t: "老吃家"
  PA1_pol.05.d: "勇者喜好奇人异士的传闻席卷王国之后，一位大厨也应募而来，邦乔的厨艺是不错，在众多名厨里有他的一席之地，但这和唯才令又有什么关系呢？所有人都知道，相马一也寻求的是治国理政的人才，而不是用来享乐的人才，更别说这位邦乔……\n邦乔说自己寻找到一种足以解决饥荒的食物，没有人相信一个几天前还一文不名的厨师，并且他所说的食物是贫民窟里的泥腿子吃的东西。好吧，显然这又是贵族们用来恶心勇者的手段，不然邦乔怎么能来到勇者面前。但出其意料的是，勇者毫不犹豫的品尝了这种食物，这些看似恶心的虫类，在雨林中非常常见，味道意外的……好吃，棒球香。\n任命一经发出就成为包揽王都一周的笑料，邦乔被任命为粮食部长，负责组织饥民进行自救运动，王都上下都想看这位胖子厨师怎么在没有一粒粮食的情况下让饥民安稳下来。"
  PA1_pol.05.a: "说不定真行呢？"

