#国策
  PA1_form_xiangma_cabinet: "组建相马内阁"
  PA1_form_xiangma_cabinet_desc: "旧国王的禅让已成事实。为应对眼前的财政和农业双重危机，我们必须尽快召集一批高效且忠诚的行政官员，将现代化的思维注入这个腐朽的殖民遗产中。"
  PA1_talent_only_edict: "唯才令"
  PA1_talent_only_edict_desc: "传统贵族已证明其无能。现在是时候打破身份的桎梏，让真正有才能的“怪人”进入权力中心，为王国续命。"
  PA1_grand_wedding: "大婚"
  PA1_grand_wedding_desc: "莉希雅公主是旧王室留下的最大政治筹码。通过这场联姻，我们将名正言顺地继承旧王国的政治遗产，巩固王室正统的合法性。"
  PA1_end_of_colonial_era: "殖民时代终结"
  PA1_end_of_colonial_era_desc: "尽管我们已独立，但游汐港仍在伊比利亚的控制之下，和她们的交易对我们来说算不上坏，毕竟她们无法出兵威胁我们。随着伊比利亚的内战开始，拿回游汐港势在必行，我们必须切断与宗主国的最后经济和军事联系，宣告一个新时代的到来，不然又如何能面对帝国的侵略呢。"
  PA1_end_of_colonial_era_tt: "§C尽管民意汹汹，但倘若我们能等到伊比利亚大乱之时，或许能够在不影响与伊比利亚国家友谊的情况下收回港口§!"
  PA1_agricultural_crisis: "农业危机"
  PA1_agricultural_crisis_desc: "我们的土地被单一的经济作物占据，粮食严重依赖进口。鼠目寸光的贵族地主们只顾眼前利益，我们必须策划一起行之有效的的土地改革，并且在帝国封锁前，我们必须找到新的、高产的食物来源。"
  PA1_black_robe_organization: "黑衣众组织"
  PA1_black_robe_organization_desc: "面对虎视眈眈的内外势力，建立一支不忠于贵族、只忠于国家的秘密情报与特种部队势在必行。"
  PA1_nationalized_shipyard: "国有化造船厂"
  PA1_nationalized_shipyard_desc: "王国海军孱弱且腐败，我们已经拿回了游汐港，而收回口岸造船厂的控制权，集中资源，才能为日后的海军防御计划打下基础。"
  PA1_taxation_crisis: "课税危机"
  PA1_taxation_crisis_desc: "腐败的贵族和混乱的税收系统，导致国库入不敷出。而贪婪、深陷大萧条的帝国还在强征我们的税收，我们必须借此机会引爆民主的怒火，发起一次改革，彻底改变目前的混乱局面！"
  PA1_promote_insect_based_food: "我们还能吃什么呢"
  PA1_promote_insect_based_food_desc: "现代知识告诉我们，昆虫是蛋白质的优质来源，这种食物流传在贫民窟，又被我们的农业部长发掘。尽管传统贵族嘲笑，但这是解决饥荒的最快、最现实的途径。"
  PA1_diva_radio: "歌姬广播"
  PA1_diva_radio_desc: "战争在即，士气低迷。利用最新的无线电技术，让全国人民听到来自王都的声音，以文化手段统一思想，鼓舞人心。"
  PA1_maritime_trade_network: "水上贸易网络"
  PA1_maritime_trade_network_desc: "地峡的河流资源被严重忽视。投资内陆驳船和河流航运，能快速建立廉价的区域物流网络，打破旧贵族的运输垄断。并且利用刚刚接收的游汐口岸海船，我们可以轻易绕开地峡复杂的地形和中美洲诸国打交道。"
  PA1_invest_in_national_projects: "投资国家工程"
  PA1_invest_in_national_projects_desc: "利用国家信用担保，启动大型公共基础设施项目。这不仅能提供就业，也能为未来战争储备物资和技术工人。"
  PA1_abandon_oriental_road: "毁弃东方道路"
  PA1_abandon_oriental_road_desc: "帝国的入侵路线清晰可见，我们必须提前行动，在进一步触怒她们之前，在东部边境人为制造交通瓶颈，让其装甲部队陷入泥泞的丛林，使彼国难以轻易下达开战的命令。"
  PA1_expand_light_industry: "拓展轻工业"
  PA1_expand_light_industry_desc: "鉴于国家内部大规模的经济作物，如棉花、咖啡田等，毁弃这些产业损失巨大，不如以此为基础建立配套的轻工业，增加其价值。"
  PA1_eradicate_coffee_plantations: "铲除咖啡田"
  PA1_eradicate_coffee_plantations_desc: "粮食比利润重要，哪怕牺牲部分外汇收入，将单一经济作物（咖啡）种植园转化为高产的土豆和玉米田，毕竟战端一开，粮食是首要问题。"
  PA1_eradicate_coffee_plantations_tt: "§Y$PA1_eradicate_coffee_plantations_focus$§!移除后："
  PA1_expand_fishing_fleet: "加大捕捞力度"
  PA1_expand_fishing_fleet_desc: "我们的海岸线资源丰富。投资渔业和海产养殖，不仅能增加食物来源，也能分散民众对陆地农业的依赖。"
  PA1_royal_city_municipal_construction: "王都市政建设"
  PA1_royal_city_municipal_construction_desc: "混乱不堪的首都形象，不利于王室威望。利用现代化规划，进行市政改造，提升国民的自豪感。"
  PA1_royal_city_municipal_construction_tt: "没有负担任何§Y国家债务§!"
  PA1_reject_imperial_currency: "NO！帝国"
  PA1_reject_imperial_currency_desc: "摆脱帝国金融控制的第一步。推行国家法定货币，并以可靠的商业智慧作为背书，确保新币的购买力。"
  PA1_centralized_storage: "集中仓储"
  PA1_centralized_storage_desc: "现代化的物流需要大型且集中的仓库群。建设地峡铁路沿线的仓储中心，实现物资的高效集散。"
  PA1_combat_banditry: "剿匪"
  PA1_combat_banditry_desc: "猖獗的匪患不仅威胁治安，更暴露了地方行政的失能。必须迅速解决匪患，以证明新内阁的统治力，也为接下来的道路规划打下基础。"
  PA1_establish_mineral_resources_ministry: "成立矿业部"
  PA1_establish_mineral_resources_ministry_desc: "艾尔孚利登蕴藏的矿产资源亟待开发。成立国家矿业部，集中管理和勘探，以保证未来工业的原材料供应。"
  PA1_kingdom_sacred_statue: "造神"
  PA1_kingdom_sacred_statue_desc: "建造一座宏伟的象征性建筑。这是凝聚民心、对抗宗教旧势力和为大改革建立统一信仰的重要精神工程。"
  PA1_connect_southern_kingdoms: "连通南部王国"
  PA1_connect_southern_kingdoms_desc: "帝国虎视眈眈，我们必须寻找盟友。将地峡铁路向南延伸，与南部强国建立交通和贸易联系。"
  PA1_expand_isthmus_road: "扩建地峡道路"
  PA1_expand_isthmus_road_desc: "铁路虽然高效，但地形复杂导致其运力有限。扩建地峡公路系统，使其能承受摩托化部队和工业运输，以作为铁路的补充，更便于为铁路运输提供维护。"
  PA1_develop_gem_mines: "开发宝石矿"
  PA1_develop_gem_mines_desc: "矿业部的首个重点项目。宝石矿能提供高价值、易运输的外汇，是摆脱贫困最快的途径之一，并且伴随宝石矿产出的源石矿物，更是魔法工业和能源工业的基石，也是我们打开魔法少女联盟外交窗口的筹码之一。"
  PA1_nationalized_iron_and_steel_company: "国有钢铁公司"
  PA1_nationalized_iron_and_steel_company_desc: "战争物资的核心。集中力量和资金，建立一家由国家绝对控制的钢铁公司，确保军备的自给自足。"
  PA1_improve_industrial_power_grid: "改善工业电网"
  PA1_improve_industrial_power_grid_desc: "工业发展需要可靠的电力供应。投资电网基础设施，减少工业生产中的停电和损耗。"
  PA1_promote_immigration: "促进移民"
  PA1_promote_immigration_desc: "战略位置重要，我们需要高素质的人力资源。吸引邻国或海外的专业人才和技术工人进入国家。"
  PA1_industrial_taxation_and_reinvestment: "工业税收和再投资"
  PA1_industrial_taxation_and_reinvestment_desc: "告别混乱的税收。建立现代税收体系，将工业利润的特定比例重新投入到基础建设和教育中。"
  PA1_focus_on_vocational_schools: "专注技术学校"
  PA1_focus_on_vocational_schools_desc: "军工厂和新兴工业需要大量技术人才。投资职业技术教育，为工业化培养切实提升工业效率的中坚人才。"
  PA1_invest_in_research_institutes: "投资科研所"
  PA1_invest_in_research_institutes_desc: "聘请最聪明的头脑进行科学研究，这是国家长远发展的根本，也是军事科技领先的关键。"
  PA1_national_automobile_factory: "国家汽车厂"
  PA1_national_automobile_factory_desc: "工业化的巅峰之作。建立汽车生产线，不仅能为军队提供机动化载具，也是国家工业能力的最佳证明。"


  PA1_army: "重新集结军队"
  PA1_army_desc: "尽管我们的武装力量不容小觑，但仍然比预期的要弱。为士兵配备更现代化的武器以及训练他们随时做好战斗准备是至关重要的。"
  PA1_military_facilities: "扩建军工设施"
  PA1_military_facilities_desc: "为了适应武装军队的需要，我们必须扩大武器产业。因此，必须建立专门用于生产军事装备的新工业设施。"
  PA1_department_of_propaganda: "宣传部"
  PA1_department_of_propaganda_desc: "世界风云变幻，尽管我们付出了最大的努力，但并不是我们所有的平民都支持参与战争。因此，我们必须成立一个部门，致力于说服人们参与国际武装斗争的好处。"
  PA1_logistics_department: "吃什么喝什么"
  PA1_logistics_department_desc: "也许对于我们来说南美是家园，但对于现役部队来说，它仍然是一片残酷无情的大陆。为了缓解这个问题，成立一个专门负责物流管理和分配的武装力量部门将是有益的。"
  PA1_support_company: "穿什么用什么"
  PA1_jungle_pioneers: "我也能当猎帅"
  PA1_jungle_pioneers_desc: "与我们最近成立的后勤部门随之而来的是一系列新发现的问题。首先，为了维持物资的流动，需要制造足够数量的合适的设备和物资，而我们目前的材料还不够。如果我们想赶上竞争对手，就必须使我们的辅助装备现代化。"
  PA1_jungle_pioneers_tt: "解锁§Y丛林先锋§!支援营：\n §Y丛林§!：\n 移动：§G+30%§!\n 攻击：§G+10%§!\n 防御：§G+20%§!"
  PA1_support_company_desc: "与我们最近成立的后勤部门随之而来的是一系列新发现的问题。首先，为了维持物资的流动，需要制造足够数量的合适的设备和物资，而我们目前的材料还不够。如果我们想赶上竞争对手，就必须使我们的辅助装备现代化。"
  PA1_department_of_military_intelligence: "军事情报部"
  PA1_department_of_military_intelligence_desc: "虽然这两个词可能在意思上相互矛盾，但关键是要明白，如果不准确了解敌人的立场和动机，就很难在正面战斗中击败他们。因此，必须为军队设立军事情报部门。"
  PA1_motorized: "飞将军"
  PA1_motorized_desc: "未来的战争需要快速移动的车辆包围并摧毁敌人且不给他们足够的反应时间；不需要的是16或17世纪的步兵火力线，那种策略不必要地浪费时间和人力，效果还不明显。"
  PA1_tank_warfare: "坦克战"
  PA1_tank_warfare_desc: "对机动部队最好的补充是由强大的金属巨兽组成的单位，它们的火力几乎可以压制任何敌人。唯一的问题是，我们的坦克生产的侧重点应该放在德式闪电战战略，还是应该作为步兵的支援？"
  PA1_tank_warfare_tt: "解锁§Y特化§!我国装甲项目的决议"
  PA1_domestic_production: "专注国内生产"
  PA1_domestic_production_desc: "虽然这无疑会增加困难和耗时，但在我们自己的国内开发和生产坦克更有利，这可以确保产品的质量，还能避免我们的武器交付在到达之前被盗的风险。"
  PA1_mechanized_troops: "具装飞将军"
  PA1_mechanized_troops_desc: "为了推进我军的发展，并适应未来战争的要求，我们应大力推进普通步兵的机械化，使他们和坦克部队一道，能在安全的装甲中肆虐战场。"
  PA1_army_academy: "培养可靠的军人"
  PA1_army_academy_desc: "拥有有效的武器并不是决定战斗胜负的唯一因素。另一个重要因素是单兵的技能，再加上将军指挥部队的技能。为了达到这个目的，我们应该投资于扩张我们军校陆军部的业务。"
  PA1_regular_infantry: "万夫一心"
  PA1_regular_infantry_desc: "虽然装备比什么都重要，但捍卫祖国、捍卫核心价值观、为亲人而战的单兵才是军队的真正力量。这就是为什么我们必须最大限度地提高普通士兵的士气，让他们有最好的机会赢得最艰难的战斗。"
  PA1_artillery: "我爱大炮"
  PA1_artillery_desc: "我们的经济不如帝国强大。因此，如果我们想要更强大、更好的装备，我们就需要特化重炮生产，尽管我们希望有足够的钱来购买所有我们想要的装备。"
  PA1_foreign_designs: "获取外国设计"
  PA1_foreign_designs_desc: "即使我们希望我们有科学家和工程师来制造我们自己的装甲，最好还是利用我们拥有的关系在国际市场上为自己达成一些优质的交易，因为这是目前获得特化装备的唯一真实可行的选择。"
  PA1_foreign_advisors: "外国教练"
  PA1_foreign_advisors_desc: "虽然我们的军事教官很不错，但他们并不像那些参加过多次冲突并接受过其他国家最高声望的军事学院培训的人那样优秀。因此，我们应该努力吸引境外各国的专长领域的军事顾问来帮助培训我们的军队，以进一步加强我们的武装力量。"
  PA1_army_professionalism: "军队普鲁士化"
  PA1_army_professionalism_desc: "尽管让尽可能多的士兵待命等待参军可能是一种好的做法，但根据我们的外国军事顾问的说法，确保军队在任何时候都处于最佳状态要重要得多。"
  PA1_conscription: "当兵吃粮"
  PA1_conscription_desc: "尽管我们的士兵的专业性可能会受到质疑，但毫无疑问，我们的军队当前迫切需要的是更多的士兵填补队伍，因为我们正为缺乏自愿加入我们军队的人而苦恼。"
  PA1_experimental_weapons_department: "实验武器部"
  PA1_experimental_weapons_department_desc: "如果我们不希望在技术部门落后于我们的竞争对手，那么我们最好开始研究相应理论并尝试开发所谓的奇迹武器，以免在战场上被打败。"
  PA1_nuclear_program: "国内核研究项目"
  PA1_nuclear_program_desc: "[PAN.GetName]人和[DVL.GetName]人正在努力揭开原子的秘密，我们不能让自己落在他们后面。尽管他们是为了战争而研究，但我们的科学家也提到了利用原子分裂来改善平民生活的方法。"
  PA1_special_forces: "特种部队计划"
  PA1_special_forces_desc: "我们的军队虽然规模小，但可以通过特训让士兵擅长某些情况和战斗类型，从而大大加强我们的军队。因此，建立培训和收容这类士兵的项目应该被视为我们的首要任务。"
  PA1_special_forces_option_1: "我们在山林"
  PA1_special_forces_option_1_desc: "军队中的山地部队应该受到我们上级命令的特别关注，因为他们所能做到的壮举对于我们的一般士兵来说只能梦里想想。他们能够在危险的安第斯山脉进行战斗，并在向前推进时支援我们的常规部队。"
  PA1_special_forces_option_2: "我们在海上"
  PA1_special_forces_option_2_desc: "海军是我们目前的优势之一，如果能利用这一事实，让他们拥有由训练有素、战斗力极强的海军陆战队组成的自己的军队，将会更加有利。"
  PA1_special_forces_option_3: "我们在空中"
  PA1_special_forces_option_3_desc: "空军是我们目前的优势之一，如果能利用这一事实，让他们拥有经过专门训练、战斗力极强的空降兵，将会更加有利。"
  PA1_special_forces_option_1_continuation: "游骑兵训练计划"
  PA1_special_forces_option_1_continuation_desc: "为了支援我们的山地部队，我们应该雇用游骑兵，这些士兵不仅在山地区域受过专门训练，而且还在南美洲的森林和丛林中战斗过。"
  PA1_special_forces_option_2_continuation: "加强海军陆战队"
  PA1_special_forces_option_2_continuation_desc: "为了让我们的海军陆战队充分发挥作用，我们应该考虑开发支持他们的技术，例如登陆车辆和更好的补给分配技术，以支援他们的海岸登陆作战。"
  PA1_special_forces_option_3_continuation: "空投补给与装备"
  PA1_special_forces_option_3_continuation_desc: "为了让我们的伞兵在执行跳伞任务时有最高的成功机会，我们应该考虑开发有助于提高他们生存能力的技术，无论是可空头的装甲车还是带伪装的补给箱。"
  PA1_air_defense: "防空"
  PA1_air_defense_desc: "既然我们的对手已经露出了真面目，并开始开发自己的空中武器，我们必须做好应对的准备。因此，我们应该从下令快速建造并部署防空阵地和防空火炮开始准备。"
  PA1_air_force: "武装空军"
  PA1_air_force_desc: "许多理论家会认为，我们目前最落后的领域是现代化空军的发展。因此，我们必须建设新的机库和设施并培训更多的飞行员，努力弥补这一缺陷。"
  PA1_air_academy: "建立正规空军学院"
  PA1_air_academy_desc: "不仅仅是那些将在地面部队作战的士兵需要接受适当的教育。我们的飞行员虽然充满热情，但缺乏在空战中取胜所需的专业训练。为了解决这个问题，我们应该扩建军事学院，增加符合空军要求的课程。"
  PA1_construct_air_bases: "建设新空军基地"
  PA1_construct_air_bases_desc: "除了需要专业、受过良好教育和积极进取的飞行员外，我们还缺乏大型空军所需的另一项关键功能——机场。虽然我们有一些机场，但如果我们希望将空军扩大到具有竞争力的水平，仅凭它们是远远不够的。"
  PA1_domestic_designs: "本国设计"
  PA1_domestic_designs_desc: "我们最好自行创造和生产我们自己的模型和飞机设计，因为其他国家设计或生产号称适合我们飞行员的飞机是不值得信赖的。"
  PA1_license_designs: "外国设计许可"
  PA1_license_designs_desc: "研究和开发我们自己设计的飞机需要花费太多的时间和精力。这就是为什么我们应该获得外国装备的生产许可，而不是执拗于在[ROOT.GetNameDef]国内的生产。"
  PA1_purchase_aircraft: "造不如买"
  PA1_purchase_aircraft_desc: "我们的空军已经决定，不仅要开发，还要生产我们自己的飞机，这将是非常昂贵和耗时的。相反，他们主张购买外国装备，我们也应该采纳这种立场。"
  PA1_establish_aircraft_industry: "国内飞机产业"
  PA1_establish_aircraft_industry_desc: "很明显，如果我们希望保持我们的生产效率尽可能高，我们必须在我们自己的境内大规模建设飞机产业。"
  PA1_flying_fortress: "大飞机"
  PA1_flying_fortress_desc: "正确利用空军的唯一方法是用它轰炸敌人，使他们屈服，直到在地平线前一无所有。因此，我们应该建造大型飞机，让它们能够携带我们所需要的尽可能多的炸药。"
  PA1_tactical_air_force: "中飞机"
  PA1_tactical_air_force_desc: "空军不仅要用来支援地面部队，还要执行许多地面部队无法单独完成的更复杂的任务。这才是造就一支伟大空军的真正精髓。"
  PA1_nimble_air_force: "小飞机"
  PA1_nimble_air_force_desc: "战机不仅要能战胜敌机，还要能胜过他们的防空炮和海军舰艇的虎视眈眈。空军应该由小型飞机组成，适合以足够有效的方式进行空中缠斗和战术打击，同时永远不要变得过于沉重而无法快速果断地机动。"
  PA1_strategic_bombing: "专注战略轰炸"
  PA1_strategic_bombing_desc: "要赢得一场战争，不仅要在战斗中打败敌人，还要削弱其经济和工业能力。这就是为什么战略轰炸应该被视为我们在战争中的首要目标。"
  PA1_army_support: "陆军支援"
  PA1_army_support_desc: "如果受到空中打击，陆军是无法取胜的。这就是为什么不仅要用我们的空军来保护他们，我们的战机也应该对我们的对手做同样的事情。"
  PA1_winning_the_air_war: "赢得空战"
  PA1_winning_the_air_war_desc: "虽然地面支援和海上轰炸都被认为是重要的，但非常有必要认识到，如果没有制空权，这些行动都毫无价值。因此，我们的空军应该尽可能地控制天空。"
  PA1_naval_support: "专注海军支援"
  PA1_naval_support_desc: "我军的飞机的首要目标是帮助我们为我们的海军和民用舰船保障航线安全并保护他们。因此，重要的是要在设计飞机时考虑到支援海军和巡逻的作用，并确保它们能够避免被舰载防空炮击落。"
  PA1_air_modifier_boost_1: "地面支援专精"
  PA1_air_modifier_boost_1_desc: "确保步兵总能到达他们要去的地方是非常重要的，因此，集中空军力量协助他们做到这一点也很重要，无论是通过直接空中支援，还是轰炸敌人后方。"
  PA1_air_modifier_boost_2: "研发先进机身"
  PA1_air_modifier_boost_2_desc: "如果我们希望我们的飞机在与敌人的交火中幸存下来，重要的是它们不仅能够尽可能避免中弹，同时还能够在一到两次中弹后幸存下来，并且能够飞到所需的最远的地方去接受修理。这就是为什么我们应该为我们的飞机开发更好的机身和引擎，以便飞行员在任何情况下都能安全。"
  PA1_air_doctrine: "理论进步"
  PA1_air_doctrine_desc: "重要的是要注意，如果缺乏正确的战略，即使是最伟大的飞行员和飞机也无法在战斗中获胜。战争就是计划、战略并充分利用国内所有个人的力量。因此，我们应该大力发展可供空军实践的新理论。"
  PA1_aircraft_carriers: "航空母舰"
  PA1_joint_operative_command: "联合作战司令部"
  PA1_joint_operative_command_desc: "现在我们不仅发展了我们的陆军，而且也为我们的空军奠定了良好的基础，现在是建立这些不同军种之间的协调与合作的时候了。因此，我们将建立一个联合作战司令部，由从两个军种中选出的指挥官组成。"
  PA1_war_planning_office: "庙算部"
  PA1_war_planning_office_desc: "我们现在还需要确保我们的军队能够接受正确的、经过深思熟虑的计划和命令，以免在信息战中落后，那样可能会得到过时的情报导致我军被伏击和摧毁。因此，我们应该成立一个作战计划处，以便更好地协调这些工作。"
  PA1_women_in_aviation: "空军中的女性"
  PA1_women_in_aviation_desc: "尽管并非总是受到这样的对待，但女性在社会中一直扮演着重要的角色，现在是时候让她们挺身而出，完成以前被视为只有男性才能完成的任务，比如生产和驾驶我们国家的飞机。"
  PA1_navy: "海军"
  PA1_naval_academy: "加强海军学院建设"
  PA1_construct_naval_bases: "建设新海军基地"
  PA1_naval_foreign_advisors: "邀请海军顾问"
  PA1_purchase_destroyers_and_subs: "购买驱逐舰和潜艇"
  PA1_purchase_destroyers_and_subs_desc: "随着世界变得越来越不稳定，我们需要扩大我们的海军力量投射能力。幸运的是，一些大国的海军舰队可能愿意放弃他们的旧船。"
  PA1_reescalate_the_naval_arms_race: "重启海军军备竞赛"
  PA1_blue_water_fleet: "蓝水海军"
  PA1_coastal_fleet: "沿岸船队"
  PA1_purchase_cruisers_and_dreadnoughts: "购买巡洋舰和无畏舰"
  PA1_minelaying: "改进水雷布设"
  PA1_escort_fleet: "护航舰队"
  PA1_raiding_fleet: "袭击舰队"
  PA1_degaussing: "消磁"
  PA1_naval_invasion: "登陆作战"
  PA1_cruiser_subs: "巡洋潜艇"
  PA1_midget_subs: "袖珍潜艇"
  PA1_expand_repair_yards: "扩建修理码头"
  PA1_enlarge_naval_facilities: "扩建海军设施"
  PA1_merchant_marine: "强大的商船队"
  PA1_fortification_effort: "重视防御工事"
  PA1_mountain_guns: "投资山地火炮"
  PA1_mountain_guns_desc: "我军注意到，虽然这种火炮可能非常强大，但目前在复杂的山区几乎无法使用。因此，他们订购了山地火炮，以便在山区更容易使用，这样我们就可以继续使用这种致命的武器。"
  PA1_tierra_del_fuego_training: "在火地岛训练"
  PA1_tierra_del_fuego_training_desc: "如果我们希望我们的士兵在寒冷的南方和山区有效地作战，他们就需要接受相应的训练。因此，我们必须确保为火地岛的部队设立训练营，使他们能够更好地适应寒冷。"
  PA1_atacama_training: "在沙漠训练"
  PA1_atacama_training_desc: "如果我们希望我们的士兵能在炎热的热带和沙漠中有效地作战，他们就需要接受相应的训练。解决这个问题的最好办法是在沙漠建立训练营，在那里他们可以更好地适应高温。"
  PA1_a_land_of_mountains: "群山之地"
  PA1_a_land_of_mountains_desc: "长期以来，[ROOT.GetName]在战斗中一直有利用山地地形的强大传统，未来也不会例外。我们是一个习惯于生活在山区的民族，我们将利用我们的专业知识击败我们遇到的任何劲敌。"
  PA1_navy_desc: "自那次世界大战以来，我们的海军已经停滞不前，以至于许多舰船不再适用。是时候投资舰队，并开始一项大规模现代化计划。"
  PA1_naval_academy_desc: "仅仅生产和维护舰船是不足以构成一支海军的。我们需要训练有素的军官和专家来学习如何在战斗中利用海军资产。因此，我们将建立[ROOT.GetAdjective]海军学院来培养下一代海军军官。"
  PA1_construct_naval_bases_desc: "我们的海军设施陈旧，亟需现代化。通过投资这些设施，我们将能够建造和支持更强大的海军资产。"
  PA1_naval_foreign_advisors_desc: "我们的海军军官最近很少有机会在战斗中检验他们的能力。因此，我们可以邀请外国海军军官来用现代海军战术训练我们自己的军官，我们将以此获益。"
  PA1_reescalate_the_naval_arms_race_desc: "虽然我们与邻国没有就海军规模达成正式协议，但自那次世界大战以来，我们一直避免过度扩张海军。然而，战争再次出现在地平线上，我们最好在重整军备方面领先于我们的邻国。"
  PA1_blue_water_fleet_desc: "海军力量投射对任何渴望加入大国行列或保持强大威慑力量的国家都是至关重要的。因此，我们应该确保我们的海军拥有优质的装备和训练，即使在远离母港的地方也能有效行动。"
  PA1_coastal_fleet_desc: "我们不太想在全球范围内打仗。因此，我们舰队的首要目标应该是保护我们的海岸线，防止任何敌人登陆我们的海岸。"
  PA1_purchase_cruisers_and_dreadnoughts_desc: "虽然我们的工业实力持续增长，但时间并不站在我们这一边。为了充分加强我们的海军，我们需要尽快增加主力舰艇。因此，我们将与大国接触，看看他们是否愿意出售他们封存的无畏舰和巡洋舰。"
  PA1_minelaying_desc: "维持足够数量的舰船来随时保卫我们广阔的海岸线可能是非常昂贵的。地雷提供了一个更便宜的解决方案，可以协助阻止或减缓敌军，直到舰队抵达。"
  PA1_escort_fleet_desc: "大型舰队的时代已经过去了，现代海战需要由小型船只组成的舰队与有限数量的主力舰一起护航。因此，海军需要重新调整他们的计划，以适应这种战术。"
  PA1_raiding_fleet_desc: "海军补给线对大多数经济体的运转至关重要。利用我们的海军力量来破坏这些补给线可能是一种让最强大的国家屈服的方式。"
  PA1_degaussing_desc: "我们将开始对我们的船体进行消磁，减少它们的磁信号。这将保护它们免受磁性水雷的伤害，并减少船只的电子特征。"
  PA1_naval_invasion_desc: "对付敌国通常需要士兵登陆他们的海岸。为了最大限度地发挥我们执行这种行动的能力，我们将开始进行陆海军联合演习的训练。"
  PA1_cruiser_subs_desc: "大西洋和太平洋无比辽阔，需要能够长时间高效自主运作的潜艇。因此，我们需要投资发展我们自己的巡洋潜艇。"
  PA1_midget_subs_desc: "在浩瀚的海洋中行动的自给自足的潜艇是徒劳无用的。我们可以更好地利用我们的资源，建造在我们海岸线浅水海域行动的较小舰船。"
  PA1_expand_repair_yards_desc: "即使是拥有最高效船员的最坚固的船只，在重新服役之前也最终需要维修。我们应该投资我们的海军修理厂，以确保这一过程尽快进行。"
  PA1_enlarge_naval_facilities_desc: "全球最近的事态发展清楚地表明，如果我们要维持一支适应时代的舰队，我们的海军必须得到加强。实现这一目标的第一步是扩建我们现有的海军设施。"
  PA1_merchant_marine_desc: "海上资源运输对许多国家的国家安全至关重要，我国也不例外。因此，我们应该建立一支能够在危机时刻支持我军的专业商船队。"
  PA1_aircraft_carriers_desc: "为了避免被敌人甩在后面，我们需要将飞机编入海军。为了做到这一点，我们需要生产自己的航空母舰。利用我们的大型过时船只的船体可能是加速它们生产的一种方法。"
  PA1_fortification_effort_desc: "虽然海军和空军是我们防止敌军到达我们海岸的主要手段，但我们仍然应该维持一套坚固的沿海防御工事，作为抵御任何可能的入侵者的最后防线。"

  PA1_jungle_warfare_training: "去妖精家里训练"
  PA1_jungle_warfare_training_desc: "我国一些军官敦促我们在亚马逊投资建立一个特化训练设施。该设施的目的是让我国军队为在丛林中的非常规战争做好准备，提高在战斗中利用此类地形的能力。"
  PA1_brown_water_navy: "我爱皮划艇"
  PA1_brown_water_navy_desc: "我国军队尚未充分利用南美丛林中的蜿蜒河流。我们应该用一些小型河流攻击艇来扩编褐水舰队，为远离增援或补给的我国士兵提供支援。"

  PA1_foreign_advisors_tt: "解锁§Y邀请外国顾问§!训练我国陆军的决议"
  PA1_navy_foreign_advisors_tt: "解锁§Y邀请外国顾问§!训练我国海军的决议"

  PA1_purchase_aircraft_tt: "解锁从国外§Y采购飞机§!的决议"

  PA1_aircraft_carrier_bonus: "航空母舰计划"


  PA1_purchase_obsolete_ships_tt: "解锁§Y$south_american_naval_arms_race_category$§!决议，可以从大国购买无畏舰和其他旧主力舰船。"
  PA1_minelaying_bonus: "布雷工作"

  PA1_jet_tech_bonus: "先进空战增益"
  PA1_carrier_conversion: "改装的航空母舰"
  PA1_carrier_conversion_desc: "我们的海空力量不足以保卫我们的国家利益。虽然我们负担不起建造航母的费用，但作为权宜之计，我们可以购买退役的巡洋舰，并将其改装为简单的航母。"
  PA1_army_academy_random_generals_tt: "随机选择的§Y3§!名陆军将领将获得§G+1§!计划技能"
  PA1_support_company_initiative: "支援连计划"
  PA1_motorization_initiative: "摩托化倡议"
  PA1_army_modernization_initiative: "陆军现代化倡议"
  PA1_armor_modernization_initiative: "装甲部队现代化倡议"
  PA1_naval_academy_random_admirals_tt: "最多§Y3§!名随机选择的海军将领将获得§G+1§!协同技能"

#民族精神
  PA1_plantation_economy: "粮食危机"
  PA1_plantation_economy_desc: "为了满足宗主帝国的需求，国内遍地都是棉花和咖啡种植园，粮食严重依赖进口。一旦被封锁，国家将陷入饥荒。"
  PA1_fragmented_military: "割裂的军队"
  PA1_fragmented_military_desc: "地方军队各自为政，只听命于旧贵族，而非国王。如今国王禅位相马殿下，这一震惊内外的举动让政局更加纷乱，我们首要的威胁就是这帮欺软怕硬的败类！"
  PA1_fiscal_deficit: "财政赤字"
  PA1_fiscal_deficit_desc: "国库空虚，若不能尽快开源节流，进行大刀阔斧的改革，甚至发不出军饷，更遑论行政之运行了。"
  PA1_isthmus_keeper: "地峡守门人"
  PA1_isthmus_keeper_desc: "我们控制着唯一的跨洋铁路。这是我们生存的筹码，也是取死之道。拉丁美洲的卡西米尔，艾尔孚利登被瓦尔哈拉和帝国包围在中间，如果不像被其中之一吞并，或是成为卡西米尔绞肉机一般的战场，就必须建立强大的国防军队。"
  PA1_imperial_taxation: "帝国征税"
  PA1_imperial_taxation_desc: "帝国凭借其强大的体量和军队，借口宗主地位，肆意盘剥国家税收，旧贵族、旧军队无力抵御国门，我们必须发起大改革反抗暴政！"
  PA1_semi_tidal_leaf_realm: "半游汐叶界"
  PA1_semi_tidal_leaf_realm_desc: "艾尔孚利登长期和伊比利亚存在贸易往来，多年前更是其殖民地之一，在民族记忆中伊比利亚的形象已经模糊，取而代之的是女神们亲切的形象以及她们令人惊叹的科技玩意儿。"

