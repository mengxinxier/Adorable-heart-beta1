####人物####
  ELF_Ally_Conference: "艾尔芙盟约议会"
  EWW_Tauriel_Windwhisper: "薇雅·叶奈"
  EWW_Tauriel_Windwhisper_Desc: "§L薇雅是叶奈氏族的长女，她的名字意为“编织者”。她天生就是一位语言的艺术家和政治的宠儿，聪慧、果决、善于言辞，能将最复杂的局势编织成对自己最有利的局面。“落叶之灾”发生时，她正作为家族代表常驻风声河谷，凭借出色的外交手腕为部族争取着政治空间。\n家园毁灭的噩耗传来时，她远在千里之外。这份缺席，成为了她一生中最深的愧疚和无法言说的痛苦。当妹妹莉芙选择拥抱废墟时，薇雅强行压下了所有的悲痛，做出了一个更为艰难的决定——留在风声河谷。她比任何人都清楚，仅凭残存的勇气无法复兴氏族，边境需要的不仅是守护者，更是来自联盟心脏的血液——补给、盟友和政治上的支持。\n于是，薇雅戴上了一副自信甚至略显轻浮的面具。她游走于联盟各大部族的议会之间，用她编织的语言，时而如春风般和煦，时而如冬雪般冰冷。她用笑容掩盖内心的伤痕，用智慧换取生存的资源。在风语者议会中，她是声名显赫的首席代表，是冉冉升起的政治新星，却也是许多守旧派眼中“忘记了血海深仇的投机者”。\n无人知晓，在每一个夜深人静的时刻，这位风光无限的议会领袖，都会独自展开那张来自叶落边境的、残破的地图，用颤抖的手指描摹着妹妹所在的那个小小的据点。她那自信狡黠的笑容背后，是对妹妹安危的无尽担忧，是对复兴整个氏族的沉重责任。\n薇雅守护世界的方式与莉芙截然不同。莉芙用自己的身躯直面风雪，而薇雅则试图用自己的智慧去改变风向。她们是同一棵古树在灾难后长出的两根枝桠，一根选择紧守着焦黑的故土，另一根则拼命地伸向天空，去争夺每一缕能够让家园重生的阳光。她们的道路截然不同，但她们的根，永远紧紧连在一起。§!"
  ELW_Calenwen_Leafwhisper: "莉芙·叶奈"
  ELW_Calenwen_Leafwhisper_Desc: "§L莉芙是叶奈氏族的次女，她的名字在古妖精语中意为“生命”。然而，她的成长却被死亡的阴影所缠绕。不同于姐姐薇雅与生俱来的领袖气质，莉芙自幼便安静、敏感，她更喜欢独自坐在林间，聆听风吹过树叶的声音，而不是在部落会议上高谈阔论。她是家族中最具天赋的“风语者”，能从一草一木的凋零中，感知到大地深处的悲鸣。\n“落叶之灾”彻底击碎了她平静的世界。当敌人如潮水般涌入家园时，她亲眼目睹了父兄战死，族人流离失所，曾经繁茂的森林在烈火中化为焦土。是姐姐薇雅拼死将她从尸堆中救出，但那地狱般的景象，已在她纯净的灵魂上烙下了永恒的伤痕。自那时起，她眼中那份纯粹的喜悦便褪去了，取而代之的是一种超越年龄的沉静与忧郁。\n战后，幸存的族人大多选择退回联盟中心的风声河谷寻求庇护，但莉芙却做出了一个令人心碎的决定——她选择留下。她回到了那片如今被称为叶落边境的焦土，与那些同样无法割舍故土的风逐者残部一起，在废墟之上重建家园。\n对莉芙而言，这不是一个政治选择，而是一份无法推卸的责任。她将族人的牺牲归咎于自己的弱小，认为自己必须留在这片土地上，用余生去守护亡者的安宁和生者的希望。她并非一位发号施令的统帅，而是一位与族人同甘共苦的守护者。她的领导力源于她那双从不躲闪、能映照出每个人内心痛苦的眼睛。在寒冷的边境长夜，她会为每一个士兵缝补衣裳，分享最后一块黑面包，她的存在本身，就是对所有幸存者最温柔的慰藉。\n她或许不懂得权谋与战略，但她记得每一寸土地的伤痕，记得每一个牺牲者的名字。她战斗的唯一目的，就是让这片叶落边境，再也不会有新的“落叶”。§!"
  ELG_Nerys_Lightglow: "奈瑞丝·光辉"
  ELG_Nerys_Lightglow_Desc: "§L在曦光圣域，血统的纯净与晨光信仰一样至高无上。晨光教会的教义认为，唯有最纯粹的艾尔芙血脉，才能最完美地传导神圣的曦光之力。而奈瑞丝·光辉，这位如今端坐于圣域最高神座上的女祭司，却是一个活生生的“渎神”之证——她是一位半妖精。\n她的母亲是一位因战争而流落到圣域的人类，她的诞生，从一开始就是原罪。在圣域纯血至上的环境中，奈瑞丝的童年充满了排挤与轻蔑。她被称为“褪色者”、“光中之影”，被禁止进入教会的核心圣堂。然而，命运却开了最残酷的玩笑：这个血统“不洁”的孩子，对曦光之力的亲和性，竟超越了圣域有史以来所有的纯血天才。当同龄的纯血妖精还在艰难地凝聚第一缕光辉时，她已能让圣光如呼吸般自然地流淌于指尖，治愈伤痛，驱散阴影。\n她的存在，成为了晨光教会内部最大的矛盾与尴尬。守旧派视她为必须被净化的异端，但开明派，包括她的导师——上一代大祭司，却在她身上看到了曦光信仰最本质的体现：光明，应源于灵魂的纯粹，而非血脉的高贵。凭借着无可匹敌的天赋和导师的庇护，奈瑞丝在教会中艰难地崛起。她比任何人都更虔诚地祈祷，比任何人都更严苛地修行，她用百倍的努力，去对抗那份与生俱来的“原罪”。\n她严肃的表情，并非天性冷漠，而是在无数次质疑与审视的目光中，为自己锻造出的坚硬铠甲。当她的导师逝去，教会内部因继承人问题而陷入分裂时，奈瑞丝在一场决定圣域未来的神圣决斗中，以压倒性的光明之力，战胜了所有纯血的挑战者，最终登上了最高女祭司之位。\n如今，她成为了圣域的统治者，却也坐在了火山口上。她的脚下，是汹涌的守旧派暗流；她的背后，是整个半妖精群体期盼的目光。她不仅仅是一个领袖，更是一场宗教改革的旗手。她决心要用自己这一生，去重新定义“光辉”的含义，让曦光圣域的光芒，真正地照耀到每一个需要它的灵魂，\n无论其血脉，无论其出身!!!§!"
  EDW_Seren_Duskwood: "瑟兰·暮林"
  EDW_Seren_Duskwood_Desc: "§L如果说曦光圣域是联盟的心脏，那么暮色林渊便是联盟的影子。这里的居民世代生活在不见阳光的参天古木之下，她们是联盟最优秀的斥候、刺客和情报收集者。她们不信奉晨光，只相信平衡——有光必有影，有生必有死。她们组成的暮影密会，负责处理所有圣域无法用光明去解决的“污秽”。\n瑟兰并非诞生于权贵之家，她只是林渊中一个普通的孤儿，因其天生对“寂静”的敏锐感知而被密会选中。她能从最微弱的呼吸声中分辨出谎言，能从最深沉的阴影里读懂杀意。她接受了最残酷的训练，学会了如何成为一道真正的影子，无声无息地，为联盟清除那些潜在的威胁。\n当奈瑞丝在曦光圣域崛起时，暮影密会是第一个察觉到这场变革风暴的势力。守旧派认为奈瑞丝的半妖精血统是对联盟的玷污，主张将其清除。但作为“静语者”——密会的实际决策者，瑟兰却投下了决定性的反对票。\n因为只有她，这个常年行走于阴影中的人，才最清楚曦光圣域那纯血教义背后隐藏的腐朽与虚伪。她从奈瑞丝那双坚毅的眼睛里，看到了一种比任何纯血艾尔芙都更纯粹的光芒。她明白，奈瑞丝的改革，或许会给联盟带来阵痛，但那却是治愈联盟内部顽疾唯一的希望。\n于是，瑟兰开始在暗中行动。她领导的暮影密会，成为了奈瑞丝在阴影中最坚实的盟友。她会悄无声息地，为奈瑞丝清除那些最顽固的政敌；她会不动声色地，将守旧派的阴谋，变成一张张匿名的警告信，送到奈瑞丝的案头。\n她们两人，一个在光明中掀起万丈波澜，一个在黑暗里平息无声的涟漪。她们或许从未在公开场合有过任何交集，但她们的目光，却早已越过光明与黑暗的界限，交织在了一起。她们是艾尔芙联盟的一体两面，是维系着这个古老种族未来的、最后的希望。§!"
  EBS_Merenwen_Boundlesssea: "妮拉·露米"
  EBS_Merenwen_Boundlesssea_Desc: "§L艾尔芙联盟的角落，存在着一片被称为无垠之海的神秘领域。那并非真正的海洋，而是一片终年不散的、拥有自我意识的巨大魔法迷雾。这片“海”保护着其中的居民，也隔绝了她们与外界的一切联系。生活在这里的，是被称作“海洋的女儿”的妖精部族。\n妮拉·露米，是这个部族数百年一遇的神谕者。她的灵魂与这片无垠之海完全同调，以至于她的发色与眼眸都呈现出与迷雾核心相同的、剔透的碧蓝色。她不是一位统治者，而是一个“容器”，一个传递“海”之意志的脆弱媒介。\n她的童年，从未踏出过迷雾笼罩的家园一步。她所知的一切，都来自于“海”的低语。“海”是她的玩伴，是她的老师，也是她的神。通过“海”，她能“看”到外界发生的一切——革命的火焰、王国的崩溃、亡灵的哀嚎……这些纷乱的“故事”构成了她对世界的全部认知。然而，这种感知是被过滤的，就像隔着一层厚厚的水幕，她能看到影像，却无法体会到真实的情感。\n这造就了妮拉纯真而又忧郁的性格。她对世界充满了孩童般的好奇，却又因“海”所传递的、外界日益增长的痛苦与恶意而感到不安。她脸颊上偶尔滑落的水珠，并非汗水，而是“海”在感受到外界的悲伤时，在她身上具现化的眼泪。\n最近，“海”的情绪变得前所未有的焦躁与恐惧。它“看”到了一个巨大的、来自阿德莱希帝国的黑暗漩涡正在形成——那是一种纯粹的、充满了暴虐与毁灭欲望的黑暗力量。这股力量让以纯净与平衡为本能的“海”感到了致命的威胁。\n这份巨大的恐惧，如今全部压在了妮拉瘦弱的肩膀上。作为神谕者，她必须为她的族人指明未来的方向。可她自己，却只是一个从未见过真正海洋，也从未与人争吵过的孩子。她知道风暴即将来临，却不知道该如何驾驭一艘从未驶出过港湾的小船。\n她那双如湖水般清澈的眼眸里，映出的不仅是对未来的迷茫，更是对那个她从未踏足、却又与她命运相连的、残酷世界的深深忧虑。她将是第一个，必须带领海洋的女儿们，直面世界之浪的领航员。§!"
  EFC_Elara_Lightglow: "希露·奥蕾希亚"
  EFC_Elara_Lightglow_Desc: "§L“在希尔瓦尼亚，一切都有价码，包括正义。”——这是希露·奥蕾希亚的信条，也是她血的教训。\n奥蕾希亚家族是希尔瓦尼亚城邦的奠基者与事实上的统治者。这座联盟唯一的城邦并非诞生于森林的庇护，而是建立在矿脉与贸易路线上。这里的妖精不信奉古老的自然之灵，她们信奉的是法律、契约与冰冷的金钱。而希露，作为家族最受宠爱的小女儿，曾是这座黄金之城最耀眼的明珠。\n她的童年，在奢华的宴会、理事会的辩论和无尽的财富中度过。然而，当阿德莱希帝国的第四次扩张战争爆发时，这一切化为泡影。帝国军队以压倒性的力量兵临城下，她们对财富的贪婪远胜于对生命的尊重。在城破的混乱中，时任执政官的父亲为了保护密约文件，被阿德莱希的将军们残忍虐杀。年幼的希露躲在密室的暗格里，透过缝隙，亲眼目睹了父亲的死亡和帝国士兵那野兽般的狂笑。\n那一天，希露眼中最后一丝天真被鲜血彻底染红。\n战争结束后，残破的城邦迎回了和平，但希露迎来了自己的战争。她以惊人的早熟和冷酷的手段，迅速整合了家族残余的势力。她不再相信虚无缥ें的盟约，也鄙夷软弱的祈祷。她将所有的资源都投入到了两个方面：经济与军事。她用金钱重建了比以往更坚固的城墙，用贸易网络编织了覆盖半个南美的情报网，用最先进的技术武装了一支忠于理事会、也忠于她个人的“契约军团”。\n如今的希露，是希尔瓦尼亚无可争议的领袖。她外表风情万种，言辞犀利，在外交场合总能以迷人的微笑和致命的言语让对手进退失据。但每一个与她对视过的人，都忘不了她那双红瞳深处，如同万年寒冰般的冷酷与仇恨。她对阿德莱希帝国的敌意，早已超越了国仇，成为了一种刻骨的、私人的执念。她时刻关注着那个通过血腥手段登上皇位的薇莉安公主，从对方身上，她嗅到了与当年那些将军们同源的、混乱而残暴的气息。\n对希露而言，这个世界是一盘巨大的棋局，而她的人生只剩下一个目标：不惜一切代价，将“阿德莱希”这枚棋子，从棋盘上彻底抹去。§!"
