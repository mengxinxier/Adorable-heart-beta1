EWW_gblss: "哥布林杀手"
EWW_gblss_desc: "§L他从不轻视任何一个弱小的敌人，精于利用一切可利用的环境、工具和陷阱，以最务实、最冷酷、也最高效的方式达成目的。他的战术手册里没有英雄史诗，只有沾满泥土与鲜血的生存法则。§!"
EWW_fxyx: "风行游侠"
EWW_fxyx_desc: "§L拥有两千年阅历的她，是森林与风的女儿。她的箭矢能追上飞鸟，她的脚步能踏过无痕的积雪。作为一名高傲的妖精，她最初鄙夷那些凡人眼中“不体面”的战术，但残酷的冒险让她明白了生存的真谛。§!"
EWW_cbzx: "慈悲之心"
EWW_cbzx_desc: "§L她或许是队伍中最弱小的一员，却是所有人赖以维系的基石。从最初那个在黑暗中瑟瑟发抖的少女，到如今能为同伴筑起神圣壁垒的坚定神官，她用自己的成长证明，守护的力量，远比毁灭更坚韧。§!"
#叶落边境特质
