####国策####
#风声河谷政治线
EWW_ltqe: "聆听千耳之森"
EWW_ltqe_desc: "繁荣的第一步，在于理解何为匮乏。薇雅派遣出她最敏锐的信使，她们的任务是深入联盟的每一个角落，去记录。记录叶落边境的霜冻有多长，暮色林渊的矿脉有多深，希尔瓦尼亚的粮仓有多满。她将这些零散的情报，汇集成一张描绘着整个联盟苦乐不均的真实地图。这张地图将成为她所有谋划的起点；一位真正的编织者，必须先认清每一根丝线的质地与韧性。"

EWW_gzxy: "古枝协约"
EWW_gzxy_desc: "联盟长久以来的分歧，源于各自为政的古老传统。薇雅召集了所有部族的律法与贸易代表，她提议了一份名为“古枝协约”的框架。协约不去触碰各族神圣的内部律法，致力于为联盟内部的贸易与纷争，设立一个所有人都认可的共同标准。从统一的度量衡，到跨部族商队的保护条例，再到资源争端的仲裁庭。她正为联盟这棵古树，修剪掉那些彼此纠缠、阻碍生长的杂枝，让养分能更顺畅地流向每一个角落。"

EWW_xgzz: "星光与种籽之道"
EWW_xgzz_desc: "孤立的智慧终将枯萎，独占的财富无法生长。薇雅推动了一项前所未有的交流计划。曦光圣域的学者，将被邀请到叶落边境，指导那里的农民如何利用光魔法改良作物；希尔瓦尼亚的工匠，将获得暮色林渊出产的稀有矿石，以锻造更精良的工具。知识与资源，将沿着一条条新开辟的星光与种籽之道，在联盟内部自由地流动。这致力于交换物资，更是在交换彼此的未来。"

EWW_ljkd: "我们的四季"
EWW_ljkd_desc: "真正的繁荣，意味着没有人会被落下。薇雅深知，联盟内部巨大的贫富差距，是分裂最终的根源。她设立了一个名为“四季盟约”的常设机构，由所有部族共同出资。富庶的城邦需要为边境的防御工事提供资金，拥有丰饶土地的部族则有义务为矿产区的同胞支援粮食。这份投入是一份投资——投资于联盟每一个成员的存续与尊严。当风暴来临时，一棵树最脆弱的部分，决定了整片森林的命运。"

EWW_drmy: "点燃盟约之心火"
EWW_drmy_desc: "当贸易的路线被打通，当知识的壁垒被拆除，当互助的机制被建立，一种全新的情感在联盟中悄然滋生。它超越了古老的部族认同，成为了一种更宏大的、属于所有艾尔芙的我们。薇雅抓住这个时机，正式提议重组“盟约议会”。新的议会将是为共同未来而思考的心脏。这团由所有部族共同点燃的心火，将成为联盟永不熄灭的灵魂。"

EWW_pxjx: "为将至之季节谱写交响"
EWW_pxjx_desc: "薇雅最终的杰作，是一套可以自我呼吸、自我调节的系统。联盟的繁荣，已不再需要一位“编织者”去刻意维持。丰收之地的余粮会自动流向孤冷的边境，智慧的火花会在需要她的工坊中点燃。每一个部族都像交响乐中独一无二的乐器，她们或许音色各异，节奏不同，但在“盟约”这本共同的乐谱指引下，她们共同奏响了一曲……关于和平、繁荣与无尽未来的华美乐章。"
#通用经济线
ELF_bzjs: "编织金色的丝线"
ELF_bzjs_desc: "在风语者议会的茶会上，一场看似不经意的闲谈，便可能促成一笔横跨山脉的贸易。薇雅·叶奈的微笑是联盟中最昂贵的货币，她的承诺则是最坚实的信用。她派遣出最能言善辩的使者，她们不携带刀剑，只带着风声河谷的特产与足以打动顽石的言辞。她们将联盟内部那些孤立的经济命脉，如编织蕾丝般，一根根巧妙地联结在一起，让财富如溪流般在盟约的土地上自由流淌。"

ELF_bsxy: "在灰烬上播撒新芽"
ELF_bsxy_desc: "战争带走了一切，却夺不走土地的记忆。莉芙·叶奈带领着她的族人，回到那片被称为“坟场”的家园。她们没有时间哀悼，因为生者需要屋檐，冬天需要柴火。她们用残破的武器当作农具，在被战火烧焦的土地上，重新开垦出第一片田地；她们收集每一块尚能使用的砖石，为孤儿们搭建起第一座能抵御寒风的屋舍。这并非宏伟的建设，这只是……一群不肯离去的孩子，在为她们的母亲，缝补破碎的衣裳。"

ELF_zlgf: "让晨光照耀工坊"
ELF_zlgf_desc: "晨光教会的信徒相信，每一次创造，都是对曦光的一次赞美。奈瑞丝·光辉下达了新的神谕：圣域的智慧不应只封存于神殿的卷宗里。她鼓励最聪慧的学者与最灵巧的工匠走出圣堂，将那些古老的符文与精密的技艺，应用到凡人的器物之上。于是，老旧的织机开始自行运转，冰冷的熔炉燃起了魔力的火焰。知识的微光，正悄然演变成一场席卷生产方式的、安静的革命。"

ELF_shms: "收获暮色的馈赠"
ELF_shms_desc: "在暮色林渊深处，那些被光明遗忘的角落，往往沉睡着最稀有的宝藏。瑟兰·暮林派遣出最沉默的勘探者，她们不追寻阳光下的金矿，而是潜入地底的幽深洞穴，追寻那些能吸收影子的金属与能凝结寂静的水晶。这些凡人眼中的“不祥之物”，在暮影密会的工匠手中，却能被打造成最锋利的匕首与最坚韧的甲胄。黑暗，并非虚无，它只是……另一种形式的富饶。"

ELF_ltgy: "聆听潮汐的歌谣"
ELF_lgty_desc: "无垠之海没有多少矿脉，也没有多少农田，但“海”本身，就是海洋的女儿们最慷慨的母亲。当神谕者妮拉·露米轻声吟唱古老的歌谣时，迷雾会为她凝聚出最纯净的露水，潮汐会带来外界沉船上遗落的奇珍。她们将这些迷雾的“眼泪”与潮汐的“赠礼”收集起来，通过秘密的航路，与外界的商人交换她们所需的一切。这并非贸易，这是一场……与神秘的自然之灵共同吟唱的、关于给予和获取的古老歌谣。"
ELF_mwqy: "迷雾契约"

ELF_pxlf: "以金钱谱写律法 "
ELF_pxlf_desc: "在希露·奥蕾希亚的治下，城邦的心跳不再是自然的脉搏，而是铸币厂里永不停歇的锤音。她坚信，稳固的秩序源于明确的契约，而最有力的契约，是用黄金签署的。她颁布了新的商法，吸引着来自大陆各处的财富与人才。一座座高耸的工坊拔地而起，它们冰冷的轮廓遮蔽了古老的森林，却也为城邦带来了足以对抗任何敌人的、钢铁般的底气。在这里，荣耀或许无法永存，但财富可以。"
#通用军事线
ELF_ygxy: "月光下的弦音"
ELF_ygxy_desc: "在寂静的林间空地上，年轻的射手们并非对着死板的靶子练习。她们的导师所教导的，是聆听。聆听月光穿过枝叶的簌簌声，感受风拂过箭羽时的低语。当射手的心跳与夜的脉搏合而为一，当她的呼吸与林间的风融为一体时，射出的那一箭，便不再是凡铁，而是月光本身的一缕回响。这并非杀戮的技艺，而是一首献给宁静的诗篇，只是诗的结尾，恰好是敌人的心脏。"

ELF_sldy: "森林的低语"
ELF_sldy_desc: "对于妖精而言，森林并非是需要被征服的战场，而是血脉相连的盟友。古老的教条指引着她们，去学习森林的语言。每一棵树都可能成为隐秘的哨塔，每一条溪流都吟唱着敌人的踪迹。她们的斥候从不依赖地图，因为大地本身就是她们的向导。当一支军队不再是行走于林间，而是成为了森林本身的一部分时，任何入侵者都将迷失在永恒的绿意迷宫之中，直至被悄然吞噬。"

ELF_rfbl: "如风的步履"
ELF_rfbl_desc: "战争，在古老的妖精看来，更像是一场庄严的舞蹈。笨拙的冲撞与野蛮的对垒，是对战场本身的亵渎。真正的战士，其步履应如风一般轻盈，其阵型应如水一般流动。她们从不试图撞碎敌人的盾墙，而是优雅地绕过，从敌人最意想不到的侧翼，献上致命的一吻。战场并非棋盘，而是一方舞台，唯有最优雅的舞者，方能赢得最后的掌声。"

ELF_glsb: "古老林地的哨兵"
ELF_glsb_desc: "在每一片妖精的领地深处，都有一片不容侵犯的圣地。古老的誓约将哨兵们的灵魂与这片土地紧紧相连。她们的职责并非进攻，而是守护。她们能在一块岩石后静待数十年，任凭四季更迭、藤蔓爬上肩头，只为等待那个可能会，也可能不会到来的入侵者。对哨兵而言，时间不是敌人，而是战友。她们的坚韧，便是家园最古老、也最坚固的城墙。"

ELF_xczj: "星辰织就的战网"
ELF_xczj_desc: "一位孤勇的英雄或许能斩落巨龙，但一场战争的胜利，却需要将所有星辰的光芒汇聚在一起。星语者们在战前彻夜不眠，观测着星辰的轨迹，为大军指引出最吉利的时机与方向。战场上，每一个小队的行动都与其他小队遥相呼应，如同星辰之间无形的引力。她们的军阵并非钢铁的城墙，而是一张由默契与信任织就的、笼罩整个战场的星网。"

ELF_wssl: "无声的狩猎"
ELF_wssl_desc: "当妖精真正投入一场关乎存亡的战争时，战场上将不会有震天的战吼与轰鸣。那将是一场……无声的狩猎。整支军队都将化身为一个耐心的猎人，悄无声息地追踪着猎物的气息，精准地切割它的肌腱，从容地等待它失血倒地。她们的每一次攻击都直指要害，每一次转移都悄无声息。当敌人终于意识到自己已是猎物时，往往已听不见猎人最后的脚步声了。"
