    NGD_adopt_a_radical_platform: "采用激进纲领"
    NGD_adopt_a_radical_platform_desc: "已经无法再忍受了，过去的我们迫于远洋所面临的危险环境，认为社会主义革命暂时没有生根发芽的土壤，但现如今，在北美归于一面旗帜之下之后，我们终于有了继续前进的条件，我们有能力，有勇气采取更为激进的纲领，让我们向着共产主义的美好梦想前进"
    NGD_missions_sent_to_the_Soviet_Union: "派往苏联的使团"
    NGD_missions_sent_to_the_Soviet_Union_desc: "苏联是现在世界上最早实施社会主义制度的国家，并且其社会主义实践取得了可见的惊人成就，无论是出于与社会主义同志联络感情还是出于向社会主义道路先行者学习的目的，派遣一支使团前往苏联都是有必要的"
    NGD_CMEA_observer_country: "经互会观察员国"
    NGD_CMEA_observer_country_desc: "经互会是苏联对于社会主义道路下经济发展方式的一个重要实践，虽然因为长期处于资本主义制度下的经济体制使我们无法立刻拥抱经互会，但我们可以先成为其观察员国中的一个"
    NGD_revolutionary_democracy: "革命民主"
    NGD_revolutionary_democracy_desc: "总是有反动派宣称，社会主义政体意味着极权主义，要我们来说，这纯属污蔑，革命者们才是民主的真正代表，我们将要让学生、工人、农民、士兵的代表们走进我们的议会大门，而不是让议会同以往一样成为资本家们的俱乐部"
