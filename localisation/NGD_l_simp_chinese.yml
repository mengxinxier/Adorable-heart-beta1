#### - 远洋国策 - ####
  ### - 黑色星期二 - ###
    NGD_raise_the_tower: "起朱楼"
    NGD_raise_the_tower_desc: "在过去的数百年间，伴随着金矿的发现和圣杯的巨额投资，我们远洋获得了飞速的发展，我们将这一时期称作‘咆哮年代’，随着咆哮年代的经久不衰，我们看着过去的矿业小镇，偏远落后的小渔村消失不见，摩登大楼拔地而起，我们相信，咆哮年代永不结束！"
    NGD_banquet_guests: "宴宾客"
    NGD_banquet_guests_desc: "让我们宴请四方宾客！欣欣向荣的远洋共和国与我们如火箭般飞速增长的经济让我们有着足够的自信去邀请全世界的投资者，让我们向全世界的所有资本敞开大门！让我们和善的朋友们走进我们的宴会厅，让我们在合同签订的晚宴上共同举起酒杯！"
    NGD_tower_collapses: "见楼塌"
    NGD_tower_collapses_desc: "完了，完了，全部都完了，我们的经济完全依赖于过去繁荣的市场和外国投资，但随着黑色星期二的到来，我们大厦的基石终于崩塌，我们只能这么看着过去庞大的体系在一瞬间倾倒，没有人知道明天该怎么办，现在，可能唯一明确要做的事是把高楼的天台都封住"

    NGD_emergency_intervention: "紧急干预"
    NGD_emergency_intervention_desc: "黑色星期二到来后的一连串影响已经完全证明了过去一贯自由放任政策的错误，我们已经无法承受再一次的失败了，过去一度被自由市场理念迷信者们弃如敝履的国家干涉政策将被我们再次拾起，以积极的财政政策和激进的行政手段来对现如今的经济形势进行紧急干预是此刻的应有之义"

    NGD_progressive_new_deal_of_Ganyu: "甘雨的进步新政"
    NGD_progressive_new_deal_of_Ganyu_desc: "在合作刚开始的时候，有很多守旧的民主党党员对把领导权交到这么一个有着浓重红色气息的政党手中持怀疑与警惕态度，然而首都暴乱让他们明白了这么一个事实：要么我们主动赋予穷人权利，要么穷人们会自己夺取权力。现在，让我们把领导对抗这次危机的权力交给这位在工人与农民中受到广泛欢迎且愿意走温和路线的年轻人甘雨，她坚信，我们的国家若要进步，发展的脚步不能落下任何一个人"
    NGD_industrial_production_adjustment: "工业生产调整"
    NGD_industrial_production_adjustment_desc: "过去毫无监管的工业运行模式已经被完全证明是一场灾难，远洋的工业生产体系必须得到调整，企业家们再也不能通过无限制的降低安全保障和压缩成本制造大量的廉价工业品来扰乱市场了，严格的监管将保证像这一次的产品泛滥而工人们却买不起自己制造的产品的情况不再发生"
    NGD_subsidise_farmers: "补贴农民"
    NGD_subsidise_farmers_desc: "农民们把农产品运到市场上的售价还抵不上把这些农产品运过去的运费，这导致他们宁愿把玉米和小麦拿去烧火都不愿意出售，，我们将给予农民一定量的补贴以保证农产品市场的稳定和农民的利益"
    NGD_reform_the_financial_industry: "改革金融业"
    NGD_reform_the_financial_industry_desc: "金融市场无序扩张的时代结束了！劣质的次级贷款，金库里有一块钱就敢贷一百块钱的银行，敢给一个项目上十八层叠加保险的保险公司，这些乱象就是本次经济危机的根源，自由市场的狂信徒们用自己的行为证明了自己和那些当人肉炸弹的宗教疯子没什么区别。哦不对，他们的危害还更高一些！金融业必须得到改革，金融监管体系将惩罚每一个敢于脱离管控的资本"
    NGD_revitalize_market_confidence: "重振市场信心"
    NGD_revitalize_market_confidence_desc: "现代市场是信用的魔术，信心才是现代金融最有价值的资产，我们必须重振投资者们对市场的信心，第一步就是开放银行取款，由央行买下那些不能倒下而又濒临破产的银行"

    NGD_protectionism_of_Ningguang: "凝光的保护主义"
    NGD_protectionism_of_Ningguang_desc: "毋庸置疑，政府需要改变，但太过剧烈的改变会彻底撕裂我们的政府，让野心家们有机可乘。因此，我们选择了相对稳重的凝光小姐，由她来决定我们下一步的经济发展方向。\n\n要想解决政府所面临的经济危机，我们就必须改变原有的经济政策，如果继续坚持原有的自由贸易政策，任由圣杯、法国等外来资本继续冲击我国市场，我们还是无法度过这场危机。与其照顾别人，不如优先管好自己。因此，凝光小姐已经决定，政府将转向贸易保护主义，在世界都处于危机的关头，我们要优先照顾本国的国民和资本。"
    NGD_reduce_imports: "减少进口"
    NGD_reduce_imports_desc: "在过去，远洋的繁荣岁月离不开圣杯资本的流动，离不开世界市场的有效运行。但在当下，世界市场反而变成了祸害，过多的进口挤占了我国资本的份额，值此危机期间，外部资本甚至还想将我国作为缓解危机的出口。因此，我们必须对这些外部资本加征高额关税，如果她们想再利用我们，就得先付出足够的代价。"
    NGD_work_relief: "以工代赈"
    NGD_work_relief_desc: "要解决危机，就需要恢复我国市场的活力。但在经济危机所带来的破坏下，大多数人都失去了工作，居无定所。她们一贫如洗，流落街头，如果百姓没有钱，我们的社会就不会稳定，市场的信心便无法恢复。因此，我们需要组织起一批公共建设活动，吸纳社会上的失业者参与建设，通过这种以工代赈的模式，在改善社会治安的过程中改善社会秩序，从而让资本放心，让经济更稳定。"
    NGD_clean_up_corruption: "清查腐败"
    NGD_clean_up_corruption_desc: "很明显，这次危机之所以能在我国造成如此之大的破坏，很重要的原因之一就是我国政府内部有些人贪赃枉法，为外国资本大开方便之门，却对我国资本处处刁难。如今要进一步挽回人心，我们正需要借她们人头一用，让公众看到我们的改革之心。"
    NGD_gradually_restore: "恢复运作"
    NGD_gradually_restore_desc: "在一系列紧急干预措施之后，我们的经济虽然不能一瞬间恢复黑色星期二之前的无尽繁荣，也总算是恢复了其正常运转，而我们陈旧的政治体制与政府机构也终于在这一次的紧急干预中重新运转起来"

    NGD_maintain_heading: "保持航向"
    NGD_maintain_heading_desc: ""

    NGD_be_in_the_same_boat: "同舟共济"
    NGD_be_in_the_same_boat_desc: "欧陆那边有个经济学家说的好，政府对市场的过度干预与管制会诞生极权主义独裁者。如果我们真的对市场大加干预，甚至不惜与那些自称是社会主义者的红色议员们妥协，那才是真正会让我们引以为傲的民主制度就此毁灭。防共高于一切，我们必须在保持原有的经济制度不变的基础上，对其进行小修小补，市场的力量自然会让我们度过这场危机。"
    NGD_small_scale_intervention: "小规模干预"
    NGD_small_scale_intervention_desc: "既然无法对原有经济政策作出改变，我们就要考虑优先稳定政府，避免那些红色议员、郑式权贵借机发难。由此，一部分共和党党内有识之士提出，应出让一部分利益，换取民主党在危机事务上的支持。毕竟利益还可以通过之后再争取，民主制度一旦崩塌，我们便一无所有。"
    NGD_crisis_response_alliance: "危机应对联盟"
    NGD_crisis_response_alliance_desc: "经济危机所引发的社会动乱给我们的治理和管辖增添了太多麻烦，而混乱又使得我们无法进行政府扩招，行政效率被迫下降。要进一步的解决问题，我们便需要和民主党进一步协商，拉拢她们中的一部分人，与我们共同组成危机应对方面的联盟，她们可能不喜欢我们，但她们更不会喜欢那些独裁者的。"
    NGD_unemployment_relief: "失业救济"
    NGD_unemployment_relief_desc: "在过去那个经济咆哮腾飞的时代，每个人哪怕不找什么工作，仅靠贷款都能得到好的生活。但在眼下危机到来之时，很多人都因付不起租金而流落街头，成为社会不稳定的因素。我们不会给她们还贷，但我们可以给她们一个机会，政府会给她们最基本的饮食，和一份长期政府公共事务的工作，相信有了出路，她们至少不会游荡作乱。"

    NGD_boat_cruises_alone: "孤舟游弋"
    NGD_boat_cruises_alone_desc: "很明显，民主党那帮野驴根本没法信任，她们表面上想和我们媾和度过危机，实际上恨不得利用危机把我们的人都踹下台，让她们的人取而代之。当前的局势证明仅靠我们便可以打垮那些极端势力，那我们更不需要和民主党进行什么联手了，我们自己就可以解决经济危机！"
    NGD_arrest_peculators: "逮捕投机商"
    NGD_arrest_peculators_desc: "虽然市场自己可以解决绝大多数的问题，但至少我们要给社会一个表面上的交代。当下，在大量过剩的产品被工厂、企业自主销毁以减产的过程中，仍存在着大量的投机商与外国资本勾结引入外国的非法产品销售，这些破坏市场自主性的人必须被抓起来，任何扰乱市场自救的人必须被绳之以法！"
    NGD_crush_radicals: "粉碎激进分子"
    NGD_crush_radicals_desc: "这次经济危机让很多人的野心暴露无余，那些所谓的红色议员、魔法天才，一个个都想着颠覆民主制度，以野蛮的共产主义取而代之，那百年前便退位的郑氏更是贼心不死，试图在现代复辟君主制。但她们不会再有机会了，我们将以比她们更激进的手段摧毁她们，为保卫民主与宪法，此乃必要之恶。"
    NGD_pacify_entrepreneurs: "安抚企业家"
    NGD_pacify_entrepreneurs_desc: "在我们摧毁那些社会激进分子的过程中，一些远道而来的企业家受到了惊吓，她们担心我们保卫民主的必要活动破坏了正常的营商环境，会让她们无法正常经营。对此，我们需要对这些人进行必要的安抚，只要她们愿意接受政府必要的法令管辖，乖乖交税，我们的经济中就有她们的一席之地。"
    NGD_believe_in_invisible_hand: "相信看不见的大手"
    NGD_believe_in_invisible_hand_desc: "如今，一种歪理邪说正在社会上传播，它以海对面的红色苏联作为范例，号称社会主义、计划经济是可以完全规避经济危机，实现社会繁荣的最终答案。对此我们表示:放屁！苏联只是个穷鬼国家，完全无法与我国这样物产丰富，经济繁荣的社会相比，正是百年以来的市场自由竞争才让我们获得了繁荣，我们要是真对着经济指手画脚，那只会让危机继续下去，只有相信市场自发纠正的力量，经济才能重获生机。"
    NGD_return_to_stability: "回归稳定"
    NGD_return_to_stability_desc: "我们的选择是正确的，随着外部危机的逐步减退，世界市场上的资本、资源重新开始流通，那些破坏者慢慢的都消失了，市场的秩序重新得到恢复，我们的产品也再次远销海外，民主制度证明了它的生命力。接下来，我们可以适当将精力转向别的领域了。"

    NGD_co_op_capitalism: "合作资本主义"
    NGD_co_op_capitalism_desc: "合作资本主义是一种不改变其资本主义剥削本质但远优于那些只知道一味剥削与压榨的资本主义形态，在这一理念下无产阶级虽然还是会被取走剩余价值，却至少能保证自己的生活水平，且其意见也能得到足够的聆听与反馈，虽然这与甘雨，与进步党所期望的那个社会主义的愿景相比仍显不足，但就远洋现在的情况来看，这已经是最好的选择了"
    NGD_support_trade_union_movement: "支持工会运动"
    NGD_support_trade_union_movement_desc: "工会一度被视为暴徒们的巢穴，显然这一理念是完全错误的，实践已经证明，要么你让工人们自己去组织工会，要么工人们背着你去组织共产党，无论是基于合作资本主义延续的必要，还是从更广大无产阶级利益的基础出发，工会运动都是有必要被鼓励的"
    NGD_rural_construction_movement: "乡村建设运动"
    NGD_rural_construction_movement_desc: "乡村，农民，这是一切的起点，是我们从遥远故乡携带而来的基因，我们必须面对这么一个事实，即在咆哮年代那奔腾的引擎声中，乡村被我们有意无意的忽视了，数以万计的农民，他们的声音被掩盖在金融市场的钟声之下，现在，让我们把眼睛从股票交易所的大荧幕挪回脚下的土地，让我们把资金从大城市流向乡村！"

    NGD_authoritarian_capitalism: "威权资本主义"
    NGD_authoritarian_capitalism_desc: "凝光大人长期的稳定执政已经证明了，民主并不意味着软弱，无能，放任。相反，当面临外资恶意竞争之时，需要政府及时站出来抵御恶意，当遭遇危机之时，需要有一个强力的行政将其纠正，永续的民主必须依靠强力的威权作为自己的砥柱，才能不畏风雨，迎击来自四面八方的挑战。"
    NGD_establish_industry_ministry: "设立工业部"
    NGD_establish_industry_ministry_desc: "随着我国疆土的进一步扩大，原有的国家经贸部门在管理庞大疆土上的众多工业，国家集团性的工业竞争也需要我们进一步统合全国的工业进行竞争和治理。因此，我们将把工业部门从经贸部门中拆分出来，作为专门的部门进行规划，这个新生的工业部将成为未来我国工业发展的心脏。"
    NGD_bureaucratic_system_reform: "官僚体制改革"
    NGD_bureaucratic_system_reform_desc: "虽然我们治下的人民从以前就是包罗万象，各族都可以在我们的统治下登堂入室，但当我们统治了一片广大的国土之后，我们便需要重新规划我们的官僚体制，要保证新制度下民主制度仍能够对地方的掌控，我们就需要对原有的官僚体制进行改革，让各民族的民众有同等的机会加入我们的政府，参与政治活动。老旧的官僚家族如果不能适应新血液的涌入，她们也该为新人让路了。"

    NGD_laissez_faire_capitalism: "自由资本主义"
    NGD_laissez_faire_capitalism_desc: "从漫长的历史来说，资本主义从来便是世界的主流，特别是我们这样坚持自由价值观的国家。强硬的政府只会损害个人权利，威胁我们的民主制度的生存。因此，我们不应该再多对市场、对社会作出更多的干预，而应该更多的保护个人权利、商业利益，当我们能够实现各级政府不受任何约束的自行其是的时候，我们就将成为人类最自然、最完美的政府"
    NGD_reduce_market_intervention: "减少市场干预"
    NGD_reduce_market_intervention_desc: "很多时候，正是政府对市场经济过多的指导才导致了市场秩序的混乱，特别是那些极权国家，她们对经济和市场的指指点点酿造了更多的经济灾难。我们不会像她们一样，我们不会去搞什么指令性经济，我们在经济中更多的是一个领路人，我们帮助所有人参与竞争，而非扼杀她们的能动性。"
    NGD_perfect_competition_market: "完全竞争市场"
    NGD_perfect_competition_market_desc: "社会的每个阶层都有其地位，她们也都有参与竞争的地位和职责，但很多时候她们都受限于认知无法认识到这一点。我们会帮她们一把，政府将进一步放松市场方面的管制，让我们的市场为所有人敞开大门，获得一个取得成功的机会。"

    NGD_creative_spirit: "创新精神"
    NGD_creative_spirit_desc: "未来的时代是科技的时代，是创新的时代，正是创新所诞生的坦克，飞机让我们的装备发生了天翻地覆的变化，让我们的士兵在战场上获得主动，让我们的民众生活不断提升。而创新靠的是人，我们治下的人口千千万，哪怕只有一半人发挥她们的头脑，我们就能取得巨大的进步。我们将把创新精神作为未来教育和科研的重点宣传对象，为我们的民众开智。"
    NGD_research_investment: "科研投资"
    NGD_research_investment_desc: ""
    NGD_Wanhu_plan: "万户计划"
    NGD_Wanhu_plan_desc: "在我们远方的故土上，曾经有个叫万户的人，他梦想着探索头顶的太空，便将自己绑在一座充满火箭的椅子上试图飞上太空。很多人由此嘲笑我们是妄想的野蛮人，但他却早几百年向我们证明了一个道理，火箭是未来发展的关键。\n\n随着我们科研的深入，我们的科学家发现，如果我们能铸造一座强大的弹壳，为其添加足够的燃料，我们便可以将其飞上太空，甚至打击远在大洋之外的敌人。我们必须掌控这样的力量，我们将以万户为名，开启对火箭的深入研究。"
    NGD_Miss_Qiu: "邱小姐"
    NGD_Miss_Qiu_desc: "我们的科学家在原子能行业的科研中取得了巨大进步，她们将众多理论转化为一项关键的武器研发：这项武器外表呈球型，充满着像女性头发一样的管线，但它蕴含着足以毁灭广大地区生灵的巨大威力，哪怕一支大法师军队施法都难以匹敌其力量，我们必须全力推进这项武器研发，为保密，这项武器的代号将被命名为：邱小姐。"
    NGD_Galaxy_One: "银河一号"
    NGD_Galaxy_One_desc: "计算机科技在战争中已经证明了它巨大的运算功能，这项科技所带来的运算能力在国家治理和科技发展方面也带来了巨大的力量。我们也必须拥有这样的科技。为此，政府将启动名为‘银河一号’的超级计算机研发项目，在未来的计算机科技竞争中，我们必须拥有一席之地。"

  ### - 黑色星期二 - ###

  ### - 军事线 - ###
    NGD_rearmament: "重整军备"
    NGD_rearmament_desc: "经济危机的硝烟已经散去，当我们望向东方，刺骨的寒意扑面而来：齐亚德在疯子、军头、保皇贵族、流氓、极权主义者之间反复无常，法兰西的女王为所谓的归乡大计无所不用其极，就连一向温文尔雅的精灵都不再友善。曾经的世界秩序保护者圣杯仍在经济危机的痛苦中挣扎，这一次已经没人能保护我们了。\n\n从现在开始，我们必须拿起武器，重新建立起一支强大的武装，才能抵御强敌，甚至完成我们百年前未能实现的天命"
    NGD_increase_military_funding: "增加军事拨款"
    NGD_increase_military_funding_desc: "无论是训练还是打仗，都需要足够的资金投入。在以前，我们的工作重心是发展经济，军事拨款只是打水漂。但在当今的局势下，政府将专门进行拨款，为军事建设提供足额的资金。"
    NGD_ensure_supply_chain: "确保供应链"
    NGD_ensure_supply_chain_desc: "百年以前，我们的扩张便有赖于圣杯王国强大的工业生产供应出来的武器，离了她们，我们的手工作坊完全无法匹敌幻想乡搬迁而来的机器工业。如今我们也学会了进行长期有效的机器生产，我们将重新开启军用工业建设，这一次，我们也要用强有力的武器工业产业链打败她们。"
    NGD_production_license_for_military_materials: "军用物资生产许可"
    NGD_production_license_for_military_materials_desc: "虽然我们有着智慧而勇敢的人民，但我们的国土相较齐亚德都有所不足，更不要说东方的法兰西和精灵了。要打败她们，我们需要更多更先进的武器，我们的一些民营企业完全可以弥补这方面的不足，我们将开启广泛的招投标活动，拥有足够生产能力的企业将获得军用物资生产许可，成为我们军事建设的重要补充。"
    NGD_army_research_institute: "陆军研究所"
    NGD_army_research_institute_desc: ""
    NGD_equipment_modernization: "装备现代化"
    NGD_equipment_modernization_desc: "自伟大战争结束以来，世界上的武器装备也在发生巨大的改变。从我们与外界的交流来看，单兵武器正在更多的转向远距离速射，火炮的威力逐步增大，特别是新生的装甲，正从铁皮棺材向移动堡垒的方向转向。我们必须追赶这些武器现代化的潮流，绝不能落后，否则，我们一定会吃败仗。"
    NGD_new_style_rifle: "新式步枪"
    NGD_new_style_rifle_desc: "作为每个士兵最简单能够获取到的武器，步枪是我军战斗力最基础的保证。过往的步枪单发且容易卡壳，经过我们科学家们系统的改进，我们的新式步枪不仅结构更加紧凑，更加安全，而且制造更加方便。我们必须立刻将它推广开来，人手一只。"
    NGD_individual_throwing_weapon: "单兵投掷物"
    NGD_individual_throwing_weapon_desc: "在那场伟大战争中，面对堑壕给予防守方的巨大优势， 进攻方往往以火炮和各种投掷物予以回应。而我们在追赶先进军事经验的过程中，也对此进行了相关学习，我们的军需官最近便对相关支援武器进行了改进，新式的支援武器设计将有效提升我军的作战灵活性，为我军的军事活动提供更大便利。"
    NGD_artillery_development: "火炮研发"
    NGD_artillery_development_desc: "自诞生以来，火炮便是战争中当之无愧的主角，从古至今，有了强大火炮部队的军队总能在战争中具备优势。战争将至，我们不能继续抱着那些老旧的，火力不足、机动有限的老炮，新一批的经费已经到位，我们将全力开展新式火炮的研发"
    NGD_trial_rocket_launcher: "试作火箭炮"
    NGD_trial_rocket_launcher_desc: "在研发长距离身管火炮的过程中，我们的科学家们结合古代战争的教训和国外炮兵的经验，提出了将火箭连发装置和齐射装置安装上长距离身管火炮上的构想，如果能够成功，我们将具备最强压制能力的火炮。那就没什么好说的了，先研发，再制造！"
    NGD_mobile_infantry: "机动步兵"
    NGD_mobile_infantry_desc: "我国境内存在大量荒漠和高山，东海岸更是广袤的大平原，防守压力极大的也让我军同时难以开展快速机动。因此，部队摩托化便成为关键，我们必须为她们提供一切足以进行高速运输和战斗的载具，哪怕是自行车。"
    NGD_tank_upgrade: "坦克升级"
    NGD_tank_upgrade_desc: "作为战争中突破的矛头，一辆坦克能够在战场上生活而越久，越能为敌人造成更大的威胁。经过我军实战经验的统计，新一代的我军坦克应当具备无线电联络，反坦克能力甚至是防敌人空军压制的实战能力，这些要求很多，我们必须根据不同的要求进行分门别类的升级换代，让我军装甲部队足以应付战场上的需要。"
    NGD_self_propelled_artillery: "自行火炮"
    NGD_self_propelled_artillery_desc: "经过长期战争的考验，很多士兵们都提出了一个要求：能否战场打到哪，火炮就炸到哪？在过去这很难，火炮部队难以机动，但当火炮与装甲结合到一起，那便一切皆有可能。新研发的自行火炮不仅具备相当的速度，火力上更是佼佼者，有了它，我们的便可以在任何战场上，绽放死亡的莲华。"
    NGD_steel_giant: "钢铁巨兽"
    NGD_steel_giant_desc: "经过长期的战争，我们的装甲兵也面对了世界上更多国家更复杂的装甲部队，她们的装甲部队有着更恐怖的火力、更深厚的防护，要打败她们，我们的装甲也必须进一步更新，做到火力更强，装甲更厚，速度更快。"
    NGD_start_mobilizing: "开始动员"
    NGD_start_mobilizing_desc: "虽然以一敌十、敌百往往被人称颂，但在如今的战争中，更多需要战线上有足够的人，有了足够的士兵，我们才能进可攻、退可守。战争已经逼近我们的国土，没有人能够置身事外。从今开始，政府将开始预备役和初步社会动员，满足条件的人员必须应召入伍，进行适应性的训练。战争不等人，我们没有更多时间了。"
    NGD_expand_conscription: "扩大征兵"
    NGD_expand_conscription_desc: "随着周边局势更加紧张，原有的动员机制所能提供的人员已经竭尽枯竭，我们需要进行进一步动员了。政府将开启下调征兵标准，更多人将收到征兵令，为了胜利，每个人都要时刻准备为祖国献身。"
    NGD_nationalization_of_military_enterprises: "军工企业国有化"
    NGD_nationalization_of_military_enterprises_desc: "为实现战争的胜利，我们需要竭尽一切产能，但总有一些掌握在私人手上的军工企业违反法令以谋取私利。这种资敌行为必须被粉碎，我们将对这些军工企业进行完全国有化，它们的产能将全面转向武器生产和制造，以弥补我们产能上的弱点。"
    NGD_enter_wartime_state: "进入战时状态"
    NGD_enter_wartime_state_desc: "我国的第二轮动员已经到达极限，现在要赢得战争的胜利，唯有全社会全方面的动员：配给制将被启用，能源和资源必须优先供给军事用途单位，一切建设都需要优先转入军队...为战争的胜利，全社会必须咬紧牙关，直至我们的勇士们自远方奏响凯歌归来。"

    NGD_office_of_strategic_services: "战略情报局"
    NGD_office_of_strategic_services_desc: "从古至今，战争的胜败都离不开情报的支持，特别是随着周边局势愈发紧张，通过战略情报获取对周边势力的先机是必须的。为此，我们将挑选陆军中最精明强干的孩子们组成战略情报局，作为我们隐形的屏障。"

    ### - 陆军 - ###
      NGD_military_reform: "军队改革"
      NGD_military_reform_desc: "我们的祖先虽然来自一个战争历史悠久的国家，但百年来的和平所带来的武备荒废让我们的军队严重退化，新式装备武装缺乏，指挥层对如今世界上战争发展认识不足，军队更是长期成为了达官贵人的儿女们镀金的场所。但如今战争将近，这样腐败的军队完全无法对抗周边的强敌。因此，我们必须开展全方面的军队改革，全方面改变我们的军队，才能有效对抗外敌。"
      NGD_war_department: "战争部门"
      NGD_war_department_desc: "随着战争的阴云逼近，我们必须随时做好对周边的进攻和防御准备，如果我们准备防守，我们必须做好所有的防御准备，如果我们主动出击，我们必须准备好对预先地点的进攻准备，甚至我们还需要准备好对远方的法国和精灵进行全面战争。因此，必须改组我们当前的指挥层，成立专门的战争部，做好指挥层面的一切准备。"
      NGD_large_scaleexercises: "组织大规模演习"
      NGD_large_scaleexercises_desc: "计划虽好，但很多时候计划也只是计划，很多军队改革中的问题和经验都需要从实战中获取，但我们目前极其缺乏战争经验，我们的军队也不支持我们进行主动战争。好在我们还有一批优秀的参谋人士，她们向我们提出了建议：利用起我国大规模的国土场地，组织起大规模的军事演习，在演习中获取经验，修正错误。"
      NGD_remeber_the_rocky: "勿忘落基山"
      NGD_remeber_the_rocky_desc: "百年前，我们的祖先在落基山东部败于流亡此地的法兰西人，虽然有缺失圣杯支持的缘故，但关键问题在于山地战争的困难:落基山不少地方易守难攻，部队难以展开，面对法兰西人的优势兵力我们寸步难行。如今我们还要面对法兰西人的后裔，这一次我们必须吸取教训，在山地战争中快速行军、以优势火力压倒敌方防线，在快速突破作战中越过高山，扫荡敌人。"
      NGD_frontline_preparedness: "前线备战"
      NGD_frontline_preparedness_desc: "我国国防的另一大问题，在于几个重要的都护府直接邻近国境线，如果敌人突然对我们发动进攻，我们完全没有战略空间进行后撤。因此，我们必须重启边境地区的军事设施建设，有效保障我们的地区防备，让我们的前线部队做好一切准备，做到进可攻，退可守。"
      NGD_renew_combat_theory: "更新作战理论"
      NGD_renew_combat_theory_desc: "虽然我们历史上的军事理论仍不过时，但在具体到细节上的战争方面，老祖宗的兵法还是难以适应当前的战争，而圣杯、幻想乡等国的军事理论正好可以补全这一点的缺陷。我们应当及时引入和结合中西方的军事作战理论，并落实到我们的军官团教育中，让我们的部队能够及时适应战争的需要。"
      NGD_enhance_professionalization: "加强职业化"
      NGD_enhance_professionalization_desc: "我们虽然有一直数量较多的综合性部队，但受军队经商、企业渗透军队等问题，很多军事主官更愿意接受她们的直属家族、贵人等的指挥，而不是接受统一调配。为此，我们必须剥离她们的指挥权，我们的部队必须成为一支职业性的军队，通过统一的军制实现军政分离，这将在提高军队战斗力的同时，有效降低军队参政的威胁。"
      NGD_quantity_wins: "数量制胜"
      NGD_quantity_wins_desc: "在保障军队质量的同时，我们也必须保证前线士兵的数量，新大陆地广人稀的地理状况导致战线极其广阔，我们会需要在广大的战线上尝试进行突破和拉锯，军队的数量也将会是战争胜利的重中之重。因此，面对多种族的大规模征兵体制必须得到落实，及时困难众多，我们也需要保证士兵的数量。"
      NGD_ensure_logistics_support: "确保后勤保障"
      NGD_ensure_logistics_support_desc: "虽说皇帝不差饿兵，但我们的故国大明便亡于此，明末边军在后勤上缺衣少食，军饷也难以发送，才导致大量的边军投降闯逆和满清，此应为戒。我们必须构建起后勤兵体制，有效保障我们军队的后期，绝不能让南明故事再度重演。"
      NGD_modern_communications_technology: "现代通讯技术"
      NGD_modern_communications_technology_desc: "在参考伟大战争的经验和演习活动的教训过程中，对前线战场的评估成为了一项难题。我们的士兵在面临敌方冲击的时候总会出现情报传递的缺少，我们的指挥层在交战中缺少的一项情报便可能造成战争结果千差万别。所幸现代的通讯技术可以弥补这方面缺失，我们将尽可能在前线指挥部铺设电报系统，下发通讯设备，尽可能提高情报传递效率。"
      NGD_armor_tactics_research: "装甲战术研究"
      NGD_armor_tactics_research_desc: "近年以来，装甲战术正在全世界范围内传播，我们东方的法兰西人更是主动提出了不少新式的装甲突击战术。这项战术所提倡的装甲部队快速突破和合围战法正适合我们这样人口较少的国家。我们完全可以研究并参考她们的战术，青出于蓝而胜于蓝。"
      NGD_battlefield_queen: "战场皇后"
      NGD_battlefield_queen_desc: "要问在战场上什么样的武器所处可见，那就是步枪。哪怕各种各样的武器再多，我们也需要手持步枪的士兵去赢得胜利。因此，我们必须进一步完善我们的步枪，并推动我们的士兵在射击、维护、刺杀等多方面的步枪使用能力上的提升。"
      NGD_god_of_war: "战争之神"
      NGD_god_of_war_desc: "与我们隔海相望的苏联有个人说过一句话，火炮是战争之神，此话不假。在伟大战争中，哪一方拥有强大的炮兵火力，哪一方便能在进攻和防御中取得优势，我们的山地作战离不开专门的山炮支援，进攻和防守的弹幕覆盖都需要强大的火力保障。因此，我们需要建设一支强有力的炮兵部队，时刻为我们的部队提供最强大的火力支援。"
      NGD_king_of_land_combat: "陆战之王"
      NGD_king_of_land_combat_desc: "如果说在这一个时代，什么样的武器能够成为当之无愧的王者，那就是装甲。摩托可以进行有效的运输和侦察，机械化装备可以让我们的步兵在运输中保障对敌攻势，多样的装甲更是让我们具备了强有力的进攻势头，把握住这些武器，我们便拥有了未来。加速生产吧，我们绝不能落于人后。"
      NGD_field_engineer_battalion: "野战工兵营"
      NGD_field_engineer_battalion_desc: "我们的部队走遍四方，各种地形上的攻坚都成为我们所面临的困难，要打破窘境，最好的方法便是具备比敌人更强大的土工作业能力。传统的工兵连仅能适应在城市等地形的作战，我们有必要对其进行多种情况培训，建成一支更深度的野战工兵营，这将提高我们学习的广度，但一旦成功，我们的部队必能跋山涉水，如履平地"
      NGD_security_force: "治安部队"
      NGD_security_force_desc: "随着我国控制下的国土面积增多，治安战也成为了一个新课题，我们的很多反对者，抵抗者总是试图通过所谓的游击战，摧毁我们占领区的仓储和设备，试图拖垮我们的士兵。她们不值得我们专门用主力来镇压她们，专业的治安宪兵队培训将登上日程，这些训练有素的精锐将成为那些反抗者们永远的梦魇。"
      NGD_tank_destroyer: "坦克歼击车"
      NGD_tank_destroyer_desc: "在当今世界的战争局势下，装甲科技正以日新月异的速度发展，越来越厚的装甲已难以通过普通的榴弹炮和加农炮进行摧毁，具备更厚装甲的坦克部队需要更专业的装甲进行反制。因此，我们必须研制更先进、更具普及性的坦克歼击车，将其及时生产、武装到我们的装甲部队中，这世上只有我们打穿敌人的份，没有她们防的住我们的可能。"
    ### - 陆军 - ###

  	### - 海军 - ###
      NGD_upgrade_shipyard: "升级造船厂"
      NGD_Pacific_link: "太平洋纽带"
      NGD_Southeast_Asian_outpost: "东南亚前哨站"
      NGD_expel_the_waves: "驱逐浪花"
      NGD_dive_into_deep_blue: "潜入深蓝"
      NGD_battle_Pacific: "决战大洋"
      NGD_rush_onto_mudflat: "冲上滩涂"
      NGD_leap_over_the_waves: "飞跃波涛"
      NGD_upgrade_shipyard_desc: "摆脱经济危机后，我国与外界的海上经贸往来得以恢复，一些国家由于经济上的困难，正迫切出售她们的造船业设备以求自保，这正好为我们所用，以提升我们原有的造船厂改装和产出能力。"
      NGD_Pacific_link_desc: "一直以来，我国在太平洋方面都保持着与亚洲长期的海上经贸，亚太也是我们的利益重心。因此，有必要进一步扩张我国西部海上岛屿的军事存在，以保障我们在太平洋上的海上利益。"
      NGD_Southeast_Asian_outpost_desc: "南洋总督府一直是我国与华夏之间保障来往的关键控制支点，也是我国向东南亚扩展影响力的关键。但却长期面临北方樱花和南方圣杯势力的虎视眈眈，一旦遭遇海上入侵，我们的海军是无法立刻对其进行支援的。因此，必须进一步完善当地海上咽喉的防御能力，我们需要她们能够撑到我们的海军远渡重洋提供支援。"
      NGD_expel_the_waves_desc: "海上作战需要多支庞大的船队，而这样的大船队必须拥有足够的驱逐舰和巡洋舰队列。驱逐舰是海上作战的多面手，巡洋舰更是海上主力的关键屏卫，有了足够的海上屏卫力量，我们才能支撑起对整个太平洋的控制。"
      NGD_dive_into_deep_blue_desc: "仅仅防御敌人的海上进攻是不够的，我们也需要具备反向入侵敌方航线甚至是诱导敌方海军决战的力量，而潜艇能够做到这一点。这项隐形的海狼可以轻松绕道敌人的运输线上进行打击，让敌人疲于奔命，要么主动与我们决战，要么在骚扰中被我们累死，饿死。"
      NGD_battle_Pacific_desc: "太平洋是我们的，我们不仅需要保障航线安全，还要具备强大的主力舰队。如果说屏卫舰是海上之盾，那么主力舰就是海上重锤，她们将以无情的火力和强大的防护粉碎敌人的一切海军力量，并且为我们的勇士们提供足够的海上支援，当她们的火力在敌人的沿海城市落下的时候，任何狂妄自大的家伙都会为与我们为敌而后悔不已。"
      NGD_rush_onto_mudflat_desc: "要控制大洋，控制关键岛屿必不可少。有了关键的岛屿，我们的船只才有关键支点，我们的陆军才不用远渡千里进行登陆作战。但各类演习和实战都证明了我们不能靠单纯的陆军进行登岛和冲摊。因此，有必要建立一支专业化的海军陆战队，通过专门的课程训练，保障我们能够顺利攻克任何敌人建立的海上防线。"
      NGD_leap_over_the_waves_desc: "太平洋很大，也很安静，相较风暴频发的大西洋，在这片大洋上很多时候都是风浪日清，这也让海军航空兵能够执行长期的空中任务。为此，我们有必要学习圣杯的经验，建立一支航空母舰编队以进行海上作战，优秀的海军航空兵将能够在航母上起飞，在千里之外便能摧毁敌船，完成轰炸。"
  	### - 海军 - ###

  	### - 空军 - ###
      NGD_establish_air_force: "创设空军"
      NGD_air_force_academy: "航空军校"
      NGD_defend_airspace: "防卫领空"
      NGD_new_type_aircraft: "新式飞机"
      NGD_air_hunter: "空中猎手"
      NGD_close_air_reaper: "近地死神"
      NGD_flame_express: "火焰速递"
      NGD_dancing_sword: "舞落之剑"
      NGD_establish_air_force_desc: "虽然我们很早的便接触到飞行器的发明和使用，但在过去和平之日，我们并无空军建设的必要。但在接触外界军事思想的过程中，空军将是保卫陆军的关键所在，没有空军，我们的陆军便会遭遇过多损失。因此。我们必须从无到有，建设一支有力的空军"
      NGD_air_force_academy_desc: "任何军队建设都离不开人，空军也是。陆军需要专门的学校来培训士官，进行训练，讲述兵法，空军也一样。有了好的航空军校，我们便能够短期内积攒飞行经验、实验飞行战术，它会是无数空军将士从无到有的第一步。"
      NGD_defend_airspace_desc: "在建设本国空军的过程中，我们对空军战术认识的深入也让我们思索出一些对敌方空军的反制套路：优先保护民用、军用工业园区，建立复合型的防空火力网，必要的地上地下掩体...能进能退，能攻能守，我们才能有效保卫我们的领空。"
      NGD_new_type_aircraft_desc: "我国我军控制下的广袤疆土为空军提出了一个新难题，广大的疆土让原有的战斗机、支援机都难以完全效率进行作战，很多地方的支援不利便决定了一场战役的胜败。因此，我们需要进一步对空军设计进行招标和规划，建设能够适应广袤国土作战和的新型飞机。满足我国从国土防卫到跨地区作战的需要。"
      NGD_air_hunter_desc: "空战的胜利往往在于摧毁敌人升空的战斗机，一支没有战斗机的空军就是待宰羔羊。而要在空中火力上取得优势，最好的办法便是用更好的发动机，上更大口径的空中武器，让敌人的空军见面就被摧毁，变成被打靶的烤火鸡。"
      NGD_close_air_reaper_desc: "我们新型的飞机在消灭敌方空军之余，也要及时为陆军进行支援，战争决胜还是需要陆军的推进，我军的装甲战术研究结果也认为空军应为陆军推进提供支援。在闪电突击中，只要有足够的空军进行支援，任何可能的敌方支援都会遭遇死从天降，不得不放慢速度，而我们便可以从容不迫，及时完成战场上的任何任务。"
      NGD_flame_express_desc: "新型大飞机不仅可以让我们消灭前线的敌人，也能让我们消灭后方的敌人。很多时候，那些敌国的狂热民众之所以呼唤战争，仅仅是因为没有见识到战争的威力，认为炸弹不会落到她们头上。但当我们的大飞机飞跃长空到达她们头上，为她们送来一些温暖的‘火焰速递’的时候，她们的战争信心，战争热情和战争生产能力都将被我们一并摧毁。"
      NGD_dancing_sword_desc: "在伟大战争中，德意志、圣杯、幻想乡等大战参与者都不约而同的使用过空降兵进行破袭和侦察，在新大陆上，齐亚德的军官也提出过将一整个步兵师投放后方进行进攻的策略。随着运输机和降落伞的发展，我们确实可以完成这一目标。我们会挑选最优秀的士兵组成专门的空降兵师，这些部队将是我们最锋利的剑，从天而降，将敌人的薄弱之地重重劈开，成为我军胜利的决定因素。"
