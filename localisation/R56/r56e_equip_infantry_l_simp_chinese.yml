l_simp_chinese:
 infantry_equipment:0 "步兵装备"
 infantry_equipment_short:0 "步兵装备"
 infantry_equipment_desc:0 "个人和部队使用的步兵武器，以及士兵所需的其他装备。"
 infantry_equipment_0:0 "30年轻武器"
 infantry_equipment_0_short:0 "30年轻武器"
 infantry_equipment_0_desc:0 "步兵部队使用的武器以及士兵所需的其他各种装备。包括30年代的军服、军用步枪、轻机枪、手枪、进攻性和防御性手榴弹以及枪榴弹。"
 infantry_equipment_1:0 "36年轻武器"
 infantry_equipment_1_short:0 "36年轻武器"
 infantry_equipment_1_desc:0 "步兵部队使用的武器以及士兵所需的其他各种装备。包括36年的军服、军用步枪、轻机枪、手枪、进攻性和防御性手榴弹以及枪榴弹。"
 infantry_equipment_2:0 "39年轻武器"
 infantry_equipment_2_short:0 "39年轻武器"
 infantry_equipment_2_desc:0 "用于步兵部队使用的武器以及士兵所需的其他各种装备。包括39年的军服、军用步枪、轻机枪、手枪、进攻性和防御性手榴弹，枪榴弹和反坦克手榴弹。"
 infantry_equipment_3:0 "42年轻武器"
 infantry_equipment_3_short:0 "42年轻武器"
 infantry_equipment_3_desc:0 "用于步兵部队使用的武器以及士兵所需的其他各种装备。包括42年的军服、军用步枪、轻机枪、手枪、进攻性和防御性手榴弹，枪榴弹和反坦克手榴弹。"
 infantry_equipment_x:0 "45年轻武器"
 infantry_equipment_x_short:0 "45年轻武器"
 infantry_equipment_x_desc:0 "个人和部队使用的步兵武器，以及士兵所需的其他装备。包括45年制式服装，半自动步枪/卡宾枪，冲锋枪，手枪，进攻和防御手榴弹以及反坦克手榴弹。"
 infantry_equipment_x_2:0 "48年轻武器"
 infantry_equipment_x_2_short:0 "48年轻武器"
 infantry_equipment_x_2_desc:0 "个人和部队使用的步兵武器，以及士兵所需的其他装备。由1948年制式服装，服役中的突击步枪，轻机枪，手枪，进攻和防御手榴弹以及反坦克手榴弹/弹药组成。"
 infantry_equipment_x_3:0 "52年轻武器"
 infantry_equipment_x_3_short:0 "52年轻武器"
 infantry_equipment_x_3_desc:0 "个人和部队使用的步兵武器，以及士兵所需的其他装备。由1950年制式服装，服役中的突击步枪，轻机枪，手枪，进攻和防御手榴弹以及反坦克手榴弹/弹药组成。"
 infantry_weapons2:0 "大威力步枪弹"
 infantry_weapons2_desc:0 "使用大威力步枪弹的步枪具有强劲的杀伤能力和更远的射程，使得仅靠步兵武器就能实现更具突破性的有效进攻"
 improved_infantry_weapons_2:0 "全威力步枪弹"
 improved_infantry_weapons_2_desc:0 "全威力步枪弹是步枪弹药技术里的巅峰之作，可为步兵提供最大的杀伤力和最远的有效射程，这能使步兵发挥出最佳的作战表现。"
 advanced_infantry_weapons2:0 "轻量化步枪弹"
 advanced_infantry_weapons2_desc:0 "得利于制造技术的发展，轻量化的步枪弹减轻了步兵的重量负担，能在不影响火力的情况下增加了士兵的机动性"
 advanced_infantry_weapons_a:0 "中间威力步枪弹"
 advanced_infantry_weapons_a_desc:0 "中间威力步枪弹兼顾了威力和功能性，是步枪弹药中可靠且多变的选择，适用于各种各样的战斗环境。"
 advanced_infantry_weapons_c:0 "突击步枪弹"
 advanced_infantry_weapons_c_desc:0 "突击步枪弹是专为近距离作战而设计的，突击步枪弹减轻了步枪的后坐力，使轻武器能在惨烈的步战中表现出色"
 advanced_infantry_weapons_d:0 "通用步枪弹"
 advanced_infantry_weapons_d_desc:0 "让各种步枪使用通用的步枪弹药，可以减轻后勤工作负担，简化弹药供应，对于军队来说也可以让发挥更多样的作用成为一种可能。"
 anti_tank_infantry_weapons:0 "便携式反坦克武器"
 r56_anti_tank_kit:0 "野战反坦克装备"
 r56_anti_tank_kit_desc:0 "通过向我们小队的步兵装备箱里提供野战手册和其他一些小物品。士兵可以使用现有的步兵设备在野外制定反车辆应对计划。在紧要关头提高我们的士兵对敌方车辆的进攻效率。尽管这种被动措施不能替代对敌方车辆采取的主动措施。"
 infantry_at:0 "反坦克步枪"
 infantry_at_short:0 "反坦克步枪"
 infantry_at_desc:0 "为专门从事反坦克的部队提供武器"
