###  主要目标
  world_revolution_goal_name: "世界革命"
  world_revolution_goal_desc: "全世界的无产者联合起来！我们失去的只是枷锁，而得到的是整个世界！\n\n我们任务是团结§t工人阶级§!和§t劳动群众§!，推翻§C资本主义§!和§g帝国主义§!统治，确立世界范围的§t无产阶级专政§!，建立§R世界苏维埃社会主义共和国联盟§!，彻底消灭阶级，实现§t社会主义§!和§t共产主义§!。"
  world_revolution_stage_01: "除了锁链，我们已一无所失！"
  world_revolution_stage_02: "踏过旧世界的尸骸，前进！"
  world_revolution_stage_03: "把背交予同志，把心掏给人民！"
  world_revolution_stage_04: "赤色的星球，我们的故乡。"

  safeguard_revolutionary_spark_goal_name: "保存革命火种"
  safeguard_revolutionary_spark_goal_desc: "新生的革命政权还没有脱离危险的境地，我们必须优先考虑保存革命火种，再行输出革命之事。"

###长期
  Eliminate_Fascism_goal_name: "消灭法西斯主义"
  Eliminate_Fascism_goal_desc: "作为试图以个人意志在全球范围内扩张独裁统治的存在，欧洲的法西斯主义者正愈发成为两个世界的共同敌人。在将苏维埃的赤旗插遍整个世界之前，有必要在世界范围内建立起广泛的反法西斯统一战线。并争取彻底清除法西斯主义毒瘤。"
  Eradicate_Capitalism_goal_name: "消灭资本主义"
  Eradicate_Capitalism_goal_desc: "资产阶级反动派对红色政权的敌视正愈发强烈。与其祈祷西方的资产阶级政府不至于与法西斯分子在某些事物上达成妥协。不如引导全世界的工人阶级取代他们加入正在愈演愈烈的世界反法西斯斗争中。世界苏维埃的起点也将以此为始。"

###中期
  Plant_the_Victory_Flag_in_Kiev_goal_name: "将胜利的旗帜插到基辅"
  Plant_the_Victory_Flag_in_Kiev_goal_desc: "统一全俄罗斯国土的时机正在成熟，一场席卷世界的经济危机，以及魔导国在中欧的肆意扩张正迫使以圣杯为首的旧协约国联盟从东欧事务中脱身。这是我们完成国家统一，并在东欧局势里扩张影响力的绝佳机会。"
  Aid_Chinas_Liberation_goal_name: "中国解放"
  Aid_Chinas_Liberation_goal_desc: "如今中国大陆正处于数个复杂斗争的杂糅之中——共和主义者与帝国效忠者的斗争；共产主义者与资产阶级反动派的斗争，以及中华民族与樱花侵略者之间的斗争。我们要做的，便是确保我们在东亚的社会主义工农盟友能够成为这些冲突的最终胜者。"
  Expel_DVL_goal_name: "驱逐魔导国"
  Expel_DVL_goal_desc: "魔导国政权已经明确了它的目的——将它不可理喻的怪物般的理念推行于四海。这并不是资本主义世界的内斗。而是整个人类世界所面临的巨大危机，正因于此，共产国际更应该倡导建立一个拥有前所未有之广度的统一战线。"

###短期
  Link_Chongqing_and_Moscow_goal_name: "串联重庆-莫斯科"
  Link_Chongqing_and_Moscow_goal_desc: "重庆的同志们已经在西北筑起了坚固的堡垒，但崇山峻岭阻断了国际主义的援助。为了确保东方革命的胜利，我们必须克服地理的诅咒。总书记已亲自批示：这不仅仅是一条铁路，更是一条‘红色动脉’。它将把乌拉尔的钢铁、魔法协会的技术结晶以及苏维埃的意志，源源不断地输送至中国抗战的大后方。当列车从莫斯科的红场呼啸而至重庆的山城，帝国主义封锁中国的企图将彻底化为泡影。"
  East_Africa_Liberation_goal_name: "自由东非"
  East_Africa_Liberation_goal_desc: "非洲之角正燃烧在战火之中。在那片古老的土地上，意大利的军团试图用毒气和钢铁重塑罗马的虚荣，而软弱的埃塞俄比亚王室还在试图维护他们腐朽的封建统辖。唯有‘自由阵线’的同志们，在夹缝中为了人民的生存而战。总书记在听取了关于东非局势的汇报后指出：‘我们不能让革命的火种熄灭在帝国主义的铁蹄和封建主义的长矛之间。’是时候向世界展示国际主义的义务了——我们要给予自由阵线全力的支持，将意大利人赶下海，把国王送进博物馆，建立一个真正属于人民的东非。"
  Free_LHS_goal_name: "莉兰迪亚解放"
  Free_LHS_goal_desc: "莉兰迪亚，这片横跨南美洲西海岸的广袤土地，正处于决定命运的时刻。尽管‘野火革命军’凭借人民的支持占据了南方的半壁江山，但盘踞在北部的腐朽王室仍在顽强抵抗。这是一个千载难逢的机会——在美洲大陆上建立我们第三国际的桥头堡。我们的任务是打破遥远的地理隔阂，建立一条穿越大洋、安全可靠的补给线。一旦莉兰迪亚获得解放，其丰富的战略资源将充实苏维埃的国库，而革命的旗帜将插在资本主义的‘后院’，对整个西半球的帝国主义势力构成永久的战略威胁。"


