####设定####
PAO_start_game_text: "§1描绘未来的童话§!"
PAO_his_page_01_title: "寂静的国度"
PAO_Country_History_Page_01:"在世界的尽头，存在着一个与生者国度截然不同的领域——永恒寂静的夜莺之国。作为冥界的中心，这里没有时间的流逝，也没有生命的喧嚣。公主莉莉安娜，是这个国度唯一的、绝对的统治者。在她的意志下，数以亿计的亡灵臣民，维持着一种完美的、亘古不变的秩序。这里的一切，都像一场华丽而孤独的默剧。直到那个不速之客的到来。一个名叫索拉娜的人类灵魂，带着生者世界所有的火焰与野心，闯入了这片寂静的土地。她的出现，像一颗流星，划破了夜莺之国万年不变的夜空，也成为了莉莉安娜黑白生命里，唯一的色彩。"
PAO_his_page_02_title: "心脏的裂痕"
PAO_Country_History_Page_02:"索拉娜的活力与她所描绘的阳光下的世界，深深地吸引了孤独的公主。莉莉安娜将她视为自己灵魂的另一半，向她毫无保留地，展示了夜莺之国所有的秘密与权能。她以为，她找到了那个能与自己共同分享这份永恒的伴侣。然而，她错了。索拉娜渴望的，并非分享这份寂静，而是占有那份足以颠覆世界的力量。在数千年一次的同调仪式上，就在莉莉安娜与国度核心“夜莺之心”共鸣、力量最契合也最脆弱的瞬间，她最信任的索拉娜，发动了背叛。她利用莉莉安娜的爱，从她的胸口，生生剥离了“夜莺之心”的权能，将那份力量，据为己有。"
PAO_his_page_03_title: "褪色的追寻"
PAO_Country_History_Page_03:"带着那份被盗走的力量，索拉娜头也不回地，离开了这片她早已厌倦的永恒黑夜，去往了生者的世界，并在南美大陆的莉兰迪亚，建立起了她自己的王国。她的背叛，没有让夜莺之国分崩离析，却在莉莉安娜的心中，留下了一道永远无法愈合的、巨大的空洞。她的王国不再完整，她的灵魂也是如此。失去了“夜莺之心”的她，力量正在缓慢地衰退，而更糟糕的是，索拉娜带走了一部分最精锐的亡灵军团，使得莉莉安娜对国度内部那些古老怨念的压制，第一次，出现了裂痕。如今，这位破碎的公主，正面临着双重的危机：国内，躁动的死者正威胁着她那完美的统治；而在国外，她那唯一的、也是最执着的追寻，才刚刚开始。她要找回的，不只是被夺走的力量，更是那个……曾为她带来唯一光芒的、不听话的爱人。"

PAO_route_guide_desc: "§1夜莺之国§!路线指南\n\n一、《§O骑士与她的心脏§!》\n§1“你想……看到这个故事，其中一个……或许，更温柔一点的结局吗？\n那么，请你……答应我。\n请你，在我去接她回家之前，先把我们的家里，打扫得干干净净。\n然后，你要快一点。\n一定要……赶在她那束……倔强的、温暖的火焰，被那些凡人彻底熄灭之前，来到她的身边。\n拜托你了。”§!\n§Y路线达成条件：§!\n1.在国内爆发的“§1镇魂之战§!”中，取得胜利。\n2.在@PAM§O索拉娜§!被§t@LHS野火革命军§!彻底击败之前，完成国策：“§Y就让我来接你回家！§!”"
