####国策####
#政治线国策
PAO_anjing: "嘘，安静一点"
PAO_anjing_desc: "“最近……国度里有些吵闹。那些本该安眠的孩子们，好像都在做着不安稳的梦。这不好。索拉娜她……喜欢安静的地方。我想，只要我轻轻地拜托她们，她们一定会为了我们，重新变回乖孩子的，对不对？”"

PAO_xtgs: "是想听故事了吗？"
PAO_xtgs_desc: "“她们还是……很吵闹。我有些明白了。一定是因为，索拉娜不在，没有人再给她们讲那些……关于阳光和星星的、有趣的故事了。那么，就由我来吧。我会让我的侍从，去每一个角落，把我记得的所有故事，都讲给她们听。听完了故事，她们就该安稳睡去了吧。”"

PAO_dsgj: "把家里打扫干净"
PAO_dsgj_desc: "“故事……好像也没有用。她们开始……弄乱我们的家了。那些漂亮的、积了千年尘埃的街道，被她们弄得一团糟。这可不行。等索拉娜回来看到，她会不开心的。我要让侍卫们，去把那些不听话的孩子，暂时请到一边去，然后，把我们的家，重新打扫得干干净净。”"

PAO_bthn: "为什么不听话呢？"
PAO_bthn_desc: "“我……不明白。我真的不明白。为什么你们就是不肯听话呢？我给了你们安静，给了你们故事，也给了你们一个干净的家。可你们……却开始互相伤害了。你们在破坏我们最重要的东西。你们在……破坏我们曾拥有过的、最完美的回忆。”"

PAO_tywb: "请不要讨厌我！！！"
PAO_tywb_desc: "“侍卫们……也挡不住她们了。到处都是裂痕，到处都是……不和谐的声音。我的家，快要碎掉了。如果……如果索拉娜回来，看到的是这样一副景象……她一定会讨厌我的吧。她会觉得，我连我们唯一的家，都看管不好。我……不能让她看到这个样子的夜莺之国。\n绝对，不能！！！”"

PAO_wlcj: "我们曾一起约定过永远"
PAO_wlcj_desc: "“对不起。真的……对不起。我不想伤害你们，你们每一个，都是我珍视的孩子。可是……你们正在毁掉，我唯一珍视的东西。所以……请原谅我。为了能让她回来时，还能看到一个……像我们曾经约定过的那样、完美的、永恒的家。我必须……亲手，将那些不和谐的音符，全部抹去了。”"

PAO_wmdj: "为了我们的家"
PAO_wmdj_desc: "“好了，不听话的孩子们，都已经重新睡着了。可是……她们把我们的家，弄得好乱。到处都是灰尘和裂痕。这不行。我要让侍从们，把每一块地砖都擦亮，把每一座雕像都修复好。我要让这里，变回你最喜欢的、那个一尘不染的样子。”"

PAO_bkcl: "别把位置空出来"
PAO_bkcl_desc: "“家里……变得比以前更空旷了。好多好多熟悉的身影，都不见了。没关系。我会用我自己的力量，去填满那些空出来的位置。我会创造出新的、更听话、也更完美的侍从。她们会和我一起，静静地，等待着这个家另一位主人的归来。”"
PAO_nnsg: "你的那束光"
PAO_nnsg_desc: "“我总是会想起，你第一次来到这里时，你身上的那束光。那么亮，那么暖，把我的整个世界都照亮了。我想……我不能再只是等待了。我要试着，去重新找到那束光。我会派我最安静的孩子们，去往那个……你现在所在的、吵闹的生者世界，去寻找你的踪迹。”"

PAO_zshn: "她们在伤害你？？？"
PAO_zshn_desc: "“我的孩子们，回来了。她们带回来的消息，让我的心……好疼。她们说，你在那个世界，过得一点也不好。有一群叫‘野火’的坏孩子，她们在伤害你，在试图……熄灭你身上的光。她们……怎么敢？她们怎么能……这样对你？”"

PAO_bzqf: "不准再欺负她了！！！"
PAO_bzqf_desc: "“她们……竟然把你逼到了那个地步。不行。我决不允许。就算……就算你背叛了我，就算你偷走了我最重要的东西，可是……欺负你的人，也只能是我。那些凡人，那些……坏孩子，凭什么，能让你露出那种……快要碎掉的表情？”"

PAO_jnhj: "请让我来接你回家！"
PAO_jnhj_desc: "“索拉娜。你听。我不管什么王座，也不管什么公社了。我现在……只想去你的身边。我不会再让你，一个人，待在那个冰冷的、危险的世界里了。我会为你，挡住所有刺向你的刀剑。我会为你，驱散所有让你不开心的阴影。然后……在你最需要的时候，伸出手，把你从那片泥潭里，拉出来，带回到这个……至少，不会再有任何人，能伤害到你的、安安静静的家里来。”"

PAO_tszl: "嘘,她睡着了"
PAO_tszl_desc: "“我把她带回来了。她很累，身上有很多伤口，像一只在外面被欺负了很久、终于回到家的小猫。现在，她正在我的房间里，安安稳稳地睡着了。我命令了所有的侍从，不准发出任何声音，不准让任何光线，打扰到她的梦境。嘘……让她好好地，睡一觉吧。”"

PAO_sygs: "把所有的门都关上"
PAO_sygs_desc: "“外面的世界，太危险了。我不喜欢。她，也一定不喜欢了。从今天起，我们要把所有的门都关上。不再去听那些吵闹的声音，也不再去看那些刺眼的光芒。这个家，现在是我们两个人唯一的、也是最后的城堡了。我要让它变得……谁也进不来。”"

PAO_zjhy: "你我二人的花园"
PAO_zjhy_desc: "“她曾说，她喜欢花。我记得的。所以，我要在我们的城堡里，为她建一座独一无二的花园。我们不再需要外面的土地了，我会让我的孩子们，用魔法和我们自己的力量，在这片寂静的国度里，种出永不凋谢的花朵，流淌永不清澈的溪流。这里，将成为我们自给自足的、永恒的乐园。”"

PAO_bzll: "不准再让她流泪"
PAO_bzll_desc: "“我偷偷去看她的时候，发现……她哪怕是在睡觉都还在皱着眉头，像是在做着很可怕的噩梦。她一定……还在害怕那些叫‘野火’的坏孩子。我绝不允许。我决不允许，再有任何东西，能让她流一滴眼泪。我要让我的侍卫们，变得比以前，更强大，更坚固。”"

PAO_nswm: "那是我们的东西"
PAO_nswm_desc: "“她醒来的时候，很少说话。但有一次，她看着地图，指着那片……曾经属于她的、叫‘莉兰迪亚’的地方，眼神里，有一种我从未见过的、很悲伤的情绪。我明白了。那就像……一个孩子被抢走了心爱的玩具。虽然那个玩具让她受了很多伤，可那……依然是她的。是我们的。”"

PAO_nhwj: "把你的玩具拿回来"
PAO_nhwj_desc: "“好了，你已经休息得够久了。现在，那些坏孩子，好像要找上门来了。别怕。这一次，我陪着你。我们一起，去把那个……被她们抢走的、属于你的玩具，堂堂正正地，拿回来。然后，我们就再也不出去了，好不好？”"

PAO_wmsq: "帷幕，就在此刻升起"
PAO_wmsq_desc: "“你听，索拉娜。\n外面，传来那些坏孩子的脚步声了。她们好像……以为我们躲在这里，是因为害怕。她们不懂。\n我们只是……在等待。等待一个最安静的、只属于我们的舞台。等待所有的观众，都已经到齐。\n现在，帷幕，终于要升起来了。\n去换上你最漂亮的盔甲吧。然后，站在我的身边。\n我们要一起，为她们，献上一场……最华丽、也是……最后的，谢幕演出。”"

PAO_rlzc: "永恒的莉兰迪亚"
PAO_rlzc_desc: "“你回来了。\n可是……你的那团火，好像，熄灭了。\n你不再笑了，也不再……对我讲那些关于未来的、闪闪发光的故事了。你只是，每天，都坐在窗边，安静地，看着外面那片……让你伤痕累累的、吵闹的世界。\n……没关系。\n既然你不喜欢阳光了。\n那我就……为你，建一座没有阳光的城堡吧。\n我会让我的孩子们，用最冰冷的石头，和最沉默的影子，把这里，重新变回你我最初相遇时、那个安安静静的样子。\n再也没有人，能伤害你了。\n再也没有梦，能让你心碎了。\n我们……就在这里，永远，在一起，好不好？”"

PAO_gdwj: "给她们……更多的玩具"
PAO_gdwj_desc: "“她们……好像还是不开心。我有点明白了。一定是因为，她们觉得工作太无聊了。索拉娜，我记得你给我讲过，生者，是需要‘娱乐’的。那么，我就给她们娱乐吧。我会让我的孩子们，为她们建造最华丽的剧院，上演永不落幕的戏剧。有了这些……她们就该安静下来了吧？”"

PAO_zssz: "只是……睡着了而已"
PAO_zssz_desc: "“她们好像……更累了。有好多好多的人，开始走不动路，然后……就倒在路边，睡着了，再也醒不过来。没关系。我会让我的孩子们，把她们倒下的身体，变成新的、不会再感到疲惫的‘夜莺的魂灵’。这样，她们就能以另一种方式，永远地，陪在我们身边了，对不对？”"

PAO_ytpn: "为什么……要逃跑呢？"
PAO_ytpn_desc: "“为什么……？我给了你们安稳，给了你们快乐，甚至给了你们永恒。可为什么……你们还要逃跑呢？要逃回那个……充满了痛苦和背叛的、外面的世界去？这里……不好吗？还是说……我，做得还不够好？”"

PAO_wltx: "索拉娜的叹息"
PAO_wltx_desc: "“‘够了，莉莉安娜。’\n这是……你回来以后，第一次，用这么严肃的语气，和我说话。\n你看着窗外那些……麻木的、如同行尸走肉般的人们，眼神里，是我看不懂的、复杂的痛苦。\n你说：‘你看看她们！她们不是你的玩偶！她们是活生生的人！你这样，是在……毁掉她们，也是在毁掉你自己！’\n......”"

PAO_nljw: "那么……你来教我，好吗？"
PAO_nljw_desc: "“我……被你说得愣住了。我只是……想用我的方式，去对她们好而已。\n我看着你，看着你那双因为愤怒而燃烧着火焰的眼睛，然后，我轻轻地，拉住了你的手，用我能想到的、最天真、也最认真的语气，问你：\n‘……可是，索拉娜。’\n‘……在你过去的那个王国里，那些活生生的人们，她们……就不哭了吗？’”"

PAO_lzyl: "两种……不同的眼泪"
PAO_lzyl_desc: "“你的火焰……在那一刻，熄灭了。\n你看着我，像是看着一面镜子。一面……照出了你所有不想再回忆的过去的、冰冷的镜子。\n你什么也没说，只是……松开了我的手，然后，慢慢地，走回了你自己的房间。\n我好像……又说错话了。\n可是……眼泪和眼泪，到底……有什么不一样呢？我还是……不懂啊。”"

PAO_jzy: "就这样"
PAO_jzy_desc: "“莉莉安娜，你是对的。人民，是需要被‘管理’的。那些哭声，太吵了。从今天起，由我来。我会用我最熟悉的方式，让这座城市，重新变回你最喜欢的、安安静静的样子。你看好了，我的公主。我会为你，献上一场……最完美的统治。”"

PAO_bdsm: "下一顿饭在哪里？"
PAO_bdsm_desc: "“反抗的根源，是‘多余’的思想。而‘多余’的思想，源于‘多余’的力气。很简单。我会精确地计算出，一个人，为了活下去，每天所需要的、最少的食物。不多，也不少。然后，由我的禁卫军，定时、定量地，分发给她们。当她们所有的时间和精力，都只够用来思考‘下一顿饭在哪里’时，她们就再也没有力气，去想那些……不该想的东西了。”"

PAO_bdsm2: "下一顿饭在哪里？"
PAO_bdsm2_desc: "“反抗的根源，是‘多余’的思想。而‘多余’的思想，源于‘多余’的力气。很简单。我会精确地计算出，一个人，为了活下去，每天所需要的、最少的食物。不多，也不少。然后，由我的禁卫军，定时、定量地，分发给她们。当她们所有的时间和精力，都只够用来思考‘下一顿饭在哪里’时，她们就再也没有力气，去想那些……不该想的东西了。”"

PAO_bdsm3: "下一顿饭在哪里？"
PAO_bdsm3_desc: "“反抗的根源，是‘多余’的思想。而‘多余’的思想，源于‘多余’的力气。很简单。我会精确地计算出，一个人，为了活下去，每天所需要的、最少的食物。不多，也不少。然后，由我的禁卫军，定时、定量地，分发给她们。当她们所有的时间和精力，都只够用来思考‘下一顿饭在哪里’时，她们就再也没有力气，去想那些……不该想的东西了。”"

PAO_hxzh: "让她们互相憎恨"
PAO_hxzh_desc: "“团结，是最低效，也是最危险的东西。我会把她们，重新分开。我会告诉城东的工人，是城西的农民，偷走了她们的面包；我会告诉南边的矿工，是北边的伐木工，抢走了她们的工作。我会为她们，制造无数个新的、小小的‘敌人’。当她们忙于互相憎恨时，她们就会忘记……谁，才是她们真正的敌人。”"

PAO_wyxw: "在这唯一的希望里"
PAO_wyxw_desc: "“当她们陷入最深的绝望，当她们被饥饿、猜忌和仇恨，折磨得体无完肤时……我会给她们，一个‘希望’。我会告诉她们，只要她们足够忠诚，足够努力，她们就有机会，成为‘被选中的人’，离开这片地狱，进入我和莉莉安娜所在的、那座永恒的城堡里。我会让她们，为了这个虚无缥缈的希望，像疯狗一样，互相撕咬，互相出卖。”"

PAO_kxlm: "你是否开心？"
PAO_kxlm_desc: "“‘索拉娜……’\n那天晚上，你找到了我。你看着窗外那座……死气沉沉的、‘绝对服从’的城市，你的眼睛里，第一次，没有了光。\n‘……这就是……你想要的吗？’你轻声问我，‘……我觉得……她们，比以前，哭得更伤心了。只是……没有声音了而已。’\n我看着你。看着你那双……因为悲伤而变得比星辰还要黯淡的眼睛。\n我笑了。\n‘不，莉莉。’我说，‘……这不是我想要的。这是……我欠她们的。’”"


PAO_yhxm: "但野火从未熄灭"
PAO_yhxm_desc: "“人民……终于，再一次，拿起了武器。\n在经历了最深的黑暗之后，她们终于明白，唯一的救赎，只在她们自己手中。而这一次，点燃她们怒火的，是我。\n我用最残酷的方式，教会了她们……什么是真正的敌人，什么是真正的团结。我逼着她们，成为了……我曾经最畏惧的、那个样子的‘野火’。\n现在，她们来了。带着足以烧尽一切的怒火，向着这座……我为她们亲手打造的、最坚固的牢笼，发起了最后的进攻。”"

PAO_lxag: "理想与哀歌"
PAO_lxag_desc: "“她们……相信了我。\n在我的请求下，人类与亡灵，第一次，放下了武器。我把那些饥饿的人，带进了城堡，为她们端上了热汤；我把那些受伤的禁卫军，安置在庭院，为她们唱起了安魂的歌谣。\n然后，我找到了你，索拉娜。\n你就坐在那张冰冷的王座上，像一尊即将熄灭的、灰色的雕像。\n我把我在外面看到的一切，都告诉了你。我告诉你，那些被你逼上绝路的人们，在喝到第一口热汤时，流下的眼泪；我告诉你，那些只知道服从的禁卫军，在听到我的歌声时，眼神里第一次出现的、名为‘安宁’的光。\n我问你：‘你看，索拉娜。她们……其实，都只是想要活下去的、普通的孩子啊。’\n‘……为什么，我们不能……一起，给她们一个真正的家呢？’\n你沉默了很久。\n然后，你抬起头，看着我，那双已经熄灭了很久的眼睛里，第一次，重新燃起了一丝……我看不懂的、无比复杂的火焰。\n你对我说：\n‘……莉莉。你还记得吗？我曾经……也有一个家。’\n‘我也曾……有过一个，关于‘理想’的、很长很长的梦。’”"


PAO_zhzl: "献上最后的葬礼"
PAO_zhzl_desc: "“……不。\n我哭着，摇着头，求你，不要那么做。\n可你……只是微笑着，揉了揉我的头发。就像……很久很久以前那样。\n‘……听话，莉莉安娜。’\n‘这是……我唯一能，为你，也为她们，做的，最后一件事了。’\n然后，你就走了。\n你独自一人，回到了那座冰冷的王座上。你遣散了所有忠诚于你的禁卫军，只留下了一座……空荡荡的城堡。\n你对整个世界，发出了你作为女王的、最后一道，也是最残忍的命令——\n‘我，索拉娜，就在这里。’\n‘……来吧。’\n‘……来，审判我。’”"

PAO_dswg: "为你戴上这顶王冠"
PAO_dswg_desc: "“她们都在看着我。那些曾憎恨你的人，和那些曾追随你的人，现在，她们的眼中，都只剩下一种……混杂着悲伤与期盼的、复杂的眼神。她们把这顶……用你的灰烬换来的王冠，戴在了我的头上。它好重，索拉娜。重得……我快要喘不过气了。可是……这是你留给我的，对不对？那么，我就会……好好地，替你戴着它。”"

PAO_zhyw: "你的最后一个愿望"
PAO_zhyw_desc: "“‘要……好好地……爱她们啊。’\n这是你留给我的、最后一个愿望。我不是很懂……‘爱’，到底是什么。可是，我答应过你。所以，我会去学的。我会把我最好的东西，都给她们。我会让她们，吃饱，穿暖，再也不会为了什么东西而哭泣。我……会努力，成为一个你所希望我成为的、‘好’的女王。”"

PAO_zcsm: "她们在吵什么呀？"
PAO_zcsm_desc: "“我以为……只要让所有人都吃饱了，她们就会变得和我那些孩子一样，安安静静的了。可她们却开始吵架了。工人们说，工厂的产出应该优先分配给城市；农民们说，没有她们的粮食，城市就是一座空壳。她们……好像都有自己的道理。索拉娜……你以前，是怎么解决这些吵闹的声音的？”"

PAO_bhsh: "一个不会说话的学生"
PAO_bhsh_desc: "“我好像做错了。无论我选哪一边，另一边的人，都会不开心。我把国家……弄得更乱了。于是，我不再颁布命令了。我只是，每天，都悄悄地，去她们的会议室外面，听她们吵架。我听她们说，什么是‘剩余价值’，什么是‘工农联盟’。那些词，我听不懂。可我……好像能从那些吵吵闹鬧的声音里，听到一种……我从未听过的、名为‘希望’的东西。”"

PAO_bhsh2: "一个不会说话的学生"
PAO_bhsh2_desc: "“我好像做错了。无论我选哪一边，另一边的人，都会不开心。我把国家……弄得更乱了。于是，我不再颁布命令了。我只是，每天，都悄悄地，去她们的会议室外面，听她们吵架。我听她们说，什么是‘剩余价值’，什么是‘工农联盟’。那些词，我听不懂。可我……好像能从那些吵吵闹鬧的声音里，听到一种……我从未听过的、名为‘希望’的东西。”"

PAO_bzhl: "笨拙的回礼"
PAO_bzhl_desc: "“她们教会了我很多东西。我也想为她们，做一点什么。我不会治理国家，也不会发展经济。我唯一会的……就只有，我那些……安安静静的魔法了。我试着，把我的力量，注入到干涸的土地里，让它重新长出庄稼；我试着，用我的歌声，去安抚那些在战争中，留下了伤痕的心。这是我唯一能为她们做的、笨拙的回礼了。”"

PAO_smxz: "生命的“形状”"
PAO_smxz_desc: "“今天，我看到一个人类的孩子出生了。她那么小，那么软，哭声那么响亮。我看着她，突然，就想到了一个问题。一个……我以前，从来没有想过的问题。一个人的灵魂，到底是什么形状的呢？是什么东西，让一个哭泣的婴儿，最终，变成了……一个会笑、会爱、会为了理想而战的、独一无二的‘野火’？或者……变成一个，像你一样，充满了火焰与伤痕的、复杂的‘女王’？”"

PAO_yqcl: "如果一切重来"
PAO_yqcl_desc: "“我好像有点明白了。灵魂的形状，是由她所经历的一切，所塑造的。是贫民窟的泥泞，是王座的冰冷，是背叛的伤痕，是……所有所有的一切，才把你，变成了现在的你。可是……如果……如果有一个灵魂，她拥有和你一样的、最纯粹的、那束光一样的内核……却没有经历过那些痛苦，没有背负那些罪责……那她……会长成什么样子呢？她……会笑吗？”"

PAO_ycjh: "请再给我一次机会"
PAO_ycjh_desc: "“我不要。我不要那个……背负了所有痛苦的你。我只要……那个最初的、会对我笑、会给我讲故事的、温暖的你。夜莺的古籍里，记载着一种禁忌的魔法。一种……能从灰烬中，重新凝聚灵魂的仪式。但从来没有人，用它来复活过一个你这样，拥有过那么炽热生命的人类。她们都说，这是不可能的。可是……我想试试。我想再见你一次。然后，亲口告诉你，这一次，我学会了。我会为你，创造一个你一直想要的、温暖的、再也没有人会哭泣的世界。然后，我们就再也不分开了。”"

PAO_nzsj: "为你，逆转四季"
PAO_nzsj_desc: "“她们说，生者的世界，有一个无法被违抗的规则。\n她们说，花开了，就会谢；人死了，就不能再回来。\n……可我，是冥界的公主啊。\n在我的国度里，时间是静止的，凋零是无需存在的。我能让枯萎的花朵重新绽放，能让破碎的灵魂回归寂静。\n那么……为什么，我就不能……让一个迷了路的孩子，重新找到回家的路呢？\n你们不懂。你们只是生者，你们畏惧死亡。可我……生于死亡。我比你们，都更懂得，灵魂的重量与形状。\n我会用我所有的知识，用我身为公主的、全部的权能。\n我会为你，逆转她们所谓的‘规律’。\n我会为你，将那寒冷的冬天，重新变回……我们初次相遇时、那个温暖的、开满了永不凋谢的花朵的春天。”"

PAO_nzsj_tt: "解锁特殊研究项目:§Y摇篮曲计划§!"

PAO_dysg: "第一束光芒"
PAO_dysg_desc: "“我要做的第一件事，是为你，找到这个世界上最纯粹的光。我走遍了我们的国度，学会了所有孩子们最天真的笑声，学会了所有恋人们最真诚的誓言，学会了所有从绝望中重新站起来的人们，眼中闪烁的第一缕希望。我要把这些，作为你灵魂最初的基石。”"
PAO_dysg_tt: "§Y？？？§!将在未来获得§Y全属性增长§!。"

PAO_yxgs: "英雄的故事"
PAO_yxgs_desc: "“你不能只拥有光明，你还需要拥有勇气。我找来了那些最勇敢的人们，让她们在摇篮边，为你讲述那些关于反抗与牺牲的故事。我要让你知道，即使是在最深的黑暗里，也总有人，愿意为了守护他人而燃尽自己。我要让你，从一开始，就爱上这些……闪闪发光的人们。”"

PAO_yxgs_tt: "§Y？？？§!将在未来获得§Y特质：勇敢§!。"

PAO_cdyl: "擦掉所有的眼泪"
PAO_cdyl_desc: "“我翻遍了所有的古籍，删掉了那些……所有会让你感到悲伤的故事。我抹去了那些关于背叛、关于失去、关于求而不得的诗篇。在为你准备的世界里，不应该有眼泪。我只要你，永远，都像太阳一样，明亮，而快乐。悲伤，就由我一个人来背负，就好了。”"

PAO_cdyl_tt: "§Y？？？§!将在未来获得§Y特质：童话的守护者§!。"

PAO_myzl: "没有重量的剑"
PAO_myzl_desc: "“你当然需要一把剑。但你的剑，不应该沾染任何仇恨。我为你，用最纯粹的月光和最坚定的誓言，锻造了一把没有重量的剑。它只会在你需要保护弱小的时候，才会出现。它挥舞时，带起的，应该是希望的风，而不是……悲伤的血。”"

PAO_myzl_tt: "§Y？？？§!将在未来获得§Y特质：§!§O守护之剑§!。"

PAO_xlb: "醒来吧，我的挚爱"
PAO_xlb_desc: "“好了。我把我能想到的、这个世界上所有最好的东西，都给了你。我为你，创造了一个完美的、一尘不染的灵魂。虽然……它可能和我预想的，有一点点不一样。它好像……比我想象的，要更……‘天真’一点。不过，没关系。现在，摇篮，即将打开。醒来吧，我的露西莉亚。然后，去拥抱这个……我为你准备好的、崭新的世界吧。”"

PAO_lxlygaiming: "§Y？？？§!改名为§Y露西莉亚§!"

PAO_bdhy: "不容置疑的心"
PAO_bdhy_desc: "“她们说，智慧，源于怀疑。可我……不这么认为。怀疑，只会带来痛苦和猜忌。我要为你，塑造一颗永远不会怀疑的心。你会无条件地，相信所有的美好，相信所有的善良，相信每一个向你伸出的手。你会像一个……永远追逐着明天的骑士，眼中只有那个值得被拯救的世界。”"

####莉莉安娜经济线####
PAO_fjss: "大大的房间"
PAO_fjss_desc: "“我要去接她回家了。可是……家里现在这个样子，还不够好。地方太小了，不够我们两个人玩耍。我要让我的孩子们，把那些没用的废墟都推平，把我们的国度，变得更大、更漂亮。这样，等她回来，就能有一个崭新的、足够宽敞的房间了。”"

PAO_ssfg: "闪闪发光"
PAO_ssfg_desc: "“我记得……你最喜欢那些亮晶晶的、温暖的东西了。你说，它们像天上的星星。我们这里没有星星，但是……地底下，有很多很多漂亮的石头。我会让我的孩子们，把它们全都挖出来，为你建成一座……比太阳还要闪亮的宫殿，造出一支……比星星还耀眼的军队。你会喜欢的，对不对？”"

PAO_ssfg2: "闪闪发光"
PAO_ssfg2_desc: "“我记得……你最喜欢那些亮晶晶的、温暖的东西了。你说，它们像天上的星星。我们这里没有星星，但是……地底下，有很多很多漂亮的石头。我会让我的孩子们，把它们全都挖出来，为你建成一座……比太阳还要闪亮的宫殿，造出一支……比星星还耀眼的军队。你会喜欢的，对不对？”"

PAO_ssfg3: "闪闪发光"
PAO_ssfg3_desc: "“我记得……你最喜欢那些亮晶晶的、温暖的东西了。你说，它们像天上的星星。我们这里没有星星，但是……地底下，有很多很多漂亮的石头。我会让我的孩子们，把它们全都挖出来，为你建成一座……比太阳还要闪亮的宫殿，造出一支……比星星还耀眼的军队。你会喜欢的，对不对？”"

PAO_ssfg4: "闪闪发光"
PAO_ssfg4_desc: "“我记得……你最喜欢那些亮晶晶的、温暖的东西了。你说，它们像天上的星星。我们这里没有星星，但是……地底下，有很多很多漂亮的石头。我会让我的孩子们，把它们全都挖出来，为你建成一座……比太阳还要闪亮的宫殿，造出一支……比星星还耀眼的军队。你会喜欢的，对不对？”"

PAO_ssfg5: "§1公主的献礼§!"
PAO_ssfg5_desc: "§1“回来吧，索拉娜。\n你看，我把所有你喜欢的东西，\n都准备好了。”§!"

PAO_zbwj: "为你准备的新玩具"
PAO_zbwj_desc: "“生者世界的玩具，好像……都是用一种叫‘钢铁’的东西做的。它们看起来很坚固，很冰冷，和你一样。我不是很喜欢。但是……如果你喜欢的话，我也会为你准备好的。我会让我的孩子们，不眠不休，为你打造出最坚固、最锋利的玩具。有了它们，就再也没有人，敢欺负你了。”"

PAO_pytl: "为你铺一条回家的路"
PAO_pytl_desc: "“从这里，到你现在在的那个地方，太远了。走路，会很累的。我不要你再受累了。我会让我的孩子们，用最坚固的石头，和最冰冷的钢铁，为你铺好一条……平坦的、可以直接回到家门口的路。你只要……沿着这条路，一直走，就能看到我了。”"

PAO_bedz: "不能让你饿肚子"
PAO_bedz_desc: "“你总说，生者，是需要吃东西的。虽然……我不是很懂。但是，我不能让你，在回家的路上，还饿着肚子。我会让我的孩子们，去收集所有……能让你的那些‘士兵’们，变得更有力气的东西。我会把它们，都堆在路边，等你回来拿。”"

PAO_wsjb: "现在……万事俱备了"
PAO_wsjb_desc: "“好了。家里，打扫干净了。新的玩具，准备好了。回家的路，也铺好了。所有……所有的一切，我都为你准备好了。现在，这个完美的、安安静静的、只为你一个人存在的王国，正等待着它的另一位女主人。索拉娜……我来了。”"
####莉莉安娜军事线####
PAO_sxwo: "苏醒的玩偶们"
PAO_sxwo_desc: "“我的孩子们，不能再沉睡了。我要轻轻地唤醒她们，为她们穿上最坚固的盔甲，就像妈妈为即将出门远足的孩子整理衣裳。她们会成为我最勇敢的骑士，去迎接她们迷路的姐妹回家。每一个孩子，都会得到我的祝福。”"

PAO_ygdp: "月光织成的斗篷"
PAO_ygdp_desc: "“夜晚，是我们的朋友。我会请求月亮，为我的孩子们，织一件看不见的斗篷。穿上它，她们就能像影子一样，悄悄地溜进坏人的花园里，不会被任何人发现。她们的脚步会像猫咪一样轻，不会惊醒任何一朵沉睡的花。”"

PAO_kqyj: "不会哭泣的眼睛"
PAO_kqyj_desc: "“外面的世界很可怕，充满了火焰和吵闹的声音。但我的孩子们，不会感到害怕。因为我拿走了她们的眼泪，给了她们永不哭泣的眼睛。她们会平静地，穿过所有的荆棘和风暴，眼中只有我为她们指引的、那唯一的方向。”"

PAO_jjyb: "荆棘的拥抱"
PAO_jjyb_desc: "“如果有人想伤害我的孩子，那么，她们就要做好被荆棘拥抱的准备。我会让我的孩子们，学会一种特别的魔法。她们会紧紧地、紧紧地抱住那些坏人，直到她们再也无法动弹，再也无法发出声音，直到她们也变成……安静的、不会再伤人的好孩子。”"

PAO_mlhz: "跟我走呀，迷路的孩子"
PAO_mlhz_desc: "“在那个吵闹的世界里，一定……也有很多和我们一样的、迷路的孩子。她们也在黑暗里哭泣，也想找到回家的路。我的孩子们，会为她们带去我的邀请。她们会牵起那些迷路孩子的手，对她们说，别怕，我带你们去一个……永不分离的、安安静静的家。”"



#空军线
PAO_zscb: "为她们装上翅膀"
PAO_zscb_desc: "“我的孩子们不应该只在地面上行走。我要为她们装上翅膀，用最轻的宝石和最纯净的月光，为她们编织出不会折断的羽翼。从此以后，天空也将成为我们安静的花园。”"

PAO_jjlx: "寂静的流星"
PAO_jjlx_desc: "“我喜欢流星，虽然瓦伦蒂娜说那只是燃烧的石头。我要我的孩子们也像流星一样，在最深的夜里划过天际，迅速而悄然无声。她们会像一场无人察觉的流星雨，美丽又安静地，降临在敌人的头顶。”"

PAO_sjlz: "水晶的露珠"
PAO_sjlz_desc: "“她们的武器不应该是吵闹的火焰。那会吓到地面上那些可怜的孩子。她们的武器，应该是清晨花瓣上凝结的水晶露珠，冰冷纯净又无比锋利。当这些露珠从天空落下时，只会带走不和谐的声音，留下一片永恒的安宁。”"

PAO_ydtw: "在云端跳舞"
PAO_ydtw_desc: "“空中的战斗不应该是丑陋的撕咬。它应该是一场优雅的舞蹈，在云朵和风之间。我的孩子们会学习如何在气流中旋转，如何像蝴蝶一样躲开所有的危险。她们会让敌人明白，天空是属于舞者的舞台。”"

PAO_xxyj: "星星的眼睛"
PAO_xxyj_desc: "“我要把天上最亮的星星摘下来，安在她们的翅膀上。这样无论飞得多高，她们都能看清地面上每一片需要被守护的叶子，和每一颗需要被安抚的、迷路的心。她们的眼睛里，会映照出整个世界。”"

PAO_yggz: "月光下的公主们"
PAO_yggz_desc: "“现在我的孩子们已经学会了飞翔。她们将组成月光的编队，成为夜空的公主。当她们的翅膀遮蔽天空时，所有的喧嚣都将归于寂静，所有的纷争都将被安抚。整个世界，都会在她们带来的、永恒的月光下，安然睡去。”"

#海军线
PAO_shzg: "聆听深海之歌"
PAO_shzg_desc: "“大海的深处，和我的家一样，安安静静的。我喜欢那里。我要让我的孩子们，学会聆听海底的声音，学会在无光的深海里，找到回家的路。她们将成为这片蓝色寂静里，第一批，也是唯一的主人。”"

PAO_szjy: "睡着的鲸鱼"
PAO_szjy_desc: "“我们的船不应该是吵闹的钢铁怪物。她们应该是睡着的、温柔的鲸鱼。她们会悄悄地，滑过最深的海沟，不会惊动任何一条小鱼。她们巨大的身影，将隐藏在洋流和阴影里，成为一个……无人知晓的、关于深海的秘密。”"

PAO_ryqw: "美人鱼的亲吻"
PAO_ryqw_desc: "“如果……有坏孩子的船，闯入了我们的花园。那么，我的孩子们，就会像传说中的美人鱼一样，悄悄地游过去，在她们的船底，留下一个……冰冷的、致命的亲吻。然后，在坏孩子沉入海底之前，微笑着，消失在深蓝色的梦里。”"

PAO_bxcj: "不许在家里吵架"
PAO_bxcj_desc: "“我不喜欢别的孩子，也跑到我的花园深处来玩。她们太吵了，会吓到我的小鱼。我的孩子们，会用她们无声的拥抱，告诉那些不请自来的客人，这里……是禁止大声喧哗的。然后，把她们，轻轻地，请出去。”"

PAO_zmc: "深海的捉迷藏"
PAO_zmc_desc: "“有时候，我们也要学会捉迷藏。当坏孩子带着她们的飞机，气冲冲地跑来找我们的时候，我的孩子们，就会像害羞的水草一样，躲进最深的、最黑暗的海沟里。她们会屏住呼吸，静静地等待。等到坏孩子找不到我们，哭着回家了，我们再出来。”"

PAO_dhyl: "好梦洒向大海"
PAO_dhyl_desc: "“现在，整片大海，都听到了我的歌声。它变得和我一样，安安静静的了。我的孩子们，将成为这片蓝色梦境的守护者。她们会为所有迷航的船只，唱起温柔的摇篮曲，引导她们，进入一个……永不醒来的、最深、最甜美的梦乡。”"

####事件####
PAO.1.t: "为什么要躲着我呢？？？"
PAO.1.d: "我只是……想让家里，变回原来的样子。\n我派出了侍卫们，去把那些……在外面游荡的、不听话的孩子，都请回她们自己的房间里去。我告诉侍卫们，动作一定要轻柔，因为那些孩子，只是在做着不安稳的梦，不可以吵醒她们。\n可是……侍卫们回来了。\n她们说，那些孩子，不愿意回家。\n她们说，她们只是轻轻地碰了一下，那些孩子……就碎掉了。\n然后，就有更多的孩子，从城市的阴影里跑了出来。她们不再只是吵闹了，她们开始……推倒那些漂亮的、几千年都没有动过的雕像，开始……弄脏我们干净的街道。\n我……不明白。\n我只是想在索拉娜回来之前，把一切都收拾得整整齐齐，就像她离开时那样。\n为什么……为什么你们，就是不肯帮帮我呢？"
PAO.1.a: "§1是我……做错了吗？§!"

PAO.2.t: "世界安静了下来，可是……"
PAO.2.d: "最后一声不和谐的嘶吼，消失了。\n我的侍卫们，忠实地，执行了我的命令。她们把那些……不听话的孩子，全部，都送回了永恒的安眠里。\n我走在那些……曾经无比吵闹的街道上。现在，这里又恢复了它应有的样子。\n安静，完美，一尘不染。\n就像……你离开之前那样。\n我从地上，捧起了一捧黑色的尘埃。这是那些孩子……留下的、最后的东西。它们很轻，很凉，就像从未存在过一样。\n你看，索拉娜。\n现在，家里又变得和以前一样，安安静静的了。\n再也没有什么东西，能打扰我们了。\n我把一切……都准备好了。\n所以……\n……你，可以回来了吗？"
PAO.2.a: "§1（整个国度，只剩下……她的回音。）§!"

PAO.3.t: "一场没有听众的道歉"
PAO.3.d: "她们……停下来了。\n那些吵闹的孩子们，好像……也打累了。她们没有再进攻，只是退回了城市的阴影里，远远地、沉默地，看着我。\n我也……没有力气了。\n我最忠诚的侍卫们，有很多，都变成了和我脚下这些……冰冷的尘埃一样的东西。\n我走在这座……被我们亲手弄得一团糟的家里。到处都是裂痕，到处都是……无法被修复的伤疤。\n我做错了。\n我想让这里，变回你离开时那样、完美的、安安静静的样子。\n可我……好像把它，弄得更乱了。\n对不起，索拉娜。\n我……好像把我们的家，搞砸了。\n如果……如果你现在回来，看到的是这样一副破破烂烂的景象……你一定会……更不想回来了吧。\n对不起……\n……真的，对不起。"
PAO.3.a: "§1（废墟中，只剩下……她小声的啜泣。）§!"

PAO.4.t: "永恒的寂静"
PAO.4.d: "……结束了。\n冰冷的雨水，冲刷着脸上的血污，也冲刷着……我那可笑的、关于不朽帝国的梦想。\n这些叫“野火”的凡人，比我想象的……要坚韧得多。我的军团崩溃了，我的防线被撕碎了。现在，她们像一群饥饿的狼，将我，这头落单的狮子，团团围住。\n也好。\n就这样，以一个女王的姿态，战死在这里……也算是一个不错的结局。至少，比回到那个……冰冷的、永恒的牢笼里，要好得多。\n我握紧了剑，准备迎接最后的冲锋。\n就在这时……\n……世界，突然，安静了下来。\n那些革命军的呐喊声、枪炮的轰鸣声、雨水砸在盔甲上的滴答声……所有，所有的声音，都在一瞬间，消失了。\n我愕然地抬起头。\n我看到，那些革命军的士兵，就像一群被按下了暂停键的人偶，保持着冲锋的姿态，凝固在了原地。雨水，停在了半空中。火焰，也停止了跳动。\n整个世界，都陷入了一种……我无比熟悉的、完美的、死一般的寂静之中。\n然后，我听到了一个声音。\n一个……我曾以为，我再也不会听到的、轻柔得像梦一样的声音，就在我的耳边，轻轻地响起。\n“……疼吗？”\n我猛地回头。\n身后，空无一人。\n只有一片……散发着柔和微光的、将我与整个世界隔绝开来的、透明的屏障。\n“……你总是这样。”那个声音，带着一丝……我无法分辨是心疼还是责备的、柔软的叹息，“总是把自己弄得……这么狼狈。”\n“……走吧。”\n“……我来，接你回家了。”"
PAO.4.a: "§O……莉莉安娜？§!"

PAO.5.t: "当“零件”开始说话"
PAO.5.d: "寂静的秩序，被一阵嘈杂的、属于生者的声音，打碎了。\n麻烦，来自那些被“收容”的莉兰迪亚人。\n在莉莉安娜看来，她只是在用自己最熟悉、也是最“高效”的方式，来重建这座城市。她将人类，和她那些不知疲倦的亡灵臣民一样，编入了永恒的生产序列。\n每一个人，都被分配了一个固定的、永不变更的岗位。伐木工，就永远负责砍伐；石匠，就永远负责堆砌。没有休息，没有轮换，也……没有报酬。因为在这个完美的、没有欲望的国度里，为女王的城堡添砖加瓦，本身就是至高无上的荣耀，是存在的全部意义。\n她无法理解，这些脆弱的、生命短暂的“零件”，为什么会“损坏”。\n为什么，她们会疲惫，会生病，甚至会……抱怨。\n暴乱的导火索，是一场意外。一个在矿场连续工作了两天两夜的年轻工人，因为脱力，失足摔进了那台永不停歇的、巨大的矿石粉碎机里。\n\n监工的“夜莺魂灵”毫无反应。在它的逻辑里，这只是一个“零件”的损耗。它只是，准备将下一个序列的“零件”，补充到那个空出来的岗位上。\n就在这时，一个沙哑的、充满了悲愤的声音，从人群中响起。\n“……他，是我儿子。”\n一个头发花白的老工人，放下了手中的工具，颤抖着，站了出来。\n“他……不是一个‘零件’。”\n然后，第二个，第三个……越来越多的人，沉默地，放下了手中的工具。她们围拢过来，将那个失去孩子的父亲，护在了中间。她们用自己的血肉之躯，组成了一道脆弱的、却无法被“序列”所理解的墙。\n她们的眼神里，没有恐惧。只有一种……在被剥夺了一切之后，所剩下的、最后的、属于“人”的尊-严。\n当莉莉安娜从索拉娜的房间里，听到这个消息时，她的脸上，第一次，露出了那种……孩子气的、完全无法理解的困惑。\n“……她们，在做什么呀？”\n“……我只是，想为大家，建一个更漂亮的家而已。”"
PAO.5.a: "§R（沉默的齿轮，开始发出刺耳的摩擦声）§!"

PAO.6.t: "你看，她们在哭啊"
PAO.6.d: "“够了，莉莉安娜。”\n这是……你回来以后，第一次，用这么严肃的、带着一丝颤抖的语气，和我说话。\n我停下了正准备为你梳理头发的手，有些不解地看着你的背影。\n你没有回头。你只是，指着窗外。\n“你看看她们。”你的声音，像一块被烧红的铁，又被强行浸入了冰水里，“你看看她们的眼睛！那里面，还有一点点的光吗？！”\n我顺着你的手指望去。\n窗外，是我为你建造的、完美的城市。街道很干净，建筑很宏伟，所有的人类，都在我的“夜莺的魂灵”的指引下，有条不紊地，进行着永恒的建设。一切……都和我设想的一样，安静，而有序。\n“她们不是你的玩偶！不是那些可以随意拆解、再重新拼凑起来的亡灵！”你的声音，第一次，带上了……愤怒。\n“她们会痛，会累，会饿！她们有自己的家人，有自己的梦想！她们是……活生生的人啊！你这样……是在毁掉她们！也是在毁掉你自己！”\n我被你说得愣住了。\n我只是……想用我的方式，去对她们好。我想给她们一个没有纷争、没有饥饿、永远安宁的家。\n我只是……不想再看到任何人，像你当初那样，被那些凡人伤害了。\n我做错了吗？\n我缓缓地走到你的身边，学着你刚才的样子，也望向了窗外那些……安静得有些过分的人们。\n然后，我轻轻地，拉住了你的手，用我能想到的、最天真、也最认真的语气，问你：\n“……可是，索拉娜。”\n\n“……在你过去的那个王国里，那些活生生的人们，她们……就不哭了吗？”"
PAO.6.a: "§1（你的手，在那一刻，冰冷得像一块石头。）§!"

PAO.7.t: "我的王国"
PAO.7.d: "莉莉安娜……她问我。\n问我，在我的王国里，人民……就不哭了吗？\n怎么会不哭呢？\n我的王国……\n我的王国，建立在贫民窟的泥泞之上。那里，哭声，是比呼吸更廉价的东西。\n我的王国，是用工人的白骨和农民的血泪铸成的。每一次敲击，都能听到他们的哀嚎。\n我的王国，是我用饥饿和恐惧，从那片绝望的土地上，驱赶出来的野兽。她们的每一次冲锋，都是为了能抢到一块……能让自己活到明天的面包。\n是的。\n在我的王国里，人民当然会哭。\n她们哭得比这里的任何人，都更大声，更凄惨。\n可是，莉莉安娜……你不懂。\n你永远也不会懂。\n正因为她们会哭，正因为她们会痛，正因为她们会……在被逼到绝境的时候，燃起那该死的、连神明都能烧成灰烬的怒火……\n所以……“野火”，才会诞生。\n所以，像晓枫那样的人，才会出现。\n所以，我那座看起来坚不可摧的、用力量和恐惧建立起来的帝国，才会像一座沙子堆成的城堡一样，被她们……轻而易举地，推得粉碎。\n我回来了。\n回到了你为我建造的这个……完美的、安宁的、再也没有人会反抗的、永恒的牢笼里。\n我看着你，用你那天真的善意，重复着我曾经犯下的、所有傲慢的错误。\n我突然……就明白了。\n我真正输掉的，不是那场战争。\n而是，当我看着那些……衣衫褴褛、食不果腹的“野火”士兵们，脸上却带着那种……我从未拥有过的、为了某个比生命更重要的东西而去战斗的光芒时…\n我就已经，输得一败涂地了。\n对不起，莉莉安娜。\n我……好像，不能再陪你，待在这个……安安静静的家里了。\n因为，我终于想起来了。\n在那座……被我亲手摧毁的、充满了哭声的王国里……\n……也曾有过，我的家。"
PAO.7.a: "§O（火焰，熄灭了。）§!"

PAO.8.t: "一场关于面包的梦"
PAO.8.d: "你……睡着了。\n这是你回来以后，第一次，睡得这么沉。\n我（莉莉安娜）就坐在你的床边，像以前一样，静静地看着你。\n你睡着的样子，和小时候，没什么两样。还是会微微地皱着眉头，像是在思考着什么……很了不起的难题。\n突然，你开始说梦话了。\n声音很轻，很含糊，像是在对谁说话。\n“……面包……不够了……”\n“……把我的那份……分给她们……不然……会闹事的……”\n“……不行……军饷不能再拖了……那帮饿疯了的狼……会把我们都撕碎的……”\n“……该死的……‘野火’……为什么……她们明明什么都没有……为什么……就是杀不完……”\n你的眉头，皱得越来越紧。你的呼吸，也变得越来越急促。\n我有些担心，想伸出手，去抚平你眉间的褶皱。\n就在这时，你突然，用一种……我从未听过的、带着一丝颤抖和疲惫的、近乎哀求的语气，轻轻地，说了一句：\n“……好累啊。”\n然后，你就翻了个身，把脸深深地，埋进了柔软的枕头里，再也没有发出声音。\n我伸出的手，停在了半空中。\n我只是……静静地看着你。\n我突然觉得……\n我好像……从来，都没有真正地，走进过你的梦里。"
PAO.8.a: "§1（你的梦里……到底，都有些什么呢？）§!"

PAO.9.t: "墙与狗圈"
PAO.9.d: "“你看，索拉娜。”\n你的声音里，带着一种孩子气的、邀功般的兴奋。\n“我把我们的家，变得更安全了。我建起了最高、最坚固的墙，还派了我们最勇敢的孩子，守在每一个门口。这样……就再也没有坏人，能闯进来伤害你了。”\n我顺着你手指的方向看去。\n窗外，巨大的、由黑曜石和骸骨构成的城墙，像一道永恒的悬崖，将我们的城堡，与那个吵闹的世界，彻底隔绝开来。\n“……嗯。”我点了点头，声音里，听不出什么情绪，“很好。”\n你似乎对我的平淡反应有些失望，但还是继续兴致勃勃地介绍着你的“杰作”。\n“我还听了你的话。你说，那些迷路进来的生者，是需要吃饭的。所以，我命令我的孩子们，每天，都会把最好的食物，放在城门口的食槽里。你看，她们现在……都在安安静静地排队，再也没有人争抢，再也没有人哭闹了。是不是……很有秩序？”\n我看着窗外。\n看着那些……衣衫褴褛的人类，在“夜莺的魂灵”的监视下，麻木地，排成一条长长的队伍。然后，从那个巨大的、冰冷的石头食槽里，领取属于自己的、不多不少的那一份食物。\n我看着这个场景，突然……就想起了很久很久以前的一些事。\n我想起了，我还是一个人类小女孩的时候。在贫民窟的冬天，那些贵族老爷们施舍食物时，也是这样。他们把发了霉的面包，扔进一个巨大的食槽里。然后，看着我们这些……快要饿死的孩子，和野狗一起，为了多抢到一口吃的，互相撕咬，头破血流。那时候，我就明白了。\n最稳固的统治，需要的不是爱，也不是信仰。\n而是……饥饿。\n是让所有人都处在一种“不听话，就会饿死”的恐惧里。然后，再由你，来决定谁能吃饭，谁不能。\n这就是……我建立自己那个王国的、最初的基石。\n我看着你，看着你那双……因为自己创造了“完美秩序”而闪闪发光的、纯净的眼睛。\n我突然……就有点想笑。\n你看，莉莉安娜。\n我们……原来，是这么的相像。\n只是，你用的是“善意”。而我，用的是“恶意”。\n但我们……都为自己心爱的人，建造了一座，一模一样的、名为“绝对安全”的……华丽的狗圈。"
PAO.9.a: "§O（我们……有什么不一样吗？）§!"

PAO.10.t: "被挂起的地图"
PAO.10.d: "你……好像很开心。\n因为，这是我回来以后，第一次，主动向你要了一样东西。\n我要了一张地图。一张……关于那片，曾属于我的、叫“莉兰迪亚”的土地的地图。\n你很快就让你的孩子们，为我找来了。还为它，配上了一个最华丽的、用白骨和宝石镶嵌的画框。\n现在，它就挂在我的房间里。\n你走进我的房间，看到我正站在那幅地图前，眼神里，充满了好奇和一丝……不易察觉的欣喜。\n“你在看什么呀？”你轻轻地问。\n我没有回头。我只是伸出手，指着地图上，那座曾被我命名为“胜利堡”的、最坚固的要塞。\n我的声音，冰冷，而沙哑。像是在陈述一个不容置疑的事实。\n“……这个。是我亲手设计的。那里的每一块砖，都刻着我的名字。”\n我又指向了那片……曾盛产咖啡豆的、富饶的平原。\n“……还有这里。我曾在这里，签下了上百份贸易订单。那里的每一颗咖啡豆，都曾为我的国库，换来过黄金。”\n最后，我的手指，重重地，点在了那座……曾被“野火”的火焰，烧成灰烬的王宫之上。\n“……而这里。”我的声音里，第一次，带上了一丝……你所熟悉的、充满了占有欲的怒火，“曾是我的王座。是那群该死的蝼蚁，把它，从我这里……偷走了。”\n我转过身，看着你。\n“莉莉，你说得对。”我的眼神，像一头被夺走了领地的、受伤的狮子，“那是……我的东西。是我一个人的。我不允许……不允许任何人，把它，从我手里抢走。”\n你看着我，看着我又变回了那个……你所熟悉的、充满了野心与欲望的索拉娜。\n你的脸上，露出了一个安心的、无比温柔的笑容。"
PAO.10.a: "§O（她只看到了她想看到的）§!"

PAO.11.t: "我们何时出征？"
PAO.11.d: "“真不错。”\n我掂了掂手中这柄新剑的重量。剑身上，流淌着属于夜莺国度的、冰冷的死亡能量。它比我过去拥有的任何一把武器，都更锋利，也更……听话。\n你站在我的身边，看到我脸上露出的、满意的表情，你的眼睛里，也闪烁着开心的光芒。\n“你喜欢就好。”你轻声说，“有了它们，就再也没有人，能伤害你了。”\n“伤害我？”我笑了。那是一种……你许久未见的、充满了嘲讽与傲慢的笑。\n“莉莉安娜，你太小看我了。”我转过身，用剑尖，轻轻地抬起了你的下巴，就像……很久很久以前，我第一次，见到你时那样。\n“也太小看……那些凡人了。”\n我收回了长剑，望向工坊外，那些已经集结完毕的、无穷无尽的亡灵大军。\n“她们……不是来伤害我的。她们是来……迎接她们的女王，回家的。”我的声音里，充满了即将重返战场的、兴奋的战栗，“她们以为我被打败了，以为我像一只丧家之犬一样，躲回了你的影子里。她们错了。”\n“我只是……回来拿回一些，我早就该拿的东西而已。”\n我转过身，将那柄冰冷的长剑，指向了莉兰迪亚的方向。\n“所以，我们什么时候去碾碎她们？”我的声音，回荡在整个工坊里，充满了不容置疑的威严，“去告诉那些不知死活的蝼蚁……我，索拉娜，回来了。去把我的王座，我的城市，我的一切……都给我，原封不动地，拿回来！”\n你看着我，看着我又变回了那个……你初次爱上的、那个充满了力量、野心与光芒的征服者。\n你的脸上，露出了一个……无比满足的、痴迷的笑容。\n……我终于，要为你，也为我自己，去夺回属于我们的荣耀了。"
PAO.11.a: "§O（演出即将开始）§!"

PAO.12.t: "镜中的“女王”"
PAO.12.d: "我逃跑了。\n从她的身边，从她那双……纯净到足以灼伤我的眼睛里，逃了出来。\n我把自己，关回了这个……她为我精心准备的、华丽的牢笼里。\n我走到镜子前，看着镜中的自己。\n“女王”……\n多么可笑的词语。\n一个被一群衣衫褴褛的凡人，从自己的王座上赶下来的失败者。\n一个像丧家之犬一样，需要被自己曾经背叛的人，捡回来的可怜虫。\n这就是……镜子里这个女人的真面目。\n我恨。\n我恨那些叫“野火”的蝼蚁。恨她们的顽固，恨她们那愚蠢的、所谓的“信仰”，恨她们……明明那么弱小，却能从废墟里，一次又一次地，爬起来。\n可我……好像更恨自己。\n恨自己的无能，恨自己的傲慢，恨自己……花了半辈子的时间，用尽了所有的卑劣手段，建立起来的那个所谓的“不朽帝国”，竟然，真的就输给了那样一群……连饭都吃不饱的家伙。\n……\n莉莉安娜……\n我的手，不自觉地，抓紧了肩上这件柔软的披肩。\n上面，还残留着她指尖的、淡淡的凉意。\n她刚才……看着我的时候，眼神里，全是心疼和担忧。\n她一定……把我当成了一个在外面受了委屈、回家哭鼻子的孩子了吧。\n她不知道。\n她永远也不会知道。\n真正把她那份唯一的、纯净的温暖，当作工具，去肆意践踏的人，是我。\n真正把这个世界上，唯一一个，曾毫无保留地爱着我的人，亲手推入深渊的，也是我。\n我……\n……\n我看着镜子里那张苍白的、陌生的脸，突然，就笑了。\n笑得比哭，还要难看。\n你看，索拉娜。\n你赢不了那些蝼蚁，也配不上那份纯净的爱。\n你就是个……彻头彻尾的、一无所有的……废物。"
PAO.12.a: "§O将脸埋进那件……还带着一丝凉意的披肩里§!"

PAO.13.t: "和我一样的眼睛"
PAO.13.d: "索拉娜……好像很忙。\n她每天都在制定着各种各样、我看不懂的计划。她说，这是为了让我们的家，变得更“稳固”。\n我不是很懂。\n我只是觉得……这个家，好像变得越来越冷，也越来越……陌生了。\n今天，我一个人，偷偷地，溜出了那间总是很安静的房间。我换上了一件普通的斗篷，走在了这座……我曾以为，已经被我治理得很好的城市里。\n然后，我看到了她们。\n看到了那些……排着长长的队，从冰冷的食槽里，领取着刚好能果腹的、没有任何味道的食物的人们。\n她们的脸上，没有任何表情。既没有喜悦，也没有悲伤。只有一种……比我那些亡灵臣民，还要深沉的、活着的死寂。\n我走过一个墙角时，看到了一个很小很小的人类女孩。她正蜷缩在那里，因为饥饿，连哭的力气都没有了。她只是，睁着一双大大的、空洞的眼睛，看着人来人往的街道。\n我看着她的眼睛。\n突然……就想起了很久很久以前的、我自己。\n想起了，在那个永恒寂静的国度里，独自一人，坐在冰冷的王座上，等待了上万年的、那个小小的、孤独的公主。\n我们……好像啊。\n都在等待着一个……不会再到来的拥抱。都在忍受着一种……无法被填满的饥饿。\n我的心，突然，像被什么东西，很轻很轻地，刺了一下。\n我从我的口袋里，拿出了今天下午，索拉娜特意留给我的、那块我最喜欢吃的、点缀着水晶糖霜的糕点。\n我走到那个小女孩的面前，蹲下身，把那块……对我来说，很珍贵很珍贵的糕点，轻轻地，递到了她的手里。\n她愣住了。\n她看着我，那双空洞的眼睛里，第一次，闪过了一丝……我能看懂的、名为“困惑”的光。"
PAO.13.a: "§1原来……饥饿，是这种感觉吗？§!"

PAO.14.t: "看不见的墙"
PAO.14.d: "我又偷偷地，溜了出去。\n我带了很多很多……我从索拉娜那里，“偷”来的、好吃的东西。我想，把它们，分给那些……还在饿肚子的孩子们。\n可是……城市里的气氛，变得更奇怪了。\n我看到，昨天还坐在一起、分享着同一块面包的两个工人，今天，却因为对方不小心踩脏了自己的鞋子，而互相推搡，破口大骂。\n我看到，东边街区的居民，会在自己家门口的路上，撒上碎玻璃，只是为了……不让西边街区的孩子，跑到她们这边来玩。\n我把一块很甜的蛋糕，递给一个正在哭泣的小男孩。可他身边的另一个小女孩，却立刻冲了过来，一把将蛋糕打翻在地，然后对着那个小男孩尖叫道：“他是‘北边’来的！他是我们的敌人！”\n我……完全不明白了。\n明明……食物就在眼前，明明……大家只要互相帮助，就都能吃饱。可为什么……她们要像一群被关在同一个笼子里的、饥饿的野兽一样，互相伤害呢？\n我走到那两个还在为了一块黑面包而争吵的工人中间，我想告诉她们，我这里，还有很多很多面包，足够她们两个人都吃饱。\n可她们……好像，完全看不见我。\n她们的眼睛里，只有对彼此的、那种我无法理解的、滚烫的仇恨。\n我站在她们中间，第一次，感到了一种……比万年孤寂，还要刺骨的寒冷。\n我好像……和她们之间，隔着一堵看不见的、冰冷的墙。\n我……要怎么做，才能……让她们，重新看到彼此呢？"
PAO.14.a: "§1索拉娜……这就是……你想要的吗？§!"

PAO.15.t: "“被选中”的代价"
PAO.15.d: "索拉娜说……她为这个死气沉沉的城市，注入了“活力”。\n她说……她给了她们一个值得为之奋斗的“希望”。\n我站在城堡最高的露台上，看着她口中的那份“活力”。\n我看到……一场场为了争夺“被选中”名额的、血腥的角斗，正在城市的每一个角落里上演。\n邻居，会为了一个虚假的举荐名额，向警察告发他的邻居。\n兄弟，会为了能让自己先一步爬上那座通往城堡的长桥，而毫不犹豫地，将自己的兄弟，从悬崖上推下去。\n甚至……有母亲，会为了能让自己的孩子，获得进入城堡的“资格”，而亲手，将别人家的孩子，献祭给那些……根本不需要祭品的“夜莺的魂灵”。\n今天，是这个月的“遴选日”。\n\n有一个年轻人，成功了。他踩着无数人的尸体，浑身是血地，终于，爬到了那座通往城堡的长桥上。\n他以为……他赢了。\n可就在他即将踏入城堡大门的那一刻，两个守在门口的“夜莺的魂灵”，无声地，举起了手中的长枪，交叉着，拦住了他的去路。\n然后，一个冰冷的、不带任何感情的声音，从城堡的广播里传出，响彻了整个城市。\n那是……索拉娜的声音。\n“很遗憾。你们之中，并没有‘被选中者’。下个月，继续努力吧。”\n那个年轻人，跪倒在了桥上。他看着那扇在他面前，缓缓关上的、巨大的城堡之门，又回头，看了看桥下那些……正对他发出恶毒诅咒的、曾经的同胞。\n然后，他发出了一声……不似人类的、绝望的嘶吼，纵身一跃，从那座……代表着“希望”的长桥上，跳了下去。\n我……静静地看着这一切。\n我缓缓地，走回了那个……温暖的、安宁的、属于我一个人的房间。\n我走到那面……光洁如水的镜子前，看着镜子里，那个穿着华丽公主裙的、天真的、不食人间烟火的……“我”。\n我突然觉得……"
PAO.15.a: "§1……恶心§!"

PAO.16.t: "什么是“爱”？"
PAO.16.d: "今天，是“神恩”降临的日子。\n索拉娜从所有“顺从”的人类中，挑选出了十个“最忠诚的幸运儿”，允许她们，进入我们这座永恒的城堡，永远地，摆脱外面的饥饿与痛苦。\n整个城市，都为此而陷入了一种病态的狂热。我看到无数人，为了能得到那个虚无缥缈的名额，互相揭发，互相出卖，甚至……向自己的亲人，挥起屠刀。\n我看不下去了。我躲回了房间，捂住了耳朵。\n直到深夜，一阵撕心裂肺的、绝望的哭喊声，穿透了厚厚的墙壁，也穿透了我的心脏。我走了出去。\n在城堡冰冷的、巨大的门外，一个年轻的母亲，正跪在滂沱的暴雨里。她的孩子，因为在之前的“选拔”中，不够“忠诚”，而被淘汰了。而她自己，却成为了那十个“幸运儿”之一。\n现在，她正用力地，用自己的额头，撞击着那扇她再也无法为孩子打开的、冰冷的城堡大门。\n“求求您……求求您……”她哭得上气不接下气，“把我的名额……给他吧……他还那么小……他还什么都不懂……”\n“我愿意……我愿意去矿场……我愿意去死……求求您……让他进去吧”\n我站在她的身后，撑着伞，静静地听着。雨水，打在伞面上，发出沉闷的声响，像一声声敲在我心上的、冰冷的重锤。\n我抬头望向城堡最高处的那扇窗。索拉娜就站在那里。她正静静地，俯瞰着下方这幕由她亲手导演的、残忍的戏剧。她的脸上，没有任何表情。\n那一刻，我突然就什么都明白了。\n我明白了，我过去那些天真的、想要用“故事”和“糖果”，去拯救她们的想法，是多么的可笑。我明白了，索拉娜她从来就没有想过要给这些人真正的“幸福”。她只是，在用一种更高级、更残忍的方式，在重复着她自己童年时，所经历过的那场地狱。\n她不是在统治。她是在……复仇。向这个，曾让她像野狗一样，在泥泞里挣扎的、该死的世界，复仇。\n而我……\n我看着那个在泥水里，为了自己的孩子，连尊严都彻底舍弃的、渺小的母亲。\n我又想起了很久很久以前，只在童话书里才能看到的，那个为了能让孩子活下去，而选择背负了整个世界的罪责的母亲。\n原来……原来，真正的“爱”，不是把一个人，锁在自己为她建造的、完美的、安安静静的城堡里。\n而是……愿意为了她，走出去，走进那片……自己最害怕的、充满了风雨和泥泞的世界里去啊。\n我缓缓地，收起了伞。冰冷的雨水，瞬间，将我浑身都淋得湿透。\n我走到那个母亲的身边，蹲下身，用我那双……只会弹奏竖琴、只会翻阅童话书的、冰冷的手，轻轻地，扶住了她那双，因为绝望，而深深陷入泥土里的、温暖的手。"
PAO.16.a: "§1我爱你们，人类。我爱你，索拉娜。§!"

PAO.17.t: "请停下来！"
PAO.17.d: "索拉娜疯了。\n我看着她用最残酷的手段，将人民逼上了绝路。然后，又用一种近乎自毁的姿态，等待着那场……由她亲手点燃的、审判的火焰，将她自己也一并吞噬。\n我……不能让她得逞。我不能眼睁睁地看着，她就这样在我面前，把自己……烧成灰烬。\n于是，我走了出去。第一次，违背了她的“命令”，走出了那座冰冷的城堡。\n我来到了战场。我看到了那些……眼睛里燃烧着和“野火”一样火焰的人们。她们愤怒，她们绝望，她们……只想摧毁眼前的一切。\n我也看到了，那些依旧忠诚于索拉娜的、强大的禁卫军。她们的眼中，没有思想，只有执行命令的、绝对的服从。\n她们，即将在这里，进行一场……毫无意义的、互相毁灭的血战。\n我走到了她们的中间。\n“……停下来。”\n我的声音很轻，却穿透了所有的呐喊与嘶吼。\n所有人都愣住了，她们看着我。这个……她们眼中，和暴君索拉娜并无区别的、另一个“女王”。\n“我知道……你们恨她。”我看着那些起义的人民，声音里，带着一丝我自己都未曾察觉的颤抖，“我也……恨她。”\n“我恨她……把我一个人，丢在那个冰冷的家里，那么久。”\n“我恨她……把我最喜欢的、安安静静的世界，弄得这么吵闹。”\n“我更恨她……像现在这样，一声不吭地，就想把自己……变成一个谁也够不着的、冰冷的坏人。”\n然后，我转过身，看向那些……已经将武器对准了我的、索拉娜的禁卫军。\n“……我也……爱她。”\n我的声音，轻得像一阵叹息。\n“我爱她……曾为我带来的、唯一的光。”\n“我爱她……就算自己伤痕累累，也依然会记得，为我带回一颗糖的、笨拙的温柔。”\n“所以……”我张开双臂，挡在了她们和那些愤怒的人民之间，“……我不允许。我不允许你们，为了她那错误的、任性的命令，去伤害这些……和她一样，只是想活下去的人们。我也决不允许，你们，为了所谓的‘正义’，去伤害这个……我唯一想守护的、笨拙的……坏孩子。”\n我不知道，她们能不能听懂。我也不知道，她们会不会，在下一秒，就将我和她们的敌人，一同撕碎。\n我只是……闭上了眼睛。\n然后，对所有人，说出了我……唯一能想到的、笨拙的请求。\n“……求求你们。”\n“……在审判她之前，能不能……先试着，相信我一次？”"
PAO.17.a: "§1整个战场，都陷入了长久的、死一般的寂静§!"

PAO.18.t: "理想与哀歌"
PAO.18.d: "“……莉莉安娜。”\n你的声音，很轻，像是在说一个，与自己无关的故事。“我的那个‘理想’……其实很简单。”\n“我只是……不想再看到任何人，像我小时候那样，为了半块发霉的面包，就和野狗一起，在泥潭里打滚了。”\n“我以为……只要我拥有了最绝对的权力，建立起最森严的秩序，把所有人都像齿轮一样，安排在他们该在的位置上……饥饿，和纷争，就都会消失了。”\n“我以为……我是在为她们，建造一座，能抵御一切风雨的、最坚固的堡垒。”\n“可我错了。”你的嘴角，露出了一丝苦涩的、自嘲的笑。\n“我忘了……人，不是齿轮。她们会痛，会爱，会为了那些……我早已丢掉的、名为‘尊严’的东西，去拼上自己的性命。”“我忘了……当饥饿消失了，她们就会开始渴望‘自由’。而‘自由’，恰恰是我那座完美的、绝对秩序的堡垒里，唯一，也是最不需要的东西。”\n“于是……野火，就燃起来了。”“我输了。输得一败涂地。”\n“当我被那些……我曾视为蝼蚁的人们，从王座上赶下来的时候，我才终于明白……我的那个‘理想’，从一开始，就只是一个……自以为是的、傲慢的笑话。”\n“你把我带了回来。你用你的温柔，治愈了我的伤口，也……照亮了我内心最深的黑暗。”\n“我看着你，用你那天真的、笨拙的方式，去爱着那些……曾经被我伤害过的人们。我看着她们，在你面前，慢慢地，放下了仇恨，露出了笑容。”\n“我突然……就嫉妒了。”“我嫉妒你，莉莉安娜。我嫉妒你……能那么轻易地，就得到我花了半辈子、用尽了所有卑劣手段，都得不到的东西。”\n“那一刻，我终于……为你，也为她们，找到了那条……唯一的、通往真正‘幸福’的路。”\n你转过头，深深地，看着我。那双曾燃烧着火焰的眼睛里，此刻，只剩下一种……无边无际的、温柔的悲伤。\n“莉莉安娜。你知道吗？人民的怒火，是不会凭空消失的。它需要一个出口。需要一个……能让她们将所有仇恨，都倾泻于其上的、罪恶的化身。”“而我……就是那个，最完美的‘罪人’。”“我的罪，罄竹难书。我的手，沾满了她们亲人的鲜血。这一切，都无法被原谅，也……不该被原谅。”“只有我……这个旧时代的、最后的暴君，彻彻底底地，消失在这个世界上……”“她们，才能真正地，放下过去，去拥抱，你为她们带来的、那个崭新的、温柔的未来。”\n“只有我的王座，彻底变成一座冰冷的坟墓……”\n“……你，才能在那片废墟之上，为她们，也为你自己，加冕成……真正的、受人爱戴的女王。”"
PAO.18.a: "§1不……不要……§!"

PAO.19.t: "王座上的灰烬"
PAO.19.d: "战斗……结束了。\n当我和人民一起，推开那扇沉重的、未曾上锁的殿门时。\n我们就看到了她。\n她没有穿那身冰冷的盔甲，只是穿着一件……我第一次见到她时，她穿过的那件、朴素的白色长裙。\n她就静静地，坐在那张象征着无上权力的王座上，微笑着，看着我们。\n她的身前，没有一个卫兵。\n她的手中，也没有任何武器。\n她只是……在等。\n我缓缓地，走上前去。身后，是人民压抑着的、充满了仇恨的呼吸声。\n我走到了她的面前。\n“……莉莉。”她对我笑了。那是我……回来以后，第一次，看到她露出那样……不带一丝阴霾和痛苦的、真正温柔的笑容。\n“你看，”她从王座上跪了下来，指了指我身后，那些……眼中燃烧着火焰的人们，“……她们，是不是……比我们那些只会服从的‘魂灵’，要……可爱得多？”\n我……说不出话来。\n“……以后，”她伸出手，似乎想……像很久很久以前那样，再碰一碰我的脸颊。可她的手，却在半空中，就开始……一点一点地，化作了灰色的、飞舞的尘埃，“……这个家，就……交给你了。”\n“……要……好好地……爱她们啊……”\n然后，她就在我的面前，在所有人的注视下，彻底地，化作了一捧……温暖的、黯淡的灰烬，轻轻地，洒满了那座冰冷的王座。\n外面，传来了山呼海啸般的、庆祝胜利的欢呼声。\n人们在庆祝暴君的死亡。\n人们在庆祝光明的到来。\n人们在庆祝……她们的自由。\n我跪在那座空荡荡的王座前，伸出颤抖的双手，小心翼翼地，接住了那些……还在不断飘落的、她最后留下的、温暖的余烬。\n我爱她们。\n是的。\n我爱着这些……善良的、勇敢的、教会了我什么是“爱”的人们。\n可是……\n§R我也是……那么那么地……爱着这个……被她们，视为不共戴天之敌的、世界上最大的……坏蛋啊！！！§!"
PAO.19.a: "§t（盛大的庆典§!§1 ，§!§L无声的葬礼）§!"

PAO.20.t: "公主的“裁决”"
PAO.20.d: "我把她们都请来了。\n那些……吵得最厉害的、工人的代表，和农民的代表。\n我想……像索拉娜那样，听一听她们的声音，然后，为她们，做出一个“公平”的裁决。\n可是……我听不懂。\n工人们说，没有她们生产的工具，农民就无法耕种。\n农民们说，没有她们种出的粮食，工人就会饿死。\n她们说的……好像，都很有道理。\n这就像我花园里的两朵花。一朵是红色的，一朵是白色的。我不能说，哪一朵，比另一朵，更漂亮。因为她们都很好看。\n她们还在吵。声音越来越大，整个房间，都变得和生者的世界一样，吵闹不堪。\n我有点……不知所措了。\n然后，我想起了一个索拉娜曾经教给我的、她说是在她故乡很流行的、一种解决纷争的“游戏”。\n我让侍从，拿来了很多很多……黑色和白色的、很光滑的小石子。\n我把黑色的，分给了工人代表。把白色的，分给了农民代表。\n然后，我用我最温柔、也最认真的语气，对她们说：\n“……那个……我们，不吵了好不好？”\n“我们来玩一个游戏吧。你们把自己的石子，放在我面前。谁放的石子……比较好看，就算谁赢，怎么样？”\n整个房间，瞬间，就安静了下来。\n所有的人，都用一种我完全无法理解的、混杂着震惊、茫然和一点点……想笑又不敢笑的表情，看着我。"
PAO.20.a: "§1（是我又说错话了吗？）§!"

PAO.21.t: "那第一声哭啼"
PAO.21.d: "我去看望那个新生儿了。\n那是我第一次，如此近距离地，观察一个刚刚来到这个世界的、最纯粹的生命。\n她好小，好软，皮肤像我花园里最娇嫩的花瓣。她睡着的时候很安静，呼吸均匀，像一团小小的、温暖的光。\n我看着她，突然就想到了一个问题。\n一个我统治了夜莺国度上万年，却从未思考过的问题。\n我们亡灵，从诞生之初，形态与本质就已固定。一个士兵的灵魂，将永远是士兵；一个工匠的灵魂，也永远是工匠。我们只是在永恒的寂静里，重复着自己被赋予的角色。\n可她不一样。\n这个小小的、现在只会睡觉和哭泣的生命，她未来会变成什么样子呢？\n她会长大，会学习，会爱上一个人，会为了某个理想而欢笑或流泪。她的灵魂，会像一块未经雕琢的璞玉，在漫长的岁月中，被她所经历的一切，慢慢地，塑造成一个独一无二的、无法被复制的形状。\n是什么东西，决定了这一切？\n是她与生俱来的天性？是她父母的教导？还是……这个，由我守护的、吵闹又温暖的世界？\n就在我沉思的时候，那个小小的婴儿，突然醒了。\n她睁开眼睛，看到了我这个陌生的、散发着冰冷气息的存在。然后，她毫不意外地，张开嘴，发出了来到这个世界上之后，第一声响亮的、中气十足的哭啼。\n那哭声，一点也不好听。很吵闹。\n可我……却好像，从那充满生命力的哭声里，听到了一首……比我听过的任何一首安魂曲，都更动听的歌。"
PAO.21.a: "§1（这就是生命的声音吗？）§!"

PAO.22.t: "初次见面"
PAO.22.d: "摇篮，打开了。\n伴随着一阵柔和的、如同风铃般的声音，那个我倾注了所有希望的女孩，缓缓地，睁开了她的眼睛。\n那是一双……和她一模一样的、火焰般的红色眼眸。\n但里面，没有了我所熟悉的、那些痛苦的伤痕与燃烧的野心。只有一种……像刚刚出生的雏鸟般、对这个世界最纯粹的、清澈见底的好奇。\n她从摇篮中坐了起来，黑色的双马尾随着她的动作，俏皮地晃动着。她看到了我，没有胆怯，也没有疏离。她只是歪了歪头，然后，露出了一个比我花园里所有花朵加起来，还要灿烂的笑容。\n“你好呀！”她的声音，像阳光下跳跃的溪流，充满了清脆的活力，“你是……创造了我的公主殿下吗？这里，就是你说过的、那个需要被拯救的世界吗？故事里那些需要被打倒的坏蛋，和需要被保护的好人们，都在哪里呀？”\n我……被她问得愣住了。\n我为她，准备了上万句，温柔的、充满爱意的欢迎词。\n可我……一句，也说不出来。\n她不是她。\n她没有她那双，总是在深夜里，凝视着我的、复杂的眼睛。\n她没有她那种，总是带着一丝嘲讽与苦涩的、却又无比温柔的笑容。\n她更没有……我们之间，那些纠缠了上万年的、沉重的、无法被割舍的记忆。\n她是一个崭新的、一尘不染的、比我能想象到的最完美的光，还要耀眼的存在。\n她……是我的“理想”。\n也是……我永恒的、再也无法被弥补的“失去”。\n我看着她那双，充满了对“正义”与“冒险”的、天真渴望的眼睛。\n眼泪，不知不觉地，就落了下来。\n“……你怎么哭了呀，公主殿下？”她有些担心地，凑了过来，用她那双温暖的、小小的手，轻轻地，擦去了我脸上的泪水，“是那些坏蛋，欺负你了吗？你告诉我，她们在哪里！我现在，就去为你，打倒她们！”\n我看着她，终于，露出了一个……比哭，还要悲伤的笑容。\n我轻轻地，握住了她的手。\n“……不。我没有哭。”\n“……我只是，太开心了。”\n“……欢迎回来。”\n“……我的……‘光明’。”\n“……露西莉亚。”"
PAO.22.a: "§1你好，露西莉亚。再见，瓦伦蒂娜。§!"

PAO.111.t: "一份来自永夜的“请求”"
PAO.111.d: "今日，一份极不寻常的外交信函，被送到了我们的面前。\n它来自那个一直以来，都与世隔绝的、神秘的国度——夜莺之国。\n信使并非凡人，而是一个沉默得如同雕像般的、身着华丽盔甲的亡灵骑士。她没有说一句话，只是将信笺和那朵诡异的黑百合放下后，便化作一缕青烟，消散在了空气之中。\n信的内容，与其说是外交辞令，不如说……是一段来自古老童话的、轻柔的呓语。\n信上写着：\n“致此地此刻的看管者：\n我的姐妹，在你们那里，遗失了一件……她心爱的玩具。那是一座名叫‘莉兰迪亚’的城市。\n她现在，很想念它。\n所以，请你们，把它还给我们，好吗？\n我已为你们，准备好了答谢的礼物——那将是，一个永远不会有纷扰的、安安静静的美梦。\n请尽快，做出你们的选择。\n因为……我的姐妹，她，已经没有多少耐心，再等下去了。”"
PAO.111.a: "这是赤裸裸的威胁！"
PAO.111.b: "我们……无法与这样的存在为敌。"

PAO.112.t: "[FROM.GetName]拒绝了我们"
PAO.112.d: "“那些凡人……拒绝了我的‘请求’。\n她们不懂。那座吵闹的，沐浴在阳光下的城市对她们而言，或许是所谓的‘战略要地’，是‘经济中心’。\n可对我而言……那只是，一件能让她……重新露出笑容的、小小的玩具。\n既然她们不肯还给我...”"
PAO.112.a: "§R那我只好自己去拿了§!"


##新闻事件##
PAO_news_event_background: "£PAO_news"
PAO_news.1.t:"$news_event_background$熄灭的野火"
PAO_news.1.d:"战争结束了。\n那支曾点燃了整个南美大陆的“野火革命军”，她们的故事，在今天迎来了最后的结局。\n在莉兰迪亚城的最终决战中，夜莺之国的亡灵军团，以一种无可阻挡的、沉默的伟力，彻底击溃了革命军最后的抵抗。\n据报道，在战斗的最后时刻，夜莺之国的两位神秘统治者——公主莉莉安娜与归来的女王索拉娜，并肩出现在了战场之上。她们所过之处，所有的抵抗都化为了寂静。\n随着莉兰迪亚城的陷落，这颗曾在世界舞台上闪耀过的红色新星，彻底陨落了。野火……熄灭了。整个南美，都在这突如其来的、绝对的寂静面前，陷入了长久的沉默。"
PAO_news.1.a:"……一个时代，结束了"
PAO_news.2.t:"$news_event_background$最终的审判"
PAO_news.2.d:"世界，正注视着一场前所未有的、怪诞的战争。\n昨日，那个刚刚平息了内乱的莉兰迪亚，再次爆发了冲突。但这一次，不再是女王对人民的镇压。\n而是……女王，邀请了所有的人民，来审判她自己。\n据报道，女王索拉娜遣散了所有忠于她的禁卫队，独自一人，固守在王宫之中。而她的“共治者”，那位神秘的亡灵公主莉莉安娜，则站在了起义军的一方，亲自领导着那些……曾被索拉娜压迫过的人们，向着那座空无一人的城堡，发起了最后的、名为“审判”的进攻。\n这不像是一场战争。\n更像是一场……早已写好了结局的、漫长的、公开的处刑。\n整个大陆，都陷入了一种诡异的寂静之中。所有人都想知道，这场由暴君亲手导演的、献给自己的葬礼，将如何落幕。"
PAO_news.2.a:"她，到底想做什么？"
PAO_news.2.b:"索拉娜..."
