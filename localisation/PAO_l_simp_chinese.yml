  PAO_Resentful_deceased_desc:0 "§L“§R洛维尼亚……洛维尼亚……§!\n你在那里玩得开心吗？瓦伦蒂娜。\n驱逐那些叫‘公社’的玩具，帮助那些叫‘贵族’的玩偶。你用着从我这里偷走的力量，在那片吵闹的、活人的土地上，尽情地展示着你的威风。\n可是，你听。你仔细听。\n我们的家……正在碎掉。\n你带走了我们最精锐的军团，于是，我们完美的寂静，第一次，出现了裂痕。那些本该安眠的灵魂开始躁动，那些本该沉寂的怨念正在尖叫。\n而你……知道这一切。你却……依然拒绝回来。\n§1……没关系。\n既然你不愿意回来……\n……那我就，亲自去把你，带回来。§!”§!"
