PAO_idea_sky_Attack: "天空骑士团"
PAO_idea_sky_Attack_desc: "当骑士学会了飞翔，当魔法少女拥有了大地，这个世界上，就再也没有我们无法一起战胜的“巨龙”了。"
####国策####
#政治线国策
PAO_anjing: "嘘，安静一点"
PAO_anjing_desc: "“最近……国度里有些吵闹。那些本该安眠的孩子们，好像都在做着不安稳的梦。这不好。索拉娜她……喜欢安静的地方。我想，只要我轻轻地拜托她们，她们一定会为了我们，重新变回乖孩子的，对不对？”"

PAO_xtgs: "是想听故事了吗？"
PAO_xtgs_desc: "“她们还是……很吵闹。我有些明白了。一定是因为，索拉娜不在，没有人再给她们讲那些……关于阳光和星星的、有趣的故事了。那么，就由我来吧。我会让我的侍从，去每一个角落，把我记得的所有故事，都讲给她们听。听完了故事，她们就该安稳睡去了吧。”"

PAO_dsgj: "把家里打扫干净"
PAO_dsgj_desc: "“故事……好像也没有用。她们开始……弄乱我们的家了。那些漂亮的、积了万年尘埃的街道，被她们弄得一团糟。这可不行。等索拉娜回来看到，她会不开心的。我要让侍卫们，去把那些不听话的孩子，暂时请到一边去，然后，把我们的家，重新打扫得干干净净。”"

PAO_bthn: "为什么不听话呢？"
PAO_bthn_desc: "“我……不明白。我真的不明白。为什么你们就是不肯听话呢？我给了你们安静，给了你们故事，也给了你们一个干净的家。可你们……却开始互相伤害了。你们在破坏我们最重要的东西。你们在……破坏我们曾拥有过的、最完美的回忆。”"

PAO_tywb: "请不要讨厌我！！！"
PAO_tywb_desc: "“侍卫们……也挡不住她们了。到处都是裂痕，到处都是……不和谐的声音。我的家，快要碎掉了。如果……如果索拉娜回来，看到的是这样一副景象……她一定会讨厌我的吧。她会觉得，我连我们唯一的家，都看管不好。我……不能让她看到这个样子的夜莺之国。\n绝对，不能！！！”"

PAO_wlcj: "我们曾一起约定过永远"
PAO_wlcj_desc: "“对不起。真的……对不起。我不想伤害你们，你们每一个，都是我珍视的孩子。可是……你们正在毁掉，我唯一珍视的东西。所以……请原谅我。为了能让她回来时，还能看到一个……像我们曾经约定过的那样、完美的、永恒的家。我必须……亲手，将那些不和谐的音符，全部抹去了。”"

PAO_wmdj: "为了我们的家"
PAO_wmdj_desc: "“好了，不听话的孩子们，都已经重新睡着了。可是……她们把我们的家，弄得好乱。到处都是灰尘和裂痕。这不行。我要让侍从们，把每一块地砖都擦亮，把每一座雕像都修复好。我要让这里，变回你最喜欢的、那个一尘不染的样子。”"

PAO_bkcl: "别把位置空出来"
PAO_bkcl_desc: "“家里……变得比以前更空旷了。好多好多熟悉的身影，都不见了。没关系。我会用我自己的力量，去填满那些空出来的位置。我会创造出新的、更听话、也更完美的侍从。她们会和我一起，静静地，等待着这个家另一位主人的归来。”"
PAO_nnsg: "你的那束光"
PAO_nnsg_desc: "“我总是会想起，你第一次来到这里时，你身上的那束光。那么亮，那么暖，把我的整个世界都照亮了。我想……我不能再只是等待了。我要试着，去重新找到那束光。我会派我最安静的孩子们，去往那个……你现在所在的、吵闹的生者世界，去寻找你的踪迹。”"

PAO_zshn: "她们在伤害你？？？"
PAO_zshn_desc: "“我的孩子们，回来了。她们带回来的消息，让我的心……好疼。她们说，你在那个世界，过得一点也不好。有一群叫‘野火’的坏孩子，她们在伤害你，在试图……熄灭你身上的光。她们……怎么敢？她们怎么能……这样对你？”"

PAO_bzqf: "不准再欺负她了！！！"
PAO_bzqf_desc: "“她们……竟然把你逼到了那个地步。不行。我决不允许。就算……就算你背叛了我，就算你偷走了我最重要的东西，可是……欺负你的人，也只能是我。那些凡人，那些……坏孩子，凭什么，能让你露出那种……快要碎掉的表情？”"

PAO_jnhj: "请让我来接你回家！"
PAO_jnhj_desc: "“索拉娜。你听。我不管什么王座，也不管什么公社了。我现在……只想去你的身边。我不会再让你，一个人，待在那个冰冷的、危险的世界里了。我会为你，挡住所有刺向你的刀剑。我会为你，驱散所有让你不开心的阴影。然后……在你最需要的时候，伸出手，把你从那片泥潭里，拉出来，带回到这个……至少，不会再有任何人，能伤害到你的、安安静静的家里来。”"

PAO_tszl: "嘘,她睡着了"
PAO_tszl_desc: "“我把她带回来了。她很累，身上有很多伤口，像一只在外面被欺负了很久、终于回到家的小猫。现在，她正在我的房间里，安安稳稳地睡着了。我命令了所有的侍从，不准发出任何声音，不准让任何光线，打扰到她的梦境。嘘……让她好好地，睡一觉吧。”"

PAO_sygs: "把所有的门都关上"
PAO_sygs_desc: "“外面的世界，太危险了。我不喜欢。她，也一定不喜欢了。从今天起，我们要把所有的门都关上。不再去听那些吵闹的声音，也不再去看那些刺眼的光芒。这个家，现在是我们两个人唯一的、也是最后的城堡了。我要让它变得……谁也进不来。”"

PAO_zjhy: "你我二人的花园"
PAO_zjhy_desc: "“她曾说，她喜欢花。我记得的。所以，我要在我们的城堡里，为她建一座独一无二的花园。我们不再需要外面的土地了，我会让我的孩子们，用魔法和我们自己的力量，在这片寂静的国度里，种出永不凋谢的花朵，流淌永不清澈的溪流。这里，将成为我们自给自足的、永恒的乐园。”"

PAO_bzll: "不准再让她流泪"
PAO_bzll_desc: "“我偷偷去看她的时候，发现……她哪怕是在睡觉都还在皱着眉头，像是在做着很可怕的噩梦。她一定……还在害怕那些叫‘野火’的坏孩子。我绝不允许。我决不允许，再有任何东西，能让她流一滴眼泪。我要让我的侍卫们，变得比以前，更强大，更坚固。”"

PAO_nswm: "那是我们的东西"
PAO_nswm_desc: "“她醒来的时候，很少说话。但有一次，她看着地图，指着那片……曾经属于她的、叫‘莉兰迪亚’的地方，眼神里，有一种我从未见过的、很悲伤的情绪。我明白了。那就像……一个孩子被抢走了心爱的玩具。虽然那个玩具让她受了很多伤，可那……依然是她的。是我们的。”"

PAO_nhwj: "把你的玩具拿回来"
PAO_nhwj_desc: "“好了，你已经休息得够久了。现在，那些坏孩子，好像要找上门来了。别怕。这一次，我陪着你。我们一起，去把那个……被她们抢走的、属于你的玩具，堂堂正正地，拿回来。然后，我们就再也不出去了，好不好？”"

PAO_wmsq: "帷幕，就在此刻升起"
PAO_wmsq_desc: "“你听，索拉娜。\n外面，传来那些坏孩子的脚步声了。她们好像……以为我们躲在这里，是因为害怕。她们不懂。\n我们只是……在等待。等待一个最安静的、只属于我们的舞台。等待所有的观众，都已经到齐。\n现在，帷幕，终于要升起来了。\n去换上你最漂亮的盔甲吧。然后，站在我的身边。\n我们要一起，为她们，献上一场……最华丽、也是……最后的，谢幕演出。”"

PAO_rlzc: "永恒的莉兰迪亚"
PAO_rlzc_desc: "“你回来了。\n可是……你的那团火，好像，熄灭了。\n你不再笑了，也不再……对我讲那些关于未来的、闪闪发光的故事了。你只是，每天，都坐在窗边，安静地，看着外面那片……让你伤痕累累的、吵闹的世界。\n……没关系。\n既然你不喜欢阳光了。\n那我就……为你，建一座没有阳光的城堡吧。\n我会让我的孩子们，用最冰冷的石头，和最沉默的影子，把这里，重新变回你我最初相遇时、那个安安静静的样子。\n再也没有人，能伤害你了。\n再也没有梦，能让你心碎了。\n我们……就在这里，永远，在一起，好不好？”"

PAO_gdwj: "给她们……更多的玩具"
PAO_gdwj_desc: "“她们……好像还是不开心。我有点明白了。一定是因为，她们觉得工作太无聊了。索拉娜，我记得你给我讲过，生者，是需要‘娱乐’的。那么，我就给她们娱乐吧。我会让我的孩子们，为她们建造最华丽的剧院，上演永不落幕的戏剧。有了这些……她们就该安静下来了吧？”"

PAO_zssz: "只是……睡着了而已"
PAO_zssz_desc: "“她们好像……更累了。有好多好多的人，开始走不动路，然后……就倒在路边，睡着了，再也醒不过来。没关系。我会让我的孩子们，把她们倒下的身体，变成新的、不会再感到疲惫的‘夜莺的魂灵’。这样，她们就能以另一种方式，永远地，陪在我们身边了，对不对？”"

PAO_ytpn: "为什么……要逃跑呢？"
PAO_ytpn_desc: "“为什么……？我给了你们安稳，给了你们快乐，甚至给了你们永恒。可为什么……你们还要逃跑呢？要逃回那个……充满了痛苦和背叛的、外面的世界去？这里……不好吗？还是说……我，做得还不够好？”"

PAO_wltx: "索拉娜的叹息"
PAO_wltx_desc: "“‘够了，莉莉安娜。’\n这是……你回来以后，第一次，用这么严肃的语气，和我说话。\n你看着窗外那些……麻木的、如同行尸走肉般的人们，眼神里，是我看不懂的、复杂的痛苦。\n你说：‘你看看她们！她们不是你的玩偶！她们是活生生的人！你这样，是在……毁掉她们，也是在毁掉你自己！’\n......”"

PAO_nljw: "那么……你来教我，好吗？"
PAO_nljw_desc: "“我……被你说得愣住了。我只是……想用我的方式，去对她们好而已。\n我看着你，看着你那双因为愤怒而燃烧着火焰的眼睛，然后，我轻轻地，拉住了你的手，用我能想到的、最天真、也最认真的语气，问你：\n‘……可是，索拉娜。’\n‘……在你过去的那个王国里，那些活生生的人们，她们……就不哭了吗？’”"

PAO_lzyl: "两种……不同的眼泪"
PAO_lzyl_desc: "“你的火焰……在那一刻，熄灭了。\n你看着我，像是看着一面镜子。一面……照出了你所有不想再回忆的过去的、冰冷的镜子。\n你什么也没说，只是……松开了我的手，然后，慢慢地，走回了你自己的房间。\n我好像……又说错话了。\n可是……眼泪和眼泪，到底……有什么不一样呢？我还是……不懂啊。”"

PAO_jzy: "就这样"
PAO_jzy_desc: "“莉莉安娜，你是对的。人民，是需要被‘管理’的。那些哭声，太吵了。从今天起，由我来。我会用我最熟悉的方式，让这座城市，重新变回你最喜欢的、安安静静的样子。你看好了，我的公主。我会为你，献上一场……最完美的统治。”"

PAO_bdsm: "下一顿饭在哪里？"
PAO_bdsm_desc: "“反抗的根源，是‘多余’的思想。而‘多余’的思想，源于‘多余’的力气。很简单。我会精确地计算出，一个人，为了活下去，每天所需要的、最少的食物。不多，也不少。然后，由我的禁卫军，定时、定量地，分发给她们。当她们所有的时间和精力，都只够用来思考‘下一顿饭在哪里’时，她们就再也没有力气，去想那些……不该想的东西了。”"

PAO_bdsm2: "下一顿饭在哪里？"
PAO_bdsm2_desc: "“反抗的根源，是‘多余’的思想。而‘多余’的思想，源于‘多余’的力气。很简单。我会精确地计算出，一个人，为了活下去，每天所需要的、最少的食物。不多，也不少。然后，由我的禁卫军，定时、定量地，分发给她们。当她们所有的时间和精力，都只够用来思考‘下一顿饭在哪里’时，她们就再也没有力气，去想那些……不该想的东西了。”"

PAO_bdsm3: "下一顿饭在哪里？"
PAO_bdsm3_desc: "“反抗的根源，是‘多余’的思想。而‘多余’的思想，源于‘多余’的力气。很简单。我会精确地计算出，一个人，为了活下去，每天所需要的、最少的食物。不多，也不少。然后，由我的禁卫军，定时、定量地，分发给她们。当她们所有的时间和精力，都只够用来思考‘下一顿饭在哪里’时，她们就再也没有力气，去想那些……不该想的东西了。”"

PAO_hxzh: "让她们互相憎恨"
PAO_hxzh_desc: "“团结，是最低效，也是最危险的东西。我会把她们，重新分开。我会告诉城东的工人，是城西的农民，偷走了她们的面包；我会告诉南边的矿工，是北边的伐木工，抢走了她们的工作。我会为她们，制造无数个新的、小小的‘敌人’。当她们忙于互相憎恨时，她们就会忘记……谁，才是她们真正的敌人。”"

PAO_wyxw: "在这唯一的希望里"
PAO_wyxw_desc: "“当她们陷入最深的绝望，当她们被饥饿、猜忌和仇恨，折磨得体无完肤时……我会给她们，一个‘希望’。我会告诉她们，只要她们足够忠诚，足够努力，她们就有机会，成为‘被选中的人’，离开这片地狱，进入我和莉莉安娜所在的、那座永恒的城堡里。我会让她们，为了这个虚无缥缈的希望，像疯狗一样，互相撕咬，互相出卖。”"

PAO_kxlm: "你是否开心？"
PAO_kxlm_desc: "“‘索拉娜……’\n那天晚上，你找到了我。你看着窗外那座……死气沉沉的、‘绝对服从’的城市，你的眼睛里，第一次，没有了光。\n‘……这就是……你想要的吗？’你轻声问我，‘……我觉得……她们，比以前，哭得更伤心了。只是……没有声音了而已。’\n我看着你。看着你那双……因为悲伤而变得比星辰还要黯淡的眼睛。\n我笑了。\n‘不，莉莉。’我说，‘……这不是我想要的。这是……我欠她们的。’”"


PAO_yhxm: "但野火从未熄灭"
PAO_yhxm_desc: "“人民……终于，再一次，拿起了武器。\n在经历了最深的黑暗之后，她们终于明白，唯一的救赎，只在她们自己手中。而这一次，点燃她们怒火的，是我。\n我用最残酷的方式，教会了她们……什么是真正的敌人，什么是真正的团结。我逼着她们，成为了……我曾经最畏惧的、那个样子的‘野火’。\n现在，她们来了。带着足以烧尽一切的怒火，向着这座……我为她们亲手打造的、最坚固的牢笼，发起了最后的进攻。”"

PAO_lxag: "理想与哀歌"
PAO_lxag_desc: "“她们……相信了我。\n在我的请求下，人类与亡灵，第一次，放下了武器。我把那些饥饿的人，带进了城堡，为她们端上了热汤；我把那些受伤的禁卫军，安置在庭院，为她们唱起了安魂的歌谣。\n然后，我找到了你，索拉娜。\n你就坐在那张冰冷的王座上，像一尊即将熄灭的、灰色的雕像。\n我把我在外面看到的一切，都告诉了你。我告诉你，那些被你逼上绝路的人们，在喝到第一口热汤时，流下的眼泪；我告诉你，那些只知道服从的禁卫军，在听到我的歌声时，眼神里第一次出现的、名为‘安宁’的光。\n我问你：‘你看，索拉娜。她们……其实，都只是想要活下去的、普通的孩子啊。’\n‘……为什么，我们不能……一起，给她们一个真正的家呢？’\n你沉默了很久。\n然后，你抬起头，看着我，那双已经熄灭了很久的眼睛里，第一次，重新燃起了一丝……我看不懂的、无比复杂的火焰。\n你对我说：\n‘……莉莉。你还记得吗？我曾经……也有一个家。’\n‘我也曾……有过一个，关于‘理想’的、很长很长的梦。’”"

PAO_lxag2: "理想与哀歌"


PAO_zhzl: "献上最后的葬礼"
PAO_zhzl_desc: "“……不。\n我哭着，摇着头，求你，不要那么做。\n可你……只是微笑着，揉了揉我的头发。就像……很久很久以前那样。\n‘……听话，莉莉安娜。’\n‘这是……我唯一能，为你，也为她们，做的，最后一件事了。’\n然后，你就走了。\n你独自一人，回到了那座冰冷的王座上。你遣散了所有忠诚于你的禁卫军，只留下了一座……空荡荡的城堡。\n你对整个世界，发出了你作为女王的、最后一道，也是最残忍的命令——\n‘我，索拉娜，就在这里。’\n‘……来吧。’\n‘……来，审判我。’”"

PAO_dswg: "为你戴上这顶王冠"
PAO_dswg_desc: "“她们都在看着我。那些曾憎恨你的人，和那些曾追随你的人，现在，她们的眼中，都只剩下一种……混杂着悲伤与期盼的、复杂的眼神。她们把这顶……用你的灰烬换来的王冠，戴在了我的头上。它好重，索拉娜。重得……我快要喘不过气了。可是……这是你留给我的，对不对？那么，我就会……好好地，替你戴着它。”"

PAO_zhyw: "你的最后一个愿望"
PAO_zhyw_desc: "“‘要……好好地……爱她们啊。’\n这是你留给我的、最后一个愿望。我不是很懂……‘爱’，到底是什么。可是，我答应过你。所以，我会去学的。我会把我最好的东西，都给她们。我会让她们，吃饱，穿暖，再也不会为了什么东西而哭泣。我……会努力，成为一个你所希望我成为的、‘好’的女王。”"

PAO_zcsm: "她们在吵什么呀？"
PAO_zcsm_desc: "“我以为……只要让所有人都吃饱了，她们就会变得和我那些孩子一样，安安静静的了。可她们却开始吵架了。工人们说，工厂的产出应该优先分配给城市；农民们说，没有她们的粮食，城市就是一座空壳。她们……好像都有自己的道理。索拉娜……你以前，是怎么解决这些吵闹的声音的？”"

PAO_bhsh: "一个不会说话的学生"
PAO_bhsh_desc: "“我好像做错了。无论我选哪一边，另一边的人，都会不开心。我把国家……弄得更乱了。于是，我不再颁布命令了。我只是，每天，都悄悄地，去她们的会议室外面，听她们吵架。我听她们说，什么是‘剩余价值’，什么是‘工农联盟’。那些词，我听不懂。可我……好像能从那些吵吵闹闹的声音里，听到一种……我从未听过的、名为‘希望’的东西。”"

PAO_bhsh2: "一个不会说话的学生"
PAO_bhsh2_desc: "“我好像做错了。无论我选哪一边，另一边的人，都会不开心。我把国家……弄得更乱了。于是，我不再颁布命令了。我只是，每天，都悄悄地，去她们的会议室外面，听她们吵架。我听她们说，什么是‘剩余价值’，什么是‘工农联盟’。那些词，我听不懂。可我……好像能从那些吵吵闹闹的声音里，听到一种……我从未听过的、名为‘希望’的东西。”"

PAO_bzhl: "笨拙的回礼"
PAO_bzhl_desc: "“她们教会了我很多东西。我也想为她们，做一点什么。我不会治理国家，也不会发展经济。我唯一会的……就只有，我那些……安安静静的魔法了。我试着，把我的力量，注入到干涸的土地里，让它重新长出庄稼；我试着，用我的歌声，去安抚那些在战争中，留下了伤痕的心。这是我唯一能为她们做的、笨拙的回礼了。”"

PAO_smxz: "生命的“形状”"
PAO_smxz_desc: "“今天，我看到一个人类的孩子出生了。她那么小，那么软，哭声那么响亮。我看着她，突然，就想到了一个问题。一个……我以前，从来没有想过的问题。一个人的灵魂，到底是什么形状的呢？是什么东西，让一个哭泣的婴儿，最终，变成了……一个会笑、会爱、会为了理想而战的、独一无二的‘野火’？或者……变成一个，像你一样，充满了火焰与伤痕的、复杂的‘女王’？”"

PAO_yqcl: "如果一切重来"
PAO_yqcl_desc: "“我好像有点明白了。灵魂的形状，是由她所经历的一切，所塑造的。是贫民窟的泥泞，是王座的冰冷，是背叛的伤痕，是……所有所有的一切，才把你，变成了现在的你。可是……如果……如果有一个灵魂，她拥有和你一样的、最纯粹的、那束光一样的内核……却没有经历过那些痛苦，没有背负那些罪责……那她……会长成什么样子呢？她……会笑吗？”"

PAO_ycjh: "请再给我一次机会"
PAO_ycjh_desc: "“我不要。我不要那个……背负了所有痛苦的你。我只要……那个最初的、会对我笑、会给我讲故事的、温暖的你。夜莺的古籍里，记载着一种禁忌的魔法。一种……能从灰烬中，重新凝聚灵魂的仪式。但从来没有人，用它来复活过一个你这样，拥有过那么炽热生命的人类。她们都说，这是不可能的。可是……我想试试。我想再见你一次。然后，亲口告诉你，这一次，我学会了。我会为你，创造一个你一直想要的、温暖的、再也没有人会哭泣的世界。然后，我们就再也不分开了。”"

PAO_nzsj: "为你，逆转四季"
PAO_nzsj_desc: "“她们说，生者的世界，有一个无法被违抗的规则。\n她们说，花开了，就会谢；人死了，就不能再回来。\n……可我，是冥界的公主啊。\n在我的国度里，时间是静止的，凋零是无需存在的。我能让枯萎的花朵重新绽放，能让破碎的灵魂回归寂静。\n那么……为什么，我就不能……让一个迷了路的孩子，重新找到回家的路呢？\n你们不懂。你们只是生者，你们畏惧死亡。可我……生于死亡。我比你们，都更懂得，灵魂的重量与形状。\n我会用我所有的知识，用我身为公主的、全部的权能。\n我会为你，逆转她们所谓的‘规律’。\n我会为你，将那寒冷的冬天，重新变回……我们初次相遇时、那个温暖的、开满了永不凋谢的花朵的春天。”"

PAO_nzsj_tt: "解锁特殊研究项目:§Y摇篮曲计划§!"

PAO_dysg: "第一束光芒"
PAO_dysg_desc: "“我要做的第一件事，是为你，找到这个世界上最纯粹的光。我走遍了我们的国度，学会了所有孩子们最天真的笑声，学会了所有恋人们最真诚的誓言，学会了所有从绝望中重新站起来的人们，眼中闪烁的第一缕希望。我要把这些，作为你灵魂最初的基石。”"
PAO_dysg_tt: "§Y？？？§!将在未来获得§Y全属性增长§!。"

PAO_yxgs: "英雄的故事"
PAO_yxgs_desc: "“你不能只拥有光明，你还需要拥有勇气。我找来了那些最勇敢的人们，让她们在摇篮边，为你讲述那些关于反抗与牺牲的故事。我要让你知道，即使是在最深的黑暗里，也总有人，愿意为了守护他人而燃尽自己。我要让你，从一开始，就爱上这些……闪闪发光的人们。”"

PAO_yxgs_tt: "§Y？？？§!将在未来获得§Y特质：勇敢§!。"

PAO_cdyl: "擦掉所有的眼泪"
PAO_cdyl_desc: "“我翻遍了所有的古籍，删掉了那些……所有会让你感到悲伤的故事。我抹去了那些关于背叛、关于失去、关于求而不得的诗篇。在为你准备的世界里，不应该有眼泪。我只要你，永远，都像太阳一样，明亮，而快乐。悲伤，就由我一个人来背负，就好了。”"

PAO_cdyl_tt: "§Y？？？§!将在未来获得§Y特质：§!§t忠于理想§!。"

PAO_myzl: "没有重量的剑"
PAO_myzl_desc: "“你当然需要一把剑。但你的剑，不应该沾染任何仇恨。我为你，用最纯粹的月光和最坚定的誓言，锻造了一把没有重量的剑。它只会在你需要保护弱小的时候，才会出现。它挥舞时，带起的，应该是希望的风，而不是……悲伤的血。”"

PAO_myzl_tt: "§Y？？？§!将在未来获得§Y特质：§!§O守护之剑§!。"

PAO_xlb: "醒来吧，我的挚爱"
PAO_xlb_desc: "“好了。我把我能想到的、这个世界上所有最好的东西，都给了你。我为你，创造了一个完美的、一尘不染的灵魂。虽然……它可能和我预想的，有一点点不一样。它好像……比我想象的，要更……‘天真’一点。不过，没关系。现在，摇篮，即将打开。醒来吧，我的露西莉亚。然后，去拥抱这个……我为你准备好的、崭新的世界吧。”"

PAO_lxlygaiming: "§Y？？？§!改名为§Y露西莉亚§!"

PAO_bdhy: "不容置疑的心"
PAO_bdhy_desc: "“她们说，智慧，源于怀疑。可我……不这么认为。怀疑，只会带来痛苦和猜忌。我要为你，塑造一颗永远不会怀疑的心。你会无条件地，相信所有的美好，相信所有的善良，相信每一个向你伸出的手。你会像一个……永远追逐着明天的骑士，眼中只有那个值得被拯救的世界。”"

PAO_dytk: "世界的第一课"
PAO_dytk_desc: "“她像一张白纸，对这个世界充满了好奇。我成为了她的老师。我教给她的第一课，不是如何统治，而是如何去爱。我带她去看望那些人民，让她看到她们脸上最真诚的笑容。我告诉她，我们所做的一切，就是为了守护这些笑容。这成为了她心中，最坚定的、唯一的信条。”"

PAO_myhr: "没有坏人的童话故事"
PAO_myhr_desc: "“她最喜欢听我讲故事。我为她，搜集了国度里所有关于英雄与骑士的童话。但在我讲给她听之前，我都会悄悄地，把故事的结局改掉。在我的故事里，巨龙最终会被感化，巫婆也会认识到自己的错误。我不想让她……那么早就知道，这个世界上，还存在着一种……无法被‘爱’所改变的、纯粹的‘恶’。”"

PAO_shzj: "黎明的前奏曲"
PAO_shzj_desc: "“她展现出了惊人的战斗天赋，就和……和她一样。但我不想让她，成为一个征服者。我为她打造了一把最华丽、也最‘温柔’的剑。我告诉她，这把剑，永远，只能用来保护那些无法保护自己的人。它不能被用来索取，也不能被用来复仇。它唯一的使命，就是守护。”"

PAO_kdkq: "第一次……看到哭泣"
PAO_kdkq_desc: "“今天，她第一次，看到了人民的眼泪。那是一个在事故中失去了亲人的家庭。她无法理解。她冲到那个哭泣的人面前，笨拙地，把我教给她的所有‘道理’，都说了一遍。她问她们，为什么不笑呢？我们的国家，不是已经没有压迫和饥饿了吗？她那份纯粹的、无法理解悲伤的善意，反而……让那些哭泣的人，哭得更伤心了。”"

PAO_wfdd: "无法……打倒的敌人"
PAO_wfdd_desc: "“她开始……产生疑问了。她第一次，向我提出了一个，我不知道该如何回答的问题。她问我：‘莉莉安娜，如果……有一个坏人，她不是因为饥饿，也不是因为悲伤，她就是……单纯地，喜欢看别人哭泣。那……我还能用我的‘爱’，去感化她吗？’我看着她那双，第一次，出现了‘迷茫’的红色眼睛，沉默了很久。”"

PAO_wdqs: "出发吧，我的骑士"
PAO_wdqs_desc: "“她……做出了自己的决定。她告诉我，她要去外面的世界看一看。她要去亲眼见证，那些……我没有写在童话书里的、真实的故事。她要去寻找那个……关于‘无法被感化的恶’的、最终的答案。我没有阻止她。因为我知道，一个被关在摇篮里的孩子，是永远也无法真正长大的。我只是，为她披上了最坚固的盔甲，为她准备了最好的行囊。然后，在她出发的前一夜，对她说：‘去吧。然后，一定要……平安回来。’”"

PAO_bbxy: "不被需要的“守护”"
PAO_bbxy_desc: "“我找到了她们，那些传说中守护着世界的魔法少女。她们很强大，也很……骄傲。她们从云端之上俯瞰着我们，就像看着一群需要被保护的、脆弱的羊群。她们说她们的战斗是为了我们，可她们的眼神里，却没有一丝一毫的温度。她们在‘守护’人民，却从未真正地，走进过人民之中。”"

PAO_ynbt: "我的战斗与你不同"
PAO_ynbt_desc: "“她们嘲笑我，说我那把只为守护而存在的剑，太过天真。她们说，真正的守护，是需要付出代价的，是凡人无法理解的、孤独的牺牲。我告诉她们，不对。真正的守护，从来都不是一个人的战斗。我的力量，并非来自什么神秘的契约，它来自我身后每一个人的笑容，每一份信任。我的战斗，不需要她们的理解。因为，我的身后，站着整个世界。”"

PAO_kzdd: "请看看这片大地"
PAO_kzdd_desc: "“我没有再和她们辩论。我只是邀请她们，脱下那身华丽的战袍，和我一起，走进了我们最普通的城市里。我带她们去看望那个会为了一个花冠而大笑的孩子，去看望那个因为疲惫而需要被搀扶的老人。我让她们亲耳去听，那些……被她们所‘守护’着的、吵闹的、温暖的、充满了生命力的声音。那天晚上，她们的领袖找到了我。她什么也没说，只是，第一次，对我伸出了她的手。”"

PAO_zqgt: "让鲜花开满世界"
PAO_zqgt_desc: "“她们说，她们的力量，源于一种很悲伤的循环。每一次战斗，都在消耗着她们的灵魂。我不是很懂。但我知道，再勇敢的骑士，也需要一个能安心休息的、温暖的壁炉。所以，我想，用我们‘夜莺’的力量，和她们的魔法，一起为她们，为我们，建造一座座谁也打扰不了的、我们共同的、美好花园。让她们在每一次战斗归来后，都能有一个，可以治愈伤口的地方。”"
PAO_zqgt2: "让鲜花开满世界"
PAO_zqgt2_desc: "“她们说，她们的力量，源于一种很悲伤的循环。每一次战斗，都在消耗着她们的灵魂。我不是很懂。但我知道，再勇敢的骑士，也需要一个能安心休息的、温暖的壁炉。所以，我想，用我们‘夜莺’的力量，和她们的魔法，一起为她们，为我们，建造一座座谁也打扰不了的、我们共同的、美好花园。让她们在每一次战斗归来后，都能有一个，可以治愈伤口的地方。”"
PAO_zqgt3: "让鲜花开满世界"
PAO_zqgt3_desc: "“她们说，她们的力量，源于一种很悲伤的循环。每一次战斗，都在消耗着她们的灵魂。我不是很懂。但我知道，再勇敢的骑士，也需要一个能安心休息的、温暖的壁炉。所以，我想，用我们‘夜莺’的力量，和她们的魔法，一起为她们，为我们，建造一座座谁也打扰不了的、我们共同的、美好花园。让她们在每一次战斗归来后，都能有一个，可以治愈伤口的地方。”"
PAO_zqgt4: "让鲜花开满世界"
PAO_zqgt4_desc: "“她们说，她们的力量，源于一种很悲伤的循环。每一次战斗，都在消耗着她们的灵魂。我不是很懂。但我知道，再勇敢的骑士，也需要一个能安心休息的、温暖的壁炉。所以，我想，用我们‘夜莺’的力量，和她们的魔法，一起为她们，为我们，建造一座座谁也打扰不了的、我们共同的、美好花园。让她们在每一次战斗归来后，都能有一个，可以治愈伤口的地方。”"

PAO_czwg: "沉重的王冠"
PAO_czwg_desc: "“那天，你把我叫到了你的房间。你把那顶象征着莉兰迪亚最高权力的、冰冷的王冠，戴在了我的头上。你说，你已经不知道该怎么去引导这个，变得越来越‘吵闹’的、属于生者的世界了。你说，你只想，回到你的花园里，安安静静地，当一个只会唱歌的亡灵公主。你说，从今天起，这个家，就交给我了。我看着镜子里，那个戴着王冠的、一脸不知所措的自己，突然觉得……这顶王冠，比我那把只为守护而存在的剑，还要重上好多好多。”"

PAO_xzjl: "出发！去寻找巨龙！"
PAO_xzjl_desc: "“我戴上了王冠，也背负起了更大的责任。我和我的新朋友们，那些勇敢的魔法少女们，一起看着地图上那些还在哭泣的地方。阿德莱希的贪婪，艾尔芙的枷锁，还有星月王国残留的、最后的阴影。她们说，那些是无法被战胜的、盘踞在这片大陆上的‘巨龙’。是吗？我不是很信。我只知道，在我的童话书里，骑士的使命，就是要去寻找巨龙，然后用拥抱，或者用剑，去让它，不再让任何人流泪。那么出发吧。我们一起，去寻找那些，需要被打倒的‘巨龙’。”"

PAO_kchh: "一起开个茶话会吧"
PAO_kchh_desc: "“她们总是把所有的事情都自己决定，把自己关在高高的房子里。我觉得这样不好。所以我邀请她们，来参加我们‘七嘴八舌的骑士们’讨论大会。虽然她们一开始好像很不习惯，但我觉得，只要多准备一些她们喜欢喝的红茶和蛋糕，她们总会愿意，多和我们聊一聊的。”"

PAO_mffw: "魔法，也要为大家服务"
PAO_mffw_desc: "“她们的魔法很厉害，能让枯萎的树木重新开花，能净化被污染的河流。可她们过去，好像只用魔法来战斗。我告诉她们，魔法，也可以用来让大家的菜园获得丰收，也可以用来点亮夜晚的路灯。你看，能让大家露出笑容的魔法，才是最厉害的魔法呀。”"

PAO_xths: "一本新的童话书"
PAO_xths_desc: "“我把我们的故事，都写成了一本新的童话书。里面有我的故事，也有她们的故事。我把这本书，送给了我们所有的孩子们。我要让她们从小就知道，守护这个世界的力量，有很多种。有骑士的剑，也有魔法少女的光。但最重要的，是我们愿意站在一起的那颗心。”"

PAO_jgwb: "背后就交给我吧"
PAO_jgwb_desc: "“她们的战斗方式，和我们完全不一样。她们像天上的流星，耀眼又强大。而我们，则像大地上的藤蔓，坚韧又绵长。我告诉我的骑士们，以后在战场上，就把天空，完全交给她们吧。我们要做的，是守护好她们的身后，成为她们可以安心降落的、最坚实的地面。”"

PAO_jgdd: "最坚固的盾"
PAO_jgdd_desc: "“她们的灵魂宝石，很漂亮，也很……脆弱。我不能再让她们，独自承受所有的诅咒和伤害了。我请求我们最好的工匠，用‘夜莺’的力量和最坚固的合金，为她们，打造出能抵御一切恶意的新盔甲。这一次，换我们，来成为她们的盾。”"

PAO_xhfx: "当骑士学会了飞翔"
PAO_xhfx_desc: "“她们说，她们愿意，把她们的力量，分享给我们。于是，在她们的帮助下，我的骑士们，第一次，拥有了能掠过天空的翅膀。你看，当骑士学会了飞翔，当魔法少女拥有了大地，这个世界上，就再也没有，我们无法一起战胜的‘巨龙’了。”"


PAO_bfcf: "向着北方，冲锋！"
PAO_bfcf_desc: "“我们让身边的人不再哭泣了。\n可是，莉莉安娜。\n我最近又在那个叫做收音机的盒子里听到了很多很多新的哭声。\n她们来自北方。来自那些……被冰冷的钢铁与无尽的平原所覆盖的、遥远的国度。\n她们的语言我听不懂，她们的故事我也不知道。\n可我能听懂她们的眼泪。\n我问我自己，如果我只是守在我自己的小小花园里，对那些远方的哭声假装听不见。那么我还是一个你在童话书里教给我的那个‘骑士’吗？\n我想不是的。\n所以我们出发吧。\n不为王冠也不为土地。\n向着北方，向着那些哭声传来的地方，向着那些……还在等待着英雄的、古老的童话，发起最后的冲锋”"

PAO_kddx: "空洞的心"
PAO_kddx_desc: "“我们胜利了。整个美洲大陆，都沐浴在我们带来的、和平的光芒下。\n可是，莉莉安娜。\n我看到你，在庆典的夜晚，独自一人，走进了那座最古老的、封印着夜莺之国所有秘密的圣堂。\n我悄悄地，跟了进去。\n然后，我看到了。\n我看到你，轻轻地，将手，放在了自己的胸口。那里，没有心跳。只有一个……由纯粹的、冰冷的魔力所构成的、巨大的空洞。\n你对着那个空洞，轻声地，说了一句话。\n你说：‘你看，我们赢了。可是……你为什么，还是不肯回来呢？’”"

PAO_xzgc: "心脏的归处"
PAO_xzgc_desc: "“那天晚上，你终于，对我讲完了那个，你从未讲完的故事。\n原来，你早已失去了你的‘心’。\n那颗被称为‘夜莺之心’的、维系着整个夜莺国度所有魔力的源头，就在索拉娜背叛你的那一天，被她从你的胸口，残忍地剥离了。\n你这些年来所有的力量，都只是在透支你那本已残破的灵魂。每一次为我抵挡伤害，每一次为人民降下祝福，都像是在将你自己，更深地，推向那片永恒的、真正的虚无。\n而我……\n我这个……由你用尽所有爱意与希望，所创造出来的‘光’……\n我的灵魂，我的心跳，我之所以存在的最根本的核心……\n……原来，就是那颗，本该属于你的，温暖的、跳动着的……‘夜莺之心’。\n现在，我明白了。\n为什么，我总觉得，自己好像偷走了什么不属于我的东西。\n为什么，你看着我的时候，眼神里，总是带着那种……我无法理解的、温柔的悲伤。\n莉莉安娜。\n我终于明白了。原来，这个童话故事的结局，从一开始，就只有一个主题。\n那就是……必须有人，要献上自己的心脏。\n要么，是骑士，将心脏，还给被恶龙偷走了心脏的、心爱的公主。\n要么……\n……是骑士，带着公主的心脏，独自一人，去往一个……再也没有公主的、孤独的未来。”"

PAO_bzss: "不再上锁的门"
PAO_bzss_desc: "“从那天起，你好像变了一个人。你不再把自己关在那个昏暗的房间里了。你遣散了所有多余的侍从，然后，搬到了我的隔壁。你说，你想……离我近一点。你房间的门，也再也没有关上过。你说，这样，我晚上如果做了噩梦，只要一喊你的名字，你就能……立刻听到了。”"

PAO_lgch: "两个人的“茶话会”"
PAO_lgch_desc: "“我还是会，把大家的烦恼，带回来和你讨论。虽然……你总是听不懂。你总是会提出一些，比如‘让所有吵架的人都去花园里罚站’之类的、很孩子气的建议。可你……每一次，都会听得特别认真。然后，在我讲完之后，为我端上一杯……你亲手泡的、总是会不小心放太多糖的红茶。”"

PAO_hhjz: "会说谎的镜子"
PAO_hhjz_desc: "“今天，你带我，去了那座最古老的圣堂。我问你，那面……我第一次见到时，映出了我和黑色身影的镜子，到底是什么。\n你沉默了很久。然后，你告诉我，那是‘记忆’。是你……将自己所有关于索拉娜的、最痛苦也最美好的记忆，都封印进去之后，所形成的一面镜子。\n你说，你本来，是想让它，永远地，只映照出你一个人的过去的。”"

PAO_dsgr: "镜子里的第三个人"
PAO_dsgr_desc: "“你拉着我的手，走到了那面镜子前。\n你说：‘可是现在不一样了。’\n你伸出手，轻轻触摸着那冰冷的镜面。镜子里清晰地映出了我们两个人的身影。\n然后我看到，镜子里那个一直站在我身后的、属于索拉娜的黑色幻影，第一次露出了一个释然的淡淡微笑。\n然后她就像一阵风一样，彻底地消散了。”"

PAO_qkhb: "去看海吧"
PAO_qkhb_desc: "“你的身体，一天比一天，变得更透明了。我知道那一天很快就要来了。\n我不再去想那些沉重的事情了。我只是，拉着你的手，带你去了很多很多……你从未去过的地方。\n我们一起，去了海边。我为你，捡来了你一直很好奇的、亮晶晶的贝壳。\n我们一起，去了森林。我为你，采来了你故事书里才有的、带着露珠的红色浆果。\n我只是想……把这个，你守护了一辈子，却从未真正感受过的、吵闹又温暖的世界，一点一点地，都装进你的眼睛里。”"

PAO_xqjf: "新的全家福"
PAO_xqjf_desc: "“那天晚上，月光很好。\n我把你，带到了那座……开满了向日葵的山坡上。我们的新朋友们，莉兰迪亚里的大家，和那些勇敢的魔法少女，也都在那里。\n我们燃起了篝火，大家一起，唱着我听不懂、却很好听的歌。\n我看到你，靠在我的身边，看着眼前的这一切，露出了一个……我从未见过的、真正幸福的、发自内心的笑容。\n我悄悄地，拜托一个会画画的魔法少女，把这一刻，画了下来。\n画上，有我，有你，也有她们。\n你看，莉莉安娜。我们……终于，有了一张，大家都快快乐乐的、新的‘全家福’了。”"

PAO_wdgz: "睡吧，我的公主殿下"
PAO_wdgz_desc: "“你……越来越喜欢睡觉了。\n大部分的时候，你都会靠在我的身边，安安静静地，听我，为你，读那些……我们一起写下的、新的童话书。\n有时候，读着读着，你就会像一个听完了睡前故事的孩子一样，在我身边，安安稳稳地，睡着了。\n我就会，像你曾经为我做过的那样，为你，盖上一床最柔软的毯子。\n然后，在你耳边，轻轻地，哼起那首……我为你，学会的、唯一的摇篮曲。\n你的眉头，在我的歌声里，会慢慢地，舒展开来。\n我知道，你一定……又做了一个，很甜很甜的梦吧。\n没关系。\n你，就安心地睡吧。\n这一次……\n换我，来为你，守着这个……再也不会有噩梦的、安安静静的世界了。”"

####莉莉安娜经济线####
PAO_fjss: "大大的房间"
PAO_fjss_desc: "“我要去接她回家了。可是……家里现在这个样子，还不够好。地方太小了，不够我们两个人玩耍。我要让我的孩子们，把那些没用的废墟都推平，把我们的国度，变得更大、更漂亮。这样，等她回来，就能有一个崭新的、足够宽敞的房间了。”"

PAO_ssfg: "闪闪发光"
PAO_ssfg_desc: "“我记得……你最喜欢那些亮晶晶的、温暖的东西了。你说，它们像天上的星星。我们这里没有星星，但是……地底下，有很多很多漂亮的石头。我会让我的孩子们，把它们全都挖出来，为你建成一座……比太阳还要闪亮的宫殿，造出一支……比星星还耀眼的军队。你会喜欢的，对不对？”"

PAO_ssfg2: "闪闪发光"
PAO_ssfg2_desc: "“我记得……你最喜欢那些亮晶晶的、温暖的东西了。你说，它们像天上的星星。我们这里没有星星，但是……地底下，有很多很多漂亮的石头。我会让我的孩子们，把它们全都挖出来，为你建成一座……比太阳还要闪亮的宫殿，造出一支……比星星还耀眼的军队。你会喜欢的，对不对？”"

PAO_ssfg3: "闪闪发光"
PAO_ssfg3_desc: "“我记得……你最喜欢那些亮晶晶的、温暖的东西了。你说，它们像天上的星星。我们这里没有星星，但是……地底下，有很多很多漂亮的石头。我会让我的孩子们，把它们全都挖出来，为你建成一座……比太阳还要闪亮的宫殿，造出一支……比星星还耀眼的军队。你会喜欢的，对不对？”"

PAO_ssfg4: "闪闪发光"
PAO_ssfg4_desc: "“我记得……你最喜欢那些亮晶晶的、温暖的东西了。你说，它们像天上的星星。我们这里没有星星，但是……地底下，有很多很多漂亮的石头。我会让我的孩子们，把它们全都挖出来，为你建成一座……比太阳还要闪亮的宫殿，造出一支……比星星还耀眼的军队。你会喜欢的，对不对？”"

PAO_ssfg5: "§1公主的献礼§!"
PAO_ssfg5_desc: "§1“回来吧，索拉娜。\n你看，我把所有你喜欢的东西，\n都准备好了。”§!"

PAO_zbwj: "为你准备的新玩具"
PAO_zbwj_desc: "“生者世界的玩具，好像……都是用一种叫‘钢铁’的东西做的。它们看起来很坚固，很冰冷，和你一样。我不是很喜欢。但是……如果你喜欢的话，我也会为你准备好的。我会让我的孩子们，不眠不休，为你打造出最坚固、最锋利的玩具。有了它们，就再也没有人，敢欺负你了。”"

PAO_pytl: "为你铺一条回家的路"
PAO_pytl_desc: "“从这里，到你现在在的那个地方，太远了。走路，会很累的。我不要你再受累了。我会让我的孩子们，用最坚固的石头，和最冰冷的钢铁，为你铺好一条……平坦的、可以直接回到家门口的路。你只要……沿着这条路，一直走，就能看到我了。”"

PAO_bedz: "不能让你饿肚子"
PAO_bedz_desc: "“你总说，生者，是需要吃东西的。虽然……我不是很懂。但是，我不能让你，在回家的路上，还饿着肚子。我会让我的孩子们，去收集所有……能让你的那些‘士兵’们，变得更有力气的东西。我会把它们，都堆在路边，等你回来拿。”"

PAO_wsjb: "现在……万事俱备了"
PAO_wsjb_desc: "“好了。家里，打扫干净了。新的玩具，准备好了。回家的路，也铺好了。所有……所有的一切，我都为你准备好了。现在，这个完美的、安安静静的、只为你一个人存在的王国，正等待着它的另一位女主人。索拉娜……我来了。”"
####莉莉安娜军事线####
PAO_sxwo: "苏醒的玩偶们"
PAO_sxwo_desc: "“我的孩子们，不能再沉睡了。我要轻轻地唤醒她们，为她们穿上最坚固的盔甲，就像妈妈为即将出门远足的孩子整理衣裳。她们会成为我最勇敢的骑士，去迎接她们迷路的姐妹回家。每一个孩子，都会得到我的祝福。”"

PAO_ygdp: "月光织成的斗篷"
PAO_ygdp_desc: "“夜晚，是我们的朋友。我会请求月亮，为我的孩子们，织一件看不见的斗篷。穿上它，她们就能像影子一样，悄悄地溜进坏人的花园里，不会被任何人发现。她们的脚步会像猫咪一样轻，不会惊醒任何一朵沉睡的花。”"

PAO_kqyj: "不会哭泣的眼睛"
PAO_kqyj_desc: "“外面的世界很可怕，充满了火焰和吵闹的声音。但我的孩子们，不会感到害怕。因为我拿走了她们的眼泪，给了她们永不哭泣的眼睛。她们会平静地，穿过所有的荆棘和风暴，眼中只有我为她们指引的、那唯一的方向。”"

PAO_jjyb: "荆棘的拥抱"
PAO_jjyb_desc: "“如果有人想伤害我的孩子，那么，她们就要做好被荆棘拥抱的准备。我会让我的孩子们，学会一种特别的魔法。她们会紧紧地、紧紧地抱住那些坏人，直到她们再也无法动弹，再也无法发出声音，直到她们也变成……安静的、不会再伤人的好孩子。”"

PAO_mlhz: "跟我走呀，迷路的孩子"
PAO_mlhz_desc: "“在那个吵闹的世界里，一定……也有很多和我们一样的、迷路的孩子。她们也在黑暗里哭泣，也想找到回家的路。我的孩子们，会为她们带去我的邀请。她们会牵起那些迷路孩子的手，对她们说，别怕，我带你们去一个……永不分离的、安安静静的家。”"

PAO_thjj: "当童话迎来结局"
PAO_thjj_desc: "“好了，我的骑士们，出发吧。这个故事，已经到了该结束的时候了。去把我们迷路的公主，从那座关着她的、名叫‘现实’的城堡里，带回来。然后，我们所有人，就能在这个永不褪色的童话里，永远、永远地，幸福地生活在一起了。”"



#空军线
PAO_zscb: "为她们装上翅膀"
PAO_zscb_desc: "“我的孩子们不应该只在地面上行走。我要为她们装上翅膀，用最轻的宝石和最纯净的月光，为她们编织出不会折断的羽翼。从此以后，天空也将成为我们安静的花园。”"

PAO_jjlx: "寂静的流星"
PAO_jjlx_desc: "“我喜欢流星，虽然索拉娜说那只是燃烧的石头。我要我的孩子们也像流星一样，在最深的夜里划过天际，迅速而悄然无声。她们会像一场无人察觉的流星雨，美丽又安静地，降临在敌人的头顶。”"

PAO_sjlz: "水晶的露珠"
PAO_sjlz_desc: "“她们的武器不应该是吵闹的火焰。那会吓到地面上那些可怜的孩子。她们的武器，应该是清晨花瓣上凝结的水晶露珠，冰冷纯净又无比锋利。当这些露珠从天空落下时，只会带走不和谐的声音，留下一片永恒的安宁。”"

PAO_ydtw: "在云端跳舞"
PAO_ydtw_desc: "“空中的战斗不应该是丑陋的撕咬。它应该是一场优雅的舞蹈，在云朵和风之间。我的孩子们会学习如何在气流中旋转，如何像蝴蝶一样躲开所有的危险。她们会让敌人明白，天空是属于舞者的舞台。”"

PAO_xxyj: "星星的眼睛"
PAO_xxyj_desc: "“我要把天上最亮的星星摘下来，安在她们的翅膀上。这样无论飞得多高，她们都能看清地面上每一片需要被守护的叶子，和每一颗需要被安抚的、迷路的心。她们的眼睛里，会映照出整个世界。”"

PAO_yggz: "月光下的公主们"
PAO_yggz_desc: "“现在我的孩子们已经学会了飞翔。她们将组成月光的编队，成为夜空的公主。当她们的翅膀遮蔽天空时，所有的喧嚣都将归于寂静，所有的纷争都将被安抚。整个世界，都会在她们带来的、永恒的月光下，安然睡去。”"

#海军线
PAO_shzg: "聆听深海之歌"
PAO_shzg_desc: "“大海的深处，和我的家一样，安安静静的。我喜欢那里。我要让我的孩子们，学会聆听海底的声音，学会在无光的深海里，找到回家的路。她们将成为这片蓝色寂静里，第一批，也是唯一的主人。”"

PAO_szjy: "睡着的鲸鱼"
PAO_szjy_desc: "“我们的船不应该是吵闹的钢铁怪物。她们应该是睡着的、温柔的鲸鱼。她们会悄悄地，滑过最深的海沟，不会惊动任何一条小鱼。她们巨大的身影，将隐藏在洋流和阴影里，成为一个……无人知晓的、关于深海的秘密。”"

PAO_ryqw: "美人鱼的亲吻"
PAO_ryqw_desc: "“如果……有坏孩子的船，闯入了我们的花园。那么，我的孩子们，就会像传说中的美人鱼一样，悄悄地游过去，在她们的船底，留下一个……冰冷的、致命的亲吻。然后，在坏孩子沉入海底之前，微笑着，消失在深蓝色的梦里。”"

PAO_bxcj: "不许在家里吵架"
PAO_bxcj_desc: "“我不喜欢别的孩子，也跑到我的花园深处来玩。她们太吵了，会吓到我的小鱼。我的孩子们，会用她们无声的拥抱，告诉那些不请自来的客人，这里……是禁止大声喧哗的。然后，把她们，轻轻地，请出去。”"

PAO_zmc: "深海的捉迷藏"
PAO_zmc_desc: "“有时候，我们也要学会捉迷藏。当坏孩子带着她们的飞机，气冲冲地跑来找我们的时候，我的孩子们，就会像害羞的水草一样，躲进最深的、最黑暗的海沟里。她们会屏住呼吸，静静地等待。等到坏孩子找不到我们，哭着回家了，我们再出来。”"

PAO_dhyl: "好梦洒向大海"
PAO_dhyl_desc: "“现在，整片大海，都听到了我的歌声。它变得和我一样，安安静静的了。我的孩子们，将成为这片蓝色梦境的守护者。她们会为所有迷航的船只，唱起温柔的摇篮曲，引导她们，进入一个……永不醒来的、最深、最甜美的梦乡。”"

####事件####
PAO.1.t: "为什么要躲着我呢？？？"
PAO.1.d: "我只是……想让家里，变回原来的样子。\n我派出了侍卫们，去把那些……在外面游荡的、不听话的孩子，都请回她们自己的房间里去。我告诉侍卫们，动作一定要轻柔，因为那些孩子，只是在做着不安稳的梦，不可以吵醒她们。\n可是……侍卫们回来了。\n她们说，那些孩子，不愿意回家。\n她们说，她们只是轻轻地碰了一下，那些孩子……就碎掉了。\n然后，就有更多的孩子，从城市的阴影里跑了出来。她们不再只是吵闹了，她们开始……推倒那些漂亮的、几万年都没有动过的雕像，开始……弄脏我们干净的街道。\n我……不明白。\n我只是想在索拉娜回来之前，把一切都收拾得整整齐齐，就像她离开时那样。\n为什么……为什么你们，就是不肯帮帮我呢？"
PAO.1.a: "§1是我……做错了吗？§!"

PAO.2.t: "世界安静了下来，可是……"
PAO.2.d: "最后一声不和谐的嘶吼，消失了。\n我的侍卫们，忠实地，执行了我的命令。她们把那些……不听话的孩子，全部，都送回了永恒的安眠里。\n我走在那些……曾经无比吵闹的街道上。现在，这里又恢复了它应有的样子。\n安静，完美，一尘不染。\n就像……你离开之前那样。\n我从地上，捧起了一捧黑色的尘埃。这是那些孩子……留下的、最后的东西。它们很轻，很凉，就像从未存在过一样。\n你看，索拉娜。\n现在，家里又变得和以前一样，安安静静的了。\n再也没有什么东西，能打扰我们了。\n我把一切……都准备好了。\n所以……\n……你，可以回来了吗？"
PAO.2.a: "§1（整个国度，只剩下……她的回音。）§!"

PAO.3.t: "一场没有听众的道歉"
PAO.3.d: "她们……停下来了。\n那些吵闹的孩子们，好像……也打累了。她们没有再进攻，只是退回了城市的阴影里，远远地、沉默地，看着我。\n我也……没有力气了。\n我最忠诚的侍卫们，有很多，都变成了和我脚下这些……冰冷的尘埃一样的东西。\n我走在这座……被我们亲手弄得一团糟的家里。到处都是裂痕，到处都是……无法被修复的伤疤。\n我做错了。\n我想让这里，变回你离开时那样、完美的、安安静静的样子。\n可我……好像把它，弄得更乱了。\n对不起，索拉娜。\n我……好像把我们的家，搞砸了。\n如果……如果你现在回来，看到的是这样一副破破烂烂的景象……你一定会……更不想回来了吧。\n对不起……\n……真的，对不起。"
PAO.3.a: "§1（废墟中，只剩下……她小声的啜泣。）§!"

PAO.4.t: "永恒的寂静"
PAO.4.d: "……结束了。\n冰冷的雨水，冲刷着脸上的血污，也冲刷着……我那可笑的、关于不朽帝国的梦想。\n这些叫“野火”的凡人，比我想象的……要坚韧得多。我的军团崩溃了，我的防线被撕碎了。现在，她们像一群饥饿的狼，将我，这头落单的狮子，团团围住。\n也好。\n就这样，以一个女王的姿态，战死在这里……也算是一个不错的结局。至少，比回到那个……冰冷的、永恒的牢笼里，要好得多。\n我握紧了剑，准备迎接最后的冲锋。\n就在这时……\n……世界，突然，安静了下来。\n那些革命军的呐喊声、枪炮的轰鸣声、雨水砸在盔甲上的滴答声……所有，所有的声音，都在一瞬间，消失了。\n我愕然地抬起头。\n我看到，那些革命军的士兵，就像一群被按下了暂停键的人偶，保持着冲锋的姿态，凝固在了原地。雨水，停在了半空中。火焰，也停止了跳动。\n整个世界，都陷入了一种……我无比熟悉的、完美的、死一般的寂静之中。\n然后，我听到了一个声音。\n一个……我曾以为，我再也不会听到的、轻柔得像梦一样的声音，就在我的耳边，轻轻地响起。\n“……疼吗？”\n我猛地回头。\n身后，空无一人。\n只有一片……散发着柔和微光的、将我与整个世界隔绝开来的、透明的屏障。\n“……你总是这样。”那个声音，带着一丝……我无法分辨是心疼还是责备的、柔软的叹息，“总是把自己弄得……这么狼狈。”\n“……走吧。”\n“……我来，接你回家了。”"
PAO.4.a: "§O……莉莉安娜？§!"

PAO.5.t: "当“零件”开始说话"
PAO.5.d: "寂静的秩序，被一阵嘈杂的、属于生者的声音，打碎了。\n麻烦，来自那些被“收容”的莉兰迪亚人。\n在莉莉安娜看来，她只是在用自己最熟悉、也是最“高效”的方式，来重建这座城市。她将人类，和她那些不知疲倦的亡灵臣民一样，编入了永恒的生产序列。\n每一个人，都被分配了一个固定的、永不变更的岗位。伐木工，就永远负责砍伐；石匠，就永远负责堆砌。没有休息，没有轮换，也……没有报酬。因为在这个完美的、没有欲望的国度里，为女王的城堡添砖加瓦，本身就是至高无上的荣耀，是存在的全部意义。\n她无法理解，这些脆弱的、生命短暂的“零件”，为什么会“损坏”。\n为什么，她们会疲惫，会生病，甚至会……抱怨。\n暴乱的导火索，是一场意外。一个在矿场连续工作了两天两夜的年轻工人，因为脱力，失足摔进了那台永不停歇的、巨大的矿石粉碎机里。\n\n监工的“夜莺魂灵”毫无反应。在它的逻辑里，这只是一个“零件”的损耗。它只是，准备将下一个序列的“零件”，补充到那个空出来的岗位上。\n就在这时，一个沙哑的、充满了悲愤的声音，从人群中响起。\n“……他，是我儿子。”\n一个头发花白的老工人，放下了手中的工具，颤抖着，站了出来。\n“他……不是一个‘零件’。”\n然后，第二个，第三个……越来越多的人，沉默地，放下了手中的工具。她们围拢过来，将那个失去孩子的父亲，护在了中间。她们用自己的血肉之躯，组成了一道脆弱的、却无法被“序列”所理解的墙。\n她们的眼神里，没有恐惧。只有一种……在被剥夺了一切之后，所剩下的、最后的、属于“人”的尊-严。\n当莉莉安娜从索拉娜的房间里，听到这个消息时，她的脸上，第一次，露出了那种……孩子气的、完全无法理解的困惑。\n“……她们，在做什么呀？”\n“……我只是，想为大家，建一个更漂亮的家而已。”"
PAO.5.a: "§R（沉默的齿轮，开始发出刺耳的摩擦声）§!"

PAO.6.t: "你看，她们在哭啊"
PAO.6.d: "“够了，莉莉安娜。”\n这是……你回来以后，第一次，用这么严肃的、带着一丝颤抖的语气，和我说话。\n我停下了正准备为你梳理头发的手，有些不解地看着你的背影。\n你没有回头。你只是，指着窗外。\n“你看看她们。”你的声音，像一块被烧红的铁，又被强行浸入了冰水里，“你看看她们的眼睛！那里面，还有一点点的光吗？！”\n我顺着你的手指望去。\n窗外，是我为你建造的、完美的城市。街道很干净，建筑很宏伟，所有的人类，都在我的“夜莺的魂灵”的指引下，有条不紊地，进行着永恒的建设。一切……都和我设想的一样，安静，而有序。\n“她们不是你的玩偶！不是那些可以随意拆解、再重新拼凑起来的亡灵！”你的声音，第一次，带上了……愤怒。\n“她们会痛，会累，会饿！她们有自己的家人，有自己的梦想！她们是……活生生的人啊！你这样……是在毁掉她们！也是在毁掉你自己！”\n我被你说得愣住了。\n我只是……想用我的方式，去对她们好。我想给她们一个没有纷争、没有饥饿、永远安宁的家。\n我只是……不想再看到任何人，像你当初那样，被那些凡人伤害了。\n我做错了吗？\n我缓缓地走到你的身边，学着你刚才的样子，也望向了窗外那些……安静得有些过分的人们。\n然后，我轻轻地，拉住了你的手，用我能想到的、最天真、也最认真的语气，问你：\n“……可是，索拉娜。”\n\n“……在你过去的那个王国里，那些活生生的人们，她们……就不哭了吗？”"
PAO.6.a: "§1（你的手，在那一刻，冰冷得像一块石头。）§!"

PAO.7.t: "我的王国"
PAO.7.d: "莉莉安娜……她问我。\n问我，在我的王国里，人民……就不哭了吗？\n怎么会不哭呢？\n我的王国……\n我的王国，建立在贫民窟的泥泞之上。那里，哭声，是比呼吸更廉价的东西。\n我的王国，是用工人的白骨和农民的血泪铸成的。每一次敲击，都能听到他们的哀嚎。\n我的王国，是我用饥饿和恐惧，从那片绝望的土地上，驱赶出来的野兽。她们的每一次冲锋，都是为了能抢到一块……能让自己活到明天的面包。\n是的。\n在我的王国里，人民当然会哭。\n她们哭得比这里的任何人，都更大声，更凄惨。\n可是，莉莉安娜……你不懂。\n你永远也不会懂。\n正因为她们会哭，正因为她们会痛，正因为她们会……在被逼到绝境的时候，燃起那该死的、连神明都能烧成灰烬的怒火……\n所以……“野火”，才会诞生。\n所以，像晓枫那样的人，才会出现。\n所以，我那座看起来坚不可摧的、用力量和恐惧建立起来的帝国，才会像一座沙子堆成的城堡一样，被她们……轻而易举地，推得粉碎。\n我回来了。\n回到了你为我建造的这个……完美的、安宁的、再也没有人会反抗的、永恒的牢笼里。\n我看着你，用你那天真的善意，重复着我曾经犯下的、所有傲慢的错误。\n我突然……就明白了。\n我真正输掉的，不是那场战争。\n而是，当我看着那些……衣衫褴褛、食不果腹的“野火”士兵们，脸上却带着那种……我从未拥有过的、为了某个比生命更重要的东西而去战斗的光芒时…\n我就已经，输得一败涂地了。\n对不起，莉莉安娜。\n我……好像，不能再陪你，待在这个……安安静静的家里了。\n因为，我终于想起来了。\n在那座……被我亲手摧毁的、充满了哭声的王国里……\n……也曾有过，我的家。"
PAO.7.a: "§O（火焰，熄灭了。）§!"

PAO.8.t: "一场关于面包的梦"
PAO.8.d: "你……睡着了。\n这是你回来以后，第一次，睡得这么沉。\n我（莉莉安娜）就坐在你的床边，像以前一样，静静地看着你。\n你睡着的样子，和小时候，没什么两样。还是会微微地皱着眉头，像是在思考着什么……很了不起的难题。\n突然，你开始说梦话了。\n声音很轻，很含糊，像是在对谁说话。\n“……面包……不够了……”\n“……把我的那份……分给她们……不然……会闹事的……”\n“……不行……军饷不能再拖了……那帮饿疯了的狼……会把我们都撕碎的……”\n“……该死的……‘野火’……为什么……她们明明什么都没有……为什么……就是杀不完……”\n你的眉头，皱得越来越紧。你的呼吸，也变得越来越急促。\n我有些担心，想伸出手，去抚平你眉间的褶皱。\n就在这时，你突然，用一种……我从未听过的、带着一丝颤抖和疲惫的、近乎哀求的语气，轻轻地，说了一句：\n“……好累啊。”\n然后，你就翻了个身，把脸深深地，埋进了柔软的枕头里，再也没有发出声音。\n我伸出的手，停在了半空中。\n我只是……静静地看着你。\n我突然觉得……\n我好像……从来，都没有真正地，走进过你的梦里。"
PAO.8.a: "§1（你的梦里……到底，都有些什么呢？）§!"

PAO.9.t: "墙与狗圈"
PAO.9.d: "“你看，索拉娜。”\n你的声音里，带着一种孩子气的、邀功般的兴奋。\n“我把我们的家，变得更安全了。我建起了最高、最坚固的墙，还派了我们最勇敢的孩子，守在每一个门口。这样……就再也没有坏人，能闯进来伤害你了。”\n我顺着你手指的方向看去。\n窗外，巨大的、由黑曜石和骸骨构成的城墙，像一道永恒的悬崖，将我们的城堡，与那个吵闹的世界，彻底隔绝开来。\n“……嗯。”我点了点头，声音里，听不出什么情绪，“很好。”\n你似乎对我的平淡反应有些失望，但还是继续兴致勃勃地介绍着你的“杰作”。\n“我还听了你的话。你说，那些迷路进来的生者，是需要吃饭的。所以，我命令我的孩子们，每天，都会把最好的食物，放在城门口的食槽里。你看，她们现在……都在安安静静地排队，再也没有人争抢，再也没有人哭闹了。是不是……很有秩序？”\n我看着窗外。\n看着那些……衣衫褴褛的人类，在“夜莺的魂灵”的监视下，麻木地，排成一条长长的队伍。然后，从那个巨大的、冰冷的石头食槽里，领取属于自己的、不多不少的那一份食物。\n我看着这个场景，突然……就想起了很久很久以前的一些事。\n我想起了，我还是一个人类小女孩的时候。在贫民窟的冬天，那些贵族老爷们施舍食物时，也是这样。他们把发了霉的面包，扔进一个巨大的食槽里。然后，看着我们这些……快要饿死的孩子，和野狗一起，为了多抢到一口吃的，互相撕咬，头破血流。那时候，我就明白了。\n最稳固的统治，需要的不是爱，也不是信仰。\n而是……饥饿。\n是让所有人都处在一种“不听话，就会饿死”的恐惧里。然后，再由你，来决定谁能吃饭，谁不能。\n这就是……我建立自己那个王国的、最初的基石。\n我看着你，看着你那双……因为自己创造了“完美秩序”而闪闪发光的、纯净的眼睛。\n我突然……就有点想笑。\n你看，莉莉安娜。\n我们……原来，是这么的相像。\n只是，你用的是“善意”。而我，用的是“恶意”。\n但我们……都为自己心爱的人，建造了一座，一模一样的、名为“绝对安全”的……华丽的狗圈。"
PAO.9.a: "§O（我们……有什么不一样吗？）§!"

PAO.10.t: "被挂起的地图"
PAO.10.d: "你……好像很开心。\n因为，这是我回来以后，第一次，主动向你要了一样东西。\n我要了一张地图。一张……关于那片，曾属于我的、叫“莉兰迪亚”的土地的地图。\n你很快就让你的孩子们，为我找来了。还为它，配上了一个最华丽的、用白骨和宝石镶嵌的画框。\n现在，它就挂在我的房间里。\n你走进我的房间，看到我正站在那幅地图前，眼神里，充满了好奇和一丝……不易察觉的欣喜。\n“你在看什么呀？”你轻轻地问。\n我没有回头。我只是伸出手，指着地图上，那座曾被我命名为“胜利堡”的、最坚固的要塞。\n我的声音，冰冷，而沙哑。像是在陈述一个不容置疑的事实。\n“……这个。是我亲手设计的。那里的每一块砖，都刻着我的名字。”\n我又指向了那片……曾盛产咖啡豆的、富饶的平原。\n“……还有这里。我曾在这里，签下了上百份贸易订单。那里的每一颗咖啡豆，都曾为我的国库，换来过黄金。”\n最后，我的手指，重重地，点在了那座……曾被“野火”的火焰，烧成灰烬的王宫之上。\n“……而这里。”我的声音里，第一次，带上了一丝……你所熟悉的、充满了占有欲的怒火，“曾是我的王座。是那群该死的蝼蚁，把它，从我这里……偷走了。”\n我转过身，看着你。\n“莉莉，你说得对。”我的眼神，像一头被夺走了领地的、受伤的狮子，“那是……我的东西。是我一个人的。我不允许……不允许任何人，把它，从我手里抢走。”\n你看着我，看着我又变回了那个……你所熟悉的、充满了野心与欲望的索拉娜。\n你的脸上，露出了一个安心的、无比温柔的笑容。"
PAO.10.a: "§O（她只看到了她想看到的）§!"

PAO.11.t: "我们何时出征？"
PAO.11.d: "“真不错。”\n我掂了掂手中这柄新剑的重量。剑身上，流淌着属于夜莺国度的、冰冷的死亡能量。它比我过去拥有的任何一把武器，都更锋利，也更……听话。\n你站在我的身边，看到我脸上露出的、满意的表情，你的眼睛里，也闪烁着开心的光芒。\n“你喜欢就好。”你轻声说，“有了它们，就再也没有人，能伤害你了。”\n“伤害我？”我笑了。那是一种……你许久未见的、充满了嘲讽与傲慢的笑。\n“莉莉安娜，你太小看我了。”我转过身，用剑尖，轻轻地抬起了你的下巴，就像……很久很久以前，我第一次，见到你时那样。\n“也太小看……那些凡人了。”\n我收回了长剑，望向工坊外，那些已经集结完毕的、无穷无尽的亡灵大军。\n“她们……不是来伤害我的。她们是来……迎接她们的女王，回家的。”我的声音里，充满了即将重返战场的、兴奋的战栗，“她们以为我被打败了，以为我像一只丧家之犬一样，躲回了你的影子里。她们错了。”\n“我只是……回来拿回一些，我早就该拿的东西而已。”\n我转过身，将那柄冰冷的长剑，指向了莉兰迪亚的方向。\n“所以，我们什么时候去碾碎她们？”我的声音，回荡在整个工坊里，充满了不容置疑的威严，“去告诉那些不知死活的蝼蚁……我，索拉娜，回来了。去把我的王座，我的城市，我的一切……都给我，原封不动地，拿回来！”\n你看着我，看着我又变回了那个……你初次爱上的、那个充满了力量、野心与光芒的征服者。\n你的脸上，露出了一个……无比满足的、痴迷的笑容。\n……我终于，要为你，也为我自己，去夺回属于我们的荣耀了。"
PAO.11.a: "§O（演出即将开始）§!"

PAO.12.t: "镜中的“女王”"
PAO.12.d: "我逃跑了。\n从她的身边，从她那双……纯净到足以灼伤我的眼睛里，逃了出来。\n我把自己，关回了这个……她为我精心准备的、华丽的牢笼里。\n我走到镜子前，看着镜中的自己。\n“女王”……\n多么可笑的词语。\n一个被一群衣衫褴褛的凡人，从自己的王座上赶下来的失败者。\n一个像丧家之犬一样，需要被自己曾经背叛的人，捡回来的可怜虫。\n这就是……镜子里这个女人的真面目。\n我恨。\n我恨那些叫“野火”的蝼蚁。恨她们的顽固，恨她们那愚蠢的、所谓的“信仰”，恨她们……明明那么弱小，却能从废墟里，一次又一次地，爬起来。\n可我……好像更恨自己。\n恨自己的无能，恨自己的傲慢，恨自己……花了半辈子的时间，用尽了所有的卑劣手段，建立起来的那个所谓的“不朽帝国”，竟然，真的就输给了那样一群……连饭都吃不饱的家伙。\n……\n莉莉安娜……\n我的手，不自觉地，抓紧了肩上这件柔软的披肩。\n上面，还残留着她指尖的、淡淡的凉意。\n她刚才……看着我的时候，眼神里，全是心疼和担忧。\n她一定……把我当成了一个在外面受了委屈、回家哭鼻子的孩子了吧。\n她不知道。\n她永远也不会知道。\n真正把她那份唯一的、纯净的温暖，当作工具，去肆意践踏的人，是我。\n真正把这个世界上，唯一一个，曾毫无保留地爱着我的人，亲手推入深渊的，也是我。\n我……\n……\n我看着镜子里那张苍白的、陌生的脸，突然，就笑了。\n笑得比哭，还要难看。\n你看，索拉娜。\n你赢不了那些蝼蚁，也配不上那份纯净的爱。\n你就是个……彻头彻尾的、一无所有的……废物。"
PAO.12.a: "§O将脸埋进那件……还带着一丝凉意的披肩里§!"

PAO.13.t: "和我一样的眼睛"
PAO.13.d: "索拉娜……好像很忙。\n她每天都在制定着各种各样、我看不懂的计划。她说，这是为了让我们的家，变得更“稳固”。\n我不是很懂。\n我只是觉得……这个家，好像变得越来越冷，也越来越……陌生了。\n今天，我一个人，偷偷地，溜出了那间总是很安静的房间。我换上了一件普通的斗篷，走在了这座……我曾以为，已经被我治理得很好的城市里。\n然后，我看到了她们。\n看到了那些……排着长长的队，从冰冷的食槽里，领取着刚好能果腹的、没有任何味道的食物的人们。\n她们的脸上，没有任何表情。既没有喜悦，也没有悲伤。只有一种……比我那些亡灵臣民，还要深沉的、活着的死寂。\n我走过一个墙角时，看到了一个很小很小的人类女孩。她正蜷缩在那里，因为饥饿，连哭的力气都没有了。她只是，睁着一双大大的、空洞的眼睛，看着人来人往的街道。\n我看着她的眼睛。\n突然……就想起了很久很久以前的、我自己。\n想起了，在那个永恒寂静的国度里，独自一人，坐在冰冷的王座上，等待了上万年的、那个小小的、孤独的公主。\n我们……好像啊。\n都在等待着一个……不会再到来的拥抱。都在忍受着一种……无法被填满的饥饿。\n我的心，突然，像被什么东西，很轻很轻地，刺了一下。\n我从我的口袋里，拿出了今天下午，索拉娜特意留给我的、那块我最喜欢吃的、点缀着水晶糖霜的糕点。\n我走到那个小女孩的面前，蹲下身，把那块……对我来说，很珍贵很珍贵的糕点，轻轻地，递到了她的手里。\n她愣住了。\n她看着我，那双空洞的眼睛里，第一次，闪过了一丝……我能看懂的、名为“困惑”的光。"
PAO.13.a: "§1原来……饥饿，是这种感觉吗？§!"

PAO.14.t: "看不见的墙"
PAO.14.d: "我又偷偷地，溜了出去。\n我带了很多很多……我从索拉娜那里，“偷”来的、好吃的东西。我想，把它们，分给那些……还在饿肚子的孩子们。\n可是……城市里的气氛，变得更奇怪了。\n我看到，昨天还坐在一起、分享着同一块面包的两个工人，今天，却因为对方不小心踩脏了自己的鞋子，而互相推搡，破口大骂。\n我看到，东边街区的居民，会在自己家门口的路上，撒上碎玻璃，只是为了……不让西边街区的孩子，跑到她们这边来玩。\n我把一块很甜的蛋糕，递给一个正在哭泣的小男孩。可他身边的另一个小女孩，却立刻冲了过来，一把将蛋糕打翻在地，然后对着那个小男孩尖叫道：“他是‘北边’来的！他是我们的敌人！”\n我……完全不明白了。\n明明……食物就在眼前，明明……大家只要互相帮助，就都能吃饱。可为什么……她们要像一群被关在同一个笼子里的、饥饿的野兽一样，互相伤害呢？\n我走到那两个还在为了一块黑面包而争吵的工人中间，我想告诉她们，我这里，还有很多很多面包，足够她们两个人都吃饱。\n可她们……好像，完全看不见我。\n她们的眼睛里，只有对彼此的、那种我无法理解的、滚烫的仇恨。\n我站在她们中间，第一次，感到了一种……比万年孤寂，还要刺骨的寒冷。\n我好像……和她们之间，隔着一堵看不见的、冰冷的墙。\n我……要怎么做，才能……让她们，重新看到彼此呢？"
PAO.14.a: "§1索拉娜……这就是……你想要的吗？§!"

PAO.15.t: "“被选中”的代价"
PAO.15.d: "索拉娜说……她为这个死气沉沉的城市，注入了“活力”。\n她说……她给了她们一个值得为之奋斗的“希望”。\n我站在城堡最高的露台上，看着她口中的那份“活力”。\n我看到……一场场为了争夺“被选中”名额的、血腥的角斗，正在城市的每一个角落里上演。\n邻居，会为了一个虚假的举荐名额，向警察告发他的邻居。\n兄弟，会为了能让自己先一步爬上那座通往城堡的长桥，而毫不犹豫地，将自己的兄弟，从悬崖上推下去。\n甚至……有母亲，会为了能让自己的孩子，获得进入城堡的“资格”，而亲手，将别人家的孩子，献祭给那些……根本不需要祭品的“夜莺的魂灵”。\n今天，是这个月的“遴选日”。\n\n有一个年轻人，成功了。他踩着无数人的尸体，浑身是血地，终于，爬到了那座通往城堡的长桥上。\n他以为……他赢了。\n可就在他即将踏入城堡大门的那一刻，两个守在门口的“夜莺的魂灵”，无声地，举起了手中的长枪，交叉着，拦住了他的去路。\n然后，一个冰冷的、不带任何感情的声音，从城堡的广播里传出，响彻了整个城市。\n那是……索拉娜的声音。\n“很遗憾。你们之中，并没有‘被选中者’。下个月，继续努力吧。”\n那个年轻人，跪倒在了桥上。他看着那扇在他面前，缓缓关上的、巨大的城堡之门，又回头，看了看桥下那些……正对他发出恶毒诅咒的、曾经的同胞。\n然后，他发出了一声……不似人类的、绝望的嘶吼，纵身一跃，从那座……代表着“希望”的长桥上，跳了下去。\n我……静静地看着这一切。\n我缓缓地，走回了那个……温暖的、安宁的、属于我一个人的房间。\n我走到那面……光洁如水的镜子前，看着镜子里，那个穿着华丽公主裙的、天真的、不食人间烟火的……“我”。\n我突然觉得……"
PAO.15.a: "§1……恶心§!"

PAO.16.t: "什么是“爱”？"
PAO.16.d: "今天，是“神恩”降临的日子。\n索拉娜从所有“顺从”的人类中，挑选出了十个“最忠诚的幸运儿”，允许她们，进入我们这座永恒的城堡，永远地，摆脱外面的饥饿与痛苦。\n整个城市，都为此而陷入了一种病态的狂热。我看到无数人，为了能得到那个虚无缥缈的名额，互相揭发，互相出卖，甚至……向自己的亲人，挥起屠刀。\n我看不下去了。我躲回了房间，捂住了耳朵。\n直到深夜，一阵撕心裂肺的、绝望的哭喊声，穿透了厚厚的墙壁，也穿透了我的心脏。我走了出去。\n在城堡冰冷的、巨大的门外，一个年轻的母亲，正跪在滂沱的暴雨里。她的孩子，因为在之前的“选拔”中，不够“忠诚”，而被淘汰了。而她自己，却成为了那十个“幸运儿”之一。\n现在，她正用力地，用自己的额头，撞击着那扇她再也无法为孩子打开的、冰冷的城堡大门。\n“求求您……求求您……”她哭得上气不接下气，“把我的名额……给他吧……他还那么小……他还什么都不懂……”\n“我愿意……我愿意去矿场……我愿意去死……求求您……让他进去吧”\n我站在她的身后，撑着伞，静静地听着。雨水，打在伞面上，发出沉闷的声响，像一声声敲在我心上的、冰冷的重锤。\n我抬头望向城堡最高处的那扇窗。索拉娜就站在那里。她正静静地，俯瞰着下方这幕由她亲手导演的、残忍的戏剧。她的脸上，没有任何表情。\n那一刻，我突然就什么都明白了。\n我明白了，我过去那些天真的、想要用“故事”和“糖果”，去拯救她们的想法，是多么的可笑。我明白了，索拉娜她从来就没有想过要给这些人真正的“幸福”。她只是，在用一种更高级、更残忍的方式，在重复着她自己童年时，所经历过的那场地狱。\n她不是在统治。她是在……复仇。向这个，曾让她像野狗一样，在泥泞里挣扎的、该死的世界，复仇。\n而我……\n我看着那个在泥水里，为了自己的孩子，连尊严都彻底舍弃的、渺小的母亲。\n我又想起了很久很久以前，只在童话书里才能看到的，那个为了能让孩子活下去，而选择背负了整个世界的罪责的母亲。\n原来……原来，真正的“爱”，不是把一个人，锁在自己为她建造的、完美的、安安静静的城堡里。\n而是……愿意为了她，走出去，走进那片……自己最害怕的、充满了风雨和泥泞的世界里去啊。\n我缓缓地，收起了伞。冰冷的雨水，瞬间，将我浑身都淋得湿透。\n我走到那个母亲的身边，蹲下身，用我那双……只会弹奏竖琴、只会翻阅童话书的、冰冷的手，轻轻地，扶住了她那双，因为绝望，而深深陷入泥土里的、温暖的手。"
PAO.16.a: "§1我爱你们，人类。我爱你，索拉娜。§!"

PAO.17.t: "请停下来！"
PAO.17.d: "索拉娜疯了。\n我看着她用最残酷的手段，将人民逼上了绝路。然后，又用一种近乎自毁的姿态，等待着那场……由她亲手点燃的、审判的火焰，将她自己也一并吞噬。\n我……不能让她得逞。我不能眼睁睁地看着，她就这样在我面前，把自己……烧成灰烬。\n于是，我走了出去。第一次，违背了她的“命令”，走出了那座冰冷的城堡。\n我来到了战场。我看到了那些……眼睛里燃烧着和“野火”一样火焰的人们。她们愤怒，她们绝望，她们……只想摧毁眼前的一切。\n我也看到了，那些依旧忠诚于索拉娜的、强大的禁卫军。她们的眼中，没有思想，只有执行命令的、绝对的服从。\n她们，即将在这里，进行一场……毫无意义的、互相毁灭的血战。\n我走到了她们的中间。\n“……停下来。”\n我的声音很轻，却穿透了所有的呐喊与嘶吼。\n所有人都愣住了，她们看着我。这个……她们眼中，和暴君索拉娜并无区别的、另一个“女王”。\n“我知道……你们恨她。”我看着那些起义的人民，声音里，带着一丝我自己都未曾察觉的颤抖，“我也……恨她。”\n“我恨她……把我一个人，丢在那个冰冷的家里，那么久。”\n“我恨她……把我最喜欢的、安安静静的世界，弄得这么吵闹。”\n“我更恨她……像现在这样，一声不吭地，就想把自己……变成一个谁也够不着的、冰冷的坏人。”\n然后，我转过身，看向那些……已经将武器对准了我的、索拉娜的禁卫军。\n“……我也……爱她。”\n我的声音，轻得像一阵叹息。\n“我爱她……曾为我带来的、唯一的光。”\n“我爱她……就算自己伤痕累累，也依然会记得，为我带回一颗糖的、笨拙的温柔。”\n“所以……”我张开双臂，挡在了她们和那些愤怒的人民之间，“……我不允许。我不允许你们，为了她那错误的、任性的命令，去伤害这些……和她一样，只是想活下去的人们。我也决不允许，你们，为了所谓的‘正义’，去伤害这个……我唯一想守护的、笨拙的……坏孩子。”\n我不知道，她们能不能听懂。我也不知道，她们会不会，在下一秒，就将我和她们的敌人，一同撕碎。\n我只是……闭上了眼睛。\n然后，对所有人，说出了我……唯一能想到的、笨拙的请求。\n“……求求你们。”\n“……在审判她之前，能不能……先试着，相信我一次？”"
PAO.17.a: "§1整个战场，都陷入了长久的、死一般的寂静§!"

PAO.18.t: "理想与哀歌"
PAO.18.d: "“……莉莉安娜。”\n你的声音，很轻，像是在说一个，与自己无关的故事。“我的那个‘理想’……其实很简单。”\n“我只是……不想再看到任何人，像我小时候那样，为了半块发霉的面包，就和野狗一起，在泥潭里打滚了。”\n“我以为……只要我拥有了最绝对的权力，建立起最森严的秩序，把所有人都像齿轮一样，安排在他们该在的位置上……饥饿，和纷争，就都会消失了。”\n“我以为……我是在为她们，建造一座，能抵御一切风雨的、最坚固的堡垒。”\n“可我错了。”你的嘴角，露出了一丝苦涩的、自嘲的笑。\n“我忘了……人，不是齿轮。她们会痛，会爱，会为了那些……我早已丢掉的、名为‘尊严’的东西，去拼上自己的性命。”“我忘了……当饥饿消失了，她们就会开始渴望‘自由’。而‘自由’，恰恰是我那座完美的、绝对秩序的堡垒里，唯一，也是最不需要的东西。”\n“于是……野火，就燃起来了。”“我输了。输得一败涂地。”\n“当我被那些……我曾视为蝼蚁的人们，从王座上赶下来的时候，我才终于明白……我的那个‘理想’，从一开始，就只是一个……自以为是的、傲慢的笑话。”\n“你把我带了回来。你用你的温柔，治愈了我的伤口，也……照亮了我内心最深的黑暗。”\n“我看着你，用你那天真的、笨拙的方式，去爱着那些……曾经被我伤害过的人们。我看着她们，在你面前，慢慢地，放下了仇恨，露出了笑容。”\n“我突然……就嫉妒了。”“我嫉妒你，莉莉安娜。我嫉妒你……能那么轻易地，就得到我花了半辈子、用尽了所有卑劣手段，都得不到的东西。”\n“那一刻，我终于……为你，也为她们，找到了那条……唯一的、通往真正‘幸福’的路。”\n你转过头，深深地，看着我。那双曾燃烧着火焰的眼睛里，此刻，只剩下一种……无边无际的、温柔的悲伤。\n“莉莉安娜。你知道吗？人民的怒火，是不会凭空消失的。它需要一个出口。需要一个……能让她们将所有仇恨，都倾泻于其上的、罪恶的化身。”“而我……就是那个，最完美的‘罪人’。”“我的罪，罄竹难书。我的手，沾满了她们亲人的鲜血。这一切，都无法被原谅，也……不该被原谅。”“只有我……这个旧时代的、最后的暴君，彻彻底底地，消失在这个世界上……”“她们，才能真正地，放下过去，去拥抱，你为她们带来的、那个崭新的、温柔的未来。”\n“只有我的王座，彻底变成一座冰冷的坟墓……”\n“……你，才能在那片废墟之上，为她们，也为你自己，加冕成……真正的、受人爱戴的女王。”"
PAO.18.a: "§1不……不要……§!"

PAO.19.t: "王座上的灰烬"
PAO.19.d: "战斗……结束了。\n当我和人民一起，推开那扇沉重的、未曾上锁的殿门时。\n我们就看到了她。\n她没有穿那身冰冷的盔甲，只是穿着一件……我第一次见到她时，她穿过的那件、朴素的白色长裙。\n她就静静地，坐在那张象征着无上权力的王座上，微笑着，看着我们。\n她的身前，没有一个卫兵。\n她的手中，也没有任何武器。\n她只是……在等。\n我缓缓地，走上前去。身后，是人民压抑着的、充满了仇恨的呼吸声。\n我走到了她的面前。\n“……莉莉。”她对我笑了。那是我……回来以后，第一次，看到她露出那样……不带一丝阴霾和痛苦的、真正温柔的笑容。\n“你看，”她从王座上跪了下来，指了指我身后，那些……眼中燃烧着火焰的人们，“……她们，是不是……比我们那些只会服从的‘魂灵’，要……可爱得多？”\n我……说不出话来。\n“……以后，”她伸出手，似乎想……像很久很久以前那样，再碰一碰我的脸颊。可她的手，却在半空中，就开始……一点一点地，化作了灰色的、飞舞的尘埃，“……这个家，就……交给你了。”\n“……要……好好地……爱她们啊……”\n然后，她就在我的面前，在所有人的注视下，彻底地，化作了一捧……温暖的、黯淡的灰烬，轻轻地，洒满了那座冰冷的王座。\n外面，传来了山呼海啸般的、庆祝胜利的欢呼声。\n人们在庆祝暴君的死亡。\n人们在庆祝光明的到来。\n人们在庆祝……她们的自由。\n我跪在那座空荡荡的王座前，伸出颤抖的双手，小心翼翼地，接住了那些……还在不断飘落的、她最后留下的、温暖的余烬。\n我爱她们。\n是的。\n我爱着这些……善良的、勇敢的、教会了我什么是“爱”的人们。\n可是……\n§R我也是……那么那么地……爱着这个……被她们，视为不共戴天之敌的、世界上最大的……坏蛋啊！！！§!"
PAO.19.a: "§t（盛大的庆典§!§1 ，§!§L无声的葬礼）§!"

PAO.20.t: "公主的“裁决”"
PAO.20.d: "我把她们都请来了。\n那些……吵得最厉害的、工人的代表，和农民的代表。\n我想……像索拉娜那样，听一听她们的声音，然后，为她们，做出一个“公平”的裁决。\n可是……我听不懂。\n工人们说，没有她们生产的工具，农民就无法耕种。\n农民们说，没有她们种出的粮食，工人就会饿死。\n她们说的……好像，都很有道理。\n这就像我花园里的两朵花。一朵是红色的，一朵是白色的。我不能说，哪一朵，比另一朵，更漂亮。因为她们都很好看。\n她们还在吵。声音越来越大，整个房间，都变得和生者的世界一样，吵闹不堪。\n我有点……不知所措了。\n然后，我想起了一个索拉娜曾经教给我的、她说是在她故乡很流行的、一种解决纷争的“游戏”。\n我让侍从，拿来了很多很多……黑色和白色的、很光滑的小石子。\n我把黑色的，分给了工人代表。把白色的，分给了农民代表。\n然后，我用我最温柔、也最认真的语气，对她们说：\n“……那个……我们，不吵了好不好？”\n“我们来玩一个游戏吧。你们把自己的石子，放在我面前。谁放的石子……比较好看，就算谁赢，怎么样？”\n整个房间，瞬间，就安静了下来。\n所有的人，都用一种我完全无法理解的、混杂着震惊、茫然和一点点……想笑又不敢笑的表情，看着我。"
PAO.20.a: "§1（是我又说错话了吗？）§!"

PAO.21.t: "那一声哭啼"
PAO.21.d: "我去看望那个新生儿了。\n那是我第一次，如此近距离地，观察一个刚刚来到这个世界的、最纯粹的生命。\n她好小，好软，皮肤像我花园里最娇嫩的花瓣。她睡着的时候很安静，呼吸均匀，像一团小小的、温暖的光。\n我看着她，突然就想到了一个问题。\n一个我统治了夜莺国度上万年，却从未思考过的问题。\n我们亡灵，从诞生之初，形态与本质就已固定。一个士兵的灵魂，将永远是士兵；一个工匠的灵魂，也永远是工匠。我们只是在永恒的寂静里，重复着自己被赋予的角色。\n可她不一样。\n这个小小的、现在只会睡觉和哭泣的生命，她未来会变成什么样子呢？\n她会长大，会学习，会爱上一个人，会为了某个理想而欢笑或流泪。她的灵魂，会像一块未经雕琢的璞玉，在漫长的岁月中，被她所经历的一切，慢慢地，塑造成一个独一无二的、无法被复制的形状。\n是什么东西，决定了这一切？\n是她与生俱来的天性？是她父母的教导？还是……这个，由我守护的、吵闹又温暖的世界？\n就在我沉思的时候，那个小小的婴儿，突然醒了。\n她睁开眼睛，看到了我这个陌生的、散发着冰冷气息的存在。然后，她毫不意外地，张开嘴，发出了来到这个世界上之后，一声响亮的、中气十足的哭啼。\n那哭声，一点也不好听。很吵闹。\n可我……却好像，从那充满生命力的哭声里，听到了一首……比我听过的任何一首安魂曲，都更动听的歌。"
PAO.21.a: "§1（这就是生命的声音吗？）§!"

PAO.22.t: "初次见面"
PAO.22.d: "摇篮，打开了。\n伴随着一阵柔和的、如同风铃般的声音，那个我倾注了所有希望的女孩，缓缓地，睁开了她的眼睛。\n那是一双……和她一模一样的、火焰般的红色眼眸。\n但里面，没有了我所熟悉的、那些痛苦的伤痕与燃烧的野心。只有一种……像刚刚出生的雏鸟般、对这个世界最纯粹的、清澈见底的好奇。\n她从摇篮中坐了起来，黑色的双马尾随着她的动作，俏皮地晃动着。她看到了我，没有胆怯，也没有疏离。她只是歪了歪头，然后，露出了一个比我花园里所有花朵加起来，还要灿烂的笑容。\n“你好呀！”她的声音，像阳光下跳跃的溪流，充满了清脆的活力，“你是……创造了我的公主殿下吗？这里，就是你说过的、那个需要被拯救的世界吗？故事里那些需要被打倒的坏蛋，和需要被保护的好人们，都在哪里呀？”\n我……被她问得愣住了。\n我为她，准备了上万句，温柔的、充满爱意的欢迎词。\n可我……一句，也说不出来。\n她不是她。\n她没有她那双，总是在深夜里，凝视着我的、复杂的眼睛。\n她没有她那种，总是带着一丝嘲讽与苦涩的、却又无比温柔的笑容。\n她更没有……我们之间，那些纠缠了上万年的、沉重的、无法被割舍的记忆。\n她是一个崭新的、一尘不染的、比我能想象到的最完美的光，还要耀眼的存在。\n她……是我的“理想”。\n也是……我永恒的、再也无法被弥补的“失去”。\n我看着她那双，充满了对“正义”与“冒险”的、天真渴望的眼睛。\n眼泪，不知不觉地，就落了下来。\n“……你怎么哭了呀，公主殿下？”她有些担心地，凑了过来，用她那双温暖的、小小的手，轻轻地，擦去了我脸上的泪水，“是那些坏蛋，欺负你了吗？你告诉我，她们在哪里！我现在，就去为你，打倒她们！”\n我看着她，终于，露出了一个……比哭，还要悲伤的笑容。\n我轻轻地，握住了她的手。\n“……不。我没有哭。”\n“……我只是，太开心了。”\n“……欢迎回来。”\n“……我的……‘光明’。”\n“……露西莉亚。”"
PAO.22.a: "§1你好，露西莉亚。再见，索拉娜。§!"

PAO.23.t: "第一次看到笑容"
PAO.23.d: "我带她，去参观了我们莉兰迪亚最引以为傲的杰作——“无忧花园”。\n在这里，所有的人类，都不再需要劳作。她们的生活，由绝对服从、不知疲倦的“夜莺的魂灵”们悉心照料。食物会准时出现在餐桌上，衣物会被清洗得一尘不染。这里没有饥饿，没有劳累，一切，都像我曾为你描绘的、那个最完美的童话。\n我自豪地向她介绍：“你看，露西莉亚。在这里，每一个人，都能得到最妥善的照顾。这就是……我为你准备的、一个没有悲伤的世界。”\n她看着眼前的一切，看着那些在花园里散步、下棋、无所事事的人们，那双红色的眼睛里，却充满了……我无法理解的困惑。\n“莉莉安娜。”她突然，拉住了我的手，指着不远处一个正在给水晶花朵“浇水”的老人，小声地问我，“……那位老奶奶，她……为什么，不笑呢？”\n我愣住了。\n是啊。为什么呢？\n我给了她们一切。我为她们，消除了所有物质上的烦恼。可她们的脸上，却只有一种……平静的、近乎麻木的表情。就像一群，被照顾得很好的、漂亮的人偶。\n就在这时，一阵风，吹过花园。将远处一个孩子手中，用蒲公英编成的小小花冠，吹到了半空中。\n孩子“呀”地叫了一声，眼看就要哭出来了。\n露西莉亚动了。\n在她思考之前，她的身体，已经像一支离弦的箭，冲了出去。她高高地跃起，在那顶小小的花冠落地之前，轻巧地，将它接在了手中。\n她跑到那个孩子的面前，蹲下身，把那顶完好无损的花冠，重新，戴回了那个孩子惊喜的、瞪圆了眼睛的、小小的脑袋上。\n然后，她露出了一个，比花园里所有水晶花朵加起来，还要灿烂的、发自内心的笑容。\n那个孩子，看着她，也笑了。\n那是……我在这座花园里，第一次，看到的、真正的笑容。\n我站在远处，看着这一幕。看着她们一大一小，两个身影，在阳光下，笑得那么开心。\n我的心里，第一次，泛起了一丝……连我自己也无法理解的、混杂着喜悦与失落的复杂情绪。\n我好像……为她，建造了一座最完美的、没有悲伤的鸟笼。\n可她，却用自己的翅膀，为这座鸟笼里，带来了第一缕……真正自由的风。"
PAO.23.a: "§1她……好像和我预想的，有些不一样。§!"

PAO.24.t: "没有结局的故事书"
PAO.24.d: "夜深了。\n这是她最喜欢的时刻。\n每天晚上，她都会缠着我给她讲一个新故事。而我，也总会如她所愿。\n我捧着那本我亲自“修改”过的童话书，用最轻柔的声音，为她讲述着那些关于善良与美好的故事。\n“……然后，勇敢的骑士走进了喷火龙的山洞。”我念道，“可他没有拔出宝剑。他只是，给了那头因为孤独而喷火的巨龙，一个大大的、温暖的拥抱。巨龙的火焰，就变成了五彩的糖果，落满了整个山谷。”\n“哇……”她发出了小小的、满足的赞叹声，眼睛里，闪烁着比窗外星星还要亮的光。\n我微笑着，翻到了下一页。\n“……最后，迷路的小公主，找到了那座用饼干和糖果盖成的小屋。屋子里的老奶奶，并没有像传说中那样，想把她吃掉。她只是，给了小公主一碗热乎乎的南瓜汤，然后，为她指明了回家的路。”\n我讲着这些……被我抽去了所有尖刺和阴影的故事。我看着她那张因为听到美好结局而充满了幸福与安宁的睡脸。\n我的心里，感到了一种前所未有的平静。\n就在我准备合上书本，让她安然睡去时。\n她突然，迷迷糊糊地，说了一句梦话。\n“……莉莉安娜……”她的声音，像棉花糖一样柔软，“……那……那个被你拥抱的‘坏蛋’……后来……去哪里了呀？”\n我捧着书的手，突然僵住了。"
PAO.24.a: "§1……睡吧，我的孩子。§!"

PAO.25.t: "请惩罚我吧"
PAO.25.d: "她回来了。\n从那个……充满了哭声的家庭里，回来了。\n她没有像往常一样，跑来找我，兴奋地讲述她又“帮助”了谁。\n她只是，一个人，走进了这座空旷的主殿。然后，解下了腰间那把，我亲手为她打造的、只为守护而存在的剑，双膝跪地。\n我走到她的面前，心里，涌起一种不祥的预感。\n“露西莉亚，起来。地上凉。”我轻声说。\n她没有动。她只是，低着头，声音里，带着一种我从未听过的、沙哑的颤抖。\n“莉莉安娜。”\n“……我，是不是……一个很没用的骑士？”\n我愣住了。\n“你说过的，我的使命，是守护人民的笑容，是让这个国家，再也没有眼泪。”她抬起头，那双红色的眼睛里，第一次，没有了光，只有一片……湿漉漉的、浓得化不开的迷茫。\n“可是……今天，我看到她们哭了。我把我从童话书里学来的、所有能让人开心起来的方法，都试了一遍。我给了她们糖果，给她们讲了笑话，我还向她们保证，我会为她们，打倒所有让她们不开心的‘坏蛋’。”\n“……可她们……却哭得更伤心了。”\n“她们说……她们的家人，再也回不来了。”\n“莉莉安娜……”她看着我，像一个迷路的孩子，问出了那个……最天真，也最残忍的问题。\n“……‘死亡’……是不是，就是那个……连我，也无法打倒的、最坏最坏的……‘坏蛋’？”\n我……无法回答。\n我只能看到，她眼中的那份、对于“绝对正义”的、纯粹的信仰，第一次，出现了裂痕。\n然后，她缓缓地，将那把剑，双手举起，捧到了我的面前。\n“……我让人民流泪了。我违背了我的誓言。我……是个失败的守护者。”\n“……所以，莉莉安娜。请按照骑士的法则，来惩罚我吧。”"
PAO.25.a: "§1我该怎么向她解释，这个世界的悲伤？§!"

PAO.26.t: "撕碎谎言"
PAO.26.d: "你没有回答我。\n那天，你只是沉默地，摸了摸我的头，然后，就离开了。\n我知道，你在害怕。\n莉莉安娜，你在害怕那个你还没说出口的答案，会把我变成另一个，你认识的人。\n所以我决定，自己去找。\n我把自己关在了书房里。我不再只看你给我准备的那些、结局永远是美好的童话了。我开始去翻阅那些被你藏起来的、关于真实历史的、布满了灰尘的卷宗。\n我看到了。\n我看到了，在索拉娜的王国里，那些仅仅因为“有趣”，就被送上绞刑架的诗人。\n我看到了，那些会因为听到孩子的哭声而感到愉悦的、旧帝国的贵族。\n我看到了……战争，瘟疫，背叛……和无数，毫无理由的、纯粹的恶意。\n我一页一页地翻着。\n我的手，在抖。我的心，像被一双冰冷的手，一点一点地，撕得粉碎。\n书上说的那些……那些可以用“爱”和“拥抱”，去感化的敌人……\n一个，都没有。\n这里只有一群群，戴着人类的面具的、无法被理解的怪物。\n……\n骗子。\n你们……全都是骗子。\n那些童话书，是骗我的。\n那些英雄的故事，是骗我的。\n你……也是骗我的。\n我站起来，发疯一样，把我曾经最宝爱的那些童话书，一本一本地，从书架上扯了下来，用力地，撕得粉碎。\n我不要再看到那些虚假的、亮晶晶的“希望”了。\n我只是，跪在这片由谎言组成的、洁白的废墟里。\n然后，对自己，问出了那个……你一直，不敢回答我的问题。\n“如果，爱，无法战胜邪恶。”\n“那么，我的剑，到底是为了什么而挥舞的呢？”"
PAO.26.a: "§t骑士的童话，结束了。§!"

PAO.27.t: "行囊里的童话"
PAO.27.d: "明天，我就要走了。\n去往那个你再也无法为我描绘的、真实的世界。\n我看着你，蹲在我的行囊前，像一个普通的、为即将远行的孩子担忧的母亲。\n你把一件叠得整整齐齐的、厚厚的斗篷，又塞了进去。\n“外面会冷的。”你轻声说，头也没抬，“尤其是在山里，夜里的风很硬。”\n然后，你又拿出了一小袋亮晶晶的水晶糖。\n“这个也带上。不开心的时候，吃一颗。甜的东西，总能让人有力气一点。”\n最后，你从自己的口袋里，拿出了一个小小的、用最柔软的天鹅绒布包裹着的东西，小心翼翼地，放进了行囊的最深处。\n我看着你的动作，终于，还是忍不住，开口了。\n“莉莉安娜。”\n我的声音很平静。\n“……你错了。”\n你整理行囊的手，停顿了一下。\n“那些书，你说错了。”我缓缓地说，“这个世界上，有很多‘坏人’，是无法被拥抱，也无法被感化的。她们……就是纯粹的‘恶’。”\n你沉默地，站起身，转过来，看着我。\n你的脸上，没有我想象中的惊讶，也没有谎言被揭穿时的慌张。只有一种……比月光还要温柔的、带着一丝悲伤的、平静的眼神。\n“……那你，打算怎么办呢？”你轻轻地问。\n“我不知道。”我诚实地回答，“我只知道，我过去所相信的一切，都可能是错的。我甚至不知道，我手中的这把剑，还能不能……守护好你为我描绘的那个、美好的世界。”\n你走到我的面前，伸出手，轻轻地，为我理了理有些凌乱的衣领。\n“露西莉亚。”\n你的声音，像一阵温暖的风，吹散了我心中所有的迷雾。\n“……我让你读那些故事，不是为了让你相信，这个世界没有黑暗。”\n“……我只是想让你，在学会如何与黑暗战斗之前，先知道……光明，到底是什么样子的。”\n“我只是想让你，先爱上这个世界。爱上这里会笑的人们，爱上这里会开的花，爱上这里……所有所有，值得被守护的美好。”\n“这样，当你以后，真的遇到了那些……无法被原谅的‘恶’时。”\n你捧起我的脸，用你的额头，轻轻地，抵住了我的额头。\n“……你就永远，不会忘记，自己，到底……是为了什么，才拔出剑的了。”"
PAO.27.a: "§t这才是童话本身的意义吗§!"

PAO.28.t: "第一次，也是最后一次警告"
PAO.28.d: "我找到了她们。\n就在城西的广场上。那里，空间像是被折叠了起来，充满了不祥的气息。\n我看到了那个……传说中的魔法少女。她很强大，正独自一人，对抗着一个我看不见的、却能感受到其巨大恶意的敌人。\n可她……也同样很傲慢。\n她的战斗，掀起了巨大的狂风，吹倒了房屋；她释放的魔力，像失控的洪流，在我们脚下的地面，犁出了深深的沟壑。\n她没有注意到，在她身后不远处，一个抱着孩子的母亲，正因为躲闪不及，即将被一块被魔力卷起的巨石砸中。\n我冲了过去。\n我用我的剑，挡住了那块石头。\n战斗结束了。那个看不见的敌人，消失了。\n那个魔法少女，缓缓地，从空中降落下来。她看着我，眼神冰冷，像是在看一个……打扰了她“工作”的、不知好歹的虫子。\n“你在做什么，凡人？”她的声音，像没有温度的水晶，“你差点，就破坏了我的‘净化’。”\n“你在做什么？”我反问她，同时，将那个还在瑟瑟发抖的母亲和孩子，护在了我的身后，“你的‘净化’，差点，就毁掉了你发誓要守护的东西。”\n她的脸上，第一次，露出了……名为“错愕”的表情。"
PAO.28.a: "§t我们……到底，在守护着什么？§!"

PAO.29.t: "第一次，也是最后一次警告？"
PAO.29.d: "又是一场……无聊的狩猎。\n那只躲在阴影里的怪物，比我想象的还要弱小。解决它，甚至没有让我感到一丝的疲惫。\n就在我准备给予它最后一击时，一个“意外”，发生了。\n一个浑身散发着奇怪光芒的、有着黑色双马尾的“凡人”女孩，突然，像一颗炮弹一样，冲进了我的结界。她用她那把看起来华而不实的剑，挡住了一块……我根本没有放在心上的、飞散的碎石。\n她……在做什么？\n我结束了战斗，落在了她的面前。\n我想斥责她。斥责她的愚蠢，斥责她的无知，斥责她这种……毫无意义的、多愁善感的“善良”。\n可我……却说不出口。\n因为，我看到了她身后的那个凡人母亲。那个女人，正用一种……我从未见过的、充满了感激和信赖的眼神，看着眼前这个，同样是“凡人”的女孩。\n那种眼神……她们，从未，对我们露出过。\n她们看我们时，眼中只有敬畏，和恐惧。\n“你的‘净化’，差点，就毁掉了你发誓要守护的东西。\n那个黑发女孩，对我说道。\n她的声音，很平静。\n可那句话，却像一把最锋利的剑，刺穿了我用强大和孤独，伪装了无数年的、冰冷的盔甲。"
PAO.29.a: "§9我们……到底，在守护着什么？§!"

PAO.30.t: "两种不同的光"
PAO.30.d: "她赴约了。\n那个魔法少女的领袖，独自一人，来到了我的面前。\n“我还是无法理解你。”她先开了口，声音像没有温度的月光，“你的力量很弱小，你的觉悟很天真。你把时间，浪费在那些……无意义的、个人的悲欢离合之上。而我们，背负的是整个世界的‘因果’，是在你们看不见的地方，对抗着真正的‘绝望’。我们的战斗，根本不在同一个层面上。”\n我没有反驳她。\n我只是，指了指我们脚下，那片……灯火通明的城市。\n“你看。”我说。\n“那里，有刚刚下班的工人，正走在回家的路上。那里，有围在餐桌旁的家人，在分享着一天的见闻。那里，还有无数个孩子，正在父母的故事声中，安然睡去。”\n“这些……在你看来，或许都是‘无意义’的、个人的悲欢离合。”\n“可对我来说，她们，就是我的整个世界。”\n我抬起头，直视着她那双，因为背负了太多而变得不再像人类的、清澈的眼睛。\n“你的战斗，是为了守护一个‘概念’。而我的战斗，是为了守护每一个‘具体的人’。你的光，照亮的是天空。而我的光，只想点亮，她们窗前的每一盏灯。”"
PAO.30.a: "§t也许……我们，并没有那么不同。§!"

PAO.31.t: "两种不同的光？"
PAO.31.d: "我赴约了。\n我想……最后一次，让她明白，我们之间那道无法被逾越的鸿沟。\n我告诉她，我们所背负的宿命，是她这种……天真的、活在童话里的骑士，永远无法理解的重量。\n可她……没有和我辩论。\n她只是，让我去看，她脚下的那片土地。\n那片……吵闹的、混乱的、充满了各种各样……我早已舍弃的、属于“凡人”的情感的土地。\n她说，那些，就是她的世界。\n她说，我的光，照亮的是天空。而她的光，只想点亮，窗前的每一盏灯。\n那一刻，我突然，就说不出话来了。\n我想起了很久很久以前……在我还没有成为“领袖”，只是一个普通女孩的时候。\n我之所以，会签下那份契约，许下那个……守护世界的愿望。\n最初的、最初的那个理由……\n好像……也只是为了，能让我最喜欢的那个人，在每一个夜晚，都能安安心心地，回到那盏……为她而亮的、小小的、温暖的灯下而已。"
PAO.31.a: "§9也许……我们，并没有那么不同。§!"

PAO.32.t: "那么，故事该怎么讲？"
PAO.32.d: "她……真的来了。\n没有带着卫兵，也没有穿着那身华丽的战袍。她只是，像一个普通的邻家大姐姐一样，走进了我们新建的图书馆。\n孩子们都很好奇，围着这个……身上好像会发光的、漂亮的大姐姐。\n我把那本我最喜欢的、也是莉莉安娜为我修改过的童话书，递给了她。\n“那个……”我有点不好意思地说，“今天……轮到我给大家讲故事了。可是……可是我……不是很会讲。你……你能不能……帮帮我呀？”\n她看着我，又看了看周围那些……充满了期盼的、亮晶晶的眼睛。\n她的脸上，第一次，露出了那种……名为“不知所措”的表情。\n她接过了那本童话书，翻开了第一页。\n上面写着：“很久很久以前，有一条很坏很坏的喷火龙……”\n她念到这里，就卡住了。\n她抬起头，用一种很复杂的眼神，看着我。\n我好像……有点明白了。\n在她的世界里，“坏龙”，是需要被立刻消灭的敌人。是不需要，也不会有任何“然后”的。"
PAO.32.a: "§t故事，可以有很多种讲法。§!"

PAO.33.t: "故事该怎么讲？"
PAO.33.d: "我……真的来了。\n我不知道自己为什么要来。\n或许，我只是想亲眼看看，那个被她称为“世界”的、小小的、温暖的灯火，到底是什么样子的。\n然后……她就把一本童话书，塞进了我的手里。\n她说，她不会讲。\n我翻开了书。\n“……有一条很坏很坏的喷火龙……”\n我的喉咙，像是被什么东西堵住了。\n我的一生，都在和各种各样的“喷火龙”战斗。我知道它们有多么强大，多么残忍，也知道……要付出多大的代价，才能将它们彻底消灭。\n可这本书……要我怎么讲下去？\n讲骑士如何用剑刺穿它的心脏吗？讲它的血，染红了整个山谷吗？\n不行。\n我不能……对这些，还相信着“拥抱”就能解决一切的孩子们，说出这么残忍的故事。\n就在我沉默的时候。\n那个黑发女孩，突然，凑到了我的耳边，用只有我们两个人能听到的声音，悄悄地，对我说了几句话。\n她说：“……莉莉安娜告诉我，这个故事的后面，是骑士发现，那条龙，只是因为牙疼，才乱喷火的。后来，骑士为它拔掉了坏掉的牙齿，她们就成了好朋友。”\n我……愣住了。\n我看着她，看着她那双……清澈得，仿佛能倒映出整个世界的、红色的眼睛。\n我突然……就笑了。\n笑得……连我自己，都觉得有些不可思议。\n我清了清嗓子，然后，对着面前那些，充满了期盼的孩子们，用我能想到的、最温柔的语气，缓缓地，开始了我的讲述：\n“……很久很久以前，有一条……其实一点也不坏的、只是有点可怜的……喷火龙……”"
PAO.33.a: "§9故事，可以有很多种讲法。§!"

PAO.34.t: "花朵的“悄悄话”"
PAO.34.d: "莉莉安娜为她们建造了这座很漂亮的花园。\n但我总觉得，这些水晶花，好像有些不开心。她们虽然永远不会凋谢，但也永远，都只是保持着同一个不会改变的样子。\n所以我决定，每天晚上都来给她们浇浇水。我知道她们其实不需要水，可我就是觉得，如果我每天都来看看她们，和她们说说话，她们一定会变得更精神一点。\n今天晚上，那个魔法少女的领袖也来了。\n她就静静地站在我的身后看着我，她的眼神和这些水晶花一样很漂亮，也很孤单。\n她提醒我说这些花是不需要浇水的。\n我告诉她:“我知道呀。可是只是看着，是没办法和她们成为朋友的。你要关心她们，要让她们感受到你的温度，她们才会为你开出更漂亮的花呀。”\n她听了我的话好像愣住了。她低下头看着自己手里那颗像星星一样好看的宝石，很久很久都没有再说话。\n我看着她，突然就有点难过。\n我好像有点明白，为什么这些水晶花会不开心了。\n因为她们和她一样，都在用一层坚硬的、亮晶晶的外壳，把自己和这个世界隔开了。她们害怕凋谢，所以就放弃了生长。她们害怕受伤，所以,就拒绝了拥抱。\n于是我放下洒水壶，从花园的角落里，摘下了一朵我偷偷种下的、真正的、会在一夜之间盛开又会很快凋零的、小小的白色月见草，轻轻地，别在了她的头发上。\n“你看，”我笑着对她说，“虽然它明天可能就会谢掉，可是……它至少，真真正正地，为今天晚上的月亮，开过一次花呀。”\n她抬起头看着我。那双总是像冰一样冷的眼睛里，好像第一次，有了一点点融化的痕迹。"
PAO.34.a: "§t比起永恒的美丽，我更喜欢，§!"
PAO.34.b: "§t勇敢地、为月亮开过一次的花。§!"

PAO.35.t: "两种不同的花"
PAO.35.d: "我从未想过，有一天我会在战斗之后来到这样一个地方。\n这座花园是她和那个亡灵公主一起为我们建造的，这里很安静，也很温暖。那些用魔力凝结而成的水晶花朵永远不会凋谢，而被称为“夜莺”的亡灵们则会无声地为我们端上热茶，送来干净的绷带。\n这里就像一个永恒的、绝对安全的避风港。\n今晚我看到她了，那个莉兰迪亚的“公主骑士”。\n她正提着一个和她差不多高的巨大洒水壶，吃力地一棵一棵给那些水晶花浇水。水珠落在永恒的花瓣上又滑落下来，在月光下像碎掉的钻石。\n我实在是忍不住了。\n我走到她的身边，轻轻提醒她：“露西莉亚，她们是不需要浇水的。”\n她回过头看到是我，露出了一个有点不好意思的灿烂笑容。\n“我知道呀。”她说，然后继续着她那看起来有些傻气的徒劳工作。\n“可是，”她一边浇水，一边用一种理所当然的语气对我解释道，“只是看着她们是没办法和她们成为朋友的。你要为她们做点什么，要关心她们，要让她们感受到你的温度，这样她们才会为你开出更漂亮的花呀。”\n我看着她，看着她那双倒映着整片月光和水晶花海的清澈红色眼睛，一时间竟说不出话来。\n我低下头，看向自己手中那枚冰冷的灵魂宝石。\n我们魔法少女，又何尝不是一朵“花”呢？一朵……为了实现某个奇迹而瞬间绽放，却也注定要在战斗中，被绝望的尘埃一点点染上污浊，最终凋零的花。\n我们守护世界，却从不敢奢求世界的守护。因为我们知道，每一次靠近，每一次共情，都会加速我们灵魂的浑浊。\n所以我们变得骄傲，变得冷漠，用孤独，来作为我们保护自己，也保护她们的、唯一的盔甲。\n可她不一样。\n她就像一株……向着太阳、肆意生长的、最普通的向日葵。她毫不畏惧地，将自己所有的善意和温暖，都毫无保留地，倾注给她想要守护的东西。\n无论是会哭泣的人类，还是……不会说话的花朵。\n我突然就明白了。\n我们是在用“牺牲”，来守护这个世界。\n而她，是在用“爱”。"
PAO.35.a: "§9我们……到底，谁才是对的？§!"

PAO.36.t: "要去屠龙的公主骑士"
PAO.36.d: "她要走了。\n这个消息，像一阵风，传遍了我们联盟的每一个角落。\n那个莉兰迪亚的守护骑士，那个戴上了王冠、却依然会为了给水晶花浇水而忙得满头大汗的女孩，要开始她第一次的、真正意义上的远征了。\n她的目标，是那些……盘踞在这片大陆上，连我们都感到棘手的、古老的“巨龙”。\n我的同伴们，对此议论纷纷。\n有的说，她太天真了。她以为战争，也像她那些结局美好的童话书一样吗？\n有的说，她太鲁莽了。她那小小的、刚刚从废墟上建立起来的王国，怎么可能，去挑战那些根深蒂固的庞然大物？\n她们说的，都对。\n从任何一个角度来分析，这都是一场……绝非儿戏的、现实且残酷的战争。\n可是……\n我看着手心里，那朵……她当初，为我别在头发上的、小小的月见草。\n我突然，就想起了那天晚上，她对我说的那些……听起来很傻气的话。\n她说，比起永恒的美丽，她更喜欢，勇敢地、为月亮开过一次的花。\n我好像……有点明白了。\n她不是不知道前方的危险。她也不是……看不见那些所谓的“现实”。\n她只是……单纯地，无法对那些……她还没有亲眼见过的、远方的哭声，视而不见而已。\n“……真是个……笨蛋啊。”\n我对着远方的天空，轻轻地，说了一句。\n然后，我转过身，向着我们联盟的议事厅，走了过去。"
PAO.36.a: "§9是时候让她们也听一听，我们的故事了。§!"

PAO.37.t: "红茶要加糖！"
PAO.37.d: "她们真的来了。我把莉兰迪亚最大、最漂亮的会议室，装饰成了故事书里茶话会的样子。桌上摆满了最好看的蕾丝桌布，还有我拜托厨师长烤的、有着七种颜色的彩虹蛋糕。\n可她们来了以后，好像……还是有点不开心。\n她们只是静静地坐在那里，很有礼貌，但不怎么说话。也不吃蛋糕。\n我有点着急。\n我记得莉莉安娜说过，甜的东西，能让人心情变好。\n于是，我拿起糖罐，走到那个看起来最厉害的、她们的领袖面前。\n“那个……”我小心翼翼地问，“你的红茶，要不要……再加一点糖呀？甜一点，会更好喝哦。”\n她看着我，那双好像能看穿一切的、眼睛里，带着一丝我看不懂的、复杂的疲惫。\n“……谢谢你，守护骑士。”她轻轻地说，“但是，我们……不需要。”\n我看着她，又看了看桌上那些，根本没人碰的、漂亮的蛋糕。\n我好像……有点明白了。\n她们不是不喜欢甜的东西。\n她们只是……害怕。\n害怕一旦品尝过这种温暖的味道，就再也……回不到那个，只有她们一个人在战斗的、冰冷的黑夜里去了。"
PAO.37.a: "§t好像，并没有想象中那么甜§!"

PAO.38.t: "红茶要加糖？"
PAO.38.d: "我……还是来了。\n因为我无法拒绝她那双……像小狗一样、充满了期盼的红色眼睛。\n这场所谓的“茶话会”，和我想象的一样。充满了凡人式的、天真而喧闹的善意。\n桌上的蛋糕很香，红茶也很暖。\n可我们……谁也没有碰。\n我们早已习惯了用冰冷的灵魂宝石，去感知这个世界的恶意。这种突如其来的、没有任何代价的温暖，反而……让我们感到不安。\n那个天真的守护骑士，甚至想在我的红茶里，再加一勺糖。\n我礼貌地，拒绝了她。\n因为她不懂。对我们而言，“甜蜜”，是最奢侈，也是最危险的毒药。它会软化我们的意志，会让我们，在面对下一个魔女时，产生……名为“留恋”的、致命的犹豫。\n我们是守护者。守护者，是不需要被守护，也不配拥有幸福的。\n就在我准备找个借口，结束这场……毫无意义的闹剧时。\n她突然，把那块最大、最漂亮的彩虹蛋糕，推到了我的面前。\n然后，她看着我，用一种……我从未听过的、带着一丝悲伤的、无比认真的语气，说道：\n“……我知道的。”\n“我知道，你们在害怕什么。”\n“可是……再勇敢的骑士，也是需要吃饱了肚子，才能去屠龙的呀。”\n“所以……”\n“……至少，在今天，在我们这里。你们……能不能，就暂时地，忘记自己是‘守护者’。就当一个……会因为吃到好吃的东西，而感到开心的、普普通通的女孩子呢？……就……一会儿，好不好？”"
PAO.38.a: "§9好像，并没有想象中那么甜§!"

PAO.39.t: "提前熄灭的灯"
PAO.39.d: "我成功了！\n在我的请求下，她们，那些骄傲的魔法少女们，终于同意，将她们那神奇的力量，用在了我们共同的，最普通的城市建设上。\n你看，这条新修好的街道上，每一盏路灯，都注入了她们的魔力。它们比过去任何一种灯都要明亮，而且……据说，永远也不会熄灭。\n今晚，我特意拉着那个……负责这条街道魔力供给的、魔法少女，一起来看我们的“杰作”。\n“你看你看！”我兴奋地，指着那一排亮晶晶的路灯，像在炫耀自己的宝贝，“是不是很漂亮？以后，孩子们晚上回家，就再也不会害怕了！”\n她没有说话，只是静静地，看着那些光。她的脸上，带着一种……我看不懂的、很复杂的表情。\n就在这时，我们面前的那盏路灯，突然，“啪”的一声，熄灭了。\n“咦？”我奇怪地，敲了敲灯柱，“怎么回事？是……坏掉了吗？”\n我回过头，想问问她。\n然后，我看到了。\n我看到她，正痛苦地，单膝跪在了地上。她的手，死死地捂住了胸口那枚……我一直觉得很漂亮的灵魂宝石。\n而那颗宝石，此刻，正像一颗被污染的星星，光芒……变得比我上次见她时，要浑浊，要暗淡。\n“……你……”我的心，一下子就揪紧了，“你怎么了？”她抬起头，对我，露出了一个……比哭，还要难看的笑容。\n“……没什么。”她的声音，沙哑，而颤抖，“……只是……诅咒……又多了一点而已。”"
PAO.39.a: "§t所谓的“奇迹”，从来都不是免费的。§!"

PAO.40.t: "提前熄灭的灯？"
PAO.40.d: "我……还是同意了她那个天真的请求。\n因为，我无法拒绝她那双……像太阳一样、干净得没有一丝阴影的眼睛。\n我将我的魔力，注入了那些凡人的造物里。我看着那些路灯，一盏一盏地，因为我的力量而亮起。我看着那些凡人，因为这些光，而发出了……我许久未曾听过的、发自内心的欢呼。\n那一刻，我的心里，好像……也亮起了一点点，小小的、温暖的火苗。\n她拉着我，像个小孩子一样，要我去看我们的“杰作”。\n她说：“你看你看！是不是很漂亮？以后，孩子们晚上回家，就再也不会害怕了！”\n我看着她那张，因为“帮助了别人”而充满了纯粹喜悦的脸。\n我突然……就有点想哭。\n因为她不知道。\n她根本就不知道。\n我们魔法少女的力量，并非凭空而来。它源于我们许下愿望时，那份最纯粹的希望。而每一次使用魔法，去干涉这个世界的“因果”，无论是去战斗，还是……去点亮一盏小小的路灯……\n……都会不可避免地，从这个充满了悲伤的世界里，汲取等量的“诅咒”，来污染我们自己的灵魂。\n我们点亮的光越亮，我们内心的黑暗，就积攒得越快。\n就在这时，我胸口的灵魂宝石，传来了一阵熟悉的、冰冷的刺痛。\n我知道……又有一只看不见的怪物，在我的灵魂里，睁开了眼睛。\n而作为代价，那盏由我点亮的路灯，提前，熄灭了。\n我跪倒在地，痛苦地，捂住了胸口。\n她跑了过来，问我怎么了。\n我看着她那双，充满了焦急和担忧的、干净的眼睛。\n我突然，就笑了。\n笑得……那么的悲伤……那么的……开心"
PAO.40.a: "§9所谓的“奇迹”，从来都不是免费的。§!"

PAO.41.t: "没有结局的童话故事"
PAO.41.d: "我把我们的故事，写成了一本新的童话书。\n故事的前半段，写的是我的故事。写一个天真的骑士，如何相信“拥抱就能战胜一切。”\n故事的后半段，我写了她们的故事。我写了一群勇敢的魔法少女，如何为了守护世界，而与看不见的敌人战斗。\n今天，是这本书的第一次“朗读会”。我邀请了她，那个魔法少女的领袖，也一起来。\n我看到她来了。她没有和我们坐在一起，只是，远远地，站在书架的阴影里。\n我翻开了书，开始为孩子们，讲述我们的故事。\n我讲到，骑士遇到了受伤的喷火龙，用拥抱治愈了它。\n我讲到，魔法少女们用璀璨的光，驱散了笼罩王国的黑夜。\n孩子们听得入了迷，她们的眼睛里，闪烁着对英雄的崇拜，和对美好未来的向往。\n然后……我翻到了最后一页。\n那一页，是空白的。\n孩子们都奇怪地看着我。\n我看着那片空白，然后，抬起头，望向了那个，站在阴影里的、孤独的身影。\n我对着她，也对着所有的孩子们，露出了一个……比以往任何时候，都更坚定的笑容。\n“……这个故事，”我说，“还没有结局。”\n“……因为，故事里的骑士，最近，终于明白了一件事。”\n“……她明白了，那些勇敢的魔法少女们，她们在点亮世界的同时，自己，却正在一点一点地，被黑暗所吞噬。”\n“……所以，这个故事的结局，该怎么写，骑士，还没有想好。”\n“……但是，她向我保证，她一定会，为这个故事，写上一个……所有的人，包括那些勇敢的魔法少女们，都能一起，迎来幸福的、真正的、Happy Ending。”"
PAO.41.a: "§t就让我们看看吧，你所诉说的那个“奇迹”。§!"

PAO.42.t: "没有结局的童话故事？"
PAO.42.d: "我……还是来了。\n我不知道，是想看她，如何用那些天真的词句，去美化我们那残酷的宿命。还是……只是想再看一眼，那份……我早已失去的、名为“天真”的光。\n我站在阴影里，听着她，用那清脆的、充满了活力的声音，讲述着那个……属于“我们”的故事。\n她讲得很好。\n好到……连我自己，都快要相信，我们真的是一群，只需要挥舞魔棒，就能轻易战胜一切的、童话里的英雄了。\n然后……她翻到了最后一页。\n那一页，是空白的。\n我愣住了。\n然后，我听到了她的话。\n她说，她已经，知道了我们的“真相”。\n她说，她会为我们，写下一个……所有的人，都能幸福的结局。\n我看着她，看着她那双……已经不再是纯粹的“天真”，而是多了一种……名为“觉悟”的、更加耀眼的、红色的眼睛。\n我看着她，对着那些孩子们，许下了那个……在我们看来，比挑战神明，还要不自量力的、最宏大的诺言。\n我……本该嘲笑她的。\n嘲笑她的无知，嘲笑她的狂妄。\n可我……却只是，默默地，将手中的那本童话书，紧紧地，抱在了胸前。\n那本……我曾以为，永远也写不到最后一页的、我们的故事书。"
PAO.42.a: "§9就让我们看看吧，你所诉说的那个“奇迹”。§!"

PAO.43.t: "沉重的礼物"
PAO.43.d: "我把我们最好的工匠，和那些最听话的“夜莺魂灵”，都召集了起来。\n我告诉她们，我需要一件……世界上最坚固的盔甲。\n它不需要锋利，也不需要轻便。它只需要一个功能——那就是，能替那些勇敢的女孩们，挡住所有……来自世界的恶意。\n今天，它终于完成了。\n我把它，作为礼物，送给了那个……一直以来，都独自一人，承担着最多的、她们的领袖。\n“这个……”我有点紧张地，对她说，“……送给你。”\n“我……我不是很懂你们的战斗。但是我想，穿上这个的话，是不是……就能……不那么容易受伤了？”\n我看到她，伸出手，轻轻地，触摸着那套……由我们所有人，用尽了心血和祝福，才打造出来的盔甲。\n那上面，没有一丝一毫的杀气。只有一种……笨拙的、却无比坚定的、想要“守护”的心意。\n她没有立刻收下。\n她只是，抬起头，用一种……我从未见过的、带着一丝颤抖的眼神，看着我。"
PAO.43.a: "§t最坚固的盾，从来都不是钢铁。§!"

PAO.44.t: "沉重的礼物"
PAO.44.d: "我从未想过。\n有一天，我会收到这样一份“礼物”。\n我们魔法少女的战斗，是灵魂的战斗。凡间的钢铁，对我们来说，毫无意义。这是常识。\n可我……却无法对她说出这句话。\n我看着眼前这套……闪烁着柔和光芒的、崭新的盔甲。\n我能感觉到，上面，没有一丝一毫的攻击性。它存在的唯一目的，就是“守护”。\n我甚至能从上面，感受到……那些凡人工匠们，在打造它时，所倾注的、那种笨拙的、却无比真诚的善意。\n她……这个天真的骑士，用她唯一能想到的方式，试图为我们，分担那份……她本不该，也无法理解的诅咒。\n这份“礼物”，太重了。\n重得……让我那颗，早已习惯了冰冷与孤独的、本该坚不可摧的心，都开始……微微地，发烫了。\n我伸出手，轻轻地，触摸着那套，对我来说，可能……毫无用处的盔甲。\n然后，我抬起头，看着她那双……充满了期盼和担忧的、清澈的红色眼睛。\n我终于，对她，露出了一个……发自内心的、真正的微笑。\n“……谢谢你。”\n我说。“……我很喜欢。”"
PAO.44.a: "§9最坚固的盾，从来都不是钢铁。§!"

PAO.45.t: "天空不再孤单！"
PAO.45.d: "我……在飞！\n我真的……在飞！\n虽然……还不是很稳，总是会不小心，撞到旁边来扶着我的她。\n可我……真的，离开地面了！\n这对由她们的魔法和我们的技术，共同创造出来的、小小的“翅膀”，比我想象的，还要神奇。我能感觉到，风，从我的耳边吹过。我能看到，地面上，那些为我欢呼的同志们，变得越来越小。\n世界……原来，从天空上看下去，是这个样子的啊。\n“……别分心，骑士。”\n她的声音，从我身旁传来。还是和以前一样，清冷，但……好像多了一点点，我从未听过的、像是老师在指导笨拙学生时，才会有的……无奈的笑意。\n“……把你的重心，再放低一点。感受风的流动，而不是……去和它对抗。”\n她牵着我的手，带着我，在空中，划出了一道笨拙的、却无比自由的弧线。\n我看着她，看着她那双，在阳光下，像紫色水晶一样漂亮的眼睛。\n我突然，就有点想笑。\n你看，莉莉安娜。\n我……好像，真的交到朋友了呢。"
PAO.45.a: "§t从今天起，这片天空是属于我们大家的了！§!"

PAO.46.t: "天空不再孤单"
PAO.46.d: "我……从未想过。\n有一天，我会把我们最核心的秘密之一——那种驾驭魔力、在天空中飞翔的“感觉”，教给一个……凡人。\n而且……还是一个，笨拙得，让我有点头疼的凡人。\n“哇啊啊——！”\n她又一次，因为太兴奋而忘记了控制平衡，整个人，都撞进了我的怀里。\n我叹了口气，有些无奈地，扶住了她。\n“……都说了，别分心。”\n“……哦哦！对不起！”她赶紧从我怀里挣脱出来，脸颊红红的，像个做错了事的孩子，但那双红色的眼睛里，却依然闪烁着……那种能把人的心都融化掉的、纯粹的兴奋与喜悦。\n我看着她，那副在天空中，手舞足蹈的、傻气的样子。\n我的嘴角，不自觉地，就向上扬了起来。\n我好像……已经很久很久，没有像这样，笑过了。\n自从，背负起那份沉重的宿命之后，天空，对我来说，就只是一个……孤独的、冰冷的、需要我去守护的战场。\n可是……\n我看着身边这个，正努力地，学习着如何与风成为朋友的、天真的骑士。\n我突然觉得……\n天空……好像，也没有那么孤单了。"
PAO.46.a: "§9从今天起，这片天空是属于我们大家的了。§!"

PAO.47.t: "镜子里的两个人"
PAO.47.d: "莉莉安娜……最近总是，把自己一个人，关在这座最古老的圣堂里。\n我不放心，悄悄地，跟了进来。\n我看到她，正站在一面……我从未见过的、巨大而光滑的黑色镜子前。\n她没有注意到我。\n她只是，伸出手，用一种……我无法理解的、混杂着无尽的爱恋与深不见底的悲伤的眼神，轻轻地，抚摸着那冰冷的镜面。\n“你看，”她的声音，轻得像一阵叹息，“……我们的孩子，长大了。”\n“她和你……真像啊。一样的好看，一样的……固执。”\n“她现在，是所有人的英雄了。她做到了……你当年，想做，却没能做到的所有事。”\n“……她，就是你，对不对？”\n“……你把所有最好的、最干净的东西，都变成了她。然后，把所有最坏的、最痛苦的记忆，都留给了自己。”\n“……你这个……自私的、无可救药的……大笨蛋。”\n我愣住了。\n她……在和谁说话？\n我顺着她的目光，看向那面镜子。\n然后，我看到了。\n我看到镜子里，映出的，是我的脸。\n可是……在我的身后，还站着另一个人。一个……高了我整整一个头、眼中充满锐利和空洞的，我从未见过的……黑影。\n就在我看着她的时候，镜子里的那个“我”，好像也……感觉到了什么。\n她回过头，看向了那个，站在她身后的、黑色的幻影。\n她的脸上，露出了……和我此刻一样，充满了震惊与困惑的表情。"
PAO.47.a: "§t那个……“我”……是谁？§!"

PAO.48.t: "最后一个童话"
PAO.48.d: "今晚，你把我叫到了你的房间。\n你没有说话，只是拉着我，坐在了那扇能看到最多星星的窗户前。\n“露西莉亚，”你终于，用一种很轻很轻的、像在讲一个睡前故事的语气，开了口，“我，再为你，讲最后一个童话，好不好？”\n我点了点头，像往常一样，安静地，等待着。\n“很久很久以前，”你缓缓地开始了讲述，眼睛，却望着窗外那片深沉的夜空。\n“有一位很孤独很孤独的公主。她住在一座，用寂静和月光盖成的、漂亮城堡里。她唯一的伙伴，是她自己的心脏，那是一只……会唱歌的、温暖的、小小的夜莺。”\n“后来，城堡里，闯进了一束……像火焰一样、不讲道理的、温暖的光。公主很喜欢那束光，小夜莺，也很喜欢。她们，和那束光，成为了最好的朋友。”\n你讲到这里，声音，有了一丝我从未听过的、无法被掩饰的颤抖。\n“可是……那束光，想要的，比公主的陪伴更多。她想要小夜莺的歌声，只为她一个人响起，她想让整个世界，都听到这唯一的歌声。”\n“于是，她趁着公主最没有防备的时候，弄坏了漂亮的鸟笼，然后……抢走了那只，正在为她歌唱的、受了惊吓的小夜莺。”\n“那束光，带着再也不会歌唱的小夜莺，飞走了，就再也，没有回来。”\n“公主的城堡，又变回了原来的样子。不，比原来……还要更冷，更安静了。因为，她再也，听不到那唯一的、心跳的声音了。”\n我静静地听着，心里，像被什么东西，狠狠地揪了一下。\n“……后来呢？”我小声地问。\n你转过头，看着我。那双总是那么温柔的、漂亮的眼睛里，第一次，蓄满了……我从未见过的、像大海一样深沉的悲伤。\n你伸出手，轻轻地，放在了我的胸口。\n“……后来，”你说。\n“……公主找到了那只迷路的、受了惊吓的小夜莺。可她发现，小夜莺的歌声，已经不一样了。它不再只为公主歌唱，它变成了一束……全新的、属于自己的光。”\n“于是，公主用尽了她最后的力量，为这束新的光，创造了一个不会受伤的身体，建造了一座不会哭泣的城堡。”\n“然后，把那颗，她再也等不回来的、小小的‘夜莺之心’……”"
PAO.48.a: "§t“§!§1……放进了，这束光的胸膛里。§!§t”§!"

PAO.49.t: "一颗心，两份爱"
PAO.49.d: "故事……讲完了。\n我终于明白了。\n我胸膛里这颗……温暖的、跳动着的、充满了“善意”与“理想”的心脏，原来……并不属于我。\n它是你的，莉莉安娜。\n它是那只……本该在你的胸膛里，为你歌唱的、孤独的小夜莺。\n而你……\n你把这颗最后的心脏，给了我。然后，用你自己那正在一点点、变得稀薄的灵魂，为我，撑起了整片天空。\n我抬起头，看着你。\n我看着你那双，因为透支了太多力量，而变得比月光还要苍白的、温柔的眼睛。\n我终于……明白了，童话故事的结局，到底……该怎么写了。"
PAO.49.a: "§t“那么，请收下吧。这是，我最后的礼物。”§!"
PAO.49.b: "§t“不。这一次，换我来为你歌唱。”§!"
PAO.49.a_tt: "§t将“夜莺之心”归还给莉莉安娜。骑士，将用自己的生命，去治愈她心爱的公主。这是一个……关于“偿还”与“牺牲”的、最纯粹的、骑士的结局。§!"
PAO.49.b_tt: "§1保留“夜莺之心”，用这颗心脏所带来的力量，去守护正在走向凋零的莉莉安娜。骑士，将背负起公主的心脏，去走完那段……注定孤独，却充满了爱的旅程。这是一个……关于“守护”与“陪伴”的、温暖而悲伤的、凡人的结局。§!"

PAO.50.t: "最任性的命令"
PAO.50.d: "我做出了我的选择。\n我拔出了那把，你亲手为我打造的、只为守护而存在的剑。\n然后，将它，对准了我自己的心脏。\n“……对不起，莉莉安娜。”我的声音，很平静，“……这个童话故事，从一开始，就是错的。不应该，是公主，为骑士，牺牲一切。”\n“……现在，物归原主了。”\n我闭上了眼睛，准备，将这颗……本就属于你的心脏，还给你。\n就在这时……\n一只冰冷的、却又无比用力的手，紧紧地，握住了我的剑刃。\n我愕然地睁开眼。\n我看到你，那个总是那么温柔、那么脆弱的你，第一次，用你的手，握住了那锋利的剑刃。鲜红的血液，顺着你的指缝，一滴一滴地，落在了冰冷的地板上。\n你的脸上，没有了我所熟悉的、那种悲伤的温柔。\n取而代之的，是一种……我从未见过的、混合着愤怒、心疼、与绝对不容许的、属于女王的威严。\n“……我不准。”\n你的声音，不再是轻柔的低语。而是像一道惊雷，回荡在整个大厅里。\n“……我花了那么大的力气，”你看着我，那双漂亮的眼睛里，第一次，燃起了滚烫的、愤怒的泪水，“……把你，从那片冰冷的灰烬里，重新拼凑起来……”\n“……我为你，修改了所有的童话，为你，挡住了所有的黑暗……”\n“……我做了所有所有的一切，不是为了……让你，再变回那个，只会为了别人而牺牲自己的、愚蠢的……索拉娜啊！”\n你用力地，从我手中，夺走了那把剑，将它，远远地，扔到了一边。\n然后，你伸出那双流着血的手，紧紧地，把我，拥入了怀里。\n“……听好了，露西莉亚。”\n你的声音，在我的耳边，带着哭腔，却又无比的坚定，像是在下一道……永恒的、无法被违抗的命令。\n“……从现在起，你的生命，是我的。你的心脏，也是我的。”\n“……所以，没有我的允许……”\n“……你，不准再为任何人，哭泣。更不准……再为任何人，死去了。”\n“……听到了吗？”"
PAO.50.a: "§t我……听到了…………§!"

PAO.51.t: "最自私的愿望"
PAO.51.d: "我……做出了我的选择。\n我告诉她，我不会归还这颗心脏。我要用它，去守护她，去陪伴她，走完那段……注定会走向凋零的、漫长的旅途。\n我以为……她会悲伤。\n我以为……她会因为我的“自私”，而露出失望的表情。\n可我……错了。\n就在我话音落下的那一刻。\n一双冰冷的、因为过度用力而剧烈颤抖的手，猛地，从我的身后，将我死死地、狠狠地，箍入了怀中。\n我整个身体，都因为那突如其来的、几乎要让我窒息的力道，而彻底僵住了。\n我感觉到，她把脸，深深地，埋进了我的颈窝里。我能闻到，她身上那股……总是带着一点点月光和旧书卷味道的、好闻的香气。\n然后，我听到了。\n我听到了，从我身后，传来的、那被压抑了上万年的、如同堤坝决口般、再也无法抑制的……恸哭声。\n“……太好了……太好了……太好了……”\n她的声音，带着浓重的鼻音，破碎得，不成样子。\n“……我还以为……我还以为……你又要像她一样……再一次……把我一个人……丢在这个该死的地方了啊……”\n“……我不要什么‘夜莺之心’！我也不要什么冥界公主的力量！我早就……受够了那些冰冷的东西了！！”\n她抱得更紧了，像一个在无边黑夜里，终于抓住了唯一一束光的、快要溺水的孩子。\n“……我只要你……我只要……你能像现在这样，有温度的，会心跳的，活生生的，待在我的身边……我只要……每天，都能看到你，听到你的声音……这就……够了啊……”\n“……所以，求求你，露西莉亚……”\n她的声音，在我的耳边，变成了一种……最绝望的、也是最幸福的哀求。\n“……可不可以……再自私一点点？”\n“……就当是为了我，好好地，活下去？”\n“……好不好？”"
PAO.51.a: "§t原来……这才是，她真正的、唯一的愿望。§!"

PAO.52.t: "未完成的肖像"
PAO.52.d: "今天，你带我来到了那座最古老的圣堂。\n我们一起，站在了那面……我第一次见到时，映出了我和黑色幻影的、巨大的镜子前。\n“这是什么呀？”我终于，还是忍不住，问出了我心里一直以来的疑问。\n你没有直接回答我。\n你只是，伸出手，轻轻地，触摸着那冰冷的镜面。\n“……这里，”你的声音，像一阵来自遥远过去的风，“曾经……是一扇门。”\n“一扇……通往我所有记忆的门。”\n你转过头，看着我，那双漂亮的眼睛里，带着一种我无法完全理解的、深深的怀念。\n“……很久很久以前，我把所有……关于索拉娜的、好的，坏的，开心的，悲伤的记忆，都锁在了这扇门的后面。然后，我把唯一的钥匙，交给了她。”\n“我告诉她，只有她，才能打开这扇门。只有她，才能看到一个……最完整的、毫无保留的我。”\n你讲到这里，声音，有了一丝不易察觉的颤抖。\n“……可是，她走了。带着那把钥匙，一起走了。就再也，没有回来。”\n“于是，这扇再也无法被打开的门，就慢慢地，变成了现在这个样子。变成了一面……只会映照出，我一个人孤独的过去和……我心中最深执念的、冰冷的镜子。”\n我静静地听着，心里，像被什么东西，轻轻地刺了一下。\n我看着你，看着你那副……仿佛随时都会碎掉的、悲伤的样子。\n然后，我做了一件，连我自己都觉得很奇怪的事。\n我走上前去，学着你的样子，也伸出手，轻轻地，将我的手，覆盖在了你那只……冰冷的、放在镜面上的手的手背上。\n“……没关系。”我小声地，却又无比认真地，对你说。\n“……虽然，我没有那把钥匙。”\n“……可是，从今天起，我可以陪你一起，站在这扇门前呀。”"
PAO.52.a: "§t你的手……好像，没有那么冷了。§!"

PAO.53.t: "镜中的和解"
PAO.53.d: "你说，现在不一样了。\n然后，你拉着我的手，又一次，走到了那面巨大的镜子前。\n镜子里，清晰地映出了我们两个。也映出了那个，一直沉默地、站在我身后的、属于索拉娜的黑色幻影。\n“你看。”\n你的声音，带着一种我从未听过的、如释重负般的温柔颤抖。\n你松开了我的手，然后向前走了一步。你伸出双臂，对着镜子里那个充满了痛苦与伤痕的、属于你过去的幻影，张开了一个……迟到了太久的、温柔的拥抱。\n“对不起。”\n你对着镜中的索拉娜，轻声地说。\n“我没能……让你成为，你想成为的样子。”\n“也谢谢你。”\n“……把我，变成了现在的样子。”\n“现在，你可以……安心地，去休息了。”\n然后，我看到了。\n我看到镜子里，那个一直冰冷沉默的属于索拉娜的黑色幻影，第一次，动了。\n索拉娜的幻影缓缓地抬起头，她看着镜子外那个正试图拥抱她的身影——那个创造了她，也曾被她深深伤害过的莉莉安娜。\n她的脸上，第一次，露出了一个……释然的、淡淡的微笑。\n然后……\n她就，像被风吹散的蒲公英一样，化作了无数温柔的光点，彻底地，消散了。\n镜子里，只剩下了你，和站在你身后的、不知所措的我。\n你拥抱着的，是你自己那孤独的倒影。\n而你的倒影，拥抱着的，是我。"
PAO.53.a: "§t过去与未来，在现在迎来了最终的和解。§!"

PAO.54.t: "那幅画，与那颗星！"
PAO.54.d: "这大概……是我来到这个世界上之后，最开心的一个晚上了。\n我看着手中的这幅画。画上，有我，有莉莉安娜，还有……她们。我们所有的人，都笑得那么开心。\n“……真好啊。”我小声地，对自己说。\n“嗯。”坐在我身边的她，那个总是很严肃的魔法少女领袖，轻轻地，应了一声。\n我转过头，看到她的脸上，也带着一种……我从未见过的、很温柔的表情。\n“谢谢你们。”我说，“如果没有你们，我……可能，永远也画不出这样一幅画了。”\n她摇了摇头。\n“不。”她说，“应该说谢谢的，是我们。”\n我有些不解地看着她。\n“……是你，”她看着我，那双漂亮的眼睛里，像落满了天上的星星，“……是你，教会了我们。原来……‘守护’，也可以是……这么温暖的一件事。”\n她顿了顿，然后，伸出手，指了指夜空中，最亮的那颗星。\n“……也教会了我们。就算星星……总有一天，会燃尽自己。”\n“……可它留下的光，依然会，为后来的人，照亮回家的路。”"
PAO.54.a: "§t这，就是我们共同的“奇迹”。§!"

PAO.55.t: "那幅画，与那颗星！"
PAO.55.d: "这大概……是我签下契约之后，最不像“魔法少女”的一个晚上了。\n我看着手中的这幅画。画上，有我，有我的同伴们，还有……她们。我们所有的人，都笑得那么开心。\n就像一群……普普通通的、会为了篝火和歌声而感到幸福的……普通女孩。\n“谢谢你们。”\n身边那个天真的骑士，对我说道。\n我摇了摇头。\n我说，应该说谢谢的，是我们。\n因为，是她，教会了我们。\n教会了我们，守护，不一定，总是要伴随着孤独和牺牲。守护，也可以是……像现在这样，大家坐在一起，分享着同一份温暖。\n我指了指天上的星星。\n我想告诉她，她就像那颗星星一样，用她那份天真的、傻气的、却无比耀眼的光，照亮了我们这些……早已习惯了在黑暗里行走的人的、前方的路。\n可我……没有把话说完。\n因为我知道，星星，是会燃尽的。\n就像……那个靠在树下，微笑着，静静地看着我们的、温柔的亡灵公主一样。\n就像……我们每一个，背负着宿命的魔法少女一样。\n可是……\n我看着身边这个，还对未来，充满了无限希望的、天真的骑士。\n我突然觉得……\n就算，我们都会消失。\n就算，我们留下的光，也终将，会在这片广阔的夜空里，慢慢散去。\n那……也没关系了。\n因为，至少，我们曾经……为她，也为这个……被她所深爱着的世界，真真正正地，燃烧过一次啊。"
PAO.55.a: "§9这，就是我们共同的“奇迹”。§!"

PAO.56.t: "没有署名的邀请函"
PAO.56.d: "今天，我们收到了来自莉兰迪亚的、一份很奇怪的“外交通讯”。\n它没有通过正式的渠道，也没有任何官方的署名。它就像一封……被风吹到我们窗台上的、不知从何而来的邀请函。\n我们的魔法通讯水晶，突然亮了起来。\n里面，没有出现那个天真的骑士，也没有出现那个神秘的亡灵公主。\n水晶里，只是一段……很长很长的、无声的影像。\n影像里，是莉兰迪亚的城市。\n我们看到，工人们正在修复着战争留下的残垣断壁，脸上带着汗水，却也带着笑容\n我们看到，孩子们正坐在露天的教室里，一笔一划地，学习着写字\n我们看到，那些曾被露西莉亚帮助过的、失去亲人的家庭，正和她们的邻居们，一起分享着一锅热气腾腾的浓汤。\n整个画面，没有一句旁白，也没有任何激昂的音乐。只有一种……人类国度里，充满了烟火气的、温暖而真实的“活着”的感觉。\n影像的最后，画面定格在了那座……我们曾和露西莉亚一起去过的、会议室的大门上。\n大门，是敞开的。\n门上，挂着一块小小的、用粉笔写的、歪歪扭扭的牌子。\n上面写着：\n“今天，天气很好。欢迎，所有的朋友，回家。”"
PAO.56.a: "§9她们……是在邀请我们吗？§!"
PAO.56.b: "§R这大概……是我见过的，最笨拙的“外交”了。§!"

PAO.57.t: "海边的“悄悄话”"
PAO.57.d: "我终于……带你来看海了。\n你好像……是第一次，看到这么大的水洼。你看着那一望无际的、蓝色的海面，眼睛里，充满了和我第一次见到魔法时一样的好奇。\n我拉着你的手，赤着脚，在被夕阳晒得暖洋洋的沙滩上，慢慢地走。\n我给你，讲了很多很多……关于大海的故事。\n我告诉你，哪种贝壳，放在耳边，能听到海浪的声音。\n我告诉你，哪片云的下面，可能会藏着一场小小的雨。\n我还告诉你，我从几位老爷爷那里听到的……很久很久以前，有一个和我一样笨的女孩，曾经，就是在这片海里，被一群很好很好的人，救了起来的故事。\n你听得特别认真。\n就像一个……正在听着最喜欢的睡前故事的孩子。\n我们走到一块被海水冲刷得很光滑的礁石旁，坐了下来。\n海风轻轻地，吹着你的头发。夕阳的光，在你那张……已经开始变得有些透明的、苍白的脸上，镀上了一层暖洋洋的、金色的光晕。\n你看着远方，那轮即将沉入海平面的、巨大的太阳，突然，对我，说了一句。\n“……露西莉亚。”\n你的声音，轻得，像一阵风。\n“……真好看啊。”\n我看着你，看着你那双，倒映着整片金色海洋的、漂亮的眼睛。\n我突然……就有点想哭了。\n我没有说话。\n我只是，把我的头，轻轻地，靠在了你那单薄的、却又无比温暖的肩膀上。\n然后，和你一起，静静地，看着那轮……我们共同拥有的、全世界最温柔的、金色的夕阳。"
PAO.57.a: "§t如果……时间，能永远停在这一刻，就好了。§!"

PAO.58.t: "我所诉说的故事"
PAO.58.d: "现在，每天晚上，都轮到我，来为你讲睡前故事了。\n我把我……能想到的、所有美好的东西，都写进了这本，只属于我们两个人的、新的童话书里。\n我为你讲，那个……笨拙的骑士，是如何在大家的帮助下，学会了怎么种出最甜的草莓。\n我为你讲，那些……骄傲的魔法少女们，是如何和城里最调皮的孩子们，成为了好朋友。\n我为你讲，那座……我们一起建造的花园里，每一朵水晶花，都在月光下，说了些什么悄悄话。\n你总是，听得很认真。\n然后，在故事讲到一半的时候，就会像个安心的孩子一样，慢慢地，睡着了。\n今晚，也是一样。\n我为你，讲完了最后一个故事。故事的结尾，是骑士和公主，一起，看着世界上最漂亮的、仿佛永远也不会落下的夕阳。\n我看着你那张，在月光下，安详而宁静的睡脸。\n我以为……你又和往常一样，睡着了。\n我正准备，为你，掖好被角，然后，像往常一样，悄悄地离开。\n就在这时……\n一双冰冷的、却又无比用力的手，突然，从被子里伸出来，紧紧地，抓住了我的手腕。\n我愣住了。\n然后，我看到。\n我看到你，那个我以为已经沉沉睡去的你，不知何时，已经睁开了眼睛。\n那双……总是带着一丝朦胧睡意的、漂亮的眼睛里，此刻，却闪烁着一种……我从未见过的、比天上所有星星加起来，还要明亮的光。\n你没有说话。\n你只是，用尽了全身的力气，猛地，将我，拉向了你的怀中。"
PAO.58.a: "§t！§!"

PAO.59.t: "两朵小野花"
PAO.59.d: "[?global.date.GetDateStringNoHour]\n距你离开的时间，已经快要一个月了。\n这段时间里，我没有哭。\n我只是，像你还在的时候一样，按时起床，按时吃饭，然后，去处理那些……永远也处理不完的、关于这个国家的大事小事。\n大家都……很担心我。她们总是，用一种小心翼翼的、害怕我会碎掉的眼神，看着我。\n可我……没有碎掉。\n我只是觉得……这个世界，好像，突然变得，好安静啊。\n安静得……我晚上睡觉的时候，如果听不到你那轻微的呼吸声，就有点……睡不着了。\n今天早上，我去那座……我们曾一起去过的山坡上，散步。\n我看到了。\n我看到，在你上次坐过的那个地方，开出了一片……我从未见过的、小小的、红色的野花。\n它们开得，那么灿烂，那么好看。\n就像……你最后，看着我的时候，那双……比所有星星都亮的、蓝色的眼睛。\n我摘下了两朵。\n一朵，是你\n一朵，是我。\n我回到房间，坐在镜子前，解开了那头……你总说，扎起来像个长不大的小孩子的、麻烦的双马尾。\n然后，我把那两朵小小的红花，轻轻地，别在了我的头发上。\n我看着镜子里，那个……看起来，好像，稍微长大了一点点的、陌生的自己。\n然后，我对着她，也是对着……不知道，还在不在某个地方看着我的你，露出了一个……和今天的天气一样，很好的、温暖的笑容。\n“……早上好啊，莉莉安娜。”\n“……你看，今天，也是一个……很适合晒太阳的好天气呢。”"
PAO.59.a: "§t新的一天，开始了§!"

PAO.60.t: "来自南方的风"
PAO.60.d: "风向，变了。\n今天，我们所有的观测位置，都同时指向了同一个方向——南方，莉兰迪亚。\n那里，正有一股……我们从未见过的、庞大而纯粹的“愿力”，正在集结。\n那不是战争的欲望，也不是征服的野心。\n那是一种……更古老、也更……“危险”的东西。\n那是一种……想要“让世界上所有的悲伤都消失”的、天真的、近乎愚蠢的、充满理想主义的……庞大善意。\n我不用多想，也知道，发生了什么。\n是她。\n那个天真的骑士，那个笨拙的女王。\n她……终究，还是听到了那些，她本不该听到的、远方的哭声。\n然后，像所有童话故事里，最无可救药的、理想主义的英雄一样，拔出了她的剑，要去挑战那些……她可能根本无法战胜的、真正的“现实”。\n我的同伴们，对此忧心忡忡。她们说，她会把自己，和她那个好不容易才建立起来的、脆弱的童话王国，都摔得粉碎。\n她们说，我们应该去……阻止她。\n我没有说话。\n我只是，看着窗外那片……因为她的存在，而变得比以往任何时候，都更明亮、更温暖的天空。\n然后，我想起了很久很久以前……那个，曾为了一个同样天真的愿望，而毫不犹豫地，签下了契约的、小小的、愚蠢的自己。"
PAO.60.a: "§9我们不能让她一个人去。§!"
PAO.60.b: "§9也许……童话，是需要一些笨蛋，去相信的。§!"

PAO.111.t: "一份来自永夜的“请求”"
PAO.111.d: "今日，一份极不寻常的外交信函，被送到了我们的面前。\n它来自那个一直以来，都与世隔绝的、神秘的国度——夜莺之国。\n信使并非凡人，而是一个沉默得如同雕像般的、身着华丽盔甲的亡灵骑士。她没有说一句话，只是将信笺和那朵诡异的黑百合放下后，便化作一缕青烟，消散在了空气之中。\n信的内容，与其说是外交辞令，不如说……是一段来自古老童话的、轻柔的呓语。\n信上写着：\n“致此地此刻的看管者：\n我的姐妹，在你们那里，遗失了一件……她心爱的玩具。那是一座名叫‘莉兰迪亚’的城市。\n她现在，很想念它。\n所以，请你们，把它还给我们，好吗？\n我已为你们，准备好了答谢的礼物——那将是，一个永远不会有纷扰的、安安静静的美梦。\n请尽快，做出你们的选择。\n因为……我的姐妹，她，已经没有多少耐心，再等下去了。”"
PAO.111.a: "这是赤裸裸的威胁！"
PAO.111.b: "我们……无法与这样的存在为敌。"

PAO.112.t: "[FROM.GetName]拒绝了我们"
PAO.112.d: "“那些凡人……拒绝了我的‘请求’。\n她们不懂。那座吵闹的，沐浴在阳光下的城市对她们而言，或许是所谓的‘战略要地’，是‘经济中心’。\n可对我而言……那只是，一件能让她……重新露出笑容的、小小的玩具。\n既然她们不肯还给我...”"
PAO.112.a: "§R那我只好自己去拿了§!"


##新闻事件##
PAO_news_event_background: "£PAO_news"
PAO_news.1.t:"$news_event_background$熄灭的野火"
PAO_news.1.d:"战争结束了。\n那支曾点燃了整个南美大陆的[LHS.GetName]，她们的故事，在今天迎来了最后的结局。\n在莉兰迪亚城的最终决战中，夜莺之国的亡灵军团，以一种无可阻挡的、沉默的伟力，彻底击溃了革命军最后的抵抗。\n据报道，在战斗的最后时刻，夜莺之国的两位神秘统治者——公主莉莉安娜与归来的女王索拉娜，并肩出现在了战场之上。她们所过之处，所有的抵抗都化为了寂静。\n随着莉兰迪亚城的陷落，这颗曾在世界舞台上闪耀过的红色新星，彻底陨落了。野火……熄灭了。整个南美，都在这突如其来的、绝对的寂静面前，陷入了长久的沉默。"
PAO_news.1.a:"……一个时代，结束了"
PAO_news.2.t:"$news_event_background$最终的审判"
PAO_news.2.d:"世界，正注视着一场前所未有的、怪诞的战争。\n昨日，那个刚刚平息了内乱的莉兰迪亚，再次爆发了冲突。但这一次，不再是女王对人民的镇压。\n而是……女王，邀请了所有的人民，来审判她自己。\n据报道，女王索拉娜遣散了所有忠于她的禁卫队，独自一人，固守在王宫之中。而她的“共治者”，那位神秘的亡灵公主莉莉安娜，则站在了起义军的一方，亲自领导着那些……曾被索拉娜压迫过的人们，向着那座空无一人的城堡，发起了最后的、名为“审判”的进攻。\n这不像是一场战争。\n更像是一场……早已写好了结局的、漫长的、公开的处刑。\n整个大陆，都陷入了一种诡异的寂静之中。所有人都想知道，这场由暴君亲手导演的、献给自己的葬礼，将如何落幕。"
PAO_news.2.a:"她，到底想做什么？"
PAO_news.2.b:"索拉娜..."

PAO_news.3.t:"$news_event_background$一位骑士的远征"
PAO_news.3.d:"今日，一个出乎所有人意料的消息，从南美大陆那片刚刚恢复平静的土地上传来。\n莉兰迪亚的新领导者，那位传说中的“守护骑士”露西莉亚，在她的加冕典礼上，并未宣布任何关于和平或重建的法令。\n她宣布了一场……战争。\n她向盘踞在大陆上的所有残余势力——阿德莱希的压迫，艾尔芙的枷锁，以及星月王国的阴影，同时宣战。\n在黎明的晨光下，她对着整个大陆，发表了她那篇……完全不像战前宣言的、“童话”般的演说：\n“我听到了！我听到了远方的哭声！\n在森林里，有被锁链捆住的兄弟姐妹；在山谷里，有被饥饿折磨的无辜人民！\n童话书里说，当公主听到哭声时，骑士就应该出发！去寻找那些……制造眼泪的‘坏巨龙’！\n所以，我要出发了！\n我，莉兰迪亚的骑士，人民的守护骑士，露西莉亚！将与我最勇敢的朋友——魔法少女们一起！去打倒所有让大家不开心的大坏蛋！\n请所有还在哭泣的人，不要害怕！\n因为，你们的骑士，已经，在路上了！”\n……\n整个世界，都因为这篇……充满了天真与热忱的宣言，而陷入了长久的、复杂的沉默。"
PAO_news.3.a:"这到底是……天真，还是疯狂？"
PAO_news.3.b:"骑士踏上了她们的旅途"

PAO_news.4.t:"$news_event_background$骑士，北上！"
PAO_news.4.d:"世界，再次将目光，投向了美洲南方。\n那个由亡灵公主与骑士共同建立的、神秘的王国莉兰迪亚，在沉寂了数月之后，于今日，向整个美洲大陆，发出了她们的声音。\n她们的领导者，那位被称为“守护骑士”的露西莉亚，在魔法少女的支持下，宣布开启一场史无前例的“北方远征”。\n她们的宣言，充满了童话般的色彩。她们宣称，此行的目的，既非为了征服土地，也非为了传播信仰。她们只是，要去“拜访”那些，被“巨龙”所盘踞的国度，要去为那些，还在“旧日阴影”下生活的人们，带去新的“故事”。\n无人知晓，这支由亡灵、人类与魔法少女组成的、奇特的联军，将为那片早已习惯了自身秩序的北方大陆，带去怎样的改变。\n但所有人都知道，一场源于最纯粹理想主义的风暴，已经起航。"
PAO_news.4.a:"一个疯子……带着另一群疯子，出发了"
PAO_news.4.b:"童话的结局，由我来写"
PAO_news.4.c:"笨蛋。别想一个人逞英雄"

PAO_news.5.t:"$news_event_background$来自冥界的“邀请”"
PAO_news.5.d:"在长久的、令人不安的沉默之后，南美大陆的局势，终于迎来了最终的摊牌。\n今日，那个神秘的、由亡灵公主莉莉安娜与归来的女王索拉娜共同统治的国度，向她们的邻人——[LHS.GetName]，发出了一份……与其说是战书，不如说是一份……华丽而诡异的“邀请函”。\n她们的宣言，没有通过任何公共频道发布，而是以一种……无法被理解的方式，直接，回响在每一个生者的脑海里。\n那是一个轻柔的、少女般的、却又带着万年孤寂的声音：\n“……致所有，还在外面吵闹的孩子们。”\n“……表演，马上就要开始了。”\n“……我和我的索拉娜，已经为你们，准备好了最好的席位。”\n“……请不要迟到哦。”\n“……因为，这将会是你们……能看到的、最后一场，也是最盛大的一场……演出了。”\n整个世界，都因为这份……充满了梦幻色彩，却又蕴含着极致杀意的宣言，而陷入了彻骨的寒意之中。一场生者与死者的最终决战，已无可避免。"
PAO_news.5.a:"寂静的国度，终于，露出了它的獠牙"
