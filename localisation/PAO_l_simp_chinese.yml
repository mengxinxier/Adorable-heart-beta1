###设定
PAO_GATHERING_STORM_DESC: "在生者世界的喧嚣之外，存在着一个与世隔绝的领域——永恒寂静的夜莺之国。作为冥界的中心，这里没有纷争与欲望，只有公主莉莉安娜意志下完美的、亘古不变的秩序。这里曾是世界中最安宁的角落，直到那束名为索拉娜的、灼热的火焰闯入，又离去。\n索拉娜的背叛，如同一块巨石，投入了这片静止了万年的湖面。她不仅盗走了维系整个国度平衡的核心——“夜莺之心”，更带走了一部分最精锐的亡灵军团，在生者的土地上，建立起了她自己的王国。\n这道背叛的裂痕，动摇了夜莺之国永恒的根基。失去了核心力量的莉莉安娜，对国度内部那些古老怨念的压制力，第一次出现了衰退的迹象。那些本该安眠的灵魂开始在阴影中躁动，窃窃私语，挑战着公主那看似绝对的权威。完美的寂静，第一次出现了不和谐的杂音。\n如今，这位被背叛的、破碎的公主，正面临着一场双重的危机。在国内，一场由内部怨念引发的风暴正在酝酿，随时可能颠覆她万年不变的统治。而在国外，她那唯一的、也是最执着的追寻，才刚刚开始。\n她必须先让自己的家里，重新恢复那份属于她的、绝对的安静。然后，才能踏上那条……寻回自己另一半灵魂的、漫长而悲伤的旅途。"