PAO_lili: "莉莉安娜"
PAO_lili_Desc: "§L在永恒寂静的安息之国，时间失去了意义。作为冥界的公主，莉莉安娜的生命是一场长达万年的华丽默剧。她的王国秩序井然，臣民绝对忠诚，但这里没有阳光与欢笑，只有亘古不变的完美死寂。\n直到瓦伦蒂娜的出现，打破了这一切。\n她是一个误入冥界的异类，拥有着灼热的灵魂。她的野心、她的活力以及她对生者世界的生动描绘，成为了莉莉安娜黑白生命里唯一的色彩。她们很快变得形影不离。莉莉安娜将她视为自己灵魂的另一半，向她展示了安息之国所有的秘密与权能。而瓦伦蒂娜则用她火焰般的激情，温暖了莉莉安娜那颗早已冰冷寂寞的心。\n她们曾约定共同统治这个永恒的国度，直到时间的尽头。\n然而瓦伦蒂娜的野心远比莉莉安娜想象的更炽热也更残酷。她渴望的并非分享这份永恒的静谧，而是征服与绝对的权力，是在阳光下建立一个属于自己的不朽帝国。\n那一天是安息之国数千年一次的同调仪式，莉莉安娜将与国度核心“安息之心”进行共鸣。那本是她与整个国度力量最为契合也最为脆弱的时刻，而守护在她身边的正是她最信任的瓦伦蒂娜。\n背叛就在那时发生。\n瓦伦蒂娜利用莉莉安娜毫无保留的信任，在仪式最关键的瞬间从莉莉安娜胸口生生剥离了那份权能，将那足以让生者不朽、让死者臣服的“安息之心”据为己有。\n然后她头也不回地带着那份被盗走的力量，和一部分被她野心所蛊惑的亡灵军团，离开了这片她早已厌倦的永恒黑夜，去往了那个她曾为莉莉安娜无数次描绘过的充满阳光与生命的世界。\n她的王国不再完整，她的灵魂也是如此。\n她不再是那个孤独的公主，而变成了那场背叛的化身，一个为了寻回自己被夺走的另一半而存在的，破碎的执念。\n§1她只是想把那个不听话的、逃走了的爱人，亲手抓回来，然后让她和自己一起，永远留在这片本该属于她们两个人的寂静黑暗里。§!§!"

 #副领袖

