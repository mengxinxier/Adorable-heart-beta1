####国策####
#政治线国策
PAO_anjing: "嘘，安静一点"
PAO_anjing_desc: "“最近……国度里有些吵闹。那些本该安眠的孩子们，好像都在做着不安稳的梦。这不好。瓦伦蒂娜她……喜欢安静的地方。我想，只要我轻轻地拜托她们，她们一定会为了我们，重新变回乖孩子的，对不对？”"

PAO_xtgs: "是想听故事了吗？"
PAO_xtgs_desc: "“她们还是……很吵闹。我有些明白了。一定是因为，瓦伦蒂娜不在，没有人再给她们讲那些……关于阳光和星星的、有趣的故事了。那么，就由我来吧。我会让我的侍从，去每一个角落，把我记得的所有故事，都讲给她们听。听完了故事，她们就该安稳睡去了吧。”"

PAO_dsgj: "把家里打扫干净"
PAO_dsgj_desc: "“故事……好像也没有用。她们开始……弄乱我们的家了。那些漂亮的、积了千年尘埃的街道，被她们弄得一团糟。这可不行。等瓦伦蒂娜回来看到，她会不开心的。我要让侍卫们，去把那些不听话的孩子，暂时请到一边去，然后，把我们的家，重新打扫得干干净净。”"

PAO_bthn: "为什么不听话呢？"
PAO_bthn_desc: "“我……不明白。我真的不明白。为什么你们就是不肯听话呢？我给了你们安静，给了你们故事，也给了你们一个干净的家。可你们……却开始互相伤害了。你们在破坏我们最重要的东西。你们在……破坏我们曾拥有过的、最完美的回忆。”"

PAO_tywb: "请不要讨厌我！！！"
PAO_tywb_desc: "“侍卫们……也挡不住她们了。到处都是裂痕，到处都是……不和谐的声音。我的家，快要碎掉了。如果……如果瓦伦蒂娜回来，看到的是这样一副景象……她一定会讨厌我的吧。她会觉得，我连我们唯一的家，都看管不好。我……不能让她看到这个样子的安息之国。\n绝对，不能！！！”"

PAO_wlcj: "我们曾一起约定过永远"
PAO_wlcj_desc: "“对不起。真的……对不起。我不想伤害你们，你们每一个，都是我珍视的孩子。可是……你们正在毁掉，我唯一珍视的东西。所以……请原谅我。为了能让她回来时，还能看到一个……像我们曾经约定过的那样、完美的、永恒的家。我必须……亲手，将那些不和谐的音符，全部抹去了。”"

PAO_wmdj: "为了我们的家"
PAO_wmdj_desc: "“好了，不听话的孩子们，都已经重新睡着了。可是……她们把我们的家，弄得好乱。到处都是灰尘和裂痕。这不行。我要让侍从们，把每一块地砖都擦亮，把每一座雕像都修复好。我要让这里，变回你最喜欢的、那个一尘不染的样子。”"

PAO_bkcl: "别把位置空出来"
PAO_bkcl_desc: "“家里……变得比以前更空旷了。好多好多熟悉的身影，都不见了。没关系。我会用我自己的力量，去填满那些空出来的位置。我会创造出新的、更听话、也更完美的侍从。她们会和我一起，静静地，等待着这个家另一位主人的归来。”"
PAO_nnsg: "你的那束光"
PAO_nnsg_desc: "“我总是会想起，你第一次来到这里时，你身上的那束光。那么亮，那么暖，把我的整个世界都照亮了。我想……我不能再只是等待了。我要试着，去重新找到那束光。我会派我最安静的孩子们，去往那个……你现在所在的、吵闹的生者世界，去寻找你的踪迹。”"

PAO_zshn: "她们……在伤害你？？？"
PAO_zshn_desc: "“我的孩子们，回来了。她们带回来的消息，让我的心……好疼。她们说，你在那个世界，过得一点也不好。有一群叫‘野火’的坏孩子，她们在伤害你，在试图……熄灭你身上的光。她们……怎么敢？她们怎么能……这样对你？”"

PAO_bzqf: "不准再欺负她了！！！"
PAO_bzqf_desc: "“我决定了。我不能再让你，一个人，待在那个冰冷的、危险的世界里了。那些坏孩子，我会帮你全部赶走。那些让你不开心的东西，我会帮你全部抹掉。你不需要再假装坚强了，也不需要再当什么女王了。你只需要……像以前一样，回到我的身边，继续给我讲那些，关于星星的故事，就好了。”"

PAO_jnhj: "请让我来接你回家！"
PAO_jnhj_desc: "“瓦伦蒂娜。你听。我来接你了。不要怕。我会为你，扫清所有障碍。我会为你，熄灭所有吵闹的声音。然后，牵着你的手，带你回到这个……只属于我们两个人的、安安静静的、永恒的家里来。我们……再也不分开了，好不好？”"

####事件####
PAO.1.t: "为什么要躲着我呢？？？"
PAO.1.d: "我只是……想让家里，变回原来的样子。\n我派出了侍卫们，去把那些……在外面游荡的、不听话的孩子，都请回她们自己的房间里去。我告诉侍卫们，动作一定要轻柔，因为那些孩子，只是在做着不安稳的梦，不可以吵醒她们。\n可是……侍卫们回来了。\n她们说，那些孩子，不愿意回家。\n她们说，她们只是轻轻地碰了一下，那些孩子……就碎掉了。\n然后，就有更多的孩子，从城市的阴影里跑了出来。她们不再只是吵闹了，她们开始……推倒那些漂亮的、几千年都没有动过的雕像，开始……弄脏我们干净的街道。\n我……不明白。\n我只是想在瓦伦蒂娜回来之前，把一切都收拾得整整齐齐，就像她离开时那样。\n为什么……为什么你们，就是不肯帮帮我呢？"
PAO.1.a: "是我……做错了吗？"

PAO.2.t: "世界安静了下来，可是……"
PAO.2.d: "最后一声不和谐的嘶吼，消失了。\n我的侍卫们，忠实地，执行了我的命令。她们把那些……不听话的孩子，全部，都送回了永恒的安眠里。\n我走在那些……曾经无比吵闹的街道上。现在，这里又恢复了它应有的样子。\n安静，完美，一尘不染。\n就像……你离开之前那样。\n我从地上，捧起了一捧黑色的尘埃。这是那些孩子……留下的、最后的东西。它们很轻，很凉，就像从未存在过一样。\n你看，瓦伦蒂娜。\n现在，家里又变得和以前一样，安安静静的了。\n再也没有什么东西，能打扰我们了。\n我把一切……都准备好了。\n所以……\n……你，可以回来了吗？"
PAO.2.a: "（整个国度，只剩下……她的回音。）"

PAO.3.t: "一场没有听众的道歉"
PAO.3.d: "她们……停下来了。\n那些吵闹的孩子们，好像……也打累了。她们没有再进攻，只是退回了城市的阴影里，远远地、沉默地，看着我。\n我也……没有力气了。\n我最忠诚的侍卫们，有很多，都变成了和我脚下这些……冰冷的尘埃一样的东西。\n我走在这座……被我们亲手弄得一团糟的家里。到处都是裂痕，到处都是……无法被修复的伤疤。\n我做错了。\n我想让这里，变回你离开时那样、完美的、安安静静的样子。\n可我……好像把它，弄得更乱了。\n对不起，瓦伦蒂娜。\n我……好像把我们的家，搞砸了。\n如果……如果你现在回来，看到的是这样一副破破烂烂的景象……你一定会……更不想回来了吧。\n对不起……\n……真的，对不起。"
PAO.3.a: "（废墟中，只剩下……她小声的啜泣。）"
