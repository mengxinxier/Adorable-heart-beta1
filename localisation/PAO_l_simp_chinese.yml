PAO_lilikexue: "莉莉安娜"
PAO_lxly: "？？？"
PAO_lxlyyy: "拥有人物“§Y？？？§!”"
PAO_lili: "莉莉安娜"
PAO_lili_Desc: "§L在永恒寂静的夜莺之国，时间失去了意义。作为冥界的公主，莉莉安娜的生命是一场长达万年的华丽默剧。她的王国秩序井然，臣民绝对忠诚，但这里没有阳光与欢笑，只有亘古不变的完美死寂。\n直到索拉娜的出现，打破了这一切。\n她是一个误入冥界的异类，拥有着灼热的灵魂。她的野心、她的活力以及她对生者世界的生动描绘，成为了莉莉安娜黑白生命里唯一的色彩。她们很快变得形影不离。莉莉安娜将她视为自己灵魂的另一半，向她展示了夜莺之国所有的秘密与权能。而索拉娜则用她火焰般的激情，温暖了莉莉安娜那颗早已冰冷寂寞的心。\n她们曾约定共同统治这个永恒的国度，直到时间的尽头。\n然而索拉娜的野心远比莉莉安娜想象的更炽热也更残酷。她渴望的并非分享这份永恒的静谧，而是征服与绝对的权力，是在阳光下建立一个属于自己的不朽帝国。\n那一天是夜莺之国数千年一次的同调仪式，莉莉安娜将与国度核心“夜莺之心”进行共鸣。那本是她与整个国度力量最为契合也最为脆弱的时刻，而守护在她身边的正是她最信任的索拉娜。\n背叛就在那时发生。\n索拉娜利用莉莉安娜毫无保留的信任，在仪式最关键的瞬间从莉莉安娜胸口生生剥离了那份权能，将那足以让生者不朽、让死者臣服的“夜莺之心”据为己有。\n然后她头也不回地带着那份被盗走的力量，和一部分被她野心所蛊惑的亡灵军团，离开了这片她早已厌倦的永恒黑夜，去往了那个她曾为莉莉安娜无数次描绘过的充满阳光与生命的世界。\n她的王国不再完整，她的灵魂也是如此。\n她不再是那个孤独的公主，而变成了那场背叛的化身，一个为了寻回自己被夺走的另一半而存在的，破碎的执念。\n§1她只是想把那个不听话的、逃走了的爱人，亲手抓回来，然后让她和自己一起，永远留在这片本该属于她们两个人的寂静黑暗里。§!§!"

PAO_lili_Desc2: "§L她曾是永恒寂静的公主，整个世界只是她一场长达万年的、华丽而孤独的默剧。她曾为了寻回那个背叛了她的、唯一的色彩，而将半个大陆拖入了战争的泥潭。她曾以为，只要将那只受伤的火鸟，重新关回自己为她打造的、完美的金色鸟笼里，一切就能回到从前。\n然而，当那只火鸟，最终选择在她面前，燃尽自己最后的羽翼时，她才终于明白。真正的爱，不是占有，不是囚禁，而是……放手，与成全。\n她亲手埋葬了那个名为索拉娜的、属于她一个人的过去。然后，又亲手，为那个她深爱着的灵魂，创造了一个崭新的、不属于任何人的未来。\n如今，她不再是那个执着于永恒的破碎公主了。她褪去了王冠，放下了权杖，将整个吵闹而温暖的世界，都交给了那个……由她亲手唤醒的、崭新的“光明”。\n她只是，回到了她的花园里。安安静静地，做一个……每天，都期盼着自己的骑士，能平安回家的、普通的守望者。§!"

PAO_lxly_Desc: "§L她诞生于一场最深沉的悲剧，却被赋予了最纯粹的光明。她是莉莉安娜用自己所有的爱与愧疚，浇灌出的、一朵永不凋谢的理想之花。她的灵魂，拥有着和那个被称为“索拉娜”的女王一样的、火焰般的内核，却没有沾染上一丝一毫，属于过去的、冰冷的灰烬。\n在莉莉安娜为她编写的童话里，世界是完美的，坏人是会被感化的，爱是能战胜一切的。她对此，深信不疑。\n然而，当她第一次，亲眼看到了这个世界的眼泪与伤痕时，她那完美的童话，碎了。但她的信仰，完好如初。\n她只是，用一种更成熟，也更坚定的方式，重新拾起了她手中的剑。她不再天真地以为，拥抱能解决所有问题。但她依然固执地相信，守护每一个具体的人的笑容，才是她的剑，唯一应该挥舞的方向。\n她不是索拉娜的影子，也不是莉莉安娜的玩偶。\n她是露西莉亚。\n一个……正准备用自己那勇者般天真的勇气，去挑战这个并不完美却依旧真实的世界的、年轻的骑士。§!"
