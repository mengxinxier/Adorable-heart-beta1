PAO_BACK_PAM: "§1公主的剧本§!"
PAO_BACK_PAM_desc: "§1第一幕§!，是防守。我们要让那些冲进来的、傲慢的孩子们，在我们最坚固的舞台上，摔一个最疼的跟头。\n§1第二幕§!，是反击。当她们筋疲力尽的时候，我们就从她们最意想不到的地方，拉开我们自己的帷幕。\n§1最终幕§!……我们要在那座，曾属于你的城市——莉兰迪亚，为这场演出，画上一个最完美的句号。"
PAO_transfer: "获得§Y[FROM.Getname]§!占领地区的核心"
