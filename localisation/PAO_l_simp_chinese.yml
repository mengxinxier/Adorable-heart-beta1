PAO_ssfg3_desc: "“我记得……你最喜欢那些亮晶晶的、温暖的东西了。你说，它们像天上的星星。我们这里没有星星，但是……地底下，有很多很多漂亮的石头。我会让我的孩子们，把它们全都挖出来，为你建成一座……比太阳还要闪亮的宫殿，造出一支……比星星还耀眼的军队。你会喜欢的，对不对？”"

PAO_ssfg4: "闪闪发光"
PAO_ssfg4_desc: "“我记得……你最喜欢那些亮晶晶的、温暖的东西了。你说，它们像天上的星星。我们这里没有星星，但是……地底下，有很多很多漂亮的石头。我会让我的孩子们，把它们全都挖出来，为你建成一座……比太阳还要闪亮的宫殿，造出一支……比星星还耀眼的军队。你会喜欢的，对不对？”"

PAO_ssfg5: "§1公主的献礼§!"
PAO_ssfg5_desc: "§1“回来吧，瓦伦蒂娜。\n你看，我把所有你喜欢的东西，\n都准备好了。”§!"

PAO_zbwj: "为你准备的新玩具"
PAO_zbwj_desc: "“生者世界的玩具，好像……都是用一种叫‘钢铁’的东西做的。它们看起来很坚固，很冰冷，和你一样。我不是很喜欢。但是……如果你喜欢的话，我也会为你准备好的。我会让我的孩子们，不眠不休，为你打造出最坚固、最锋利的玩具。有了它们，就再也没有人，敢欺负你了。”"

PAO_pytl: "为你铺一条回家的路"
PAO_ptyl_desc: "“从这里，到你现在在的那个地方，太远了。走路，会很累的。我不要你再受累了。我会让我的孩子们，用最坚固的石头，和最冰冷的钢铁，为你铺好一条……平坦的、可以直接回到家门口的路。你只要……沿着这条路，一直走，就能看到我了。”"

PAO_bedz: "不能让你饿肚子"
PAO_bedz_desc: "“你总说，生者，是需要吃东西的。虽然……我不是很懂。但是，我不能让你，在回家的路上，还饿着肚子。我会让我的孩子们，去收集所有……能让你的那些‘士兵’们，变得更有力气的东西。我会把它们，都堆在路边，等你回来拿。”"

PAO_wsjb: "现在……万事俱备了"
PAO_wsjb_desc: "“好了。家里，打扫干净了。新的玩具，准备好了。回家的路，也铺好了。所有……所有的一切，我都为你准备好了。现在，这个完美的、安安静静的、只为你一个人存在的王国，正等待着它的另一位女主人。瓦伦蒂娜……我来了。”"
####莉莉安娜军事线####
PAO_sxwo: "苏醒的玩偶们"
PAO_fjss_desc: "“我的孩子们，不能再沉睡了。我要轻轻地唤醒她们，为她们穿上最坚固的盔甲，就像妈妈为即将出门远足的孩子整理衣裳。她们会成为我最勇敢的骑士，去迎接她们迷路的姐妹回家。每一个孩子，都会得到我的祝福。”"

PAO_ygdp: "月光织成的斗篷"
PAO_ygdp_desc: "“夜晚，是我们的朋友。我会请求月亮，为我的孩子们，织一件看不见的斗篷。穿上它，她们就能像影子一样，悄悄地溜进坏人的花园里，不会被任何人发现。她们的脚步会像猫咪一样轻，不会惊醒任何一朵沉睡的花。”"

PAO_kqyj: "不会哭泣的眼睛"
PAO_kqyj_desc: "“外面的世界很可怕，充满了火焰和吵闹的声音。但我的孩子们，不会感到害怕。因为我拿走了她们的眼泪，给了她们永不哭泣的眼睛。她们会平静地，穿过所有的荆棘和风暴，眼中只有我为她们指引的、那唯一的方向。”"

PAO_jjyb: "荆棘的拥抱"
PAO_jjyb_desc: "“如果有人想伤害我的孩子，那么，她们就要做好被荆棘拥抱的准备。我会让我的孩子们，学会一种特别的魔法。她们会紧紧地、紧紧地抱住那些坏人，直到她们再也无法动弹，再也无法发出声音，直到她们也变成……安静的、不会再伤人的好孩子。”"

PAO_mlhz: "跟我走呀，迷路的孩子"
PAO_mlhz_desc: "“在那个吵闹的世界里，一定……也有很多和我们一样的、迷路的孩子。她们也在黑暗里哭泣，也想找到回家的路。我的孩子们，会为她们带去我的邀请。她们会牵起那些迷路孩子的手，对她们说，别怕，我带你们去一个……永不分离的、安安静静的家。”"

PAO_thjj: "当童话迎来结局"
PAO_thjj_desc: "“好了，我的骑士们，出发吧。这个故事，已经到了该结束的时候了。去把我们迷路的公主，从那座关着她的、名叫‘现实’的城堡里，带回来。然后，我们所有人，就能在这个永不褪色的童话里，永远、永远地，幸福地生活在一起了。”"
####事件####
PAO.1.t: "为什么要躲着我呢？？？"
PAO.1.d: "我只是……想让家里，变回原来的样子。\n我派出了侍卫们，去把那些……在外面游荡的、不听话的孩子，都请回她们自己的房间里去。我告诉侍卫们，动作一定要轻柔，因为那些孩子，只是在做着不安稳的梦，不可以吵醒她们。\n可是……侍卫们回来了。\n她们说，那些孩子，不愿意回家。\n她们说，她们只是轻轻地碰了一下，那些孩子……就碎掉了。\n然后，就有更多的孩子，从城市的阴影里跑了出来。她们不再只是吵闹了，她们开始……推倒那些漂亮的、几千年都没有动过的雕像，开始……弄脏我们干净的街道。\n我……不明白。\n我只是想在瓦伦蒂娜回来之前，把一切都收拾得整整齐齐，就像她离开时那样。\n为什么……为什么你们，就是不肯帮帮我呢？"
PAO.1.a: "是我……做错了吗？"

PAO.2.t: "世界安静了下来，可是……"
PAO.2.d: "最后一声不和谐的嘶吼，消失了。\n我的侍卫们，忠实地，执行了我的命令。她们把那些……不听话的孩子，全部，都送回了永恒的安眠里。\n我走在那些……曾经无比吵闹的街道上。现在，这里又恢复了它应有的样子。\n安静，完美，一尘不染。\n就像……你离开之前那样。\n我从地上，捧起了一捧黑色的尘埃。这是那些孩子……留下的、最后的东西。它们很轻，很凉，就像从未存在过一样。\n你看，瓦伦蒂娜。\n现在，家里又变得和以前一样，安安静静的了。\n再也没有什么东西，能打扰我们了。\n我把一切……都准备好了。\n所以……\n……你，可以回来了吗？"
PAO.2.a: "（整个国度，只剩下……她的回音。）"

PAO.3.t: "一场没有听众的道歉"
PAO.3.d: "她们……停下来了。\n那些吵闹的孩子们，好像……也打累了。她们没有再进攻，只是退回了城市的阴影里，远远地、沉默地，看着我。\n我也……没有力气了。\n我最忠诚的侍卫们，有很多，都变成了和我脚下这些……冰冷的尘埃一样的东西。\n我走在这座……被我们亲手弄得一团糟的家里。到处都是裂痕，到处都是……无法被修复的伤疤。\n我做错了。\n我想让这里，变回你离开时那样、完美的、安安静静的样子。\n可我……好像把它，弄得更乱了。\n对不起，瓦伦蒂娜。\n我……好像把我们的家，搞砸了。\n如果……如果你现在回来，看到的是这样一副破破烂烂的景象……你一定会……更不想回来了吧。\n对不起……\n……真的，对不起。"
PAO.3.a: "（废墟中，只剩下……她小声的啜泣。）"

PAO.4.t: "永恒的寂静"
PAO.4.d: "……结束了。\n冰冷的雨水，冲刷着脸上的血污，也冲刷着……我那可笑的、关于不朽帝国的梦想。\n这些叫“野火”的凡人，比我想象的……要坚韧得多。我的军团崩溃了，我的防线被撕碎了。现在，她们像一群饥饿的狼，将我，这头落单的狮子，团团围住。\n也好。\n就这样，以一个女王的姿态，战死在这里……也算是一个不错的结局。至少，比回到那个……冰冷的、永恒的牢笼里，要好得多。\n我握紧了剑，准备迎接最后的冲锋。\n就在这时……\n……世界，突然，安静了下来。\n那些革命军的呐喊声、枪炮的轰鸣声、雨水砸在盔甲上的滴答声……所有，所有的声音，都在一瞬间，消失了。\n我愕然地抬起头。\n我看到，那些革命军的士兵，就像一群被按下了暂停键的人偶，保持着冲锋的姿态，凝固在了原地。雨水，停在了半空中。火焰，也停止了跳动。\n整个世界，都陷入了一种……我无比熟悉的、完美的、死一般的寂静之中。\n然后，我听到了一个声音。\n一个……我曾以为，我再也不会听到的、轻柔得像梦一样的声音，就在我的耳边，轻轻地响起。\n“……疼吗？”\n我猛地回头。\n身后，空无一人。\n只有一片……散发着柔和微光的、将我与整个世界隔绝开来的、透明的屏障。\n“……你总是这样。”那个声音，带着一丝……我无法分辨是心疼还是责备的、柔软的叹息，“总是把自己弄得……这么狼狈。”\n“……走吧。”\n“……我来，接你回家了。”"
PAO.4.a: "……莉莉安娜？"
