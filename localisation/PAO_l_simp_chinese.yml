PAO_jjlx2: "寂静的流星"
PAO_jjlx2_desc: "“我喜欢流星，虽然瓦伦蒂娜说那只是燃烧的石头。我要我的孩子们也像流星一样，在最深的夜里划过天际，迅速而悄然无声。她们会像一场无人察觉的流星雨，美丽又安静地，降临在敌人的头顶。”"
PAO_jjlx3: "寂静的流星"
PAO_jjlx3_desc: "“我喜欢流星，虽然瓦伦蒂娜说那只是燃烧的石头。我要我的孩子们也像流星一样，在最深的夜里划过天际，迅速而悄然无声。她们会像一场无人察觉的流星雨，美丽又安静地，降临在敌人的头顶。”"
