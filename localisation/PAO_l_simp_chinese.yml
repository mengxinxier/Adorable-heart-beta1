sp_linghun: "摇篮曲计划"
sp_linghun_desc: "§1她们说，每一个新生的灵魂，都需要一首摇篮曲，来引导她安然入睡，再安然醒来。那么我就为你，唱起这首，只属于你的歌。我会用我所有的记忆，为你编织一个没有痛苦的梦境；我会用我所有的力量，为你塑造一具没有伤痕的身躯；我会用我所有的爱，为你点亮一盏永远不会熄灭的、回家的灯。睡吧，我迷路的孩子。等你醒来的时候，一切，就都会和从前，一模一样了。§!"
