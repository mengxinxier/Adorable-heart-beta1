PAO_axhl4_desc: "“我的孩子们，不能再沉睡了。我要轻轻地唤醒她们，为她们穿上最坚固的盔甲，就像妈妈为即将出门远足的孩子整理衣裳。她们会成为我最勇敢的骑士，去迎接她们迷路的姐妹回家。每一个孩子，都会得到我的祝福。”"

PAO_axhl5: "童话的守护者"
PAO_axhl5_desc: "“好了，我的骑士们，出发吧。这个故事，已经到了该结束的时候了。去把我们迷路的公主，从那座关着她的、名叫‘现实’的城堡里，带回来。然后，我们所有人，就能在这个永不褪色的童话里，永远、永远地，幸福地生活在一起了。”"

