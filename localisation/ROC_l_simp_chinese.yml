####事件###

  roc.01.title: "新年双演说"
  roc.01.desc: "元旦方过，广州城内的节日气氛尚未散去，一场围绕革命路线的思想交锋已悄然拉开帷幕。\n\n1月3日，国民政府主席宋庆龄在国民参政会新年茶话会上发表题为《革新与团结》的演说。她身着素色旗袍，语调温婉却字字铿锵：“我们继承总理遗志，但不可做理论的奴隶。联俄、联共、扶助农工，必须扎根于中国的土壤。革命不是毁灭一切，而是革新一切。我呼吁各党各派、各阶级爱国人士，在民族危亡之际放下成见，共建有中国特色的新三民主义共和国。”演说结束后，全场鼓掌长达三分钟，宪政同志会的宋教仁与佩丽卡率先起身致意，CC系的陈晖洁亦微微颔首。\n\n仅仅两天后，1月5日，留苏归国不久的蒋巾帼在广州陆军军官学校开学典礼上发表题为《布尔什维克化的革命之路》的演讲。这位蒋介石的遗孤身着笔挺军装，用带着俄语腔的中文向台下数百名年轻军官疾呼：“总理的三民主义是伟大的，但不够彻底！苏联的革命经验告诉我们，必须建立一个纪律如钢铁的列宁式先锋党，必须发动贫苦大众进行彻底的阶级斗争，必须毫不留情地清洗混入革命队伍的反动势力。同志们，革命不是请客吃饭，不是绘画绣花，不能那样雅致，那样从容不迫！”\n\n两篇演说被广州各大报纸并排刊登。《民国日报》标题为“宋主席倡团结革新，蒋小姐主彻底革命”；《黄埔之声》则以整版刊登蒋巾帼演讲全文，并在头版配发社论《革命需要铁与血》。社会上议论纷纷：温和派担忧民革分裂，激进派痛斥宋庆龄“革命意志衰退”，中正社的军官们则在茶馆里冷笑——“老蒋的闺女，倒想当中国的木之本樱？”\n\n广府的团结，在1936年的第一周便已布满暗痕。"
  roc.01.a: "中国革命必须走自己的道路"
  roc.01.b: "唯有彻底革命才能拯救中国"

  roc.02.title: "潮汕佃租冲突"
  roc.02.desc: "1月中旬，潮汕地区的春耕备耕尚未开始，一场围绕着“永佃权”的纠纷却率先点燃了乡村的对抗。\n潮州府澄海县，拥有三千亩良田的大地主陈焕章以“田租连年拖欠”为由，单方面宣布收回十七户佃农的永佃权，并雇佣县保安队强行驱逐佃户。然而据广府农工部此前调查，陈焕章实则是借“欠租”之名行“加租”之实，其将田租从四成六骤然提高至五成八，远超佃农承受能力。被逐佃农无家可归，聚于澄海城隍庙前绝食抗议。\n\n消息传入广州，各方反应迅速而耐人寻味。\n蒋巾帼领导的民革激进派率先行动。1月18日，蒋在《革命之声》发表声明，痛斥“封建地主阶级对贫苦农民的残酷剥削”，宣布派遣留苏归来的农运干部陈延年率工作组奔赴澄海，协助佃农成立“贫农团”，提出“减租三成、恢复永佃、惩办行凶保安队”三项要求。\n然而，这一次宋庆龄没有像外界预期的那样反对蒋巾帼的激进行动——\n1月20日，国民政府主席办公室发出通报：经查，陈焕章之弟陈焕文现任广西总督府财政顾问，陈家近年来通过梧州商埠向帝国控制区大量输出粮食，其所持“永佃权争议”背后，疑似有广西当局煽动乡绅对抗广府之意图。宋庆龄在内部会议上表态：“这不是土改问题，这是国家安全问题。”\n宋庆龄与蒋巾帼，出人意料地站在了同一战线。\n\n真正的反对声来自宪政同志会。\n1月22日，宋教仁携佩丽卡紧急求见宋庆龄。宋教仁力陈：“陈家固然有千般不是，但我方若公开以政治手段处置经济纠纷，两广侨商、潮汕乡绅必将人人自危。一旦商路断绝，税收枯竭，军队粮饷从何而来？”佩丽卡补充了一份数据分析：潮汕地区承担了广府近四成的侨汇中转，若引发大范围乡绅逃亡，外汇渠道将遭受致命打击。\n\n更尖锐的冲突则爆发于中正社与蓝衣社之间。\n汤汤的清波寨子弟兵中有不少来自潮汕的底层子弟。1月23日，汤汤未经何应钦批准，率百余名亲兵离营南下，声称“回家看望父老”。实际上，清波寨子弟兵在澄海县城外扎营，与陈焕章雇佣的保安队形成武装对峙。\n而识之律者的蓝衣社则截获了另一条情报：陈焕章已通过其弟关系，请求广西总督府以“保护侨商”为名向潮汕边境增兵。识之律者将此情报同时抄送宋庆龄与蒋巾帼，并在报告末页附上一行手书——\n“若让广西借机插手潮汕，两广之防，门户洞开。建议：先斩后奏。”\n\n至此，一场地方佃租纠纷，已然牵动了广府六派中的五派。只有改组派的汪兆铭保持沉默——事后查明，陈焕章的弟弟陈焕文与汪兆铭私交甚笃，改组派此时正在紧急销毁相关通信记录。\n潮汕的田埂上，即将点燃整个南方的导火索。"
  roc.02.a: "彻底清算陈氏地主"
  roc.02.b: "以法庭审判"
  roc.02.c: "授权蓝衣社与清波寨武装"

  roc.03.title: "清波寨的祭旗"
  roc.03.desc: "距蒋介石四·一二忌日尚有两月有余，黄埔中正社已开始紧锣密鼓的筹备。\n\n2月8日拂晓，汤汤率清波寨子弟兵三百余人，在广州北郊白云山脚下举行“春祭演武”。士兵们臂缠黑纱，队列整齐，在临时搭建的灵堂前依次献刀。灵堂正中悬挂蒋介石身着大元帅服的巨幅画像，两侧挽联书——“未酬壮志身先死，留取丹心照汗青”。\n\n汤汤登台训话，言语粗粝却字字如刀：“先总理是咱们清波寨子弟心中永远的总司令。四月十二那天，我不管别人去不去，清波寨的人，爬也要爬到广州去。”\n\n此事未经三军总指挥部报备。何应钦于当日上午得知后，面色铁青，但未公开表态。宋庆龄的秘书则致电中正社，措辞严厉：“国民政府主席尚在，何人敢在国丧之外擅设灵堂？”\n\n识之律者拍案叫好，当场手书一幅行草——“好！”"
  roc.03.a: "这是军中自发行为，不宜强行压制"
  roc.03.a.tt: "§L蒋介石的旧部需要发泄情感。强行弹压只会激化矛盾，不如睁一只眼闭一只眼。§!"
  roc.03.b: "擅设灵堂是越权，必须追究责任"
  roc.03.b.tt: "§L没有三军指挥部的命令，任何部队不得擅自进行有政治意味的仪式。汤汤必须书面检讨。§!"
  roc.03.c: "由三军指挥部出面，将活动收编为官方纪念"
  roc.03.c.tt: "§L堵不如疏。由何总指挥出面，将中正社的活动纳入正式纪念程序，既给了面子，又控了场面。§!"

  roc.04.title: "中正社的请柬"
  roc.04.desc: "2月10日，中正社正式向广府各机关发出“蒋总司令殉国十四周年纪念大会”请柬。烫金黑边，肃穆庄重。\n\n请柬上列明仪式流程：上午八时，黄埔军校旧址集合；九时，向总理遗像默哀；十时，各机关代表致辞；正午，汤汤率清波寨子弟兵举行阅兵；下午，自由发言。\n\n收件人名单包括了广府所有要员。但请柬落款处，没有何应钦的名字，没有三军总指挥部的印章，只有一行字——“黄埔中正社暨清波寨全体子弟 泣血谨启”。\n\n这是试探。中正社想知道：谁站在我们这边，谁站在我们的对立面。\n\n何应钦接到请柬后，在办公室里沉默良久。她没有回复中正社，却打了一个电话给宋教仁——“良桢兄，四月十二那天，你们宪政同志会的态度如何？”\n\n同一日，改组派的汪兆铭派人送了一份厚礼到中正社——“纪念蒋公，吾辈同哀。”\n\n而宋庆龄在她的办公桌上，面对着同一份请柬，久久未动笔。"
  roc.04.a: "我不能向一个私人武装集团低头"
  roc.04.a.tt: "§L中正社此举是挑战政府权威。我以国民政府主席的身份宣布：不承认此次仪式，不派员出席。§!"
  roc.04.b: "纪念可以，但仪式必须由政府主持"
  roc.04.b.tt: "§L蒋介石是北伐先烈，纪念她是应该的。但纪念仪式必须由国民政府主办，中正社只能作为参与方，不能作为主办方。§!"
  roc.04.c: "不出席，但也不阻止，让中正社折腾去"
  roc.04.c.tt: "§L四月十二还早。现在表态太早，不如静观其变。§!"

  roc.05.title: "黄埔夜宴"
  roc.05.desc: "2月12日夜，胡宗南在广州黄埔区的旧军校俱乐部设下私宴，仅三席。受邀者除了中正社的骨干：汤汤、识之律者，以及几位黄埔一期老将，还有一人——蒋巾帼。\n\n这不是一场普通的饭局。胡宗南安排蒋巾帼坐在主位，酒过三巡后起身举杯：“诸位，先总理虽然不在了，但她的骨血还在。今天这杯酒，敬巾帼兄。”\n\n汤汤带头一饮而尽，把碗重重磕在桌上：“蒋小姐，我汤汤不认识什么主义。我只认人。老蒋是我这辈子最敬重的人，你是她女儿。你发话，清波寨的弟兄就跟你。”\n\n识之律者没有说话，只是看着蒋巾帼的眼睛。她的酒杯没有举起。\n\n宴后，胡宗南与蒋巾帼在院中散步。夜色深沉，黄埔江水声隐约可闻。\n\n胡宗南的声音很低，但每一个字都清清楚楚：“巾帼，我知道你从苏联学了新学问回来。这套东西，我们这些大老粗不懂。但你母亲留下的军队，需要一个姓蒋的人来统率。何应钦不行——她心里没有先总理。宋庆龄更不行——她是外人。只有你。”\n\n“苏联那一套，在俄国管用，在中国，水土不服。你母亲的路，才是正道。”\n\n蒋巾帼没有回答。夜色掩盖了她的表情。\n\n但识之律者在不远处，看见了这一幕。她无声地笑了一下。"
  roc.05.a: "这杯酒，我喝。话，以后再说。"
  roc.05.a.tt: "§L蒋巾帼将杯中酒一饮而尽，然后坐下。再也没有多说一个字。§!"

  roc.06.title: "识之律者的谏言"
  roc.06.desc: "2月14日，情人节。广州街头的年轻男女互赠信物，谁也不会想到，在这一天，一个足以改变广府命运的人，正坐在蓝衣社总部的秘密办公室里，等待另一个人的到来。\n\n昨晚宴席上的觥筹交错仍在耳畔。当识之律者的副官通知蒋巾帼“有人求见”时，蒋以为是胡宗南的后续游说。\n\n她错了。\n\n蓝衣社总部设在一处旧仓库的地下，甬道狭长，只有一盏白炽灯摇曳。识之律者坐在最里面的房间，桌上摊着一份厚厚的手写报告。封面上只有五个字：《论需要清洗者》。报告的第一页，第一行字赫然入目——\n\n“汪兆铭改组派——第一序列。”\n“宋教仁宪政派——第二序列。”\n“CC系——待观察。”\n“宋庆龄——不宜列入，但须限制行动。”\n“蒋巾帼——尚未定性。”\n\n识之律者没有请蒋巾帼坐下，只是将报告推到她面前，声音平静得可怕：“说句话吧。你要谁的剑？你母亲的，还是你从苏联带回来的？”\n\n“如果你要前者，这份名单上的后两个名字，可以划掉。”\n\n“如果你要后者——那你早晚会出现在这份名单上。”"
  roc.06.a: "我需要这把剑"
  roc.06.a.tt: "§L你说得对。广府依赖会议和空话太久了。革命需要秩序，秩序需要铁腕。名单前三个，我认可。后两个，你烧掉。§!"
  Whampoa_will_join_RCKMT: "\n§L£GFX_Whampoa_text_icon §g中国国民党黄埔中正社§!和£GFX_CNRS_text_icon §F中国国民党三民主义力行社§!将会成为£GFX_RCKMT_text_icon §P中国国民党革命委员会§!的§Y附属势力§!，£GFX_RCKMT_text_icon §P中国国民党革命委员会§!§O将势不可挡。§!§!\n\n§L如果进入£GFX_RCKMT_text_icon §P民革§!路线，在之后的§P宋§!§R蒋§!§Y之争§!中，将会大幅增加§R蒋巾帼§!的势力。§!"
  roc.06.b: "我不是我母亲"
  roc.06.b.tt: "§L蒋巾帼站起身：“我感谢你的坦诚。但从莫斯科回来的蒋巾帼，不是你们等待的蒋巾帼。革命不是靠清洗和独裁完成的。这份报告，我就当没见过。§!"
  Jiang_jinguo_will_Chiang_Kai_shekism_subtype: "§Y蒋巾帼§!将会走向§g独裁路线§!"
  Jiang_jinguo_will_leninism: "§Y蒋巾帼§!将会走向§R革命路线§!"

  roc.07.title: "先总理灵前"
  roc.07.desc: "夜色如墨。广州东郊的黄埔军校旧址，蒋介石灵堂已布置完毕。明日将是盛大的公祭，但今夜，只有一个人获准进入。\n\n蒋巾帼独自站在母亲的巨幅遗像前。黄埔的夜风穿过破损的窗棂，吹动挽联的黑色绸布，发出沙沙的声响。\n\n灵堂外，中正社的骨干们环立等待。胡宗南、汤汤、识之律者，以及那些曾在蒋介石麾下南征北战的黄埔老将。她们在等一个答案。\n\n蒋巾帼跪了下去。\n\n不是对母亲的跪拜——她从苏联回来后就再也没有跪过任何人——而是对命运的跪拜。这个姿态被门外的军官们看见了。\n\n胡宗南率先走进灵堂，在蒋巾帼身边单膝跪下。然后是汤汤，然后是识之律者，然后是所有人。\n\n没有声音。没有仪式。没有宣誓。\n\n但当蒋巾帼站起来的时候，她已经不是民革的那个留苏青年了。她是这支军队的第二个蒋姓统帅。\n\n识之律者在那一刻，将那份写于2月14日的报告取了出来，拿起笔，在末页补写了一行字：\n\n“蒋巾帼——已定性。第一序列。”\n\n第一序列是保卫，不是清除。\n\n次日，四月十二日。广府政府无人出席蒋介石忌日公祭。但蒋巾帼出席了。她站在灵前，身后是中正社全体军官。\n\n当天下午，蓝衣社开始行动。"
  roc.07.a: "点燃火炬"
  roc.07.a.tt: "§L接过母亲的火炬。从今日起，以“继承先总理遗志、肃清内部”为名，联合中正社和蓝衣社，夺取广府最高权力。§!"

  roc.08.title: "先总理灵前"
  roc.08.desc: "夜色如墨。但蒋巾帼今夜不在母亲灵前。她在另一个地方。\n\n广州陆军军官学校的礼堂里，灯火通明。一百余名留苏归国的青年军官聚集在此，她们是蒋巾帼这两年来亲手培养的骨干。礼堂四壁挂着的不是蒋介石的画像，而是马克思、列宁和孙中山——孙中山被放在最左边。\n\n蒋巾帼站在讲台上，面前的讲稿是一份用俄语起草、连夜翻译成中文的纲领——《论中国革命的布尔什维克化》。\n\n“明天，是我母亲的忌日。黄埔中正社会举行盛大的公祭。”她停顿了一下，“我不去。”\n\n台下寂静。\n\n“不是我不孝。而是我母亲的遗产，不能只被一群将军和特务继承。黄埔精神，应该属于工农，属于革命，而不是属于一个姓氏。”\n\n演讲持续了整整两个小时。关于无产阶级专政，关于彻底的土地革命，关于建立列宁式先锋党。识之律者没有出现在现场，但她的眼线一定在。\n\n次日，四月十二日，蒋介石忌日公祭如期举行。汤汤率清波寨子弟兵列队，胡宗南主持，识之律者致辞。所有人都在等一个人——那个人没有来。\n\n胡宗南当场掷杯：“她不是蒋介石的女儿。”\n\n蒋巾帼收到了这句话。她只是把那份《论中国革命的布尔什维克化》翻到最后一页，用钢笔签上了自己的名字。"
  roc.08.a: "点燃火炬"
  roc.08.a.tt: "§L告别母亲的道路。从今日起，将民革改造为布尔什维克式先锋党，与工农武装会合，发动彻底的社会革命。§!"

  roc.09.title: "黄埔的异端者"
  roc.09.desc: "广府的早春湿冷入骨。蒋巾帼的留苏派在陆军军官学校礼堂里完成了《论中国革命的布尔什维克化》的宣讲，满堂掌声如雷。但掌声之外，整个广州都在窃窃私语——\n\n“老蒋的女儿不要她爹了。”\n\n中正社的胡宗南已在公开场合三次拒绝与蒋巾帼同席，汤汤则在营中放话：“清波寨以后不认姓蒋的了。”识之律者的蓝衣社依然沉默——那种令人窒息的、等待时机的沉默。\n\n蒋巾帼很清楚：她有纲领，有留苏青年军官团，有苏联顾问的暗中支持，但她没有军队。何应钦的三军总指挥部对她保持距离，中正社已视她为仇敌，蓝衣社的匕首随时可能从黑暗里伸出来。\n\n在黄埔系的版图上，她几乎是孤家寡人。\n\n但并非完全如此。\n\n2月17日夜，蒋巾帼的副官陈延年送来了一份人事档案。档案的主人名叫戴安澜，黄埔三期毕业，现任国民革命军第四军第二十五师第七十三旅旅长。履历清白，战功卓著，更重要的是——此人曾因公开反对蓝衣社在军中私设刑堂，被识之律者记入过那份著名的“需要清洗者”名单。\n\n蒋巾帼合上档案："
  roc.09.a: "“安排一次会面。私下。”"

  roc.10.title: "会面"
  roc.10.desc: "珠江边的一座废弃茶楼，曾属于一位不愿与改组派合作的商人，如今已无人光顾。\n戴安澜如约而至。她脱下军装，只穿一件深灰长衫，但腰杆挺得笔直。两人在二楼临窗的角落落座，河对岸广州的灯火稀稀落落，仿佛这座城市自己也嗅到了什么不祥的气息。\n蒋巾帼首先开口，语气坦率得几乎鲁莽：“戴旅长，我需要军队。我有一整套革命纲领，但没有枪杆子，什么都不是。”\n戴安澜没有立刻回答，只是望向窗外。许久之后，她说了一句毫不相干的话：“蒋公子，你还记得昆仑关战役吗？”\n那是北伐战争中的一场恶战，蒋介石还在世。戴安澜率一个团死守昆仑关七天七夜，为大部队撤退争取了时间。那场仗打完，全团只活下来四十一人。\n“我在那七天里想到一件事。”戴安澜的声音很平静，“我们这些当兵的，到底为谁卖命？你母亲去世后，我以为这个问题会有答案。但十四年过去了，中正社的人把军队当成私产，蓝衣社的人把军队当成屠场，何总指挥只顾平衡。广府的革命，到底革了谁的命？”\n蒋巾帼听出了这句话里的意思。她身体微微前倾：“戴旅长，我母亲的路是军绅政权的路，那不是革命，是换个招牌的军阀。我带回的苏联经验或许水土不服，但至少，它有一个完整答案——军队属于党，党属于无产阶级。”\n“苏联经验。”戴安澜重复了一遍这个词，然后转过头，第一次直视蒋巾帼的眼睛，“蒋公子，你去过苏联，我没有。我这一辈子活在黄埔的精神里，而黄埔的精神就四个字：亲爱精诚。”\n“所以我问你——你跟那些大鼻子的顾问，是亲密，是利用，还是依附？”\n蒋巾帼沉默了很久。江水拍打楼基，发出沉闷的声响。\n最终她这样回答：“苏联援助我们武器，顾问教会我们组织。但我不会让任何一个外国人指挥中国军队。我要建立的，是一支服从革命纪律、而不是服从个人或外国的新型武装。”\n戴安澜听完，缓缓起身。蒋巾帼以为这场会见到此为止。\n但戴安澜走到窗前，抬手将桌上那杯没动过的凉茶，倒在了江水里。\n“先总理的忌日，今年我不想只烧纸。”她说，“昆仑关的老兵还剩四十一个，现在分散在第四军的各个角落里。这批人打仗不怕死，就怕上面的人让她们白死。你如果能管住这一点，这群人给你。”\n戴安澜转过身，伸出手——“没有宴席，没有保证，没有军令状。你握不握？”\n蒋巾帼看着那只手，那只在昆仑关握过钢枪、在黄埔校场上受过蒋介石亲授佩剑的手，正平静地伸向蒋介石的女儿——一个决意背叛蒋介石道路的女儿。\n她握住了。\n次日，2月20日，黑色星期二。伦敦股市崩盘的消息还未传到广州，但珠江边的这个握手，已经悄然改变了广府的军事版图。"
  roc.10.a: "握住她的手"
  roc.10.a.tt: "§L没有宴席，没有保证，没有军令状——这是真正军人的盟约。§!"

  roc.11.title: "大萧条席卷广东"
  roc.11.desc: "1936年2月20日，星期四。\n伦敦金融城的股票交易所在开盘后两小时内暴跌逾百分之四十，恐慌如同瘟疫顺着海底电缆蔓延至全球。上海租界的电话交换机几乎烧毁，香港汇丰银行在当日中午宣布暂停兑付，东京、人里、纽约接连沦陷。\n两天后，冲击抵达广州。\n珠江上的货船最先安静下来。往常这个季节，满载生丝、茶叶、桐油的驳船昼夜不息地驶向香港，再由香港分销至伦敦与纽约。但2月22日这天，西堤码头的港务员发现，外洋轮没有来。圣杯国人通过广播发来简短的措辞：“欧洲市场暂停收购华南生丝。”\n暂停——没有人知道这个“暂停”会持续多久。也许三年。也许十年。\n到2月24日，广州的丝织厂已停工过半。数千名女工被辞退，她们沉默地坐在厂房外的马路边，面前摆着搪瓷碗，碗里什么也没有。汕头、江门、顺德的状况更糟——这些城镇几乎没有第二种产业。商店关门，米价却翻了一倍。有人开始在街上抢米，有人开始把女儿送到香港的“荐人馆”——那是体面人的说法，底层的老广直呼其名：人肉市场。\n\n这一次，六派代表全部到齐。没有任何人缺席，没有任何人托病。因为所有人都知道，今天这个会场里装着广府最后的团结。\n宋庆龄发言时，语气依然沉静：“大敌当前，我不说虚话。广府没有足够的钱救所有人。但我们能让所有人至少有粥喝。条件是——在座的每一位，都必须同意粮食由参政会统一调配，军队不得截留，派系不得私囤。”\n会场沉默。\n蒋巾帼环视四周，最先开口：“我同意。前提是——统一调配的执行人，不能是过去和奸商有往来的旧官僚。”\n宋教仁扶了扶眼镜：“这算同意还是算挑衅？”\n佩丽卡拉住了宋教仁的衣袖。陈晖洁与陈千语对视一眼。何应钦轻轻敲了敲桌面——她是主持人，她必须控场。\n识之律者坐在最角落的位置，她没打算说话，只是把那份名单放在膝盖上，指尖慢慢摩挲着纸页的边缘。\n窗外传来珠江方向轮船汽笛的悲鸣。这个城市在等待自己的命运被决定。"
  roc.11.a: "宋庆龄方案——统一战线，共度时艰"
  roc.11.a.tt: "§L由参政会设立“战时粮食统购统销委员会”，各派均派代表参加，佩丽卡主持粮价核算，何应钦保障运输秩序，宋庆龄监督分配公平。这是最慢的办法，但这是能团结所有人的办法。\n\n§Y这将解锁数个§P精诚团结§!的决议以加快恢复经济§!§!"
  roc.11.b: "蒋巾帼方案——由革命政府全面接管粮食"
  roc.11.b.tt: "§L非常时期，非常手段。立即行使革命委员会的战时权限，查封奸商粮仓，逮捕投机者，所有粮食由革命政府统购统销。不服从者，以叛国论处。\n\n§Y这将解锁数个§R铁血手段§!的决议以加快恢复经济§!§!"
  roc.11.c: "放任——让市场自行调节"
  roc.11.c.tt: "§L政府不应介入粮食流通。与其管制失败丧失威信，不如允许商人自由定价、自由运销。待米价涨到有利可图，外省粮食自会涌入。\n\n§Y让大手去忙活吧！经济自己就会恢复啦。§!§!"

  roc.12.title: "军队欠饷危机"
  roc.12.desc: "3月的第一周还没过完，何应钦的三军总指挥部就再也算不出账面平衡了。\n大萧条切断了广府最后的海外财源。生丝滞销，关税断绝；侨汇中断；商人逃亡带来的税基萎缩在2月底的账本上显现出全貌——广府财政实际收入较去年同月减少百分之六十三。而军饷支出占政府总支出的一半以上。算盘珠子拨到最后一行，军需处长没有念出那个数字，只是将账本合上，推到何应钦面前。\n“总指挥，这个月欠三成，下个月欠全部。”\n欠饷的消息瞒不过军队。3月4日，驻扎在广州东郊的第七十三旅某连队率先发难。士兵们没有哗变——戴安澜的部队不会哗变——但她们列队站在操场上，沉默地拒绝出操。没有人喊口号，没有人挥拳头。炊事班抬出来的早饭是稀粥和咸菜，士兵们蹲在地上吃完，然后继续站在操场上。\n戴安澜站在队伍最前面，面对她的士兵，一言不发。她知道她们不是在抗议她，她们只是饿。\n同一天下午，何应钦紧急召见各部队主官。会议室里坐满了人：何应钦的嫡系参谋长、戴安澜、汤汤、中正社的胡宗南、以及几位年过半百的湘军旧将。宋庆龄派了秘书列席，蒋巾帼亲自到场。\n何应钦开门见山：“诸位，我直说。这个月军饷缺口四成。下个月，如果财政没有改善——欠全部。”\n会议室里炸开了锅。湘军旧将拍桌子：“自湘军时代起就没欠过弟兄们的饷！”中正社的军官冷笑：“早说了不能让文人管钱。”汤汤没拍桌子，只是站起来问了一句：“清波寨子弟兵的饷银，我拿寨子的地契抵，行不行？”\n没有人回答她。地契在1936年的广州，已经不值钱了。\n蒋巾帼始终没有开口。她坐在角落，观察着每一个人的反应。\n\n与此同时，另一场对话正在蓝衣社总部进行。识之律者收到了欠饷的情报，她的第一反应不是愤怒，不是恐慌，而是冷静地向副官下达了一道命令：“把各部队连级以上军官的个人情况整理出来。谁家有病人，谁欠了赌债，谁在外面养了外室。三天内给我。”\n“您要做什么？”\n识之律者没有回答。她只是翻开那份已经越来越厚的《需要清洗者》档案，在空白处写道：“饥饿的军队是最危险的东西。它要么咬死敌人，要么咬死主人。重要的是——让它在咬人的时候，咬对了脖子。”"
  roc.12.a: "优先发饷，稳定军心"
  roc.12.a.tt: "§L军队是政权的最后支柱。饥民暴动可以镇压，军队哗变无法挽回。动用国库最后的救急储备支付本月军饷，民政救济先放一放。§!"
  roc.12.b: "降低配额，将有限粮食军民均分"
  roc.12.b.tt: "§L军队也是人民的子弟。将现有存粮平均分配给军队和饥民，所有人都吃不饱，但所有人都不至于饿死。这也许不是最好的办法，但这是最不坏的办法。§!"

  roc.13.title: "铁证如山"
  roc.13.desc: "3月15日清晨，广府参政会的例行会议被一场精心策划的突袭打断。\n识之律者没有亲自到场。她派蓝衣社的三名黑衣专员将一只铁皮箱子抬进议事厅。箱子打开，里面是过去三个月来改组派与广西总督府的全部通信记录：密电原件、电报局存底、送信人的供词画押，以及汪兆铭亲笔签署的一份《两广合作备忘录》草稿。\n最致命的一封电报日期是3月2日——就在大萧条冲击广府仅十天后。汪兆铭致电广西总督府：“粤局已乱，宋氏束手，蒋氏内斗。请贵督以‘协饷’为名邀何应钦来梧，届时由桂方控制其人，改组派即在广州举事。事成，两广共主北京，桂督可兼领粤省军务。”\n何应钦当场站起。据说她的手在抖，但声音极稳：“这封电报，发出去的时候，汪兆铭还在参政会上对我笑了笑。几天前的事。”\n宋庆龄沉默地看完所有材料，然后问了一个问题：“汪兆铭现在在哪里？”\n没有人能回答。\n改组派所有的办公地点都已人去楼空。汪兆铭的私宅大门敞开，茶尚温热，卧室衣柜空空如也。她的副官留下一封信，只有一行字：“兆铭先生已于昨夜离穗。诸位同志，来日方长。”\n蓝衣社追查至码头。一艘挂着幻想乡国旗的货轮“圣巫女号”已于凌晨四时起锚，目的地梧州。船长在接受无线电质询时回复：“乘客持合法旅行证件，已支付全程船资。”问：什么证件？答：广西总督府签发的外交护照。签发日期——3月1日。\n汪兆铭跑掉了。但改组派在广州经营多年的组织网络、秘密联络站、军中的暗线、商界的代理人，没有来得及全部撤走。铁皮箱子里的材料足够蓝衣社和宪政同志会按图索骥，将所有未及逃脱的改组派成员全部锁定。\n一场清洗，已是弦上之箭。\n宋庆龄在当日下午发表简短声明：“改组派汪兆铭等人通敌叛国，证据确凿。即日起，改组派为非法组织。”蒋巾帼紧随其后发表声明，措辞更加激烈：“革命的躯体上长了毒瘤，割掉它，血会流，但人能活。”\n何应钦没有发表声明。她只是命令三军总指挥部将改组派关联的三名团级军官就地解职扣押。没有审判，没有解释。\n识之律者在蓝衣社总部里翻阅着那本越来越厚的《需要清洗者》档案。她在汪兆铭的名字旁边，终于打上了一个红色的勾。\n改组派——第一序列。清除完毕。"
  roc.13.a: "追查到底，不留后患"
  roc.13.a.tt: "§L改组派的网络必须连根拔起。所有曾与改组派有联系的人，无论地位高低，全部收押审查。宁可错抓，不可漏网。§!"
  roc.13.b: "由特别法庭公开审理，以儆效尤"
  roc.13.b.tt: "§L证据确凿，但程序不能省略。由宪政同志会牵头组建特别法庭，公开审理改组派通敌案。我们不只要清除叛徒，还要让天下人知道我们依法办事。§!"

  roc.14.title: "广州霍乱"
  roc.14.desc: "七月流火。广州西关的贫民区里，一场霍乱正悄然蔓延。\n最初的病例出现在一条名叫“金花巷”的窄巷里。一个以挑水为生的苦力在某天清晨没有出现在码头上——她死了。三天之内，西关报病者逾百人，死亡二十三人。到了第七天，疫情已扩散到河南的纺织工人居住区。\n广州的现代公共卫生体系在纸面上是存在的。佩丽卡曾主持编制过一份《广府公共卫生纲要》，列出了若干急症处置方案。但大萧条耗尽了卫生署的经费，方案搁在档案架上落灰。现在，瘟神来了。\n卫生署官员紧急请求：立即隔离西关疫区，由军队提供封锁线，并动用救急储备从香港进口血清。但封锁西关意味着切断贫民的生路，军队出动的代价是进一步架空何应钦已经捉襟见肘的军饷。富商陈家则主动表示愿意捐资购买血清——条件是优先供应“体面人家”。\n城区各处的药店，防瘟药材的价格已经在暗涨。"
  roc.14.a: "立即封锁，军队出动"   ##中正社+5%
  roc.14.a.tt: "§L霍乱不是请愿，不能用对话解决。调动一个宪兵连封锁西关疫区，由卫生署从救急储备金中拨款购买血清。优先控制疫情，事后追究谁耽误了防疫。§!"
  roc.14.b: "免费救治，开放血清"   ##民革+5%
  roc.14.b.tt: "§L用救急储备金从香港购买血清，免费向疫区发放。同时在西关开设临时粥厂和救助站，由卫生署和民间慈善团体合作运营。防疫不只是医学问题，也是人心问题。§!"
  roc.14.c: "征集志愿者，由民间自救"   ##宪政会+5%
  roc.14.c.tt: "§L政府的钱和军队的力量都是有限度的，但人心可以无限。发动西关居民自救，征集医生、护士和受过教育的学生担任志愿者，政府提供药品和协调，但抗疫的主体是人民自己。§!"
  roc.14.d: "接受乡绅捐助——让有钱人出钱，政府出人"   ##CC+5%
  roc.14.d.tt: "§L陈家愿意出钱买血清，这是好事。接受捐助，但推掉所谓‘优先供应’的条件。同时号召全城富商捐资，成立‘防疫善款’，由政府统一调配。§!"
  roc.14.tt: "§Y这将有效改善现状，我们可在后续的国策中彻底清除霍乱带来的负面影响§!"

  roc.15.title: "广府内部的斗争"
  roc.15.desc: "1936年，局势的演变将广州国民政府推向了历史的前台。目前，国府的控制区稳固地涵盖了整个广东省，从繁华的珠江三角洲一直延伸到南端的北海。然而，平静的表象下暗流涌动，西邻的广西军阀依然保持着半独立状态，两地之间爆发冲突只是时间问题。\n\n在这个关头，关于如何组织政权、如何建设军队以及如何塑造未来的社会形态，广州政府内部各大力量的理念交锋已经到了无法掩饰的地步。在国府的权力棋盘上，四大派系正各据一方：\n\n首先是中国国民党革命委员会（民革）。这是当前国民政府中最左翼的力量，带有浓重的社会主义色彩。宋庆龄作为广州国民政府主席，是名义上的最高领袖。该派系内部在路线上存在分歧：以宋庆龄为首的温和派奉行新三民主义，主张通过保障工农的基本民生权益来调和阶层利益，走联合各界的改良道路；而以蒋巾帼为首的激进派则主张采取更彻底的体制，由国家全面组织保障劳动阶级，甚至提出将民革彻底改组为正统的列宁式政党，以先锋队姿态引领革命。\n\n负责实际行政事务的宋教仁则领导着中国国民党宪政同志会（民宪会）。作为行政权力最大的行政院院长，她掌握着政府日常运转的实权。该派系坚定主张推行议会与内阁制，倾向于法治与自由发展的框架，倡导通过健全的宪政体制与法律来稳步推进建设。\n\n在暗处，由陈晖洁与陈千语姐妹掌控的中国国民党中央俱乐部（CC系）牢牢抓着党务大权。她们主管着整个政府的党务工作，更掌握着无孔不入的中统情报机关，其组织网络渗透于各派内部，是广府最沉默也最令人畏惧的力量。\n\n而曾经的蒋介石门徒们，以黄埔军人胡宗南为中心组建了中国国民党黄埔中正社（中正社）。她们极度推崇已故的北伐总司令蒋介石，掌握着广府地区相当大的军权。此外，汤汤和她的清波寨民兵作为一股庞大而独特的武装力量，也依附并活跃于中正社的旗帜之下，随时准备为保卫政权而战。\n\n这四大政治力量在广州的交锋，将彻底决定这个新生政权未来的阶级色彩与历史走向。"
  roc.15.a: "先总理之愿景，革命的中国万岁！"
  roc.15.b: "军政、训政皆为过渡，该迈向宪政了！"
  roc.15.c: "革命的首要任务是清除反革命分子！"
  roc.15.d: "国民革命军必将走向胜利！"

  roc.16.title: "关于社保体系"
  roc.16.desc: "随着新政权的根基日渐稳固，关于即将建立的社会保障体系的规模与形式，在国府内部引发了一场激烈的辩论。各方代表齐聚一堂，围绕着国家的未来蓝图针锋相对。\n\n民革派系的内部首先出现了分歧。蒋巾帼起立发言，倾向于实行更加彻底的体制，主张由国家全面兜底，将工厂与农村的所有劳动者紧密组织进全方位的社会保障网中；同属民革的宋庆龄则更强调新三民主义的原则，呼吁将重点放在保障工农的基本民生权益上，走一条调和各阶层利益的联合改良道路。\n\n随后，胡宗南代表军方表达了立场，她认为在当下的战时环境中，应当以国家安全为重，有限的资源必须优先保障军人、军属以及国防工业职工的待遇，以此铸造铁血国家的基石。\n\n最后，宋教仁发表了温和的演说。她倾向于法治与自由发展的框架，主张通过宪政立法来规范合理的劳动时间与最低工资，依靠社会经济的自然发展和民间勋贤的慈善来逐步解决民生问题。\n\n面对各方相左的政见，争论从会场一直延续到深夜。最终，提案被递交到了中央执行委员会的案头，经过中执委委员们的反复讨论与闭门表决，广州政府即将推行的民生政策方向就此定调。"
  roc.16.a: "革命政府自然要有革命政府的作为"
  roc.16.b: "社保体系是民生主义实现的基石"
  roc.16.c: "国民革命军是革命的先锋，理应照顾"
  roc.16.d: "仅需完善相关立法，大手会自动调节"

  roc.17.title: "整饬内部"
  roc.17.desc: "据各埠报载，环球经济恐慌蔓延，本省深受其害。因海外市场萎缩，珠江三角洲之生丝、蔗糖等大宗物产出口顿绝，市价奇落，百业凋敝，致使金银外溢，地方金融库储剧烈动荡。在此内忧外患之际，黑市投机日益猖獗，更有地方官吏勾结行帮奸商，挪用国防建设巨款囤积居奇，以图暴利。中枢震怒，饬令严加整饬。日前中执会扩大会议上，诸方文电交驰，辩论尤烈：\n\n蒋巾帼痛陈“商贾不仁，动摇国本”，拟请特设“经济管制督导队”，悬严厉限价之令。凡涉嫌投机之大户，即行强索冻结其资产，抄没私仓，将所获物资平价投放市场，并公开严惩垄断奸商，期以迅雷之势安定底层市怨。\n\n汤汤则电呈中央，坚持“乱世重典，军法肃贪”之策。军方所瞩，全在防务受损，汤汤谓克扣倒卖前方军需者等同通敌叛国，呈请由军警督察队直接进驻海关、要道及军需仓库，特设临时军法处，凡查实侵吞者即行就地正法，以绝对威慑肃清纲纪。\n\n陈千语则持重议，谓公开捕杀、急躁冒进恐引社会惶恐，反激经济动荡。CC方略主张“内密察核，隐澄清吏治”，运用调查统计网络与内部党务卷宗，循银行账目与行政批文顺藤摸瓜，对涉案官僚隔离审查、没收财产，在不惊物听之防线下清除痼疾。\n\n佩丽卡则别树一帜，立论于制度防漏。她直指贪腐与黑市之根源在于行政流程疏漏，遂呈递《现代财务审计草案》，拟设独立之中央审计委员会，于全省工厂、机关强制推行现代复式记账，清查票据，倒查资产，以严密之财务核算绝侵吞之门，期以技术改良理顺工业行政体系。\n\n各方条陈已悉数呈阅，此番雷厉风行之内部整肃，正待最高当局之最后裁夺。"
  roc.17.a: "着即平抑市价，严惩囤积居奇"
  roc.17.b: "严申战时军纪，贪墨军需者就地正法"
  roc.17.c: "密加内部察核，整饬党政机关纲纪"
  roc.17.d: "厘清财政账目，推行财务法治审计"

  roc.18.title: "整饬内部"
  roc.18.desc: "粤中政令向难出城廓，乡村宗族盘根错节，土匪肆虐、抗税不道之风频发，根据地根基流于浮表。为充实粮饷兵源，国府中央决定推行大规模下乡运动。关于方略，中枢文电往来，各出机杼：\n\n蒋巾帼有“深入陇亩，倾听民瘼”之倡，拟组织青年学生下乡，直接接触佃农与雇工，编组“基层农协会”。其方案旨在推行减租减息、强行平抑乡村高利贷，期以土地之利结万民之心，激发最广泛之参政参军热潮。\n\n汤汤则以“治安不靖，何谈动员”为定见。军方所关注者，乃战时后方之绝对稳定。汤氏呈文主张将下乡运动演变为“清乡与整编”，拟派军警武力全面进驻，强行清剿地方土匪与抗租武装，严编保甲自卫队并施以军事训练，以铁血秩序确保军粮征购流向不受阻碍。\n\n陈千语则长于组织渗透，谓盲动底层易激宗族械斗，因循失控。其提案主张“设支部于乡里，联绅贤以持重”，利用地方开明绅士与宗族长老之声望，建立严密的基层情报与察核网络，辅以大规模宣讲，从思想与组织上实现对乡村社会的绝对控制。\n\n佩丽卡专治经济改良，谓乡村之贫困动荡源于生产落后。她条陈《兴办现代农业合作社方案》，主张由政府提供微贷与优良农机，派遣技术人员指导农桑，并推行科学的土地清丈与赋税登记。以制度化、产业化之手段提升农村生产力，从而实现基层的长治久安。\n\n诸方条陈利弊互见，钧座如何落笔，事关华南数万村落之明天。"
  roc.18.a: "深入陇亩，切实解决农工生计"
  roc.18.b: "清剿匪患，编组地方自卫武装"
  roc.18.c: "设支部于乡里，严密地方察核"
  roc.18.d: "推行农业合作，兴办现代农桑"

  roc.19.title: "三军现状"
  roc.19.desc: "军政部日前奉令通盘点验本政权之军事家底。据呈阅之点验密折所载，华南陆海空三军虽略具御侮之雏形，然兵械陈旧、元气未充之窘态亦跃然纸上：\n\n陆军方面，现统辖正规军各师旅，虽粗具现代整编规模，然粮饷械弹仍形见绌，士兵多操各色杂械；另有各县保安民兵，用作防务维持。尤为特殊者，乃汤汤所部之「清波寨民兵」。该部本系草莽游侠出身，久经地方战火，虽编制庞杂、纪律稍逊，然个个长于山地游击与短兵肉搏，今感念大义接受整编，可为我军出奇制胜之侧翼奇兵。\n\n海军方面，基础素称薄弱。现存舰艇与骨干，多为昔日北伐及前此各次政变期间，感念大义投诚归附之起义官兵，以及部分残存之旧制驳船。所辖吨位最大者，亦不过数艘暮气沉沉之江防岸防舰与内河炮艇。主炮威力既弱，装甲尤薄，仅能勉强巡防珠江口岸及各处内河水道，断难在远海与列强巨舰争锋。\n\n空军方面，其凋敝状况与国内各省无异，殊堪痛心。航空委员会库储之中，多为早年自欧美拼凑购入之各式双翼教练机，及极少数性能落伍、机件老化之旧式单翼侦察机。由于零件无着、油料奇缺，飞将虽有报国之志，奈何铁翼难展。目前各机队仅能勉强维持每日之斥候联络，防空袭扰能力近乎于无。\n\n三军现状如此，内省外顾，百端待举，正赖我辈筚路蓝缕、克难图强。"
  roc.19.a: "我们要建设一支无愧于民国的军队"

  roc.20.title: "徐州誓师"
  roc.20.desc: "徐州城郊的旷野上旌旗猎猎，数万国民革命军将士列阵而立，枪刺在夕阳下闪着寒芒。苦守广府、四面受敌的漫长岁月刻在她们脸上，那是南国的暴风雨和连绵硝烟打磨出的坚韧。多少年了，从困守五岭到饮马长江，从誓师粤中到克复金陵，她们这支在各方夹缝中苦苦支撑、九死一生的军队，终于彻底荡平了华南，打过了长江，打出了一片天。\n\n誓师高台临时用土石筑成，简朴却威严。一面青天白日旗在晚风中缓缓飘卷，军委会常务委员、北伐军总司令何应钦正立于台前。台下那一张张面孔她太熟悉了。有人缺了耳朵，有人脸上的弹痕还没好利索；有与她在广府大本营的焦土上同生共死十余载、发丝斑白的老同志，也有在两广闽赣农村新参军的年轻面孔。她们将命压在这里，在没有外援、孤立无援的黑夜里熬了过来。而现在，她们攻克南京之后，终于站在了徐州城下，再度誓师准备底定中原。\n\n何应钦深吸一口气，开口了。她的声音不高，却像山风过松，每个字都清晰地送进数万人的耳中——\n\n“徐州地方，历代大规模征战五十余次，是非曲直，难以论说。但史家无不注意到，正是在这个古战场上，决定了多少代王朝的盛衰兴亡，此兴彼落。所以古来就有‘问鼎中原’之说。”\n\n何应钦的声音忽然拔高，带着一种滚烫的激昂。“昔日第一次北伐之时，我军分路汇合徐州，兴师北上。也正是在这徐州城郊，我有幸亲率十数万健儿，与顽敌喋血搏杀，大获全胜！”\n\n她猛地攥紧拳头，向前迈了一步。那一刻，多年孤军死守的屈辱与等待仿佛在她眼中燃烧。“诸位同志！两广闽赣乃至金陵古都已尽归我手。但我辈革命，岂能止步于此？燕京伪廷尚在苟延残喘，腐朽的旧帝国势力仍虎视眈眈。自辛亥革命至今，国家还没有真正统一，老百姓还没有真正站起来！今天我们站在这里，站在两千年来无数英雄问鼎中原的起点上。但我要告诉诸位，我们这一仗，不为问鼎！不为称王！不为改朝换代！”\n\n何应钦霍然转身，面向北方。晚风灌满她的军装，吹得衣角猎猎作响。她抬起右臂，食指如刀，指向暮色中苍茫的地平线，指向那云海之外的北方山河。她的声音陡然沉雄下来，一字一句像是在铁砧上锤打而出——\n\n“我们这一仗，是要彻底铲除军阀与腐朽伪廷！是要将帝国主义逐出国境！是要让四万万同胞，不受欺辱地活在这片土地上！”\n\n她眼中闪着光，那是死守广府、最绝望时也从未熄灭过的光。她望着这支百炼成钢的队伍，望着这些把最好的年华都交给了华南战场、交给了革命的汉子们，一字一顿，声音骤然拔至最高——\n\n“诸位同志，随我北上！打过黄河，打过燕山，指戈长白山麓！”"
  roc.20.a: "打倒列强除军阀！"

  roc.21.title: "粤桂战争"
  roc.21.desc: "逆首汪兆铭前此勾结旧桂、密谋叛国之劣迹败露，仓皇潜遁梧州。岂料其非但不知闭门思过，反倒自甘堕落，与旧桂系军阀陆荣廷沆瀣一气。逆党群小执迷不悟，竟于南宁纠集残余，僭号“南宁国民政府”，公然与广府分庭抗礼，妄图以伪易正，分裂党国。\n\n消息传至粤中，自军委会委员至三军将士，无不义愤填膺，切齿痛恨！汪逆昔日身居党国要职，满口主义垂范，不料一转身竟为一己之私欲，不惜引狼入室，将利刃对准昔日同生共死之袍泽，密谋绑架主官，出卖粤中父老。此等寡廉鲜耻、数典忘祖之卑劣行径，实属罪无可逭，诚为党国之巨蠹、四万万同胞之公敌！一言及此，莫不痛心疾首。\n\n尤可恨者，陆逆荣廷窥伺粤中财赋久矣，今得逆党为张本，已尽起桂军精锐，自西江、封川一线大举压境，粤桂边境烽烟陡起，枪炮齐鸣。此番同室操戈，全系叛徒与旧军阀各怀鬼胎、倒行逆施所致。国贼既已兵戎相见，革命道统所在，断无退让之理，唯有厉兵秣马，恭行天罚，彻底荡平南宁伪府！"
  roc.21.a: "此等叛徒国贼，唯有以血洗血！"

  roc.22.title: "粤桂战争"
  roc.22.desc: "逆首汪兆铭潜逃南宁之后，不仅毫无负罪潜隐之意，反倒变本加厉。其在旧桂系军阀陆荣廷的刀兵庇护下，竟公然僭建所谓“南宁国民政府”，自立伪府，妄图以伪易正。汪逆昔日身居要职，一朝败露，竟甘愿沦为旧军阀窥伺粤中的政治招牌，此等自绝于民国、分裂党国之狼子野心，已是昭然若揭，令本党本军上下无不切齿痛恨！\n\n军事委员会对此彻夜密议，众将领一致认为，对付此等引狼入室、负隅顽抗之蠹贼，断不可姑息养奸，更不能坐视南宁伪府好整以暇、引火东来。粤桂唇齿相依，若陷入消极防御之被动，则粤中财赋、前线根据地皆将永无宁日。与其待其羽翼丰满、大举进犯，不如在伪府立足未稳之际，彰显本党道统大义，抢先挥师西征，先发制贼！\n\n讨逆动员令日前已由军委会连夜下达，三军总指挥部正式发布西征绝密军令。前线主力克期动员，水陆并进，前锋各师已衔枚疾走，直扑封川、梧州之要冲；西江江面上炮舰列阵，封锁关隘。此战非为两省之私怨，实为荡平国贼、稳固革命后方之大义举。既然南宁逆党甘心与旧军阀合流，我辈唯有以雷霆之势恭行天罚，直捣西江，彻底荡平南宁伪府！"
  roc.22.a: "大军西征，毕其功于一役！"

  roc.23.title: "审议引进海外火炮技术案"
  roc.23.desc: "军事委员会统帅部近准军工采购团呈报，关于考察列强火炮工业之条陈。该报告称，欲于短期内充实我军师团火力，速成国防近代化，唯有借径海外成熟之兵工体系，依其规范，因势利导。现将各国著名工厂机构之技术利弊，条列如后：\n\n圣杯王国之皇家兵工厂，其冶金之精、光学之密，冠绝诸国。其所制炮身质地坚韧，历经剧烈突击与长途拉锯，仍能确保弹道之精准与管壁之寿命。若引此制，最利于我军之精准轰击与步炮协同突击。\n\n苏维埃联盟由其最高领导[SOV.GetLeader]同志亲签合作令，向我开放格拉宾设计局之机密图样。该局设计一以总体战为归宿，力求结构之简化与工艺之标准化，极利流水线大规模快速开制；其火炮火力猛烈且造价低廉，足资以密集之弹幕摧毁敌方坚固防线。\n\n远洋国之“约翰老妈”联合企业，虽根植彼岸，然其资方与高层多具华侨纽带，素有血浓于水之谊，对我现代国防寄予深厚热忱。该厂野战炮规制，因其图籍、标识皆有华文对照，同文同种，最便我国工匠直接吸收与迅速仿造。且其器械一如既往注重务实，极其坚固耐用，零部件互换率特高，可大为克减野战后勤之辎重负荷。\n\n综上所述，技术之抉择既关乎我炮兵战术之形制，亦牵动地缘外交之大局。统帅部须审视当前列强对我方之亲疏，选择交好者派员接洽，克期立办。"
  roc.23.a: "派员赴圣杯王国，洽商兵工技术。"
  roc.23.b: "遣使赴苏维埃联盟，密商重炮技术合作。"
  roc.23.c: "联络远洋国华侨，协议技术援助。"

  roc.24.title: "唯果的归航"
  roc.24.desc: "1933年，“骸骨之夜”降临柏林。一夜之间秩序崩塌，总统兴登堡殉难，总理莉莎在卫队拼死掩护下退往奥地利——那里既是她的故土，也是与德意志同文同种之地，流亡政权就此重新支起了旗帜。\n\n留学生蒋唯果彼时尚在德国潜心钻研装甲战术，随之卷入乱局。她本以为流亡政权纵然颠沛，总该保存几分理智与体面。然而现实截然相反——政权落入一群极右翼之手，政治空气日益扭曲。这些人对国民政府抱有一种近乎偏执的敌意，认定这个远在东方的国家迟早会染上赤化的瘟疫，将其定性为“赤色策源地”几乎成了不容置疑的政治正确。\n\n1935年，莉莎在流亡政权中大权在握，极端派全面得势。唯果因其国府出身而屡遭冷眼与刁难，最终不得不收拾行装，辗转抵达火车联邦的首都御一夜市。正是在这座以温泉与铁轨闻名的城市里，她遇见了西瓜。\n\n火车联邦是一个政治氛围相对正常的国家，与德意志流亡政权的压抑与扭曲判若云泥。这里的日子平静而安稳，汽笛声取代了昔日的警报，铁轨延伸的方向不再意味着逃亡。唯果在此得以喘息，也正是在这里，她遇见了西瓜。\n\n西瓜并非寻常的联邦居民，而是一具服务于铁路系统的人偶。她的身躯由精密齿轮与蒸汽导管构成，那双眼睛却闪烁着比许多人类更为真挚的光芒。西瓜深爱着这片由钢铁轨道编织而成的土地，但她的目光并不局限于联邦的边界。她对中国怀有一种难以言喻的向往，曾对唯果坦言：联邦的土壤太过平和，载不下装甲兵的铁拳与烈火，那片遥远的东方土地，或许才是铁与火真正得以绽放的地方。\n\n唯果的身世另有一则始终未被证实的传闻：传言称其生母并非名义上的蒋委员长，而是党国元老戴姬桃。唯果曾于流亡期间致电求证，戴姬桃严词否认，回电训诫：“你的母亲是殉国的英烈。放下这些无谓揣测，你该看的是战车履带下的道路。”\n\n1936年，欧洲经济危机持续蔓延，学术与思想的流动空间被压榨殆尽。唯果做出决定——返回国府，带着颠沛流离中积攒的学识与理念，投身于那片她与西瓜都深信不疑的、战火与理想并存的土地。”"
  roc.24.a: "这片土地需要你们的火焰"
  roc.24.b: "唯果是自家人，那个铁疙瘩算怎么回事"

  roc.25.title: "铁轨彼端的来信"
  roc.25.desc: "西瓜抵达广州的消息尚未从报纸版面上彻底褪去，一封加密电报便越过边境，精准地落入了她的接收终端。发报方是第三国际。\n\n自二十年代那场惨烈的北伐失败后，第三国际在中国的联络网络便几乎被连根拔起。联络员或被捕，或牺牲，或就此隐没于人海，再无音讯。此后多年，第三国际与国府之间只剩下断断续续的短波信号和语焉不详的第三方传话，始终未能重建一条稳定的线。而如今，她们选中了西瓜。\n\n理由并不难理解。西瓜是一具铁路人偶，她的日常轨迹天然覆盖着中国的交通命脉；她没有人类联络员那些可以被追踪的社会关系，也早已在入境时便以“唯果的随行同伴”这一身份过了明路。对于第三国际而言，这几乎是一个量身定做的理想人选。电报中措辞克制而郑重，正式委派她为第三国际驻国民政府联络员，负责重建双方之间的信息通道。\n\n然而，秘密之所以为秘密，是因为它终究会泄露。当这一消息通过某些不便言明的渠道传入国府各方耳中时，政坛上迅速分成了两派声音。\n\n主张合作的一方态度明确：北伐失败是十年前的旧账，如今国际形势已天翻地覆，揪着过去的失误不放毫无意义。第三国际愿意重新建立联系，这本身就是一种态度，国府没有理由拒绝一条送上门来的信息渠道。更何况，联络员不过是一具人偶，她能做的无非是收发报、传信息，翻不了天。\n\n反对的一方的顾虑则更为务实：留她一具人偶不难，难的是日后第三国际借着这条线越伸越长。外部势力一旦在国府有了固定的联络员，干涉内政便只是时间问题。与其日后生隙，不如眼下找个体面的理由婉言辞退，既不失礼数，也不留后患。"
  roc.25.a: "让她留下，我们需要这条线"
  roc.25.b: "婉言辞退，国民革命不要外人插手"

  roc.26.title: "[FROM.GetName]的轻武器筹购案"
  roc.26.desc: "随着远东战事与整军计划的推进，[FROM.GetName]对制式轻武器的需求日益迫切。为此，其全权代表携带着外汇与硬通货，正式向我方递交了采购成套步枪及配套弹药的备忘录。\n\n这笔订单去留的否决权完全握在[ROOT.GetName]手中。这不仅是一桩单纯的军贸生意，更是调整远东地缘博弈天平的砝码。放行这批武器将赋予对方正规化的物质基础，而拒绝则会让她们继续在枪械庞杂的泥潭中挣扎。我方必须基于长远的外交利益，做出利弊权衡。"
  roc.26.a: "签署协议，装车启运"
  roc.26.b: "予以婉拒，远东的枪弹不应流向此处"

  roc.27.title: "[FROM.GetName]火炮采购案"
  roc.27.desc: "在现代总体战的熔炉中，没有重型火炮支持的步兵序列在绝对火力面前往往要付出惨烈的代价。为了弥补致命的重火力劣势，[FROM.GetName]的军事代表团正式向我方提出了采购大口径火炮及配套观测仪器的请求。\n\n这项涉及重工业核心产出的军贸案，其生杀大权完全取决于[ROOT.GetName]。重器不可轻授，这些象征着现代工业毁灭伟力的钢铁巨兽一旦流入远东，势必引发地缘局势的剧烈连锁反应。是满足对方对钢铁火力的极度饥渴以换取长远利益，还是出于战略安全考虑将其付之阙如，全在我方一念之间。"
  roc.27.a: "让我们的炮火在远东轰鸣"
  roc.27.b: "扣留批文，重器不可轻授于人"

  roc.28.title: "[FROM.GetName]同意出售轻武器"
  roc.28.desc: "来自[FROM.GetName]的密电已经译出，对方最终批准了我们的轻武器采购请求。这笔宝贵的军火将迅速填补前线的缺口，那些缺乏训练的民团，终于能够握上制式整齐的钢枪。"
  roc.28.a: "组织接收，配发各部"

  roc.29.title: "[FROM.GetName]同意出售火炮"
  roc.29.desc: "沉重的轰鸣声打破了军港与车站的沉闷，[FROM.GetName]通过了火炮采购案。沉重的身管、沉稳的炮座以及配套的精密观测仪器正跨越山海而来。这批现代工业凝聚而成的重器，将彻底改写我方前线缺乏重火力的被动局面，用真正的钢铁雷霆去回应强敌的试探。"
  roc.29.a: "这是属于我们的雷霆"

  roc.30.title: "落空的军械筹购案"
  roc.30.desc: "外交部送来的报告令人失望，[FROM.GetName] 最终回绝了我们的军事采购请求。在冷酷的地缘利益面前，我们的外汇与诚意未能打动对方的官僚。\n\n现代重工业的伟力终究是傲慢的，在没有绝对对等的地缘筹码之前，对方不会轻易施舍任何枪械或重器。这意味着前线的军械缺口依旧严峻，各部仍需拿着现有的粗粝装备，凭着血肉之躯去面对接下来的血战。"
  roc.30.a: "强敌环伺，唯有自强。"

  roc.31.title: "[FROM.GetName]请求援助"
  roc.31.desc: "随着樱花国的兵锋在远东悍然发动，海疆与大地的陆路通道已被敌军彻底切断。为了维持远东反侵略战线的存在，我方航空队正与 [FROM.GetName] 的空勤人员一道，在狂风肆虐的雪山天险之间，用鲜血与残骸维系着那条九死一生的“驼峰航线”。\n\n如今，[FROM.GetName] 的最高代表再次发来紧急备忘录。她们恳请我方统帅部能够调整这条空中走廊的运输配额，在接下来的航程中，除了维持基本生计的物资外，允许将我方兵工厂生产的制式轻重武器及弹药大量装车。这笔援助将由我方的运输机队冒着坠机风险越过天险送达，一旦批准，势必激怒锋芒正盛的樱花国。"
  roc.31.a: "我们会全力帮助她们的抵抗！"
  roc.31.b: "这对我们难道有什么好处吗？"

  roc.32.title: "[FROM.GetName]送来了一批援助"
  roc.32.desc: "圣杯王国统帅部最终通过了关于调整空中走廊运力配额的提案。在我们与圣杯王国飞行员共同用生命维持的“驼峰航线”上，运输机群的螺旋桨轰鸣声变得前所未有地沉重。\n\n大批带有圣杯王国工业烙印的制式钢枪与火炮，正被塞满那些涉险飞越雪山走廊的运输机机舱，绕过樱花国的海上封锁线，源源不断地降落在我们的后方机场。有了这笔关键的物资注入，我们在面对樱花国不可一世的侵略兵锋时，终于有了对等抗衡的底气。反攻的火种，正顺着这条空中命脉传递而来。"
  roc.32.a: "组织卸载，开赴前线！"

  roc.33.title: "[FROM.GetName]拒绝援助武器"
  roc.33.desc: "外交层面的最后努力最终撞上了冷酷的现实，圣杯王国拒绝了利用空中走廊向我们输送重型军火的请求。在涉及远东地缘的精细算计中，彼岸的官僚与统帅部显然不愿为了我们，去彻底激怒樱花国。"
  roc.33.a: "既无外援，便以血肉筑长城"

  roc.34.title: "机械化的尝试"
  roc.34.desc: "我军自引介西制、整饬戎行以来，颇有步武欧陆之志。惟我国重工业基础薄弱，百物匮乏，欲一蹴而就编练正规机械化师旅，势必戛戛乎其难。\n\n鉴于物质局限，军械整备部门另辟蹊径，就现有之少数轻型装甲车行“车载炮”之改装试验。其法系于车顶或后舱强行焊接敞开式炮位与薄钢防盾，将向由骡马挽曳之轻型火器直接移诸车上。此举虽属临时拼凑，存在重心不稳、防护脆弱等先天阙失，然揆诸现实，实为突破胶着、尝试“使火炮长足”之先声。"
  roc.34.a: "搭载步兵炮"
  roc.34.b: "搭载高射炮"
  roc.34.c: "搭载速射炮"
  roc.34.a.tt: "这将为§Y装甲车营§!添加10§Y牵引式火炮§!的需求，提升装甲车的数值"
  roc.34.b.tt: "这将为§Y装甲车营§!添加10§Y牵引式防空炮§!的需求，提升装甲车的数值"
  roc.34.c.tt: "这将为§Y装甲车营§!添加10§Y牵引式反坦克炮§!的需求，提升装甲车的数值"
  roc.34.focus_tt: "§L事件前瞻：这将探讨如何升级装甲车\n\n  选项一：为§Y装甲车营§!增加10§Y火炮§!\n\n  选项二：为§Y装甲车营§!增加10§Y防空炮§!\n\n  选项三：为§Y装甲车营§!增加10§Y反坦克炮§!§!"

  roc.35.title: "电影检查风波"
  roc.35.desc: "广州的电影院近日上映了一部名为《乱世儿女》的无声电影。影片讲述一位青年军官在北伐战争中爱上敌军将领的女儿，最终在爱情与革命之间痛苦抉择的故事。导演是留法归来的青年艺术家，摄影优美，情感细腻，场场满座。\n\n然而，这部电影引发了截然相反的评价。\n\n《黄埔之声》发表评论，斥责影片“美化敌人、瓦解革命意志”，要求政府禁映。广州学生联合会则发表公开信，称“革命不需要谈情说爱”。但《民国日报》的文艺副刊却盛赞其“开辟了中国电影的艺术新路”。而普通市民只管买票——越是被批评的电影，她们越想看。\n\n电影审查委员会目前尚未表态。委员会的主席中，CC系、民革、民宪各有委员任职。此事看似不过是一部电影的命运，但如何处理它，将决定广府在文化政策上的灵魂——是启蒙优先，还是纪律优先？"
  roc.35.a: "禁映——革命时期不需要软绵绵的爱情"  ##CC系+2.5  中正社+2.5
  roc.35.a.tt: "§L现在是北伐前夜，不是太平盛世。这部电影用个人情感消解革命意志，不论其艺术价值多高，都应在目前予以禁映。导演需要写一份检讨。§!"
  roc.35.b: "放行——艺术不该为政治服务"  ##民宪会+5
  roc.35.b.tt: "§L一部电影而已。它没有鼓吹投降，也没有丑化革命，它只是讲了一个故事。如果广府连一个爱情故事都容不下，还谈什么民主和自由？让它继续放映，不必大惊小怪。§!"
  roc.35.c: "让它放，但要拍一部革命电影来回应"  ##民革+5
  roc.35.c.tt: "§L与其禁映，不如拍一部更好的革命电影，让观众自己比较。艺术不怕竞争，怕的是没有竞争。政府出资，请最好的导演拍一部以黄埔精神为主题的战争片，正面回应。§!"

  roc.36.title: "留学生的归来"
  roc.36.desc: "大萧条没有影响知识的流动。\n\n一批留学海外的中国学生因欧洲政局不稳和经济动荡，选择提前回国。这批学生约有六十余人，分别来自伦敦政治经济学院、人里高等师范学校、柏林工业大学和莫斯科中山大学。她们的专业从政治经济学到土木工程，从医学到军事科学，几乎涵盖广府急需的每一个领域。\n\n但这批留学生也带来了各自的意识形态烙印。伦敦归来的向往英国式的议会民主，人里归来的满口卢梭和左拉，柏林归来的迷恋纪律和效率，莫斯科归来的则从骨子里认同苏维埃制度。将她们分配到哪些部门、由哪个派系负责接收，从某种意义上说，就是在为广府的未来选种子。\n\n宪政同志会希望接收伦敦和人里的学生，革命委员会的留苏派希望接收莫斯科的学生，CC系则主张按专业而非意识形态统一分配。"
  roc.36.a: "按专业分配——让子弹、图纸和听诊器各归其位"  ##CC系+5
  roc.36.a.tt: "§L学医的去医院，学工程的去兵工厂，学军事的去参谋部，学政治经济的由行政院统一安排。广府需要的是建设，不是意识形态辩论。§!"
  roc.36.b: "由宪政同志会统一接收——先培训，再分配"  ##民宪会+5
  roc.36.b.tt: "§L这批留学生最缺的不是专业，而是对中国现实的理解。在分配之前，先由宪政同志会组织一个月的国情培训，让她们明白中国需要什么。§!"
  roc.36.c: "由革命委员会接收——革命需要的是革命者"  ##民革+5
  roc.36.c.tt: "§L这批留学生中最优秀的那部分，在莫斯科已经证明了自己的革命信念。由革命委员会集中接收莫斯科和部分欧洲左翼留学生，让她们充实党务和军事政治工作。§!"

  roc.37.title: "邮局的截获"
  roc.37.desc: "广州邮政总局的一名稽查员在日常检查中，截获了一批从上海寄往广州多个地址的邮件。邮件的内容出奇地一致：一份名为《新青年之声》的铅印小报。小报的社论虽然未直接点名广府政府，但其论调与中国共产党上海中央局的口径高度一致，呼吁“一切被压迫者联合起来”，并对广府的劳工政策进行了系统性的批评，称其为“局部的改良主义”。\n\n邮局按照规程将这批小报扣留，并将情况上报。但如何处理此事，各方意见不一。\n\n宪政同志会的宋教仁认为，批评政府不一定是叛国，如果广府因为这份小报就定罪，那么她们和帝国政府的文字狱有什么区别？中正社的胡宗南则认为“这些小报就是红军的传单”，要求追查到底。蒋巾帼在看到那份小报后，沉默了很长时间——她认得其中一篇文章的笔风，很像她在莫斯科中山大学的某位同学。"
  roc.37.a: "查封邮件来源，追查广州接收者"  ##CC系+2.5  蓝衣社+2.5
  roc.37.a.tt: "§L这不是言论自由的问题，这是组织渗透的问题。立即查封这批小报的印刷来源，追查广州的接收者和传播链。不能允许任何组织在我们眼皮底下建立地下网络。§!"
  roc.37.b: "公开回应，争取舆论"  ##民宪会+2.5  民革+2.5
  roc.37.b.tt: "§L与其查封，不如回应。这份小报批评了广府的劳工政策，那就公开回应这些批评。由劳工部门发布一份《广府劳工现状白皮书》，用事实回应事实。查封只会让它们变成禁果。§!"
  roc.37.c: "不予理会——让小报自己沉没"
  roc.37.c.tt: "§L一份在地下流通的小报，能掀起多大浪？它之所以有人看，是因为它被禁了。放开它，不去管它，它就会在嘈杂的信息中被淹没。§!"

  roc.38.title: "纪念革命先烈"
  roc.38.desc: ""
  roc.38.a: "开工！"

  roc.39.title: "定都典礼"
  roc.39.desc: "南京的十月，梧桐叶黄。原帝国议会的穹顶之下，新国民会议的第一次全体大会正在举行。\n\n这是广府北伐成功、定鼎南京后的开国典礼，青天白日满地红的旗帜在穹顶下悬挂。\n\n宋庆龄走上讲台。她穿着素色旗袍，没有佩戴任何饰物。全场起立。\n\n她的致辞简短，语气平静如常：“同志们。我们来到了南京。这座城市见证过帝国的新生，也见证过帝国的腐朽。今天我们在这里，不是为了重复任何一个旧时代的错误——包括我们自己的错误。”\n\n“革命尚未成功。因为革命不只是一次军事胜利，它还是土地问题的解决，是工人生活的改善，是每一个孩子都能读书的未来。我们许诺给人民的，不是一个新的主人，而是一个她们能做主的新中国。”\n\n掌声如雷。但掌声中有不同的温度。\n\n蒋巾帼在台下鼓掌。她承认这番话是对的。但她心里在想：如果没有一个纪律严明的党，没有一支绝对忠诚的军队，这些承诺不过是另一场宋教仁式的演讲——漂亮，但什么也改变不了。\n\n定都典礼结束后的当晚，宋庆龄在日记中写道：“南京的天很冷。我讲完话以后，看见巾帼的表情。她在表示支持，但我知道，她支持的不是我的话。她支持的是我站在讲台上这个事实——而她认为，这个讲台应该由她来站。”"
  roc.39.a: "这是一次成功的典礼"
  roc.39.b: "这是一次危险的典礼"

  roc.40.title: "议程之争"
  roc.40.desc: "新国民会议的第一项实质议程，不是宪法，不是军事，而是土地。\n\n这并不令人意外。帝国时代留下的土地兼并已到荒谬的程度，四川的红军之所以能存活十五年，靠的就是“耕者有其田”四个字。广府在革命时期对农村的承诺如果不兑现，革命可能被另一场革命颠覆。\n\n但在“如何兑现”上，宋庆龄和蒋巾帼在会议开幕第三天便公开出现了分歧。\n\n宋庆龄提交的《土地改革纲要》主张：以政府赎买的方式征收地主超过一定限额的土地，分给无地少地的农民，赎买资金由国家债券逐年支付。她在会上解释：“土改不是报复，是重建。如果我们要一个稳定的农村，就不能把一个阶级连根拔起，然后用仇恨取而代之。”\n\n蒋巾帼在会上沉默了两天。第三天，她站了起来。\n\n她手里没有稿子。\n\n“现在有人告诉我，地主阶级也可以用债券赎买。”她的声音不高，但每个字都很清晰，“我想提醒诸位：革命委员会在广东推行减租的时候，地主们同意了吗？湘江的红军在江西没收地主土地的时候，地主们同意了吗？没有。她们请来了保安队，请来了广西总督，请来了我们正在北伐讨伐的那些军阀。”\n\n“如果赎买能解决土地问题，康有为也能当革命领袖。”\n\n会场鸦雀无声。所有人都看向了宋庆龄。\n\n宋庆龄没有急着反驳。她只是问：“那么你的方案呢？”\n\n蒋巾帼将一份薄薄的草案放在桌上——《关于没收地主土地及建立农村苏维埃的若干意见》。文件只有七页，但每一页都是一颗钉子。"
  roc.40.a: "支持宋庆龄"
  roc.40.b: "支持蒋巾帼"

  roc.41.title: "国民劳动法案"
  roc.41.desc: "土改的争论尚未平息，另一个问题接踵而至——工人的权利。\n\n在定都之前，广府为了争取上海和广州的工人支持，曾许诺“八小时工作制”“最低工资保障”与“工会自主权”。现在这些许诺到了兑现的时刻。\n\n宪政同志会的宋教仁出人意料地与宋庆龄联手，提交了一份《国民劳动法案》草案。草案核心有三：法定八小时工作制、设立劳动仲裁局、保障和平罢工权。宋教仁在提案时特意强调：“这部法案不是在搞阶级斗争——它是在法律框架内保护劳资双方的合法权利。”\n\n蒋巾帼读完草案后，在会上当场评价了三个字：“太保守。”\n\n她从公文包里抽出自己的《劳动法补充条款》，只有两页纸。第一页第一行：“一切工厂归国家管理，一切工会归党领导。”\n\n会场上连宋庆龄都抬起了眉毛。\n\n蒋巾帼解释：“如果我们允许工人随便罢工，大萧条还没结束，资本家可以借罢工为由关厂外逃。如果我们允许工会自主，改组派的残余和其她势力就会渗透进去。革命政府必须控制生产和分配——这是列宁说过的最简单的话。”\n\n宋教仁回应：“你的方案让我们离莫斯科又近了一步。但我想提醒你——中国不是俄国。我们有八千年小农社会经验，没有一天苏维埃的经验。”\n\n佩丽卡默默地在笔记本上画了一张表：一边是宋教仁的方案，一边是蒋巾帼的方案。她没有画结论。宋庆龄看见了那张表，没有说话。"
  roc.41.a: "支持宋教仁"
  roc.41.b: "支持蒋巾帼"

  roc.42.title: "蒋宋冲突"
  roc.42.desc: "新国民会议的第四周，火药味已经浓得可以用刀切。\n\n争论的内容不再局限于土改和劳动法案。斗争的焦点变成了一个更根本的问题：党权与国权的关系。\n\n宋庆龄在闭门会议上提出了一份《党务改革纲要》。纲要的核心是一个看似温和的方案：党政分开。她希望革命委员会逐步减少对行政事务的直接干预，让政府成为独立的权力主体。她提了三个具体措施——禁止党员不经行政程序直接向政府机构下指令、解散在机关和企业中自行设立的“革命委员会分支”、由公务员制度取代党务任命制。\n\n“革命委员会是一个革命组织。”她说，“但革命政权不能永远靠革命组织来运转。我们需要一个属于全体国民的政府，不是一个政党的执行委员会。”\n\n蒋巾帼在听完整份纲要后，只说了四个字——\n\n“我不同意。”\n\n她站起身来。这是她在新国民会议上第一次在正面回绝宋庆龄。\n\n“主席同志，你提出要把党从政府中请出去。我请问你——当北方军阀拒绝交出军队的时候，你打算派谁去谈判？是公务员吗？当广西总督府的密使还在活动的时候，你打算让谁来甄别？是审计署吗？”\n\n“党不是国家的负担。党是国家的骨架。把骨架抽掉，这具身体就会变成军阀和资本家分食的腐肉。”\n\n“我不同意。我永远不会同意。”\n\n会议室里的空气像凝固了一样。\n\n宋庆龄慢慢地摘下眼镜，看着蒋巾帼。她的声音很轻，但很清晰。\n\n“巾帼，你说的不是我。你说的是你母亲。”\n\n这是她们之间的第一句重话。"
  roc.42.a: "支持宋教仁"
  roc.42.b: "支持蒋巾帼"

  roc.43.title: "三人密谈"
  roc.43.desc: "深夜。南京黄埔军校旧址的一间小会议室里。这里曾是蒋巾帼母亲的办公室，墙上仍保留着蒋介石的题字——现在被一块白布盖住了。\n\n三个人。蒋巾帼。宋庆龄。何应钦。\n\n宋庆龄是被蒋巾帼单独邀请的。何应钦自己决定来的。\n\n这是蒋宋在新国民会议上的公开冲突之后，第一次私下面对彼此。何应钦坐在窗边，没打算主持，也没打算打断。\n\n蒋巾帼首先打破沉默：“孙夫人。我知道这些天你对我有看法。我理解。”\n\n宋庆龄看着她。“你理解什么？”\n\n“你担心我变成我母亲。”蒋巾帼说，语气里没有愤怒，只有一种奇特的平静，“你每次看我，都在看一个你可能要阻止的人。”\n\n宋庆龄没有否认。\n\n“那你呢？”她反问，“你每次看我，在看什么？”\n\n蒋巾帼沉默了很久。久到何应钦以为她不打算回答了。\n\n“我在看一个比我好的人。”她说，“但我不知道好人能不能管住这个国家。我母亲不是好人。她干了很多坏事。但她让军阀在她的军靴下发抖。我不知道能不能又做好人，又让军阀发抖。”\n\n宋庆龄听完这句话，忽然觉得自己老了很多，也忽然觉得自己理解了某些她二十年没理解的事。\n\n“你母亲晚年，”她慢慢说，“来找过我。她希望得到孙先生的某种……怎么说呢。她在1944年感到自己快要死了，她想要某种合法性。她问我——‘孙夫人，我统一了中国，为什么我还是坏人？’”\n\n“我说——‘因为你忘了在统一之外，你答应过别的事。’”\n\n蒋巾帼低下头。她没有回应这句话。\n\n何应钦打破了第二次沉默。“我不是政委。我不会做思想工作。我只是一个带兵的人。但我想告诉你们——不管你们之间有多少分歧，你们是剩下的好人。外面那些人，吴佩孚是聪明人，孙传芳是会算账的人，袁克定是握刀的人。但只有你们，还在想‘中国应该是什么样’这个问题。不要丢掉这个。”\n\n“要是你们自己闹翻了，我不会选边站。我会辞职，回贵州种地。”\n\n三个人没有再说话。窗外的长江正在涨潮。"
  roc.43.a: "支持宋教仁"
  roc.43.b: "支持蒋巾帼"

  roc.44.title: "春在溪头"
  roc.44.desc: "南京中山陵脚下，新政府的第一次植树活动。\n\n宋庆龄站在中山陵的台阶上，身旁是一群来自南京平民学校的小学生。每人手里都有一株树苗。\n\n她让孩子们自己挖坑，自己培土，自己浇水。她站在一旁看着，手里没有铲子。\n\n蒋巾帼也在现场。她没有带孩子。她带来了二十个军官学校的学员，在陵园的另一侧列队植树。每个人的动作都整齐划一，树坑的深度、间距、朝向，全部统一。\n\n两群人隔着一片草坪彼此相望。\n\n一个跟在宋庆龄身边的小女孩抬起头来，看了看蒋巾帼那边整齐的队列和标准化的树苗，又看了看自己歪歪扭扭的小树坑，忽然拉了拉宋庆龄的衣袖。\n\n“主席婆婆，她们那边的树全都一样高，全都一样直。比我们这边的整齐多了。为什么我们不也那样种呢？”\n\n宋庆龄蹲下来，把她那把没用过的铲子放在小女孩手里。\n\n“因为树不是士兵。”\n\n小女孩没有完全听懂，但她记住了这句话。\n\n蒋巾帼也听见了。她站得很远，不可能听得清——但她看见了宋庆龄蹲下来的动作，看见了小女孩仰起的脸，看见了那些歪歪扭扭的树苗在春风里轻轻摇晃。她没有走过去，但她摘下军帽，在远处微微低了一下头。\n\n她身边的学员没有看到。识之律者不在场。只有她知道她在向什么低头。\n\n这天晚上，宋庆龄在日记里只写了一行字。\n\n“今天种的是树。希望树记得。”"
  roc.44.a: "树记得"
  roc.44.tt: "§L不管怎样，今天种下了一些东西。也许在这个充满争吵的政府里，还有比权力更持久的东西在生长。§!"

  roc.45.title: "南京的第一次内阁会议"
  roc.45.desc: "南京的新政府需要部长。\n\n旧帝国议会的穹顶下，广府各派领导人围坐在一张从总督府搬来的长桌旁。窗外是十月的梧桐落叶，窗内是新政权第一批部长职位的分配名单。\n\n宋庆龄作为公认的国家元首主持了这次会议。她的左手边是宋教仁和佩丽卡，对面是蒋巾帼和戴安澜，何应钦坐在中央，再往后是CC系的陈晖洁和陈千语。中正社的胡宗南坐在离门最近的位置，汤汤站在她身后——她习惯站。识之律者没有出席会议，她从不参加需要坐下的会。\n\n何应钦首先发言。这位三军总指挥在定都之后面临一个尴尬的问题：她的角色是什么？她为此提前拟好了一份简短的致辞。\n\n“诸位，军队已经打下了南京。接下来的问题，是由谁来管理它。三军总指挥部不打算干预政权。我只提醒一点——北方还在袁克定手里。我们的内阁争得不可开交的时候，她就在徐州城头看着。”\n\n宋教仁随即站起来，将一份《临时政府组织纲要》分发到每个人面前。文件只有三页，却包含了新政府全部部长职位的分配方案。方案本身是宋教仁在定都前就已拟好的，每一个职位都搭配了备选人选，权力也规定得明明白白。\n\n“这是我与佩丽卡共同起草的方案。”她说，“法务部长建议由宪政同志会出任，财政部长建议由CC系出任，国防部长当然由何总指挥留任……”她一口气念完了全部名单，然后坐下。\n\n会议室里沉默了五秒。\n\n然后蒋巾帼站了起来，字字清晰：“你的方案很好，只有一个小问题。革命委员会的部长在哪里？”\n\n宋教仁摘下眼镜：“巾帼同志，革命委员会的主席已经是国家元首了。我想——”\n\n“国家元首不是部长。”蒋巾帼打断了她，“党领导政府，还是政府凌驾于党？如果革命委员会不能在政府中拥有实质性的部长职位，那它就不是执政党，而是花瓶。”\n\n会议陷入了僵局。"
  roc.45.a: "支持宋教仁的方案"
  roc.45.b: "支持蒋巾帼的立场"

  roc.46.title: "宪政同志会的善意"
  roc.46.desc: "内阁席位分配的争论仍在发酵，宋教仁却选择了一个出人意料的时机，单独求见宋庆龄。\n\n会面安排在宋庆龄的临时官邸，一栋前清留下的旧宅。宋教仁没有带佩丽卡，也没有带任何随员。她手里没有文件，只有一杯没喝完的茶。\n\n“孙夫人，我直说。”宋教仁的开场白和她的文件不同——没有序言。“宪政同志会内部现在有两种声音。一种认为我们应该在新的议会里成为独立力量，监督革命委员会，在某些问题上甚至反对它。”\n\n“另一种认为——”她停顿了一下，“认为中国现在还没有到可以多党竞争的时候。外部军阀环伺，内部秩序初定。如果我们在这个时候忙着争权，结果就是让帝国坐收渔翁之利。”\n\n宋庆龄看着她：“你倾向于哪一种？”\n\n“我倾向于后者。”宋教仁放下茶杯，“但不是没有条件。宪政同志会可以在新国民会议中支持革命委员会的领导地位，但必须满足三件事：一、宪法必须是一部限制政府权力的宪法，不是党纲；二、司法独立必须写入宪法；三、地方实行一定程度的自治。”\n\n“如果你同意这三条，宪政同志会就是革命委员会在新国民会议中的可靠盟友。”\n\n她站起身准备告辞，又停在门口，没有回头。\n\n“孙夫人，我这么做不是因为我相信蒋介石的女儿。我这么做是因为我相信你。”\n\n“有些票，是投给你的。不是你的党。”"
  roc.46.a: "接受宋教仁的条件"
  roc.46.b: "婉拒"

  roc.47.title: "军队的国家化"
  roc.47.desc: "新政府的第三个星期，一个问题已经无法回避：军队归谁？\n\n打下南京的部队，名义上统一归三军总指挥何应钦麾下统帅，但实际上有四股不同的武装力量：何应钦的嫡系部队、戴安澜的第七十三旅、胡宗南和汤汤的中正社军队、以及各地方投诚的杂牌军。识之律者的蓝衣社没有成建制部队，但她在各部队中都有“政治监察员”。\n\n现在到了将这些武装力量整合为统一国防军的时候。谁来当总司令？军队的政治教育由谁管？中正社是作为一个独立军事组织存在，还是融入新的国防序列？\n\n何应钦在这个问题上态度异常鲜明，她拿出了三页纸的《国防军整编方案》：“军队必须国家化。所有部队编入统一的国防军序列，总司令向国家元首负责。任何政治组织不得在军队中设立分支机构和实施独立的政训体系。”\n\n此话一出，胡宗南脸上的表情没有变化，但她的手在她的座椅扶手上握得很紧。她知道这句话是对中正社宣战。”"
  roc.47.a: "军队国家化，中正社编入正规军"
  roc.47.b: "中正社编入国防军，但保留其历史番号"
  roc.47.c: "现在不宜动军中的积压矛盾"

  roc.48.title: "CC系的站位"
  roc.48.desc: "CC系在定都之后一直保持着某种令人不安的沉默。\n\n陈晖洁和陈千语占据了党务系统和南京临时党部的关键岗位，每天从早上六点工作到晚上十点，不发表政治演说，不参与内阁辩论。她们在做什么？后来佩丽卡在交换行政数据时发现，CC系已经在南京建立了完整的基层党务网络——每个区政府、每个大型工厂、每个学校，都有一名组织委员。\n\n陈晖洁在党务报告里没有渲染这一成就，只是在表格最下方用钢笔加了一行字：“组织是革命的基础。”\n\n蒋巾帼注意到这一情况，她对宋庆龄说：“陈晖洁在做的事，是我一直想让革命委员会做但一直没做成的——基层组织。”\n\n宋教仁则对此有些警惕：“她太安静了。安静的人要么没有野心，要么野心比谁都大。”\n\n本周，陈晖洁正式向宋庆龄提交了一份《党务工作纲要》，请求授权在苏皖两省全面推广南京的基层党务建设模式。她的报告只有四页，但每一页都是行动计划。在最后一页的末尾，写着一句简短而有力的话：“党务系统不属于任何一个派系。它属于革命。”\n\n这究竟是忠诚的表态，还是一种高明的政治立场表达？"
  roc.48.a: "授权CC系全面推广基层党务建设"

  roc.49.title: "第一次党内选举"
  roc.49.desc: "新国民会议开幕之前，革命委员会内部首先举行了自己的选举。按照协议，革命委员会的最高决策机构为中央执行委员会，由七名委员组成。各委员从党内推举产生。\n\n这七个人的名单，将决定革命委员会未来数年的政治方向。\n\n选举前夕，党内的紧张气氛已经达到顶点。宋庆龄的影响力集中在元老派和温和左翼，蒋巾帼的力量根基在留苏军官团和少壮派军官。CC系属于革命委员会内的一个分派，但按党规可以投票。宪政同志会并非革命委员会成员，但作为政治盟友，宋教仁的态度将影响部分中间党员的选择。\n\n蒋巾帼的团队拉了一个票仓，分析显示她已经稳获至少三席；宋庆龄的票仓与她相似，但并非完全重合——在两可之间的中间席位上，几张来回摇摆的票将决定最后谁拿到决定性的第四席。\n\n选举日。南京原帝国议会的小会议厅里，一百八十名代表依次投票。没有公开辩论，没有当面争吵。只有写票时纸与笔之间极轻的沙沙声。\n\n计票结束。\n\n主席台宣布结果，委员名单依次念出。所有名字读完时，宋庆龄和蒋巾帼都沉默了——不是为了自己的落选，而是为了胜出的那个名字出现在与自己不那么近的那一行。\n\n宋庆龄站起来，走到台前。\n\n“这次选举，不是我一个人的胜利。也不是任何人的失败。它是革命委员会在南京的第一次党内民主实践。我希望不是最后一次。”\n\n蒋巾帼在台下鼓掌。她的手没有停。\n\n但她没有站起来。"
  roc.49.a: "革命委员会完全胜利"

