  ROC_inner.2.t: "忙碌的周恩莱"
  ROC_inner.2.d: "如果问国民政府中最具有真知灼见的人是谁，或许大家心中都有不同的答案，但如果问国民政府中最繁忙的人是谁那几乎所有人都会说是政治部主任——周恩莱。\n\n周恩莱作为国民革命运动中的最富盛名的青年才俊，她的组织能力是公认的优秀，就目前的情况来看她既要负责一部分行政、外交事务，还要负责部分军事上的决策，除了这些明面上的工作之外，情报工作上也有她的一份责任。\n\n但是能力再全面的人才精力也是有限的，为了能让周恩来同志能够更好的，更长远的服务于革命服务于人民，党内的部分同志提出了让周恩莱同志专注最重要的部分工作，而将其她工作交给其她人来负责的意见。\n\n尽管支持这个建议的不少人动机有待商榷，但她们说对了一件事，那就是人的精力是有限的，即便是那个人是周恩莱。\n\n经过一段时间的深思熟虑之后，宋主席最终决定……"
  ROC_inner.2.a: "让恩莱专注行政工作以保障党和政府高效运转！"
  ROC_inner.2.b: "让恩莱专注情报工作以挫败反革命分子的阴谋！"

  ROC_inner.4.t: "人民军队与人民"
  ROC_inner.4.d: "我们是人民的军队，要从群众中来来到群众中去。”这是毛润芝将军在数年前初创革命军游击队时做出的讲话。在那时，大部分人都觉得这只是毛将军发动群众动员军队的一种激励话术，很少有人把她当真，但是几年过去了，毛将军身体力行的证明了她并不是空谈。\n\n支部建在连上、士兵委员会、党指挥枪这几样如今革命军将士都耳熟能详的政策制度都是毛将军为了践行人民军队的理念而创立的，我们的部队的战士来自人民、热爱人民、帮助人民，而人民也同样拥护爱戴革命军，在过往的战争中，人民群众自发的为革命军运输寄养，提供情报，可以说没有人民群众的支持，我们根本无法以武器装备乃至兵力均占劣势的部队击溃装备精良的大兵团敌军。\n\n如今，人民军队的概念已经深入革命军将士的骨髓之中，军与民的关系也不再是过去的官兵压迫百姓的关系，而是一种如同鱼和水一样的互帮互助互利共赢的关系。\n\n虽然人民军队的理念博得了大部分革命军将士和人民群众的认可，但是那些有军校留学经历的少壮派将领却认为这中兵民不分的状态是对职业军人乃至军人职业的一种亵渎。"
  ROC_inner.4.a: "我们是工农的子弟，我们是人民的武装！"




  ROC_navy_trade.1.t: "[FROM.GetAdjective]提议委托我们建造潜艇"
  ROC_navy_trade.1.d: "近日，[FROM.GetName]表示，他们需要扩充海军的规模以维护东亚海域的平衡，并由[FROM.GetName]曾留学于我国的海军军官们拟定了一份委托造舰方案——就像当年的北洋水师一样。\n该方案建议，由[FROM.GetName]出资，委托我国建造八艘潜艇。\n\n由于缺乏其他潜在的卖家，[FROM.GetAdjective]的出价十分可观，但说到底这件事情的决定权在我等而不是国府手中。"
  ROC_navy_trade.1.a: "同意该方案"
  ROC_navy_trade.1.b: "拒绝该方案"
  ROC_navy_trade.2.t: "[FROM.GetAdjective]提议委托我们建造驱逐舰"
  ROC_navy_trade.2.d: "近日，[FROM.GetName]表示，他们需要扩充海军的规模以维护东亚海域的平衡，并由[FROM.GetName]曾留学于我国的海军军官们拟定了一份委托造舰方案——就像当年的北洋水师一样。\n该方案建议，由[FROM.GetName]出资，委托我国建造四艘驱逐舰。\n\n由于缺乏其他潜在的卖家，[FROM.GetAdjective]的出价十分可观，但说到底这件事情的决定权在我等而不是国府手中。"
  ROC_navy_trade.3.t: "[FROM.GetAdjective]提议委托我们建造轻巡洋舰"
  ROC_navy_trade.3.d: "近日，[FROM.GetName]表示，他们需要扩充海军的规模以维护东亚海域的平衡，并由[FROM.GetName]曾留学于我国的海军军官们拟定了一份委托造舰方案——就像当年的北洋水师一样。\n该方案建议，由[FROM.GetName]出资，委托我国建造两艘驱逐舰。\n\n由于缺乏其他潜在的卖家，[FROM.GetAdjective]的出价十分可观，但说到底这件事情的决定权在我等而不是国府手中。"
  ROC_navy_trade.4.t: "[FROM.GetName]拒绝了提案"
  ROC_navy_trade.4.d: "经过多轮谈判磋商，[FROM.GetName]最终拒绝了我们的委托。"
  ROC_navy_trade.4.a: "行吧"
  ROC_navy_trade.5.t: "[FROM.GetName]同意建造潜艇"
  ROC_navy_trade.5.d: "经过了几轮谈判磋商，尽管[JAP.GetName]施压了不小的阻力，但我们最后成功说服了[FROM.GetName]。他们表示相关款项一到账就开始建造。"
  ROC_navy_trade.5.a: "太好了，快派人去汇丰银行！"
  ROC_navy_trade.6.t: "[FROM.GetName]同意建造驱逐舰"
  ROC_navy_trade.7.t: "[FROM.GetName]同意建造轻巡洋舰"
  ROC_navy_trade.8.t: "[FROM.GetName]寻求购买重型战舰"
  ROC_navy_trade.8.d: "近日，[FROM.GetName]表示，他们需要扩充海军的规模以维护东亚海域的平衡，并由[FROM.GetName]曾留学于我国的海军军官们拟定了一份委托造舰方案——就像当年的北洋水师一样。\n该方案建议，由[FROM.GetName]出资，委托我国建造重型战舰。\n\n显然他们也没觉得我们会同意这种提议，在我方拒绝了该提议后，他们又转而提议购买我方因经济危机停建的战舰或更老旧的重型战舰。\n战列舰自然是不能出售的，我国也几乎没有留着什么更旧的船，谈判一度陷入了僵持。\n不过在最近的一次讨论中，国府表示经过他们的查证，有一部分老旧的前无畏舰被我们送到了[EAS.GetName]并改称“缅因猫级”，这几艘战舰目前也遭废弃，在当地几乎成为了地标。\n\n前无畏舰这种老古董就不在不能出售的范围之内了，总之，出售与否的决定权依旧在我方。"
  ROC_navy_trade.8.a: "反正是堆废铁，报个高价还能挣点。"
  ROC_navy_trade.8.b: "就算是废铁也是有价值的废铁！"
  ROC_navy_trade.9.t: "[FROM.GetName]同意出售重型战舰"
  ROC_navy_trade.9.d: "经过多次磋商，由于[FROM.GetName]坚决不同意出售战列舰，我方便提议购买其荒废在[EAS.GetName]的前无畏舰，他们同意了。\n但要价昂贵，根据这份协议，我们预计要支出约伍佰亿元（单位为圣杯联邦货币）以购买两艘“缅因猫级”前无畏舰，但购买重型战舰机会难得，我们必须做出抉择。"
  ROC_navy_trade.9.a: "干了！"
  ROC_navy_trade.9.b: "……其实我们也不是很需要啊"
  ROC_navy_trade.10.t: "[FROM.GetName]同意购买"
  ROC_navy_trade.10.d: "[FROM.GetName]同意了购买前无畏舰。"
  ROC_navy_trade.10.a: "合作愉快"
  ROC_navy_trade.11.t: "[FROM.GetName]拒绝购买"
  ROC_navy_trade.11.d: "[FROM.GetName]拒绝了购买前无畏舰。"
  ROC_navy_trade.11.a: "那就不卖！"



