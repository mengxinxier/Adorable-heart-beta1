  roc.93.title: "[GetMonth]谈判"
  roc.93.desc.1: "南京的春天来得早。梧桐新叶刚抽出嫩芽，一支特殊的车队已沿着长江溯流而上，穿过尚未完全平定的川鄂边界，驶入红军控制区。车队规模不大，只有几辆半旧的军用卡车，没有武装护卫，只挂了一面青天白日旗。这是宋庆龄亲自派出的谈判代表团，团长是邓择笙。她带了一封宋庆龄的亲笔信，信里只有一句话——“让我们结束这场革命内部的战争。”\n\n红军方面对这次谈判给予了相当规格的接待。毛润芝亲自到根据地的边界迎接，没有穿军装，只穿了一身洗得发白的灰布棉衣。邓择笙下车时，她伸出手来，握住了邓择笙的手。两人的手都很粗糙——邓择笙的手是握锄头和笔杆子握出来的，毛润芝的手是握枪杆子和钢笔握出来的。邓择笙把宋庆龄的信递过去，她当场拆开，看了很久。然后她把信折好放进口袋，说：“进屋谈。”\n\n谈判在边界一处普通农家院落里进行。没有长桌，没有名牌，没有记者。双方代表围坐在一张旧八仙桌旁，桌上放着粗瓷茶碗和几碟花生。红军方面出席的是毛润芝、黍、陈世涛；南京方面出席的是邓择笙和两位随行秘书。窗外能听到远处传来红军士兵操练的口号声，偶尔夹杂着几声鸡鸣。\n\n邓择笙首先传达了宋庆龄的和谈底线。她的开场白没有外交辞令，只有宋庆龄在南京临行前对她说的三句话。第一句是——谈判的目标是统一，统一的前提是和平，和平的代价是双方都要让步。第二句是——红军必须改编为国防军，这是原则，但改编后的人事安排可以谈。第三句是——农村土地问题，她承认苏维埃政权的土改成果，但全国统一后需要建立统一的法律框架，在这个框架内可以保留部分苏维埃时期的土地政策。\n\n毛润芝听完后沉默了几分钟。她没有立刻回应，而是站起来走到窗前，看着外面正在操练的部队，说了一段话。她说，那些士兵跟了她很多年，从湘江一路走到川北。她们在路上死了很多人，活下来的人只有一个信念——革命不只是换一面旗帜。如果改编意味着把枪交出去，然后让地主回来把地收回去，那她不能答应。如果改编只是换一个番号，她的士兵仍然由她的军官指挥，地仍然在农民手里，那就可以谈。\n\n谈判持续了整整三天。最激烈的争论集中在三个问题上：红军改编后的指挥权归属，重庆苏维埃政权的土地政策是否纳入全国统一法律框架，以及中共在未来政府中的地位。\n\n邓择笙在谈判间隙给南京发了一封简短的电报——“争议有三：指挥权、土地权、参政权。前两项有分歧但可谈。第三项需最高层定夺。”宋庆龄收到电报后，召集内阁核心成员开了整整一个晚上的会。第二天清晨，她的回电到了，只有一行字——“三项皆可谈。前提是和平。”"
  roc.93.desc.2: "谈判地点选在成都，一个在双方控制区之间的中间地带。共产国际代表团先期抵达，共产国际远东局主席早露在抵达当天对随行人员说：“我们不是来替中国革命做决定的，我们是来让中国的革命者不再自相残杀。”秘书九条玛丽亚补充了一句——“前提是她们愿意听。”\n\n红军方面出席的是毛润芝、黍、陈世涛。南京方面出席的是蒋巾帼本人——她没有派代表，而是亲自前来。这是她自定都南京后第一次离开首都，也是她生平第一次面对面与毛润芝坐在同一张谈判桌上。共产国际代表团坐在桌子中央，早露居中主持，九条玛丽亚坐在她右手边。\n\n早露首先致开场白。她没有宣读任何文件，只是说了一段话。她说共产国际关注中国的革命事业已经很多年了，从辛亥革命到北伐战争，从广府国民政府到南京的苏维埃政权，她们看到了中国同志付出的牺牲，也看到了这场革命内部的裂痕。今天她们坐在这里，不是为了评判谁对谁错——是为了让同志不再流血。\n\n蒋巾帼随后发言。她没有像往常在党内会议上那样引用列宁，而是平铺直叙地提出了南京方面的核心方案——“一个中国，一个党，一支军队。”她解释道，红军改编为国防军，接受统一的军事指挥，改编后的部队保留原有编制和指挥官，政治委员制度在过渡期内逐步与中央体系衔接。中共作为革命政党参与人民阵线，分享政权，核心领导成员可担任政府职务。川北苏维埃时期的土地分配成果以法律形式予以追认，纳入全国统一的土地法框架。\n\n毛润芝听完后没有立即回应。她慢慢端起桌上的茶碗喝了一口，然后放下茶碗，开始说话。她没有谈条件，而是先讲了一个故事。她说她刚到川北的时候，有一个农民问她——红军走了以后，地还是不是我的？她当时说，红军不走。现在红军要走——不是离开川北，是改编成国防军。改编以后，那个农民的地，还是不是她的？她需要蒋巾帼给她一个答案，不是苏维埃的答案，不是三民主义的答案，是一个能让那个农民听懂的答案。\n\n蒋巾帼看着毛润芝，沉默了一会儿，然后回答：“地契上写的是那个农民的名字。不会再改回去。这是我给你的答案，也是我给那个农民的答案。”\n\n谈判围绕四个核心议题展开了持续多日的拉锯。红军改编后的指挥权是最敏感的问题——毛润芝坚持团级以上指挥官由红军自行推举，蒋巾帼坚持政治委员必须由中央统一任命，双方在这一点上反复拉锯。土地追认的法律形式也有分歧，黍坚持所有川北农民手中现有的地契必须被承认，不需要重新审查，不附加任何条件，蒋巾帼表示可以承认但希望纳入全国土改的统一框架。中共在未来政权中的地位更是贯穿始终，毛润芝要求入阁并分管农村工作，蒋巾帼同意入阁但对具体分工有所保留。此外还有一个更具象征性的问题——毛泽东思想的定位。毛润芝没有主动提出，但陈世涛在发言中提及红军在川北的实践经验。早露敏锐地捕捉到了这一点。\n\n早露和九条玛丽亚在谈判中扮演了微妙的角色。早露倾向于促成双方平等对话，尊重中国同志自己的选择。九条玛丽亚则更强调统一政权的必要性，多次私下提醒蒋巾帼——不要让步太多，否则她手里的苏维埃就不像苏维埃了。但早露在某次关键僵局中，私下对九条玛丽亚说了一段话。这次谈话的内容未被记录，但此后九条玛丽亚的态度明显软化。"
  roc.93.desc.3: "谈判在成都举行，持续了整整两周。红军方面出席的是毛润芝、黍、陈世涛；南京方面出席的是佩丽卡和两位法务部随员。没有记者，没有摄影机，没有公开报道。佩丽卡在谈判前对宋娇仁说：“如果这次谈判失败了，那是因为我们给的不够，不是因为她们要的太多。”\n\n佩丽卡首先提出了南京方面的核心方案，她用最简洁的方式概括了谈判的总原则——“土地换和平，选票换枪杆子。”红军在四川推行的土地分配方案，凡符合“耕者有其田”原则的，由国民政府以法律形式予以追认，已分得土地的农民继续保有土地使用权，原地主不得索回。作为交换，红军接受改编，纳入国防军序列，原红军指挥官继续担任改编后的军事主官，接受国防部统一指挥。红军改编后，中共作为合法政党参加国会选举，享有与其她政党同等的参政权。\n\n毛润芝听完佩丽卡的陈述后，沉默了一段时间。她在谈判桌上很少说话，但每一次开口都直指核心。她的第一个问题是关于土地追认的具体法律程序——地契上写谁的名字？她的第二个问题是关于改编后军官的任免权——军官犯了错误，谁来决定撤换？她的第三个问题是关于中共参加选举——中共在国会里是少数党，佩丽卡能保证它不是摆设吗？\n\n佩丽卡逐条回答。关于地契，她当场拿出一份事先准备好的《四川土地追认条例》草案，草案里明确规定所有经苏维埃政府分配给农民的土地，由国民政府重新颁发地契，地契上的名字是实际耕种的农户，不是原来的地主。关于军官任免，她提出了一个折中方案——政治委员由国防部统一任命，但指挥官由国防部与军区协商决定。关于参政权，她没有任何修饰，直言宪法只能保证中共有参加选举的权利，宪法不能保证中共一定当选，选票是选民决定的，不是她决定的。\n\n毛润芝听到最后一条时微微笑了一下，说了一句让她意外的话。她说她打了大半辈子仗，从来没有人用这种条款跟她谈判——她说她不能保证她当选。她欣赏这个回答，因为真话比承诺更有价值。\n\n双方在核心问题上基本达成一致后，分歧集中在了改编后的指挥权细节和政治委员制度上。陈世涛坚持川北独立旅的指挥权必须保留在原红军指挥官手中，不接受外部派遣指挥官；毛润芝则表示中共参加国会后必须在土地和劳工政策上拥有实际的影响力，不能只是象征性的少数席位。佩丽卡连续几天向南京发回详细的电报汇报进展，宋娇仁在反复权衡后给出了最终底线：军事改编必须完成，土地政策可以在全国土改中继续讨论，政治参与必须接受。在此基础上，其余条件都可以让步。"
  roc.93.a: "全盘接受中共的条件。"
  roc.93.b: "看来中共的诚意不够。"

  roc.94.title: "统一日"
  roc.94.desc: "红军正式改编为国防军西部军区部队，原红军指挥官继续担任改编后的军事主官；重庆苏维埃时期的土地分配方案被纳入国家土地改革法的修订参考；中共作为合法政党参加国会，并在内阁中获得一个副部长级席位。"
  roc.94.a: "中国人民已经受够了战火。"

  roc.95.title: "谈判破裂"
  roc.95.desc: "谈判在第三天深夜破裂。陈世涛拍案而起，说了一句话——她们在战场上没拿到的，在谈判桌上也别想拿走。毛润芝没有站起来，只是看着对面，语气极为平缓地说，革命不是请客吃饭，她以前对这句话的理解是斗争，现在她觉得这句话还有另一层意思——革命不是来谈判的，革命是来改变这个国家的。如果谈判不能改变这个国家，那就继续斗争。"
  roc.95.a: "这是最后的斗争"

  roc.96.title: "谈判成功"
  roc.96.desc: ""
  roc.96.a: "为了中国的明天！"
  change_tag_to_ROC: "我们将扮演[ROC.Getname]"

  roc.97.title: "国旗"
  roc.97.desc: "我们与共产党的同志达成了和平统一，有的同志提议我们把青天白日旗与五星红旗结合起来创造一面新旗帜。"
  roc.97.a: "我看挺不错。"
  roc.97.b: "还是青天白日吧。"

  roc.98.title: "双十节"
  roc.98.desc: "定都南京后，国民政府面临一个看似简单却意味深长的问题：哪一天是国庆日？\n\n提案在行政院常务会议上由宋娇仁正式提出。她的理由条理清晰、无可辩驳：一九一一年十月十日，武昌起义打响了辛亥革命的第一枪。那一天，湖北新军中的革命党人提前发动起义，一夜之间控制武昌城，三日内光复汉阳、汉口。此后一个月内，长江以南各省纷纷响应，清王朝在南中国的统治如沙塔溃散。没有十月十日，就没有中华民国。宋娇仁在提案末尾写道：“国庆日是一个国家的生日。中华民族的生日，应当定在它诞生的那一天。”\n\n但提案在国会辩论时遇到了一个微妙的阻力——来自黄埔系的议员们提出了另一个日期。她们提议将四月十二日定为国庆日。那是蒋介石在郑州战役中战死的日子。一位黄埔出身的议员在辩论中说：“民国是蒋总司令用命换来的。她的忌日，才是这个国家真正的生日。”此言一出，会场陷入了短暂的沉默。蒋巾帼当时也在会场，她没有发言，只是低下了头。\n\n两种意见相持不下，提案被暂时搁置。最终打破僵局的是宋庆龄。她在一次内部会议上说了一段话，这段话后来被记录在会议纪要的附录里：“国庆日不是用来纪念哪一个人的。国庆日是所有人的日子。十月十日是无数人一起举起了枪，四月十二日是一个人倒在了洪水里。前者是一个民族站起来的时刻，后者是一个战士倒下去的时刻。站起来的那一天，应该被庆祝。倒下去的那个人，应该被纪念。庆祝和纪念，不能混在一起。我们可以建一座陵园来纪念她，可以用她的名字命名一条路、一所军校。但国庆日，必须是十月十日。”\n\n她的意见最终被各方接受。宋娇仁代表行政院提交了最终的《国庆日法案》，国会以压倒性多数通过。法案只有一条，全文如下：“中华民国以每年十月十日为国庆日，全国放假一日，举行庆祝典礼。”\n\n蒋巾帼投了赞成票。她在投票后对宋娇仁只说了一句话：“你赢了。”宋娇仁的回答一如既往地严谨——“不是我个人赢了。是历史事实赢了。”\n\n法案签署那天，宋庆龄在总统府的办公室里，翻开孙中山的一本日记。日记的最后一篇写于一九一一年十月九日——武昌起义的前一天。孙中山在那篇日记里写了一段话，字迹潦草，大概是在深夜匆忙写下的。她看了很久，然后把日记合上，站起身，走到窗前。窗外是南京十月的天空，蓝得像水洗过。她打开窗，一阵凉风涌进来，吹动了桌上的法案文本。她拿起笔，在文本封面的空白处写了一句话——“这一天，我们等了很久了。”\n\n此后每年的十月十日，全国各地都会举行庆祝活动。南京的阅兵式上，军队列队走过中山陵前的广场；上海的码头边，工人举着彩旗游行；广州的黄埔军校旧址里，老学员们聚在一起唱那首从未正式发表过的旧歌；村小的黑板上写着同一行字——“十月十日，国庆日。”\n\n有一年，宋庆龄在庆祝典礼上被人问到为什么双十节是国庆日。她回答得很轻，但周围的人都听得很清楚。她说：“因为那一天，我们决定不再跪着了。”"
  roc.98.a: "中华民国万岁！"

  roc.99.title: "村小的黑板"
  roc.99.desc: "苏北的春天来得比广东晚。三月了，田埂上还结着薄冰。\n\n阿娣每天天不亮就起来，先帮父亲把牛牵到河边饮了，再回来烧火煮粥。粥是稀的，米粒数得过来，但父亲说今年比去年好——去年这个时候，家里已经没有米了。去年这个时候，土改工作队还没进村。\n\n土改工作队是去年秋天来的。领头的女人穿着灰布棉袄，剪短头发，说话带着南方口音。她在村里住了整整一个月，挨家挨户丈量土地，把地主陈老爷家的账本摊在打谷场上，一条一条念给全村人听。阿娣记得父亲那天晚上回来，在灶台前坐了很久，手里捏着一张纸。她不识字，但她知道那是地契。父亲说，这块地从他爷爷的爷爷那一辈就是陈家租给他们种的。现在，这块地是他自己的了。父亲说这话的时候声音很轻，轻到像是在梦里。他把地契放在桌上，用手掌慢慢抚平边角，然后抬起头看着她。父亲的眼睛里有光。她从未见过父亲的眼睛里有光。\n\n阿娣今年十一岁。她没有上过学。村里从来没有过学校。\n\n所以当土改工作队离开后的第三天，村长敲着锣在村里喊“政府要在村里办学堂了，每家每户适龄儿童都要报名”的时候，阿娣正蹲在灶台前烧火。她听到“学堂”两个字，手里的柴火掉在地上。她站起来往外跑，跑得太急，在门槛上绊了一跤。膝盖磕破了皮，她没有停。\n\n村小设在旧祠堂里。祠堂的神主牌已经被搬走，供桌换成了黑板，香炉换成了粉笔盒。阿娣第一天去上学，她站在祠堂门口不敢进去。里面的孩子都坐着，每人面前有一块小小的木板，板上铺着一张纸。她从来没有在纸上写过字，她从来没有摸过纸。\n\n有一个年轻的女老师走出来，蹲在她面前。老师看起来比自己大不了太多，穿着干净的蓝布衫，辫子扎得很整齐。老师问她叫什么名字。她说阿娣。老师问姓什么。她说姓周。老师从口袋里掏出一截粉笔头塞在她手心里，然后指着黑板上的字一个一个念——“让饿着的孩子吃上饭，让每一个孩子会写自己的名字。”阿娣听懂了前半句，没听懂后半句。但她记住了那几个字的样子。\n\n老师姓林，是从南京来的师范生。阿娣后来知道，政府办了一所师范学校，专门培养下乡教书的老师。林老师就是第一届毕业生。她本来可以留在南京教书，但她主动申请来苏北。她来的时候带了一口皮箱，里面一半是换洗衣服，一半是课本。\n\n林老师给每一个学生发了一本课本。课本很薄，封面印着一行字：“中华民国国民小学课本”。阿娣翻开第一页，上面画着一个农民弯着腰在插秧，旁边写着一行字——“我是中国人”。她认了很久，才认出来那个农民画的是她父亲。不是她父亲的脸，是她父亲的背——弯着腰在田里插秧的背。她把课本捧在手里，捧了很久。"
  roc.99.a: "纸是新的，墨是新的，她是新的。"

  roc.100.title: "村小的黑板（二）"
  roc.100.desc: "开学后第三天，村里出了一件事。\n\n村口王大娘坚决不肯让孙女上学。她坐在祠堂门口，拄着拐杖，说女娃子上学没用，是浪费钱，还不如在家纺线。村长去劝，她不听。林老师去劝，她把拐杖敲得震天响。\n\n下午，土改工作队的那个女干部又来了。她没有劝王大娘，只是坐在王大娘家的门槛上，从怀里掏出自己的课本——一本旧得卷了边的《识字课本》。她说，她小时候也不识字，她父亲也说女娃子读书没用。后来她父亲死了，死在逃荒的路上。她跪在父亲坟前发誓，要让天下所有女娃子都能读书。她说这些话的时候声音很平，像是在说别人的故事。王大娘听完，沉默了很久，然后把拐杖放在一边。\n\n第二天，王大娘的孙女来上学了。\n\n阿娣每天放学回家，第一件事不是写作业——家里没有灯油让她写作业。她的第一件事是跑到父亲的地里，把当天在学校学的字用手指头写在田埂上。父亲问她写的是什么。她说“周”，是他们的姓。“阿娣”的“娣”她还没学会，笔画太多了。父亲蹲下来，用手指头在田埂上描她写的字。他的手很粗，指节像老树根，但他描得很认真。描完以后他站直身子，看着田埂上的那个字，忽然说了一句话。他说他活了几十年，这是他的名字第一次被写在地上。以前他的名字只在陈老爷的账本上——后面永远跟着一个欠字。阿娣看着她父亲，觉得父亲老了，又觉得父亲年轻了。田埂上的字被风吹着，被太阳晒着，笔画渐渐模糊了。但地还在，地契上的名字不会模糊了。\n\n冬天来了。村里下了一场大雪。祠堂的门窗太旧，挡不住风，林老师把教室搬到了牛棚里。牛棚里生着火，学生们围坐在火堆边，牛在旁边反刍。林老师把黑板挂在牛槽上，写了一行字——“冬天来了，春天还会远吗。”阿娣不认识那些字，但她记住了林老师念这句话的声音。那个声音比火更暖。"
  roc.100.a: "春天真的来了。苏北的春天总是来得很慢，但总归会来。"

  roc.101.title: "周老实的牛"
  roc.101.desc: "周老实不叫老实。他爹给他起名叫周有福，但村里人都叫他周老实——因为他实在。实在到什么程度呢？土改工作队来村里丈量土地，别人都往前挤，生怕少了自己一分地，他蹲在田埂上看。工作队的人问他：“你不急？”他说：“地是政府分的，政府不会少我的。”后来地契发下来，他果然没少一分。\n\n他分到了五亩水田。五亩地，养活一家四口，刚好够。但周老实想要的不只是够。他想养一头牛。\n\n村里人都笑他。牛要多少钱？一头犊子就要他半年的收成。他连买种子的钱都是政府贷的，还想买牛？他老婆也劝他别瞎想，说祖祖辈辈都是靠人拉犁，没牛不一样种地？他不说话，蹲在门槛上，看着门口那片刚翻了土的水田。田里没有牛，他一个人拉的犁。犁完那五亩地，他的肩膀被麻绳勒出一道深深的红印，晚上疼得睡不着，他也不吭声。\n\n春天，乡里的合作社贴出了一张布告。布告上写：政府为鼓励农民发展生产，特设专项农业贷款，凡加入合作社的农户均可申请，用于购置耕牛、农具、良种，年息极低，分三年还清。布告贴在乡公所的墙上，风吹得哗哗响。识字的人念给不识字的人听，听完以后大家都摇头——借政府的钱，还不上怎么办？拿什么还？将来利滚利，把地都赔进去，那不是又回到陈老爷放印子钱的日子了？没有人敢借。\n\n周老实站在人群后面，把那张布告仔仔细细听了一遍。然后他走进去，在申请表上按了个手印。\n\n他回到家，老婆跟他大吵了一架。她哭了一整夜，第二天早晨眼睛还是肿的。周老实给她盛了一碗粥，说：“地是我们的了。有地就能还钱。我不会把地弄丢的。”他说话的声音很平，和他犁地时一样平。他没有更多的话了。他从来不会讲道理。\n\n牛是春分那天牵回来的。一头黄牛，两岁口，角还没长全。周老实从乡里的牲畜市场把它牵回来，一路上走得比牛还慢。他怕把牛累着了。村里人围在他家门口看热闹，有人说这牛值不值这个价，有人说这贷款利息比黄世仁还狠，有人说看吧，秋后还不上钱，政府来收他的地。周老实不说话。他把牛牵进牛棚，给它喂了第一把草，然后把牛棚的栅栏仔细绑好。月光从牛棚的破屋顶漏下来，照在牛的背上。他蹲在牛棚外面，听着里面反刍的声音，听了一整夜。他忽然觉得肩膀不那么疼了。"
  roc.101.a: "信政府一回"

  roc.102.title: "秋收"
  roc.102.desc: "秋收到了。\n\n周老实的五亩水田，今年收了整整多出许多的稻谷。不是天好——今年雨水一般。是牛好。有了牛，犁地深了，秧苗扎根扎得结实，抽穗的时候稻穗比往年长了一截。\n\n他把稻谷铺在打谷场上晒，金灿灿的一片。邻居路过时脚步慢了，眼睛往场上瞟。有人开始站在田埂上算账——一头牛犊多少钱，增产的稻谷能卖多少钱，贷款利息是多少，几年能还清。算完以后不说话了。周老实还是不说话。他坐在打谷场边，看着那头黄牛，黄牛也看着他。牛的眼睛很大，很亮，里面映着金黄色的稻谷。\n\n还贷那天，他去了乡里的合作社。他把钱用一块旧手帕包着，一层一层打开，整整齐齐码在柜台上。合作社的工作人员数了钱，给他开了收据，然后指着旁边的表格问他：“要不要再贷一笔？你现在有牛了，可以再贷一笔买化肥，明年的产量还能更高。”他想了想，在申请表上又按了个手印。\n\n他回到家，把收据递给老婆。她不识字，但他一个字一个字念给她听。念完以后她把收据收好，放进枕头下面的那个铁盒子里。铁盒子里还放着地契。她抬起头看着他，没说话。她转身走进灶房，多打了一个鸡蛋。"
  roc.102.a: "能过个好日子了"

  roc.103.title: "三年后"
  roc.103.desc: "周老实有了两头牛。\n\n他的五亩水田已经变成了八亩——多出来的三亩是村里另外一户人家主动转给他的。那户人家的男人去南京打工了，女人种不了那么多地。周老实接手过来，种上了改良稻。改良稻的种子是合作社推荐的新品种，秆粗穗长，一亩地比原来多打不少粮。\n\n他的贷款早就还清了。他成了村里第一个彻底还清贷款的人。在每月一次的合作社社员大会上，社长让他站起来给大伙讲几句。他站在那儿憋了很久，最后只憋出来一句：“牛好。合作社好。”满屋子的人都笑了。他也跟着笑。\n\n后来他把这些话换了一种方式，对儿子说了一遍。那是他儿子问他当年为什么敢借钱时的事了。他想了很久，说：“以前种陈老爷的地，收十成要交六成。现在地是自己的，收十成交两成。交了两成，剩下的都是自己的。政府不会坑我。因为政府把地给了我。一个把地给了我的人，不会把地拿回去。”他儿子听完后沉默了一会儿，说：“爹，你说得挺有道理。”周老实说：“不是道理。是实在。”\n\n他家的牛棚翻新过了。旧牛棚被拆掉，在原地盖了一间新的，顶上铺了瓦，墙是砖砌的。原来那头黄牛已经不在了——不是没了，是老了。它在牛棚里安安静静地反刍，旁边站着一头小牛犊，角还没长全。月光从新牛棚的瓦缝里漏下来，照在两头牛的背上。周老实蹲在牛棚外面，听着里面反刍的声音。他蹲了很久。他忽然想起来，很多年前，他一个人拉犁的时候，肩膀上的那根麻绳勒出的红印。那个印子已经不在了。他摸了摸肩膀，什么也没摸到。牛棚里的声音还在。夜风轻软。周老实在他的新牛棚外面，安稳地坐到了天明。"
  roc.103.a: "民国比帝国好啊"

  roc.104.title: "农机站的年轻人"
  roc.104.desc: "陈志远是南京农业专科学校的第一届毕业生。他学的不是种地——他学的是修机器。三年里他把学校里那几台旧拖拉机拆了装、装了拆，闭着眼睛都能摸出每一个零件的位置。毕业那天校长把他们召集到操场上，说政府号召青年知识分子下乡支援农业建设，农村需要懂技术的人，你们去不去？台下一片安静。然后陈志远举了手。\n\n他被分配到苏北一个县农机站。站里只有三台拖拉机，两台是坏的，一台勉强能动，但排气管冒黑烟，犁地的时候响声像打雷。站长是个五十多岁的老农技员，看见陈志远第一眼就问了他一句话：“你这娃娃，会开拖拉机？”陈志远说：“会修。”站长说：“好。先修。”他在农机站住了下来，住的是一间砖瓦房，窗户是破的，他用旧报纸糊上。第一个月他什么也没干成——农民不相信拖拉机。他们站在田埂上看热闹，说这东西又贵又费油，犁出来的地还不如牛犁得深。有人当面叫他“城里娃娃”，说他连韭菜和麦苗都分不清，还来教农民种地。\n\n陈志远不说话。他把那两台坏拖拉机拖进院子里，一个一个零件拆下来清洗、校准、重新组装。他手上磨出了血泡，又磨成了老茧。他学了一个多月的苏北话，请站长在旁边一句一句教，然后蹲在田埂上和农民聊天。一开始只聊天气，后来聊种子，再后来聊土壤酸碱度。农民发现这个城里娃娃确实懂一些他们不懂的东西。\n\n转机发生在春耕。那年春旱，土地硬得像石板，牛拉着犁走不了几步就喘粗气。陈志远把修好的拖拉机开到田边，挂上犁铧，轰隆隆地开进地里。犁铧过处，板结的土块被翻起来，又深又匀。田埂上站满了人。没有人再叫他城里娃娃。\n\n那年秋天，农机站多了五台拖拉机。陈志远带了三个徒弟，都是本地青年，其中一个正是周老实的儿子。陈志远教他修柴油发动机时发现，这个年轻人比他父亲还实在——学东西不快，但一遍一遍地问，直到弄懂为止。有一次拆装喷油嘴时怎么都对不上螺纹，陈志远对他说：“你父亲当年一个人拉犁的时候，大概也是这样——一遍不行再来一遍，直到把地犁完。”后来周老实的儿子也成了农机站的师傅。他自己带徒弟的时候，把陈志远那句话原封不动地传了下去："
  roc.104.a: "“机器比牛好，但人不能比机器差。”"

  roc.105.title: "村小的新老师"
  roc.105.desc: "林老师的信是春天到的。\n\n阿娣已经去了县里读中学，村小缺了一个老师。新来的老师姓苏，比林老师更年轻，刚从师范毕业，分配到苏北的时候连行李都没带全——她把冬天的棉衣落在火车上了。村长去接她，看见她只拎了一个旧皮箱，问她就这点东西，她说还有一箱书在路上。\n\n苏老师来了以后做的第一件事，不是上课，是家访。她挨家挨户走访了村里每一户有学龄儿童的家庭，把本子记得密密麻麻，谁家孩子适龄但没报名，因为什么——有的是家里缺劳力，有的是觉得女娃读书没用，有的是单纯住得太远。她把名单整理好交给村长，说能解决的问题她来解决，解决不了的问题她去找乡里。村长看着她，想起很多年前林老师刚到村里的样子。\n\n她给学校带来了三样东西。第一是政府新配的广播器材——一台手摇发电机和一个小喇叭，每天早晨她对着喇叭给全村念一段报纸，念完以后教一个字。先从村里人的姓氏教起，今天是“周”，明天是“王”，后天是“苏”。第二是篮球——她用自己第一个月工资托人从县城买的。她不会打球，但她在师范学过，体育课不能只跑步。第三是一本地图册，她把地图贴在祠堂教室的墙上，指着中国地图上靠东边画了一条线的地方告诉学生：“这是苏北，我们在这里。”然后她指着另一块地方说那是南京，老师就是从那里来的。学生们都往她指的地方看。他们从来不知道南京在哪里，不知道地图是什么，不知道世界有这么大。\n\n秋收过后，县里配发了一台新式播种机到村里。机器送到那天苏老师领着全校学生去田边看，有个学生举手问：“老师，这是什么东西？”她说这是播种机，以后用它种地可以少流很多汗，然后补了一句：“林老师在的时候没有播种机，你们现在有了。她知道了会高兴的。”有个学生举手问：“林老师什么时候回来？”苏老师没有回答。她看着播种机在田里开过去，留下一垄垄整齐的种子沟，然后回过头对那个学生说：“她不回来，但她的学生在这里。你们就是她回来的理由。”"
  roc.105.a: "老师从南京来"

  roc.106.title: "广播"
  roc.106.desc: "去年秋天县里给村里架了广播线。那根线从乡里一路牵过来，牵过大片稻田和一条小河，牵到祠堂门口那根新竖的木杆子上。苏老师每天早上六点准时开广播，先放一段音乐，然后念报纸。村里人习惯了每天早晨广播响起来再起床。有个老农说，以前公鸡打鸣是时间，现在广播响是时间。\n\n今年春天广播的内容变了。除了念报纸，还增加了一档农业技术讲座，由县农机站的陈志远主讲。每周二、周四傍晚七点，陈志远坐在农机站的办公室里，对着话筒讲怎么保养柴油发动机、怎么选择改良稻种、怎么判断土壤酸碱度。他的苏北话已经说得很好了，口音不重，农民听得懂。他在广播里说：“上期讲了柴油滤清器要怎么清洗。有听众反映说拆下来洗了以后还是打不着火——那是因为油路里有空气，要排气。”\n\n周老实的老婆也听广播。她不识字，但她会听。她听陈志远讲怎么用化肥，怎么防稻瘟病，然后把听懂的部分讲给周老实听。周老实听完点点头，第二天就去合作社买化肥。邻居问他你怎么知道买这种化肥，他说广播里说的。邻居又问广播里是谁说的，他说农机站陈师傅说的。邻居说那个城里娃娃的话你也信，他说他不是城里娃娃了——他比我们还会种地。\n\n陈志远在广播里讲的第一期农业技术讲座，题目是《柴油滤清器的保养》。讲稿是他自己写的，改了无数遍，纸上满是修改的痕迹。他把深奥的技术术语逐条删去，换成了村里人能听懂的话。他的第一句是：“听众朋友们好，我是县农机站的陈志远。今天讲柴油滤清器。”他的最后一句是：“下期讲选种。有问题的，可以托人到农机站带话。”\n\n苏老师收到过一封林老师的信。信是从更北边的一个村子寄来的，那里刚刚通邮路。信里说她一切都好，新学校比当年的祠堂好一些，有玻璃窗。她问起了阿娣，问起了王大娘的孙女，问起了那个牛棚教室还在不在。她还问起新来的老师适应了没有，说那里的孩子怕生，要耐心。\n\n苏老师把信放在枕头下面，没有急着回。她想等放暑假的时候，亲自去一趟那个更北的村子。她给林老师带了三样东西：一包今年新摘的茶叶，一本学生们写的作文，还有一张照片——照片上孩子们站在祠堂门口，背后是那块黑板。黑板上的字是阿娣写的。阿娣已经是县中学的学生了，那天特地回母校看看。她站在黑板前写下了当年林老师教她的第一行字。字迹比当年工整了许多，但内容一字未改。"
  roc.106.a: "我们去听广播吧"

  roc.107.title: "赵师傅的闹钟"
  roc.107.desc: "赵师傅在国营第三纺织厂干了二十年。他的工龄比厂里最年轻的学徒工年龄还大。他有一个闹钟，是建厂那年厂里发的——搪瓷壳，铁铃铛，每天早晨响起来像敲锣。他老伴说这闹钟吵得她脑仁疼，他每次都说换一个，每年都没换。不是舍不得钱，是习惯了。那个闹钟响起来的声音，和他进厂第一天听到的上班铃一模一样。\n\n他在织布车间。车间里一百多台织布机，排成四列，日夜不停地咔嗒咔嗒响。他负责其中的二十台，每天八小时绕着机器走，检查布面有没有断头，纬纱有没有用完。这活儿不难，但费脚。他算过，一班下来大概要走十几里路，等于从厂里走到他家再走回来。他的工鞋磨破了很多双，每一双他都留着，洗干净放在车间更衣室的柜子里。有人问他留着破鞋干什么。他说，等退休了拿出来看看，看看自己这辈子走了多少路。\n\n厂里去年装了新空调。不是那种家用的空调，是工业制冷系统，能把整个车间的温度降下来好几度。以前夏天车间里像个蒸笼，女工们脸上的汗能把口罩浸透。现在温度恒定在二十几度，不冷不热。赵师傅第一次站在出风口下面，仰着头吹了好一会儿。他想起自己刚进厂时师傅跟他说过的一句话：“纺织厂的工人夏天不能吹风扇——风扇会把纱线吹乱。所以只能热着。”师傅说这话的时候，额头上全是汗。师傅的手永远是湿的，捏过的纱线上都带着汗印。师傅退休那年夏天特别热，车间里热得让人喘不上气，师傅坐在车间外面的台阶上，拿草帽扇着风，说了一句话：“我这一辈子，热过来的。”赵师傅现在站在空调出风口下面，忽然很想让师傅来看看。师傅不在了。空调还在。"
  roc.107.a: "一辈子一条路"

  roc.108.title: "小赵的车间"
  roc.108.desc: "赵师傅的儿子也在纺织厂工作。不在他爹的车间——他在开发区一家私营纺织厂，专做出口订单。他爹每次跟邻居说起儿子，都说“我儿子在私营厂”，语气里带着一点说不清的东西。不是骄傲，也不是不骄傲，是一种还没有完全习惯的感觉。他年轻时，最好的工作是在国营厂，私营厂是“个体户”，是“投机倒把”。现在他儿子在私营厂，工资比他高。他不知道该怎么评价这件事，所以他说“我儿子在私营厂”的时候，总是停顿一下。那个停顿里，藏着二十年的旧观念。\n\n小赵带他爹去看那家厂。车间不大，只有几十台织机，但全是新的。没有咔嗒咔嗒的声音，是那种低沉的嗡嗡声。织机是新式自动织机，一台能顶他车间好几台。操作台的仪表盘上密密麻麻排列着压力表、转速表和示功图，信号灯红绿交替闪烁。工人盯着仪表读数，看到异常才走过去处理。儿子教他认仪表盘上的数据——纬纱余量指针、机台转速刻度、故障报警信号灯。他看得吃力，那些表盘太小太密，他把脸凑得很近，鼻尖几乎贴着玻璃罩。但他认得织机的声音。他站在车间里听了一会儿，说：“这机器，比我们厂的好。”儿子说：“价钱也好。”他说：“值。”\n\n儿子告诉他，这家厂是拿到政府低息贷款才买得起这批新设备的。政府有个“小微企业技术改造专项贷款”，专门支持私营企业更新设备，利息比商业银行低不少。老板去申请的时候，银行的人说他的抵押物不够，工商联的人陪着去，帮他重新核算了设备采购后的预期产值和利税增长，说这个可以纳入信用评估。最后贷款批下来了。老板在车间门口贴了一副对联：“机器换新感谢政府，质量过硬答谢客户。”横批是“老实干活”。儿子说对联是他写的，横批是老板改的。老板原来的横批是“生意兴隆”，改成“老实干活”以后，老板说这样看着踏实。"
  roc.108.a: "新机器，新日子"

  roc.109.title: "赵师傅的体检"
  roc.109.desc: "赵师傅今年参加了厂里组织的免费体检。这不是厂里第一次组织体检——以前也有，但这次不一样。这次体检不在厂医务室，是在市人民医院。不是只量血压、听心跳，是全套的：抽血、拍片、心电图、B超。体检结果出来，他有点脂肪肝，医生说是长期饮食偏咸、运动不够。厂医务室的护士拿着体检报告来找他，给他讲怎么调整饮食——少放盐，多吃蔬菜，每天走路至少半小时。他听着，点头，然后问了一句：“这算工伤吗？”护士愣了一下，说：“不算。但如果您不调理，以后可能要算。”\n\n赵师傅把护士的话听了进去。他现在每天晚饭后拉着老伴出门散步，沿着厂区外面的河堤走一圈，不多不少，半小时。河堤上以前没有路灯，去年政府出了钱，沿着堤岸装了一排太阳能路灯。灯是暖黄色的，照在河面上，波光粼粼。他走在灯下，忽然想起师傅。师傅退休后没活多久，死于高血压并发症。师傅一辈子不知道体检是什么，他的血压高了几十年，从来不量。第一次量血压，是退休那天厂里给他办的欢送会，医务室的护士顺便给他量了一下。护士说高压已经很高了，让他赶紧去医院。他笑了笑，说没事，不疼不痒。第二天他就回老家了。赵师傅现在每次散步走到河堤的尽头，都在那棵老柳树下站一会儿。他师傅没有坟——骨灰撒在老家山上。他把那棵柳树当成师傅。站一会儿，然后往回走。"
  roc.109.a: "多活几年"

  roc.110.title: "小赵的加班"
  roc.110.desc: "小赵晚上不加班。他的老板在车间门口贴了一张通知，白纸黑字写着：“即日起实行每日工作八小时制度。特殊情况需要加班的，必须员工本人自愿申请，且每月加班总时长不得超过国家规定标准。未经申请擅自加班者，不计入考勤。”落款是老板的亲笔签名。小赵说，这张通知是老板参加完工商联组织的劳动法培训后回来写的。那个培训是政府免费办的，专门针对私营企业主，讲劳动法、讲用工风险、讲员工福利对企业长期效益的影响。老板听完回来，在办公室里关着门想了半天，然后把人事经理叫进去，说了一句话：“以前我觉得加班是员工自愿的，现在我懂了，不加班才应该是自愿的。”\n\n小赵现在每天傍晚骑电动车回家。天色还亮，他能赶上和老婆孩子一起吃晚饭。他父亲在国营厂工作了二十年，从来没有在傍晚回过家——赵师傅在很长一段时间里，每天到家天都黑透了。他记得小时候吃饭，他爹永远不在饭桌上。他妈说他爹加班。他后来知道他爹不是加班——是车间的任务太重，只靠八小时不可能完成。那时候国营厂也在追求产值，产值指标一年比一年高，车间主任只能把人加班加死。他爹从来不抱怨。那个年代的人不抱怨加班，他们抱怨加班费没发够。现在他爹退休了，每天傍晚和老伴去河堤散步。他有时骑车经过河堤，看见他爹的背影在路灯下慢慢移动。他没有停下来打招呼，只是放慢速度，远远地跟了一小段。他想起小时候他爹永远不在饭桌上。现在他爹每天傍晚散步。他觉得这件事，比涨工资更重要。"
  roc.110.a: "傍晚回家"

  roc.111.title: "工厂的食堂"
  roc.111.desc: "赵师傅厂里的食堂今年翻新了。原来的食堂是建厂时盖的，一溜平房，四面漏风，冬天吃饭要穿着棉袄。翻新后的食堂有两层，一楼是普通餐线，二楼是小炒窗口和回民窗口。墙上贴着营养膳食指南，每个窗口上面有个电子屏幕，显示今天的菜谱和热量。赵师傅不关心热量。他只关心今天的红烧肉肥不肥。食堂的掌勺师傅老李，跟他同一年进厂，从学徒做到退休返聘，他烧的红烧肉是厂里一绝——肥而不腻，瘦而不柴，糖色炒得恰到好处，每一块都挂得住汁。以前只有在过年加餐的时候才能吃到。现在食堂每周都有。老李说，不是他想每周做——是厂里换了新的食材采购渠道。以前只能从指定的供应商进货，现在厂里和附近的农业合作社直接对接，猪肉是合作社养的土猪，大白菜是合作社种的无公害蔬菜。老李说：“政府搞的那个农超对接，把我们厂也接上了。”赵师傅说：“农超对接，又不是农厂对接。”老李说：“都一样。反正便宜。”赵师傅不再问了。他端着盘子坐下，夹了一块红烧肉。肥的。"
  roc.111.a: "每周都有红烧肉"

  roc.112.title: "纺织女工的孩子"
  roc.112.desc: "赵师傅的车间里有个女工，姓周，大家都叫她周姐。她在纺织厂干了十几年，手上能同时捻三根纱线，速度比机器还快。她的手指永远是干燥的，指纹被纱线磨得很浅。她有一个孩子，今年四岁，放在厂里的托儿所。\n\n厂里的托儿所也是今年新开的。以前厂里没有托儿所，女工生了孩子只能自己想办法——要么送回老家让老人带，要么辞职回家带孩子。周姐以前就是辞职回家的那个。她在孩子出生后办了离职手续，在车间最后一天，赵师傅帮她装好个人物品送她到厂门口。她回头看了好几眼，说等孩子大一点再回来。赵师傅说，你的工位我给你留着。其实留不住，车间主任后来把那个工位安排给了一个新工人。但赵师傅一直记得那天周姐的表情——她回头的时候，眼睛里有东西在闪。\n\n后来厂里新政策下来了。政策说，女职工生育后享有带薪产假，产假结束后厂办托儿所负责照料职工子女，哺乳期女职工可以提前一小时下班。周姐在新政策实施后重新入职。她把孩子送进托儿所那天，特地去找赵师傅，说：“赵师傅，我回来了。”赵师傅正在修织布机，满手油污，抬起头看了她一眼，点点头，说：“回来好。”然后低下头继续修机器。他修得很认真，把所有松了的螺丝都拧紧了。\n\n托儿所有一扇窗户正对着厂区。每天上午十点，保育员会抱着孩子们在窗口站一会儿，让他们看看外面。周姐的车间在厂区的另一头，看不到这扇窗户。但她知道每天十点，孩子会在窗口。所以她每天九点五十分左右会借故去一趟仓库，路过托儿所楼下。她不上去，只是站在楼下听一会儿。楼上有时传来歌声，有时是哭闹声，更多的时候是孩子们一起念儿歌的声音。她听到自己孩子的声音就安心了。那个声音像纱线，细细的，绕在心口上。"
  roc.112.a: "托儿所的窗口"

  roc.113.title: "小赵的工资"
  roc.113.desc: "小赵这个月工资条上多了一笔钱。不是加班费，是技能津贴。\n\n他去年参加了厂里组织的职业技能等级认定。考试分理论和实操两门，理论考纺织材料学、机械原理、质量控制，实操考故障排除、工艺调试、设备维护。他理论考得一般，实操几乎满分。评定结果下来，他拿到了中级技工证书。按照政府的新政策，持有中级及以上职业技能等级证书的技术工人，企业应当给予相应的技能津贴，津贴标准由企业自定，但不得低于最低工资标准的一定比例。\n\n老板在发工资那天把他叫进办公室，说：“你的技能津贴我给到了最高档。不是因为政府要求，是因为你的实操成绩我看到了。去年那批出口订单差点因为设备故障延期，是你连续干了两天把机器修好的。我没有公开表扬你，但我记着。”小赵拿着工资条走出办公室，在车间门口站了一会儿，然后掏出手机给他爹打了个电话。他爹正在河堤上散步，电话里传来风吹柳树的声音。他说：“爹，我这个月涨工资了。”他爹说：“涨多少？”他说了数字。他爹沉默了一会儿，说：“你的工资已经超过我当年的最高工资了。”小赵不知道该怎么接这句话。他爹又说：“超过好。超过说明日子在往前过。”"
  roc.113.a: "超过爹了"

  roc.114.title: "工友的婚礼"
  roc.114.desc: "小赵的同事阿强今年结婚。新娘是隔壁制衣厂的女工，两人是在开发区组织的青年联谊会上认识的。联谊会是政府办的，每月一次，免费参加，场地由开发区管委会提供。阿强之前参加过好几次联谊会都没有下文，这一次他本来说不去，是小赵硬拉着他去的。新娘后来说，那天她本来也不想去的，是车间主任说“不去扣全勤奖”，她才去的。\n\n他们在联谊会上被分到同一组玩游戏。游戏是两人三足，阿强和新娘被绑在一起跑，跑着跑着两人都摔倒了，摔在草坪上，她压在他身上，他的脸涨得通红。她看着他通红的脸，说：“你会不会跑步？”他说：“会。只是不会和你一起跑。”她说：“那你现在学会了。”\n\n婚礼在开发区管委会的礼堂举行，场地是免费的，政府为开发区企业的青年职工提供婚礼场地补贴。证婚人是开发区的工会主席。他证婚的时候说了一句话：“你们在这里结婚，是因为你们在这里工作。你们在这里工作，是因为这片土地上有了能让你们留下来的东西——不只是工资，还有生活。”阿强和新娘都不太会说话，他们只是笑，从头笑到尾。婚礼结束后，小赵帮他算账——场地免费，婚纱是租的，酒席是厂里食堂老李掌勺。整场婚礼花的钱，不到他们两人两个月的工资。\n\n婚礼散场后，阿强和小赵在礼堂门口抽烟。阿强说：“以前在老家结婚，要借钱，要摆排场，怕被人看不起。在这里结婚，不用装。”小赵说：“结婚本来就不该装。”阿强说："
  roc.114.a: "“对。踏实就是排场。”"

  roc.115.title: "赵师傅的退休"
  roc.115.desc: "赵师傅今年退休了。\n\n他在纺织厂工作了将近四十年。退休那天，车间给他办了个小小的欢送会。没有横幅，没有鲜花，没有领导讲话。车间主任只是把他带过的徒弟们都叫到车间休息室，围着一张旧桌子坐了一圈。桌上放着老李做的红烧肉，还有一壶茶。车间主任说：“赵师傅，你带过的徒弟现在都是师傅了。你有什么话要交代？”\n\n赵师傅站起来，扫了一圈在座的人。有些是熟面孔，和他一样从建厂就在车间里流汗；有些是生面孔，刚进厂几年的年轻人，没和他搭过班。他看着那些生面孔，忽然想起自己刚进厂那天——他站在车间门口，听着织布机的轰鸣声，腿有点抖。他不知道这个地方会让他待大半辈子。他也不知道，他会在这个地方看着他的孩子出生，看着他的工友结婚，看着他师傅退休，然后他自己也退休。\n\n他说：“以前我师傅退休的时候，说了一句话——‘我这一辈子，热过来的。’那时候车间里没有空调。现在有了。现在什么都有了。我说完了。”\n\n大家鼓掌。有几个年轻女工眼眶红了。有一个当年在新工位被安排顶替离职周姐的工人，鼓完掌后低下头，用袖子擦了一下眼睛。赵师傅走过去拍拍她的肩膀，说：“你干得不错。”然后他端起茶杯，把茶喝完，拿起那个搪瓷闹钟，走出了车间。\n\n他走到厂门口，停下脚步，回头看了一眼。厂门口那块牌子上写着“第三纺织厂”。他在这里工作了将近四十年。他的手摸过无数根纱线，他的脚走过无数里路。他修过许多台机器，带过许多个徒弟。他现在要走了。他没有哭。他只是站了一会儿，然后把闹钟放进包里，转过身，往河堤走去。老伴在柳树下等他。路灯还没亮，但天色还早。春天傍晚的风吹过河面，带着一点泥土和青草的气味。他走了几步，又回头看了一眼厂门口那块牌子，然后继续往前走，没有再回头。"
  roc.115.a: "现在什么都有了"

  roc.116.title: "政治协商会议"
  roc.116.desc: "第一届政治协商会议在南京原帝国咨政院大楼召开。这座大楼在帝国时代是贵族议政的场所，如今门楣上挂着一块新匾额，红布尚未揭开。宋庆龄站在台阶前，看着那块匾额，对身边的邓择笙说了一句话：“咨政和政协，只差了一个字。咨政是请人来听皇帝说话，政协是请人来说话给国家听。差一个字，差了两千年。”她亲手揭下了那块红布。\n\n宋庆龄坐在圆桌的主席位，但她把椅子往后挪了半尺，让自己不在任何人的正前方。她的开场白很短。\n\n“今天我们坐在这里，不是来听我讲话的。我是来听你们讲话的。在座的有的人曾经是敌人，有的人曾经是狱友，有的人在战场上用枪炮互相指责，有的人在报纸上用文字互相攻讦。现在战争结束了，革命结束了，枪炮可以放下了，但文字还要继续——不是互相攻讦，是互相倾听。政协不是橡皮图章，不是表决机器，不是任何一个人的传声筒。政协是用来吵架的。把架吵在桌上，把共识写在纸上，把分歧留在记录里留给历史评判。这就是政协要做的事。接下来要讨论的《共同纲领》，你们每个人都要提意见。可以不同意，可以反对，可以逐条争辩——只要你的反对是为了让这个国家更好，而不是为了让它回到原来的样子。"
  roc.116.a: "把架吵在桌上"

  roc.117.title: "毛润芝的发言"
  roc.117.desc: "毛润芝是最后一个到场的中共代表。她没有从正门进来，是从侧门悄悄走进来的，手里端着一个搪瓷茶缸，上面印着“四川农会”几个字。她在靠后的位置坐下，把茶缸放在桌上，没有打断任何人的发言。但她的沉默本身就是一种存在——所有人的眼角余光都在看她。\n\n在讨论到土地问题时，毛润芝站了起来。她没有拿讲稿，只是把茶缸往前推了推。\n\n“宋主席说要畅所欲言，那我就畅所欲言。中共打了多年的游击，从湘江打到川北，死了很多人。这些人的血，不是为了争一个政协席位——是为了让农民有自己的地。现在地是分了，但农会没有了。农民需要一个组织，不是拿枪的组织，是说话的组织。政协里可以有工人代表，可以有工商业代表，为什么不能有农会代表？我提议在《共同纲领》中明确农会的合法地位——不是作为政权机关，是作为群众组织。它是农民自己的组织，不是政府的组织。”\n\n会场安静了一瞬，然后响起了窃窃私语。宋庆龄第一个开口回应。她没有用“我决定”或“我认为”，而是转向农工民主党的代表，把问题抛了出去：“农民组织在您的党纲里是怎么表述的？"
  roc.117.a: "农民的声音"

  roc.118.title: "赤羽的建议"
  roc.118.desc: "农工民主党主席赤羽站起身。她穿着旧式的对襟布衣，说话带着浓重的江浙口音。\n\n“农工民主党的党章里有一条——‘本党以改善工农生活为本党最高宗旨’。这一条从我创建江南工农互助同盟的时候就写在那里了。毛润芝同志说要给农民一个说话的组织，我完全赞成。但我有一个补充建议——农会和工会的功能要分开写。工会可以提出集体谈判的要求，农会不以谈判为主要职能，因为农民面对的不是雇主，是天和地。农会应该侧重于推广技术、协调供销、维护权益。这三件事做好了，农民自然会相信农会。另外，关于政协席位，我同意毛润芝同志的意见——农会应该有直接代表席位。”"
  roc.118.a: "农民的声音"

  roc.119.title: "钟岚珠的发言"
  roc.119.desc: "致公党主席钟岚珠摇着檀香折扇站了起来。她是唯一一个穿着南洋风格服装的代表，珍珠项链在她说话时轻轻晃动。她说起话来不紧不慢，但每一句话都落在关键点上。\n\n“各位都在谈农会、谈工人、谈政党。我换个话题，谈谈地方。致公党主张‘强省弱央，因地制宜’。现在战争结束了，全国统一了，但地方的问题没有统一。广东的农民和甘肃的农民面临的问题完全不同；福建的渔村和苏北的旱地完全不同。政协的决策不能只从南京往下看。我提议在政协设立一个专门的地方事务委员会，各省都有代表参加，中央在做重大决策之前，必须先通过这个委员会听取地方意见。这不是削弱中央权威——是加强。因为只有地方的问题被中央真正听见了，地方的决策才不会被地方的怨气推翻。”\n\n她合上折扇，用扇柄轻轻点了点桌面，像是敲了一下惊堂木。“另外，关于政协的定位，我建议在《共同纲领》中写入这样一条——政协是‘各党派、各人民团体、各民族、各阶层共同参与国家事务的协商平台’。它不是临时性的过渡机构，它是长期的国家政治制度安排。”"
  roc.119.a: "地方的事地方说"

  roc.120.title: "洛天依的请求"
  roc.120.desc: "公民自由联盟的主席洛天依站了起来。她是所有代表中最不像政治家的一个——她穿着湖蓝色旗袍，胸前别着一支钢笔，她的手指修长而敏感，说话时微微前倾，像是在对人倾诉。\n\n“我是搞文化的，不懂军事，不懂农业，不懂地方自治。但我懂一件事——人需要自由地思考和表达，就像需要空气和水。各位刚才在谈农会、工人、政协席位、土地政策，这些都很重要。但没有一项比允许一个人自由地说出自己的想法更重要。公民自由联盟在革命时期和致公党并肩战斗过，和共产党也有过合作。我们内部也有分歧——有人主张全面学习西方自由主义，有人主张立足本土文化传统。这些分歧至今没有消失。但我们在一个问题上是一致的：宪法必须保障言论自由、出版自由、集会自由。不是‘在法律范围内’的自由——是先在宪法里明确写下来的自由。因为只有宪法先保证了自由，法律才有底线；只有自由被明确写进了根本大法，具体的法律才不能反过来侵蚀自由本身。”"
  roc.120.a: "自由入宪"

  roc.121.title: "蒋巾帼的提问"
  roc.121.desc: "蒋巾帼坐在靠窗的位置，整个上午几乎没有发言。她的笔记本摊开着，但上面一个字也没写。直到讨论接近尾声时，她突然举起手。宋庆龄做了个请的手势。\n\n“孙夫人，各位代表。我有一个问题。”她的声音不大，但很清晰。“今天在座的各党派都能自由发言，我很赞赏。但自由发言是一回事，发言之后的决策是另一回事。如果各党派的意见互相矛盾，最后由谁来做决定？如果决定做出了，不同意见的党派是必须服从，还是可以继续反对？”\n\n会场安静了下来。宋庆龄没有立刻回答，而是端起她面前的茶杯，慢慢喝了一口，然后转向蒋巾帼。“巾帼同志提了一个很好的问题。但我建议在回答这个问题之前，先把这个问题本身记录在案——因为这是政协今后需要面对的核心问题。至于我个人的初步意见：意见互相矛盾的时候，由政协全体会议表决决定。表决通过的决定，各方应当服从。但不同意见的党派有权利将自己的反对意见和理由写入正式会议记录，保留在政协档案中，供日后检验。这不是为了今天的决策，是为了十年后、二十年后的人们能回头看到——当时谁说了什么，谁是对的，谁是错的。让历史去评判。”\n\n蒋巾帼听完，在笔记本上写下了几个字，然后把笔记本合上，做了一个简短的表态：“这样，我可以接受。”"
  roc.121.a: "保留档案"

  roc.122.title: "符华的公车派转型"
  roc.122.desc: "公车党是神州帝国晚期涌现的保守改良派，前身是康佑薇领导的维新派，在帝国覆灭后失去了政治依托。康佑薇的关门弟子符华如今执掌公车党，她今天穿着素雅的灰色旗袍，头戴白花——那是为康佑薇戴的孝。会议开始前，她独自坐在座位上，双手交叠放在膝上，安静得像一尊雕像。但当宋庆龄宣布开始讨论各党派地位时，符华站了起来。她的声音不大，但整个会场都安静了下来。\n\n“宋主席，各位代表。公车党在帝国时代是主张君主立宪的。现在君主没有了。我们来这里之前，党内开了一次大会，争论很激烈。最后我做了一个决定——公车党从今天起，放弃君主立宪的政治主张，转型为传统文化保护与研究团体，重新定位为‘传统与宪政的桥梁’。师父一生所求，是为古老帝国寻一条新生之路。帝国死了，但师父的路没有死——那条路是从过去走向未来。君主没有了，但过去不是君主的私产。过去是所有中国人的遗产。”\n\n她停顿了一下，然后说出一句让在场所有人都感到意外的话。“我请求在政协设立一个文化遗产保护委员会。不是为了公车党的席位——是委员会成立以后，由政协监督，国家财政拨专款，保护全国的古建筑、古籍善本、民间戏曲和传统手工艺。这些东西，革命的炮火没有把它们全部毁掉，不能在我们这一代人手里自己毁掉了。公车党不再是一个君主立宪的党，但她可以是一个保护文化的党。”\n\n宋庆龄听完，沉默了片刻。然后她将目光从符华身上移开，环顾在场的所有代表，问道：“各位对符华同志的提案有什么意见？”无人反对。宋庆龄等了片刻，然后郑重地点头：“没有人反对。这个提案，请符华同志牵头，洛茜协助起草章程。”\n\n符华深深地鞠了一躬。她直起身时，眼角有泪光，但没有让眼泪掉下来。会后，她走到洛茜身边，轻声说了一句：“洛秘书，章程草案我会在三天内交到你手里。不会写‘君主’两个字。"
  roc.122.a: "保护文化的党"

  roc.123.title: "散会之后"
  roc.123.desc: "政协第一次全体会议结束后，宋庆龄独自留在了会场里。她坐在那张巨大的圆桌前，面前是堆成小山一样的发言记录和提案汇编。她逐份翻阅，在毛润芝的农会提案上批了一行字：“转农业部会同农工党研究。农会重建应先行试点，积累经验后再在全国推开。”在钟岚珠的地方事务委员会提案上批：“转行政院。此提案涉及中央与地方关系调整，需征求各省政府意见，汇总后再议。”在洛天依的言论自由条款上批：“转宪法起草委员会。此条款的具体法律表述请佩丽卡同志把关。”在符华的文化遗产委员会提案上批：“即办。洛茜协助。”\n\n批完最后一份文件，她站起身，走到窗前。窗外的南京城正在暮色中渐渐安静下来，远处紫金山上中山陵的白色石阶在夕阳下泛着柔和的光。她站在那里，忽然听到身后有脚步声。是洛茜，手里拿着一份刚整理完的简报。\n\n“主席，今天的会议记录整理好了。另外，钟岚珠代表和毛润芝代表刚才在走廊上又讨论了一会儿，主要是关于地方农会与中央政策衔接的几个具体问题。我根据她们的谈话整理了一份备忘录，已经放在您的桌上。”\n\n宋庆龄接过简报，翻到最后一页。简报末尾列着今天达成一致的各项事项，以及各自需要跟进落实的责任人。她看了一会儿，然后抬头望向窗外中山陵的方向，没有对任何人说话，只是轻轻说了一句：“中山先生，今天你也听到了吧。大家还在吵。但吵的都是怎么让这个国家更好。您放心。”她转过身，走回桌边，拿起笔，继续批阅下一份文件。"
  roc.123.a: "窗外，南京的灯火一盏一盏亮起来。"

  roc.124.title: "宪草审议会议"
  roc.124.desc: "依据政协决议，宋庆龄召集了新组建的宪法草案审议委员会的第一次全体会议。选址不在国民大会堂，不在行政院办公楼，而在中山陵脚下的一处僻静院落——原先是帝国时代的一间藏书馆，青砖灰瓦，庭中有两棵老槐树。宋庆龄说：“宪法不是给人看的，是给人用的。用之前，先想清楚。想清楚的地方，不能太吵。”\n\n她没有坐在长桌的主位。她坐在长桌中间，左右两侧各坐了五位委员。她把主位空了出来，桌上放了一盆兰花。\n\n“我们今天坐在这里，审议的是一部宪法。宪法不是给革命用的——革命已经结束了。宪法是给革命结束以后的日子用的。我们这些人，打了一辈子的仗，在座的有的人坐过牢，有的人写过遗书，有的人在战场上亲手埋过战友。我们做这些事的时候，心里想的是同一个念头——让后来的人不用再做这些事。宪法就是那个念头。把念头写成字，把字变成法，把法变成所有人都认的规矩。这就是我们接下来要做的事。我不是法律专家。这里有比我懂法律的人，有比我懂议会的人，有比我懂军队的人。我把你们召集到这里，不是要你们听我的——是要你们互相听。听完了，再写。写完了，再争。争完了，再改。直到这份宪法不是任何一个人的宪法，而是所有人的宪法。”"
  roc.124.a: "这事关所有人"

  roc.125.title: "宋娇仁的手稿"
  roc.125.desc: "宋娇仁是委员会中准备最充分的人。她带了一个公文包，里面装着多年来积累的各国宪法译本、比较法研究笔记、以及她在广府时期起草的《中华民国临时约法》历次修订稿。她把这些材料在桌上依次排开，每一份都标了日期和修订要点。她的开场白很短，没有慷慨激昂的宣示，只是说了一句话：“宪法的第一条最重要。第一条定了，后面的条款才有方向。我的意见是——‘中华民国之主权，属于国民全体。’”\n\n她解释这条草案的用意：“这句话不是我发明的。这是临时约法里的原文。但临时约法是战时的，宪法是平时的。平时的主权，不能只写在纸上。它要体现在议会怎么选举、政府怎么问责、法院怎么独立、公民权利怎么保障。主权属于国民，这六个字，需要后面的每一章、每一条来兑现。我用了三年时间准备了一份完整的草案框架，供各位参考。”\n\n她把草案分发到每个人面前。佩丽卡接过草案时，看到扉页上用铅笔写着一行字——“第四稿。仍不满意。宋娇仁。”她看了她一眼，没有说话，只是把草案翻到第一页，开始逐条审阅。"
  roc.125.a: "第一条"

  roc.126.title: "佩丽卡的校对"
  roc.126.desc: "佩丽卡是委员会中唯一一个不是革命元老、不是政党领袖、不是军队将领的人。她是被宋庆龄以“法务部资深技术官员”的名义请来的。她的任务不是提意见，而是校对——把每一个条文用最精确的语言固定下来，不留歧义，不留漏洞。\n\n她在第一次会议上几乎不说话，只是埋头在草案上做标注。有些条文被她划掉，旁边用铅笔重新写过；有些条文被她加了注释——“此条与第十四条冲突”、“此处‘应’改为‘得’，避免强制义务与自由裁量的混淆”、“此处需明确救济程序，否则权利无从保障”。宋娇仁偶尔会凑过来看她改了什么。有一次她看到她改了她写的一个条款，眉头皱了一下，然后拿起自己的那份草案，在同一个地方做了同样的修改。修改完毕后她侧过头对佩丽卡说了一句：“你是对的。”\n\n佩丽卡做了一项更基础的工作。她在第一次全体会议上提出了一个所有人都没有意识到的问题——整部宪法的用词规范。她说：“宪法不是公告，不是社论，不是宣言。宪法的每一个字，在法庭上都会被反复引用。如果同一个概念在不同条款里用不同的措辞，法官会困惑，律师会钻空子，公民会失去对法律的确信。所以，从现在起，我们需要的不是文采，是准确。”\n\n她拿出一份自己编制的《宪法术语统一表》分发给大家。表格里列出了几十个核心术语，每个术语后面标注了统一用词，比如“国民”与“公民”的区分，“权利”与“权力”的辨析，“应”与“得”的使用场景。宋庆龄翻阅这份表格时，在扉页上写了一句话，然后把表传给宋娇仁。宋娇仁读后沉默片刻，说：“我写了好几年草案，从来没有想过这个问题。”"
  roc.126.a: "校对每一个字"

  roc.127.title: "陈晖洁的名册"
  roc.127.desc: "陈晖洁来参加第一次会议时，带了一份名册。不是党务名册，不是忠诚档案，是一份全国基层行政区域的人口普查摘要。她把它放在桌上，没有打开。\n\n讨论到地方自治条款时，争论很激烈。有人主张效仿美国联邦制，给各省较大的自治权；有人主张中央集权，防止地方军阀死灰复燃；有人在两者之间反复摇摆，试图找到一个中国式的平衡点。陈晖洁听了很久，然后打开了她那份名册。\n\n“我这里有全国各县的人口数据。有的县人口密度是每平方公里十几人，有的县是几百人。有的县连一条像样的路都没有，有的县已经有铁路和电报。地方自治不是给省一级的——省太远，乡太散。自治的基础单位应该是县。县够小，让当地人了解当地事；又够大，能够承担实际的行政职能。我建议宪法里写‘县为地方自治之基本单位’。不用写太多，就这一句。其她的，让法律根据各地实际情况去细化。”\n\n宋娇仁在笔记本上记下了这句话，然后在旁边画了一个圈。此后几天，她多次在与陈晖洁私下交谈时进一步讨论县自治的具体制度设计。陈晖洁每次都用数据回答，数据精确到每一个县，从不使用形容词。"
  roc.127.a: "皇权不下乡的时代已经过去了"

  roc.128.title: "何应晴的沉默"
  roc.128.desc: "何应晴是委员会中最沉默的人。她的沉默与蒋巾帼不同——蒋巾帼是谨慎，她是疲惫。她打了太多年仗，现在要坐下来谈宪法，她不知道该说什么。她觉得自己在这里很多余。宪法不需要将军签字。她带来的笔记本上，只有一行字：“军队属于国家。”\n\n讨论到军事条款时，宋庆龄忽然看向她。“何总指挥，你有什么意见？”何应晴抬起头，沉默了一会儿。她说话的时候声音不大，但语气是那种不需要争辩的平静，像是在陈述一个已经被历史证明过的事实。\n\n“我的意见只有一条：军队不能再有党。军队的指挥官不能同时是政党的领袖。军官不参加选举，士兵不参加政党。军队只听国防部长和总统的命令。国防部长是文职。”\n\n她停顿了一下，然后说出了她整个会议期间最长的一段话：“我当年在广府，管着几万人的部队，但没有一次调动是完全由我自己决定的。每一次都要在几个派系之间反复解释——为什么调这支部队，不调那支部队。不是因为军事原因，是因为这支部队的指挥官是哪一派的人。军队不是谁的私人财产。军队是国家的。这部宪法，应该把‘军队属于国家’这六个字，写在第一条。不是军事条款的第一条，是宪法的第一条。没有这一条，其她的都是空话。”"
  roc.128.a: "军队属于国家"

  roc.129.title: "洛茜的记录"
  roc.129.desc: "洛茜是委员会最年轻的成员。她的正式身份是宪法起草委员会秘书长，负责会议记录和文书工作。她每天第一个到会场，最后一个离开。她在会议期间做了几大本会议记录，每一页都写得密密麻麻，字迹工整。\n\n她的工作不仅是记录——她在记录的基础上，每天晚上熬夜整理出一份《本日会议争议要点》，把当天委员们的分歧、共识和待决议题逐条列出，第二天早晨放在每位委员的座位上。这份工作没有人要求她做，但她觉得有必要——她知道宋庆龄需要这份文件，因为宋庆龄要在协调各方分歧时精准地知道争议焦点在哪里。\n\n宋庆龄有一次在散会后单独问她：“你听了这么多争论，你自己怎么看宪法？”洛茜想了想说：“宪法不是写给我们看的。是写给那些在村小里刚学会写自己名字的孩子看的。她们不知道什么叫三民主义，什么叫苏维埃，什么叫联邦制。但她们知道什么叫公平。宪法要让她们觉得公平。如果她们觉得不公平，那我们今天在这里坐的每一天，都白费了。”\n\n宋庆龄没有回答。她只是把那盆兰花往洛茜那边推了推。洛茜看着兰花，忽然说：“您这盆兰花，养了多少年？”宋庆龄说：“从广东带过来的。”洛茜说：“它很安静。”宋庆龄说：“安静的人才能养兰花。”"
  roc.129.a: "沉默的实干家"

  roc.130.title: "蒋巾帼最后的发言"
  roc.130.desc: "宪法草案即将定稿的那一天，蒋巾帼提出了最后一条意见。\n\n“宪法草案里有一条——‘国家尊重和保障人权’。这一条我很赞同。但我想建议在总纲部分加写几个字——‘我国是工人阶级领导的、以工农联盟为基础的人民民主国家。’这不是我的发明，这是中共在宪法讨论中反复提出的意见。我认为这个提法可以成为各方都能接受的共识基础，既不否定现行政权性质，又为未来留出空间。”\n\n“你这是篡改三民主义！”\n\n突然会场中响起一声斥责，“你这就是对先总理遗教的背叛！三民主义被你丢到哪里去了，你还是个国民党员吗！”\n\n委员会中的部分国党党员也纷纷表示：若国体不为三民主义共和国，有违总理三民主义五权宪法之遗教精神。"
  roc.130.a: "这可真是……"

  roc.131.title: "妥协"
  roc.131.desc: "态度强硬的国党党员坚持要“三民主义入宪”，最终激起了各友党人士的愤怒，宋庆龄选择拉上孙科以“国母”和“太子”的身份劝说国党委员不必拘泥于总理遗教，总算是化解了矛盾……委员们同意稍作修改，但要保留三民主义相关的意志。\n\n几天后，宪法草案总纲第一条在吸收了各方意见之后最终定稿：“中华民国基于三民主义，为人民民主之社会主义共和国。中华民国之主权，属于全体人民。人民行使国家权力的机关是国民大会和地方各级代表大会。”"
  roc.131.a: "一切权力属于人民！"

  roc.132.title: "邓择笙的提案"
  roc.132.desc: "委员会在讨论国大组成方案时陷入了僵局。宋娇仁主张普选制，一人一票，按人口比例分配议席。蒋巾帼主张职业代表制，但强调的是军队和党在议会中的特殊地位。陈晖洁主张以县为基本选举单位，注重地方自治。三方各执一词，连续几次会议未能达成共识。\n\n宋庆龄没有急着表态。她只是说：“先不要争选举方式。先回答一个问题——这个国民大会，是给谁开的？如果农民和工人不能在国大里为自己说话，那这个大会和旧帝国的咨政院有什么区别？”\n\n散会后邓择笙单独求见了她。\n\n“孙夫人，关于国大组成，我有一个方案。”\n\n宋庆龄看着她。邓择笙是她最信赖的党内左派盟友——她在北伐时期当过国民革命军总政治部主任，是蒋介石最激烈的批判者，也是三大政策最执着的捍卫者。她从不说空话。她每次来见她，都是带着具体的方案。\n\n“说。”\n\n“职团代表制。但不是巾帼同志主张的那种——不是让军队和党委选派代表，是让农会工会等各职业团体和准职业团体选举出能真正代表农工的代表。工人代表由总工会组织选举，农民代表由各级农会选举。国民大会中直接参加生产的农工代表占百分之六十，其他各各职业团体及准职业团体占百分之四十。”\n\n她顿了顿，从公文包里抽出一份手写的草案递给宋庆龄。“总工会对工人代表的候选人进行资格审查，农会对农民代表的候选人进行资格审查。这不是为了防止异见——是为了确保选出来的人，确实种过地、确实开过机器。不是党代表，是职业代表。”\n\n宋庆龄接过草案，从头到尾看了一遍。然后她抬起头。“这个想法，你从哪里来的？”\n\n“一半来自苏联的苏维埃制度，另一半来自我在北伐时期看到的农民协会。北伐路上我见过很多农会主席，她们不识字，但她们知道村里每一户人家有几亩地、几口人、欠多少债。她们比我们更懂农村。这样的人，应该坐在议会里。”\n\n“总工会的政审，谁来监督总工会？”\n\n邓择笙沉默了片刻。然后她凑近说了两句话，声音压低了一些。宋庆龄听完后微微点头，没有再问。"
  roc.132.a: "种过地的代表"

  roc.133.title: "总工会的资格审核"
  roc.133.desc: "宋庆龄把这个方案带到了审议会上。宋娇仁听完后摘下眼镜擦了很久，然后说了一番话。她说她花了很多年时间设计普选制度，现在有人说选票不应该是平等的——工人和农民要有特别代表。她需要有人能说服她。\n\n邓择笙站起来。“宋先生，您的普选制度在理论上是完美的。但理论上有几个前提：第一，所有选民都能自由投票；第二，所有候选人都有平等的机会被看见；第三，议会里的辩论能够真实反映社会各阶层的利益。这三个前提，现在的中国满足不了。农民不识字，工人在工厂里每天工作十二个小时，她们怎么去和有钱有闲的人竞争选票？普选在纸面上是平等的，在现实中是另一种不平等。”\n\n宋娇仁沉默了很久。然后她重新戴上眼镜。“你说服我了。但我有一个条件——总工会的资格审查不能是终身制。每一届任期结束后，资格审查标准必须由独立的选举委员会重新审核。不能出现一个工会干部一辈子把持名额的情况。每届都要重新看。”\n\n陈晖洁在旁补充：“选举委员会成员的遴选和任期，由专门法律另行规定，宪法里只保留原则。”佩丽卡几乎同时开口，说独立委员会的组成方案她可以在下周之前完成初稿。\n\n宋庆龄听着她们的话，微微点了点头，眼角露出一丝极淡的笑意。她看着陈晖洁和佩丽卡，说：“你们知道我在想什么。这件事，交给你们俩。”"
  roc.133.a: "权力必须有监督"

  roc.134.title: "宋庆龄的签字"
  roc.134.desc: "宪法草案定稿那天，宋庆龄把那份厚厚的手稿放在桌上，从怀里取出一支钢笔，在扉页写下：“中华民国宪法草案。民国二十七年。”\n\n她签了自己的名字。然后她把笔递给宋娇仁。宋娇仁签完以后，把笔放在桌上，推给下一个人。蒋巾帼签完字把笔放下，笔在桌上滚了半圈，停在陈晖洁面前。她看了一眼笔，签了。佩丽卡签字时在扉页的角落里又用铅笔标注了一处格式误差，然后递给何应晴。何应晴签完后站起来，对所有人说了一句：“我打了快一辈子的仗。今天终于签了一份不打仗的文件。”然后她把笔放在宪法草案旁边，轻轻拍了两下，像是在拍一个老战友的肩膀。洛茜最后一个签字。她签完以后，把笔盖好，放回宋庆龄面前。\n\n宋庆龄收好笔，站起来，看着窗外的两棵老槐树。有一棵槐树的枝桠在冬天枯了一枝，但另一棵正在发新芽。她说：“宪法写完了。但它还没有开始。接下来的事，比写宪法更难。”宋娇仁摘下眼镜，擦着镜片，没有接话。窗外那两棵老槐树在风里轻轻晃着，枯枝上不知什么时候停了一只鸟，正用喙整理翅膀下的羽毛。阳光把它的影子投在宪法草案的封面上。"
  roc.134.a: "最后签一次不打仗的文件"

  roc.135.title: "老农的困惑"
  roc.135.desc: "宪法草案公布后，各省农会和工会组织了讨论会。在苏北一个村子的农会里，农会主席把宪法草案中关于职业代表制的条款逐条念给农民听。他念到“农民代表由各级农会选举产生”时，一个老农在角落里抽着旱烟，忽然问了一句话——“选举代表去南京开会，那选举以后，他还能回村种地吗？他要是去了南京就不回来了，那我们选他干什么？”\n\n农会主席说代表是有任期的，任期满了要回来。下次选不选他，看他做得好不好。老农把旱烟锅子在鞋底上磕了磕，站了起来，用脚踩灭了烟灰，说了一句让在场所有人都安静下来的话——“能回来就好。就怕他去了南京，学会了大地方的话，忘了我们这里的话。大地方的话我们听不懂，他要是忘了这里的话，他就不是我们的人了。”\n\n农会主席认真地点了点头，没有敷衍。他把这句话写进了呈送上级的讨论意见汇总里，原文是——“某村一老农提出：代表不能忘了老家的话。”"
  roc.135.a: "已阅"

  roc.136.title: "总工会的审核现场"
  roc.136.desc: "上海总工会进行了第一次工人代表候选人资格审查。审查不是坐在办公室里看档案——审查组的人下到了每一个候选人的工厂，和她一起站在机器旁边，看她操作，和她聊天，问她的工友对她的看法。审查组组长是一个从纺织女工成长起来的工会干部，姓周，手指上有被纱线磨出来的老茧。她审查一个候选人时问的问题不是“你对三民主义的理解”，而是“你车间的通风设备好不好”“你那个工段的姐妹有没有因为长期站立静脉曲张”“你上一次被机器夹到手是什么时候”。那个候选人回答完第三个问题后沉默了很久，然后说——“你是第一个问我这些问题的干部。”\n\n审查通过后，候选人的名字被写在红纸上，贴在工厂门口，旁边是一张白纸，请工人提意见。如果没有人提出实质性的异议，她的名字就正式进入选举程序。\n\n这种审查方式后来被写入《职业代表选举法实施细则》，条款表述非常简洁：“工人代表候选人的资格审查，应深入候选人所在的工作场所，听取其工友意见，了解其劳动条件。审查组成员应具备相应行业的劳动经验。审查结果公示，接受工人群众的公开监督。”"
  roc.136.a: "人民代表必须代表人民"

  roc.137.title: "工农代表的第一天"
  roc.137.desc: "新国会开幕那天，南京下着小雨。一个来自湖南的农民代表穿着新做的中山装站在国民大会堂门口，仰着头看着那排高大的石柱，看得脖子酸了也没有低下头。他的同伴问他看什么，他说他要看清这柱子有多高——回去以后，他儿子问他，他得说得出来。一个来自天津的纺织女工代表走过他身边，她的工装已经洗得发白，但胸口别着一枚崭新的代表证。她站在台阶最下面一级，深呼吸了好几次，才迈出第一步。\n\n会场里，六百多个席位按照职业代表和普选代表分区就座。左边是普选代表，右边是工农代表，前面是知识分子和专业技术人员代表。三个区域各自独立，但共用同一个表决系统。宋庆龄在开幕致辞中说了一句话——“从今天起，这个国家的法律，将由种地的人、纺纱的人、教书的人、算账的人共同制定。这不是恩赐，这是你们应得的。”\n\n掌声雷动。坐在工农代表区第一排的一个老农代表没有鼓掌——他正在用粗糙的手指摩挲着桌面上的表决器，那个小盒子上面有三个按钮，分别写着赞成、反对、弃权。他把这三个字认了很久。然后他抬起头，看着主席台上方的国徽，嘴唇动了动，像是在说什么。旁边的人问他是不是在念什么，他说：“不是。我在跟我爹说——你儿子现在在南京，用这个表决器，能说‘不’了。”"
  roc.137.a: "能说好，也能说不"

  roc.138.title: "政策问询处"
  roc.138.desc: "南京玄武湖畔一座不起眼的二层灰砖小楼，门口挂着一块新制的木牌，上面用端正的楷书写着“人民服务站”。阳光透过梧桐叶洒在门前的青石板上。\n\n洛茜每天早晨七点准时推开这扇门。她的正式职务是国民参政会副秘书长，但她大部分时间不在参政会的会议厅里，而是在这栋小楼里办公。这是宋庆龄亲自交代的任务：建立一个面向全体公民的政策窗口，让普通百姓知道政府正在做什么，也让政府听到普通百姓在想什么。洛茜把这个任务理解为两件事：解释和收集。解释，是把政策条文翻译成普通人能听懂的话；收集，是把普通人的意见整理成政府可以参考的材料。这两件事都不难，但都很费工夫。她在这栋小楼里开始了这项细致而持久的工作。\n\n人民服务站的门口有一块公示栏，是洛茜亲手钉上去的。公示栏分成三个区域：左边贴政策解读，中间贴法律草案征求意见稿，右边贴回复栏。\n\n第一份政策解读是洛茜自己写的，主题是《土地改革法实施细则》。原文是佩丽卡起草的法律文本，长达数十页，充满了“前款”“但书”和“依本法第某条之规定”这类术语。洛茜把这份文件反复读了多遍，然后重新写了一份解读稿。她写完之后请服务站的同事试读，又请了一位常来服务站帮忙的识字班老师逐句核对，确保每一个词都足够明白。定稿只有不到两页纸，用的大多是短句，像在跟人说话，不是在下定义。开头是：“老乡们，土改法规定了地主的地怎么分。今天我们来一条一条讲清楚。”结尾是：“如果你觉得哪一条不合理，或者你村里有特殊情况，写在纸上投进门口的信箱。每一个意见都会被看。”这份解读稿张贴出去以后，她被自己写的东西难住过一回。信纸上只写了一句话——“洛秘书，你写的字我都认识。我提一个意见：能不能把字印大一点？我眼睛不好。”洛茜把这张纸条贴在公示栏的回复区，用红笔在旁边写了一行字：“已收到。下一批公示材料全部改用大字版。谢谢您的提醒。”此后所有公示材料都有了固定的排版标准：正文用大号楷体，标题加粗，行间距不小于两倍，确保视力不好的老人也能看清。"
  roc.138.a: "把字印大一点"

  roc.139.title: "收集箱"
  roc.139.desc: "公示栏下面挂着一个木制的收集箱，涂着绿漆，正面用毛笔写着六个字——“有话请投这里”。这个箱子是洛茜自己做的。她量了尺寸、锯好木板，亲手拧上每一颗螺丝。她的工装袖口至今还留着一点绿漆。\n\n收集箱每周开启两次，每次开箱都有记录员在场，每一封信都编号登记。洛茜定了一条规矩：所有来信，无论署名与否，都必须在一周内给出初步答复。能当场解答的当场解答，需要转交相关部门的注明转交去向和预计回复时间，涉及重大政策问题的直接呈送宋庆龄的办公桌。有人问她为什么匿名信也要回——答复张贴在公示栏的“回复”区域，写信人自己去看，她不知道对方是谁，但那人能看到。她说：“她不想让我知道她是谁，这没关系。她想让政府知道她在想什么，这才是重要的事。”\n\n有一天她收到一封字迹歪歪扭扭的来信，信上只写了一句话。她把这封信贴在了回复区，旁边附了一行字。这件事和土改法无关，和预算案无关，但她觉得它值得被回应。因为回应本身就是一种政策。"
  roc.139.a: "有话请投这里"

  roc.140.title: "苏北农民的来信"
  roc.140.desc: "一个来自苏北的农民寄来了一封信。信封是用旧报纸糊的，地址一栏只写着“南京玄武湖人民服务站收”。信纸是一张从作业本上撕下来的纸，铅笔字写得又大又松散。信的内容是关于改良稻种补贴申请流程的问题——她在乡里问了好几趟，每次都说材料不全，但没有人告诉她到底缺什么。洛茜读完信后，在自己的备忘本上写下了三件事：一，查清该县改良稻种补贴的申请流程；二，确认缺少的材料是政策本身就要求、还是乡里自行加码；三，将标准流程用大字版公示，并寄一份给这位农民。她在备忘本上的标注方式非常简洁：每一项任务后面都画一个空心圆圈，完成后涂成实心。\n\n她给农业部打了一个电话，又给该县的农业局发了一封电报，把问题核实清楚后发现，确实是乡里的工作人员没有按流程一次性告知所需材料。她协调县农业局派人下乡指导，把标准流程写成了大字版的告知书寄给那位农民。几天后她收到回信，信封上地址完整、邮编清晰，信纸不再是从作业本上撕下来的纸，而是一张正式的信笺。信上只有一行字，字迹和当初一样大而松散——“洛秘书，补贴拿到了。稻种也买了。”她把信叠好，放回信封，在信封上注了一笔，然后归入档案盒。档案盒的标签上写着："
  roc.140.a: "“苏北来信。已办结。”"

  roc.141.title: "主席接待日"
  roc.141.desc: "每月第一个星期天下午，宋庆龄如果没有特殊安排，会亲自来人民服务站坐一个时辰。她不发表讲话，只是坐在那里，听来访的人说。来访者有工厂女工、郊区菜农、退伍老兵、学校教师。她们有的是来反映具体问题，有的是来看一眼传说中的孙夫人。无论谁来，宋庆龄都会站起来微微欠身，然后坐下，听对方把话说完。她从不打断任何人。有一次她刚站起来就被一个抱着孩子的年轻母亲拉住了手，她没有抽手，只是身体微微后仰，稳住重心，然后问：“你说的事，我记下了。你住在哪个区？”这是她每次接待后的标准反应——先确认对方说的事是否已被准确记录，再确认对方的住址，最后才说“我们会去核实”。\n\n有一次一个退伍老兵拄着拐杖进来，手里攥着一张揉皱的退伍安置证明。她说她的安置费拖欠了很久，去过区公所好多趟，每次都说“下个月”。她说她已经等了很久了。宋庆龄听完，转头对洛茜说了一句话：“查。安置费的事不需要复杂程序。三天内给我结果，按文件办。”老兵在三天内拿到了安置费。下一个月的接待日她又来了，这次没带任何材料，只是站在门口敬了一个军礼，然后拄着拐杖走了。洛茜在接待日志上写了两个字：“已决。”"
  roc.141.a: "三天内给结果"

  roc.142.title: "洛茜的小本子"
  roc.142.desc: "洛茜有一个巴掌大的布面小本子，随身携带，用铅笔记录，从不离身。里面记满了她在服务站听到的意见、观察到的现象和临时想到的改进建议。有些是政策执行中的漏洞，有些是群众口头反映的只言片语，有些是她自己在工作中发现的程序缺陷。这些记录并不都当天处理——有些问题需要蹲在田埂上反复确认，才能变成完整的建议——但最终大部分都会从这个小本子出发，形成正式的文件或方案，送交到该去的地方。她每天下班前会翻一遍这个小本子，把已办结的事项轻轻划掉，然后把待办的事项圈出来，标上优先级。她曾在一次内部会议上被问到政策解释工作的难点在哪里，想了想说：“难的不是解释政策，难的是让老百姓知道这里有一个门。更难的是让她们相信这个门会一直开着。”她顿了顿，说：“所以我把服务站选在菜市场隔壁。每天买完菜顺路看一眼公示栏的人，比专门来看的人多。更重要的是——菜市场不会搬家，我们也不搬。只要菜市场还在，这个门就开着。”"
  roc.142.a: "人民服务站应该全国推广"

  roc.143.title: "宋庆龄的钢笔"
  roc.143.desc: "有一次洛茜在整理反馈时，在收集箱里发现一份对《劳动保障条例实施细则》的长篇意见。原文只有关键数字，她逐字核对后补充了具体的修改说明，然后把这份信誊正，连同原信一并呈给宋庆龄。几天后这份意见经核实后被采纳，相关条款正式修改。宋庆龄在一次内部会议上当着所有人的面，把自己随身多年的钢笔从桌上拿起来，递给洛茜。那支笔很旧，笔杆上有一道浅浅的划痕。洛茜双手接过，没有推辞，只是说：“这笔比我的重。”宋庆龄笑了笑，说：“不是笔重，是你接过去的东西重。政策解释这四个字，解释得清楚，人民就信我们。从今天起，这支笔你拿着，专门写公示材料。让老百姓看得懂的字，就用这支笔写。”此后服务站所有公示材料都由洛茜亲手执笔。她写字时手腕用力很轻，但笔迹清晰、端正、一丝不苟。公示栏上新贴的告示，字体永远是标准的大号楷体，行距永远是两倍。偶尔有认字的老人站在前面，把告示内容慢慢念给旁边不识字的人听。洛茜有一次路过时正好看到这一幕，没有走过去打招呼，只是退后几步，让别人不被她打扰地继续念完。回到办公室后她翻开小本子，在之前记下的一个条目下加了一行字："
  roc.143.a: "“已确认。”"

  roc.144.title: "白日昭昭"
  roc.144.desc: "白日高悬。不是灼人的烈日，而是冬日午后的太阳——明亮，温暖，照在身上能感觉到热度，却不会把人烤伤。\n\n西北的草原上，一个牧民仰起头看着天。她刚参加完投票，选出了她们嘎查的第一个牧民代表。她不会写“民主”两个字，但她知道今天选的这个人，下次如果她做得不好，可以换掉。风从草原深处吹来，草浪翻涌，白云在蓝天上缓缓移动。她眯起眼睛看着太阳——太阳也在看着她。\n\n长江的货轮上，一个水手靠在船舷上看着天。她刚卸完一船从汉口运往上海的棉花，这批棉花是合作社种的，用的是改良种，纤维比往年长了一截。船主给她加了工资，说今年合作社的货多，跑不完。她点了根烟，烟头的红光在日光下几乎看不见。她在这条江上跑了半辈子，从前运的是洋人的货，现在运的是自己人的货。太阳照在江面上，波光粼粼，像撒了一江碎金。\n\n南京的国民大会堂里，一个老农代表仰头看着穹顶上那面青天白日旗。她的手指还不太习惯按表决器，但上一轮投票她按了“赞成”——那是关于农村水利设施拨款的议案。她想起很多年前，她的村子因为没有水渠，旱了三年。现在水渠修好了，她坐在这里，用这个带按钮的小盒子，给另一个村子修水渠。阳光从穹顶的玻璃窗透下来，照在表决器的按钮上，也照在她手背上那些干了一辈子农活留下的疤痕上。\n\n宋庆龄站在中山陵的祭堂前，身后是三百九十二级台阶，面前是南京城。她穿着一袭素色旗袍，手里拿着那支用了很多年的钢笔——那支她曾递给洛茜、洛茜说“这笔比我的重”的笔。她没有发表演说，没有题字，只是站在那里，看着远处长江反射的日光。她想起很多年前在潮汕的田埂上推行土改试点时，一个老农蹲在地头捧起一把新分到的土，放在鼻子下面闻了很久。那时她对自己说，革命不是改朝换代——革命是让这个人能闻到她自己的土。现在那把土还在，那把土上的庄稼已经换了好几季。\n\n白日照耀中国。这不是谁的旗帜独享的光。这是不分党派、不分阶层、不分地域的光。它照在牧民的选票上，照在水手的工资条上，照在老农代表的表决器上，照在每一个在田埂上、在工厂里、在教室中、在手术台旁认真生活的人身上。她们是这个国家的根基，不是英雄，不是伟人，不是被写进历史书的名字。但她们才是让白日升起的人。\n\n很久以前，有一个人在村小的黑板上写下了第一行粉笔字——“让饿着的孩子吃上饭”。她当时用的粉笔是从南京带去的，很细，一写就断。她蹲下来把断掉的粉笔头捡起来，继续写。后来那块黑板换成了白板，又换成了电子屏幕，但那行字还在——不是写在黑板上，是写在每一个吃过饭的孩子心里。那个在黑板上写下第一行字的人已经老了，但她种下的种子没有老。种子的寿命比播种者长。\n\n白日照耀中国。这天不是什么特殊的日子。没有战争结束的纪念日，没有革命胜利的庆典，没有哪个伟人的诞辰。它就是普通的一天——工厂的机器在转，田里的稻子在长，学校里的孩子在念课文，医院里的医生在做手术，码头的工人在装卸货物，菜市场的大妈在讨价还价，老人在公园里下棋，年轻人在图书馆里翻书。所有这些普通的事，在同一个太阳底下发生着。这就是革命结束之后的日常。这就是那些曾经在战壕里、在牢房里、在秘密电台旁、在田埂上、在黑板前奋斗过的人想要的日常。\n\n太阳升起来了。不是谁的太阳——是所有人的太阳。它升起来，照在这片土地上，照在每一个认真生活的人身上。没有人抬头去确认它的存在，因为没有人需要确认。它就在那里。白日照耀中国。"
  roc.144.a: "白日照耀中国"

  roc.145.title: "新文化运动的风"
  roc.145.desc: "《新华日报》是在宋庆龄主持下创办的。创刊号社论由宋庆龄亲自执笔，只有短短几百字，其中一段写道：“革命已经结束，但建设刚刚开始。这份报纸不是哪个党派的传声筒，它是人民的耳目，也是人民的声音。它不讲空话，不写谀词，只写实事。”\n\n报社设在南京原一家旧报馆的旧址，印刷机是旧的，铅字也是旧的，但印出来的字是新的。总编辑是从上海请来的一位老报人，宋庆龄在请他出山时只提了一个要求：“不要给我写颂词。如果哪天你发现我做错了事，就在报纸上指出来。这是你的职责。”这份报纸很快成为发行量最大的日报之一。\n\n《新华日报》内部还有一份内参，专门呈送各级党员干部，内容是政策讨论、基层调研报告和各地工作中的经验教训。宋庆龄对内参的要求只有一条：“可以写问题，可以写分歧，但不能写假话。内参不是给领导看的表扬稿，是给全党看的镜子。”\n\n与《新华日报》同时创刊的还有《新大众》周刊，这是一份面向普通百姓的通俗刊物。主编是一位从上海来的女编辑，她在创刊词中写道：“这份刊物不讲深道理，只讲故事。讲一个农民怎么在土改中分到了地，讲一个女工怎么学会了识字，讲一个村子怎么修起了水渠。这些故事是真的，人就活在我们身边。如果你觉得这些故事写得不好，写信告诉我们，下次我们写得好一点。”\n\n《新大众》很快成为农村扫盲班的辅助读物。在苏北一个村小里，一个年轻的女教师在黑板上写下“报纸”两个字，然后打开一份《新大众》问学生们：“这是什么？”一个女孩站起来说：“这是故事。”老师说：“不，这是真事。”"
  roc.145.a: "字字为民"

  roc.146.title: "漫画"
  roc.146.desc: "上海的一家出版社推出了一本名为《民国之子》的漫画杂志。创刊号的封面是一个穿着工装的年轻人，右手握着一把扳手，左手托着一轮红日。她的背后是一片工厂的剪影，脚下是麦田和铁轨。漫画第一格是她站在村口告别父母，最后一格是她站在高炉前，火光映红她的脸。旁白只有一句话——“她不是英雄。她是我们中的每一个人。”\n\n与此同时，《红色超人》也开始连载。故事的主角是一个会飞的青年，但她不穿披风，不戴面具，穿着普通的蓝布工装。她的力量不是来自外星，也不是来自变异——是来自集体。当她需要举起一台沉重的机器时，画面上会出现无数双手和她一起托举。她从不独自战斗。有一期的结尾，一个孩子问她：“你是神吗？”她蹲下来，和孩子的视线齐平，说：“不是。我是你。”\n\n魔法少女漫画也在这个时代悄然兴起。其中一部作品的主角是一个纺织女工，她在夜校学会识字后，发现自己能用粉笔在黑板上画出会动的图画。她画了一台织布机，织布机从黑板里浮出来，帮她织完了全厂当月缺额的布匹。她不需要变身的咒语，她的咒语是识字课本上的一句话——“知识就是力量。”这句话写在课本的第一页，她第一次读到这句话时，在黑板上用粉笔描了一整节课，描到粉笔头断成三截。\n\n科普漫画《漫游未来》以一对兄妹为主角，她们在梦中乘坐一辆由太阳能驱动的列车穿越时间，看到未来的中国——农田由自动机器耕作，城市里绿树成荫，孩子们在学校里学习天文和化学。每一期的结尾都有一个“科学小实验”栏目，教孩子们用家里的材料做简易的物理化学实验。在一所农村小学里，一个男孩按照杂志上的方法用铜丝和磁铁做出了一台简易电动机，当线圈在磁场中转动起来时，她把脸凑得很近，然后跑去找老师，问了一连串问题。老师回答不上来所有的，但记住了她眼睛里的光。\n\n《十万个为什么》则是以一问一答的形式介绍科学常识——为什么天是蓝的，为什么铁会生锈，为什么蒸汽能推动火车。读者来信挤满了编辑部的信箱，有些问题编辑们自己也不懂，就拿着信去请教大学里的教授。教授们被这些意想不到的问题激发了研究灵感，有个物理系教授在回完信后对同事感叹了一句：“我研究了半辈子物理，被一个四年级学生问住了。”同事问：“哪个问题？”她说：“为什么冬天脱毛衣会有火花。”后来这个问题被收入了物理学期刊的一篇科普文章。"
  roc.146.a: "画出新天地"

  roc.147.title: "动画"
  roc.147.desc: "上海美术电影制片厂在一个春天挂牌成立。厂址选在徐家汇，是一排红砖平房，院子里有几棵梧桐树。首任厂长是从香港回来的动画导演，他召集了全国最优秀的画师和编剧，其中许多人此前在电影业工作，有人画过进步漫画，有人做过美术教员。他对所有人说的第一句话是：“从今天起，我们做一件事——用画笔拍电影。不是给别人拍，是给我们的孩子拍。”\n\n他们制作的第一部动画短片是《大闹天宫》的试片片段。孙悟空在银幕上翻了个跟头，金箍棒一挥，凌霄宝殿的匾额应声而落。放映室里一片寂静，然后爆发出掌声。有人激动地说这就是中国自己的动画，旁边另一个人纠正道：“不，这是新中国的动画。”此后《大闹天宫》全片历时数年完成，孙悟空手绘动作的线稿堆满了整个工作室，仅他第一次挥舞金箍棒那几秒钟的镜头，画师们就在透写台上反复修改了无数张原画。每张画稿都在同事之间传阅检查，检查通过才被放进“定稿”的木托盘里。有一个年轻画师在完成一段天兵天将群像动作后，累得趴在透写台上睡着了，手里还握着笔。组长把自己的外套披在他身上，轻轻抽走那支笔，在画稿上注了一行铅笔字：“这一批全部合格。辛苦了。明天见。”\n\n《哪吒闹海》的剧本改编自传统神话，但编剧注入了新的精神——哪吒不再是反抗父权的悲剧英雄，而是为了保护渔民与恶龙搏斗的少年。他混天绫挥舞的轨迹参考了体操运动员的动作分解照片，东海波涛的线条曾反复试验了多种画法才最终定型。有个镜头是哪吒站在暴雨中的礁石上，画面定格了很久。一位编剧在审片时轻声评价：“他那一棒不只是为自己打的。”另一部作品《九色鹿》取材自敦煌壁画，画师们去莫高窟临摹了大半年，带回来的素描本堆起来有半人高。他们在一铺北凉时期的壁画前待了好几天，逐寸比对色彩的氧化程度，试图还原当初画师落笔时本来的颜色。厂长在看样片时说：“这鹿跑起来，像一阵风。”美术指导说：“鹿不是主角，慈悲才是。”\n\n《小蝌蚪找妈妈》是第一部水墨动画，让齐白石的虾蟹在银幕上游动。首映那天很多老画家哭了。齐白石的学生说，师父画了一辈子，没能看到自己的画动起来，现在他看到了。有个孩子散场后拉着母亲的手问：“小蝌蚪找到妈妈了，它的妈妈为什么和它长得不一样？”母亲还没来得及回答，孩子自己接了一句：“是不是因为它长大以后会变？”母亲蹲下来，平视着他的眼睛说：“它长大以后会变成妈妈的样子。但不是现在。现在它还是它自己。”\n\n《金色的海螺》是一个关于承诺的故事。渔夫的儿子在海滩上救了一只被海浪冲上岸的海螺，海螺化成一位少女，帮他织网、晒鱼、修理船桨，但她从不说话。少年每天早晨去赶海，少女站在礁石上等他归来。全片几乎没有对白，只有海浪声、海螺壳被风吹响的空鸣声，和脚踩在沙滩上的沙沙声。一个女孩看完后问母亲：“为什么她没有名字？”母亲想了想说：“因为她还没有被认出来。认出她的人，会给她起名字。”女孩说：“我叫她海螺。”\n\n这些电影后来被统称为“上美影早期作品”，但它们不只是作品。它们是一代人童年的底色。很多年后，有人问一个老画师：“你们当时画这些画的时候，在想什么？”他说：“没想什么，就是想给孩子们看好的东西。我们小时候没看过。”他停了停，又说：“现在我老了。但那几个镜头，我还能一笔一笔地再画一遍。不是照着原画描，是我还记得手怎么动。”"
  roc.147.a: "给孩子们看好东西"

  roc.148.title: "蒋巾帼的落幕"
  roc.148.desc: "蒋巾帼在宋庆龄赢得党内选举后，遵守了她在中央执行委员会上的承诺——“服从不是同意，但服从是纪律。”\n\n她没有退出革命委员会，没有流亡，没有组织地下反对派。她留在了南京，担任国防委员会常务委员，分管军事教育和军工生产。戴安澜继续指挥第七十三旅，后升任华东军区副司令。这支部队在统一战争中立下赫赫战功，但始终没有成为蒋巾帼的政治工具——戴安澜的忠诚给了革命，而非任何个人。\n\n蒋巾帼对宋庆龄的土地改革投了赞成票——不是因为她认同赎买式土改的温和节奏，是因为她在投票前对戴安澜说了一句话：“她的方案比我慢。但她的方案在潮汕已经证明可行。可行比快重要。”此后再未在公开场合挑战宋庆龄的政策。\n\n她在国防委员会的办公室里挂了一幅中国地图，标注着每一个五年计划的工业项目。地图上的标记逐年增多。她仍然相信计划，相信钢铁，相信数字。但她在日记里写过一段话：“我曾经以为革命只有一个答案。现在我明白了——革命可以有不同答案。只要这个答案是对的。她的答案，至少在目前，是对的。”"
  roc.148.a: "革命本该的模样"

  roc.149.title: "沉默的实干家"
  roc.149.desc: "宋娇仁是宋庆龄在党内最坚定的盟友，也是她最耐心的批评者。\n\n她在统一后担任了相当长时间的行政院职务，主持了战后重建、税制统一和全国选举制度化。她与宋庆龄的关系可以用一个细节来概括：每一次内阁会议结束后，她都会单独留下，把宋庆龄当天做出的决定逐条梳理一遍。不是质疑，是补充——哪一条需要国会授权，哪一条需要修改现行法规，哪一条需要司法审查。宋庆龄有一次笑着对她说：“你是我的行政院长，不是我的家教。”宋娇仁摘下眼镜擦了擦：“你如果嫌我啰嗦，我可以辞职。”“我不嫌。”\n\n佩丽卡先后担任立法院院长和最高法院首席大法官。她主持编纂的《中华民国法典》成为此后数十年间中国法律体系的基石。她在法典序言中写道：“这部法典不是革命的终点，是法治的起点。”宋娇仁读后说：“你写序言比我写得好。你的序言没有形容词。”佩丽卡没有回答。她已经在写下一部法典的草稿了。\n\n宋娇仁在她最后一届任期届满后没有寻求连任，将职务交给了一位年轻的后辈。她在交接时说：“不要把我写进党史。把制度写进去就够了。”"
  roc.149.a: "求同存异"

  roc.150.title: "CC系的转型"
  roc.150.desc: "陈晖洁在宋庆龄赢得党内选举后，主动求见了一次宋庆龄。\n\n会面只持续了很短的时间。陈晖洁将一份厚厚的名册放在桌上。名册上登记着CC系在过去数年间建立的基层党务网络——每一个县的党部、每一个工厂的支部、每一个学校的政治辅导员。她说：“这份名册，我交给您。您可以把它交给组织部，也可以把它留在档案室。我不再需要它了。您也不需要。您有制度，不需要名册。”\n\n宋庆龄没有接受这份名册。她说：“你的人不是为了我工作的。她们是为革命工作的。让她们继续工作。只是以后，她们不再听命于你，听命于宪法。”\n\n陈晖洁沉默了片刻，然后说：“好。”她站起来准备告辞，走到门口时停住，没有回头。“您是第一个没有接受我名册的人。也是第一个让我觉得，不接受是对的。”\n\n此后CC系逐渐从一个独立的派系转型为技术官僚的培养体系。陈晖洁被任命为行政院副院长，分管基层行政建设。她的组织才能被用在正途——不是党务监控，是基层治理。陈千语继续担任都城卫戍司令，但她逐渐将卫戍部队的日常指挥权交给了副手，自己专注于军事教育和纪律检查。\n\nCC系的转型并非毫无痛苦。部分中低层干部曾试图在地方上维持旧有的组织网络，但陈晖洁亲自下令清查，将不愿接受转型的人调离关键岗位。她在内部通报中写道："
  roc.150.a: "“我们以前管人。以后，我们管制度。”"

  roc.151.title: "中正社的衰落"
  roc.151.desc: "中正社在宋庆龄路线确立后走向了不可避免的衰落。\n\n胡宗南在宋庆龄赢得党内选举的当晚，独自一人在办公室里坐了一夜。她没有发动兵变——尽管她曾经想过。汤汤在第二天早晨推门进来，发现她趴在桌上睡着了，手边放着蒋介石的遗像。\n\n她最终选择了服从。不是服从宋庆龄——是服从何应晴的劝说。何应晴在那个关键的夜晚敲开了胡宗南的门，只说了几句话：“寿山，我认识你三十年了。你带兵打仗从来没输过。但你记住——打赢一场内战和打赢一场对外战争，写在历史上是不一样的。你如果在南京城里开第一枪，你的名字会和那些军阀写在一起。你如果放下枪，你的名字会和黄埔写在一起。你自己选。”\n\n胡宗南放下了枪。她以国防委员会委员的身份参加了新政府的军事整编，交出了中正社的独立指挥权。汤汤的清波寨子弟兵被编入国防军，编为一个独立旅，番号仍然保留“清波寨”。汤汤继续担任旅长，但此后不再参与政治。\n\n胡宗南没有接受任何荣誉职务。她在统一后请求调往西北边疆，担任边防军司令。她在离京前对汤汤说了一句话：“我去守边疆。南京的事，你替我看着。”汤汤说：“我看着。但我不替你说话了。”胡宗南笑了笑。那是她很久以来第一次笑。\n\n中正社作为一个政治组织被解散，但黄埔精神并未被消灭。它被转化——那些曾经效忠于蒋介石的将领们，在胡宗南的带头下，逐渐接受了对新国防军的忠诚。"
  roc.151.a: "军人总是很单纯的"

  roc.152.title: "蓝衣社的终结"
  roc.152.desc: "识之律者在宋庆龄赢得党内选举后，平静地接受了蓝衣社和军统被解散的命令。\n\n她用了几个月时间整理档案。那些积存多年的《需要清洗者》名单被她逐份封存，贴上封条，标注日期。她在最后一份档案上写了四个字——“任务终止。”然后她将钥匙交给了宋庆龄。\n\n宋庆龄问她：“你接下来做什么？”\n\n“继续做档案管理。安全档案需要有人维护。我不做清洗了，但档案本身是有用的。有些资料可以转给司法部，有些可以转给军事档案局，有些需要永久封存。给我一个档案室就够了。”\n\n宋庆龄同意了。识之律者转入国家档案局，担任安全档案处处长。她的新办公室比旧的小很多，但她似乎不在意。她的继任者回忆说，她每天早上八点准时到岗，晚上不加班——不需要加班了，清洗终止了。档案室的门牌从“军统”换成了“安全档案管理处”。门牌上的螺丝是旧的。她没有换螺丝。"
  roc.152.a: "至少不会再死人了"

  roc.153.title: "审判汪兆铭"
  roc.153.desc: "汪兆铭在梧州通电成立“西南政务委员会”后，与广西总督府的合作并未持续多久。随着广府统一全国的进程推进，广西总督府在军事压力下被迫投降，汪兆铭失去了最后的庇护所。\n\n之后汪兆铭逃到了樱花国寻求庇护，甚至成立所谓“中华民国流亡政府”，不过这一切都随着我们军事上的胜利而终结，而汪兆铭这一次终于落网。\n\n她被捕后被押送南京，以叛国罪受审。审判是公开的，全程记录在案。汪兆铭在庭上为自己辩护，态度强硬。她说：“我做的每一件事，都是基于革命原则。你们说我叛国——我只是选了另一条路。”\n\n法庭判处她终身监禁。宋庆龄没有特赦她，但也没有批准死刑。她在内部讨论中说：“汪兆铭不是普通的叛徒。她是一个曾经为革命做过贡献的人。她的罪行要受到审判，但她曾经做过的事不能被一笔勾销。让她活着。让她看到革命还在前进——哪怕她不愿意承认。”\n\n汪兆铭在狱中度过了余生。她拒绝写悔过书，但她在监狱图书馆里写了一本关于国民党早期历史的回忆录。这本书后来被出版，扉页上印着编者的按语——“作者曾犯叛国罪，已被审判。本书作为历史资料出版，不代表对作者政治立场的认可。”"
  roc.153.a: "用她的后半生赎罪"

  roc.154.title: "最好的同志"
  roc.154.desc: "毛润芝是最后一个离开四川红军根据地的人。\n\n改编协议签署后，她在办公室里坐了整整一夜。桌上摊着一张中国地图，上面用铅笔标着红军长征的路线——从湘江到贵州，从贵州到川北，每一个箭头都是她亲手画的。天亮时，她把地图叠好，放进挎包。然后带着她的调查报告下山，赴南京就任农村土地改革委员会副主任。\n\n她的工作方式没有变。到任后第一个月，她就带着一个三人小组下乡，去了苏北三个县，回来时带回一份六十页的调查报告，详细记录了赎买式土改在实际操作中遇到的问题：地价评估偏高、债券兑现周期过长、部分地方干部偏向地主。报告直接呈送宋庆龄。她看完后批复：“所提问题属实。即令财政部、农业部联合整改。”\n\n此后的数年间，毛润芝成为宋庆龄在农村问题上最倚重的专家。两人的合作并不亲密——毛润芝从不参加南京的社交活动，宋庆龄也从不邀请她——但她们在公文往来中建立了一种基于事实的信任。她的调查报告从不修饰，她的批复从不拖延。\n\n她的政治立场从未改变。在党内会议上，她仍然为工农专政辩护，仍然批评混合经济是“资本与劳动的暂时休战”。但她在公开场合将这些批评严格限定在政策讨论范围内，从不攻击宪政体制本身。她对自己的部下说过一句话：“南京的政府不是我们的政府。但南京的土改，是我们能参与的最好的土改。”\n\n她晚年主持编纂了《中国农村经济调查》，五卷本，记录了中国农村在土改前后的变迁。她在序言中写道：“革命有不同道路。有的路是枪杆子走出来的，有的路是选票走出来的，有的路是锄头走出来的。我这一生只走了锄头这条路。”有人问她，这句话是对谁的回应。她没有回答。但读过的蒋巾帼在日记里写了一句：“她在对我说。”"
  roc.154.a: "三农问题高于一切"

  roc.155.title: "黍先生"
  roc.155.desc: "黍没有离开四川。\n\n红军改编后，大部分干部随部队东调，黍主动请求留在四川。她的理由只有一句话：“这里的农民刚学会种改良稻。我走了，谁来教她们种第二季？”\n\n她是福建人，在来四川之前是帝国最年轻的农业专家。她在福建设计改良农具时，农民叫她“黍先生”；她在四川组织最早的农民运动时，同志叫她“黍大姐”；现在她在四川继续她的农技推广站，农民叫她“黍老师”。她对每一个称呼都答应。但她最愿意答应的，还是第一个。\n\n统一后的第一个春天，她收到了宋庆龄亲笔签署的委任状，任命她为四川农业试验站站长。委任状里夹着一张便条，笔迹端正：“您在四川的工作，我在南京听说了。革命不只是枪炮和法令，还有种子和肥料。您在做的是革命最基础的事。”\n\n黍把便条收在抽屉里，没有回信。她太忙了。春耕在即，试验站新培育的改良稻种需要在三个县推广，她每天骑着一辆旧自行车往返于田埂之间。她的妹妹年从上海来看她，发现她的宿舍里只有一张床、一张桌子和一墙的稻穗标本。年说：“姐，你可以去南京当部长。”黍正在整理稻穗标本，头也不抬：“部长有人当。种地的人不够。”\n\n她在四川工作了后半生。她的改良稻种推广到七个省，她编写的《丘陵地区水稻栽培手册》成为全国农技推广的通用教材。她的学生在各地农业部门担任技术骨干。她没有加入过任何党派——当初在四川根据地时，毛润芝曾邀请她入党，她摇头。现在统一了，宋庆龄派人来问她是否需要什么荣誉，她也摇头。她只需要试验站的那块水田，以及每年秋天能收到学生的来信。"
  roc.155.a: "先生大义"

  roc.156.title: "马克思主义的新春"
  roc.156.desc: "张雯甜在统一后的角色是尴尬的。\n\n她是中共党内最精通马克思主义理论的人之一，曾留学苏联，通晓多国语言，在遵义会议上为确立毛润芝的党内领导地位作出过关键贡献。但她不是一个能在战场上指挥千军万马的人，也不是一个能在田埂上和农民一起种地的人。她是一个理论家。在革命战争年代，理论家是奢侈品；在建国后的宪政体制下，理论家似乎也找不到太合适的位置。\n\n她被安排在新成立的中央编译局担任局长，负责翻译马列主义经典著作和编辑党史文献。这份工作在行政级别上不算低，但在政治影响力上几乎是隐形的。她的办公室与千代桃的革命历史编撰委员会只有一墙之隔，但两人很少交流——千代桃在写历史，她在翻译历史。写历史的人有权力定义历史，翻译历史的人没有。\n\n她在编译局工作了多年，主持翻译了《资本论》全译本和《列宁全集》选译。她的翻译严谨而优美，被学界公认为中文马克思主义经典文献的标杆。但她始终没有走出那个安静的办公室。她在日记里写过一段话：“我翻译了马克思对资本主义的批判，但我没有批判过南京的资本主义。不是因为我不敢——是因为我不知道批判了之后，我应该提出什么替代方案。在这一点上，我不如毛润芝。她至少知道锄头比枪炮更有效。”\n\n她晚年主动要求调往大学任教，讲授马克思主义哲学。她的课很受学生欢迎，不是因为她讲得生动——她讲得极其严肃——是因为她从不拒绝学生的质疑。有一次一个学生问她：“张老师，您自己的政治立场是什么？”她沉默了片刻，然后说：“我信仰马克思主义。但我这辈子没有为它做成一件事。你们这一代人，也许能。”这句话被学生记在笔记本上，后来被出版在张雯甜的一本纪念文集里。"
  roc.156.a: "张雯甜老师，我还记得你"

  roc.157.title: "《中国革命史》"
  roc.157.desc: "千代桃的命运与蒋巾帼的选择紧密相连。\n\n蒋巾帼在宋庆龄赢得党内选举后，没有退出政治舞台，但她再也没有推动过苏维埃化的政治议程。千代桃作为莫斯科派在党内的核心人物之一，也随之失去了大部分政治操作空间。\n\n她没有被清洗。宋庆龄不会清洗任何人。但她在中央宣传委员会的职务被调整了——她保留了委员职务，但不再主持日常工作。她的主要精力被转移到革命历史编撰委员会，负责编纂《中国革命史》。\n\n她对这项工作是全身心投入的。她的办公室在编撰委员会大楼的顶层，窗台上摆着一盆从未开过花的绿植。墙上挂着一幅中国地图，上面标注着从辛亥革命到统一战争所有重大战役的地点。她每天早上第一个到办公室，晚上最后一个离开。工作人员说，她校对史料的方式像是在检查一份重要的情报——每一个日期都要交叉验证，每一个名字都要反复确认。\n\n但她始终没有加入宋庆龄的宪政框架。她在编撰委员会的职务是技术性的，不是政治性的。她在统一后多年的政治生活中只公开发表过一次演讲——在《中国革命史》第一卷出版的发布会上。演讲中她提到蒋巾帼时措辞谨慎，说她是“一位在中国革命的不同阶段作出过不同贡献的同志”。台下有记者追问：“您认为蒋巾帼同志现在还在作贡献吗？”她回答：“她在工作。工作就是贡献。”\n\n她没有结婚，没有子女，没有私人生活。她的全部身份就是“中国革命史主编”。她死后，工作人员在她的办公桌抽屉里发现了一封没有寄出的信，收信人是蒋巾帼。信的正文只有一句话：“我们都曾经相信过。这就够了。”"
  roc.157.a: "给我来一本"

  roc.158.title: "中苏交流的桥梁"
  roc.158.desc: "吉田优在统一后继续留在南京，担任苏联驻华大使馆文化参赞。这不是她主动选择的位置——共产国际在宋庆龄路线确立后调整了驻华人员配置，将她从政治顾问转为文化联络官员。她的新工作内容包括组织中苏文化交流活动、协调苏联书籍的中文翻译、以及处理留学生事务。\n\n她对这一调整没有表现出任何不满。她从来不是那种会主动表达不满的人。她的好友千代桃曾私下问她：“你不觉得这是降级吗？”吉田优想了一会儿，回答：“降级没关系。只要还在中国。”\n\n她在中国生活的年限加起来已超过她在苏联生活的年数。她的中文学术著作在翻译界享有盛誉，她主持翻译的列宁著作中译本至今仍是中文标准版本。她晚年写了一本回忆录，书名为《我在中国的这些年》。书中有这样一段话：“我出生在樱花国，入籍在苏联，但我的心留在了中国。不是因为中国比别的地方更好——是因为在中国，我找到了我应该做的事。”\n\n她在回忆录中也提到了千代桃：“我们之间有过分歧，有过争吵，有过很长时间的沉默。但她是我这一生最好的朋友。我从来没有告诉过她——她每一次犯错误的时候，我都想替她分担一半。但她总是自己扛着。她就是这样的人。”\n\n她退休后没有回苏联，也没有回樱花国。她留在南京，住在千代桃隔壁。每天早上她会去千代桃的办公室敲门，不是为了办事，只是确认她还活着。敲门后她会在走廊里站一会儿，等到里面传来千代桃的声音——“进来吧，门没锁。”然后她才推门进去。有时带一壶茶，有时带一份新到的俄文报纸。她们就这样，在走廊的两端，各自老去。"
  roc.158.a: "？！拉拉！？"

  roc.159.title: "革命先行者"
  roc.159.desc: "陈独秀是宋庆龄时代最早被边缘化的政治人物之一，也是最坦然接受这一结果的人。\n\n统一后，中共作为合法政党进入宪政框架。陈独秀作为党的创始人之一，在党内保留了名誉职务——中央党史编纂委员会顾问。这个职务没有实权，没有下属，只有一间安静的小办公室和一个年轻助手。她每天来办公室读书、写信、会老友。她不再参加任何决策会议。不是被排挤，是她自己不想去了。\n\n她在辛亥革命时期的错误——对武装斗争形势的盲目乐观、未能及时领导工会转入地下、导致数以万计的工会成员被帝国屠杀——在党内从未被正式追责，但也没有被遗忘。她自己在一次党内会议上说：“我是一个活着的教训。我活着，就是为了让年轻人记住——革命不能用希望来代替分析。”\n\n她与千代桃的关系在晚年有所和解。两人曾在辛亥革命时期并肩战斗，也曾在革命失败后互相指责。多年后的一个秋天，陈独秀独自去了千代桃的办公室。两人对坐了很久，没有说话。陈独秀先开口：“我在编纂党史的时候，翻到我们当年的通信。你写得比我好。”千代桃没有抬头，只是说：“我们都犯过错。你的错误是公开的，我的错误也是公开的。两个公开犯过错误的人，不需要道歉。”陈独秀点了点头。从那以后，她每周来一次。\n\n她的余生致力于整理中共早期文献。她主编的《中共早期文件汇编》共十二卷，详细记录了中共从成立到统一战争期间的所有重要文件和会议记录。她在编后记中写道：“这部汇编不是为了歌颂什么，也不是为了批判什么。它就是为了记录。记录我们当初是怎么想的，怎么做的，哪些做对了，哪些做错了。让后来的人自己判断。”\n\n她死在办公室的书桌前，手里还握着一支钢笔。助手发现她时，桌上摊着一份正在校对的文献——1921年中共一大会议记录。她校对到的那一行是她的发言："
  roc.159.a: "“中国革命的希望，在于工人。”"

  roc.160.title: "老将军的执念"
  roc.160.desc: "陈世涛是改编谈判中最难谈的一个。\n\n她不是毛润芝那种愿意用调查报告说服南京的人，不是黍那种只关心稻穗的人，不是张雯甜那种在理论上较真的人。她是一个军人，一个在四川群山里打了多年仗的红军将领，一个曾经放弃帝国军官身份、把自己整支部队带进革命的人。她唯一信任的逻辑是实力，她唯一接受的谈判语言是条件。\n\n她的条件不多，但每一条都很硬：她指挥的川北红军改编后不编入国防军常规序列，编为川北独立师，师长必须由她本人担任；四川地区的地方政权在过渡期内保持一定的自治权，她有权对地方行政长官的任命提出否决；她的部队不接受外部派遣的政工人员，政治教育由她自行负责。\n\n宋庆龄派去谈判的代表是宋娇仁。宋娇仁在当地花了近一个月和她逐条拉锯，最终达成妥协：川北独立师暂编入国防军序列，但编制和指挥链保持相对独立；四川自治权限期较长，期限届满后需逐步与中央体系统一；政工人员暂不派遣，但需接受中央派出的联络组。\n\n陈世涛在协议上签了字。签字仪式结束后，她送给宋娇仁一把缴获的旧式指挥刀——那是她当年在川北战役中从一个帝国将领手里缴获的。她在交接时对宋娇仁说：“这把刀我留了好多年。现在我把它交给你。不是投降。是你们证明了这个国家可以不用刀来管。”宋娇仁双手接过刀：“我会把它放在国民议会的大厅里。不是作为战利品——是作为证明。”\n\n此后，陈世涛在川北独立师师长的位置上继续工作了很多年，从未离开她带出来的那支部队。川北独立师的番号一直保留到全军统一整编完成，届时她将交出指挥权，由国防部重新任命新师长。交接那天，她站在操场上看自己带出来的兵最后一次列队。她没有发表讲话，只是在部队解散后，一个人绕着操场走了一圈。她走得很快，像行军。然后她骑马离开了驻地。"
  roc.160.a: "马背上，她的背挺得笔直。"

  roc.161.title: "“袁小头”的终结"
  roc.161.desc: "袁克定是宋庆龄统一战争中最后一个被俘获的对手。\n\n徐州战役结束后，她的北方军在野战中被分割包围，精锐的第一师在炮火中溃散。她本人率残部退入徐州城内，坚守多日。当国民军的劝降代表抵达时，她提出一个条件：我要见你们的统帅。\n\n来见她的是何应晴。\n\n何应晴进城时没有带卫兵。她和袁克定在徐州城防司令部的空荡荡的会议室里对坐了很长时间。没有人知道她们谈了什么。据何应晴的副官记录，她进城时表情沉重，出城时表情更沉重。她只说了一句话：“她同意交出指挥权。条件是不审判她的部下。”宋庆龄批准了这个条件。\n\n袁克定在南京被拘留，等待审判。审判之前，宋庆龄去看了她一次。两人的对话极为简短，但双方都清楚对方在说什么。袁克定在谈话即将结束时问了一句话。宋庆龄的回答没有被官方记录，但宋庆龄走出拘留所后对随行人员说了一句话：“她没有道歉。但她问了我一个她本来不需要问的问题。这就够了。”\n\n袁克定被终身监禁。她在监狱里的日子很平静——读书，写字，偶尔通过律师给她曾经的旧部写信，信的内容大多是关心她们的生活，从不涉及政治。她终生没有承认自己的罪行。但她在狱中写过一段话，后来被出版在她的回忆录附录里。她写道：“我和我母亲走的是同一条路。这条路通向的不是我们想要的那个国家，而是一个我们不能理解的、新的人间。我不能说这条路是错的，因为我也在这条路上走了一辈子。但我可以说——走这条路的人，到了终点以后，只剩一个人。”"
  roc.161.a: "好好改造，重新做人"

  roc.162.title: "农工民主党的新生"
  roc.162.desc: "农工民主党是宋庆龄宪政框架内最稳定的左翼力量之一。\n\n在统一战争期间，农工民主党已在国会中赢得二十七席。统一后，随着全国选举的铺开，这个数字稳步增长。它的社会基础——自耕农、产业工人、进步学生——正是宋庆龄土改和劳工政策最直接的受益群体。农工民主党在国会中支持宋庆龄的土改法案和劳工保障制度，同时也提出自己的修正案，要求在合作社立法中增加对自耕农的保护条款，在工厂巡查制度中赋予工会更大的监督权。\n\n党主席赤羽被任命为行政院劳工部长。这是她期待已久的岗位——不是在议会里辩论理论，是在工厂里推行制度。她在任内主持完成了全国工厂安全标准的制定，推动建立了工伤保障基金，并在各工业城市设立了由劳资双方代表共同组成的劳动仲裁委员会。她的工作风格被同僚形容为“温和而固执”——温和是因为她从不拍桌子骂人，固执是因为她在每一项条款上都寸步不让。\n\n农工民主党内部的激进派在宋庆龄路线确立后经历了一段迷茫期。部分前中共党员出身的激进成员曾试图推动更为彻底的国有化议程，但在赤羽的坚持下，党内达成了共识：在宪政框架内推动渐进改良，比在街头高喊口号更有效。一位激进派议员在国会辩论中站起来质询赤羽，问的正是这个问题。赤羽的回答是：“我的父亲是佃农，我的母亲是缫丝女工。我进金陵女子师范的第一年，连食堂在哪里都不敢问，因为我怕别人笑我说话有土音。我用了大半辈子学会为农民和工人说话。如果你觉得在国会里为她们说话不算革命，那你告诉我——在哪里说，才算？”质询者没有回答，但她在投票时投了赞成票。"
  roc.162.a: "革命容得下不同的声音"

  roc.163.title: "过江龙"
  roc.163.desc: "致公党是宋庆龄宪政框架中最特殊的一员。它的政治主张——“强省弱央，因地制宜”——在统一战争期间曾被北方斥为“割据”，但在统一后的宪政体制下，这一主张找到了合法化的路径：地方自治。\n\n党主席钟岚珠在统一后出任行政院地方自治委员会主任。她的就职演说只有一句话：“我不是来削弱中央的，我是来加强地方的。中央和地方不是敌人，是合作伙伴。”她在任内推动通过了《地方自治法》，明确划分了中央与地方的财权与事权。她在谈判桌上与宋娇仁有过无数次交锋——宋娇仁主张中央保留更多财政调配权，钟岚珠坚持地方需要更大的税收自主。两人在谈判桌上拍桌子，散会后一起去巷口吃面，拌嘴的内容从联邦制优劣一直延续到面汤的咸淡。\n\n她在任内的另一项重要贡献是利用自己的侨商网络，为战后重建募集了大量海外投资。她以自己的信用和家族背景为担保，吸引南洋华商回国设厂。佩丽卡在核算这些投资项目时发现，钟岚珠从未在任何一项投资中抽取个人利益。佩丽卡问过她这件事，钟岚珠摇着檀香折扇回答：“我家里已经够有钱了。我缺的不是钱，是一个让我赚来的钱对得起列祖列宗的去处。”"
  roc.163.a: "革命容得下不同的声音"

  roc.164.title: "身体吃饱了，精神也要吃饱"
  roc.164.desc: "公民自由联盟在统一后的宪政体制中扮演了文化界和知识界的旗手角色。它的政治主张——自由主义与民族复兴并重——使其成为宪政框架内最具活力的民间声音之一。她们支持言论自由和学术独立，同时也强调中国文化的独特价值，反对全盘西化。\n\n洛天依没有选择进入政府任职。她拒绝了宋庆龄亲自发出的教育部长提名，理由很简单：“我可以用笔做的事，不需要用官印来做。”她继续主编《自由谈》周刊，在统一后的宽松环境下，这份刊物成为全国最具影响力的文化评论阵地。她在创刊社论中写道：“革命结束了。现在开始的是更漫长的工程——让每一个中国人学会自己思考。枪炮打不出自由，法律可以保护自由，但真正让自由活下来的，是每一个独立思考的人。”\n\n她主持的“收音机进万家”计划在统一后被纳入全国文化普及工程。她促成了全国广播网的建立，使偏远地区的农民也能收听到新闻、音乐和教育节目。她在一次广播节目的开播致辞中说：“我出生在上海的书香门第，我的童年是在线装书的墨香里度过的。今天我站在这里对着话筒讲话，不是因为我想取代线装书——是因为我相信，一个识字的农民和一个读博士的教授，在上帝面前是平等的。在真理面前，也是平等的。”"
  roc.164.a: "革命容得下不同的声音"

  roc.165.title: "保护我们的文化遗产"
  roc.165.desc: "公车党是宋庆龄宪政框架中最沉重的历史遗产。它的前身是康佑薇和梁启超领导的维新派，是神州帝国晚期唯一的合法改革力量。在帝国覆灭、统一完成的新时代，公车党面临着一个根本性的问题：当君主制已经不复存在，一个以“复古维新”为根基的政党还有什么存在的意义？\n\n康佑薇在统一前已经逝世。她在生命的最后几年里，仍试图在帝国的废墟上守住最后一丝改革火种。她逝世后，公车党内部发生了一次深刻的转型。新党首符华——康佑薇的关门弟子——做出了一个艰难的决定：放弃“复古维新”的旧纲领，将公车党重新定位为“传统与宪政的桥梁”。她在党内大会上说：“师父一生所求，是为古老帝国寻一条新生之路。帝国死了，但师父的路没有死。那条路不是回到过去，是从过去走向未来。君主没有了，但君主的消失不是我们放弃的理由——是我们重新出发的理由。”\n\n转型后的公车党在宪政体制中获得了新的定位：它成为传统文化保护和乡村建设领域最专业的政治力量。符华本人被任命为文化遗产委员会主任。她以学者的严谨和改革者的热情，主持了全国文物普查和传统村落保护工程。她在一次公众演讲中说：“革命可以推翻一个旧世界，但革命不能推翻过去。过去是我们的根。一个没有根的国家，走不了远路。”\n\n部分不愿接受转型的旧派成员脱离了公车党，组成了一些无关紧要的君主制研究团体，在南京城郊的旧宅里继续撰写已经没有人读的立宪君主制论著。符华没有阻止她们。她说：“让她们写。她们写的东西，也是过去的一部分。过去不需要被消灭，只需要被理解。”"
  roc.165.a: "革命容得下不同的声音"

  roc.166.title: "青年党的处境"
  roc.166.desc: "青年党是统一后最引人注目的反对派。它的民族主义立场——“摆脱一切外国束缚，实现民族完全独立”——在宋庆龄的外交政策中既有共鸣也有冲突。宋庆龄的不结盟外交原则得到了青年党的热烈支持，但宋庆龄对列强的务实合作态度——尤其是与圣杯签订贸易协定、与苏联保持有限合作——被青年党批评为“不够彻底”。\n\n青年党的代表人物汉阳造在统一后继续担任国防工业的高级工程师。她主持的国产武器研发项目在统一后获得了更多资源，她设计的迫击炮座钣技术被推广到全国各兵工厂。她的政治立场从未改变——她仍然相信中国必须在军事技术和工业体系上彻底独立。她在一份内部报告中写道：“宋主席的不结盟是第一步。第二步是让别人不敢来结盟——因为你太强了。”\n\n青年党在国会中是一个活跃的反对派，批评政府的妥协倾向，也监督政府的民族工业政策。她们从未赢得多数席位，但她们赢得了尊重——因为她们批评政府的方式不是捣乱，是提案。一个青年党议员曾就一项与圣杯的技术合作协议连续质询外交部长三个小时，质询结束后，外交部长私下承认：“她问的每一个问题都是专业问题。我准备了很长时间才勉强答上来。”"
  roc.166.a: "革命容得下不同的声音"

  roc.167.title: "尊王派的落幕"
  roc.167.desc: "尊王派是宋庆龄宪政体制中最尴尬的存在。他们的核心信念——“皇权是神州能够保持存在的柱石”——在帝国覆灭后彻底失去了现实依托。永和帝蒋丽华在统一后被安置在南京一处安静的宅院里，以普通公民身份生活。她的存在本身就是一个无声的证明：君主制已经彻底成为历史。\n\n重岳在统一战争中作出了自己的选择。当北伐军逼近山西时，他没有选择为帝国陪葬，而是接受了黎星刻的劝说，率部起义。他的部队被编入国防军，他本人在战后被任命为国防部高级顾问。他在新政权中保持了沉默——不是不满，是不习惯。他对新政府的唯一评价是在离职申请上写的一句话：“我这一生尽忠过旧帝国，也效忠过新民国。忠不忠，不是看忠于谁，是看做事有没有对得起穿这身军装。”\n\n乐正绫在统一后将自己的艺术事业推向了新的高峰。她主持的“新国乐运动”被纳入全国文化复兴工程，她创作的《黄河大合唱》成为全国广播网的开播曲目。她对政治的态度始终疏离而友善——她认识所有重要政治人物，但从不参与任何政治讨论。她在一次采访中被问到自己的政治立场，她想了想说：“我的政治立场是——让每一个拉黄包车的人，在收工后能听一场音乐会。如果有一天，拉车的人觉得音乐会和他没关系，那就是我工作的失败。”她始终带着徽墨与素描簿，在苏州河畔写生。她的画布上有码头工人的背影，也有抽象的光影。她说，这两种东西从来不应该分开。"
  roc.167.a: "千年帝制已终结"

  roc.168.title: "黎星刻的命运"
  roc.168.desc: "黎星刻的命运是在蒋丽华的命运被决定之后才被决定的。\n\n蒋丽华被安置在南京后，宋庆龄亲自处理了黎星刻的问题。他没有被当作战犯——他从未向革命军开过一枪，他的京城新军卫所在帝国崩溃前就已经被袁克定的北方军缴械。他也不是旧帝国的顽固分子——他是梁启超的关门弟子，是帝国末年最年轻的改革旗手。他是一个尴尬的人，一个旧时代与新时代之间找不到位置的人。宋庆龄给了他两个选择：以普通公民身份在南京定居，或者在国防部担任军事教育顾问。他选择了后者。\n\n他后来和蒋丽华结婚了--不是作为皇帝和亲王，而是中华民国的两个普通公民。宋庆龄没有出席婚礼，但是送去了亲笔写的祝福：“这是旧帝制的终结，也是新中国的开端。”"
  roc.168.a: "革命容得下不同的声音"

  roc.169.title: "中共自治区的遗留问题"
  roc.169.desc.head: "根据先前达成的协议，我们与中共达成了妥协：中共自治区享有较长的自治过渡期，期满后逐步纳入中央体系；中央暂不派驻政工人员，仅设立常驻联络组。\n\n"
  roc.169.desc.song: "$roc.169.desc.head$然而，随着政治协商会议的组建与宪法的颁布，国家政治民主化与军队国家化的宏伟蓝图正逐步成为现实。在这一大背景下，宛如“国中之国”的中共自治区便显得格外刺眼，俨然成了全国统一政令的最后障碍。\n\n面对这一僵局，作为联省自治运动曾经的领袖，钟岚珠提出了一个颇具胆识的方案。她主张在全国范围内全面推行“省自治”：“只要我们在其他省份率先实现省自治，她们就不得不顺应大势，接受相同的自治框架。届时，所谓的‘中共自治区’自然会融汇入统一的全国体制之中。”这一提案在各民主党派中赢得了广泛支持，但其背后隐现的联省主义复兴势头，也让中央官僚们心生警惕。\n\n与此同时，国民党代表们则抱持着截然不同的态度。他们认为四川自治本就是过渡时期的产物，既然如今国家已实现民主立宪和进行社会主义建设，中共此前担忧的专制隐患早已不复存在，自然没有理由继续维持割据状态。政府应当乘胜追击，向中共施加政治压力，促使其完全融入中央政府的治理体系。"
  roc.169.desc.jiang: "$roc.169.desc.head$然而，自蒋主席就任以来，政府的政策路线正不断向苏联体制靠拢。党内的激进派认为，既然两党在目标上高度一致，“一家人自然没必要吃两家饭”。他们主张恢复当年国民党改组时的先锋队体制，推动两党彻底合并——既然大家目标相同，自治区也就没了存在的必要。\n\n温和派则主张保持克制。他们认为两党虽同属社会主义路线，但在具体细节上仍有不同，保留革命友党依然有其价值。不过双方在一件事上达成了共识：为了中国革命的全局，割据式的自治状态绝不能再维持下去了。"
  roc.169.desc.yufu: "$roc.169.desc.head$自宋总理组阁以来，国家宪政已入正轨，军队国家化稳步推进，国民党也转型为遵从议会规则的民主政党。我们确实实现了当初承诺的民主共和。\n\n在此形势下，议会里的激进派提出了更进一步的主张：军队理应完全属于国家，绝不应当由任何政党私有。他们希望全面落实军队国家化，将中共的部队划归国防部统一编制，并结束地方自治。如此一来，中共便能作为纯粹的政党全面进入议会，在议席与竞选上展开公平竞争。\n\n但议会中理性的声音则主张克制。他们指出，政府的信用建立在恪守协议之上，若中央率先毁约，反倒会破坏刚建立的法治基础。只要我们把议会民主建设好，在大势所趋之下，对方自然会融入这套体制，根本无需急于一时。"
  roc.169.a: "我想，地方自治一直是我们的梦想。"
  roc.169.b: "民国已经立宪了，你还没收到通知吗？"
  roc.169.c: "既然大家都是同志，何必还要分彼此？"
  roc.169.d: "求同存异是合作的前提，但政令统一是革命的底线。"
  roc.169.e: "军队归于国家，政党应在国会发声！"
  roc.169.f: "如果我们连先前的协议都不遵守，又何谈民主呢"

