  ROC_focus_current_ism: "现今之主义"
  ROC_focus_current_ism_desc: ""
  ROC_focus_canton_adm: "广府政务"
  ROC_focus_canton_adm_desc: "残缺的“党国”体制运行日久。困于党内长期的半分裂状态，我国在党务与地方建设上依旧停滞不前，山雨欲来，重建一个高效运作的党政府迫在眉睫——或者将这条将党置于国家至上的道路彻底推翻。"
  ROC_focus_crush_corrupted_pests: "拍蝇打虎"
  ROC_focus_crush_corrupted_pests_desc: "显而易见的是，如今的国党行政体系存在着系统性问题——在各路派系的庇护之下，形形色色的保护伞与在其庇护之下作威作福的腐败官员们正困扰着司法和党务体系。这也只能用系统性的审判与清洗活动解决。"
  ROC_focus_efficient_bureaucracy: "提高政府效率"
  ROC_focus_efficient_bureaucracy_desc: "各个党内派系都广泛地影响着文官政府的运作。任何一次政治异见者的冲突都有可能导致国民政府的停摆，我们不能任凭这种情况继续下去——哪怕这意味着将打破这脆弱的平衡。"
  ROC_focus_grand_makeover: "焕然一新"
  ROC_focus_grand_makeover_desc: "我们对于行政部门的改革卓有成效，至少目前暂时不用再担心来自内部的掣肘了...暂时的。"
  ROC_focus_combat_cholera_outbreak: "处理霍乱"
  ROC_focus_combat_cholera_outbreak_desc: "作为经济危机的先声，这场肆虐的瘟疫正在缓慢地瓦解公众信任。好在如今疫情已经得到控制。彻底解决霍乱的威胁将有助于重建民众对经济重振的信心。"
  ROC_focus_shin_eisei: "建立新卫生体系"
  ROC_focus_shin_eisei_desc: "在广州乡村与近期处理瘟疫影响的实验为我们提供了关于卫生体制改革的宝贵经验。一套崭新的国家卫生制度将确保我国能够更加有效应对各类传统的瘟疫问题。"
  ROC_focus_fukushi_hajime: "初步社会保障"
  ROC_focus_fukushi_hajime_desc: "既然党控制着国民经济的方方面面，那也就没有理由在福利保障的问题上对民众闪烁其词。在全粤人民对革命彻底失望之前，应当开始规划全国社会保障制度的未来蓝图——哪怕现在能够实现的部分相当有限。"
  ROC_focus_gunshu_sesshoku: "接触群众"
  ROC_focus_gunshu_sesshoku_desc: "战后对革命战争的前景感到失望的社会活动家大多转而尝试在各地进行与推广各式的农村社会实验，但仍然将复兴党国作为首任的各派党内人士长期对乡村重建怀有轻视甚至是蔑视的态度。这使得如今广州乡村依然困于宗族地主与绿林强盗的袭扰。好在如今我们仍有丰富的实验成果可供学习。只是这意味着我们必须重新将目光放在扎根于粤地数百年的广大农民身上。"
  ROC_focus_akuba_seiatsu: "制服恶霸"
  ROC_focus_akuba_seiatsu_desc: "在战败的国民政府的默许下，在十年间各地的武装民团与匪徒在乡间重新滋长并进行着让百姓苦不堪言的压榨与剥削，我们必须重拾打倒封建主义的决心，再一次对其进行坚决的清剿。"
  ROC_focus_jun_gunji_douin: "发动准军事组织"
  ROC_focus_jun_gunji_douin_desc: "以清波寨为首，民间依旧不乏仍然心向革命的民团武装，这些准军事组织可以考虑逐渐纳入国民革命军体系之中，或者单纯在战争中征召她们的力量。"
