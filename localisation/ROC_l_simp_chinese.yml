  ROC_trade_boom: "贸易繁荣"
  ROC_trade_boom_desc: "广东的繁荣不是建立在意识形态之上，而是建立在贸易之上。自从广府国民政府退回广东，八年来，政权赖以生存的不是税收，不是外援，是珠江。每天清晨，码头工人从西堤一直排到沙面，装卸来自世界各地的货物。圣杯国人管着香港，但广东人管着通往香港的水道。\n宋教仁说过一句话：“帝国封锁了我们的陆路，列强控制着我们的海关。但珠江在我们手里。只要珠江还在流，广府就还活着。”\n但繁荣也有它的代价。贸易财富集中在少数人手里，西关的富商们在茶楼里一掷千金时，河南的纺织女工每天工作十二个小时却买不起一匹自己织的布。蒋巾帼在内部会议上说过：“贸易繁荣养活了广府，但也养肥了资产阶级。革命不能永远靠买办活着。”宋教仁回应：“革命也不能饿着肚子活着。”"
  ROC_northern_expedition_regret: "北伐遗恨"
  ROC_northern_expedition_regret_desc: "“郑州。花园口。黄河大堤。洪水。一九二七年四月十二日。”\n\n这些词在广府，不需要解释。每一个老兵都知道它们意味着什么。北伐军势如破竹地打到中原腹地，然后袁克定炸开了花园口大堤。洪水卷走了北伐军的主力，也卷走了蒋介石。她的尸体从未被找到。有人说她被洪水冲到了下游，有人说她死在乱军之中，有人说她根本没有死——但这种说法在公开场合从不被允许讨论。\n八年过去了。广府养好了伤口，重新整编了军队，甚至让经济恢复了表面的繁荣。但郑州的账，还没有算。每一个从北伐战场上活着回来的老兵，都在等待第二次北伐的命令。而每一个没有回来的老兵，她们的名字被刻在广州东郊的忠烈祠墙上，每年清明都有人去烧纸。烧纸的人一年比一年少。仇恨没有少。"
  ROC_factional_strife: "派系林立"
  ROC_factional_strife_desc: "北伐后八年内，革命委员会、宪政同志会、中央俱乐部、黄埔中正社、蓝衣社、改组派——六派共治的格局逐渐成形。她们共享同一面青天白日旗，却在每一个重大问题上各执一词。宋庆龄主张渐进土改，蒋巾帼主张中国苏维埃化，宋教仁主张议会道路，陈晖洁忙着建她的党务网络，胡宗南守着黄埔的牌位，识之律者在暗处整理档案。何应钦是三军总司令，她不属于任何一派。但每一次各派在会上吵得不可开交时，她都在场，沉默地坐在最靠门的位置。\n这种格局在平时是相互制衡的议会政治，在战时是一场灾难——除非，有人能在战争爆发前，让其她五派都听她的。或者，有人能在战争爆发后，让其她五派都不再需要存在。"
  ROC_island_of_freedom_and_democracy: "自由与民主的孤岛"
  ROC_island_of_freedom_and_democracy_desc: "“在神州帝国统治的大半个中国，报纸不敢刊登言论，学生不敢上街，工人不敢罢工，政党不被允许存在。但在广州——你可以骂政府。前提是：你要骂得有道理。以及，你做好了被骂回来的准备。”\n\n广府是中国唯一还在运转的民主政权。它远非完美——识字率限制了选民参与，地主乡绅仍在地方上把持权力，各派之间的斗争让许多政策难产。但至少，它有一个议会，有独立的报纸，有合法的选举，有在公开场合批评政府的权利。宋教仁认为这是革命最重要的成果，比北伐本身更重要。她说：“我们可以打败仗，但不能丢掉议会。败仗可以打回来，议会丢了就再也回不来了。”\n但这种自由也让广府在战争中处于劣势。帝国朝廷不需要说服任何人，军阀不需要议会表决，但广府出兵需要国会授权，增税需要议员预算听证，戒严需要法律依据。胡宗南对此极为不耐：“等我们走完这些程序，袁克定的骑兵已经过了长江。”宋教仁的回答是：“如果我们也省略程序，那我们和她们有什么区别？”"
