  ROC_policy_card_desc_32: "在粤北几个县试行土地改革：政府以债券赎买地主超额土地，分配给无地少地的农民。农技站同时跟进，教农民怎么在刚分到的土地上种出更多的粮食。"
  ROC_policy_card_modifier_32: "$MODIFIER_CONSUMER_GOODS_FACTOR$：§Y-10.00%§!\n$ROC_RCKMT_influence_monthly$：§Y+1%§!"
  ROC_policy_card_name_33: "军需优先"
  ROC_policy_card_desc_33: "革命政权的经济基础是军队的战斗力，一切物资调配都应以军需为最高优先级。"
  ROC_policy_card_modifier_33: "$modifier_production_speed_arms_factory_factor$：§G+5.00%§!\n$MODIFIER_SUPPLY_CONSUMPTION_FACTOR$：§G-5.00%§!"
  ROC_policy_card_name_34: "土木工程"
  ROC_policy_card_desc_34: "“我中国当急起直追，以国家全力，一举而实行此巨大之大建设。”——逸仙《实业计划》"
  ROC_policy_card_modifier_34: "$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G10.00%§!"
  ROC_policy_card_name_35: "农会"
  ROC_policy_card_desc_35: "农为立国之本。遵照“扶助农工”之方略，广泛组建农民协会，乃求农民自身解放、实现乡村自治之正轨。农会之宗旨，在保障农民权益、切实贯彻二五减租，以解除民生之痛苦。唯有将亿万农民组织起来，方能奠定国民革命最坚实之社会根基，复兴农村之生机。"
  ROC_policy_card_modifier_35: "$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G10.00%§!"
  ROC_policy_card_name_36: "乡贤制"
  ROC_policy_card_desc_36: "民生主义之本意，在社会互助而非阶级对抗。组建乡贤会，乃集乡村德高望重之士，居中调和地佃利益。以平允和平之法，既宽佃农之生计，亦顾地主之合理权益，导两阶级于协同互助之途。此方为消弭乡村冲突、复兴农村之正轨。"
  ROC_policy_card_modifier_36: "$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$：§G5.00%§!\n$MODIFIER_STABILITY_FACTOR$：§G10.00%§!"
