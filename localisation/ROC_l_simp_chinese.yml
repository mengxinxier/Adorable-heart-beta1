 ##军事卡
  ROC_policy_card_name_01: "黄埔遗训"
  ROC_policy_card_desc_01: "先总理在黄埔军校开学典礼上的训词，至今仍刻在校门口的巨石上——“§R革命尚未成功，同志仍须努力。§!”每一个从黄埔走出的军官，都被要求背诵这十六个字。"
