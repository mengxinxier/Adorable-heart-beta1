##结语

  ROC_end_title_1: "至此，§P[ROC.Getname]§!的征途告一段落"
  ROC_end_tip_1: "洛茜继续在那些还没有通电的村子里建学校。宋主席每年寄出的信越来越少，收到的信越来越多。有一封信来自潮汕，写信的人是一个当年在土改试点中分到地的佃农的女儿。信里说，她现在在县城教小学，班上有四十三个学生。信的最后一句是：“宋主席，我识字了。”\n\n宋庆龄把这封信放在办公桌最上面的抽屉里。抽屉里还有很多信。她没有全部回复——太多了，回不过来。但每一封她都看了。\n\n“革命不是改朝换代。革命是让最穷的人也能抬起头来。我这一生没有做完这件事。但我开了个头。后来的人，会把这件事做完。”\n\n在新三民主义的领导下，从白山黑水到金边南洋，从朝鲜半岛到恒河之畔，三民主义的“民族自决”灯塔照亮了每一个被压迫的角落，黄浦江畔的上海合作组织取代了旧时代的殖民金融网，成为了欧亚大陆工农与新兴独立国家相互扶持、共同繁荣的钢铁纽带；新一代的东方少年们挺直了脊梁，不再是任何人的殖民奴仆，而是这片大陆真正的主人。\n\n“革命尚未成功，同志仍须努力”的叮嘱犹在耳畔，而今日之神州已如您所愿——这是一个人民当家作主的社会主义新中国，这是一个屹立于东方、光照寰宇的§P大同新世界§!！"
  ROC_end_tip_lower_1: "感谢您对钢铁萌心与广州国民政府内容的喜爱与支持！"
  ROC_end_close_button_1: "加速向更美好的世界！"
  ROC_end_close_button_TT_1: "§L在做实事的人手中，中国的复兴或许不是最快的，但一定是最稳的。§!"

