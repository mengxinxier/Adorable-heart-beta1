  ROC_Xigua_Not_getout_flag: "没有赶走西瓜"
  TRB_Xigua_ROC_desc: "§L西瓜是一具服务于铁路系统的人偶，诞生于火车联邦某座中型机车厂的装配车间，出厂编号已不可考。她的核心搭载着一枚精心调校的操作盘——这正是铁路人偶的灵魂所在，赋予了她自主意识、情感模拟以及与铁路系统深度交互的能力。在联邦的铁路网络上服役的数年间，她积累了海量的线路数据与调度经验，同时也逐渐滋生了对联邦之外广阔世界的好奇。\n\n1935年，莉莎在流亡政权中大权在握，极端派随之得势。唯果屡遭排挤，不得不离开奥地利，辗转抵达火车联邦的首都御一夜市。也正是在这座以温泉与铁轨闻名的城市里，她遇见了西瓜。两人对装甲战术与铁路运输的协同运用展开了长期探讨，西瓜由此接触到中国的革命理论。她的操作盘在反复推演后得出一个结论：联邦的轨道太过平整，载不下那些尚未成形的理想；而中国那片动荡而炽热的土地，或许才是值得奔赴的方向。\n\n1936年，西瓜随唯果一同抵达广州。不久后，第三国际通过加密渠道与她取得联系，正式委派她为国民政府联络员，负责重建自北伐失败后便近乎中断的信息通道。她的机械身份、对铁路系统的天然权限，以及她作为唯果随行同伴这一公开身份，使她成为了这一角色再合适不过的人选\n\n如今，西瓜一面继续从事铁路调度工作，一面以顾问身份为国府提供信息联络方面的支持。她很少主动发表意见，但每当涉及通讯加密、线路规划与情报传递的问题时，她给出的方案总是精确得令人不安。§!"
