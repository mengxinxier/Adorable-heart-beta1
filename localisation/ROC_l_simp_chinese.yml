  roc_news.001.t: "$news_event_background$两广战争"
  roc_news.001.desc: "自广西地方宣布建立新的国民政府之后，两广之前很快爆发了大规模的军事冲突。\n\n不知这是所谓国民党之间的内战，抑或是新的北伐战争的开端。"
  roc_news.001.a: "打进南宁城，活捉汪兆铭！"
  roc_news.001.b: "推翻伪政权，重振国民革命！"
  roc_news.001.c: "陆荣婷，我***（北京雅言）"
  roc_news.001.d: "或许变局即将到来"
  roc_news.001.e: "何意味"

  roc_news.002.t: "$news_event_background$国民党-民革定鼎南京"
  roc_news.002.desc: "随着国民党的军队进军南京城，华南已经尽数被国民党掌握。近日，迁都南京的国民政府宣布召开第一届国会选举并成立了第一任国民政府。\n\n原临时主席、孙中山遗孀宋庆龄赢得了选举并组建了新的内阁，据悉她的执政方针是带有浓重社会主义色彩的“新三民主义”。同时，之前的国民党北伐军总司令蒋介石的女儿--蒋巾帼担任了行政院院长，不过有小道消息称其二人已经有了不可调和的矛盾，或许国民政府内新的内斗即将爆发。"
  roc_news.002.a: "不过怎样，这是我们的胜利！"
  roc_news.002.b: "发函恭喜我们的朋友。"
  roc_news.002.c: "都是叛徒！"
  roc_news.002.d: "或许中国的胜利者很快就会出现。"

