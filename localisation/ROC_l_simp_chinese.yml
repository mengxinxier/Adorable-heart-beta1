  roc_news.011.t: "$news_event_background$国共联合政府成立"
  roc_news.011.desc: "击败神州帝国后，中国革命的反封建任务已经完成，全世界的观察家、政治家们都关注着中国国共两党接下来的动作。作为中国领导权最有力的两大竞争者，她们的抉择将会决定这片多灾多难的大地未来的走向。\n\n近日，在两党最高领导层的会谈之中，双方进行了亲切友好的交谈，并就中国的革命问题达成了一致，认为两党的革命是有着共通性的。在数日的会议后，双方达成共识，两党将以和平的方式组建联合政府，共同推进中国的革命与建设工作，共产国际支部也随中国共产党进驻新联合政府。"
  roc_news.011.a: "我们联合"
  roc_news.011.b: "她们怎么混一块去了？"
  roc_news.011.c: "出人意料的联合"

  roc_news.012.t: "$news_event_background$北伐宣言"
  roc_news.012.desc: "最新消息，逐渐稳固了地区统治的国民政府正式发表了《北伐宣言》，宣言中痛斥了神州帝国腐朽落后的统治，表明了推翻帝制，建立民国的决心。尽然看起来不可思议，但短短的时间内国民革命军已经从刚刚出山的游击队转变为了一支强大的正规军，虽然数量上不如帝国军队，但是其严格的训练和强大的意志力仍然是帝国军无法匹敌的，西方军事专家普遍对北伐的成功抱有乐观态度。"
  roc_news.012.a: "我们定会取得胜利！"
  roc_news.012.b: "看来不久战事就会爆发。"
  roc_news.012.c: "这群狗日的暴徒！"
  roc_news.012.d: "中国的命运将会如何？"

  roc_news.013.t: "$news_event_background$宁广合流"
  roc_news.013.desc: "随着南直隶的光复与旧秩序的瓦解，广州国民政府主席[ROC.GetLeader]应金陵各界及光复同志的诚挚邀请，今日乘专列抵达南京！\n在下关火车站举行的盛大欢迎仪式上，[ROC.GetLeader]与在光复南直隶中功勋卓著的[JSZ.GetLeader]亲切会面，双手紧握，向全天下宣告：分裂的革命力量已成为历史，一个统一、强大的国民政府正式诞生！\n随后，在原总督府举行的联合会议上，双方达成历史性决议：\n广州国民政府与南京临时领导机构正式合并，组成中华民国国民政府。定都南京，以此六朝古都、革命先驱中山先生陵寝所在之地，作为领导全国革命与建设的中心。\n在响彻全城的“统一革命、拥护新政府”的欢呼声中，青天白日满地红旗在南京城的每一个角落高高升起。这意味着，从珠江到长江，革命力量已连成一片，一个崭新的政治中心已然形成。它不仅是军事上的胜利，更是政治上的伟大奠基。北伐统一的神圣事业，自此拥有了无比坚实的核心！"
  roc_news.013.a: "全民族联合起来，为建设新神州而奋斗！"
  roc_news.013.b: "反动派的势力增强了"
  roc_news.013.c: "国民党的势力增强了"
  roc_news.013.d: "国民党的势力增强了"
  roc_news.013.e: "民主的胜利"
  roc_news.013.f: "可惜她们不会违背逸仙先生的愿望"

