  ROC_clear_DiPi_category: "发掘地方军火库"
  ROC_clear_DiPi_category_desc: "自前此北伐大战以降，帝国中央偏安北地，对华南各省之吏治防务不闻不问，以致地方军阀乘隙各据山头、胡作非为，荼毒地方。幸赖我革命军执戈起兵，犁庭扫穴，方使华南大地廓清宇内，终结此等军阀割据之积弊。\n\n然燕云未复，伪廷犹在，北伐大业百端待举。当此战守交兵之际，凡地方顽敌割据多年所积攒之军实陈储，其遗留于各处要塞、山洞之枪炮械弹，理当全数收归本党本军统筹调用。化军阀之私产，为革命之公器。悉数发掘出土，整军经武，以充实我北伐健儿之羽翼，指戈中原！"
  ROC_clear_YUN_DiPi: "[YUN.GetFlag]发掘云南的军火库"
  ROC_clear_YUN_DiPi_desc: "滇黔两省地势险峻，历来为西南割据之重地。昔日滇系军阀苦心孤诣，其昆明兵工厂早年多得幻造、德造机械之利，所制“21式”滇造步枪质地颇佳，且因山地作战之需，库储中多有幻式轻便山炮与迫击炮之遗存。今派员深入高黎贡山及黔中腹地之秘密山洞、军械分库分路搜求，尘封多时之西南军实，正可充实我山地各师之械弹。"
  ROC_clear_GXC_DiPi: "[GXC.GetFlag]发掘桂系的军火库"
  ROC_clear_GXC_DiPi_desc: "桂系盘踞西江多年，早年陆氏治下曾兼领粤省，其军火除当年从广东石井兵工厂运回之大批粤造械弹外，多赖临近幻属越南之便，于龙州、梧州等沿边要道走私购入。其秘密军械库中多见幻造、圣造等万国牌洋枪，虽制式庞杂，然不乏大口径山炮与外洋利器。今搜剿出土，其陈年旧储正可解我前线燃眉之急。"
  ROC_clear_FUJ_DiPi: "[FUJ.GetFlag]发掘闽赣的军火库"
  ROC_clear_FUJ_DiPi_desc: "闽赣崇山峻岭，交通闭塞，早年福州船政局之余风虽歇，然地方各路防军、保安旅各行其是，多于武夷山脉与赣南深处依山筑库。此地军实虽无大型兵工厂供给，然杂色火器极多，诸如德制驳壳枪、旧式毛瑟步枪及民间兵工作坊自造之械弹不计其数。虽制式不一，然其胜在数量庞大、藏匿隐蔽，全数搜剿出土后，对于扩充地方保安民兵、稳固后方治安大有裨益。"
  ROC_clear_WUH_DiPi: "[WUH.GetFlag]发掘湖广的军火库"
  ROC_clear_WUH_DiPi_desc: "荆楚重地，兵家必争，亦为华中兵工之冠冕。名噪一时之汉阳兵工厂便坐落于此，其所产“汉阳造”步枪与“三十节”水冷重机枪风行海内数十年，产量极巨；加之长沙兵工厂早年所储之大量枪弹、大口径迫击炮。虽经战乱迁徙，然鄂湘两省旧营垒、防空洞内之留守库储依然数额惊人。发掘此地，无异于坐拥一座取之不尽的标准化弹药宝库。"
  ROC_clear_JSZ_DiPi: "[JSZ.GetFlag]发掘江浙的军火库"
  ROC_clear_JSZ_DiPi_desc: "财赋东南，亦是现代军工发祥之区。金陵兵工厂建制最为完备，工艺直追欧美，其所产宁造马克沁重机枪、捷克式轻机枪以及德械标准之7.92毫米弹药，向为国内精锐之标配；杭州、上海各处亦留有早年地方防军与保安团之秘密军械库，甚至包含部分未及启封之进口洋枪与工兵器材。中枢接收之江浙库储，堪称三军整军经武之强心巨剂。"
