  ROC_get_Alhambra_Palace: "阿尔罕布拉宫"
  ROC_get_Alhambra_Palace_desc: "这里的一切似乎都是为了激起友好快乐的感觉，因为一切都如此精致而美丽。\n——华盛顿·欧文"
  ROC_get_Alhambra_Palace_tt: "§R军事政策槽位§!：§G+1§!"

  ROC_get_Big_Ben: "大本钟"
  ROC_get_Big_Ben_desc: "不要盯着大钟看；要做大钟正在做的事。继续前进。\n——萨姆·李文森"
  ROC_get_Big_Ben_tt: "§Y经济政策槽位§!：§G+1§!"

  ROC_get_Potala_Palace: "布达拉宫"
  ROC_get_Potala_Palace_desc: "我第一次踏上布达拉宫房顶时，像步入生命的巅峰一般，这种感觉是前所未有的：整个人进入到从未有过的意识范围之中。\n——皮柯·耶尔"
  ROC_get_Potala_Palace_tt: "§S外交政策槽位§!：§G+1§!"

  ROC_get_Forbidden_City: "紫禁城"
  ROC_get_Forbidden_City_desc: "整个宫殿是沿着一条中心轴建立的，这也是整个世界的轴心，以宫殿为代表，四个方向的所有东西都是从中心点悬吊下来的。\n——杰弗里·里格尔"
  ROC_get_Forbidden_City_tt: "§0通配符政策槽位§!：§G+1§!"

