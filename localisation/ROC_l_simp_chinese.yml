  roc.01.title: "新年双演说"
  roc.01.desc: "元旦方过，广州城内的节日气氛尚未散去，一场围绕革命路线的思想交锋已悄然拉开帷幕。\n\n1月3日，国民政府主席宋庆龄在国民参政会新年茶话会上发表题为《革新与团结》的演说。她身着素色旗袍，语调温婉却字字铿锵：“我们继承总理遗志，但不可做理论的奴隶。联俄、联共、扶助农工，必须扎根于中国的土壤。革命不是毁灭一切，而是革新一切。我呼吁各党各派、各阶级爱国人士，在民族危亡之际放下成见，共建有中国特色的新三民主义共和国。”演说结束后，全场鼓掌长达三分钟，宪政同志会的宋教仁与佩丽卡率先起身致意，CC系的陈晖洁亦微微颔首。\n\n仅仅两天后，1月5日，留苏归国不久的蒋巾帼在广州陆军军官学校开学典礼上发表题为《布尔什维克化的革命之路》的演讲。这位蒋介石的遗孤身着笔挺军装，用带着俄语腔的中文向台下数百名年轻军官疾呼：“总理的三民主义是伟大的，但不够彻底！苏联的革命经验告诉我们，必须建立一个纪律如钢铁的列宁式先锋党，必须发动贫苦大众进行彻底的阶级斗争，必须毫不留情地清洗混入革命队伍的反动势力。同志们，革命不是请客吃饭，不是绘画绣花，不能那样雅致，那样从容不迫！”\n\n两篇演说被广州各大报纸并排刊登。《民国日报》标题为“宋主席倡团结革新，蒋小姐主彻底革命”；《黄埔之声》则以整版刊登蒋巾帼演讲全文，并在头版配发社论《革命需要铁与血》。社会上议论纷纷：温和派担忧民革分裂，激进派痛斥宋庆龄“革命意志衰退”，中正社的军官们则在茶馆里冷笑——“老蒋的闺女，倒想当中国的木之本樱？”\n\n广府的团结，在1936年的第一周便已布满暗痕。"
  roc.01.a: "中国革命必须走自己的道路"
  roc.01.b: "唯有彻底革命才能拯救中国"

  roc.02.title: "潮汕佃租冲突"
  roc.02.desc: "1月中旬，潮汕地区的春耕备耕尚未开始，一场围绕着“永佃权”的纠纷却率先点燃了乡村的对抗。\n潮州府澄海县，拥有三千亩良田的大地主陈焕章以“田租连年拖欠”为由，单方面宣布收回十七户佃农的永佃权，并雇佣县保安队强行驱逐佃户。然而据广府农工部此前调查，陈焕章实则是借“欠租”之名行“加租”之实，其将田租从四成六骤然提高至五成八，远超佃农承受能力。被逐佃农无家可归，聚于澄海城隍庙前绝食抗议。\n\n消息传入广州，各方反应迅速而耐人寻味。\n蒋巾帼领导的民革激进派率先行动。1月18日，蒋在《革命之声》发表声明，痛斥“封建地主阶级对贫苦农民的残酷剥削”，宣布派遣留苏归来的农运干部陈延年率工作组奔赴澄海，协助佃农成立“贫农团”，提出“减租三成、恢复永佃、惩办行凶保安队”三项要求。\n然而，这一次宋庆龄没有像外界预期的那样反对蒋巾帼的激进行动——\n1月20日，国民政府主席办公室发出通报：经查，陈焕章之弟陈焕文现任广西总督府财政顾问，陈家近年来通过梧州商埠向帝国控制区大量输出粮食，其所持“永佃权争议”背后，疑似有广西当局煽动乡绅对抗广府之意图。宋庆龄在内部会议上表态：“这不是土改问题，这是国家安全问题。”\n宋庆龄与蒋巾帼，出人意料地站在了同一战线。\n\n真正的反对声来自宪政同志会。\n1月22日，宋教仁携佩丽卡紧急求见宋庆龄。宋教仁力陈：“陈家固然有千般不是，但我方若公开以政治手段处置经济纠纷，两广侨商、潮汕乡绅必将人人自危。一旦商路断绝，税收枯竭，军队粮饷从何而来？”佩丽卡补充了一份数据分析：潮汕地区承担了广府近四成的侨汇中转，若引发大范围乡绅逃亡，外汇渠道将遭受致命打击。\n\n更尖锐的冲突则爆发于中正社与蓝衣社之间。\n汤汤的清波寨子弟兵中有不少来自潮汕的底层子弟。1月23日，汤汤未经何应钦批准，率百余名亲兵离营南下，声称“回家看望父老”。实际上，清波寨子弟兵在澄海县城外扎营，与陈焕章雇佣的保安队形成武装对峙。\n而识之律者的蓝衣社则截获了另一条情报：陈焕章已通过其弟关系，请求广西总督府以“保护侨商”为名向潮汕边境增兵。识之律者将此情报同时抄送宋庆龄与蒋巾帼，并在报告末页附上一行手书——\n“若让广西借机插手潮汕，两广之防，门户洞开。建议：先斩后奏。”\n\n至此，一场地方佃租纠纷，已然牵动了广府六派中的五派。只有改组派的汪兆铭保持沉默——事后查明，陈焕章的弟弟陈焕文与汪兆铭私交甚笃，改组派此时正在紧急销毁相关通信记录。\n潮汕的田埂上，即将点燃整个南方的导火索。"
  roc.02.a: "彻底清算陈氏地主"
  roc.02.b: "以法庭审判"
  roc.02.c: "授权蓝衣社与清波寨武装"

  roc.03.title: "清波寨的祭旗"
  roc.03.desc: "距蒋介石四·一二忌日尚有两月有余，黄埔中正社已开始紧锣密鼓的筹备。\n\n2月8日拂晓，汤汤率清波寨子弟兵三百余人，在广州北郊白云山脚下举行“春祭演武”。士兵们臂缠黑纱，队列整齐，在临时搭建的灵堂前依次献刀。灵堂正中悬挂蒋介石身着大元帅服的巨幅画像，两侧挽联书——“未酬壮志身先死，留取丹心照汗青”。\n\n汤汤登台训话，言语粗粝却字字如刀：“先总理是咱们清波寨子弟心中永远的总司令。四月十二那天，我不管别人去不去，清波寨的人，爬也要爬到广州去。”\n\n此事未经三军总指挥部报备。何应钦于当日上午得知后，面色铁青，但未公开表态。宋庆龄的秘书则致电中正社，措辞严厉：“国民政府主席尚在，何人敢在国丧之外擅设灵堂？”\n\n识之律者拍案叫好，当场手书一幅行草——“好！”"
  roc.03.a: "这是军中自发行为，不宜强行压制"
  roc.03.a.tt: "§L蒋介石的旧部需要发泄情感。强行弹压只会激化矛盾，不如睁一只眼闭一只眼。§!"
  roc.03.b: "擅设灵堂是越权，必须追究责任"
  roc.03.b.tt: "§L没有三军指挥部的命令，任何部队不得擅自进行有政治意味的仪式。汤汤必须书面检讨。§!"
  roc.03.c: "由三军指挥部出面，将活动收编为官方纪念"
  roc.03.c.tt: "§L堵不如疏。由何总指挥出面，将中正社的活动纳入正式纪念程序，既给了面子，又控了场面。§!"

  roc.04.title: "中正社的请柬"
  roc.04.desc: "2月10日，中正社正式向广府各机关发出“蒋总司令殉国十四周年纪念大会”请柬。烫金黑边，肃穆庄重。\n\n请柬上列明仪式流程：上午八时，黄埔军校旧址集合；九时，向总理遗像默哀；十时，各机关代表致辞；正午，汤汤率清波寨子弟兵举行阅兵；下午，自由发言。\n\n收件人名单包括了广府所有要员。但请柬落款处，没有何应钦的名字，没有三军总指挥部的印章，只有一行字——“黄埔中正社暨清波寨全体子弟 泣血谨启”。\n\n这是试探。中正社想知道：谁站在我们这边，谁站在我们的对立面。\n\n何应钦接到请柬后，在办公室里沉默良久。她没有回复中正社，却打了一个电话给宋教仁——“良桢兄，四月十二那天，你们宪政同志会的态度如何？”\n\n同一日，改组派的汪兆铭派人送了一份厚礼到中正社——“纪念蒋公，吾辈同哀。”\n\n而宋庆龄在她的办公桌上，面对着同一份请柬，久久未动笔。"
  roc.04.a: "我不能向一个私人武装集团低头"
  roc.04.a.tt: "§L中正社此举是挑战政府权威。我以国民政府主席的身份宣布：不承认此次仪式，不派员出席。§!"
  roc.04.b: "纪念可以，但仪式必须由政府主持"
  roc.04.b.tt: "§L蒋介石是北伐先烈，纪念她是应该的。但纪念仪式必须由国民政府主办，中正社只能作为参与方，不能作为主办方。§!"
  roc.04.c: "不出席，但也不阻止，让中正社折腾去"
  roc.04.c.tt: "§L四月十二还早。现在表态太早，不如静观其变。§!"

  roc.05.title: "黄埔夜宴"
  roc.05.desc: "2月12日夜，胡宗南在广州黄埔区的旧军校俱乐部设下私宴，仅三席。受邀者除了中正社的骨干：汤汤、识之律者，以及几位黄埔一期老将，还有一人——蒋巾帼。\n\n这不是一场普通的饭局。胡宗南安排蒋巾帼坐在主位，酒过三巡后起身举杯：“诸位，先总理虽然不在了，但她的骨血还在。今天这杯酒，敬巾帼兄。”\n\n汤汤带头一饮而尽，把碗重重磕在桌上：“蒋小姐，我汤汤不认识什么主义。我只认人。老蒋是我这辈子最敬重的人，你是她女儿。你发话，清波寨的弟兄就跟你。”\n\n识之律者没有说话，只是看着蒋巾帼的眼睛。她的酒杯没有举起。\n\n宴后，胡宗南与蒋巾帼在院中散步。夜色深沉，黄埔江水声隐约可闻。\n\n胡宗南的声音很低，但每一个字都清清楚楚：“巾帼，我知道你从苏联学了新学问回来。这套东西，我们这些大老粗不懂。但你母亲留下的军队，需要一个姓蒋的人来统率。何应钦不行——她心里没有先总理。宋庆龄更不行——她是外人。只有你。”\n\n“苏联那一套，在俄国管用，在中国，水土不服。你母亲的路，才是正道。”\n\n蒋巾帼没有回答。夜色掩盖了她的表情。\n\n但识之律者在不远处，看见了这一幕。她无声地笑了一下。"
  roc.05.a: "这杯酒，我喝。话，以后再说。"
  roc.05.a.tt: "§L蒋巾帼将杯中酒一饮而尽，然后坐下。再也没有多说一个字。§!"

  roc.06.title: "识之律者的谏言"
  roc.06.desc: "2月14日，情人节。广州街头的年轻男女互赠信物，谁也不会想到，在这一天，一个足以改变广府命运的人，正坐在蓝衣社总部的秘密办公室里，等待另一个人的到来。\n\n昨晚宴席上的觥筹交错仍在耳畔。当识之律者的副官通知蒋巾帼“有人求见”时，蒋以为是胡宗南的后续游说。\n\n她错了。\n\n蓝衣社总部设在一处旧仓库的地下，甬道狭长，只有一盏白炽灯摇曳。识之律者坐在最里面的房间，桌上摊着一份厚厚的手写报告。封面上只有五个字：《论需要清洗者》。报告的第一页，第一行字赫然入目——\n\n“汪兆铭改组派——第一序列。”\n“宋教仁宪政派——第二序列。”\n“CC系——待观察。”\n“宋庆龄——不宜列入，但须限制行动。”\n“蒋巾帼——尚未定性。”\n\n识之律者没有请蒋巾帼坐下，只是将报告推到她面前，声音平静得可怕：“说句话吧。你要谁的剑？你母亲的，还是你从苏联带回来的？”\n\n“如果你要前者，这份名单上的后两个名字，可以划掉。”\n\n“如果你要后者——那你早晚会出现在这份名单上。”"
  roc.06.a: "我需要这把剑"
  roc.06.a.tt: "§L你说得对。广府依赖会议和空话太久了。革命需要秩序，秩序需要铁腕。名单前三个，我认可。后两个，你烧掉。§!"
  Whampoa_will_join_RCKMT: "\n§L£GFX_Whampoa_text_icon §g中国国民党黄埔中正社§!和£GFX_CNRS_text_icon §F中国国民党三民主义力行社§!将会成为£GFX_RCKMT_text_icon §P中国国民党革命委员会§!的§Y附属势力§!，£GFX_RCKMT_text_icon §P中国国民党革命委员会§!§O将势不可挡。§!§!\n\n§L如果进入£GFX_RCKMT_text_icon §P民革§!路线，在之后的§P宋§!§R蒋§!§Y之争§!中，将会大幅增加§R蒋巾帼§!的势力。§!"
  roc.06.b: "我不是我母亲"
  roc.06.b.tt: "§L蒋巾帼站起身：“我感谢你的坦诚。但从莫斯科回来的蒋巾帼，不是你们等待的蒋巾帼。革命不是靠清洗和独裁完成的。这份报告，我就当没见过。§!"
  Jiang_jinguo_will_Chiang_Kai_shekism_subtype: "§Y蒋巾帼§!将会走向§g独裁路线§!"
  Jiang_jinguo_will_leninism: "§Y蒋巾帼§!将会走向§R革命路线§!"

  roc.07.title: "先总理灵前"
  roc.07.desc: "夜色如墨。广州东郊的黄埔军校旧址，蒋介石灵堂已布置完毕。明日将是盛大的公祭，但今夜，只有一个人获准进入。\n\n蒋巾帼独自站在母亲的巨幅遗像前。黄埔的夜风穿过破损的窗棂，吹动挽联的黑色绸布，发出沙沙的声响。\n\n灵堂外，中正社的骨干们环立等待。胡宗南、汤汤、识之律者，以及那些曾在蒋介石麾下南征北战的黄埔老将。她们在等一个答案。\n\n蒋巾帼跪了下去。\n\n不是对母亲的跪拜——她从苏联回来后就再也没有跪过任何人——而是对命运的跪拜。这个姿态被门外的军官们看见了。\n\n胡宗南率先走进灵堂，在蒋巾帼身边单膝跪下。然后是汤汤，然后是识之律者，然后是所有人。\n\n没有声音。没有仪式。没有宣誓。\n\n但当蒋巾帼站起来的时候，她已经不是民革的那个留苏青年了。她是这支军队的第二个蒋姓统帅。\n\n识之律者在那一刻，将那份写于2月14日的报告取了出来，拿起笔，在末页补写了一行字：\n\n“蒋巾帼——已定性。第一序列。”\n\n第一序列是保卫，不是清除。\n\n次日，四月十二日。广府政府无人出席蒋介石忌日公祭。但蒋巾帼出席了。她站在灵前，身后是中正社全体军官。\n\n当天下午，蓝衣社开始行动。"
  roc.07.a: "点燃火炬"
  roc.07.a.tt: "§L接过母亲的火炬。从今日起，以“继承先总理遗志、肃清内部”为名，联合中正社和蓝衣社，夺取广府最高权力。§!"

  roc.08.title: "先总理灵前"
  roc.08.desc: "夜色如墨。但蒋巾帼今夜不在母亲灵前。她在另一个地方。\n\n广州陆军军官学校的礼堂里，灯火通明。一百余名留苏归国的青年军官聚集在此，她们是蒋巾帼这两年来亲手培养的骨干。礼堂四壁挂着的不是蒋介石的画像，而是马克思、列宁和孙中山——孙中山被放在最左边。\n\n蒋巾帼站在讲台上，面前的讲稿是一份用俄语起草、连夜翻译成中文的纲领——《论中国革命的布尔什维克化》。\n\n“明天，是我母亲的忌日。黄埔中正社会举行盛大的公祭。”她停顿了一下，“我不去。”\n\n台下寂静。\n\n“不是我不孝。而是我母亲的遗产，不能只被一群将军和特务继承。黄埔精神，应该属于工农，属于革命，而不是属于一个姓氏。”\n\n演讲持续了整整两个小时。关于无产阶级专政，关于彻底的土地革命，关于建立列宁式先锋党。识之律者没有出现在现场，但她的眼线一定在。\n\n次日，四月十二日，蒋介石忌日公祭如期举行。汤汤率清波寨子弟兵列队，胡宗南主持，识之律者致辞。所有人都在等一个人——那个人没有来。\n\n胡宗南当场掷杯：“她不是蒋介石的女儿。”\n\n蒋巾帼收到了这句话。她只是把那份《论中国革命的布尔什维克化》翻到最后一页，用钢笔签上了自己的名字。"
  roc.08.a: "点燃火炬"
  roc.08.a.tt: "§L告别母亲的道路。从今日起，将民革改造为布尔什维克式先锋党，与工农武装会合，发动彻底的社会革命。§!"

  roc.09.title: "黄埔的异端者"
  roc.09.desc: "广府的早春湿冷入骨。蒋巾帼的留苏派在陆军军官学校礼堂里完成了《论中国革命的布尔什维克化》的宣讲，满堂掌声如雷。但掌声之外，整个广州都在窃窃私语——\n\n“老蒋的女儿不要她爹了。”\n\n中正社的胡宗南已在公开场合三次拒绝与蒋巾帼同席，汤汤则在营中放话：“清波寨以后不认姓蒋的了。”识之律者的蓝衣社依然沉默——那种令人窒息的、等待时机的沉默。\n\n蒋巾帼很清楚：她有纲领，有留苏青年军官团，有苏联顾问的暗中支持，但她没有军队。何应钦的三军总指挥部对她保持距离，中正社已视她为仇敌，蓝衣社的匕首随时可能从黑暗里伸出来。\n\n在黄埔系的版图上，她几乎是孤家寡人。\n\n但并非完全如此。\n\n2月17日夜，蒋巾帼的副官陈延年送来了一份人事档案。档案的主人名叫戴安澜，黄埔三期毕业，现任国民革命军第四军第二十五师第七十三旅旅长。履历清白，战功卓著，更重要的是——此人曾因公开反对蓝衣社在军中私设刑堂，被识之律者记入过那份著名的“需要清洗者”名单。\n\n蒋巾帼合上档案："
  roc.09.a: "“安排一次会面。私下。”"

  roc.10.title: "会面"
  roc.10.desc: "珠江边的一座废弃茶楼，曾属于一位不愿与改组派合作的商人，如今已无人光顾。\n戴安澜如约而至。她脱下军装，只穿一件深灰长衫，但腰杆挺得笔直。两人在二楼临窗的角落落座，河对岸广州的灯火稀稀落落，仿佛这座城市自己也嗅到了什么不祥的气息。\n蒋巾帼首先开口，语气坦率得几乎鲁莽：“戴旅长，我需要军队。我有一整套革命纲领，但没有枪杆子，什么都不是。”\n戴安澜没有立刻回答，只是望向窗外。许久之后，她说了一句毫不相干的话：“蒋公子，你还记得昆仑关战役吗？”\n那是北伐战争中的一场恶战，蒋介石还在世。戴安澜率一个团死守昆仑关七天七夜，为大部队撤退争取了时间。那场仗打完，全团只活下来四十一人。\n“我在那七天里想到一件事。”戴安澜的声音很平静，“我们这些当兵的，到底为谁卖命？你母亲去世后，我以为这个问题会有答案。但十四年过去了，中正社的人把军队当成私产，蓝衣社的人把军队当成屠场，何总指挥只顾平衡。广府的革命，到底革了谁的命？”\n蒋巾帼听出了这句话里的意思。她身体微微前倾：“戴旅长，我母亲的路是军绅政权的路，那不是革命，是换个招牌的军阀。我带回的苏联经验或许水土不服，但至少，它有一个完整答案——军队属于党，党属于无产阶级。”\n“苏联经验。”戴安澜重复了一遍这个词，然后转过头，第一次直视蒋巾帼的眼睛，“蒋公子，你去过苏联，我没有。我这一辈子活在黄埔的精神里，而黄埔的精神就四个字：亲爱精诚。”\n“所以我问你——你跟那些大鼻子的顾问，是亲密，是利用，还是依附？”\n蒋巾帼沉默了很久。江水拍打楼基，发出沉闷的声响。\n最终她这样回答：“苏联援助我们武器，顾问教会我们组织。但我不会让任何一个外国人指挥中国军队。我要建立的，是一支服从革命纪律、而不是服从个人或外国的新型武装。”\n戴安澜听完，缓缓起身。蒋巾帼以为这场会见到此为止。\n但戴安澜走到窗前，抬手将桌上那杯没动过的凉茶，倒在了江水里。\n“先总理的忌日，今年我不想只烧纸。”她说，“昆仑关的老兵还剩四十一个，现在分散在第四军的各个角落里。这批人打仗不怕死，就怕上面的人让她们白死。你如果能管住这一点，这群人给你。”\n戴安澜转过身，伸出手——“没有宴席，没有保证，没有军令状。你握不握？”\n蒋巾帼看着那只手，那只在昆仑关握过钢枪、在黄埔校场上受过蒋介石亲授佩剑的手，正平静地伸向蒋介石的女儿——一个决意背叛蒋介石道路的女儿。\n她握住了。\n次日，2月20日，黑色星期二。伦敦股市崩盘的消息还未传到广州，但珠江边的这个握手，已经悄然改变了广府的军事版图。"
  roc.10.a: "握住她的手"
  roc.10.a.tt: "§L没有宴席，没有保证，没有军令状——这是真正军人的盟约。§!"

  roc.11.title: "大萧条席卷广东"
  roc.11.desc: "1936年2月20日，星期四。\n伦敦金融城的股票交易所在开盘后两小时内暴跌逾百分之四十，恐慌如同瘟疫顺着海底电缆蔓延至全球。上海租界的电话交换机几乎烧毁，香港汇丰银行在当日中午宣布暂停兑付，东京、人里、纽约接连沦陷。\n两天后，冲击抵达广州。\n珠江上的货船最先安静下来。往常这个季节，满载生丝、茶叶、桐油的驳船昼夜不息地驶向香港，再由香港分销至伦敦与纽约。但2月22日这天，西堤码头的港务员发现，外洋轮没有来。圣杯国人通过广播发来简短的措辞：“欧洲市场暂停收购华南生丝。”\n暂停——没有人知道这个“暂停”会持续多久。也许三年。也许十年。\n到2月24日，广州的丝织厂已停工过半。数千名女工被辞退，她们沉默地坐在厂房外的马路边，面前摆着搪瓷碗，碗里什么也没有。汕头、江门、顺德的状况更糟——这些城镇几乎没有第二种产业。商店关门，米价却翻了一倍。有人开始在街上抢米，有人开始把女儿送到香港的“荐人馆”——那是体面人的说法，底层的老广直呼其名：人肉市场。\n\n这一次，六派代表全部到齐。没有任何人缺席，没有任何人托病。因为所有人都知道，今天这个会场里装着广府最后的团结。\n宋庆龄发言时，语气依然沉静：“大敌当前，我不说虚话。广府没有足够的钱救所有人。但我们能让所有人至少有粥喝。条件是——在座的每一位，都必须同意粮食由参政会统一调配，军队不得截留，派系不得私囤。”\n会场沉默。\n蒋经国环视四周，最先开口：“我同意。前提是——统一调配的执行人，不能是过去和奸商有往来的旧官僚。”\n宋教仁扶了扶眼镜：“这算同意还是算挑衅？”\n佩丽卡拉住了宋教仁的衣袖。陈晖洁与陈千语对视一眼。何应钦轻轻敲了敲桌面——他是主持人，他必须控场。\n识之律者坐在最角落的位置，她没打算说话，只是把那份名单放在膝盖上，指尖慢慢摩挲着纸页的边缘。\n窗外传来珠江方向轮船汽笛的悲鸣。这个城市在等待自己的命运被决定。"
  roc.11.a: "宋庆龄方案——统一战线，共度时艰"
  roc.11.a.tt: "§L由参政会设立“战时粮食统购统销委员会”，各派均派代表参加，佩丽卡主持粮价核算，何应钦保障运输秩序，宋庆龄监督分配公平。这是最慢的办法，但这是能团结所有人的办法。§!"
  roc.11.b: "蒋经国方案——由革命政府全面接管粮食"
  roc.11.b.tt: "§L非常时期，非常手段。立即行使革命委员会的战时权限，查封奸商粮仓，逮捕投机者，所有粮食由革命政府统购统销。不服从者，以叛国论处。§!"
  roc.11.c: "放任——让市场自行调节"
  roc.11.c.tt: "§L政府不应介入粮食流通。与其管制失败丧失威信，不如允许商人自由定价、自由运销。待米价涨到有利可图，外省粮食自会涌入。§!"

  roc.12.title: "军队欠饷危机"
  roc.12.desc: "3月的第一周还没过完，何应钦的三军总指挥部就再也算不出账面平衡了。\n大萧条切断了广府最后的海外财源。生丝滞销，关税断绝；侨汇中断；商人逃亡带来的税基萎缩在2月底的账本上显现出全貌——广府财政实际收入较去年同月减少百分之六十三。而军饷支出占政府总支出的一半以上。算盘珠子拨到最后一行，军需处长没有念出那个数字，只是将账本合上，推到何应钦面前。\n“总指挥，这个月欠三成，下个月欠全部。”\n欠饷的消息瞒不过军队。3月4日，驻扎在广州东郊的第七十三旅某连队率先发难。士兵们没有哗变——戴安澜的部队不会哗变——但他们列队站在操场上，沉默地拒绝出操。没有人喊口号，没有人挥拳头。炊事班抬出来的早饭是稀粥和咸菜，士兵们蹲在地上吃完，然后继续站在操场上。\n戴安澜站在队伍最前面，面对他的士兵，一言不发。他知道他们不是在抗议他，他们只是饿。\n同一天下午，何应钦紧急召见各部队主官。会议室里坐满了人：何应钦的嫡系参谋长、戴安澜、汤汤、中正社的胡宗南、以及几位年过半百的湘军旧将。宋庆龄派了秘书列席，蒋经国亲自到场。\n何应钦开门见山：“诸位，我直说。这个月军饷缺口四成。下个月，如果财政没有改善——欠全部。”\n会议室里炸开了锅。湘军旧将拍桌子：“自湘军时代起就没欠过弟兄们的饷！”中正社的军官冷笑：“早说了不能让文人管钱。”汤汤没拍桌子，只是站起来问了一句：“清波寨子弟兵的饷银，我拿寨子的地契抵，行不行？”\n没有人回答她。地契在1936年的广州，已经不值钱了。\n蒋经国始终没有开口。他坐在角落，观察着每一个人的反应。\n\n与此同时，另一场对话正在蓝衣社总部进行。识之律者收到了欠饷的情报，她的第一反应不是愤怒，不是恐慌，而是冷静地向副官下达了一道命令：“把各部队连级以上军官的个人情况整理出来。谁家有病人，谁欠了赌债，谁在外面养了外室。三天内给我。”\n“您要做什么？”\n识之律者没有回答。她只是翻开那份已经越来越厚的《需要清洗者》档案，在空白处写道：“饥饿的军队是最危险的东西。它要么咬死敌人，要么咬死主人。重要的是——让它在咬人的时候，咬对了脖子。”"
  roc.12.a: "优先发饷，稳定军心"
  roc.12.a.tt: "§L军队是政权的最后支柱。饥民暴动可以镇压，军队哗变无法挽回。动用国库最后的救急储备支付本月军饷，民政救济先放一放。§!"
  roc.12.b: "降低配额，将有限粮食军民均分"
  roc.12.b.tt: "§L军队也是人民的子弟。将现有存粮平均分配给军队和饥民，所有人都吃不饱，但所有人都不至于饿死。这也许不是最好的办法，但这是最不坏的办法。§!"

  roc.13.title: "铁证如山"
  roc.13.desc: "3月15日清晨，广府参政会的例行会议被一场精心策划的突袭打断。\n识之律者没有亲自到场。她派蓝衣社的三名黑衣专员将一只铁皮箱子抬进议事厅。箱子打开，里面是过去三个月来改组派与广西总督府的全部通信记录：密电原件、电报局存底、送信人的供词画押，以及汪兆铭亲笔签署的一份《两广合作备忘录》草稿。\n最致命的一封电报日期是3月2日——就在大萧条冲击广府仅十天后。汪兆铭致电广西总督府：“粤局已乱，宋氏束手，蒋氏内斗。请贵督以‘协饷’为名邀何应钦来梧，届时由桂方控制其人，改组派即在广州举事。事成，两广共主北京，桂督可兼领粤省军务。”\n何应钦当场站起。据说他的手在抖，但声音极稳：“这封电报，发出去的时候，汪兆铭还在参政会上对我笑了笑。几天前的事。”\n宋庆龄沉默地看完所有材料，然后问了一个问题：“汪兆铭现在在哪里？”\n没有人能回答。\n改组派所有的办公地点都已人去楼空。汪兆铭的私宅大门敞开，茶尚温热，卧室衣柜空空如也。他的副官留下一封信，只有一行字：“兆铭先生已于昨夜离穗。诸位同志，来日方长。”\n蓝衣社追查至码头。一艘挂着幻想乡国旗的货轮“圣巫女号”已于凌晨四时起锚，目的地梧州。船长在接受无线电质询时回复：“乘客持合法旅行证件，已支付全程船资。”问：什么证件？答：广西总督府签发的外交护照。签发日期——3月1日。\n汪兆铭跑掉了。但改组派在广州经营多年的组织网络、秘密联络站、军中的暗线、商界的代理人，没有来得及全部撤走。铁皮箱子里的材料足够蓝衣社和宪政同志会按图索骥，将所有未及逃脱的改组派成员全部锁定。\n一场清洗，已是弦上之箭。\n宋庆龄在当日下午发表简短声明：“改组派汪兆铭等人通敌叛国，证据确凿。即日起，改组派为非法组织。”蒋经国紧随其后发表声明，措辞更加激烈：“革命的躯体上长了毒瘤，割掉它，血会流，但人能活。”\n何应钦没有发表声明。他只是命令三军总指挥部将改组派关联的三名团级军官就地解职扣押。没有审判，没有解释。\n识之律者在蓝衣社总部里翻阅着那本越来越厚的《需要清洗者》档案。她在汪兆铭的名字旁边，终于打上了一个红色的勾。\n改组派——第一序列。清除完毕。"
  roc.13.a: "追查到底，不留后患"
  roc.13.a.tt: "§L改组派的网络必须连根拔起。所有曾与改组派有联系的人，无论地位高低，全部收押审查。宁可错抓，不可漏网。§!"
  roc.13.b: "由特别法庭公开审理，以儆效尤"
  roc.13.b.tt: "§L证据确凿，但程序不能省略。由宪政同志会牵头组建特别法庭，公开审理改组派通敌案。我们不只要清除叛徒，还要让天下人知道我们依法办事。§!"

  roc.14.title: "广州霍乱"
  roc.14.desc: "七月流火。广州西关的贫民区里，一场霍乱正悄然蔓延。\n最初的病例出现在一条名叫“金花巷”的窄巷里。一个以挑水为生的苦力在某天清晨没有出现在码头上——他死了。三天之内，西关报病者逾百人，死亡二十三人。到了第七天，疫情已扩散到河南的纺织工人居住区。\n广州的现代公共卫生体系在纸面上是存在的。佩丽卡曾主持编制过一份《广府公共卫生纲要》，列出了若干急症处置方案。但大萧条耗尽了卫生署的经费，方案搁在档案架上落灰。现在，瘟神来了。\n卫生署官员紧急请求：立即隔离西关疫区，由军队提供封锁线，并动用救急储备从香港进口血清。但封锁西关意味着切断贫民的生路，军队出动的代价是进一步架空何应钦已经捉襟见肘的军饷。富商陈家则主动表示愿意捐资购买血清——条件是优先供应“体面人家”。\n城区各处的药店，防瘟药材的价格已经在暗涨。"
  roc.14.a: "立即封锁，军队出动"   ##中正社+5%
  roc.14.a.tt: "§L霍乱不是请愿，不能用对话解决。调动一个宪兵连封锁西关疫区，由卫生署从救急储备金中拨款购买血清。优先控制疫情，事后追究谁耽误了防疫。§!"
  roc.14.b: "免费救治，开放血清"   ##民革+5%
  roc.14.b.tt: "§L用救急储备金从香港购买血清，免费向疫区发放。同时在西关开设临时粥厂和救助站，由卫生署和民间慈善团体合作运营。防疫不只是医学问题，也是人心问题。§!"
  roc.14.c: "征集志愿者，由民间自救"   ##宪政会+5%
  roc.14.c.tt: "§L政府的钱和军队的力量都是有限度的，但人心可以无限。发动西关居民自救，征集医生、护士和受过教育的学生担任志愿者，政府提供药品和协调，但抗疫的主体是人民自己。§!"
  roc.14.d: "接受乡绅捐助——让有钱人出钱，政府出人"   ##CC+5%
  roc.14.d.tt: "§L陈家愿意出钱买血清，这是好事。接受捐助，但推掉所谓‘优先供应’的条件。同时号召全城富商捐资，成立‘防疫善款’，由政府统一调配。§!"
  roc.14.tt: "§Y这将有效改善现状，我们可在后续的国策中彻底清除霍乱带来的负面影响§!"

  roc.15.title: "广府内部的斗争"
  roc.15.desc: "1936年，局势的演变将广州国民政府推向了历史的前台。目前，国府的控制区稳固地涵盖了整个广东省，从繁华的珠江三角洲一直延伸到南端的北海。然而，平静的表象下暗流涌动，西邻的广西军阀依然保持着半独立状态，两地之间爆发冲突只是时间问题。\n\n在这个关头，关于如何组织政权、如何建设军队以及如何塑造未来的社会形态，广州政府内部各大力量的理念交锋已经到了无法掩饰的地步。在国府的权力棋盘上，四大派系正各据一方：\n\n首先是中国国民党革命委员会（民革）。这是当前国民政府中最左翼的力量，带有浓重的社会主义色彩。宋庆龄作为广州国民政府主席，是名义上的最高领袖。该派系内部在路线上存在分歧：以宋庆龄为首的温和派奉行新三民主义，主张通过保障工农的基本民生权益来调和阶层利益，走联合各界的改良道路；而以蒋巾帼为首的激进派则主张采取更彻底的体制，由国家全面组织保障劳动阶级，甚至提出将民革彻底改组为正统的列宁式政党，以先锋队姿态引领革命。\n\n负责实际行政事务的宋教仁则领导着中国国民党宪政同志会（民宪会）。作为行政权力最大的行政院院长，她掌握着政府日常运转的实权。该派系坚定主张推行议会与内阁制，倾向于法治与自由发展的框架，倡导通过健全的宪政体制与法律来稳步推进建设。\n\n在暗处，由陈晖洁与陈千语姐妹掌控的中国国民党中央俱乐部（CC系）牢牢抓着党务大权。她们主管着整个政府的党务工作，更掌握着无孔不入的中统情报机关，其组织网络渗透于各派内部，是广府最沉默也最令人畏惧的力量。\n\n而曾经的蒋介石门徒们，以黄埔军人胡宗南为中心组建了中国国民党黄埔中正社（中正社）。他们极度推崇已故的北伐总司令蒋介石，掌握着广府地区相当大的军权。此外，汤汤和她的清波寨民兵作为一股庞大而独特的武装力量，也依附并活跃于中正社的旗帜之下，随时准备为保卫政权而战。\n\n这四大政治力量在广州的交锋，将彻底决定这个新生政权未来的阶级色彩与历史走向。"
  roc.15.a: "先总理之愿景，革命的中国万岁！"
  roc.15.b: "军政、训政皆为过渡，该迈向宪政了！"
  roc.15.c: "革命的首要任务是清除反革命分子！"
  roc.15.d: "国民革命军必将走向胜利！"

  roc.16.title: "关于社保体系"
  roc.16.desc: "随着新政权的根基日渐稳固，关于即将建立的社会保障体系的规模与形式，在国府内部引发了一场激烈的辩论。各方代表齐聚一堂，围绕着国家的未来蓝图针锋相对。\n\n民革派系的内部首先出现了分歧。蒋巾帼起立发言，倾向于实行更加彻底的体制，主张由国家全面兜底，将工厂与农村的所有劳动者紧密组织进全方位的社会保障网中；同属民革的宋庆龄则更强调新三民主义的原则，呼吁将重点放在保障工农的基本民生权益上，走一条调和各阶层利益的联合改良道路。\n\n随后，胡宗南代表军方表达了立场，她认为在当下的战时环境中，应当以国家安全为重，有限的资源必须优先保障军人、军属以及国防工业职工的待遇，以此铸造铁血国家的基石。\n\n最后，宋教仁发表了温和的演说。她倾向于法治与自由发展的框架，主张通过宪政立法来规范合理的劳动时间与最低工资，依靠社会经济的自然发展和民间勋贤的慈善来逐步解决民生问题。\n\n面对各方相左的政见，争论从会场一直延续到深夜。最终，提案被递交到了中央执行委员会的案头，经过中执委委员们的反复讨论与闭门表决，广州政府即将推行的民生政策方向就此定调。"
  roc.16.a: "革命政府自然要有革命政府的作为"
  roc.16.b: "社保体系是民生主义实现的基石"
  roc.16.c: "国民革命军是革命的先锋，理应照顾"
  roc.16.d: "仅需完善相关立法，大手会自动调节"

  roc.17.title: "整饬内部"
  roc.17.desc: "据各埠报载，环球经济恐慌蔓延，本省深受其害。因海外市场萎缩，珠江三角洲之生丝、蔗糖等大宗物产出口顿绝，市价奇落，百业凋敝，致使金银外溢，地方金融库储剧烈动荡。在此内忧外患之际，黑市投机日益猖獗，更有地方官吏勾结行帮奸商，挪用国防建设巨款囤积居奇，以图暴利。中枢震怒，饬令严加整饬。日前中执会扩大会议上，诸方文电交驰，辩论尤烈：\n\n蒋巾帼痛陈“商贾不仁，动摇国本”，拟请特设“经济管制督导队”，悬严厉限价之令。凡涉嫌投机之大户，即行强索冻结其资产，抄没私仓，将所获物资平价投放市场，并公开严惩垄断奸商，期以迅雷之势安定底层市怨。\n\n汤汤则电呈中央，坚持“乱世重典，军法肃贪”之策。军方所瞩，全在防务受损，汤汤谓克扣倒卖前方军需者等同通敌叛国，呈请由军警督察队直接进驻海关、要道及军需仓库，特设临时军法处，凡查实侵吞者即行就地正法，以绝对威慑肃清纲纪。\n\n陈千语则持重议，谓公开捕杀、急躁冒进恐引社会惶恐，反激经济动荡。CC方略主张“内密察核，隐澄清吏治”，运用调查统计网络与内部党务卷宗，循银行账目与行政批文顺藤摸瓜，对涉案官僚隔离审查、没收财产，在不惊物听之防线下清除痼疾。\n\n佩丽卡则别树一帜，立论于制度防漏。她直指贪腐与黑市之根源在于行政流程疏漏，遂呈递《现代财务审计草案》，拟设独立之中央审计委员会，于全省工厂、机关强制推行现代复式记账，清查票据，倒查资产，以严密之财务核算绝侵吞之门，期以技术改良理顺工业行政体系。\n\n各方条陈已悉数呈阅，此番雷厉风行之内部整肃，正待最高当局之最后裁夺。"
  roc.17.a: "着即平抑市价，严惩囤积居奇"
  roc.17.b: "严申战时军纪，贪墨军需者就地正法"
  roc.17.c: "密加内部察核，整饬党政机关纲纪"
  roc.17.d: "厘清财政账目，推行财务法治审计"

  roc.18.title: "整饬内部"
  roc.18.desc: "粤中政令向难出城廓，乡村宗族盘根错节，土匪肆虐、抗税不道之风频发，根据地根基流于浮表。为充实粮饷兵源，国府中央决定推行大规模下乡运动。关于方略，中枢文电往来，各出机杼：\n\n蒋巾帼有“深入陇亩，倾听民瘼”之倡，拟组织青年学生下乡，直接接触佃农与雇工，编组“基层农协会”。其方案旨在推行减租减息、强行平抑乡村高利贷，期以土地之利结万民之心，激发最广泛之参政参军热潮。\n\n汤汤则以“治安不靖，何谈动员”为定见。军方所关注者，乃战时后方之绝对稳定。汤氏呈文主张将下乡运动演变为“清乡与整编”，拟派军警武力全面进驻，强行清剿地方土匪与抗租武装，严编保甲自卫队并施以军事训练，以铁血秩序确保军粮征购流向不受阻碍。\n\n陈千语则长于组织渗透，谓盲动底层易激宗族械斗，因循失控。其提案主张“设支部于乡里，联绅贤以持重”，利用地方开明绅士与宗族长老之声望，建立严密的基层情报与察核网络，辅以大规模宣讲，从思想与组织上实现对乡村社会的绝对控制。\n\n佩丽卡专治经济改良，谓乡村之贫困动荡源于生产落后。她条陈《兴办现代农业合作社方案》，主张由政府提供微贷与优良农机，派遣技术人员指导农桑，并推行科学的土地清丈与赋税登记。以制度化、产业化之手段提升农村生产力，从而实现基层的长治久安。\n\n诸方条陈利弊互见，钧座如何落笔，事关华南数万村落之明天。"
  roc.18.a: "深入陇亩，切实解决农工生计"
  roc.18.b: "清剿匪患，编组地方自卫武装"
  roc.18.c: "设支部于乡里，严密地方察核"
  roc.18.d: "推行农业合作，兴办现代农桑"

  roc.19.title: "三军现状"
  roc.19.desc: "军政部日前奉令通盘点验本政权之军事家底。据呈阅之点验密折所载，华南陆海空三军虽略具御侮之雏形，然兵械陈旧、元气未充之窘态亦跃然纸上：\n\n陆军方面，现统辖正规军各师旅，虽粗具现代整编规模，然粮饷械弹仍形见绌，士兵多操各色杂械；另有各县保安民兵，用作防务维持。尤为特殊者，乃汤汤所部之「清波寨民兵」。该部本系草莽游侠出身，久经地方战火，虽编制庞杂、纪律稍逊，然个个长于山地游击与短兵肉搏，今感念大义接受整编，可为我军出奇制胜之侧翼奇兵。\n\n海军方面，基础素称薄弱。现存舰艇与骨干，多为昔日北伐及前此各次政变期间，感念大义投诚归附之起义官兵，以及部分残存之旧制驳船。所辖吨位最大者，亦不过数艘暮气沉沉之江防岸防舰与内河炮艇。主炮威力既弱，装甲尤薄，仅能勉强巡防珠江口岸及各处内河水道，断难在远海与列强巨舰争锋。\n\n空军方面，其凋敝状况与国内各省无异，殊堪痛心。航空委员会库储之中，多为早年自欧美拼凑购入之各式双翼教练机，及极少数性能落伍、机件老化之旧式单翼侦察机。由于零件无着、油料奇缺，飞将虽有报国之志，奈何铁翼难展。目前各机队仅能勉强维持每日之斥候联络，防空袭扰能力近乎于无。\n\n三军现状如此，内省外顾，百端待举，正赖我辈筚路蓝缕、克难图强。"
  roc.19.a: "我们要建设一支无愧于民国的军队"

  roc.20.title: "徐州誓师"
  roc.20.desc: "徐州城郊的旷野上旌旗猎猎，数万国民革命军将士列阵而立，枪刺在夕阳下闪着寒芒。苦守广府、四面受敌的漫长岁月刻在他们脸上，那是南国的暴风雨和连绵硝烟打磨出的坚韧。多少年了，从困守五岭到饮马长江，从誓师粤中到克复金陵，他们这支在各方夹缝中苦苦支撑、九死一生的军队，终于彻底荡平了华南，打过了长江，打出了一片天。\n\n誓师高台临时用土石筑成，简朴却威严。一面青天白日旗在晚风中缓缓飘卷，军委会常务委员、北伐军总司令何应钦正立于台前。台下那一张张面孔他太熟悉了。有人缺了耳朵，有人脸上的弹痕还没好利索；有与她在广府大本营的焦土上同生共死十余载、发丝斑白的老同志，也有在两广闽赣农村新参军的年轻面孔。他们将命压在这里，在没有外援、孤立无援的黑夜里熬了过来。而现在，他们攻克南京之后，终于站在了徐州城下，再度誓师准备底定中原。\n\n何应钦深吸一口气，开口了。她的声音不高，却像山风过松，每个字都清晰地送进数万人的耳中——\n\n“徐州地方，历代大规模征战五十余次，是非曲直，难以论说。但史家无不注意到，正是在这个古战场上，决定了多少代王朝的盛衰兴亡，此兴彼落。所以古来就有‘问鼎中原’之说。”\n\n何应钦的声音忽然拔高，带着一种滚烫的激昂。“昔日第一次北伐之时，我军分路汇合徐州，兴师北上。也正是在这徐州城郊，我有幸亲率十数万健儿，与顽敌喋血搏杀，大获全胜！”\n\n她猛地攥紧拳头，向前迈了一步。那一刻，多年孤军死守的屈辱与等待仿佛在她眼中燃烧。“诸位同志！两广闽赣乃至金陵古都已尽归我手。但我辈革命，岂能止步于此？燕京伪廷尚在苟延残喘，腐朽的旧帝国势力仍虎视眈眈。自辛亥革命至今，国家还没有真正统一，老百姓还没有真正站起来！今天我们站在这里，站在两千年来无数英雄问鼎中原的起点上。但我要告诉诸位，我们这一仗，不为问鼎！不为称王！不为改朝换代！”\n\n何应钦霍然转身，面向北方。晚风灌满她的军装，吹得衣角猎猎作响。她抬起右臂，食指如刀，指向暮色中苍茫的地平线，指向那云海之外的北方山河。她的声音陡然沉雄下来，一字一句像是在铁砧上锤打而出——\n\n“我们这一仗，是要彻底铲除军阀与腐朽伪廷！是要将帝国主义逐出国境！是要让四万万同胞，不受欺辱地活在这片土地上！”\n\n他眼中闪着光，那是死守广府、最绝望时也从未熄灭过的光。她望着这支百炼成钢的队伍，望着这些把最好的年华都交给了华南战场、交给了革命的汉子们，一字一顿，声音骤然拔至最高——\n\n“诸位同志，随我北上！打过黄河，打过燕山，指戈长白山麓！”"
  roc.20.a: "打倒列强除军阀！"

  roc.21.title: "粤桂战争"
  roc.21.desc: "逆首汪兆铭前此勾结旧桂、密谋叛国之劣迹败露，仓皇潜遁梧州。岂料其非但不知闭门思过，反倒自甘堕落，与旧桂系军阀陆荣廷沆瀣一气。逆党群小执迷不悟，竟于南宁纠集残余，僭号“南宁国民政府”，公然与广府分庭抗礼，妄图以伪易正，分裂党国。\n\n消息传至粤中，自军委会委员至三军将士，无不义愤填膺，切齿痛恨！汪逆昔日身居党国要职，满口主义垂范，不料一转身竟为一己之私欲，不惜引狼入室，将利刃对准昔日同生共死之袍泽，密谋绑架主官，出卖粤中父老。此等寡廉鲜耻、数典忘祖之卑劣行径，实属罪无可逭，诚为党国之巨蠹、四万万同胞之公敌！一言及此，莫不痛心疾首。\n\n尤可恨者，陆逆荣廷窥伺粤中财赋久矣，今得逆党为张本，已尽起桂军精锐，自西江、封川一线大举压境，粤桂边境烽烟陡起，枪炮齐鸣。此番同室操戈，全系叛徒与旧军阀各怀鬼胎、倒行逆施所致。国贼既已兵戎相见，革命道统所在，断无退让之理，唯有厉兵秣马，恭行天罚，彻底荡平南宁伪府！"
  roc.21.a: "此等叛徒国贼，唯有以血洗血！"

  roc.22.title: "粤桂战争"
  roc.22.desc: "逆首汪兆铭潜逃南宁之后，不仅毫无负罪潜隐之意，反倒变本加厉。其在旧桂系军阀陆荣廷的刀兵庇护下，竟公然僭建所谓“南宁国民政府”，自立伪府，妄图以伪易正。汪逆昔日身居要职，一朝败露，竟甘愿沦为旧军阀窥伺粤中的政治招牌，此等自绝于民国、分裂党国之狼子野心，已是昭然若揭，令本党本军上下无不切齿痛恨！\n\n军事委员会对此彻夜密议，众将领一致认为，对付此等引狼入室、负隅顽抗之蠹贼，断不可姑息养奸，更不能坐视南宁伪府好整以暇、引火东来。粤桂唇齿相依，若陷入消极防御之被动，则粤中财赋、前线根据地皆将永无宁日。与其待其羽翼丰满、大举进犯，不如在伪府立足未稳之际，彰显本党道统大义，抢先挥师西征，先发制贼！\n\n讨逆动员令日前已由军委会连夜下达，三军总指挥部正式发布西征绝密军令。前线主力克期动员，水陆并进，前锋各师已衔枚疾走，直扑封川、梧州之要冲；西江江面上炮舰列阵，封锁关隘。此战非为两省之私怨，实为荡平国贼、稳固革命后方之大义举。既然南宁逆党甘心与旧军阀合流，我辈唯有以雷霆之势恭行天罚，直捣西江，彻底荡平南宁伪府！"
  roc.22.a: "大军西征，毕其功于一役！"


  roc.70.title: "宁广合流"
  roc.70.desc: ""
  roc.70.a: "革命的一大步"

  roc.71.title: "[FROM.Getname]宣布反对广州"
  roc.71.desc: "（待填充）"
  roc.71.a: "该死！"

  roc.72.title: "南京起义失败"
  roc.72.desc: "（待填充）"
  roc.72.a: "我们迟早会回到南京的。"

  roc.73.title: "国民革命军整编"
  roc.73.desc: "随着中华统一战线的成立，原本针锋相对的国民革命军和神州陆军结束了自北伐战争以来的相互对峙，神州帝国将抽调绝大部分兵力前往山海关的正面战场，国民革命军则主要负责防备西南面的樱花军队与海上的威胁。\n如今，全国统一抗战的大局已然形成，建立全国统一的指挥体系也迫在眉睫，尽管中华帝国北京政府或许在数月前仍是我们急需铲灭的敌人，但在此安危绝续之交，唯赖举国一致，服从纪律，严守秩序。\n接受整编与统一指挥，并不是说我们放弃了北伐，放弃了孙先生的三民主义，相反，同中国一切决心真正救国救民的有组织的力量结成反对樱花帝国主义及其走狗的广泛的反帝统一战线。才是三民主义在中华民族面临生死存亡的历史关头，挽救民族危亡的最好表现。"
  roc.73.a: "青天白日存在于我等心中"

  roc.74.title: "华南特区政府成立"
  roc.74.desc: "（待填充）"
  roc.74.a: "兄弟阋于墙，外御其侮"

  ROC_navy_trade.1.t: "[FROM.GetAdjective]提议委托我们建造潜艇"
  ROC_navy_trade.1.d: "近日，[FROM.GetName]表示，他们需要扩充海军的规模以维护东亚海域的平衡，并由[FROM.GetName]曾留学于我国的海军军官们拟定了一份委托造舰方案——就像当年的北洋水师一样。\n该方案建议，由[FROM.GetName]出资，委托我国建造八艘潜艇。\n\n由于缺乏其他潜在的卖家，[FROM.GetAdjective]的出价十分可观，但说到底这件事情的决定权在我等而不是国府手中。"
  ROC_navy_trade.1.a: "同意该方案"
  ROC_navy_trade.1.b: "拒绝该方案"
  ROC_navy_trade.2.t: "[FROM.GetAdjective]提议委托我们建造驱逐舰"
  ROC_navy_trade.2.d: "近日，[FROM.GetName]表示，他们需要扩充海军的规模以维护东亚海域的平衡，并由[FROM.GetName]曾留学于我国的海军军官们拟定了一份委托造舰方案——就像当年的北洋水师一样。\n该方案建议，由[FROM.GetName]出资，委托我国建造四艘驱逐舰。\n\n由于缺乏其他潜在的卖家，[FROM.GetAdjective]的出价十分可观，但说到底这件事情的决定权在我等而不是国府手中。"
  ROC_navy_trade.3.t: "[FROM.GetAdjective]提议委托我们建造轻巡洋舰"
  ROC_navy_trade.3.d: "近日，[FROM.GetName]表示，他们需要扩充海军的规模以维护东亚海域的平衡，并由[FROM.GetName]曾留学于我国的海军军官们拟定了一份委托造舰方案——就像当年的北洋水师一样。\n该方案建议，由[FROM.GetName]出资，委托我国建造两艘驱逐舰。\n\n由于缺乏其他潜在的卖家，[FROM.GetAdjective]的出价十分可观，但说到底这件事情的决定权在我等而不是国府手中。"
  ROC_navy_trade.4.t: "[FROM.GetName]拒绝了提案"
  ROC_navy_trade.4.d: "经过多轮谈判磋商，[FROM.GetName]最终拒绝了我们的委托。"
  ROC_navy_trade.4.a: "行吧"
  ROC_navy_trade.5.t: "[FROM.GetName]同意建造潜艇"
  ROC_navy_trade.5.d: "经过了几轮谈判磋商，尽管[JAP.GetName]施压了不小的阻力，但我们最后成功说服了[FROM.GetName]。他们表示相关款项一到账就开始建造。"
  ROC_navy_trade.5.a: "太好了，快派人去汇丰银行！"
  ROC_navy_trade.6.t: "[FROM.GetName]同意建造驱逐舰"
  ROC_navy_trade.7.t: "[FROM.GetName]同意建造轻巡洋舰"
  ROC_navy_trade.8.t: "[FROM.GetName]寻求购买重型战舰"
  ROC_navy_trade.8.d: "近日，[FROM.GetName]表示，他们需要扩充海军的规模以维护东亚海域的平衡，并由[FROM.GetName]曾留学于我国的海军军官们拟定了一份委托造舰方案——就像当年的北洋水师一样。\n该方案建议，由[FROM.GetName]出资，委托我国建造重型战舰。\n\n显然他们也没觉得我们会同意这种提议，在我方拒绝了该提议后，他们又转而提议购买我方因经济危机停建的战舰或更老旧的重型战舰。\n战列舰自然是不能出售的，我国也几乎没有留着什么更旧的船，谈判一度陷入了僵持。\n不过在最近的一次讨论中，国府表示经过他们的查证，有一部分老旧的前无畏舰被我们送到了[EAS.GetName]并改称“缅因猫级”，这几艘战舰目前也遭废弃，在当地几乎成为了地标。\n\n前无畏舰这种老古董就不在不能出售的范围之内了，总之，出售与否的决定权依旧在我方。"
  ROC_navy_trade.8.a: "反正是堆废铁，报个高价还能挣点。"
  ROC_navy_trade.8.b: "就算是废铁也是有价值的废铁！"
  ROC_navy_trade.9.t: "[FROM.GetName]同意出售重型战舰"
  ROC_navy_trade.9.d: "经过多次磋商，由于[FROM.GetName]坚决不同意出售战列舰，我方便提议购买其荒废在[EAS.GetName]的前无畏舰，他们同意了。\n但要价昂贵，根据这份协议，我们预计要支出约伍佰亿元（单位为圣杯联邦货币）以购买两艘“缅因猫级”前无畏舰，但购买重型战舰机会难得，我们必须做出抉择。"
  ROC_navy_trade.9.a: "干了！"
  ROC_navy_trade.9.b: "……其实我们也不是很需要啊"
  ROC_navy_trade.10.t: "[FROM.GetName]同意购买"
  ROC_navy_trade.10.d: "[FROM.GetName]同意了购买前无畏舰。"
  ROC_navy_trade.10.a: "合作愉快"
  ROC_navy_trade.11.t: "[FROM.GetName]拒绝购买"
  ROC_navy_trade.11.d: "[FROM.GetName]拒绝了购买前无畏舰。"
  ROC_navy_trade.11.a: "那就不卖！"



####新闻###
  roc_news.001.t: "$news_event_background$国民党左派统一中国"
  roc_news.001.d: "据前线传来的报告证实，近日最后一处抵抗新民国军队的反对派武装势力已经被击溃，这似乎标志着整个神州大陆已经不再有成建制的抵抗反对新政府。在旧神州帝国被国民革命军击溃之后，新政府便加紧了恢复内陆秩序的步伐。随着最后的抵抗被肃清，国民政府已经能够在帝国旧领的废墟上建立属于神州人民的新秩序。诚然，不满于左翼共和主义者统治的抵抗力量仍然存在于地方乃至神州边境，但是对于一个已经在整个神州地区建立了稳固统治的民国政权而言，他们很显然已经不值一提。\n很多事情还是一个未知数，他们是否会帮助北方的布尔什维克并起兵干预如火如荼的“伟大战争”？抑或是说他们目前只会在有限的空间里默默舔舐内战的伤口？但不管怎么说，它的存在对于圣杯在东亚的秩序已然是一个新的巨大威胁。"
  roc_news.001.a: "人民万岁！"
  roc_news.001.b: "这决不会是好事。"
  roc_news.001.c: "也许我们的步伐需要加快。"
  roc_news.001.e: "无关紧要，我们迟早会击溃他们。"
  roc_news.001.f: "不管怎么说，这是一场新的胜利！"
  roc_news.001.g: "唯有希望我们的利益与其相容。"

  roc_news.002.t: "$news_event_background$国民党右派统一中国"
  roc_news.002.d: "随着最后一个不服从国民政府的割据势力缴械投降，位于[ROC.Capital.GetCapitalVictoryPointName]的国民政府已经彻底削平了每一个不服从新中央号令的顽固军阀。随着新政府逐步向服从地方军阀机关派出行政人员并接管旧军阀军队，新政府在断绝孱弱帝国的天命之后开始着手于整合整片神州大地。尽管残余的保皇派力量仍然在旧帝国领试图重建他们的影响力，但是他们对于这个新政权而言目前并不具备足够的威胁。\n早在要求军阀易帜服从中央之时，共和派便已开始筹备新共和国的第一次国家大选。尽管国民党因领导北伐颇有民望，但是更多的共和主义拥护者亦组织起了声势浩大的反对力量。民盟党人随时准备挑战国民党的领导地位，而现在业已无任何障碍能阻止民主反对派要求国民党开始大选的步伐。\n不管怎么说，有一点已是板上钉钉：取代了腐朽帝国，统一神州的是一个无人敢设想的共和政府。对于未来而言，国民党人理所当然会继续他们的训政；但如果新的反对派系取而代之，也许这个共和国会对处于战火中的世界局势做出更激进的反应。"
  roc_news.002.a: "共和之梦几经波折，终是大功告成。"
  roc_news.002.b: "让我们期待公道得胜。"
  roc_news.002.c: "也许事情会变得相当麻烦。"
  roc_news.002.e: "应当为被屠戮的同志流下热泪。"
  roc_news.002.f: "看样子这个共和国的未来尚难明晰。"

  roc_news.003.t: "$news_event_background$蓝衣社统一中国"
  roc_news.003.d: "随着最后一个不服从国民政府的割据势力宣布俯首，位于[ROC.Capital.GetCapitalVictoryPointName]的极端民族主义政权已经彻底削平了阻挡神州人民迎接大一统的任何障碍。随着民族主义者在各地建立地方统治并扩张准军事组织之后，新政府在断绝孱弱帝国的天命之后开始了让神州民族迈向伟大的第一步。而一切阻拦他们在辽阔的神州大地建立一个法西斯政权的尝试在强大的国民军与蓝衣社面前都显得微不足道。\n尽管民族主义者的下一步还未确定，但可以预见的是，在旧神州帝国的尸体之上，另一群想要扩张神州民族影响力的国民党人已经准备好在民国建立起广泛的军事统治，将神州大陆以最快的速度送上战争轨道。考虑到另一大右翼势力——魔导国正在欧洲与各方势力鏖战，拥有巨大军事力量作为支撑的东亚民族主义政权很可能会考虑介入战争，并给原本相对安全的印度洋沿岸的圣杯势力造成巨大威胁。"
  roc_news.003.a: "吾辈所求者决不仅限于此。"
  roc_news.003.b: "法西斯党徒的扩张必须被遏制！"
  roc_news.003.c: "他们会成为我们的朋友吗？抑或是更穷凶极恶之敌？"
  roc_news.003.e: "一群叛徒！"
  roc_news.003.f: "唯有希望我们的利益与其相容。"
  roc_news.003.g: "我们还有余力防范远东吗？"

  roc_news.004.t: "$news_event_background$国民党夺取两广"
  roc_news.004.desc: "在叛乱刚刚开始之时，新天子的朝廷仍寄希望于东南军区的帝国军队，希望她们能扑灭在两广兴起的革命派武装。然而情况比朝廷想象的糟太多——两广总督、还有当地的绝大府县长官在叛乱伊始便宣布易帜，而现在，已经到帝国必须接受现实之时——国民政府在广州宣布成立，而流亡海外的大批革命党军政人员正涌入两广，内战再起已成定局。"
  roc_news.004.a: "三民主义必将统一中国！"
  roc_news.004.b: "或许我们暂时可以达成合作"
  roc_news.004.c: "难道10年前还没打垮她们吗？"
  roc_news.004.d: "难道10年前还没打垮她们吗？"
  roc_news.004.e: "一路顺风，革命者。"

  roc_news.005.t: "$news_event_background$国民党左派赢得选举"
  roc_news.005.desc: "国民党第一次归正大会已于昨日结束，作为决定新生的国民政府政治路线的重大会议，左翼在党内选举中赢得优势席位，[ROC.Getleader]宣布就职国民政府主席。党权也已把握在党内的社会主义者手里。这意味着国民政府会与云贵的共产主义政权更加亲近。若他们夺取华夏大权，一场根本性的政治变革将难以避免。"
  roc_news.005.a: "三民主义必将统一中国！"
  roc_news.005.b: "或许我们暂时可以达成合作"
  roc_news.005.c: "这群暴徒"
  roc_news.005.d: "这群暴徒"
  roc_news.005.e: "还是被极权主义侵染了。"
  roc_news.005.f: "一路顺风，革命者。"

  roc_news.006.t: "$news_event_background$国民党右派赢得选举"
  roc_news.006.desc: "国民党第一次归正大会已于昨日结束，作为决定新生的国民政府政治路线的重大会议，右派得以继续巩固她们在党内的统治，并且能够左右国民政权的政治行动。诚然，正统三民主义的地位得以延续，但她们的民国会给饱经战乱的神州大地带来真正的共和政治吗？抑或是让一位新的强权者走上舞台？"
  roc_news.006.a: "三民主义必将统一中国！"
  roc_news.006.b: "这群暴徒"
  roc_news.006.c: "这群暴徒"
  roc_news.006.d: "这群暴徒"
  roc_news.006.e: "干得漂亮"
  roc_news.006.f: "应当为被屠戮的同志流下热泪。"

  roc_news.007.t: "$news_event_background$蓝衣社政变"
  roc_news.007.desc: "（待填充）"
  roc_news.007.a: "三民主义必将统一中国！"
  roc_news.007.b: "这群暴徒"
  roc_news.007.c: "这群暴徒"
  roc_news.007.d: "这群暴徒"
  roc_news.007.e: "这群暴徒"
  roc_news.007.f: "这群暴徒"

  roc_news.008.t: "$news_event_background$国共联合北伐"
  roc_news.008.desc: "近日，中国共产党与国民党达成共识：在接下来的时间里，两党将以反封建工作作为当前革命事业的第一要务，为此，两党两军将精诚合作，共同将革命的尖刀插向神州帝国的心脏。工农红军与国民革命军分别在西北和东南方向做好了进攻准备，神州帝国展开了战备动员，做好了相应的迎击计划。\n\n各国军事评论家们普遍认为：在两面夹击下，神州帝国战线过长，帝国军队的数量可能会捉襟见肘。同时，倘若神州帝国战败，战后占领区划分问题恐怕会引发国共两党新一轮的冲突。"
  roc_news.008.a: "你我二军合力，焉有一合之敌"
  roc_news.008.b: "1912打赢了，现在再打一次"
  roc_news.008.c: "打起来，打起来！"
  roc_news.008.d: "两面包夹之势了"

  roc_news.009.t: "$news_event_background$国共联合政府成立"
  roc_news.009.desc: "击败神州帝国后，中国革命的反封建任务已经完成，全世界的观察家、政治家们都关注着中国国共两党接下来的动作。作为中国领导权最有力的两大竞争者，她们的抉择将会决定这片多灾多难的大地未来的走向。\n\n近日，在两党最高领导层的会谈之中，双方进行了亲切友好的交谈，并就中国的革命问题达成了一致，认为两党的革命是有着共通性的。在数日的会议后，双方达成共识，两党将以和平的方式组建联合政府，共同推进中国的革命与建设工作，共产国际支部也随中国共产党进驻新联合政府。"
  roc_news.009.a: "我们联合"
  roc_news.009.b: "她们怎么混一块去了？"
  roc_news.009.c: "出人意料的联合"

  roc_news.010.t: "$news_event_background$北伐宣言"
  roc_news.010.d: "最新消息，逐渐稳固了地区统治的国民政府正式发表了《北伐宣言》，宣言中痛斥了神州帝国腐朽落后的统治，表明了推翻帝制，建立民国的决心。尽然看起来不可思议，但短短的时间内国民革命军已经从刚刚出山的游击队转变为了一支强大的正规军，虽然数量上不如帝国军队，但是其严格的训练和强大的意志力仍然是帝国军无法匹敌的，西方军事专家普遍对北伐的成功抱有乐观态度。"
  roc_news.010.a: "我们定会取得胜利！"
  roc_news.010.b: "看来不久战事就会爆发。"
  roc_news.010.c: "这群狗日的暴徒！"

  roc_news.011.t: "$news_event_background$中国国民党宣布建立中华民国"
  roc_news.011.d: "随着帝国军的抵抗被彻底粉碎，中国国民党在当前成为了中国首屈一指的政治力量，中国延续两千多年的封建专制统治就此走到了尽头。中国国民党的创立者，已故革命家逸仙提出的中国民主政治建设中的第一个阶段——“军政期”被国民党人宣告结束，他们同时宣布“被帝制专政荼毒的中国获得了新生”，中国也开始进入逸仙所构想中的第二个发展阶段——“训政期”的建设阶段。但不可否认的是目前中国尚未完成完全统一，地方上依然有着强力的割据势力在试图挑战新政权的权威，[ROC.GetLeader]宣称在中国完全统一且训政工作完成后就将实行宪政，成为一个真正的民主共和国。国民党人宣称的“中华民国”理想会让中国走向何方还是个未知数，但是一个整合起来的稳定的古老的辽阔的人口大国必定会对世界格局产生不可逆的重大影响。"
  roc_news.011.a: "中华民国万岁！"
  roc_news.011.b: "他们的下一个目标就会是我们。。。"
  roc_news.011.c: "中国的历史从此刻改写"

  roc_news.012.t: "$news_event_background$中国国民党宣布建立中华民国"
  roc_news.012.d: "随着帝国军的抵抗被彻底粉碎，中国国民党在当前成为了中国首屈一指的政治力量，中国延续两千多年的封建专制统治就此走到了尽头。然而国民党拒绝遵循已故创始人逸仙的遗训实施训政，[ROC.GetLeader]在演讲中公然声称软弱的民主主义是无法带领饱经摧残的中国重振雄风的，中华民国将坚持“一个主义，一个政党，一个领袖”的原则，扫清一切内外部的阻碍。据各路分析人士指出，中国国民党已经完全被新兴派系————“蓝衣社”把控，这是一个对德国的阿道夫·丽莎所创立的“民族社会主义”无比推崇的组织，中国在日后很可能会转型成一个集权程度远高于神州帝国的法西斯国家。但不可否认的是目前中国尚未完成完全统一，地方上依然有着强力的割据势力在试图挑战新政权的权威，[ROC.GetLeader]宣称这些螳臂当车的分裂势力很快就会被强大的国军荡平。国民党人宣称的“中华民国”理想会让中国走向何方还是个未知数，但是一个整合起来的稳定的古老的辽阔的人口大国必定会对世界格局产生不可逆的重大影响。"
  roc_news.012.a: "[ROC.GetLeader]万岁！"
  roc_news.012.b: "他们的下一个目标就会是我们。。。"
  roc_news.012.c: "中国的历史从此刻改写"

  roc_news.013.t: "$news_event_background$宁广合流"
  roc_news.013.desc: "随着南直隶的光复与旧秩序的瓦解，广州国民政府主席[ROC.GetLeader]应金陵各界及光复同志的诚挚邀请，今日乘专列抵达南京！\n在下关火车站举行的盛大欢迎仪式上，[ROC.GetLeader]与在光复南直隶中功勋卓著的[JSZ.GetLeader]亲切会面，双手紧握，向全天下宣告：分裂的革命力量已成为历史，一个统一、强大的国民政府正式诞生！\n随后，在原总督府举行的联合会议上，双方达成历史性决议：\n广州国民政府与南京临时领导机构正式合并，组成中华民国国民政府。定都南京，以此六朝古都、革命先驱中山先生陵寝所在之地，作为领导全国革命与建设的中心。\n在响彻全城的“统一革命、拥护新政府”的欢呼声中，青天白日满地红旗在南京城的每一个角落高高升起。这意味着，从珠江到长江，革命力量已连成一片，一个崭新的政治中心已然形成。它不仅是军事上的胜利，更是政治上的伟大奠基。北伐统一的神圣事业，自此拥有了无比坚实的核心！"
  roc_news.013.a: "全民族联合起来，为建设新神州而奋斗！"
  roc_news.013.b: "反动派的势力增强了"
  roc_news.013.c: "国民党的势力增强了"
  roc_news.013.d: "国民党的势力增强了"
  roc_news.013.e: "民主的胜利"
  roc_news.013.f: "可惜她们不会违背逸仙先生的愿望"

