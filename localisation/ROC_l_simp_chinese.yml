  ROC_when_yat_sen_meeting_Cong: "当逸仙遇上孔夫子"
  ROC_when_yat_sen_meeting_Cong_tt: "§L“就先生个人自身来说，可以用三句话包括起来，是学不厌，教不倦，行不惑。\n\n……先生是有特殊的政治天才的人，所以四十年来，所作的革命事业，和所发表的政治意见，非常伟大精深。在研究中外圣贤的思想上，分析得清清楚楚。”“先生的思想是爱中国人，先生的信仰也是爱中国人，先生的力量也是爱中国而生。把这一个爱中国人的心推广起来，就是爱全亚洲的被压迫民族，爱全世界的被压迫民族，推到极处，就是爱一切人类。”“逸仙先生的思想，完全是中国的正统思想，就是继承尧舜以至孔孟而中绝的仁义道德的思想。在这一点，我们可以承认逸仙先生是两千年以来，中绝的中国道德文化的复活。”§!\n\n"

