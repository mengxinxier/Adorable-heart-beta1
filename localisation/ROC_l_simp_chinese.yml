  ROC_policy_card_name_91: "总理遗嘱"
  ROC_policy_card_desc_91: "孙中山逝世前留下的遗嘱，至今仍在每一次国民党全国代表大会开幕式上被全文诵读。“余致力国民革命凡四十年，其目的在求中国之自由平等……”每一个在场的人都会起立，无论他们心里在想什么。"
  ROC_policy_card_modifier_91: "§R搁置争议，一致北伐！§!\n$MODIFIERS_ARMY_ATTACK_FACTOR$：§G+10.00%§!"
  ROC_policy_card_name_92: "文官考试制度"
  ROC_policy_card_desc_92: "宋娇仁和佩丽卡设计了一套全国性的文官选拔考试制度。考试内容不涉及意识形态，只考查行政能力、法律知识和专业素养。"
  ROC_policy_card_modifier_92: "$MODIFIER_POLITICAL_POWER_FACTOR$：§G+10.00%§!\n$ROC_Constitutionalists_influence_monthly$：§Y+1%§!"
  ROC_policy_card_name_93: "党员忠诚档案"
  ROC_policy_card_desc_93: "陈晖洁以中统为基础，建立了一套覆盖全体党员的秘密忠诚档案。档案中记录的不是每个人的政治观点，而是每个人的行为模式和社交网络。她称其为“党务科学化”。"
