  ROC_NRA_modifier: "国民革命军"
  ROC_NRA_modifier_desc: "§C国民革命军§!\n\n\n\n\n£GFX_ROC_NRA_modifier_picture\n\n\n\n\n这支军队诞生于广州黄埔长洲岛的涛声之中。彼时，先总理孙中山先生高瞻远瞩，在苏联的物资援助与共产党的全力协助下创办了黄埔军校。周恩莱担任政治部主任，将军校以政治教育为核心，第一次让每一个手握钢枪的年轻学员理解了“为什么而战”。这彻底改变了旧时代“兵为将有”的私兵传统，铸就了革命军的灵魂。\n然而，通往共和的道路注定布满血泪。1926年北伐军势如破竹，眼看就要直取中原，却在1927年遭遇了建军以来最惨烈的梦魇——在郑州郊外，袁克定悍然掘开花园口大堤，滔滔黄河水裹挟着北方军的攻势，将北伐军主力全歼于一片汪洋之中，统帅蒋介石校长亦当场战死。那一夜的洪水不仅砸碎了革命军的脊梁，也让曾经众志成城的广府陷入了长达八年的沉寂。\n如今，八年的休整虽然让经济渐趋繁荣，军队在整编后也恢复了元气，但那些曾经纯粹的黄埔门徒，却早已在漫长的挫败中分化瓦解。\n当二次北伐的号角再度吹响，这支军队究竟会成为刺破神州黑夜的利剑，还是会在内部派系的烈火中被彻底燃尽？"
