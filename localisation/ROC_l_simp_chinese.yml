 ##外交卡
  ROC_policy_card_name_61: "以俄为师"
  ROC_policy_card_desc_61: "苏联是第一个承认广州国民政府并与之建立正式外交关系的国家。莫斯科的援助不仅包括武器和军事顾问，还包括一整套革命建国的理论框架——尽管这套框架在中国的土壤上需要大幅度的修正。"
  ROC_policy_card_modifier_61: "@SOV苏联关系：§G+1§!\n$MODIFIER_ARMY_ORG_FACTOR$：§G+10.00%§!"
  ROC_policy_card_name_62: "扩大与圣杯合作"
  ROC_policy_card_desc_62: "圣杯驻广州总领事馆与广府之间维持着一种实用主义的关系。伦敦不喜欢革命，但需要广东的生丝和茶叶；广府不喜欢帝国主义，但需要香港的转口贸易。"
  ROC_policy_card_modifier_62: "@ENG圣杯关系：§G+1§!\n$hcp_income_factor_monthly$：§G+10.00%§!"
  ROC_policy_card_name_63: "南洋侨务"
  ROC_policy_card_desc_63: "数百万华侨散居东南亚各地，从海峡殖民地到远洋国，从暹罗到菲律宾。他们的汇款养活了半个粤省，他们的子弟有些已加入当地政商界。广府需要一个专门的侨务机构来维护这条生命线。"
  ROC_policy_card_modifier_63: "@NGD远洋关系：§G+1§!\n$hcp_income_factor_monthly$：§G+10.00%§!"
