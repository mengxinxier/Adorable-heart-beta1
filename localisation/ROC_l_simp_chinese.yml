  ROC_mass_engagement: "接触群众"
  ROC_mass_engagement_desc: "自古谈及治乱，历代多受“皇权不下县，乡里凭宗族”之因袭。昔日政令往往止于城廓浮表，广阔乡村实为土绅、宗族盘踞，国家与小民形同陌路，致使民力散落、粮饷难征。然当此内忧外患、欲图自强之际，若仍坐视国府与陇亩相隔膜，则根据地终成沙滩之阁。中枢对此已有定见：必须打破此千年之积弊，直接深入群众，将国家权力之触角切实延伸至最底层。唯有彻底洞穿传统基层之藩篱，方能汲取源源不绝之兵源与物质伟力，重塑本政权之乡村根基。"
  ROC_mass_engagement_1: "接触群众"
  ROC_mass_engagement_1_desc: "自古谈及治乱，历代多受“皇权不下县，乡里凭宗族”之因袭。昔日政令往往止于城廓浮表，广阔乡村实为土绅、宗族盘踞，国家与小民形同陌路，致使民力散落、粮饷难征。然当此内忧外患、欲图自强之际，若仍坐视国府与陇亩相隔膜，则根据地终成沙滩之阁。中枢对此已有定见：必须打破此千年之积弊，直接深入群众，将国家权力之触角切实延伸至最底层。唯有彻底洞穿传统基层之藩篱，方能汲取源源不绝之兵源与物质伟力，重塑本政权之乡村根基。"
  ROC_mass_engagement_2: "接触群众"
