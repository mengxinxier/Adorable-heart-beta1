  #杂项
  ROC.169.a.tt: "§L我们将率先在§4非中共自治区§!推行地方的民主自治，随后在§R中共自治区§!推行\n\n当推行完成后，所有地区都将获得一个地方自治的§Y动态修正§!，这将减少当地的可征募人口，但增加§Y地方最大工厂数§!和§Y补给§!以及§Y建设速度§!，§R中共自治区§!将在获得地方自治的同时失去自治区§Y动态修正§!§!"
  ROC.169.b.tt: "§L我们将在§R中共自治区§!推行地方的民主自治，§R中共自治区§!将在获得地方自治§Y动态修正§!的同时失去自治区§Y动态修正§!§!"
  ROC.169.c.tt: "§L我们将推动两个§R革命政党§!的合并，这将去除§R中共自治区§!的§Y动态修正§!§!"
  ROC.169.d.tt: "§L我们将和§R革命友党§!§4精诚团结§!，一同奔赴革命明天！\n\n这将去除§R中共自治区§!的§Y动态修正§!§!"
  ROC.169.e.tt: "§L我们将磋商关于自治事宜的解决方案，§R中共§!全面进入国会和参与地方选举。\n\n这将去除§R中共自治区§!的§Y动态修正§!§!"
  ROC.169.f.tt: "§L我们将恪守协议，在协定的过渡期结束之前，不改变§R中共自治区§!的格局。§!\n\n§Y对玩家的你来说就是不会去除地方的修正了。§!"
  ROC_UP_local_autonomous_level_up_tt: "§L因为我们选择了全面追求地方自治，获得以下效果：\n解锁决议：§Y完善地方自治§!\n我们可以通过完成该决议来强化地方自治的修正效果§!"
  ROC_NOT_be_another_leader_tt: "§Y$CHARA$§!不是当前的§Y副手§!"
  ROC_focus_GuoJunHu_DangJunHu_tt: "§L根据我们当前路线§4军队国家化§!问题的与否，该国策将会提供不同的效果。\n§!"
  ROC_focus_War_criminal_SaiBan_tt: "§L在§P民革§!和§Y宋庆龄§!的领导下，§4中央委员会§!决定：除穷凶极恶之战犯应立即处以极刑外，其他的战犯将送往特别设立的战犯管理所进行关押和改造。§!"
  ROC_focus_form_soviet_division_tt_1: "§L获得一个由§Y7步兵营 2炮兵营§!构成的师编制，并获得一个该编制的师\n\n若完成国策时§R苏联§!已经拥有科技§Y机械化步兵§!，获得一个§Y4机械化步兵营 4轻型坦克营§! 的编制，并获得一个该编制的师，若苏联未拥有机械化步兵，则将§Y机械化营§!改为§Y摩托化营§!。§!"
  ROC_dream_of_soviet_tt: "将政治线的所有§Y精神§!合并为§Y中国苏维埃之梦§!并追加效果：\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$：§G10%§!\n$MODIFIER_PRODUCTION_FACTORY_START_EFFICIENCY_FACTOR$：§G10%§!\n$MODIFIER_BREAKTHROUGH$：§G10%§!"
  ROC_PCC_modifier_tt: "§L该动态修正代表了我国民主协商制度的精神，§R社会主义§!支持率将提供生产相关修正，§F极权主义§!支持率将提供军事相关修正，§4自由主义§!支持率将提供消费品和政治点数、顺从度相关修正，§g威权主义§!支持率将提供科研相关修正。\n\n（相关数值每月更新）§!"
