  ROC_RCKMT_end_title: "至此，§P[ROC.Getname]§!的征途告一段落"
  ROC_RCKMT_end_tip: "洛茜继续在那些还没有通电的村子里建学校。宋主席每年寄出的信越来越少，收到的信越来越多。有一封信来自潮汕，写信的人是一个当年在土改试点中分到地的佃农的女儿。信里说，她现在在县城教小学，班上有四十三个学生。信的最后一句是：“宋主席，我识字了。”\n\n宋庆龄把这封信放在办公桌最上面的抽屉里。抽屉里还有很多信。她没有全部回复——太多了，回不过来。但每一封她都看了。\n\n“革命不是改朝换代。革命是让最穷的人也能抬起头来。我这一生没有做完这件事。但我开了个头。后来的人，会把这件事做完。”\n\n在新三民主义的领导下，中国的人民已经告别了吃不饱"
  ROC_RCKMT_end_tip_2: "感谢您对钢铁萌心与广州国民政府内容的喜爱与支持！"
  ROC_RCKMT_end_close_button: "加速向更美好的世界！"
  ROC_RCKMT_end_close_button_TT: "§L在做实事的人手中，中国的复兴或许不是最快的，但一定是最稳的。§!"

