  ROC_policy_card_name_03: "党军一体"
  ROC_policy_card_desc_03: "陈晖洁在党务会议上说——“军队的中层军官是我们最需要争取的对象。他们是枪杆子和党徽之间唯一的桥梁。”"
  ROC_policy_card_modifier_03: "$MODIFIER_LAND_REINFORCE_RATE$：§G+2.00%§!\n$MODIFIER_MOBILIZATION_SPEED$：§G+10.00%§!"
