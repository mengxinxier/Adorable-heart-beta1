  roc.53.title: "谁来做临时总统" #
  roc.53.desc: "打下南京的当夜，所有人都在争一件事：谁来做临时总统。\n\n这是新政权第一个也是最具象征意义的职位。革命委员会内部已经有声音推举宋庆龄，中正社的胡宗南在私下宴席上说“总统这个位置，最好是个姓蒋的”，CC系则保持沉默——陈晖洁在观望。\n\n宋教仁在定都后的第二天凌晨敲开了佩丽卡的房门。她正在整理从广州运来的行政档案。\n\n“我决定推举宋庆龄。”\n\n佩丽卡放下手里的卷宗。她没有问为什么。她只是说：“现在所有人都在猜你会不会自己选。你是国会第一大党的当然领袖。”\n\n“我知道。”宋教仁说，“但如果我现在争总统，所有人都会认为宪政同志会和其她人没有区别——革命还没结束，就开始分赃。我不会犯汪兆铭犯过的错误。”\n\n“总统是国家象征，不是权力核心。我想要的是行政院长。那个位置才决定国家的方向。”\n\n佩丽卡想了想。“你会得罪党内一些人。她们希望你当总统。”\n\n“那就让她们失望。一次失望，比一次灾难好。”\n\n当天晚些时候，宋教仁在广府各派联席会议上正式推举宋庆龄为临时总统。全场寂静了片刻。蒋巾帼看着宋教仁，神色复杂。中正社的胡宗南把手里没点着的雪茄搁在了烟灰缸里。宋庆龄本人在推辞两次后接受了提名。\n\n这是定都后第一次没有人反对的决议。\n\n次日，南京各家报纸的头版标题惊人一致——“宋教仁推举宋庆龄为总统”。措辞最微妙的是《申报》，原标题下加了一行副题：“此举是谦让，还是另有打算？”\n\n宋庆龄在当晚召见了宋教仁。她只问了她一句话：“你推举我做总统。你要什么？”\n\n“我要你来任命我来组阁。然后请让内阁对国会负责，而不是对你。”\n\n宋庆龄沉默片刻，点了点头。“你是第一个反着来的人——别人先要位置，再想怎么用。你先想制度，再想谁来坐。”"
  roc.53.a: "这是一个先例"

  roc.54.title: "临时约法的起草权" #
  roc.54.desc: "临时总统确定了。接下来必须确定的是：新政权依据什么来统治。\n\n革命委员会提出由其党务委员会拟定一份简短的《革命政府施政纲领》，以此作为过渡时期的根本文件。蒋巾帼解释说：“宪法太慢。革命不能等法学家。”\n\n宋教仁当场回应：“革命不能等法学家，但革命也不能不要法学家。没有法律的政府，比没有政府的法律更危险。”\n\n宋庆龄在听取双方意见后做出了一个关键决定：由宪政同志会的佩丽卡主持起草《中华民国临时约法》，草案完成后交各派联席会议审议。这意味着新政权的基本法将不由革命委员会垄断起草权，而是由最懂制度设计的专家来主导。\n\n佩丽卡在接到任务后没有发表任何政治宣言。她只是将办公桌搬到了原帝国议会档案室隔壁的一间空房里，从档案室调出了全部可用的中外法律文献。据档案室的管理员回忆，此后三周，那间房的灯从未在午夜前熄灭。\n\n她要做的事，在中国历史上没有先例：一部限制政府自身权力的法律。"
  roc.54.a: "总统是国家元首，但行政权属于行政院长。"

  roc.55.title: "选举规则的博弈" #
  roc.55.desc: "《临时约法》通过后，第一届国会的选举规则提上议程。这是决定未来数年中国政治版图的博弈——在制定和决定选举规则之外，还有哪一个议题足以如此根本地重塑权力？\n\n革命委员会的蒋巾帼提交了职业代表制方案：工人选工人代表，农民选农民代表，军人选军人代表。她的理由是：“文盲不能在地主的选票上签名，但文盲能选出自己信得过的种地人。”\n\n宋教仁听完汇报后，用一张纸列出了双方提案的人口覆盖数据，然后提交了一个修正方案：普选制，但附加识字能力权重——能读能写者，其投票权重在过渡期内略高于文盲。她对此只有一个简洁的说明：“民主不是一天建成的。但我们不能因此永远不建。这张选票不会完美，但它是第一张。”"
  roc.55.a: "一人一票，不让渡基本原则"

  roc.56.title: "CC系的转向" #
  roc.56.desc: "CC系在定都之后一直保持着克制。陈晖洁将主要精力投入基层党务建设，在苏皖两省建立了运转有序的组织网络。她没有参与总统之争，没有在选举规则辩论中站队，只是默默地做着组织工作。\n\n但在第一届国会选举前夕，她做出了一个影响深远的决定。\n\n陈晖洁主动拜访宋教仁。会面没有安排在宪政同志会的党部，而是在一间普通小学的教室里——据说是陈晖洁选的地点。她走进教室时，黑板上还写着上一堂课的课文。她看了一眼那些粉笔字，然后转向宋教仁，就事论事地说了一段大意如此的话：CC系的基层网络可以转型为选举动员平台，帮助识字不多或不识字的选民理解选举流程；这不是讨价还价，而是因为基层网撒出去之后，如果不能和宪法衔接，继续只靠党的纪律来推动运转，迟早会自我封闭。她愿意让CC系融入宪政框架之内，而不是在议会之外自成一个无法问责的系统。\n\n宋教仁听完后沉默了很久。然后她说：“陈委员。你今天说的这些，比我党纲里的任何一页都让我放心。”\n\n陈晖洁的回答也很短：“我不是帮你。我是在帮中国。”"
  roc.56.a: "一次没有交易的联合"

  roc.57.title: "第一届国会选举" #
  roc.57.desc: "第一届国会选举在苏、皖、浙、赣、闽、粤六省同时举行。这是中国历史上第一次由选民直接投票选举国家议员的尝试。程序远非完美：农村选区的选民名册残缺不全，不识字的选民需要由工作人员代为填写选票，部分偏远地区的票箱在运输途中被不明武装袭击。但数十万人在这一天走进了临时搭建的投票站。\n\n当计票在多日后完成，最终公布的选举结果使宪政同志会成为国会第一大派系，获得了约四成以上的席位。革命委员会位列第二。CC系和独立候选人也获得了一定席位。\n\n这个结果出乎许多人的预料。民革原本预期能凭革命的声望拿下多数，但选民在“革命党”和“议会党”之间，相当一部分人选择了后者。\n\n南京的报纸形容这一选举结果“平静得不像一场革命”。上海《申报》的标题是：“宋教仁赢了选举，蒋巾帼没输。”社论最后一句是——“但最大的赢家不是任何一个人。是那张选票本身。”\n\n选举结果公布的当晚，宋教仁来到佩丽卡的办公室。她没有抬头，仍在核对最后一批票数统计。\n\n“我们赢了。”\n\n佩丽卡将汇总表推到她面前：“43.7%。不够过半。你需要联合执政。”\n\n宋教仁对她点了点头：“我知道。这也正是我打算做的。”"
  roc.57.a: "选票比子弹更重"

  roc.58.title: "宋教仁的内阁" #
  roc.58.desc: "选举结果公布后，宋教仁作为国会第一大党领袖，被临时总统宋庆龄正式任命为行政院长，并受命组阁。\n\n她的内阁名单在一天内提交给国会。这份名单的用人让所有观察者意外——\n\n外交部长由革命委员会的一名温和派留英学者担任。财政部长由CC系推荐的一名前帝国银行高级职员担任。国防部长继续由稳重派军人何应钦留任，但副部长中安排了曾负责珠江航道预算、后来在国民教育委员会崭露头角的洛茜。她同时兼任教育部长。\n\n法务部长则由佩丽卡以技术官僚身份兼任——她拒绝加入宪政同志会党籍，理由是“法务部长不应该是一个党派的部长”。\n\n这份名单里没有一个宋教仁的亲属，没有一个宪政同志会的绝对亲信。在野党的席位被保留，退役与现役军人的代表角色被区分对待。\n\n蒋巾帼在国会质询环节站起来提问：“你把国防部交给何应钦，但副部长是一个不穿军装的教育官员。打仗的时候谁说了算？”\n\n宋教仁回答：“平时，国防部长。战时，总参谋长，但她需要在七十二小时内向国会国防委员会提交作战说明。你问为什么——我回答很简单：自从有了军队，将军们从来没缺过权力。但为什么发动战争、何时结束战争，过去没有一个将军需要面对一个由选票组成的委员会。选票是慢的。但慢，就是民主对战争的唯一答案。”\n\n蒋巾帼没有追问。她坐下来，在笔记本上写了一个字——这是她评价她人时最克制的做法：“对。”"
  roc.58.a: "这不是一个人的胜利，是一个制度的开端"

  roc.59.title: "组织的胜利" #
  roc.59.desc: "定都南京的那一天，宋教仁在议会里准备了演讲稿，蒋巾帼在军中筹划了人事方案，胡宗南在总统府前检阅了卫戍部队。\n\n陈晖洁没有做这些事。她只是让秘书把一份党员名册放在会议桌上。\n\n名册不厚，只有一百多页。但上面登记了从广东到苏北每一个县的党部负责人姓名、联系方式和支部人数。所有空缺和需要加强布点的地方，她已经用红笔在旁边做了标注。\n\n“宋先生，你的选票需要选民识字。我只需要人。”\n\n宋教仁翻开名册，沉默了很久。之后她对佩丽卡说：“我们还在讨论怎么让不识字的农民投票。她已经在她们的村子里建了党支部。”\n\n蒋巾帼也看到了这份名册。她的反应更直接。她在当晚的日记里写道：“我一直在想怎么夺取国家机器。陈晖洁已经在造国家机器的零件了。”这句话后面有一道被划掉的痕迹，下面补了一行字：“她没有夺权。她只是把权力拆开，再重新组装。每一个齿轮都在看她。”\n\n定都后第三天，陈晖洁被推举为行政院长。她以党务系统而非军队为后盾，开始组建一个组织严密、自上而下的新政府。"
  roc.59.a: "每一个齿轮都在看她"

  roc.60.title: "陈千语的就职" #
  roc.60.desc: "陈千语就任都城卫戍总司令的那天，南京下着小雨。\n\n她的姐姐在室内开会，她在室外阅兵。受阅部队穿着新配发的统一军装，队列整齐。她骑马从队列前经过，没有做任何演讲。她只是在阅兵结束后跳下马，对带兵的团长们说了几句话。不是训话，只是一些很具体的指示：哪段城墙需要加固，哪条街道夜间巡逻需要增加人手，哪个城门的哨兵换岗时间要调整。\n\n“我去过那些地方。”她说，“我知道哪里容易出事。”\n\n她的部属都知道她不是在办公室闷头画图纸的人。在广府时期，她几乎走遍了广州的每一条街巷，熟悉每一个码头、仓库和贫民窟的位置。现在她把同样的方式用在了南京。\n\n有一个细节被当时的军官记了下来。陈千语骑马阅兵时，没有带军帽。她的长发在雨中被淋湿，但她没有在意。一个老勤务兵从队列里跑出来想给她递帽子，她已经策马过去，只留下一句话——“帽子你自己留着。雨不大。”\n\n后来有人传说，那次阅兵的名称本来被幕僚拟作“都城卫戍就职阅兵式”，陈千语在最后一刻划掉了全部字，只留了三个：“一次阅兵。”"
  roc.60.a: "她记得每一段城墙"

  roc.61.title: "新生活运动" #
  roc.61.desc: "陈晖洁在掌握政权后的第一个月，没有发布施政纲领。她发布了一份《国民生活守则》。\n\n这是一份不足千字的文件。从公共卫生、街巷秩序到公文格式、开会纪律，每一条都以短句写成。没有口号，没有引用任何先烈的宏论，最后一页的落款处只写着——“执行。陈晖洁。”\n\n基层党支部接到了分发任务。守则被印成小册子、传单、墙报，在工厂、学校、军营反复宣讲。内容从“痰不随地”讲到“会不迟到”，再到“账目公示”和“公文格式统一”。宋教仁在私人通信中批评过这份守则，形容它把国民当小学生管，字里行间全是规矩，没有一句话鼓励人去独立思考。\n\n但她的批评没有被报纸刊登。报纸的主编是CC系的党员。主编解释得很平静：“陈院长说过，纪律不需要被理解。纪律只需要被执行。理解了纪律的人会遵守。不理解纪律的人——需要更多纪律。”"
  roc.61.a: "纪律写在每个人的牙刷上"

  roc.62.title: "龙脉之说" #
  roc.62.desc: "在新政权逐渐稳固的第六周，陈千语第一次提出了一个令所有人震惊的论点——“龙为帝国之征”。\n\n她不是在公开场合宣告的。她是在一次小型党务会议上，面对CC系核心干部提出的。她说：“中国的传统从来需要象征。青天白日旗已经不足以凝聚这个国家。你们去看北方——袁克定用了旧帝国的龙旗，老百姓就认了。我们不用旧帝国的龙，但我们陈氏一族本是龙族后裔。龙不是帝制的专属。龙是秩序，是力量，是这片土地愿意服从的东西。民国这种东西，在中国从来没有扎下根。我们需要一个新的国号，一个新的象征。一个新的开始。”\n\n会议室里沉默了很长时间。有人看向陈晖洁。陈晖洁没有立刻表态。她只是问了一句：“你说完了？”\n\n“说完了。”\n\n陈晖洁摘下眼镜。“各位，这件事暂时不列入正式议程。但也不是不能谈。”\n\n这句话的意思是：可以开始谈了。\n\n当晚，一份关于陈氏家族与古代龙图腾渊源的内部研究材料开始在CC系高层间流通。材料的撰写者不详。识之律者后来在对这份文件做安全评估时，用红笔在旁边批了三个字：“有证据。”她没写的是有证据证明真，还是有证据证明假。"
  roc.62.a: "龙不是过去的龙"

  roc.63.title: "劝进表" #
  roc.63.desc: "“龙脉之说”传出后的第二周，第一份劝进表出现在陈晖洁的办公桌上。\n\n来自浙江。省党部全体委员联署，措辞古雅，大意是：民国已经失败，议会空谈误国，组织才能救国；CC系以组织立政，当以组织立国；恳请陈院长顺应天命，即皇帝位，建立新朝。\n\n陈晖洁没有批阅。只是把它原样退回，口头带了一句——“讨论国体，不是这样做的。”\n\n地方上把这句话理解为“不是这样做的，用别的方式做”。于是有了第二份，第三份。再然后是江苏。再然后是安徽。到第八周末，来自已控制省份的劝进文书已经积了一抽屉。\n\n陈千语每天晚上来看这些表格。她没有逼她姐姐表态。只是在某天临走时，轻声说了句：“姐姐。龙总要抬头的。早点抬，比晚点抬好。天冷了。”\n\n陈晖洁没有回应，但她的笔没有落在反对栏里。"
  roc.63.a: "劝进是一种仪式"

  roc.64.title: "登基大典" #
  roc.64.desc: "统一全国的那一天，陈晖洁没有举行阅兵式。\n\n她举行了一场登基大典。\n\n南京的旧帝国议会被改造为临时太庙。青天白日旗被缓缓降下，一面新的旗帜升起——赤底金龙，炎字居中。大炎王朝。炎者，火德，光耀不息。龙者，秩序，万物所归。\n\n陈晖洁身着玄色礼服，腰间佩剑。陈千语站在她右侧，戎装按剑。所有中高级党部负责人在台下排列成行，她们的党员证编号被登记在太庙的档案里。\n\n陈晖洁的登基诏书很短。她不惯于长篇大论，只说：“民国二十余年，议会空谈，军阀割据，人民离散。今日中国不再需要一个讨论会。中国需要一个秩序。大炎王朝——是给这个秩序起了一个名字。朕即国家。”\n\n台下山呼万岁。\n\n宋庆龄没有出席。她当天一个人待在自己的旧官邸里。有记者后来翻出她日记的一页，上面写着：“龙飞起来了。我希望它记得——它曾经也是人民。”\n\n宋教仁也没有出席。她在寓所窗前听完了礼炮的数目，对佩丽卡说了一句话——“这是民国最后的炮声。”\n\n佩丽卡没有回应。她正在收拾法务部的旧档案——法典的草稿，临时约法的修订记录，还有那份已经无人提起的国会选举规则。她把它们装进纸箱，在箱盖上写下一个日期，然后封好。\n\n蒋巾帼出席了典礼。她站在人群中，面无表情。戴安澜在她旁边低声问了一句。她的回应很平淡：“她赢了所有人。包括我母亲。我母亲想了一辈子没做的事——改朝换代——陈晖洁替老蒋做了。”戴安澜沉默了很久，最后只是若有所思地接了一句。\n\n识之律者站在一个不被聚光灯照亮的位置。她从不在灯光下。登基诏书念完时，她从口袋里掏出一支红笔，翻开那份《需要清洗者》档案。在第一页的最上方，“改组派”早已被打上红勾。“第二序列”的那一行，她划掉冗余的备注，在旁边新注了两个字——“大炎。”\n\n安全的“安”。火焰的“炎”。"
  roc.64.a: "龙飞起来了"

  roc.65.title: "末代民国的最后一天" #
  roc.65.desc: "登基大典前夜，陈晖洁独自一人走进了民国总统府档案室。这里存放着民国自定都以来所有法律文件的原件——《临时约法》手稿、第一届国会选举记录、行政院历次会议纪要。\n\n她花了整整一夜看完这些文件。天亮时，她把其中几份抽出来放进一个单独的文件夹，其余留在原位。然后她叫来了秘书，语气平常：“这些继续存档。那一箱，封好。不要销毁。让以后的人看看。”\n\n“封条上写什么？”秘书问。\n\n“民国。”\n\n这天清晨，一位早起的老清洁工在档案室门外打扫。她听到门锁咔嗒一响，一个女人走了出来。她穿着便服而非礼服，手里提着一个不大的旧公文包。档案室的门在她身后轻轻合上。清洁工说她后来不记得那个女人的脸，只记得她在门口站了很短的一瞬，抬头看了看天，然后转身走了。她记得她的脚步很轻，像怕吵醒什么人。"
  roc.65.a: "封存的民国"

  roc.66.title: "新朝的第一个春天" #
  roc.66.desc: "大炎王朝的第一个春天，陈晖洁发布了一道诏书。\n\n诏书很短，只有一句话：“凡旧民国法律，不悖于大炎秩序者，暂予沿用。即日起，由法务部逐条审核。”\n\n没有意识形态宣言，没有历史评价。这是一道行政命令。佩丽卡在离职前被要求完成最后一项工作：主持编写《暂用法律清单》。她用了三个月时间，将民国法典中不涉及政治体制的民商法条文逐一梳理，签上技术审查意见。法务部的旧同事说，那三个月，她的办公室灯从未在凌晨前熄灭。\n\n清单呈报后，陈晖洁没有批注。只在封面盖了一个印。印文不是“批准”，而是两个字——“归档”。"
  roc.66.a: "法律不是被推翻的。它被归档了"

  roc.67.title: "总统的推举" #
  roc.67.desc: "定都南京的第三天，一个问题悬而未决：谁来当总统？\n\n与民革和民宪的路线不同，中正社主导的定都没有经过漫长的议会辩论。胡宗南在黄埔旧部的簇拥下走进原帝国议会大厅。汤汤带着清波寨子弟兵在门外列队，不是为了示威，只是习惯了列队——她从当大当家起就喜欢整齐的队列。\n\n何应钦主持了推举会议。她本人在定都前已心力交瘁，在会上明确表示不参与总统竞争。宋庆龄作为革命象征被邀请出席，但她拒绝接受提名。蒋巾帼没有与会。\n\n推举结果没有悬念。胡宗南以“黄埔一期、先总理最信任的将领之一”的身份，被军方和各地方势力代表推举为中华民国总统。她在就职演说中只说了一段话：\n\n“我胡宗南不是政治家。我是一个军人。先总理在黄埔对我们说过：革命尚未成功，同志仍须努力。这句话我说了二十年。今天站在这里，我还是这句话。在宪政之前，我们需要训政。在民主之前，我们需要秩序。这个秩序，由我来守。”\n\n汤汤站在台下，听完这段话后对身边的人轻声说了句：“老蒋如果在天有灵，今天该喝一杯。”没有人回应她。但所有人都知道她说的“老蒋”不是蒋巾帼。"
  roc.67.a: "一个军人的训政"

  roc.68.title: "戴姬桃出山" #
  roc.68.desc: "胡宗南就任总统后的第三天，书桌上堆满了各部会的人事任命草案。黄埔系的将领们已各自占据了国防委员会的关键位置，但行政院院长的名字始终空着。有人提名几位军中有行政经验的老将，有人建议从CC系借一位技术官僚，还有人暗示可以请宋教仁出山以示团结。胡宗南把那些草案推到一旁，对一个来请示的副官说：“备车。去戴公馆。”\n戴公馆坐落在南京城东一处僻静的旧巷深处，院中一棵老槐树遮住了大半边天井。自蒋介石战死后，戴姬桃闭门谢客多年，书房里的墨水瓶干涸了又注满，注满了又干涸，但她发表的文章寥寥无几。外界传闻她已心灰意冷，也有人说她是在为先兄守丧——戴姬桃与蒋介石是结拜姐妹，此事在国民党内并非秘密。蒋介石生前唤她“小桃”，她唤她“大姐”。大姐战死郑州那年，她二十六岁。\n胡宗南进门时，戴姬桃正坐在书桌前抄写《礼记》。她的银白长发用一支玉簪松松挽住，几缕碎发垂在素色旗袍的领口旁。听见脚步声，她搁下笔，摘下夹鼻眼镜，抬起头。她的面容比十年前更清瘦，眼角那颗泪痣却依然醒目，像一滴凝固的墨。\n她看了胡宗南一眼，没有起身相迎。只是说：“胡大姐。你穿这身总统礼服，比我想的合适。”\n胡宗南没有寒暄，开门见山：“我来请您出任行政院院长。”\n戴姬桃没有立刻回答。她慢慢合上手中的《礼记》，指尖在封皮上停留了片刻，然后将书整齐地放回案头的书架上。做完这一切，她才开口：“你让我做行政院长。你准备让我管什么？”\n“除了军队，什么都管。”\n戴姬桃轻轻摇了摇头。不是拒绝，是觉得这句话太过鲁莽。她从书架上抽出一本薄薄的册子，那是她当年为蒋介石起草的《国民革命建国大纲》草稿，纸页已泛黄，页脚还留着蒋介石用红铅笔做的批注——大姐的字，她认得。她把这本册子放在胡宗南面前。\n“这是大姐让我写的。她没来得及用。你现在让我做行政院长——这个，就是我的施政纲领。”\n胡宗南双手接过那本册子，没有翻看，只是把它按在膝盖上。\n“有人会觉得我太年轻。”戴姬桃忽然说了一句题外话，语调很平，不像是在抱怨，倒像是在陈述一个无所谓的事实。\n“黄埔一期的都服你。”胡宗南的回应也很平。\n“她们服的不是我。是我大姐。我不过是大姐的妹妹。”\n“那就够了。”\n戴姬桃没有再说话。她重新戴上夹鼻眼镜，拿起刚才搁下的笔，在一张空白信笺上写了几行字。写完，将信笺对折，递给胡宗南。“我的就职演说稿。你看看。如果觉得不够硬，我再改。”\n胡宗南接过信笺，没有看，只是说：“您写的，不用改。”\n戴姬桃终于露出了一丝极淡的笑意。不是开心，是无奈——无奈于这个黄埔一期的老将，面对她时永远像面对师母一样拘谨。她站起身，拢了拢披肩：“走吧。我送你去门口。这宅子你下次不用亲自来——打个电话就行。”\n胡宗南走到门口，忽然回头：“姬桃先生。以后内阁的事，您多费心。”\n戴姬桃站在老槐树下，风把几瓣槐花吹落在她的肩上。她没去拂。只是说：“分内的事。大姐不在，我就是你的笔。”"
  roc.68.a: "欢迎你，戴女士。"

  roc.69.title: "训政纲领" #
  roc.69.desc: "胡宗南就职后，做的第一件事不是组阁，而是发布了一份只有三页的文件——《中华民国训政时期临时纲领》。纲领的核心内容可以在三句话中概括：三民主义为国家指导思想；训政时期由中正社行使全国治理权；军事统一完成后方可进入宪政阶段。\n\n“训政要多长？”汤汤问胡宗南。\n\n“可能要十年。可能要二十年。”\n\n“那不是比蒋老头子在位还长？”汤汤把军帽摘下来在手上磕了磕，“她是管了二十年但没到三十年的那种吧。十年二十年，清波寨的弟兄们到时候都抱孙子了。谁来管？”\n\n胡宗南看着她：“我们来管。”\n\n纲领发布后，宋教仁在南京的住所闭门不出。她在日记中写道：“这不是训政，是永远的军政。胡宗南说十年二十年。她没有说上限。没有上限的意思就是永远。”但宋教仁没有公开发表反对意见。宪政同志会被允许在训政框架内存在，作为“咨询机构”而非政党。她没有拒绝。她知道这是胡宗南给她的最后一点体面。"
  roc.69.a: "没有时间表的等待"

