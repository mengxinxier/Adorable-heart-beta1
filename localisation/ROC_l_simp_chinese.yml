  roc.73.title: "国民革命军整编"
  roc.73.desc: "随着中华统一战线的成立，原本针锋相对的国民革命军和神州陆军结束了自北伐战争以来的相互对峙，神州帝国将抽调绝大部分兵力前往山海关的正面战场，国民革命军则主要负责防备西南面的樱花军队与海上的威胁。\n如今，全国统一抗战的大局已然形成，建立全国统一的指挥体系也迫在眉睫，尽管中华帝国北京政府或许在数月前仍是我们急需铲灭的敌人，但在此安危绝续之交，唯赖举国一致，服从纪律，严守秩序。\n接受整编与统一指挥，并不是说我们放弃了北伐，放弃了孙先生的三民主义，相反，同中国一切决心真正救国救民的有组织的力量结成反对樱花帝国主义及其走狗的广泛的反帝统一战线。才是三民主义在中华民族面临生死存亡的历史关头，挽救民族危亡的最好表现。"
  roc.73.a: "青天白日存在于我等心中"

  roc.74.title: "华南特区政府成立"
  roc.74.desc: "（待填充）"
  roc.74.a: "兄弟阋于墙，外御其侮"

  roc.75.title: "黄埔系的整编" #
  roc.75.desc: "训政需要抓手。胡宗南的抓手是军队，而她整顿军队的方式不同于以往任何一个政府。\n\n她以国防委员会主席的身份发布《全国军队整编令》，将广府带来的旧部、投诚的地方军队和原帝国残余部队合并为统一的“国防军”。但这支国防军与宋教仁或民革设想的国家化军队不同——要求团级以上军官必须加入中正社，或在受训期间通过政治审查。不愿意加入的军官可以保留军衔调往预备役。\n\n何应钦被任命为国防部长，但她的权力被架空。胡宗南亲自掌握国防委员会，汤汤担任国防军副总司令兼京畿卫戍司令。多年以后，历史学家会这样总结这次整编：“中正社不再是一个军中的政治派系，而是把军队变成了它的政治身躯。命令从营部发出去的时候，盖的是国防军的大印，但签字的军官，是中正社的人。”"
  roc.75.a: "枪杆子铺成的训政之路"

  roc.76.title: "蓝衣社的效忠" #
  roc.76.desc: "识之律者在新政权建立后的前几周保持着沉默。她没有在定都典礼上出现，没有在训政纲领发布时发表评论，没有在军队整编中争取任何职位。她只是待在蓝衣社的地下档案库里，整理旧资料。\n\n第六周，她主动求见胡宗南。会面地点不在总统府，而在蓝衣社的一间档案室。她将一份整理好的情报汇总放在胡宗南面前。\n\n“总统先生。蓝衣社在过去五年积累了全国最完整的情报档案。这些档案，我可以交给中正社。或者我可以继续保管。由你决定。”\n\n胡宗南翻开第一页。密密麻麻的名字，有的见过，有的没听过。她合上档案。\n\n“你要什么？”\n\n“我要一个正式的部门。不是地下档案室，不是临时委派。”她的声音平稳得像是机器，“我在过去几年里，帮过你们清理改组派、监视过军队内部的异动、跟踪过每一个可能对中正社造成威胁的人。现在是时候了——给蓝衣社一个正式的门牌。”\n\n识之律者并没有以“否则”收尾。她只是把另一份文件放到桌面上。“这一份，是过去六个月各省官员和高级军官的忠诚评估报告。我已经做完了。不需要命令。”\n\n胡宗南看了她很久。“你需要一个头衔。国家安全委员会秘书长。这个够吗？”\n\n“够用。”\n\n蓝衣社正式挂牌的那天，有人注意到，识之律者在门牌下方用极小的字体贴了一张标签，标签上只有两个字：“待续。”"
  roc.76.a: "情报机器的正式启动"

  roc.77.title: "戴姬桃的就职演说" #
  roc.77.desc: "三天后，戴姬桃正式就任行政院院长。\n她的就职演说很短，没有讲稿。那封她写给胡宗南的信笺，她最终没有用——她决定脱稿讲。她站在议会的讲台上，一袭藏青旗袍，银发被灯光照得近乎透明。全场安静下来后，她的声音清冷而清晰，像冬天落在瓦上的雨。\n“先总理有言：革命尚未成功，同志仍须努力。先总统蒋公以一身殉国，使革命之火不熄。今寿山以黄埔之剑守卫训政，余以女子之身，执此笔以从其后。”\n她停顿了一下。台下有人轻轻咳嗽，但没有一个人说话。\n“剑与笔，国之两端。剑不利则国危，笔不正则国乱。余不敢自称正笔。但余一生所书，不敢有一字欺先总理与先总统在天之灵。”\n她微微抬起头，目光扫过台下。汤汤站在后排，没有鼓掌。她只是看着戴姬桃，然后侧头对身边一个老副官低声说了一句：“以后开会，有她在，我不用装懂了。”"
  roc.77.a: "剑与笔——这就是我们的训政"

