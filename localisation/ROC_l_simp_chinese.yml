  ROC_RCKMT_party: "国民党-民革"
  ROC_RCKMT_party_long: "£GFX_RCKMT_text_icon §P中国国民党革命委员会§!（§P民革§!）\n§W--------------------------------§!\n§L她们是革命的正统继承人，却也是最矛盾的一群人。宋庆龄坐在临时大总统的办公室里，窗外是珠江上往来的货船，她的桌上摊着土改试点报告和村小建校计划。她相信革命应当是温和的、渐进的、扎根于中国土壤的，但党内另一股力量不这么想。蒋巾帼从莫斯科带回来的不只是一本俄文党章，还有一整套苏维埃式的革命蓝图——彻底土改、党国一体、五年计划。她的办公室里挂着列宁和孙中山的画像，两幅画像并排而列，中间隔着中国革命的漫漫长路。她们共享着同一面旗帜，却在每一个重大问题上针锋相对。而她们中间还站着无数摇摆的同志，有人在观望，有人在等待，有人在暗中准备站队。§!"
  ROC_KMT_RCKMT_party_long: "£GFX_RCKMT_text_icon §P中国国民党革命委员会§!（§P民革§!）\n§W--------------------------------§!\n§L民革终于在路线斗争中决出了胜负。无论是宋庆龄的温和左翼还是蒋巾帼的苏维埃模式，革命委员会都建立了一个以党为核心的社会主义共和国。土地改革在全国范围内完成，农民在自己的土地上第一次写下了名字。五年计划的高炉在夜空中映出红光，铁路网从沿海延伸到内陆，村小的黑板上写着新学的汉字。但革命的代价也是沉重的：政治反对派被边缘化，社会在整齐划一中失去了某些活泼的东西。青天白日旗仍在飘扬，但旗上的每一道光影都经历了血与火的淬炼。§!"

  ROC_Constitutionalists_party: "国民党-民宪会"
  ROC_Constitutionalists_party_long: "£GFX_Constitutionalists_text_icon §C中国国民党宪政同志会§!（§3民宪会§!）\n§W--------------------------------§!\n§L她们是理想主义者，也是孤独的布道者。宋教仁坐在行政院的办公室里，身后是一排书架，上面码放着各国宪法译本和她历年积累的比较法研究笔记。她拒绝当总统，甘做行政院长，因为只有在这个位置上她才能把选票和宪法写进这个国家的基因。佩丽卡坐在隔壁的办公室里，她的桌上摊着正在修订的民法典草案，窗外是广州城此起彼伏的市声。她不太说话，只是每天准时上班、准时下班，把每一条法律条文修改得严谨而精确。她们在这座充满派系斗争的城市里坚持着一个信念：中国需要的不是另一个强人，而是一部能约束所有强人的法律。§!"
  ROC_KMT_Constitutionalists_party_long: "£GFX_Constitutionalists_text_icon §C中国国民党宪政同志会§!（§3民宪会§!）\n§W--------------------------------§!\n§L宋教仁的议会民主终于在中国扎下了根。宪法不是摆在档案室里的装饰品，而是每一个公民都能引用的权利保障书。选举如期举行，权力和平交接，反对党在议会里批评政府，政府在议会里回应批评。法院独立审判，报纸自由报道，公民在投票站前排起长队。民主仍然远非完美——它效率不高，争吵很多，妥协总是让所有人都不完全满意。但这个制度活下来了。它不需要完美，它只需要活着——活到下一代人习惯它的存在，活到没有人再问“革命之后谁来统治”，因为答案已经写在每一次排队投票的清晨里。§!"

  ROC_CC_party: "国民党-CC系"
  ROC_CC_party_long: "£GFX_CC_text_icon §Y中国国民党中央俱乐部§!（§YCC系§!）\n§W--------------------------------§!\n§L她们是沉默的组织者，也是革命的守夜人。陈晖洁坐在中央党部的办公室里，面前是一份厚厚的中统档案，她每天翻阅、批注、归档，从不发表长篇大论。窗台上那盆兰花是宋庆龄送的，她按时浇水，从不忘记。陈千语每天破晓策马巡视广州城的防务，她的马认得每一段城墙，她也认得每一块砖。这对姐妹掌握着这个政权最隐秘的权力——不是枪杆子，不是选票，而是一张覆盖每一个部门、每一个工厂、每一个学校的党员名册。所有人都知道她们在做什么，但没有人知道她们最终想要什么。§!"
  ROC_Yan_party: "中央俱乐部"
  ROC_Yan_party_long: "£GFX_CC_text_icon §Y大炎皇室中央俱乐部§!（§YCC系§!）\n§W--------------------------------§!\n§L大炎王朝建立后，陈晖洁登基称帝，但从不穿龙袍。她每天早晨准时亮起行政院的灯，批阅文件到中午，下午接见官员，晚上翻阅名册。陈千语受封亲王兼京都巡察使，仍然每天破晓策马巡视南京城。她们建立了一个以组织和档案为核心的帝国——档案在更新，巡察在继续，名册在增厚。这个帝国没有轰轰烈烈的神话，只有每天准时亮起的行政院的灯。有人问陈晖洁为什么不用太监、不用旧礼，她正在批文件，头也没抬：“朕不需要。朕有名册。名册就是朕的龙袍。”§!"

  ROC_Whampoa_party: "国民党-中正社"
  ROC_Whampoa_party_long: "£GFX_Whampoa_text_icon §g中国国民党黄埔中正社§!（§g中正社§!）\n§W--------------------------------§!\n§L她们是蒋介石的嫡系遗产，是先总理灵前永不熄灭的长明灯。胡宗南擦拭着佩枪，枪柄上刻着黄埔的校训。汤汤的清波寨子弟兵驻防在广州郊外，她的作业本上铅笔字迹歪歪扭扭，但她每天坚持学写字。她们不在乎宋庆龄的土改和宋教仁的宪法，只在乎一件事：蒋介石不能白死。郑州的洪水淹没了北伐军的主力，也淹没了她们的青春。她们守着一座没有尸骨的坟，等一个不会回来的校长。§!"
  ROC_KMT_Whampoa_party_long: "£GFX_Whampoa_text_icon §g中国国民党黄埔中正社§!（§g中正社§!）\n§W--------------------------------§!\n§L训政开始了。胡宗南入主南京，宣布“军政结束，训政开始”。训政没有时间表，宪法锁在档案室里，钥匙在胡宗南手里。黄埔系掌控了军队和政府，中正社的信条简化为一句话：孙中山是国父，蒋介石是先烈，胡宗南是看守。§!"
  ROC_CNRS_party: "国民党-蓝衣社"
  ROC_CNRS_party_long: "£GFX_CNRS_text_icon §F中国国民党三民主义力行社§!（§F蓝衣社§!）\n§W--------------------------------§!\n§L她们从不站在阳光下。识之律者坐在蓝衣社总部地下档案室的深处，面前是一份永远写不完的名单，标题是《需要清洗者》。第一序列是改组派——早已被打上红勾；第二序列还空着，她在等。她不效忠任何人，她效忠的是一套自己认定的秩序：信息就是权力，档案就是武器。窗外是广州潮湿的春天，地下室里只有一盏白炽灯在摇晃。她每天凌晨准时亮起档案室的灯，开始整理那些从各个部门、各个部队、各个报社汇集来的情报碎片，把它们拼接成一份完整的图谱。没有人知道她在想什么。也许她只是在等——等一个值得她交出档案的人，或者等一个需要她打开档案的时刻。§!"
  ROC_KMT_CNRS_party_long: "£GFX_CNRS_text_icon §F中国国民党三民主义力行社§!（§F蓝衣社§!）\n§W--------------------------------§!\n§L识之律者的命运取决于谁赢得了最终的权力。当胡宗南入主南京，她被任命为军事情报局局长，监控网络覆盖全军，但有一条明确的底线：不能在国内搞清洗。她接受了这个限制，把《需要清洗者》档案锁进灰色档案柜，只在每份简报末页用红笔批一行字——“待续。识。”§!"

  ROC_RCAK_party: "国民党-改组派"
  ROC_RCAK_party_long: "£GFX_RCAK_text_icon §O中国国民党改组同志会§!（§O改组派§!）\n§W--------------------------------§!\n§L她们是革命最初的灵魂，也是革命最深的伤痕。汪兆铭坐在广州的办公室里，窗外是珠江上往来如织的货船，她的抽屉里锁着与樱花国方面秘密联络的密电底稿。她曾经是孙中山最信任的助手，是“引刀成一快，不负少年头”的革命诗人，如今却是广府最孤独的人。她坐在那张红木办公桌后面，望着墙上孙中山的遗像，不知道自己在等什么——是等一场翻盘，还是等一个结局。§!"
  ROC_KMT_RCAK_party_long: "£GFX_RCAK_text_icon §O中国国民党改组同志会§!（§O改组派§!）\n§W--------------------------------§!\n§L汪兆铭成为了权力最稳固的大总统，但中国也彻底向樱花国臣服。他坐进了南京的总统府，手握大总统印，签署着一份又一份以别国文字写成的条约。他赢了所有人，但他在睡梦中看到了年轻的自己——那个穿着同盟会旧制服的年轻人，手里握着毛瑟手枪，枪口对准他的眉心。§!"

  RCKMT_CCP_party: "国民党/共产党"
  RCKMT_CCP_party_long: "中国国民党/中国共产党\n§W--------------------------------§!\n§L民革终于在路线斗争中决出了胜负。无论是宋庆龄的温和左翼还是蒋巾帼的苏维埃模式，革命委员会都建立了一个以党为核心的社会主义共和国。土地改革在全国范围内完成，农民在自己的土地上第一次写下了名字。五年计划的高炉在夜空中映出红光，铁路网从沿海延伸到内陆，村小的黑板上写着新学的汉字。但革命的代价也是沉重的：政治反对派被边缘化，社会在整齐划一中失去了某些活泼的东西。青天白日旗仍在飘扬，但旗上的每一道光影都经历了血与火的淬炼。\n\n中共出席新政协，拥护三民主义与宪法秩序，同时保留对社会主义理想的长期追求。毛润芝以独立身份担任农林部长，在任内推动全国土地普查、完善土改立法、推广改良稻种。他仍然是马克思主义者，但他的战场从农村武装斗争转向了议会辩论与政策实践。§!"
  RCKMT_Merge_CCP_party_long: "中国国民党\n§W--------------------------------§!\n§L民革终于在路线斗争中决出了胜负。无论是宋庆龄的温和左翼还是蒋巾帼的苏维埃模式，革命委员会都建立了一个以党为核心的社会主义共和国。土地改革在全国范围内完成，农民在自己的土地上第一次写下了名字。五年计划的高炉在夜空中映出红光，铁路网从沿海延伸到内陆，村小的黑板上写着新学的汉字。但革命的代价也是沉重的：政治反对派被边缘化，社会在整齐划一中失去了某些活泼的东西。青天白日旗仍在飘扬，但旗上的每一道光影都经历了血与火的淬炼。\n\n国共两党合并重组为中国国民党，自辛亥之时起的革命之火归于一统，一同迈向社会主义的明天！§!"
  RCKMT_democratic_party: "农工民主党/致公党/公民自由联盟"
