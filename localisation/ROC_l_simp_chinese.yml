  ROC_Min_navy_buy_boat_plan: "委托圣杯造舰"
  ROC_Min_navy_buy_boat_plan_desc: "自近代以来，我国的海防便形同虚设，西洋人的巨舰大炮在我国的海岸线肆意进出，而我国竟没有什么海军可以与之抗衡……\n但随着经济危机的爆发，一个机遇摆在了摆在了我们面前：那便是出钱买下圣杯停工的船只或者委托他们建造，就像当年的洋务运动一样，师夷长技以制夷。"
