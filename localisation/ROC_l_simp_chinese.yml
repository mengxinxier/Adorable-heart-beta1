  ROC_state_labor_insurance: "全面社保体系"
  ROC_state_labor_insurance_desc: "中央执行委员会采纳了蒋巾帼的提议。\n\n通过由国家全面统筹的保障网络，将所有劳动者紧密组织起来，这极大稳固了底层对政权的支持，但也带来了沉重的财政负担。"
  ROC_MinShengism_insurance: "民生社保体系"
  ROC_MinShengism_insurance_desc: "中央执行委员会采纳了宋庆龄的提议。\n\n遵循新三民主义原则，在保障工农基本民生权益的同时调和各阶层利益，走一条温和的联合改良道路，确保了社会平稳发展。"
  ROC_NRA_insurance: "荣军荣民体系"
  ROC_NRA_insurance_desc: "中央执行委员会采纳了胡宗南的提议。\n\n在当下的环境中以国家安全为重，有限的资源将被优先用于保障军人、军属及国防工业职工的待遇，以此铸造铁血国家。"
  ROC_labor_legislation: "规范劳动立法"
  ROC_labor_legislation_desc: "中央执行委员会采纳了宋教仁的提议。\n\n倾向于法治与自由发展的框架，仅通过立法规范合理的劳动时间与最低工资，依靠社会经济的自然发展与民间慈善来解决民生问题。"
