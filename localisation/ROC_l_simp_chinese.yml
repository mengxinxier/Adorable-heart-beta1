  roc_news.006.t: "$news_event_background$宋庆龄巩固权力"
  roc_news.006.desc: "在之前公开的宋庆龄-蒋巾帼的对抗中，宋庆龄很快整合了政治力量并取得了足够的支持，成功挫败了蒋巾帼政变的企图。\n\n如今，蒋巾帼的行政院院长职务已被撤职，而帮助宋庆龄良多的洛茜则是成为了新的行政院院长。现在的国民党内，已经没有了反对宋庆龄的声音。"
