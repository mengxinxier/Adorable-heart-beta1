  roc.81.title: "国会全体会议" #宋教仁统一中国
  roc.81.desc: "统一后的第一届国会正式复会。宋教仁作为行政院长，做了自定都以来最长的一次施政演说。\n\n她没有讲胜利。她讲的是账单。\n\n“过去两年的军事行动花费了国家预算的六成，接下来的预算将花费在你们每一个人脚下的道路上。接下来的十年，我不会再谈革命、不会谈主义、不会谈谁是敌人。我只谈四件事——修铁路、建学校、整水利、立法院。”\n\n“我站在这里，不是作为胜利者，是作为一个管家。我的任期是有限的，下次选举，如果我做得不好，请用选票让我下台。让我下台，是你们最大的权利，也是这个国家最好的保障。”\n\n全场起立鼓掌。革命委员会的蒋巾帼没有起立，但她鼓了掌。她在座位上的笔记本里写了一行字：“她说的是真话。真话不需要站起来听。”"
  roc.81.a: "演讲结束之后才是真正的开始"

  roc.82.title: "（待填充）" #胡宗南统一中国
  roc.82.desc: "（待填充）"
  roc.82.a: "（待填充）"

  roc.83.title: "最后一战" #汤汤统一中国
  roc.83.desc: "最后一场战斗发生在西北。\n\n汤汤亲自带队冲锋，清波寨子弟兵从侧翼包抄敌军指挥部。战斗只持续了四个小时，敌军指挥官阵前投降。战后清点战利品时，士兵发现敌军指挥部墙上钉着一张旧的黄埔军校招生海报，纸张已经发黄，上面蒋介石的题字仍然清晰——“亲爱精诚”。汤汤把这张纸取下来，叠好放进怀里。副官问她这是做什么。她说：烧给老蒋。还有老胡。\n\n识之律者没有上前线。她在南京的国家安全委员会大楼里观看了战报。她没有鼓掌，没有发表贺电，只是把前线军官的忠诚评估表从“战前”档案盒移到“战后”档案盒。然后给她的副官下达了一道口头指令：“存档。”\n\n“哪一个？”副官问。\n\n“全部。”"
  roc.83.a: "枪声止息的那一刻，有人烧纸，有人存档"

  roc.84.title: "孙科的早安电话" #识律统一中国
  roc.84.desc: "孙科每天早上八点整会接到一通电话。电话那头永远是识之律者的声音。她会把当天的日程念一遍：几点参加什么仪式，几点签署什么文件，几点在什么场合说哪几句话。然后在最后加一句——“其她事情，我来处理。”\n\n孙科从来没有问过“其她事情”是什么。她不想知道。她只是按时出现在安排好的场合，穿指定的礼服，念准备好的稿子，与预先安排好的贵宾握手。然后回到总统官邸，在阳台上养花。她的兰花养得极好。每年春天，她会送一盆到识之律者的办公室。她的秘书签收后摆在会议室角落，她本人从不浇花。"
  roc.84.a: "总统在阳台上养兰花"

