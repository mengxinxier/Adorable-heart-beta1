  roc.72.title: "南京起义失败"
  roc.72.desc: ""
  roc.72.a: "我们迟早会回到南京的。"

  roc.73.title: "国民革命军整编"
  roc.73.desc: "随着中华统一战线的成立，原本针锋相对的国民革命军和神州陆军结束了自北伐战争以来的相互对峙，神州帝国将抽调绝大部分兵力前往山海关的正面战场，国民革命军则主要负责防备西南面的樱花军队与海上的威胁。\n如今，全国统一抗战的大局已然形成，建立全国统一的指挥体系也迫在眉睫，尽管中华帝国北京政府或许在数月前仍是我们急需铲灭的敌人，但在此安危绝续之交，唯赖举国一致，服从纪律，严守秩序。\n接受整编与统一指挥，并不是说我们放弃了北伐，放弃了孙先生的三民主义，相反，同中国一切决心真正救国救民的有组织的力量结成反对樱花帝国主义及其走狗的广泛的反帝统一战线。才是三民主义在中华民族面临生死存亡的历史关头，挽救民族危亡的最好表现。"
  roc.73.a: "青天白日存在于我等心中"

  roc.74.title: "华南特区政府成立"
  roc.74.desc: ""
  roc.74.a: "兄弟阋于墙，外御其侮"

  roc.75.title: "黄埔系的整编" #
  roc.75.desc: "训政需要抓手。胡宗南的抓手是军队，而她整顿军队的方式不同于以往任何一个政府。\n\n她以国防委员会主席的身份发布《全国军队整编令》，将广府带来的旧部、投诚的地方军队和原帝国残余部队合并为统一的“国防军”。但这支国防军与宋娇仁或民革设想的国家化军队不同——要求团级以上军官必须加入中正社，或在受训期间通过政治审查。不愿意加入的军官可以保留军衔调往预备役。\n\n何应晴被任命为国防部长，但她的权力被架空。胡宗南亲自掌握国防委员会，汤汤担任国防军副总司令兼京畿卫戍司令。多年以后，历史学家会这样总结这次整编：“中正社不再是一个军中的政治派系，而是把军队变成了它的政治身躯。命令从营部发出去的时候，盖的是国防军的大印，但签字的军官，是中正社的人。”"
  roc.75.a: "枪杆子铺成的训政之路"

  roc.76.title: "蓝衣社的效忠" #
  roc.76.desc: "识之律者在新政权建立后的前几周保持着沉默。她没有在定都典礼上出现，没有在训政纲领发布时发表评论，没有在军队整编中争取任何职位。她只是待在蓝衣社的地下档案库里，整理旧资料。\n\n第六周，她主动求见胡宗南。会面地点不在总统府，而在蓝衣社的一间档案室。她将一份整理好的情报汇总放在胡宗南面前。\n\n“总统先生。蓝衣社在过去五年积累了全国最完整的情报档案。这些档案，我可以交给中正社。或者我可以继续保管。由你决定。”\n\n胡宗南翻开第一页。密密麻麻的名字，有的见过，有的没听过。她合上档案。\n\n“你要什么？”\n\n“我要一个正式的部门。不是地下档案室，不是临时委派。”她的声音平稳得像是机器，“我在过去几年里，帮过你们清理改组派、监视过军队内部的异动、跟踪过每一个可能对中正社造成威胁的人。现在是时候了——给蓝衣社一个正式的门牌。”\n\n识之律者并没有以“否则”收尾。她只是把另一份文件放到桌面上。“这一份，是过去六个月各省官员和高级军官的忠诚评估报告。我已经做完了。不需要命令。”\n\n胡宗南看了她很久。“你需要一个头衔。国家安全委员会秘书长。这个够吗？”\n\n“够用。”\n\n蓝衣社正式挂牌的那天，有人注意到，识之律者在门牌下方用极小的字体贴了一张标签，标签上只有两个字：“待续。”"
  roc.76.a: "情报机器的正式启动"

  roc.77.title: "戴姬桃的就职演说" #
  roc.77.desc: "三天后，戴姬桃正式就任行政院院长。\n她的就职演说很短，没有讲稿。那封她写给胡宗南的信笺，她最终没有用——她决定脱稿讲。她站在议会的讲台上，一袭藏青旗袍，银发被灯光照得近乎透明。全场安静下来后，她的声音清冷而清晰，像冬天落在瓦上的雨。\n“先总理有言：革命尚未成功，同志仍须努力。先总统蒋公以一身殉国，使革命之火不熄。今寿山以黄埔之剑守卫训政，余以女子之身，执此笔以从其后。”\n她停顿了一下。台下有人轻轻咳嗽，但没有一个人说话。\n“剑与笔，国之两端。剑不利则国危，笔不正则国乱。余不敢自称正笔。但余一生所书，不敢有一字欺先总理与先总统在天之灵。”\n她微微抬起头，目光扫过台下。汤汤站在后排，没有鼓掌。她只是看着戴姬桃，然后侧头对身边一个老副官低声说了一句：“以后开会，有她在，我不用装懂了。”"
  roc.77.a: "剑与笔——这就是我们的训政"

  roc.78.title: "中国统一" #宋庆龄统一中国
  roc.78.desc: "宋庆龄站在国民大会堂的主席台上。台下是第一届国民议会的全体议员，以及来自各省各界的代表。她的身后没有悬挂任何个人的肖像，只有一面青天白日满地红的国旗。\n\n她穿着一袭素色旗袍，没有佩戴任何首饰。她的头发已经花白，但她的站姿仍然笔直——那是她年轻时在东京、在人间之里、在辰龙京的演讲台上磨炼出来的仪态，几十年过去，未曾改变。她面前的讲稿只有薄薄一页纸，是她昨晚在灯下亲手写的，改了很多遍，删了又写，写了又删，最后只剩下几段话。她不需要念稿。那些话她已经想了大半辈子。\n\n“同胞们。今天，我站在这里，不是以总统的身份，不是以总理的身份，不是以任何一个党派的领袖的身份。我是以一个人的身份——一个在这片土地上活了很久的人，一个看着这片土地流了太多血的人。我们革命了四十年。从兴中会到同盟会，从辛亥革命到护法战争，从北伐到抗战，从广州到南京。我们推翻了帝制，赶走了军阀，赶走了侵略者，结束了内战。今天我们终于可以站在这里，说一句——中国，统一了。”\n\n掌声如雷。她没有等掌声平息，只是微微抬起手，做了个轻轻下压的动作。会场立刻安静下来。\n\n“但统一不是目的。统一只是手段。我们的目的，是让这片土地上的每一个人——不管她住在哪里，不管她有没有读过书，不管她是男人还是女人，是老人还是孩子——都能有尊严地活着。有尊严，不是靠别人的施舍，是靠自己的劳动。不是靠一个人的恩赐，是靠法律的保障。我们今天统一了中国，但中国的未来，不取决于今天站在这里讲话的任何一个人。它取决于每一个在田地里耕种的人，每一个在工厂里劳作的人，每一个在教室里教书的人，每一个在病房里照顾病人的人。它取决于你们。”\n\n她停顿了一下，缓缓扫视整个会场。她的目光从左到右，从前到后，把每一个角落都看了一遍。\n\n“我老了。革命的时代结束了。接下来的时代，是属于你们的——属于所有愿意用双手建设这片土地的人。我们给你们的不是一个完美的中国——它还有太多的穷困，太多的文盲，太多需要去填平的沟壑。但我们给了你们一个统一的中国。一个没有人再敢在国土上分裂、没有人再敢用枪炮来回答政治分歧的中国。后面的路，你们自己走。我相信你们。”\n\n她微微侧过身，看向主席台侧方。洛茜坐在那里，手里拿着笔记本，眼眶微红。宋庆龄没有对她说任何话，只是点了点头。然后她转向全场，说了最后一句话。\n\n“愿白日照耀中国。愿这片土地上的每一个人，都能在阳光下抬起头来。”\n\n她没有等掌声。她收起讲稿，微微鞠了一躬，转身走下主席台。掌声在她身后涌起，如潮水般经久不息。她没有回头。她走得很慢，但每一步都踩得很稳，走过主席台侧面那扇侧门时停了一下，侧过头看向门外——窗外射进来的阳光正照在走廊的地面上，光斑里有细小的尘埃在缓缓浮动。她眯起眼睛，迎着光，站了片刻，然后把讲稿轻轻折好放进外衣口袋，继续往走廊深处走去。阳光把她的影子拉得很长，投在身后那扇缓缓关闭的门上。"
  roc.78.a: "愿白日照耀中国"

  roc.79.title: "中国统一" #蒋左统一中国
  roc.79.desc: "蒋巾帼站在中华苏维埃第一次全国代表大会的主席台上。她的身后悬挂着苏维埃的旗帜，与青天白日旗并排而立。台下坐着来自全国各省各行业的代表，工人、农民、军人、知识分子，各占比例，各有席位。她的讲稿是昨晚自己写的，改了数遍，删了又写，写了又删，最后定稿不过千字。她不需要长篇大论。革命不需要长篇大论。\n\n“同志们。中华苏维埃共和国今天正式宣告成立。这不是改朝换代，不是换个旗号。这是中国历史上第一次，由工人和农民来掌握自己的命运。我站在这里，不代表我个人。我代表的是从井冈山到延安，从川北到苏北，从东北抗联到华南游击队——所有在革命战争中倒下的同志。她们没能看到今天。我们替她们看到了。”\n\n台下寂静无声。戴安澜坐在军人代表席第一排，军帽放在膝上，用一块旧布慢慢擦着帽檐。那顶军帽跟了她多年，帽檐已经磨损发白，但帽徽是新换的。她擦帽的动作很轻，像是怕弄出声响打扰了什么。\n\n“统一不是终点。统一是起点。从今天起，我们要做的事比打仗更难——我们要建设。我们要用五年计划把中国从农业国变成工业国，要用扫盲运动让每一个劳动者都会写自己的名字，要用合作社让农民不再靠天吃饭，要用劳动法让工人不再靠命换钱。这些事，没有一件是可以靠枪杆子做成的。枪杆子打出了政权，但枪杆子建不成工厂。建工厂需要你们——在座的每一位代表，以及你们身后的千千万万劳动者。不是我领导你们，是你们自己领导自己。苏维埃政权的本质，就是劳动者自己管理自己。”\n\n她停顿了一下，目光缓缓扫过整个会场。她看到前排的毛润芝端着搪瓷茶缸，茶缸里的水已经不冒热气了；看到邓子恢低头在笔记本上写着什么，笔尖划过纸面的沙沙声在安静的会场里格外清晰；看到陈世涛坐得笔直，肩章上的川北独立旅番号在灯光下微微反光。\n\n“我这一生，做过很多选择。有的对，有的错。但我从来没有后悔过一件事——我相信了人民。人民选择了革命，革命选择了人民。这个国家，以后不再属于任何一个家族，不再属于任何一个军阀，不再属于任何一个外国势力。它属于你们。它叫中华苏维埃共和国。愿革命的火焰永不熄灭。愿每一个劳动者都能在火光中找到自己的路。”\n\n她微微欠身，合上讲稿。台下静了一瞬，然后掌声如潮水般涌起，经久不息。蒋巾帼没有离开讲台。她站在那儿，双手撑着讲台的边缘，微微低着头，让掌声从四面八方涌来。她忽然想起很多年前在莫斯科中山大学的宿舍里，一个同学问她的话。她当时想了很久，最后说不知道。现在她知道了。她母亲是一个革命者，也是一个杀过人的人。而她自己——她要让这个国家不再需要第二个蒋介石。掌声还在继续，她抬起头，看向窗外。窗外是南京的秋天，梧桐叶在风里沙沙地响着，阳光照在苏维埃代表大会的红旗上，投下一片温暖的光影。"
  roc.79.a: "愿革命的火焰永不熄灭"

  roc.80.title: "中国统一" #蒋右统一中国
  roc.80.desc: "蒋巾帼站在总统府的阳台上。阳台下方是南京城，远处是紫金山，中山陵的白色石阶在夕阳下泛着金色的光。她没有选择在国民大会堂发表统一演说。她选择在这里——总统府的阳台，面向整个南京城，面向中山陵的方向。\n\n她的身后站着胡宗南、陈晖洁、汤汤和识之律者。宋庆龄没有来——她早已回到上海旧居，不再出席任何公开活动。她没有穿礼服，只穿了一身深色的中山装，左胸口袋上方别着一枚青天白日徽章。她的讲稿只有几句话，是她昨晚在办公室里亲笔写的，没有给任何人看过。\n\n“同胞们。今天，中国统一了。这一句话，我母亲等了很久。孙中山先生等了更久。她们都没有等到。我替她们等到了。”\n\n风从紫金山方向吹来，吹得总统府前的旗帜猎猎作响。她的声音通过广播传遍全国，每一个城市，每一个乡村，每一个车站和码头，都能听到她的声音。\n\n“统一不是恩赐。统一是用枪打出来的，是用血换来的，是用无数人的牺牲堆出来的。那些牺牲的人里，有我的母亲，有你们每一个人的母亲、女儿、姐妹。我们今天站在这里，不是因为我们比别人更聪明、更幸运——是因为那些人替我们倒下了。她们倒下去，是为了让我们站起来。我们现在站起来了。”\n\n她停顿了一下，把讲稿翻到第二页。第二页只有一行字。\n\n“站起来之后做什么？不是去欺负别人，不是去炫耀武力，不是去搞什么称霸世界。站起来之后要做的事很简单——不要再跪下。不要让这片土地再被任何人踩在脚下。不要让我们的孩子再经历我们经历过的一切。”\n\n她把讲稿翻过来，第三页是空白的。她看着那片空白，沉默了几秒，然后用最平常的语气开口。\n\n“从今天起，训政结束了。”\n\n身后有一阵极轻的骚动。胡宗南侧过头，看了她一眼。识之律者没有动，但她的眼睛微微眯了一下。\n\n“训政结束了。宪政开始。这部宪法——”她从口袋里拿出一本薄薄的册子，那是她在中山陵前反复摩挲过的《训政时期临时纲要》，封面已经磨损，页角被她翻得卷了起来。她把这本旧纲要翻开，举到面前，然后从另一个口袋里掏出另一本新装订的册子，放在旧纲要旁边，“——已经由国民议会通过。从今天起，中华民国是一个宪政国家。总统由选举产生，政府向议会负责，军队忠于宪法，法律保护每一个公民的权利。训政是暂时的，宪政是永远的。我说过的话，我做到。”\n\n她合上讲稿，双手撑着阳台的栏杆，望着远处的紫金山。夕阳正在下沉，中山陵的白色石阶被染成了淡金色。她望着那个方向，声音忽然放低了，低到只有站在她身后的人才能听清。\n\n“母亲，训政结束了。宪政开始了。你交给我的枪，我还给了宪法。你欠人民的债，我替你还了一部分。剩下的，让她们自己还。我会看着她们。”\n\n胡宗南在身后立正，敬了一个军礼。汤汤没有敬礼，只是把头微微偏向一边，用只有她自己能听到的声音，对着空气说了一句话。她说话时腰间别着那把胡宗南的旧佩枪，枪柄上刻着黄埔的校训——“亲爱精诚”。\n\n蒋巾帼转过身，将帽檐扶正。她的身后，夕阳正从紫金山上缓缓沉下去，最后一缕余晖斜照在中山陵的白色石阶上，将整座陵墓镀上了一层暗金色的光芒。她把视线从陵墓的方向收回来，转身走进办公室。办公桌上放着一盆兰花、一把旧佩枪和一份刚刚签署完毕的宪法草案。她把旧纲要轻轻放在佩枪旁边，把宪法草案的扉页翻开，提起笔，在签署栏里写下自己的名字。笔迹端正，横平竖直，没有连笔，没有倾斜。窗外，风还在吹，旗帜在猎猎作响。她将笔搁回笔筒，把签署好的宪法草案合上，放在办公桌正中央。"
  roc.80.a: "不要再跪下"

  roc.81.title: "国会全体会议" #宋娇仁统一中国
  roc.81.desc: "统一后的第一届国会正式复会。宋娇仁作为行政院长，做了自定都以来最长的一次施政演说。\n\n她没有讲胜利。她讲的是账单。\n\n“过去两年的军事行动花费了国家预算的六成，接下来的预算将花费在你们每一个人脚下的道路上。接下来的十年，我不会再谈革命、不会谈主义、不会谈谁是敌人。我只谈四件事——修铁路、建学校、整水利、立法院。”\n\n“我站在这里，不是作为胜利者，是作为一个管家。我的任期是有限的，下次选举，如果我做得不好，请用选票让我下台。让我下台，是你们最大的权利，也是这个国家最好的保障。”\n\n全场起立鼓掌。革命委员会的蒋巾帼没有起立，但她鼓了掌。她在座位上的笔记本里写了一行字：“她说的是真话。真话不需要站起来听。”"
  roc.81.a: "演讲结束之后才是真正的开始"

  roc.82.title: "（待填充）" #胡宗南统一中国
  roc.82.desc: "（待填充）"
  roc.82.a: "（待填充）"

  roc.83.title: "最后一战" #汤汤统一中国
  roc.83.desc: "最后一场战斗发生在西北。\n\n汤汤亲自带队冲锋，清波寨子弟兵从侧翼包抄敌军指挥部。战斗只持续了四个小时，敌军指挥官阵前投降。战后清点战利品时，士兵发现敌军指挥部墙上钉着一张旧的黄埔军校招生海报，纸张已经发黄，上面蒋介石的题字仍然清晰——“亲爱精诚”。汤汤把这张纸取下来，叠好放进怀里。副官问她这是做什么。她说：烧给老蒋。还有老胡。\n\n识之律者没有上前线。她在南京的国家安全委员会大楼里观看了战报。她没有鼓掌，没有发表贺电，只是把前线军官的忠诚评估表从“战前”档案盒移到“战后”档案盒。然后给她的副官下达了一道口头指令：“存档。”\n\n“哪一个？”副官问。\n\n“全部。”"
  roc.83.a: "枪声止息的那一刻，有人烧纸，有人存档"

  roc.84.title: "孙科的早安电话" #识律统一中国
  roc.84.desc: "孙科每天早上八点整会接到一通电话。电话那头永远是识之律者的声音。她会把当天的日程念一遍：几点参加什么仪式，几点签署什么文件，几点在什么场合说哪几句话。然后在最后加一句——“其她事情，我来处理。”\n\n孙科从来没有问过“其她事情”是什么。她不想知道。她只是按时出现在安排好的场合，穿指定的礼服，念准备好的稿子，与预先安排好的贵宾握手。然后回到总统官邸，在阳台上养花。她的兰花养得极好。每年春天，她会送一盆到识之律者的办公室。她的秘书签收后摆在会议室角落，她本人从不浇花。"
  roc.84.a: "总统在阳台上养兰花"

