  ROC_policy_card_name_61: "以俄为师"
  ROC_policy_card_desc_61: "苏联是第一个承认广州国民政府并与之建立正式外交关系的国家。莫斯科的援助不仅包括武器和军事顾问，还包括一整套革命建国的理论框架——尽管这套框架在中国的土壤上需要大幅度的修正。"
