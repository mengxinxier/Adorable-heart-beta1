  ROC_Wang_Jingwei_name: "汪兆铭"
  ROC_Wang_Jingwei_political_desc: "汪兆铭!\n§Y改组派精神领袖§!\n  -$MODIFIER_STABILITY_FACTOR$：§G+10.00%§!\n  -$MODIFIER_CONSUMER_GOODS_FACTOR$：§Y-10.00%§!\n  -$MODIFIER_POLITICAL_POWER_FACTOR$：§G+10.00%§!\n  -$modifier_production_speed_arms_factory_factor$：§G+5.00%§!\n  -$modifier_state_production_speed_industrial_complex_factor$：§G+5.00%§!"
  ROC_Wang_Jingwei_deputy_leader_desc: "§Y派系§!：§O中国国民党改组同志会§!\n\n§L广府参政会上的茶香尚温，汪兆铭的座位却已人去楼空。\n随着蓝衣社将改组派与广西总督府的密电电底悉数公开，那纸企图“控制何氏、举事广州、两广共主北京”的《两广合作备忘录》草稿，成为了她无可辩驳的背叛铁证。这位昔日的同盟会元老、逸仙遗属的起草人，在被广府定性为“党国叛徒”后，漏夜搭乘挂有幻想乡国旗的货轮西渡梧州。在桂系军阀陆廷荣的刀兵荫蔽下，她于南宁另立政府，公然与广府分庭抗礼。\n\n在南宁的牌匾下，她依旧维持着昔日党国正统的体面，并将这场分裂粉饰为全面大萧条下的“隐忍图存”。她坚称广府已耽于狂热与内耗，唯有在西南联络实力派偏安、以务实的外交与妥协积蓄元气，才是乱世中唯一的“曲线”生机。然而，在这张自诩清醒的救国蓝图背后，是改组派在广州网络被连根拔起的惨烈代价，以及将国家重新推回军阀割据、失败主义泥潭的历史倒车。§!"
  ROC_Wang_Jingwei_diplomacy_desc: "§Y汪兆铭§!\n§Y[FROM.GetnameWithflag]§!的§Y国民政府主席§!\n\n§Y改组派精神领袖§!\n  -$MODIFIER_STABILITY_FACTOR$：§G+10.00%§!\n  -$MODIFIER_CONSUMER_GOODS_FACTOR$：§Y-10.00%§!\n  -$MODIFIER_POLITICAL_POWER_FACTOR$：§G+10.00%§!\n  -$modifier_production_speed_arms_factory_factor$：§G+5.00%§!\n  -$modifier_state_production_speed_industrial_complex_factor$：§G+5.00%§!"
  ROC_Jiang_Weiguo: "蒋唯果"
  ROC_Jiang_Weiguo_desc: "§L蒋唯果，国府装甲部队的新锐指挥官。早年赴德留学，亲历了1933年“骸骨之夜”的柏林沦陷。流亡时期，她因国府背景被流亡政权的极端派排挤，被诬蔑为“赤色代理人”。\n\n在火车联邦避难期间，她与当地的中国革命同情者西瓜深入探讨了未来道路，两人均意识到欧洲已无革命的土壤。唯果深知，自己所追求的装甲兵现代化理念，若要在乱世中开花结果，必须带回母国，亲自将其培育成国府最锋利的矛。1936年，当欧洲的经济危机全面爆发，原有的学术环境彻底分崩离析，唯果认为这只是欧洲彻底陷入停滞的必然结果，她果断结束了这段已无意义的流亡岁月，毅然决然地踏上了归国之路。\n\n关于她身世的传言——即国府元老戴姬桃为其生母——在政界流传甚广，但从未得到证实。面对戴姬桃关于“专注于战车履带之路”的告诫，她将所有精力投入到了国府军队的现代化改革之中。§!"
  ROC_many_leaders_chara: "各色领袖"
  ROC_many_leaders_chara_desc: "一般来说你不应该看到这个的……"

