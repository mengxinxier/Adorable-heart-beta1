  china_generic.009.t: "统一全中国"
  china_generic.009.desc: "似乎[From.GetLeader]已经决定最终将他的权威传播到全中国的广大地区。中央政府的一位代表到来，要求我们遵守[From.GetLeader]的命令，或者由一个更顺从的政府来代替。"
  china_generic.009.a: "同仇敌忾众志成城!"
  china_generic.009.b: "就让他们试试"
  china_generic.010.t: "[From.GetLeader]屈服了"
  china_generic.010.desc: "[From.GetLeader]以个人的名义将信件发出，在信里说道他保证严格遵守我们的命令，服从中央指挥。"
  china_generic.010.a: "识时务者为俊杰"
  china_generic.011.t: "[From.GetLeader]拒绝了"
  china_generic.011.desc: "[From.GetLeader]已经回复了我们的要求，他声称中央政府没有法律权力取代其管理者。该报告附有一份详细的报告，强调了他所属部队的战备情况！"
  china_generic.011.a: "我们严密关注"

