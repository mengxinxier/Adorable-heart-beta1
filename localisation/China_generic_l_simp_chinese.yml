  CWL_chongjiandongbei_desc: ""
  CWL_gongyefuxingzongshu: "工业复兴总署"
  CWL_gongyefuxingzongshu_desc: "因为战争毁坏与抵抗活动，新纳入[ROOT.Getname]统治的地区大多处于百废待兴的状态，要想重新使战后国内的工业得到复苏，我们需要设置一个总领全局的工业指导部门进行重建工作。"
  CWL_fazhanzhonggongye: "发展重工业"
  CWL_fazhanzhonggongye_desc: ""
  CWL_zhengheguofangchanye: "整合国防产业"
  CWL_zhengheguofangchanye_desc: ""
