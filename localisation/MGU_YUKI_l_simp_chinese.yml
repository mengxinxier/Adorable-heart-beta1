l_simp_chinese:
#国策本地化
 MGU_yuki_prepare_for_civil_war:0 "为了她们的世界"
 MGU_yuki_prepare_for_civil_war_desc:0 "吾等屹立于世，强敌环伺，兄弟阋墙几余载而终又归于一统。而满朝公卿皆为名利，魑魅妖魔勾结于高堂，终成大祸。吾等挚友或死于非命，或竟昏迷。而今宵小之辈卷土重来，妄图再次撕裂吾等神圣之联盟。为了她们的世界，吾等必将肩负重担。"
 MGU_yuki_recruit_army:0 "你会加入正义军吗"
 MGU_yuki_recruit_army_desc:0 "“我们，还是他们，你会选择站在哪一边？”作为一名魔法少女，你需要知道，你应该为了自己而战，而不是为了那些软弱的叛徒而战。更何况，哪怕按照所谓的民主程序，我们也是绝对的合法政府。"
 MGU_yuki_official:0 "一起为了那伟大国家共患难"
 MGU_yuki_official_desc:0 "一些将军也显然对原有的软弱政府并不买账，我们的上台毫无疑问是给了她们一个新的希望。因此，在暴风雨到来前，我们应该尽可能的和她们达成合作，一起为了伟大联盟奋战。"
 MGU_yuki_millitia:0 "用团结筑起街垒"
 MGU_yuki_millitia_desc:0 "所谓民心可用，用于形容现在的魔法少女联盟再合适不过了。爆炸案毫无疑问激发了魔法少女们的愤怒。不少民众要求严惩叛徒，强硬态度。也许将她们武装一下，就能让她们成为一支准军事组织为我们而战。"
 MGU_yuki_ultra_mind:0 "愤怒总比懦弱强"
 MGU_yuki_ultra_mind_desc:0 "诚然，叛乱者的说辞成功的动员了军队中一批不忠诚的分子。然而，我们同样也注意到，有一些强硬派的爱国士兵对我们表现出了强烈支持。虽然她们有时候，额，比较鲁莽，但是愤怒总比怯懦强对吧。"
 MGU_yuki_transform_weapons:0 "用枪炮让联盟四时安康"
 MGU_yuki_transform_weapons_desc:0 "你无法用嘴皮来说服他人，对付叛乱分子，只有枪炮才能让她们冷静下来并且乖乖闭嘴。这个主义者那个主义者，多说无益，再来走一躺吧，为了联盟的未来，让钢铁走上舞台！"
 MGU_yuki_make_sure_loyal:0 "魔法少女们，到这里来"
 MGU_yuki_make_sure_loyal_desc:0 "我们已经注意到，叛乱分子正在地方煽动叛乱，这已经让不少本就动摇的地区开始倒向叛军。我们也该行动起来了，在一切为时已晚前。"
 MGU_yuki_publicity:0 "“嘘，不许多嘴，仔细听”"
 MGU_yuki_publicity_desc:0 "对于一些摇摆地区，我们可以采取一些比较温和的手段来拉拢他们，比如在潜移默化中宣传我们的思想，阴谋论也好，舆论控制也好，总之让她们了解我们想让她们了解的东西，从而确保她们的服从。"
 MGU_yuki_northern:0 "北方的玛吉斯们..."
 MGU_yuki_northern_desc:0 "北方的玛吉斯们长期和前政府保持着敌对关系，即便是在谈判之后也仍有不少玛吉斯们对此表示不满，而我们则是重建了玛吉斯之翼的朋友，毫无疑问，只要我们稍微拉拢一下，玛吉斯们会站在我们这一边。"
 MGU_yuki_blame_left:0 "都是她们的错"
 MGU_yuki_blame_left_desc:0 "无论策划爆炸案的人是怎么想的，她们的这一行为毫无疑问是给人落下来口实。我们凭借着软弱的民主派和左翼叛徒的说辞成功上台，现在，我们不介意再用这个说辞来笼络人心。"
 MGU_yuki_martial_law:0 "所有人留在家里"
 MGU_yuki_martial_law_desc:0 "难以置信，居然有那么多人信了那些叛徒的鬼话，闹剧该落幕了，从现在开始全国戒严，谁都不许给我闹事。"
 MGU_yuki_love:0 "爱的渣滓"
 MGU_yuki_love_desc:0 "纯洁的艾玛，善良的艾玛，好孩子艾玛..."
 MGU_yuki_enter_the_focus_tree:0 "出乎意料的人选"
 MGU_yuki_enter_the_focus_tree_desc:0 "无数次从噩梦中惊醒\n愈发珍惜锈蚀的回忆\n已经行至此处了呢\n§R已经无需再担心了§!"
 MGU_yuki_enter_the_focus_tree_name:0 "§R恶魔将会披上天使的外衣§!"
 MGU_yuki_recruit_army_name:0 "§R三支§!§Y魔法少女部队将会加入我们§!"
 MGU_yuki_make_sure_loyal_name:0 "§R五支§!§Y魔联部队将会加入我们§!，§R并且开始对于动荡地区的拉拢决议§!"
 MGU_yuki_millitia_name:0 "§R五支§!§Y民兵部队将会加入我们§!"
 MGU_yuki_ultra_mind_name:0 "§R五支§!§Y魔联部队将会加入我们§!"
 MGU_yuki_northern_name:0 "§Y通过沟通可以保证玛吉斯之翼的部队在内战开始时候会加入我们§!§R而不是内部分裂导致不可逆的后果§!"
 MGU_yuki_rebuild:0 "废墟中的百合花"
 MGU_yuki_rebuild_desc:0 "我们成功击溃了那些腐朽堕落的叛徒和民主派带领的叛军，联盟是魔法少女的联盟，而不是任何其他人的。然而，短短十几年内两度内战已经使得我们的国家支离破碎，经济凋敝。为此，我们需要一个重建计划，我们将在废墟中开出最美丽的花。"
 MGU_yuki_people_economy:0 "子时将至"
 MGU_yuki_people_economy_desc:0 "毫无疑问，圣杯在战前持续对我们输出影响力，并且让我们的经济受制于他人。不过，随着内战的爆发，圣杯和其他欧洲国家的企业也陆续离开了这个是非之地。清算她们是早晚的事情，但是我们也许可以开放一些无关紧要的领域来吸引她们投资，这样不仅可以缓解我们的经济重建压力，也可以更好的呈现一个“文明”的假象来掩盖我们的计划。"
 MGU_yuki_zero_clock:0 "钟声响起"
 MGU_yuki_zero_clock_desc:0 "既然那些殖民者已经滚蛋了，就没有必要再迎回她们了。另一方面而言，对于仍然对于我们保有非分之想的圣杯企业，我们应该掐断她们不切实际的野心。至于经济发展，我们也许可以仅仅以盟友的名义向国际社会申请资金和技术人员援助，当然，作为代价，这些人到来之后必然会接触一些较为核心的问题，尽管我们可以隐藏，但这仍然会导致§R外界疑心加重§!"
 MGU_yuki_peace_factory:0 "民生经济"
 MGU_yuki_peace_factory_desc:0 "尽管我们并不是什么真正意义上的和平主义者，但考虑到战后民生凋敝，国家百废待兴。为此，我们需要优先重建联盟的民生。"
 MGU_yuki_mixed_factory:0 "混合式重建"
 MGU_yuki_mixed_factory_desc:0 "我们不能完全的把精力放在军事工业的重建上，但是这不意味着我们就要放弃宝贵的事件来过度享乐。联盟需要民生，更需要安全，为此我们将会在两者间达成一个平衡。"
 MGU_yuki_war_factory:0 "军工复合体"
 MGU_yuki_war_factory_desc:0 "军事工业是保护我们魔法少女免受威胁的重要部门，我们应该不遗余力的支持军事工业的重建和扩张，但是我们这么做可能释放了一个§R不友善的外交信号§!"
 MGU_yuki_army_condition:0 "联盟的利刃"
 MGU_yuki_army_condition_desc:0 "联盟的军队在战后面临着建制破坏和专业人员不足的问题，这是我们无法忍受的，一支专业强大的军队是我们实现夙愿的关键，军事改革必须尽快展开。"
 MGU_yuki_national_army:0 "联盟军队"
 MGU_yuki_national_army_desc:0 "专业的事情应该交给专业的人来做，月代雪小姐并非专业的军官，为此，也许交给巴麻美为首的军官来指挥魔法少女军队是个更好的选择。"
 MGU_yuki_obey_leader:0 "首脑至上"
 MGU_yuki_obey_leader_desc:0 "晓美焰的叛乱已经证明了，不能让联盟的军权流向叛徒和不忠诚之人，为此，月代雪小姐必须对军队有绝对控制权，这样一来，月代雪小姐的魔法强化也可以更好的作用于联盟军。"
 MGU_yuki_helldiver:0 "南美大陆军"
 MGU_yuki_helldiver_desc:0 "我们最终的目标是统合南美，来抵御欧洲殖民者和人类对我们的压迫的损害。为此，军队的目标和设计方向都应该是南美大陆军，而不是一支龟缩在联盟内的内卫。"
 MGU_yuki_official_army:0 "职业化魔法少女"
 MGU_yuki_official_army_desc:0 "联盟在多年内战中军队素质和理念长期落后于世界，为了扭转颓势，我们需要尽快实现魔法少女军队的现代化和职业化。"
 MGU_yuki_copy_england:0 "圣杯模式"
 MGU_yuki_copy_england_desc:0 "圣杯是当今世界上最强的国家，拥有最强大的军队和最先进的理论，学习圣杯的模式毫无疑问是我们的最好出路。"
 MGU_yuki_new_age:0 "少女黎明"
 MGU_yuki_new_age_desc:0 "我们已经摆脱了软弱的民主谎言的枷锁，魔法少女将迎来解放的黎明，彻底摆脱殖民主义的未来就在眼前。"
 MGU_yuki_invasion:0 "南美统合主义"
 MGU_yuki_invasion_desc:0 "如果仅仅依靠联盟的有限资源，和圣杯王国对抗毫无疑问是以卵击石，如果南美和魔法少女要获得自由和解放，那么整合南美毫无疑问是唯一出路。只是有人担忧这样的扩张主义政策是否会引发他国警惕和怀疑我们的真实目的。"
 MGU_yuki_conservation:0 "魔法少女保守政策"
 MGU_yuki_conservation_desc:0 "目前的联盟不宜过早的展示自己的野心，当务之急的在百废待兴之际保持我们的独立和联盟的安全，因此当前的重心应该是自保而不是扩张计划。"
 MGU_yuki_london_travel:0 "伦敦之行"
 MGU_yuki_london_travel_desc:0 "在我们拥有充足的实力和做好复仇准备前，我们必须装作亲近圣杯王国，因此，月代雪小姐将亲自去一趟伦敦来展示友好。"
 MGU_yuki_south_america:0 "南美倡议"
 MGU_yuki_south_america_desc:0 "现阶段直接吞并南美还是过于困难了，且暴露野心的风险是我们无法承受的。为此，我们可以打着圣杯王国和圣杯同萌的名义和南美诸国加强合作，如果她们愿意的话。即便不愿意，也可以展示我们的友好态度，有利于我们将来整合南美。"
 
#事件本地化
 yuki.1.t:0 "晌午"
 yuki.1.d:0 "樱羽艾玛其实并不喜欢开会，毕竟没事干谁会喜欢坐在那件闷热的议会大厅里几个小时呢。艾玛望向了坐在边上的二阶堂希罗，她的黑发盖住脸，趴在桌上一动不动。“喂，希罗酱。”艾玛用手肘戳了戳了希罗的背部，希罗毫无反应，只有背部有轻微的起伏告诉别人她在和爱丽丝一起梦游仙境。\n\n主席台上，梓美冬还在絮絮叨叨的念个没完车轱辘话，什么玛吉斯和平条约的注意事项，前排的要员们认真的抄录着要点，不过艾玛和希罗这种普通议员则对此并不在意，大多数都坐在中后排发呆或者拿着笔在纸上随便涂涂画画，当然，像希罗这样直接倒头就睡的也就是特例。按理说这种行为是要被处分的，不过考虑到上次议会议长来找希罗时被骂了个狗血淋头，说什么让她来参加这种和她毫无关系的议会是错误的，气的议长差点给她革职，最后碍于二阶堂家的势力还是妥协了之后，就没人再来找这种不愉快了。\n\n艾玛百无聊赖的盯着角落里看，正想着中午吃啥的时候，一个少女匆匆忙忙的从门口闯了进来，在众人不悦的目光下从后门走向了议员席，手里拎着一个鼓鼓囊囊的公文包。\n\n艾玛看着这个少女，一股恶寒爬上了脊梁。由于刚才的喧闹，希罗也迷迷糊糊的醒来了，然后目光就锁定在那个新来的少女身上，显然她也感觉到了不对劲。少女逐渐走到她们眼前，手正准备拉开公文包时：..."
 yuki.1.a:0 "希罗没能阻止她，炸弹被引爆了，爆炸波及了整个议会"
 yuki.1.b:0 "希罗一把按住了她，未激活的炸弹从公文包里滚落"
 yuki_1_a_name:0 "§R这将会导致严重的后果...§!"
 yuki.2.t:0 "魔法少女联盟议会发生爆炸案"
 yuki.2.d:0 "就在近日，魔法少女联盟传来了惊人的消息：一名左翼议员因对现状不满而在议会上引爆了炸弹，根据事后统计，一共有十人不幸遇难，另外有三十二人受伤，凶手当场死亡。受害者大多数为玛吉斯之翼的成员。相关机关对此案的调查显示凶手与南美极左翼组织“野火革命军”有密切联系。\n\n晓美焰在新闻发布会上表示：我们沉痛悼念不幸逝去的同胞，并对她们的遭遇表示遗憾。同时她也表示为了捍卫民主，将会对极左翼激进分子实行更加周全的监视和限制。\n\n国际社会目前普遍认为这将会让魔法少女联盟来之不易的脆弱民主蒙上一层阴影，也有人质疑这种反极端主义措施是否会成为另一段政治恐怖时代的开始。"
 yuki.2.a:0 "不幸的消息"
 yuki.2.b:0 "我就说她们的天真幻想会自食恶果"
 yuki.3.t:0 "葬礼"
 yuki.3.d:0 "见泷原市在下雨。司仪在公墓前以低沉的声音，诵读着悼词。“二阶堂希罗，长期刚正不阿，对于一切的罪恶都绝不姑息，我们悲痛的失去了这位...”墓地的空地上放着一口棺木，二阶堂希罗就静静地躺在棺木里，小小的身躯像一个人偶一般摆放在白布包裹的棺木内侧。棺木两旁的朋友和亲戚脱帽向希罗做最后的告别，二阶堂夫妇则是早已泣不成声。\n\n在队伍的角落里，一个穿着学生西装的白发少女一言不发的混迹在人群中，眼神直勾勾的看着希罗的遗体，表情木讷。\n\n半晌后遗体下葬，其他人三三两两的离去了，也包括抹着眼泪的二阶堂夫妇，只有少女仍然站在那里，嘴里还在喃喃低语着：“为什么，为什么，希罗为什么要这么早离开我。”少女的拳头攥紧，一行清泪划过脸颊。"
 yuki.3.a:0 "她们必须付出代价，希罗，§R我会让她们血债血偿§!，§C以我大魔女月代雪的名义起誓§!"
 yuki.4.t:0 "蒙上血泪的照片"
 yuki.4.d:0 "心电检测仪的“滴滴”声是护士换完营养液之后病房里唯一的声音。月代雪坐在病床前，病床上躺着一位粉色头发的少女——樱羽艾玛。虽然捡回了一条命，但是代价是爆炸的冲击波导致了她就此陷入昏迷。\n\n月代雪无数次哀求过医生，表示无论多少钱，什么代价她都会帮忙出的。但是得到的回复只有一句冰冷的无能为力。\n\n“艾玛，你知道吗，我刚刚去送希罗了，她就那么躺在那里，好孤独，好渺小...就像，就像你一样。”月代雪无法控制自己的眼泪不再流下，泪珠滴落在西装上，溅出一朵朵如同绽放的血花一般的水韵。\n\n月代雪颤巍巍的拿出一张照片，那是她们在高中时期照的，希罗，艾玛和月代雪，三个人穿着校服坐在天台上看夕阳，艾玛高兴的像个孩子。照片上滴落了泪水，模糊了希罗的脸，“我好想，再和你们一起坐在天台上啊，我们一起看落日，一起吃路边的关东煮，一起...”\n\n病床上的艾玛依旧静静的躺着，小雪看着她，似乎希罗躺在棺材里的身影和艾玛的躯体开始重合，然后随着哀乐缓缓陷入漆黑的地底。\n\n“不，不要，不要走，艾玛。”月代雪伸出手想要拉出艾玛，摸到了一双温热白皙的小手，黑暗褪去，艾玛仍然静静的躺在床上，但是月代雪的心里有什么东西“咔哒”一声碎了。"
 yuki.4.a:0 "艾玛，我一定会保护你，§R无论代价有多么高昂...§!"
 yuki_1_b_name:0 "§C民主制度幸存§!"
 MGU_yuki_stop:0 "§Y局面没有失控§!"
 yuki.6.t:0 "老朋友"
 yuki.6.d:0 "神滨市的四季雨水都不少，淅淅沥沥的雨冲刷了火药味逐渐浓厚的联盟，也冲刷了那刚刚解严的喜悦。联盟该何往，少女们人心惶惶。街角的咖啡馆，就像幻想乡街角的那些一样，似乎刺杀的风波没有波及到这一片在幻想乡大革命时期也不会被街垒流弹侵袭的避风港。\n\n当然，三位玛吉斯显然无缘消受这一份喜悦。里见灯花，阿莉娜和柊音梦围坐在一张圆桌前，玛吉斯之翼在一天内同时失去了梓冬美和蓝家姬奈两位话事人，一时间少女们群龙无首。\n\n里见灯花首先抿了一口咖啡，向其他两人提议直接由三位玛吉斯直接接管玛吉斯之翼。这一决定很快遭到了反对，虽然和平解决了和联盟的矛盾，但是作为刚刚归顺的前叛乱分子，这一行为无疑会招致其他党派的警惕，其他的魔法少女们显然也对此不会买账。\n\n阿莉娜则是提议解散玛吉斯之翼，并入议会中央。当然这个说法连她自己也没有说服，毕竟这就意味着直接投降了，是对于死去的少女的不尊重。\n\n最后，柊音美缓缓吐出一句话："
 yuki.6.a:0 "“你们觉得月代雪怎么样”"
 yuki.7.t:0 "新面孔"
 yuki.7.d:0 "玛吉斯之翼的成员们在台下嘈杂不已，爆炸案带来的阴影还未消退，议会大厅的一角还带着爆炸残留的焦黑，自然的，少女们自觉的远离了那一片不详的是非之地。\n\n“哎，你听说吗，好像玛吉斯们说要解散玛吉斯之翼了”一名黑羽和另一个少女切切喳喳。“哎呀”一拳头砸在她脑袋上，一名白羽脸上不悦，“不要散播恐慌，说什么呢你。”那名黑羽悻悻地继续保持沉默。好吧，其实也没保持多久。\n\n“各位，安静一下，”里见灯花站在一个箱子上，努力的把自己的上半身探出演讲台。台下的少女们停下了窃窃私语，转头望向这位玛吉斯。\n\n“各位，首先我们为逝去的少女们默哀，发生这种事情，我们始料未及。但是，我们还是得关注于玛吉斯之翼的未来发展状况。”有一个白羽站起来疑惑道：“三位玛吉斯们不能像以前一样直接自己做决策吗。”灯花苦笑了一下，“各位，我们虽然已经和联盟和解，但这不代表我们不会被其他人当成“叛徒”看待。所以，我们还是需要一个新的面孔来担此大任的。”随后，灯花从箱子上跳下，一名穿着西装的白发少女面对着硕大的议会大厅，笑了一下：“各位，我叫月代雪...”"
 yuki.7.a:0 "“你们愿意成为我的共犯吗”"
 yuki.8.t:0 "不信任议案"
 yuki.8.d:0 "七海面露苦涩，此时此刻哪怕是聚光灯打在她身上也能没有了往日的那种精神和自信。台下密密麻麻的坐着各党派的议员，少女们或屏息凝神，或面露不安，只有玛吉斯之翼们面露得意，而巴麻美则是一如往常的面色平静。\n\n七海苦笑一声，就像是4年前魏玛共和国的社民党议员那样，她很清楚在爆炸案之后，民主的前途就已经被议会坍塌的砖块掩埋了，不信任议案则是给着脆弱的民主盖上了最后一块棺材板，这也许就是最后一次真正意义上的民主程序了。随后，她清了清嗓子，向台下宣布：“那么，宣布不信任议案的表决结果，最后的结果是，”她几乎要哭了，“不信任议案通过，另外，根据另一项表决结果，下一任联盟盟主是...”"
 yuki.8.a:0 "“月代雪...”"
 yuki_new_tree:0 "§R将加载新的国策树§!"
 yuki.9.t:0 "红茶，胜利，魔法少女"
 yuki.9.d:0 "巴麻美其实并不想和曾经的好友们刀剑相向。\n\n然而，最近的军队状况让她难以放心。军队异常调动，海军私自出港，这些还只是小事，更令人不安的是民间的准军事组织，比如联盟民主青年团等民兵分子，被报告近期活动异常增加，且装备和人员都得到大量补充。\n\n巴麻美知道，现在情况已经到了无法挽回的地步。也许她应该和昔日好友们一起对抗所谓的暴君月代雪，但是挽回了民主之后呢，魔法少女们就得救了吗？异见分子可以登堂入室炸毁议会，她的朋友们，其他和她一样的魔法少女，难道就不会步死者的后尘了吗？\n\n思索良久，她拿起了电话..."
 yuki.9.a:0 "“帮我接佐仓杏子和沙耶香”"
 yuki.10.t:0 "逝去的不会再回来"
 yuki.10.d:0 "一本本日历被撕下，马孔多在下雨。她们是怎么称呼我们的？香蕉园，殖民地，后花园...悲苦百余载，自从殖民者用她们的所谓枪炮轰开了魔法少女和南美的头颅，再把她们所谓的自由民主灌入拉美大陆。\n\n无量英雄无量血，似乎换来了自由和独立。但惜换得旧人间，肉食者弹冠相庆，虚假的独立冠以民主之名。\n\n奶与蜜的流淌之地，血和骨的埋葬之地，黄金国的美名由魔法少女的苦难来奠基。半个世纪骨肉相残的记忆，光耀的圣杯旗，将被魔法少女暴起扯下。"
 yuki.10.a:0 "而未来尤可追。"
 yuki.11.t:0 "回信"
 yuki.11.d:0 "致月代雪小姐：\n我们已经获悉了近期国内的动荡状况。作为玛吉斯之翼的一份子，我很高兴您在当选后仍记得玛吉斯的愿望，以及全世界魔法少女的解放，我再次向您致以崇敬敬意。\n\n我们今日也收到了所谓民主派的来信，信中指控您忘记了玛吉斯的愿望只希望夺取权力享福，组织内一部分人动摇了，但感谢您提供的证据和来信成功澄清了这一点。\n\n作为三位玛吉斯之一，我在此代表三位玛吉斯向您承诺将会提供包括武装力量在内的一切支持。\n\n此致\n\n里见灯花"
 yuki.11.a:0 "感谢你们的帮助"
