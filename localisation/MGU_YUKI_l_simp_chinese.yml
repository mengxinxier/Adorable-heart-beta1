 MGU_yuki_revolution_south:0 "南美革命"
 MGU_yuki_revolution_south_desc:0 "是时候了，把整个南美和魔法少女从殖民者，王权疯子，混沌信徒和不切实际的空想主义者手里解放出来了，魔法少女们，拿起武器，为了联盟和魔法少女的革命而战。"
 MGU_yuki_militray_magic:0 "魔法少女军事化"
 MGU_yuki_militray_magic_desc:0 "自由散漫的弊病必须被根除，一切为了前线，一切了为了魔法少女的胜利，魔法少女们要踊跃参军。"
 MGU_yuki_the_most_dangerous:0 "魔法少女的存亡之际"
 MGU_yuki_the_most_dangerous_desc:0 "联盟遭到攻击，魔法少女最后的安身立命之地遭到威胁，姑娘们，团结起来，消灭强敌！"
 MGU_yuki_make_sure_equipments:0 "一切为了前线"
 MGU_yuki_make_sure_equipments_desc:0 "如果我们在这场战争中失败，那么我们将万劫不复。因此，每一把枪，每一发子弹，每一发魔弹，都需要为了前线的战事服务。"
 MGU_yuki_all_for_the_war:0 "一切为了胜利"
 MGU_yuki_all_for_the_war_desc:0 "少女们应该重拾起当年面对魔兽和魔化的同伴的悍不畏死的精神了，敌军来势汹汹，为了胜利，每一个人的牺牲都是值得的，没有什么牺牲大到无法接受，也没有怯懦和背叛小到可以被原谅！"
 MGU_yuki_angel_action:0 "安乐天使行动"
 MGU_yuki_angel_action_desc:0 "跨越最后的街垒和阵地，我们誓要把魔法少女的胜利和救赎带向整个南美！"
 MGU_yuki_great_war:0 "宿命之战"
 MGU_yuki_great_war_desc:0 "逃出去吧，逃出去吧，从魔法少女的悲惨轮回中逃出去吧，因为你不是那注定生在奈落的花..."
