#决议
 #决议组 
  LFC_decision_l_0_debug:"debug决议"
  LFC_decision_l_1_ai:"ai脚本"
  LFC_decision_l_2_Rainforest_Exploration:"深入雨林"
  LFC_decision_l_2_Rainforest_Exploration_desc:"百年前，殖民者们只能龟缩在海岸线，躲避雨林深处的险恶环境和怪物。但如今，远征军的旗帜已插遍大片新拓的疆土，征服整个雨林似乎指日可待。\n而我们的成就，也引来了整个圣杯联邦的瞩目。雨林深处不仅蕴藏着宝贵的资源，更有沉睡了万年的先驱者遗迹被发现。这些遗物的价值无可估量，本土对此事的重视日益加深，无数怀揣着发财梦的民间冒险家也如潮水般涌入我们的港口，渴望在这场新的淘金热中分一杯羹。\n探险队的每一次出发都不是简单的勘探行动，而是一场深入未知、挣扎求存的冒险。探险队将独自面对饥饿、疾病以及潜伏在丛林中的可怖生物，他们的每一步都将书写新的历史，或成为雨林中又一个无名的悲剧。\n在这里，胜利不仅取决于武器的精良，更取决于后勤的坚韧。毕竟，雨林从不吝于吞噬那些准备不足的鲁莽者。"

 #其他
  LFC_decision_ai_tnyl:"吞并雨林"

 #雨林
	LFC_decision_forest_debug_Rainforest_Acting:"debug开始雨林探索"
