#事件
    LFC_event.1.t:"神滨-新安普顿协定"
    LFC_event.1.d:"露斯契亚远征军邀请我们加入阵营"
    LFC_event.1.a:"同意"
    LFC_event.1.b:"拒绝"
    LFC_event.1.c:"得让我们来当阵营领袖"


 #雨林探索
  #玩家选项事件
    LFC_event_forest.1.t:"购买补给"
    LFC_event_forest.1.d:"要想筹备勘探任务，首先要购置足够的补给，我们准备的补给越多，探险队能坚持时间就越长。\n\nPS:需要有至少200块钱才能显示全部选项"
    LFC_event_forest.1.a:"购置标准补给"
    LFC_event_forest.1.b:"购置较多补给"
    LFC_event_forest.1.c:"购置丰厚补给"
    LFC_event_forest.1.e:"容我三思"

    LFC_event_forest.2.t:"选择探险队类型"
    LFC_event_forest.2.d:"其次，我们需要选择探险队的装备类型，装备越精良，探险队在面对敌人时的战斗力就越强。\n\nPS:需要有足够的库存装备才能显示全部选项"
    LFC_event_forest.2.a:"给探险队配备普通装备"
    LFC_event_forest.2.b:"给探险队配备机械化装备"
    LFC_event_forest.2.c:"给探险队配备构装骑士"
    LFC_event_forest.2.e:"容我三思"

    LFC_event_forest.3.t:"选择探险队规模"
    LFC_event_forest.3.d:"最后，我们要决定派出何种规模的探险队，规模越大，探险队人数就越多，抗损耗能力就越强。\n\nPS:需要有足够的库存装备和人力才能显示全部选项"
    LFC_event_forest.3.a:"派出一支小型探险队"
    LFC_event_forest.3.b:"派出一支中型探险队"
    LFC_event_forest.3.c:"派出一支大型探险队"
    LFC_event_forest.3.e:"容我三思"

  #雨林非战斗负面事件
    LFC_event_forest.11.t:"活体迷宫"
    LFC_event_forest.11.d:"探险队进入了一片由巨大珊瑚状植物构成的森林，这些植物的生长速度快得惊人，在我们身后不断改变着路径。侦察兵报告，我们似乎被困在了一个活的、不断变化的迷宫里。时钟塔的魔术师警告，这片森林本身就是一个巨大的魔术结界，旨在困住入侵者。"

    LFC_event_forest.11.a:"原地驻扎，等待魔术师解析结界"
    LFC_tooltip_forest_event_11_a:"我们建立了防御营地，保护魔术师们进行不间断的研究。在消耗了补给和数天时间后，他们终于找到了结界的薄弱节点，并为我们指明了唯一的出路。"

    LFC_event_forest.11.b:"依靠炸药，强行开路"
    LFC_tooltip_forest_event_11_b:"我们决定不把希望寄托于漫长的研究。工兵们用炸药在前方开路，士兵们则负责清理不断重新长出的植物。虽然这让我们付出了不少人员伤亡和物资消耗，但总算杀出了一条血路。"

    LFC_event_forest.11.c:"辨识‘主干’的生长方向"
    LFC_tooltip_forest_event_11_c:"妖精们似乎能看穿这些植物的生长脉络。她们带领着一队士兵，精准地砍断了几个为整个迷宫提供能量的‘主干’。结界的生长立刻停止了，我们得以从容地离开。"


    LFC_event_forest.12.t:"千面之雾"
    LFC_event_forest.12.d:"探险队驶入了一片弥漫着甜香花粉的浓雾之中。很快，士兵们开始出现严重的幻觉，他们看到了家乡的亲人、过去的战友，甚至是不应存在的怪物。这不是普通的雾，而是一种能将人拖入记忆与幻想深渊的危险花粉。整个队伍的指挥系统已濒临瘫痪。"

    LFC_event_forest.12.a:"启动车辆的空气循环系统"
    LFC_tooltip_forest_event_12_a:"我们下令所有人员进入车辆，并启动了能耗极高的空气循环和过滤系统。在耗尽了近半的能源储备后，我们像潜水艇一样，安全地‘潜’过了这片雾区。"

    LFC_event_forest.12.b:"强行冲出雾区"
    LFC_tooltip_forest_event_12_b:"在雷达的指引下，我们决定用最快的速度冲出去。虽然大部分人员成功脱险，但一些负责殿后的队员因陷入幻觉而掉队，永远地迷失在了雾中。"

    LFC_event_forest.12.c:"制作天然的过滤器"
    LFC_tooltip_forest_event_12_c:"妖精们认出了这种致幻花粉的来源，并迅速采集了数种能中和其毒性的植物。她们指导士兵将这些植物的叶片做成简易的口罩，这让我们安全地通过了这片区域。"


    LFC_event_forest.13.t:"深渊裂谷"
    LFC_event_forest.13.d:"我们前方的道路上出现了一道深不见底的裂谷，它彻底切断了我们的去路。对岸近在咫尺，但深渊中传来的风声仿佛是死神的呼吸。我们必须找到跨越这道天堑的方法。"

    LFC_event_forest.13.a:"建造一座临时桥梁"
    LFC_tooltip_forest_event_13_a:"工程师们指挥士兵砍伐了周围所有能用的巨木，耗费了九牛二虎之力才搭建起一座摇摇欲坠的桥梁。"

    LFC_event_forest.13.b:"寻找绕行的道路"
    LFC_tooltip_forest_event_13_b:"我们派出了侦察队，最终找到了一条需要多走数天的崎岖山路。虽然这极大地消耗了我们的物资储备，但总算是安全地绕过了裂谷。"

    LFC_event_forest.13.c:"发现“巨人之脊”"
    LFC_tooltip_forest_event_13_c:"妖精们展现了她们无与伦比的侦查能力。她们轻盈地沿着裂谷边缘进行快速搜索，找到了一座被藤蔓和青苔完全覆盖的天然石桥。我们轻易地抵达了对岸，并将这座石桥命名为“巨人之脊”。"


    LFC_event_forest.14.t:"变质的口粮"
    LFC_event_forest.14.d:"持续的高温和湿气终于摧毁了我们防线的一部分。一批储藏不当的食品发生了变质，但直到数十名士兵在晚餐后痛苦地倒下，我们才发现这个致命的问题。一场突如其来的食物中毒正在营地中蔓延。"

    LFC_event_forest.14.a:"原地修正，依靠士兵的体质硬撑过去"
    LFC_tooltip_forest_event_14_a:"我们为病患提供了干净的饮水和休息环境，希望他们能依靠自身免疫力恢复。大部分士兵最终挺了过来，但这次中毒事件严重削弱了我们的有生力量。"

    LFC_event_forest.14.b:"动用珍贵的药物进行治疗"
    LFC_tooltip_forest_event_14_b:"医疗官动用了大量的广谱抗生素和止泻药物，为所有出现症状的士兵进行治疗。虽然这消耗了我们近半的药品储备，但大多数士兵很快就恢复了健康。"

    LFC_event_forest.14.c:"施展群体治愈术"
    LFC_tooltip_forest_event_14_c:"魔法少女吟唱着治愈的祷文，温暖的圣光拂过每一位痛苦的士兵。在魔力的作用下，他们体内的毒素被迅速中和，很快便恢复了活力。"


    LFC_event_forest.15.t:"日晷之锁"
    LFC_event_forest.15.d:"“我们发现了一座先驱者神庙的入口，但它被一个巨大的日晷之锁所封印。根据壁画的提示，需要将数道特定角度的阳光同时聚焦在锁芯的水晶上，才能将其打开。然而，神庙位于深邃的峡谷底部，终年不见阳光，这使得谜题从物理上无法解开。”"

    LFC_event_forest.15.a:"架设一个巨大的反射镜系统"
    LFC_tooltip_forest_event_15_a:"工程部队消耗了大量的镜片、金属和能源，在峡谷顶部架设了一个极其复杂的反射镜系统，试图将阳光折射下来。经过数天的调试和等待，我们总算捕捉到了几分钟的阳光，成功打开了大门。"

    LFC_event_forest.15.b:"尝试从侧面进行爆破"
    LFC_tooltip_forest_event_15_b:"我们决定放弃解谜，直接从神庙侧面的墙壁进行爆破。虽然这最终让我们得以进入，但剧烈的爆炸也引发了内部结构的坍塌，并导致了部分人员伤亡。"

    LFC_event_forest.15.c:"用魔法解决"
    LFC_tooltip_forest_event_15_c:"魔法少女根据研究人员的的指示，施展了精巧的光系魔法，创造出数个稳定可控的光源，完美地模拟了阳光。在众人的合作下，这个古老的谜题被轻易解开。"


    LFC_event_forest.16.t:"血蝇瘟疫"
    LFC_event_forest.16.d:"一群拳头大小、散发着腐臭的‘血蝇’盯上了我们。它们无孔不入，其叮咬不仅会吸取血液，更会传播一种使人肌肉无力的疾病。整个队伍的士气和效率都因此大幅下降，我们必须立刻处理掉这些恼人的害虫。"

    LFC_event_forest.16.a:"分发驱虫药剂，进行全面涂抹"
    LFC_tooltip_forest_event_16_a:"我们消耗了大量的驱虫药剂储备，命令所有士兵进行全身涂抹。药剂的气味令人作呕，但血蝇的骚扰确实大幅减少了。"

    LFC_event_forest.16.b:"组织捕杀小队，手动清除蝇群"
    LFC_tooltip_forest_event_16_b:"我们组织了专门的小队，用网和喷火器来捕杀这些血蝇。这是一场混乱而疲惫的战斗，许多士兵在捕杀过程中被反复叮咬而病倒。在消耗了少量燃料后，我们总算将营地附近的血蝇清理干净。"

    LFC_event_forest.16.c:"释放冰霜法术，冻结它们"
    LFC_tooltip_forest_event_16_c:"随着魔法少女吟唱咒文，一阵刺骨的寒风扫过营地，所有靠近的血蝇瞬间被冻结在半空中，然后像玻璃一样碎裂。"


    LFC_event_forest.17.t:"河道塌方"
    LFC_event_forest.17.d:"我们正沿着一条干涸的古河道行军，两侧高耸的崖壁因连日暴雨而变得不再稳固。突然，伴随着一阵巨响，我们后方的道路被一场大规模的塌方完全堵死，而前方的天气预报显示，一场更大的风暴即将来临。我们被困在了这个天然的死亡陷阱中，必须尽快脱困。"

    LFC_event_forest.17.a:"呼叫空军进行紧急吊运"
    LFC_tooltip_forest_event_17_a:"我们立刻联系了后方基地，请求重型运输飞艇的支援。在原地等待了数天后，飞艇终于抵达，将我们的人员和车辆分批次吊运出了这片绝境。"

    LFC_event_forest.17.b:"在风暴来临前清理出一条通路"
    LFC_tooltip_forest_event_17_b:"时间紧迫，我们决定依靠自己。士兵们顶着落石的风险争分夺秒地清理着道路。在付出了相当多的人员伤亡后，一条简陋的通道总算在风暴来临前被挖通了。"

    LFC_event_forest.17.c:"让工程部队清理道路"
    LFC_tooltip_forest_event_17_c:"工程部队的推土机和挖掘机在这种环境下展现了其无与伦比的效率。一条足以让整个车队通行的安全道路在一天内内就被清理了出来。"


    LFC_event_forest.18.t:"崩塌的遗迹"
    LFC_event_forest.18.d:"我们发现了一座半埋在山体中的先驱者建筑。就在先头部队进入其中进行勘探时，遗迹的结构突然开始变得不稳定，巨大的石块从天花板上不断坠落，出口也被落石堵死。我们必须立刻救出被困在里面的小队。"

    LFC_event_forest.18.a:"派出工兵进行挖掘"
    LFC_tooltip_forest_event_18_a:"经过数小时的奋战，一条通道被挖开。但许多士兵在挖掘过程中因过度劳累和二次坍塌而严重受伤。"

    LFC_event_forest.18.b:"使用工程炸药进行爆破"
    LFC_tooltip_forest_event_18_b:"工程师们计算了精确的爆破点，用有限的炸药清出了一条救援通道。虽然爆炸引发了进一步的坍塌，导致我们无法对遗迹进行更深入的探索，但被困的小队被成功救出。"

    LFC_event_forest.18.c:"让构装骑士清理障碍"
    LFC_tooltip_forest_event_18_c:"构装骑士巨大的动力臂在这种环境下发挥了无可替代的作用。它轻易地举起数吨重的巨石，像清理积木一样开辟出一条安全的通道。被困小队被迅速救出，几乎没有造成任何额外的人员损失。"


    LFC_event_forest.19.t:"剧毒瘴气林"
    LFC_event_forest.19.d:"前方的森林被一种散发着诡异绿色微光的瘴气所笼罩，空气中弥漫着一股甜腻的杏仁味。研究人员的紧急报告令人不寒而栗：这并非普通瘴气，而是一种未知植物散发出的、专门针对高等哺乳动物神经系统的剧毒气体。我们的常规防毒面具无法有效过滤这种超微粒子，任何吸入者都会在几分钟内呼吸系统麻痹，并在痛苦中窒息而死。"

    LFC_event_forest.19.a:"呼叫攻击机，投放燃烧弹"
    LFC_tooltip_forest_event_19_a:"我们呼叫了空中支援。数架攻击机呼啸而至，向森林中投掷了大量的燃烧弹。熊熊大火成功地烧光了所有植物，探险队得以顺利通过。"

    LFC_event_forest.19.b:"派遣一支穿着重型防护服的突击小队"
    LFC_tooltip_forest_event_19_b:"一支由精锐士兵组成的小队，穿上了我们为数不多的、用于处理极端生化危害的重型防护服。他们携带高压喷火器，手动清理出一条狭窄的通路。虽然任务最终成功，但仍有数名队员因防护服在行动中意外破损而牺牲。"

    LFC_event_forest.19.c:"让骑士作为开路先锋"
    LFC_tooltip_forest_event_19_c:"构装骑士拥有完全密封的驾驶舱和独立的空气循环系统，使其能完全免疫毒气的影响。它像一艘破冰船，在前方用喷火器开辟出一条宽阔的道路，我们紧随其后，安全地通过了这片区域。"


    LFC_event_forest.20.t:"无尽的绿海"
    LFC_event_forest.20.d:"我们进入了一片地貌极其单调的原始雨林。这里所有的树木都长得一模一样，没有任何可供辨认的地标。更糟糕的是，研究人员报告该区域存在强烈的地磁异常，导致我们所有的罗盘都已失灵。我们就像一叶孤舟，彻底迷失在了这片无边无际的绿色海洋之中。"

    LFC_event_forest.20.a:"呼叫侦察机，进行高空三角定位"
    LFC_tooltip_forest_event_20_a:"我们向后方基地发送了求助信号。在原地等待了数天后，一架高空侦察机终于抵达。它通过与我们进行多点信号交互，成功地为我们重新校准了坐标，并规划出一条离开这片区域的路线。"

    LFC_event_forest.20.b:"派遣侦察兵，向所有方向进行探索"
    LFC_tooltip_forest_event_20_b:"在导航系统失灵的情况下，我们只能回归最原始的办法。大量的侦察兵被派往不同方向，用记号标记着路线。虽然我们最终通过这种拉网式搜索找到了出路，但也付出了数支小队失联的惨痛代价。"

    LFC_event_forest.20.c:"利用构装骑士的的雷达系统"
    LFC_tooltip_forest_event_20_c:"“我们启动了构装骑士搭载的先进军用雷达。它扫描了周围数十平方公里的地形，并将其与我们出发前准备的地形图进行匹配。在经过数小时的运算后，我们成功找到了当前所在的位置，并依靠雷达的指引离开了磁场异常区域。”"

