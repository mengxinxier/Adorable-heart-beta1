 BAL_preparing_for_currency_issuance_category: "吉斯塔特地区经济"
 BAL_preparing_for_currency_issuance_category_desc: "吉斯塔特地区工业基础薄弱，缺乏现代化资金和人才，但好在秉持独立信念的勇者和战姬在建设工业方面达成了共识，就是大力开发自然资源和轻工业赚取工业资金，在国际上营造对外开放的中立国形象，藉此招纳技术人才、培养产业工人，最终完成重工业的建设，让吉斯塔特能够在国际上掌握一定话语权。"
 BAL_renovation_of_riga_municipal_building: "里加市政翻新"
 BAL_renovation_of_riga_municipal_building_desc: "里加是我们的首都，翻新里加的市政建设有利于改善城市形象，对于勇者及大赦在吉斯塔特的统治有一定好处。"
 BAL_expansion_of_Tallinn_industrial_zone: "塔林工业用地拨款"
 BAL_expansion_of_Tallinn_industrial_zone_desc: "塔林是我们保存尚为完好的工业区域，其地处北部，受到荒魂、亡灵灾害的冲击较小，我们应该扩大其规模。"
 BAL_establishment_of_central_bank: "成立央行"
 BAL_establishment_of_central_bank_desc: "吉斯塔特的财富正在被外国的银行家掠夺，我们必须建立自己的银行、发行自己的货币。"
 BAL_stockpiling_precious_metals: "囤积贵金属"
 BAL_stockpiling_precious_metals_desc: "发行货币离不开贵金属的储备，但我们国狭民弱，这注定是一个漫长的过程。"
 BAL_stockpiling_precious_metals_tt: "获得§Y200§! £hcp_small的资金储备\n§g发行货币需要储备§Y1000§!£hcp_small（现在我们已经储备了§Y[?BAL.BAL_central_bank_ubs_save]§!£hcp_small）§!"
 BAL_central_bank_ubs_save_tt: "获得§Y200§! £hcp_small的贵金属储备"
 BAL_seeking_help_from_democratic_countries: "寻求民主国家帮助"
 BAL_seeking_help_from_democratic_countries_desc: "国际局势变化莫测，吉斯塔特作为民主国家，又处于对抗苏联的第一线，我们需要寻求其他“同类”的帮助，看看她们是否愿意为此出价。"
 BAL_seeking_help_from_communist_countries: "寻求红色国家帮助"
 BAL_seeking_help_from_communist_countries_desc: "对，我们不应该刺激我们的邻居——野心勃勃的苏联人在列宁格勒看着我们呐！我每天都能听到列宁格勒的共产主义广播，好啊，你愿意为我们掏腰包吗？"
 BAL_connecting_dec_with_water_transport: "贯通[FROM.GetName]到里加的水运"
 BAL_connecting_dec_with_water_transport_desc: "[FROM.GetName]地处道加瓦河畔，在我们疏浚水道、利用水力的计划下，把[FROM.GetName]与里加采用水运连接在一起，将可以让里加的工业辐射到当地，加块我们的建设速度。"
 BAL_allowing_Soviet_to_use_the_port_of_Klaipeda: "允许苏联使用克莱佩达港"
 BAL_allowing_Soviet_to_use_the_port_of_Klaipeda_desc: "苏联对波罗的海的港口垂涎若渴，我们当然不能把里加轻易开放给苏联人，那么南部荒凉的克莱佩达港就成为不二之选，苏联人想要通过这个港口进行货运就不得不帮助我们在此处建设一段铁路……何况我们也能在其中获得其他利益。"
 BAL_the_port_of_Klaipeda: "克莱佩达港使用权"

