#民族精神
 BAL_unyielding_regret: "不屈之怨" 
 BAL_unyielding_regret_desc: "吉斯塔特人在欧洲列强的铁蹄下挣扎着，她们的信仰被践踏，她们的文化被毁坏，她们被盘剥、被奴役……列强们的内讧让吉斯塔特人有了喘息之机，勇者们在夹缝中建立了独立的国家，她们发誓要重新树立自己的信仰，这是数百年来仅有一次的机会！"
 BAL_trade_dependent_on_SOV: "贸易依赖苏联" 
 BAL_trade_dependent_on_SOV_desc: "由于受到荒魂灾害的严重破坏和影响，以原材料出口为代表的波罗的海经济支柱产业在国际上的竞争力向来一般，但苏联对波罗的海产品表现出的某些“特殊偏好”让这些产业依然保持着一定的利润。不可否认，苏联虽然在抗击荒魂和灾后重建工作中对波罗的海提供了重大帮助，但也正是因为苏联事实上是沙皇和二月临时政府的继承者，波罗的海社会对经济发展中日益增加的对苏依赖越发感到不安。"
 BAL_chaotic_farmland: "畸形的农业管理"
 BAL_chaotic_farmland_desc: "荒魂灾害大大冲击了波罗的海旧有的土地资源集中于以官僚、教会、战姬、庄园主为代表的僧俗地主阶级和德裔民族、俄裔移民手中的局面，大部分重执念区更是成为了事实上的无主土地。如今，抗击荒魂灾害期间撂荒土地的所有权问题在各方势力反复拉扯下已经成为了困扰整个波罗的海社会的老大难问题，它的解决与否以及处理方式将直接决定这片苦难大地未来将要走上的道路。"
 BAL_broad_gauge_railway: "宽轨铁路"
 BAL_broad_gauge_railway_desc: "波罗的海如今的铁路系统继承自俄属时代，业已成为其经济发展的大动脉。但由于当地局势长期混乱，铁路保养状况岌岌可危，加之俄式宽轨铁路在进行跨国联运时极其低下的运输效率，现有的铁路系统已经不堪重负，完全不能满足波罗的海经济社会发展的需要。"
 BAL_shinto_rule: "神社统治"
 BAL_shinto_rule_desc: "大赦虽然领导了波罗的海的独立和荒魂灾害抗击工作，但对波罗的海上层建筑的制度设计和机构搭建方面长期存在严重欠缺，而且惯于以教团组织的运作模式来看待和处理日常的政治、经济和军事事务，“以教代政”的情况十分严重。随着荒魂灾害的逐渐退潮，波罗的海局势逐渐走向安定，社会上对建立健全行政架构的呼声也日趋高涨。"
 BAL_polluted_areas: "重执念区"
 BAL_polluted_areas_desc: "自荒魂灾害爆发以来，波罗的海地区的大片土地深受亡灵和荒魂的破坏与污染，这些区域被称为“重执念区”，它们中的大部分地区至今依然没有得到充分的净化、恢复与重建。这不仅严重威胁着当地及其附近地区居民的生命财产安全，更严重阻碍着波罗的海经济社会的进一步发展。"
