 BAL_climate_friendly_agriculture_desc: "波罗的海地区的农业依靠大赦神社祭祀神树调控气候，数十年以来风调雨顺，但是如果一旦离开神树，脆弱和粗放的农业埋藏的隐患就会立即暴露出来。"

