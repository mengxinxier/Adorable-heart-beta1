l_simp_chinese: 

 baltic_tree: "波罗的海国策树"

#国策

  BAL_plenary_session: "全体大会"
  BAL_plenary_session_desc: "光阴似箭，自波罗的海独立至今，已过近二十年矣，我国在政治架构、产业政策和外交方略等一系列的制度建设方面却依然相当混乱，政出多门、九龙治水的难题在各项领域仍然极为突出。在如今这个多事之秋，我们必须让政府内各方势力开诚布公地坐下来谈一谈，这将决定未来相当长一段时间内我国的发展道路。"
  BAL_split_defense: "拆分防人"
  BAL_split_defense_desc: "随着我国内外安全形势越来越复杂，尤其是在我国如今较为急迫的海空军建设需求上，作为独立战争中的中流砥柱和如今我军骨干力量却长期依赖陆军单兵种作战的防人已经不能适应时代发展的需要。我们应该将防人中的特殊人才用于充实海空军乃至警察队伍甚至政府，再对剩余的部分进行系统性的改革，力求“术业有专攻”，并进一步提高我军的战斗力。"
  BAL_religious_tax_issue: "宗教税问题"
  BAL_religious_tax_issue_desc: "作为秉持神篱信仰的教团组织，大赦力图让神篱信仰取代基督教在波罗的海的优势地位，在领导独立战争并最终胜利后，大赦更是将神篱信仰定为国教，并强硬打压以基督教各派为主的国内其他教派，大大加剧了社会矛盾。为了加强国内各教派的团结，我们或许可以劝说大赦以伊斯兰教政权曾普遍实行的“吉兹亚税”为蓝本，以向基督徒征收人头税的政策取代现行的宗教限制政策。"
  BAL_priestess_duties: "巫女的职责"
  BAL_priestess_duties_desc: "由大赦一手建立的巫女队伍扮演着相当复杂的角色。在基层，小到邻里解纷，大到教育、医疗和司法，巫女的工作可谓无所不包；在军队，巫女则在物质和精神等诸多方面充当着勇者和防人们的坚强后盾。巫女们的焚膏继晷为独立战争和抗击荒魂灾害的胜利立下了汗马功劳，但随着社会走向安定，巫女权责不清的问题必须解决，至少哪些巫女应该对应哪些职责的问题必须尽快解决。"
  BAL_hero_is_also_a_battle_maiden: "勇者也是战姬"
  BAL_hero_is_also_a_battle_maiden_desc: "作为在独立战争和荒魂灾害抗击工作中打出了赫赫威名的战斗英雄，勇者们在我国民间一直享有崇高声望。如今社会局势已经逐渐走向安定，勇者们也希望自己能够在战场以外的地方继续为祖国发光发热，我们便可以让她们参与地方军民事务的管理，尤其是要替长期镇守各地的战姬们分担一部分工作压力。"
  BAL_battle_maiden_is_hero: "战姬就是勇者"
  BAL_battle_maiden_is_hero_desc: "历史上长期镇守波罗的海地区的历任七大战姬客观上为促进驻地的经济社会发展做出了很大贡献，但为了波罗的海国家的独立与现代化进程，已经在当地形成了盘根错节的权利网络的战姬们需要将自己的才能更多发挥在整个国家的发展事业当中。为此，我们可以将战姬及其部众一并编入现役并接受统一指挥，让她们在不断磨合中完成从权利到心态上都从门户私计到国家公利的转变。"
  BAL_land_audit: "清查土地"
  BAL_land_audit_desc: "在复杂的历史条件下，我国如今的土地所有制相当混乱，尽快建立一套完善的土地制度的需要却比以往任何时候都更强烈。即便国内各方势力对解决土地问题提出的主张互相之间往往大相径庭甚至背道而驰，但尽快对当下的土地状况开展摸排和清查工作依然是所有人的共识。"
  BAL_population_statistics: "统计人口"
  BAL_population_statistics_desc: "人口作为一种重要的战略资源，一直在国家的发展进程中扮演着举足轻重的角色。为了更好地了解我国当下的人口素质和社会状况，为制定未来的发展战略提供支撑，我们需要以全面的人口普查来代替旧有的单薄的人口统计工作。"
  BAL_currency_preparation: "筹备货币"
  BAL_currency_preparation_desc: "在独立之初和荒魂灾害抗击工作中，为了保证经济形势最起码的稳定，我国继续使用俄国卢布作为法定货币，这也为日后的对苏联的双边贸易提供了很大方便，但是随着我国经济的逐渐恢复，保卫国家经济主权的需求越来越强，继续使用卢布已经不合时宜。我们应当废除卢布，代之以新的独立的货币体系。"
  BAL_hero_system_launch: "开放勇者系统"
  BAL_hero_system_launch_desc: "最后一次满开之后，神树的力量走向了枯竭，由其神力支撑的勇者系统也雄风不再。但也正因如此，我们得以将勇者系统的使用权限普及到中下层官兵，毕竟只有基层军人的战斗力提高了，一支军队的整体战斗力才会真正得到提高。"
  BAL_Riga_Bay_opening: "开放里加湾"
  BAL_Riga_Bay_opening_desc: "我国漫长的海岸线和特殊的区位优势为我国带来了独特的海运优势。通过进一步扩大里加湾各港口的规模与功能，我们可以从航运业开始，带动起里加乃至全国各行各业的发展势头。"
  BAL_path_to_modernization: "现代化之路"
  BAL_path_to_modernization_desc: "经过长期的政治架构、产业政策和外交方略等一系列方面的恢复与准备，为了成为能在世界舞台上占据一席之地的现代化国家，已经恢复了元气的波罗的海已经准备好迎接一切新征程上的困难与挑战，是时候一展拳脚了。"
  BAL_Shiratori_Utagano_plan: "白鸟歌野计划"
  BAL_Shiratori_Utagano_plan_desc: "在独立战争与抗击荒魂灾害的过程中，白鸟歌野在与大部队几乎失联的情况下和藤森水都一同率全城军民坚守孤城塔林前后长达二十年之久的壮举广为国人所传颂。然而正是这样一位传奇勇者，源自自幼对农业、农村和农民们的深切感情，于不断的实践过程中，在农业问题上也形成了自己的一套独到见解。所以关于国家未来发展方向的规划，白鸟歌野的意见和建议必然至关重要。"
  BAL_Shiratori_Utagano_plan_tt: "§Y白鸟歌野§!致力于发展农业以解放被束缚在土地上的劳动力，完成其分支国策将会有§Y额外人力§!的奖励。"
  BAL_Orga_Tamm_plan: "奥露嘉・塔姆计划"
  BAL_Orga_Tamm_plan_desc: "身为七大战姬之一的奥露嘉·塔姆早在儿时的游牧生活中就养成了热爱探险、勇往直前的宝贵品质并立下了“读万卷书，行万里路”的宏愿，她在接任战姬后便开始孤身一人云游四海，足迹遍布整个欧洲。而这次盛大的“战姬修行”也让欧洲各国经济社会的发展状况、尤其是现代化大工业体系的威力，都深深印在了她的脑海里。我们如今要直面未来，就需要塔姆小姐的阅历与品质。"
  BAL_Orga_Tamm_plan_tt: "§Y奥露嘉§!致力于发展教育和开发资源产业，完成其分支国策将会有§Y额外科研加成§!的奖励。"
  BAL_breaking_cottage_boundaries: "打破村舍界限"
  BAL_breaking_cottage_boundaries_desc: "农业生产在我国的经济地位十分重要，但国内的大半土地资源都由自耕农组成的村社和僧俗领主经营的庄园与坞堡所瓜分。我们需要将这些孤立的村社和庄园、坞堡有效地统筹起来，纳入国家统一制定的产业政策之下。"
  BAL_land_tax_reduction: "削减地税"
  BAL_land_tax_reduction_desc: "长期以来，尤其是在沙皇统治之下，由于管理模式过于粗放和混乱，以土地税为代表的各类竭泽而渔式的苛捐杂税让我国农民苦不堪言。为了尽快恢复和提高农业生产，我们必须将税收工作规范化，首当其冲的就是在我国农业活动中占重要地位的土地税。通过降低税率和指定征税工作细则等办法，我们可以大大改善土地税的征收工作。"
  BAL_talent_introduction: "引进人才"
  BAL_talent_introduction_desc: "我国自独立以来经济社会的快速发展带来了庞大的人才需求，这导致我们已经没有时间去等待教育重建与改革工作的完成了，所以我们当下应当加大人才引进的力度，即便不能提供像列强那样良好的物质条件，也绝对要营造出一个能让他们踏踏实实工作的环境。"
  BAL_education_reform: "教育改革"
  BAL_education_reform_desc: "在上次大战前夕，俄国沙皇出于巩固殖民统治的目的，在波罗的海境内修建了一些宗教和师范类院校，客观上为我国教育事业的现代化提供了起步的机会，但经过长期战乱，这些院校不论是师资力量还是研究条件都已经严重下滑。为此，我国将在发掘国内外人才的基础上重组并扩建各级各类院校的规模，以期最终形成世俗与宗教院校并行、常规与军警院校并行的多轨教育格局。"
  BAL_encouraging_large_farms: "鼓励大农场"
  BAL_encouraging_large_farms_desc: "如今，服务于商品生产且高度专业化和集约化的大型农场已经成为了苏联等农业大国的主流农业生产经营方式。在打破了我国原有的分散且凌乱的农业生产经营格局后，我们就可以仿效这些农业大国来构建属于我们自己的大农场经营体系，并通过集资分红等方式鼓励农民与领主们加入这项伟大的事业。"
  BAL_waterway_dredging: "疏浚水道"
  BAL_waterway_dredging_desc: "长期的战乱和动荡让我国的水利建设极大地倒退了，为了修复和重建遭到破坏的水利设施，防范次生灾害，也是为了促进新式大农场的建设，我们首先要做的就是疏浚各地壅塞的水库、河道和灌溉渠。"
  BAL_peat_mining: "开采泥炭"
  BAL_peat_mining_desc: "泥炭，又称“草炭”、“泥煤”，是煤炭的原始状态，主要由在沼泽形成的过程中沉积下来的昆虫和植物尸体等有机物构成，富含多样元素，用途也相当广泛。得益于中高纬度的地理区位和境内广布的沼泽，整体上缺乏可利用矿产资源的我国，却有着量大质优的泥炭资源。通过加大对泥炭的开采力度，我们不只可以以此拉动出口，更能为我国的能源和资源利用带来新的选项。"
  BAL_shale_oil_development: "开发页岩油"
  BAL_shale_oil_development_desc: "我国的矿产资源虽然总体匮乏，但其中已探明储量的油气资源仍可支撑我国现阶段的产业发展。我国爱斯兰地区有着丰富的页岩油储备，更占据我国油气资源储量的一半以上，故对当地页岩油的开发和利用，与我国诸多产业的健康发展直接挂钩。"
  BAL_unified_water_conservancy_construction: "统建水利设施"
  BAL_unified_water_conservancy_construction_desc: "事实上，我国水利工程的修复与重建工作的工作量级和难度超乎想象，是时候成立一个专门负责统筹与领导全国水利工程建设与维护情况的部门了。"
  BAL_soil_improvement_plan: "土壤改良计划"
  BAL_soil_improvement_plan_desc: "随着水利设施的不断修复、完善与新建，以及作为高效肥料原料和土壤改良利器的泥炭被广泛开采并投入使用，我们终于可以集中各领域一切可用的人力物力，一劳永逸地解决长期困扰我国经济社会发展的重执念区问题了。毫无疑问，改良后的沃土将会让我国的农业生产再创新高，更能为生息于大地之上的我国各族人民提供良好的生存环境。"
  BAL_central_port_development: "中心港口发展"
  BAL_central_port_development_desc: "通过加强维护工作和扩建港区规模，我们可以进一步提高里加等国内主要港口的吞吐量，从而满足被近来的人才引进和新型资源能源的开发利用活动进一步刺激了的航运需求。"
  BAL_chemical_university_establishment: "筹建化工大学"
  BAL_chemical_university_establishment_desc: "随着泥炭、页岩油等新型能源的大规模开发和利用，相关产业如雨后春笋般快速集聚起来，尤其是化学工业，更是一片欣欣向荣之景。蓬勃发展的化工产业同样进一步扩大了相关人才的需求，这就需要我们继续调拨人力物力，再成立一批相应的化工院校，为将化工产业打造成我国经济的新龙头、新名片进一步打好人才基础。"
  BAL_large_ranch_livestock: "大牧场畜牧"
  BAL_large_ranch_livestock_desc: "随着土壤改良工作的顺利开展和以大农场为代表的农业生产经营方式逐渐铺开，我国居民的基本粮食供给已经大体得到满足，这也使我们得以将下一步工作的重点放在肉蛋奶等副食的生产与经营工作上来。与大农场类似，我们同样可以以大农场为发展畜牧业的蓝本，打造具有集约化、机械化及管理科学化等特征且以商品生产为导向的大型牧场。"
  BAL_woodland_development: "林地开发"
  BAL_woodland_development_desc: "我国不仅森林覆盖率相当高，还保有大片部分良好地保持着原始自然状态下的生态系统的原始森林，这不仅为我国带来了壮美的自然风光，更是生物种类研究者的天堂。在基本解决了现有农牧工等产业用地的难利用问题之后，是时候将目光瞄向这些此前从未被大规模开发的森林了，但为了避免竭泽而渔，我们需要对森林的开发工作进行严格的统筹与规划。"
  BAL_Baltic_sea_fishery: "波罗的海渔业"
  BAL_Baltic_sea_fishery_desc: "随着港口等基础设施的改善和水土环境的净化，我国的渔业资源也快速恢复，渔业产值突飞猛进。通过成立规模化的渔业企业和相应的统筹与监管机构，我们不仅可以轻松将各类水产海鲜送上我国人民的餐桌，更可以为我国海洋甚至深海资源的进一步开发利用打下坚实的基础。"
  BAL_excellent_light_industry: "卓越轻工业"
  BAL_excellent_light_industry_desc: "由于矿产资源总体较为匮乏，门类也不甚齐全，我国很难像苏联那样进行大规模的重工业投资。但得益于农、牧、林、渔等产业的快速恢复和发展，我国完全有条件发展出门类较为齐全的轻工业，这对提高我国居民生活水平和参与国际产业分工协作都具有重要意义。"
  BAL_railway_gauging_plan: "铁路换轨计划"
  BAL_railway_gauging_plan_desc: "俄式宽轨铁路既降低了运输效率，也大大加深了我国与苏联的经济绑定。为了摆脱对苏联经济的依赖，在铁路系统的重建与维护工作中，我们需要收紧轨距，尽可能提高对中西欧各国的联运效率。"
  BAL_consumer_goods_export: "消费品出口"
  BAL_consumer_goods_export_desc: "随着我国经济社会逐渐走出战乱的阴霾、尤其是农、牧、林、渔等产业走向复苏，我国以食品为主的消费品产量节节攀升，并通过新扩建的公路、铁路和港口系统销往欧洲乃至世界各地。以食品为主的消费品出口不仅为我国带来了大量财政收入，也让我国基本摆脱了独立之初以原材料出口为主的尴尬经济形势，开始向产业链的更高位置爬升。"
  BAL_electrification_construction: "电气化建设"
  BAL_electrification_construction_desc: "新的产业革命发生以来，电力成为了继化石能源之后能源界新的弄潮儿，电气化也成为了产业升级的新标杆。而我国要完成大力发展轻工业的产业战略，就必须将电力广泛应用、推广和普及到我国居民生活和国民经济的各个领域，让电力转换后的光能、热能和动能在强国富民的道路上发挥更大、更加积极的作用。"
  BAL_large_scale_steel_investment: "大规模投资炼钢"
  BAL_large_scale_steel_investment_desc: "钢铁是现代社会的物质基础，作为极其重要的基础工业部门，钢铁工业不只是衡量一个国家工业化水平的标志，更是发展国民经济与国防建设的根基。不论从任何方面来讲，今天的我们都找不到不去大力发展钢铁工业的理由，那就让我们从最简单的炼钢开始吧。"
  BAL_technical_production_line_import: "技术产线进口"
  BAL_technical_production_line_import_desc: "为了提高我国经济的竞争能力，我们就需要不断攻克新的技术难题，而为了加快追赶国际先进技术水平，我们可以通过进口国外的先进技术产线，这样不仅利于逆向研发，还可以在短期内提高我国商品的质量。"
  BAL_shale_oil_development_reinforcement: "页岩油开发再强化"
  BAL_shale_oil_development_reinforcement_desc: "经过不懈努力，爱斯兰当地的页岩油开发利用工作仍在稳步推行，但快速发展的相关产业也催促着我们继续深挖这种新型能源新的利用价值，尤其是页岩油中所富含的硫、氮、氧化成分，可以极大缓解我国新兴化工产业的原材料紧张问题。"
  BAL_hydroelectric_plan: "水电计划"
  BAL_hydroelectric_plan_desc: "电气化的建设事业不是一蹴而就的，它不仅要求我们发电能力的强大，还要求我们不断摸索更加多样化的电力来源。此前的苦心经营让我国水利工程的规模已经超过了历史峰值，我们建设水电站时可以利用这些水利设施的建设经验。"
  BAL_mechanical_industry_plan: "机械工业计划"
  BAL_mechanical_industry_plan_desc: "机械工业是工业化的必然产物，工业化的发展必然催生机器本身的生产革命。在确定轻工业优先的发展战略之后，我国如今虽然各门类、尤其是食品工业的产量都很大提升，但很多生产设备依然依赖进口。为了我国的经济安全和生产能力的提高，我们必须加快制定机械工业的发展计划。"
  BAL_heavy_equipment_manufacturing: "重型装备制造"
  BAL_heavy_equipment_manufacturing_desc: "钢铁工业和机械制造业的起步，为我国进一步投资重型装备的制造奠定了基础，这不仅对我国经济结构的调整和改善具有很大意义，更对我国的国防建设大有裨益。"

