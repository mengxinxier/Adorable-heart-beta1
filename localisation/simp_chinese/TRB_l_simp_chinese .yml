 #政党名称
  TRB_communism_party:0 "§R已查禁§!"
  TRB_communism_party_long: "人偶解放阵线等激进团体\n§W--------------------------------§!\n§L《铁路人偶特别法》并没有消除对铁路人偶的歧视，人偶在多数情况下被视为财产，也很少拥有被选举权和选举权，激进的斗争也自然没有消停过。§!\n"
  TRB_democratic_party:0 "民主党"
  TRB_democratic_party_long: "海尔维第亚民主党\n§W--------------------------------§!\n§L民主党历史悠久，是联邦成立之时组建的第一批政党。民主党秉持着保卫海尔维第亚自然环境的立场，在议会中屡次反对空凝机工厂扩产§!\n"
  TRB_fascism_party:0 "§R已查禁§!"
  TRB_fascism_party_long: "海尔维第亚人民党\n§W--------------------------------§!\n§L人民党组建已有数十年，然而自联邦议会通过议案取缔激进团体后便宣布他们为非法政党，随之而来的大抓捕使其损失惨重。\n如今只剩下小部分缩在地下的成员以及一个流亡维也纳的中央委员会，时不时收点马克发表一些文章来攻击联邦。\n"
  TRB_neutrality_party:0 "自由党"
  TRB_neutrality_party_long: "海尔维第亚自由党\n§W--------------------------------§!\n§L自由党的成员主要来自隈元县，不少党员受到隈元银行的直接支持，因此在议会中支持空凝机工厂扩产。\n"
  TRB_Liberation_Front_Ban: "§R已查禁§!"
  TRB_Liberation_Front_party_long: "海尔维第亚解放委员会\n§W--------------------------------§!\n§L战胜联邦军后，由铁路人偶解放阵线和海尔维第亚工人党等左翼团体组建了解放委员会，解放委员会的宗旨是铲除麦克阿荧白色恐怖以及建设社会主义的海尔维第亚§!\n"
  TRB_Liberation_Front_party: "解放委员会"
  TRB_Army_gov_party: "军政府"
  TRB_Army_gov_party_long: "海尔维第亚联邦军政府\n§W--------------------------------§!\n§L在起兵出发镇压暴动后，麦克阿荧宣布暂停国会并任命自己为军政领袖§!\n"
  TRB_fascism_party_long_back: "海尔维第亚人民党\n§W--------------------------------§!\n§L在革命胜利后，为彰显与前政府截然不同的民主面貌，人民党的禁令也被随之解除，中央委员会总算重归国都。§!\n"
  TRB_fascism_party_back: "人民党"

