 #事件-普通
  RJE.5.t:0 "紧急会议"
  RJE.5.d:0 "由帝临时召开的紧急会议正式开始，有人主张消灭地球人并与戴比路克合作，还有人主张和平相处，力求回到本位面。\n\n海军代表东乡毂表示与地球人开战不是明智的选择，因为还尚未熟悉这个地球。\n\n陆军代表山下利古里表示陆军已经准备完成。只需帝一声令下便可轻松拿下整个樱花国。\n\n最后帝下达了新年的第一道命令:"
  RJE.5.a:0 "落樱行动"
  RJE.5.b:0 "寻求共处"

  RJE.2.t:0 "政府迁往朝鲜"
  RJE.2.d:0 "我们的军队在樱花岛大溃败了，军队不得不撤到朝鲜，组建流亡政府"
  RJE.2.a:0 "我们一定会回来的"

  RJE.3.t:0 "樱花政府迁往朝鲜"
  RJE.3.d:0 "樱花政府匆匆忙忙将军队撤退到了朝鲜，因为隔海相望的原因，我们无法进攻她们！\n\n不过我们也缴获了一部分的樱花舰娘，她们将对我们的海军有极大的帮助"
  RJE.3.a:0 "总有一天我们会登上朝鲜......"

  RJE.4.t:0 "真日本帝国索取九州与四国"
  RJE.4.d:0 "樱花政府向我们索取九州与四国两岛，并宣称她们是樱花政府的合法继承者，租借的时间也确实到了，我们是否应该将岛屿还给真日本帝国？但是我们为什么要承认一个外星人政府？"
  RJE.4.a:0 "我们同意归还并承认真日本为樱花合法政权"
  RJE.4.b:0 "我们拒绝承认真日本为樱花合法政权，并且将代管两岛直至樱花政府归来"

  RJE.1.t:0 "本军所到之处，民众竭诚欢迎"
  RJE.1.d:0 "我们的军队得到了樱花民众的欢迎，似乎樱花本土民众都希望我们推翻樱花的英灵政府。\n\n军队行至关西，我们遇到一部分樱花共产党和樱花的地方武装，她们在了解我们的世界日本化计划之后，表示愿意暂时加入我们！"
  RJE.1.a:0 "太好了"

  RJE.6.t:0 "海的那边-樱花流亡政府"
  RJE.6.d:0 "樱花政府逃亡到了自己的殖民地-朝鲜，因为此前海军的原因，我们无法登陆她们，但是时代变了，我们的地球海军已经建成！我们将进攻朝鲜！\n\n当然，我们的太空“海军”会提供一些帮助——她们会空降一些部队来扰乱她们的后方！"
  RJE.6.a:0 "我们的军队已经准备好了！"

  RJE.7.t:0 "超日本帝国索取符拉迪沃斯托克与哈巴罗夫斯克"
  RJE.7.d:0 "超日本帝国向我们发出了书面索取，她们似乎希望将樱花海巩固为自己的内海，现在我们正在作战，如果不将此地割让给她们，那么我们将可能会两面作战......"
  RJE.7.a:0 "我们可不想在远东开战......"
  RJE.7.b:0 "有本事自己用武力来取！"

  RJE.8.t:0 "冲田总司被俘"
  RJE.8.d:0 "我们的军队冲进了朝鲜首府汉城，但是冲田总司等政府高官早已沿着规划好的路线逃跑了，但是她们的计划早已被我们的东乡毅元帅发现，我们的军队不费吹灰之力便在神州边境百米出逮捕了她们，现在我们可以想想这么处置她们....."
  RJE.8.a:0 "好！"

  RJE.9.t:0 "苏联拒绝将地区交给我们"
  RJE.9.d:0 "苏联回函通知我们拒绝将俩地区交给我们，并发函挑衅我们，东乡毅建议直接对苏联宣战，陆军代表也对此表示同意，帝的态度是......"
  RJE.9.a:0 "对苏联宣战"
  RJE.9.b:0 "以和为贵"

  RJE.10.t:0 "苏联同意将地区交给我们"
  RJE.10.d:0 "苏联回函通知我们同意将俩地区交给我们，苏联军队撤出了这两个地区，我们将与她们签订互不侵犯条约来保障我们之间的和平"
  RJE.10.a:0 "好耶"


 #事件-养成
  RJE_prisoner.1.t:0 "安抚冲田总司"
  RJE_prisoner.1.d:0 "我们应该如何安抚这位被我们打败的英灵呢？"
  RJE_prisoner.1.a:0 "甜食"
  RJE_prisoner.1.b:0 "钱钱"
  RJE_prisoner.1.c:0 "让织田信长去安抚一些吧"
  RJE_prisoner.1.e:0 "无所谓，我会出手"

  RJE_prisoner.2.t:0 "你被冲田揍了"
  RJE_prisoner.2.d:0 "你试图强上冲田总司，但人家是英灵啊，你这体能在她面前就是废物啊，她直接揍了你一顿。\n\nBaka!我都没有隐藏你点进来是不是有点找死，你觉得这可能是答案吗？！"
  RJE_prisoner.2.a:0 "淦！"

  RJE_prisoner.3.t:0 "无用的尝试"
  RJE_prisoner.3.d:0 "终于我们抓住了冲田总司，哼！她不知道给我们带来了多少的伤亡与苦难！但她的能力确实有目共睹，我们虽然已经软禁了她，但我们并不了解她，到底应该怎么样才能让她服软呢？我们先试试我们一贯的金钱攻势吧。\n\n最后，她对你送的东西没有一点兴趣"
  RJE_prisoner.3.a:0 "年轻人不要太气盛"

  RJE_prisoner.4.t:0 "对甜食的反应"
  RJE_prisoner.4.d.talk:0 "在信长出来之后，我们再一次准备了数种精致的甜品，并安排了我们的外交部长亲自送入其中。这次冲田总司似乎不在忍耐，她邀请我们的外交部长对面而坐，两人一边分享甜食，一边在交流着些什么。看来冲田总司已经有些动摇，她不再打算以强硬的态度面对我们。只要双方能够很好的交流，或许我们将不再是对立的两侧。"
  RJE_prisoner.4.d.notalk:0 "我们从樱花国的其他政府人员那里得知，冲田总司似乎很喜欢甜食。针对十分强硬的冲田总司，我们打算用美食诱惑她。因此我们这次特意在樱花国内找了数位高级甜点师，精心设计并制作了数种甜品。然而出乎我们意料的是，当我们将这些送至软禁她的房间之中时，虽然她似乎很喜欢我们送去的甜食，但仍然保持着十分强大的自制力。或许我们应该想想其他的办法，简单的甜食攻略似乎并不能收买这位强大的英灵。"
  RJE_prisoner.4.a.talk:0 "好累"
  RJE_prisoner.4.a.notalk:0 "谢谢你，信长"

  RJE_prisoner.5.t:0 "信长的劝说"
  RJE_prisoner.5.d:0 "“哟~这并不是樱花国大总统嘛”\n“哼！你这个国家的叛徒。”\n“叛徒不叛徒，对我来说无所谓了。总之，只要是他们能对我樱花人民好，也不是不能接受。”信长靠在门边盯着背对着她的总司说到，“我们隔壁那个大国啊，有一部小说，我最近看了看，感觉还不错要不要给你看看啊~”说着信长从身后掏出一本《水浒传》，轻轻一丢，十分精准的落在了总司身旁的矮桌上，“当你真正体现自身价值时，接受招安也没什么不好的。”\n“………………”总司沉默许久，伸手拿起了那本书，“这种小说我早就看过了，但受招安也不一定就有好的下场………………”总司挥了挥手中的书，“我想和他们好好谈谈。”\n“或许我们应该先好好谈谈。”信长反手关上了房门，走上案榻，正坐在总司对面，“好久不见，总司…………”"
  RJE_prisoner.5.a:0 "果然派信长过去好多了"

  RJE_prisoner.6.t:0 "魔力洗脑"
  RJE_prisoner.6.d:0 "“你们要带我去哪里！”\n“嘿~~~到了你就知道了。”左边的守卫俏皮的说到。\n“不要和犯人说话。”后边的守卫用很严肃的声音制止了她。\n两位穿着女仆装的守卫押着冲田总司穿过一个黑暗而又漫长的走道，来到尽头的铁门前。\n“主人，人已经带来了。”\n“好……”里面传来一位听上去挺年轻但似乎又疲惫不堪的女声。\n滴……滴……滴……噗呲…………\n厚重的大门伴随着白色的蒸汽逐渐打开，里面缺没有看到有人的存在，只是在一个房间中央有一张科技感十足的椅子。\n两位女仆将总司按在椅子上，将她的四肢固定在椅子上的铁质金属环中。\n“啊！！！你们不能这么对我！！！人体实验是不人道的行为！！！”\n铁门随着蒸汽慢慢合上，里面的声音逐渐被隔绝开来。\n没过多久，铁门再次打开，但里面鸦雀无声，在朦胧的蒸汽中，有一位似乎也穿着女仆装的人影跪在地上，同时传来机械且毫无感情的声音。\n“主人，遵从您的意愿。”"
  RJE_prisoner.6.a:0 "魔力可以解决一切"

 #新闻事件
  news.1062.t:0 "$news_event_background$樱花岛统一战争"
  news.1062.desc:0 "名为真日本帝国的势力便跨过了北日本线，向着樱花政府首都东京进发，樱花岛统一战争开始了。\n\n据樱花国爆料，真日本帝国似乎和戴布路克一样是来自外太空的势力，但并不属于这个宇宙。\n\n目前胜负还不好判断，这些外星人与戴比路克人不同，她们似乎很熟悉地球的陆军科技，樱花国将面临一场苦战。"
  news.1062.a:0 "新的外星人？"
  news.1062.b:0 "我们会统一樱花岛！"

  news.1063.t:0 "$news_event_background$超日本帝国成立"
  news.1063.desc:0 "近日，真日本帝国宣布改名为超日本帝国，不同国家对此表现态度不同，圣杯同盟成员均对这个新国表现出了不屑，部分国家呼吁应该阻止第二个外星势力在地球进一步的扩张\n\n不管怎么说，樱花国政府已经消亡在了历史的长河中，冲田总司和天皇玲也已经被超日本帝国逮捕，超日本帝国的下一步似乎并没有人知道，但是明确的是，远东的一个新兴势力已经兴起"
  news.1063.a:0 "谁会去关心樱花？"
  news.1063.b:0 "这是我们统一地球的开始！"


  








 TRB_focus_History_1: "矢志不渝"
 TRB_focus_History_1_desc: "波莱特总理继承亡父的遗志，成为了反对空凝机落户的领军人物。"
 TRB_focus_History_2: "成立御一夜铁道"
 TRB_focus_History_2_desc: "作为复兴铁路的第一步，波莱特成立了御一夜铁路股份有限公司。"
 TRB_focus_History_3: "翻新KiHa07s"
 TRB_focus_History_3_desc: "御一夜铁道目前唯一拥有的机车为KiHa07s，曾经是矿山铁路的柴油客车，我们将对她进行一系列改造，让其具备运营能力。"
 TRB_focus_History_4: "人偶人权修正案"
 TRB_focus_History_4_desc: "铁路人偶在现行的法律中几乎被视为个人财产，我们要推动御一夜对铁路人偶人权之重视。尽管暂时做不到完全的赋予铁路人偶人权，但我们可以先通过一项修正案。"
 TRB_focus_History_5: "汤医线试运营"
 TRB_focus_History_5_desc: "御一夜近郊的一所学校位于汤医，从温泉站到汤医站的路线有不少人员来往，作为我们的第一条路线可以说是十分甚至九分的合适。"
 TRB_focus_History_6: "赞助隈河漂流"
 TRB_focus_History_6_desc: "隈河漂流，在夏季一般是在从汤医到御一夜，而在冬季水位下降，则多是从御一夜到渡利之间航行。在御一夜与铁路的种种纠葛中衰退的背景下，隈河漂流的客源也难免受其影响。员工人数也从巅峰时期的过百人，缩减至如今只有老板的女儿和她朋友两人的程度。\n我们应该对漂流业拨款，争取恢复以往的辉煌。"
 TRB_focus_History_7: "装修铁路商店"
 TRB_focus_History_7_desc: "大废线后，御一夜站随之沉寂。从前帝国铁路那里接手线路的御一夜铁路股份公司在此建立了一间雅致的铁路商店，作为公司总部与旅游指南中心。可惜御一夜的市民们却只当这里是售票处而已。"
 TRB_focus_History_8: "限制政治献金"
 TRB_focus_History_8_desc: "隈元银行似乎在大量的赞助支持空凝机落户的政府人员，我们要尽可能的限制他们的影响力。"
 TRB_focus_History_9: "准备下一次大选"
 TRB_focus_History_9_desc: "波莱特的任期就快到了，为了不让空凝机落户支持人士当选，我们要确保波莱特于下次大选中胜利。"
 TRB_focus_1936_openning: "1936大选"
 TRB_focus_1936_openning_desc: "无论是支持空凝机落户的人还是反对的人，最终都要于大选之中表达自己的诉求，总而言之，御一夜的走向就将在这次大选中决出。"

 #事件
 TRB_Openning.001.t: "经济危机！"
 TRB_Openning.001.d: "由于我们政府过去多年以来的出口型经济，经济危机严重影响了我国。"
 TRB_Openning.001.a: "完蛋……"

 TRB_Openning.002.t: "议会提案：即刻通过大建计划"
 TRB_Openning.002.d: "议会今日再度发起了有关空凝机工厂大规模扩建的提案，波莱特总理一如既往的拒绝了该提案。但总理显然忘记了一件事：如果不解决当前的危机，那么即使全民主党都力挺她，最终也无法在议会中达成多数了。"
 TRB_Openning.002.a: "空凝机工厂是什么？"
 TRB_Openning.002.b: "真是不妙啊"

 TRB_Openning.003.t: "空凝机与空凝机工厂"
 TRB_Openning.003.d: "空凝机是一种非常清洁的能源引擎：几乎只需要空气就能进行反应产生动能，完全是人们想象中的环保引擎。\n但空凝机工厂则不然，空凝机工厂会产生远超其他工厂的污染，而全联邦有不少支柱产业都依靠自然，如西部的酒业帝国右田一酒厂和依托隈河的旅游业等等，因此以波莱特为首的民主党极力反对扩大空凝机工厂的厂区。\n\n当然，在反对的同时，波莱特也在寻求发展联邦的方法，但暂时没有什么大成果。\n隈元县当地的实业家则全力支持着工厂扩产，他们认为只有这条路才能富国。"
 TRB_Openning.003.a: "……环保派大战实业家？"

 TRB_Openning.004.t: "议会发起不信任投票"
 TRB_Openning.004.d: "鉴于波莱特总理任期内几乎没什么作为，如今发生了经济危机也依旧拒绝有利于经济的法案，并且作为总理还经常分时间去她自己开的“御一夜铁道公司”的“汤医线铁路”进行什么“运转作业”，简单来说就是莫名其妙每天都要跑去当火车司机，议会终于忍无可忍。\n今天，议会发起了针对波莱特总理的不信任投票，并且迅速获得了过半数的支持，依照宪法，当在数日内解散当前议会并重新选举。"
 TRB_Openning.004.a: "不好……"

 TRB_Openning.005.t: "议会选举：没有多数派？！"
 TRB_Openning.005.d: "议会经过重新选举……根本没选出多数派……支持率最多的两个党派分别为民主党和人民党，民主党一贯反对空凝机扩产，人民党则支持空凝机落户御一夜，两党完全不愿意和对方组成联合，联邦政府事实上已经陷入了停摆。"
 TRB_Openning.005.a: "额……那要怎么办"

 TRB_Openning.006.t: "术仙煤矿坍塌"
 TRB_Openning.006.d: "因大废线的缘故，全联邦各地的铁路基本停运，各类运输全靠车辆和飞机，由于无法运输大宗货物，许多工厂都不得不就近寻找原材料开采，而术仙煤矿则是各矿区中最危险的那个：联邦的大多数飞机都采用空凝机引擎，但不知为何空凝机一进入术仙地区就会失效，若发生事故无法第一时间进行救援。\n\n然而担心的还是发生了，我们今天得到消息，术仙煤矿发生了坍塌，伤亡正在统计，但最难办的是我们目前无法向术仙运输物资，停摆的政府也完全没有精力应对。"
 TRB_Openning.006.a: "天呐……"

 TRB_Openning.007.t: "御一夜暴动"
 TRB_Openning.007.d: "持续的停摆和煤矿的悲剧激起了民众的愤怒，铁路人偶们和民众在御一夜市一同发起了要求修复铁路线以及重新开行火车线路的游行，局势已然完全失控。加上由于政府停摆，许多地方的治安恶化，据说某些街道甚至组织起了准军事组织来保卫治安。"
 TRB_Openning.007.a: "真的是保卫治安吗……"

 TRB_Openning.008.t: "派遣军队？！"
 TRB_Openning.008.d: "不能再这样下去了！联邦国防军已经受够了这些破事，国防军统帅麦克阿荧近日宣布，为保卫联邦民主，联邦即刻进入国家紧急状态，冻结宪法中国会的各项权力并组建临时军政府并镇压各地的暴动，在确保治安后方可重开国会。"
 TRB_Openning.008.a: "……何意味"

 TRB_Openning.009.t: "御一夜巷战"
 TRB_Openning.009.d: "联邦军队迅速前往了暴乱的集结地：御一夜市。而另一边，御一夜的铁路人偶们早就组起了一个通讯网络（铁路人偶之间可以通过共鸣来传递信息），因此早在联邦军队到达前就筑好了街垒。\n\n铁路人偶拥有远超常人的力量和强度，在战斗中有极大的优势，但除少量的铁路人偶外，其他仓促组织起来的民兵完全比不过正规的国防军。\n\n在经过了一段时间的战斗后……"
 TRB_Openning.009.a: "铁路人偶和民兵战胜了国防军！"
 TRB_Openning.009.b: "国防军镇压了暴动！"

 TRB_Openning.010.t: "国家重建……"
 TRB_Openning.010.d: "在镇压了暴动之后，麦克阿荧将军认为要重建联邦的民主制度还需要不短的时间，在联邦恢复民主之前，应该由她任临时总统以保卫国家。"
 TRB_Openning.010.a: "显然没办法反对"

 TRB_Openning.011.t: "崭新国家的建设"
 TRB_Openning.011.d: "铁路人偶与民兵在御一夜的关键一战击溃了联邦国防军，随后组织了海尔维第亚解放委员会，在短时间内席卷了全国。\n\n今天，国防军正式向解放委员会投降，麦克阿荧不知去向。委员会颁布了临时约法，并宣布将在时机成熟后召开代表大会以确定宪法。"
 TRB_Openning.011.a: "不是她人呢？"


 #新闻
 TRB_news.001.t: "$news_event_background$[TRB.GetName]宪政危机"
 TRB_news.001.d: "从[TRB.Capital.GetCapitalVictoryPointName]传来了难以置信的消息：在最近的一次选举中，[TRB.GetName]国会没有选出多数派，票数最多的两个党派因对空凝机工厂是否扩建一事互相攻伐，联邦政府实质上已濒临崩溃。"
 TRB_news.001.a: "所以空凝机是什么？"
 TRB_news.001.b: "这并不好笑……"

 TRB_news.002.t: "$news_event_background$麦克阿荧将军凯旋"
 TRB_news.002.d: "[TRB.Capital.GetCapitalVictoryPointName]传来了新的消息，自联邦崩溃以来，麦克阿荧元帅便调遣军队镇压暴动，如今荧元帅在成功镇压之后宣布[TRB.GetName]的国家紧急状态仍将持续一段时间，直到政府有能力再次建立民主。"
 TRB_news.002.a: "毫无疑问，是独裁者。"
 TRB_news.002.b: "麦克阿荧将军万岁！"

 TRB_news.003.t: "$news_event_background$$TRB$解放委员会胜利"
 TRB_news.003.d: "[TRB.Capital.GetCapitalVictoryPointName]的乱象和麦克阿荧的镇压最终激起了全联邦的愤怒，而麦克阿荧的镇压攻势以失败告终，随后$TRB$解放委员会应运而生，迅速席卷了全国。\n今天[TRB.Capital.GetCapitalVictoryPointName]当局宣布废除以前联邦宣布的紧急状态和不平等的铁路人偶特别法，宣告要建立一个人和铁路人偶平等的社会主义国家。"
 TRB_news.003.a: "欧洲革命再进一步！"
 TRB_news.003.b: "所以那个“大元帅”是浪得虚名？"
