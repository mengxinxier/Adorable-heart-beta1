 #政党名称
  TRB_communism_party:0 "§R已查禁§!"
  TRB_communism_party_long: "人偶解放阵线等左翼团体\n§W--------------------------------§!\n§L《铁路人偶特别法》并没有消除对铁路人偶的歧视，激进的斗争也自然没有消停过。\n\n如今，解放阵线正在地下联系各类激进团体，时刻等待着推翻荧政权的大好时机。§!\n"
  TRB_democratic_party:0 "国社党"
  TRB_democratic_party_long: "御一夜国家社会党\n§W--------------------------------§!\n§L国社党虽名由国家社会主义而来，然而自荧为凸显“训政”之合法性将其立为除国党外的唯一合法政党之后，大多不认同国民党的党外民主人士通过加入国社党进入政坛。\n\n在最新的一届党大会中，国社党已经确立了中间偏左的社会民主主义立场，并时刻等待着机会的到来。§!\n"
  TRB_fascism_party:0 "§R已查禁§!"
  TRB_fascism_party_long: "御一夜人民党\n§W--------------------------------§!\n§L人民党早在帝国末期就已存在，然而荧在夺取政权后便宣布他们为非法政党，随之而来的大抓捕使其损失惨重。\n如今只剩下小部分缩在地下的成员以及一个流亡维也纳的中央委员会，时不时收点马克发表一些文章来攻击荧。\n\n§Y但假以时日，若国民政府之治无法维持，他们总会有归国的一天§!§!\n"
  TRB_neutrality_party:0 "国民党-中执委"
  TRB_neutrality_party_long: "御一夜国民党中央执行委员会\n§W--------------------------------§!\n§L依照临时约法，训政时期由御一夜国民党全国代表大会代表国民大会行使中央统治权。御一夜国民党全国代表大会闭会时，其职权由御一夜国民党中央执行委员会行使之。\n\n至于宪政，荧和他的党认为，训政时期也许还要延续数年，国民方才具备宪政之能力。§!\n"
  TRB_Liberation_Front_Ban: "§R已查禁§!"
  TRB_Liberation_Front_party_long: "御一夜解放阵线\n§W--------------------------------§!\n§L经济危机后，各左翼团体们认为时机已到，各方人马最终在协调下组建了解放阵线，准备放手一搏以求解放。§!\n"
  TRB_Liberation_Front_party: "解放阵线"
  TRB_Provisional_Congress_party: "临时国会"
  TRB_Provisional_Congress_party_long: "御一夜临时政府国会\n§W--------------------------------§!\n§L在内战中获胜后，御一夜的各方人士成立了临时政府并选举临时总统，这将会只是一个过渡时期，真正的共和将在真正实现民主之国会实现。§!\n"
  TRB_fascism_party_long_back: "御一夜人民党\n§W--------------------------------§!\n§L在革命胜利后，为彰显与前政府截然不同的民主面貌，人民党的禁令也被随之解除，中央委员会总算重归国都。§!\n"
  TRB_fascism_party_back: "人民党"
  TRB_SheMin_party: "社民党"
  TRB_SheMin_party_long: "御一夜社会民主主义党\n§W--------------------------------§!\n§L社民党由前国社党改组而来，在国府统治时期，大多不认同国民党的党外民主人士通过加入国社党进入政坛，因此该党继承了相当大的一份政治资产。§!\n"
  TRB_rail_lord_CuJinHui_party: "铁促会"
  TRB_rail_lord_CuJinHui_party_long: "铁路人偶人权促进会\n§W--------------------------------§!\n§L在荧政权倒台后，解放阵线随之解散，西瓜自知无法胜过社民党人，将人偶解放阵线更名为铁路人偶人权促进会，稳坐国会内的左翼激进派之位。§!\n"
  ELP_communism_party:0 "奥地利共产党"
  ELP_democratic_party:0 "蒂罗尔民主党"
  ELP_fascism_party:0 "火车国帝国派"
  ELP_neutrality_party:0 "埃尔施塔特王室"
   
