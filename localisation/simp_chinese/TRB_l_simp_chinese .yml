 TRB_Openning.001.t: "会客室的辩论"
 TRB_Openning.001.d: "总统府的会客室朝西，窗外是御一夜地区连绵的山脊线，入秋之后积雪已经压到了半山腰。\n波莱特将那份合作提案放到了茶几上，连同它一起摆上桌的还有一杯已经凉透的红茶。\n宝生稀咲只扫了一眼，便把目光放回了波莱特身上。\n\n“总统阁下，”她的语气比那杯红茶还要凉，“御一夜有多少铁路还在运营？\n一条。就是您自己掏钱撑着的汤医线，还得绕进那片废矿里头跑，\n因为偏偏只有那种地方，空凝机才飞不起来。”\n\n波莱特想开口，稀咲已经站起了身。\n\n“术仙煤矿的磁场是个特例，全御一夜就那么一块地方。\n您拿一条钻废矿缝里的小铁路来告诉我铁路有未来，\n这说服不了任何人，总统阁下。”\n她走向窗边，目光落在远处山脊上那道被大雪压白的轮廓上，\n声音平静了一些，却更像是最终的裁决：\n“空凝机不需要路基，不需要维护里程，不需要在每一个冬天\n祈祷大雪别太厚、废矿底下别再渗水。\n能耗比的数据经过了严格的独立核算，这不是概念，是账本。\n御一夜的未来不在铁轨上，总统阁下，它在天上。”\n\n她没有取走那份提案，也没有喝那杯红茶。\n门在身后带上时发出了一声轻响，像是某种论断的句号。\n会客室里只剩下窗外山风偶尔拍打玻璃的声音，\n和茶几上那杯谁都没有碰完的、已经彻底凉透的红茶。\n\n三天后，宝生稀咲以独立候选人身份正式宣布参选，\n竞选纲领的核心只有一条：空凝机制造厂落户御一夜。\n至于她背后站着谁，御一夜的报纸各有各的说法，\n没有一家敢写得太明白，但也没有一家真的装作不知道。\n\n选举的帷幕，就这样在一间安静的会客室里，悄悄拉开了。"
 TRB_Openning.001.a: "我想局势已经无可避免了？"
TRB_Openning.002.t: "右田双铁归来"
 TRB_Openning.002.d: "\n“navi，还有多久到御一夜？”\n“十分钟左右，双铁少爷。”\n\n右田 双铁，在听闻御一夜打算引进空凝机工厂后，为了保卫家乡的景色，回到了已阔别六年的故乡。\n空凝机，全称为空凝机引擎，无论是在水上游的，地上跑的，天上飞的，用空凝机引擎的载具都被统一简称为空凝机， 空凝机引擎利用磁场和太阳的光芒为能源，能耗比把其他化石能源引擎远远甩于身后。\n但空凝机强大的能量的背后，却是让人难以接受的：御一夜的隈河曾以水源地和观光圣地闻名，当地的酒业更是享誉全国，空凝机工厂则产生大量的污染，如果在此地建设空凝机工厂，那么一切美好都将不复存在。（至少右田当地人大部分都这么认为。）\n\n抵达家中后，双铁因为妹妹日日姬已经长大成人，没法像以前一样睡上下铺，姐姐真闇表示可以把祖父的房间整理出来，在整理的途中唤醒了沉睡的铁路人偶——八六。\n八六表示虽然发条能给她提供一点能源，但作为蒸汽机车的铁路人偶，她需要的燃料是煤炭和水。\n真闇表示废弃的术仙煤矿那边应该能碰运气找到煤炭，于是双铁提议坐空凝机前往，但不知为何八六似乎异常抗拒搭乘空凝机。\n\n“我绝对不会坐的，那个东西可是——”"
 TRB_Openning.002.a: "“我们的宿敌！”"
TRB_Openning.003.t: "八六与navi"
 TRB_Openning.003.d: "在空凝机上，八六给双铁讲述了铁路人偶（RailLord）的功能以及和司机的配合，其中最重要的是“共鸣”，可以将个体获得到的信息共享给周围的铁路人偶。\n\n“共鸣通信还真是方便呢。”\n“是啊，所以说我们铁路人偶，全面掌握和控制着运营和时刻表呢。”\n“所以叫Lord（人偶），正所谓支配者呢。”\n“非也，双铁少爷。要说支配着铁轨与车辆，还有铁路人偶这一切的，是你们人类啊。”\n\n随后的聊天则因为聊到“大废线”和事故陷入了微妙的空气，八六为转移话题说起了其他的话。\n\n“话说回来，双铁少爷也是有点坏心眼呢，偏偏要跟我说坐空凝机。要是早说是飞机的话，也不会让您见到我那有失体面的样子。”\n\n在说到空凝机落户的话题后，八六表示愿意尽全力帮助双铁。\n“如此秀丽的山河，决不能交给面目憎恶之徒！”\n“面目憎恶之徒？”\n“恐狞机，不就是面目憎恶之徒。”\n言辞激烈的话语使navi出来反驳了八六，在争论中这才知道竟然还有飞行的空凝机。\n“让我下去！”\n“现在下去会粉身碎骨的啊！”\n\n双铁最终使八六平静了下来，在接受到navi的共鸣之后，发现地上还有正在运营的铁路。"
 TRB_Openning.003.a: "“我们下去看看。”\n“可以吗？！”"
TRB_Openning.004.t: "KiHa07,波莱特与玲奈"
 TRB_Openning.004.d: "双铁与八六观察了这一段的铁路，八六表示这段铁路虽然很烂，但还有在使用，八六表示如果现在是整备体就可以帮忙清理路面了。\n\n“铁路人偶为了应对不同的情况，可以从整备体和运转体中切换。”\n“也就是和人做事要换衣服一样嘛。”\n\n继续行走了一段路，他们看到了一个车站，但却是废弃车站。\n两人重新登上空凝机之后，navi却表示前面一段无法飞行，迫降在了铁路边上。\n\n突然，八六兴奋的告诉双铁：她和前面正在运转的铁路人偶共鸣上了，也就是说只要在这等就能等到火车了。\n\n从可爱的橘红色的椭圆形车体下来的，正是司机波莱特和KiHa07s专用人偶玲奈。\n\n在KiHa07s上，八六对作为人偶的玲奈竟然在运转中睡着了十分愤慨，双铁则用此前波莱特说的“这个时代情况很复杂，掌车人各有各的隐情。”来劝说八六，八六决定等到站之后再询问缘故。\n\n在铁路商店中得知，玲奈因为汽改柴导致的遗留问题才会经常睡觉，双方在交谈中得知目标都是组织空凝机落户，于是一拍即合，由双铁担任八六的司机，并寻找8620机车。\n同时，波莱特提出了一个主意：让八六参加选举以争取一部分选票。"
 TRB_Openning.004.a: "“我也要参选吗？”"
TRB_Openning.005.t: "“我也要参选吗？”"
 TRB_Openning.005.d: "八六抬起头，神情里带着一丝不多见的困惑。\n“是，”波莱特说，“和我们组成联合阵线。您在铁路人偶社群和爱好者之间的名望，是任何竞选经费都换不来的。”\n\n八六沉默了片刻。\n“现行法律连我们算不算公民都尚无定论。”\n“没有明文禁止，”波莱特说。\n“这是在钻空子。”\n“是，”波莱特没有否认，“但空子是真实存在的。”\n\n八六没有接话。她转向窗外，温泉的水汽在冷空气里升得很高，\n把远处的山脊线熏得模模糊糊。\n她就这样看了一会儿，像是在等自己把某个从未设想过的可能性消化干净。\n\n“如果我们输了呢，”她重新看向波莱特。\n“那至少铁路人偶参选这件事，”波莱特说，\n“会被所有人记住。”\n\n八六低头看了看桌面，又抬起头。\n“好，”她说，一字一顿，语气已经恢复如常，平静，利落，不容置疑，\n“那就参选。”"
 TRB_Openning.005.a: "“我们联合！”"#从这一刻起，历史发生了巨变……
TRB_Openning.006.t: "三张候选人名单"
 TRB_Openning.006.d: "选举委员会公布候选人名单的那个早晨，御一夜联邦的各大报纸都在头版留出了半版篇幅。名单上有两个名字在意料之中。\n\n第一个是现任总统雏衣·波莱特。御一夜铁道股份有限公司的创始人与掌车人，大废线时期结束后，以一己之力撑起汤医线运营至今。她的施政纲领只有一条主轴：重新联结。那些在大废线时期烂进山里的路基，那些锈死在荒草里的铁轨，她要把它们一段一段地接回来。支持者说她是御一夜铁路最后的守夜人，反对者说她是在用一条小铁路的温情对抗整个时代的走向。\n\n第二个是宝生稀咲。独立候选人，空凝机产业的坚定推动者，隈元银行总行长宝生元忠之女——尽管这层关系从未出现在任何一份官方声明里。她的竞选纲领以一份四十页的《空凝机经济可行性报告》为核心，数据详实，论点清晰，落脚在同一个结论上：御一夜的未来在天上，不在铁轨上。\n\n然后是第三个名字。\n\n八六。\n\n选举委员会的工作人员后来说，那份参选申请送达的时候，整个办公室安静了将近十秒，才有人开口问：这是真的吗？\n八六——帝国铁路8620型蒸汽机车首车专属铁路人偶，御一夜现存最年长的铁路人偶之一，长眠多年，近日方才重新苏醒。\n铁路人偶。参选。联邦总统。\n这三个词摆在同一个句子里，让当天早晨拿到报纸的人几乎都沉默地重读了一遍。\n\n铁道迷社群的反应来得最快，从震惊到沸腾只用了不到半个小时。\n\"八六？是那个八六吗？\"\n\"首车人偶居然还在御一夜？\"\n\"她要参选？她能参选吗？\"\n铁路人偶们的反应则安静得多，但沉默本身就已经说明了某些事情。\n\n稀咲阵营当天下午发表了一份声明，措辞谨慎：\n\"我们尊重所有参选者，但相关资格问题应由法律裁定。\"\n波莱特没有发表任何声明。\n\n三天后，联邦议会法务委员会宣布召开紧急听证会。\n议题只有一个：铁路人偶，是否具备参选资格。"
 TRB_Openning.006.a: "选举已经开始了"
TRB_Openning.007.t: "沉睡者的旗帜"
 TRB_Openning.007.d: "消息在铁路人偶社群里传开的速度，比任何一份报纸都快。\n\n八六——8620机车首车专属人偶，御一夜现存最年长的铁路人偶之一——将以独立候选人身份参选，与御一夜铁道股份有限公司组成联合阵线。\n这个名字对许多人来说只存在于老照片和口耳相传的故事里：帝国铁路公司解体之际，她随8620一同被收购运至御一夜，而后长眠至今。\n\n铁路人偶参选——这在御一夜联邦的历史上还是头一次。\n现行宪法的条文里找不到明确的禁止，但也找不到任何一条把铁路人偶当作完整公民来对待的表述。\n反对的声音第一时间涌了出来：\n“人偶是财产，财产怎么能参选？”\n“这是在拿宪法的漏洞做文章。”\n\n支持的声音同样不小：\n“御一夜的铁路是人偶们用身体撑起来的，凭什么连被选举权都没有？”\n“八六比这个国家大多数选民都年长，她有什么资格没有？”\n\n稀咲阵营的回应很快，措辞谨慎而锋利：\n“我们尊重所有参选者，但法律的解释权不在候选人手里。”\n\n波莱特没有发表声明。她不需要——联合阵线本身就是她的回答。"
 TRB_Openning.007.a: "我们会研究这事的。"
TRB_Openning.008.t: "财产还是公民"
 TRB_Openning.008.d: "听证会的会议室里坐满了人，旁听席的加座一直排到了走廊。\n\n反对派的律师率先发言，将一份印刷好的法条副本逐份分发给在座的委员，\n随后用教鞭指着黑板上手写的《御一夜联邦民事法典》第十七条原文：\n“具有特殊属性的动产。”他的语气平静，像是在宣读一份早已盖棺定论的档案，\n“动产无法作为权利主体，参选资格的讨论到此为止。”\n\n波莱特的法律顾问随即起身：\n“请问议会何时明文规定铁路人偶不得参选？”\n对方翻了翻文件，“《民事法典》第十七条——”\n“《民事法典》规定了铁路人偶的财产属性，”\n法律顾问打断道，“但《联邦选举法》从未出现过任何一条禁止铁路人偶参选的条文。这两件事，不是同一件事。”\n\n会场沉默了片刻。\n\n“《联邦选举法》之所以没有相关条文，”对方重新开口，\n“是因为立法者从未预料到会有铁路人偶参选。这是法律的空白，而非许可。”\n“法律的空白，”法律顾问说，“在明文禁止出现之前，只能被解读为未禁止。这是法治的基本原则。”\n\n委员长敲了敲桌子，将视线转向旁听席的八六：\n“请问参选人本人有何陈述？”\n\n八六站起身，整了整衣襟，环视了一圈会议室。\n“《联邦选举法》，”她开口，“颁布于大废线时期结束后的第三年。彼时御一夜百废待兴，民主初创，诸位的前辈们为尽快实施宪政以振人心，在短时间内通过了这部法律。”\n她停顿了一下，\n“我在那之前已经沉睡了很多年。帝国的时代没有选举，也没有议会，自然也没有任何人需要考虑铁路人偶能否参选。这部法律诞生的时候，没有人想起我们，或许是因为没有人知道我们还在。\n但它同样没有写明我们不能参选。”\n\n她重新坐下。\n“我只是在遵守这部法律。”\n\n反对派律师沉默了相当长的时间，才重新翻开面前的文件夹。\n他一页一页地翻，找了很久，没有找到他需要的那一条。\n因为那一条，确实不存在。"
 TRB_Openning.008.a: "话都说到这份上……"
 TRB_Openning.008.b: "似乎也没有什么能阻止她们了。"
TRB_Openning.009.t: "议会大厅的交锋"
 TRB_Openning.009.d: "联邦议会为这场辩论专门腾出了一个下午。旁听席坐满了记者和市民。\n\n稀咲率先登台，将《空凝机经济可行性报告》逐条拆解，声音平稳，数字精确。\n“空凝机不需要路基，不需要维护里程，制造厂回本周期不超过六年。这不是豪赌，这是算术。”\n\n波莱特随后上台，手边摆着两份文件。\n“宝生女士的报告有几个数字没有写进去。”\n她翻开第一份：\n“空凝机制造废液若处理不当，会沿地下径流污染方圆数里的水源。右田一的酿酒用水、御一夜的温泉、隈元的农业灌溉，全在污染半径之内。这笔账，算进去了吗？”\n她翻开第二份：\n“空凝机无法制造大型引擎，永远只能承担小规模运输。煤炭、木材、粮食、工业原料——御一夜真正需要运的东西，空凝机一样都拿不动，六年后回本了又怎样，运不出去的货替御一夜还债吗？”\n\n稀咲在台下，手边的笔停了片刻。\n议长宣布休会时，旁听席的议论声已经压不住了。"
 TRB_Openning.009.a: "波莱特用事实说服了人们。"
 TRB_Openning.009.b: "但稀咲的宏伟蓝图还是吸引人的。"
TRB_Openning.010.t: "宝生家族的暗中努力"
 TRB_Openning.010.d: "在稀咲确认参选后，宝生家族便动用了几乎所有能动用的力量来确保稀咲的支持率。\n今天，波莱特便从几个中立派人士那里得知，宝生家族在对他们行贿以换取支持稀咲，这几位议员在挣扎许久之后还是决定告诉波莱特。\n\n“稀咲，我知道你我意见不合，但无论怎么样，我想也不能破坏联邦来之不易的民主制度吧？”\n“我，我不知道这种事——”\n“别开玩笑了，你的父亲全力支持你，甚至不惜花重金，谁不知道宝生家族财大气粗啊？！”\n“我真的没想过他居然会干预到这种程度……”\n\n两人的会面不欢而散，这晚，稀咲思绪良久。\n用这种手段赢了真的能施展自己的抱负吗，这样真的是“民主选举”吗,如果自己和父亲的观念实际上有冲突，宝生集团还会继续支持自己吗？\n\n在思绪的最后，稀咲确定了自己的本心："
 TRB_Openning.010.a: "我决不当财团之傀儡！"
 TRB_Openning.010.b: "我……斗不过他们的"
TRB_Openning.011.t: "水与酒之地的警惕"
 TRB_Openning.011.d: "右田一地区的人谈起空凝机，第一个想到的不是“飞行器”，而是“工厂”。空凝机的制造工艺复杂，需要大量用水，而排出的废液若处理不当，会顺着地下径流污染方圆数里的水源。\n右田一的酿酒业依赖的恰恰是从阿尔卑斯山脉渗下来的天然泉水，本地人世代守着这一口水，建起了整个地区引以为傲的酿酒产业。\n任何威胁到这口水的东西，都是他们的敌人，不管它叫什么名字、打着什么样的旗号进来。\n\n波莱特来到右田一时，酿酒商会的会长亲自出来迎接，开口第一句话就是：“总统阁下，我们不反对进步，我们只是不想死在进步手里。”\n波莱特扫了一眼窗外——大废线时期荒废的路基还横亘在山坡上，杂草已经漫过了枕木，锈蚀的铁轨在阳光下泛着暗红。\n她说：这些路基我来修，废弃的线路我来重新联结。\n右田一的酒桶不会继续烂在仓库里，也不会有任何一座工厂的废水流进你们的泉眼——因为铁路不需要污染任何人的水源。\n会长听完，沉默了片刻，点了点头。\n\n稀咲的阵营随后也派人来了，带来的是一份措辞严谨的书面声明：空凝机制造厂的选址将优先考虑其他地区，右田一的水源问题已经被纳入规划评估，不会强行落户。\n商会里有人松了口气，但也有人冷笑：“承诺是纸，写了也能烧。”\n稀咲没有亲自到场，这件事本身就已经说明了很多。"
 TRB_Openning.011.a: "波莱特以拒绝污染笼络了当地人"
 TRB_Openning.011.b: "但咲稀的承诺也有其重量"
TRB_Openning.012.t: "大本营的壁垒"
 TRB_Openning.012.d: "隈元地区没有什么悬念可言，至少表面上如此。\n银行的分支机构几乎开在每一个街角，宝生元忠的名字被镌刻在两座建筑的奠基石上，这里的人从小就知道，隈元银行借给他们的钱盖起了他们住的房子。\n\n波莱特来这里拉票，更像是一种姿态，而非真正期待翻盘。\n她走过主街时，有人礼貌地点头，有人当作没看见，偶尔有一两个老人在铁路话题上多聊了几句——那通常是在大废线时期之前就在这里生活过的人，还记得火车开进隈元时候的样子。\n但记忆换不来选票，波莱特在隈元地区能争取的，也许只是那一小部分对银行垄断感到隐隐不安的中立者。"
 TRB_Openning.012.a: "稀咲在这里会得到应有的支持"
 TRB_Openning.012.b: "不过波莱特力争到了一部分选民"
TRB_Openning.013.t: "御一夜中央广场的风"
 TRB_Openning.013.d: "如果说右田一是波莱特的腹地、隈元是稀咲的堡垒，那么御一夜地区就是这场选举真正的战场。\n\n这里的人见过大废线时期的废墟，也见过汤医线一点一点建起来，他们对铁路有感情，但感情解决不了就业，解决不了年轻人出走的问题。\n稀咲在这里散发的宣传材料做得很精致，空凝机的想象图印在铜版纸上，附带一份言之凿凿的就业预测报告。\n而波莱特选择在中央广场直接开口，不带稿子，讲废弃的路基，讲那些等待重新联结的线路，讲自己认识的那些养路工的名字。\n\n御一夜地区的选民把这两种东西都接过去，放进了口袋。\n他们在想什么，没有人知道，直到投票的那天。"
 TRB_Openning.013.a: "空凝机就是未来！"
 TRB_Openning.013.b: "铁路复兴有必要性！"
TRB_Openning.014.t: "8620的汽笛"
 TRB_Openning.014.d: "御一夜铁路爱好者协会宣布举办一场公开活动：8620机车将在汤医线全线运行一个往返，向公众开放参观。\n这本是一场单纯的铁路文化活动，但没有人真的把它当成单纯的铁路文化活动。\n\n站台上挤满了人。有白发苍苍的老人，说自己年轻时见过这台车跑过的样子；\n有带着孩子来的年轻父母，举起相机的手有些发抖；\n还有三三两两的铁路人偶，站在人群边缘，沉默地看着8620缓缓驶入站台。\n汽笛响起来的时候，有人鼓掌，有人落泪，有人什么都没做，只是站在原地，\n听那个声音在山谷里滚了很久，很久。\n\n八六站在车头旁边，面对这些面孔，罕见地沉默了比平时更长的时间。\n最后她说的话没有经过任何准备：\n“我不知道选举的结果会怎样。但这条路，我们一起修过。”\n\n稀咲阵营的观察员站在人群最外侧，将这一切记录下来，\n表情里看不出什么明确的情绪。\n回去之后，他在报告里写道：\n“比预期中麻烦。”"
 TRB_Openning.014.a: "联合阵线趁机造势。"
 TRB_Openning.014.b: "八六获得了铁路人偶的广泛支持。"
 TRB_Openning.014.c: "宝生集团尽全力阻止了该事件发酵。"
