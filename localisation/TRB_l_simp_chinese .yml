 military_politicism_desc:0 "军政主义主张由军官取代职业政客，在剔除政治的因素之后，行政效率将会大幅度的提高，军政主义类似于军政府，当又不同于军政府，军政主义的国家元首有军队总司令担任，一般没有任期限制，但是由职业军官代替政客的做法是创新性的，政府将剔除政治因素后专心为人民提供服务。"

#真日本帝国
 #民族精神
  RJE_Mikado_desc:0 "柴神任命的少女，拥有统治日本帝国的神圣能力。\n\n拥有能够唤起奇迹『神风』这样的能力，身负守护日本的义务。\n\n她掌握着所有事情的最终决定权，日本国民必须遵从她的决定。\n\n性格活泼温柔，以「以和为贵」为信条，十分重视大家的友好关系。\n\n由于她地位很高导致她没有亲密的友人，这一点让她非常困扰。"
  RJE_Japanation:0 "世界日本化计划"
  RJE_Japanation_desc:0 "由帝提出的“世界日本化计划”旨在消灭宗主国与殖民地之间的关系，日本人民与殖民地人民拥有这相同的权利，建设着“世界日本”，尽管这将消耗掉我们很大一部分资产......"
  RJE_Japanation_1:0 "世界日本化计划"
  RJE_Japanation_1_desc:0 "由帝提出的“世界日本化计划”旨在消灭宗主国与殖民地之间的关系，日本人民与殖民地人民拥有这相同的权利，互相尊重文化，建设着“世界日本”，尽管这将消耗掉我们很大一部分资产......"
  RJE_Japan_division:0 "分裂的樱花岛"
  RJE_Japan_division_desc:0 "樱花岛被分为南北两块划给了真日本帝国与樱花国，民众迫切希望我们能够统一！"
  RJE_Navy_defect:0 "海军缺陷"
  RJE_Navy_defect_desc:0 "对于真日本帝国来说，通常情况下他们认知中的海军指的是在星系间进行战斗的空间舰队，而海洋舰队和大气内飞行器只是负责行星突击的陆军的副手而已。因为英利斯帝国的虫洞技术有限，我们无法大规模部署轨道舰队，而且为了不引起这个银河系霸主的注意，我们要求地球部队使用符合工业时代科技的武器。山下利古里为首的陆军对没有轨道炮击支援的海洋与天空作战模式并不适应。"
  RJE_Navy_defect_navy:0 "海军缺陷"
  RJE_Navy_defect_navy_desc:0 "对于真日本帝国来说，通常情况下他们认知中的海军指的是在星系间进行战斗的空间舰队，而海洋舰队和大气内飞行器只是负责行星突击的陆军的副手而已。因为英利斯帝国的虫洞技术有限，我们无法大规模部署轨道舰队，而且为了不引起这个银河系霸主的注意，我们要求地球部队使用符合工业时代科技的武器。山下利古里为首的陆军对没有轨道炮击支援的海洋与天空作战模式并不适应。"
  RJE_Navy_defect_air:0 "海军缺陷"
  RJE_Navy_defect_air_desc:0 "对于真日本帝国来说，通常情况下他们认知中的海军指的是在星系间进行战斗的空间舰队，而海洋舰队和大气内飞行器只是负责行星突击的陆军的副手而已。因为英利斯帝国的虫洞技术有限，我们无法大规模部署轨道舰队，而且为了不引起这个银河系霸主的注意，我们要求地球部队使用符合工业时代科技的武器。山下利古里为首的陆军对没有轨道炮击支援的海洋与天空作战模式并不适应。"
  RJE_JAP_autonomy_governmet:0 "樱人治樱"
  RJE_JAP_autonomy_governmet_1:0 "樱人治樱与英灵自治"
  RJE_JAP_control_company:0 "利用财阀"
  RJE_JAP_control_company_desc:0 "§Y每月固定收入:§!§G8§! £hcp_small \n自从第三次圣杯战争期间，樱花国制造并出口的工业产品远销海外，这给本国带来了大量经济收入的同时也催生出了垄断资本集团。其中以三井、三菱、住友、安田四大财阀为代表，甚至在樱花国政治领域也同样具有很高的地位。\n但在日本政府占领樱花之后，政府并不会对此闭一眼睁一眼，凯灵财阀利用了一些“特殊手段”将樱花四大财阀收到了凯灵集团之下，结束了樱花财阀对于政府的可能干预。\n现在，前四大财阀的企业正在凯灵财阀的支持之下运作......"
  
