  China.001.title: "鼠岁惊蛰"
  China.001.desc: "永和二年腊月廿九。\n紫禁城的琉璃瓦上覆着薄雪，檐角垂下的冰棱如匕首般森然。往年此时的京城该是爆竹震天、红绸满街，可如今的长安街上，只有零星衣衫褴褛的乞丐在街角无声哽咽，仿佛被北风扼住了喉咙。粮店的木板上歪歪斜斜贴着一张告示：“朝廷赈粮已尽，诸户自求多福。”字迹被雨水洇得模糊，倒像是老天爷替这世道落的一滴泪。\n乾清宫内，炭盆烧得噼啪作响，却驱不散殿中的阴冷。天子蒋丽华端坐在龙椅上，冕旒下的面容苍白如纸。她盯着阶下空荡荡的御案——那是“摄政王”蒋傅说的位置，已积了三个月的灰。\n“陛下，内阁的折子……”内侍捧着漆盘欲言又止。\n“搁着吧。”少女的声音轻得像一缕烟。她知道的，折子里无非又是“两广异动”“川中赤祸”，或是“辽满都司请增军饷”——可国库早被那场毫无意义的北伐给败光。\n殿外忽有脚步声急促逼近，康佑薇裹着一身寒气闯进来，花白的发丝间还沾着片片雪粒：“陛下！黎将军带着学生游行，说要‘废摄政、开国会’……怕要是要在宫门请愿了，若是当众逼天子承诺些什么，只怕......！”\n蒋丽华指尖一颤，冕旒珠玉相撞，叮咚如碎冰。\n\n河北保定大营，袁克定一身戎装立于沙盘前，手中马鞭划过黄河一线：“请愿？哼，那分明是逼宫，如今京畿空虚，那黎星刻若真逼宫成功……那黄毛丫头连玉玺都捧不稳。”副将欲言又止：“可咱们若此时进京，张作玲和樱花人……”\n“她们只会狗咬狗罢了。”她冷笑道，鞭梢猛地戳向沙盘上的紫禁城，“等那老东西一咽气，这天下......”\n窗外忽传来一阵喧哗。袁克定皱眉掀帘，却见营外旷野上，数百饥民正跪在雪地里磕头，枯枝似的手伸向军营粮仓。\n“放箭，放箭。”她转身，马鞭在掌心勒出一道血痕。\n\n子时，京城飘起细雪。蒋丽华独自登上角楼，望着漆黑如墨的夜空。内城尚有零星光点，外城却早已陷入死寂——那是饿殍的坟场。\n“陛下，楚王（蒋傅说）……薨了。”身后传来内侍颤抖的禀报。\n她没回头，指尖深深掐进城墙砖缝。寒风卷起龙袍下摆，露出一截磨破的裙边。\n远处忽然炸开一簇焰火，赤红如血，照亮了紫禁城飞檐。"
  China.001.a: "新年的钟声敲响。永和三年到来了。"

  China.002.title: "虎踞龙蟠"
  China.002.desc: "袁克定的铁甲战车碾过永定河石桥时，京城九门早已挂满北方军的玄色旌旗。城门守军缩在岗亭里仿佛事不关己——没人敢拦这位披着貂氅、腰别勃朗宁的“女帅”。她踏进午门时，乾清宫前的铜鹤正喑哑地啼叫，仿佛是为蒋家王朝唱哀歌。\n偏殿内，炭火将御案上的朱批折子烤得卷了边。蒋丽华攥着毛笔的手悬在半空，一滴墨汁“啪”地砸在“两广急报”四字上，晕开成血痂般的污渍。\n“陛下该用印了。”袁克定将《战时授权诏书》推上前，牛皮军靴碾过地上散落的奏章。康佑薇正要开口，却被黎星刻按住衣袖——这位革新派领袖的食指在袖中轻敲三下，像在打摩斯电码。\n殿外忽有马蹄声裂空而来，传令兵浑身是血扑跪在地：“报！草原骑兵劫了张家口粮仓，说是……说是只认摄政王的调令！”\n袁克定冷笑，佩刀“当啷”一声压在玉玺旁：“从今日起，本帅便是摄政王。”刀柄上缠着的黄绸带散开，露出半截被血沁透的“袁”字。\n当夜，文华殿偏阁。\n黎星刻掀开斗篷，露出内衬里别着的《泰晤士报》——头版赫然是圣杯记者偷拍的袁军炮轰饥民照片。康佑薇指尖发颤地抚过铅字：“黎公真要行此险棋？革新派与保皇党联手，岂非与虎谋皮……”\n“康公可见过西山饿殍坑？”黎星刻掀开窗棂，寒风卷着碎雪灌进来，“三千具尸首叠成京观，眼窝里塞的都是观音土。这虎狼世道，所谓清流独善其身便是共犯。”他从怀表夹层抽出一枚镀金钥匙，“袁克定在汇丰银行存了八十万两军饷，密码是蒋傅说薨逝的时辰。”\n更鼓声咽，两道人影从角门分头离去时，檐角蹲守的乌鸦突然惊飞。暗处闪过半张樱花浪人的脸。\n几日后，袁克定搬进了楚王府。\n她站在蒋傅说病逝的楠木榻前，靴尖踢到个鎏金宝宫，骨灰簌簌洒出来——老亲王临终前竟把自己烧成了舍利。亲信捧着热河急报踉跄闯入：“马家军占了绥远电台，正在播放《独立宣言》……”\n“掐了电闸，就说线路遭赤党破坏。”袁克定碾着骨灰冷笑，忽然瞥见案头砚台下压着半页残笺，蒋傅说枯瘦的字迹力透纸背：“……星火可燎原，尤忌同室戈。”"
  China.002.a: "窗外北风呼啸而过，像一声悠长的叹息。"

  China.003.title: "暗室盟书"
  China.003.desc: "京城·广化寺藏经阁·夜\n雪粒子簌簌打在窗棂上，烛火被灌入的寒风撕扯成鬼爪般的影子。黎星刻摘下将校大衣，露出内里浆洗到发白的立领学生装——那是他许多年前参加公车上书时的旧衣。康佑薇正跪坐在蒲团上誊抄《论语》，笔锋忽顿：“黎公今日这身学生打扮，倒比穿军装顺眼。”\n“康公抄‘君子不器’，却要借军阀的刀杀人，”黎星刻从袖中抖落一卷泛黄地图，“岂非更讽刺？”宣纸在案上铺开，晋、浙、沪三地赫然被朱砂圈成三角。\n康佑薇的笔尖悬在“器”字最后一勾：“重岳痴佛，段祺瑞迷卜——要撬动这些老狐狸，得用他们的方法当楔子。” \n阁楼木板吱呀一响，小沙弥探头禀报：“闽商送茶叶的骡车到后门了。”\n\n山西·太原军营总部\n士兵的操练声被铁门隔绝成模糊的潮音。重岳盘腿坐着：“黎星刻派个酸儒送如意？当我重岳是戏台子上的丑角？”\n幕僚举起马灯照亮如意柄端的铭文——“宁负如来，不负苍生”，重岳瞳孔一缩：“这字是康佑薇的笔迹……当年他替谭嗣同收尸时，在血衣上写过同样的话。”\n“袁克定上月扣了咱三车磺胺，”幕僚压低嗓子，“保定大营还传出话，说娘子关该换‘懂事的’守。”\n重岳猛地扯断佛珠，檀木珠子滚进香灰堆：“给康佑薇回电报——‘金刚怒目，菩萨低眉’。”\n\n杭州·西湖雷峰塔地宫\n段祺瑞的烟斗在黑暗中明灭如萤，他踢开脚边锈蚀的雷峰塔经砖，对江浙水师都统嗤笑：“黎星刻让我学越王勾践？他怕是忘了，卧薪尝胆的人最后都爱鸟尽弓藏。”\n统领递上密信：“康佑薇附了半片龟甲，说是袁克定卧房掘出的商朝卜骨——背面刻着‘袁氏代蒋’。”\n烟斗呛然落地，段祺瑞抓起龟甲对着气窗微光细看，裂纹恰好将“袁”字劈成两半。“康南海这是赌我会信天命？”他摩挲着龟甲冷笑，忽然瞥见裂缝里嵌着半粒小米——那是他早年暗通革命党时用的接头暗号。\n“调两艘炮舰去崇明岛，”段祺瑞甩出贴身铜符，“告诉黎星刻，我要国会十个永久席位。”\n\n京城国会暗室\n康佑薇将重岳的佛珠、段祺瑞的龟甲并排摆在《立宪草案》上，黎星刻拎起酒坛浇透地图：“晋军卡咽喉，江浙锁钱粮——该给袁克定灌一壶鸿门宴了。”\n“慢着，”康佑薇突然按住酒坛，“这些军阀今日能反袁，明日便能反你我。若新政失败……”\n黎星刻掰开他手指，酒液泼溅成一道黄河：“那就让史书写——康梁余孽与乱臣贼子，曾狼狈为奸为救苍生。”\n暗室铁门轰然洞开，风雪卷着《申报》头条扑进来——“袁帅下令裁撤国会，改立军机参议院”。两人对视一眼，康佑薇忽然抓起朱笔，在《论语》扉页狂草八字：\n“破庙易，塑金身难。”"
  China.003.a: "残烛骤灭，黑暗中只余纸页翻飞声，像一群白蝶在啃食旧时代的茧。"

  China.004.title: "鼎革分潮"
  China.004.desc: "黎星刻的怀表指针指向寅时三刻。\n京城新军驻地内，三百名刺刀上缠白布的士兵正无声集结——白布浸过煤油，只等一把火。康佑薇立在阴影中，将重岳的亲笔信递给黎星刻：“晋军已卡住娘子关，段祺瑞的江浙水师……今夜炮口会对准袁克定的河北大营。”\n卯时正，太和殿广场。\n袁克定率亲卫策马冲入宫门时，忽见丹陛上立着一排黑衣学生，手中高举火把。黎星刻从人群中踱出，军装纽扣全解，露出内衬白衫上一行血字：“还政于民，天下共诛”。“袁帅可知，这新军刺刀上的白布是裹尸布——”他抬手点燃火把，“还是招魂幡？”\n火苗蹿起的瞬间，宫墙外炸响晋军冲锋号。袁克定拔枪怒射，"
  China.004.a: "子弹击碎了九龙壁一角。"
  China.004.b: "子弹击穿了黎星刻的胸膛。"

  China.005.title: "新火焚旧枷"
  China.005.desc: "在黎星刻躲闪间，子弹却击碎了九龙壁一角——早已埋伏的禁军从藻井下翻出，刀光如网。\n\n辰时，乾清宫。\n蒋丽华端坐龙椅，脚下跪着被反绑的袁克定。女帅的貂氅撕裂，额角血污蜿蜒如蚯蚓。“陛下……咳咳，要斩便斩。”她啐出一口血沫，“只是别忘了，这龙椅早被军阀的血泡烂了！”\n黎星刻捧玺上前，却被康佑薇按住：“请陛下颁《立宪诏》，即日起废除摄政，国会总揽国政。”\n少女天子垂眸轻笑，忽将玉玺重重砸向金砖：“诸卿争的是玺，朕砸的是命。”玉屑纷飞中，她解下龙袍抛向殿外，“告诉你黎星刻，你这的‘新神州’……莫再有百姓冻饿而死。”\n残阳如血，京城街头贴满《国会宪章》。"
  China.005.a: "帝国的命运将如何？"

  China.006.title: "铁腕铸寒鼎"
  China.006.desc: "黎星刻躲闪不及，子弹击穿了黎星刻的胸膛，袁克定的亲卫与反袁同盟的死士拼杀在一起。\n\n袁克定的刀尖挑开黎星刻的军装衣领，露出锁骨上一道陈年弹痕。“十年前北伐，你替我挡过枪。”她将染血的《立宪草案》甩在他脸上，“现在为个虚名叛我？”\n黎星刻仰头大笑，血沫喷在袁克定靴面：“你错看了两件事——康佑薇不是腐儒，我也从未‘忠’于你。”话音未落，窗外骤起爆炸声，樱花浪人的尸体从角楼坠下，怀中跌出半张山西银行密押单。\n午时，菜市口。\n康佑薇被铁链拽上刑台时，正逢沙尘暴过境。刽子手的鬼头刀被风沙磨出火星，他却仰天狂吟：“百日维新血未尽，君子六魂今又来——”刀落刹那，围观人群中飞出数十枚炸弹，重岳的死士撕开长衫，露出绑满雷管的胸膛。\n子夜，摄政王府地牢。\n蒋丽华的素衣浸透血污，腕上铁铐刻着“袁”字花体。袁克定将传国玉玺残片塞进她掌心：“陛下可知，玉碎声比丧钟好听？”少女忽然攥紧碎片刺向她咽喉，却被一脚踹翻。\n“带她去地牢。”袁克定擦着颈侧血痕，“告诉重岳和段祺瑞，他们可别想当作无事发生！”"
  China.006.a: "帝国的命运将如何？"

  China.007.title: "危机浮现"
  China.007.desc: "天灾与人祸交织让这道传承千年的余火燃尽，无数的自救与挣扎终究难挡大势的冲刷，孤傲的旧日贵人再难驾驭帝国的缰绳，来自各地的急报被源源不断地送入大殿，即便审阅这些奏本就已用尽官员，更别说补救措施了。所有人都希望帝国的崩溃不会来得如此之快、如此之突然。但今日应来日果，只不过在那时没人知道未来他们会收获怎样的果——现在看来，终究是恶果。"
  China.007.a: "千年帝制已是行将就木"

  China.008.title: "川渝剿匪情况"
  China.008.desc: "臣四川总督年谨奏：\n川中近岁水旱蝗汤叠起。又遭赤匪作乱，民生多艰以文难言。时至今日仓储告罄，臣亦竭力筹赈，设粥厂、劝捐输、请协济，然难解倒悬之急。每睹民生凋敝之状，便心焦如焚，自觉愧对圣恩。\n虽处困厄，然川中子民深明大义，民间多感念皇上如天好生之德，每日颂圣之声不绝于耳。乡绅富贾亦能体念时艰，携箪食壶浆，犒劳官军剿匪。此皆我圣上广施仁德，圣训深入民心之明证。\n值此物力匮乏之际，赤匪乘虚而入，啸聚山林，滋扰地方。臣深知此患不除，地方难安。但剿匪事宜所费甚巨，川省库帑本已因灾空虚，又遭赤匪一劫，筹措万分艰难。兵器粮草时有不继，士卒常常空腹行军。臣与在任官员不敢稍有懈惰。虽有诸因而未能尽剿匪患，然仰赖皇上天威，将士用命，亦毙杀赤匪无数。\n现今赤匪主力已聚集于川北群山中休养，其余匪众经此痛创，锋芒不再，残部星散，遁入深山密林。臣现仍都督各军，扼守要冲，广布探眼，尽全力绝其死灰复燃之机。臣深知，未能荡平匪军，实属有负皇恩。\n推原其故，虽因山险匪狡，然饷械奇缺，实为最大掣肘。士卒奔命，常因粮草不继而顿兵；攻坚斗险，多因弹药匮乏而功亏。臣智术短浅，虽求于书中兵法，终难解此无米之困。每念及此，臣噬脐莫及。\n\n所诉川省近年灾情、民情及剿匪情形，谨附揭帖据实上报。臣无任惶恐待罪之至。伏乞皇上圣训。"
  China.008.a: "朕夙夜忧叹，恐赈济不周，诸位公卿却在此中饱私囊？"

  China.009.title: "大萧条冲击神州帝国"
  China.009.desc: "自我神州海疆不靖，国门洞开，与外通商以来，因我国工业能力缺乏，只能依靠茶叶、瓷器等供人享受之物博取一定利润。此外诸多日用商品，我国或不能生产，或质量奇差。无数利润皆被洋人所赚取掳掠，实乃我朝之不幸，吾皇之不幸也。现今风波再起，有洋人称之为“大萧条”之事席卷天下，欧罗巴、南北美等洲均为此焦虑。\n其危害亦波及我朝，冲击我国经济。百姓资产一落千丈，富者降为中产、中产沦为佃农、佃户卖身求活者比比皆是。值此天灾连发、匪党作乱之际，亟需改革经济、恢复民生，方能安定各方民意，稳固我朝根基。然具体详细之方略，切实可施之策术，仍需皇上亲自定夺。"
  China.009.a: "这是个危险，也是个机遇"

  China.010.title: "闽赣军战败"
  China.010.desc: "在华南戡乱战争中，闽赣军被两广的国党叛军打败了，吴佩孚和她的残部已经逃回了北京。"
  China.010.a: "我们会回去的。"

  China.011.title: "湖广军战败"
  China.011.desc: "在华南戡乱战争中，湖广军被两广的国党叛军打败了，孙传芳和她的残部已经逃回了北京。"
  China.011.a: "我们会回去的。"

  China.012.title: "南直隶局势升级"
  China.012.desc: "（待填充）"
  China.012.a: "（待填充）"

  China.013.title: "来自广州的报告"
  China.013.desc: "臣两广总督今汐谨奏\n\n为奏报粤桂防务并乞恩赈事\n臣闻圣天子垂拱而治，四海承平，然粤桂僻处南陲，民风悍野，近岁以来，天灾频仍，米价腾贵，刁民借机煽惑，致有零星匪类啸聚山林。臣夙夜忧惕，虽调兵弹压，然地方库帑匮乏，兵械朽钝，恐难尽剿余孽。\n查广州、梧州等处，偶见宵小张贴悖逆标语，臣已饬令州县严加缉拿，焚毁邪书，并晓谕乡绅耆老，申明朝廷仁德。惟匪徒狡黠，常假商旅之名流窜港澳，圣杯洋人庇护，碍难跨境追剿。臣愚以为，当以怀柔缓图，免激民变。\n今两广水患未平，饿殍载道，若骤兴大兵，恐饥民附逆，反成燎原之势。伏乞皇上天恩，拨银三十万两以购赈粮，另赐新式枪械两千杆、弹药百箱，充实防营。待民生稍苏，臣必亲率精锐犁庭扫穴，以靖边圉。\n至若坊间谣传“乱党盘踞”云云，实系奸商捏造，意图哄抬盐铁市价。臣已锁拿造谣者数人，候旨发落。岭南虽远，臣心向北斗，断不敢纵容逆种，辱没天威。"
  China.013.a: "别以为我不知道你和国民党的肮胀勾当！"

  China.014.title: "玄穹鉴密奏"
  China.014.desc: "臣李舜生谨奏\n\n陛下圣鉴：\n臣奉旨监察四方，夜枭台暗桩近日于岭南侦得蹊跷。两广总督今汐明面奏请赈灾整军，暗行悖逆之举，臣略奏罪其三，伏乞天听\n臣尽查今年粤海关厘金簿册，得“赈灾专款”二十万两汇入汇丰银行户头，户名“广昌号”。据黑冰司港澳线报，该商号实为国民党外围组织“兴中会”所控，资金流向汕头、琼州等处。更查得今汐族侄今柏年，常以茶商之名出入港澳，常密会逸仙心腹汪兆铭于香港阿尔托莉雅酒店。\n广州西关“岭南书院”，表面为今汐倡办之新学，实则逆党武库。臣遣数人扮为书吏，宵遁查之，乃得革命党《讨檄神州文》雕版七块，上书落款“中国国民党军事委员会”。另据南洋眼线密报，该院每月十五便以“诗会”为名，聚粤桂士绅百余人，所吟皆“推翻帝制”之反诗，骇人听闻。\n三月初九虎门水师巡船遇海贼十余船，破之，查获日造三八式长枪五十支，然今汐竟谎称其为海外商舶，更以“误伤友邦”为由，移诸火器置于英夷领事馆。当夜，该批军火竟由英舰“翡翠号”运至惠州，往后不知所踪。此事有黄埔港苦力王阿福口述为证，然其突发热病，卒于途中，故不能探。\n臣斗胆进言，岭南恐已危如累卵，今汐心向逆党，但伺机起事，已不可恃。附呈暗语簿一册，凡总督府往来电文画有三波浪纹者，即通敌密信，破译之法依《河图》地四生金之数。\n臣舜生顿首血书\n永和二年冬\n\n--------------------\n附：南洋槟城《光华日报》剪报一张，载有“神州仁政泽被南疆”颂文，字里行间以《瘗鹤铭》笔法暗嵌“二月十二，粤桂并举”八字，此即逆党起事之期。"
  China.014.a: "朝廷无力啊"

  China.015.title: "新疆局势升级"
  China.015.desc: "臣仇白顿首急奏：\n新疆危局骤炽，实堪锥心泣血。自开春以来，罗斯铁骑越境愈频，假“护侨”之名盘踞伊犁河谷，暗筑坚垒，窥我领土。其马娘队携连发快枪，屡与戍边将士冲突，烽火台燧三日九燃！\n天山南麓更现巨患。「察合台」逆首九色鹿欲夺城自立，纠合部众叛乱四虐，叛军竟仿西式操练，连克莎车、和田六城。吐鲁番厅守军苦战半月，粮弹俱绝，终至玉门关外百里尽陷腥膻。\n朝廷虽遣甘军驰援，然驿道崩毁，粮秣多为风沙所埋。更兼北疆蒙古诸部观望游移，狼王旧族阴通俄夷。今迪化孤城悬绝，文武官员昼闭城门，夜闻叛军爆破之声响彻戈壁。臣恐秋高马肥之时，俄匪叛党合流，则汉唐故土非复国家所有矣！\n伏乞陛下速决大计，调陇右精锐出关，并敕总理衙门急会俄使严诘！西域存亡，系此一发。\n臣仇白泣血拜表。"
  China.015.a: "陇右之军出关，不知是福是祸啊。"

  China.016.title: "两广叛乱"
  China.016.desc: "两广总督今夕已于数日前公然叛国，献城降贼！广州、桂林皆陷，逆匪尽收我省府库藏，夺水师铁舰，夷人火器悉资敌手。现叛军伪立“倒帝共和”旗号，发兵十万分三路北犯：湘南告急！赣南烽起！闽西危殆！各地守军虽浴血奋战，然贼寇枪利炮锐，情势万分危急。\n逆酋更颁伪诏蛊惑民心，沿途匪党闻风响应。东南半壁河山震动，各省流民塞道，溃兵盈野。叛军先锋已抵郴州，其铁甲战车列阵湘水，洋炮射程远胜我军......"
  China.016.a: "急电东南剿总！"

  China.017.title: "东北宣布独立"
  China.017.desc: "在南方我军部队节节败退之际，可耻的辽满总督张作玲也宣布不再听从朝廷命令，还宣称造成国家一切混乱的根源就在帝都，她也要推翻朝廷建立共和，而当地驻军对她的忠诚也明显高于对朝廷的忠诚，纷纷表示支持她的“事业”。"
  China.017.a: "等着嗷，迟早有你好果子吃。"

  China.018.title: "起兵独立"  ##没用
  China.018.desc: "（待填充）"
  China.018.a: "（待填充）"

  China.019.title: "马家军叛乱"
  China.019.desc: "前往南方支援的部队已经跨过了长江，并且迅速建立防线准备防御革命党的突击，然而我们把太多西北地区的驻军派遣到了平叛部队中，造成了西北防御空虚，那帮马娘也趁机举起了反旗，他们仍可能有下一步动作。"
  China.019.a: "你反你马呢？！"

  China.020.title: "帝国崩溃"
  China.020.desc: "尽管帝国军队在长江沿岸成功阻挡了革命分子的前进，但是大神州依然免不了进入了最黑暗的时刻，革命党————现在他们自称为“国民党”已经在南方宣告了国民政府的成立，预计在稍加休整后便会再次进攻，而我们不确定还能否抵挡住，西南地区曲总督还无法与中央取得联系，东北的张作玲也在整军备战，意图颠覆帝国的统治，马家军虽然尚无进一步进攻迹象但也在扩军，边疆各个都司也都切断了与中央的联系。神州大地已经再次分崩离析，难道大神州也逃离不了王朝周期律的影响吗？"
  China.020.a: "不，我们必然会重新一统！"

  China.021.title: "清算时刻"
  China.021.desc: "血月悬于午门，袁氏鹰犬尽出。黎星刻虽已被“畏罪自尽”，其党羽名录仍呈于摄政王案头。是夜，京畿军校生二十七人遭装甲车围捕，北京报馆主笔被枭首于京沪列车，天津造船厂总办“意外”坠入熔炉——清算如瘟疫蔓延。\n晋军重岳公然陈兵边塞，南直隶总督更调炮舰锁江。袁克定狞笑撕碎勤王讨贼檄文，津沽码头昼夜不停的卸下武器。平叛军令盖上了监国玺印，他亲添朱批：“晋省匪帮皆坑之，南直隶逆党尽绞之，降卒不留，焦土三寸。\n曹公当年血洗徐州，方有北方靖安。今日炮火犁地，便是本帅的仁政！”窗外，剿匪大军正登车开赴前线。"
  China.021.a: "宁可错杀百万，不可放过一营。"
  Innovation_Alliance_illegal: "§C革新联盟§!将会定为§R非法§!"

  China.022.title: "[FROM.GetName]送来一批武器"
  China.022.desc: ""
  China.022.a: "皇上的恩情还不完啊！！！"

  China.023.title: "牢笼与困兽"
  China.023.desc: "子时三刻\n紫禁城地底传来石板滑动的闷响。皇家内卫统领千岱芷从奉先殿密道钻出，黑衣上沾满百年陈苔。她轻叩门楂，三长两短——这是唯有世代效忠蒋氏的死士才懂的暗号。女帝蒋丽华正被座钟齿轮声困在梦中，忽觉腕间一凉。千岱芷已跪在榻前，以匕首割断绣金龙纹帐为绳，将小皇帝负于背上：“陛下，臣来晚了，恕臣死罪。”二人身影没入密道时，鎏金鸟笼中的南洋鹦鹉尚在啼叫“万岁”。\n几日后，西山古柏深处，竟聚集起千余众，皆是千岱芷在近段时间汇聚的暗卫密探，千岱芷以剑代笔，在雪地划出进军路线：“经大同往太原，晋军都统重岳尚忠……”\n忽有鸦群惊飞。袁克定的北军骑侦队如鬼魅般掠过山脊，“不过是群前朝遗老闹事！”骑侦队长叼着烟卷嗤笑，“将此处据点上报元帅，又是一份大功。"
  China.023.a: "希望袁贼没有发觉吧"

  China.024.title: "受命于天"
  China.024.desc: "为了做实摄政王的威名，袁克定近几日都在亲率部队，剿灭反抗她摄政的乱党，当她听说在西山又有千余众聚众反抗时，当即点兵两千向西山而去。\n当北方军开始围剿时，一人身穿龙袍，骑高头大马，提三尺长剑，身披不合身的战甲的纤细身影来到阵前，俨然是“软禁”在紫禁城中的天子蒋丽华。连在营帐中的袁克定都吓得直接站起，完全没想到这位天子会逃出层层包围的紫禁城。\n两军军阵陷入异常的安静中，蒋丽华拔出宝剑指向天际，一声龙吟划过长空，一缕阳光冲破乌云照在这位年轻的天子身上。\n“朕乃神州皇帝，受命于天！军中莫非无我神州忠臣？朕意已决，请诸君随朕死战，讨伐袁逆，为江山社稷计，为黎民苍生计！”\n故去的历史仿佛照进现实，有是一次司马家故事？"
  China.024.a: "报君黄金台上意，提携玉龙为君死"
  China.024.b: "我们受的是元帅恩，吃的是元帅粮"

  China.025.title: "革新联盟崩溃"
  China.025.desc: "时过境迁，天下没有不散的宴席。奉天殿的琉璃瓦尚映着平定袁逆的庆功焰火，革新联盟却已在文华殿悄然一分为二。立宪民主党员则把《帝国宪政论》推至案前，公车学子将《皇权永固疏》轻放于丹陛，双方相互长揖及地。\n公车派、立宪民主派迁入文华殿两侧。两派仍共享紫禁城水道，甚至差役依旧每日互换报纸。只是奏章开始分送两处批红，国会议政庭钥匙被铸成阴阳双符。\n最后一次联席会议结束时，白发苍苍的会长康佑薇为众人斟茶：章程既改，便依君子之争。他吹熄议事厅中央的牛油烛，在明明灭灭的星火里轻叹。"
  China.025.a: "诸位，之后再见就是对手了"
  Innovation_Alliance_collapse: "§C革新联盟§!将会分类为§C$CHI_Cadets_party$§!与§g$CHI_GongChe_party$§!，其影响力也会被瓜分。"

  China.026.title: "王业不偏安"
  China.026.desc: "神州浩土，自古岂有裂疆而王？昔光武起于河北，昭烈奋于巴蜀，皆以尺土不复为耻。今两广虽陷，然江南财赋之地犹存，岂可效六朝划江自守？\n遍观史书，偏安者岂有久存者？南宋临安歌舞百年，终覆于崖山海涛；东晋衣冠南渡数代，终丧于桓玄之乱。帝王之业，在德不在险，在统不在分！\n逆臣袁克定，挟权乱政，祸国殃民，陛下以幼龄履极，临危不惧，幸赖列祖列宗庇佑，忠臣义士用命，终平袁克定之乱。\n如今当承华夏千年社稷之重，当效高祖北伐之志，收河朔劲卒，揽江淮豪杰，以天子旌旗指问天下。昔洪武帝以布衣取天下，岂况今具龙兴之资乎？\n愿效诸葛亮“汉贼不两立”之誓，使日月所照，复归龙旗！"
  China.026.a: "天命终在神州，帝统永耀华夏！"

  China.027.title: "挟天子以令诸侯"
  China.027.desc: "奉天殿汉白玉阶前，摄政王袁克定命亲卫将皇家内卫统领千岱芷押至殿前。女帝蒋丽华惊立龙椅，手指掐入鎏金扶手中。\n“孤听闻千卿虏皇于西山？”袁克定把玩着德国赠的鎏金手枪，十五岁的女帝唇色惨白，仍挺直脊背：“是朕...”\n军靴踏上玉阶，袁克定忽将手枪奉至御前：“陛下若言此人无罪，便请亲执此铳毙了臣。”满殿文武只见少女天子颤抖着握住枪柄，枪口在袁克定与千岱芷间剧烈摇摆。终于哐当一声坠地。\n“看来陛下已圣心独断。”袁克定轻笑挥手，宪兵当即拖走千代纸。午门外的断头铡落下，声震殿宇，他俯身拾起手枪，用绣龙衮服拭净扳机处胭脂痕。“\n汉献帝衣带诏时，曹公竟只诛董承？明日便将那些内卫全部“换防”到叛军前线。”"
  China.027.a: "孤袁克定亦当效魏武旧事。"

  China.028.title: "保皇救国"
  China.028.desc: "在袁克定夺权的几夜后，数十青袍文人装扮之人悄聚于南山古刹中。血诏自宫墙缝中传出，卷着御榻金丝的杏黄绢上仅八字：“祖宗基业重，臣子赤心同。”\n香炉底压着的盟单渐显名姓：有前朝白发尚书以朱砂按印，有南洋侨领汇镖银入户，更见新式学堂教授手书《君宪救国论》。众人皆缄口不语，唯将随身玉玦投入铜瓮——俄顷清响盈室，如碎冰击磬。\n盟成于子时三刻，无歃血亦无誓词。惟见住持展开《山河社稷图》，诸公伏地三叩。残烛摇曳里，无数身影默然消散于夜雾，仅余满地玉屑与一篇无署名《保皇檄》，首行墨迹如血：“欲存国脉，先护天颜。”"
  China.028.a: "何人为救皇，何人为保己呢？"

