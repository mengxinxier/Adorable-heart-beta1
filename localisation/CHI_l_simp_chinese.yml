  junfa_idea_desc: "我们尚未取得国家合法性，在世界上难以有一席之地。"
  junfa_idea2: "有实力的地方割据政权"
  junfa_idea2_desc: "我们尚未取得国家合法性，在世界上难以有一席之地。"
  CHI_famine_1: "连年灾荒§R（尸横遍野）§!"
  CHI_famine_1_desc: "去年年底爆发的席卷包括一些主要粮食产区在内的中国各地数百年不遇的重大旱涝蝗灾让该国持续已久的混乱局面雪上加霜，人民生活几乎已经降到了历史最低点，到处都是绝望的灾民还有遍地腐烂到发臭的饿殍。毫无疑问，这个国家正在经历着它最为黑暗和混乱的时期。"
  CHI_famine_2: "连年灾荒§R（易子相食）§!"
  CHI_famine_2_desc: "持续的灾荒已经让慌不择路而又饥不择食的灾民们彻底疯狂。经过灾荒的残酷打击，他们的口粮已经完成了从草根到树皮，从麻雀到乌鸦，甚至是从老鼠到腐尸的转变。但是随着灾害侵袭和政治动荡的逐渐减缓，各地的救灾工作似乎也已经提上了日程......"
  CHI_famine_3: "连年灾荒§Y（五谷不生）§!"
  CHI_famine_3_desc: "各地灾区已然十室九空，毫无生机。万般无奈之下，很多人选择背井离乡，他们开始奔向附近每一个他们能去的地方。与此同时，随着各派势力分化组合，公开的政治分裂大大减少，政治家们也开始把目光更多放在各地的救灾工作上......"
  CHI_famine_4: "连年灾荒§G（颠沛流离）§!"
  CHI_famine_4_desc: "中国本身依旧是一个落后的农业大国，自然灾害导致的粮食欠收牵动着中国脆弱的神经"
  CHI_famine_5: "连年灾荒§G（防微杜渐）§!"
  CHI_famine_5_desc: "经过政府下达的救灾政策的逐渐推行以及各地绅民的不懈努力之下，各地灾情开始出现好转的迹象，流民导致的社会混乱也在治理之下有所减轻，如果事情照目前的趋势发展，这次饥荒也许不久后就会结束，整个国家也会开始一点点步入正轨。"
  CHI_Deformed_industry_1: "畸形的工业"
  CHI_Deformed_industry_1_desc: "自洋务运动以来，我国的军工企业管理方式依旧是封建衙门式的，效率低下，民用工业在官僚的干涉和外企的冲击下也是羸弱不堪。这一点在改革变法过后依然没能有效解决。\n§Y工业化等级（1/6）§!"
  CHI_Deformed_industry_2: "畸形的工业"
  CHI_Deformed_industry_2_desc: "自洋务运动以来，我国的军工企业管理方式依旧是封建衙门式的，效率低下，民用工业在官僚的干涉和外企的冲击下也是羸弱不堪。这一点在改革变法过后依然没能有效解决。\n§Y工业化等级（2/6）§!"
  CHI_Deformed_industry_3: "畸形的工业"
  CHI_Deformed_industry_3_desc: "自洋务运动以来，我国的军工企业管理方式依旧是封建衙门式的，效率低下，民用工业在官僚的干涉和外企的冲击下也是羸弱不堪。这一点在改革变法过后依然没能有效解决。\n§Y工业化等级（3/6）§!"
  CHI_Deformed_industry_4: "畸形的工业"
  CHI_Deformed_industry_4_desc: "自洋务运动以来，我国的军工企业管理方式依旧是封建衙门式的，效率低下，民用工业在官僚的干涉和外企的冲击下也是羸弱不堪。这一点在改革变法过后依然没能有效解决。\n§Y工业化等级（4/6）§!"
  CHI_Deformed_industry_5: "畸形的工业"
  CHI_Deformed_industry_5_desc: "自洋务运动以来，我国的军工企业管理方式依旧是封建衙门式的，效率低下，民用工业在官僚的干涉和外企的冲击下也是羸弱不堪。这一点在改革变法过后依然没能有效解决。\n§Y工业化等级（5/6）§!"
  CHI_Corrupt_and_incompetent_army: "腐败无能的军队"
  CHI_Corrupt_and_incompetent_army_desc: "我们的军队深受腐败和裙带关系的影响，战斗力低下，急需进行大刀阔斧的改革。\n§Y军事改革等级（[?CHI_army_reform_level]/5）§!"
  CHI_Uncertain_future: "时局不安"
  CHI_Uncertain_future_desc: "在历经了数百年的国祚后，曾经开创过盛世的神州帝国已经腐朽不堪，革命党人力量逐渐壮大，朝廷内部争权夺利愈发加剧，政令不出京城也成为常态，而去年年底爆发的大饥荒更是给帝国沉重一击。未来的一切都无法预料..."
  CHI_Stagnant_modernization: "停滞的现代化"
  CHI_Stagnant_modernization_desc: "设厂局，练新军，兴学堂，格致之学稍兴，然变法半途，新旧相轧。守旧恃神器而威，以“中体西用”自囿；革新力薄而势孤，欲破千年之窠臼而不得。遂致机巧日新而政枢如故，电火轮舟驰骋寰宇，而帝室威权、士绅旧制，坚若磐石。洋务之器虽备，维新之魂未铸，神州之进境，遂滞于新旧之交，金龙虽巨，锈迹已生矣"
  CHI_Stagnant_modernization_1: "停滞的现代化"
  CHI_Stagnant_modernization_1_desc: "设厂局，练新军，兴学堂，格致之学稍兴，然变法半途，新旧相轧。守旧恃神器而威，以“中体西用”自囿；革新力薄而势孤，欲破千年之窠臼而不得。遂致机巧日新而政枢如故，电火轮舟驰骋寰宇，而帝室威权、士绅旧制，坚若磐石。洋务之器虽备，维新之魂未铸，神州之进境，遂滞于新旧之交，金龙虽巨，锈迹已生矣"
