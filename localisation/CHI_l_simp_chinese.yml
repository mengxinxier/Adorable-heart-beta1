  chi_main_party: "主要派系"
  chi_main_party_desc: "§S棋局中央§!\n--------------------------------\n§L在围棋的棋盘上，中央区域是战略争夺的核心，一子落下可辐射四方，牵动全局走势——这恰如主要派系在权力格局中的地位。它们占据政治生态的枢纽位置，拥有制定核心规则的话语权，其主张与行动如同棋盘中央的厚势，既能稳固自身根基，又能向各领域渗透影响力。如同围棋中“金角银边草肚皮”的终极博弈往往落于中央，主要派系的存在决定着整体格局的走向，其他派系的进退皆需围绕其核心策略展开，是棋局中无可争议的主导力量。§!"
  chi_minor_party: "次要派系"
  chi_minor_party_desc: "§S棋局边缘§!\n--------------------------------\n§L围棋边缘的星位、小目虽非战略核心，却能通过边角的稳固形成势力延伸，为中央博弈提供呼应或牵制——这正是次要派系的生存逻辑。它们分布于权力格局的非核心领域，虽不具备主导全局的能力，却能在特定议题或局部范围形成独特影响力，如同边角的棋子通过拆边、立二拆三拓展空间。次要派系既可能成为主要派系的协作力量，填补政策执行的缝隙，也可能在平衡博弈中扮演关键的“劫材”角色，其存在让整体格局更具弹性，避免权力过度集中导致的僵化。§!"
  chi_illegal_party: "非法派系"
  chi_illegal_party_desc: "§S棋局之外§!\n--------------------------------\n§L围棋对弈有明确的落子规则，超出棋盘边界的“虚子”不被承认，更无法参与棋局博弈——这恰似非法派系在正统权力体系中的处境。它们游离于既定的政治框架之外，其主张与行动不被主流认可，如同棋盘外的棋子既无法获得合法的影响力空间，也不能参与规则内的博弈。这类派系的存在往往被视为对现有秩序的潜在冲击，如同围棋中“禁着点”般被排斥，其活动难以进入权力核心的视野，却可能在规则的灰色地带形成隐秘的局部影响，始终处于被规范或遏制的状态。§!"
  chi_party_illegal: "§R非法§!"

