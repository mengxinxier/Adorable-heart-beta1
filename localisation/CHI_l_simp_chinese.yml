  CHI_Crisis_of_CHI_Dynasty_modifier_desc: "神州承清庭残弊，虽有锐意之举，然阡陌之间，富者田连万顷，贫者地无立锥。及至饥寒之众起于陇亩，遂使戍卒叫，函谷举；更兼兵权下移，藩镇坐大，外重内轻之势已成。人地之患未纾，割据之祸又作。民变与兵乱相激，中枢与方镇相疑，此乃社稷倾颓之始也。"

