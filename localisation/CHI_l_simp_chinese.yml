  CHI_gambling_of_JSZ_desc: "江浙之地，自古为华夏腹心，其势若棋盘天元，得之可纵横天下，失之则如断脊之龙。\n江浙非止一城一地，实为集天时（海运开埠）、地利（山河形胜）、人和（财阀士绅）于一体的“帝国缩影”。昔范仲淹称其“上有天堂，下有苏杭”，今当谓“得苏杭者得天堂，失江浙者失江山”。军阀若欲逐鹿中原，必先握此金腰带，方可勒马问鼎。\n\n@CHI§O[CHI.GetNameDef]§!的点数：[?global.gambling_of_JSZ_var_CHI]\n@ROC§3[ROC.GetNameDef]§!的点数：[?global.gambling_of_JSZ_var_ROC]\n§Y太平军§!的点数：[?global.gambling_of_JSZ_var_TPA]"
