  CHI_Taiyuan_Pacification_Office_desc: "太原绥靖公署主任：\n--------------------------------\n\n\n\n\n\n\n£GFX_CHI_Chongyue\n\n\n\n\n\n\n\n--------------------------------\n§L为了抵抗来自西方的叛军，神州帝国设立了太原绥靖公署统管陕西山西两省军政事务，除负责指挥军事外，还负责控制该地区的政治、经济和社会活动。§!"
