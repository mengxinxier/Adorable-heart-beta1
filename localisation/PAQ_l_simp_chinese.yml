	PAQ.14.t:"[PAQ.GetAdjective]索取瓦洛庞"
	PAQ.14.d:"阿德莱希在第六次希洛战争失利后，丢失了包括瓦洛庞在内的大量领土，十年后的现在，她们的外交部向我们通牒归还她们的核心领土，国内绥靖派与主战派意见不一，我们要听从她们的要求吗"
	PAQ.14.a:"想要就来吧"
	PAQ.14.b:"不妨还给他们"
	PAQ.15.t:"[PAQ.GetAdjective]索要边境领土"
