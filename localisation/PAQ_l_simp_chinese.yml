#角色与介绍
 PAQ_WLA_DESC: "薇莉安是阿德莱希皇室中年龄最小的妹妹，然而作为小公主的她并没有得到太多宠爱。出生在强者至上国度的少女，因没有王位继承权便从小被兄长与姐姐们嘲笑，欺负。而拥有雄心壮志的父亲也更看好他年长的孩子们。至于薇莉安的母亲，则早在分娩时离世。从小在被欺压的环境下长大的薇莉安，性格逐渐变得暴躁。由于在皇宫内没有朋友，她经常跑到城里去和那些下贱的平民玩耍。被姐姐们发现后的嘲笑使她的性格更加步入极端，而她也因此在无意间得到了混沌之神的瞥视。在第四次扩张战争失败后，哥哥姐姐们拼死争夺皇位时，她终于得以与混沌的神明对话，并得到了它们的认可，获得了强大但可怕的力量，并最终通过一系列血腥手段登上了皇位。如今，为了报答混沌的恩赐，同时也是为了证明自己的能力，在内部彻底安定后，她将对整个南美发动一场浩劫般的战争。也许这场战争会摧毁南美的一切，但对她来说，那又能如何呢？"
