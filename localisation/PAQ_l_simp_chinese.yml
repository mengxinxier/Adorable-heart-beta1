	PAQ.1.t:"星月战争"
	PAQ.1.d:"如果我们想要击败莉兰迪亚，建立属于我们的秩序，就必须扩张国家的领土和势力。艾尔孚利登王国就是一个很好的目标，她们的工业化刚刚起步，其军队根本没有抵御大规模装甲的能力。当然，我们不需要担心会遭到其他国家的反对，因为莉兰迪亚也窥视星月许久"
	PAQ.1.a:"星月战争！"
	PAQ.2.t:"征战号令"
	PAQ.2.d:"多年以来，艾尔孚利登王国一直是我们向西前进的巨大障碍，她们骁勇善战的军队让我们的骑士们吃了不少的苦头。不过，我们通过在科技与武器装备上的领先抵消了她们在身体素质上的优势，这次我们胜券在握。"
	PAQ.2.a:"星月战争！"
	PAQ.3.t:"白蛇九十九神社条约"
	PAQ.3.d:"[PAQ.GetAdjective]的人与我们是同宗教同种族，以前都是一个国家的人，但因为老一辈的失误导致了分裂，现今世界，即使意识形态不同，也未必就彼此为敌，她们的大使想要签署一条秘密的条约，她们承诺将在打败莉兰迪亚后将星月西部给予我们换取信任与友好，我们是否同意呢？"
	PAQ.3.a:"姑且同意"
	PAQ.3.b:"暂时考虑考虑"
	PAQ.4.t:"玖方女子学园条约"
	PAQ.4.d:"[PAQ.GetAdjective]想要用她们的钢跟我们换铬我们是否同意？"
	PAQ.4.a:"姑且同意"
	PAQ.4.b:"暂时考虑考虑"
	PAQ.5.t:"给予西部？"
	PAQ.5.d:"我们承诺占领星月西部后给予[PAN.GetAdjective]土地是否给呢？不给的话瓦社可能会向我们进攻？"
	PAQ.5.a:"给！"
	PAQ.5.b:"瓦社她们有几个师？"
	PAQ.6.t:"给予星月领地"
	PAQ.6.d:"不敢相信她们竟然言而有信"
	PAQ.6.a:"好"
	PAQ.7.t:"背弃承诺"
	PAQ.7.d:"[PAQ.GetAdjective]果然帝国主义的人都一个样！忍不了，今天一定要给他们爆了"
	PAQ.7.a:"消灭帝国杂碎"
	PAQ.8.t:"多兰贸易协定"
	PAQ.8.d:"[PAQ.GetAdjective]想要与轴心国签署贸易协定，她们物产丰富，我们是否要签署呢？"
	PAQ.8.a:"签！"
	PAQ.8.b:"我们暂时没有需求"
	PAQ.9.t:"[PAQ.GetAdjective]留学装甲团"
	PAQ.9.d:"[PAQ.GetAdjective]她们在我们这里学习了三年的装甲师最终迎来了毕业考，成绩非常优异，今日将是她们回国之时，我们是否要尽我们的东道主的礼仪送他们点装备呢？"
	PAQ.9.a:"送点过时装备意思意思"
	PAQ.9.b:"挑点新武器让他们反馈使用数据"
	PAQ.9.c:"给点特制中坦，助你们武运昌盛"
	PAQ.10.t:"模仿德械"
	PAQ.10.d:"[PAQ.GetAdjective]向[GER.GetAdjective]赠送了她们自主生产的武器，虽然看上去是仿造我们的武器，但意外的耐用，我们要给她们怎么回复？"
	PAQ.10.a:"律师函警告"
	PAQ.10.b:"好评如潮"
	PAQ.10.c:"做的很好下次不要在做了"
	PAQ.11.t:"[GER.GetAdjective]危难时刻"
	PAQ.11.d:"[PAQ.GetAdjective]听说[GER.GetAdjective]马上要跟[DVL.GetAdjective]进行战争向我们秘密的派遣了5个精锐装甲师，这对我们来说非常有帮助，虽然她们不如我们的装甲师"
	PAQ.11.a:"之后还她们10个"
	PAQ.11.b:"好好好"
	PAQ.11.c:"我们记下了"
	PAQ.12.t:"[GER.GetAdjective]战败了"
	PAQ.12.d:"[PAQ.GetAdjective]的好朋友战败了，这无疑是噩耗，我们索性联系到了藏匿起来的德皇，郑重的邀请她来我们国家，由我们来实现阳光下的土地！"
	PAQ.12.a:"这次我们要作为新的帝国莫希斯回到德意志"

	PAQ_ALXO:"复兴同盟"


	PAQ.13.t:"[PAQ.GetAdjective]邀请我们一同对抗秩序协约"
	PAQ.13.d:"远交近攻对我们来说没有坏处，虽然我们并不认同阿德莱希军国主义，但之后的事情等莉兰迪亚战败后我们在考虑之后的事情吧"
