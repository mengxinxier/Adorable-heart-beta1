#事件
paq.1.t: "大萧条波及南美"
paq.1.d: "作为南美为数不多的工业国，我们不可避免的遭受了大萧条带来的影响。"
paq.1.a: "我不想听这些消息！"
paq.2.t: "选择主要信仰"
paq.2.d: "女皇需要选择一个混沌神明作为帝国的主要信仰，这会让我们得到该神明的赐福并极大改善与该神明的关系，除了立刻获得的赐福之外，在之后的事件中我们也可以获取各种相对应的增益。同时，我们之后有一次更换主要信仰的机会，但更换主要信仰会严重损害我们与前主要信仰的关系。所以在选择主要信仰前，务必思考周全。"
paq.2.a: "战争"
paq.2.b: "诡计"
paq.2.c: "色欲"
paq.2.e: "长生"
paq.3.t: "更换主要信仰"
paq.3.d: "更换主要信仰会极大损害与前信仰神明的关系，请谨慎选择！"
paq.2.f: "我不换了"
paq.4.t: "选择次要信仰"
paq.4.d: "除了主要信仰之外，我们还可以选择一位神明作为次要信仰：虽然我们可以获得该神明的赐福效果，但我们无法从事件中获得其对应的增益，同时也无法获得次要信仰的最高赐福效果。次要信仰无法更换，想好了再做选择。"
paq.5.t: "战争赐福升级"
paq.5.d: "我们就是战争的化身，战争之神非常赞赏我们的行为。"
paq.5.a: "太好了"
paq.6.t: "战争赐福降级"
paq.6.d: "战争之神认为我们不够勤奋，撤回了此前给予的赐福。"
paq.6.a: "这不该发生"
paq.7.t: "战争赐福升级"
paq.7.d: "战争之神收回了此前对我们的惩罚。"
paq.8.t: "战争赐福降级"
paq.8.d: "我们严重激怒了战争之神，我们的赐福变成了诅咒！"
paq.9.t: "诡计赐福升级"
paq.9.d: "我们就是阴谋的化身，诡计之神非常赞赏我们的行为。"
paq.10.t: "诡计赐福降级"
paq.10.d: "诡计之神认为我们缺少计策，撤回了此前给予的赐福。"
paq.11.t: "诡计赐福升级"
paq.11.d: "诡计之神收回了此前对我们的惩罚。"
paq.12.t: "诡计赐福降级"
paq.12.d: "我们严重激怒了诡计之神，我们的赐福变成了诅咒！"
paq.13.t: "色欲赐福升级"
paq.13.d: "我们就是色欲的化身，色欲之神非常欣赏我们。"
paq.14.t: "色欲赐福降级"
paq.14.d: "色欲之神认为我们涩涩次数太少了，收回了此前给予的赐福。"
paq.15.t: "色欲赐福升级"
paq.15.d: "色欲之神收回了此前对我们的惩罚。"
paq.16.t: "色欲赐福降级"
paq.16.d: "我们严重激怒了色欲之神，我们的赐福变成了诅咒！"
paq.17.t: "长生赐福升级"
paq.17.d: "我们就是永生的存在，长生之神非常支持我们。"
paq.18.t: "长生赐福降级"
paq.18.d: "长生之神认为我们不够虔诚，因此撤回了此前给予的赐福。"
paq.19.t: "长生赐福升级"
paq.19.d: "长生之神收回了此前对我们的惩罚。"
paq.20.t: "长生赐福降级"
paq.20.d: "我们严重冒犯了长生之神，我们的赐福变成了诅咒！"