	PAQ.18.t:"学园祭召开"
	PAQ.18.d:"从1000年就存在的一年一度的学园祭比武马上就要召开了，从上到下都非常激动，传说这次女王陛下也会参观这次比赛的决赛，我们不得不认真的准备了！"
	PAQ.18.a:"是的女王陛下"
	PAQ.19.t:"斗技大会火热进行中"
	PAQ.19.d:"这一届学生都非常不错，显然是法器的作用和老祖宗的魔法传统起到了决定性作用，你们应该为此感到自豪！接下来，为了报效祖国而加倍努力吧！"
	PAQ.19.a:"是的女王陛下"

	PAQ.20.t:"女王法案"
	PAQ.20.d:"企业再正常情况下不得让魔女的余孽工作超过7小时，不许歧视该阶级。"
	PAQ.20.a:"这条法案有点问题吧？"
	PAQ.21.t:"星月会议"
	PAQ.21.d:"星月再历史中十分强大，但如今已经辉煌不再，我们理应保护他们不受邻国的侵犯，我们现在有两种方案一种是保护并强化她们的实力，这会花费我们大量的时间，另一种是直接军队入驻艾尔孚利登王国，她们一定不会同意，可能会造成无谓的伤亡"
	PAQ.21.a:"不必大动干戈"
	PAQ.21.b:"艾尔孚利登王国自古以来就是我们的一部分"
	PAQ.22.t:"阿德莱希的邀请"
	PAQ.22.d:"尊敬的星月女王，诚挚的邀请你们跟我们组成同盟，为了保护你们的安全我们将给予你们经济和军事援助"






	PAQ.22.a:"我们思考一下"
	PAQ.22.b:"行"
