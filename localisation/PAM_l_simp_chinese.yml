 #结算事件
PAM_end_title: "§O此刻，这喧嚣即是永恒§!§!"
PAM_end_tip: "莉莉安娜就站在我的右手边。她双手紧紧地、近乎执拗地攥着那根从我胸口延伸出来的、发着微光的银色丝线。那双倒映着万家灯火的眼睛里，只装得下我一个人。那种眼神就像是一个怕黑的孩子，终于抓住了她唯一的烛火。\n“……傻瓜，抓那么紧干嘛，我又跑不了。”我嘟囔着，举起酒杯，隔着琥珀色的酒液看着她。虽然我的舌头已经尝不出麦芽的苦味，但这一刻，有一种比烈酒更烧喉的东西，顺着那根线，直接灌进了我的灵魂里。\n那是被锁住的安全感。是确信自己这只孤魂野鬼，被这根细细的线，死死地拴在了这个热气腾腾的人间。\n我冲她咧开嘴，露出了一个混蛋又幸福的坏笑，把酒杯举到了她面前。\n她也笑了，眼睛弯成了两道温柔的月牙，手里的丝线，却攥得更紧、更用力了一些。\n这就够了。只要这根线不断，只要这锅肉还热着，只要她的眼睛还看着我……\n这场甜美的宴席，就永远不许散场！"
PAM_end_tip_2: "感谢您对钢铁萌心与莉兰迪亚王国内容的喜爱与支持！\n愿每一个在荒原上流浪的灵魂，终能找到那个愿意将你锁在人间的羁绊"
PAM_end_close_button: "§O再来一杯！§!"
PAM_end_close_button_TT: "§L敬这个……把我们所有人拴在一起的、吵闹的好世界。§!"

PAM_end_title2: "§t此刻，故事归于尘土§!§!"
 
PAM_end_tip2: "风终究还是吹灭了那盏从未真正点燃的烛火，将这场漫长的、虚妄的盛宴，彻底卷入了被遗忘的深渊。\n我坐在那张早已腐朽的长桌尽头，看着晓枫的指骨在风中无声地化为齑粉，看着雪伊怀中抱着的铁锈随风散去，看着小果子那张脆裂的海图在空气中崩解为尘埃。那只名叫百灵的黑鸟，发出了最后一声凄厉的啼鸣，随即撞向了并不存在的窗户，消失在虚无的惨白光芒里。\n最后，爬向那座空荡荡的王座。那里没有温度，没有拥抱，更没有那根银色的丝线——在那个我编织的、甜美得令人心碎的梦里，莉莉安娜曾坐在那里，用那根线死死地牵了索拉娜一生一世。而我，只是那个躲在角落里，看着她们幸福、以此取暖的……多余的影子。\n现在，梦醒了，连影子也该消失了。\n我的怀里死死抱着那本已经在此刻化为白纸的童话书。在这片被时间与神明共同遗弃的荒原中心，用尽灵魂最后的一丝力气，对着这无边的死寂，写完了那个……从来就不曾存在过的结局：\n§t“很久很久以前……有一位笨拙的骑士……”§!"
 
PAM_end_tip2_2: "感谢您对钢铁萌心与莉兰迪亚王国内容的喜爱与支持！\n因为注定经受百年孤独的故事，不会有第二次机会在大地上出现。"

PAM_end_close_button2: "§t……她，真的拯救了所有人。§!"
PAM_end_close_button2_TT: "§L荒草掩埋了诗篇，往事在尘埃中枯萎。§!"
