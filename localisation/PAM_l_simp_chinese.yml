PAM_GATHERING_STORM_DESC: "在莉兰迪亚那金碧辉煌却曾散发着腐朽气息的王宫中，如今回荡着的是粗鲁的祝酒歌与轰鸣的交响。那位自称为狼王的索拉娜，正毫无顾忌地将双脚搁在镶满宝石的饭桌上。她从那个永恒寂静的夜莺之国叛逃而来，盗走了足以颠覆生死的权能，只因她无法忍受那完美却冰冷的死寂。\n对于莉兰迪亚的旧贵族而言，她是窃取王位的恶魔，是摧毁礼教的洪水猛兽；但对于贫民窟里那些曾像她一样为了半块面包而与野狗争食的底层暴民来说，她是唯一一位肯把贵族粮仓的大门踹开、将热腾腾的肉汤端到乞丐面前的狼王。她鄙夷那些高高在上的理想与主义，她只信奉最原始的生存法则：只有锋利的牙齿才能咬断锁链，只有填饱了肚子才配谈论尊严。\n然而，这场喧嚣的盛宴之下暗流涌动。虽然她用雷霆手段将野火驱赶进了寒冷的矿山，虽然她用恐惧与利益暂时驯服了贪婪的军团，但她胸膛里那颗并不属于她的心脏，正发出一阵阵令人心悸的搏动。那是来自冥界的呼唤，是那个被她背叛、却又深爱着的寂静正在逼近的脚步声。\n索拉娜必须让这个国家保持运转，必须让这台战争机器发出震耳欲聋的轰鸣，因为她深知：一旦喧嚣停止，那足以吞噬一切的寂静就会追上她。为了证明自己正如烈火般活着，她必须带领她的狼群，去撕咬，去征服，去发动一场……永不散场的狂欢。"

