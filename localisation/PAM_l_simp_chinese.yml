PAM_lqzs_desc: "“这就是我最喜欢的战术——躲在暗处，趁人不备，一口咬断喉咙。\n它们就像海里的狼，平时看不见，一出来就要命。”"
PAM_sky_wolfpack: "苍穹之上的狼嚎"
PAM_sky_wolfpack_desc: "“我要让那引擎的轰鸣声变成凄厉的狼嚎，我要让那黑压压的机翼彻底遮住太阳！”"
PAM_lqjj: "狼群经济学"
PAM_lqjj_desc: "这是一个令传统经济学家发疯，却让军事家胆寒的怪胎。\n索拉娜的贪婪是这就台机器的引擎——她不知疲倦地通过征服和掠夺，将源源不断的燃料倾倒进国家的熔炉里。\n而野火的理性则是这台机器的传动轴——晓枫的算盘、雪伊的枪口和小果子的海图，确保了这些带血的财富没有被挥霍在宴会上，而是被精准、高效地锻造进了战争机器的齿轮中。\n它既拥有强盗的爆发力，又具备工业流水线的持久力。在这套体系下，每一颗子弹都带着掠夺的渴望，每一袋面粉都经过了严酷的计算。\n这就是狼群的最高生存法则：“不仅要有一口咬断喉咙的利齿，更要学会……如何连骨头带肉，彻底地消化猎物。”"
PAM_mflqb: "黑狼大军"
PAM_mflqb_desc: "经过战火的洗礼，活人已经习惯了与死人为伍，死人也学会了配合活人的步伐。这支军队终于摆脱了混乱，变成了一支令整个世界战栗的、完美的恐怖军团。"
PAM_wllg: "亡灵劳工"
PAM_wllg_desc: "“挖矿？修路？这种累得要吐血的活儿，为什么要让活人去干？活人的肩膀是用来扛枪的，活人的手是用来抓肉吃的。\n去，把那些从坟里爬出来的‘骨头架子’都赶到矿井里去。它们不知疲倦，不怕砸，也不会喊累。\n让它们日夜不停地干！把金子、铁矿都给我挖出来！而我的活人们……你们只需要站在旁边，拿着鞭子，看着这些死鬼替你们卖命，然后等着领钱就行了。这就叫享福，懂吗？”"
PAM_jsc: "寄生虫的垂死挣扎"
PAM_jsc_desc: "听听，多刺耳。那些曾经在我的宴会上像狗一样摇尾巴的贵族，现在因为我要收回赐给他们的肉骨头，竟然敢冲着我龇牙了。\n他们在烧毁账本，炸毁桥梁，甚至试图把工厂的机器拆了卖给外国人。他们以为这样就能威胁我？以为离了他们那套腐朽的管理，我的国家就会瘫痪？\n哈！真是群蠢猪。他们不知道，对于狼群来说，还在挣扎的猎物……肉质才最紧实，嚼起来才最有味道。"
PAM_syzy: "实用主义扫盲班"
PAM_syzy_desc: "“晓枫跟我说，大炮上面的说明书要是看不懂，再好的炮也是废铁。虽然我听了想睡觉，但……她说得对。\n以前我不识字，被那帮贵族骗得团团转，签了卖身契还帮人数钱。我不许我的子民也这么蠢！\n传令下去，全都给我去上课！不学诗歌，不学废话。只学怎么看路牌，怎么读合同，怎么算清楚别人有没有少给你工钱！\n谁要是敢在课堂上睡觉，我就罚他去抄写‘我不想当傻子’一千遍！连我都开始学了，你们有什么资格喊累？”"
PAM_syzy2: "实用主义扫盲班"
PAM_syzy2_desc: "“晓枫跟我说，大炮上面的说明书要是看不懂，再好的炮也是废铁。虽然我听了想睡觉，但……她说得对。\n以前我不识字，被那帮贵族骗得团团转，签了卖身契还帮人数钱。我不许我的子民也这么蠢！\n传令下去，全都给我去上课！不学诗歌，不学废话。只学怎么看路牌，怎么读合同，怎么算清楚别人有没有少给你工钱！\n谁要是敢在课堂上睡觉，我就罚他去抄写‘我不想当傻子’一千遍！连我都开始学了，你们有什么资格喊累？”"
