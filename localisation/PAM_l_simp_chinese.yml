PAM_cqyzxyl:0 "从前有只小野狼"
PAM_cqyzxyl_desc:0 "落雪把林子里的土穴遮得不见踪迹。有一只饿极了的小野狼跑了出来，因为害怕夜里的风雪，在冷飕飕的林子里拼命地跑，踩碎了一路松软的枯叶。大家都怕它，说它是个坏脾气。其实野狼要的并不多，不过是一口热乎乎的粥，和一个可以安稳打盹的草窝。现在，夜莺在树梢上落了下来。夜莺会为它唱一首安稳的歌，风雪就再也吹不进来了呢。"

 PAM_fbywcs:0 "今早的风又把它吹散了"
 PAM_fbywcs_desc:0 "昨夜里，有几个不听话的小淘气包，不小心把墙壁给熏脏了。风把烟雾吹散后，连叶子都累得垂下了头。没关系，夜莺会带着大家，用清水把那些黑黑的痕迹一点点擦干净，再重新画上漂亮的小花。看呀，大家换上了干净的衣服，水渠也修好了，等春天一到，花儿就会开得整整齐齐。"

 PAM_gnllyjwan:0 "给你留了一句晚安"
 PAM_gnllyjwan_desc:0 "听，起风的夜晚，窗子已经关好了。夜莺在安静的走廊里慢慢地走，在每个人的枕边，都留了一句甜甜的晚安，还有散发着甜香的糖果。不要想那些黑漆漆的梦，也不要为明天的太阳担心。因为这本书里的故事很长很长，会把冷雨都挡在外面。闭上眼睛，听话，好吗？"

 PAM_zyjxdxh:0 "一朵不会凋谢的花"
 PAM_zyjxdxh_desc:0 "在温暖的屋子里，我们来找些有趣的事情做吧。衣服上的破洞漏着风，看着好生可怜，夜莺提着小篮子，分发一捆捆彩色的线绳。一针一针地在衣服上绣一朵小红花，或者绣一只笨拙的灰麻雀。线头穿过去，衣领和袖口便重新齐整了。工人们穿着新衣去作坊里忙碌，连风吹在身上都是暖和的。"

 PAM_gxxszbz:0 "跟着哨子齐步走"
 PAM_gxxszbz_desc:0 "沟壑里的冷雨停了，可风里依然有些吵闹。那些在泥水里乱撞的士兵，可真让夜莺伤脑筋。既然大家认不得路，夜莺就含起一枚小小的木哨，吹出好听的调子。一，二，抬起脚；一，二，落步子。跟着木哨的节拍，排成整齐的长队，像书里的木偶兵一样，在林子里静悄悄地行军。雾散了，肩膀靠在一起，就再也不会走丢了。"

 PAM_ytl:0 "雨停了"
 PAM_ytl_desc:0 "云雾散开，石路上的积水终于退了下去。阳光落进院子里，把风里的潮气都晒干了。那些躲在屋里不敢出门的人，推开窗户探出头。风里闻不到火烟味，只剩泥土里新草抽芽的干净气息。大家来到檐下，把洗干净的衣服搭在绳子上，随着暖风摇晃。这场雨总算过去了，庭院里也该种些新的花草。"

 PAM_wmhjb:0 "我们回家吧"
 PAM_wmhjb_desc:0 "故事写到最后一页，墨迹已经干了。索拉娜，别再扭扭捏捏了，过来坐着，尝一颗刚摘下来的果子。外面听不到哭声，作坊的烟囱里飘出一缕白烟。在写好的故事里，每个人都在安稳地生活，不用再担心寒冬。热闹的戏演完了，往后的日子，才刚刚开始。"

 PAM_slrzhg:0 "可山里还燃着火光"
 PAM_slrzhg_desc:0 "听说，在风刮过的山沟里，还藏着几捧不听话的余火。大雪把山路封了，迷路的人聚在一处，在风里冻得发抖。那些人以为，点起一堆篝火，就能把天上的太阳喊回来。可那烟气飘散开，有些扫兴。让侍从们带上毛毯与炭火，去那片不见光的山谷里，把那些快要冻死的孩子，一个一个找回来。"

 PAM_chyjswl:0 "但柴火已经烧旺了"
 PAM_chyjswl_desc:0 "屋里的炉火生起来了，干柴在灶膛里噼啪作响。夜莺在长椅上铺了软和的垫子，还在锅里温了热粥。故事的书页已经翻开，正等着那些迷路的人呢。别再跑了，外面的雪那么厚，山谷里连个能躲风的草窝都没有。进来吧，解下那些用来防身的刀子与佩枪，靠着火，安稳地睡个好觉。炉子旁边，早就为你留好了位置。"

 PAM_ghsbzl:0 "拉着手，一起前往下一章"
 PAM_ghsbzl_desc:0 "“卡卡罗姆的山风今晚已经停了。那些抱着柴火、在风雪里打冷颤的人，不用再为了寻找明天的太阳而迷路。夜莺已经为这幕戏定下了结局。卫队带着她们眼中的希望出发，去合上那扇虚掩的门窗。吹散那些快要熄灭的灰烬，抱着那些无处可去的生灵，送入暖洋洋的屋子里。等天亮了，长长的峡谷里就会长满不会凋落的花。闭上眼睛，故事要讲完了。晚安，索拉娜。晚安，野火。”"

 PAM_dmckz:0 "大门已经敞开"
 PAM_dmckz_desc:0 "信丢在一边，落了些发黄的茶渍。原本在厅堂里指手画脚的贵人，如今换了身不合身的布衣裳，安分地坐在门槛的小凳上，甚至开始剥地里刚刨出来的花生。屋外很静，泥水顺着台阶流下去。热茶端上来了，双手捧着碗，听不见皮鞭落下的声响。既然大家都累了，就在檐下歇一歇，听风声慢慢停下来吧。"

 PAM_jbsbql:0 "脚步声变轻了"
 PAM_jbsbql_desc:0 "长廊下那阵沉重的脚步声总算消停了。大门虚掩着，生了红锈的锁挂在门闩上。那些习惯了在风雪里打滚的士兵，如今洗干净了脸，在墙根底下晒太阳，随手用小刀削着一截木头，是做小玩具用的。队伍排得稳当，影子拉在发霉的墙壁上。空旷的大地在夜色里合拢，风吹过去，听不见刀枪摩擦的刺耳声响。"

 PAM_hmxml:0 "闭上眼睛，睡吧"
 PAM_hmxml_desc:0 "山谷里那几捧不安分的火光，已经收拢了。在雪地里挨冻的孩子，如今被接回了暖和的屋里，围着暖炉打着瞌睡。炉膛里的火苗落了下去，木炭红亮，把被角烘得有些发烫。屋檐上的风声听不真切了，窗缝里渗进一两声淡淡的虫鸣。喝完了碗里剩下的热汤，就在这安稳的暖意里，闭上眼睛睡吧。在这个写好的故事里，不会再有寒冬。"

 PAM_cbddml:0 "茶杯都倒满了"
 PAM_cbddml_desc:0 "看呀，茶杯都倒满了。虽然长桌旁还空着位置，但衣服上的脏东西已经洗干净了，屋里也生起了暖身的炉火。索拉娜，去给新来的伙伴分一碗热汤。在这间安详的屋子里，大家围在火炉旁，终于可以坐在一起，好好地聊一聊了。"

 PAM_tzwyxkyl:0 "同在屋檐下看月亮"
 PAM_tzwyxkyl_desc:0 "索拉娜，闭上眼吧，拉住我的手。这具新化的身体，会一直陪在身边，一步也不会走远。莉莉安娜已经放下了王冠，我也收起了寂静的死气。从今天起，这个吵闹又温暖的世界，是我们共同的花园。死者归于安息，生者迎来黎明。我们牵着手，坐在高处，静静地看着那轮清亮的月光，直到故事的尽头。"

 PAM_dckal:0 "小船靠上岸"
 PAM_dckal_desc:0 "海上的风浪，总算消停了。在大洋里漂泊了许久的小海鸥，如今在暮色里回到了避风的港湾。不要去想那些风暴与巨浪了，安稳地睡一觉吧。今晚，夜风不会吹进屋里来。"

 PAM_lbwmydf:0 "篱笆外面有大风"
 PAM_lbwmydf_desc:0 "听说，篱笆外面起了大风。那些吵闹的邻居不安分，总要在院门外发出刺耳的声响，会吵醒刚睡下的好孩子。既然窗外的风安静不下来，就在院落四周，多种些带刺的灌木。修好门，合上窗。风雪挡在篱笆外面，屋里新长的花草才能安稳。这不过是为了大家安睡，可不能算是欺负人呀。"

 PAM_qzymwtb:0 "请在院门外停步"
 PAM_qzymwtb_desc:0 "如果，有谁不听劝，非要翻过低矮的篱笆，踩坏刚长出来的小草。那夜莺可就要生气了。守夜的侍从们已经换上了好看的新衣，静静地指在每一个路口。这些听话的士兵，不会去抢别人的地盘，可若是有人非要跨过门槛，就不得不请那些不速之客，在风雪里好好睡上一觉了。"

 PAM_ghrzgc:0 "给花儿捉个虫"
 PAM_ghrzgc_desc:0 "听说，北边的阿德莱希生了病，那里的叶子发黄枯萎，天空落了好多黏糊糊的败叶，顺着大风尽往我们的院门缝里钻。这可真是不讲究。好端端的街道，要是沾了脏东西，打理起来是特别麻烦的。别怕，夜莺这就带着卫队去一趟。生了虫子的枝丫，就该用剪子细细剪掉，染了脏污的角落，就得彻底冲洗干净。等捉完了虫，春天开出来的花，才愈发好看呢。"

 PAM_smxyc:0 "神明也嫌吵了"
 PAM_smxyc_desc:0 "听说，北边的神明临走时，把那个曾经威风的使者，像坏掉的玩偶一般丢在了雪地里。别哭了，小公主。那些在耳边指手画脚的呓语，今后，再也听不见了。外头的风停了下来，来，就在这里安稳地睡上一觉。神明已经走远了，可这里，还有你的位置。"

 PAM_ssmhcb:0 "绅士们，请回船吧"
 PAM_ssmhcb_desc:0 "大洋对岸的绅士们，乘着白船，又来院子前指手画脚。这真是不礼貌。那些人以为像从前一样，用几张契约就能分食这里的土地。如果，那些魔法少女执意要和绅士们站在一个台子上，那卫队也只好请那些在云端飞翔的人在客房里闭上双眼。要是那个总是独自穿梭在时间里的小姑娘当了头领……唔，夜莺很喜欢那双在黑暗里不肯熄灭的眼睛。既然都是在长夜里找路的人，就请来桌子旁，分一碗暖和的清茶。新故事的本子很大，容得下两只飞累了的鸟儿。"

 PAM_mtyyynh:0 "明天也一样暖和"
 PAM_mtyyynh_desc:0 "夜风吹过去，院子里的花全都开了。索拉娜，去给刚醒过来的新来者分块糖吧。战火歇了，大雪停了，街上重新摆好了长长的桌子。这一次，连那个在海上漂泊的小果子也回到了避风的座位。大家终于可以长久地聚在一处。安稳地将故事书合上吧。明天的太阳会照常升起，而且，明天也一样暖和。"


 PAM_dzedzfh:0 "肚子饿得真发慌"
 PAM_dzedzfh_desc:0 "肚子饿得发慌，胃里的酸水不断向上涌着。隔壁庄园里的灯火亮了整夜，风里送来烤牛肉和新面饼的香气。那些戴着金饰、喷着香水的贵人，在大殿里开怀大笑，却连一小口发霉的剩饭，都不肯扔到篱笆外头。当时便咬着牙发誓，等哪天能站起来了，定要让那些坐在高椅上的贵人，也尝一尝在大雨里饿到发疯的滋味。"

 PAM_zylmsr:0 "庄园里埋着死人"
 PAM_zylmsr_desc:0 "公爵写字的手很干净。卡纸上盖满了一圈圈印子，就像是刚流出来的血。公爵甚至不用亲自去挥鞭子。只要随手勾一勾笔，整个村子要交的麦子就翻了番，几十个孩子就要饿死在雨天的稻草堆里。在那些高贵者的眼里，穷人的性命贵不过一张废纸。穷人成了一行行可以随意勾销的数字，是用来换取金钱的干柴。这笔血债，公爵府的人算得很明白，可底下的死人，也算得很明白。"

 PAM_mymzbcj:0 "磨一磨这柄长剑"
 PAM_mymzbcj_desc:0 "屋里暗得很，灶膛里的一点火星早就熄了。我抱来一块磨刀石，搁在膝盖上。长剑在石头上来回打磨着，发出刺耳的摩擦声。这声响在夜里听着清晰无比。公爵府的老爷们以为，挨了打、被抢了口粮的叫花子，只会躲在阴沟里咽气。可饿极了的野狼，只要还有一口气在，就会咬断路人的脖颈。我要洗净手上的血，让这生锈的剑刃，重新获得能够切开皮肉的锋芒。明晚，大家要去夺回属于我们的粮食。"

 PAM_xzxlh:0 "血债血来还"
 PAM_xzxlh_desc:0 "既然大雨洗不脱脖子上的血印，那就用长剑，把这笔账算个清楚。我攥着刚抢回来的钥匙，在夜色里高高举起。人们拿起钢钎和木棍，跟在我的长剑后面。让孩子们吃上热饭，让大家在屋里睡个安稳觉。至于庄园里欠下的债，血债血来还。"

 PAM_lsys:0 "让我们来算一算"
 PAM_lsys_desc:0 "灯火摇晃，映着铺开的图纸。原本在贫民窟里长大的孩子，如今穿上了军团挺括的制服，指梢在粗糙的纸面上缓缓移动。风往哪边吹，哪里的山石容易剥落，看一眼，就全记在脑子里了。军官们都夸那是天生的奇才，送来成箱的黄金。可每当她手掌按着纸卷，听着帐篷外头传来的靴子摩擦声，心里却落了一层怎么也拂不去的灰。图纸上随手画下的线条，到了明天，都会变成流满鲜血的壕沟。那些所谓的完美伏击，底下垫着的，全是活生生的人。这笔沉重的债，该怎么算呢？"

 PAM_cyjz:0 "长夜将至"
 PAM_cyjz_desc:0 "红线落在山脊上，画得笔笔直直。年轻的参谋的确指出了正确的路，也找准了唯一的突破口。在天亮后的大雨里，这道红线会变成重炮合拢时的圈套，堵死所有生路。军官们会因此弹冠相庆，在长桌旁高声吹捧这神乎其技的远见。可她的手还在不听使唤地打颤。笔尖划过的地方，风在外面吼着，那些无处可去的生灵，今晚是最后一夜睡在木屋里了。既然已经交出了答案，就只能闭上双眼，等候长夜彻底黑下去。"

 PAM_hglcp:0 "火光连成了片"
 PAM_hglcp_desc:0 "雨幕里，南边那座堆满谷子的库房，突然亮起几道红光。火舌沿着木梁往上爬，浓烟在黑夜里铺展开来，连大雨都无法将其浇熄。公爵府的看守临逃前扔了火把。既然带不走粮食，老爷们便下了狠心，要将满仓的麦子烧成灰烬。火光照红了天空，烧焦的烟气在风里散开，那是绝望的起点。"

 PAM_tlyq:0 "天亮以前"
 PAM_tlyq_desc:0 "雨落在大屋后头，砸出了浑浊的印子。废墟上空旷得很，粮食都烧干净了，落成了满地的灰烬。一个个湿透的衣衫贴在一个个人的脊背上，发梢的水也一滴滴流进了她们的眼睛里。原本该带回营房的人们，如今就在眼皮底下缩着，等候着绝望给予她们最后一击。功劳就在跟前，只要把这些人押回去就能到手。可我握着缰绳的手，到底还是没能抬起来。毕竟，天亮以前，总要有人为这些迷了路的人，寻找一条出路。"

 PAM_zswmdqz:0 "这是我们的旗帜"
 PAM_zswmdqz_desc:0 "教堂地窖里潮得厉害，墙角长着些暗绿的霉斑。工人们聚在油灯底下，椅子上堆满了从罐头厂带回来的围裙、从码头扯下来的麻袋片。既然路口被封死了，连讲道理的嘴都被捂住了，我们就用双手去拼一条活路。我从挎包里摸出缝针，将这些零碎破布缝在一处。红的，蓝的，拼成了一面宽大的旗子。等这面布旗升起来的时候，炉子里的火，就会变成烧透整片荒原的野火。"

 PAM_hwzjsqll:0 "怒火终将燃起"
 PAM_hwzjsqll_desc:0 "火生起来了。沉寂了许久的烟囱，在夜色里吐出第一口白烟。拉响汽笛的人就站在阀门旁，满脸是汗地冲着外面招手。监工的皮鞭和锁链丢进煤堆里，化成了飞灰。我们的手心在发热，连迎面吹过来的风都是热的。拧开这沉重的阀门吧，要让这火光，照亮整个街道。"

 PAM_cmzslh:0 "参谋长也说了谎"
 PAM_cmzslh_desc:0 "地窖的桌上搁着一顶缀着银鹰徽的军帽，那是军团参谋长的身份。晓枫低着头，双手在布带间交错，缠在伤口上，不声不响。一旁的雪伊靠在门框边，随手折断了一根柴火。\n“天就要亮了，长官。”雪伊拍了拍手心里的木屑，语气里带了些嘲弄，“军团的报告上，只写着‘全歼乱党’。可这地窖里却藏着那么多活人，回去要怎么交差呢？”\n晓枫收回手，抚平了布带的褶皱。\n“公爵要的是结果。至于纸面底下多出几个活人，没人会闲的没事去数的。”\n原本要在街头交锋的军团参谋长与起义首领，如今在这间昏暗的地窖里，悄悄捂热了这桩欺瞒军部的大谎。"

 PAM_dysxxq:0 "等雨声小下去"
 PAM_dysxxq_desc:0 "风刮得没先前那么凶了，门槛上的滴水声断续作响。索拉娜睡得并不安稳。雪伊在灶底添了几块碎柴，让火星在暗处不断亮着。这间避风的地窖里很静。工人们都靠着墙根打盹，谁也无力再说闲话。大家都在耐心地等，等外头的风雨小下去。等明天，或者等天亮以后。"

 PAM_zlyzhaj:0 "这里一直很安静"
 PAM_zlyzhaj_desc:0 "在这座城堡里，从来听不见风声。圆月高悬在半空，银光将走廊里雕刻的水晶花照得透亮。莉莉安娜独自坐在空旷的厅堂里，裙角在台阶上铺开。挂钟停止了摆动，纸页上落着灰尘。莉莉安娜的世界，唯有无声的平静。尘世的喧嚣进不来这片净土，谁也不会来惊扰这份安宁。"

 PAM_bzlxzty:0 "书本里写着太阳"
 PAM_bzlxzty_desc:0 "翻开图本，纸面上写着“太阳”两个字。莉莉安娜用指梢摩挲着字迹，心头有些新奇。在古老的故事里，太阳升起来的时候，连地上的青草都会染上光芒。可在这里，抬头看去，唯有一轮无声的圆月。不曾见过太阳的人，画不出暖和的颜色。纸页上落着灰尘，莉莉安娜闭上双眼，试着去想象，那个被阳光照亮的世界，究竟会是什么样子。"

 PAM_gflzysc:0 "给风留着一扇窗"
 PAM_gflzysc_desc:0 "书本上写着，风会带着落叶与花香，去到很远的地方。莉莉安娜走过无声的回廊，拉开门锁，推开那扇窗户。窗外是寂静的深谷，可莉莉安娜知道，只要一直留着这道门、这扇窗，终归有一天，那个太阳会顺着风，落到自己的肩膀上。屋里不再那么冷了，故事的下一页，正等在暗处呢。"

 PAM_nstym:0 "那是太阳吗"
 PAM_nstym_desc:0 "静止的池水里，泛起一抹亮光。空气里的寒意散去，身子也暖和起来，不再那么沉甸甸的了。那些落在地板上的灰尘，被风吹着打了个转。莉莉安娜快步走到窗前向外张望。外面空荡无声，不曾有谁走进来，也不曾有谁敲门。太阳未来，这不过是遥远的温度，在深谷里吹过时的余音。"

 PAM_hlslgz:0 "海浪送来个酸果子"
 PAM_hlslgz_desc:0 "海上的风很大。一艘破烂木排在浪里起伏，在夜色里靠上了石滩。巡逻的士兵在沙滩上，捞起了一个衣服湿透的丫头。这丫头小腿上蹭破了皮，伤口糊着沙子，怀里抱着个包，里头揣着半颗啃了一半的酸果子。劝了许久，这丫头就是不肯松手，一双眼盯着哨兵，防备得很紧。把她送回营房里后，我给盛了一碗热水，她也还是靠着墙壁一动不动。往后，这片海岸，大概要多一个吹口哨的兵了。"

 PAM_hfyxfx:0 "当海风吹来"
 PAM_hfyxfx_desc:0 "海风吹在脸上，能尝到一点咸味。小果子手里抓着一个铜哨。海浪一下接一下拍打着她脚底下的石块。含起哨子，鼓起腮帮子，却一点也吹不响，吐出来的全是泄出来的粗气。可这小丫头不服输，一遍接一遍地试着。终于，哨声透过了海雾，在海面上清脆地荡开。就连海鸟都随着声音在头顶飞旋，最终降落在了她的肩膀上。瞧，小果子已经学会在风里，守着这片海了。"

 PAM_hlajxll:0 "雪花落下之时"
 PAM_hlajxll_desc:0 "今天，海浪安静下来了。小果子坐在石堆顶上一动不动。原本吵闹的洋流，在这一刻连水花都平息了。天空中无声地落下了雪花，落在被海水浸湿的衣袖上，化作了一个个湿印子。那些从天而降的寒气，怎么也钻不进这具在海风里吹透了的身体。远方的街道正在变冷，那些熟悉的人也正在闭上双眼。可小果子，依旧在海风里，清醒地看着这一切。"

 PAM_zsxfs:0 "只剩下风声"
 PAM_zsxfs_desc:0 "那些曾一起看海、在风雨里相互依偎的兄弟姐妹，如今都安静地睡去了。营房里彻底安静了下来。在这片寂静的海岸上，只剩我一个还能听见风声的人了。"

 PAM_cdcgdw:0 "车灯就这样穿过了大雾"
 PAM_cdcgdw_desc:0 "车门关严了，发动机沉闷地发动起来。两道车灯穿过大雾，将前头的山路照得晃眼。晓枫两手扶着方向盘，一言不发地盯着前方。小果子坐在旁边的座位上，望向车窗外肆意翻飞的雪。已经无路可退了。我们必须离开这片长眠的营房，在黑暗的荒野上，寻找一条生者的路。"

 PAM_nxxc:0 "南行小船"
 PAM_nxxc_desc:0 "发动机的声音沉息下来。车门刚刚推开，海风便送来了潮湿的凉意。在码头尽头，正有一艘小船在波浪里起伏着。这里的海水尚未结冰，浪花拍打着船舷，发出一声又一声的钝响。晓枫反手掩上车门，拎起那个沉甸甸的布包，踩在了栈桥上。小果子跟在后面，低着头，任凭雨水浇透了衣衫。因为海风还在吹着，因为水还在流动着，逃亡的生路，就依然在前方。"

 PAM_hsdslyj:0 "一张船，一双桨，和一个人"
 PAM_hsdslyj_desc:0 "大雨落在了脸上，海浪不时漫过船帮，船上人的衣襟早已湿得不成样子。\n小果子缩在窄小的船舱里，双手握着桨在风浪里吃力地划着。\n岸边那些哨塔的灯火，在浓雾里已经退了下去，再也看不着了。\n寒意在水面上漫过来，可揣在怀里的半颗酸果子，仍然带着些许暖意。\n狂风在耳边尖啸，小船在夜色里一沉一浮，朝着不见光的深海不断飘去。现在这里只留下了一张船，一双桨，和一个人。"

 PAM_hhkl:0 "快看，这里的花开了"
 PAM_hhkl_desc:0 "大雨落了一整夜，天亮的时候，风声总算小了一些。\n小果子走出石屋，去岸边打水。\n在礁石缝里，积着一些枯黄的草叶。\n而在那些草叶底下，一抹红色晃了晃。我走过去蹲下身，拨开杂草，才看见一朵开在石缝里的红花。\n花瓣有手指大小，在风里固执地昂着头。\n海面上风还在呼啸，可这朵小花，却固执地绽放着。生者的路，到底是有希望的。"

 PAM_zhnhl:0 "现在真的很暖和"
 PAM_zhnhl_desc:0 "露西莉亚并不气馁。解下领口那枚红色挂坠，平稳地递到小果子的手心。\n发着红光的宝石落在掌心，散发着一股暖和、令人安稳的热气。\n在这座寒意彻骨的礁石岛上，这抹光亮如同刚生好的炭火，熏得手上的伤口也有些暖意。\n小果子到底还是让那枚宝石留在了掌心里。\n在夜莺之国那层寂静的风雪里，这是唯一躲过冻结的、属于活人的温度。\n书上写好的剧本漏了缝隙，而这出戏的生路，如今就握在两个不肯认命的丫头手里。"

 PAM_hgfxh:0 "过来，我们换个方向划"
 PAM_hgfxh_desc:0 "风向变了。海水里的凉意退了下去，风从对岸刮了过来，带着一股被太阳晒过的土味。小果子两手握紧桨柄，用力扳动。船头在海浪里转了个半圆，身后的礁石岛越来越远，直到被灰蒙蒙的白雾遮住。小船载着两个人，顺着翻滚的白浪，朝着老码头的方向赶去。哪怕那里现在连个说话的人也找不着，哪怕到处都静得吓人，也得划回去。不能让大家就这么一直睡着。得回去，把认识的人一个接一个全叫醒。"

 PAM_ltc:0 "老铁厂"
 PAM_ltc_desc:0 "水面飘着一层彩色的油花，倒映着岸上高耸的烟囱。小船在荒废的渡口旁靠了岸。空气里多了一股煤烟与铁器的气味，熏得人眼睛都睁不开。露西莉亚将长绳系在铁栓上，当先跨上岸去。小果子抱着胳膊，跟着跨上潮湿的台阶。前方的石墙高大无比，厂房里落满了灰尘，不见半个活人。可听说，那些不服输的工人和水手，如今都缩在底下的防空洞里，靠着残存的煤渣避寒。等身上湿透的衣裳烘干吧，干了之后，大家再来商量，往后该怎么办。"

 PAM_tl:0 "退路"
 PAM_tl_desc:0 "子弹打光了。过道里全是震落的灰，呛得人直咳。那些死者的手指快要够到眼皮了。我丢开打空的长枪，单手拽住墙上的拉杆。锁栓一脱，大块碎石轰然砸落，堆成一道矮墙，把那些亡骸和呛人的灰一并封在了对面。尘烟落定，身后的路已经没了。眼前只剩一条通道，往山腹更深处去。"

 PAM_sxhy:0 "杀向黑夜！"
 PAM_sxhy_desc:0 "那团炙热的执念撞入冷铁，沉寂多年的蒸汽在铁管中疯狂涌动着。小果子拉下阀门，撕裂长夜的啸叫立马冲上了云霄。幻梦在这一刻寸寸崩裂，温度骤降，露出了被霜雪覆盖、残破死寂的真实铁厂。成群的亡灵在厂房外缓缓转过头颅，而我们，无路可退。"

 PAM_bllldy:0 "兵临莉兰迪亚堡"
 PAM_bllldy_desc:0 "小果子退下弹夹，擦拭着枪栓。能用的枪没剩几杆，身边这几百个刚泼醒的贵族，连路都走不稳。现在得去把那个还在睡梦里的暴君拉起来，才能穿过城堡外的防线。小果子讨厌她，可要在这片冰天雪地里活命，眼下只能借那家伙的蛮劲。"

 PAM_cxsqbc:0 "踩着雪水去白城"
 PAM_cxsqbc_desc:0 "长椅上倒着融化了的雪。索拉娜一路上都在数落雪伊当年的倔脾气。小果子端着枪跟在旁边，和她拌了一路嘴。城堡的石砖凉透了。接下来的生路在白城，雪伊就守在那座旧兵营里。夜莺的梦境落下来之前，雪伊就是守在那儿的。得把那个固执的家伙拉起来，才有人手去把剩下的同伴一个一个摇醒。"

 PAM_hsgq:0 "回到卡卡罗姆"
 PAM_hsgq_desc:0 "白城的兵营空了，雪伊姐不在里面。索拉娜倒是醒了，可她现在缩在那身娃娃衣服里，一路上光跟我们生闷气，别想指望她。我和露西莉亚得带着人往卡卡罗姆赶。那里是晓枫姐起事的地方，山谷底下到处是废弃的矿道。当年野火的兄弟姐妹们常往里头躲，晓枫姐说不定就带着雪伊姐藏在哪个坑道里等着呢。得去把她们翻出来。"

 PAM_zhdybzy:0 "最后的一步之遥"
 PAM_zhdybzy_desc:0 "山谷尽头横着一堵死寂的灰墙。大雾凝成了实心的壁垒，把生者的大地与夜莺的无声国度彻底隔断。小果子端着枪一轮轮打过去，露西莉亚挥剑劈了又劈，弹头和剑刃撞上去，连一道白痕都留不下来。夜莺已经把门封死了，她想让这场风暴永远在外面呼啸。要过这道边界，非得有谁豁出命去，把门撞开不可。"

 PAM_hjhjyq:0 "很久很久以前"
 PAM_hjhjyq_desc:0 "那本写着灰暗结局的故事书翻到了最后一页。露西莉亚独自坐在了寂静的王座上。夜莺散去了，这片冰冷沉寂的冥界如今成了她身体的一部分。那些死在雨夜里的遗憾，那些随风落下的哭喊、痛苦与执念在暗处累积，尽数堆积在她的胸口。她替整个世界收留了寒冷，好让活下来的人走在温暖的阳光里。往后的长夜中，她会一个人留在此处，将这个漫长的童话守到最后。"


 PAM_hjb:0 "回家"
 PAM_hjb_desc:0 "我一刻也不敢让自己停下来。大殿门前刚立好那两座新坟，我不敢回头去看。一闭上眼，脑子里就全是落满积雪的大地上流淌的血水。那些被强占的地盘和碍眼的界碑，干脆都扔进火里烧掉好了。等那些被关了很久的人都能平安回家，露西莉亚看到这个结局，肯定会醒过来的吧？晓枫姐，雪伊姐，你们也会看见的，对不对？"

 PAM_djdychd:0 "大家都要吃好的"
 PAM_djdychd_desc:0 "上区的仓库里堆着成山的麦子。以前那些贵族宁可让粮食烂在库房里，也舍不得分给底下的人。小果子把仓库大门推开，分发给在雪地里发抖的饥民。大人一斗，娃娃一升，大家都吃得饱足，肚子饱了，心口也就暖了。\n\n§9我一刻也不敢让手心空下来。我脑子里全是那一枪打出去的声音。我要去搬面粉，搬得浑身是汗，搬得骨头都要散架，这样殿门前的那场梦就缠不上我了。§!"

 PAM_ajahswn:0 "挨家挨户送温暖"
 PAM_ajahswn_desc:0 "风在街上打着旋，把我的眼泪都冻在睫毛上了。我不要闲着，一闲下来，那种死寂在心里压着的触感就又回来了。把老厂里堆着的那些石炭都分发下去，挨家挨户送。烟囱里升起烟，屋里就热了。大火烧起来，暖气会把一切都烘得松松软软。等大家身上都暖了，露西莉亚看到烟，也会醒过来了吧。"

 PAM_fzbhdyf:0 "请缝好避寒的衣服"
 PAM_fzbhdyf_desc:0 "作坊里有成捆的棉纱和毛线。小果子把那些织布机都转起来，让巧手的妇人赶工。剪刀裁开布料，针线穿过去，缝出挡风的衣服发下去。穿着衣服去街上走，风就吹不透了。这才是活人该有的体面。"

 PAM_jdjrz:0 "教大家认几个字"
 PAM_jdjrz_desc:0 "莉兰迪亚的大家大都大字不识，领工钱的时候经常被那帮老爷骗。小果子在营房里摆开了小凳，让读过书的先生教孩子们认字。学怎么看路牌、怎么算账目、怎么写自己的名字。懂了这些，以后走在街上，就再也无人能糊弄她们了。\n\n§9我教那些孩子认字的时候，总觉得只要读书的声音再响一些，那一晚的枪声就能被彻底盖过去。雪伊姐以前总嫌我马虎，可惜以后，再也不会有人来敲我的手背了。§!"

 PAM_bhzlhl:0 "孩子们，都回来吧"
 PAM_bhzlhl_desc:0 "废墟里还有许多无家可归的小孩子，缩在倒塌的板壁底下发抖，活脱脱就是当年索拉娜的翻版。我绝不让他们也死在雨里。把那些空屋子都收拾出来，让他们住进来。每天管饱，有热汤喝。等露西莉亚醒了，看见这些孩子在院子里笑，她心里肯定也是甜的。"

 PAM_gsdzhyy:0 "这是个温柔的故事…是吗？"
 PAM_gsdzhyy_desc:0 "我们已经把这个世界变得很美好了。被强占的土地还回去了，挨饿的孩子吃饱了，街上已经全都是温暖的笑声啦。露西莉亚，我把一切都做好了，你想要的温暖结局，我已经替你拼出来啦。现在，我守在你的身边，拉着你的手。阳光照进屋里来了，你也该醒了。睁开眼吧，露西莉亚。"

 PAM_qzdyd:0 "请再给我一点点时间！"
 PAM_qzdyd_desc:0 "既然写书的人想让这一幕草草收场，那我就化作最后一滴浓墨，强行替大家把这崩裂的结局再往后拖延几个篇章。这份力量很沉重，沉重得压弯了腰，也染白了这满头的长发。可是看啊，前线的喧嚣声、大家的哭脸，每一个还在风雪里挣扎的身影都系在了我的身躯之上，我会守在这里，守到时间的尽头，大家……都还没到闭上眼的时候。"
 PAM_qzdyd_tt:0 "§t刷新此国策的可用次数§!"

 PAM_djll:0 "大家累了的时候，是有地方可以放下的"
 PAM_djll_desc:0 "我能感应到那些顺着大地传过来的律动。有人在夯实地基，有人在播种麦粒。那些劳作而发酸的肩膀，那些看不到明天而生出的胆怯，顺着心的红芒，都被我温顺地抱在了怀里。大家尽管去忙碌吧，去在这片荒原上盖起屋子，去种满庄稼。我替大家记着这些累，替大家守着这些怕。"

 PAM_qgsw:0 "你们想去的地方"
 PAM_qgsw_desc:0 "路边的车马声在耳畔响了一整天。大家聊着春耕的种子，算着给邻里送去的谢礼，这动静里满是凡间的生机。我在这坐着，听大家讲那些琐碎的家常。我愿将选择的权利交还给每一个在长夜里赶路的人，我仅仅是想做一柄在这荒原上撑开的伞。你们想去的地方，便是我落笔的方向。在这场梦结束之前，我会护着大家，一直走到天亮。"

 PAM_djdz:0 "其实大家一直都在呢"
 PAM_djdz_desc:0 "每一处折痕、每一道划线，其实都还留着大家手心里留下的余温。这些念想从未走远，它们化作了土里的根，变成了风里的歌。大家辛苦开出来的这段路，从不该在此处了断。我收拢了这些被遗落在记忆里的笑容，让它们重新落进每一个赶路人的身心里。前方的雾气散了，回头望去，原来我们这一路，始终都是结伴走着的。"

 PAM_btsh:0 "帮她生生火吧"
 PAM_btsh_desc:0 "雪伊在那间阴冷的地窖里待了这么久，骨头都快要冻僵了呢。身为她的同伴，你肯定也舍不得看见她受罪的样子吧？去帮她把炉子生起来，等到火苗亮起，大厅里也会变得温暖起来的。你真是个体贴的好孩子。"

 PAM_djyq:0 "大家要守在一起呀"
 PAM_djyq_desc:0 "外面的风雪里，那些影子正在靠近。既然已经点燃了希望，那便要有足够多的武器来护住这团光亮。请把沉睡着的将士们都喊醒，让她们守在每一个路口。看着你为了同伴这么忙碌，我真的很开心。再努力一下下，雪伊就能听到她心心念念的那个声音了。"
 PAM_yjsy:0 "迎接那个声音"
 PAM_yjsy_desc:0 "汽笛的拉杆就在手边，雪伊咬着牙撑到现在，便是为了等这个声音。去拉响它吧，去迎接你以为的黎明。我会一直看着你，直到故事合上的最后一秒。你为了她付出的每一分汗水，我都记在心里了哦。"

 PAM_qqh:0 "若是能躲过这一场大雾……"
 PAM_qqh_desc:0 "街道边的光亮快要熄灭了，恐惧和倦怠压在心头，大家聚在屋子里，开始聊起一些不着调的传闻。那些关于如何躲过长眠的鬼话，起初仅仅是为了排解压抑才编出来的玩笑，讲的人想必也没打算当真，可这股子还冒着热气的话语，终究还是传到了每个人的耳边。大家都盼着有个宣泄绝望的出口，这种荒诞的话题反倒让大家聚得更紧了些。"

 PAM_szndm:0 "就再陪大家一分钟好了"
 PAM_szndm_desc:0 "紫色的雾气顺着缝隙钻进来，这时候总要有人站出来的。尽管脑海里那个温柔的声音一直在劝自己睡去，她们依然靠着那份偏执的牵挂，将整个身躯都压在门上。她们仅仅是凡人，却要在这一分钟里，去和神明的梦境争个高下。她守护的，是门后那些还在颤抖的生命。"

 PAM_hddxw:0 "那便相信这是一个奇迹吧"
 PAM_hddxw_desc:0 "当保护大家的人也闭上眼，剩下的人们便因为绝望而陷入了泥潭。这时候，那个原本被大家嘲笑的玩笑，竟然成了大家唯独能抓住的救命稻草。这是一种随着过度恐惧而生出的荒唐，也是一种不忍心看着同伴心死而撒下的、带着泪水的谎言。"

 PAM_qscy:0 "不准把长夜带往别处"
 PAM_qscy_desc:0 "在那些遥远的角落里，还有别的死者在躁动，还有不安分的幽灵想要去侵占生者的土地。既然大家都已经在这片风雪里受够了冻，那便更不该让那些无辜的人，也落得跟我们一样的下场。死者就该有死者的去处。不管是谁，若是敢把寒冬带到别处的暖屋前，我们便去敲碎它们的骨架，送它们回到泥土里继续安睡。"


#二线政治结束
#一线政治
PAM_nbyz: "那把椅子太硬了"
PAM_nbyz_desc: "“我不喜欢那些老头子看我的眼神。他们弯着腰，说着我不懂的漂亮话，递上来一堆画满蚂蚁一样黑字的纸。他们以为我看不懂？哈，我当然看不懂！但我闻得出来——那股子发霉的、想要把我架空的臭味，跟当年在贫民窟想要从我手里抢走面包的野狗一模一样。\n把那些文件都拿去烧炉子！告诉他们，在这个大厅里，只有我坐着的时候，他们才能说话。如果谁敢用那些绕来绕去的词儿来糊弄我，我就让他把这把椅子的硬度，用脑门亲自试一遍。”"

PAM_ssnz: "撕碎那些纸！"
PAM_ssnz_desc: "“法律？程序？审批？那是给吃饱了没事干的人玩的迷宫游戏。我要建一道墙，那就是现在、立刻、马上！我要那个工厂转起来，现在就去把那些不听话的监工挂在路灯上！\n我不识字，但我识数。我只看结果：要么把我要的东西摆在桌上，要么把你们的脑袋摆在桌上。这才是一个女王该有的效率，不是吗？”"

PAM_hjbz: "黄金，或者鞭子"
PAM_hjbz_desc: "“我知道那些当兵的想要什么。别跟我谈什么荣誉，什么国家，那都是以前那些贵族老爷骗人去送死的鬼话。我以前也是烂泥里爬出来的，我最清楚——能让人卖命的，只有两样东西：手里沉甸甸的金子，和背上火辣辣的鞭子。\n把库房打开！把那些以前贵族们藏着掖着的宝贝都搬出来！只要她们肯把枪口对准那些叫野火的疯狗，我就给她们金子。如果她们不敢……哼，那我就让她们知道，我这条从地狱里回来的疯狗，咬人有多疼。”"
PAM_hjbz2: "黄金，或者鞭子"
PAM_hjbz2_desc: "“我知道那些当兵的想要什么。别跟我谈什么荣誉，什么国家，那都是以前那些贵族老爷骗人去送死的鬼话。我以前也是烂泥里爬出来的，我最清楚——能让人卖命的，只有两样东西：手里沉甸甸的金子，和背上火辣辣的鞭子。\n把库房打开！把那些以前贵族们藏着掖着的宝贝都搬出来！只要她们肯把枪口对准那些叫野火的疯狗，我就给她们金子。如果她们不敢……哼，那我就让她们知道，我这条从地狱里回来的疯狗，咬人有多疼。”"
