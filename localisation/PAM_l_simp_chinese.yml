PAM_royal_co_op2:0 "妥协的王室"
PAM_royal_co_op2_desc:0 "莉兰迪亚的旧贵族们，如今正生活在双重的恐惧之中。那面在莉兰迪亚起义中高高飘扬的赤旗，是她们挥之不去的噩梦，她们清楚地知道，一旦革命者获胜，等待她们的将是彻底的清算。\n因此，当那个来自“夜莺之国”的前任统治者——索拉娜，登上王座时，她们别无选择。她们向这位浑身散发着死亡气息的新女王献上了忠诚，交出了财富与私人武装。她们用这种方式，换取了在新秩序下苟延残喘的资格。\n对索拉娜而言，这些不过是一群被恐惧束缚的、可以利用的旧时代幽灵。她不信任她们，但她们的资源与名望，是她巩固统治、对抗赤匪的绝佳工具。当然，贵族之中仍有不甘的私语，但当唯一的选择是在断头台和王座的阴影下二选一时，大多数人都明智地选择了后者。"
PAM_royal_co_op3:0 "妥协的王室"
PAM_royal_co_op3_desc:0 "莉兰迪亚的旧贵族们，如今正生活在双重的恐惧之中。那面在莉兰迪亚起义中高高飘扬的赤旗，是她们挥之不去的噩梦，她们清楚地知道，一旦革命者获胜，等待她们的将是彻底的清算。\n因此，当那个来自“夜莺之国”的前任统治者——索拉娜，登上王座时，她们别无选择。她们向这位浑身散发着死亡气息的新女王献上了忠诚，交出了财富与私人武装。她们用这种方式，换取了在新秩序下苟延残喘的资格。\n对索拉娜而言，这些不过是一群被恐惧束缚的、可以利用的旧时代幽灵。她不信任她们，但她们的资源与名望，是她巩固统治、对抗赤匪的绝佳工具。当然，贵族之中仍有不甘的私语，但当唯一的选择是在断头台和王座的阴影下二选一时，大多数人都明智地选择了后者。"

PAM_Flesh_golem2:0 "血肉傀儡"
PAM_Flesh_golem2_desc:0 "这不是莉兰迪亚的魔法。这是一种来自亡者国度的技艺，是索拉娜女王从她过去的王国——“夜莺之国”带来的、最黑暗的遗产。\n它并非简单的复生尸体，而是一座由无数残骸、血肉与痛苦，通过禁忌的仪式强行缝合、扭曲而成的、对生命的嘲弄。活着的士兵拥有忠诚，而忠诚会动摇；她们感受恐惧，而恐惧会让她们溃败。但这些构造体……它们没有思想，感受不到痛苦，只会执行最冷酷的命令。它们是完美的士兵，也是最极致的恐怖武器。\n至于原材料……\n\n§R在一片刚刚经历过血腥起义与残酷清洗的土地上，从来不缺“备用零件”。§!"

PAM_ymjl:0 "野蛮纪律"
PAM_ymjl_desc:0 "“别去征召那些所谓的良家子弟，他们太娇气，挨一顿饿就哭爹喊娘。去贫民窟，去下水道，去那些野狗都不愿意待的地方。\n哪怕他们身上长满了疮，哪怕他们瘦得只剩一把骨头。只要那双眼睛里还冒着绿光，还想吃肉，那就是我要的兵。\n我要把他们从烂泥里拽出来，给他们洗个澡，塞给他们一把枪。告诉他们：从今天起，别再跪着要饭了。想要什么，就自己去抢！就像我当年一样！”"
