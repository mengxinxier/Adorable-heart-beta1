PAM_wldn: "索拉娜"
PAM_wldn_Desc: "§L索拉娜不记得自己作为人类时的名字。她只记得无尽的饥饿、寒冷，以及在贫民窟的泥泞中为了半块黑面包而与野狗争食的卑微。死亡对她而言并非终点，而是一场意外的旅途。当她的灵魂坠入那片名为夜莺的、永恒寂静的国度时，她第一次感受到了力量的诱惑。\n这里没有痛苦，没有饥饿，只有完美的秩序与绝对的宁静。但对索拉娜而言，这份宁静与她曾经历的死亡同样冰冷。她的灵魂深处，燃烧着一团永不熄灭的、名为“不甘”的火焰。她不愿就此沉寂，她要将命运重新握在自己手中。\n她见到了那个国度的公主，莉莉安娜。一个纯粹、强大却又无比孤独的存在。索拉娜在那双寂寞了万年的眼眸里，看到了自己实现野心的阶梯。她用生者世界的故事去诱惑她，用自己灼热的灵魂去温暖她，用毫无保留的忠诚与爱意去麻痹她。她成为了莉莉安娜唯一的色彩，唯一的知己，唯一的……弱点。\n她们曾有过温存的时光。在那片没有阳光的国度里，索拉娜几乎以为自己会沉溺于那份独一无二的占有之中。但每当她闭上眼，贫民窟那冰冷的泥泞，就会再次将她淹没。她明白，安逸只会消磨她的火焰，而她要的，是足以焚烧整个世界的烈焰。\n最终，在那个数千年一次的同调仪式上，她毫不犹豫地露出了自己的爪牙。她盗走了“夜莺之心”的权能，那份足以颠覆生与死秩序的绝对力量。她将莉莉安娜的错愕与心碎，连同那个永恒寂静的国度，都彻底抛在了身后。\n她回到了生者的世界，来到了莉兰迪亚。她用强大的力量与冷酷的手段，轻易地夺取了这个腐朽王国的王座。在这里，她终于拥有了她梦寐以求的一切——财富、权力，以及一个可以在阳光下实现的、建立不朽帝国的梦想。\n但她偶尔，也会在深夜里惊醒。\n§W她会下意识地，回头望向那片……她再也回不去的、永恒的黑暗。她不知道自己究竟是在畏惧那个被她背叛的、破碎的君主的追猎，还是……只是单纯地，怀念着那份曾属于她一个人的、纯粹的温暖。§!§!"

