PAM.74.t: "拴在同一根绳上的蚂蚱"
PAM.74.d: "“……综上所述，关于战后资源分配的系数控制，以及针对边远地区的修正案，我已经列出了三个可选方案。”\n晓枫合上了那本厚得像砖头一样的计划书，揉了揉眉心，看向坐在长桌尽头的我。她的眼睛里虽然透着疲惫，但依然闪烁着理性的光芒。\n会议室里很安静。雪伊在擦枪，小果子在剥橘子，而我……\n我正皱着眉盯着晓枫递给我的那张图表。那上面画满了红红绿绿的线条，还有一大堆像蝌蚪一样的字符。晓枫她们虽然教会了我写名字，但这种高深的东西，对我来说还是跟天书没什么两样。\n“那个……晓枫啊。”我清了清嗓子，指着图表上那个最高耸的波峰，试探性地问道，“这个尖尖的玩意儿……是不是代表我们要去炸哪座山？还是说……这是我们要修的那个超级大烟囱？”\n晓枫愣了一下，无奈地叹了口气，嘴角却勾起一抹早就习惯了的笑意：“头儿，那是通货膨胀的预警线。意思是，如果我们再像以前那样无节制地发钱，钱就不值钱了，大家手里的票子买不到面包，会饿肚子的。”\n“哦……那就是吃撑了的意思嘛。”我恍然大悟，随手把那张价值连城的经济蓝图扔到一边，往椅背上一靠，“直说不就行了？非要整这些弯弯绕绕的词。”\n要是以前，我早就拍桌子骂人了。我会说：“谁敢饿肚子？老子去抢回来！”\n但现在，我摸了摸胸口。那里没有狂躁的跳动，只有那根真实存在的银线，正温柔地连接着我和莉莉，也连接着这屋子里的每一个人，甚至……连接着窗外每一个正在搬砖的工人。"
PAM.74.a: "……"

PAM.75.t: "拴在同一根绳上的蚂蚱"
PAM.75.d: "我闭上眼，感受着那根线的重量。那种感觉是一种……沉甸甸的、名为牵挂的拉力。\n“晓枫，你的那些道理我听不懂。但我懂这根线。”\n我重新睁开眼，目光扫过在场的每一个人，声音变得低沉、平缓，带着一种粗糙却深刻的哲理。\n“以前我觉得，分配就是我吃肉，你们喝汤，谁抢到算谁的。但现在……莉莉把我拴住了。我发现，如果我不走，莉莉就走不动；如果我摔倒了，莉莉也会疼。”\n“这个国家，不也是这样吗？”\n我站起身，拉着莉莉走到地图前，用手指在上面画了一个巨大的圈。\n“以前的贵族，觉得自己是住在天上的云，穷人是地里的泥，八竿子打不着。所以他们敢把泥踩烂，敢把泥当饭吃。”\n“但现在，我们都在这张网里。如果那个种土豆的老农饿死了，那根拴在她身上的线就会断。线断多了，这张网就破了。网破了……我这个坐在网中间的狼王，也会摔得粉身碎骨。”\n我转过身，看着晓枫，露出一个带着点匪气、却又无比真诚的笑容。\n“所以，别跟我说什么系数了。我的规矩只有一条：别让线绷断了。”\n“不管是那个开工厂的老板，还是那个扫大街的乞丐。你要想办法，让这根线变得有弹性。老板赚多了，就拽紧点，让她吐出来点给穷人；穷人活不下去了，就松一松，把上面的油水流下去点。”\n“我们不是要搞什么绝对的平均，那不现实，狼群里也有头狼和跟班。但我们得保证……当最后一只小狼掉进坑里的时候，头狼能感觉到绳子的拉力，并且……有力气把它拽上来。”\n晓枫看着我，眼神里闪过一丝惊讶，随后变成了深深的敬佩。她合上笔盖，站直了身体，向我敬了一个标准的军礼。\n“……您是对的，头儿。这就是社会的本质——只是您用绳子，讲得比任何教科书都透彻。”\n“哈！那是！”我得意地翘起二郎腿，随手抓起小果子剥好的一瓣橘子扔进嘴里，“毕竟……我现在可是被‘拴’得最有经验的人啊。”"
PAM.75.a: "“这绳子比鞭子管用多了。”"

PAM.76.t: "悬在头顶的神像"
PAM.76.d: "万国会议的长桌旁，死一般的寂静。坐在这里的是工会主席、脸上带着硝烟的游击队长，以及从废墟中选出的平民代表。她们战战兢兢地看着我，面前摆着那份厚厚的、写满了漂亮话的《永久和平条约》。\n“和平？”\n我端着酒杯，看着窗外那片已经被我统合在同一面旗帜下、正在呼吸的巨大世界，发出一声刺耳的嗤笑。\n“你们以为，靠这张擦屁股都不够硬的纸，靠你们签几个歪歪扭扭的名字，就能锁住人心里那头贪婪的野兽？”\n“嘶啦——”\n在所有人惊骇欲绝的目光中，我单手将那份代表着文明与秩序的条约撕得粉碎。纸屑像雪花一样洒在红地毯上，像极了旧时代的骨灰。\n“别用那种眼神看着我。我知道你们在想什么——你们在想，我索拉娜才是那个最大的野兽，我才是那个因为贪欲而吞噬了整个世界的暴君。”\n我站起身，黑色的狼皮大衣如同一片乌云笼罩了会场，来自冥界的幽光在我眼中跳动。我拉着莉莉走到她们面前，靴子踩在那些纸屑上，声音低沉、沙哑，却像重锤一样砸在每个人的心口。\n“没错。我发动战争，是因为我饿；我吞并邻国，是因为我贪。我想要这世上所有的金子，我想要所有的粮仓。我从不否认这一点。”\n“但你们这些蠢货，能不能动动脑子想一想——正是因为我的贪欲大到了极点，大到吞下了整个世界，这个世界才终于安静了！”\n我猛地一掌拍在桌子上，震得酒杯乱颤，红酒洒出，宛如鲜血。\n“以前，有一万个小领主在争抢一块面包，所以天天流血，所以你们的孩子会饿死。现在，面包全归我了，所有的面包都姓索拉娜！而我……把面包分给了所有人。这才是秩序的真相！”\n“在这个世界上，必须有一个绝对强大的、已经吃饱了的、无法被杀死的怪物站在顶端，下面的小鬼才不敢为了剩饭而互相撕咬！我，就是那个怪物！”\n“我是亡灵，我是不朽的。这就意味着，我的贪欲已经封顶了，我不会再变老，也不会再变得更贪婪。我就坐在这里，像悬在你们头顶的月亮，永远看着你们。”\n“只要你们乖乖干活，让我的子民——也就是你们自己——吃饱穿暖，我就只是个传说，是挂在墙上的画像。”\n“但是……”\n我俯下身，在那位颤抖的工会主席耳边，留下了如同神谕般的低语：\n“如果未来哪一天，你们当中有人忘了曾经饿肚子的滋味，想要变成新的贵族，想要从别人的碗里抢食……那就抬头看看天吧。”\n“我会从月亮上跳下来。我会用当初吞噬旧世界的牙齿，把这颗新长出来的毒瘤，连根拔起，嚼得粉碎！”\n“这就是我的道理。哪怕它是暴论，也是这片土地上唯一的真理。”\n我重新举起酒杯，对着这群被恐惧和安全感同时击中的人们，露出了一个狂妄至极的笑容。\n“为了……一个再也不需要狼的明天。”\n“干杯！”"
PAM.76.a: "（举杯）敬……永恒的守望者。"

PAM.77.t: "永不散场的全家福"
PAM.77.d: "今晚的王宫露台没有风，只有满溢出来的、暖烘烘的烤肉香气。\n我（索拉娜）瘫坐在那张加宽的王座上，手里晃着半杯金色的蜂蜜酒，视线有些模糊地扫过眼前这帮家伙。\n晓枫正坐在那堆成山的战利品清单旁边，眉头紧锁地算着帐。她一边抱怨着这场庆功宴吃掉了半个月的预算，一边却趁没人注意，把一块最好的奶酪偷偷塞进了嘴里。\n雪伊把脚架在栏杆上，怀里抱着那把擦得锃亮的步枪。她像只吃饱了晒太阳的狮子。她瞥了我一眼，一句话也没说，举起酒杯遥遥地敬了我一下。\n小果子已经趴在那张巨大的世界海图上睡着了，嘴角流着口水。那张图上画满了我们要去探索的新航路，但在梦里，她大概已经找到了那个全是糖果的岛屿。\n而在我身后的影子里，那个穿着背带裙的小怪物——百灵，正安安静静地在那里削苹果。她的匕首很快，皮削得连成一串不断。她察觉到了我的目光，抬头冲我眨了眨眼，那是只属于我的、最锋利也最安全的刀鞘。\n突然，我的手背上传来一阵凉意。\n莉莉安娜坐在我身边，手里依然紧紧牵着那根连接着我们生命的银线。她把剥好的葡萄递到我嘴边，那双冰蓝色的眼睛里，倒映着这满屋子的喧嚣，满是笑意。\n“……看什么呢，索拉娜？”她轻声问。\n“看我的财宝。”我含糊不清地嘟囔着，咽下葡萄，“比金子值钱多了。”\n我曾经以为，征服世界就是把所有的土地都踩在脚下。但现在我才明白，真正的征服，是把这群最难搞、最骄傲、最不想活的家伙，统统拴在我的裤腰带上，逼着她们跟我一起活得热气腾腾。\n既然都到齐了，既然都吃饱了……\n“喂！小的们！”我猛地坐直身子，大吼一声，吓得小果子从梦中惊醒，晓枫的笔都掉了。\n“都给老子过来！靠近点！莉莉说要画一张画！”\n“别在那儿装酷了雪伊！晓枫别算了！还有百灵，从影子里滚出来！谁敢躲在边上，我就扣谁明天的肉！”\n她们互相看了看，叹着气，骂骂咧咧，却又无可奈何地聚拢了过来。\n在这群狼、鬼、疯子和理想主义者组成的奇怪家庭中间，我发出了这辈子最狂妄、也最幸福的笑声。\n“听好了！这张画就挂在城门口！我要让全世界都知道——”\n“这就是我的狼群！这就是老子的家！谁敢动这里的一砖一瓦……我们就追到地狱，把他的骨头渣子都扬了！”"
PAM.77.a: "§O（这就是……我们的Happy Ending。）§!"
PAM_all_affection_maxed:0 "§O我们都已紧紧依偎你的身边，\n再也没人会因为伤痛而缺席。§!"

PAM.78.t: "来自作者的一番话"
PAM.78.d: "欢迎来到这片充满奇迹、魔法、革命与战火的土地，我的朋友。\n在您正式开始这场旅途之前，我想占用您一分钟的时间，说明几件小事：\n第一，关于故事的性质：\n虽然我借用了《钢铁雄心》这个以地图填色和政治模拟著称的载体，但我的个人tag（@LHS野火革命军/@PAO夜莺之国/@PAM莉兰迪亚王国）本质上是一个“披着战略游戏外衣的视觉小说”。我更关注的是人物的命运、情感的纠葛以及那个在废墟上重建家园的浪漫故事。\n因此，您可能会发现这里的政治逻辑并不那么硬核，地缘博弈也不那么写实。如果您是一位追求严谨历史推演或深政治叙事的玩家，这里的内容可能会让您感到些许违和。请把它当作一场发生在平行世界的、关于爱与希望（当然还有绝望）的童话吧。\n第二，一个至关重要的警告（请务必阅读）：\n如果您现在选择的国家是 @PAO夜莺之国，并且打算游玩莉莉安娜/露西莉亚的路线……\n请停下！快跑！\n由于当前游戏版本的南美tag更新，导致夜莺之国的旧有流程出现了严重的适配问题。目前的体验将十分坐牢，甚至宛如酷刑。您将面临数值崩坏、事件逻辑卡死以及毫无游戏体验的被推平。\n如果您不想毁掉自己的一天，请暂时放下这段童话，去隔壁看看索拉娜的狼群或是阿德莱希的混沌与野火和魔法少女的革命。等到我做好了这个让人头疼的版本适配，再回来拯救公主也不迟。\n祝您……在这个混乱的大洲里，玩得开心。"
PAM.78.a: "我明白了，开始故事吧。"
PAM.78.b: "我是受虐狂,我想挑战一下版本弃子。"
PAM.78.c: "检测到您缺少抗战到底dlc，为了确保您之后的游戏体验，建议补全，当然即使不补全依然可以进行游玩。"

PAM.79.t: "风中的回声"
PAM.79.d: "来自大西洋的飓风终究还是穿透了那层脆弱的窗纸，将一种古老、干燥且带有咸味的灰尘，灌满了这座宫殿的每一个角落。\n我（露西莉亚）坐在长桌的尽头，举着那只早已冷却的金杯，看着那层厚重的、如同雪花般的灰烬，正缓慢地、无声地覆盖在长桌的每一寸木纹上。刚才耳边那些粗鲁的祝酒歌、油脂爆裂的脆响、以及那个女人狂妄的大笑声，随着风的卷入，渐渐沉淀进了这些飞舞的尘埃里，化作了空气中某种陈旧的震动。\n我眨了眨眼，耐心地等待着下一轮碰杯的声响。\n左手边，那具低垂的骸骨趴在一堆受潮霉变的纸张上，指骨间抓着一支干涸锈蚀的钢笔。那些脆得像深秋落叶般的纸页在风中瑟瑟作响，似乎还在计算着那些关于未来的、宏大而精密的算式。\n右手边，一杆扭曲的步枪依靠着另一具静默的骨架，枪托已经腐烂，枪管里长出的野草枯萎了一季又一季，结出了干瘪的草籽，落在她空荡荡的肋骨之间。\n而那个总是缩在地图下面的小小身影……如今只是一团被海风侵蚀殆尽的破布，怀里紧紧抱着一颗……失去了颜色、像黑炭一样的石头糖果。\n我缓缓转过头，看向那个本该最喧闹、最温暖的位置。\n那里的王座上落满了灰尘。\n扶手上那几道深可见骨的抓痕里，渗着早已变成黑褐色的陈旧血迹，那是某种剧烈的、为了扼杀胸膛里跳动之物而留下的最后挣扎的痕迹。壁炉里的灰烬早已冷却成了结渣，仿佛那团火在一个世纪前就已经燃尽。\n一只黑色的鸟落在椅背上，歪着头，用那双漆黑如墨的眼睛注视着我。它安静地梳理着羽毛，像一位耐心的观众，守着这片废墟上唯一的活物。\n“……大家，吃饱了吗？”\n我对着满桌的尘埃轻声问道。声音在空旷的大厅里回荡，带着一种穿越了无数个世纪的沙哑。\n风卷起地上的灰烬，在空中打着旋，像是谁的衣角轻轻拂过，又像是谁发出的满足叹息。\n我端起那个空荡荡的酒杯，对着王座上那片虚无的空气，对着那个仿佛下一秒就会跳起来骂人的影子，露出了一个微笑。\n“你看……索拉娜。”\n“我把这个童话……讲到了最后。”\n“在这个梦里……大家都留了下来，大家都很开心。”\n“我们……真的很幸福。”\n夕阳终于沉入了地平线，最后一缕余晖也从我的指尖溜走。那本被我紧紧攥在手里的、写满了美好结局的童话书，在风中哗啦啦地翻动着，最终停在了那一片空白的封底。\n那一页干干净净，只留着纸张泛黄的纹理。\n还有一滴……不知是在哪一个瞬间落下，已经彻底干涸、与纸页融为一体的……\n泪痕。"
PAM.79.a: "风，吹散了最后一声钟响"


