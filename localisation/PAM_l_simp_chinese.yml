PAM_call_for_family_photo:0 "§O画下这群混蛋！§!"
PAM_call_for_family_photo_desc:0 "“我都数不清我们赢了多少场仗，抢了多少座金山了。但我突然发现，我最值钱的战利品，好像一直就在这间屋子里转悠。\n那个总是皱着眉头的管家婆晓枫，那个整天擦枪的疯狗雪伊，那个睡得流口水的小海鸥，还有那个躲在影子里的小怪物……当然，还有我的莉莉。\n谁也别想跑。哪怕是死神来了，也得先过我这一关。\n去！把最好的画师给我抓来！我要他把这一刻画下来。告诉他：‘把我们画得开心点，画得嚣张点！’\n我要把这张画挂在世界的最高处，告诉所有人——看啊，这就是老子的家！”"

PAM_mission_xiaofeng_chip_exchange_proposal:0 "§Y参谋长的销赃提案§!"
PAM_mission_xiaofeng_chip_exchange_proposal_desc:0 "“陛下，请看看您脚边那堆积如山的胜利筹码。那是您在外交赌桌上赢来的战利品，象征着您的威慑力和好运气。\n但请恕我直言——运气挡不住子弹，金币也填不饱肚子。如果我们即将发动席卷整个大陆的攻势，这些死物堆在库房里毫无意义。\n我建议……把它们花出去。\n不仅是换成钢铁和石油，更要换成……人心。\n雪伊需要更精良的装备来发泄怒火，小果子需要更精密的仪器来克服恐惧，而我也需要一些……稀缺的孤本资料来完善战术。\n如果您愿意将这些筹码交给我运作，我保证，它们换回来的忠诚与士气，会比黄金更保值。”"
PAM.80.t: "来自四号仓库的电话"
PAM.80.d: "“喂？陛下，是我，晓枫。\n……不，我没在抱怨，我只是刚从四号仓库出来，眼睛被那些反光的东西晃得有点疼。\n您在赌桌上赢回来的那些战利品——那些金筹码、地契、还有别的领主输掉的家徽——已经快把过道堵死了。甚至连雪伊的巡逻队路过都得侧着身子。\n听我说，陛下。运气这东西，如果不兑现成铁和血，那就只是一堆好看的废品。运气挡不住重炮，金子也塞不进枪膛里。\n我刚刚拟定了一份……唔，让我们称之为战略销赃的计划书。既然我们要去撕咬更大的猎物，就得先磨磨牙。\n雪伊那边的火气很大，我们需要更重型的装备来让她发泄；小果子还在对着海上的迷雾发抖，几套昂贵的精密仪器或许能让她安静下来；至于我……咳，黑市上流出了几本旧帝国的绝版战术手稿，我觉得它们比放在收藏家的保险柜里更有价值。\n别再像个守财奴一样盯着那堆筹码傻笑了。把它们交给我运作。\n授权书就在您手边，压在那盘葡萄下面。签了它，我会把这些虚无缥缈的好运，变成您手里实打实的……鞭子和糖。”"
PAM.80.a: "（嘟——嘟——电话挂断了）"

PAM_mission_lilianas_lullaby:0 "§1静谧的安抚§!"
PAM_mission_lilianas_lullaby_desc:0 "莉莉安娜带着那些“夜莺的魂灵”，走进了燃烧的庄园。她要用冥界的寒气压制火焰，用灵魂的歌声瓦解贵族的疯狂。\n但这需要物质的支持——我们需要向那个地区投入大量的民用资源，来证明我们比旧贵族更值得追随，从而从内部瓦解他们的封锁。"
PAM.81.t: "听筒里的呼吸声"
PAM.81.d: "“……喂？……索拉娜？”\n一阵刺耳的摩擦声后，那个熟悉的声音才怯生生地从听筒里传出来，带着一丝明显的不确信和小心翼翼。\n“……笃、笃。是这样拿吗？晓枫说……要把带孔的这头贴在嘴边……好奇怪，它在震动，就像一直被捏住喉咙的小鸟。”\n“……你能听到我吗？这根黑色的线……真的能一直连到你的房间里吗？”\n电话那头传来了深吸一口气的声音，接着是她变得稍微坚定了一些的语调，虽然背景里还能听到隐约的火焰爆裂声和人群的嘶吼。\n“我在西边的庄园这里。火烧得很大，那些贵族把自己锁在里面发疯，外面的平民在砸门。太吵了……大家都很痛苦，连空气都在尖叫。”\n“我想……让夜莺的孩子们进去。我想给她们唱首歌，把火压下去，让她们的心也静一静。但是晓枫告诉我，光有歌声填不饱肚子，也修不好被烧坏的屋顶，饥饿的人是听不见摇篮曲的。”\n“所以，索拉娜……能不能……借我一点你的那些‘工厂’？或者是……那些用来造房子的物资？”\n“我想把这里变成一个像我们花园那样……安安静静、不会有人受伤的地方。只要把东西运过来，证明我们会修好一切，我就有办法让那些疯掉的贵族和愤怒的人群……都乖乖睡着。”\n“……呀！它又响了一声！我是不是把它弄坏了？我要挂——”"
PAM.81.a: "（嘟——嘟——她好像吓得把电话扔了）"

PAM_mission_scavengers_cleanup:0 "§8阴影中的鸟儿§!"
PAM_mission_scavengers_cleanup_desc:0 "百灵需要资源来编织她的网。她不仅要杀人，还要诛心。她需要建立一个庞大的情报网络，渗透进每一个角落，找出那些搞破坏的幕后黑手。\n我们要给她足够的权限和支持，让她在黑暗中起舞。"
PAM.82.t: "来自下水道的低语"
PAM.82.d: "“……陛下？是我。我在下水道的通风口旁边，不用担心，这里只有老鼠听得见。\n您在光亮的大道上走得太快了，影子被拉得很长。而在那些您看不见的阴影里……有些虫子开始在您的脚印里产卵了。那些被烧毁的庄园废墟下，还有人在用只有彼此能听懂的暗号窃窃私语。\n光靠我这一把匕首，刮不干净这些顽固的苔藓。我需要一张网……一张能盖住整座城市的、粘稠的网。\n我要让每一个乞丐、每一个在后巷翻垃圾的流浪汉、甚至墙角的野猫，都变成我的眼睛。我要知道那些想搞破坏的人在哪吃饭，在哪睡觉，甚至在哪做梦。\n但这需要诱饵。情报是贵的，有时候比人命还贵。把那些见不得光的资金拨给我，给我最高的清理权限。\n别问我会怎么做。您只需要站在阳光下接受欢呼就好。至于那些脏东西……\n……把它们交给我这只乌鸦。等您明天醒来的时候，您的御座底下，会比镜子还要干净。”"
PAM.82.a: "（嘟——只有电流的沙沙声）"

PAM_mission_build_nest_for_seagull:0 "§9给海鸥筑巢§!"
PAM_mission_build_nest_for_seagull_desc:0 "“南美洲已经被我们吃干抹净了，剩下的只有骨头渣子。现在的风里，全是海对岸那股腐朽又诱人的老钱味儿。\n但我那个负责管船的小不点——小果子，她今天把一张比桌子还大的蓝图拍在了我的烤羊腿上。\n她指着那是深水区，眼神亮得吓人：‘陛下，狼爪子游不到大西洋对岸。如果您想去撕咬那些老牌帝国的喉咙，我们以前那些破舢板可不行。我们需要大船，那种能装下整座城市、能抗住十级风浪的钢铁巨兽。’\n‘为此，我需要一个能生出这些怪物的巢穴。’\n哈！听听！她以前连要块糖都不敢大声说话，现在竟然敢跟我要半个大陆的钢铁产量去填海？\n但我喜欢她现在这副贪心的样子！这才像是我养大的狼崽子！\n准了！去把海岸线炸开！去把山挖空！既然我的小海军上将想要一个能给全世界洗澡的大浴缸……那老子就给她挖一个！”"
PAM.83.t: "来自海浪的咆哮"
PAM.83.d: "“……喂？陛下？能不能……先把嘴里的骨头吐出来听我说？\n我在最南边的海岬上，这里的海风比刀子还硬，但我闻到了……风里全是海对岸那股子腐朽又诱人的老钱味儿。\n您说南美洲已经被我们吃干抹净了，想去撕咬那些老牌帝国的喉咙？那您就得听实话——狼爪子游不过大西洋。我们现在手里那些改装的破渔船，碰到真正的皇家海军，那就是给鲨鱼送点心。\n如果您真想去那边吃自助餐，我就得给您造出能跨海的钢铁盘子。\n把地图打开，看我标红的那块深水区。我要在那里建一个窝。不是那种停小舢板的烂泥塘，我要把这一整条海岸线的礁石都炸平，把山掏空灌进水泥。我要造那种……能把整座城市都装进去、能抗住十级风浪的钢铁怪物。\n这很贵，我知道。晓枫姐可能会心疼得骂人，这可能要花掉您刚抢来的一半钢铁产量。\n但是……如果不给，您的狼群就只能在这边岸上对着大海干嚎。\n图纸我已经让亡灵信使送过去了，就在您的烤羊腿旁边。陛下……为了那顿跨洋的大餐，您敢签吗？”"
PAM.83.a: "（嘟——嘟——海浪声盖过了一切）"

PAM_mission_xueyi_iron_umbrella:0 "§t给泥腿子的铁伞§!"
PAM_mission_xueyi_iron_umbrella_desc:0 "“把那张该死的战略轰炸图纸给我撤了！\n索拉娜，你脑子里只想着怎么把敌人的城市炸平，怎么去抢她们的工厂。但你有没有想过，我们要跨过大洋，去别人的地盘上打仗？\n当我的士兵——那些刚从贫民窟里走出来、还没来得及享受几天好日子的孩子们，在滩头被敌人的机枪压得抬不起头时，你那些飞在几万米高空的轰炸机能干什么？给她们收尸吗？！\n我不懂什么空气动力学，但我懂战壕里的规矩。\n我要一种新飞机。别给我整那些花里胡哨的。我要它皮糙肉厚，耐操，能挂满炸弹和机枪。\n我要让飞行员学会贴地飞行。告诉她们，别想着在天上当骑士，要像秃鹫一样俯冲下去，把那些敢向我的步兵开火的火力点，一个一个给我拔掉！\n给我造够一千架这种‘飞行坦克’！如果登陆那天，我看到有一个士兵因为头顶上没人掩护而死，我就亲自把空军司令挂在起落架上！”"
PAM.84.t: "来自靶场的咆哮"
PAM.84.d: "“喂？索拉娜！把你的酒杯放下，听我说！……我刚把空军部送来的那叠战略轰炸图纸给撕了，拿去引火都嫌纸太硬！\n你脑子里是不是只有抢工厂和炸大楼？你知不知道我们要去哪？我们要跨过大洋，去别人的地盘上硬碰硬！\n当我们的泥腿子们——那些好不容易才吃上两顿饱饭、刚学会怎么穿军靴的孩子们——在滩头上被重机枪压得抬不起头的时候，你那些飞在几万米高空的大鸟能干什么？给她们撒花瓣送行吗？！\n我不懂什么空气动力学，也不管那飞机飞起来漂不漂亮。我只要一种东西——能贴着地皮飞的‘飞行坦克’！\n我要它皮糙肉厚，耐操，哪怕被打掉半个翅膀也能飞回来；我要它挂满炸弹和机枪，像秃鹫一样俯冲下去，把那些敢向我们的步兵开火的火力点，一个一个给我拔掉！\n给我造够一千架！告诉那些飞行员，别想着在天上当骑士，给我滚下来去泥地里护着步兵！如果登陆那天，我看到有一个士兵因为头顶上没伞遮着而死……我就亲自把空军司令挂在起落架上！签发令就在你桌子上，现在，立刻，给我签！”"
PAM.84.a: "（嘟——嘟——还能听到远处的枪炮声）"

PAM_mission_feed_the_mad_dog:0 "§R不仅是断头饭§!"
PAM_mission_feed_the_mad_dog_desc:0 "“雪伊的那群兵还在盯着手里的烂枪发愁？那是饿的！没力气怎么扣扳机？\n去，把我的战备粮仓踹开！把那些原本留给贵族老爷享用的熏肉、黄油，还有成桶的烈酒，统统给我搬去前线！\n告诉那个疯女人：‘吃！给老娘往死里吃！只要你的兵能站起来咬死那些骨头架子，老娘就让她们吃得比皇帝还饱！’\n但这顿饭可不是白吃的——吃完了，就得给我拿命去填战壕！”"

PAM_mission_delegate_command:0 "§3移交指挥权§!"
PAM_mission_delegate_command_desc:0 "“前线乱成了一锅粥！我的狼崽子们只知道像没头苍蝇一样冲锋，但那些亡灵却像长了眼睛一样在包抄我们。\n我看过晓枫在牢房墙上画的那些鬼画符……虽然不想承认，但她确实比我懂怎么排兵布阵。\n给她一支笔，或者给她一个指挥部！告诉她：‘别在那儿装深沉了，左翼的防线交给你。要是守不住，我就把你的脑浆挖出来看看是不是也是墨水做的！’”"

PAM_mission_candy_and_recon:0 "§9糖果与侦察§!"
PAM_mission_candy_and_recon_desc:0 "“小果子带回了关键的情报，关于那片紫色雾气最浓的地方。但她回来时脸色惨白，像是丢了魂。\n……也许我该学学莉莉那个笨蛋以前的做法？\n去，把那罐从大公爵那里抢来的、还没过期的水果糖拿给她。\n告诉她：‘拿去吃！别哭丧着脸，看着晦气！吃完了把眼泪擦干，再去给我看看海面上有什么动静。以后……这种甜的，管够。’”"

PAM_mission_song_of_silence:0 "§1让它们闭嘴的歌§!"
PAM_mission_song_of_silence_desc:0 "“外面的骨头架子吵死了！我的炮弹都盖不住它们的嘶吼声。\n莉莉说那是怨气，她说她能让它们安静下来。\n她站在城墙上，没有拿剑，只是轻轻哼了一首歌……见鬼，那群疯狗一样的亡灵竟然真的停下来了，像傻了一样站在原地。\n喂！晓枫！别在那儿发呆了！没看见敌人都不动了吗？\n趁着莉莉哄它们睡觉的时候，把你们的刺刀捅进去！给我把它们的头盖骨掀开！\n这是我的公主给你们创造的机会，谁要是敢浪费，我就把她扔下去喂那群醒过来的怪物！”"
#GUI精神
PAM_szax:0 "逝者已经安息"
PAM_szax_desc:0 "睡吧........."
#GUI事件
#晓枫事件
 PAM_.1.t: "吞炭的喉咙"
 PAM_.1.d: "我把那枚红星徽章缝进了贴身衬衣的最里层，贴着心口，那一块皮肉被粗糙的线头磨得生疼。这疼得好，这疼提醒我还活着，还是个人。\n看着周围这群曾经的死敌——那些穿着黑皮大衣、满嘴脏话的强盗，现在居然成了我的“战友”。昨天那个把半个身子探进泔水桶里找肉吃的家伙，今天就成了我的班长。他递给我一块还在滴油的羊排，咧着嘴笑，牙缝里全是肉渣。\n我接过那块肉，就像接过一块烧红的炭。我的胃在抽搐，在抗议，它记得我们是为了让所有人都有饭吃才拿起枪的，而不是为了像野兽一样抢食。\n但晓枫同志以前教过我们：“人得先站着，才能走道；肚子填饱了，骨头才能硬。”\n我们要把这块烫嘴的肉吞下去，把这份屈辱和那该死的羊油一起咽进肚子里。这胃里烧起来的火，早晚会从喉咙里喷出来，烧穿这个荒谬的世界。\n吃吧。为了有力气把枪握紧，为了有力气……等到黎明真正破晓的那一天。"
 PAM_.1.a: "（吞下去。连同血和泪一起。）"

 PAM_.2.t: "枪油与面包"
 PAM_.2.d: "这批新枪到了。不是那种只有三发子弹的土造猎枪，也不是那种拉栓就会卡壳的老古董。是崭新的、烤蓝锃亮的、甚至闻起来带着一股甜腻工业油脂味的好家伙。\n那个叫索拉娜的疯女人，真的把贵族的军火库给搬空了。她把这些原本用来镇压我们的武器，像扔垃圾一样扔到了我们面前。\n“拿去！”那个传令兵吼道，“女王说了，谁要是拿着这种好货还打输了，就自己跳进亡灵坑里去！”\n我抚摸着枪身，冰凉的金属让我的手指微微颤抖。以前我们总说要用意志战胜钢铁，现在我明白，意志需要钢铁来武装，正义需要火药来推行。\n这就是我们要找的“本钱”。我们以前两手空空去撞高墙，现在我们手里有了锤子。虽然这锤子是那头母狼抢来的，虽然这上面沾着旧时代的灰尘。\n但这又怎么样呢？铁就是铁，火就是火。只要扣动扳机的手指还是我们的，只要枪口对准的还是那些吃人的怪物，那这就是我们的枪。\n把枪擦亮。这一次，我们要用他们送来的铁，去打碎他们自己的锁链。"
 PAM_.2.a: "（子弹上膛的声音，真好听。）"

 PAM_.3.t: "谁在撕咬"
 PAM_.3.d: "完了。这次是真的完了。\n那些亡灵像黑色的潮水一样漫过了山头，弹药箱空了，连最后的手榴弹也扔出去了。身边的兄弟倒下了一半，剩下的人背靠背挤在这个泥坑里，喘气声像拉破的风箱。\n我握着工兵铲，看着那些逼近的惨白骨架，脑子里只剩下一个念头：跟这帮怪物拼了。死在这里，我也算对得起这身军装。\n就在那只骨爪要抓破我喉咙的一瞬间——\n轰！！\n面前的骨墙炸开了。不是炸药，是一个人。\n那个疯女人，那个我们恨得牙痒痒的暴君，索拉娜。她就像一头从地狱里冲出来的黑狼，浑身是血，手里那把剑卷了刃，却依然像锯齿一样撕碎了眼前的一切。\n“我的！都是我的！”她嘶吼着，声音比那些亡灵还恐怖，“谁准你们动我的东西！谁准你们吃我的兵！滚开！滚回地底下去！”\n她挡在我们前面，用身体撞，用牙齿咬，比我们要消灭的阶级敌人还要凶残一万倍。她根本不是为了什么崇高的理想在救我们，她只是像个守财奴在护着他的金币，像个护食的野兽在护着他的幼崽。\n可我看着那个疯癫的背影，眼泪却混着泥水流了下来。\n在那一刻，什么主义，什么阵营，都变得模糊了。我只知道，在那面把我们隔绝在死亡之外的盾牌上，刻着的不是什么大道理，而是一个活生生的、正在流血的人。\n原来，这就是我们要找的……那股能把咱们从死人堆里拽出来的蛮劲儿。"
 PAM_.3.a: "（跟着她！杀出去！）"

 PAM_.4.t: "黑泥里的莲花"
 PAM_.4.d: "以前我觉得，革命应该是干净的。白衬衫，红旗帜，一尘不染的理想。我们应该拒绝一切肮脏的交易，拒绝和任何剥削者妥协。\n可现在看看我们。穿着从死人身上扒下来的黑大衣，吃着从殖民者那里抢来的罐头，甚至还要指挥那些只有骨架的亡灵去替我们趟地雷。\n脏吗？真脏。\n可是你看，那边的村子里，炊烟升起来了。那个以前只能去捡煤渣的孩子，现在正穿着体面的衣裳坐在学堂里念书——虽然那衣裳有点大，虽然那学堂是抢来的贵族别墅改的。\n这世上的事儿就是这么怪。要想在这片全是烂泥的沼泽里种出花来，你就得先把手伸进烂泥里，把那些腐烂的根须、发臭的淤泥都翻一遍。你不能嫌脏，不能嫌臭，因为那就是养分。\n索拉娜就是那把最锋利、也最脏的铲子。她负责把旧世界铲得稀巴烂，把所有的罪恶和血腥都揽在自己身上。而我们……我们就是撒在这些翻开的黑土里的种子。\n我们利用她的贪婪去喂饱人民，利用她的暴虐去粉碎枷锁。只要结果是受苦的人直起了腰，这手段再黑，心也是亮的。\n在这黑色的狼皮底下，我们的心，依旧是红的。而且因为沾了地气，跳得更稳了。"
 PAM_.4.a: "（根扎得越深，花开得越艳。）"

 PAM_.5.t: "路与桥"
 PAM_.5.d: "今晚的篝火很旺。几个新兵蛋子围着我，问我还要不要搞那个“真正的”革命。他们指着远处灯火通明的城市，那是用掠夺来的黄金堆砌起来的繁华。\n我捡起一块木柴，扔进火里，看着火星子飞上天。\n“一定要搞。”我对他们说，“但是路变了。”\n以前我们想修一座桥，直接跨过这就条吃人的河，去对岸的天堂。但我们没水泥，没石头，桥修一半就塌了，掉下去好多兄弟。\n现在，那个叫索拉娜的家伙来了。她不想修桥，她直接跳进河里，把河水喝干了，把河底的淤泥填平了。她用那些贵族的尸骨铺了一条路。虽然这路走起来咯脚，虽然这路上一股血腥味，但它……确实通向对岸。\n我们现在就走在这条路上。我们的任务不是去把路炸了，而是要在走的过程中，把那些尖锐的石头踢开，把路边的杂草拔掉，让后来的人走得更顺当。\n这就是这世道的道理。它从来不按我们写好的剧本演，它有时候会戴着魔鬼的面具来干天使的活儿。\n只要方向是对的，坐着狼拉的车去，和自己走着去，没有区别。\n而且，这车上装满了粮食，能让我们把更多还没饿死的人，一起带上。\n这就是我们留在这里的意义——我们是这辆疯狂战车的方向盘，我们得盯着它，别让它冲进沟里，得让它……一直开向那个春天。"
 PAM_.5.a: "（路是人走出来的，不管是穿草鞋还是穿军靴）"

 PAM_.6.t: "殊途同归"
 PAM_.6.d: "那个日子终于来了。全军列队，接受检阅。\n广场上站满了人。这里有死人，有活人，有曾经的强盗，也有昔日的农夫。我们穿着统一的黑色军服，胸前挂着那是索拉娜发的、用国王王冠熔掉重铸的“黑狼勋章”。\n大家都在等那个疯女人出来骂人，或者等她再扔给我们几块肉。但今天，走上高台的不是她。\n是一个穿着朴素军装，却比任何人都挺拔的身影。\n晓枫。\n她瘦了，但眼神比以前更亮，像两把刚磨好的刺刀。她没有说话，只是静静地扫视着我们。她的目光落在我身上，落在那枚黑色的勋章上，然后，她笑了。\n那不是以前那种背负着沉重十字架的苦笑，而是一种……看到庄稼熟了的、欣慰的笑。\n她缓缓举起手，向我们这群穿着黑色军服、混杂着亡灵、浑身匪气的士兵，敬了一个最标准的、属于革命军的军礼。\n“同志们，”她的声音不大，却在每个人心里炸响，“看看你们自己。”\n“有人说你们是暴徒，是强盗，是索拉娜的爪牙。但我看到的是一群哪怕在地狱里也要爬出来、也要把世界咬个窟窿的复仇者。”\n“革命不是请客吃饭，革命就是暴动，是一个阶级推翻一个阶级的暴烈的行动。而你们……你们就是这股暴烈本身！”\n“索拉娜给了你们牙齿，给了你们活下去的肉。而今天，我要给你们‘魂’。”\n“去吧！带着这身黑皮，去把那些高高在上的神像砸碎！去把那些压在人民头上的大山啃光！你们是狼，但你们是属于人民的狼！你们是鬼，但你们是向压迫者索命的厉鬼！”\n那一瞬间，我感觉浑身的血都涌上了头顶。我想哭，想吼，想把枪举起来。\n我们没有背叛。我们只是变成了一种更顽强、更凶狠、更能在这个残酷世界里活下去的“野火”。\n在这层狰狞的伪装下，那颗红色的心，跳得比任何时候都要有力。\n风吹过来了，旗帜在响。我看清了，那面黑色的狼旗后面，映出来的影子……分明是一团烧透了半边天的、赤红的烈火。"
 PAM_.6.a: "（敬礼！为了……新世界！）"
PAM.85.t: "来自档案室的忙音"
PAM.85.d: "“……喂？还在喝吗？先把酒杯放下，听我说两句。\n刚散场。我看着那帮狼崽子回营房了。若是放在以前，检阅完她们早就该聚众赌博或者打架了，但今天……她们很安静。我看见那个缺了耳朵的老兵在擦他的黑勋章，擦得很亮，还在哭。\n索拉娜，说实话，我以前看不起你的手段。我觉得你把人变成了只会抢食的野兽，把革命变成了暴乱。我一直想把她们洗干净，变回我记忆里那种‘纯粹’的战士。\n但今天站在台上，看着下面那片黑压压的、却又热气腾腾的人海，我突然明白了一件事：\n教科书里的革命是红色的，那是血的颜色；但现实里的生存是黑色的，那是泥土和火药的颜色。若没有你在泥里打滚，就没有这层保护色，那点红早就被风吹灭了。\n你喂饱了她们的胃，我填上了她们的魂。咱们谁也别嫌弃谁。\n所以……别一个人坐在那空荡荡的大殿里发呆了。你不是什么篡位者，也不是什么玷污理想的罪人。\n你是这支军队的骨头。\n……行了，我就说这么多。早点睡，明天还有新的仗要打。如果你那是还有没吃完的葡萄……给我留一串。”"
PAM.85.a: "（嘟—嘟——在那头，传来了一声轻轻的叹息）"
 #雪伊事件
 PAM_.7.t: "带刺的项圈"
 PAM_.7.d: "我站在满是油污的食堂门口，手里握着那把索拉娜扔给我的、甚至还没擦干净血迹的宪兵队长的配枪。看着里面那些狼吞虎咽的士兵，还有那个坐在高处、把脚翘在桌子上的疯女人，我只觉得恶心。\n就在刚才，一个喝多了的新兵试图去抢一个老工人的那份肉汤。那老头吓得发抖，却死死护着碗，因为那是他给孙子留的。\n“那是我的！”新兵吼着，举起了拳头。\n“砰！”\n我没犹豫，对着天花板开了一枪。碎石灰落在那个新兵的头顶，把他吓瘫在地上。\n全场死寂。我大步走过去，一脚把那个新兵踹翻，然后把那碗汤端起来，重新塞回老头手里。\n“都给老娘听好了！”我环视着这群野兽，枪口有意无意地扫过高台上的索拉娜，“你们是狼，不是抢食的狗！谁敢对自己人龇牙，我就拔了他满嘴的牙！”\n索拉娜在高台上眯起了眼睛，她没生气，反而咧嘴笑了，举起酒杯冲我晃了晃，像是看了一场好戏。\n我冷冷地转过头。我不喝她的酒。我留在这里，不是为了给她当看门狗，而是为了盯着这群畜生，别让它们把最后一点人味儿都给嚼碎了。\n这把枪既然在我手里，那这里的规矩，就得有一半是我说了算。"
 PAM_.7.a: "（只要我在，谁也别想欺负老实人。）"

 PAM_.8.t: "种子的重量"
 PAM_.8.d: "“吃！都吃了！明天的事明天再说！”\n索拉娜在粮仓门口咆哮，她想把刚缴获的几千吨麦种都磨成面粉，给全城的人办一场狂欢节。周围的暴民们在欢呼，眼睛里冒着贪婪的光。\n“我看谁敢动！”\n我挡在粮仓大门前，拉上了枪栓。我的身后是那堆像山一样的种子，那是明年所有人活命的指望。我的面前是成千上万个饿红了眼的疯子，还有那个最疯的王。\n“雪伊，你别给脸不要脸。”索拉娜走过来，手按在剑柄上，眼神阴冷，“大家肚子都饿着，你护着这些不能吃的硬疙瘩干什么？”\n“因为吃了它，明年就会死更多的人！”我寸步不让，枪口顶着她的胸口，“你只管今天吃饱，不管明天饿死？那你跟那些只知道吸血的贵族有什么区别？”\n索拉娜愣了一下，她看着我，像是在看一个不可理喻的怪物。周围的人群开始骚动，有人想冲上来。\n“退后！”索拉娜突然转身，一鞭子抽在那个领头的暴民脸上，“没听见吗？这是明年的饭！谁敢动明年的饭，老子今天就把它炖了！”\n她骂骂咧咧地走了，临走前狠狠瞪了我一眼：“行，你清高，你管家。要是明年长不出麦子，我就把你埋进地里当肥料！”\n我松了一口气，后背全是冷汗。但我知道，我赢了。这头狼虽然贪，但她更怕死。只要让她知道这东西是保命的，她就会比谁都护食。\n好吧，既然你只管抢，那我就替你……把这份家当守住。"
 PAM_.8.a: "（这可是明年的希望。）"

 PAM_.9.t: "肮脏的手段"
 PAM_.9.d: "审判台上跪着那个以前在矿区作威作福的监工头子。按我的规矩，应该公审，列罪状，然后枪决。\n但索拉娜不耐烦地挥挥手：“太慢了。”\n她让人把监工绑在柱子上，然后对下面那些曾被他欺压过的矿工喊：“他以前怎么打你们的，现在你们就怎么打回来！打死算我的！”\n人群像决堤的洪水一样涌了上去。惨叫声，撕咬声，还有骨头碎裂的声音响彻广场。那是一场私刑，一场彻头彻尾的暴虐狂欢。\n我站在旁边，皱着眉，手按在枪套上，想去阻止这失去秩序的暴行。但晓枫拦住了我，她指了指那些矿工的脸。\n我看到了……解脱。\n那个平时最老实、却被监工打断过腿的汉子，此刻正一边哭一边用石头砸那个监工的尸体。他宣泄着积压了一辈子的恨，那恨意随着鲜血流出来，他的眼神从麻木变得鲜活。\n“雪伊，”索拉娜走到我身边，递给我一根烟，“你的法庭太干净了。对于这些在地狱里泡大的人来说，只有亲手把仇人的肉撕下来，他们才觉得自己真的站起来了。”\n我接过烟，没点，只是看着那狂热的人群。我不得不承认，她是对的。在这个扭曲的世道里，正义有时候必须长着一副狰狞的面孔，才能让受害者信服。\n她是那个负责把手弄脏的屠夫，而我……我是那个在事后负责把地洗干净的人。我们谁也离不开谁。"
 PAM_.9.a: "（有时候，血必须用血来洗。）"

 PAM_.10.t: "刹车片"
 PAM_.10.d: "深夜的作战室，索拉娜指着地图上那块标注着极度危险的沼泽地，眼睛里闪烁着赌徒的狂热。\n“从这儿穿过去！只要三天，我们就能直插敌人的心脏！”\n将领们都不敢说话，因为上次反对她的人已经被扔去喂亡灵了。\n“不行。”\n我把那一杯冷水泼在了地图上，也泼在了她的兴头上。\n“这沼泽里有毒气，还是亡灵的聚集地。你的兵还没见到敌人就会死光。你想赢，还是想送死？”\n索拉娜暴跳如雷，拔出剑把桌角砍了下来：“雪伊！你总是跟我唱反调！你是想造反吗？！”\n“我想让你赢！”我也吼了回去，声音比她还大，“你这辆破车开得太快了，要是没个刹车片，早就冲进沟里了！我是你的宪兵队长，我的职责就是要在你发疯的时候，给你一巴掌！”\n我们像两头母狮子一样对视着，空气里充满了火药味。过了许久，她把剑扔在地上，气呼呼地坐回椅子里。\n“……那你说，怎么打？”\n那一刻，我看到了她眼底的一丝依赖。她知道自己是个疯子，所以她需要我这个清醒的混蛋在她身边。她负责踩油门，我负责踩刹车。\n这很危险，但这很有效。只要我不松口，这辆战车就不会翻。"
 PAM_.10.a: "（只要我不点头，这路就走不通。）"

 PAM_.11.t: "把后背交给你"
 PAM_.11.d: "这是一场伏击。那些伪装成难民的刺客从人群里冲出来的时候，离索拉娜只有不到五米。\n这蠢女人还在那儿给小孩发糖，根本没反应过来。\n我没有思考，身体比脑子更快。我冲过去，把她撞开，紧接着肩膀上就传来一阵剧痛——一把匕首扎了进去。\n“砰！砰！砰！”\n我躺在地上，单手举枪，把那三个刺客的脑袋像敲西瓜一样打碎。鲜血溅了我一脸，也溅了索拉娜一身。\n她从地上爬起来，看着我肩膀上的刀，那张从来都不可一世的脸上第一次露出了惊恐。她扑过来，手忙脚乱地按住我的伤口，吼得像是死了亲妈：“医生！死哪去了！救不活她我杀你们全家！”\n“别嚎了……”我疼得龇牙咧嘴，“……死不了。”\n“你傻啊！”她红着眼睛骂我，“你不是恨我吗？为什么替我挡刀？”\n“因为你是头狼。”我看着她，“你要是死了，这好不容易建起来的食堂就散了，那些刚吃饱饭的人又要去当流浪狗。我不是救你，我是救这口锅。”\n她愣住了，然后突然抱住了我，力气大得差点让我背过气去。\n“……雪伊，你这只母狼。”她在我也耳边咬牙切齿地说，“这笔账我记下了。以后你的命是我的，除了我，谁也不准动你。”\n我哼了一声，没有推开她。在这冰冷的泥地里，两个浑身是血的女人靠在一起，竟然也能感觉到一种……过命的温度。"
 PAM_.11.a: "（别误会，我只是不想让饭碗砸了。）"

 PAM_.12.t: "黑色的盾，红色的心"
 PAM_.12.d: "胜利阅兵的那天，索拉娜给了我一套崭新的、镶着金边的元帅礼服。那是用最好的黑呢子做的，威风凛凛。\n我穿上了它。但我做了一件让她没想到的事——我从怀里掏出那块旧的、洗得发白的红袖章，那是当年我们在莉兰迪亚起义时戴的，上面绣着“为人民服务”。\n我把它，郑重地戴在了这身黑色礼服的袖子上。黑与红，在这一刻显得格格不入，却又无比刺眼。\n索拉娜看着我，挑了挑眉：“你这是什么意思？给我的狼群掺沙子？”\n“不。”我整理好领口，看着镜子里的自己，“这是提醒。”\n“提醒你，也提醒我。我们这身黑皮是用来吓唬敌人的，是用来在黑夜里潜行的。但这块红布……是用来捂热心口的。”\n我转过身，直视着索拉娜。现在的她已经不仅仅是个强盗头子了，她是一个帝国的王，而我是这帝国的守夜人。\n“索拉娜，你尽管去征服，去抢掠，去做你那让人闻风丧胆的狼王。但我会一直站在你身后。我会用这身黑色的盔甲为你挡住暗箭，但我也会用这块红色的袖章，时刻勒紧你的缰绳。”\n“我们会建立一个没有人敢欺负的国度。在这里，狼有肉吃，人有尊严。而我……我就是那道底线。”\n索拉娜看着我，良久，她笑了。那笑容里不再有疯狂，而是一种君王对宰相、战友对战友的敬重。\n“好。”她伸出拳头，“带着你的红袖章，跟我走。去告诉全世界，我们这对最奇怪的搭档……是怎么把天捅破的！”\n我碰了碰她的拳头。黑色的洪流出发了，而在那洪流的最前方，有一抹鲜艳的红色，像心脏一样，永不熄灭地跳动着。"
 PAM_.12.a: "（我是狼群的良心，我是……不灭的野火。）"
 PAM.86.t: "来自宪兵队的直线"
 PAM.86.d: "“……喂？把酒杯放下。……别装，我听得见冰块撞玻璃的声音。\n今天阅兵的时候，我看你一直盯着我的袖子看。怎么？觉得那块洗发白的红布，配不上你赏给我的这身金边黑帅袍？\n觉得碍眼就对了。那就是根刺，是扎在你肉里的警钟，也是……我给你的承诺。\n索拉娜，说实话，我以前恨不得把你这头野兽关进笼子，觉得你脏，觉得你是个没有底线的强盗。但今天看着台下那些不再面黄肌瘦的脸，看着那些把你的名字刻在枪托上的士兵，我承认——在这个吃人的世界里，光有理想填不饱肚子，光有主义挡不住子弹。确实需要你这样的恶狼，去撕开一条血路。\n你负责去做那个让世界颤抖的暴君，去抢，去夺，去把所有肮脏的活儿都干了。而我……我会守在你的影子里，做那个让你‘不舒服’的人。\n只要这块红袖章还在，只要我还站在你身后，你就永远不用担心自己会彻底堕落成那些我们曾经最痛恨的贵族。因为一旦你越过了那条线，我会毫不犹豫地把你拽回来——哪怕是打断你的腿。\n所以，安心地去疯吧，我的……陛下。你的背后是安全的，你的灵魂……我也替你守着了。\n……行了，挂了。早点睡，别逼我半夜去踹你的门。”"
 PAM.86.a: "（嘟—嘟——听筒里传来了打火机点烟的声音）"

# 小果子好感度 0 
 PAM_.13.t: "黑帆下的囚徒"
 PAM_.13.d: "“海风不再是咸的，是腥的。\n我站在驾驶台上，手里握着那个熟悉的舵盘，但我感觉不到一丝自由。这艘船曾经叫‘希望号’，是为了给同志们运送种子的。现在，它挂着黑色的狼头旗，甲板上堆满了从港口抢来的金银器皿。\n那些跟着我的水手，那些曾经为了保护半袋面粉敢跟风暴搏斗的战士，现在正穿着从死人身上扒下来的皮靴，大口嚼着抢来的肉干，眼神里闪烁着和索拉娜一样的、贪婪的绿光。\n这还是我的舰队吗？\n晓枫姐教过我，船是连接世界的桥。可现在，我们变成了切断喉咙的刀。那个疯女人把我们变成了海盗，变成了我们曾经最痛恨的掠夺者。\n我看着黑色的海面，感觉自己正驾驶着这艘船，一点一点地驶向一个没有灯塔的深渊。我的胃里翻江倒海，我想吐，但我吐不出来。因为我知道，如果我不握紧这个舵，船上这些人——这些即使变成了野兽也依然是我的家人的家伙，就会立刻葬身鱼腹。\n为了让他们活，我必须……成为这艘贼船的帮凶。”"
 PAM_.13.a: "（舵盘……好冷。）"

 # 小果子好感度 20
 PAM_.14.t: "带血的蜜糖"
 PAM_.14.d: "“今天我们截获了一艘商船。那是属于一个大财阀的船，满载着昂贵的蔗糖和咖啡。\n按照以前的纪律，我们应该征用物资，然后放人。但索拉娜的命令只有两个字：‘不留’。\n我的炮手们欢呼着开火，看着那艘船在火光中断成两截。然后，他们像鲨鱼一样跳进水里，把那些漂浮的货物捞上来。\n晚上，这些糖被分发了下去。我看到一个小水手，他才十六岁，正躲在角落里，把一块沾着海水甚至可能沾着血的糖块塞进嘴里。他哭了，一边哭一边笑，那是他这辈子第一次尝到这种纯粹的甜味。\n‘头儿，真甜啊……’他对我说，‘我给我妈留了一半。她快饿死了，有了这个，她就能活了。’\n我看着他那张因为长期营养不良而凹陷的脸，手里原本想扔掉的那块糖，突然变得千钧重。\n这就是索拉娜的逻辑吗？杀掉那些高高在上的‘他’，抢来他们的血肉，喂饱我们这些在泥里打滚的‘他’。\n这很残忍，这很野蛮，这违背了书本上写的一切正义。\n可是……看着那个孩子脸上的血色，我那句‘这是赃物’的斥责，却死死地卡在喉咙里，怎么也说不出口。”"
 PAM_.14.a: "（这糖……全是铁锈味。）"

 # 小果子好感度 40
 PAM_.15.t: "与鬼同航"
 PAM_.15.d: "“底舱传来了抓挠声。\n那是索拉娜塞给我的‘新船员’。一整队的亡灵水鬼。它们不需要呼吸，不怕水压，可以像藤壶一样吸附在船底，或者在深海里潜伏几天几夜。\n活人们害怕它们，我也怕。那种死亡的气息弥漫在整艘船上，连老鼠都逃光了。\n昨晚遇到风暴，主桅杆断了，几十吨重的横梁砸下来，眼看就要把机轮室压扁。那里躲着十几个受伤的活人兄弟。\n就在那一瞬间，那些被我们恐惧的亡灵冲了上去。它们用只有骨架的身体死死顶住了横梁。咔嚓、咔嚓，我听到了骨头碎裂的声音，看到了它们眼里的魂火因为承受重压而爆燃。\n它们被压碎了。变成了粉末。\n但是机轮室保住了。里面的活人兄弟吓得脸色惨白，却毫发无伤。\n风暴过去后，索拉娜发来了电报，只有冷冰冰的一句话：‘工具坏了可以再缝，人死了就没了。别心疼骨头，心疼你的活人。’\n我看着甲板上那堆惨白的骨粉，被海风一点点吹散。\n那个女人……她把死者变成了奴隶，却把生者护在了身后。这究竟是亵渎，还是……一种我也无法理解的、扭曲的慈悲？\n我感到一阵彻骨的寒意。为了活下去，我们真的连死人的安宁都要剥夺吗？”"
 PAM_.15.a: "（谢谢……对不起。）"

 # 小果子好感度 60
 PAM_.16.t: "沉默的帮凶"
 PAM_.16.d: "“我的手已经稳了。无论是下令开炮，还是看着敌人的船沉没，我的心跳都不会再加速了。\n今天，我们炮击了一座被殖民者控制的港口。那是为了掩护陆军抢夺那里的煤炭资源。\n透过望远镜，我看到港口里燃起大火，看到那些穿着体面衣服的绅士和淑女在火海里尖叫奔逃。而我们的登陆艇，那些载着贫民窟出身的士兵的小船，像饥饿的蚂蚁一样涌上去，搬空了每一座仓库，甚至拆掉了铁轨。\n我看到一个贵族在岸边向我们的船挥舞着白手绢，试图用金表换一个座位。我的大副，那个以前连鸡都不敢杀的老实人，面无表情地给了他一枪，然后把金表捡起来，揣进兜里。\n‘为了黑狼。’他低声说。\n我没有阻止。我甚至没有转过头去。\n我已经习惯了。习惯了这种弱肉强食，习惯了这种把文明踩在脚下的快感。\n晓枫姐送给我的日记，我已经很久没敢翻开了。我怕看到上面那些关于‘理想’、‘解放’的字眼。\n现在的我，还是那个想要带大家回家的小海鸥吗？\n不，我只是一只染了色的乌鸦，盘旋在尸体上，等着分一口腐肉。\n这片海域越来越黑了，连星星都看不见了。”"
 PAM_.16.a: "（只要能赢……变成怪物也没关系吧？）"

 # 小果子好感度 80
 PAM_.17.t: "深渊的尽头"
 PAM_.17.d: "“我们赢了。南美的海岸线都在我们的控制之下了。无数的财富像河流一样汇入莉兰迪亚。\n庆功宴在甲板上举行。士兵们醉得东倒西歪，有人在撒钱，有人在对着大海狂吼。索拉娜在王宫里发来了嘉奖令。\n我躲在缆绳堆里，抱着膝盖，看着漆黑的海面。我想哭，可是眼泪好像流干了。\n我救了很多人，是的。我的船员们都胖了一圈，他们寄回家的钱让村子里盖起了新房。可是……代价呢？\n代价是我们变成了我们曾经最讨厌的人。我们变成了强盗，变成了暴徒，变成了让世界恐惧的灾难。\n这真的是晓枫姐想要的未来吗？这真的是雪伊姐想看到的胜利吗？\n我们活下来了，但‘我们’好像也死去了。\n那个看着萤火虫会笑的小女孩，那个相信世界会变好的小果子，已经死在了这片黑色的海里。\n我想跳下去。跳进这冰冷的海水里，洗干净这一身的血腥味。也许在海底，我能找到那个干净的、纯粹的梦。\n索拉娜……你赢了。你把我也变成了和你一样的、没有心的狼。”"
 PAM_.17.a: "（既然都是地狱，哪里还有方向？）"

 # 小果子好感度 100
 PAM_.18.t: "风暴眼中的灯塔"
 PAM_.18.d: "“‘这就是你想死的地方？’\n一个粗鲁的声音打断了我的自毁。索拉娜不知什么时候站在了甲板上，那件黑色的狼皮大衣被海风吹得猎猎作响。她手里提着一盏马灯，那光芒刺痛了我的眼睛。\n‘你觉得我们脏？觉得我们是强盗？’她把灯举高，照亮了码头。\n我顺着光看去。\n那里，成千上万个衣衫褴褛的人——老人、妇女、孩子，正围在我们的运输船旁。他们没有在抢，他们在哭。他们从那些凶神恶煞的士兵手里接过一袋袋粮食，接过那些我们从贵族手里抢来的、沾着血的‘赃物’。\n一个母亲跪在地上，把面粉抹在孩子饿得发青的脸上；一个断腿的老兵抱着一瓶药，像抱着他的命。\n‘看清楚了，小果子。’索拉娜的声音不再是疯癫的，而是带着一种我不曾察觉的、深沉的疲惫和坚定。\n‘这世上只有两种干净。一种是躲在象牙塔里，看着别人饿死，自己保持手不沾血的干净；另一种……是跳进烂泥坑里，把自己弄得满身污垢，也要把这群人从死人堆里刨出来的干净。’\n‘野火的理想是好的，但火在水里是烧不起来的。在这个吃人的世道，想让这群羊活下去，我们就必须变成比狼更狠的野兽。’\n她走到我面前，把那盏灯塞进我手里。那灯罩是温热的，像一颗跳动的心脏。\n‘我负责当那个恶人，我负责抢，我负责杀，我负责背负所有的骂名。而你……’她指着那群正在吃饭的百姓，‘你负责把东西运回来，喂饱他们。’\n‘别想那些没用的。只要他们还活着，只要他们还能笑，我们就算下地狱……也是昂着头下去的。’\n那一瞬间，海面上的乌云裂开了一道缝隙，晨光像利剑一样刺破了黑暗，照亮了索拉娜那张狂妄却坦荡的脸，也照亮了码头上那些卑微却真实的生命。\n我握紧了那盏灯。\n原来……这就是答案。\n我们不是堕落了。我们是把理想从云端拽进了泥土，用血肉给它筑起了围墙。\n在这黑色的狼皮下，那团火……从来没有熄灭过。它只是为了守护这些脆弱的火种，而把自己变成了钢铁的熔炉。\n‘……我明白了。’我擦干了脸上的泪痕，站直了身体，向这位暴君，也是这位真正的守护者，敬了一个礼。\n‘船队准备完毕。陛下，哪怕是地狱……我也为您把路闯开。’”"
 PAM_.18.a: "（起航！为了……活着的尊严！）"
 PAM.87.t: "来自海平面的潮声"
 PAM.87.d: "“……喂？索拉娜姐姐……不，陛下。\n是我。别嫌我啰嗦，海上的信号不好，有些话我现在不说，怕到了浪尖上就没机会说了。\n刚才，那个拿了面粉的母亲，非要塞给我一个刚编好的贝壳手链。那贝壳很糙，还没打磨好，但我戴上了。挺好看的，对吧？\n以前我总觉得，只有白色的帆才是干净的，只有不抢东西的船才是正义的。我怕脏，怕血，怕变成坏人。\n但今天……看着您提着那盏灯站在黑漆漆的码头上，我突然明白了一件事：\n灯塔之所以能发光，是因为它把自己立在了风浪最大、最危险的礁石上。您就是那块礁石，您替我们挡住了所有的浪，挡住了所有的骂名。\n既然您愿意做那个满身污泥的恶人，那我就不能再当那个躲在后面哭的小女孩了。\n放心把大海交给我吧。不管还要抢多少东西，不管还要运多少‘赃物’……只要能把咱们的家填满，只要能让那个孩子脸上有肉……我这双手，愿意陪您一起脏下去。\n……海风有点大，您把领子竖起来点，别吹着了。\n我的船队……要出发了。”"
 PAM.87.a: "（嘟—嘟——海浪声中夹杂着一声吸鼻子的声音）"

  # 莉莉安娜好感度 0
 PAM_.19.t: "静谧的裂痕"
 PAM_.19.d: "“太吵了。我的耳膜在震颤，那是火药爆炸的轰鸣，是金属切入骨骼的脆响，是几万个喉咙同时发出的濒死哀嚎。\n我站在满是烂泥的战壕边，白色的裙摆被溅上了黑色的血污。索拉娜就在前面，像一头疯兽般挥舞着长剑，每一次劈砍都带起一蓬热气腾腾的血雾。\n我本能地想要后退，想要用魔力封住听觉，回到那个属于我的、永恒寂静的冥界。那里没有痛觉，没有腐烂的臭味，只有完美的、冰冷的秩序。\n可是，一只手抓住了我的脚踝。\n那是一个只有半截身子的年轻士兵。他的肠子拖在泥水里，还在冒着热气。他的眼睛已经灰败了，但他那只沾满泥浆的手，却死死地扣住我的脚腕，力气大得惊人。\n‘救……救我……’他喉咙里发出风箱般的声音，血沫从嘴里涌出来，‘我不想死……我不想变冷……’\n我看着他。在我的国度里，死亡是安息，是回归。可在这里，死亡是恐惧，是不甘，是拼命想要抓住最后一点余温的挣扎。\n我伸出手，想要用死灵魔法带走他的痛苦，让他安息。可就在指尖触碰到他额头的一瞬间，我缩回了手。\n因为我看到了他眼底的那团火——那是对生的渴望，比索拉娜的剑还要炽热。\n如果我让他安息，那就是熄灭了这团火。那就是……杀了他。\n我僵在原地，任由那只手一点点变冷，直到彻底僵硬。那种逐渐流失的温度，像烙铁一样烫在我的脚腕上，烫进了我的灵魂里。\n原来，这就是活着的声音吗？如此刺耳，却又……如此滚烫。”"
 PAM_.19.a: "（这温度……擦不掉了。）"

 # 莉莉安娜好感度 20 
 PAM_.20.t: "缝合的布娃娃"
 PAM_.20.d: "“今天，索拉娜带我去了她的‘工厂’。不是制造子弹的，是制造士兵的。\n那里挂满了残缺的肢体，像屠宰场里的肉块。工匠们用粗大的针线，将那些战死的尸体缝合起来，塞进死灵的内核，让它们重新站起来。\n我看到了一个被缝合好的作品。它有着成年人的躯干，却接着一只显然属于少年的手臂。那只手臂上还戴着一个编织粗糙的草环，上面沾着干涸的血迹。\n‘它很完美，对吧？’索拉娜得意地拍着那个怪物的肩膀，‘它会是最忠诚的盾牌。’\n我没有说话。我走过去，轻轻握住那只不协调的手臂。在冥界的视角里，这只是物质的重组。但在那一刻，我仿佛听到了两个灵魂在接缝处的嘶吼。\n一个是失去了身体的战士，一个是失去了手臂的孩子。他们被强行捆绑在一起，被迫去打一场已经结束的战争。\n‘……疼吗？’我轻声问。\n那个怪物空洞的眼眶里没有回应，只是机械地转动了一下脖子，发出一声令人牙酸的骨骼摩擦声。\n我拿出随身携带的手帕，那是索拉娜送我的、最柔软的丝绸。我小心翼翼地，把那道狰狞的缝合线包了起来，打了一个漂亮的蝴蝶结。\n索拉娜愣住了，周围的工匠也愣住了。\n‘莉莉，那是死人……’\n‘我知道。’我打断了她，手指轻轻抚摸着那个蝴蝶结，‘但它……也曾是谁的父亲，谁的孩子。’\n‘如果不把它缝得漂亮一点，它的家人……会认不出它的。’\n那个怪物突然安静了下来。它低下头，用那只借来的手，笨拙地碰了碰那个蝴蝶结。一滴浑浊的尸液，从它那干枯的眼眶里，滑落了下来。”"
 PAM_.20.a: "（至少……让它体面地走。）"

 # 莉莉安娜好感度 40
 PAM_.21.t: "花与骨"
 PAM_.21.d: "“春天来了，但战场上只有焦土。索拉娜的坦克碾碎了每一寸草皮，只留下了履带的深痕和机油的恶臭。\n我独自一人走在阵地后方。那里有一片乱葬岗，埋着昨天死去的野火游击队员，也埋着我们这边倒下的狼群士兵。他们生前互相撕咬，死后却挤在同一个泥坑里，分不清彼此。\n我看到一个小小的身影蹲在坟堆旁。是个只有五六岁的小女孩，手里攥着一把枯萎的野花。她在哭，哭得很伤心，因为她找不到哪一个是她的哥哥了。\n‘他们都变成了骨头……’她抽泣着说，‘骨头都长得一样……哥哥去哪了？’\n我看着那片狼藉的土地。是啊，死亡是最大的平等，它抹去了所有的特征，只留下了苍白。\n我应该转身离开，或者用魔法让她遗忘。但我没有。\n我跪在泥地里，掌心贴着冰冷的坟土。我闭上眼，调动起那股属于夜莺之心的残余力量。这一次，不是为了唤醒亡灵去战斗，而是为了……唤醒记忆。\n幽蓝的光芒渗入地下。片刻后，奇迹发生了。\n一朵朵颜色各异的小花，从那些无名的坟包上钻了出来。有的红得像火，那是性格暴烈的冲锋手；有的白得像雪，那是沉默寡言的医疗兵；有的是蓝色的勿忘我，那一定是个爱写信的年轻人。\n每一朵花，都对应着一个灵魂生前最鲜艳的颜色。\n‘看，’我指着其中一朵倔强地开在石头缝里的小黄花，‘那个……是不是像你哥哥笑起来的样子？’\n女孩停止了哭泣。她扑过去，小心翼翼地抱住了那朵花，脸上露出了混着泪水的笑容。\n我站起身，裙摆上全是泥土。但我第一次觉得，这泥土的味道……并不难闻。它混合着腐朽与新生，那是……大地的味道。”"
 PAM_.21.a: "（原来，死亡也可以开花。）"

 # 莉莉安娜好感度 60
 PAM_.22.t: "神明的谎言"
 PAM_.22.d: "“今晚的月光很冷，照得索拉娜的脸像一张白纸。她又在做噩梦了，梦里喊着‘饿’，喊着‘别抢我的面包’。\n我握着她的手，那只手即使在睡梦中也紧紧攥着拳头，仿佛随时准备挥出去。我看着她，又看向窗外那个沉睡的城市。那里有无数和她一样的人，在梦里依旧不敢松开眉头。\n我曾以为，我是神明，我拥有永恒。我曾以为，只要把他们带回夜莺之国，赐予他们寂静，就是最大的仁慈。那里没有饥饿，没有争抢，没有痛苦。\n但我错了。\n今天下午，我看到一个断了腿的老兵，为了给孙女买一个风车，在街角坐了一整天。他很累，很痛，但他看着孙女拿着风车奔跑时，那张满是皱纹的脸上绽放出的光彩，比我见过的任何星辰都要耀眼。\n那一刻我明白了。我的永恒是虚假的。它只是把时间冻结，把痛苦和快乐一起剥离，那是标本的永恒，不是生命的永恒。\n真正的活着，就是会痛，会饿，会流血，但也正因为会痛，那个拥抱才温暖；正因为会饿，那口面包才香甜。\n我所谓的救赎，其实是一种傲慢的剥夺。我剥夺了他们感受痛苦的权利，也就剥夺了他们感受幸福的资格。\n索拉娜……你这个傻瓜。你早就知道这些了，对吗？所以你才宁愿在泥潭里打滚，也不愿做我笼子里的金丝雀。\n我俯下身，吻了吻她紧皱的眉心。\n‘对不起。’我轻声说，‘我不会再试图把你们变成雕像了。我会守在这里，守着你们的痛，守着你们的梦。’”"
 PAM_.22.a: "（痛楚……才是活着的勋章。）"

 # 莉莉安娜好感度 80
 PAM_.23.t: "染血的白裙"
 PAM_.23.d: "“敌人的突袭来得毫无征兆。炮火撕碎了防线，指挥部被炸塌了一半。索拉娜被埋在了废墟下，生死未卜。晓枫在组织反击，雪伊在带人挖掘。\n周围全是伤员，哀嚎声此起彼伏。医疗品用光了，医生们束手无策。一个年轻的护士跪在血泊里，绝望地捂着一个士兵脖子上的大动脉，但血依然像喷泉一样涌出来。\n‘止不住……止不住啊！’她哭喊着。\n我站在那里，看着那鲜红的液体染红了地面。那是生命，正在流逝的生命。\n我有能力救他。但我知道代价。在生者的世界使用这种逆转生死的魔法，会反噬我的灵体，会让我的灵魂染上无法洗净的污秽。\n我是冥界的公主，我本该一尘不染。\n‘……莉莉安娜，走吧。’心底有个声音在劝我，‘这不是你的战争，你已经做得够多了。’\n我看向废墟深处，那里埋着我最爱的人。如果她醒来，看到满地的尸体，她会疯的。\n我深吸了一口气，提着洁白的裙摆，走进了那片血泊。我跪在那个士兵身边，推开了护士的手。\n‘按住他。’我命令道，声音异常冷静。\n我将双手按在他的伤口上，吟唱起那首古老的、被视为禁忌的咒语。幽蓝的光芒与鲜红的血液交织在一起，发出滋滋的声响。我的皮肤开始溃烂，黑色的纹路顺着手臂蔓延，那是生与死冲突留下的诅咒。\n很疼。比我想象的还要疼一万倍。像是有无数把刀在切割我的灵魂。\n但我没有停。直到伤口愈合，直到那个士兵微弱的呼吸重新变得有力。\n我站起身，曾经一尘不染的白裙已经被鲜血染成了暗红，手臂上满是狰狞的黑斑。我看着镜子里的自己，那样丑陋，那样狼狈。\n但我笑了。\n因为我终于……变得和索拉娜一样了。我终于，也染上了这人间的颜色。”"
 PAM_.23.a: "（这脏兮兮的样子……真美。）"

 l_simp_chinese:

 # 莉莉安娜好感度 100
 PAM_.24.t: "裙角的泥点"
 PAM_.24.d: "“战后的第一个丰收节，雨下得很大。索拉娜疯了一样在王宫里咆哮，因为她找不到我了。\n‘她一定是走了！那个傻瓜！她是不是觉得自己多余了？是不是回那个冷冰冰的冥界去了？！’\n我听得见她在雨里的嘶吼，听得见她踹开一扇扇大门的巨响。那声音里全是恐惧。\n但我没有回应。我正忙着。\n我站在城外的一片红薯地里。这里是以前的乱葬岗，现在被垦成了良田。雨水混合着翻开的黑土，变成了黏稠的泥浆，没过了我的脚踝。\n我的那件曾象征着冥界至高无上的、一尘不染的白色长裙，此刻已经吸饱了泥水，沉甸甸地拖在地上，脏得像一块抹布。我的双手，那双曾经只用来编织魔咒、只用来触碰灵魂的手，现在沾满了黑色的泥垢，指甲缝里塞满了沙砾。\n我在挖红薯。\n一个穿着破棉袄的老农妇蹲在我旁边，她没有把我当成公主，也没有把我当成神明。她只是把我当成一个笨手笨脚的新手，一边利索地刨土，一边絮絮叨叨地教我：‘闺女，劲儿别使得太死，要顺着根须……哎对，就是这样。’\n我用力一拔，一个并不怎么好看、甚至有些歪瓜裂枣的红薯破土而出。它带着湿润的泥土气息，沉甸甸地压在我的掌心。\n那一瞬间，我感受到了一种比夜莺之心还要强烈的悸动。\n在我的国度里，水晶花永不凋谢，但也永不生长。那里的一切都是静止的完美。\n而手里这个丑陋的红薯，它会腐烂，它身上沾着脏东西，它并不完美。但它里面藏着太阳的热量，藏着雨水的味道，藏着能让人活下去的力量。\n‘找到了！！’\n索拉娜浑身湿透地冲了过来，她看到满身是泥的我，整个人僵在了田埂上。她张大了嘴，像看怪物一样看着我。\n‘莉莉……你……你在干什么？你的裙子……你的手……脏死了！’\n她想冲过来抱我，又怕弄疼我；想骂我，又舍不得。\n我直起腰，用手背擦了擦脸上的雨水（顺便把一道泥印子抹在了脸上），然后举起那个红薯，对着她露出了一个灿烂的、傻气的、甚至有点粗鲁的笑容。\n‘索拉娜，你看。’我大声说，声音穿透了雨幕，‘这是我种出来的。不是变出来的，是种出来的。’\n‘以前我以为，爱是把你关在干净的笼子里，不让你沾染一粒灰尘。现在我懂了。’\n我深一脚浅一脚地走到她面前，把那个脏兮兮的红薯塞进她手里，强行把她那双总是握剑的手，按进了泥土的温度里。\n‘这个世界之所以值得你拼命，不是因为它干净，而是因为它脏得真实，脏得热烈。’\n‘我不走了，索拉娜。冥界太干净了，我不习惯。’\n‘我要留在这里。和你，和晓枫，和这些种地的大娘一起。我要把裙子弄脏，把手磨破，我要学着怎么在这个烂泥坑里……种出最甜的果实。’\n索拉娜呆呆地看着我，又看了看手里的红薯。突然，她把脸埋进了我满是泥水的肩膀，发出了一声像是哭，又像是笑的闷响。\n雨还在下，但我知道，从这一刻起……\n我终于，真正地，降临在了人间。”"
 PAM_.24.a: "（欢迎来到这脏兮兮的、美好的人间。）"
 PAM.88.t: "来自壁炉旁的连线"
 PAM.88.d: "“……喂？索拉娜？是我。\n不许吼，也不许再踹门了。我听得见你在走廊里像头焦虑的狮子一样转圈的声音。\n我现在在厨房里。……不，别进来。我就想隔着这根线跟你说几句话。\n我刚刚把那个红薯洗了。我洗得很认真，可那上面还是坑坑洼洼的，就像你脸上的伤疤一样，怎么洗都洗不掉那种粗糙的感觉。那位大娘说，这叫土气，是好东西。\n你知道吗？在夜莺之国的一万年里，我的手总是凉的，摸到的宝石也是凉的。我从来不知道，原来东西还可以是糙的，还可以是热的。\n现在，我的指甲缝里还有泥，我的裙摆还没干，但我感觉……我从来没有像此刻这样，和你靠得这么近。\n你总是说要把我捧在天上，但我不想在天上了。天上太冷，也没有你。\n既然你是一头满身泥泞的狼，那我就做那个在泥地里种花的园丁。我们一起脏，一起累，这才叫一家人，对不对？\n……好了，炉子热了。我问过厨师了，他说这个要烤着吃才最香。\n进来吧，我的狼王。\n今晚没有国宴，只有我亲手种、亲手洗、亲手烤的红薯。\n……而且，你必须吃完，还得夸我做得好吃。这是……公主的命令。”"
 PAM.88.a: "（嘟—嘟——电话那头传来了木柴爆裂的噼啪声）"

  # 百灵好感度 0
 PAM_.25.t: "胃里的石头"
 PAM_.25.d: ""深夜，我跪在马桶边，把胆汁都吐了出来。胃里空荡荡的，但我总觉得那里塞满了沉甸甸的石头。那些石头有名字，叫阿雅，叫羞耻，叫苟且偷生。\n我为什么要活着？\n我闭上眼，就能闻到那股肉饼的香气，那是阿雅被剁碎的味道。贵族们优雅的咀嚼声在我脑子里回荡，像是一万只苍蝇在飞。\n索拉娜把漂亮的裙子扔给我，把我锁在这个贴满金箔的房间里。她以为这就叫恩赐？不，这是刑罚。我穿着这身昂贵的丝绸，感觉就像披着一层死人的皮。每呼吸一口气，我都能感觉到自己的肺叶在腐烂。\n我握着那把没能刺出去的匕首，刀刃冰凉，贴在手腕的动脉上。只要轻轻一下，我就能去陪阿雅了。我就能把这满肚子的脏东西都流干净了。\n‘……死很容易。’那个女人的声音突然在门外响起，像是隔着地狱的门缝传来的嘲笑，‘但你死了，谁来替阿雅看着那群肥猪下地狱？’\n我僵住了。刀锋划破了皮肉，渗出一丝血珠。\n是啊。我是一把脏了的刀。既然脏了，就不能用来切面包了。那就……用来切那些该死的烂肉吧。""
 PAM_.25.a: "（再忍忍……等杀够了再死。）"

 # 百灵好感度 20
 PAM_.26.t: "磨刀石"
 PAM_.26.d: ""索拉娜兑现了她的诺言。她把那些曾参与‘晚宴’的贵族，一个个送到了我的刀下。\n第一个人是个伯爵。他跪在地上，鼻涕眼泪流了一脸，哭喊着说他是被逼的。我没有说话，只是机械地挥刀。血喷在我的脸上，热乎乎的。\n我以为我会感到快意。但我没有。\n我只感到一种令人窒息的空虚。杀了他，阿雅也回不来了。杀了他，我手上的血腥味反而更重了。\n我变成了一个纯粹的行刑机器。索拉娜坐在高台上，冷冷地看着我，像是在看一块磨刀石在打磨一把生锈的刀。\n‘手别抖。’她把一杯酒泼在我的脚边，‘这只是开始。你要习惯这种温度，习惯这种把人的生命像掐灭蜡烛一样掐灭的感觉。’\n我看着她。这个暴君，这个疯子。她明明在逼我做恶魔的事，可她的眼神里……为什么没有那种贵族特有的、以杀戮为乐的贪婪？\n她看尸体的眼神，就像在看一堆必须被清理的垃圾。\n‘你也觉得恶心，对吧？’我突然问她。\n她愣了一下，随即咧开嘴，露出了一个狰狞的笑：‘恶心？当然恶心。但如果我不做这扫垃圾的活儿，这屋子……永远干净不了。’\n那一刻，我握刀的手，突然稳了一些。""
 PAM_.26.a: "（那就一起……下地狱吧。）"

 # 百灵好感度 40
 PAM_.27.t: "并不干净的手帕"
 PAM_.27.d: ""今天，我陪她去视察刚打下来的港口。有人在暗处放冷枪。\n那是我的失职——子弹擦着索拉娜的脸颊飞过去，留下一道血痕。我疯了一样冲进人群，把那个刺客按在地上，正准备割断他的喉咙。\n‘住手！’\n索拉娜却一脚踢开了我的手。她走过来，脸上挂着血，却笑得像个混蛋。\n‘是个孩子。’她指着那个只有十几岁的、吓得尿裤子的男孩，‘看他的眼睛。那是饿狼的眼睛，不是狗的眼睛。他想杀我，是因为他觉得我抢了他的家。’\n她蹲下身，把自己那条沾着火药味和汗臭味的领巾扯下来，胡乱地在那个男孩脸上擦了一把，把他脸上的泥污擦掉。\n‘别急着死。’她对那个想杀她的男孩说，‘留着命，看清楚我是谁。如果过两年你还觉得我是坏人，再来杀我不迟。那时候，记得瞄准点。’\n她放走了那个刺客。然后，她转过身，看到了浑身僵硬、拿着匕首不知所措的我。\n她看着我眼里的惊恐——我以为她会惩罚我，甚至处死我。\n可她只是走过来，用那条刚刚给刺客擦过脸的、脏兮兮的领巾，也在我脸上用力地擦了一下。\n‘傻鸟。’她嘟囔着，‘下次别冲那么快。你这小身板，挡不住子弹的。’\n那块布很粗糙，磨得脸生疼。上面还有那股难闻的味道。\n但我却觉得……那是这世上，最干净的东西。""
 PAM_.27.a: "（她……为什么不杀我？）"

 # 百灵好感度 60
 PAM_.28.t: "笼门的缝隙"
 PAM_.28.d: ""‘你就是百灵？’\n那个叫小果子的女孩找到了我。她手里捧着一个纸袋，里面装着刚烤好的小饼干。\n我本能地后退，手按在刀柄上。在这个宫殿里，我是异类，是阴影里的鬼魂，没人愿意靠近我。\n‘索拉娜姐姐让我给你的。’小果子也不怕，直接把饼干塞进我怀里，‘她说你最近瘦了，脸色像鬼一样，再不吃点甜的，就要变成真的亡灵了。’\n我捧着那袋饼干，温热的触感透过纸袋传到手心。\n‘出来走走吧。’小果子拉开窗帘，指着外面的花园，‘莉莉安娜姐姐种的花开了，晓枫姐在教大家认字。这个世界……已经不一样了。’\n我看向窗外。那里不再是充满血腥味的刑场，而是充满了吵闹声、读书声和欢笑声的人间。\n我看到索拉娜正被莉莉安娜按在椅子上梳头，一脸的不耐烦却又不敢乱动；我看到雪伊正对着一群新兵咆哮，但手里却拿着给她们补衣服的针线。\n这……就是她用那些残忍手段换来的东西吗？\n这就是……阿雅曾经梦想过的，不用再害怕被吃掉的世界吗？\n我拿起一块饼干，放进嘴里。很甜，甜得让我舌头发苦。\n原来，笼子的门早就打开了。把我关在里面的，不是索拉娜，是我自己那颗……还在流血的心。""
 PAM_.28.a: "（外面的风……是暖的。）"

 l_simp_chinese:

 # 百灵好感度 80
 PAM_.29.t: "刀鞘的温度"
 PAM_.29.d: ""深夜的寝宫里没有点灯，只有月光像惨白的霜一样洒在地上。\n索拉娜坐在窗台上，那件总是披在肩上的狼皮大衣滑落在地。她刚刚结束了一场针对旧贵族反扑势力的血腥清洗，身上还带着浓重的铁锈味。她低着头，正在笨拙地试图擦拭那把象征权力的长剑，但手上的血太滑，总是擦不干净。\n‘……该死。’她低声咒骂，声音里透着一股我从未听过的、深深的疲惫，‘这血怎么这么黏……像胶水一样，粘上了就洗不掉。’\n我从阴影里走了出来。我的步子很轻，背带裙随着动作微微摆动，像是一只误入屠场的蝴蝶。\n她没有回头。在这个到处都是敌人的宫殿里，她把后背完全留给了我。\n我走到她面前，跪下来，接过那把剑。我从裙子的口袋里掏出那块她曾经给我擦过脸的脏领巾，一点一点，仔细地擦拭着剑锋上的血污。\n‘百灵。’她突然开口，声音很轻，‘这活儿不该你干。你的手这么小，应该去拿花，去拿糖果，而不是在这里擦这种脏东西。’\n我停下了动作，抬头看着她。她的眼睛里没有了白天的狂妄，只有一片像荒原一样辽阔的空虚，还有一丝……想要把我推开的犹豫。\n‘我的手不干净，陛下。’\n我握住她那只还在微微颤抖的手，把我的脸颊贴在她冰凉的掌心里。那是一种粗糙的、带着火药味的触感，却让我感到无比安心。\n‘从我拿起刀的那一刻起，我就再也拿不起花来了。是您给了我存在的意义。’\n‘如果杀人是罪，那就让我来背。如果血洗不掉，那就让它干在手上，变成我们的手套。’\n我把擦干净的剑重新塞回她的手里，然后握住她的手，将剑尖指向窗外那片沉睡的、属于我们的城市。\n‘您只管挥剑。不管是砍向敌人，还是砍向这个该死的世界。’\n‘而我……’我抬起头，双马尾在月光下垂落，眼神里不再有迷茫，只有一种近乎献祭般的虔诚。\n‘我是您的刀鞘。当您累了，当这把剑太锋利会伤到您自己的时候……就藏进我这里。我会替您挡住所有的寒意，我会替您收敛所有的锋芒。’\n索拉娜愣住了。她看着我，看着我这身与杀戮格格不入的背带裙装，那双总是燃烧着野心的眼睛里，第一次流露出了一种名为不舍的脆弱。\n‘……傻瓜。跟着我，你会万劫不复的。’\n‘我不怕。’我轻声回答，‘我只怕……您的身边没有我。’"
 PAM_.29.a: "（您是火，我是灰。我们……分不开了。）"

 # 百灵好感度 100
 PAM_.30.t: "裙摆下的獠牙"
 PAM_.30.d: "“出征的号角已经吹响，舰队的黑帆遮蔽了整个海湾。索拉娜站在旗舰的龙骨上，正在接受万军的欢呼。她是那样耀眼，那样狂妄，像是要吞噬太阳的巨狼。\n我站在码头的阴影里，最后一次整理着我的背带裙，将匕首绑在长袜的边缘，藏进蕾丝花边之下。\n‘喂！那个躲在角落里的小鬼！’\n索拉娜突然回过头，隔着攒动的人头冲我大喊。海风吹乱了她的金发，她的声音里带着一丝焦急，甚至是恐吓。\n‘船要开了！这是去地狱的单程票！你给我留在岸上！听见没有？！’\n她的手死死抓着栏杆，指节发白。她在怕。她不怕前面的敌人，但她怕我跟上来。她想把我留在她打下的这个和平世界里，让我像个普通女孩一样干净地活着，而不是跟着她去尸山血海里打滚。\n我笑了。这是我第一次在阳光下露出如此轻松的笑容。\n我没有理会她的命令，也没有走向那艘光鲜亮丽的旗舰。我走向了旁边一艘不起眼的、没有任何标记的黑色快艇——那是专门为‘清道夫’准备的船。\n‘陛下，狼群不需要两只头狼。’\n我对着那个高高在上的身影，轻轻地说，声音却顺着海风清晰地传到了她的耳朵里。\n‘但狼王……不能没有影子。’\n我跳上船，海风吹起我的双马尾和裙摆，让我看起来像个准备去春游的学生，而不是一个去收割生命的死神。\n‘您想把我留在光里？可光太刺眼了，我会睡不着的。’\n‘我会飞在您看不见的死角，我会啄瞎那些想在背后放冷枪的眼睛。我会清理战场上的腐肉，我会把那些肮脏的、不光彩的、没法写进史诗里的罪恶，统统吞进我的肚子里。’\n‘您负责在史书里光芒万丈，而我……负责在注脚里为您守住黑暗。’\n我轻轻提着裙角，向她行了一个不像杀手、倒像是个淑女的屈膝礼，然后指尖滑过藏在腿侧的刀柄。\n‘别赶我走，索拉娜。没有我……谁来帮您擦剑呢？’\n索拉娜怔怔地看着我，看着我这副天真又残忍的模样，看着我那双写满了‘绝不回头’的眼睛。她的嘴唇颤抖了几下，最终，那份担忧化为了一声无奈却又纵容的长叹。\n她猛地挥手，指向前方，眼角似乎有一闪而过的晶莹：\n‘……真是个……不听话的混蛋！’\n‘那就跟上来！别掉队了！要是敢死在我看不见的地方……我就去冥界把你抓回来！’\n汽笛轰鸣，黑烟滚滚。我站在船头，迎着扑面而来的腥咸海风。我不需要黑色的斗篷来伪装，因为我这身干净的裙子，才是对这个残酷世界最大的嘲讽。在这条通往地狱的航线上，我终于……找到了属于我的归宿。”"
 PAM_.30.a: "（起航！为了……守护这头笨拙的狼！）"
 PAM.89.t: "来自黑色快艇的低频信号"
 PAM.89.d: "“……喂？陛下。……是我。\n别拿望远镜找了，我在您的旗舰影子里，那个浪花溅不到的死角。这艘小船有点颠，但我把裙子熨得很平整，双马尾也重新梳好了。您放心，我现在看起来一点也不像个死神，就像个跟着姐姐出来春游的乖学生。\n您刚才在码头上吼得真凶……但我听得出来，您是在发抖。您怕那边的世界太脏，怕血溅到我的白袜子上，对吧？\n可是陛下，您这头狼太笨了。您总是想把所有人都护在肚皮底下，那谁来护着您的后背呢？\n以后，请您只管昂着头，去迎接那些欢呼，去征服那些阳光下的土地。至于那些躲在暗礁后面的冷箭，那些想在您背后捅刀子的懦夫，还有那些不体面的、没法写进史诗里的脏活……\n统统交给我。\n我会用这双您觉得应该拿糖果的手，把他们的喉咙割开，然后把尸体绑上石头，安安静静地沉进海底。不会有人知道，也不会有人看见。\n这就是我的自由——在这个残酷的世界里，为了让您一尘不染，我愿意在淤泥里开出花来。\n……海风很大，您回舱去吧。别回头看黑暗。\n因为在黑暗里……我正爱着您。”"
 PAM.89.a: "（嘟—嘟——信号在海风中中断了）"