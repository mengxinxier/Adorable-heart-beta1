####国策####
#一线政治
PAM_nbyz: "那把椅子太硬了"
PAM_nbyz_desc: "“我不喜欢那些老头子看我的眼神。他们弯着腰，说着我不懂的漂亮话，递上来一堆画满蚂蚁一样黑字的纸。他们以为我看不懂？哈，我当然看不懂！但我闻得出来——那股子发霉的、想要把我架空的臭味，跟当年在贫民窟想要从我手里抢走面包的野狗一模一样。\n把那些文件都拿去烧炉子！告诉他们，在这个大厅里，只有我坐着的时候，他们才能说话。如果谁敢用那些绕来绕去的词儿来糊弄我，我就让他把这把椅子的硬度，用脑门亲自试一遍。”"

PAM_ssnz: "撕碎那些纸！"
PAM_ssnz_desc: "“法律？程序？审批？那是给吃饱了没事干的人玩的迷宫游戏。我要建一道墙，那就是现在、立刻、马上！我要那个工厂转起来，不是等你们盖满一百个章，而是现在就去把那些不听话的监工挂在路灯上！\n我不识字，但我识数。我只看结果：要么把我要的东西摆在桌上，要么把你们的脑袋摆在桌上。这才是一个女王该有的效率，不是吗？”"

PAM_hjbz: "黄金，或者鞭子"
PAM_hjbz_desc: "“我知道那些当兵的想要什么。别跟我谈什么荣誉，什么国家，那都是以前那些贵族老爷骗人去送死的鬼话。我以前也是烂泥里爬出来的，我最清楚——能让人卖命的，只有两样东西：手里沉甸甸的金子，和背上火辣辣的鞭子。\n把库房打开！把那些以前贵族们藏着掖着的宝贝都搬出来！只要她们肯把枪口对准那些叫野火的疯狗，我就给她们金子。如果她们不敢……哼，那我就让她们知道，我这条从地狱里回来的疯狗，咬人有多疼。”"
PAM_hjbz2: "黄金，或者鞭子"
PAM_hjbz2_desc: "“我知道那些当兵的想要什么。别跟我谈什么荣誉，什么国家，那都是以前那些贵族老爷骗人去送死的鬼话。我以前也是烂泥里爬出来的，我最清楚——能让人卖命的，只有两样东西：手里沉甸甸的金子，和背上火辣辣的鞭子。\n把库房打开！把那些以前贵族们藏着掖着的宝贝都搬出来！只要她们肯把枪口对准那些叫野火的疯狗，我就给她们金子。如果她们不敢……哼，那我就让她们知道，我这条从地狱里回来的疯狗，咬人有多疼。”"
PAM_xtzy: "心跳的杂音"
PAM_xtzy_desc: "“最近……这里总是很吵。不是外面的那些苍蝇在吵，是这里，我的胸口里。是那颗心。那颗我亲手从莉莉胸膛里挖出来、硬塞进我自己身体里的心脏。它在跳，跳得好快，好烫，像是在对我说话。它说：‘杀光她们。’它说：‘只有死人才是最听话的。’它说：‘你看，那些活人多脏啊，她们会背叛，会撒谎。不像莉莉的那些人偶……’闭嘴！闭嘴！我知道我在做什么！既然我把它抢来了，它就是我的！我只是需要一点力量，一点点就够了。等我把那些想抢走这一切的野火踩灭，我就……我就把这一切都变得干干净净，送给莉莉。”"

PAM_sszr: "谁才是主人？"
PAM_sszr_desc: "“瞧瞧他们现在的样子。以前，他们也是这么看我的。那时候我跪在泥水里，求他们赏一块发霉的面包，他们就用这双擦得锃亮的靴子，踢我的脸。\n现在，轮到我穿靴子了。\n怎么？觉得我粗鲁？觉得我残暴？那是你们教我的啊！我所有的手段，我所有的‘规矩’，不都是从你们的皮鞭和冷眼里学会的吗？\n现在你们哭什么？笑啊！都给我笑！就像你们以前看猴戏一样！在这场戏里，拿鞭子的人，是我。”"

PAM_bxaj: "§R不许……那么安静！§!"
PAM_bxaj_desc: "“我不喜欢做那个梦。\n梦里总是那个样子——没有风，没有声音，连灰尘都悬在半空不动。莉莉就坐在那堆冷冰冰的水晶花中间，像个精致的死人。不管我怎么喊她，怎么摇她，她都只是那样……静静地看着我。那眼神看得我发冷，比以前冬天光着脚踩在雪地里还要冷。\n我讨厌那个地方！我讨厌那种连心跳声都听不见的‘完美’！\n人活着，就该是吵闹的！就该是乱糟糟的！就该有哭声，有笑声，有骂娘的声音，有骨头断裂的声音！那才叫热乎气儿！那才叫‘活着’！\n我把这颗心抢过来，不是为了毁掉她。我是为了……把这股热气儿带给她。我想给她造一个金灿灿的、闹哄哄的笼子，把她关在太阳底下，让她也被烫一下，让她也……流点汗，流点血。\n可是现在，那群叫‘野火’的泥腿子，她们想干什么？她们想让我闭嘴？她们想让我的王国也变成一片死寂的废墟？\n休想！！\n把所有的炮都给我拉出来！让工厂的汽笛日夜不停地叫！让那些贵族和奴隶一起吼！\n我要让这片大陆吵得连死人都睡不着！我要让莉莉睁开眼就能看到……这虽然很疼，但无比鲜活的世界！”"
PAM_bxaj1: "§R不许……那么安静！§!"
PAM_bxaj1_desc: "“我不喜欢做那个梦。\n梦里总是那个样子——没有风，没有声音，连灰尘都悬在半空不动。莉莉就坐在那堆冷冰冰的水晶花中间，像个精致的死人。不管我怎么喊她，怎么摇她，她都只是那样……静静地看着我。那眼神看得我发冷，比以前冬天光着脚踩在雪地里还要冷。\n我讨厌那个地方！我讨厌那种连心跳声都听不见的‘完美’！\n人活着，就该是吵闹的！就该是乱糟糟的！就该有哭声，有笑声，有骂娘的声音，有骨头断裂的声音！那才叫热乎气儿！那才叫‘活着’！\n我把这颗心抢过来，不是为了毁掉她。我是为了……把这股热气儿带给她。我想给她造一个金灿灿的、闹哄哄的笼子，把她关在太阳底下，让她也被烫一下，让她也……流点汗，流点血。\n可是现在，那群叫‘野火’的泥腿子，她们想干什么？她们想让我闭嘴？她们想让我的王国也变成一片死寂的废墟？\n休想！！\n把所有的炮都给我拉出来！让工厂的汽笛日夜不停地叫！让那些贵族和奴隶一起吼！\n我要让这片大陆吵得连死人都睡不着！我要让莉莉睁开眼就能看到……这虽然很疼，但无比鲜活的世界！”"
