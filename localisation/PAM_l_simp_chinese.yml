#一线政治
PAM_jjbz: "荆棘编织的王冠"
PAM_jjbz_desc: "“这东西沉得要死，还磨破了我的头皮。那些老家伙说这是权力的象征，但我只觉得它像个紧箍咒。不过没关系，只要我戴着它，底下那群蠢货就会跪下。那就戴着吧，直到我把它熔了换钱的那一天。”"

PAM_rsfc: "忍受那股腐臭的香气"
PAM_rsfc_desc: "“那些公爵和大臣凑过来的时候，身上的香水味混着雪茄味，比下水道里的死老鼠还难闻。他们想要减税？想要特权？行，都给他们。只要他们把工厂里的枪和罐头交出来。我想吐，但我得忍着，因为野火那帮疯子正在烧我的地盘。”"

PAM_blsf: "冰冷的私房钱"
PAM_blsf_desc: "“莉莉安娜那个傻瓜，守着这么强大的力量却只会用来种花。我从她那里带出来的东西，不仅是纪念品，更是底牌。这些亡灵士兵不需要吃饭，不需要发军饷，也不会问为什么。除了有点冷，它们比那些贪婪的贵族好用多了。”"

PAM_wbsz: "我不识字，但我识数"
PAM_wbsz_desc: "“那个财政大臣拿来一堆写满鬼画符的纸，跟我说什么‘通货膨胀’和‘宏观调控’。我一枪把他的帽子打飞了。听着，在这个国家，经济很简单：我需要多少枪，工厂就得造多少；我需要多少面包，农民就得交多少。谁敢藏私，我就剁谁的手指头。我不识字，但我会数人头和子弹，这就够了。”"

PAM_sqtd: "谁拳头大谁有理"
PAM_sqtd_desc: "“小时候在贫民窟抢面包，没人跟我讲道理。现在当了女王，这道理也一样。野火那帮人想造反？那就打。贵族想听话？那就吓。谁的枪多，谁的声音就大。去告诉那些将军，别给我整什么复杂的战略，我只要看到敌人的尸体堆成山。”"

PAM_jjfz: "我要建一座金房子"
PAM_jjfz_desc: "“等我杀光了叛徒，榨干了贵族，我就要用这片大陆上所有的金子，盖一座最大的房子。里面要有永远烧不完的壁炉，永远吃不完的白面包，还有最软的床。……那样的话，等我把莉莉接回来的时候，她就不会嫌弃这里脏了。她那么干净，一定得住金房子才行。哪怕为了这个，我也要把这该死的世界，彻底踩在脚下。”"

