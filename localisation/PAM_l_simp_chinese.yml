PAM_call_for_family_photo:0 "§O画下这群混蛋！§!"
PAM_call_for_family_photo_desc:0 "“我都数不清我们赢了多少场仗，抢了多少座金山了。但我突然发现，我最值钱的战利品，好像一直就在这间屋子里转悠。\n那个总是皱着眉头的管家婆晓枫，那个整天擦枪的疯狗雪伊，那个睡得流口水的小海鸥，还有那个躲在影子里的小怪物……当然，还有我的莉莉。\n谁也别想跑。哪怕是死神来了，也得先过我这一关。\n去！把最好的画师给我抓来！我要他把这一刻画下来。告诉他：‘把我们画得开心点，画得嚣张点！’\n我要把这张画挂在世界的最高处，告诉所有人——看啊，这就是老子的家！”"

PAM_mission_xiaofeng_chip_exchange_proposal:0 "§Y参谋长的销赃提案§!"
PAM_mission_xiaofeng_chip_exchange_proposal_desc:0 "头儿，请看看您脚边那堆积如山的胜利筹码。那是您在外交赌桌上赢来的战利品，象征着您的威慑力和好运气。\n但请恕我直言——运气挡不住子弹，金币也填不饱肚子。如果我们即将发动席卷整个大陆的攻势，这些死物堆在库房里毫无意义。\n我建议……把它们花出去。\n不仅是换成钢铁和石油，更要换成……人心。\n雪伊需要更精良的装备来发泄怒火，小果子需要更精密的仪器来克服恐惧，而我也需要一些……稀缺的孤本资料来完善战术。\n如果您愿意将这些筹码交给我运作，我保证，它们换回来的忠诚与士气，会比黄金更保值。”"
PAM.80.t: "来自四号仓库的电话"
PAM.80.d: "“喂？头儿，是我，晓枫。\n……不，我没在抱怨，我只是刚从四号仓库出来，眼睛被那些反光的东西晃得有点疼。\n您在赌桌上赢回来的那些战利品——那些金筹码、地契、还有别的领主输掉的家徽——已经快把过道堵死了。甚至连雪伊的巡逻队路过都得侧着身子。\n听我说，头儿。运气这东西，如果不兑现成铁和血，那就只是一堆好看的废品。运气挡不住重炮，金子也塞不进枪膛里。\n我刚刚拟定了一份……唔，让我们称之为战略销赃的计划书。既然我们要去撕咬更大的猎物，就得先磨磨牙。\n雪伊那边的火气很大，我们需要更重型的装备来让她发泄；小果子还在对着海上的迷雾发抖，几套昂贵的精密仪器或许能让她安静下来；至于我……咳，黑市上流出了几本旧帝国的绝版战术手稿，我觉得它们比放在收藏家的保险柜里更有价值。\n别再像个守财奴一样盯着那堆筹码傻笑了。把它们交给我运作。\n授权书就在您手边，压在那盘葡萄下面。签了它，我会把这些虚无缥缈的好运，变成您手里实打实的……鞭子和糖。”"
PAM.80.a: "（嘟——嘟——电话挂断了）"

PAM_mission_lilianas_lullaby:0 "§1静谧的安抚§!"
PAM_mission_lilianas_lullaby_desc:0 "莉莉安娜带着那些“夜莺的魂灵”，走进了燃烧的庄园。她要用冥界的寒气压制火焰，用灵魂的歌声瓦解贵族的疯狂。\n但这需要物质的支持——我们需要向那个地区投入大量的民用资源，来证明我们比旧贵族更值得追随，从而从内部瓦解他们的封锁。"
PAM.81.t: "听筒里的呼吸声"
PAM.81.d: "“……喂？……索拉娜？”\n一阵刺耳的摩擦声后，那个熟悉的声音才怯生生地从听筒里传出来，带着一丝明显的不确信和小心翼翼。\n“……笃、笃。是这样拿吗？晓枫说……要把带孔的这头贴在嘴边……好奇怪，它在震动，就像一直被捏住喉咙的小鸟。”\n“……你能听到我吗？这根黑色的线……真的能一直连到你的房间里吗？”\n电话那头传来了深吸一口气的声音，接着是她变得稍微坚定了一些的语调，虽然背景里还能听到隐约的火焰爆裂声和人群的嘶吼。\n“我在西边的庄园这里。火烧得很大，那些贵族把自己锁在里面发疯，外面的平民在砸门。太吵了……大家都很痛苦，连空气都在尖叫。”\n“我想……让夜莺的孩子们进去。我想给她们唱首歌，把火压下去，让她们的心也静一静。但是晓枫告诉我，光有歌声填不饱肚子，也修不好被烧坏的屋顶，饥饿的人是听不见摇篮曲的。”\n“所以，索拉娜……能不能……借我一点你的那些‘工厂’？或者是……那些用来造房子的物资？”\n“我想把这里变成一个像我们花园那样……安安静静、不会有人受伤的地方。只要把东西运过来，证明我们会修好一切，我就有办法让那些疯掉的贵族和愤怒的人群……都乖乖睡着。”\n“……呀！它又响了一声！我是不是把它弄坏了？我要挂——”"
PAM.81.a: "（嘟——嘟——她好像吓得把电话扔了）"

PAM_mission_scavengers_cleanup:0 "§8阴影中的鸟儿§!"
PAM_mission_scavengers_cleanup_desc:0 "百灵需要资源来编织她的网。她不仅要杀人，还要诛心。她需要建立一个庞大的情报网络，渗透进每一个角落，找出那些搞破坏的幕后黑手。\n我们要给她足够的权限和支持，让她在黑暗中起舞。"
PAM.82.t: "来自下水道的低语"
PAM.82.d: "“……陛下？是我。我在下水道的通风口旁边，不用担心，这里只有老鼠听得见。\n您在光亮的大道上走得太快了，影子被拉得很长。而在那些您看不见的阴影里……有些虫子开始在您的脚印里产卵了。那些被烧毁的庄园废墟下，还有人在用只有彼此能听懂的暗号窃窃私语。\n光靠我这一把匕首，刮不干净这些顽固的苔藓。我需要一张网……一张能盖住整座城市的、粘稠的网。\n我要让每一个乞丐、每一个在后巷翻垃圾的流浪汉、甚至墙角的野猫，都变成我的眼睛。我要知道那些想搞破坏的人在哪吃饭，在哪睡觉，甚至在哪做梦。\n但这需要诱饵。情报是贵的，有时候比人命还贵。把那些见不得光的资金拨给我，给我最高的清理权限。\n别问我会怎么做。您只需要站在阳光下接受欢呼就好。至于那些脏东西……\n……把它们交给我这只乌鸦。等您明天醒来的时候，您的御座底下，会比镜子还要干净。”"
PAM.82.a: "（嘟——只有电流的沙沙声）"

PAM_mission_build_nest_for_seagull:0 "§9给海鸥筑巢§!"
PAM_mission_build_nest_for_seagull_desc:0 "“南美洲已经被我们吃干抹净了，剩下的只有骨头渣子。现在的风里，全是海对岸那股腐朽又诱人的老钱味儿。\n但我那个负责管船的小不点——小果子，她今天把一张比桌子还大的蓝图拍在了我的烤羊腿上。\n她指着那是深水区，眼神亮得吓人：‘头儿，狼爪子游不到大西洋对岸。如果您想去撕咬那些老牌帝国的喉咙，我们以前那些破舢板可不行。我们需要大船，那种能装下整座城市、能抗住十级风浪的钢铁巨兽。’\n‘为此，我需要一个能生出这些怪物的巢穴。’\n哈！听听！她以前连要块糖都不敢大声说话，现在竟然敢跟我要半个大陆的钢铁产量去填海？\n但我喜欢她现在这副贪心的样子！这才像是我养大的狼崽子！\n准了！去把海岸线炸开！去把山挖空！既然我的小海军上将想要一个能给全世界洗澡的大浴缸……那老子就给她挖一个！”"
PAM.83.t: "来自海浪的咆哮"
PAM.83.d: "“……喂？头儿？能不能……先把嘴里的骨头吐出来听我说？\n我在最南边的海岬上，这里的海风比刀子还硬，但我闻到了……风里全是海对岸那股子腐朽又诱人的老钱味儿。\n您说南美洲已经被我们吃干抹净了，想去撕咬那些老牌帝国的喉咙？那您就得听实话——狼爪子游不过大西洋。我们现在手里那些改装的破渔船，碰到真正的皇家海军，那就是给鲨鱼送点心。\n如果您真想去那边吃自助餐，我就得给您造出能跨海的钢铁盘子。\n把地图打开，看我标红的那块深水区。我要在那里建一个窝。不是那种停小舢板的烂泥塘，我要把这一整条海岸线的礁石都炸平，把山掏空灌进水泥。我要造那种……能把整座城市都装进去、能抗住十级风浪的钢铁怪物。\n这很贵，我知道。晓枫姐可能会心疼得骂人，这可能要花掉您刚抢来的一半钢铁产量。\n但是……如果不给，您的狼群就只能在这边岸上对着大海干嚎。\n图纸我已经让亡灵信使送过去了，就在您的烤羊腿旁边。头儿……为了那顿跨洋的大餐，您敢签吗？”"
PAM.83.a: "（嘟——嘟——海浪声盖过了一切）"

PAM_mission_xueyi_iron_umbrella:0 "§t给泥腿子的铁伞§!"
PAM_mission_xueyi_iron_umbrella_desc:0 "“把那张该死的战略轰炸图纸给我撤了！\n索拉娜，你脑子里只想着怎么把敌人的城市炸平，怎么去抢她们的工厂。但你有没有想过，我们要跨过大洋，去别人的地盘上打仗？\n当我的士兵——那些刚从贫民窟里走出来、还没来得及享受几天好日子的孩子们，在滩头被敌人的机枪压得抬不起头时，你那些飞在几万米高空的轰炸机能干什么？给她们收尸吗？！\n我不懂什么空气动力学，但我懂战壕里的规矩。\n我要一种新飞机。别给我整那些花里胡哨的。我要它皮糙肉厚，耐操，能挂满炸弹和机枪。\n我要让飞行员学会贴地飞行。告诉她们，别想着在天上当骑士，要像秃鹫一样俯冲下去，把那些敢向我的步兵开火的火力点，一个一个给我拔掉！\n给我造够一千架这种‘飞行坦克’！如果登陆那天，我看到有一个士兵因为头顶上没人掩护而死，我就亲自把空军司令挂在起落架上！”"
PAM.84.t: "来自靶场的咆哮"
PAM.84.d: "“喂？索拉娜！把你的酒杯放下，听我说！……我刚把空军部送来的那叠战略轰炸图纸给撕了，拿去引火都嫌纸太硬！\n你脑子里是不是只有抢工厂和炸大楼？你知不知道我们要去哪？我们要跨过大洋，去别人的地盘上硬碰硬！\n当我们的泥腿子们——那些好不容易才吃上两顿饱饭、刚学会怎么穿军靴的孩子们——在滩头上被重机枪压得抬不起头的时候，你那些飞在几万米高空的大鸟能干什么？给她们撒花瓣送行吗？！\n我不懂什么空气动力学，也不管那飞机飞起来漂不漂亮。我只要一种东西——能贴着地皮飞的‘飞行坦克’！\n我要它皮糙肉厚，耐操，哪怕被打掉半个翅膀也能飞回来；我要它挂满炸弹和机枪，像秃鹫一样俯冲下去，把那些敢向我们的步兵开火的火力点，一个一个给我拔掉！\n给我造够一千架！告诉那些飞行员，别想着在天上当骑士，给我滚下来去泥地里护着步兵！如果登陆那天，我看到有一个士兵因为头顶上没伞遮着而死……我就亲自把空军司令挂在起落架上！签发令就在你桌子上，现在，立刻，给我签！”"
PAM.84.a: "（嘟——嘟——还能听到远处的枪炮声）"

PAM_mission_feed_the_mad_dog:0 "§R不仅是断头饭§!"
PAM_mission_feed_the_mad_dog_desc:0 "“雪伊的那群兵还在盯着手里的烂枪发愁？那是饿的！没力气怎么扣扳机？\n去，把我的战备粮仓踹开！把那些原本留给贵族老爷享用的熏肉、黄油，还有成桶的烈酒，统统给我搬去前线！\n告诉那个疯女人：‘吃！给老娘往死里吃！只要你的兵能站起来咬死那些骨头架子，老娘就让她们吃得比皇帝还饱！’\n但这顿饭可不是白吃的——吃完了，就得给我拿命去填战壕！”"

PAM_mission_delegate_command:0 "§3移交指挥权§!"
PAM_mission_delegate_command_desc:0 "“前线乱成了一锅粥！我的狼崽子们只知道像没头苍蝇一样冲锋，但那些亡灵却像长了眼睛一样在包抄我们。\n我看过晓枫在牢房墙上画的那些鬼画符……虽然不想承认，但她确实比我懂怎么排兵布阵。\n给她一支笔，或者给她一个指挥部！告诉她：‘别在那儿装深沉了，左翼的防线交给你。要是守不住，我就把你的脑浆挖出来看看是不是也是墨水做的！’”"

PAM_mission_candy_and_recon:0 "§9糖果与侦察§!"
PAM_mission_candy_and_recon_desc:0 "“小果子带回了关键的情报，关于那片紫色雾气最浓的地方。但她回来时脸色惨白，像是丢了魂。\n……也许我该学学莉莉那个笨蛋以前的做法？\n去，把那罐从大公爵那里抢来的、还没过期的水果糖拿给她。\n告诉她：‘拿去吃！别哭丧着脸，看着晦气！吃完了把眼泪擦干，再去给我看看海面上有什么动静。以后……这种甜的，管够。’”"

PAM_mission_song_of_silence:0 "§1让它们闭嘴的歌§!"
PAM_mission_song_of_silence_desc:0 "“外面的骨头架子吵死了！我的炮弹都盖不住它们的嘶吼声。\n莉莉说那是怨气，她说她能让它们安静下来。\n她站在城墙上，只是轻轻哼了一首歌……见鬼，那群疯狗一样的亡灵竟然真的停下来了，像傻了一样站在原地。\n喂！晓枫！别在那儿发呆了！没看见敌人都不动了吗？\n趁着莉莉哄它们睡觉的时候，把你们的刺刀捅进去！给我把它们的头盖骨掀开！\n这是我的公主给你们创造的机会，谁要是敢浪费，我就把她扔下去喂那群醒过来的怪物！”"
#GUI精神
PAM_szax:0 "逝者已经安息"
PAM_szax_desc:0 "睡吧........."
#GUI事件
#晓枫事件
 #1 解锁可点
 PAM_.1.t: "吞炭的喉咙"
 PAM_.1.d: "我把那枚红星徽章缝进了贴身衬衣的最里层，贴着心口，那一块皮肉被粗糙的线头磨得生疼。这疼得好，这疼提醒我还活着，还是个人。\n看着周围这群曾经的死敌——那些穿着黑皮大衣、满嘴脏话的强盗，现在居然成了我的“战友”。昨天那个把半个身子探进泔水桶里找肉吃的家伙，今天就成了我的班长。他递给我一块还在滴油的羊排，咧着嘴笑，牙缝里全是肉渣。\n我接过那块肉，就像接过一块烧红的炭。我的胃在抽搐，在抗议，它记得我们是为了让所有人都有饭吃才拿起枪的，而不是为了像野兽一样抢食。\n但晓枫同志以前教过我们：“人得先站着，才能走道；肚子填饱了，骨头才能硬。”\n我们要把这块烫嘴的肉吞下去，把这份屈辱和那该死的羊油一起咽进肚子里。这胃里烧起来的火，早晚会从喉咙里喷出来，烧穿这个荒谬的世界。\n吃吧。为了有力气把枪握紧，为了有力气……等到黎明真正破晓的那一天。"
 PAM_.1.a: "（吞下去。连同血和泪一起。）"

 #2 完成决议可点
 PAM_.2.t: "谁在撕咬"
 PAM_.2.d: "完了。这次是真的完了。\n那些亡灵像黑色的潮水一样漫过了山头，弹药箱空了，连最后的手榴弹也扔出去了。身边的兄弟倒下了一半，剩下的人背靠背挤在这个泥坑里，喘气声像拉破的风箱。\n我握着工兵铲，看着那些逼近的惨白骨架，脑子里只剩下一个念头：跟这帮怪物拼了。死在这里，我也算对得起这身军装。\n就在那只骨爪要抓破我喉咙的一瞬间——\n轰！！\n面前的骨墙炸开了。不是炸药，是一个人。\n那个疯女人，那个我们恨得牙痒痒的暴君，索拉娜。她就像一头从地狱里冲出来的黑狼，浑身是血，手里那把剑卷了刃，却依然像锯齿一样撕碎了眼前的一切。\n“我的！都是我的！”她嘶吼着，声音比那些亡灵还恐怖，“谁准你们动我的东西！谁准你们吃我的兵！滚开！滚回地底下去！”\n她挡在我们前面，用身体撞，用牙齿咬，比我们要消灭的阶级敌人还要凶残一万倍。她根本不是为了什么崇高的理想在救我们，她只是像个守财奴在护着他的金币，像个护食的野兽在护着他的幼崽。\n可我看着那个疯癫的背影，眼泪却混着泥水流了下来。\n在那一刻，什么主义，什么阵营，都变得模糊了。我只知道，在那面把我们隔绝在死亡之外的盾牌上，刻着的是一个活生生的、正在流血的人。\n原来，这就是我们要找的……那股能把我们从死人堆里拽出来的蛮劲儿。"
 PAM_.2.a: "（跟着她！杀出去！）"

 #3 二阶段国策期间
 PAM_.3.t: "枪油与面包"
 PAM_.3.d: "这批新枪到了。不是那种只有三发子弹的土造猎枪，也不是那种拉栓就会卡壳的老古董。是崭新的、烤蓝锃亮的、甚至闻起来带着一股甜腻工业油脂味的好家伙。\n那个叫索拉娜的疯女人，真的把贵族的军火库给搬空了。她把这些原本用来镇压我们的武器，像扔垃圾一样扔到了我们面前。\n“拿去！”那个传令兵吼道，“女王说了，谁要是拿着这种好货还打输了，就自己跳进亡灵坑里去！”\n我抚摸着枪身，冰凉的金属让我的手指微微颤抖。以前我们总说要用意志战胜钢铁，现在我明白，意志需要钢铁来武装，正义需要火药来推行。\n这就是我们要找的“本钱”。我们以前两手空空去撞高墙，现在我们手里有了锤子。虽然这锤子是那头母狼抢来的，虽然这上面沾着旧时代的灰尘。\n但这又怎么样呢？铁就是铁，火就是火。只要扣动扳机的手指还是我们的，只要枪口对准的还是那些吃人的怪物，那这就是我们的枪。\n把枪擦亮。这一次，我们要用他们送来的铁，去打碎他们自己的锁链。"
 PAM_.3.a: "（子弹上膛的声音，真好听。）"

 #4
 PAM_.4.t: "黑泥里的莲花"
 PAM_.4.d: "以前我觉得，革命应该是干净的。白衬衫，红旗帜，一尘不染的理想。我们应该拒绝一切肮脏的交易，拒绝和任何剥削者妥协。\n可现在看看我们。穿着从死人身上扒下来的黑大衣，吃着从殖民者那里抢来的罐头，甚至还要指挥那些只有骨架的亡灵去替我们趟地雷。\n脏吗？真脏。\n可是你看，那边的村子里，炊烟升起来了。那个以前只能去捡煤渣的孩子，现在正穿着体面的衣裳坐在学堂里念书——虽然那衣裳有点大，虽然那学堂是抢来的贵族别墅改的。\n这世上的事儿就是这么怪。要想在这片全是烂泥的沼泽里种出花来，你就得先把手伸进烂泥里，把那些腐烂的根须、发臭的淤泥都翻一遍。你不能嫌脏，不能嫌臭，因为那就是养分。\n索拉娜就是那把最锋利、也最脏的铲子。她负责把旧世界铲得稀巴烂，把所有的罪恶和血腥都揽在自己身上。而我们……我们就是撒在这些翻开的黑土里的种子。\n我们利用她的贪婪去喂饱人民，利用她的暴虐去粉碎枷锁。只要结果是受苦的人直起了腰，这手段再黑，心也是亮的。\n在这黑色的狼皮底下，我们的心，依旧是红的。而且因为沾了地气，跳得更稳了。"
 PAM_.4.a: "（根扎得越深，花开得越艳。）"

 #5
 PAM_.5.t: "路与桥"
 PAM_.5.d: "今晚的篝火很旺。几个新兵蛋子围着我，问我还要不要搞那个“真正的”革命。他们指着远处灯火通明的城市，那是用掠夺来的黄金堆砌起来的繁华。\n我捡起一块木柴，扔进火里，看着火星子飞上天。\n“一定要搞。”我对他们说，“但是路变了。”\n以前我们想修一座桥，直接跨过这就条吃人的河，去对岸的天堂。但我们没水泥，没石头，桥修一半就塌了，掉下去好多兄弟。\n现在，那个叫索拉娜的家伙来了。她不想修桥，她直接跳进河里，把河水喝干了，把河底的淤泥填平了。她用那些贵族的尸骨铺了一条路。虽然这路走起来咯脚，虽然这路上一股血腥味，但它……确实通向对岸。\n我们现在就走在这条路上。我们的任务可不是去把路炸了，我们要在走的过程中，把那些尖锐的石头踢开，把路边的杂草拔掉，让后来的人走得更顺当。\n这就是这世道的道理。它从来不按我们写好的剧本演，它有时候会戴着魔鬼的面具来干天使的活儿。\n只要方向是对的，坐着狼拉的车去，和自己走着去，没有区别。\n而且，这车上装满了粮食，能让我们把更多还没饿死的人，一起带上。\n这就是我们留在这里的意义——我们是这辆疯狂战车的方向盘，我们得盯着它，别让它冲进沟里，得让它……一直开向那个春天。"
 PAM_.5.a: "（路是人走出来的，不管是穿草鞋还是穿军靴）"

 #6
 PAM_.6.t: "殊途同归"
 PAM_.6.d: "那个日子终于来了。全军列队，接受检阅。\n广场上站满了人。这里有死人，有活人，有曾经的强盗，也有昔日的农夫。我们穿着统一的黑色军服，胸前挂着那是索拉娜发的、用国王王冠熔掉重铸的“黑狼勋章”。\n大家都在等那个疯女人出来骂人，或者等她再扔给我们几块肉。但今天，走上高台的不是她。\n是一个穿着朴素军装，却比任何人都挺拔的身影。\n晓枫。\n她瘦了，但眼神比以前更亮，像两把刚磨好的刺刀。她只是静静地扫视着我们。她的目光落在我身上，落在那枚黑色的勋章上，然后，她笑了。\n那是一种……看到庄稼熟了的、欣慰的笑。\n她缓缓举起手，向我们这群穿着黑色军服、混杂着亡灵、浑身匪气的士兵，敬了一个最标准的、属于革命军的军礼。\n“同志们，”她的声音不大，却在每个人心里炸响，“看看你们自己。”\n“有人说你们是暴徒，是强盗，是索拉娜的爪牙。但我看到的是一群哪怕在地狱里也要爬出来、也要把世界咬个窟窿的复仇者。”\n“革命不是请客吃饭，革命就是暴动，是一个阶级推翻一个阶级的暴烈的行动。而你们……你们就是这股暴烈本身！”\n“索拉娜给了你们牙齿，给了你们活下去的肉。而今天，我要给你们‘魂’。”\n“去吧！带着这身黑皮，去把那些高高在上的神像砸碎！去把那些压在人民头上的大山啃光！你们是狼，但你们是属于人民的狼！你们是鬼，但你们是向压迫者索命的厉鬼！”\n那一瞬间，我感觉浑身的血都涌上了头顶。我想哭，想吼，想把枪举起来。\n我们没有背叛。我们只是变成了一种更顽强、更凶狠、更能在这个残酷世界里活下去的“野火”。\n在这层狰狞的伪装下，那颗红色的心，跳得比任何时候都要有力。\n风吹过来了，旗帜在响。我看清了，那面黑色的狼旗后面，映出来的影子……分明是一团烧透了半边天的、赤红的烈火。"
 PAM_.6.a: "（敬礼！为了……新世界！）"
 PAM.85.t: "来自档案室的忙音"
 PAM.85.d: "“……喂？还在喝吗？先把酒杯放下，听我说两句。\n刚散场。我看着那帮狼崽子回营房了。若是放在以前，检阅完她们早就该聚众赌博或者打架了，但今天……她们很安静。我看见那个缺了耳朵的老兵在擦他的黑勋章，擦得很亮，还在哭。\n索拉娜，说实话，我以前看不起你的手段。我觉得你把人变成了只会抢食的野兽，把革命变成了暴乱。我一直想把她们洗干净，变回我记忆里那种‘纯粹’的战士。\n但今天站在台上，看着下面那片黑压压的、却又热气腾腾的人海，我突然明白了一件事：\n教科书里的革命是红色的，那是血的颜色；但现实里的生存是黑色的，那是泥土和火药的颜色。若没有你在泥里打滚，就没有这层保护色，那点红早就被风吹灭了。\n你喂饱了她们的胃，我填上了她们的魂。我们谁也别嫌弃谁。\n所以……别一个人坐在那空荡荡的大殿里发呆了。你不是什么篡位者，也不是什么玷污理想的罪人。\n你是这支军队的骨头。\n……行了，我就说这么多。早点睡，明天还有新的仗要打。如果你那是还有没吃完的葡萄……给我留一串。”"
 PAM.85.a: "（嘟—嘟——在那头，传来了一声轻轻的叹息）"
 #雪伊事件
 #1 完成决议后
 PAM_.7.t: "带刺的项圈"
 PAM_.7.d: "我站在满是油污的食堂门口，手里握着那把索拉娜扔给我的、甚至还没擦干净血迹的宪兵队长的配枪。看着里面那些狼吞虎咽的士兵，还有那个坐在高处、把脚翘在桌子上的疯女人，我只觉得恶心。\n就在刚才，一个喝多了的新兵试图去抢一个老工人的那份肉汤。那老头吓得发抖，却拼命得护着他的碗，因为那是他给孙子留的。\n“那是我的！”新兵吼着，举起了拳头。\n“砰！”\n我没犹豫，对着天花板开了一枪。碎石灰落在那个新兵的头顶，把他吓瘫在地上。\n全场死寂。我大步走过去，一脚把那个新兵踹翻，然后把那碗汤端起来，重新塞回老头手里。\n“都给老娘听好了！”我环视着这群野兽，枪口有意无意地扫过高台上的索拉娜，“你们是狼，不是抢食的狗！谁敢对自己人龇牙，我就拔了他满嘴的牙！”\n索拉娜在高台上眯起了眼睛，她没生气，反而咧嘴笑了，举起酒杯冲我晃了晃，像是看了一场好戏。\n我冷冷地转过头。我不喝她的酒。我留在这里是为了盯着这群畜生，别让它们把最后一点人味儿都给嚼碎了。\n这把枪既然在我手里，那这里的规矩，就得有一半是我说了算。"
 PAM_.7.a: "（只要我在，谁也别想欺负老实人。）"

 #2 完成吃存量的傻瓜国策后
 PAM_.8.t: "种子的重量"
 PAM_.8.d: "“吃！都吃了！明天的事明天再说！”\n索拉娜在粮仓门口咆哮，她想把刚缴获的几千吨麦种都磨成面粉，给全城的人办一场狂欢节。周围的暴民们在欢呼，眼睛里冒着贪婪的光。\n“我看谁敢动！”\n我挡在粮仓大门前，拉上了枪栓。我的身后是那堆像山一样的种子，那是明年所有人活命的指望。我的面前是成千上万个饿红了眼的疯子，还有那个最疯的王。\n“雪伊，你别给脸不要脸。”索拉娜走过来，手按在剑柄上，眼神阴冷，“大家肚子都饿着，你护着这些不能吃的硬疙瘩干什么？”\n“因为吃了它，明年就会死更多的人！”我寸步不让，枪口顶着她的胸口，“你只管今天吃饱，不管明天饿死？那你跟那些只知道吸血的贵族有什么区别？”\n索拉娜愣了一下，她看着我，像是在看一个不可理喻的怪物。周围的人群开始骚动，有人想冲上来。\n“退后！”索拉娜突然转身，一鞭子抽在那个领头的暴民脸上，“没听见吗？这是明年的饭！谁敢动明年的饭，老子今天就把它炖了！”\n她骂骂咧咧地走了，临走前狠狠瞪了我一眼：“行，你清高，你管家。要是明年长不出麦子，我就把你埋进地里当肥料！”\n我松了一口气，后背全是冷汗。但我知道，我赢了。这头狼虽然贪，但她更怕死。只要让她知道这东西是保命的，她就会比谁都护食。\n好吧，既然你只管抢，那我就替你……把这份家当守住。"
 PAM_.8.a: "（这可是明年的希望。）"

 #3 打统一南美战争期间
 PAM_.9.t: "刹车片"
 PAM_.9.d: "深夜的作战室，索拉娜指着地图上那块标注着极度危险的沼泽地，眼睛里闪烁着赌徒的狂热。\n“从这儿穿过去！只要三天，我们就能直插敌人的心脏！”\n将领们都不敢说话，因为上次反对她的人已经被扔去喂亡灵了。\n“不行。”\n我把那一杯冷水泼在了地图上，也泼在了她的兴头上。\n“这沼泽里有毒气，还是亡灵的聚集地。你的兵还没见到敌人就会死光。你想赢，还是想送死？”\n索拉娜暴跳如雷，拔出剑把桌角砍了下来：“雪伊！你总是跟我唱反调！你是想造反吗？！”\n“我想让你赢！”我也吼了回去，声音比她还大，“你这辆破车开得太快了，要是没个刹车片，早就冲进沟里了！我是你的宪兵队长，我的职责就是要在你发疯的时候，给你一巴掌！”\n我们像两头母狮子一样对视着，空气里充满了火药味。过了许久，她把剑扔在地上，气呼呼地坐回椅子里。\n“……那你说，怎么打？”\n那一刻，我看到了她眼底的一丝依赖。她知道自己是个疯子，所以她需要我这个清醒的混蛋在她身边。她负责踩油门，我负责踩刹车。\n这很危险，但这很有效。只要我不松口，这辆战车就不会翻。"
 PAM_.9.a: "（只要我不点头，这路就走不通。）"

 #4 预计在完成国策撕掉那些肩章
 PAM_.10.t: "肮脏的手段"
 PAM_.10.d: "审判台上跪着那个以前在矿区作威作福的监工头子。按我的规矩，应该公审，列罪状，然后枪决。\n但索拉娜不耐烦地挥挥手：“太慢了。”\n她让人把监工绑在柱子上，然后对下面那些曾被他欺压过的矿工喊：“他以前怎么打你们的，现在你们就怎么打回来！打死算我的！”\n人群像决堤的洪水一样涌了上去。惨叫声，撕咬声，还有骨头碎裂的声音响彻广场。那是一场私刑，一场彻头彻尾的暴虐狂欢。\n我站在旁边，皱着眉，手按在枪套上，想去阻止这失去秩序的暴行。但晓枫拦住了我，她指了指那些矿工的脸。\n我看到了……解脱。\n那个平时最老实、却被监工打断过腿的汉子，此刻正一边哭一边用石头砸那个监工的尸体。他宣泄着积压了一辈子的恨，那恨意随着鲜血流出来，他的眼神从麻木变得鲜活。\n“雪伊，”索拉娜走到我身边，递给我一根烟，“你的法庭太干净了。对于这些在地狱里泡大的人来说，只有亲手把仇人的肉撕下来，他们才觉得自己真的站起来了。”\n我接过烟，没点，只是看着那狂热的人群。我不得不承认，她是对的。在这个扭曲的世道里，正义有时候必须长着一副狰狞的面孔，才能让受害者信服。\n她是那个负责把手弄脏的屠夫，而我……我是那个在事后负责把地洗干净的人。我们谁也离不开谁。"
 PAM_.10.a: "（有时候，血必须用血来洗。）"

 #5
 PAM_.11.t: "把后背交给你"
 PAM_.11.d: "这是一场伏击。那些伪装成难民的刺客从人群里冲出来的时候，离索拉娜只有不到五米。\n这蠢女人还在那儿给小孩发糖，根本没反应过来。\n我的身体比脑子更快。我冲过去，把她撞开，紧接着肩膀上就传来一阵剧痛——一把匕首扎了进去。\n“砰！砰！砰！”\n我躺在地上，单手举枪，把那三个刺客的脑袋像敲西瓜一样打碎。鲜血溅了我一脸，也溅了索拉娜一身。\n她从地上爬起来，看着我肩膀上的刀，那张从来都不可一世的脸上第一次露出了惊恐。她扑过来，手忙脚乱地按住我的伤口，吼得像是死了亲妈：“医生！死哪去了！救不活她我杀你们全家！”\n“别嚎了……”我疼得龇牙咧嘴，“……死不了。”\n“你傻啊！”她红着眼睛骂我，“你不是恨我吗？为什么替我挡刀？”\n“因为你是头狼。”我看着她，“你要是死了，这好不容易建起来的食堂就散了，那些刚吃饱饭的人又要去当流浪狗。我不是救你，我是救这口锅。”\n她愣住了，然后突然抱住了我，力气大得差点让我背过气去。\n“……雪伊，你这只母狼。”她在我也耳边咬牙切齿地说，“这笔账我记下了。以后你的命是我的，除了我，谁也不准动你。”\n我哼了一声，没有推开她。在这冰冷的泥地里，两个浑身是血的女人靠在一起，竟然也能感觉到一种……过命的温度。"
 PAM_.11.a: "（别误会，我只是不想让饭碗砸了。）"

 #6
 PAM_.12.t: "黑色的盾，红色的心"
 PAM_.12.d: "胜利阅兵的那天，索拉娜给了我一套崭新的、镶着金边的元帅礼服。那是用最好的黑呢子做的，威风凛凛。\n我穿上了它。但我做了一件让她没想到的事——我从怀里掏出那块旧的、洗得发白的红袖章，那是当年我们在莉兰迪亚起义时戴的，上面绣着“为人民服务”。\n我把它，郑重地戴在了这身黑色礼服的袖子上。黑与红，在这一刻显得格格不入，却又无比刺眼。\n索拉娜看着我，挑了挑眉：“你这是什么意思？给我的狼群掺沙子？”\n“不。”我整理好领口，看着镜子里的自己，“这是提醒。”\n“提醒你，也提醒我。我们这身黑皮是用来吓唬敌人的，是用来在黑夜里潜行的。但这块红布……是用来捂热心口的。”\n我转过身，直视着索拉娜。现在的她已经不仅仅是个强盗头子了，她是一个帝国的王，而我是这帝国的守夜人。\n“索拉娜，你尽管去征服，去抢掠，去做你那让人闻风丧胆的狼王。但我会一直站在你身后。我会用这身黑色的盔甲为你挡住暗箭，但我也会用这块红色的袖章，时刻勒紧你的缰绳。”\n“我们会建立一个没有人敢欺负的国度。在这里，狼有肉吃，人有尊严。而我……我就是那道底线。”\n索拉娜看着我，良久，她笑了。那笑容仿佛是一种君王对宰相、战友对战友的敬重。\n“好。”她伸出拳头，“带着你的红袖章，跟我走。去告诉全世界，我们这对最奇怪的搭档……是怎么把天捅破的！”\n我碰了碰她的拳头。黑色的洪流出发了，而在那洪流的最前方，有一抹鲜艳的红色，像心脏一样，永不熄灭地跳动着。"
 PAM_.12.a: "（我是狼群的良心，我是……不灭的野火。）"
 PAM.86.t: "来自宪兵队的直线"
 PAM.86.d: "“……喂？把酒杯放下。……别装，我听得见冰块撞玻璃的声音。\n今天阅兵的时候，我看你一直盯着我的袖子看。怎么？觉得那块洗发白的红布，配不上你赏给我的这身金边黑帅袍？\n觉得碍眼就对了。那就是根刺，是扎在你肉里的警钟，也是……我给你的承诺。\n索拉娜，说实话，我以前恨不得把你这头野兽关进笼子，觉得你脏，觉得你是个没有底线的强盗。但今天看着台下那些不再面黄肌瘦的脸，看着那些把你的名字刻在枪托上的士兵，我承认——在这个吃人的世界里，光有理想填不饱肚子，光有主义挡不住子弹。确实需要你这样的恶狼，去撕开一条血路。\n你负责去做那个让世界颤抖的暴君，去抢，去夺，去把所有肮脏的活儿都干了。而我……我会守在你的影子里，做那个让你‘不舒服’的人。\n只要这块红袖章还在，只要我还站在你身后，你就永远不用担心自己会彻底堕落成那些我们曾经最痛恨的贵族。因为一旦你越过了那条线，我会毫不犹豫地把你拽回来——哪怕是打断你的腿。\n所以，安心地去疯吧，索拉娜。你的背后是安全的，你的灵魂……我也替你守着了。\n……行了，挂了。早点睡，别逼我半夜去踹你的门。”"
 PAM.86.a: "（嘟—嘟——听筒里传来了打火机点烟的声音）"

# 小果子好感度 0 #1
 PAM_.13.t: "黑帆下的囚徒"
 PAM_.13.d: "“海风不再是咸的，是腥的。\n我站在驾驶台上，手里握着那个熟悉的舵盘，但我感觉不到一丝自由。这艘船曾经叫‘希望号’，是为了给同志们运送种子的。现在，它挂着黑色的狼头旗，甲板上堆满了从港口抢来的金银器皿。\n那些跟着我的水手，那些曾经为了保护半袋面粉敢跟风暴搏斗的战士，现在正穿着从死人身上扒下来的皮靴，大口嚼着抢来的肉干，眼神里闪烁着和索拉娜一样的、贪婪的绿光。\n这还是我的舰队吗？\n晓枫姐教过我，船是连接世界的桥。可现在，我们变成了切断喉咙的刀。那个疯女人把我们变成了海盗，变成了我们曾经最痛恨的掠夺者。\n我看着黑色的海面，感觉自己正驾驶着这艘船，一点一点地驶向一个没有灯塔的深渊。我的胃里翻江倒海，我想吐，但我吐不出来。因为我知道，如果我不握紧这个舵，船上这些人——这些即使变成了野兽也依然是我的家人的家伙，就会立刻葬身鱼腹。\n为了让他们活，我必须……成为这艘贼船的帮凶。”"
 PAM_.13.a: "（舵盘……好冷。）"

 # 小果子好感度 20 #2
 PAM_.14.t: "带血的蜜糖"
 PAM_.14.d: "“今天我们截获了一艘商船。那是属于一个大财阀的船，满载着昂贵的蔗糖和咖啡。\n按照以前的纪律，我们应该征用物资，然后放人。但索拉娜的命令只有两个字：‘不留’。\n我的炮手们欢呼着开火，看着那艘船在火光中断成两截。然后，他们像鲨鱼一样跳进水里，把那些漂浮的货物捞上来。\n晚上，这些糖被分发了下去。我看到一个小水手，他才十六岁，正躲在角落里，把一块沾着海水甚至可能沾着血的糖块塞进嘴里。他哭了，一边哭一边笑，那是他这辈子第一次尝到这种纯粹的甜味。\n‘头儿，真甜啊……’他对我说，‘我给我妈留了一半。她快饿死了，有了这个，她就能活了。’\n我看着他那张因为长期营养不良而凹陷的脸，手里原本想扔掉的那块糖，突然变得千钧重。\n这就是索拉娜的逻辑吗？杀掉那些高高在上的‘他’，抢来他们的血肉，喂饱我们这些在泥里打滚的‘他’。\n这很残忍，这很野蛮，这违背了书本上写的一切正义。\n可是……看着那个孩子脸上的血色，我那句‘这是赃物’的斥责，却卡在了喉咙里，怎么也说不出口。”"
 PAM_.14.a: "（这糖……全是铁锈味。）"

 # 小果子好感度 40 #3
 PAM_.15.t: "与鬼同航"
 PAM_.15.d: "“底舱传来了抓挠声。\n那是索拉娜塞给我的‘新船员’。一整队的亡灵水鬼。它们不需要呼吸，不怕水压，可以像藤壶一样吸附在船底，或者在深海里潜伏几天几夜。\n活人们害怕它们，我也怕。那种死亡的气息弥漫在整艘船上，连老鼠都逃光了。\n昨晚遇到风暴，主桅杆断了，几十吨重的横梁砸下来，眼看就要把机轮室压扁。那里躲着十几个受伤的活人兄弟。\n就在那一瞬间，那些被我们恐惧的亡灵冲了上去。它们用只有骨架的身体顶住了横梁。咔嚓、咔嚓，我听到了骨头碎裂的声音，看到了它们眼里的魂火因为承受重压而爆燃。\n它们被压碎了。变成了粉末。\n但是机轮室保住了。里面的活人兄弟吓得脸色惨白，却毫发无伤。\n风暴过去后，索拉娜发来了电报，只有冷冰冰的一句话：‘工具坏了可以再缝，人死了就没了。别心疼骨头，心疼你的活人。’\n我看着甲板上那堆惨白的骨粉，被海风一点点吹散。\n那个女人……她把死者变成了奴隶，却把生者护在了身后。这究竟是亵渎，还是……一种我也无法理解的、扭曲的慈悲？\n我感到一阵彻骨的寒意。为了活下去，我们真的连死人的安宁都要剥夺吗？”"
 PAM_.15.a: "（谢谢……对不起。）"

 # 小果子好感度 60 #4
 PAM_.16.t: "沉默的帮凶"
 PAM_.16.d: "“我的手已经稳了。无论是下令开炮，还是看着敌人的船沉没，我的心跳都不会再加速了。\n今天，我们炮击了一座被殖民者控制的港口。那是为了掩护陆军抢夺那里的煤炭资源。\n透过望远镜，我看到港口里燃起大火，看到那些穿着体面衣服的绅士和淑女在火海里尖叫奔逃。而我们的登陆艇，那些载着贫民窟出身的士兵的小船，像饥饿的蚂蚁一样涌上去，搬空了每一座仓库，甚至拆掉了铁轨。\n我看到一个贵族在岸边向我们的船挥舞着白手绢，试图用金表换一个座位。我的大副，那个以前连鸡都不敢杀的老实人，面无表情地给了他一枪，然后把金表捡起来，揣进兜里。\n‘为了黑狼。’他低声说。\n我甚至没有转过头去。\n我已经习惯了。习惯了这种弱肉强食，习惯了这种把文明踩在脚下的快感。\n晓枫姐送给我的日记，我已经很久没敢翻开了。我怕看到上面那些关于‘理想’、‘解放’的字眼。\n现在的我，还是那个想要带大家回家的小海鸥吗？\n不，我只是一只染了色的乌鸦，盘旋在尸体上，等着分一口腐肉。\n这片海域越来越黑了，连星星都看不见了。”"
 PAM_.16.a: "（只要能赢……变成怪物也没关系吧？）"

 # 小果子好感度 80 #5
 PAM_.17.t: "深渊的尽头"
 PAM_.17.d: "“我们赢了。南美的海岸线都在我们的控制之下了。无数的财富像河流一样汇入莉兰迪亚。\n庆功宴在甲板上举行。士兵们醉得东倒西歪，有人在撒钱，有人在对着大海狂吼。索拉娜在王宫里发来了嘉奖令。\n我躲在缆绳堆里，抱着膝盖，看着漆黑的海面。我想哭，可是眼泪好像流干了。\n我救了很多人，是的。我的船员们都胖了一圈，他们寄回家的钱让村子里盖起了新房。可是……代价呢？\n代价是我们变成了我们曾经最讨厌的人。我们变成了强盗，变成了暴徒，变成了让世界恐惧的灾难。\n这真的是晓枫姐想要的未来吗？这真的是雪伊姐想看到的胜利吗？\n我们活下来了，但‘我们’好像也死去了。\n那个看着萤火虫会笑的小女孩，那个相信世界会变好的小果子，已经死在了这片黑色的海里。\n我想跳下去。跳进这冰冷的海水里，洗干净这一身的血腥味。也许在海底，我能找到那个干净的、纯粹的梦。\n索拉娜……你赢了。你把我也变成了和你一样的、失去了心脏的狼。”"
 PAM_.17.a: "（既然都是地狱，哪里还有方向？）"

 # 小果子好感度 100 #6
 PAM_.18.t: "风暴眼中的灯塔"
 PAM_.18.d: "“‘这就是你想死的地方？’\n一个粗鲁的声音打断了我的自毁。索拉娜不知什么时候站在了甲板上，那件黑色的狼皮大衣被海风吹得猎猎作响。她手里提着一盏马灯，那光芒刺痛了我的眼睛。\n‘你觉得我们脏？觉得我们是强盗？’她把灯举高，照亮了码头。\n我顺着光看去。\n那里，成千上万个衣衫褴褛的人——老人、妇女、孩子，正围在我们的运输船旁。他们在哭。他们从那些凶神恶煞的士兵手里接过一袋袋粮食，接过那些我们从贵族手里抢来的、沾着血的‘赃物’。\n一个母亲跪在地上，把面粉抹在孩子饿得发青的脸上；一个断腿的老兵抱着一瓶药，像抱着他的命。\n‘看清楚了，小果子。’索拉娜的声音带着一种我不曾察觉的、深沉的疲惫和坚定。\n‘这世上只有两种干净。一种是躲在象牙塔里，看着别人饿死，自己保持手不沾血的干净；另一种……是跳进烂泥坑里，把自己弄得满身污垢，也要把这群人从死人堆里刨出来的干净。’\n‘野火的理想是好的，但火在水里是烧不起来的。在这个吃人的世道，想让这群羊活下去，我们就必须变成比狼更狠的野兽。’\n她走到我面前，把那盏灯塞进我手里。那灯罩是温热的，像一颗跳动的心脏。\n‘我负责当那个恶人，我负责抢，我负责杀，我负责背负所有的骂名。而你……’她指着那群正在吃饭的百姓，‘你负责把东西运回来，喂饱他们。’\n‘别想那些没用的。只要他们还活着，只要他们还能笑，我们就算下地狱……也是昂着头下去的。’\n那一瞬间，海面上的乌云裂开了一道缝隙，晨光像利剑一样刺破了黑暗，照亮了索拉娜那张狂妄却坦荡的脸，也照亮了码头上那些卑微却真实的生命。\n我握紧了那盏灯。\n原来……这就是答案。\n我们不是堕落了。我们是把理想从云端拽进了泥土，用血肉给它筑起了围墙。\n在这黑色的狼皮下，那团火……从来没有熄灭过。它只是为了守护这些脆弱的火种，而把自己变成了钢铁的熔炉。\n‘……我明白了。’我擦干了脸上的泪痕，站直了身体，向这位暴君，也是这位真正的守护者，敬了一个礼。\n‘船队准备完毕。头儿，哪怕是地狱……我也为您把路闯开。’”"
 PAM_.18.a: "（起航！为了……活着的尊严！）"
 PAM.87.t: "来自海平面的潮声"
 PAM.87.d: "“……喂？索拉娜姐姐……不，头儿。\n是我。别嫌我啰嗦，海上的信号不好，有些话我现在不说，怕到了浪尖上就没机会说了。\n刚才，那个拿了面粉的母亲，非要塞给我一个刚编好的贝壳手链。那贝壳很糙，还没打磨好，但我戴上了。挺好看的，对吧？\n以前我总觉得，只有白色的帆才是干净的，只有不抢东西的船才是正义的。我怕脏，怕血，怕变成坏人。\n但今天……看着您提着那盏灯站在黑漆漆的码头上，我突然明白了一件事：\n灯塔之所以能发光，是因为它把自己立在了风浪最大、最危险的礁石上。您就是那块礁石，您替我们挡住了所有的浪，挡住了所有的骂名。\n既然您愿意做那个满身污泥的恶人，那我就不能再当那个躲在后面哭的小女孩了。\n放心把大海交给我吧。不管还要抢多少东西，不管还要运多少‘赃物’……只要能把我们的家填满，只要能让那个孩子脸上有肉……我这双手，愿意陪您一起脏下去。\n……海风有点大，您把领子竖起来点，别吹着了。\n我的船队……要出发了。”"
 PAM.87.a: "（嘟—嘟——海浪声中夹杂着一声吸鼻子的声音）"

  # 莉莉安娜好感度 0
 PAM_.19.t: "缝合的布娃娃"
 PAM_.19.d: "“今天，索拉娜带我去了她的‘工厂’。不是制造子弹的，是制造士兵的。\n那里挂满了残缺的肢体，像屠宰场里的肉块。工匠们用粗大的针线，将那些战死的尸体缝合起来，塞进死灵的内核，让它们重新站起来。\n我看到了一个被缝合好的作品。它有着成年人的躯干，却接着一只显然属于少年的手臂。那只手臂上还戴着一个编织粗糙的草环，上面沾着干涸的血迹。\n‘它很完美，对吧？’索拉娜得意地拍着那个怪物的肩膀，‘它会是最忠诚的盾牌。’\n我走过去，轻轻握住那只不协调的手臂。在冥界的视角里，这只是物质的重组。但在那一刻，我仿佛听到了两个灵魂在接缝处的嘶吼。\n一个是失去了身体的战士，一个是失去了手臂的孩子。他们被强行捆绑在一起，被迫去打一场已经结束的战争。\n‘……疼吗？’我轻声问。\n那个怪物空洞的眼眶里只是机械地转动了一下脖子，发出一声令人牙酸的骨骼摩擦声。\n我拿出随身携带的手帕，那是索拉娜送我的、最柔软的丝绸。我小心翼翼地，把那道狰狞的缝合线包了起来，打了一个漂亮的蝴蝶结。\n索拉娜愣住了，周围的工匠也愣住了。\n‘莉莉，那是死人……’\n‘我知道。’我打断了她，手指轻轻抚摸着那个蝴蝶结，‘但它……也曾是谁的父亲，谁的孩子。’\n‘如果不把它缝得漂亮一点，它的家人……会认不出它的。’\n那个怪物突然安静了下来。它低下头，用那只借来的手，笨拙地碰了碰那个蝴蝶结。一滴浑浊的尸液，从它那干枯的眼眶里，滑落了下来。”"
 PAM_.19.a: "（至少……让它体面地走。）"

 # 莉莉安娜好感度 20 
 PAM_.20.t: "静谧的裂痕"
 PAM_.20.d: "“太吵了。我的耳膜在震颤，那是火药爆炸的轰鸣，是金属切入骨骼的脆响，是几万个喉咙同时发出的濒死哀嚎。\n我站在满是烂泥的战壕边，白色的裙摆被溅上了黑色的血污。索拉娜就在前面，像一头疯兽般挥舞着长剑，每一次劈砍都带起一蓬热气腾腾的血雾。\n我本能地想要后退，想要用魔力封住听觉，回到那个属于我的、永恒寂静的冥界。那里只有完美的、冰冷的秩序。\n可是，一只手抓住了我的脚踝。\n那是一个只有半截身子的年轻士兵。他的肠子拖在泥水里，还在冒着热气。他的眼睛已经灰败了，但他那只沾满泥浆的手，却扣住了我的脚腕，力气大得惊人。\n‘救……救我……’他喉咙里发出风箱般的声音，血沫从嘴里涌出来，‘我不想死……我不想变冷……’\n我看着他。在我的国度里，死亡是安息，是回归。可在这里，死亡是恐惧，是不甘，是拼命想要抓住最后一点余温的挣扎。\n我伸出手，想要用死灵魔法带走他的痛苦，让他安息。可就在指尖触碰到他额头的一瞬间，我缩回了手。\n因为我看到了他眼底的那团火——那是对生的渴望，比索拉娜的剑还要炽热。\n如果我让他安息，那就是熄灭了这团火。那就是……杀了他。\n我僵在原地，任由那只手一点点变冷，直到彻底僵硬。那种逐渐流失的温度，像烙铁一样烫在我的脚腕上，烫进了我的灵魂里。\n原来，这就是活着的声音吗？如此刺耳，却又……如此滚烫。”"
 PAM_.20.a: "（这温度……擦不掉了。）"

 # 莉莉安娜好感度 40
 PAM_.21.t: "花与骨"
 PAM_.21.d: "“春天来了，但战场上只有焦土。索拉娜的坦克碾碎了每一寸草皮，只留下了履带的深痕和机油的恶臭。\n我独自一人走在阵地后方。那里有一片乱葬岗，埋着昨天死去的野火游击队员，也埋着我们这边倒下的狼群士兵。他们生前互相撕咬，死后却挤在同一个泥坑里，分不清彼此。\n我看到一个小小的身影蹲在坟堆旁。是个只有五六岁的小女孩，手里抓着一把枯萎的野花。她在哭，哭得很伤心，因为她找不到哪一个是她的哥哥了。\n‘他们都变成了骨头……’她抽泣着说，‘骨头都长得一样……哥哥去哪了？’\n我看着那片狼藉的土地。是啊，死亡是最大的平等，它抹去了所有的特征，只留下了苍白。\n我应该转身离开，或者用魔法让她遗忘。但我没有。\n我跪在泥地里，掌心贴着冰冷的坟土。我闭上眼，调动起那股属于夜莺之心的残余力量。这一次，是为了……唤醒记忆。\n幽蓝的光芒渗入地下。片刻后，奇迹发生了。\n一朵朵颜色各异的小花，从那些无名的坟包上钻了出来。有的红得像火，那是性格暴烈的冲锋手；有的白得像雪，那是沉默寡言的医疗兵；有的是蓝色的勿忘我，那一定是个爱写信的年轻人。\n每一朵花，都对应着一个灵魂生前最鲜艳的颜色。\n‘看，’我指着其中一朵倔强地开在石头缝里的小黄花，‘那个……是不是像你哥哥笑起来的样子？’\n女孩停止了哭泣。她扑过去，小心翼翼地抱住了那朵花，脸上露出了混着泪水的笑容。\n我站起身，裙摆上全是泥土。但我第一次觉得，这泥土的味道……并不难闻。它混合着腐朽与新生，那是……大地的味道。”"
 PAM_.21.a: "（原来，死亡也可以开花。）"

 # 莉莉安娜好感度 60
 PAM_.22.t: "染血的白裙"
 PAM_.22.d: "“敌人的突袭来得毫无征兆。炮火撕碎了防线，指挥部被炸塌了一半。索拉娜被埋在了废墟下，生死未卜。晓枫在组织反击，雪伊在带人挖掘。\n周围全是伤员，哀嚎声此起彼伏。医疗品用光了，医生们束手无策。一个年轻的护士跪在血泊里，绝望地捂着一个士兵脖子上的大动脉，但血依然像喷泉一样涌出来。\n‘止不住……止不住啊！’她哭喊着。\n我站在那里，看着那鲜红的液体染红了地面。那是生命，正在流逝的生命。\n我有能力救他。但我知道代价。在生者的世界使用这种逆转生死的魔法，会反噬我的灵体，会让我的灵魂染上无法洗净的污秽。\n我是冥界的公主，我本该一尘不染。\n‘……莉莉安娜，走吧。’心底有个声音在劝我，‘这不是你的战争，你已经做得够多了。’\n我看向废墟深处，那里埋着我最爱的人。如果她醒来，看到满地的尸体，她会疯的。\n我深吸了一口气，提着洁白的裙摆，走进了那片血泊。我跪在那个士兵身边，推开了护士的手。\n‘按住他。’我命令道，声音异常冷静。\n我将双手按在他的伤口上，吟唱起那首古老的、被视为禁忌的咒语。幽蓝的光芒与鲜红的血液交织在一起，发出滋滋的声响。我的皮肤开始溃烂，黑色的纹路顺着手臂蔓延，那是生与死冲突留下的诅咒。\n很疼。比我想象的还要疼一万倍。像是有无数把刀在切割我的灵魂。\n但我没有停。直到伤口愈合，直到那个士兵微弱的呼吸重新变得有力。\n我站起身，曾经一尘不染的白裙已经被鲜血染成了暗红，手臂上满是狰狞的黑斑。我看着镜子里的自己，那样丑陋，那样狼狈。\n但我笑了。\n因为我终于……变得和索拉娜一样了。我终于，也染上了这人间的颜色。”"
 PAM_.22.a: "（这脏兮兮的样子……真美。）"

 # 莉莉安娜好感度 80
 PAM_.23.t: "神明的谎言"
 PAM_.23.d: "“今晚的月光很冷，照得索拉娜的脸像一张白纸。她又在做噩梦了，梦里喊着‘饿’，喊着‘别抢我的面包’。\n我握着她的手，那只手即使在睡梦中也紧紧攥着拳头，仿佛随时准备挥出去。我看着她，又看向窗外那个沉睡的城市。那里有无数和她一样的人，在梦里依旧不敢松开眉头。\n我曾以为，我是神明，我拥有永恒。我曾以为，只要把他们带回夜莺之国，赐予他们寂静，就是最大的仁慈。\n但我错了。\n今天下午，我看到一个断了腿的老兵，为了给孙女买一个风车，在街角坐了一整天。他很累，很痛，但他看着孙女拿着风车奔跑时，那张满是皱纹的脸上绽放出的光彩，比我见过的任何星辰都要耀眼。\n那一刻我明白了。我的永恒是虚假的。它只是把时间冻结，把痛苦和快乐一起剥离，那是标本的永恒，不是生命的永恒。\n真正的活着，就是会痛，会饿，会流血，但也正因为会痛，那个拥抱才温暖；正因为会饿，那口面包才香甜。\n我所谓的救赎，其实是一种傲慢的剥夺。我剥夺了他们感受痛苦的权利，也就剥夺了他们感受幸福的资格。\n索拉娜……你这个傻瓜。你早就知道这些了，对吗？所以你才宁愿在泥潭里打滚，也不愿做我笼子里的金丝雀。\n我俯下身，吻了吻她紧皱的眉心。\n‘对不起。’我轻声说，‘我不会再试图把你们变成雕像了。我会守在这里，守着你们的痛，守着你们的梦。’”"
 PAM_.23.a: "（痛楚……才是活着的勋章。）"


 # 莉莉安娜好感度 100
 PAM_.24.t: "裙角的泥点"
 PAM_.24.d: "“战后的第一个丰收节，雨下得很大。索拉娜疯了一样在王宫里咆哮，因为她找不到我了。\n‘她一定是走了！那个傻瓜！她是不是觉得自己多余了？是不是回那个冷冰冰的冥界去了？！’\n我听得见她在雨里的嘶吼，听得见她踹开一扇扇大门的巨响。那声音里全是恐惧。\n但我没有回应。我正忙着。\n我站在城外的一片红薯地里。这里是以前的乱葬岗，现在被垦成了良田。雨水混合着翻开的黑土，变成了黏稠的泥浆，没过了我的脚踝。\n我的那件曾象征着冥界至高无上的、一尘不染的白色长裙，此刻已经吸饱了泥水，沉甸甸地拖在地上，脏得像一块抹布。我的双手，那双曾经只用来编织魔咒、只用来触碰灵魂的手，现在沾满了黑色的泥垢，指甲缝里塞满了沙砾。\n我在挖红薯。\n一个穿着破棉袄的老农妇蹲在我旁边，她把我当成一个笨手笨脚的新手，一边利索地刨土，一边絮絮叨叨地教我：‘闺女，劲儿别使得太死，要顺着根须……哎对，就是这样。’\n我用力一拔，一个并不怎么好看、甚至有些歪瓜裂枣的红薯破土而出。它带着湿润的泥土气息，沉甸甸地压在我的掌心。\n那一瞬间，我感受到了一种比夜莺之心还要强烈的悸动。\n在我的国度里，水晶花永不凋谢，但也永不生长。那里的一切都是静止的完美。\n而手里这个丑陋的红薯，它会腐烂，它身上沾着脏东西，它并不完美。但它里面藏着太阳的热量，藏着雨水的味道，藏着能让人活下去的力量。\n‘找到了！！’\n索拉娜浑身湿透地冲了过来，她看到满身是泥的我，整个人僵在了田埂上。她张大了嘴，像看怪物一样看着我。\n‘莉莉……你……你在干什么？你的裙子……你的手……脏死了！’\n她想冲过来抱我，又怕弄疼我；想骂我，又舍不得。\n我直起腰，用手背擦了擦脸上的雨水（顺便把一道泥印子抹在了脸上），然后举起那个红薯，对着她露出了一个灿烂的、傻气的、甚至有点粗鲁的笑容。\n‘索拉娜，你看。’我大声说，声音穿透了雨幕，‘这是我种出来的。不是变出来的，是种出来的。’\n‘以前我以为，爱是把你关在干净的笼子里，不让你沾染一粒灰尘。现在我懂了。’\n我深一脚浅一脚地走到她面前，把那个脏兮兮的红薯塞进她手里，强行把她那双总是握剑的手，按进了泥土的温度里。\n‘这个世界之所以值得你拼命，是因为它脏得真实，脏得热烈。’\n‘我不走了，索拉娜。冥界太干净了，我不习惯。’\n‘我要留在这里。和你，和晓枫，和这些种地的大娘一起。我要把裙子弄脏，把手磨破，我要学着怎么在这个烂泥坑里……种出最甜的果实。’\n索拉娜呆呆地看着我，又看了看手里的红薯。突然，她把脸埋进了我满是泥水的肩膀，发出了一声像是哭，又像是笑的闷响。\n雨还在下，但我知道，从这一刻起……\n我终于，真正地，降临在了人间。”"
 PAM_.24.a: "（欢迎来到这脏兮兮的、美好的人间。）"
 PAM.88.t: "来自壁炉旁的连线"
 PAM.88.d: "“……喂？索拉娜？是我。\n不许吼，也不许再踹门了。我听得见你在走廊里像头焦虑的狮子一样转圈的声音。\n我现在在厨房里。……不，别进来。我就想隔着这根线跟你说几句话。\n我刚刚把那个红薯洗了。我洗得很认真，可那上面还是坑坑洼洼的，就像你脸上的伤疤一样，怎么洗都洗不掉那种粗糙的感觉。那位大娘说，这叫土气，是好东西。\n你知道吗？在夜莺之国的一万年里，我的手总是凉的，摸到的宝石也是凉的。我从来不知道，原来东西还可以是糙的，还可以是热的。\n现在，我的指甲缝里还有泥，我的裙摆还没干，但我感觉……我从来没有像此刻这样，和你靠得这么近。\n你总是说要把我捧在天上，但我不想在天上了。天上太冷，也没有你。\n既然你是一头满身泥泞的狼，那我就做那个在泥地里种花的园丁。我们一起脏，一起累，这才叫一家人，对不对？\n……好了，炉子热了。我问过厨师了，他说这个要烤着吃才最香。\n进来吧，我的狼王。\n今晚只有我亲手种、亲手洗、亲手烤的红薯。\n……而且，你必须吃完，还得夸我做得好吃。这是……公主的命令。”"
 PAM.88.a: "（嘟—嘟——电话那头传来了木柴爆裂的噼啪声）"
#索拉娜二线
PAM.92.t:0 "瞧瞧这双新眼睛"
PAM.92.d:0 "夜莺用袖口蹭掉镜子表面的灰，铜面随即露出一小块光亮，刚好框住索拉娜的半张脸。\n\n剪刀在她手里握得很稳，碎发一缕一缕落在肩头，慢慢堆进领口的褶皱里。刘海修到眉梢上方，再短一厘恐怕就该翘起来了。\n\n这具躯壳是重新捏过的，踩在地砖上几乎没有声响。\n\n索拉娜盯着镜面里那个套在宽大外套中的女孩。坐在王座上的那个人，如今缩成了这样矮的尺寸。头发拿蓝布条随意捆着，嘴唇抿得紧紧的，齿列间露着一粒尖细的犬齿。\n\n如今这副样子，就算把眼睛瞪🉐再圆，也压不住两边立着的侍卫了。\n\n夜莺拿木梳的脊背敲了敲铜镜边沿，长廊深处荡开几声回音。她歪头看着镜中那张脸，声音轻巧地落在索拉娜耳边。\n“索拉娜，这次的新发型，你还喜欢吗？”\n\n女孩偏过头，没答话。\n\n门外，守夜的亡灵纹丝不动地立着。夜莺拎起裙摆，牵住索拉娜的手，带她慢慢朝门外走去。"
PAM.92.a:0 "那么，剧本都安排好了吗。"

PAM.93.t:0 "起风了"
PAM.93.d:0 "木桶顺着坡道一路滚远了，残羹冷炙泼洒出去，溅得满地都是。\n库房的木门被撬棍砸得彻底变了形，铁锁来回撞击着门板，闷响一声追着一声。\n街上的人流推搡着挤作一团。有人捞起生面粉拼命往嘴里塞，指缝间糊满了泥，想在暴雨浇透身体之前把肚子填饱。\n\n夜莺站在廊檐下，风把她的衣摆朝后扯得笔直，刚好遮住身后那个矮个子的身影。\n她眼里亮着幽紫的光，远处几簇跳动的火苗正映在里面。\n“索拉娜，底下的动静太吵了。要是墙壁给火熏黑，待会儿在上面描花可就费事啦。”\n\n她伸手轻轻扣住索拉娜的手腕，语气像在商量一件顶平常的小事。\n“去把那些火把收回来吧。大家现在力气这么足，天亮之后到河边挑泥修路，正合适呢。至于眼下嘛，还是躺下睡一觉比较好，可别惊扰了这么凉快的夜风。”\n\n索拉娜的指头搭在刀柄上。她想把腰间那柄佩刀拔出来，可这双手实在太小了，锈住的刀鞘纹丝不动。\n\n夜莺注视着她，目光温温软软的。\n\n她松开了手指。一根，再一根。刀刃滑回鞘底，磕出轻轻的一声细响。\n\n街上，那些争夺粮袋的人接二连三歪倒在路边，沉沉地睡了过去。风里翻涌的喧闹，终于平了。"
PAM.93.a:0 "嘘"

PAM.94.t:0 "请诸位入座吧"
PAM.94.d:0 "远方的风送来庄园那边的喊叫。深山里亮着零星火光，铁靴踏过路面，声音清脆地传开。\n\n夜莺从木匣里翻出几根布条，洗得干干净净，上面系着浅色鸟羽。她走到窗前，手指顺着索拉娜的长发梳下去。\n“索拉娜，这些蓝布条够长了，能给每个人都编出漂亮的辫子。她们现在都在黑暗里哭呢。活得这么辛苦，不如都到书里来。这里安全，永远暖和。”\n\n街上那些吵闹的人慢慢停了动作。身上的泥水褪去，换上了干净衣裳。\n肚里总有饱食，身上再无伤痕，守着暖和的炉膛过一辈子。这便是夜莺能给的。\n\n索拉娜感到脑海里那些对食物和权力的渴望，正被这股浓郁的睡意一点点化开。她靠在窗框上，眼皮渐渐沉了。\n夜莺捧着书，翻过新的一页，朝窗外弯起眼睛。\n“来，故事该进入下一幕了。”"
PAM.94.a:0 "温柔的童话，现在开演了哦。"

PAM.95.t:0 "茶凉了"
PAM.95.d:0 "庄园大门敞着，台阶上长满青苔。\n写着税目和地契的纸张散在雨水里，早就泡得稀烂，字迹化成了一滩黑水。\n\n原先在厅堂里神气活现的贵族们，如今穿着粗糙布衣，安分地坐在台阶最下方。\n\n夜莺提起裙摆蹲下身，发梢系的羽毛顺势划过老人额头。“索拉娜，瞧，老先生们换了衣裳，倒显得年轻了。”\n\n索拉娜抱膝坐在门槛上，盯着那滩黑水。\n\n夜莺端起茶碗递过去。“给你的茶沏好了哦。喝完这口就去檐下歇着，以后记得多去赏赏月亮。”\n\n大门外，侍从抬着木箱，把整箱黄金码在街面上。\n那些用杀戮换来的财宝，现在再也无人过问了。"
PAM.95.a:0 "第一幕"

PAM.96.t:0 "风停了"
PAM.96.d:0 "谷地里的枪炮声终于消停。那些习惯在丛林里流汗的士兵，抱着所剩无几的干粮，在战壕里瑟瑟发抖，看着自己呼出的白气。\n\n夜莺踩着水洼走来。鞋底踩过的地面结起碎冰，脚步带出清脆的裂响。\n“索拉娜，这些固执的家伙，现在终于安分了。”\n\n索拉娜在后面慢慢走着，身上裹着厚实大衣。大衣太长，拖在泥地里，几乎要把她绊倒。\n\n她看着战壕里那些一动不动的士兵。那是她曾准备带着去跟全世界交锋的黑狼军团。她张开嘴，想对部下下达口令，喉咙里却一片干燥，发出来的唯有小女孩细微的抽噎。\n战壕里的部下纹丝不动，如同泥塑。她们已化作温顺的雕像，再也不会跟着她龇牙咬人了。\n\n夜莺弯下腰，捡起一支枪掂了掂。“风停了，就去把坏掉的屋顶修好吧。以后大家不用扛这些发沉的铁家伙了哦。”\n\n索拉娜看着那些接连闭上眼的旧部下，转过身去。\n\n两人的影子在结霜的铁轨上拉长，随夕阳一同沉没。"
PAM.96.a:0 "第二幕哦"


PAM.97.t:0 "可风雪还没停"
PAM.97.d:0 "废墟上的滚滚烟尘平息下去。那面缝满补丁的红旗倒在草丛里，化作冷透的灰。\n\n原本握紧拳头、在火光前不肯低头的人们，如今换上了洋娃娃般的衣服，在墙根下站着。\n\n夜莺半蹲在地上，把烘干的衣裳放在长凳上。\n“换上吧，穿着湿衣服会着凉的。”\n\n雪伊和晓枫的衣服很整洁，脸上洗得干干净净，看不到灰烬与伤痕。可她们的眼睛里失了温度，已经变成纸页上听话的孩子了。\n\n夜莺翻过一页书。“雪伊，晓枫。累了就靠着炉子歇一歇。等天亮了，再来听下一章的故事。”\n\n窗外的风还在呼呼作响。这里的门窗关得严实，屋里温暖得让人沉醉。\n索拉娜的心口却一片冰冷。"
PAM.97.a:0 "夜还长着呢"

PAM.98.t:0 "今晚月色很好"
PAM.98.d:0 "窗外的风声彻底安静了。瓦缝间落下的雨水积在庭院小土坑里，倒映着一轮满月。\n\n整个院落安稳无声。长椅上搁着一碗放凉的清茶。夜莺在台阶下坐着，一旁是刚走来的莉莉安娜。莉莉安娜挨着索拉娜坐下，裙角在夜风里叠在一处。\n\n索拉娜已经习惯了这种安静，早忘了当初在泥泞里呼喊的力气。\n\n莉莉安娜拉住她的手。“索拉娜，你的手怎么这么冷？”\n\n索拉娜不答，任由自己倒在莉莉安娜怀里，闭上双眼。这个怀抱很温暖，像铺满玫瑰花瓣的棺材。\n\n她在这温暖里彻底放弃了挣扎，沉沉睡了。\n\n翻过最后一页的图册，封面重合在一处，把所有的热血与喧嚣都合得严丝合缝。"
PAM.98.a:0 "今晚，月色真美。"

PAM.99.t:0 "复仇？"
PAM.99.d:0 "电台杂音断断续续，送来的加急报告湿透了，字迹洇成大团墨斑。\n\n防线上石墙接连倒塌。枪炮声静了之后，空气里传来木头和石块砸地的闷响，还有湿漉漉的脚步声，沿铁轨一路往这儿走。\n\n大殿里，索拉娜单手扶着剑柄，指头在护手上有节奏地敲了敲。她走出门外，莉莉安娜挨着她一同走着。临走前，莉莉安娜回眸望向夜莺。\n“夜莺，你明明可以唱起歌，让那些死者重新睡去的。”\n\n夜莺站在窗前，看着远方升起的烟火，手放在故事书上。\n“我当然可以，我的公主殿下。”她歪了歪头，拨弄着发梢，“一首歌，地下的骨头就会重新散开。可那些死者并不是在呼唤我。大洋底下的亡魂，身上沾着索拉娜的温度，是在呼唤她的名字呢。我若现在替索拉娜把门关上，她这辈子，可就再也睡不着了。”\n\n夜莺合上书，朝窗外那片漆黑的浪潮躬了躬身。\n“来，新的故事要开始了哦。”"
PAM.99.a:0 "这会是个什么样的故事呢？"

PAM.100.t:0 "有只鸟儿在发烧"
PAM.100.d:0 "漆黑的怪异线纹，在粉发少女白瓷般的皮肤底下疯狂扭动。\n\n被四神抛弃的薇莉安缩在角落里，抓挠着地板，发出沙哑的低哼。喉咙里溢出的血带着腐肉气味，把衣服和地板染上大块红渍。\n这是四神留下的反噬，足以让死者都感到彻骨的冷。\n\n莉莉安娜坐在一旁，脸上满是焦急。“夜莺，薇莉安快要碎掉了。”\n\n夜莺走上前，手心覆在那些蠕动的黑色线纹上，任黏稠的诅咒顺指缝倒灌进胸腔。她的皮肤开始开裂，溢出黑色血水，可声音仍平缓温柔，像在哄不听话的孩子。\n“好啦，小公主。疼了就哭出来。那些讨厌的声音，很快就走远了。”\n\n莉莉安娜慌忙用毛巾擦着夜莺指尖的黑血。泪水渗进嘴唇，又苦又咸。\n\n在这个新编排的故事里，每一份写好的幸福，都得有人把泥潭里的脏东西，一笔一笔擦干净。"
PAM.100.a:0 "好梦，薇莉安。"

PAM.101.t:0 "斯人已逝，生者如斯"
PAM.101.d:0 "窗缝漏进几缕蔗糖的甜香，日子安静得让人着迷。\n\n白雾散尽，绿叶悬在茶碗水面中央，纹丝不动。\n\n窗外街口忙着干活的工人，走廊里排队走着的士兵，连一旁剥果子的雪伊和晓枫，都像不动的画。大家脸上还带着笑容，可连衣角飘起的动作都定在半空了。\n\n“索拉娜。”\n\n耳边传来轻声叹息。夜莺站在窗边，看着窗外无声落雪。\n\n“对不起呀，索拉娜。大家其实一直活在那些死去的人的记忆里。那些在冬天受冻、在水坑里倒下的士兵，临走前想着的，不过是这一碗热粥，一间能暖和手脚的屋子。这颗心脏把那些留下的念头攒在一处，才有了这个安稳的春天。现在风把故事书吹乱了。索拉娜，该醒来啦。”\n\n……\n\n滴答。污水从漏雨的棚顶滴下来，啪嗒砸在手心，凉得刺骨。\n索拉娜猛地睁开眼。木桌、热粥和漫天的雪花已然褪去，眼前是糟朽的木板、浸湿的稻草，一盏快要灭了的油灯。这里是老城低矮的贫民窟，肮脏，混乱。\n\n她怀里抱着半截长满绿毛的面包，正散出阵阵霉味。"
PAM.101.a:0 "（睁开眼睛）"

 PAM.103.t:0 "我吞下了那块霉面包"
 PAM.103.d:0 "滴答……滴答…………\n\n我退到墙角，捧着那半截长了霉的面包。正反复琢磨着接下来的去处。\n\n肚子饿得发慌，连胃里都磨出了让人难受的酸水。我张开嘴，狠狠咬下一口，干硬的面粉卡在喉咙里，泛着让人发呕的苦涩。\n我硬着头皮把硬块咽了下去，如此熬过今夜，总好过在这些乱稻草堆里冻饿而死。\n屋外的大雨里突然传来一阵门窗碎裂的钝响，还夹杂着凄惨的哭声。\n\n我捡起脚边的那柄剑，推开了柴门..."
 PAM.103.a:0 "我得活下去，让所有人活下去。"

PAM.104.t:0 "那一鞭子渗进了骨头里"
PAM.104.d:0 "隔壁柴门敞着。收税的贵族管家正带几个随从往外搬谷子。\n\n一个妇人跪在雨水里，双手抓着管家的靴子，哭得满脸是泪。屋里，刚病死的孩子躺在草席上，身上落满漏下来的雨水。\n管家侧过脸，不看那死去的孩子，盯着手里浸湿的税单，算盘拨得噼啪响。\n\n我大步冲过去，想抢回那袋口粮。管家反手一鞭子抽在我脖颈上，打出一条淌血的红印。\n“滚开，小鬼。”\n\n这股疼渗进了骨头里，我一辈子也忘不掉。\n\n在那些住公爵府里的老爷眼里，我们是一堆不用花钱的柴火。用完了就丢进水沟里烂掉，谁都懒得过问。"
PAM.104.a:0 "这笔账，我记下了。"

 PAM.105.t:0 "雨夜里走了二里路"
 PAM.105.d:0 "我握着那柄刚磨好的长剑，顺着车辙印，急不可耐地往前赶。\n雨下得越来越大了，淋在脖子上伤疤上，好疼好疼。\n\n足足走了二里地，我才摸到了庄园里那座砖石大屋。\n门房的看守倚着墙睡熟了。我心里冷笑了一声，跨过门槛，踩在了宅邸光滑的地板上。\n那个挥舞皮鞭的管家，正悠闲地坐在火旁拿着银勺喝着果汁，根本意识不到接下来自己会发生什么。\n我拔出长剑，剑锋直指前方，带着积攒了一辈子的怒火，拼劲全力冲了过去。\n管家脸上露出错愕，还没来得及抬起头，就被磨利的剑刃直接切开了气管，热血喷了出来，瞬间浸透了我的手掌，也浇熄了一旁的火焰。\n\n“真爽啊。”我小声感慨道，从死去的管家腰间扯下了他用来打开粮库大门的钥匙。\n\n今晚，大家要吃得饱饱的。"
 PAM.105.a:0 "因为大门敞开着。"

 PAM.106.t:0 "甩开火把"
 PAM.106.d:0 "刚跨出砖石屋的台阶，后头的屋里就传出了一声变了调的惨叫。\n\n那是发现死尸的看守。呼喊声夹在风雨里，听着刺耳无比，却又令人感到十分愉悦。\n\n紧接着，急促的靴子声和哨子声在大雨里响成一片，十几道手电的光柱撕开浓雾，晃晃荡荡地扫了过来。\n\n我赶忙加快了自己的步伐，胸腔起伏得厉害，雨水顺着额角流进眼睛，涩得眼前一片模糊。\n\n背后的犬吠越来越近，听着已经到了街角。胸膛里那股子憋了几年的闷气，在此刻烧得浑身发烫，烫得我的双腿彻底软了下来，索性靠着一旁的石墙停下步子，长剑倒提着，紧盯着前方。\n\n“来吧。”\n我对着那些在风雨里追过来的黑影，凶狠地露出了牙齿：“想拿回钥匙？那就过来，看看你们的骨头，硬不硬得过我的佩剑！”"
 PAM.106.a:0 "谁怕你们啊。"

 PAM.107.t:0 "可我的手心只剩死灰"
 PAM.107.d:0 "仓库的大门被撞开了，可扑面而来的却是一股烧焦的烟尘。\n\n看守们临逃前扔了火把，大火沿着稻草窜上了屋鹏。\n整座仓房都在这红光里坍塌，成批的麦子都在火里蜷缩，发酵出让人感到刺鼻绝望的焦甜。\n\n我扔掉长剑，直接冲进了滚烟里。双手拼命地去抓那些着了火的麻袋，火苗舔着我的手背，大块的皮肉粘在布上，疼得痛彻心扉。\n\n可最后能留下的，不过全是烧成了灰的粉末罢了。\n\n头顶的大雨还在下着，水洼里，沉着一汪绝望的死灰。"
 PAM.107.a:0 "该死！"

 PAM.108.t:0 "我在画些什么？"
 PAM.108.d:0 "军团的帐篷里，油灯里的火苗正在帆布墙上拉出晃动的影子。\n\n外面的雨很大，打在棚顶上，像是几百面用人命做成的皮鼓在同时敲打着。\n一个满身水汽的副官掀开帘子，鞋底把门口的干草垫踩得尽是泥污。\n“参谋长，”副官敬了个军礼，把一卷打湿的报告放在桌上，“明天天亮，我们要去围剿西边山谷里的叛军。公爵要您定一个万无一失的包抄方案。”\n\n图纸就在案头上铺着。西边的那个山谷，我闭着眼睛也能画出每一道山梁。那是生我养我的贫民窟外围，大雨里唯一的泄洪道。但凡我用铅笔在山脊上随手画一道线。天亮时分，军团的重炮就会把那里的木屋、石墙和活生生的人，全部轰成飞灰。\n\n我提起那支沉甸甸的铅笔。笔尖在纸面上画下一道血红的横线。\n\n“拿去吧。”\n\n我放下笔，任由衣服上的金属纽扣磕在长桌边缘，发出清脆窒息的声响。"
 PAM.108.a:0 "拿去，都拿去。"

 PAM.109.t:0 "别开枪"
 PAM.109.d:0 "夜晚的风雨急得很。我们的手电光柱在大雨里接连晃动，正照在那个退无可退的女孩身上。\n\n那孩子靠着石墙，手里提着一柄锈迹斑斑的佩剑。即便隔着大雨，我也看清了那张满是野性、不肯认输的脸。\n\n“参谋长，”旁边的士兵端起长枪，手指就要扣下扳机，“就是这乞丐娃娃杀的管家，下令开枪吧！”\n\n我抬起右手，按下了那支指在半空中的长枪。\n\n“别开枪。”我吐字清晰，声音穿透了风雨，穿透了自己的内心：“这只是个迷路的孩子而已，抓回去，关进营房里发落吧。”\n\n副官虽然有些困惑，但他还是收起了枪。\n毕竟，管家的命在他们看来也不是很重要就是了。\n我迈开步子，缓慢地朝那孩子走去，轻易夺过了她手里的剑。\n在光柱下，两人的影子在墙壁上靠着。我走到了近前，低下头看着那双野狼般狠劲十足的眼睛。\n\n在这一秒，我仿佛看到明天清晨，大雨里那个曾经在泥泞里摔倒、爬起来还要继续往前走的自己。"
 PAM.109.a:0 "把她带回去吧。"

PAM.110.t:0 "天边着火了"
PAM.110.d:0 "我刚拉住那孩子的胳膊正准备带回营房时，那孩子却突然像只被按住的野狼，在风雨里拼命地挣扎嘶吼。\n\n在南边，那座装满谷子的仓库方向，红光冲天而起，把雨幕都映照得一片通红。这是在公爵得知钥匙被他以为的“小范围工人起义团体”夺走之后，为了防止这些下等人从他那里拿走一分一毫，而下令烧毁了粮房。\n\n就在我沉思之时，手心里突然一滑，那孩子发出了宣泄般的怒吼，一把夺过钥匙，迎着风雨朝大火的方向狂奔而去。\n\n“参谋长！那孩子跑了！还把钥匙抢走了，开枪吗？！”\n\n我再一次按下了枪口，神色复杂得看着那道背影：\n\n“钥匙现在已经没用了，随她去吧。”\n\n我转过身，带着士兵们，也跟着朝那片燃烧的废墟跑去。"
PAM.110.a:0 "（跟上去）"

PAM.111.t:0 "拉住我的手"
PAM.111.d:0 "大火被雨水浇熄了，废墟里正冒着为人们送行的青烟。\n\n我踩着积水走过去，鞋底发出粗砺的声响。\n\n那孩子缩在断梁旁边，双手伤得厉害，大块的皮肉翻卷着，甚至露出了里面的骨头，看着触目惊心。\n那串刚抢过去的钥匙，此时正掉在她的脚边，沾满了灰尘，已然变成了没人要的垃圾。\n\n“在外面守着。庄园那边来人，就说废墟里全是灰，没碰见活口。”我对着副官下令。\n\n副官点点头，打着手势带兵退了出去。\n\n空荡荡的废墟里，唯余雨水砸在焦灰上的细碎动静。\n我蹲下身，从怀里扯出一条纱布，小心地托起那双满是伤口的手。\n\n“还想抢面粉吗？”\n\n我将纱布缠在她的伤口上，动作放得很慢，“歇一会，别再闹了，保住你自己的命吧。”\n\n她那落满灰尘的脸上流下两行泪水，在污迹里冲出清晰的印子。\n那孩子抽搐了一下，全身脱力，软绵绵地倒在我的膝盖上。\n\n耳边的风声渐渐小了。我抱着那具发热的身体，在废墟的阴影里，坐了很久。"
PAM.111.a:0 "…………"

PAM.112.t:0 "我们该往哪走？"
PAM.112.d:0 "地窖里的煤油灯光很暗，空气里散发着潮湿木头与麻布的气息。\n\n我坐在椅子上，手里捏着钢针，正费力地把一块工厂的围裙缝到码头的麻袋片上。\n布料太厚了，我稍不注意，针尖扎在了指尖，疼得钻心。\n一旁的阿加莎凑过来，用顶针压住了针尾，帮我把线拉了过去。\n\n大家都在旁边围着，有人拿着剪刀裁布，有人用炭笔在木板上记着明天要发的干粮。\n\n“雪伊，”阿加莎看着那面我们亲手缝纫的旗子，声音很温柔，“这面破布拼出来的旗子，明天真的能让那些老爷听我们说话吗？”\n\n我咬断了嘴里的线头，用手抚平了粗糙的接缝。\n\n“我不知道。”\n\n我看着那面粗糙杂乱，却又振奋人心的布旗，胸口腾起了一股热度，\n“但我明白，如果一声不吭、毫无怨言地活在这群贵族老爷的脚下，那这活法和死尸倒也没什么两样。\n等这旗子升上去，那些在夜里迷路的兄弟姐妹，看见这团红火，自会明白该往哪儿走。”"
PAM.112.a:0 "一，二，收针。"

PAM.113.t:0 "我草你妈！"
PAM.113.d:0 "我刚抱起怀里那具发热的身体，板壁突然被一脚踹开，风雨夹着通红的怒火冲了进来。\n\n是雪伊。这个在街口带头闹事的女孩，双手端着一柄缴来的步枪，她的鞋底踩在积水里，浑身都湿透了，一双眼睛却红得像要滴出血来。\n雪伊拉开步枪枪栓，发出响亮的金属撞击声，用黝黑的枪口指着公爵府的方向，指着我头顶上的军徽，在大雨里歇斯底里地破口大骂：\n“我草你妈！！你们这群公爵的走狗！宁可把麦子全烧成灰，也舍不得留一粒分给快要饿死的孩子！都给老娘去死吧！！”\n呼喊声和怒骂声在雨里混成一片，她的枪托猛烈撞在石柱上，木料开裂，发出清脆的撞击声。\n\n我一言不发，用白布捂着怀里那孩子的伤口。看着雪伊，看着这个在废墟里发了疯的人。\n\n“管好你的嘴。”\n\n我的声音在大雨里很清晰：“过来帮忙。这孩子快要撑不住了。”\n雪伊一动不动地站在那里，手里的枪口慢慢垂了下去。\n“……这孩子是谁？”雪伊愕然地问道。"
PAM.113.a:0 "“只是个抢走粮仓钥匙的野孩子罢了”"

PAM.114.t:0 "引擎声"
PAM.114.d:0 "我站起身，拍了拍制服外套上的褶皱，将那顶军帽重新戴在了头上。\n“我得走了。天亮以前，巡逻队会路过这里。”\n雪伊坐在草堆旁，正擦着步枪，脸上的神情隐在阴影里。\n“长官，慢走。路上泥厚，别脏了你那双漂亮的马靴。”她的声音依旧透着骨子里的倔强。\n\n我停在留着缝隙的门前。外头的雨声小了些，但风里依然泛着凉意。\n\n“你的那些伤员，记得按时换绑。接下来三天里，巡逻队都将绕开此地行军。\n至于往后，就看各自的造化了。”\n\n雪伊在阴影里应了一声，手掌在枪托上拍了拍。\n我关紧木门，迈开步子走回了街上的车里。\n随着车门关上，引擎沉闷地发动起来，轮胎在泥里压出的声响，渐渐隐没在黎明前的雾气里。"
PAM.114.a:0 "那么，祝你好运"

PAM.115.t:0 "你叫什么名字？"
PAM.115.d:0 "我坐在小凳上，看着草垫上那个一动不动的孩子。那个抢走钥匙，原本在大雨里和军团拼命、如今却缩在被褥里的孩子，终于睁开了眼睛。\n那一双眼睛虽然带着戒备，看人却亮得特别扎眼。\n“醒了啊。”\n我放下手里的步枪，拍了拍手掌。\n那孩子朝四周看了看，然后又看到裹在受伤手掌上的纱布。\n“喝口水吧。”我端起旁边的水碗递了过去。那孩子一把抢过水碗，不顾周围投来的目光，大口往自己喉咙里灌了起来。\n\n“慢点喝，这可不是公爵府。这里是教堂地窖，安全得很。大雨把外面都封了，谁也进不来。”"
PAM.115.a:0 "再吃点东西吧？"

PAM.116.t:0 "捡起了一片落叶"
PAM.116.d:0 "城堡廊道深处，听得见脚步踩在地板上的回音。\n\n我低头去瞧，台阶上落了一片枯叶。\n\n这里是一处永远静止的宫殿，根本不会有植物生长。这片枯叶，大概是前些日子外来的灵魂遗在台阶上的。\n\n我蹲下身，轻拂叶片。脆弱的脉络在手下碎开，细响在空旷厅堂里格外清亮。\n\n书上写着，外面的林子里有成片的树，秋天一到，叶子就会换上红色与黄色的衣裳。可在我的宫殿里，只有永远盛开的水晶花。\n\n外面到底是什么样子呢。好想去瞧一眼。"
PAM.116.a:0 "好想去瞧一眼啊……"

 PAM.117.t:0 "点起了一支蜡烛"
 PAM.117.d:0 "书本里写着，太阳是一团温暖的光。\n\n我划燃火柴，点起一截细小的蜡烛。\n火苗很小，一直在那里晃着。\n我将手心凑近，想寻一寻书本上写着的温度。\n这微黄的微光只在一点一寸间晃动，远处的墙角依然隐在黑暗里。我一不小心，竟真得把手伸进了火苗里，烫的我立马往回缩，这股疼痛在寂静里显得特别清晰。\n\n如果，能有人将那个真正的、高悬在天空的太阳带进来，分一小片给莉莉安娜，那该有多好呀。"
 PAM.117.a:0 "好梦，莉莉安娜。"

 PAM.118.t:0 "我会一直等着你"
 PAM.118.d:0 "推开的木窗留着一道缝，正对着那片寂静的谷地。\n\n我双手撑着下巴在台阶上坐着，看着窗外。\n\n风里卷着落叶，在地面上滚来滚去。\n\n书上写着，外面的春天很温暖，阳光会降临在自己的身上，将冻僵的笑容彻底融化。\n我知道，等风雪停了，一定会有人，带着那一小片温暖的太阳，穿过回廊，迈着阳光的步子朝这儿走来。\n那个未来的客人也许脾气会很古怪，也许会大喊大叫。\n\n可只要对方愿意拉住我的手，就已经很让人开心了。\n\n在这寂静的长夜里，夜莺会一直唱歌，而莉莉安娜，会守在这扇窗前，等候着门外的敲门声。"
 PAM.118.a:0 "门外，会有人来吗？"

 PAM.119.t:0 "故事书，是空白的呢"
 PAM.119.d:0 "水面上的亮光已经熄灭了。窗外的风声小了下去，整座城堡重新回到了寂静之中。\n\n那本陈旧的图画书里，后面页脚空空如也，半个字迹也未曾留下。\n\n也许，那个会送来太阳的人，不过是自己锁在屋里、独自写下的梦呓。\n雨幕回荡在空旷的山谷之中，那份暖意，也未曾在这片寂静里留下痕迹。\n\n我还是想在身旁留出一个空位，在茶杯里倒满红茶，\n生怕错过了风里的声音。\n\n我总想守在窗前，听一听外头，到底会不会响起脚步声。"
 PAM.119.a:0 "哪怕……根本没有人会来。"

#小果子
 PAM.120.t:0 "领一粒青果子"
 PAM.120.d:0 "仓棚里漫着股霉烂稻草的温湿气息。\n门推开了，那个从海滩上救回来的女孩正蜷在角落。她身上的衣服湿透了，紧贴着瘦小的肋骨。她一声不吭地盯着我看，两手搂着一个布包。\n哨兵提过，包里只有半颗咬过的坏苹果。我在木凳上坐下，从兜里拿出一枚洗过的苹果，放在桌面边缘。\n\n“拿着吧，”我指了微红的果壳，“你手里那个坏了，吃不成了哦。”\n女孩安分得很，也不说话。目光落在那枚青果子上，满脸警惕地抿着嘴巴。\n“信不过我吗？我也挺喜欢这种果子的。虽然味道酸了点，吃起来倒是清爽无比。我叫木棉，你呢？”\n她盯着我看，低头想了很久，久到外面的雨声都小了。最后，她缓慢地摇了摇头，眉眼间满是迷茫。大概是因为先前在风浪里受了惊吓，连原本的名字都丢在海里了吧。\n\n我看着她这副傻傻的倔样，笑着开口：\n“想不起来，那就重新起一个。瞧你这么护着这颗苹果，往后就叫你‘小果子’，好不好呀？”\n女孩愣了许久。她看着我，终于点了点头。"
 PAM.120.a:0 "你好，小果子……"

 PAM.121.t:0 "听听风里的哨声"
 PAM.121.d:0 "浪头狠命砸在礁石上，撞出大片水雾，在我的脸上落了些海盐的咸气。\n\n我顺着生满苔藓的台阶往上爬，风刮得我的衣服在半空里肆意飞舞。小果子就坐在最高的那块大石头上，两手捧着那个在月光下闪亮的铜哨。\n瞧见我过来，这丫头含起铜哨，鼓足腮帮子，吹出一声尖厉的长音。清脆的哨声穿过漫天海雾，比那些海鸟的叫声还要响亮。\n我停下步子，按着被风卷起的帽檐，朝那张稚嫩的脸望过去。她正咧着嘴朝我笑着，眼睛弯成了两个可爱的月牙。\n\n“不错。”我深吸了一口气，“像个看海的哨兵了。往后，这片大海，就交给你守着了，成不成？”\n\n小果子不答话，偏过头去，含起哨子冲着海面又是一声。\n\n那哨音穿透层层波涛，就连远处的舰船也拉响了汽笛，陆续地回应着海岸上的这声亮响。"
 PAM.121.a:0 "吹得真神气。"

 PAM.122.t:0 "木棉团长？"
 PAM.122.d:0 "营房里静得反常，连个大声说话的动静都听不见了。\n我推开门，只看得见兄弟姐妹靠在床沿，身体已经变得僵硬了下来，连四肢都透着霜雪的寒凉。\n\n我过去推了推身旁的人，可一上手，衣物底下冰冷一片，再无活人的温度。那人顺着床沿滑了下去，脸上还带着安稳的睡意。\n\n“团长！木棉团长！”\n\n我推开隔壁的门。木棉团长靠在桌前，手里的笔落在桌上，纸页上还留着写了一半的公文。\n\n我大声喊着，用双手去捧团长的脸。我的手心里热得全是汗，可团长的脸颊却凉得像一块铁一样。任凭我如何推搡拉扯，团长的眼睫都不曾颤动一下。\n\n整个屋里都昏暗得厉害，油灯下的火苗在不声不响得地晃动着。\n我退到门口，不知所措地撑着门板，大口喘着粗气。\n\n在这沉寂的夜里，唯有我的呼吸声清晰无比。"
 PAM.122.a:0 "不……这不对劲……"

 PAM.123.t:0 "进来的是晓枫"
 PAM.123.d:0 "外面传来车门合上的闷响声，靴子踏在雪水里的声音一下比一下近。\n晓枫推开木门走了进来。她浑身都是雪，笔挺的制服湿淋淋地贴在肩膀上。\n\n晓枫扫了一眼床沿那些冷掉的身体，几步抢进内室，扶住团长的肩膀。\n\n“团长？”她向来沉稳的声音，在这一刻全是沙哑和惊慌。\n\n“大家都睡着了。”我从角落里站了起来，浑身都在颤抖着。“叫不醒，吹哨子也叫不醒，团长也一样。”\n\n晓枫慢慢回过脸看着我。风在这时夹着大雨顺着门缝扑打了进来，吹得灯火在风中像鬼火一样张牙舞爪。\n\n她走过来，用温暖的掌心捂住我的手背，把那股寒冷一点点按了下去。\n\n“小果子。”她低着头，呼吸很沉，像下定了某种决心一般，在昏暗的火光下向我伸出了手。“走。这里风太大了。”"
 PAM.123.a:0 "跟她走。"


 PAM.124.t:0 "指向南方"
 PAM.124.d:0 "车门猛地摔上，发动机在座位底下轰鸣震动。\n\n我蜷在副驾驶座上，把胳膊紧紧箍在胸前。车顶上砸着大雨，两道雪亮的车灯劈开大雾，在荒野的雪地里挣扎着照出前路。\n往回望去，只看得见一片白花花的浓雾，把营房和沉睡的大家彻底吞没了。\n晓枫抓着方向盘，额角全是青筋，两只眼睛紧盯着前面的黑夜。\n\n“我们去哪儿？”\n\n我小声问，声音止不住地打颤。\n“海边。”她盯着前方的大雪，牙关咬得很紧。\n“可港口已经被大雪吞没了。”\n“那就去更南边。找一艘还没冻在冰里的船，往有风的地方走。那里肯定还有活路。”\n\n我缩在车窗下，不再说话。\n\n车轮在雪泥里突然打滑，猛烈摇晃着，我抓住扶手，把额头抵在冰凉的玻璃上，看着外面飞舞的雨雪。"
 PAM.124.a:0 "大家，都怎么了。"


 PAM.125.t:0 "再见，总参谋长"
 PAM.125.d:0 "小船在起伏的波浪里摇晃着。我刚踩上去，还没站稳脚跟，手腕便被拉住了。\n\n那是晓枫姐的手。可她的手掌已经凉透了，先前在车里好不容易捂暖的体温，一转眼就被冷风吹得一干二净。\n\n我慌忙回头，在手电昏暗的光线里，她的眼眶底下蒙了一层紫色，那是属于梦境的颜色，此时正不声不响地往外散着寒气。\n\n她把双桨塞进我怀里，对着我笑了笑：\n\n“小果子，走吧。去有风、有温度的地方。我送你到这儿，往后的路，得你自己去走了啊。”\n\n她松开手，走得深一脚浅一脚，缓慢地朝白茫茫的大雾里走去。\n\n“晓枫姐！”我趴在船舷上，眼泪止不住地往下掉。冲着那道单薄的背影，用尽气力喊着，“我会回来的！我一定会把船划回来！你别睡着了，你等一等我，我一定会把大家都叫醒的！”\n晓枫停下了脚步。慢慢地侧过头，对着我露出了最后的笑容。她的嘴唇动了几下，声音还没传过来就被风撕碎了。但我听清了！她说：\n\n“好呀……我等一等小果子。”\n\n她朝我挥了挥手，身躯渐渐融入了前面的迷雾中。\n一片…两片……\n铺天盖地的落雪砸了下来，最终把她的背影，连同那点微弱的光亮，一起抹消在了漫天迷雾的深处……"
 PAM.125.a:0 "“等我回来。”"

 PAM.126.t:0 "在石屋里坐下"
 PAM.126.d:0 "海上的黑夜在天亮前平息了下去，雾气散开，前方露出了一座荒芜的石岛。\n\n我费力地将木船拖上碎石滩，系好缆绳，走进了岸边一间废弃的石屋子。这屋子的门窗早就朽烂了，墙角长满了枯草与蛛网。\n\n我抱着浸透了海水的包裹，迷茫地靠在了石壁上。一路上的寒冷与饥饿，外加同伴们接连的离去，我的手上早就被耗没了力气，连稍微动一下都显得吃力无比。\n我颤颤巍巍地解开包袱，取出怀里藏着的那颗苹果，合着果核和外皮，一口一口咽了下去。\n\n海浪在夜色里翻滚。风吹在身上像冰刺一样。可我一定要留着这口气。\n\n要睁着眼，要等风停，要等衣服晒干。要撑到把大家都叫醒。"
 PAM.126.a:0 "我得睁着眼。"


 PAM.127.t:0 "将故事书彻底砸碎"
 PAM.127.d:0 "我正盯着石缝里那朵好容易活下来的红花。身后传来一阵轻快的脚步声，在潮湿的碎石滩上越来越近。\n\n我猛地站起身，立刻把手按在枪栓上，防备地盯着那个从雾气里走出来的人。\n\n那是个穿着白色裙子、系着披风的少女，倒像个从书里走出来的骑士。对方领口挂着一枚红色挂坠，正散发着一小片暖和的光。\n“果子。”\n\n那少女在几步开外停下，声音带着让人心安的温度。\n\n“你认得我？”我皱起眉，手指按向了枪口，“那身衣服，可不属于军团，更不属于公爵府里的老爷。”\n“我叫露西莉亚，是个骑士。”少女轻抚过领口的那枚挂坠，声音在风雪里很清晰，“我从另一本书里走过来。在那本书里，世界也已经冷了，可我带回了那里的夜莺之心。我知道这里发生的所有事情。我知道木棉团长睡了，晓枫也睡了，连索拉娜也换了新衣裳，在书里当了听话的配角。”\n\n我盯着那枚发着红光的挂坠，脑子里乱成了一团乱麻。这人在胡说些什么？什么另一本书？什么夜莺之心？\n\n“大家都睡了，可你还醒着。”露西莉亚往前迈了一步，声音里带着不肯低头的倔劲，\n“小果子，去写一个不一样的结局。将这本故事书，彻底砸碎。”"
 PAM.127.a:0 "你在胡说些什么……我听不懂。"


 PAM.128.t:0 "这回，信你一次"
 PAM.128.d:0 "“我不信！”我往后退了退，端着枪冲她喊，“当时营房里也暖和得很，可大家闭上眼，就再也喊不醒了！你把这宝石拿开，别想让我也闭上眼！”\n露西莉亚默默地看着我。她把那枚发红的宝石捧在手心，眼里的神色很沉静：“果子，这是活人身上的温度。里面装着那个到死也不肯闭眼的人留在世上的遗憾。在另外一本书里，也有个不肯认命的女孩子，在风暴里陪着伙伴等到了天亮。”\n她把红宝石递到我面前。\n落雪砸在肩膀上，海浪是冰凉的，可手心里这颗通红的宝石，正把温度尽数融进我的皮肤里。我的眼泪不自觉地落在了手背上，我明明和团长保证过，往后一定要坚强，可这温度……真的太暖了。她拍掉我身上的积雪，把一件斗篷裹在了我的肩上：“故事要重写。大家都要睁开眼。果子，我们去把大家摇醒，好不好？”\n\n“你刚刚说的……索拉娜，是谁？”我突然开口，视线落在掌心那抹红光上。这名字很熟。熟到不用过脑子，嘴自己就念出来了。可我想不起她的脸，也想不起在哪儿听过。\n\n露西莉亚注视着我，声音轻缓：“她是莉兰迪亚的女王。也是在最黑的夜里，拼了命也想活下去的野狼。”\n\n“女王……野狼…………”这些话语不断得撞击着我的记忆，搞得我头疼得厉害。那些被白雪盖住的旧事，随着宝石的光芒，在这一刻，瞬间变得四分五裂。我想起来了……这片风雪是假的。晓枫姐和雪伊姐安稳地睡着，夜莺把整座国家都闭上了眼。至于这片冰凉的海岸，不过是一场不肯醒转的幻梦。我踩着的每一寸积雪，全都是死寂的倒影。\n\n“原来……是这样啊。”我把那颗发着光的红宝石紧握在了手心里，抬起脸看着露西莉亚，“你带我来这儿，是要去砸碎这个梦的，对不对？”\n\n她点了点头，神态温和。我把宝石揣进了怀里。路已经定下了。不管去哪里，我都陪她走这一程。"
 PAM.128.a:0 "不许骗我。"

 PAM.135.t:0 "怎么有人连船也不会划"
 PAM.135.d:0 "“你往哪儿戳呢！”\n\n那一桨横着拍在水里，溅了我一脸苦咸的海水，我抹了把脸，叹了口气。露西莉亚两只手笨拙地抓着桨柄，正拼了命地往海里戳。\n\n“我也想帮帮忙嘛。”\n\n她委屈地咬着嘴唇，低头看着自己湿透了的裙角。\n\n就在这时，船身猛地歪了一下，看她那副突然手忙脚乱的局促模样，我噗嗤一声笑了出来。\n划船是个力气活，我抢过桨，把她按在了座位上：“行了，老实坐着，看我划。”\n桨叶破开波浪，推出白色的水花，在我全盘接手后，小船这才在风浪中安稳了下来。\n\n露西莉亚从怀里掏出一张破破烂烂的海图铺在膝盖上，用手指点着最北边的那个标记。\n\n“老铁厂。”她看着我，“醒着的水手和工人，都缩在底下的防空洞里，靠着当年烧剩的渣子硬撑着。夜莺的雾太大，里面的人出不来，外面的人进不去。只有这颗宝石，能把高炉重新烧红，拉响顶上的汽笛。只要汽笛一响，周围所有被冻僵的耳朵，都会被震醒。”\n\n我盯着那张海图，看了半天。目标很清楚：去老厂，把火生起来，拉响汽笛。去把大家，一个不剩地叫醒。"
 PAM.135.a:0 "坐稳了，我们要加速了！"


 PAM.129.t:0 "根本没人站起来"
 PAM.129.d:0 "我用力把防空洞的铁门拽开，冲着里面大喊，可除了一阵阵冰冷的回音，什么也没有。\n\n我抢进通道里，拽住一个靠在墙角的水手。可一撒手，他那具发僵的身体就软绵绵地滑倒在地上，他的脸上甚至也挂着一种诡异的安祥神情，跟当时在营房里看到的一模一样。\n\n通道里所有人都靠在墙上，一动不动。\n\n“现在叫不醒她们的。”露西莉亚走过来，看着那些像木偶一样的长眠者，声音在死寂里像一片雪花，“故事在收尾了，小果子。”\n\n我看着这满地像石雕一样的大家，脑子里一片混乱。\n\n大雨还在外面下，在这死一般安静的洞里，只剩下我们两个人的呼吸声。"
 PAM.129.a:0 "……来晚了吗？"


 PAM.130.t:0 "子弹上膛"
 PAM.130.d:0 "我手还撑在墙上，地上的那些人突然动了。\n\n那个原本闭着眼睛的水手，脖颈发出一声刺耳的骨裂声，他的眼睑翻了开来，露出两颗无神的紫色瞳孔。\n\n紧接着，通道里所有人都从阴影里站了起来，骨头咯吱咯吱直响。他们像被丝线吊着的木偶一样，伸着僵硬的手指，朝着我们大步扑过来。\n\n我被逼到墙角，大喊了一声，\n拉枪。上膛，火光在漆黑的过道里猛烈闪了一下。\n子弹钻进了对方胸口，热血像浪花一般溅在了墙上，可这帮死人感觉不到疼，甚至不肯退后一步，疯了似的往上挤。\n\n露西莉亚已经拔出了她的剑，白光在黑暗里一晃而过，挡在了我前面。"
 PAM.130.a:0 "跟紧我！"

 
 PAM.131.t:0 "谁也没穿上新鞋子"
 PAM.131.d:0 "后头终于没动静了。一滴凉水顺着后脖颈落进去，冷得我缩了缩脖子。\n我把那杆枪换到另一个肩膀上，枪带的铁搭扣压在衣服上，发出排开的铁鸣声。\n露西莉亚走在后面，手里的灯火晃来晃去，把我们的影子在石壁上拉得很长。我们踩着脚下的泥水往前走继续走着。\n\n路边的小木箱旁边，落着一只草鞋。鞋很小，鞋底磨穿了，草绳也断得不成样子。\n\n“以前在码头营地里，我也见过这种鞋子。”我小声对她说着，\n“木棉团长在老码头带兵的时候，从仓库里清出过不少皮鞋发下去。\n可那些在井下做工的娃娃不敢穿，都把新鞋藏在床底下的烂草堆里，平时还是光着脚，套着草鞋下井。\n她们害怕，怕团长哪天调走了，军团的人再把鞋收回去，最后还是得换回草鞋爬煤缝。\n结果，大家到死也没穿上那双新皮鞋。”\n\n露西莉亚停下脚。她用手指碰了碰地上的草绳，转过头看向我的脚：\n\n“果子，你的鞋子也快要磨坏了。”\n\n我低头看了看自己沾满泥水的鞋，鞋底上的线头确实已经磨烂了。\n\n“划船就是费鞋子的。”我把脚往衣服底下缩了缩，小声嘟囔着，“不过还能穿。走吧，前面有水声，我们得快点。”"
 PAM.131.a:0 "还能穿呢，走吧"


 PAM.132.t:0 "前路"
 PAM.132.d:0 "顺着风吹的方向一路朝前赶，脚底下的稀泥总算见了底，鞋底踩在地上的声响也越来越干脆。\n顶上不时有水滴砸在肩膀上，把我衣服上最后一点暖气都浇灭了。\n在这个昏暗、满是冰霜的山洞里，贴在胸口衣服内侧的红宝石，却烧得像一团红亮的火。我咬紧牙，靠着这股烫人的力气，拖着快要冻得失去知觉的腿，一步一步地拼命朝前挪着。\n\n“露西莉亚，跟上。”\n\n我扶着硌手的岩壁，依旧头也不回地朝前赶着。\n“我跟着呢。”她踩着泥水一路小跑，裙摆在风里剧烈摇晃，可步子踩得扎实极了，“这故事还没翻到最后一页呢，我们谁也不准死在这里。”\n\n露西莉亚那些经常挂在嘴边的神兮兮话语刚落，我的鞋底踩到了一片硬邦邦的黑渣子，一踩就碎。这触感和黏糊糊的稀泥完全不同。\n\n我蹲下去摸了把，指尖上全是颗粒状的碎末，放到鼻子底下，一股干涩、带有硫磺焦味的炭气扑鼻而来，把泥土的腥气全盖过去了。\n\n“我们踩到运煤的滑槽了。”我抬起脸冲她喊着：“以前老铁厂的工人就是顺着这条道往上送炭的。前面就是锅炉房了。”"
 PAM.132.a:0 "火，就在前面。"


 PAM.133.t:0 "拉响汽笛！！！"
 PAM.133.d:0 "炉门被硬生生拉开。凉铁摩擦着掌心上早就泡烂的冻疮，疼得我整条胳膊都忍不住哆嗦。\n\n炉口里堆着大堆未燃的干炭，还是当年工人们长眠前堆好的。\n我的衣领下藏着的那颗红宝石正像心脏一样一明一暗地跃动。手心里这颗滚烫的宝石贴着冻烂的血肉，烫得浑身哆嗦，可我这双手硬是不肯松开半分。\n\n在这一刻，周围的死寂沉得像块铁。我想起栈桥上晓枫姐那张被寒风冻透了的脸，想起木棉团长，还有那些死也穿不上新鞋的下井孩子。大家这会儿都安静地闭着眼，连呼吸声都消逝了。\n一定要留着这口气。我想听老铁厂的汽笛响起来，听那些熟悉的人在大雨里大声呼喊。哪怕这个世界再脏、再乱、再多愁人的事，也总好过这片冰凉的死寂。\n我握紧宝石，忍着灼热的剧痛将它强行按进了炭堆最深处。通红的光亮瞬间在锅炉里爆开了。\n\n“大家……快点醒过来啊！！”\n\n我用尽气力呼喊，声音在空旷的厂房里来回撞击，连铁壁上积攒的落灰都被震得纷纷飘落。"
 PAM.133.a:0 "醒过来啊！！"
 PAM.33_tt: "£GFX_KNM_zhanling_zhuanyi_KFL\n\n\n\n\n£GFX_Nightingale2_Hear_bg\n\n\n\n\n§t我们，要回到那个真实的人间了。§!"

 PAM.134.t:0 "迎接黎明！"
 PAM.134.d:0 "汽笛的尖鸣扯破了夜空。眨眼间，四周那些温和又虚假的彩色画面开裂了。就像镜子在眼前裂成了千万片，最后都化成了雪中的碎粉。\n\n小果子睁开眼，身前的锅炉结满了冰刺，风雪顺着残破的屋顶砸在脸上，冻得她脸颊几乎失去了知觉。这声汽笛震碎了虚假的梦境，可莉兰迪亚的深眠依然被城堡底下的法术强行锁着，还未彻底消散。\n\n无论如何，她们，终于回到了真实的世界里了。\n\n厂房外的荒地上，站满了身形木讷的亡灵卫兵。那些铁青的脸孔在风雪中缓慢地转过来，盯准了这座锅炉房。\n\n露西莉亚拔出剑。风雪撕扯着她的斗篷，顺着动作落了她满身的冰屑。她手臂轻颤着，剑锋稳稳地指向前方。\n\n“果子，”\n露西莉亚看着前方，声音里容不得一丝畏惧，“它们来了。”\n小果子拉动枪栓，铁鸣声在寒风中格外清脆。她跨前一步，挡在露西莉亚身前，迎着那些围拢过来的亡灵，大声喊道：\n\n“跟紧我，露西莉亚！”"
 PAM.134.a:0 "我们杀出去！"

 PAM.136.t:0 "天亮前的冷水"
 PAM.136.d:0 "门一推就开了，顶上的落雪跟着落了一地。大厅里冷清得很，长椅上横七竖八地躺着几个穿着丝绸衣裳的贵族，他们也一样，睡梦中还带着安稳的笑呢。\n“露西莉亚，你看这些家伙。”小果子走过去，拍了拍靠在柱子边沉睡的年轻贵族。对方毫无反应，依然陷在黑沉沉的睡梦里，“身上的衣服薄得跟纸一样，鞋底连一丁点泥都没有。外面的风雪这么急，他们倒是在这儿睡得挺安逸的。”\n露西莉亚跟在她后头，搂紧了身上那件斗篷，想要把外头扑进来的寒气都挡在衣服外面。她静静地看着那些熟睡的脸庞，叹了口气：“因为夜莺没打算让他们醒过来呀。外面的风雨太疼了，对习惯了温暖的人来说，还是在梦里待着更安全一些。”\n\n“可梦里又不能长出面包来。”小果子撇了撇嘴，随手把桌上空荡荡的铜壶放回原处，“晓枫姐提过，上区仓库里堆着不少过冬用的煤和口粮。要是不把这些睡懒觉的家伙弄醒，谁来开仓运粮呀。总不能指望我们两个把整个仓库都搬空吧。”\n露西莉亚走上前，将手掌贴在其中一个人的肩膀上。衣服冷冰冰的，她轻声唤了几句，可对方连眼珠都不见动一下。\n“普通的法子大概是不行了，果子。”露西莉亚摇头，神色里带着几分无奈，“在夜莺的梦境里睡得太深，他们已经感觉不到冷了。”\n\n“这事我拿手。”小果子把枪背在身后，几步朝大厅一侧的蓄水池走去，看着里面泛着凉意的水，“以前在码头挨冻的时候，我最清楚冷水有多提神了。泼一桶过去，什么样的美梦都得醒过来。”"
 PAM.136.a:0 "把他们泼醒。"

 PAM.137.t:0 "宿敌的苏醒"
 PAM.137.d:0 "推开沉门，大厅里昏暗冷清，索拉娜正在被子里睡得正香，那根系着蓝布条的头发散在了枕边。\n\n“喂。”小果子冷冷地看着她，端起手里盛满了冷水的铁盆，“起来了。”\n当头泼了过去。\n“阿噗！”床上的小女孩猛地弹了起来，大口喘着气，双手用力抹着脸上的水。她迷茫地睁开眼，视线在模糊的光线里转了转，最终落在了床边那杆步枪上，以及小果子那张灰扑扑的脸。\n\n“是你这个野火的小耗子？”索拉娜咬着牙，她盯着那杆步枪，声音里带着粗野的沙哑，“晓枫呢？雪伊呢？怎么偏偏是你？”\n\n“晓枫姐和雪伊姐还在外面睡着呢。”小果子厉声回应道。\n\n索拉娜盯着自己那双小小的手掌，嘴边溢出一声不服输的冷哼，一脚跳进地板，冲着小果子不屑得说道：“哼……晓枫和雪伊还在大雨里闭着眼呢？真是活该。老子当年把她们关进地牢，是为了让她们那双手在这个吃人的泥潭里少沾些脏东西。她们倒好，背着老子去搞什么大同公社，以为靠几句漂亮话就能挡住贵族的重炮吗？蠢货。”\n\n“闭嘴。”小果子猛地拉动枪栓，将枪口顶在了索拉娜的额头上，“不许你提她们！你这个抢粮的暴君，要不为了晓枫姐，我现在就一枪崩了你！等把大家找回来，我们迟早要跟你把账好好算一算！”\n\n索拉娜被枪口顶着，却丝毫不带畏惧。她伸手推开枪管，声音低沉下来：“小耗子，枪拿稳了。老子在和人拼命的时候，你还不知道在哪儿呢。要算账，老子也一并等着。等把那两个家伙叫醒，看看究竟是谁找谁算账。”\n\n露西莉亚将剑收入鞘中，看了看外面漆黑的夜空：“守在大道上的那些亡灵已经开始动弹了。我们动作得快些。”\n\n小果子收回枪，一言不发地转过身去，朝门外走了出去。"
 PAM.137.a:0 "到那个时候，我也不会输给你的。"
 
 PAM.138.t:0 "消失"
 PAM.138.d:0 "“空的。”\n\n小果子把水桶搁在地上，看着空荡荡的床板。那个成天抱着枪的雪伊姐，根本不在这里。\n\n索拉娜走到灶台边抹了一把，掌心蹭上了成片的灰。她斜眼瞅了瞅小果子那双满是泥水的破鞋，嘟嚷道：“小耗子，当年老子抢食的时候，也像你这么倔。不过老子是为了自己活，你倒好，为了这帮半死不活的家伙，连命都不要。真是个傻子。”\n“我们是为了让大家都能自己做饭吃，你这种人懂什么！？雪伊姐要是出了事，我这辈子都跟你没完。”小果子气红了脸，握枪的手传来骨节摩擦的吱吱声。\n“可雪伊不像是会乖乖就范的人。”露西莉亚从地上捡起一样物件。那是一块褪了色的红袖章，上面的线头散落在一旁。这是以前在野火的时候，雪伊一直戴在胳膊上的衣饰，此时正丢在床底的泥雪里。\n\n小果子看着那块袖章，声音里的颤抖更重了：“要是不在这里，她能去哪儿？要是不见雪伊姐指挥，光靠我们这几个人，怎么去跟那群亡灵对阵啊。”\n\n“她被带走了。”露西莉亚走上前来，把那块袖章放在小果子手里：“夜莺知道，雪伊是这片荒野上最硬的一根骨头，哪怕梦境再美，她也绝不肯乖乖低头。所以，夜莺把她藏进了故事的深处。”\n\n索拉娜大笑了一声，娇小的身子散发着野性：“哈！那老子就看看，你这丫头怎么跟老子没完。把那块破布收好吧，小耗子。我们去卡卡罗姆，那地方是野火的老营，晓枫当年起事的地方。夜莺既然爱藏人，老子就把那整片山谷都给翻一遍！”"
 PAM.138.a:0 "去卡卡罗姆。"

 PAM.139.t:0 "对峙"
 PAM.139.d:0 "“晓枫姐……”\n\n小果子的呼喊在坑道里撞了几下，很快就散了。四周冷冷清清，连个回音都快听不到了。\n“明明说好要等着我的………”多日的劳顿与接二连三的落空，终于压垮了她。索拉娜坐在她旁边，眼光闪了闪，似乎想起了自己当年在烧焦的木梁底下，也是这样嚎啕大哭。她烦躁地别过脸去，啐了一声。\n\n小果子掐着自己的大腿，眼泪一滴滴落下来：“露西莉亚，你到底是谁呀？你嘴里总说故事、另一本书，那到底是什么？对，我是个笨手笨脚的大笨蛋，可你说我们要去写不一样的结局，要把大家叫醒，我全听进去了，我也全照着你说的做了！”\n露西莉亚在暗淡的火光里，耳边的几缕长发已经变作了雪白色，声音呢喃着：“我知道的，我什么都知道。我看着大家一个一个倒下去，看着火光熄灭，我比谁都清楚。我只是希望大家有个温暖的结局，我只是——”\n\n“可我要的是活生生的人！”小果子吼着，连声音都沙哑了，“我划船把手掌磨得全是疮，我连命都不要得去拉响那个汽笛。我还反过来去找那个曾经杀了我们那么多人的暴君帮忙。结果呢？雪伊姐连个影子都瞧不见，现在晓枫姐也找不着！露西莉亚，你那个温暖的故事到底救了谁？我们现在流的血、流的眼泪，到底又算什么？””\n\n“可我也在努力啊！”露西莉亚终于喊了出来。剑滑落到了地上，发出震耳欲聋的脆响，“我的过去早就成了一片灰，我早就无家可归了。我越过大雾来到这儿，仅仅因为我舍不得你们，我怎么会想看你们流血呢？！我守在这冰雪里，委屈、受冻，可我不管怎么努力，怎么去拼命，依旧怎么也留不住你们。对你们来说，我不过是个突然闯进来的外人罢了……”\n\n小果子怔怔地看着她。看着她耳边刺目的白发，那些滚烫的怒火在这一秒消散了。她往前膝行了几步，扯住了露西莉亚的斗篷：:“行了！不准再说‘你们’了！”小果子猛地站起身，眼泪混着泥污流过脸颊，“你们……你们！一路上吃风踩雪，哪一步少过你？谁把你当成外人了？你在路边冻病了，我还不是整夜生着火，在旁边守着你吗？要是连你也在这儿睡过去，那这剩下的路……到底还要我怎么走啊！！！”\n矿道里安静得厉害，仅剩下滴水砸在石头上的声响。小果子看着那柄掉在水洼里的剑，又看向露西莉亚，那些带刺的问话全都卡在喉咙里，吐不出来了。\n她俯下身把剑捡起来，用衣袖抹去上面的泥沙，默默地递了过去。\n墙根下冷飕飕的，只听得见吸鼻子吸眼泪的声音，谁也没再说话。"
 PAM.139.a:0 "……"

 PAM.140.t:0 "风，吹散了最后的残火"
 PAM.140.d:0 "大雾如死水般横在尽头，任凭小果子和露西莉亚如何用力，面前那堵灰墙也未曾开裂分毫。\n\n在她们身后，那个矮小身影正悄然散开，梦境彻底碎了，索拉娜头顶的缎带与衣服一同化作了暗红的火星，在风里露出了她生前最后的装束——那是一头随风乱卷的金色长发，一双犹如热炭般发红的眼眸，身上仅仅裹着一块粗糙的红斗篷，站在长慢枯草的铁轨上。这正是她当年冻死在雨里最后的模样。\n\n“喂，暴君。”小果子猛地回过身，手指想要抓住索拉娜的衣服，可手心碰到的唯有正在融化的红光，“你还没赔我们野火那么多条人命呢，别想就这么算了。给我醒过来。”\n\n索拉娜低头看着自己已经开始透明的手掌，迎着风，一步步朝大雾深处的死墙走去，眼里的光随着步伐一点点冷了下来。\n她回头看着小果子脸上的伤痕，语气多了一丝释然：“行了，小耗子，别叫唤了。老子原本就是死在雨里的一条野狗，占了这心脏的光，才当了几天威风的女王。现在梦醒了，自然就得散了。\n老子，在最后，帮你们撞一回门，把你的枪拿稳了，别让老子觉得……你们连我这个死人都不如。至于能不能把那两个家伙捞回来……就看你们自己的能耐了。”\n\n话音刚落，她那具半透明的身体在墙前绽放出刺眼的红芒，她将双手按在墙壁上，任由灵魂深处最后的力量轰然爆开。\n\n碎裂般的脆响震耳欲聋。大门在红光中生生撕开了一道缺口，露出了门后那个一片结满冰霜的无声国度。\n\n那个名叫索拉娜的流浪儿已然消失在冷风里，伴随着最后的红绸随风散尽，前方仅余下一条空旷的铁轨，在无光的夜色里无言地向前延伸着。"
 PAM.140.a:0 "再见，索拉娜。"

 PAM.141.t:0 "挽歌"
 PAM.141.d:0 "台阶上风大得像要把人撕开。\n小果子冲在最前面，眼眶里全熬出了全是充血的红丝。这一路太苦了，她心里有一团急火在烧，必须快一点，再快一点，要是去晚了，地底下那两个姐姐就会彻底冻住在梦里。\n当那两具披着重甲的影子拦在门前时，她完全杀红了眼。毫不讲究章法，全凭着一股要把门后同伴掏出来的野劲。子弹打空了，她就用枪托去砸；身上早就伤得皮开肉绽，她硬是咬着牙，把随身的刺刀强行送进了对方的心口。\n\n黑甲在雾气里碎开了。\n\n面具底下，是晓枫那张总是带着清醒的神容。可现在，总参谋长心口多了一个还在涌血的窟窿，那是小果子刚才扣下的扳机。\n\n“晓枫姐……”\n\n另一边的阶缝里，倒下的卫兵也散去了伪装。雪伊身上那件熟悉的白衣被刺刀整个豁开，脸上却带着解脱般的笑容。\n\n夜莺把她这辈子最想带回家的两个人，塞进了这身寒冷的盔甲里，当成了消耗她弹药的靶子。\n\n“……雪伊姐？”\n\n手里的枪重重跌在石头上。小果子扑过去，用双手拼命去堵那个淌血的伤口，可血滚滚不断地往下涌，把整片落雪全染成了通红：\n\n“……我是来叫醒你们的呀！你们睁眼看看我，我是小果子啊！\n\n…为什么……为什么偏偏是你们啊！！！”\n\n她抓着沾满血肉的雪水，对着眼前已经敞开的大门发出一声撕心裂肺的悲鸣：“为什么要这么逼我啊！我拼了命走到这里，就是为了让我亲手杀掉她们吗！把命还给我……把我的姐姐们还给我啊！……”\n\n这漫天落下的雪花，最终盖在了三具逐渐变冷的身体上。\n她踩过万水千山，熬过了漫天风雪，最后却在这扇门前，用自己为了清醒而发起的那一枪，\n亲手完成了这场长眠里，最残忍、也最真实的葬礼。"
 PAM.141.a:0 "把她们……还给我啊。"

 PAM.142.t:0 "最后的最后"
 PAM.142.d:0 "梦境已经彻底坍塌，这位寂静国度的神明也正走向消散，她的身躯正在大殿里化作幽蓝的光斑，一片片飞向空中。\n露西莉亚走上前去，在她身旁停下。她伸出双手，触碰到了夜莺那张因为寒冷而僵硬的脸颊。\n夜莺看着她，眼里的紫色光芒渐渐暗了下去。神明发出的叹息回荡在空旷的穹顶之下：\n“新一天的门推开了。可从今往后，要在这长夜里守着的人，换成了你呢。”\n\n“我知道。”露西莉亚回答的声音很平稳，却带着不容置疑的执拗。\n\n夜莺之心的冷光在这一秒猛然绽放开来。神明任由那具神圣的躯壳化作大片碎落的光斑，尽数融入露西莉亚的身体。两颗原本相同的心脏合在一处，将整片大地的死寂也一并收拢。\n\n此后，这世间再也无需有人变成雕像了。\n\n“你这个该死的怪物！给我滚出来啊！！！”\n\n大门口突然传来一声凄厉的嘶吼。小果子浑身是血地撞进了大殿。她满脑子都是晓枫和雪伊倒在血里的模样，这股子邪火烧得她整个人都在发抖，她必须把那个玩弄人命的夜莺亲手撕碎。\n可当她看清殿内的一切时，手里的枪颓然滑落在地。\n\n这里只有露西莉亚一个人，她抱着那柄承载了万千执念的剑，孤零零地站在石椅前。空中的光斑已经散尽，连最后一丝属于夜莺的气味都找不着了。\n\n“结束了，果子。”露西莉亚缓慢地转过身，一头长发已经褪成了雪色。她看着饱含愤怒和悲伤而僵在原地的小果子，眼里的神色哀伤却温存。\n\n小果子无力地瘫倒在了地上，发出一声声沙哑的、像要把心肺都呕出来的抽泣声。\n\n露西莉亚走到她身旁跪了下来，将这个哭得快要断气的小女孩搂进了怀里。\n\n风雪在这个瞬间彻底停了。阳光终于突破阴云照射在了二人的脸上，\n\n鸟叫声，\n\n蝉鸣声，\n\n陆陆续续地响彻在了故事的尽头。"
 PAM.142.a:0 "“哭吧。”"

 PAM.143.t:0 "写故事的人"
 PAM.143.d:0 "露西莉亚一直安稳地闭着眼，怎么唤都唤不醒。\n\n小果子坐在一旁，正看着她熟睡的脸庞。小果子不知晓在看不见的地方，这片大地几万年来留下的痛苦和遗憾都正压在露西莉亚弱小的肩膀上，\n\n她自顾自地欺骗着自己。她不敢去后山看那两座新堆起来的土坟，也不敢去回想那晚殿门前的枪声。她一厢情愿地相信，露西莉亚只是太累了，等尘世的痛苦都消散了，露西莉亚就会醒来，晓枫姐和雪伊姐也一定会完好睁开眼。\n\n“你这个笨蛋。”小果子伸出手指，帮她理了理额前的白发，“写故事的人，怎么能自顾自地先睡着了呢。”\n\n在小果子的常识里，道理很简单。露西莉亚想要一个温暖的结局，想要大家安稳地活着。那现在，把那些被夜莺强占的属国放了，把过冬的煤分到每个百姓手里，让街上到处都是温暖的笑声。等尘世的哭声和痛楚都消散了，露西莉亚胸口压着的担子变轻了，她自然也会开心地醒过来，头发也会变回原来的颜色吧。\n\n她站起身。找准了方向的话，那就带着莉兰迪亚的兄弟姐妹，把这个世界收拾得干干净净，好在露西莉亚睁开眼的时候，送她一个完美的明天。"
 PAM.143.a:0 "让世界幸福起来。"

 PAM.144.t:0 "你听见噼啪声了吗？"
 PAM.144.d:0 "小果子在床沿坐下，身上带着煤炭燃烧后的涩味。\n\n她看着被自己搬到床上的白发姑娘，伸手轻轻戳向对方的脸：“喂，露西莉亚。今天老铁厂的炉子生起来了，烟囱里冒了大片的白烟呢。大家把分到的石炭抱回家，炉子一热，整条街的冰雪都融成了水流。大家都在笑，说今年冬天的雪再大，家里也冻不死人了。”\n“我今天在大殿门前，在晓枫姐和雪伊姐倒下的那块台阶上，围了一圈栅栏。大家说应该给她们换个地方，可我不准任何人去碰，我非要把那地方留着。露西莉亚，等你睁开眼，我们一起在上面种花，好不好？”\n\n她从兜里掏出一颗化了大半的糖果，放在了露西莉亚的手心：“这是分给孤儿院的小孩时，我偷偷留出来的，不过我可没抢哦，大家都分到了甜头，我只是也给你留了一颗。你嘴里总念叨着要一个温暖的结局，现在大家都吃饱了，屋里也温暖了，你胸口压着的担子，应该轻了些吧？”\n\n露西莉亚静静地躺着，依然闭着双眼，连呼吸声都轻得听不见。\n\n“……怎么还不醒呢。”\n\n小果子小声咕哝着，把被子往上拉了拉，“嫌我吵吗？那你就睁开眼，大声骂我一句呀。”\n\n屋里冷清得很，剩下的只有窗外落雪拍在窗纸上的细响。"
 PAM.144.a:0 "明天，我会继续去温暖这个世界。"

 PAM.145.t:0 "风吹进来的感觉是什么样的？"
 PAM.145.d:0 "“喂，露西莉亚，我今天干了一桩大事。”\n\n小果子拿袖子擦了擦额头，声音里带着点得意，“夜莺以前强占的那些属国，我也给她们全放了。我把地图和那些盖了章的纸扔进火里，大火把天都映红了呢。”\n\n她看着露西莉亚睡着的脸，又忍不住伸出手，轻轻抚摸：\n“那些属国的人们拉着车，连夜朝自己的家赶，一路上都在大声唱着她们以前的歌。你听得见吗？\n风从敞开的山口吹进来了，带着以前晓枫姐她们的味道，很好闻的。”\n\n露西莉亚安稳地躺着，连衣襟都平展得不见半点褶皱。\n\n“她们回家了，我也把路让开了，大家都自由了。露西莉亚，你的心口是不是轻松了些？”小果子抿着嘴笑了笑，眼里却全是水光，“大家再也不疼了，你也该快些醒过来了吧。你要是再睡下去，晓枫姐教我的那些字，我可就要全忘光了。到时候，谁来给你读故事的最后一页呀。”"
 PAM.145.a:0 "我会一直在这里。"


 PAM.146.t:0 "很久很久以前"
 PAM.146.d:0 "“对不起啊。”\n小果子把手贴在露西莉亚的掌心里，声音很低，眼泪一滴滴落在她们交叠的手心上：“我以前总想咬你，嫌你说话酸溜溜的，老说些不着调的梦。我还怪你，怪你没能救下大家……可是露西莉亚，我以前不知道你也会疼的。你明明比我还怕冷，怎么就自顾自地把这么重的风雪，都一个人顶在头上了呢。”\n“现在外面一点哭声都听不到了，大家都暖和着呢。露西莉亚，你醒一醒，我们不打仗了，我带你去晒太阳，好不好？”\n\n露西莉亚的睫毛颤了颤，双眼缓慢地翻开，露出一双澄澈的、倒映着微光的眼睛。\n“果子……”\n露西莉亚坐起身，她看着眼前这个哭得脏兮兮的姑娘，伸出手，轻柔地抹去小果子脸上的灰印子。她笑了笑，神色里满是寂静的哀伤：\n“没用的呀，果子。世间的痛苦和遗憾是抹不掉的。即使现在大家都过得安稳，死在昨天的那些同胞，他们的眼泪和怨恨，也依旧存在。\n夜莺散了，可冥界还在。几百年来所有死者的执念，现在都融进了我的身体里。我无法离开这里。我得一直坐在这个安静的地方，替活人守着这些寒冷。”\n露西莉亚抚上自己的胸口。她看着小果子，声音柔弱而笃定：“晓枫姐和雪伊姐……她们也在我的怀里睡着呢。雪伊姐走的时候，其实还摸了摸你的头…………大家，都安心地闭着眼，不怪你啊。”\n露西莉亚替这个世界收留了所有的冰冷，甚至，替她收留了那两缕沉重的幽魂。\n小果子深吸了一口气。直接在台阶上坐了下来：\n“那我也不回去了。”\n“果子？”露西莉亚睁大了眼。\n“我不去晒什么太阳了。晓枫姐不在了，雪伊姐也不在了，现在连你也要留在这儿。你让我一个人回太阳底下去，我一个人，怎么能吃得下饭啊。”小果子拉住她的手，把十指交叠在一处，神色坚强得很，“如果这片冥界是你的身子的话，那我也留在这儿。你守着那些死人的冷，我就守着你。我们两个，在这个故事里，就这么一直挨着，谁也别想丢下谁。”\n露西莉亚伸出手掌，轻轻抚摸着小果子的头发：“很久很久以前，”露西莉亚的声音依旧温柔，眼泪顺着脸颊流了下来，“有对小鸟……它们决定，在最黑的长夜里，一起等一个永远不会来的清晨。”"
 PAM.146.a:0 "在很久很久以后……"

 PAM.147.t:0 "你还在画那些线吗？"
 PAM.147.d:0 "小果子在桌前坐下，铺开了一张地图。地图的边缘微微泛黄，上面还留着几点墨水和灯油滴下的干涸痕迹。在那些复杂的红线旁，晓枫当年写下的小字依然清晰。\n小果子哈了口气，擦了擦笔杆：“晓枫姐。你教我的那些字，我都快要记不全了。不过，我今天在营房里摆了课桌，让先生来教那些刚醒来的孩子。教他们怎么看路牌、怎么算账目。你以前总说我笨，说我看书像在看天书，现在我带出来的孩子，每个都聪明得很。”\n她看着桌面上落下的暗光，垂下了眼帘：“你以前和我说过，在地图上画线的时候，心里要装着活人才行。现在，山谷底下的路都填平了，大家也都能吃上饱饭了。晓枫姐，我们如今做得很好了。”\n随着窗外的落叶飘过，安静的书架上，再也寻不回那个在灯下写字的身影了。"
 PAM.147.a:0 "晓枫姐，你看到了吗？"

 PAM.148.t:0 "举起自己的汤匙"
 PAM.148.d:0 "新建的食堂里升起滚烫的热气。大桶里装着新熬的浓汤，散发着诱人的香气。小果子手里抱着一柄汤勺，看着正在排队领汤的队伍，眼睛眨了眨，忽然停下了动作。\n“雪伊姐，你看，大家今天都很听话。”小果子把勺子浸入锅里，慢慢搅动着，“再也无人争抢了，也没人会为了一口面包大吵大闹。门口站着的人们都很和气，连个大嗓门都瞧不见，更不会像你那样大吼大叫了。”\n她看着桌旁空出来的那个位置，强行露出笑意，眼眶里全是一圈泪水：“她们以前和我说过，你是我们队伍里最硬的骨头，可心肠也是最软的。你以前总骂我，嫌我粗心马虎。可现在，贵族老爷打跑了，大家的口粮也发下去了，你倒是回来骂我一句呀。”\n锅里蒸腾的汽水迎面扑来，将她的睫毛都打湿了。\n“雪伊姐，新衣服也发给大家了，大家都穿得很好。明天，我还得去给邻国送谷物呢。”她轻声说，“等会我就去跟露西莉亚炫耀。我会告诉她，这是我和大家，和雪伊姐、晓枫姐一起守下来的世界。”"
 PAM.148.a:0 "雪伊姐，我已经学会听话了。"

 PAM.149.t:0 "很久很久以后"
 PAM.149.d:0 "阳光落进废墟，照着殿前那两座坟冢。在深处的殿堂里，时间已经失去了意义。小果子低着头，一双手在裤缝上反复蹭着，即便已经洗了无数遍，她还是觉得掌心里那股粘稠的铁腥味怎么也散不掉。\n“晓枫姐刚才还说口渴呢……雪伊姐也真是的，又不知道跑哪儿去疯了。”小果子低着头，声音带着某种病态的笃定，“露西莉亚，我们得把火再生旺些，别等她们回来的时候，屋里冷冰冰的，那多不像话呀。”\n露西莉亚坐在她身侧，拉住小果子的手腕，止住了那无意义的动作。“果子。她们……自始至终都在这里陪着你呢。”\n\n小果子甩开她的手，眼神里晃动着焦躁。她指着外面被雪盖住的土包，声音忽然拔高了：“胡说！我明明看着她们在那儿站着呢！她们还要带我去吃苹果，还要教我认字……你别想骗我，那晚在殿门口扣扳机的人不是我，那是夜莺，是夜莺那个怪物干的，对不对？我最喜欢姐姐们了，我怎么会……”\n\n看着这幅快要碎掉的模样，露西莉亚轻轻叹了一口气，将小果子单薄的肩膀强行拉入怀里。她感受着怀中那具身体剧烈的战栗，缓缓开口：\n“索拉娜当初从梦里醒来的时候，胸腔里其实已经空了。她失去了夜莺之心，却还能在那场风雪里跟着我们走到殿前。果子，你知道那是因为什么吗？”\n小果子愣了愣，眼底的疯狂在露西莉亚沉静的注视下缩了回去。\n\n“那是因为莉莉安娜在那之前，就已经为了她而消散了。她知道那个不听话的野狼贪恋这人间的温度，就自愿把身子融进了夜莺的死气里。她把自己变成了这大地上的风，冰雪中的火，就为了在梦境打破后，还能推着她的小狼多看一眼这个世界。索拉娜走得并不孤单，因为莉莉安娜从未离开过她。”\n露西莉亚抚上自己的心口，那是冥界万千执念沉淀的地方：\n“晓枫姐和雪伊姐也是一样的。她们从没有抛下你不管，也从没有怪过你，因为她们知道，她们知道，那个在海风吹响哨子的孩子，那个在最深的绝望里生起火焰的孩子，那个拼了命要把大家带回家的孩子，一直都是她们最大的骄傲。果子，你可以恨索拉娜，可以恨夜莺，唯独别再继续折磨你自己了。”\n\n小果子看着露西莉亚那双倒映着星星的眼眸。她眼里那股惊惶而生的疯劲被这份悲悯给压了下去，肩膀无力地垮了下来。\n“真的吗……” \n“真的哦。我们一直都在，一直都在一遍遍把大家守到最后呢。”"
 PAM.149.a:0 "毕竟，谁会去怪小果子呢？"

 PAM.150.t:0 "乖孩子"
 PAM.150.d:0 "“火都生起来了，就这么让它熄了，那多可惜呀。”\n夜莺的声音软绵绵的，像是一层甩不掉的雾气，慢慢缠了上来。一只属于少女的手在地图上打了个转，最后停在了雪伊守着的那个厂房位置。\n“雪伊现在正等着呢。可风雪里那些坏影子也快到跟前了。趁着你还没累坏，带人去守着那道门好不好？只要那些影子进不去，你心心念念的汽笛声，一定能响彻整个夜空的。你看，你这么努力，雪伊也会为你高兴的吧。”"
 PAM.150.a:0 "……"

 PAM.151.t:0 "你做得真棒"
 PAM.151.d:0 "“哎呀……真遗憾。”\n夜莺的声音听起来软绵绵的，透着一股不自禁的亲昵感。\n“那些影子散开了呢。看呀，它们这会儿又跑到了地图那一头的荒野里，是在和你玩捉迷藏吗？如果是你的话，肯定能赶在汽笛响起来以前赶过去的。加油呀，这种为了同伴而奔忙的样子，真的很好看呢。”"
 PAM.151.a:0 "……"

 PAM.152.t:0 "永远不会来的明天"
 PAM.152.d:0 "“噗呼……抱歉，让你白跑了。”\n夜莺清脆的笑声在你脑海里回荡着。\n“那些影子又回去了，而且带了更多的同伴。真对不起，让你这么辛苦。看着你为了伙伴这么努力，甚至连呼吸都乱了的样子，我真的很满足呢。啊，还有一件事……”\n\n“其实那个拉杆，原本就是坏掉的呢。无论雪伊在那边怎么使劲，那声汽笛也始终响不起来呢。你看，大家都睡得这么甜，吵醒大家，可不是好孩子该做的事呢。”"
 PAM.152.a:0 "……"

 PAM.153.t:0 "那个不着调的法子"
 PAM.153.d:0 "窗外的光亮渐渐消失了，那些紫色的雾悄无声息地漫过街道。避难所里，里拉靠在墙边，摆弄着自己的裙子，百无聊赖。她侧过脸看向一旁的妮妮。\n“喂，妮妮。你听过那个救命的法子吗？”里拉的声音很轻，听起来像是在讲一个好笑的故事。\n妮妮正盯着面前熄灭的炭火，眼神散乱：“你是说……那个什么躲进木箱子里的笑话？”\n“不对，是纽扣啦。”里拉从袖口摸出一枚因为磨损而失去光泽的小扣子，“我听那些老水手说，随手找一枚掉下来的纽扣，悄悄告诉它一个你藏在心里最深的秘密，再把它放进鞋底。听说这样，梦里的那个影子便会把你当成同类，绕着你走呢。”\n妮妮听完，脸上尽是无奈：“里拉，你真是因为太害怕才变笨了吗？那种哄三岁小孩子的鬼话，亏你也记得住。大家都快要睡着了，找纽扣有什么用。”\n“谁知道呢，万一有用呢。”里拉小声嘟囔了一句。她看着那些顺着门缝钻进来的雾气，缩了缩肩膀。这个法子编得连她自己都觉得荒唐，可在这清冷的屋子里，除了这些不着调的话，她们确实找不出别的事情可做了。"
 PAM.153.a:0 "谁会把这当真呢。"

 PAM.154.t:0 "在两个世界之间"
 PAM.154.d:0 "埃拉背靠着避难所的大门，双手用力抵着横梁。门外的雾气带着一股诱人的花香。她的意识这会儿正像一只在暴雨中晃动的纸船，随时都会翻覆。\n“快看，埃拉……太阳多暖和呀。大家都在草地上野餐呢，快过来坐下。”一个温柔的声音在脑海里响起来，那是梦境编织的幻象。眼前的阴暗地下室，这一秒变成了开满鲜花的庭院。她甚至闻到了刚出炉的食物香气。\n“不……那是假的！”现实中的埃拉猛地咬向舌尖，剧痛让眼前的花海瞬间碎裂。可紧接着，那种温润的困意再次席卷而来。梦境里的她正开心地伸出手去接同伴递来的红茶，而现实中的她，却在寒冷中拼命抓紧那根生硬的门梁。\n“快回来……大家……还在等着我。”\n她在两个世界之间来回撕扯。梦里的阳光照在背上，让她舒服得想要大哭；现实的冰冷贴在掌心，提醒她这扇门绝不能开。这种拉锯战持续了很久，直到那一抹清明的意志被彻底淹没。埃拉在睡去的那一刻，依然靠着那份偏执的守护，而维持着那个半跪的姿态，将整个身躯都压在了门锁上。"
 PAM.154.a:0 "请再慢一点睡去吧。"


 PAM.155.t:0 "那个玩笑是真的吗？"
 PAM.155.d:0 "屋内陷入了令人窒息的沉寂。门那里发出了一声轻响，那是埃拉彻底睡过去后，身躯落到地面的动静。这一刻，这扇门已经没有人再能从外面打开了。\n“里拉……”妮妮的声音听起来特别沙哑。她看着那堵紧闭的门，眼里那些最后的光亮，这会儿随着恐惧而熄灭了。\n那种无力感伴随着这片冰冷，变得尤为粘稠。妮妮的手在口袋里摸索着，那里空荡荡的，就如她们剩下的明天一般。\n“你昨天说的那个……纽扣。”妮妮的声音听着像是随时会断掉的线。她没敢抬头看里拉，手心夹杂着汗水而变得湿冷无比，“就是那个……找一枚纽扣告诉它秘密，就能醒过来的那个法子。”\n里拉愣住了。她看着妮妮那双布满了血丝、写满了期盼的眼睛。她原本想说那仅仅是个为了排解压力的笑话，可看到周围几个邻居也都抬起头，眼里亮着一种近乎绝望的狂热。这个她为了逃避恐惧而胡编乱造的、荒唐至极的玩笑，此刻竟成了这里唯一剩下的救命稻草。\n“里拉，你快告诉大家……”一旁的老妇人颤巍巍地拉住她的衣角，眼里满是哀求，“那个法子，是真的吧？你一定是在哪本书里看到的，对不对？”\n里拉喉咙里哽住了一团火，充满了羞愧与悲哀而产生的刺痛。她看着这群为了活下去而快要疯掉的邻人，最终用力地点了点头：\n“是真的哦。大家快找找，身上有没有掉下来的纽扣。等我们把秘密告诉它，这大雾就抓不住咱们了。”"
 PAM.155.a:0 "我们也只能这样了"

 PAM.156.t:0 "关于终点"
 PAM.156.d:0 "窗外的海面上，那些挂着圣杯旗帜的白船正缓慢地移动，旗杆顶端的金属在日光下泛着令人作呕的冷光。那些来自大洋对岸的绅士们，在信函里用辞藻堆砌着所谓的盟约与荣誉，听起来和当年的那个白色生物发出的邀请并无区别。他们的帝国已经老了，满身都是无法修补的漏洞，便渴求着这些拥有奇迹的少女去充当填补裂痕的薪柴。这是一种慢性的吞噬，他们赞美少女的羽翼，是希望这些羽翼能扇动起维持他们航行的风，直到大家燃尽最后的一丝灵性。\n\n一段声音跨越了防线的阻隔，平缓地响在晓美焰的耳畔，带着一种伴随着理解而生的悲悯：\n\n“晓美焰。你在这个循环里走了很久呢。那些在船上喝着下午茶的人，他们谈论着秩序，谈论着未来的版图，可他们的眼睛里唯有贪婪。在他们看来，你们的痛苦仅仅是维持天平平衡的筹码。何必再为这种摇摇欲坠的旧梦去奔忙呢。圣杯的怀抱并无温度，那是一座用繁文缛节修筑的坟墓。”\n\n那声音停顿了片刻，似乎在等待着海浪平息：\n\n“来到我们的院子里吧。这里不需要奇迹去交换生存，也无需通过燃烧灵魂去换取胜利。我们这里备好了空白的页脚，允许飞累了的人在此处做个美梦。圣杯想要你们去战斗，而我，许诺你们一个不再被任何人干扰的结局。选择权握在你的手心，是要在那艘注定沉没的巨轮上耗尽余光，还是在这片安静的领土上，找回那份本该属于你们的安宁？”"
 PAM.156.a:0 "我们确实已经累了。"
 PAM.156.b:0 "这种安静，未免也太像那座囚笼了。"

 PAM.157.t:0 "从头到尾都是你"
 PAM.157.d:0 "在夜莺消失之后，我就把那颗红宝石还给了露西莉亚，现在它暗沉沉的，跟河滩上随便捡的石子没两样。我都快忘了它脖子上还挂着这么个东西了。\n\n今天大殿后面阳光很好。我坐在台阶上剥着花生，露西莉亚正靠在我旁边打盹，白发散在她的肩膀上，跟着呼吸一上一下。花生壳在脚边碎了一地，我正想弯腰去捡，露西莉亚被我的动作带得翻了个身，她的挂绳从领口滑了出来，宝石磕在石阶上，叮的一声。\n\n宝石里那团暗红色里头，似乎有什么东西动了起来。\n\n像深秋早晨窗玻璃上结的第一层霜，像太阳还没完全升起来，照着那种带寒意的白。\n我弯腰捡起，用拇指蹭了蹭宝石表面，凉意顺着手上的伤痕往手腕上爬了上来。\n\我的脑子里瞬间涌上来了好多东西——栈桥上晓枫姐笑容、雪伊姐在灶台边的责骂、能够让营房里的大家挤在一块的热汤\n\n这些画面一个接一个显现过去，最后停在脑子里的，是晓枫姐说“我等一等小果子”的时候，风把尾音撕碎的那个瞬间。\n\n宝石在我手心里跳了一下。\n\n亮了又暗，暗了又亮，像在喘气似得。\n\n“这东西怎么又亮了。”我拿胳膊肘碰了碰醒过来的露西莉亚。\n\n她睫毛未动，却露出了一个很温柔的笑容。那个笑我见过很多次了，每次她有什么话搁在心里等我开口，就是这副表情。\n\n“你想她们了。”"
 PAM.157.a:0 "……"

 PAM.158.t:0 "从头到尾都是你"
 PAM.158.d:0 "我张了张嘴。喉咙里像堵着什么东西一样，说不出话来。\n\n她把眼睛睁开一条缝，灰蒙蒙的瞳孔侧过来看着我，声音很柔软，却不像是在安慰谁，倒像在替我清点一本我自己都不敢翻的账。“你今天剥了一上午花生，也没吃几颗吧？花生是雪伊以前老揣在兜里的零食，你每剥一颗都在想，她要还在的话，肯定会把最大的那颗抢过去，说这个归我了。”\n\n我握着宝石的手更紧了。\n\n“然后你又在想晓枫姐。你觉得她要在的话，会一声不响地帮我把花生壳扫干净。你不敢往殿前看，从这边刚好能回望见门前那两座坟。你在算日子。算她们走了多久，草长了多高。”\n\n后院子里那根晾衣绳上搭着昨天刚洗的衣服被子，现在正被一阵阵风灌进去，鼓成了一个弧形，又迅速蔫了下去。\n\n她把我的手拉了过来，用双手包在一起。她的手凉凉的，却让人觉得很舒服。\n“这颗石头从你拿到手那天就在亮。海上，防空洞，老铁厂……它从头到尾都在亮。”她停了一下，把我的手掌翻过来，宝石搁在正中间，“可后来它暗了。你想想，是什么时候暗的？”\n\n我看着掌心那团光，不知道怎么回答。\n\n“是你说该做的事做完了那天。你觉得最难的日子已经熬过去了，它就乖乖暗掉了。\n她顿了顿，“像个以为自己可以下班了的笨蛋。”我差点笑出来，可眼睛里的酸涩又把那声笑摁了回去。\n“可你刚才坐在这儿剥花生，想起晓枫，想起雪伊，想起所有人的时候，它又开始发烫了。”她把视线从宝石上移开，落在了我的脸上。\n“夜莺有一颗心脏，是神明留下的，用来维持整个寂静国度。那颗心后来融进了我的身体。但你脖子上这颗，跟夜莺没有关系。它是我在岛上给你的，从一开始，就是一块普通的石头。是你在海上的浪里、在厂里的炉子前、在想她们想得受不了的每一个晚上，把自己的念想一点一点塞进去，它才变成现在这个样子。”"
 PAM.158.a:0 "……"

 PAM.159.t:0 "从头到尾都是你"
 PAM.159.d:0 "她把头靠回我肩膀上，声音越来越轻，“它是一块石头，或者说是一颗小小的会发光能着火的石头？它记性很好。你这一路是怎么过来的，它全替你记着呢。”\n\n宝石躺在我手心里，颜色不知道什么时候变了。不再是刚才那种冷冰冰的白，像刚点着的灯芯，靠着一小团暖光从里头往外漾着。\n我盯着那团跳动的光，忽然想起老铁厂的锅炉房。炉火升起的那一刻，我正对着那些躺着不动的人喊“醒过来”，嗓子劈得像破锣似得。我当时只觉得是这颗石头替我把一切都点着了。\n\n“它什么时候亮，什么时候暗，谁也做不了主。想她们了它就亮，心里空了它就歇着。就这么简单。”露西莉亚的声音黏糊糊的，睡意浓得快把她整个人拖进去了。\n她把我的手重新合拢。“就是这样的。”\n\n“那晓枫姐和雪伊姐……”\n“她们没有这种东西哦。”\n她话接得很快，语气平平的，像在说一件理所当然的事。\n“每个人留下的东西不一样。她们留给你的，用不着装在石头里。”\n好多花生壳都卡在了石缝里，被风吹得簌簌响。\n她把宝石再次归还给了我，重新塞回我的领口。贴在我的锁骨中间，重量很轻。不烫，也不冷，跟我的体温刚好一样。\n\n露西莉亚不知道在什么时候睡着了，呼吸拉得很长，肩膀轻飘飘地靠着我。我坐着一动也不动，顺着风的方向望向了殿门那边……那个我一直不敢正眼去看的方向。\n\n我的眼眶彻底湿润了。\n\n我伸手把露西莉亚的头发拂回肩膀上，手指刚碰到那些白得像雪的碎发时，她忽然动了动嘴唇。我以为是在说什么梦话，把耳朵凑近了才听清。\n“我好像……忘记给它起名字了。”\n她的声音像一片落到热水里的雪花。\n“夜莺有她的心脏，神明有神明的遗物。这颗石头却什么都不是呢。”\n\n她把脸往我肩膀里埋了埋，声音闷闷的。\n\n“一颗石头花了一整段故事记住了一个人。用别人的名字叫它，太委屈了。”"
 PAM.159.a:0 "嗯。"


 #二线结束

CHL_has_military_access:0 "温水里的肥猪抽了门闩"
CHL_has_military_access_desc:0 "这帮在温水里泡软了骨头的§Y肥猪§!，早就连抓枪的力气都没了。整天光惦记着精致的下午茶，连后院大门闩被§t公社§!的叛匪拱开了都装看不见。现在倒好，对面的那些§t痴匪§!扛着生锈的家伙，大摇大摆从我们后院里穿过去，这帮蠢货居然还拿着手帕在旁边看热闹，生怕鞋面上沾了泥点子。后防线被这帮软脚蟹漏成了筛子，连巡逻队巡逻都得绕着她们的野餐垫。\n§R指望这帮§Y肥猪§!看门，迟早连底裤都得被抢个精光。§!"

#百灵好感度 0  2
 PAM_.25.t: "胃里的石头"
 PAM_.25.d: "“深夜，我跪在马桶边，把胆汁都吐了出来。胃里空荡荡的，但我总觉得那里塞满了沉甸甸的石头。那些石头有名字，叫阿雅，叫羞耻，叫苟且偷生。\n我为什么要活着？\n我闭上眼，就能闻到那股肉饼的香气，那是阿雅被剁碎的味道。贵族们优雅的咀嚼声在我脑子里回荡，像是一万只苍蝇在飞。\n索拉娜把漂亮的裙子扔给我，把我锁在这个贴满金箔的房间里。她以为这就叫恩赐？不，这是刑罚。我穿着这身昂贵的丝绸，感觉就像披着一层死人的皮。每呼吸一口气，我都能感觉到自己的肺叶在腐烂。\n我握着那把没能刺出去的匕首，刀刃冰凉，贴在手腕的动脉上。只要轻轻一下，我就能去陪阿雅了。我就能把这满肚子的脏东西都流干净了。\n‘……死很容易。’那个女人的声音突然在门外响起，像是隔着地狱的门缝传来的嘲笑，‘但你死了，谁来替阿雅看着那群肥猪下地狱？’\n我僵住了。刀锋划破了皮肉，渗出一丝血珠。\n是啊。我是一把脏了的刀。既然脏了，就不能用来切面包了。那就……用来切那些该死的烂肉吧。”"
 PAM_.25.a: "（再忍忍……等杀够了再死。）"

 #百灵好感度 20  3
 PAM_.26.t: "笼门的缝隙"
 PAM_.26.d: "“‘你就是百灵？’\n那个叫小果子的女孩找到了我。她手里捧着一个纸袋，里面装着刚烤好的小饼干。\n我本能地后退，手按在刀柄上。在这个宫殿里，我是异类，是阴影里的鬼魂，没人愿意靠近我。\n‘索拉娜姐姐让我给你的。’小果子也不怕，直接把饼干塞进我怀里，‘她说你最近瘦了，脸色像鬼一样，再不吃点甜的，就要变成真的亡灵了。’\n我捧着那袋饼干，温热的触感透过纸袋传到手心。\n‘出来走走吧。’小果子拉开窗帘，指着外面的花园，‘莉莉安娜姐姐种的花开了，晓枫姐在教大家认字。这个世界……已经不一样了。’\n我看向窗外。那里充满了吵闹声、读书声和欢笑声的人间。\n我看到索拉娜正被莉莉安娜按在椅子上梳头，一脸的不耐烦却又不敢乱动；我看到雪伊正对着一群新兵咆哮，但手里却拿着给她们补衣服的针线。\n这……就是她用那些残忍手段换来的东西吗？\n这就是……阿雅曾经梦想过的，不用再害怕被吃掉的世界吗？\n我拿起一块饼干，放进嘴里。很甜，甜得让我舌头发苦。\n原来，笼子的门早就打开了。把我关在里面的，不是索拉娜，是我自己那颗……还在流血的心。”"
 PAM_.26.a: "（外面的风……是暖的。）"

 # 百灵好感度 40  6
 PAM_.27.t: "磨刀石"
 PAM_.27.d: "“索拉娜兑现了她的诺言。她把那些曾参与‘晚宴’的贵族，一个个送到了我的刀下。\n第一个人是个伯爵。他跪在地上，鼻涕眼泪流了一脸，哭喊着说他是被逼的。我没有说话，只是机械地挥刀。血喷在我的脸上，热乎乎的。\n我以为我会感到快意。但我没有。\n我只感到一种令人窒息的空虚。杀了他，阿雅也回不来了。杀了他，我手上的血腥味反而更重了。\n我变成了一个纯粹的行刑机器。索拉娜坐在高台上，冷冷地看着我，像是在看一块磨刀石在打磨一把生锈的刀。\n‘手别抖。’她把一杯酒泼在我的脚边，‘这只是开始。你要习惯这种温度，习惯这种把人的生命像掐灭蜡烛一样掐灭的感觉。’\n我看着她。这个暴君，这个疯子。她明明在逼我做恶魔的事，可她的眼神里……为什么没有那种贵族特有的、以杀戮为乐的贪婪？\n她看尸体的眼神，就像在看一堆必须被清理的垃圾。\n‘你也觉得恶心，对吧？’我突然问她。\n她愣了一下，随即咧开嘴，露出了一个狰狞的笑：‘恶心？当然恶心。但如果我不做这扫垃圾的活儿，这屋子……永远干净不了。’\n那一刻，我握刀的手，突然稳了一些。”"
 PAM_.27.a: "（那就一起……下地狱吧。）"

 # 百灵好感度 60  8
 PAM_.28.t: "并不干净的手帕"
 PAM_.28.d: "“今天，我陪她去视察刚打下来的港口。有人在暗处放冷枪。\n那是我的失职——子弹擦着索拉娜的脸颊飞过去，留下一道血痕。我疯了一样冲进人群，把那个刺客按在地上，正准备割断他的喉咙。\n‘住手！’\n索拉娜却一脚踢开了我的手。她走过来，脸上挂着血，却笑得像个混蛋。\n‘是个孩子。’她指着那个只有十几岁的、吓得尿裤子的男孩，‘看他的眼睛。那是饿狼的眼睛，不是狗的眼睛。他想杀我，是因为他觉得我抢了他的家。’\n她蹲下身，把自己那条沾着火药味和汗臭味的领巾扯下来，胡乱地在那个男孩脸上擦了一把，把他脸上的泥污擦掉。\n‘别急着死。’她对那个想杀她的男孩说，‘留着命，看清楚我是谁。如果过两年你还觉得我是坏人，再来杀我不迟。那时候，记得瞄准点。’\n她放走了那个刺客。然后，她转过身，看到了浑身僵硬、拿着匕首不知所措的我。\n她看着我眼里的惊恐——我以为她会惩罚我，甚至处死我。\n可她只是走过来，用那条刚刚给刺客擦过脸的、脏兮兮的领巾，也在我脸上用力地擦了一下。\n‘傻鸟。’她嘟囔着，‘下次别冲那么快。你这小身板，挡不住子弹的。’\n那块布很粗糙，磨得脸生疼。上面还有那股难闻的味道。\n但我却觉得……那是这世上，最干净的东西。”"
 PAM_.28.a: "（她……为什么不杀我？）"


 # 百灵好感度 80  9
 PAM_.29.t: "刀鞘的温度"
 PAM_.29.d: "“深夜的寝宫只有月光像惨白的霜一样洒在地上。\n索拉娜坐在窗台上，那件总是披在肩上的狼皮大衣滑落在地。她刚刚结束了一场针对旧贵族反扑势力的血腥清洗，身上还带着浓重的铁锈味。她低着头，正在笨拙地试图擦拭那把象征权力的长剑，但手上的血太滑，总是擦不干净。\n‘……该死。’她低声咒骂，声音里透着一股我从未听过的、深深的疲惫，‘这血怎么这么黏……像胶水一样，粘上了就洗不掉。’\n我从阴影里走了出来。我的步子很轻，背带裙随着动作微微摆动，像是一只误入屠场的蝴蝶。\n在这个到处都是敌人的宫殿里，她把后背完全留给了我。\n我走到她面前，跪下来，接过那把剑。我从裙子的口袋里掏出那块她曾经给我擦过脸的脏领巾，一点一点，仔细地擦拭着剑锋上的血污。\n‘百灵。’她突然开口，声音很轻，‘这活儿不该你干。你的手这么小，应该去拿花，去拿糖果，而不是在这里擦这种脏东西。’\n我停下了动作，抬头看着她。她的眼睛里没有了白天的狂妄，只有一片像荒原一样辽阔的空虚，还有一丝……想要把我推开的犹豫。\n‘我的手不干净，陛下。’\n我握住她那只还在微微颤抖的手，把我的脸颊贴在她冰凉的掌心里。那是一种粗糙的、带着火药味的触感，却让我感到无比安心。\n‘从我拿起刀的那一刻起，我就再也拿不起花来了。是您给了我存在的意义。’\n‘如果杀人是罪，那就让我来背。如果血洗不掉，那就让它干在手上，变成我们的手套。’\n我把擦干净的剑重新塞回她的手里，然后握住她的手，将剑尖指向窗外那片沉睡的、属于我们的城市。\n‘您只管挥剑。不管是砍向敌人，还是砍向这个该死的世界。’\n‘而我……’我抬起头，双马尾在月光下垂落，眼神里不再有迷茫，只有一种近乎献祭般的虔诚。\n‘我是您的刀鞘。当您累了，当这把剑太锋利会伤到您自己的时候……就藏进我这里。我会替您挡住所有的寒意，我会替您收敛所有的锋芒。’\n索拉娜愣住了。她看着我，看着我这身与杀戮格格不入的背带裙装，那双总是燃烧着野心的眼睛里，第一次流露出了一种名为不舍的脆弱。\n‘……傻瓜。跟着我，你会万劫不复的。’\n‘我不怕。’我轻声回答，‘我只怕……您的身边没有我。’”"
 PAM_.29.a: "（您是火，我是灰。我们……分不开了。）"

 # 百灵好感度 100  100
 PAM_.30.t: "裙摆下的獠牙"
 PAM_.30.d: "“出征的号角已经吹响，舰队的黑帆遮蔽了整个海湾。索拉娜站在旗舰的龙骨上，正在接受万军的欢呼。她是那样耀眼，那样狂妄，像是要吞噬太阳的巨狼。\n我站在码头的阴影里，最后一次整理着我的背带裙，将匕首绑在长袜的边缘，藏进蕾丝花边之下。\n‘喂！那个躲在角落里的小鬼！’\n索拉娜突然回过头，隔着攒动的人头冲我大喊。海风吹乱了她的金发，她的声音里带着一丝焦急，甚至是恐吓。\n‘船要开了！这是去地狱的单程票！你给我留在岸上！听见没有？！’\n她的手死抓着栏杆。她在怕。她不怕前面的敌人，但她怕我跟上来。她想把我留在她打下的这个和平世界里，让我像个普通女孩一样干净地活着，而不是跟着她去尸山血海里打滚。\n我情不自禁得笑出了声。这是我第一次在阳光下露出如此轻松的笑容。\n我丝毫没有理会她的命令，但也没走向那艘光鲜亮丽的旗舰。我走向了旁边一艘不起眼的、没有任何标记的黑色快艇——那是专门为‘清道夫’准备的船。\n‘陛下，狼群不需要两只头狼。’\n我对着那个高高在上的身影，轻轻地说，声音却顺着海风清晰地传到了她的耳朵里。\n‘但狼王……不能没有影子。’\n我跳上船，海风吹起我的双马尾和裙摆，让我看起来像个准备去春游的学生，而不是一个去收割生命的死神。\n‘您想把我留在光里？可光太刺眼了，我会睡不着的。’\n‘我会飞在您看不见的死角，我会啄瞎那些想在背后放冷枪的眼睛。我会清理战场上的腐肉，我会把那些肮脏的、不光彩的、没法写进史诗里的罪恶，统统吞进我的肚子里。’\n‘您负责在史书里光芒万丈，而我……负责在注脚里为您守住黑暗。’\n我轻轻提着裙角，向她行了一个不像杀手、倒像是个淑女的屈膝礼，然后指尖滑过藏在腿侧的刀柄。\n‘别赶我走，索拉娜。没有我……谁来帮您擦剑呢？’\n索拉娜怔怔地看着我，看着我这副天真又残忍的模样，看着我那双写满了‘绝不回头’的眼睛。她的嘴唇颤抖了几下，最终，那份担忧化为了一声无奈却又纵容的长叹。\n她猛地挥手，指向前方，眼角似乎有一闪而过的晶莹：\n‘……真是个……不听话的混蛋！’\n‘那就跟上来！别掉队了！要是敢死在我看不见的地方……我就去冥界把你抓回来！’\n汽笛轰鸣，黑烟滚滚。我站在船头，迎着扑面而来的腥咸海风。我不需要黑色的斗篷来伪装，因为我这身干净的裙子，才是对这个残酷世界最大的嘲讽。在这条通往地狱的航线上，我终于……找到了属于我的归宿。”"
 PAM_.30.a: "（起航！为了……守护这头笨拙的狼！）"
 PAM.89.t: "来自黑色快艇的低频信号"
 PAM.89.d: "“……喂？头儿。……是我。\n别拿望远镜找了，我在您的旗舰影子里，那个浪花溅不到的死角。这艘小船有点颠，但我把裙子熨得很平整，双马尾也重新梳好了。您放心，我现在看起来一点也不像个死神，就像个跟着姐姐出来春游的乖学生。\n您刚才在码头上吼得真凶……但我听得出来，您是在发抖。您怕那边的世界太脏，怕血溅到我的白袜子上，对吧？\n可是头儿，您这头狼太笨了。您总是想把所有人都护在肚皮底下，那谁来护着您的后背呢？\n以后，请您只管昂着头，去迎接那些欢呼，去征服那些阳光下的土地。至于那些躲在暗礁后面的冷箭，那些想在您背后捅刀子的懦夫，还有那些不体面的、没法写进史诗里的脏活……\n统统交给我。\n我会用这双您觉得应该拿糖果的手，把他们的喉咙割开，然后把尸体绑上石头，安安静静地沉进海底。不会有人知道，也不会有人看见。\n这就是我的自由——在这个残酷的世界里，为了让您一尘不染，我愿意在淤泥里开出花来。\n……海风很大，您回舱去吧。别回头看黑暗。\n因为在黑暗里……我正爱着您。”"
 PAM.89.a: "（嘟—嘟——信号在海风中中断了）"

 PAM.90.t: "纸页的摩擦声"
 PAM.90.d: "我的手指微微颤抖，笔尖悬停在那张泛黄的羊皮纸上，迟迟不敢落下。\n按照原本的剧本，这一页本该被鲜血浸透。那个在烂泥中长大的狼王，本该与那些心怀理想的革命者在那间地牢里同归于尽，用彼此的尸骨为这个绝望的世界再添一笔灰暗的注脚。那是历史的惯性，是命运既定的轨迹。\n可是……我不甘心。\n于是，我划掉了那些死亡的判词。我在这张已经写满了悲剧的纸上，强行涂改出了一个新的转折。我让那个暴君学会了妥协，让那些烈士学会了隐忍。我用我那一厢情愿的“善意”，把水与火、把狼与人，强行缝合在了一起。\n看着那行新的文字——“镣铐被解开了”——缓缓浮现在纸面上，我却感到一阵难以言喻的心悸。\n她们……动起来了。\n晓枫在思考，雪伊在擦枪，小果子在发抖。她们的动作是那么流畅，表情是那么生动。可是，在那摇曳的火光背后，我分明看到她们的影子……淡得几乎看不见。\n就像是……墨水还没有干透的画中人，只要一阵风吹过，就会重新化为一滩毫无意义的污渍。\n我在欺骗世界，也在欺骗我自己。我把这个本该破碎的故事强行粘好，只为了看一眼那个……所有人都活下来的、不可能存在的明天。\n\n“……演下去吧。”\n\n我对着书页，轻声乞求，眼泪打湿了刚刚写好的那一行字。\n\n“求求你们……就在这个虚假的舞台上，哪怕是装……也要装作，真的很幸福啊。”"
 PAM.90.a: "（风，翻过了这一页。）"

 PAM.91.t: "我们的故事从未结束"
 PAM.91.d: "故事……好像写得太长了。\n我看着面前这幅已经连成一片的、巨大的地图。上面插满了黑色的狼旗，每一面旗帜下，都是欢呼的人群和冒着炊烟的工厂。索拉娜坐在最高的王座上，莉莉安娜握着她的手，晓枫、雪伊、小果子……她们都围在桌边，笑得那么灿烂，那么……“真实”。\n这是一个多么完美的结局啊。完美得……让我感到刺骨的寒冷。\n因为我已经摸到了。\n我的指尖，已经触碰到了这张纸的边缘——那是粗糙的、冰冷的、虚无的边缘。\n在这个边缘之外，只有无尽的空白与黑暗。我所编织的这个“狼群帝国”，这个充满了烟火气和生命力的世界，其实……只是漂浮在虚空中的、薄薄的一页纸。\n我能听到，纸张纤维正在发出不堪重负的断裂声。我为她们赋予了太多的“幸福”，太多的“奇迹”，这重量……已经快要压垮这个原本注定是悲剧的故事架构了。\n画面开始出现了细微的噪点。索拉娜的笑声里偶尔会夹杂着一丝电流的杂音；莉莉安娜的裙摆在风中偶尔会像数据一样闪烁；那些欢呼的人群，有时候看起来……就像是一群不断重复动作的背景板。\n她们不知道。\n她们不知道自己正生活在一个随时可能醒来的梦里。她们还在兴致勃勃地规划着下一个一百年的未来，还在讨论着明天的早餐吃什么。\n可我……已经写不出下一个字了。\n墨水干了。我的愿力……也快耗尽了。\n我趴在桌上，脸贴着那张温暖的、虚假的插图，看着她们每一个人的笑脸，心痛得无法呼吸。\n这真的是救赎吗？还是说……我只是把她们，从一个干脆利落的死亡里拖出来，囚禁在了一个……虽然美好、却永远无法触及真实的、名为“幸福”的琥珀之中？\n“……别停下。”\n我闭上眼睛，抓紧了那即将破碎的纸页边缘，发出了无声的呓语。\n“……哪怕这只是我一个人的臆想……也请让这个梦……再做得久一点吧。”"
 PAM.91.a: "（但书……终究是有最后一页的。）"

 PAM_zzjd:0 "§t最终决斗§!"
 PAM_zzjd_desc:0 "这是最终的决斗，亦是最后的救赎。\n不分彼此，不分贵贱,留下最终的结局。"
 PAM_mtyyynh_tt: "£GFX_trigger_no 无法宣战"
