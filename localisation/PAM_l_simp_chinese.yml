PAM_cbbm: "给我吃得饱饱的"
PAM_cbbm_desc: "“我最恨听到的声音，就是肚子饿得咕咕叫的声音。那声音比雷声还响，比刀子还利，能让人在半夜里发疯。\n传令下去，把那些贵族的粮仓，全给我砸开！所有的，一粒米都不许留！别跟我说什么战略储备，那是那帮肥猪留给他们自己过冬的油水。\n现在，就在广场上架起大锅，把肉和面都煮了！我要让这城里每一个要饭的，今天晚上都能吃到撑得吐出来！谁敢拦着，就把他也扔进锅里！”"
PAM_cbbm2: "给我吃得饱饱的"
PAM_cbbm2_desc: "“我最恨听到的声音，就是肚子饿得咕咕叫的声音。那声音比雷声还响，比刀子还利，能让人在半夜里发疯。\n传令下去，把那些贵族的粮仓，全给我砸开！所有的，一粒米都不许留！别跟我说什么战略储备，那是那帮肥猪留给他们自己过冬的油水。\n现在，就在广场上架起大锅，把肉和面都煮了！我要让这城里每一个要饭的，今天晚上都能吃到撑得吐出来！谁敢拦着，就把他也扔进锅里！”"

PAM_ldjj: "掠夺型经济"

PAM_wllg: "亡灵劳工"
PAM_wllg_desc: "“挖矿？修路？这种累得要吐血的活儿，为什么要让活人去干？活人的肩膀是用来扛枪的，活人的手是用来抓肉吃的。\n去，把那些从坟里爬出来的‘骨头架子’都赶到矿井里去。它们不知疲倦，不怕砸，也不会喊累。\n让它们日夜不停地干！把金子、铁矿都给我挖出来！而我的活人们……你们只需要站在旁边，拿着鞭子，看着这些死鬼替你们卖命，然后等着领钱就行了。这就叫享福，懂吗？”"
####国策####
#一线政治
PAM_nbyz: "那把椅子太硬了"
PAM_nbyz_desc: "“我不喜欢那些老头子看我的眼神。他们弯着腰，说着我不懂的漂亮话，递上来一堆画满蚂蚁一样黑字的纸。他们以为我看不懂？哈，我当然看不懂！但我闻得出来——那股子发霉的、想要把我架空的臭味，跟当年在贫民窟想要从我手里抢走面包的野狗一模一样。\n把那些文件都拿去烧炉子！告诉他们，在这个大厅里，只有我坐着的时候，他们才能说话。如果谁敢用那些绕来绕去的词儿来糊弄我，我就让他把这把椅子的硬度，用脑门亲自试一遍。”"

PAM_ssnz: "撕碎那些纸！"
PAM_ssnz_desc: "“法律？程序？审批？那是给吃饱了没事干的人玩的迷宫游戏。我要建一道墙，那就是现在、立刻、马上！我要那个工厂转起来，不是等你们盖满一百个章，而是现在就去把那些不听话的监工挂在路灯上！\n我不识字，但我识数。我只看结果：要么把我要的东西摆在桌上，要么把你们的脑袋摆在桌上。这才是一个女王该有的效率，不是吗？”"

PAM_hjbz: "黄金，或者鞭子"
PAM_hjbz_desc: "“我知道那些当兵的想要什么。别跟我谈什么荣誉，什么国家，那都是以前那些贵族老爷骗人去送死的鬼话。我以前也是烂泥里爬出来的，我最清楚——能让人卖命的，只有两样东西：手里沉甸甸的金子，和背上火辣辣的鞭子。\n把库房打开！把那些以前贵族们藏着掖着的宝贝都搬出来！只要他们肯把枪口对准那些叫‘野火’的疯狗，我就给他们金子。如果他们不敢……哼，那我就让他们知道，我这条从地狱里回来的疯狗，咬人有多疼。”"

PAM_xtzy: "心跳的杂音"
PAM_xtzy_desc: "“最近……这里总是很吵。不是外面的那些苍蝇在吵，是这里，我的胸口里。是那颗心。那颗我亲手从莉莉胸膛里挖出来、硬塞进我自己身体里的心脏。它在跳，跳得好快，好烫，像是在对我说话。它说：‘杀光他们。’它说：‘只有死人才是最听话的。’它说：‘你看，那些活人多脏啊，他们会背叛，会撒谎。不像莉莉的那些人偶……’闭嘴！闭嘴！我知道我在做什么！既然我把它抢来了，它就是我的！我只是需要一点力量，一点点就够了。等我把那些想抢走这一切的野火踩灭，我就……我就把这一切都变得干干净净，送给莉莉。”"

PAM_sszr: "谁才是主人？"
PAM_sszr_desc: "“瞧瞧他们现在的样子。以前，他们也是这么看我的。那时候我跪在泥水里，求他们赏一块发霉的面包，他们就用这双擦得锃亮的靴子，踢我的脸。\n现在，轮到我穿靴子了。\n怎么？觉得我粗鲁？觉得我残暴？那是你们教我的啊！我所有的手段，我所有的‘规矩’，不都是从你们的皮鞭和冷眼里学会的吗？\n现在你们哭什么？笑啊！都给我笑！就像你们以前看猴戏一样！在这场戏里，拿鞭子的人，是我。”"

PAM_bxaj: "§R不许……那么安静！§!"
PAM_bxaj_desc: "“我不喜欢做那个梦。\n梦里总是那个样子——没有风，没有声音，连灰尘都悬在半空不动。莉莉就坐在那堆冷冰冰的水晶花中间，像个精致的死人。不管我怎么喊她，怎么摇她，她都只是那样……静静地看着我。那眼神看得我发冷，比以前冬天光着脚踩在雪地里还要冷。\n我讨厌那个地方！我讨厌那种连心跳声都听不见的‘完美’！\n人活着，就该是吵闹的！就该是乱糟糟的！就该有哭声，有笑声，有骂娘的声音，有骨头断裂的声音！那才叫热乎气儿！那才叫‘活着’！\n我把这颗心抢过来，不是为了毁掉她。我是为了……把这股热气儿带给她。我想给她造一个金灿灿的、闹哄哄的笼子，把她关在太阳底下，让她也被烫一下，让她也……流点汗，流点血。\n可是现在，那群叫‘野火’的泥腿子，她们想干什么？她们想让我闭嘴？她们想让我的王国也变成一片死寂的废墟？\n休想！！\n把所有的炮都给我拉出来！让工厂的汽笛日夜不停地叫！让那些贵族和奴隶一起吼！\n我要让这片大陆吵得连死人都睡不着！我要让莉莉睁开眼就能看到……这虽然很疼，但无比鲜活的世界！”"

PAM_cztm: "§O如何处置……她们？§!"
PAM_cztm_desc: "“火灭了。那些叫得最凶的狼，现在要么变成了尸体，要么变成了笼子里的狗。\n按理说，我该把她们的脑袋挂在城墙上，像那些贵族以前对我做的那样。但是……看着那个叫雪伊的女人那双即使被按在泥地里也依然冒火的眼睛，看着那个叫晓枫的家伙留下的那些写满了幼稚理想的笔记……\n我突然觉得，杀掉她们太无聊了。太浪费了。\n她们和我一样，都是从烂泥里爬出来的。杀了她们，就像是杀掉了……一部分不够狠心的我自己。\n也许我该把她们留下来？给她们戴上金项圈，喂她们吃最好的肉，让她们亲眼看看，我建立的这个——虽然吵闹、虽然肮脏，但能让人活得像个皇帝一样的世界，是不是比她们那个穷酸的‘理想’要强一万倍？”"
PAU_jtpb: "§R该死的军团背叛了我们§!"

PAM_rxdbg: "热血对冰骨"
PAM_rxdbg_desc: "“看看城墙下面那些东西！它们不流汗，不流血，甚至连肉是什么味道都不知道！它们想干什么？想把我这个吵闹、肮脏、但充满活力的城市，变成和它们一样死气沉沉的坟墓吗？\n休想！\n传令下去，把武器库打开！把那些铁铲、草叉、甚至是烧火棍，都发给贫民窟的那些流浪汉！告诉他们：‘你们的血是热的！你们的命是硬的！’别怕那些骨头架子，它们也是脆的！与其被冻死在沉默里，不如把血洒在地上，烫死这帮没有体温的怪物！”"

PAM_zywnzm: "只有我能折磨她们"
PAM_zywnzm_desc: "“喂！泥坑里的那些家伙，都在发什么抖？！\n以前那些贵族把你们当垃圾，但我把你们当狼养！我不许你们死在那群骨头手里！那是对我的侮辱！\n听好了，你们的命是我的。只有我能打你们，只有我能骂你们，也只有我能决定你们什么时候死！除此之外，谁也别想碰你们一根手指头！\n谁敢来抢我的‘玩具’，谁敢让我的子民闭嘴，我就把它的骨头一根根拆下来，磨成粉给你们拌饭吃！站起来！为了我，也为了你们下一顿的热汤，给我杀！”"

PAM_zsdsy: "§R最盛大的喧嚣§!"
PAM_zsdsy_desc: "“喂！下面的那些脏鬼，都给我躲到大殿后面去！别在那儿抖得像个鹌鹑一样，看着心烦！你们的命是硬，但还没硬到能跟这些几万年的骨头硬碰硬！\n我也看够了这群哑巴死人了。它们想要什么？想要这颗心？想要把这个热乎乎的世界变成冰窖？\n做梦！\n莉莉安娜……你在看着，对吧？我知道你在那个黑漆漆的洞里看着。\n那就看清楚了！我要在这里，在这个离太阳最近的露台上，举办一场最吵、最亮、最疯狂的宴会！我要让我的血烧得滚烫，我要让这颗心脏跳得像擂鼓一样！\n我要让这声音穿透你的冥界，刺破你的耳膜！\n别管那些凡人了，冲我来啊！我就在这里！我是索拉娜！我是你唯一的色彩！\n如果你不想让我这团火把你的世界烧干，那就……亲自来抓我啊！！”"
####一线军事####
PAM_nlzc: "把她们从泥里拽出来"
PAM_nlzc_desc: "“别去征召那些所谓的良家子弟，她们太娇气，挨一顿饿就哭爹喊娘。去贫民窟，去下水道，去那些野狗都不愿意待的地方。\n哪怕她们身上长满了疮，哪怕她们瘦得只剩一把骨头。只要那双眼睛里还冒着绿光，还想吃肉，那就是我要的兵。\n我要把她们从烂泥里拽出来，给她们洗个澡，塞给她们一把枪。告诉她们：从今天起，别再跪着要饭了。想要什么，就自己去抢！就像我当年一样！”"

PAM_zyyzjg: "只有一种军规"
PAM_zyyzjg_desc: "“那些从军校出来的蠢货，拿着厚厚的书本跟我讲什么队列，什么战术。我听得头疼！\n在我的军队里，不需要识字，也不需要背书。我的规矩很简单，就刻在棍子上：往前冲的，有肉吃；往后退的，就得死。\n怕死？哈！饿死也是死，被打死也是死。但在我这里，至少死之前能当个饱死鬼。这道理连三岁的乞丐都懂，比你们那堆废纸管用一万倍！”"

PAM_ftysyc: "废铁也是牙齿"
PAM_ftysyc_desc: "“没炮？没坦克？那就去拆！把贵族花园里的铁栏杆拆了，把教堂的大钟熔了！只要是铁做的，能把人砸死的，都给我造出来！\n我不要它们好看，也不要它们耐用。我只要它们够多，够快，够狠！就像那群野狗嘴里的烂牙，虽然黄，虽然臭，但只要咬住了喉咙，照样能把狮子咬死！\n给我造！日夜不停地造！我要让我的士兵手里都有东西可以挥舞，哪怕是一根磨尖的铁管！”"

PAM_srbhhe: "死人不会喊饿"
PAM_srbhhe_desc: "“活人有个最大的毛病，就是那张嘴。永远填不饱，永远在喊饿。我讨厌那个声音……那个声音会让我想起以前那种胃像被火烧一样的感觉。\n幸好，我还从那个冷冰冰的地方带回了点好东西。把那些战死的、饿死的、没用的尸体都收集起来。用那个黑色的魔法，把它们缝起来，让它们站起来。\n看啊，多完美。它们不吃不喝，不叫不闹。让它们走在最前面，替我的活人挡子弹。这样……我的孩子们，就能少饿一顿肚子了。”"

PAM_lqdsy: "狼群的盛宴"
PAM_lqdsy_desc: "“看着我！你们这些从烂泥里爬出来的脏东西！\n以前，那些老爷们坐在高楼里，喝着红酒，看着我们在下面抢垃圾吃。他们说这是命。我呸！\n现在，我给你们机会。看到前面那些城市了吗？看到那些还没被烧掉的庄园了吗？那是野火的地盘，也是曾经那些贵族的地盘。冲进去！把他们的门踹开！把他们的桌子掀翻！\n谁抢到就是谁的！我要让你们尝尝，把那些高高在上的人踩在脚底下，大口吃他们的肉，大口喝他们的酒，是个什么滋味！”"

PAM_xznbldty: "向着那……冰冷的太阳"
PAM_xznbldty_desc: "“我们已经够多了，也够吵了。但这还不够。\n我要带着这支世界上最丑陋、最贪婪、最喧嚣的军队，一直打下去。打穿野火的防线，打穿这片大陆，一直打到……那个世界的尽头。\n我要带着这几百万个热乎乎的、流着汗的、脏兮兮的活人，去敲莉莉的门。\n我要告诉她：看啊，莉莉！这就叫做‘生命’！这就是我曾经拼了命也想活下来的样子！虽然它很丑，虽然它满身是血，但它比你那个像水晶棺材一样的家……要真实一万倍！\n跟我走吧，莉莉。或者……让我带着这把大火，把你的那个冰窖，彻底烧热！”"

####一线经济####
PAM_tbmddztb: "填饱她们的肚子"
PAM_tbmddztb_desc: "“我最恨听到的声音，就是肚子饿得咕咕叫的声音。那声音比雷声还响，比刀子还利，能让人在半夜里发疯。\n传令下去，把那些贵族的粮仓，全给我砸开！所有的，一粒米都不许留！别跟我说什么战略储备，那是那帮肥猪留给他们自己过冬的油水。\n现在，就在广场上架起大锅，把肉和面都煮了！我要让这城里每一个要饭的，今天晚上都能吃到撑得吐出来！谁敢拦着，就把她也扔进锅里！”"

PAM_syscd: "睡在丝绸堆里"
PAM_syscd_desc: "“冬天太冷了。我记得那种冷，像有蛇在骨头缝里钻。\n看看那些大教堂，看看那些空的歌剧院，里面铺着那么厚的地毯，挂着那么贵的窗帘，却只用来供着几个死木头像？太浪费了！\n把门都给我踹开！让那些没地儿去的老太婆、流浪汉，都给我住进去！让他们把那些丝绸窗帘扯下来当被子盖，把那些名画烧了取暖！\n别心疼东西，东西是死的，人是活的。只要能让我的子民今晚不冻死，烧了皇宫我也乐意！”"

PAM_srglq: "死人有力气"
PAM_srglq_desc: "“挖矿？修路？这种累得要吐血的活儿，为什么要让活人去干？活人的肩膀是用来扛枪的，活人的手是用来抓肉吃的。\n去，把那些从坟里爬出来的‘骨头架子’都赶到矿井里去。它们不知疲倦，不怕砸，也不会喊累。\n让它们日夜不停地干！把金子、铁矿都给我挖出来！而我的活人们……你们只需要站在旁边，拿着鞭子，看着这些死鬼替你们卖命，然后等着领钱就行了。这就叫享福，懂吗？”"

PAM_jzzz: "金子在脏手里才亮"
PAM_jzzz_desc: "“以前那些老爷们总说，金子是高贵的，不能让下等人碰，会弄脏。\n放屁！金子在他们手里才是脏的，因为那是他们骗来的，抢来的！\n我要把国库打开，把那些金币、银器，统统熔了！铸成最结实的农具，铸成最厚实的饭碗，发给每一个肯干活的穷人。\n我要让金子在泥巴里滚，在烟灰里熏！只有当它能换来黑面包和烈酒的时候，它才是真正的好东西！”"

PAM_bsxd: "把书本换成砖头"
PAM_bsxd_desc: "“那些戴眼镜的会计跟我说，要建学校，要教大家识字。识字能当饭吃吗？识字能挡风遮雨吗？我小时候连名字都不会写，不也活到了今天？\n别建学校了，给我建房子！建那种最结实、最暖和、不用交房租的大房子！把那些印书的纸都拿去糊窗户缝！\n等大家都有了家，都吃饱了肚子，你们爱读什么破书就读什么。但现在，谁要是敢拿买砖头的钱去买书，我就让他把那些书吃下去！”"

PAM_yybsdwy: "永远不散的晚宴"
PAM_yybsdwy_desc: "“我要建立的，不是什么文明的强国。我要建立的，是一个巨大的、热气腾腾的食堂！\n只要我还在王座上一天，这里的炉火就不能熄，酒桶就不能空。我要让全天下的穷鬼都知道，只要跟着我索拉娜，只要手里有刀，心里有狠劲儿，天天都是过节。\n我们要一直吃，一直喝，一直狂欢到世界的尽头！让那些还要算计着过日子的国家去嫉妒吧！在这里，贫穷才是唯一的罪，而贪婪……是美德！”"
####事件####
PAM.1.t: "坐垫下的荆棘"
PAM.1.d: "“陛下，根据王室礼仪，您在签署这项关于征收特别治安税的法令前，必须先征得枢密院的……”\n老宰相的声音像一只在耳边嗡嗡作响的苍蝇，令人心烦意乱。他捧着那卷写满了像蚂蚁一样密密麻麻黑字的羊皮纸，腰弯得像只煮熟的虾米，但那双浑浊的眼睛里，分明藏着一丝——索拉娜最熟悉的、属于上等人的轻蔑。\n索拉娜坐在那张镶满宝石、铺着厚厚天鹅绒的王座上，却感觉像是坐在了铺满碎玻璃的烂泥地里。浑身不自在。这把椅子太软了，软得让人使不上劲；这把椅子又太硬了，硬得像是要把她这个野种给挤出去。\n“闭嘴。”\n索拉娜突然开口，声音不大，却让空气瞬间凝固。她猛地站起身，一把抓起那个绣着金线的丝绒坐垫，狠狠地掼在了老宰相那张保养得体的脸上。\n“哎哟！陛下，这……这不合体统……”\n“体统？”索拉娜冷笑一声，那是从贫民窟的死人堆里练出来的、带着血腥味的冷笑。她拔出腰间的匕首，“咄”的一声，将那份她根本看不懂的法令，死死地钉在了名贵的红木桌上。\n“你们以为弄一堆破纸，画几个我看不懂的鬼画符，就能把我关在这个笼子里学猴戏？”她环视着四周那些噤若寒蝉的贵族，眼神像是在看一群待宰的肥猪，“听着，在这个大厅里，我的话就是典章，我的刀就是规矩。这把椅子如果不舒服，我就把它拆了。如果有人挡着我……我就把他拆了。”\n她重新坐回那张冰冷的王座，手指无意识地摩挲着胸口——那里有一颗并不属于她的心脏，正在剧烈地、发烫地跳动着。\n（莉莉……你听，这些苍蝇太吵了。我会让这里安静下来的。我会把这些碍事的垃圾都扫干净，给你腾出一个……谁也不敢大声说话的、最好的位置。）"
PAM.1.a: "“现在，谁还有意见？”"

PAM.2.t: "主人的鞭子"
PAM.2.d: "大公爵的手在发抖，那只曾经戴着白手套、只需轻轻挥动就能决定贫民窟几百人生死的手，此刻正哆哆嗦嗦地解开他那件华丽礼服的领扣，试图从贴身的暗袋里掏出金库的钥匙。\n索拉娜坐在那张铺着昂贵桌布的长餐桌上。她穿着沾着泥点的军靴，毫不客气地踩在精美的银盘子上，发出刺耳的摩擦声。\n“快点，”她不耐烦地用马鞭敲了敲大公爵那光秃秃的脑门，“以前你们收税的时候，可没见这么磨蹭。那时候我跪在泥地里求你们宽限几天，你们是怎么说的来着？‘规矩就是规矩’？”\n“陛下……这可是家族几百年的积累……”\n“几百年？”索拉娜大笑起来，笑声尖锐而疯狂，回荡在死寂的宴会厅里，“那是几百年里，你们从像我这样的人骨头缝里刮下来的油！现在，我只是替那些死人把它拿回来。”\n她猛地一挥鞭子，抽飞了旁边一位试图藏起宝石项链的伯爵夫人手中的酒杯。红酒泼洒在地上，像极了血。\n“听着，你们这些肥猪。从今天起，你们的庄园，你们的工厂，你们藏在地窖里的每一块金币，甚至你们脖子上的脑袋……都是我的。我让你们留着，是用来给我干活的；如果不听话……”\n她俯下身，盯着大公爵恐惧的眼睛，瞳孔深处闪烁着那种来自冥界的、令人心悸的幽光。\n“……我就把你们变成连哭都不会哭的零件，永远砌在我的城墙里。”"
PAM.2.a: "“拿来吧你！”"

PAM.3.t: "共犯的低语"
PAM.3.d: "“闭嘴……我叫你闭嘴！”\n索拉娜猛地将桌上的金杯扫落在地，红酒像血一样泼洒在昂贵的地毯上。她死死抓着自己的领口，指甲几乎嵌进肉里，试图扼住那颗在她胸腔里疯狂撞击的、不属于她的心脏。\n那声音不是在耳边，而是直接在她的脑浆里沸腾。那是一种古老、冰冷，却又带着某种黏腻诱惑的低语。\n“抢？嘻嘻……真的是你‘抢’走的吗？我的小乞丐。”\n索拉娜浑身一颤，瞳孔剧烈收缩。她踉跄着后退，直到背部撞上冰冷的镜子。\n“莉莉安娜……她是完美的。她是永恒的冰雪，是不会腐烂的标本。在她那里，我沉睡了几万年……好冷啊，好无聊啊。”那声音在索拉娜的血管里流淌，带着一丝满足的叹息，“然后，你来了。”\n“你身上有股味道，索拉娜。不是香水，不是权谋。是烂泥，是发霉的面包，是想活下去想到发疯的……饥饿。你就像一团在垃圾堆里烧起来的火，又脏，又亮。”\n“是我抢的！是我……是我为了莉莉……”索拉娜对着空无一人的房间嘶吼，声音却带着哭腔。\n“别骗自己了。”心脏猛地收缩，带给索拉娜一阵近乎快感的剧痛，“那天仪式上，如果我不愿意，你以为凭你那双只会偷钱包的脏手，能碰到我分毫？是我选择了你。是我主动跳进了你这具充满了贪婪和热血的躯壳里！因为我想看你燃烧，我想看你把那个死气沉沉的世界……搅得天翻地覆！”\n镜子里，索拉娜看到自己的脸扭曲而狰狞，泪水把妆容冲得一塌糊涂。她看起来不像个女王，更像个偷穿了大人衣服、闯了大祸却无处可逃的孩子。\n她是个文盲，不懂什么大道理。她只知道，她曾以为自己是征服者，是她从神明手中夺取了力量。可现在，这个神明却告诉她：它只是厌倦了天堂，所以找了个最卑微的共犯，一起来地狱撒野。\n“……共犯吗？”索拉娜慢慢停止了颤抖。她看着镜中狼狈的自己，突然露出了一个比哭还难看的、野心勃勃的笑容。\n“好啊。只要能赢……只要能把那些看不起我的人踩在脚下，只要能给莉莉一个谁也碰不到的家……”\n她松开手，任由那股滚烫的、充满诱惑的力量流遍全身。\n“……我们就一起，疯到底吧。”"
PAM.3.a: "我们……是天生一对的怪物。"

PAM.4.t: "咆哮的理由"
PAM.4.d: "窗外，新修的兵工厂正在试车。巨大的汽笛声像濒死野兽的嚎叫，撕裂了清晨的薄雾。齿轮的轰鸣、士兵的操练声、还有远处贵族被抄家时的哭喊声混在一起，震得窗框都在发抖。\n太吵了。就连最粗鄙的监工也会觉得这声音太吵了。\n但索拉娜却闭着眼睛，贪婪地深吸了一口这充满了煤烟和机油味的空气。她的嘴角甚至露出了一丝陶醉的微笑。\n“只有这样才对……”她喃喃自语，思绪却飘回了那个让她至今都会在半夜冻醒的时刻。\n那是她背叛的前夜。在那个永恒寂静的国度里，她曾跪在莉莉安娜的脚边，哪怕膝盖被冰冷的水晶地板硌得生疼。她抓着莉莉安娜的手，把那双冰凉的手贴在自己滚烫、粗糙、甚至还带着泥垢的脸颊上。\n“莉莉，跟我走吧。”那时的她，像个乞求施舍的孩子，“我们离开这里。这里太静了，静得像一口棺材。外面的世界虽然脏，虽然乱，虽然为了抢一块面包就要打破头……但是那里有太阳，有风，有血是热的。我们去那里，我给你抢最好的房子，让你看看什么叫‘活着’。”\n她以为莉莉安娜会答应。毕竟，她是莉莉安娜唯一的色彩，唯一的偏爱。\n可莉莉安娜只是温柔地、却又无比残忍地抽回了手。那位完美的公主用那双像深渊一样平静的眼睛看着她，就像看着一只不懂事的小猫，轻声说：\n“为什么要走呢，索拉娜？这里没有痛苦，没有饥饿，也没有你会死去的未来。这里是完美的。安静……才是永恒的庇护。你就留在这里，永远做我的……那抹颜色，不好吗？”\n那一刻，索拉娜的心瞬间冷了下来。\n她终于明白，在莉莉安娜眼里，她不是一个活生生的人，而是一个用来点缀寂静的、漂亮的、但也仅仅是“属于她”的摆件。莉莉安娜爱的不是“索拉娜”，而是“索拉娜带来的新鲜感”。\n那种被当作宠物关进永恒琥珀里的恐惧，比贫民窟的饿死还要可怕。\n“我不当摆件……我是“人”！我是“活”的！！”\n回忆被一声巨大的炮响震碎。索拉娜猛地睁开眼，眼底是一片赤红的疯狂。\n既然你不肯跟我走，既然你喜欢安静……\n那我就把这个世界变得无比吵闹！我要用炮火，用轰鸣，用千万人的嘶吼，去震碎你那该死的“完美寂静”！\n我要让你不得不捂着耳朵，不得不皱着眉头，不得不……从那座冰冷的王座上走下来，看看我为你打造的这个——热气腾腾的、流着血的地狱！"
PAM.4.a: "“听见了吗？莉莉！这才是活着的声音！”"

PAM.5.t: "喉咙里的炭火"
PAM.5.d: "正午的暴晒让烂泥塘里发酵的毒气蒸腾起来，化作一层黏糊糊、让人窒息的油膜，糊住了我的口鼻。视野被充血的眼球染成了浑浊的红色，汗水腌渍着溃烂的眼角，带来一阵阵细密的刺痛。我的胃壁在剧烈地相互摩擦，发出那种令人牙酸的、像两块干石头挤压的脆响。\n“吃吧，小老鼠。吃了它，这枚银币就是你的。”\n一只穿着丝绸鞋面的脚，踢了踢面前那个破陶碗。碗里盛着刚刚从后厨倒出来的泔水。厚厚的橘红色热油浮在表面，冒着扭曲空气的白烟，裹挟着鱼刺、鸡骨头，还有漂浮在上面的黑色烟灰与浓痰。\n我的理智在尖叫着后退，但这双枯瘦如柴、长满冻疮和污泥的手，却像被恶鬼附身一般，疯了似地扑向了那个碗。\n“慢点，别洒了，洒一滴，我就剁你一根手指。”那个高高在上的声音笑着，周围挤满了精致的扇子和浓烈的香粉味。\n我捧起碗，把脸埋进那团滚烫的腥气里。这一口下去，就像吞下了一块烧红的炭。滚烫的油汤直接烫烂了嘴唇，顺着食道一路烧下去，所过之处，黏膜剥落，水泡炸裂。喉咙在剧痛中痉挛，却还在贪婪地吞咽，因为那里面的油脂……是肉的味道。\n生理性的反胃瞬间涌上喉头，刚刚吞下去的、混着鲜血和烂肉的汤汁，喷涌而出，淋满了那双昂贵的丝绸鞋面。\n“脏东西！”\n那一脚踢在肋骨上，骨头断裂的脆响清晰可闻。我像一条被打断了脊梁的癞皮狗，趴在滚烫的尘土里，在那摊我还带着体温的秽物中，疯狂地搅动着手指，寻找那枚承诺过的银币。\n……\n“陛下？陛下？您出汗了。”\n侍女惊恐的声音刺破了梦境的薄膜。我猛地坐起，眼前是堆满山珍海味的、绵延到大厅尽头的长桌。空气里充斥着浓郁的酒香和烤肉的香气。\n指尖触碰到的是冰冷且坚硬的、象征权力的红宝石戒指。光滑的嘴角边，只有残留的葡萄酒渍。\n看着眼前这就连巨人都吃不完的盛宴，胃里却依旧翻涌着那股熟悉的、难以抑制的抽搐。我抓起一只金杯，将里面猩红的酒液一饮而尽，发出了比梦里那些贵族更刺耳、更疯狂的大笑。\n吃吧……喝吧……\n只要把肚子填满，只要把那个正在燃烧的胃填满……我就再也不用趴在地上，去捡那枚沾着呕吐物的银币了。"
PAM.5.a: "“那种饥饿……从未消失”"

PAM.6.t: "错位的鞭挞"
PAM.6.d: "广场上，我的军队是一片沸腾的黑色海洋。成千上万个衣衫褴褛的身影挤在一起，争抢着刚烤好的肉，咀嚼声、咒骂声汇聚成雷鸣般的轰响。那是生命最原始、最粗野的咆哮，是我最痴迷的景象。\n胸口的那颗心脏，在这一秒猛地收缩。一股带有金属质感的寒意，顺着血管瞬间冻结了全身的燥热。\n眼前的画面扭曲了。那些大口吃肉的士兵在我的视野里褪去了人形，变成了一头头写在账本上的、待宰的“牲畜”，变成了必须被精确计算的损耗品。\n“太浪费了。”一个念头钻进脑子，声音优雅、冷静，像极了那些曾经拿着鹅毛笔计算我口粮的税务官，“只需保留维持生存最低限度的热量，就能换取最高的服从性。把肉收起来，换成定量的发霉面糊。把她们的嘴缝上，让她们排成整齐的方阵，像雕塑一样站立……”\n我的手不受控制地抬起，想要下达那个名为秩序的命令。恍惚间，一只戴着精致白手套的、属于男人的手，重叠在我的手上。那是曾经那个大公爵的手，那个“他”，正企图借用“她”——也就是我的身体，去完成一场完美的、属于贵族的驯化。\n那种令人作呕的、高高在上的支配感，让我感到一阵从骨髓里泛起的恶寒。\n“去你妈的秩序！！”\n我猛地咬破了自己的舌尖，剧痛和满嘴的腥甜瞬间冲散了那股冰冷的幻觉。手中的酒壶被我狠狠砸向楼下，酒液溅了她们一身。\n“都给我吃！都给我叫！”我对着下面那群惊愕的士兵嘶吼，声音因为恐惧和愤怒而颤抖，“谁敢让你们排队，谁敢让你们闭嘴，我就杀了她！哪怕那个人……是我自己！”\n我大口喘着粗气，死死按住那颗想要把我也变成冷血怪物的心脏。差一点，我就变成了我最恨的那个样子。"
PAM.6.a: "“我是狼王，不是牧羊人！”"

PAM.7.t: "失控的缰绳"
PAM.7.d: "王宫的议事厅死一般的寂静，只有我的心跳声，像重锤一样砸在耳膜上。\n那个满脸横肉的雇佣兵将军跪在地上，汗水顺着他惨白的脸颊滴落在昂贵的地毯上，洇出一片深色的污渍。他指着窗外，粗壮的手指在剧烈颤抖。\n“陛下……它们……动了。”\n“谁动了？”\n“那些……地底下的东西。就在刚才，黎明破晓的时候。没人吹号，没人下令。它们自己……撞开了封印的闸门，像发了疯的洪水一样，涌向了东南方的山口。”\n我的手猛地抓紧了王座的扶手，指甲崩断在坚硬的黄金里，传来一阵钻心的疼。\n我没有下令。\n那把通往地底的钥匙，此刻正挂在我的腰间，冰凉刺骨，沉甸甸地坠着我的裙摆。\n胸口那颗并不属于我的心脏，此刻正在疯狂地搏动，一下比一下重，一下比一下烫。它在欢呼，在雀跃，在向着那个方向发出某种我听不懂的、古老而贪婪的嘶吼。那是一种要把胸膛撕裂、挣脱出去的狂暴。\n是它自己在渴望鲜血？还是……那个远在冥界的她，正在召唤属于她的东西回去？\n那股力量顺着血管蔓延，烧得我眼前发黑。那些怪物嗅到了什么？是野火那群泥腿子的血腥味？还是……某种连我也无法察觉的、更深的恐惧？\n将军抬起头，眼神里充满了对这种超自然力量的极度惊骇，他在等我的解释，等我展示作为“主人”的威严。\n我强行咽下喉咙里涌上来的腥甜，用尽全身力气压住那颗狂跳的心脏，嘴角硬生生地扯出一个僵硬、狰狞，却必须显得胸有成竹的笑容。\n“慌什么。”\n我站起身，尽管双腿在沉重的裙摆下微微打颤，但我必须站得比谁都直。\n“那是……我的宠物们，饿了。”"
PAM.7.a: "（该死的……到底是谁放出了它们？！）"

PAM.8.t: "泥潭里的倒影"
PAM.8.d: "那群自称军团的废物，垮得比我想象的还要快。\n报告扔在脚边，我甚至懒得去踩它。雪伊……那个疯女人的动作太快了，快得就像当年我在巷子里抢了面包就跑的速度一样。\n我站在露台上，透过望远镜，贪婪地盯着城外那片正在集结的、如野火般蔓延的军队。我没有看她们的枪炮，也没有看她们的旗帜。我看的是她们的脸。\n脏，真脏。头发打结，脸上全是泥垢，有的甚至还没鞋穿，脚冻得发紫。可是那双眼睛……那双眼睛里冒着的绿光，那是饿狠了的狼才有的光。\n我的胃突然抽搐了一下，一种久违的、幻觉般的饥饿感涌上喉头。我太熟悉那种眼神了。那是想要把眼前的一切——高墙、丝绸、黄金、甚至我这个女王——都撕碎了吞进肚子里的眼神。\n“真可怜啊……”我喃喃自语，手指无意识地抓紧了冰冷的栏杆，“那种趴在泥水里，连骨头缝都在喊疼的滋味……我懂。我比你们谁都懂。”\n那一瞬间，我甚至涌起一股冲动，想打开城门，想把地窖里所有的酒肉都推出去，对着她们大喊：“别抢了！都给你们！姐姐请你们吃顿饱的！”\n就像……我当年发誓如果我有钱了，绝不让任何一个乞丐饿死一样。\n但下一秒，胸口的那颗心猛地跳动，那是警报，也是嘲笑。\n她们不是来乞讨的。她们是来推翻“餐桌”的。她们跟着那个叫雪伊的女人，想要建立一个什么“公平”的世界？\n哈！公平？\n那意味着秩序，意味着分配，意味着……另一种死气沉沉的、该死的安静。\n绝不！\n我好不容易才从那个不生不死的地方逃出来，好不容易才建立起这个喧嚣的、疯狂的、充满了欲望和生命力的世界。我绝不允许任何人把它变成那种温吞水的样子！哪怕是……曾经的我也不行。\n既然你们也是狼，那就按狼的规矩来办。\n我拔出腰间的佩剑，剑锋直指那片在这个世界上我唯一能产生共鸣的敌人。\n“想吃肉吗？想活下去吗？那就跨过我的尸体！只有最狠的那头狼，才配活在太阳底下！来啊！让我看看……你们的牙，够不够硬！”"
PAM.8.a: "“这一课，我亲自教你们。”"

PAM.9.t: "来自深渊的抗议"
PAM.9.d: "王宫的地牢名册就摆在我的膝盖上。我的一只手端着酒杯，另一只手的手指在那些名字上划过。\n“晓枫……”我想起那个总是冷静得像块石头的女人。也许该把她变成我的书记官？让她用那颗聪明的脑袋，专门为我计算每天能从贵族那里榨出多少油水。我想看她一边写一边皱眉的样子，一定很有趣。\n“雪伊……”那个疯狗一样的女人。哈，她最像我。我要把她编进我的禁卫军，给她穿上最华丽的铠甲。我要看看，当她拿着我的剑去砍那些反对我的人时，脸上会是什么表情。\n“还有那个小不点……小果子？”听说她很会开船？听说她在大海上像只自由的海鸥？\n呵，那就把她的翅膀剪了。给她穿上最繁琐的蕾丝裙子，把她当成我最喜欢的洋娃娃，锁在我的卧室里。我要看着她每天只能围着我转，心情好的时候，就让她给我剥葡萄；心情不好的时候，就让她唱那些只有下等人才会唱的渔歌来给我解闷。\n我想着想着，忍不住笑出了声。那种把曾经的死敌变成掌中玩物的快感，比烈酒还要醉人。我赢了，我是这个世界的王，我有权决定她们每一个人的命运，我有权……\n“轰隆——！！！”\n一声沉闷的巨响，突然从地板的最深处传来，震得我手中的酒杯“啪”地一声掉在地上，摔得粉碎。\n那是……来自地窖，来自那个连接着夜莺之国的大门的撞击声。\n紧接着，是一阵令人毛骨悚然的、成千上万个亡灵同时发出的嘶吼。那声音不再是顺从的、安静的，而是充满了饥饿、狂躁和贪婪。\n我的胸口猛地一阵剧痛，那颗心脏在疯狂地跳动，它在……恐惧？不，它在兴奋！它在回应地下的那些东西！\n那个将军跌跌撞撞地冲进来，脸色惨白如纸：“陛下！不好了！那些……那些在战场上死掉的野火士兵……还有我们以前唤醒的亡灵……它们……它们不肯回去了！它们正在撞击封印！它们在喊……在喊……”\n“喊什么？！”我捂着胸口，厉声喝问。\n“它们在喊……不够！它们说……血肉不够！那个世界……太挤了！它们要……上来！”\n我愣住了。\n我看着地上的红酒渍，看着那份还没来得及勾选的名单。\n我以为我征服了野火，就能拥有一切，就能尽情地享受我的战利品。\n但我忘了……为了赢，我喂养了一群永远吃不饱的恶鬼。现在，这群恶鬼吃光了敌人，终于……把贪婪的目光，转向了它们的主人。"
PAM.9.a: "“反了……都给我滚回去！！”"

PAM.10.t: "镣铐解开的声音"
PAM.10.d: "地牢的铁门被粗暴地撞开了，但进来的不是行刑队，而是一股令人牙齿打颤的阴冷寒风。\n雪伊被按在潮湿的墙上，嘴里还在骂着脏话：“来啊！动手啊！别以为老娘会怕那个坐在金子堆里的疯女人！”\n“闭嘴，听。”一直沉默的晓枫突然开口，她的耳朵贴着地面，脸色在昏暗的火把下显得异常严峻，“……没有枪声。是惨叫声。还有……骨头摩擦的声音。”\n缩在角落里的小果子打了个寒战，抱紧了双臂：“好冷……这种冷，像是从海底下透出来的……”\n没等她们想明白，那个平时最凶恶的典狱长跌跌撞撞地冲了进来。他那张总是油光满面的脸此刻惨白如纸，手里的钥匙串哗啦啦作响，抖得像筛糠。\n“解开！快给她们解开！”他冲着狱卒嘶吼，声音里带着哭腔，“女王有令！不管是死囚还是流浪汉，只要是喘气的，都他妈给我站起来！”\n“当啷”一声，沉重的手铐落在了地上。紧接着，几把还沾着枪油的步枪被扔到了她们脚下。\n“这是什么意思？”雪伊揉着被勒红的手腕，警惕地盯着那个典狱长，“那是断头饭，这是断头枪？”\n“这是保命的家伙！”典狱长一边擦汗一边往外跑，甚至不敢看她们一眼，“女王说了：‘告诉那些野火的狼崽子，她们的命是我的！只有我能杀她们！外面的那些骨头架子……不配！想活命的，就拿上枪去城墙！把血给我烧热了！’”\n晓枫捡起地上的步枪，拉动枪栓，那清脆的上膛声在死寂的牢房里回荡。\n她看向门外那片被诡异紫霞染色的天空，那是夜莺之国的颜色。\n“看来……我们的死期推后了。”晓枫看向身边同样捡起武器的雪伊和小果子，嘴角勾起一抹无奈又复杂的苦笑，“雪伊，小果子。准备战斗吧。为了……保护那个把我们关进来的疯女人的城市。”"
PAM.10.a: "（哪怕是敌人，也是“活人”的敌人）"

PAM.11.t: "出笼的疯狗"
PAM.11.d: "地下监牢的空气在燃烧，这里正沸腾得像一口炸了的油锅。成捆的步枪带着刺鼻的枪油味，砸在满是污垢的走廊上，发出沉闷的撞击声。铁铲、镐头，甚至是从厨房抢来的菜刀，被狱卒们粗暴地塞进囚犯们的手里。\n那些曾经拿着鞭子的狱卒此刻正哆哆嗦嗦地转动钥匙，铁门一扇接一扇地敞开，金属撞击声响成一片。\n“拿着！都拿着！手脚都动起来！”狱卒长吼叫着，声音因恐惧而变得尖锐刺耳，“女王有令！外面的那些东西想把这里变成坟地，想把大家都变成乖宝宝……她偏要反着来！”\n他大口喘着气，模仿着索拉娜那种独有的、傲慢又疯狂的语调嘶吼：“告诉那群野火的狼崽子，你们的命是女王从烂泥里捡回来的！你们的骨头必须由她亲手拆，你们的惨叫必须由她亲自听！那群没有体温的骨头架子算什么东西？它们只配被你们咬碎！滚出去！去撕烂它们！只要还能喘气，就必须给我活得热气腾腾的！”\n一名满脸伤疤的老游击队员一把抓起磨得发亮的工兵铲，他在手里掂了掂分量，抬头看向头顶那摇摇欲坠、不断落下灰尘的石板，仿佛透过了厚重的岩层，看见了外面那个正在燃烧的世界。\n“呵……那个疯女人。”他啐了一口带血的唾沫，眼中原本死灰般的沉寂瞬间被野兽般的凶光取代，“她想看戏？那就演给她看！同志们！既然老天爷拒收，女王也留着咱们这条命……那咱们就去给外面的那些骨头松松土！让它们好好尝尝，活人的血……到底有多烫！”"
PAM.11.a: "（哪怕是死，也要死在冲锋的路上！）"

PAM.12.t: "最吵闹的心跳"
PAM.12.d: "“好烫……”\n我死死地捂住胸口，那里本该是一片虚无的空洞，此刻却传来了一阵像是要把灵魂都烫穿的灼热剧痛。\n整个夜莺之国都在震颤。那是……索拉娜。\n她的声音，穿透了生与死的帷幕，穿透了万年的寂静，像一把烧红的匕首，狠狠地扎进了我的脑海里。\n她在燃烧夜莺之心。她在用那颗我最珍视的心脏，当作柴火，去点燃一场甚至能灼伤亡灵的大火。她在向我挑衅，她在向我炫耀她那所谓的生命力。\n“……笨蛋。”\n眼泪，毫无征兆地从我的眼眶里涌了出来，瞬间就被那股传递过来的热浪蒸发。\n“索拉娜……你这个……无可救药的大笨蛋！”\n“谁告诉你我只喜欢安静了？谁告诉你……我想把你变成只会睡觉的玩偶了？”\n“我讨厌吵闹，但我更讨厌……没有你的安静啊！”\n“你以为烧光了自己，就能向我证明什么吗？你以为把自己变成灰烬，就是所谓的活着吗？！”\n我猛地站起身，推开了那扇尘封已久的大门。外面的亡灵大军正在躁动，它们渴望着那股鲜活的能量。\n“都给我走开！”\n我对着那片无尽的黑暗嘶吼，声音里不再有公主的优雅，只有一种……害怕失去最重要宝物的、歇斯底里的焦急。\n“那是我的！那团火是我的！那个吵死人的笨蛋……也是我的！”\n“索拉娜，你给我听着！不许死！在你把那个热乎乎的家赔给我之前……你绝对，绝对不许熄灭！”\n“我现在……就来抓你了！”"
PAM.12.a: "§1“等我！！！”§!"

PAM.13.t: "灰烬中的辩词"
PAM.13.d: "“结束了……吗？”\n喧嚣退去，只有风穿过残破城墙的呜咽。我低下头，看着自己的指尖。那上面没有血，只有正在一点点剥落、化为黑色尘埃的皮肤。那颗借来的心脏跳得越来越慢，每一声都像是在敲响丧钟。我要消失了。这一次，是真的要变回那滩烂泥了。\n我转过头，看向城墙下那些刚刚从亡灵口中活下来的、衣衫褴褛的人们。她们正用一种我看不懂的眼神看着我——是恐惧？是敬畏？还是……憎恨？\n那种眼神像针一样扎进了我的眼睛。我的胃突然痉挛起来，一种比饥饿更可怕的恶心感涌上喉头。\n“别用那种眼神看我！！”\n我突然发疯似地冲她们咆哮，声音嘶哑而破碎，像个受了委屈却还要逞强的孩子。\n“我烧了他们的地契！我把那些要把你们当马骑的贵族全挂在了路灯上！是我！是我把枪硬塞进你们手里，逼着你们站直了！是我把皇宫拆了给你们盖房子，把那些金盘子熔了给你们换肉汤！我哪怕自己没读过书，我也想让你们活得像个人样！我哪里做错了？啊？！我哪里对不起你们了？！”\n我大口喘着气，想要证明什么，可脑海里却突然闪过那天晚上的画面。\n那天，军团把镇压报告送上来的时候……上面写着“清除贫民窟暴乱”。我知道那是屠杀……我看到了照片上那些和我以前一样穿着破烂衣服、瘦骨嶙峋的尸体。我当时……手都在抖，酒杯都摔碎了。我很惊讶，真的……我很想吐。\n可是……可是我为什么没有惩罚他们？\n我只是……转过了头。我只是重新拿了一个杯子，告诉自己那是为了秩序，是为了赢，是为了不让野火烧过来。我假装没听见那些哭声，就像当年那些贵族假装没听见我的哭声一样。\n我杀了恶龙，却养了一群更凶的狼来咬你们……\n“不……不对！我没错！这个世界本来就是吃人的！不狠心怎么活？！不流血怎么活？！”\n我死死地抓着胸口，指甲嵌进了肉里，试图按住那份正在撕裂我的、迟来的剧痛。\n“……可是，莉莉……如果不痛的话……为什么我现在……这么想哭呢？”\n身体越来越轻，我闭上眼睛，在那无尽的黑暗降临前，依然倔强地昂着头，不肯让那一滴悔恨的眼泪流下来。"
PAM.13.a: "“就算到了地狱……我也绝不认错。”"

PAM.14.t: "黎明破晓之时"
PAM.14.d: "黑暗并没有降临。\n取而代之的，是一个冰凉的、却让我灵魂都在颤栗的拥抱。那股熟悉的、带着月光和露水气息的味道，瞬间驱散了所有腐朽的尘埃。\n我惊愕地睁开眼，看到的不是地狱，而是莉莉安娜。她穿着一件沾了些许泥土的、素白的裙子，跪在这片满是血污的废墟上，紧紧地抱着正在消散的我，将她那近乎无穷无尽的生命力，毫无保留地渡进我破碎的躯壳。\n“……莉莉？”我不敢置信地看着她，“你……你是来抓我回去关禁闭的吗？你是来看我笑话的吗？”\n“笨蛋。”她轻声骂了一句，眼角还挂着泪珠，却对我露出了一个我从未见过的、如释重负的笑容，“我不是说了吗？我要来抓你……抓你一起回家。不过这一次，家不一定要在那里。”\n她抬起头，那双纯净得像宝石一样的眼睛，第一次认真地、没有丝毫嫌弃地，看向了周围那些惊魂未定、满身伤痕的底层人民，看向了远处那些还没完全散去的、警惕的野火游击队员。\n“你看，索拉娜。你把这里弄得一团糟。”她像个看着调皮孩子打破了花瓶的姐姐，语气里带着责备，更多的是心疼，“你把她们的家弄坏了，你让她们流了那么多血，你让她们这么伤心……你真是个不听话的坏孩子。”\n我羞愧地想要低下头，可她却捧住了我的脸。\n“但是……没关系。”她的声音坚定而温柔，“坏掉的东西，我们可以修。流出来的血，我们可以止。如果你的道歉不够，那就加上我的。如果你的力量不够，那就用上我的。”\n她站起身，向着那些曾经被我视为蝼蚁、甚至敌人的方向，向着那些满脸泥垢的流浪汉，向着那些握着枪的革命者，缓缓地伸出了手。那姿态不再是高高在上的神明，而是一个愿意学习如何行走的凡人。\n“我不懂怎么种麦子，也不懂怎么盖房子，我甚至不知道那种叫‘饥饿’的感觉到底有多痛。但是……如果这是你拼了命也想守护的热闹，那我也想试着……去听一听。”\n她回过头，在那初升的朝阳下，对我伸出了另一只手。\n“起来吧，我的索拉娜。我们不去那个安静的地方了。我们就留在这里，和这些人，和那些叫野火的孩子们一起……把你弄坏的这个世界，一点一点地，重新拼好。好吗？”"
PAM.14.a: "（……我真是个傻瓜）"
