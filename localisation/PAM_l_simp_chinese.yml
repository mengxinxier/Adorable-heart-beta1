PAM_cbbm: "给我吃得饱饱的"
PAM_cbbm_desc: "“我最恨听到的声音，就是肚子饿得咕咕叫的声音。那声音比雷声还响，比刀子还利，能让人在半夜里发疯。\n传令下去，把那些贵族的粮仓，全给我砸开！所有的，一粒米都不许留！别跟我说什么战略储备，那是那帮肥猪留给他们自己过冬的油水。\n现在，就在广场上架起大锅，把肉和面都煮了！我要让这城里每一个要饭的，今天晚上都能吃到撑得吐出来！谁敢拦着，就把她也扔进锅里！”"
PAM_cbbm2: "给我吃得饱饱的"
PAM_cbbm2_desc: "“我最恨听到的声音，就是肚子饿得咕咕叫的声音。那声音比雷声还响，比刀子还利，能让人在半夜里发疯。\n传令下去，把那些贵族的粮仓，全给我砸开！所有的，一粒米都不许留！别跟我说什么战略储备，那是那帮肥猪留给他们自己过冬的油水。\n现在，就在广场上架起大锅，把肉和面都煮了！我要让这城里每一个要饭的，今天晚上都能吃到撑得吐出来！谁敢拦着，就把她也扔进锅里！”"
PAM_lqfs_tt:0 "§Y用不了多久，我们会收到来自§O[PAM.Getname]§!承诺的§t回报§!的。§!"
PAM_lqfs:0 "狼群的分食协议"
PAM_lqfs2:0 "狼群的分食协议"
PAM_lqfs2_desc:0 "为了回应南方那位狼王的呼唤，我们将最好的机器拆卸打包，作为入伙费送往了莉兰迪亚。这听起来像是丧权辱国的朝贡，不是吗？\n但去问问码头上的装卸工，去问问车间里的操作员吧。\n索拉娜的回礼是实打实的——满载着从世界各地掠夺来的粮食、肉干和烈酒的船队，源源不断地驶入我们的港口。我们不再把这些东西锁进资本家的仓库，直接倒在广场上，让每一个满身油污的劳动者尽情享用。\n我们的精英在尖叫，因为他们的利润被拿去喂狼了；但我们的底层人民在欢呼，因为她们终于明白：只要机器转得够快，只要跟着狼群去撕咬，今晚的餐盘里就会有肉。"
PAM_lqfs3:0 "这一顿，我请了"
PAM_lqfs3_desc:0 "“仗打完了，世界安静了。仓库里的粮食堆得快把房顶撑破了，抢来的金子铺满了地窖。\n晓枫问我要不要存起来备荒，雪伊问我要不要扩军备战。\n我说：‘闭嘴！都给我闭嘴！’\n我抢了一辈子，杀了一辈子，甚至死了一次又活过来……是为了什么？是为了当守财奴吗？\n不！是为了这一刻！\n把门都打开！把城墙拆了！把所有的酒桶都滚出来！\n不管你是哪里人，不管你以前是敌人还是奴隶。只要你还喘气，只要你还觉得饿，就都给我过来！\n坐下！拿碗！张嘴！\n这是我索拉娜打下来的江山，这是我用命换来的粮食。今天，谁也不许客气，谁也不许省着！\n吃！给我往死里吃！\n这顿饭……我请了！只要我还在，这片大陆上，就他妈的永远不许再有人饿肚子！！”"
PAM_lqfs3_tt:0 "§G每有一个拥有该民族精神的国家都会为我们提供：\n§!"
