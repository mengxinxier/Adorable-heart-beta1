PAM_xiaoguo_desc:0 "§L小果子不喜欢那些写在纸面上的漂亮童话。在风雪里挨过冻的人，最明白真正的幸福是要用双手去争、用枪杆去抢的。现在梦境被打破了，真实的冰雪砸在肩膀上，她端着那杆陪了她一路的枪，踩在落满霜雪的废墟上，心里装着那些闭上眼睛的无数伙伴。外面的天还没亮，前面是看不见底的深渊，这个在海风里吹透了的姑娘要一直往前走。\n§9她要把那些睡过去的同伴一个接一个地拉起来。§!§!"

PAO_lxly_deputy_leader_desc:0 "§L露西莉亚清楚，自己属于另一个早已烧毁的世界。曾经的故事书早就化为了飞灰，她带着夜莺之心，孤身涉水来到这片战火肆虐的荒野上。她曾以为自己可以用温和的笔触重写结局，让所有人都在安稳的梦境里醒来。可现在，门扉敞开了，冰冷的现实像剑刃一样挥在身上。看着小果子那双不肯低头的眼睛，这位远道而来的骑士终于明白，真正的挽救，是陪着她们在风雪里一同受伤、一同抗争。\n§t即使长剑折断，即使要面对整片荒野的寂静，她也一定要把故事的最后一页，亲手写完。§!§!"

