PAM_sln4_deputy_leader_desc:0 "§L很久很久以前，荒原上住着一只总是饿着肚子、冲人龇牙的小野狼。因为害怕夜里的风雪，也因为挨过太多的饿，小野狼抢走了金子，占了暖和的屋子，还要把整个世界都一口吞进肚子里，好让自己再也不用发抖。大家都怕这只野狼，说那是个坏孩子。\n\n后来，月光下的歌声响了起来。舒缓、微凉的曲子轻柔地拂过额头，哄着那只哭闹不休的小野狼安稳地睡了过去。等小野狼重新睁开眼睛，发现自己不再需要张牙舞爪地去拼命了。虽然心里那些要抢东西的念头依旧在暖烘烘地攒着，牙齿也时常不服气地磨两下，但身边已经有了一双拉着手、可以一起散步的温度。\n\n往后，这片重新变得安详的世界，会由我们一起去守着。等哪天走累了，就坐在暖和的炉火旁，分一包剥开的糖果。\n\n§1“好啦，索拉娜。今天晚上，也给你留了一句甜甜的晚安哦。”§!§!"

