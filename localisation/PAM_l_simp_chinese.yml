PAM_his_page_01_title: "沉默的狮子"
PAM_Country_History_Page_01: "1934年，莉兰迪亚的贵族们第一次体会到了比死亡更可怕的东西——那就是被自己的守护神所抛弃的孤寂。在那场席卷工业区的暴动中，当愤怒的燃烧瓶砸向庄园的大门时，贵族们疯狂地拨打着军团指挥部的电话，许诺金钱，许诺爵位，甚至许诺土地。然而，电话的那头只有死一般的沉默。这并非因为军团被击溃，而是因为这头帝国的雄狮，即使是在笼子里，也早已受够了饲养员的克扣与羞辱。那时的军团内部，正经历着一场无声的地震：老派的荣誉感与对腐败现状的憎恶正在撕裂指挥官们的神经。军团长在犹豫，晓枫在观望，士兵们则冷冷地看着那些平日里趾高气昂的大公们被泥腿子追得满街乱窜。在那至暗的一周里，拥有毁灭性火力的军团选择了持枪旁观。这种沉默，便是对旧贵族最残忍的判决——它扒光了统治者最后的底裤，让这群肥羊赤裸裸地暴露在了饥饿的狼群面前。"

PAM_his_page_02_title: "握刀的手"
PAM_Country_History_Page_02: "历史书上会说，是军团镇压了起义。但只有当时的亲历者知道，那把生锈的刀是如何重新变得锋利的。在那个混乱的雨夜，索拉娜并没有站在阵地的最前沿咆哮，她站在了那个堆满黄金与尸体的会议桌旁。她没有试图用大道理去说服那些陷入迷茫的军团指挥官，她只是做了一件贵族们做不到的事——她当着军团代表的面，亲手把一个试图私藏军费的伯爵从窗户扔了出去，然后把那些染血的财富，连同“不受文官节制”的绝对承诺，一并推到了老军团长和晓枫的面前。她不需要懂得战术，她只需要懂得人性。她用贵族的血肉喂饱了军团的胃口，用绝对的权力缝合了军团的裂痕。那一刻，军团不仅是为了秩序而战，更是为了这位新主人的“赏赐”而战。索拉娜是那个在幕后磨刀的人，她看着那些正直的军人不得不弄脏自己的手，嘴角挂着一丝讽刺的微笑。她赢了，不是因为她比工人更正义，而是因为她比贵族更舍得下注。"

PAM_his_page_03_title: "地窖里的低语"
PAM_Country_History_Page_03: "如果你在1934年的深夜贴近皇宫的地板，或许能听到地下深处传来的、指甲抓挠岩石的细碎声响。那是索拉娜最大的秘密，也是她最大的恐惧。在镇压起义的最关键时刻，即使防线岌岌可危，索拉娜也死死地攥着那把通往地下的钥匙，指节发白。她不敢打开那扇门。因为那时，她的王座旁还站着两把尚未卷刃的利剑——那是眼里揉不进半点沙子的年轻参谋晓枫，以及那位正值盛年、威望极高的军团长。那个女人的直觉太可怕了，她那双在无数战场上淬炼过的眼睛，总能轻易看穿一切伪装。索拉娜清楚，一旦地底那股亵渎死者的腐臭飘出一丝一毫，这对师徒会毫不犹豫地调转枪口，先将她这个怪物撕成碎片。为了在这个活人的世界里戴稳王冠，为了让那个敏锐的晓枫看不出端倪，必须要有人先“退场”。于是，1935年的那场被索拉娜认为瞒过了所有人的毒杀便成了剧本里不可或缺的一章。王室匆匆举行了葬礼，宣称那头狮子已经长眠。索拉娜在灵柩前松了一口气，以为终于拔掉了心头大患。她或许太急于庆祝了，以至于忘了去确认那杯酒是否真的致命，也忘了去确认那具棺椁里装殓的是否是一具冰冷的尸体。她以为自己埋葬了火种，却不知道在这个混乱的世道里，有些从死人堆里爬出来过的老兵……最擅长的，就是“消失”。"

PAM_start_game_text: "§O死人才会贪恋梦境§!"

PAM_route_guide_desc: "§O狼群帝国§!路线指南\n注：需要@LHS§t野火革命军§!未进入§9小果子§!线，@PAO§1夜莺之国§!未进入§t露西莉亚§!线。\n§Y（玩家游玩本国家时，AI默认不会进入以上线路)§!\n\n一、§1《一步之遥》§!\n§O“我抢来了面包，抢来了黄金，甚至抢来了足以让这世界停止转动的力量。\n那个声音告诉我，只要我点头，我就能让我的狼群永远吃饱，让这顿晚宴永不散场。\n那是一个没有痛苦、没有饥饿、完美的……世界。\n但是……去他妈的完美。\n如果活着不需要流汗，如果吃肉不需要撕咬，那我和那些躺在坟墓里的骨头架子有什么区别？\n当那个时刻来临，我会做出我的选择。\n哪怕代价是粉身碎骨，我也要守住这……又脏、又乱、却热气腾腾的人间。”§!\n\n§Y路线达成条件：§!\n1.在§Y莉兰迪亚革命战争§!中，击败@LHS§t野火革命军"§!\n2.在@ZDW§L躁动的亡灵§!攻势中存活下来。§t（不要正面强攻，而是尽量回避战斗确保自己存活。）§!\n§O(请尽力让§t@PAU军团§!存活至1937年1月1日，可让军团转入索拉娜的麾下)§!"
