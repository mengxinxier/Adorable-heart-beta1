####目标####
  FOCUS_WEILIE_FACTION_GOAL_FILTER: "狼群狩猎计划"
  PAM_faction_goal_name: "南美大围猎"
  PAM_faction_goal_desc: "让那些文明人画的国界线见鬼去吧！在狼的眼睛里，这片大陆只是一张铺满了珍馐美味的巨大餐桌！\n我们的任务很简单：释放心中的§R饥饿§!与§O贪婪§!，撕碎那些§3伪君子§!的栅栏，砸烂那些§7瓷娃娃§!的玻璃房子。我们将把这片大陆上所有的黄金、粮食和生命力，统统塞进我们——这支由§1亡灵§!与§t暴民§!组成的伟大军团的胃里。只要牙齿够硬，这世上就没有我们咬不碎的骨头！"
  PAM_get_out_old_bones: "滚回你们的岛上去！"
  PAM_get_out_old_bones_desc: "“停手吧！看看他们那副惨样，连皇家海军的底裤都被我们扒光了。\n我们已经拿到了我们要的——北边的木材和矿山，那边的金子和钻石。至于那个终年下雨、发霉、还要端着架子喝下午茶的破岛……送我我都不要！\n给那个老掉牙的国王……或者是女王？管他是谁！给他发个电报：\n‘喂！老东西！你的晚饭结束了，盘子归我了。看在你曾经也算是个掠食者的份上，我不杀绝你。带着你那点可怜的自尊，还有你那些残兵败将，滚回你的岛上去！’\n‘如果不滚，我就游过去，把你王冠上的最后那颗珠子也扣下来！’”"
  PAM_get_out_old_bones_show: "我们尚未拥有的目标—§Y[FROM.getname]§!"

  PAM_the_main_course_across_the_sea: "跨越大洋的主菜"
  PAM_the_main_course_across_the_sea_desc: "“小的们，擦擦嘴！别盯着那些殖民地的残羹冷炙流口水了，那只是餐前的开胃小菜。真正的硬菜，在海的那一边！\n看看那张名为欧洲的老餐桌上都摆了些什么？\n有一群自以为是的铁皮罐头，那是所有贵族和皮鞭的老家，我要把他们的铁壳子撬开，看看里面的肉是不是也是黑的！\n有一群躲在结界里过家家的老妖怪？哈！把她们的玻璃罩子砸碎！我要看看所谓的神明流出来的血是不是甜的！\n还有……那个坐在骨头堆上的骷髅架子？它也配玩弄生死？在这个世界上，只有我和莉莉有资格命令死人！我要把那个老骨头拆散了，磨成粉，给我的花施肥！\n别管她们叫什么名字，别管她们有多古老。在我眼里，她们只有一种身份——霸占着茅坑不拉屎的、肥得流油的猎物！\n起锚！把那个发霉的旧世界……给我吃个精光！”"
world_hunt_goal_name:"§O吞世狼群§!"

world_hunt_goal_desc:"听好了，小的们！别跟我扯什么主义，也别管对面挂的是什么旗子！在我眼里，这世界上只有两种东西：张嘴吃肉的狼，和盘子里待宰的羊！\n那些住在海对岸的老爷们，霸占着最好的庄园，锁着最满的粮仓，还制定了一堆狗屁规矩来说明为什么我们活该挨饿。哈！现在南美洲已经被我们吃干抹净了，但我的胃还在烧，你们的肚子还在叫！\n跨过大洋，撞碎所有的国界线，把那些藏在堡垒和高塔里的肥猪拖出来宰了！我们要把全世界的穷鬼都变成狼，把全世界的金子都变成肉！\n别客气，尽情地咬吧！"

world_hunt_stage_01:"打仗就是吃饭，有不想吃饭的吗？"

world_hunt_stage_02:"把那圈养绵羊的地图给老子撕了！"

world_hunt_stage_03:"把富人扔进锅里！把穷人拉上餐桌！"

world_hunt_stage_04:"所有的所有，都归我们！"
