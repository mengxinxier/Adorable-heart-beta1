####民族精神###
#二线民族精神
PAM_lycl:0 "冷雨穿廊"
PAM_lycl_desc:0 "瓦缝间蓄着的雨水落下来，在青石路上砸出一朵朵易碎的水花。长街黑漆漆的，风顺着门缝往里钻，把灶膛底下的冷灰吹得四处铺展。屋里潮得厉害，连被角都透着股寒意。这泥泞里静得发慌，偶有一两声不知从哪儿传来的犬吠，很快就被闷雷盖了过去。"
PAM_lycl_tt: "§Y冷雨穿廊§!追加效果:\n"

PAM_xf_js:0 "心里装着活人呢"
PAM_xf_js_desc:0 "晓枫坐在营房里，用铅笔在地图上画着线。风往哪边吹，哪里的山石容易塌，她看一眼就全记在脑子里了。懂了风向和山路，队伍在林子里行军时，就不会再走冤枉路。"

PAM_sln_js:0 "总得让人吃饱饭"
PAM_sln_js_desc:0 "索拉娜一辈子都在和人抢吃的。抢金子，抢粮仓，甚至抢走神明的心，其实她就是害怕挨饿。肚子饱了，身上也就有了温度。"

PAM_xy_js:0 "屋顶盖结实"
PAM_xy_js_desc:0 "雪伊在木凳上坐着，两手拿稳了铁锤。废墟里还堆着不少石料，要在这片荒野上立下不倒的高墙，得把每一块砖石都码得整齐。烟囱冒烟了，房子盖好了，大家才算有了真正的家。"

PAM_lili_js:0 "给你留个位置"
PAM_lili_js_desc:0 "莉莉安娜推开窗，看着外面安静下来的深谷。风雨被墙壁隔在了外头。无论你在外面走得多累、多疼，这里永远都会为你留着一个温暖的位置，等你回来睡一觉。"
#一线民族精神
PAM_royal_co_op2:0 "妥协的王室"
PAM_royal_co_op2_desc:0 "看着那群喷着香水的老东西在我面前瑟瑟发抖，真是一种享受。\n他们以为向我下跪是政治投机？是为了躲避那些喊着要挂路灯的赤色疯子？错，大错特错。\n我留下他们的狗命，不是因为我需要他们的忠诚——那种东西比烂泥还不值钱。我留下他们，仅仅是因为这群肥猪肚子里还没榨干的油水，还有他们手里那些我看不懂的账本。\n只要他们还能像只会下金蛋的鸡一样，乖乖地把钱吐出来给我造大炮，我就允许他们在我的猪圈里再多哼哼几天。但记住了，狼群不养闲人。哪天若是吐不出金子了……那就直接扔进锅里，给我的孩子们加个餐。"
PAM_royal_co_op3:0 "妥协的王室"
PAM_royal_co_op3_desc:0 "看着那群喷着香水的老东西在我面前瑟瑟发抖，真是一种享受。\n他们以为向我下跪是政治投机？是为了躲避那些喊着要挂路灯的赤色疯子？错，大错特错。\n我留下他们的狗命，不是因为我需要他们的忠诚——那种东西比烂泥还不值钱。我留下他们，仅仅是因为这群肥猪肚子里还没榨干的油水，还有他们手里那些我看不懂的账本。\n只要他们还能像只会下金蛋的鸡一样，乖乖地把钱吐出来给我造大炮，我就允许他们在我的猪圈里再多哼哼几天。但记住了，狼群不养闲人。哪天若是吐不出金子了……那就直接扔进锅里，给我的孩子们加个餐。"

PAM_Flesh_golem2:0 "血肉傀儡"
PAM_Flesh_golem2_desc:0 "别用那种看怪物的眼神盯着它们。在我眼里，这只是一笔最划算的买卖。\n活人是要吃饭的，是要穿衣的，受伤了是会疼得大叫的。我的狼崽子们也是血肉做的，凭什么让她们去顶敌人的第一轮机枪？但这些东西？它们不需要面包，不需要军饷，更不需要抚恤金。把那些战场上没人要的烂肉缝起来，再塞进一点莉莉那边的魔法，它们就是最完美的肉盾。\n让它们冲在前面吃子弹，我的狼崽子们就能在后面少流点血，多吃口肉。这笔账，傻子都会算。\n呃……至于材料不够了怎么办？\n去对面“借”点。反正死人留着那一身肉也没用，不如贡献出来，替活人挡两枪。"
PAM_Flesh_golem3:0 "生与死的混合双打"
PAM_Flesh_golem3_desc:0 "“看啊，多么完美的配合。\n死人负责制造恐惧，活人负责收割生命。亡灵的寒气冻僵敌人的手脚，我们的热血烧毁敌人的营房。\n这是只有我索拉娜才能想出来的战术，这是生者与死者最疯狂的共舞！\n让那些自以为是的文明军队颤抖吧！当她们面对这支分不清是人是鬼、杀不完也打不烂的军队时，她们才会明白——在这个世界上，只有这种半死不活的怪物，才是无敌的！”"
PAM_Flesh_golem4:0 "生与死的混合双打"
PAM_Flesh_golem4_desc:0 "“看啊，多么完美的配合。\n死人负责制造恐惧，活人负责收割生命。亡灵的寒气冻僵敌人的手脚，我们的热血烧毁敌人的营房。\n这是只有我索拉娜才能想出来的战术，这是生者与死者最疯狂的共舞！\n让那些自以为是的文明军队颤抖吧！当她们面对这支分不清是人是鬼、杀不完也打不烂的军队时，她们才会明白——在这个世界上，只有这种半死不活的怪物，才是无敌的！”"

PAM_ymjl:0 "野蛮纪律"
PAM_ymjl_desc:0 "“别去征召那些所谓的良家子弟，她们太娇气，挨一顿饿就哭爹喊娘。去贫民窟，去下水道，去那些野狗都不愿意待的地方。\n哪怕她们身上长满了疮，哪怕她们瘦得只剩一把骨头。只要那双眼睛里还冒着绿光，还想吃肉，那就是我要的兵。\n我要把她们从烂泥里拽出来，给她们洗个澡，塞给她们一把枪。告诉她们：从今天起，别再跪着要饭了。想要什么，就自己去抢！就像我当年一样！”"
