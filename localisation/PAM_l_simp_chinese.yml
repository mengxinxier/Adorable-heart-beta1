####人物####
PAM_Frisk: "福"
PAM_bln: "百灵"
PAM_wldn: "索拉娜"
PAM_wldn_Desc: "§L索拉娜不记得自己作为人类时的名字。她只记得无尽的饥饿、寒冷，以及在贫民窟的泥泞中为了半块黑面包而与野狗争食的卑微。死亡对她而言并非终点，而是一场意外的旅途。当她的灵魂坠入那片名为夜莺的、永恒寂静的国度时，她第一次感受到了力量的诱惑。\n这里没有痛苦，没有饥饿，只有完美的秩序与绝对的宁静。但对索拉娜而言，这份宁静与她曾经历的死亡同样冰冷。她的灵魂深处，燃烧着一团永不熄灭的、名为“不甘”的火焰。她不愿就此沉寂，她要将命运重新握在自己手中。\n她见到了那个国度的公主，莉莉安娜。一个纯粹、强大却又无比孤独的存在。索拉娜在那双寂寞了万年的眼眸里，看到了自己实现野心的阶梯。她用生者世界的故事去诱惑她，用自己灼热的灵魂去温暖她，用毫无保留的忠诚与爱意去麻痹她。她成为了莉莉安娜唯一的色彩，唯一的知己，唯一的……弱点。\n她们曾有过温存的时光。在那一片死寂的国度里，索拉娜几乎以为自己会沉溺于那份独一无二的占有之中。但每当她闭上眼，贫民窟那冰冷的泥泞，就会再次将她淹没。她明白，安逸只会消磨她的火焰，而她要的，是足以焚烧整个世界的烈焰。\n最终，在那个数千年一次的同调仪式上，她毫不犹豫地露出了自己的爪牙。她盗走了“夜莺之心”的权能，那份足以颠覆生与死秩序的绝对力量。她将莉莉安娜的错愕与心碎，连同那个永恒寂静的国度，都彻底抛在了身后。\n她回到了生者的世界，来到了莉兰迪亚。她用强大的力量与冷酷的手段，轻易地夺取了这个腐朽王国的王座。在这里，她终于拥有了她梦寐以求的一切——财富、权力，以及一个可以在阳光下实现的、建立不朽帝国的梦想。\n但她偶尔，也会在深夜里惊醒。\n§W她会下意识地，回头望向那片……她再也回不去的、永恒的黑暗。她不知道自己究竟是在畏惧那个被她背叛的、破碎的君主的追猎，还是……只是单纯地，怀念着那份曾属于她一个人的、纯粹的温暖。§!§!"

PAM_wldn_Desc2: "§L那场差点将她化为灰烬的浩劫，并没有让索拉娜学会谦卑，反而烧尽了她最后一丝名为犹豫的人性杂质。她从死亡边缘带回的，是比野火更炽热、比亡灵更贪婪的——绝对的生存意志。\n她强行收编了晓枫和雪伊，不是因为觉得她们温和，恰恰相反，她认可野火那股不死不休的狠劲。但她嘲笑野火的手段太过“迂腐”——在索拉娜看来，既然要烧，就不该只烧掉自己身上的枷锁，而应该把周围所有挡路的东西统统烧光。她用锁链将这群最桀骜不驯的革命者绑在自己的战车上，傲慢地宣告：“你们只是一群会咬人的狼，而我，是唯一能带你们吃到肉的狼王。”\n现在的索拉娜，目光如炬地盯着边境线外的世界。\n对于那些被契约束缚、在绝望中轮回的魔法少女，她嗤之以鼻：“连哭都不会的漂亮玩偶，只有砸碎那个所谓的契约，把她们抓进我的笼子里，她们才能学会像人一样尖叫和欢笑。”\n对于那些躲在森林深处、自诩高贵的妖精，她露出了獠牙：“把那些长耳朵的伪君子从树上拽下来！把被她们奴役的半妖精抢过来！我的子民里，不分血统，只分能不能干活！”\n而对于那些贪婪的帝国殖民者，她更是毫不掩饰自己的食欲：“那是这世上最肥美的猪。宰了她们，我的穷鬼们就能吃上一百年的饱饭。”\n她依然是一个独裁的暴君，但她暴政的鞭子只抽向外部和上层。她要带着这支由亡灵、暴民和革命者组成的混合大军，去发动一场史无前例的“抢劫”。\n\n§O“正义？那是有钱人才配谈的东西。我只承诺一样东西——只要跟着我冲锋，哪怕是地狱里的魔鬼，我也能从它嘴里掰下两颗金牙，分给你们当饭钱！”§!§!"

PAM_wldn_Desc3: "§L她曾是一个为了半块面包而杀人的乞丐，也曾是一个为了对抗寂静而燃烧世界的暴君。如今，她成为了一个真正的幽灵——一个没有心跳、没有体温，却比这世上任何人都更热烈地“活着”的亡者。\n现在的索拉娜，不再是那个只知掠夺的强盗头子，而是整个新大陆的“家长”。她依然粗鲁、依然不讲道理，依然喜欢穿着那身沾满油污的黑色军大衣，把脚翘在议会桌上。但她的贪婪已经从占有变成了投喂。她像一头不知疲倦的头狼，死死地守着她那座永不熄火的大食堂，确保她的每一个子民——无论是人类、亡灵还是妖怪——都能把肚子吃得滚圆。\n她失去了行走的自由，被名为爱的锁链困在莉莉安娜身边的一步之内。但她对此毫不在意，甚至以此为荣。她将这份束缚视为她作为“人”存在的锚点。她依然会对着晓枫的报表大吼大叫，依然会嘲笑雪伊的严肃，依然会把最好的肉塞给小果子。\n她在夜晚不需要睡眠，但她依然会闭上眼睛，假装入睡。因为只有那样，那颗在她胸腔里、早已回归莉莉安娜体内的心脏，才会通过灵魂的共鸣，传给她一种名为安宁的幻觉。\n\n§O“我是个死人，这没错。但我发誓，只要我的旗帜还飘着，这片土地上就绝不会再有一个活人，像当年的我一样……在泥坑里冷得发抖。”§!§!"

PAO_lili_Desc5: "§L她曾是永恒寂静的化身，是端坐在水晶王座上、不染尘埃的神明。但那一天，为了抓住那个正在燃烧的笨蛋，她亲手打碎了自己的完美，从永恒中跳进了这片充满了血污与泥泞的人间。\n现在的莉莉安娜，依然拥有着惊心动魄的温柔与强大的魔力，但她的裙角常沾着泥土，手中常拿着绷带。她不再追求那种令人窒息的寂静，而是学会了在工厂的轰鸣声、士兵的操练声、甚至是索拉娜暴躁的骂人声中，听出一种名为“家”的旋律。\n她并没有完全认同索拉娜那疯狂的扩张计划，但她选择站在索拉娜的身后。她将索拉娜视为一把虽沾满鲜血却为了劈开荆棘的剑，而她自己，则是那个跟在剑锋之后，负责缝合伤口、擦拭泪水的人。她用神明的宽容，接纳了被索拉娜强行抓来的野火众人，用温柔化解她们的敌意，教导那个不懂事的暴君如何去倾听。\n她走出了冥界，却把整个莉兰迪亚变成了她的新花园。只是这一次，花园里种的不再是冰冷的水晶花，而是每一个具体的人——无论是被征服的俘虏，还是被解放的奴隶。她会为索拉娜的每一次暴行善后，为了让那颗从烂泥里长出来的树，能开出真正温柔的花。\n\n§1“既然她负责把墙推倒，把天捅破。那么……就由我来负责，把受伤的孩子抱起来，把这个破破烂烂的世界，重新缝好吧。”§!§!"

PAO_lili_Desc6: "§L她曾是端坐在时间尽头的神明，为了一个不回家的孩子而流干了眼泪。如今，她亲手折断了自己的神性，走下了王座，成为了那个喧嚣暴君身后，唯一的、也是永恒的影子。\n现在的莉莉安娜，是这台疯狂咆哮的狼群中最温柔的灯火。她用那颗失而复得的夜莺之心，维系着索拉娜的灵魂不至消散，同时也维系着这个国家在狂热中不至崩塌。她不再厌恶噪音，不再恐惧混乱。她学会了在索拉娜咆哮时递上一杯温水，在野火们争论时送上一盘点心，在那些被战争创伤的孩子面前唱起摇篮曲。\n她依然穿着那件素白的长裙，但上面常沾着面粉和泥土。她不仅是索拉娜的生命之源，也是这个帝国的“母亲”。如果说索拉娜负责把世界抢回来，那么莉莉安娜就负责把这个世界洗干净，缝好，然后温柔地盖在每一个子民的身上。\n她紧紧攥着那根看不见的银色丝线，一刻也不敢松开。那是她对索拉娜的囚禁，也是她对这个世界最深沉的留恋。\n\n§1“以前，我以为爱是把它关在笼子里，不让它受伤。现在我明白了……爱是陪着它一起，在泥地里打滚，在风雨里大笑，然后……在它累的时候，无论在哪里，都给它一个可以回去的家。”§!§!"

PAM_lxly_Desc: "§L“我刚刚合上那本名为《诀别之诗》的童话书，在那里，我似乎已经成功逆转了时间，让公主与所有人迎来了完美的结局。\n然而，当我再次睁开眼，置身于这场喧嚣的狼群盛宴时，我却在辉煌的灯火下，嗅到了那股……我曾拼命想要掩盖的、熟悉的灰烬味道。\n这真是一场伟大的远征，不是吗？\n但我为什么会觉得……自己从未真正离开过那座空无一人的圣堂？\n也许，我并不是什么穿越时空的救世主。我只是一个不愿醒来的、固执的读者，为了不让故事在最悲伤的那一页终结，便在泪水中……一次又一次地，为早已死去的她们，翻开了下一场……名为‘如果’的梦境。”§!"

