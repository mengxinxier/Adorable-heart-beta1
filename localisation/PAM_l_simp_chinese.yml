PAM_undead_pacification_category:0 "亡灵的挽歌"
PAM_soothe_restless_souls:0 "抚慰躁动的亡魂"
PAM_undead_pacification_category_desc:0 "这片土地下埋葬了太多的苦难。那些没能挺过寒冬的、死于战火的、心怀不甘的灵魂。它们不是敌人，它们是我们逝去的同胞。如果它们愿意安息，就会留下利箭作为守护我们的力量；如果悲伤太过强烈……\n我们就不得不让它们在战斗中发泄出来。\n\n我们目前库存中拥有  §Y[?Root.num_equipment@wangling_equipment|Y0]§! 支 £GFX_PAM_szlj §1死者的利箭§!  §Y[?Root.Essence|Y0]§! 枚 £GFX_PAM_WLJC 亡灵精粹"
PAM_appease_the_dead:0 "§1沉睡的代价§!"
PAM_appease_the_dead_desc:0 "“地底下的声音越来越大了。它们在磨牙，在撞门，在抱怨我们要得太多。\n真是一群贪得无厌的死鬼。不过，现在的我还不想把精力浪费在镇压自己家后院上。\n既然它们想要，那就还给它们！\n把这批成色最差的利箭挑出来，重新埋回那些乱葬岗去！告诉地下的那些东西：这是利息！\n拿着这些东西，闭上嘴，滚回去睡觉！别逼我亲自下去让你们永远闭嘴！”"
PAM_mobilize_undead_looters:0 "§O亡灵搬运队§!"
PAM_mobilize_undead_looters_desc:0 "“活人士兵太娇气了。火太大了进不去，房子快塌了不敢进，太重了搬不动。\n我看仓库里那些骨头架子的利箭都快堆发霉了。把它们唤醒！让它们去干活！\n死人不怕火，不怕砸，而且最重要的是——死人没有口袋，不会私藏金币。\n给每个亡灵发个麻袋！让它们去扫荡战场，去清理废墟！告诉它们：哪怕是一颗螺丝钉、一只皮靴，只要是能用的，都给我捡回来！\n我们要把敌人抢得……连条底裤都不剩！”"
PAM_sacrifice_ghost_dockyards:0 "§1幽灵船坞§!"
PAM_sacrifice_ghost_dockyards_desc:0 "“船还是太少了！根本不够装下我们要抢的东西！\n把那些利箭都扔进锅炉里！那是最好的催化剂。\n告诉工人们滚开，让亡灵接管船坞！它们不需要休息，不需要图纸，只要给它们足够的怨气，它们就能用骨头和废铁拼出战列舰！\n烧！给我烧！我要在天亮之前看到新船下水！哪怕这艘船是用鬼魂糊出来的，只要能开炮，就是好船！”"
PAM_ghost_assembly_line:0 "§1幽灵装配线§!"
PAM_ghost_assembly_line_desc:0 "“那些骨头架子和怨魂在仓库里积灰太可惜了。把它们撒进流水线里！\n看啊，扳手自己动起来了，铆钉自己飞进去了。\n不需要活人加班，不需要给鬼发工资。它们为了发泄怨气而疯狂工作，而我们坐享其成。\n这就叫效率！用这批便宜得像白捡一样的飞机，去把天空铺满！让我的飞行员哪怕把飞机当砖头扔，咱们也扔得起！”"
PAM_forge_soul_armor:0 "§O怨念装甲§!"
PAM_forge_soul_armor_desc:0 "“晓枫说我们的坦克皮太薄，被敌人的大炮一轰就碎，里面的狼崽子还没冲到面前就熟了。\n这不行。我的兵，只有我能折腾，敌人没资格把他们变成烤肉。\n把那些死者的利箭都拿来！那是亡灵的骨头，是它们的怨气，比世界上最硬的钢还要硬。\n让工匠把它们熔了！涂在坦克上，嵌进钢板里！\n别管好不好看，也别管那玩意儿会不会在半夜乱叫。我只要它能挡住炮弹！\n这就叫……让死去的姐妹，给活着的姐妹当盾牌。这才是咱们狼群的规矩——死活都要抱成团！”"
PAM_weaving_death_shroud:0 "§1死亡帷幕§!"
PAM_weaving_death_shroud_desc:0 "“铝太贵了，那是给阔佬们造玩具用的。我们的飞机不需要闪闪发光，只需要能飞，而且打不烂。\n把那些亡灵利箭磨碎了，抽成丝，织成布！那种布轻得像烟，韧得像命。\n把它蒙在机翼上，哪怕被机枪扫成了筛子，那些洞也会自己合上——就像伤口结痂一样。\n虽然看起来灰扑扑的，像是在天上飞的棺材……但这棺材是装敌人的！\n缝起来！让我们的飞行员披着这层死人皮，去把天上的鸟都给我抓下来！”"
PAM_laying_bone_keel:0 "§t骸骨巨舰§!"
PAM_laying_bone_keel_desc:0 "“钢铁入水即沉，但有些东西，死都不肯沉下去。\n别去买那些昂贵的特种钢了。把这些利箭，还有战场上捡回来的乱七八糟的骨头，都给我运到船坞去！\n我们要用怨念来铺设龙骨。这种船没有痛觉，不怕进水。就算被打断了，剩下的半截也会像僵尸一样漂在水上咬人。\n告诉水手们：别嫌船舱里冷。这艘船本身就是活的，它会替你们挡鱼雷，替你们吃浪头。\n只要你们还想回家，这堆骨头架子……就绝不会让你们喂鱼！”"
PAM_refine_undead_essence:0 "§1点燃执念§!"
PAM_refine_undead_essence_desc: "“这些箭矢是冷的，放在库房里只会发霉。亡灵的执念如果不烧起来，就只是一堆废骨头。\n把它们扔进炉子里！把火烧旺！\n听听那呼啸的声音，那是它们在欢呼，在渴望重新回到战场。\n我们要把这些死意提炼出来，变成一种流动的、坚不可摧的铁水。用它来浇筑我们的战车，那是比黄金还要珍贵的燃料。\n加煤！加骨头！别让炉子熄了，前线的狼崽子们还等着穿新衣裳呢！”"
PAM_jingong_FROM:0 "对§Y[FROM.Getflag][FROM.Getname]§!发起§O掠夺§!"
PAM_lueduo_tt: "£GFX_PAO_xingxing 解锁以下§Y三个§!§t针对§Y特定国家§!的决议§!：\n\n§O£GFX_PAM_ldzb_target 扒光他们的铁皮§!\n£GFX_trigger_yes §Y显示§!及§G可用§!条件:\n - 该国和我们处于战争中\n - 目标国家投降进度 > §Y10%§!\n - 目标国家有地区被我们§Y控制§!\n\n§R£GFX_PAM_ldrl_target 谁想吃肉？§!\n£GFX_trigger_yes §Y显示§!及§G可用§!条件:\n - 该国和我们处于战争中\n - 目标国家投降进度 > §Y30%§!\n - 目标国家有地区被我们§Y控制§!\n\n§1£GFX_PAM_ldgc_target 把炉子搬回家§!\n\n£GFX_trigger_yes §Y显示§!及§G可用§!条件:\n - 该国和我们处于战争中\n - 目标国家投降进度 > §Y50%§!\n - 目标国家有地区被我们§Y控制§!"
PAM_lueduo:0 "狼群的掠食法则"
PAM_lueduo_desc:0 "“所谓的文明、国际法，不过是那帮吃饱了撑着的伪君子，为了保护盘子里的肉而编出来的破纸。在我这儿，道理只有一个：饥饿有理，抢劫无罪。\n§O扒光她们的铁皮§! 掠夺次数剩余： [?PAM_ldzb_target|Y0]\n§R谁想吃肉？§! 掠夺次数剩余:  [?PAM_ldrl_target|Y0]\n§1把炉子搬回家§!  掠夺次数剩余:  [?PAM_ldgc_target|Y0]"
PAM_kycs_target:0 "死人不再需要面包§Y[FROM.Getflag][FROM.Getname]§!"
PAM_kycs_target_desc:0 "“十万个名字。十万条原本热乎乎的生命。\n是我杀了她们。我不用谁来提醒我手上的血有多腥。那些坐在高塔里的老东西们把这些可怜的家伙像柴火一样扔进炉子里，想用她们的骨灰来呛死我。真可悲，她们以为只要把穷人填进战壕，就能挡住我的狼群。\n现在好了，柴火烧完了，炉子冷了。那十万个人原本要守卫的仓库，现在没人守了；她们原本要吃的口粮，现在没人吃了。\n既然她们的主子不在乎她们的死活，只把她们当消耗品，那我就不客气了。死人不需要吃饭，死人也不需要穿衣。\n把路让开吧。既然我帮那个国家减轻了十万张嘴的负担，那么……拿走这十万份的剩饭，也是天经地义的吧？”"
PAM_feed_the_struggling_wolves:0 "§R扔给疯狗的肉骨头§!"
PAM_feed_the_struggling_wolves:0 "“看看地图上那几个角落。那些红色的熊，还有那些黑色的鹰，正在被一群自诩文明的猎人围攻。虽然我不喜欢他们——他们一个太啰嗦，一个太傲慢。但不得不承认，他们也是长着獠牙的。\n如果他们现在就被拔了牙，那这世界岂不是太安静、太无聊了？\n晓枫，去仓库里清点一批咱们淘汰下来的枪，还有那些缴获的、沾着血的子弹。装船，给他们送过去。\n别给他们写什么友谊长存的鬼话。就写一句话：\n‘别死太快。留着一口气，把敌人的肉咬下来。等我腾出手来……我想吃那个更肥的。’\n哈！让他们去咬吧！这可是我看戏的门票！”"
PAM_ldzb_target:0 "§O扒光她们的铁皮§!§Y[FROM.Getflag][FROM.Getname]§!"
PAM_ldzb_target_desc:0 "“看看对面那些少爷兵，手里拿的是什么？崭新的步枪，还擦得锃亮！再看看我的孩子们手里拿的是什么？磨尖的钢管？生锈的铁片？\n凭什么？！\n传令下去，打赢了别光顾着高兴。去把战场打扫干净！枪、子弹、罐头、甚至她们的靴子和大衣，统统给我扒下来！\n别嫌死人穿过的晦气。在我的地盘，冻死饿死才是最晦气的！把这些好东西都带回来，我要让我的兵，穿得比那些贵族老爷还暖和！”"
PAM_ldrl_target:0 "§R谁想吃肉？§!§Y[FROM.Getflag][FROM.Getname]§!"
PAM_ldrl_target_desc:0 "“看看对面战壕里的那些兵。一个个瘦得像猴子，还要为了那些大人物的‘理想’、‘国家’去送死？真可怜。\n把我们的行军锅架到阵地最前沿去！把肉汤煮开！把白面包堆成山！\n然后冲着对面喊话：‘喂！穷鬼们！别替那些让你们饿肚子的老爷卖命了！过来吧！只要把枪口调转过来，索拉娜女王管你们饱！’\n我要把她们的底层人全都抢过来。因为只有我知道，一个穷人为了活下去，能爆发出多大的力气。”"
PAM_ldgc_target:0 "§1把炉子搬回家§!§Y[FROM.Getflag][FROM.Getname]§!"
PAM_ldgc_target_desc:0 "“我们打下了她们的城市。好极了。\n但我不要这空壳子。我的家在莉兰迪亚，我的子民还在那里等着过冬。\n把工厂拆了！把机器卸下来！把那些能冒烟、能造东西的铁疙瘩，统统给我搬上车！\n别管这城市以后还能不能运转，那是她们下辈子的事。我只知道，把这些炉子搬回家，我家里的火就能烧得更旺，我的孩子们就能少受点冻。搬！连一颗螺丝钉都别给她们留！”"
