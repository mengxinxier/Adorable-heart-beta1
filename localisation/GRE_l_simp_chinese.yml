#人物

 GRE_Iuno_desc: "此记录，为第127位谕女所有……其名尤诺。\n诞生于月亮沉没之夜，为先天型共鸣者，可用双眼▇▇▇▇。\n其声痕位于左脚脚背处，使用共鸣能力期间，身侧有类似月相的▇▇能量体环绕，发尾处出现局部透明光化现象，颜色与质感均与月光类似。\n\n§C她被命运以怎样的名义青睐，就被命运以怎样的方式裹挟。但她从未被打败，也不肯罢休。所以，看吧……看忤逆的谕女，因何不再回望，看万千因果之间，她如何以自己为唯一的解。§!"

 GRE_Iuno_desc_1: "§C尤诺§!\n@GRE§Y[FROM.Getname]§!的§C谕女§! \n§Y万千次虚掷的注视§!\n  - $MODIFIER_POLITICAL_POWER_FACTOR$：§R-15.00%§!\n  - $MODIFIER_RESEARCH_SPEED_FACTOR$：§G+15.00%§!\n  - $MODIFIER_POWER_BALANCE_WEEKLY$：[root.GetBopTrendTextIcon]§G0.5%§!"

 GRE_Iuno_Diplomacy_desc: "§C尤诺§!\n@GRE§Y[FROM.Getname]§!的§C谕女§! "

  GRE_Iuno_available_tt:"§C尤诺§!不是[GRE.Getflag][GRE.Getname]的副领袖。"
  GRE_Iuno_txt:"§C尤诺§!为我们谕出了前路。"
 
  GRE_Augusta_desc_txt:"奥古斯塔，出身法比亚纳，黑潮之下的遗孤，角斗场上的不败冠冕，诞于血与铁的无畏领袖。\n\n“作为「英雄」，我能满足十人的愿望，能满足百人、千人的愿望，可作为「总督」，我却无法为七丘实现任何愿景。但你，奥古斯塔，我听见了你的名字，从七丘之巅至七丘之底，从荣光的殿堂至简陋的街巷。无关贫富、无关强弱、无关阶级与立场，无数人因一个名字联系在一起。我想，在未来，这份联系将成为七丘新的力量。”这是上一任总督，「灭龙」的马格诺对这位七丘的「冠军」诺言。马格诺泯灭于黑潮之后，奥古斯塔这个名字像风一般在七丘的大地上飘散开来。\n\n春去秋至，总督宫的主座迎来了它新的主人。这尊吞噬了无数英雄的荆棘王座，正静静的等待着它的又一位主人，等待着又一位「总督」，等待着这张王座上的人，究竟会成为「英雄」，还是「英雄王」。\n\n奥古斯塔心中并无多少复杂的思绪。她不曾对任何人心怀恨意，她亲身领略过黑暗，却也知晓何为光明。她坐到了那张主座之上，亲手为自己戴上枷锁与荣冠。她将以平凡之躯成就辉煌，以剑锋诠释何为力量。"


  GRE_Aemeath_desc_1:"自我介绍吗……嗯，说些什么好呢。现在反而想不太出来了……\n\n§Q总之，等我，我一定会找到你——§!"
  GRE_Aemeath_desc_2:"有到了这个环节呢，哎~现在反而想不出太多了……可能是因为现在的我，依旧心满意足了吧。\n\n§Q继续朝着你期望的道路走吧，索拉里斯的救·世·主~在这条长路上，你永远不会再孤单。§!"

  GRE_Rover_desc_0:"TA在这里，一定在的，我能感受到TA的频率，所以，在找到你之前，我绝不会防手。\n\n在大海中捞针，可能会一无收获；但毫不作为，定会一无所有。"
  GRE_Rover_desc_1:""

  GRE_Rover_desc_2:"§Y漂泊者§!\n索拉里斯§g的§!§9救世主§!"

  GRE_Rover_desc:"§Q爱弥斯§!最珍贵的§Y家人§!"

