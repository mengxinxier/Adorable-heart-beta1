  GRE_Iuno_Tarot_desc_txt_1:"等到七丘不再需要奥古斯塔的时候，等到这片土地开始孕育新的「传说」，「英雄王」的故事——"
  GRE_Iuno_Tarot_desc_txt_2:"命运有太多本该如此，却从不会这样发生。\n命运有时太过有情，却变为永下不止的暴雨。\n§Y命运§!，总让人留恋过去，却总推人踽踽独行。"
  GRE_Iuno_Tarot_desc_txt_3:"“圣典曾言，苦难令我们更接近神，可我的孩子，我仍希望你的一生平安幸福。”"
  GRE_Iuno_Tarot_desc_txt_4:"守岸人，这就是我的名字。不是保守秘密、守护岸基的意思，而是说，守望着漂泊之人的人。"
  GRE_Iuno_Tarot_desc_txt_5:"§Q“我知道，只要抬头，那颗星总能找到我。”§!"
  GRE_Iuno_Tarot_desc_txt_6:"再生的新枝，本就很适合作为期待的开始。"
  GRE_Iuno_Tarot_desc_txt_7:"一生只为一副佳作的创作，珂莱塔见过很多……只是现在，请允许她一如既往地保持那小小骄傲。"
  GRE_Iuno_Tarot_desc_txt_8:"金色的太阳高悬于明净的天空，宽阔的城市街道一览无余——崭新的舞台已在她眼前铺展开。\n\n信风吹开了紧闭的箱门，内向的女孩将不再沉湎于箱中那区区世界。"
  GRE_Iuno_Tarot_desc_txt_9:"他是剧目的主角、舞台的焦点，他为故事更换面具、为观众带来欢笑。而在舞台之下，他不需要遮掩真心。"
  GRE_Iuno_Tarot_desc_txt_10:"索拉里斯仍有很多未知，等待我们一同去探索。"
  GRE_Iuno_Tarot_desc_txt_11:"§R胜利，就是竭尽全力。§!"
  GRE_Iuno_Tarot_desc_txt_12:"梦中的甘甜化开现实的咸苦，轻柔地安抚着身陷深渊的人们。"
  GRE_Iuno_Tarot_desc_txt_13:"所有的割舍与崩毁，并非终结，而是新的开端。\n她向前一步，走向新的未来。"
  GRE_Iuno_Tarot_desc_txt_14:"希望这种平静的生活能够继续下去，每个人都能各得其所。对我来说，这就足够了。"
  GRE_Iuno_Tarot_desc_txt_15:"陆止于此，海始于斯，我们的旅途还远未结束。"

