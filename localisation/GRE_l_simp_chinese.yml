#设定
 GRE_Local_History_Title: "希腊（黎娜汐塔）地区设定"
 GRE_his_page_01_title: "谕女与英雄王"
 GRE_Country_History_Page_01: "七丘人自古便被赐福与诅咒，狮鹫石城的四方殿内，七丘的谕女们窥察命运、记录预言。角斗场内，角斗士们与声骸为伴，争夺胜利与荣耀。但在元老院中，为总督议政参谋的“元老”早已不再心向七丘。\n自黎那汐塔于七丘城建国以来，总督已历五任，1912年，第六任总督上台，而后，便是那伟大战争。\n\n智慧的心在此可以思想，那七头就是女人所坐的七座山。\n又是七位王，五位已经倾倒了、一位还在、一位还没有来到。他来的时候、必须暂时存留。\n你所看见的那女人、就是管辖地上众王的大城。"
 GRE_his_page_02_title: "伟大战争的契机"
 GRE_Country_History_Page_02: "尽管在伟大战争前夕，黎娜汐塔仍是奥斯曼帝国名义上的附属国，但早在数十年前为摆脱其控制，早已与圣杯王国秘密签订了多条互助条约，1915年奥斯曼帝国加入中央同盟，黎娜汐塔的第六任总督马格诺立刻采取行动，与协约国联军攻入拉古纳城。至1918年，伟大战争结束，拉古纳-科孚一线重归黎娜汐塔。然而，在黎娜西塔人举国欢庆这场伟大的胜利时，巨大的海兽和残象潮袭击了拉古纳。马格诺总督在黑潮中下落不明，这对尚未在第二次黑潮后完全恢复的国度造成了新的破坏。与此同时，隐海修会重新登上政治舞台，她们尊圣女芙露德莉斯为“英雄”重塑教义，元老院为应对这突如其来的变故，不得以求助于谕女殿，以尽快找到新的英雄王当政以稳定政局。"
 GRE_his_page_03_title: "以呼啸之声向七丘致意"
 GRE_Country_History_Page_03: "源自七丘城的第七位英雄王——奥古斯塔，接手的是一个混乱不堪的国家，急切与修会斗争的元老院，缄默不言的谕女，虎视眈眈的周边国家，急切想要分割蛋糕的协约国领导者。奥古斯塔深知，如果不能再一年之内稳定住国家，向某一强国证明自己的中立与友好，那么整个黎那汐塔，这个在混乱中陷入混乱的国家，走向的未来只有一条——那就是成为列强餐桌上的配菜，和战败的中央同盟一起，变成列强们分食蛋糕的配菜。\n所幸，四方殿中，一个声音回应了奥古斯塔：尤诺——四方殿的127位谕女，传闻中的天才，在此刻与英雄王站在了一起，借助谕女的身份与资源，尤诺很快帮助奥古斯塔立下了远超前任总督的威严，元老院的声音再也无法盖过总督。但危机仍在继续，野心家们仍在暗处伺机而动，黎娜汐塔仍处于大国博弈的餐桌之上。1936年，是尤诺预言的变革之年，奥古斯塔需要抓住这个机会，为七丘，为黎那汐塔。"

 GRE_loca_his_t_01: "黎那汐塔"
 GRE_history_page_01: "黎那汐塔最初的文明，并不源自古老的王城雅典，也不源自新罗马君士坦丁堡，在传说中，黎那汐塔人的先祖为了从悲鸣中幸存，从另一片士地渡海迁徙而来，来到了欧洲东南部巴尔干半岛南端，这里岛屿众多，海岸线漫长，河流湍急，境内多山，缺乏开阔的平原。不论是从地形还是气候来看，这里都不是适合文明生存与发展的风水宝地。\n可就是在这样的环境里，她们硬是凭借着他们的智慧和毅力，在奇迹与魔法的帮助下开辟出了一片理想的生存空间——依此蓬勃发展，铸成了如今的黎娜汐塔文明，或者说，过去的黎那汐塔。"
 GRE_loca_his_t_02: "悲鸣往复"
 GRE_history_page_02: "频率不断，悲鸣不止。\n命运总是嘲弄着每一个向往幸福的人们，既使鼎盛如黎娜汐塔，在公元前于地中海挥斥方遒，也难逃悲鸣笼罩大地。公元300年，黑潮自拉古纳（今雅典）上岸，据记载，黑色的风暴自海的另一端袭来，遮天蔽日的黑色云海席卷大地，修会主座那不盖勒二世被鸣式利维亚坦侵蚀，人们呼唤她们的岁主英白拉多，但回应她们的只有沉默与死亡，所幸，一股外力，源自亚平宁半岛，罗马帝国的铁蹄与他的统帅君士坦丁踏入希腊，他们带来战争，带来鲜血，带来死亡，同时，也带来了黎那汐塔文明最后的一缕希望。324年，君士坦丁入主拉古纳，更名新罗马，同时，由君士坦丁牵头，全新的信仰流行于整个罗马文明——基督教。崭新的文明驱散了旧日的黑潮，这片命运多舛的大地，终于迎来了绵延千载的繁荣与安定。\n1453年，奥斯曼帝国总督穆罕默德二世亲率8万大军进攻新罗马帝国首都君士坦丁堡，鏖战五十余天，5月25日，正当战局形式倒向奥斯曼帝国，君士坦丁堡已是穆罕默德二世囊中之物时，异变再临，第二次黑潮自两军交战之处喷涌而出，千年未曾见过此番可怖造物的两国士兵毫无应对之策。5月29日，穆罕默德二世班师回朝，次日，新罗马帝国与奥斯曼帝国签订停战协定，君士坦丁堡如同烫手山芋般被丢来丢去，最终，二国划定方案，君士坦丁堡继由新罗马帝国管治，奥斯曼帝国不驻军，但享有军事通行权，并立特殊港口归奥斯曼帝国使用。\n1455年，新罗马帝国因各种原因行至崩溃，北面疆域被奥斯曼帝国接管，雅典城内，自诩罗马的贵族们再也无力撑起那张辉煌的牌面，“新罗马帝国”就此谢幕，往后四百年，奥斯曼与利维亚坦的阴影久悬于黎娜汐塔的天空之上。"
 GRE_loca_his_t_03: "晦暗不明"
 GRE_history_page_03: "据黎娜汐塔史料记载，1453年5月26日，第二次黑潮降临君士坦丁堡，鸣式利维亚坦再度踏上黎娜汐塔的土地，5月27日，奥斯曼帝国已无力抵抗黑潮造物，退兵至博斯普鲁斯海峡东岸，当晚，黑潮造物破开城门， 城内悲鸣不息。次日，君士坦丁堡已为空城，黑潮造物横穿爱琴海直指狮鹫石城，隐海修会圣女芙露德莉斯为了阻止黑潮而殉难。5月29日，修会主教牵头向奥斯曼帝国求和，30日，两国签订停战协定。与此同时，民众对修会的信任度已至冰点，1455年，雅典暴乱抽尽了帝国最后的气数，疆域多数被奥斯曼帝国“接管”，修会只得守着面前触手可及的领土，为神权统治的罗马帝国守着最后的颜面。\n18世纪，随着一声“上帝已死”传遍整个世界，点点火苗燃起了黎娜汐塔各地的干柴。饱受修会无能统治和黑潮肆虐的黎娜汐塔人民终结了修会的统治，她们推举“英雄”领导她们，渴望她们共选的英雄能带领她们走出黑暗的长夜，渴望看到那一丝黎明。\n但这种极具空想美感的幻想很快便被现实粉碎，北面，依然傲立于中亚的奥斯曼帝国陈兵马其顿，迫于压力，也为保全最后一丝尊严，黎娜汐塔人的“英雄”甘为人奴，而这位初代的英雄，在接受了奥斯曼帝国赋予的总督头衔后，君士坦丁堡也失去了它的光辉，“拉古纳”这个历史中的名字被再度捞起。\n而后，时钟拨转至1912年——"

