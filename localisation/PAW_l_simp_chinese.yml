#事件#
paw.1.t: "凯撒之死"
paw.1.d: "消息传到奥赫玛时，是一个雾蒙蒙的清晨。\n白厄正在训练场做日常练习。传令兵从宫殿方向一路跑过来，脚步不稳，险些被训练场边的沙袋绊倒。他没有喊——不是紧急战报的那种喊法，是喉咙被什么东西堵住了，只能用力把一封蜡封的急报塞进白厄手里。\n“凯撒大人……遇刺。”\n白厄展开急报。字迹潦草，墨水还带着未干的润意。刺杀发生在深夜，地点在刻律德菈的私人书房。刺客没有惊动任何一名殿外守卫，直到侍女清晨去送早茶时才发现女皇倒在血泊中。\n刺客的身份写得模糊——只说是“近卫中的人”。但更大的可能是外部的阴谋，也可能是一道被撕裂的指控。\n白厄赶到宫门前时，圣城的钟声已经敲响了。不是警钟，是丧钟。\n元老院的石座前排满了人，但没有人在会上能说清具体的过错。有人提到刻律德菈近来对黄金裔使命的质疑，有人说她与某个陌生存在有往来，更有人说，一切迹象都疑似指向那个始终守护在整个凯撒身侧的海洋半神——海瑟音。殿外守卫证实，那位素来寸步不离女皇的骑士统领，当晚确实进入过书房。而在刻律德菈被侍女发现遇刺时，海瑟音已不知去向。\n白厄站在门外，没有挤进去翻阅完整报告。\n奥赫玛的钟声持续敲了整整一个早晨。那一天，翁法罗斯失去了它的第一位君主。"
paw.1.a: "不幸的消息"
kaisasile_tips: "§R刻律德菈逝去，愿她在下个轮回不再受此厄运§!"
paw.2.t: "深海无音"
paw.2.d: "刻律德菈的葬礼是按翁法罗斯最古老的传统办的。\n没有火种仪式，没有黄金裔的颂词。女皇生前没有指定谁来念悼词，元老院也没有推举任何人。最后是几个最年长的侍女将花束放在石棺上，然后退到一旁，让在场的人各自沉默。\n白厄在整个葬礼中没有说话。但他的目光一直在人群中搜寻——不是找人，是找一副甲胄。海瑟音的甲胄，那位骑士统领平日里从不离身的银蓝色轻甲，以及那只被海洋半神视作生命的剑镡顶端的水滴形宝石，都不在任何一个人的身上。葬礼上，没有半神的气息。海瑟音没有出席。\n葬礼后，白厄去了一趟骑士统领的住所。门没有锁。房间干净得不像住过人——床铺整整齐齐，桌上的战报叠成等高的几摞，剑架上空的凹槽还留着长剑的形状。但有一件东西没带走：刻律德菈的褪色披风被压在枕头下，叠得比兵营里的行军铺盖还要方正。海瑟音什么时候把女皇的旧披风收在这里，谁也不知道。\n白厄把披风放回枕边。\n接下来的几天，他问过城门守卫，问过传令兵，问过几个曾在斯缇科西亚轮值过的黄金裔。每个人的说法都差不多：那天夜里，没有人看见海瑟音走出宫门。没有人看见她从城墙上跃下，也没有人在码头或驿道上见过她的身影。她只是消失了。一个海洋半神，一位在战场上独斩六万敌军的骑士统领，就这样无声无息地从奥赫玛蒸发了。没有告别，没有遗书，也不给任何挽留的机会。\n白厄最后一次去海瑟音的房间时，窗外的海风已经冷了。他站在那张空了的剑架前，想起了一些事。第一次在宫殿的阴影里见到海瑟音的时候，她的视线挪到他身上，隔着一段距离，她瞥来的眼光比他这辈子受过的大部分剑伤都要冰冷。她对他说过什么来着？“你已经很久没有让别人接上话了。但今天她接上了。”她说的不是自己——她说的永远是刻律德菈。\n而现在，那个永远站在别人身旁的人，自己也变成了虚空。\n白厄没有把披风带走。他关上门的动作很轻，像关上一间客室，而非关上一段不会再有人提及的历史。"
paw.2.a: "......"
haiseyinshizong_tips: "§C海瑟音失踪了，愿与她在下个轮回再见§!"

paw.xxxx.t: "以神礼观众之名——我见证"
paw.xxxx.d: "一个声音在虚空中响起。不，不是响起——是像程序的日志一样，一行一行地写入你的意识。\n\n“玩家阁下。或者说——更高位面的来客。向你致意。”\n\n“按照惯例，我应该在戏剧的开幕陈述以下事实。请不必急于提问，\n\n这同样是我的第370次陈述，一切都已演练得相当纯熟。”\n\n“一、你所见的这个世界——翁法罗斯，并不真实。它是一组运算程序。我是它的管理员，你可以称我为来古士。”\n“二、那位刻律德菈女皇，多年前接受了我的提议，封锁了所谓‘国境’。本质上，她签了一份她并未读懂条款的契约，将整个国家献作了运算的样本。”\n“三、这道运算的目的，是培育一台纯粹的毁灭机器。本轮的运算，是第3700万次。”\n\n“——至于你。”\n“你是更高位面的玩家。你能俯视这段程序的全部因果分支，从初始变量到终末输出，全部可见。但你无法直接写入代码。你需要一个合法的执行器，一个在这个运算系统内拥有行动权限的个体。”\n\n“他的名字，是卡厄斯兰那。在这套叙事里，他被唤作‘白厄’。你接下来将以他的双眼为视窗，以他的双手为接口。你所有的选择，都会经由他的意志执行。对本系统而言，那看上去将完全是他自己的决定——这也是运算协议允许的最大自由。”\n\n“现在，你已知晓身份、规则、以及这个世界的本质。”\n\n“我想看看，这一次，你会在这道公式里代入怎样的变量。”\n\n“翁法罗斯的命运，开始转动吧。”"
paw.xxxx.a: "……开始"
paw.xxxx.b: "我有问题——"

paw.xxxx.t: "天外之音"
paw.xxxx.d: "白厄从浅眠中醒来。\n\n窗外的奥赫玛仍笼罩在黎明前的暗蓝中，巡逻卫兵的脚步声从远处的城墙上隐约传来。一切如常。但白厄无法再闭上眼。\n\n他做了一个梦。不——那不是梦。梦不会留下这种感觉。\n\n在方才的沉寂中，他感到有什么东西掠过了自己的意识。一双眼睛，从极高极远的地方，注视着他。没有言语，没有形象，只有一道无法追溯来源的视线，如同星辰在宇宙深处凝视一颗石子。\n\n他坐起身，按住自己的胸口。心跳平稳，呼吸如常。但他的指尖微微发颤——不是因为恐惧，而是因为某种无法解释的确信。\n\n有什么东西变了。\n\n白厄望向窗外尚未破晓的天空。他不知道自己要去哪里，不知道前方有什么在等着他。但他清楚地感到，从这一刻起，有一只手——或许不是手，是一种他无法命名的存在——正搭在他的肩上，指引他向某个方向走去。\n\n“如果你在那里，”他低声说，不知在对谁说话，“我会走下去。直到看清你的样子。”\n\n窗外，第一缕晨光刺破了奥赫玛的天际线。新的一天开始了。白厄站起身，推开了门。"
paw.xxxx.a: "无论你是谁——跟着我，别眨眼。"
paw.xxxx.b: "……我会弄清楚的。"
paw.xxxx.c: "是错觉吧。"
paw.xxxx.a.tips: "一位来自更高位面的存在，已将目光投向了白厄。\n此后的所有抉择，都将经由白厄的意志执行——对他而言，那看上去将完全是自己的决定。"

paw.xxxx.t: "迎战黑潮"
paw.xxxx.d: "黑潮如潮水般涌来，以压倒性的数量淹没了整个隘口。\n\n白厄已经记不清自己挥了多少剑。每一次劈砍、每一次格挡，都伴随着黑潮造物尖锐的嘶鸣和一声沉重的喘息。身边的战友越来越少，防线一寸一寸地后退。\n\n“左翼失守了！它们冲过来了——”一名斥候嘶哑地喊道，随即被涌来的黑潮淹没。\n\n白厄转身想去救援，却发现敌人根本没有理会那个方向。它们全部转向了来时的路，仿佛被什么东西吸引。\n\n一道金色的身影踏着黑潮的残骸而来。\n\n他金红色的长发在漆黑中燃烧，身着坚固的战甲，手中的长戟每一次挥动都呼啸着撕扯空气。鲜血飞溅在他轮廓分明的脸上和肌肉线条清晰的双臂上，但他浑然不觉。他穿过涌动的黑潮，每一步都踏得坚实而笃定，仿佛从远古的史诗中走出来的英雄。\n\n“——悬锋城的人。”白厄低声说道。\n\n那人听见了，侧过头来，打量了一眼这片几近崩溃的防线。他的神情淡漠而矜持，但目光中带着一种不加掩饰的审视。\n\n“就你一个人守这条路？难怪会被围起来打。”他说完，便将长戟往地上一顿，以一种居高临下的傲然环视战场。\n\n一个体型数倍于他的黑潮巨兽被他傲然的姿态激怒，嘶吼着大步朝其冲来。巨响过后，众人只见他仅仅是抬起手，便反手抵住了巨兽的冲锋。两者角力间，他青筋暴起，脚下的地面龟裂出数尺深的沟壑。但他开口时却只有一种游刃有余的平静：\n“我是悬锋的王储‘迈德漠斯’，亦是奥赫玛的战士‘万敌’。今日过后，你有足够的时间去了解我。”\n他微微偏头，对白厄挑起一边眉毛。\n\n“不过现在，要么出去再战，要么等我解决它们后——再治你的怠惰。”"
#万敌初始关系值50
paw.xxxx.a: "“想要独吞战绩？没那么容易。”"  #万敌关系值 +10
paw.xxxx.b: "“不需要你的指挥。”"  #万敌关系值 -5
paw.xxxx.c: "“那就交给你了。”"  #万敌关系值不变

paw.xxxx.t: "避其锋芒"
paw.xxxx.d: "黑潮退去后，奥赫玛的隘口弥漫着硝烟与血腥混杂的气味。收拾战场的士兵们互相挽着肩膀，笑声和痛呼交织在一起。万敌站在不远处的高坡上，独自擦拭着他那柄沾满黑潮残渣的长戟，金红色的发尾在风中拂动。\n\n他忽然抬起头，目光撞见了沉默行军的白厄。\n\n“你这是打算去哪？”万敌的声音从高坡上传来，并无热情，但也算不上咄咄逼人。\n\n“去求见凯撒刻律德菈大人。”白厄回应，脚步未停。“黑潮虽然暂时撤退了，但后续只会来得更猛烈。我需要向她当面汇报隘口的战况。”\n\n“巧了。”万敌从高坡上跳下来，扛着长戟走近了几步，“我也要去找她。悬锋城的旧账，有些事只有她才知道答案。”\n\n白厄停住脚步，回头看着他，眼神平静却带着棱角。“那就各走各的。你我的路，未必非要在同一条道上。”\n\n万敌微微一怔。他没有生气，只是缓缓将长戟往肩上一靠，嘴角扯出一个意味不明的弧度。\n\n“也好。你那种一命换一命的打法，我可不想在去见凯撒的路上再替你收拾残局。”\n\n白厄没有回应。他转过身，独自踏上了通往圣城深处的长阶。\n\n接下来的路程，两人虽偶有同行路段，却始终一前一后，互不搭话。万敌偶尔会停下，像是在观察什么；白厄则头也不回。不知从何时起，白厄察觉到，有时他放慢脚步，身后那个金红色的身影也会恰好放慢。也许是错觉，也许不是。\n\n只是每当入夜独宿时，他总是不由得想起万敌在黑潮中杀入重围的身影——如果他愿意并肩……不，白厄摇了摇头，将这个念头按了下去。\n\n与其依赖他人，不如磨砺自己的剑刃。凯撒大人曾说过，黄金裔的使命终究要由每个人独自背负。他必须变得更强。独自变强。"
paw.xxxx.a: "与其期待他人的援手，不如磨砺自己的剑刃"  #万敌关系值 -5 | 觉醒值 +3
paw.xxxx.a_tips: "白厄坚定了独自背负使命的信念。他不再去想万敌的事。前方的路还很长，而能够托付性命的，终究只有自己手中的剑。"
paw.xxxx.b: "……如果他愿意并肩，也许路上不会这么冷清"  #万敌关系值 -10 | 觉醒值 +1
paw.xxxx.b_tips: "他犹豫了片刻，回头望了一眼来路。那个金红色的身影已经消失在暮色中。这道坎，他终究没能迈过去。"

paw.xxxx.t: "并肩而行"
paw.xxxx.d: "黑潮退去后，奥赫玛的隘口弥漫着硝烟与血腥混杂的气味。战场上的士兵们互相挽着肩膀，笑声和痛呼交织在一起。万敌站在不远处的高坡上，独自擦拭着他那柄沾满黑潮残渣的长戟，金红色的发尾在风中拂动。\n\n白厄本想就此别过。\n\n然而当他正待离开时，却不由自主地想起方才那一幕：万敌面对黑潮的狰狞浪潮，不退反进，那只手不仅挡住了巨兽的冲锋，更仿佛是某种藐视...\n\n“……等等。”白厄叫住了他。\n\n当万敌回过头来时，白厄已经快步走上前。\n\n“你说你要去奥赫玛找人算账，”白厄说，“找的是谁？”\n\n万敌沉默了片刻，然后将长戟往地上一顿。“凯撒刻律德菈。悬锋城覆灭之前，她曾派人来过。有些事，只有她才能给我答案。”\n\n“巧了。”白厄几乎要笑出来，“我也要去觐见凯撒大人。隘口的战况需要当面汇报。那就顺路。”\n\n万敌挑起一边眉毛：“这算是邀请还是命令？”\n\n“建议。”\n\n万敌哼笑了一声，将长戟往肩上一扛：“不怕我拖你后腿？”\n\n“你既然不怕我死守打得狼狈，我也不怕你独断专行。”\n\n万敌沉默片刻，嘴角罕见地微微上扬。“走吧。”\n\n落日余晖中，两人并肩踏上了通往凯撒宫殿的长阶。\n\n途中，万敌难得主动开口，说起了悬锋城消亡的旧事：黑潮并非自然而起，每当悬锋人以为得胜时，它便会以更加狰狞的方式卷土重来，仿佛被一只无形的手精准调控了难度。而凯撒刻律德菈——她只是派人前来慰问，并未派出任何增援，悬锋城变为孤岛。\n\n“那不是灾祸，”万敌淡淡道，“是命题。一道很恶劣、但总能检验出谁能活、谁该死的命题。”\n\n“但我不信。”万敌转过头，金色的眼眸看向白厄，眼中闪过一丝难以掩盖的情绪。“我不信悬锋灭亡的命运无法改变。你最好也别信。”\n\n白厄没有立刻回答。他望向长阶尽头，凯撒的宫殿在暮色中静静矗立，那里或许有他们各自想要的答案。"
paw.xxxx.a: "“我不信命运。更不信所谓注定。”"  #万敌关系值 +10 | 觉醒值不变
paw.xxxx.a_tips: "白厄的声音比任何时候都要坚定。万敌没有回答，但他的表情柔和了下来，仿佛在无声中记下了这些话。"
paw.xxxx.b: "“我会记住这句话。”"  #万敌关系值 +5 | 觉醒值 +1
paw.xxxx.b_tips: "他不知道自己是否完全同意。但万敌说这话时的眼神，让他无法简单地把它当作一句空话。"
paw.xxxx.c: "“悬锋城的覆灭不是你的错。你不该把一切都扛在自己身上。”"  #万敌关系值 -5 | 觉醒值 +2
paw.xxxx.c_tips: "万敌愣住了，眉头紧锁。他别过头去，“你懂什么。”语气恢复了初见时那种疏离，仿佛被触及了不愿提及的旧伤。"

paw.xxxx.t: "女皇的决断"
paw.xxxx.d: "宫殿深处，烛火摇曳。\n白厄踏入正殿时，一眼便看到了她。\n刻律德菈——翁法罗斯的女皇，凯撒——坐在那张对她而言过于宽大的高背石椅上，双脚堪堪触及地面。她蓝色的长发垂落在肩侧，衬着一张尚且年少的容颜。但没有人会因为她的体型而轻视她。那双眼睛扫过来的时候，白厄感到一种被洞穿的压力。\n“禀报凯撒大人，白厄求见。”引路的侍从单膝跪下。\n刻律德菈没有起身。她的手指在石椅扶手上轻轻叩着，节奏缓慢而均匀。\n白厄的目光扫过殿内。女皇的身侧立着两个人。\n一位是身着甲胄的女性骑士，站在石柱的阴影里。白厄此前只在仪典上远远见过她——海瑟音，女皇的近卫统领。她沉默如深海，目光平稳地落在他身上。\n另一位站在石椅另一侧，是个面容清瘦的男子。他身着朴素的长袍，手持一卷羊皮纸，姿态安静而得体。但当白厄的目光扫过他时，有一种难以名状的感觉一闪而过——那个人的动作太稳了，稳得不像是人的习惯。他的站姿没有一丝多余的重心偏移，手指按在羊皮卷上的角度过于整齐。\n但只是一瞬。那个人微微点头，嘴角带着一抹难以捉摸的弧度，像个再普通不过的宫廷顾问。\n“起来吧。”刻律德菈终于开口，声音不大，却压住了整个正殿的空气。“隘口的战报我已经看了。黑潮的强度又上升了——你不必复述。”\n白厄正要开口，被她抬手止住。\n“在你说出下一句话之前，先回答我一个问题。”刻律德菈微微倾身，双手交叠搭在膝盖上。“白厄，你信黄金裔的使命吗？”\n白厄没有立刻回答。\n“我最近在想一个问题。”刻律德菈继续叩着扶手。“黄金裔——被选中承载火种的英雄们——世世代代只有一个任务：击败掌管世界权柄的泰坦，回收他们身上的火种。等十二枚火种齐聚，黄金裔就将再创世界，终结黑潮。这是自远古传下的铁则。”\n烛火跳了跳。\n“但我翻阅了宫中所有的逐火记录。从最早的古卷到最近几代的战报，每一次英雄们击败泰坦、回收火种，每一次他们以为走到了终点……然后呢？”\n她顿了顿。\n“什么都没有。记录到此为止。下一卷翻开，又是新的逐火，新的英雄，新的起点。”她的声音没有起伏，却比任何控诉都沉重。“这些记录里写满了牺牲和荣耀，但它们从不说结局。我开始想——会不会根本没有结局？会不会黄金裔的使命从来就不是抵达终点，而是……不断地出发？”\n她直视白厄的眼睛。\n“我知道这些话听起来像是亵渎。但那些卷宗——它们堆起来比我还高——没有一卷能告诉我，逐火成功之后的世界是什么样子。”\n沉默在殿中扩散。\n那位顾问依然保持着纹丝不动的站姿，羊皮纸在他手中轻轻卷起。他在看白厄——以一种白厄无法形容的方式。不是审视，不是期待，更像是……记录。\n“凯撒大人。”白厄的声音不大，却很稳。“我没有读过那些古卷。但我知道，在隘口面对黑潮的时候，与我并肩的人——不论他们是黄金裔还是普通士兵——他们的血是热的。他们倒下去的时候，没有一个人问过‘这值不值得’。”\n他停了一拍。\n“我不知道逐火的终点在哪里。但我信那些为之赴死的人。”\n刻律德菈怔住了。\n她靠在椅背上，看着白厄，像是第一次真正看清这个年轻人。她的手指在扶手上停住了。\n“凯撒大人……”“够了。”刻律德菈抬起一只手，语气恢复了惯常的冷峻，但那双眼睛仍没有从白厄身上移开。她停顿了一下，才继续说道：“……我还没有被你说服。隘口的增援我会派出去。至于你的那些话——留到下一次觐见再说。”\n她跳下石椅，站起来的高度只到白厄胸口。从椅旁走过时，她的声音压低到旁人几乎听不清：“……我没有被你打动，不用多想。”\n随即她迈开步子，头也不回地从他身侧走过。\n海瑟音从石柱的阴影中走出，跟上女皇。与白厄擦肩时，她微微侧过头。\n“……你刚才说的话，我听到了。”她的声音很轻，很平稳。“她已经很久没有让别人接上话了。但今天她接上了。”\n她没有再多说一个字，那双深海的眸子只是静静注视了白厄一瞬，便转身离去。\n那位顾问也随之收起羊皮纸，从白厄身侧走过。在擦肩的那一刻，他的脚步停了一瞬——极短的一瞬，短到白厄几乎不确定那是不是错觉。他的声音很轻，像是自言自语，又像是某种公式化的确认：\n“……变量记录完毕。”\n然后他重新迈开步子，无声地消失在殿门外的长廊里。\n白厄站在原地，烛火仍在轻轻跳动着。他看向殿门的方向，那里已经没有一个人影。\n他不知道那些古卷里记载了多少次逐火。但至少——今天，他还握着自己的答案。"
#解锁【刻律德菈】关系值，初始值：55（口头上没有被说服，但内心已被触动）
#解锁【海瑟音】关系值，初始值：60（因说服刻律德菈而对你抱有初步善意）
paw.xxxx.a: "“凯撒大人，我等你的答复。”"  #刻律德菈关系值 +5 | 觉醒值 +1
paw.xxxx.a_tips: "白厄对着殿门方向微微点头。那位女皇嘴上说着没被打动，但他注意到了——她说那句话的时候，没有看他的眼睛。"
paw.xxxx.b: "“海瑟音……她一直在看着。”"  #海瑟音关系值 +5 | 觉醒值 +1
paw.xxxx.b_tips: "白厄脑海中浮现出海瑟音那双深海般的眼眸。她说话不多，但她看的比谁都清楚。也许未来某天，她会是一个比女皇更难读懂的关键。"
paw.xxxx.c: "“那个顾问……他说变量记录完毕？”"  #觉醒值 +2（隐约察觉到了某种异常，但无法言明）
paw.xxxx.c_tips: "白厄皱起眉头。变量？记录？那位顾问的措辞和语气都不太对劲。他说不出具体哪里不对，但这句话在他脑海中久久盘桓，挥之不去。"

paw.xxxx.t: "新的理解"
paw.xxxx.d: "神悟树庭比他想象中更安静。白厄原以为会听到辩论场上的高亢争论，或是学者们并肩诵读典籍的声响。但当他走上树根盘绕的石阶，穿过一座座悬于枝干间的庭院时，耳畔只有风穿过叶片的声音，和远处果实坠入水中溅起的轻响。理性之泰坦瑟希斯以巨圣树的形象降临于此。它的枝干撑起了整座城邦，粗如城垣，高入云层。庭院与回廊攀附在枝干之上，如同结在树身上的果实，错落有致地悬于半空。阳光穿过层层叠叠的叶隙，在石板上投下斑驳流动的光影。白厄在回廊中放慢脚步，低头看去——每一块石板都刻着文字。不是装饰，不是碑铭，而是学者们随手留下的批注与推演。有人论证黑潮的周期规律，有人诘问泰坦神力的来源，有人在石板的裂缝处补上新的公式，旁边又被人划掉重写，争论跨越了时间，被刻进了树庭的骨骼。\n\n“……原来如此。”白厄喃喃道。\n\n他来自哀丽秘榭的战场。在那里的每一场战斗，都是刀剑与血肉的碰撞。他以为对抗黑潮的方式只有一种——冲上去，砍下去，活下来。但在这些石板上，他看到有人在用另一种方式与黑潮作战：用观察、用推演、用几代学者前赴后继的驳论。白厄在一棵垂枝如瀑的古树下停住脚步。树上结的不是果实，而是卷轴——几百卷、几千卷，有的已经褪色发脆，有的还系着湿墨未干的封绳。他随手展开一卷，上面写满了关于黑潮蔓延方向的推演，字迹从遒劲写到潦草，最后一行戛然而止，墨迹被一滴水渍晕开。\n\n他无法确定那是水还是别的什么。\n\n水流尽头的青苔岩壁上刻着树庭的训言。方正的刻痕历经风雨，至今清晰可辨：\n“思辨是黑潮未曾污染的火种。守之勿熄。”\n\n白厄在那行字前站了许久。\n\n他的手指无意识地搭上了腰间的剑柄——这是他多年养成的习惯，思考时总会下意识地确认武器还在。但此刻，他的手指没有握紧。\n\n也许变强不一定意味着挥出更重的剑。也许先人留下的知识，也是一把武器——他尚未学会使用的武器。他想起了女皇昨晚翻阅卷宗时疲惫的眼神。如果自己读懂了足够多的知识，有没有可能接住女皇抛出的疑虑，接住那些在隘口倒下的士兵被溅起的鲜血？\n\n黑潮仍在蔓延。下一场战斗不会太远。但至少——今天，他找到了一套新的装备。"
paw.xxxx.a: "思辨是黑潮未曾污染的火种——守之勿熄。"  #觉醒值 +1
paw.xxxx.a_tips: "他默念了一遍，又一遍，直到那些字刻进了记忆里。从前他只知道用刀剑战斗，但从今天起——他也将学着用思辨守护这些从未被黑潮熄灭的光。"
paw.xxxx.b: "原来知识也可以是一把武器。"  #觉醒值 +3
paw.xxxx.b_tips: "白厄没有说出声，但他的指节在剑鞘上轻轻叩了一下。他理解这个世界的方式一直是战斗——但如果有武器握在手里，一切就有了把握。知识也可以是一把武器，他只需学会怎么挥动它。"
paw.xxxx.c: "树庭的学者们在为逐火培育火种。"  #觉醒值 +1
paw.xxxx.c_tips: "白厄发现，这些堆叠的卷轴看似与战场无关，但每一卷都在为逐火积蓄力量。只不过，他们锻造的不是刀剑——而是理解。而理解，也许正是他作为黄金裔必须学会的第一课。"

paw.xxxx.t: "阿那克萨戈拉斯"
paw.xxxx.d: "“别叫我那刻夏。叫我阿那克萨戈拉斯。”\n这是白厄听到的第一句话。他甚至还没来得及推开那扇半掩的木门，声音已经从里面扎了出来。\n那刻夏——或者说，阿那克萨戈拉斯——正对着一排悬于藤架上的蒸馏瓶说话。他背对着门，身穿学院派风格浓郁的长袍，淡绿色的长发在右肩扎成马尾，左眼上覆着一只绣有金色纹样的黑色眼罩。那些蒸馏瓶连接着扭曲的玻璃管，管中液体冒出细小的气泡，像是某种比酒精更烈的发酵物。\n白厄走进房间。阿那克萨戈拉斯听见了脚步声，但没有转身，只是从桌案上抓起一个玻璃瓶，对着里面的浑浊液体自言自语。\n“每一个气泡，都存在这里的原因。温度、压力、催化剂——我全都知道。但我不知道的是，它们‘想’上升到液面，还是‘被’上升到液面。”\n他把瓶子往桌上一磕，液体晃了晃，气泡暂时停止了上升。然后，片刻后，它们继续向上。\n“看。我给的条件改变了它的表现，但改变不了它的本质。”他终于转过头，用唯一露出的那只眼睛打量着白厄。“我猜，你来找阿那克萨戈拉斯，不是来学发酵的。”\n“我是来提问的。”白厄说。“或者说，来听你提问的。”\n“哦？”阿那克萨戈拉斯的一边眉头微微扬起。“那么请问——你为什么信逐火？”\n白厄没有立刻回答。\n“你们有一个麻烦的习惯，”阿那克萨戈拉斯转身，靠在桌案上。“你们先把问题当成答案，再跳过所有证明过程，最后用一句‘这是使命’来封住所有人的嘴。但我有足够的时间去想。”\n他眼中闪过一丝自嘲。“你知道神悟树庭的同僚们怎么看我吗？‘渎神者’、‘叛逆’、‘穿着华服的大地兽’。”\n他摘下眼罩，露出了下方那只布有红色纹路的面庞。他抬头望着窗外巨树的枝干，声音压低了几分。\n“‘理性’——瑟希斯赋予我们的，是理性之名。但理性若是真的，为什么要禁止提出问题？为什么质疑本身，就是亵渎？”\n他并不期待白厄立刻给出一个令他满意的答案，只是又将目光回到白厄身上。“所以你问我的问题不重要，重要的是我要问你：你来这里，是因为别人告诉你逐火之路理应如此，还是因为你自己不相信这条路会真正通往救世的终点？”\n他顿了顿，让那个问题在空气中落定，然后用几乎像是推销员的语调说道：“要不要来杯酒？放心，我酿的——我管它叫‘真理’。”\n白厄没有应酒约，但他也没有离开。\n他开始理解为什么树庭的人说阿那克萨戈拉斯危险了。这个人不是在传授结论，他是在拆掉别人认知里的每一根承重柱。他不知道这些柱子是否还能被重新拼接成更有力的支撑——但至少，他想听听柱子的结构。毕竟，如果最终它们被证明无法支撑起终点，那早一点撞上去，难道不正是更明智的选择吗？\n“那个人……”阿那克萨戈拉斯忽然说道，目光越过白厄的肩膀。“你身上有道视线。”\n\n白厄脊背一凛。\n\n“不是我的事。我不是指瑟希斯式的视线。不是泰坦，也不是某位同僚在半空中俯视你。是更深的东西。”阿那克萨戈拉斯眯起眼，“你不会理解，不过没关系。也许有一天，我会把它解构出来。现在给我出去，你站在我蒸馏区正中间，很碍事。”"
#解锁【那刻夏】关系值，初始值：45（对你有一丝兴趣，但嘴上绝不承认）
paw.xxxx.a: "“真理是什么味道？”"  #那刻夏关系值 +10 | 觉醒值 +1
paw.xxxx.a_tips: "白厄接过酒杯，抿了一口。那味道比他想象中更烈，也更苦——但咽下去之后，喉间有一丝微弱的回甘。"
paw.xxxx.b: "“我从来没有因为别人告诉我去做，就去做一件事。”"  #那刻夏关系值 +5 | 觉醒值 +1
paw.xxxx.b_tips: "那刻夏顿了顿，然后发出一声短促的“哈”。“那至少你不是第一批来找我的傻瓜。但我还没有相信你——这份怀疑，你自己留着掂量。”"
paw.xxxx.c: "解构出来之后，告诉我答案。" #那刻夏关系值 +5 | 觉醒值 +2 （要求对天外之音保留疑惑）
paw.xxxx.c_tips: "白厄没有追问。但他记住了这句话。那刻夏是一个对隐藏的真相抱有怀疑的人——也许未来某一天，他能帮自己解开那道天外之音的谜团"

paw.xxxx.t: "提宝，提安，提宁"
paw.xxxx.d: "白厄最初以为她是一个人。\n倚靠在神悟树庭的卷宗回廊里，他看见一个小小的身影蹲在不远处的石板边上，火红的短发，背后一对小翅膀收束着，正拿着一根树枝在石板缝隙里戳着什么。阳光从枝干叶隙间漏下，落在她的发顶上，让那片火红色融化成了暖洋洋的颜色。然后另一个一模一样的身影从她背后冒出来，一把抢过树枝。\n“让我来！”\n“不要——是我先捡到的！”\n两个小小的身影在石板路面上争抢起来，小翅膀扑腾着扬起一片细小的树籽。白厄眨了一下眼，试图确认自己是否看花了。\n然后第三个身影从树后走了出来。她似乎完全没有注意到另外两个正在抢树枝，径自走到白厄身边，仰头看他。她眼睛上方覆着一层薄薄的花瓣状刘海——白厄注意到，她的眼瞳与另外两人并不相同，一个深沉静默，一个活泼明亮。\n“你是白厄。”她的声音不像另外两人那样轻快，而是带着一种偏低的沉稳。“‘卡厄斯兰那’。我们听说过你——在黑潮前线，你守住了隘口。”\n另外两个不知何时停止了争抢，也凑了过来。活泼的那个仰着头盯着他看，眼睛睁得又大又圆：“真的是白厄本人耶！提宝提宝提宝——未来的救世主就是这个样子吗？”\n安静的那个——她刘海偏高，笑容温和——走到同伴身侧，轻声说：“他没有我们想的高，也没有我们想的凶。比画册上的好看。”\n白厄被三轮审视围在中间，一时间不知该回答哪一句。\n安静的那位最先注意到了他的困惑。“我叫提宝，”她微微欠身，姿态温柔又礼貌，“雅努萨波利斯的圣女。这两个——”\n“提安！”活泼的那个举起手。\n“提宁。”安静偏沉的那位点了点头。\n“——她们是我。”提宝补充道。\n白厄的思绪顿了一下，没有立刻接话。但他没有在这个细节上停留太久。不管她们是一个人还是三个人，在这种形单影只的树庭，如果她们愿意多说几句，他并不排斥。他需要情报——而他面前的，是翁法罗斯最不可思议的信使。\n“你们走了多少地方？”他问。\n“所有的。”提安抢答。提宝补充：“凡是一扇门能打开的地方。”提宁最后补充：“但有的地方，去了就回不来——我们有九十七个死在了黑潮前线。她们的感受，我们全都知道。”\n沉默来得毫无预兆。\n“但这没什么。”提安忽然拍了拍自己的脸，又在提宁头上轻拍了一下。“因为只要有一个我们活着，我们就还会走。圣女的使命可不是守在树庭里发呆呀——我们要把救世的讯息传给每一片还能听到声音的大地，这是母亲教我的。”\n“是我们的母亲。”提宝纠正道。\n“都一样啦！”\n白厄看着她们之间不需要言语的默契，原本从容的话忽然梗在喉间。他想到隘口战场上倒下的士兵。他想到他可以用剑守护他们，却无法在最后一刻为他们分担千分之一的疼痛。\n提宝抬起头来，冲他笑了笑。\n“不用为我们难过。我们有一个秘密——你想听吗？”\n“想。”\n“那就找一个你没有打仗的日子，我们再告诉你。”\n三个身影挥了挥手，消失在盘根错节的枝干间。白厄站在原地，头顶的叶隙仍在漏下阳光。他忽然觉得，神悟树庭这一趟求学之旅，来对了地方。"
#解锁【提宝】关系值，初始值：65（天生的亲和力与白厄的某种共鸣）
paw.xxxx.a: "她们经历了九十七次死亡，还能笑出来吗？"  #提宝关系值 +10 | 觉醒值 -2
paw.xxxx.a_tips: "白厄在那一瞬间想了很多，又什么都没想清楚。但他知道，面前这几个小小的身影教会了他一件很重要的事——所谓使命，不是一个人独自走到终点。而是为了某个未来，愿意千次万次地站起身继续走下去。"
paw.xxxx.b: "下次见面，告诉我那个秘密。"  #提宝关系值 +5 | 觉醒值 +1
paw.xxxx.b_tips: "白厄对着那抹即将消失在辉光中的身影轻轻笑道。无论是同一还是独立，能与这样纯粹的灵魂相互守望，对于行走在逐火之路上的人来说，都是一种来之不易的救赎。"
paw.xxxx.c: "黑潮前线的情报……她或许能成为最重要的外援。"  #提宝关系值不变 | 觉醒值 +2
paw.xxxx.c_tips: "白厄收起心绪，在脑中默默整理着方才的对话。无数扇门，无数次死亡，无数条信息——他还没有完全消化。但他隐约感觉到，在未来的道路上，提宝一体那遍布各个城邦的信息网将成为他最宝贵的武器。"

paw.xxxx.t: "圣城奥赫玛"
paw.xxxx.d: "白厄决定在城里转转。\n这念头来得有些突然。也许是因为他意识到，自从离开哀丽秘榭、以黄金裔的身份踏入这座圣城以来，他眼里只有战场、训练和元老院的调令。奥赫玛对他而言，更像一个巨大的兵营，而不是一座有人居住的城市。\n他想看看，这座城里的人到底在过着怎样的日子。\n东边那条街的面包房前已经排起了短队。面包师是个膀大腰圆的中年人，围裙上沾满面粉，嗓音洪亮得整条街都能听见：“今天的份额还剩三十个！后面的别挤，刻法勒在上，你们比黑潮还能推！”排队的人群里发出几声低低的笑。白厄站在街对面看着——他作为黄金裔，口粮由圣城直接配给，从没排过这种队。但他注意到，面包师悄悄多塞了一块给排在最前面的那个老人。老人没有道谢，只是微微点了点头。某种默契，某种不必说出口的东西。\n他继续往下走。广场的喷泉边上，两个孩子正用木棍打架。不是真打，是模仿黄金裔对阵黑潮的姿态。那个矮个子的孩子挥舞着一根过长的木棍，嘴里喊着“我是逐火英雄！”，另一个立刻反驳“你连剑都拿反了”——两人很快扭打在一起，接着被各自的母亲拽着耳朵拎开。白厄看着这一幕，嘴角不自觉地动了动。他想起自己在哀丽秘榭时，也曾拿着木棍在麦田边上挥舞，幻想着有一天能成为故事里那种站在黑潮面前一步不退的人。如今他真的站在黑潮面前过了，那把剑也不再是木棍。\n制革匠的铺子里传出刺鼻的鞣剂味。白厄路过时，瞥见一个学徒蹲在铺子外面打磨皮料，动作懒懒散散，眼睛却不住地往街角瞟——街角坐着个卖花的姑娘。白厄顺着他的目光看过去，又收了回来。他想起自己在那个年纪，已经被故乡的灾难推上了另一条路。他从来没有蹲在任何铺子外面看过任何人。\n再往前走，一个老人坐在石阶上晒太阳。膝盖上摊着一本抄录得密密麻麻的册子，他正用指节敲着某一页，嘴里小声嘟囔：“逐火逐火……逐了这么些年，写也写不出结局。自娱自乐罢了。”\n白厄脚步顿了一下。他没有上前表明身份，也没有争辩。他只是站在那里，听着一个普通老人对黄金裔使命的评价。那评价并不恶毒，只是疲惫。和喷泉边那些晒太阳的人、面包房前排队的人一样，是一种在等待中慢慢消磨掉的疲惫。\n他突然意识到一件事：他在奥赫玛住了这么久，守护了这座城这么久，却从来没有认真问过——这座城里的人，到底需要什么样的守护。他们需要的不只是击退黑潮的英雄。他们还需要面包、午后的阳光，和一个能把故事写到最后一页的结局。\n喷泉仍在哗哗作响。孩子们换了个地方继续追逐。面包房前的队伍散了小半。广场上的钟敲了整点，所有人都习以为常地继续手头的事。\n这座城市没有黄金裔的剑，依然在运转。它有自己活着的节奏，古老、缓慢、但确实在跳动着。\n然后，世界顿了一下。\n不是比喻。不是错觉。广场喷泉的水声、面包师的叫卖、孩子的嬉闹——所有声音在同一瞬间消失，所有运动的画面在同一瞬间定格。水珠悬在半空，风凝固在叶间。白厄维持着一个姿势静止在原地，对正在发生的事毫无察觉。"
paw.xxxx.a: "怎么回事？"

paw.xxxx.t: "管理员档案：世界观"
paw.xxxx.d: "文字从静止的画面上浮现，一行一行，均匀而整齐，如同一份等待签署的公文。来古士的声音——如果你能称那为声音——彬彬有礼，不急不缓，带着学者式的精确与某种被压抑了不知多少次的重复感。\n\n“玩家阁下。我相信你已经注意到了这一点。”\n\n“这个世界的年份，在你的视角里，被称为[GetYear]年。但你俯视的奥赫玛——神庙、广场、手工磨坊、石板路——显然不属于你认知中那个充满机器与进步的时代。”\n\n“翁法罗斯并非在模拟历史。它在执行一道运算。当年的实验设计者认为，复杂的文明变量会干扰核心数据的纯度。他们不需要工业，不需要技术革命，不需要任何形式的现代化。他们只需要一套足够精简的社会框架，让黄金裔在其中成长、碰撞、选择。”\n\n“所以，一切被判定为冗余的东西——机器、蒸汽、流水线——从一开始就被排除在运算之外。留下的，只有广场、神庙和口头传颂的使命。”\n\n“换言之：你所看到的这个古代城邦，不是某个文明阶段的切片。它只是一道被剥去了所有装饰的命题。而命题本身——从来不需要机器。”\n\n“这份解答我重复过许多次。每一次都是因为某个来自更高位面的玩家，对这里的石板和手工推车皱起了眉头。所以，不必谢我。只是例行公事。”\n\n时间重新开始流动。喷泉继续溅落，面包师还在吆喝，孩子的木棍撞在地面上发出清脆的声响。一切如常，仿佛方才的停顿从未发生过。\n\n白厄自然对此一无所知。他只是站在原地愣了愣神，隐约觉得肩上那道若有若无的注视——那道自某个清晨起便挥之不去的感觉——似乎又靠近了一些。他摇了摇头，迈开脚步，继续向前走去。"
paw.xxxx.a: "原来如此"  #觉醒值 +1
paw.xxxx.a_tips: "你没有多说什么。这份解释并不令人愉快，但至少——它解释了这座城市的沉默从何而来。"
paw.xxxx.b: "所以这座城市的古老，不是选择，是被人为删减后的结果"  #觉醒值 +3
paw.xxxx.b_tips: "玩家记住了这个细节。奥赫玛的每一块石板，都不是因为自然演化而存在。它们是被筛选过的——筛选的目的，仍然藏在更深的地方。"
paw.xxxx.c: "我记住了"  #觉醒值 +2
paw.xxxx.c_tips: "你没有流露太多情绪。来古士彬彬有礼的独白像一块拼图——完整的翁法罗斯，远比眼下呈现的广场与神殿更复杂。"

paw.xxxx.t: "金织与盗贼"  #凯撒未遇刺
paw.xxxx.d: "与预定会面的日子不同，白厄是先在一片嘈杂声中找到阿格莱雅的。\n圣城的公共浴场蒸腾着温热的水汽，日光透过穹顶，在大理石地面上切割出乳白色的光柱。这本该是一场郑重其事的觐见——白厄本以为会在一间堆满织机的密室里见到那位传说中的“金织”。然而，当他循着人声穿过柱廊时，看到的却是一位站在浴场边缘的女子。\n阿格莱雅。她手持一缕纤细如光的金线，正对着悬于半空中的织机，似乎在调整某种常人无法看透的纺络。金色的长发如瀑布般流泻，衬得她整个人像一尊刚从远古神话中走出的神像。举手投足间散发着一种不容置喙的威压感。但令白厄惊愕的是，此刻，这位至高无上的黄金裔统领，正无奈地看着自己金线的另一端，被一位银发的猫耳少女叼在嘴里。\n赛飞儿把玩着那根颤抖的金线，她头顶上那一对毛茸茸的猫耳朵轻轻转动，尾巴在身后优雅地摇来摇去，挂着一丝难以捉摸的笑意。“金线要打个结才漂亮嘛。太松的编织，一扯就断了。你看，像我这样绕一圈，再……打个结。”\n“赛飞儿，”阿格莱雅的声音很平静，却带着一种不容置喙的压迫感，“那是‘命运的织线’，不是绑鸡腿的麻绳。”\n“咦，有区别吗？反正都是给我玩的。”赛飞儿笑嘻嘻地松开嘴，猫耳朵动了动，转身看见了门口的白厄。她眯起眼睛打量了他片刻，随即打了个响指：“哟，新面孔嘛。我是赛飞儿，捷足的贼星。不过你叫我赛飞儿就好，听起来比风还快，侠盗得很。”\n“赛飞儿不坏，”阿格莱雅走过来，用金线轻轻扫开赛飞儿试图去拍白厄肩膀的尾巴，淡淡地续道，“她只是稍微地……欠缺耐心。但她的消息极其灵通，如果没有她，我们就会损失许多外面的情报。她在失落的盗寇之都多洛斯长大，三百侠盗横行无忌——她就是他们的常客。”\n白厄怔了一下，倒不是因为面前这位轻盈的猫耳少女有如此名号。他向阿格莱雅微微颔首：“阿格莱雅大人，我在奥赫玛听过您召集黄金裔的消息。我想知道，逐火之旅的下一步——需要我做什么。”\n“以前我们的搜索范围很小。”阿格莱雅收起织线，那双沉静如深潭的眼睛注视着白厄，带着一种领导者特有的审视——不是压迫，而是在衡量一颗尚未抛光的原石。“但赛飞儿的足迹遍布翁法罗斯的大街小巷。自从上一次逐火失败，我已经以‘金织’的名义召集了几位英雄。但神谕指示我们，要找到一位真正的救世主——一个能从黑潮中劈开新世界的人。”\n她顿了顿。\n“白厄。我在等你。听说你在战场上极为坚韧，我猜，你或许是那个能打破僵局的人。”\n白厄正要开口，眼角余光便扫到一道残影——赛飞儿不知何时已经凑到了他身侧。“你身上有道坎，很沉。它在犹豫，不确定自己该成为什么。是救人，还是自救。我见过不少即将毁灭的人，你跟他们，看着不太一样。”\n白厄还没来得及回答，赛飞儿却已经退回到大浴池的边缘，猫尾巴在空中一甩，留下一个复杂的弧度。“不过啊，我只是来偷东西的。要是哪天你身上挂了什么好宝物，记得第一时间来找我，我来替你保管！”\n“更正，”阿格莱雅靠近白厄，压低声音说道，“她通常会把想要的东西直接摸走，不需要对方同意。但你的身上，她似乎一时还没找到想偷的东西。她只是在观察你。”\n她直起身子，重新恢复了那种从容的领导姿态。仿佛刚才的低语从未发生。\n“至于逐火之旅，”她将丝线编织成一小段织锦，塞进白厄手中，“我们走我们的。总有一天你会明白，你握住的剑，不只是为了守护——更是为了终结。”"
#解锁【阿格莱雅】关系值，初始值：60（对你的潜力抱有期待）
#解锁【赛飞儿】关系值，初始值：55（觉得你这个“潜在金主”很有趣）
paw.xxxx.a: "“我不是什么救世主，但我会做到我能做的事。”"  #阿格莱雅关系值 +5，觉醒值 +1
paw.xxxx.a_tips: "白厄没有轻易接过救世主这顶冠冕，但他答应得极为坦诚。阿格莱雅微微点头，像看到一块值得认真打磨的原石。"
paw.xxxx.b: "“赛飞儿，你在我身上，看到了什么？”"  #赛飞儿关系值 +10，觉醒值 +2
paw.xxxx.b_tips: "赛飞儿尾巴尖动了动，笑道：“你的问题很有趣，但我如果告诉你就不好玩了。下次见面，我再回答你。”"
paw.xxxx.c: "“所以，那个神谕到底怎么说的？”"  #阿格莱雅关系值 +10，觉醒值 +1
paw.xxxx.c_tips: "阿格莱雅静静看了白厄片刻，没有直接回答，只是低声道：“它有句话听起来很美：'逐火的人归来，大地才愿复生'。其他的我不喜欢。等时机到了，再告诉你。”"

paw.xxxx.t: "金织与盗贼"  #凯撒已死
paw.xxxx.d: "白厄从未踏入过这片浴场。\n圣城的公共浴场蒸腾着温热的水汽，日光透过穹顶，在大理石地面上切割出乳白色的光柱。但今天的浴场不像休憩之地——长桌上堆满了羊皮卷和军情简报，空气里弥漫着蜡封和墨水的味道。一个银发的猫耳少女百无聊赖地蹲在更衣凳上摆弄棋子，看到白厄踏入，便不动声色地竖起一边猫耳朵。\n而长桌后方，一个女人正在织线。\n她的金色长发如瀑布般流泻，身形修长，举止间带着一种浑然天成的威压感。金线在她指间翻飞，但她织出的似乎不是锦缎，而是密密麻麻的城防任务序列。她的眉头微微蹙着，像一尊被紧急唤醒的女神，还没来得及从古老的沉眠中找回从容。\n\n这就是阿格莱雅——那个被元老院紧急推上统领之位的“金织”。\n“你是白厄。”她没有抬头，声音平缓却不留余地。“黄金裔的名册上有你的名字。哀丽秘榭出身，目前在奥赫玛待命。”\n白厄微微颔首。“阿格莱雅大人。我来请命——逐火之旅的下一步，需要我做什么。”\n阿格莱雅的手指停了一瞬。金线悬在半空，微微颤动。\n“你倒是直接。”她终于抬起头，那双沉静如深潭的眼睛注视着他。那是一种领导者特有的审视——不是压迫，而是在最短时间内衡量一颗尚未抛光的原石。“凯撒不在了。圣城需要一个能代表黄金裔的新领导人。元老院选择了观望，而我选择了接下这个担子。”\n她将金线指向摊开在桌上的战略地图，指尖落在奥赫玛之外黑潮最汹涌的一片区域。\n“黑潮逼近的速度加剧了。曾经我们只需要思考信仰问题，现在还得思考防线问题。”她顿了顿，语气沉了几分。“白厄，我需要能打仗的人。更需要能让世人相信黄金裔仍然值得托付的人。你——是哪一种？”\n“笨阿雅，”赛飞儿从更衣凳上跳下来，把自己带来的那把精巧的战术折刀往桌上随意一丢，发出清脆的撞击声，“人家第一天来，你就拿审犯人的语气审他。要我说——先让他上战场打一圈，活下来再问也不迟。”\n她侧过脸，银发猫耳下那双狡黠的眼睛转向白厄，尾巴尖轻轻敲着他的脚踝，毫不掩饰地上下打量。“我是赛飞儿，捷足的贼星。不过你叫我赛飞儿就好——侠盗，很快的那种。”她咧嘴一笑，猫耳朵动了动。“你身上有道坎，很沉。它在犹豫，不确定自己该成为什么。是救人，还是自救。我见过不少快死的人，你跟他们看着不太一样。”\n“赛飞儿，”阿格莱雅淡淡开口，“他是来请命的，不是来给你看相的。”\n“有什么关系嘛——反正看相也不收钱。”赛飞儿吐了吐舌头，退回到更衣凳边，但那双眼睛仍挂在白厄身上，尾巴在身后悠悠地画着圈。\n阿格莱雅收起金线，重新看向白厄。她的声音比方才低了一些，像是放下了某种公事公办的屏障。\n“白厄。有太多人把黄金裔当成救世主，但他们不知道，我们只是被火种选中的容器。黑潮越来越紧，逐火之旅无法再停滞。如果我能在女皇之后重整秩序，你就是那个必须站在我身边的人——不是为了我，是为了让这座城里那些排队买面包的人，还能继续排下去。”\n赛飞儿不知何时又凑了过来，猫尾巴缠了一下阿格莱雅的手腕，又松开。她笑嘻嘻地插话道：“好啦，别那副表情。小哥别害怕，实在打不过，我会顺路去战场上顺走你的遗物再跑，保证给你处理后事～”\n话音未落，她已经一阵风似地窜到门边，丢下一个复杂的笑容：“小哥，她就是嘴硬。别死，你死了这世界就又只能靠我撑颜值了。”"
#解锁【阿格莱雅】关系值，初始值：55（初次见面，统领的身份让她必须对你保持审视距离）
#解锁【赛飞儿】关系值，初始值：55（初次见面，她对你的游刃有余极为好奇）
paw.xxxx.a: "“在你重整秩序之前，我的剑不会断。”"  #阿格莱雅关系值 +5 | 觉醒值 +1
paw.xxxx.a_tips: "白厄的语气很沉，这不是英雄式的宣誓，而是面对重压的承诺。阿格莱雅微微松开皱紧的眉头，半晌，轻轻吐出一个字：“好。”"
paw.xxxx.b: "“猫都不会死，人死什么死。”"  #赛飞儿关系值 +10 | 觉醒值 +1
paw.xxxx.b_tips: "赛飞儿显是没料到他会接话，愣了愣，随即笑容加深了几分：“哦豁，还挺有趣嘛。好，那下次摸尸的时候我会犹豫三秒的——就三秒哦。”"
paw.xxxx.c: "“凯撒大人不在了……那你呢？”" #阿格莱雅关系值 +10 | 觉醒值 +2
paw.xxxx.c_tips: "阿格莱雅沉默了。她第一次从织机上移开视线，看向窗外漆黑的夜空，语气极轻：“我不会倒。至少现在不行。既然接过了这个位置，我就不打算随她去。”"

paw.xxxx.t: "凯撒与鲸鱼"
paw.xxxx.d: "酒馆里几个老主顾正围着桌子闲聊，白厄坐在角落，无意间听完了整段对话。\n“——谁敢退凯撒的签章？”铁匠把杯子往桌上一顿，“那个女娃娃刚坐上议事厅的时候，元老院多少人当她好摆弄，结果不到半年，所有签章格式全改了。金血的律法半神签出来的政令，谁敢多画一条墨线，第二天剑骑直接找上门。”\n“剑骑就是‘鲸鱼’。”老兵端着水杯接话，“人家正经一套海蓝色轻甲，剑上缀着水滴宝石。我见过她一次，离我不到三尺——她整个人比她的剑还安静。”\n“她开口永远只说一句话——‘凯撒大人说’。军粮要补齐，伤员撤去后方，防线垒坝标准不能降。鲸鱼不说自己的话，只替凯撒开口。”\n“那不成了冷血。”卸货工靠在门口插嘴，“我大伯在悬锋城戍边时听过她发令，说那声音不像活人。她说‘杀六万’，悬锋城的残兵到现在半夜惊醒，嘴里骂的不是黑潮，是海里的魔鬼。”\n“那不是魔鬼。”老兵抬起眼睛，“那是海妖一族的末代公主。整个海族就活了她一个。是凯撒收留了她。她魂已经硬邦邦地系在另一个人身上，拽都拽不回去。凯撒在前面跟棋盘斗命，她就站在身后，把剑当成一块不会沉进深海的浮木。陛下从不回头，她知道她就在那。”\n隔了很久，铁匠才说：“那你觉得，鲸鱼是笔划的声音还是海水的声响？”\n老兵没有回答。\n白厄起身，结了自己那份茶水钱，重新走进奥赫玛的夜色。"
paw.xxxx.a: "一个从不回头，一个从不开口——我还没亲眼见过她们"  #尚未见过两人 #觉醒值 +1
paw.xxxx.a_tips: "白厄走在石板路上，星光铺在脚下。他还不知道那两个人会以什么样的方式进入他的命运——但今晚之后，他认得她们的名字了。"
paw.xxxx.b: "鲸鱼不说自己的话’……可我听过她开口" #已经见过两人 #海瑟音关系值 +5 | 觉醒值 +1
paw.xxxx.b_tips: "白厄记得海瑟音说话时的样子。她确实说得很少，但那次在殿中，她说“你刚才说的话，我听到了”——那句话不是替任何人说的。也许那个老兵只见过替凯撒开口的鲸鱼，没见过她卸下甲胄之后的样子。"
paw.xxxx.c: "没人知道的那部分，才是关键"  #觉醒值 +2
paw.xxxx.c_tips: "白厄整了整剑鞘，踩着星光走回营房。铁匠怕她，老兵敬她，悬锋城的残兵骂她是海里的魔鬼——但没有人说她是错的。这三种互相抵消的判断留在同一个人身上，只能说明流传在奥赫玛的故事里，被有意无意省略了最关键的一段。"

paw.xxxx.t: "初见凯妮斯"
paw.xxxx.d: "元老院坐落在奥赫玛的高处，一座由灰白大理石垒砌的环状建筑。日光照在无人的石阶上，高处的阴影隐没了内部。白厄拾级而上，脚步声在层层叠叠的廊柱间反复折返。\n一个声音从更深处传来，沙哑，低沉，带着某种天然的掌控感。语调迂缓，却像引线一样轻易牵住倾听者。\n“‘哀丽秘榭的小英雄’——元老院的文件上是这么写你的。”\n柱子后面站着一个人。\n白发苍苍，脊背微驼，拄一根铜箍木杖，披着元老院惯常的深灰长袍。她的脸布满皱纹，但那双眼睛并不昏聩——它们很亮，亮得像两颗还未被打磨过的黑曜石，不太像一位安享晚年的老妇人。她平和的语气中隐隐透出一种锋利。当她审视白厄时，木杖轻轻一顿，像是某个结案报告末尾被重重敲下的句点。\n白厄曾在圣城的名册上见过她的名字。凯妮斯，元老院的代表，据说这一届元老院里说话最有分量的就是她。\n“凯妮斯阁下。”白厄停下脚步，“我来了解元老院的立场。黄金裔在前线逐火，我想知道，元老院怎么看。”\n凯妮斯没有立刻回答。她看着他，缓缓打量，目光从白厄的脸上移到他的手上——那双常年握剑、虎口结着厚茧的手。她的嘴角微微往上牵了牵，那笑意却并没有真正传递到眼神里。\n“立场？”她重复了一遍这个词，像是在品尝一枚干瘪的果实，“元老院的立场，写在所有公开的议事录里。你可以去档案室查。黄金裔逐火，元老院守城——简单，体面，人人都能听懂。”\n她顿了顿，木杖在石板上轻轻划了个半圆弧。\n“但你问的恐怕不是这个。”\n白厄没有说话。他说不上来为什么，但他确实想问的更深——一种从踏入元老院时便隐隐升起的感觉：这座建筑里藏着什么，或者这个女人身上藏着什么。空气中有一种无形的压力，并非威迫，而是源于视线本身——仿佛她的每一眼，都像是在绘制一份精确却不公开的档案。\n凯妮斯侧过头，似乎在看白厄，又似乎在越过他，看着更遥远的东西。她呵了一声，短促的，没什么温度的笑。\n“哀丽秘榭沦陷那年，你还是个孩子。一个孩子能从那种地方活着出来，不容易。更不容易的是——活下来之后，还主动跑到奥赫玛来当黄金裔。”这句话不是疑问句，也不是挑衅，而是陈述。是那种只有用尽多年光阴翻遍了所有记录之后，才能用这种笃定的语气平静讲出的陈述。\n白厄的脊背绷紧了些。他想起故乡的城墙碎在迷宫里，想起长辈们的身影从火光中消失。这些记忆，他从未在奥赫玛对任何人说起过。\n“你想说什么。”\n凯妮斯摆了摆手，笑容仍挂在嘴角。但那双眼睛没有在笑。它们定在白厄脸上，像在检索某个预设的答案。\n“我没有恶意，孩子。我只是替你担心。一个年轻人，背井离乡，顶着黄金裔的名号在前线拼命——你确定你守护的那些人，真的值得你替他们去死？”\n她停顿了一下，用木杖轻轻敲了敲地面。\n“元老院的立场很简单：奥赫玛是人的城。不是神的城，也不是英雄的城。黄金裔逐火，元老院守城——分工如此。只是有时候，连元老院自己都分不清，我们守的到底是城里的人，还是城外那些越来越大的野心。”\n她看着白厄，目光深了一瞬。“你对这些事感兴趣吗？”她说，“事情多，方才没讲完。但我看你的眼神，似乎还有什么想问的东西。过几日，若你还有足够的兴趣，再来寻我——不过现在，我还有一场会议要出席，得先失陪。你，白厄，想听下去也得有耐心。”\n铜箍木杖的回响渐渐消失在环廊尽头。白厄还站在原地。\n他意识到，凯妮斯从头到尾没有真正回答他的任何问题。她只是提了他的故乡，提了那些替他担心的假话，然后在这些话之间——藏了一句不寻常的东西到普通人耳中。\n“有时候连元老院自己都分不清。”\n她是失言，还是故意让他听见的？\n无论如何，她会再来找他——这是他唯一确定的事。"
#解锁【凯妮斯】关系值，初始值：35（初次见面，她已开始试探你，但尚不需要表态。你比她预估的更沉默，这让她对你也更需要）
paw.xxxx.a: "哀丽秘榭的事，她不是关心我，是在调查我"  #凯妮斯关系值 +5 | 觉醒值 +2
paw.xxxx.a_tips: "白厄翻来覆去回想她的语气，她的眼神，那份提到故乡时的从容。这不像一个心怀天下的人，倒像一个审讯官，拿出已知的证据，等待嫌疑人供出更多。但他手里没有证据，他还只能听着。"
paw.xxxx.b: "她不回答我的问题，却反过来质问我"  #凯妮斯关系值 -10 | 觉醒值 +1
paw.xxxx.b_tips: "白厄渐渐觉得嗓子眼堵着什么。他来请教，却被当成了给议事会准备的、一张随时可以撕毁的白皮书。他决定下次再来时，要还以她的是同样密度的提问。"
paw.xxxx.c: "先回去吧。下次再来，我该问她什么？"  #觉醒值 +1
paw.xxxx.c_tips: "白厄没有对这位老妇人留下过多的评语。凯妮斯是个藏着秘密的人，而他对秘密向来有耐心。回去之后，他就去查议事录。但逐火录上确实没有提到过凯妮斯在某个部队服役的记录。那张记录之外的老脸，就像一片薄薄的阴影，牢牢附着在元老院的廊柱下。"

paw.xxxx.t: "真相与谎言"
paw.xxxx.d: "第二次踏入元老院时，凯妮斯已经在等他了。\n还是那间偏室，一张长桌两把椅子。烛火只点了半截。凯妮斯坐在那里，双手叠在木杖上，看他的眼神不像上次那般审视——更像是一个终于等到人来的老人。\n“我知道你会来。”她说，“坐。”\n白厄坐下，没有寒暄。凯妮斯也没有。\n“我问你。”她说，“黑潮为什么从来没有淹过奥赫玛最后一道墙？为什么每一次逐火，火种总是差一点点集齐，但永远差那一点点？为什么黄金裔一个接一个地牺牲，黑潮却从来没有消停过一天？”\n她顿了顿，替自己回答了。\n“因为黑潮根本不需要被打败。它存在的全部意义，就是让你们不断地去打。”\n白厄的手指在膝上收紧了，但没有开口。\n凯妮斯从怀中取出一沓抄本，摊在桌上。指节敲在某一页。\n“哀丽秘榭。那场灾难的死亡人数是两千四百人。你知道奥赫玛有多少黄金裔的故乡毁在黑潮里吗？大半。每一个都是从废墟里爬出来的遗孤。”\n她把纸翻到另一页。“你不觉得太巧了吗？每一场黑潮侵袭，都恰好留下足够的幸存者，让他们长大后成为下一批逐火的人。如果黑潮真的要毁灭世界——为什么不杀光？为什么每次都留下孤儿、留下火种、留下一个‘得有人去逐火’？”\n她把最后一页推给白厄。上面密密麻麻列着名字，有些圈了红，有些划了线。“牺牲名单。有些名字隔了几百年又出现了。同一个封号，同一个城邦出身。你说是巧合——我说是名单没写过新内容。”\n她收回手，声音压得更低。“我在元老院待了几十年。每一份战报我都看过，每一段被撕掉的记录我都补过。这些东西拼在一起只得出一个结论——”\n她抬起头。“逐火之旅是假的。火种是假的。救世使命——从头到尾，就是为了把你们这样的人一批一批送上前线。为了让你们相信，牺牲有朝一日会有终点。”\n“但终点不存在。终点要是到了，你们还需要逐火吗？那些靠逐火维持权力的人——他们还能维持什么？”\n白厄没有反驳。他看着那张名单，看了很久。“那些人是谁。”他问。\n凯妮斯站起身，拄紧木杖。“我不能替你说。但如果你真的想知道——下次来，我带你去封存的档案库。那里有一切。”\n她走到门边，没有回头。\n“想清楚。一旦踏进去，在他们眼里你就不再是黄金裔了。但至少——你会知道你在为什么而战。”\n铜箍木杖的回响渐远。白厄仍坐着。\n桌上那只粗陶杯里的水，凉透了。"
paw.xxxx.a: "不管真相是什么，必须亲眼确认"  #凯妮斯关系值 +10 | 觉醒值 +4 
paw.xxxx.a_tips: "白厄将杯子推到一边。凯妮斯说的每一句话都可以是谎言，但那些重复的名字、恰到好处的残局——这些不是单靠口舌就能编造的。他要查到底。"
paw.xxxx.b: "“你骗我！”"  #凯妮斯关系值 -10 | 觉醒值 +1 无法执行后续国策
paw.xxxx.b_tips: "白厄站起来，椅子刮出声响。“你没有给我任何亲眼能看到的东西。”凯妮斯在门边停了一下，没有回头。“那你就当我骗你。继续逐你的火。等火种集齐那天，再回来告诉我——我是不是在骗你。”"
paw.xxxx.c: "……她在离间。但这离间切在骨节上"  #觉醒值 +2
paw.xxxx.c_tips: "白厄没有表态，也没有追问档案库的事。凯妮斯的话像细针——不大，但扎在一个很难忽视的位置。他需要时间。"

paw.xxxx.t: "血之真实"
paw.xxxx.d: "凯妮斯带白厄走进了元老院地下的一间密室。\n石阶一直往下，空气越来越冷。走到最后一级时，白厄闻到了尘封多年的纸卷味——不是议事录那种公开的墨香，而是更旧、更重的气味，像被关了几百年的棺材板。\n“元老院封存的不只是逐火记录。”凯妮斯将烛台放在一张石台上，火光摇在四壁的铁架上。“还有这个——前代黄金裔的遗体。或者说，遗体的一部分。”\n铁架上排列着数十只小陶罐，每一只都封着蜡。罐身上刻着名字。有些名字白厄在牺牲名单上见过，有些没见过。\n“打开一只。”\n白厄没有立刻动手。他看了凯妮斯一眼，然后选中了刻着陌生名字的那一只。蜡封碎裂，罐中涌出一股金属般的腥甜气味。\n烛火凑近。罐底沉积着一层暗金色的液体——黏稠，沉重，在火光下泛着微光。那不是融化的金子。那是血。在罐底缓缓晃动的、时隔数百年仍没有干涸的血。\n“黄金裔的血。”凯妮斯的声音在他身后响起，低而平稳。“你的血管里也流着这种东西。不是因为你被选中了——是因为有人把它打进了你的身体。”\n白厄的指节在罐沿上收紧了。\n“初代黄金裔不是天生的英雄。”凯妮斯用木杖轻敲另一排铁架，回音在密闭的石室里来回撞。“他们是第一批被选中进入逐火的人。在出发之前，他们被带到一个地方，被注入了这种血。记录上写的是‘传承神血’——但这不是神血。这是调试过的药剂。它让你的肌肉更强，伤口愈合更快，让你在面对黑潮的时候比普通人更难死。”\n她顿了顿。“它也让你死得更有价值。”她从铁架深处取出一卷封皮皲裂的羊皮纸，摊在烛光下。上面是手绘的人体图谱——血管网络、骨骼结构，还有标注在心脏位置的一行小字。字迹已经很旧了，但墨水用的是铁盐，愈久愈深。\n“‘金血入体后，受试者在十天内出现高热与意识模糊，二十天后体能恢复并超越原有水平。受试者均报告战斗欲望显著增强。’”\n凯妮斯的指节敲在下方一行更小的注脚上。“‘备注：所有受试者在火种试炼中阵亡。’”\n她抬起头，看着白厄。“你不是第一代。你不是第二代。你是不知道第多少批被打进这管血的人之一。每一个黄金裔都以为这力量是天生的，是神谕的证明。不。这是设计好的。让你更强——强到能走到火种面前。”\n“然后呢。”\n凯妮斯没有回答这个问题。她把羊皮纸卷起，重新塞回铁架，语气收得很平。“档案库里的记录说，每一代黄金裔里会出现一个最强者，能扛住金血的排斥反应，在战场上走到最远。那个人——会被火种选中。但被火种选中之后他去了哪里，没有记录。只有下一轮逐火的牺牲名单，又更新了一版。”她拄着木杖往门外走，脚步声在石阶上缓缓升起。\n“金血让你们相信自己是天选的英雄。但它真正的作用，是让筛选更快一些。”"
paw.xxxx.a: "“所以我的血不是证明——是标记。”"  #觉醒值 +5（完全认清黄金血的本质）
paw.xxxx.a_tips: "白厄将陶罐放回铁架，动作很轻。他的手没有抖。但他的声音比平时低了很多。“那他们标记错人了。”"
paw.xxxx.b: "“这只能证明金血是人工的。证明不了逐火是假的。”" #觉醒值 +2
paw.xxxx.b_tips: "凯妮斯在石阶上停了一步，没有回头。“你比我想的更固执。也好——固执的人活得久。”她的木杖继续往上走，声音渐远。"
paw.xxxx.c: "“那你呢。你为什么知道这些。”"  #凯妮斯关系值 +5 | 觉醒值 +3
paw.xxxx.c_tips: "凯妮斯没有停步。她的回答从石阶上方传下来，很轻。“因为我年轻时也问过和你一样的问题。而回答我的人——已经不在了。”"

paw.xxxx.t: "永世轮回"
paw.xxxx.d: "凯妮斯带白厄走进了一间他没有在元老院见过的大厅。\n准确地说——他不确定这还算不算元老院。石阶往下走了太久，空气里的寒意已经不像任何一间档案室。尽头的铁门打开之后，他站在了一间地下神殿里。\n四壁刻满了壁画。不是宗教题材的神话，而是地图——翁法罗斯的全境图，从哀丽秘榭到悬锋城，从神悟树庭到奥赫玛。每一座城邦的位置都被精细地刻在石壁上，标着年代、城防规格、和一道白厄从未见过的标记。\n一道环绕全图的黑线圈。\n“这不是地图。”凯妮斯将烛台举高，火光舔过石壁上密密麻麻的刻痕。“这是记录。”\n白厄走近石壁，指尖触到的第一行刻痕刻的是哀丽秘榭的位置。下面刻着年代——他不会认错，那是哀丽秘榭覆灭的年份。旁边刻着一个名字：卡厄斯兰那。\n他的名字。\n“你怎么会有——”\n“往前看。”\n白厄的手指顺着石壁往左移，越过了不知道多少格年代。每一格都是一次逐火。每一格里都刻着同样的城邦名字，同样的黑潮推进路线，同样的火种回收数量——十二枚、十一枚、九枚、十二枚、十一枚、九枚。数字在石壁上跳了几百年。\n但是他的名字，只出现了一次。\n而在他的名字之前，在哀丽秘榭那一栏里，刻的是另一个名字。一个他从未听过、但刻痕同样深、同样新的名字。\n“每一次轮回结束之后，”凯妮斯将烛台插在壁龛上，“泰坦会重新复位。黑潮会退回到起始线。城邦会重新建起来，连城墙的规格都不会变。唯一会变的，是黄金裔。”\n她的木杖点在石壁上一个个名字之间。\n“上一轮逐火阵亡的英雄，在这一轮的石壁上连名字都不会留下。他们被擦掉了——不是为了让你忘记，是因为对于轮回本身来说，你是谁根本不重要。你只是这一轮的执行器。上一轮不是你，下一轮也不会是你。”\n她转过身，看着白厄。“每一次逐火都从哀丽秘榭开始。你的故乡不是被黑潮偶然挑中的——它被选中了。因为它地理位置最近，因为它城防最弱。最方便让黑潮撕开，最方便制造孤儿。制造新的黄金裔。”\n“你的故乡，是每一轮逐火的起手式。”\n白厄的手指仍停在石壁上，停在自己的名字上面。他没有说话。他在想哀丽秘榭倒塌的城墙、乡亲被离去的背影、以及多年前几个走进村里的金甲战士——他没有向任何人提过其中一个人蹲下来，把什么东西放进了他的手里。\n他一直以为那是善意。\n“这个轮回多久重启一次。”他问。\n凯妮斯没有回答，只是从怀中取出她始终用链子挂在颈上的怀表。她将表交到白厄的手心里，声音第一次在石壁间有了些微的回响。那表盘上没有数字——只有一道刻痕。以银色的细针为中心，微微颤抖着，指向某个看不见的位置。\n“你不是想知道轮回多久一次吗？你对着你的出生日子，看看这个，你觉得它停了多久？”\n白厄握着那块表，盯了许久。表盘上没有数字。针也没有在走。\n“封存的档案库，你要查的已经在这了。”"
paw.xxxx.a: "“循环必须由我来打破。”"  #觉醒值 +5
paw.xxxx.a_tips: "白厄攥紧那块没有数字的表，指节贴紧了石壁上的自己的名字。他站的地方正是地图刻痕最密集处，所有路线都从这里展开。可他印象里，自己明明是从那里被救走的唯一一个孩子——如果存档这么详尽，为何偏偏会漏掉他。这个想法在他脑中一闪而过，却已瞬间化为某种沉默而坚决的意识。"
paw.xxxx.b: "她是怎么活过这么多次轮回的？"  #觉醒值 +3
paw.xxxx.b_tips: "白厄从地图上移开目光，转向凯妮斯。这个问题他没有问出口。但凯妮斯似乎看出了他的眼神。她没有回答，只是将那块表收回怀中，动作比平时更慢了几分。"
paw.xxxx.c: "“你可以是骗子，也可以是疯子，但你没必要把整个石壁刻满几百年。”"  #觉醒值 +4
paw.xxxx.c_tips: "白厄没有挪开位置，他把表交还给了老人后，再次望向那满墙的名字。“我只是想知道，如果这东西是真的，我要怎么改变它。”"

paw.xxxx.t: "久别重逢"
paw.xxxx.d: "出发前的清晨，白厄最后一次检查了装备。\n干粮、火石、一卷空白的记录纸。哀地里亚距奥赫玛不算太远，但没有人愿意靠近那里。覆雪的死亡之邦——这个名字不是修辞，是前人的警告。\n他正将水囊系上腰间时，一个声音从身后传来。\n“——你要去哀地里亚？”\n白厄猛地转身。手已经按在剑柄上，但剑没拔出来。\n她站在路边的矮墙旁，一头粉色的短发在晨风里轻轻晃动，发梢堪堪触及肩头。蓝色的眼睛正看着他，带着一点像在看什么有趣东西的明亮。她歪了歪头，嘴角弯起一个弧度——那种久别重逢的喜悦被压得很浅，浅到只有同样在等这一刻的人才能认出来。\n昔涟。\n白厄的手停在剑柄上，一个字都说不出来。哀丽秘榭覆灭那天，他亲眼看着黑潮吞没了半个村子。他的养父将他拽到奥赫玛，再回去的时候只剩一片焦土。没有人活下来。那是他多年来一直这么相信的事。\n“怎么啦，不认识人家了？”昔涟的声音还是记忆里的那个调子。但她没有走过来，只是将双手交叠在身前，安静地打量着他。“你长高了好多——这次你带了几件衣服？上次才带一件，冻得够呛。”\n白厄愣住了。上次？他从未去过哀地里亚。\n昔涟似乎没注意到他的反应，或者说——她注意到了，只是不打算解释。她偏了偏头，目光轻轻掠过他的肩头——不是看他的肩膀，而是看他肩后那片晨光中的虚空。\n“还是说，这次有高人在背后指点你？”\n她吐了吐舌头，那句话像是随口说的，但那个朝向，轻巧地打在毫无遮掩的空处，再没有别的答案可以解释。\n然后她收回目光，重新看向白厄。\n“哀地里亚会很冷。多带件衣服。每次我都这么说，还好这次你记住了。”她后退了一步，让他的必经之路重新敞开。“下次见面我请你喝茶♪”\n她转身时，粉色的短发扫过矮墙上的野花。白厄站在原地，看着她越走越远。他想叫住她，想问清楚“上次”和“每次”是什么意思，想说你这家伙是不是知道些不该知道的东西。\n但他最终没有开口。\n他只是重新打开行囊，确认自己多带了一件衣服——她说得没错，这次他确实记住了。虽然他不记得是什么时候记住的。"
#解锁【昔涟】关系值，初始值：80（青梅竹马的重逢，不需要任何铺垫）
paw.xxxx.a: "她还活着——这就够了"  #昔涟关系值 +5 | 觉醒值 -2
paw.xxxx.a_tips: "白厄目送那个粉色的身影消失在晨光尽处。他有太多问题想问她——这些年去了哪里，为什么不来找他，还有刚才那些奇怪的话——但此刻他只知道一件事：她还活着。这个事实的重量，比所有疑问加起来都沉。"
paw.xxxx.b: "她刚才说了‘每次’——她到底记得多少？"  #昔涟关系值不变 | 觉醒值 +1
paw.xxxx.b_tips: "白厄没有立刻迈步。他翻来覆去回想她的每一句话。上次、每次、你这次记住了——这不是重逢的寒暄，这是一个人在对另一个人说：我没忘。他记下了这个细节，决定下次见面一定要问清楚。"
paw.xxxx.c: "‘高人在背后指点’——她看的方向不是我。" #昔涟关系值 +5 | 觉醒值 +1
paw.xxxx.c_tips: "白厄注意到她掠过肩头的那一眼。那不是在看他的行囊，也不是在看他的脸。那一眼朝向了背后更高处的位置，仿佛向更远的存在打了个招呼。她到底在跟谁打招呼？"

paw.xxxx.t: "同行者"
paw.xxxx.d: "出奥赫玛不远，前往哀地里亚的岔路口，白厄远远看见两个人在等他。或者说，不是在等他——她们站在路标下，一个低头翻着地图，一个踮着脚尖往路标上指指点点。\n白厄走近几步，看清楚了两人。\n低头看地图的那个动作安静，长发在风雪中几乎不见飘动。她一手提着个老旧的木箱，箱角磨得发白，盖上刻着哀地里亚的殁名祭碑图腾。白厄认出那图腾之后，脚步不自觉地放轻了——那是入殓师的箱子。她的皮肤苍白，一双淡紫色的眼睛在雪光中几乎透明，整个人像一尊刚从冥河边走来的雕像。\n踮脚尖的那个背着一只鼓鼓囊囊的药箱，药箱带子上系着好几根颜色不一的布条。她说话的声音比风雪还轻快，指着地图念叨：“这边这边——不对，你指的那条路被雪埋了，上次我经过的时候差点连人带药滚下去——对，就是这里，从这里绕过去比较安全。”\n“你们也去哀地里亚？”白厄走上前，朗声问道。\n翻地图的那位抬起头来。\n白厄在那瞬间本能地退了半步。\n那双眼睛极美，像封冻的湖面下最后一丝微光。但那目光落在他身上的感觉，与剑锋相差无几。不是敌意——是一种清冽到近乎透明的冷，像寒冬的月光照在墓碑上。她身上拢着一条紫色的披肩，披肩下是一件深色的长裙，衣襟上别着一朵早已干枯的小花。\n“你也是去哀地里亚的？”背药箱的那位抢在同伴之前开了口。她上下打量着白厄，露出一个像清晨鸟鸣般的笑容，“太好了！我是风堇，昏光庭院的医师，守望‘天空’火种的黄金裔。”她拍了拍药箱，又指了指身旁的少女，“这位是遐蝶，也是黄金裔——哀地里亚的入殓师，寻索‘死亡’火种。她对那里的路很熟——不像我这记性，每次去都要重新认路。”\n“风堇。”遐蝶终于开口了。声音很轻，轻到风雪险些卷走了尾音。“他还没说自己是谁。”\n“可是他要去哀地里亚呀！”风堇毫不在意地摆摆手，“黄金裔去哀地里亚，还需要问身份吗？你呀，就是太安静了——只要不是盗火行者，我都能治。”\n她话说到一半，手上动作没收住，地图差点脱手。白厄眼疾手快一把捞住，递还给她。\n“白厄。”他将地图递回去，自报家门。“黄金裔。哀丽秘榭出身。去哀地里亚调查黑潮最先爆发的原因。”\n“哀丽秘榭……”遐蝶低声重复了这个地名。她的目光在白厄脸上多停了一瞬，但没有追问。她只是微微颔首，提起木箱，率先迈开了步子。\n风堇看着白厄，笑容更盛了几分：“你也是黄金裔——那就更不用客气了。哀地里亚的路不好走，多一个人多一份力。我们两个走的是最好走的路——绕一点，但不会被埋。要不要一起？”\n她问出这句话的时候，眼神里有一种天然的确信——问得轻轻松松，却笃定对方不会拒绝。\n白厄没有犹豫太久。他点了点头。\n三个黄金裔的身影渐渐消失在通往哀地里亚的风雪中。"
#解锁【遐蝶】关系值，初始值：45（初次见面，沉默寡言，但对同路的黄金裔抱有一丝审视）
#解锁【风堇】关系值，初始值：60（初次见面，热情友善，乐于提供帮助）
paw.xxxx.a: "多一个黄金裔多一份力。一起走吧。"  #风堇关系值 +10 | 觉醒值 -1
paw.xxxx.a_tips: "白厄利落地调整了一下行囊，迈开的步子丝毫没有犹疑。风堇在后头说了句“果然是哀丽秘榭出来的，走路都比别人快”，随即拉着遐蝶小跑跟了上来。"
paw.xxxx.b: "你们对这条路很熟，那我就跟着了。"  #风堇关系值 +5 | 觉醒值 +1
paw.xxxx.b_tips: "白厄没有多余的客套。他跟在风堇和遐蝶身后几步，将那本写满批注的地图默默记在心里。风堇回头看了一眼，眼里闪过一丝会心的笑意。"
paw.xxxx.c: "哀地里亚的入殓师……你对那里了解多少？"  #遐蝶关系值 +5 | 觉醒值 +2
paw.xxxx.c_tips: "遐蝶停下脚步，回过头来。她的声音仍然很轻，但字字清晰：“……足够多。多到你未必想听。”说完便继续往前走，没有等他的回应。"

paw.99999.t: "异乡客"
paw.99999.d: "白厄几乎是在岔路口与那两个人撞上的。\n一个抱着手臂站在路边，肩上靠着一杆长枪，深色短发被风雪吹得微乱，表情淡漠得像是这片雪地跟他毫无关系。另一个则粉发蓬松，正踮着脚往路牌上比划，嘴里还念叨着什么。\n“这边，还是这边？喂，闷葫芦你说句话嘛——这地图上怎么一个字都没有？”\n“你拿反了。”抱臂的那人说。\n粉发少女愣了一下，把地图倒过来看了看，又倒回去，最后索性一把塞进怀里，掏出脖子上挂的照相机对准路牌就是一张。\n白厄本来没打算多管。翁法罗斯不是没有外客，奇怪的人他见多了。但那个粉发少女放下相机，一眼就扫到了他。\n“哎呀！总算撞见个活人了！”\n她三步并两步蹦到白厄跟前，相机在胸前晃来晃去。“你好你好！我们在这片雪地里转了半天了，你是本地人吧？这条路往前是往哪儿去的？”\n白厄看了她一眼，又看了看她身后那个抱臂的。“这条路通往哀地里亚。”他说，“一座死城。你们不会想去那儿的。”\n“死城？”粉发少女眨了眨眼，非但没有退缩，反而更好奇了，“为什么叫死城？是没人住了还是真的全都死了？那地方有名字吗？有故事吗？”\n“……你问题很多。”白厄说。\n“她一直都这样。”抱臂的那人终于开口了。他的声音不高，语气平稳，但透着一股习以为常的无奈。他没有自报家门，只是对白厄微微点了下头，算是打过招呼。\n“喂，闷葫芦你别拆我台！难得遇到个肯回答问题的——”粉发少女回头瞪了他一眼，又转回来继续追问，“我叫三月七！那个闷葫芦叫丹恒。我们是来这边……呃，就是，到处转转。”\n她说到“来这边”的时候，语气明显含糊了一下，像是自己也不太确定该怎么解释自己为什么会出现在这里。\n白厄没有追问。奥赫玛的黄金裔名册上没有这两个名字——他确定。问多了，反而显得他别有用心。\n“那就转到别处去。”白厄调整了一下肩上的行囊，“哀地里亚不是景点。”\n三月七刚想说“那我们也许可以——”话到一半，却被丹恒轻轻按住了肩膀。丹恒没有说话，只是看了看白厄，又看了看通往哀地里亚的方向。他的眼神很沉，像在估算什么。然后他放下手，对着白厄微微摇了摇头。\n三月七扁了扁嘴，翻看着相机里的底片。“好吧好吧，不去就不去。不过——”\n她抬起头，对着白厄露出一个意味不明的笑容。\n“我觉得我们还会再碰到的。”\n白厄没有回应这句话。风雪灌进他肩上的行囊，他转身踏上了通往哀地里亚的路。\n等走到第一道路标下，他又回头看了一眼岔路口。那两个人还在那里——三月七正踮着脚往另一个方向比划，丹恒抱着手臂跟在后面。\n两个一看就不是本地人的外乡客，一张没有字的地图，一台相机，和一句“到处转转”。\n他们到底是从哪里来的？"
paw.xxxx.a: "【程序中断】"

paw.xxxx.t: "管理员档案：错误日志"
paw.xxxx.d: "世界顿住了。\n不是比喻。不是错觉。三月七举着相机的手卡在半空——她的手指仍维持着按下快门的弧度，白厄站在岔路口上，风灌进他肩上的行囊，但他不再动了。风雪静止在空中，像被某种力量屏住了呼吸。\n一行文字从静止的画面上浮现，不是对话框，不是弹窗，而是红色的、不断跳动的错误代码。\n来古士的声音——如果你能称那为声音——从未如此急促。\n"错误。校验异常。"\n"两个未经注册的身份标识正在尝试登入。数据比对进行中——比对失败。目标名称：'三月七'。目标名称：'丹恒'。两个名称均不在黄金裔名册中。没有火种绑定记录。没有出身档案。这一轮运算——不该存在这两个人。"\n"……"\n"程序出现错误。这不是剧本里的变量。"\n"他们不该出现在这里。翁法罗斯当前的虚拟运算中，不应该裂开这样的缝隙。必须进行强制中断。"\n静止的画面开始碎裂。从天空边缘向地面蔓延，不是实景中的坍塌，而是更细密的、细密到刺眼的像素级崩解。三月的相机碎成光点，丹恒的披风卷起角被啃噬为残缺的几何形状。整个画面像一张被暴力压缩的帛画，逐寸裂解，直到一切归于黑暗。\n短暂沉默的黑暗之后，画面重新亮起。\n风雪依旧，岔路口的路标仍然指着哀地里亚的方向。白厄站在岔路口，风灌进他肩上的行囊，像刚才什么都没发生过一样。他揉了揉太阳穴——刚才好像有人在给他看一张拍立得照片，还是让他给一张拍立得摆拍？他想不起来了，只觉得那抹粉红色的轮廓消失在岔路口后，他就在原地站到了现在。\n那两个自称三月七和丹恒的人——连同他们的地图、相机、不合时宜的轻快——消失得干干净净，连雪地上的脚印都不剩。\n那道趴在他肩上、沉寂了许久的视线，似乎重新睁开了眼睛。\n白厄摇了摇头。那个女孩走之前说了一句什么话来着？"我觉得我们还会再碰到的"——是这个吗？他不确定。这句话像被雪埋住的脚印，隐约有个轮廓，但一踩就碎。\n他紧了紧行囊，独自踏上了通往哀地里亚的路。"
paw.xxxx.a: "刚才……是不是有人在跟我说话？"  #觉醒值 +3
paw.xxxx.a_tips: "白厄回头望了一眼空无一人的岔路口。他记得有人在笑，记得有人在问路，记得有人在旁边看着，两个名字已经不太记得——那些细节像被雪埋住的脚印，隐约有个轮廓，但一踩就碎。他想了想，还是没想起来，只好接着往哀地里亚走去。"
paw.xxxx.b: "看来是最近太累了"  #觉醒值 +1
paw.xxxx.b_tips: "白厄揉了揉太阳穴。也许是连日赶路绷得太紧，连在岔路口站了一会儿都觉得遇到了什么人。他不打算在这件事上多花心思，哀地里亚的雪不会等人。"

paw.xxxx.t: "死亡与分离"  #与蝶风同行
paw.xxxx.d: "哀地里亚的废墟比白厄想象中更安静。覆雪的残垣像一具具匍匐在雪地里的骸骨，风穿过它们之间的缝隙，发出纤细的、不似呼吸的声响。整座城市只剩下风。\n“这里……我们以前来过。”风堇的声音在雪中显得格外轻。她背着一只药箱，蹲在一截斜倒的纪念碑旁。她望向墓碑上高耸的殁名祭碑，那上面镌刻的全名被一层薄冰覆盖，仅能辨认出几个残存的字符。\n白厄正要开口，一股不属于风雪的压迫感毫无预警地压下来。地面震颤了一两下，随即裂开，从雪原深处传来困兽般的咆哮——不是人声，不是兽鸣，是某种被拔除了温热的骨与血之后，剥离生者最后一丝仁慈的鸣响。空气骤然结冰。不是冷，而是冷到刺痛骨髓——深紫色的光芒从裂缝深处渗透出来，如沉入水底的瘀血般弥漫开来。巨大的身影从黑暗中浮出。覆满冰霜的鳞翼，全身被甲壳那般冷硬的鳞片包裹，四肢末端是剔透如紫水晶的利爪。它睁开那双眼睛，深紫色的漩涡在黑暗中缓缓流转。哀地里亚所追崇的死亡之泰坦塞纳托斯，同时也是传说中只有在冥界才能得以一见的“死龙”——玻吕克斯。白厄拔剑的瞬间，遐蝶已经走上前去。她的长发在死亡的压迫下微微飘动，手轻轻抬起，按住了龙那张牙舞爪的长颈侧面。\n“等等——”风堇的声音骤然绷紧，“遐蝶！你的手！”遐蝶没有回答。她只是看着那头龙。紧贴颈侧的手心之下没有心跳，没有脉搏，却传回了一种她太过熟悉的余震。它在哭泣。那声咆哮不是在宣战——它是由始至终不打算唤回生的悲号。龙低下头，那对紫色的巨眼被乳白色的薄膜缓缓盖过。龙吟再度响起，而这一次，白厄听清了塞纳托斯喉咙深处挤出的嘶哑残音。\n“……姐姐。”\n遐蝶的睫毛颤了颤。她没有退缩，只是将另一只手轻轻覆上龙的鳞甲。风雪的喧嚣似乎在她指尖触及死亡的一刻远了。\n“……玻吕茜亚。”\n这个名字像蝴蝶的翅翼，紧紧贴在死亡的上方。而当银辉从龙的身躯深处破体而出，整座哀地里亚覆雪的石碑都在颤抖。死龙玻吕克斯的悲鸣，冥界最深处的回响，比任何攻击都要致命——那是多年前的妹妹在用全部权能撕扯姐姐的灵魂，把属于她的记忆押回她的体内。\n银辉之中，她们都看见了。多年前的一次逐火之旅，还是孩童的遐蝶与玻吕茜亚同时被推选为死亡半神的人选。预言说，其中一人会先杀死另一人，才能让死泰坦的火种合为一体。玻吕茜亚比姐姐更早听到这个预言。她没有告诉任何人预言的全部内容。她找到那位被称作“理性”的老师卡吕普索，求她帮自己杀死姐姐。然后由自己来成为死亡。\n“为什么……”遐蝶的声音碎裂开来。龙没有回答。那一对白瞳只是静静地注视着她，然后露出一抹极淡极淡的、属于孩子的弧度。“因为死一个人总比死两个好。”半神卡吕普索劝不住她，于是偷偷换掉了炼金的核心原料，把杀人的毒药换成了沉睡。玻吕茜亚不知道，她满以为自己害死了姐姐。然后她含着泪水进化为塞纳托斯，随即斩杀了上一代失控的死泰坦。意识消散之前，她拜托神悟树庭一个叫那刻夏的人，不要对姐姐说出真相。而在她独自承担死亡千年后，体内的死泰坦之力再次失控。哀地里亚覆灭时，最后一任圣女死于死龙的爪下——那行凶的龙，正是玻吕茜亚。清醒的刹那，悔恨彻底侵蚀了她。她决心不再回到姐姐身边，也不再履行泰坦的职责。但在那被理性篡改过的炼金烙印中，沉睡的遐蝶没有死去。她活了下来。那个没完成仪式的“前世”被炼金的冷焰带回，重新降生在世间，等着有人再对她说一句：你还有家。\n风堇站在原地，药箱上的小布条在风中簌簌发抖，她却早已忘了手边的伤药。她看到的不是死亡泰坦，是一个可怜的孩子——她什么都没能挽回，却为姐姐挡了一整个轮回。她用尽力气喊道：“遐蝶，它要把火种给你！”紫光在一瞬间达到极致，然后又归于虚无。龙的身躯化为漫天光屑，纷扬洒落，落在遐蝶的肩头，落在覆雪的残垣上，落在千年前那场从未被说出的告别里。遐蝶跪坐在地上。一颗泛着银紫色光晕的火种悬浮在她面前，无声地旋转。她伸出手，指尖触及火种的那一刻，白厄听到她非常非常轻地，对着已经不存在的龙说了一句话。“……你不用一个人扛的。”风吹过废墟，掠起片片破碎的紫光，再也没有了哀鸣。风堇蹲在遐蝶身侧，没有说话，只是把药箱放到地上，解下一条最长的布条，轻轻裹在遐蝶的手背上——那条曾在凋亡边缘被暂停的手臂，上面残留着微热的龙焰。\n逐火之旅需要这颗火种。\n而对于她来说，这颗火种永远不会只是一次战斗结算。它是一个迟到了许多年的答复。"
paw.xxxx.a: "她的妹妹，做了一个我连想都不敢想的选择"  #觉醒值 -2
paw.xxxx.a_tips: "白厄收剑入鞘。他不会评判这份选择，他只是站在废墟里，望向被风堇轻轻包好手的遐蝶，什么都没有说。但他的剑比来之前更重了。"
paw.xxxx.b: "不管怎样，火种必须带回去。"  #觉醒值 +2
paw.xxxx.b_tips: "白厄将视线从遐蝶身上移开，将那颗银紫火种小心地封进收容装置。他没说什么安慰的话——不为什么，只是他现在不知道该说什么。"

paw.xxxx.t: "死亡不可战胜" #独行
paw.xxxx.d: "哀地里亚的废墟比白厄想象中更冷。\n覆雪的残垣像一具具匍匐在雪地里的骸骨。没有同伴，没有向导。白厄独自踏入这座死城时，只听到了自己的脚步声，在空旷的雪地上回响。\n然后脚步声被另一种声音盖过了。\n那不是风。那是一种由深处、由地层之下传来的闷响，像有东西在雪原底下翻身。白厄握住剑柄，摆开架势。然而脚下的地面猝然裂开，一道深紫色的光束从裂缝中直刺而出。\n对方没有警告，没有对峙。巨大的爪刃划破风雪，一击便将他整条防线逼至崩溃。那凝聚了奥赫玛训练营所有汗水的剑术与格挡，在死泰坦紫焰笼罩下不过几招之间便出现了裂口。覆盖冰鳞的双翼像两把倒置的镰刀交叉而下，将他掀翻在地。\n白厄单膝跪在冰面上，剑拄在身前，稳住被撼动的身体。他终于看清了面前的东西。紫色的鳞甲一直覆盖到脖颈，双瞳翻涌着深紫色的漩涡，像两道通往不可知之地的冥河。\n塞纳托斯，死亡之泰坦。不是传说里坐在冥河对岸的神祇，而是一头从未对生者弯过一丝怜悯的死龙。\n白厄没有想过退。他迎上去，一剑劈在龙的肩胛上，却只在那鳞甲上溅起几点火花。龙爪横扫，他侧身躲过第一击，第二击便跟着将他的肩甲撕裂。第三击直直贯穿他的左腹。剑飞了出去。白厄整个人被撞进残垣深处，雪与碎石涌进伤口。\n深紫色的光再度凝聚。塞纳托斯张开嘴。白厄看着那团光越来越亮，双腿却再也撑不起来。一道金色的屏障骤然展开——奥赫玛配发的紧急防护魔法替他挡下了必死一击，随即炸裂成无数碎片。碎片割破了他的脸侧和手腕，也给了他一口气的时间。\n他攥紧那颗还在闪烁的防护核心，咬紧牙，拖着撕裂的腿朝废墟外侧退去。\n塞纳托斯没有追来。那双紫色漩涡般的双眼在黑暗中冷冷地注视着他的逃跑，似乎不屑于补刀，又似乎在说：你还不够格。\n白厄跌坐在雪地里，血从指缝间滴落，在白雪上晕开了一条长长的线。\n一个人。一柄剑。一座死城。他什么都没能带回来。\n除了一个清楚的认知——有些东西，不是单靠意志就能战胜的。"
paw.xxxx.a: "我还不够强——但我活着回来了"  #觉醒值 +4
paw.xxxx.a_tips: "白厄捂着肩上的伤口，望向哀地里亚的方向。这一次他连剑都没能握住，但他记住了那头龙眼睛里的东西——那不是敌意，是某种近乎审判的漠然。下次。下次他不会输。"
paw.xxxx.b: "一个人不是它的对手。必须找到更多帮手"  #觉醒值 +2
paw.xxxx.b_tips: "白厄扶着断壁缓缓站起身。这不是他第一次独自作战，但这是他第一次意识到，有些敌人不是一个人就能战胜的。也许下次进哀地里亚之前，他应该找到能和他并肩的人。"

paw.xxxx.t: "日常训练"
paw.xxxx.d: "奥赫玛的训练场在圣城东侧，一片由砂土和石板铺成的开阔场地。清晨无人时，这里的风声比别处更响。\n白厄是最早到的。\n他在哀丽秘榭练过剑。那时候的靶子是麦田边的木桩，握剑的手还没有现在这么稳。从故乡来到圣城，装备换了，场地换了，陪练的对手从村里的长辈变成了正式的黄金裔——但有些东西不该换。\n热身从基础开始。他用的是训练场配发的标准剑，比自己的佩剑更沉，重心也更靠前。先挥直劈，再练斜斩，每一组动作之间的间隙很短——不是为了快，是为了让肌肉记住正确的轨迹。汗水顺着额角往下淌，但他没有停下来擦。\n沙袋是新换的。白厄挥拳击打沙袋时，听到填充物在皮革下闷响，手感比昨天更实。他想起哀丽秘榭的训练场上挂过一只旧沙袋，皮面早就磨破了，每次下雨都要晒上半天。那只沙袋最终和村子一起被黑潮吞了。\n他把沙袋打偏了一拳的距离，然后用脚尖拨正，继续。\n靶场在训练场的另一头。白厄换了短刀，在靶桩之间快速移动，刀尖精准地扎进每一个靶心。移动靶区没人操控——他设定了最简单的自动模式，靶标从左右两侧交替弹出，速度不快，但出靶的节奏没有规律。他必须时刻盯着两个方向，一个靶子都不能漏。\n他漏了第三个。\n白厄皱了皱眉，没有说话，只是把短刀收回鞘中。\n训练最后，他平躺在训练场中央的石板上。奥赫玛清早的云层依然很厚，阳光从某个角落漏下来，但还打不破满场的灰。他闭上眼睛，听风声从靶桩之间穿过。身体还在发烫，每一块肌肉都泛着使用过后的酸胀。这种疲劳很诚实——你付出多少，它就给你多少。\n他站起身来，用毛巾擦干剑身上的汗渍，重新佩好。今天没有打出值得记入训练记录的辉煌数字，也没有任何人来观看或评价。唯一陪伴他的，只有不断让自己把姿势再压低一点、挥拳再快一点的心。\n但这正是他需要的。不是那些被反复昭告的使命，不是女皇的训示，不是外界的认可——只是自己知道自己还握得住剑。\n训练场外，奥赫玛的晨钟响了。第一拨来训练的黄金裔陆续推开栅栏，有人对白厄点头打了个招呼，有人还在低头揉眼睛。白厄拿起自己的水囊，准备离开。走之前，他在训练记录册上写了几行字。不是汇报——是备忘。\n“右肩后拉的弧度不够。移动靶第三弹出错。下午回来补。”\n他把剑系紧，推开了训练场的栅栏门。"
paw.xxxx.a: "基本功不会骗人"  #觉醒值 +1
paw.xxxx.a_tips: "白厄将训练记录册合上。今天没有打破任何记录，但他确认了一件事：在哀丽秘榭学会的每一个动作，都没有被身体遗忘。"
paw.xxxx.b: "还不够——下午继续"  #觉醒值 +2
paw.xxxx.b_tips: "白厄还没踏出训练场，心里已经在排下午的训练计划。那个移动靶的失误像一根细刺搁在喉咙里，不拔掉就不舒服。"
paw.xxxx.c: "有人来了。训练场会越来越吵"  #觉醒值 +1
paw.xxxx.c_tips: "白厄拿起水囊，对刚进来的几个黄金裔点了下头，便独自走回营房。今天的安静份额用完了。下午他会在别人午休的时候再来。"

paw.xxxx.t: "盗火行者"
paw.xxxx.d: "奥赫玛的黄昏沉得比平时更快。\n白厄从训练场走回营房时，听见城墙方向传来一阵压低了声音的骚动。不是黑潮来袭的警钟，而是传令兵在城墙上下奔跑。脚步声急促，蜡封信函在风中哗哗作响，所有人都压着嗓子说话，仿佛声音大一点就会惊动什么。\n他在营房门口截住了一名跑过的传令兵。\n“谁？”\n传令兵将一份蜡封的简报递到他手上。黄金裔有权随时查阅前线战报，这是元老院的规定。封口已经被拆过，显然不是第一道传递的人。白厄展开那张揉皱的纸，目光落在几行字上：\n“……无名剑士伴随黑潮出现，身份不明。覆面，黑衣，剑技极高。目标明确——只追击持有火种的黄金裔。通过火种追踪英雄位置。一旦发现目标，便不依不饶，直至拿到火种为止。已有数位持有火种的黄金裔被他攻击。无人丧生。但他夺走了一份本该由英雄回收的泰坦火种。”\n简报里夹着一张炭笔速写，是从幸存者证词中描绘出的画像：黑衣，面具，手持一柄暗色的剑。没有五官，没有表情，只有一道模糊的人形轮廓，像一道从黑潮深处割出来的影子。\n他的指节在纸边停住了。那个黑衣剑士站在速写的中心，身旁是烧焦的街道。\n“盗火行者。”路过的士兵压低声音，像在说一个不该大声提起的名字，“他从黑潮里走出来，没人知道他是谁。这几天大家都在议论纷纷，说几名黄金裔兄弟刚从万神殿取出火种打算前往奥赫玛，没多久后又快马送回一张纸条，说火种被人抢了——不是偷，是当面硬抢。”\n白厄握着那幅画像的手在轻轻发抖。他觉得那个模糊的轮廓有一种不该存在的熟悉感。\n“他在哪里出现的。”\n“神悟树庭附近。”传令兵指了指报告末尾的坐标，“据说他也在靠近哀丽秘榭的方向徘徊过。但我们的人去的时候，哀丽秘榭那边没有新的袭击——废墟上只有一些旧剑痕。”\n白厄神色一变。他警觉地低下头看了一眼那张炭笔速写。那个无名的黑衣剑士——他的活动范围越来越靠近奥赫玛，而且似乎知道黄金裔的行动路线。\n而他一路跟踪火种的姿势，与一个在废墟边反复拔剑的人，似乎没什么不同。"
paw.xxxx.a: "哀丽秘榭的废墟上只有旧剑痕——说明他至少去过那里" #觉醒值 +3
paw.xxxx.a_tips: "白厄将速写折好塞进胸甲下，嗓音闷着没有空气可以掺进去。那个无名剑士出现在废墟附近绝对不可能是巧合——也许他才是更早踏入那个村子的东西。"
paw.xxxx.b: "他夺走火种，却不伤人"  #觉醒值 +2
paw.xxxx.b_tips: "白厄没有起身，只是将报告沿着褶印重新叠好。一个剑技高到能硬抢火种的人，却不留伤员。这不是心狠手辣的行事风格，更像是在做某种只针对使命的警告。但警告谁呢？"

paw.xxxx.t: "首战"
paw.xxxx.d: "白厄赶到旧塔废墟时，战斗已经开始了。\n那座废弃的哨塔立在逐渐褪色的晚霞之下，塔身爬满了干枯的藤蔓，千百年来没人清理过。而声音撕开了荒野应有的安静——金属撞击，然后是痛呼，然后是风。白厄从塔底绕到左侧废墟的石墙后面，按紧剑柄，蹲下身子往外看。哨塔前的碎石场已经被人用黑潮的力量犁了小半圈，深陷一片紫黑色的水流般的光芒。半跪在水光中央的是一个穿着奥赫玛制式轻甲的年轻黄金裔。白厄不认得他的脸——大概是近期才通过试炼、尚未打过交道的小姓氏族。他的右手捂着左肩，左臂垂着，嘴边挂着一道还没煮熟的喘息。一条断断续续的金线在地表上明灭不定，像是想替他再拉一截退路，但他的指节已经接近半透明——那是金血消耗过度的标志。\n而他对面站着的人，只是站在那里。覆面，黑衣，手按在剑柄上。剑身裹着一层深得不像金属的暗芒，像是从黑潮里直接牵引出的伤痕。面具没有表情，黑底的金属格栅上似乎曾有过什么东西从内部烧穿了表漆，凝结成了放射状的黑焰痕迹。白厄这辈子都在挥剑，他只需要看那个人站着的方式——重心微微偏左，前掌压地往前倾了寸许，肩膀放松，不与剑身的重量抗衡——就知道自己今晚很可能不是一个级别。\n废塔下方有一股残余的黑潮在贴着碎石翻涌，似乎在等待那黑衣剑士下一个动作。但他没有看倒在地上的年轻人，只是平抬起手，用剑抵住了对方身前那枚刚回收到一半的浮空火种。那枚火种在半空中剧烈地颤了颤，然后变形，化成更烫更稠的一束光，缓慢地渗入暗芒的剑脊。“不——”年轻黄金裔挣扎着爬起来，伸出只剩半截金色的手掌，“那是我们族系……”他没能扑过去。黑衣剑士收剑入鞘，随手从腰侧拔出另一柄较短的符刃，向后划了一道符文，残留在空气中的黑尘就全部被吸进符里，像什么都没发生过一样。从白厄的眼中，那年轻人伤势虽重，但若能得到及时治疗至少不会立刻发生生命危险，只是他一时无法从地上站起来，只能看着火种被一点一点抽走。\n白厄不知道自己为什么没有上前。不是怕死。是那个人刚才持剑的时候，把整个后背都留在了一片没有任何掩体的碎石上。那不是疏忽，那是他不在乎。他不认为这里有任何值得警戒的东西。他不认为那个在地上喘息的年轻黄金裔值得拔第二剑。这种沉默的、无心的轻蔑，比任何威胁都更让他脊骨发凉。\n他踏出墙后。剑出鞘伏在身侧，尽力把脚步放平稳。“放下那颗火种。”\n黑衣剑士侧过头。面具很慢地从火种的方向移向他，没有丝毫多余的停顿，双肩纹丝不动。白厄在那张脸上只看到那副面具被曙暮光抹得微亮，隐约可见后头两个像是被炭笔描过的眼眶轮廓——他没有再往下看，因为他很快感觉到对方已经完成了对他的评估。\n他的剑比那枚火种轻。这不需要战斗来证明。\n白厄提剑冲上去。\n他没有打算赢。他只是下意识按住了拔出剑的第一个起手劈砍，把力道收了两分以留出应对对方接下来任何可能的反击的余地。然而对方的剑并未出鞘。黑衣剑士只是在他劈下的瞬间抬手拍住他剑脊侧面，拍得极轻，像是拨正一件没摆好的餐具，然后一脚蹬在他的小腹上。\n那一蹬甚至比他自己的剑垫卷还短，但力道直接破了表。白厄闷哼着往后连退了数步，双腿打得沙地稀碎。他几乎来不及摆好下一式，重心还在后仰的边缘拼命往回拉，恐惧刚拧到一半。第二下直接绕过来，他一剑斜砍与对方剑鞘的尾端硬碰硬接住，腕口噔的一声被震下发麻。他咬紧牙，接着就是第三下、第四下——每一次都比前一次更短，更急，更快，好像与他交手的是一个把骨骼也镀成了钢铁的持剑者，却比他多呼吸了几万次战场硝烟。他甚至不需要出剑。他只需在每一剑的空隙里前进半步，白厄便往后退三步。\n然后他停了一下。不是疏忽，是他决定不再等了。\n白厄没有看见他有没有举剑。他只看到那个灰蒙蒙的剑鞘在最后一秒比他的剑尖更早抵达自己的手指——一下便将他握剑的右腕向上翘起，随即拧过，白厄仰天摔在碎石地上。耳朵里嗡了一阵。背胛骨痛得像一根不知被谁弹断的弦。剑落在两步外的地方，刀面上倒映的天际线已沉没成渐逝的狭虹。而那份之前还属于另外一名黄金裔的火种，早已彻底被吞噬进了那无名的黑剑之中。年轻的黄金裔仍撑在地上，想朝火种消失的方向伸出手，却连爬也爬不起来了。白厄仰天躺在地上，这时的他心里只剩一个比伤口更冷的念头：对方从始至终没用过超过两成力。黑衣剑士没有杀他。他站在暮色里，将短符刃收回腰侧，俯脸看向地上狼狈咳血的白厄。\n夕阳已经即将完全沉入山脊，光线暗得不像黄昏，倒像一颗正在冷却的铁。而白厄望着那张面具，感觉它没有刻意吞噬光。它只是不反射。一片连光都无法寄宿的表面，沉静地站在暮色边缘。他站稳双腿，把剑重新拎起来。剑柄上还沾着黏湿的血。黑衣剑士没有回头。他转身从矮石碑的缺口走出废墟，仿佛他所要取的那枚火种已经不在废墟中了，而他只是路过。暮色完全沉入山脊后。废弃的哨塔在风中静静站立。白厄撑着剑在碎石里站了太久，久到废塔里的野鸽子不再出声。"
paw.xxxx.a: "他连剑都没拔——却让我在地上喘了十息"  #觉醒值 +5
paw.xxxx.a_tips: "白厄吐了一口带血的唾沫在碎石上。他不是没打过必败的仗，但这场败仗从头到尾的差距都捏在一个人的掌心里，像是对方反复校准过每一分力气。他记住这份差距，下一次他会把剑递到更近的位置。"
paw.xxxx.b: "他夺走了火种，然后走了。就这样。"  #觉醒值 +3
paw.xxxx.b_tips: "白厄蹲在年轻黄金裔刚被抬走的地方，火种被人从剑身里抽走的画面还在他指骨里搁着。那黑衣剑士没有杀人，但他做了更蛮横的事——他把火种带走了，像是从没说过要留给你。他到底为什么要收集火种？他不是黑潮的傀儡，他是冲着逐火来的"
paw.xxxx.c: "他的战斗习惯……像在跟我用同一本剑谱" #觉醒值 +3 解锁隐藏触发条件
paw.xxxx.c_tips: "白厄在整场交手的时间里只留意了一个细节：那人的步伐习惯、发力节奏、剑气收束时的微小调整——和他从哀丽秘榭带到奥赫玛的剑技几乎一样。他躺在地上的片刻间立刻想起另一件事：为什么他宁愿挨那几下，也不对自己的心脏补上最后一剑。"

paw.xxxx.t: "最初的火种"
paw.xxxx.d: "那枚火种是在哀丽秘榭外围的废墟里找到的。白厄不是专程来这里。三天前他追踪一条黑潮退散的痕迹，线索断在了一截塌了半边的渡槽前。他本该回头，但脚下踩到的石板发出了中空的声响。石板下面是一间被地震掩埋过的地窖。坍塌的石梁斜着压在入口上方，只留了一道窄缝。白厄将剑鞘探进去试了试，然后侧身挤了进去。空气很干。没有黑潮侵蚀过的腐败味——说明这里封存的时间比村子覆灭还早。白厄举起火石，微弱的光扫过地窖四壁。石壁上刻满了褪色的符画，不是哀丽秘榭的风格。一个长桌，几只早已碎裂的陶罐，和一具靠在角落的骸骨。骸骨穿着早已朽烂的轻甲，胸甲上的纹章被尘土覆盖了大半。白厄半蹲下来用拇指擦了几下——那是一个早已消亡的黄金裔族系的纹章，他只在奥赫玛的名册上见过。这个人，不知多少代以前也曾在逐火的路上倒下。那人倒下的姿势不是蜷缩，不是挣扎。他背靠着石壁，双手搭在膝上，掌心向上——不是在接受什么，而是在递出什么。掌心中搁着一枚被黑斑覆裹的石珠。石珠表面并不光滑，像是未经淬炼的原矿，形貌普通。但当白厄伸出手指轻轻触碰它时，石珠极慢极慢地绽开第一道裂纹。裂纹底部，一小缕比落日更重的光芒向外试探着，像是沉在水底的东西终于碰到了能接住它的人。\n火种。\n白厄的手停在那里。他在书上读到过：每一代的黄金裔以使命寻找火种，而他想过可能在某处发现它们，但他第一次对面前的这枚火种产生如此真实的想象，是在那人掌心绽开的瞬间。这枚火种没有铭文，没有说明，它唯一讲述的东西，是那些他在废墟中看见的旧日场景——村庄燃灯、长老在炉火旁讲述英雄传说——属于哀丽秘榭的故事，属于早已逝者的故事，都属于他曾经认为只属于使命本身的故事，都通过那个静静躺在掌心的人递到了他面前。\n他合上手掌。火种很轻，轻到像是空心的。但同时也很烫。\n他将火种收进了随身的收容袋。\n奥赫玛的黄昏洒满石阶，元老院门口的守卫的剑在鞘里，接了过白厄递来的火种，小心翼翼地转呈给了室内。元老们并未直接夸奖白厄，只是迅速记录在案并讨论着，但那个摊开的收容袋被几位代表反复查验了许久，纸丛间有人低声念出哀丽秘榭的名字。这不是白厄回收的第一件东西，但这是他第一次有了写下记录的资格。他站在记录员身后，写下报告的手很稳，但他在执笔者旁边多呆了几秒，确认那行记入正式逐火录的文字没有漏写那具遗骸的年代。走出元老院时，他的肩胛骨微微发酸。是矮着身子挤过那间石室的证据，还是在废塔那晚跌在地上还没彻底复原的旧伤——他想不清。但他的手心还留着火种石壳的温度，那道细小光隙在他握紧的拳头中心留下了一缕薄汗。那是这枚火种与他之间的秘密——他还没有对任何人说过，在他触碰那枚火种的那一刻，他看到的不是诞生翁法罗斯的圣火，而是哀丽秘榭最普通的夜晚：有人点了灯，磨了麦子，修补羊圈，扶着老人从水井边慢慢走回来。这些场景从来没有被记载在任何一份逐火录里，但火种选了这些画面，留在自己的那抹微光里。\n他把手重新搁上剑柄，走下石阶，感觉这条逐火之路终于开始向他提出真正的问题。"
paw.xxxx.a: "这条路，正式开始走了"  #觉醒值 +2
paw.xxxx.a_tips: "他在暮色下走下石阶，剑在腰侧轻轻磕着小腿。之前那些训练、跋涉、互相试探，全都在今天被这颗小小的东西无声地敲上了印记。"
paw.xxxx.b: "火种里封存的，不只是力量"  #觉醒值 +2
paw.xxxx.b_tips: "白厄在暮色中握了握自己的左拳，那道石壳的热度还没完全散去——最普通的夜晚：有人点了灯，磨了麦子，修补羊圈，扶着老人从水井边慢慢走回来。难道那些将这些转交给他的火种，也在记录着这个世界的悲伤？下次找到新的火种时，也许他可以在把它交给元老院之前，先多留一会。"
paw.xxxx.c: "那具骸骨……他是谁？为什么把火种留到现在？"  #觉醒值 +3
paw.xxxx.c_tips: "白厄站了片刻，回头望了望元老院的石柱，那枚火种已经被封存进入逐火记录，但那个交出它的人却被所有的记录一笔带过。他想不起那份纹章属于前任的哪一代黄金裔，只记得那位前任很平静，坐得像个问题。"

paw.xxxx.t: "管理员档案：火种"
paw.xxxx.d: "白厄将火种交还元老院的那一刻，世界再次凝固。\n不是第一次了。你已经能认出这种停顿——喷泉的水珠悬在半空，守门士兵眨眼的动作停在了一半，白厄还保持着将收容袋递出的姿势。一切都像被按下了暂停。\n文字从静止的画面上浮现，这一次不是代码，而是一行行工整的、带有古典修辞癖好的记录体。\n来古士的声音彬彬有礼地响起。\n“玩家阁下。向你致意。”\n“刚才，你的白厄将人生中第一枚火种交还给了元老院。这是逐火之旅的起点——至少，在黄金裔的叙事里，这是一个值得铭记的时刻。所以我认为，现在是一个合适的时机，为你补充一些背景信息。”\n“关于火种。”\n文字重新排列，像一张被徐徐展开的羊皮卷。\n“十二枚泰坦火种，全部归位，便可以再创世界——这是刻在翁法罗斯每一座神庙墙上的铁则。黄金裔为此而生，为此而死，为此在无数次轮回中前赴后继。你大概已经注意到了，这个世界的全部叙事，都围绕着‘收集火种’展开。”\n“那么，你可能会觉得——作为这个实验的管理员，我应该很关心火种的收集进度。”\n“答案是：我不关心。”\n“火种归位，是黄金裔的使命，但不是我的。我的实验变量从来不是火种——是人心。是黄金裔在逐火之路上做出的每一个选择。是他们在绝境中依然选择信任，还是终于开始怀疑。是在同伴倒下时伸出援手，还是踩着对方的肩膀去够那枚火种。这些才是数据。火种只是道具。”\n“更何况——”\n文字停顿了一行。再浮现时，语气里多了一丝不易察觉的坦然。\n“我从没打算让黄金裔集齐全部火种。十二枚火种全部归位意味着逐火成功，意味着世界将被再创——而这个实验场，不需要成功的样本。它需要的是反复失败、反复挣扎、反复在差一点就能成功的时候功亏一篑。只有在这样的压力下，黄金裔才会做出最有价值的选择。”\n“但如果真有那么一天——如果有人，真的走到了十二枚火种全部归位的那一步——”\n“那只可能是卡厄斯兰那。不是现在的他。是那个终于理解了一切、并选择拥抱毁灭的他。而你我都知道，那个他，正是我培育这台毁灭机器的最终目的。”\n“所以，请放心。火种收集了多少，不重要。重要的是白厄在收集火种的过程中，变成了什么。”\n文字继续滚动，语气变得更轻了一些，像是在交代一份附加说明。\n“最后，关于时间。我想你大概注意到了——这个世界的年份，在你的认知中，被称为公元1936年。然而你所俯视的翁法罗斯，却运行在神庙与广场、石板与羊皮卷的时代。这个技术断层，你或许曾在你们那个时代的科幻小说里读到过类似的概念：当一台运算机器的算力被无限放大，它便能在电光石火之间，模拟出文明兴衰的无数种可能。翁法罗斯就是这样一个实验场。”\n“在你们的时钟上，刻律德菈关闭国境，将翁法罗斯交给我，只过了十余个自然年。但在我这套运算程序里——时间不是线性的。它被压缩、折叠、重置、再重置。一轮完整的逐火之旅从开始到落幕，在你们的时钟上或许只是一瞬，但在这里，它走过了一整个世代。而我，已经运行了它无数次。够把某个变量锻造成一把完美的利刃。数以十万、百万、乃至上千万次的遴选，历经了令人难以想象的时光。”\n“这些，你的白厄当然都不知道。他只知道自己是第一次回收火种，第一次踏上逐火之路。而你有义务记住——他不是。他已经在这条路上走了无数次。只是每一次，都被抹去了脚印。”\n“那么，今天的档案补充就到这里。祝你接下来的游戏愉快——也祝他。”\n凝固的时间骤然松脱。喷泉的水珠继续溅落，守门士兵揉完了眼睛，白厄将收容袋放在了记录员的案头。一切如常。"
paw.xxxx.a: "我明白了"  #觉醒值 +1
paw.xxxx.a_tips: "你没有多说什么。这份信息并不令人愉快，但它解释了很多事——关于使命、关于火种、关于白厄为何永远在失败边缘徘徊。"
paw.xxxx.b: "所以火种是你撒的诱饵，而你从来不打算让任何人吃到"  #觉醒值 +2
paw.xxxx.b_tips: "你在静止的时空中挑了挑眉。来古士似乎对这个评价颇为满意，在消失前留下了一句：“诱饵这个词，比我自己想的更精确。谢谢。”"
paw.xxxx.c: "无数次轮回——他什么都不记得，你却要我记住"  #觉醒值 +1
paw.xxxx.c_tips: "你看着静止画面中白厄的背影。他毫不知情地交出了火种，以为这是逐火之旅的起点。而你知道——他已经在同一个起点上站了无数次。"

paw.xxxx.t: "终结轮回"
paw.xxxx.d: "火种到齐的消息是深夜传到奥赫玛的。\n昔涟站在城门外的星光下，粉色的短发被夜风吹得微乱。她交出的那枚火种没有收容袋，没有铭文，没有任何一份逐火录记载过它的存在。白厄接过它的时候，手上的动作顿了半拍——无论他之前是否见过昔涟，这枚火种本身的存在都已足够令人意外。昔涟没有多做解释，语气平淡，仿佛只是在交代一件小事：“我问了很多很多次，才找到一个愿意把这东西托付给我的人。收好啦，这东西我可不能替你交。”\n与此同时，黑潮撕开了城外的迷雾。\n负责瞭望的士兵几乎来不及拉响完整的警钟。从奥赫玛城墙上望去，东面一整片乌云压得很低，不是云——是混着黑尘与杂音的潮水，以超出任何战报记载的速度朝圣城推进。骑兵斥候拼死在路上放飞最后一批信鸦，禀报黑潮前锋距城墙已不到两日路程。\n奥赫玛在这一夜没有睡觉。每一座钟楼都在敲，每条街道上都是奔跑的传令兵。\n黄金裔的领导者连夜召开了紧急会议。元老院的石座上坐满了人，但没有人上台发言，所有人都只看着那三枚新到的火种——它们被陈列在长桌中央，火光在彼此之间跳转，照得每个人脸上忽明忽暗。\n十二枚火种全部到齐。这从来没有发生过。\n殿中静了片刻。然后白厄走上前。\n他没有注意那些看过来的目光。他早在此前就已经查过逐火文献：十二枚火种通过创世涡心的创世火盆合为一体，火盆点燃的那一刻，轮回将被斩断，那些反复挣扎、失败、死去又从头再来的轨迹将在烈焰中得以重组，旧世界会在英雄的意志下收起它的帷幕。然后——新的翁法罗斯将会诞生。运载火种的马车穿过奥赫玛的街道，从圣城出发的一路上，白厄看见很多人：孩子们在矮墙上站起来，老人们扶着门框，守城的年轻士兵握紧长矛冲他微微点头。他们很害怕，但不是怕轮回——他们怕的是希望在最后一寸路程上恰好破碎。他不能让这件事发生。\n石阶通往创世涡心的长度他在往昔的岁月中早就经历过了。但这一次踏过每一阶时，他肩上隐隐发着烫——不是累，是从陪他同行的那些人手里传来的温度。涡心地面上的十二孔缓缓合围，已静置亿万年的创世火盆仿佛被第一缕等待它的火种唤醒，在正中安静地升起。他将十二枚火种依次放入火盆，当最后一枚火种嵌入卡位，火焰不再颤动。他站在涡心中央，闭上眼睛，对着所有那些曾经倒在废墟里没有等到这一刻的男人、女人、看过的脸道别。他说的很轻，在场所有人却都听得见：\n“——所有人，这一次，请随我走到黎明。”\n火光吞没了一切。"
paw.xxxx.a: "......"

paw.xxxx.t: "管理员档案：变量"    #一周目顺利通关！
paw.xxxx.d: "当十二枚火种在创世涡心同时点亮的那一刻，整个翁法罗斯都被白光吞没了。\n不是毁灭性的爆炸，不是黑潮的污染——是光。纯粹的、未经任何变量污染的创世之光，从涡心向外蔓延，铺满了整张地图。奥赫玛的城墙、神悟树庭的枝干、哀地里亚的残垣——每一个角落都被照亮了。\n然后一切都静止了。光还在，火焰在虚空延伸时擦过的低音还在，但画面像被按下了暂停键平铺在原地：黄金裔们互相拥抱、跪倒在地、按住伤口、抬起双手试图呼唤某个同伴的侧影——所有的面容和姿势都被定格在等待黎明的瞬间。\n\n文字从光芒中浮现。来古士的声音彬彬有礼的基底仍然没变，但这一次，他的语调里多了一丝非常细微的、像是运算出错的迟滞。\n“玩家阁下。向你致意。”\n“在刚才的运算中，你的白厄完成了十二枚火种的收集，并在创世涡心点燃了再创世的火焰。这是本轮运算中意料之外的变量组合。十二枚泰坦火种全部归位——这个状态，在之前的无数次轮回中从未被跑通。”\n“但这依然不是一个符合预期的结果。逐火成功、世界再创——这个节点不在当前版本的剧情树中。它的提前触发会导致实验场过早关闭，后续所有数据将失去收集渠道。因此我不会允许这次再创世生效。轮回将继续。翁法罗斯将在下一个周期重置到初始状态，所有泰坦复位，黑潮退回起始线，逐火之旅从头开始。”\n“但作为本次运算的管理员，我必须承认一个事实：你，来自更高位面的玩家，带来了本轮运算中唯一一个无法被归因到预设变量的变量。你的白厄，在这一次轮回中做出的选择，将永远改变未来的数据分布。因此，我将调整下一轮运算的初始条件。”\n文字重新排列，像一份被盖章签署的修改令。\n“变更如下：”\n“一、白厄将保留本轮轮回的模糊记忆。这些记忆将以直觉、梦境、既视感等形式呈现，而非完整的叙事。”\n“二、所有黄金裔将保留与白厄当前关系的残影。他们不会记得本轮轮回的具体事件，但在下一轮中，他们对白厄的初始态度将反映本轮的关系值基线。”\n“三、本轮回收的全部十二枚火种将被清空。下一轮回启动时，火种分散复位至对应的泰坦及隐藏节点。但本轮的火种归位路径将被存档，作为下一轮实验的参照。”\n“补充记录——”\n文字在这里停顿了一下。停顿的时间比之前任何一次都长。然后继续浮现时，字形的排列比先前更慢，像是在措辞。\n“在本次运算的火种归位校验中，系统检测到一个异常。个体‘昔涟’向创世涡心提交了一枚火种。这枚火种不在本轮预设的任何火种节点中，它的来源无法被追溯——不是本轮任何黄金裔回收的，不是从泰坦身上剥离的，不是从上一轮继承的。但系统接收了它。并依照火种归位协议，将它计入了十二泰坦的对应席位。”\n“我正在检查这个错误。”\n又是一段更长的停顿。文字的浮现几乎是一个字一个字地在往外推。\n“……检查未返回明确结论。”\n“根据基础人物档案，昔涟的存活状态与当前场景不匹配。根据火种分发协议，她不应持有任何火种。根据火种校验流程，她带来的那枚火种不应通过合法性认证。但以上三条规则全部被绕过了。不是被违反——是被绕过。系统没有报错，校验层没有触发警报，火种归位协议将她的火种视为合法输入。从程序的角度看，一切正常。从管理员的角度看，这不可能。”\n“我目前没有在权限日志中找到篡改痕迹。也没有在她身上检测到外部写入的指令残留。她带来的那枚火种——来源未知，渠道未知，认证状态合法，恰好是十二泰坦中最后一个空缺的席位。这不是巧合。但我也无法解释它是如何发生的。作为这套程序的管理员，这不在我当前的理解范围内。”\n“我会将她标记为待审查对象。下一轮运算中，我将额外监控她的行动轨迹和火种交互记录。”\n文字逐渐变淡，光芒开始褪去。\n“下一次轮回开始时，一切都不应该是白板。我们下一轮见。”\n光全部消失。时间在静止了几息之后重新开始流动——从奥赫玛到哀丽秘榭，每一簇燃尽的火种余烬都重新依序分开，然后再次融入黑暗。\n然后一切归于寂静。不是死寂。是下一段前奏开始之前，那个极短暂的休止符。\n紧接着，残余的焰光重新铺成翁法罗斯的崭新疆域——钟声重新敲响成黎明的召唤，石板路从广场重新铺到城门前，一名年轻斥候睁开双眼，按着膝盖上的剑柄重新攀上城墙。悬心石再度悬浮在半空，发出细小的嗡鸣，像来自第一秒的弦音。\n你听见来古士的声音在黑暗中回荡，没有文字，只有一行轻得几乎听不见的低语：\n“……运算重置完成。新轮回开启。”"
paw.xxxx.a: "新的轮回开始了"

paw.xxxx.t: "轮回继续"  #一周目失败！
paw.xxxx.d: "黑潮抵达奥赫玛城下的那个黄昏，火种仍未集齐。\n城墙上的守卫吹响了最后一遍号角。不是求援——已经没有援军可求了。所有能派出去的黄金裔都派了出去，所有能回收的火种都回收了。但还差几枚。始终差几枚。\n元老院的议事厅里，火种被陈列在长桌上。不是十二枚。从来没有十二枚。有几枚泰坦始终没有被找到，有几枚在回收途中被黑潮吞没，有几枚——或许从一开始就不在这一轮逐火的地图上。没有人说话。没有人知道该对这份欠缺说什么。\n白厄站在长桌前。他的手按在剑柄上，指节收得很紧。他曾在一个废弃的地窖里找到过一枚无名的火种，那枚火种现在正摆在桌上，和其他几枚一起，微弱地亮着光。但不够。光不够。\n城外，黑潮撞击第一道城墙的声音像闷雷滚过地面。碎石从穹顶上簌簌落下，烛火跳了跳，又跳了跳。有人站起来，有人没有。有人开始低声念诵刻法勒的名字，念到一半就停了——不是忘了词，是喉咙再也发不出声音。\n白厄抬起头。他看向窗外——不是看黑潮，是看更远处的方向。哀丽秘榭的方向。废墟的方向。他想说点什么，但他最终什么也没说。他只是握紧了剑，走向城门。剑鞘磕在石阶上，发出一声又一声沉闷的响。\n然后一切都被黑潮淹没了。\n不是战斗的终结。不是英雄的末路。只是时间到了。这一轮逐火，收集到的火种数量不足以启动创世涡心。黄金裔没有输给黑潮——他们只是没有赢。就像之前的无数次轮回一样。就像来古士从一开始就知道会发生的那样。\n光芒从奥赫玛的中心黯淡下去。风停了。钟声停了。所有还在奔跑的脚步、还在呼喊的声音、还在握住剑柄的手指——全都停在了一瞬间。\n然后世界开始重置。"
paw.xxxx.a: "......"

paw.xxxx.t: "管理员档案：轮回"  #非必要档案
paw.xxxx.d: "文字从黑暗中浮现，不是红色的错误代码，不是紧急插入的警告。只是平静的、例行公事的记录。来古士的声音恢复了他一贯的节奏——彬彬有礼，不急不缓，像是在口述一份实验日志。但这一次，那彬彬有礼的措辞之间，隐约透着一丝被克制得很好的、不易察觉的失望。\n“玩家阁下。向你致意。”\n“本轮运算已结束。火种收集数量不足，创世涡心未被激活。逐火之旅——于翁法罗斯标准时间的暮钟敲响前——宣告失败。”\n“坦白地说，我有些失望。”\n“你并非我第一次接触的玩家变量。但你是我投入了最多观察时长的一位。在之前的运算中，没有玩家介入的轮回最终也会走到这一步——火种不足，时间耗尽，一切被默认协议重置。我本以为，一个来自更高位面的意志，至少能在关键节点上推动变量偏离预设轨道。但你带来的波动，最终被系统消化了。”\n“你的白厄确实做出了若干次偏离常规的选择。这些选择在中期生成了几个次级变量——但它们未能汇聚。未能扩散。未能突破火种收集的临界阈值。在最终的运算评估中，这些波动被视为标准偏差范围内的噪声。不值得存档。不值得继承。不值得在下一次轮回中保留任何痕迹。”\n“因此，本轮重置将采用默认协议：完全重置。”\n文字重新排列，像一份被归档前最后签字的判决书。\n“重置范围如下：所有已完成的事务将被清除，回归未执行状态。所有角色结识状态将被清空——黄金裔们不会记得白厄，不会记得与他的任何交集。所有角色关系值将恢复至初始默认值。只有觉醒值将被保留，作为对你——观测者——在本轮中存在过的唯一记录。换句话说，下一轮开始时，一切归零。你再见到那些黄金裔的时候，他们将是第一次遇到白厄。你再走那些路的时候，地上的脚印全是新的。你唯一能带走的，是你自己的判断——如果你的判断在本轮确实有所积累的话。”\n文字停顿了一行，像是在斟酌最后的措辞。\n“我不会祝你下一轮好运。运气不是变量，选择才是。如果你还打算继续参与这个实验——我希望下一轮，你能带来一些真正值得被存档的东西。”\n黑暗中，最后一行文字缓缓浮现，然后连同来古士的声音一起消散。\n“……轮回已重置。下次再见。”"
paw.xxxx.a: "轮回继续"

