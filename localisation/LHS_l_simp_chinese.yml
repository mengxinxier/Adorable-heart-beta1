LHS.76.t:0"当一切成灰"
LHS.76.d:0"踩在王宫地板上的脚轻轻颤抖着。\n外面那场由我亲手点燃的、盛大的死亡宴会，也结束了。\n这里，很安静。安静得，能听到自己心脏碎裂的声音。\n瓦伦蒂娜倒在她的王座之下。没有流血，没有挣扎。我的匕首刺入她心脏的那一刻，她那看似不朽的身体，就像一尊风化了千年的石像，从内部开始崩溃。\n她只是深深地、带着一种……我无法理解的、近乎解脱的疲惫，看了我最后一眼。\n然后，她就碎了。\n先是皮肤，像干涸的泥土一样裂开；然后是血肉，化作了墨黑色的、细密的尘埃，从盔甲的缝隙中簌簌流出，在地上积了薄薄的一层。\n她死了。\n我赢了。\n我的计算……没有错。我预判了她所有卫队的调动，我算准了她最空虚的时刻，我甚至算到了她最后会选择独自留在这座象征她权力的空壳里。\n我赢了！\n我赢了。。\n我赢了……\n我……赢了什么？？？\n我跪倒在地，双手不受控制地、深深地插进那一堆冰冷的灰烬里。那灰烬的触感，和矿井里最干燥的煤灰一模一样。\n我赢了。\n于是，我失去了那位老婆婆；我失去了那些在电台里笑着和我诀别的同志；我失去了那些船上，所有信任着我的、鲜活的生命。\n我把她们，一个个地，都变成了我胜利方程式里的一个参数，一个可以被计算、可以被牺牲、可以被……遗忘的代价。\n晓枫姐……雪伊姐……\n你们看到了吗？\n这就是……我交出的答卷啊。\n我用尽了你们教给我的一切，我甚至比你们更冷酷，更“理智”，我用最“划算”的方式，赢得了这场战争。\n可为什么……为什么我感觉……我把你们，也一起弄丢了。\n我低下头，额头抵着那堆冰冷的灰。眼泪，终于不听使唤地，一颗一颗砸了下来，将那干燥的灰烬，洇出一片片深色的、小小的印记。\n我好像……什么都想不起来了。\n想不起来她们的嘱托，想不起来革命的意义，甚至想不起来，我为什么要在这里。\n我只知道。\n好冷啊。"  
LHS.76.a:0"……"

LHS.77.t:0"一封来自黎明的信"
LHS.77.d:0"我不知道自己在这里坐了多久。一天，还是两天？\n外面那场荒唐的死亡宴会，随着瓦伦蒂娜的消逝，已经彻底平息了。世界，迎来了它从未有过的、死一般的寂静。\n我赢了。然后，我坏掉了。\n就在我以为自己会永远被困在这片灰烬里时，一双布满老茧的手，将一本旧旧的、皮革封面的笔记本，放在了我的膝上。\n我抬起头，看到了那张熟悉的脸。是当年公社的老书记。她的眼里没有责备，也没有赞许，只有一片深不见底的、令人心碎的温柔。\n“孩子，”她声音沙哑地说，“这是……晓枫指挥官，留给你的。”\n我的手指颤抖着，翻开了那本笔记本。\n里面没有军事部署，没有战略蓝图。只有晓枫那清秀而熟悉的字迹。\n第一页，只有一行字。\n“致我的禾果：”\n我的心脏，在那一刻，仿佛被一只温暖的手，狠狠地攥住了。\n我继续往下读。\n“如果你能读到这封信，那一定意味着，我们之中，最不该背负这一切的孩子，最终，却独自背负了所有。\n我从不担心雪伊。她是一团烈火。就算她烧尽了整个世界，她也会在灰烬上，固执地、笨拙地，重新种下第一棵树苗。那是她的本性。\n但我一直担心你，禾果。因为你太善良，也太聪明。我早就知道，当只剩下你一个人时，你会选择那条最快、最有效，也最让你痛苦的道路。你会把所有的罪责都扛在自己的肩上，你会把自己变成一把最锋利的、冰冷的刀，然后，在刺穿敌人心脏的那一刻，让自己也跟着……彻底碎掉。\n我阻止不了你，因为我知道，那是当时唯一的选择。\n所以，这是我留给你，我们野火革命军的总参谋长，留给你的，最后一道，也是最重要的一道命令：\n……去休息吧。\n去睡一个长长的、安稳的觉，去看看海，去听听孩子们唱歌，去重新尝一尝糖是什么味道。把你肩上那些沉重的、不属于你的东西，都放下来。那不是你的罪，那只是……我们那个时代，无可奈何的悲伤。\n等你什么时候，能再次为一颗糖而笑，能再次为一首歌而哭……\n革命，才算真正迎来了她的黎明。\n而我和雪伊，会在那片黎明里，等着你回家。”\n我再也忍不住了。\n我抱着那本笔记本，在这座空无一人的王宫里，在这片由我亲手缔造的、死寂的废墟之上，哭得像一个迷路的孩子。"  
LHS.77.a:0"……嗯"

LHS.78.t:0"我还记得"
LHS.78.d:0"哭声消失了。\n在我强迫自己听完了所有断断续续的求救和绝望的叙述后，我关掉了电台的外部喇叭。\n整个世界，又变得和我一个人时一样安静。\n可这一次，那些声音，那些画面，却像烙铁一样，印在了我的脑子里，再也关不掉了。\n虫子……殖民者……破碎的人偶……\n原来，我拼尽一切打倒的，只是这座巨大监狱里，最高、最显眼的那座哨塔。而在我看不到的阴影里，还有无数更隐蔽、更肮脏的牢房，关着和我曾经一样的人们。\n我的胜利，到底……守护了什么？\n就在这时，一阵轻微的、几乎被我忽略的脚步声从身后传来。我回头，看到了那个一直跟着我的、最年轻的通讯兵。她也是从那场灾难中幸存下来的少数几个人之一。\n她没有说话，只是默默地走到我身边，从怀里掏出了一样东西，放在了桌上。\n那是一把用贝壳和细麻绳串起来的、很粗糙的口琴。\n是晓枫姐的遗物。\n“禾果……同志。”她第一次这样叫我，声音很小，带着一丝颤抖，“我……我刚才在整理晓枫指挥官的遗物时，找到了这个。她说……她曾说等仗打完了，要教我们吹一首新写的歌……她说，那首歌，是写给所有……还在夜里赶路的人听的。”\n她把口琴轻轻地推到我面前。\n“我……我不会吹。但是我想……您一定还记得那个调子吧？”\n我看着那把在战火中幸存下来的、小小的口琴，上面还沾着一点干涸的泥土。我仿佛又回到了那个夜晚，在卡卡罗姆的矿井下。\n我的手指，终于松开了紧攥着的衣角，颤抖着，伸向了那把冰冷的口琴。"  
LHS.78.a:0"（拿起口琴）……嗯，我还记得。"

LHS.79.t:0"来自斯塔王国的一批抵抗势力投靠了我们"
LHS.79.d:0""
LHS.79.a:0"太好了" 

LHS.80.t:0"来自艾琉希欧的一批抵抗势力投靠了我们"
LHS.80.d:0""
LHS.80.a:0"太好了" 

LHS.81.t:0"南十字星下的第一次全体会议"
LHS.81.d:0"南十字星公社的第一次全体干部会议，气氛有些……奇特。\n新上任的农业部长，一位经验丰富的老农，正激动地汇报着今年的土豆种植计划。她讲得眉飞色舞，从土壤酸碱度，讲到不同品种的抗寒性，最后，她用充满期盼的眼神看着我，问道：“总指挥官同志，关于明年的灌溉系统升级方案，您有什么战略指示？”\n“战略……指示？”\n我的大脑一片空白。\n我……我只知道怎么在暴风雨里保持船的航向，完全不知道怎么让水流进地里。\n看着所有人都在等我开口，我下意识地从兜里掏出了一颗糖——这是以前打仗时，为了补充体力留下的习惯。我剥开糖纸，把糖塞进嘴里，然后，看着桌上的南美地图，用我最熟悉的、制定作战计划的口吻，无比认真地说道：\n“我们……以这条河为主力，分出两支‘佯攻’部队，对干旱区域进行渗透。同时，派出斥候小队，勘探地下水源，作为我们的‘战略储备’。最终目标是……全歼‘干旱’这个敌人！”\n整个会议室，瞬间陷入了死一般的寂静。\n所有人都目瞪口呆地看着我。\n几秒钟后，坐在我身边的、那位从战争时期就跟着我的老兵，终于憋不住，“噗嗤”一声笑了出来。她的笑声像点燃了引信，整个会议室里，瞬间充满了大家善意的、克制不住的笑声。\n我的脸，一下子就红到了耳根。\n“那个……我是不是……说错了什么？”我小声地问着旁边的老兵。\n她一边笑，一边揉了揉我的头发，就像以前晓枫姐做过的那样。\n“没关系，禾果。”她的声音里，全是温柔和笑意，“打仗的事，我们都听你的。但是种地嘛……以后，就换我们来教你吧。”"
LHS.81.a:0"（脸红）……哦" 

LHS.82.t:0" 黑板前的“坏孩子”"
LHS.82.d:0"广场上的大黑板，成了公社最热闹的地方。\n大家真的……开始在上面吵架了。从农业税的比例，吵到新工厂的选址，黑板每天都写得满满当当。我每天最开心的事情，就是搬个小板凳，坐在那里，看大家吵架，然后把那些闪着光的想法，偷偷记在我的小本本上。\n但……也出现了一些奇怪的声音。\n有一群年轻人，她们从不提出具体的方案。她们只是用各种颜色的粉笔，在别人认认真真写下的提案旁边，画上一个大大的问号，或者写一些阴阳怪气的话。\n比如，在农业部长写的“关于引进高产土豆品种的五年计划”旁边，她们会写：“哦？五年？五年后我们是不是就能顿顿吃上土豆了呀？真了不起呢。”\n在工厂代表提出的“关于实行八小时工作制的倡议”旁边，她们又会写：“才八小时？革命的热情难道这么快就消退了吗？真令人担忧。”\n然后，她们就会抱着手臂，在一旁看着那些被气得脸红脖子粗的提案人，露出一副“看，我又赢了”的得意表情。\n我的干部们都很生气，觉得她们是在捣乱。可我……有点好奇。\n于是，在一个午后，我找到了她们。她们看到我，都吓了一跳，以为我要来“清算”她们。\n我只是搬过我的小板凳，坐在她们面前，然后从兜里掏出我的小本本和铅笔，用一种准备认真听讲的姿态，眨着眼睛问：\n“那个……我看到你们写了好多好多问题。你们能……能具体和我说说，为什么觉得那些计划不好吗？是因为土豆品种不适应我们的气候？还是觉得八小时工作制会影响我们的长期发展？我……我不是很懂，你们能教教我吗？”\n她们都愣住了，面面相觑，谁也说不出一句话来。刚刚那股子神气劲儿，一下子全没了。\n我看着她们那副窘迫的样子，突然明白了。\n晓枫姐的笔记里写过：当一个人，从长久的、只能听到一种声音的压迫中被解放出来时，她们往往会陷入两种迷茫。一种，是不知道自己该说什么；而另一种，是不知道除了‘反对’之外，还能说什么。\n因为在过去，‘反对’，是她们唯一能证明自己还‘活着’、还‘在思考’的方式了。\n那不是她们的错。\n那只是……旧时代留下的、一道还没愈合的伤疤。\n我没有再追问。我只是从口袋里，掏出几颗糖，分给了她们。\n“没关系。”我笑着对她们说,"
LHS.82.a:0"“那……我们一起，慢慢想，好不好？”" 

LHS.83.t:0"那幅画"
LHS.83.d:0"公社最好的画师，为我画了一幅像。\n真的……太好看了。画上的我，站在船头，海风吹起我的头发，眼神坚定地望着远方，就像故事里的女主角一样。她们把这幅画，挂在了新落成的“人民礼堂”最显眼的位置。\n每一次，我经过那里，看到大家对着那幅画，露出那种崇拜又敬仰的眼神时，我的脸……都会不自觉地发烫。\n因为，我知道，那不是我。\n或者说，那不只是我。\n于是，在一个没有人的午后，我偷偷地，搬了一个小板凳，又找来了一根画画用的炭笔。\n我踩在板凳上，在那幅巨大的油画旁边，开始笨拙地……往上加东西。\n我画了一个小小的、模糊的影子，在画中我的脚边，那是那个在渔村里，递给我食物的老奶奶。\n我又画了一个更小的、几乎看不清轮廓的影子，在我身后的船舱里，那是那个在突围时，把最后一个救生圈让给我的、年轻的士兵。\n我还画了好多好多影子……在船的缆绳上，在远方的海浪里，在天边的云层中……有挥舞着扳手的工人的影子，有扛着锄头的农民的影子，还有那些……我甚至已经记不清脸庞的、牺牲了的同志们的影子。\n我画得很投入，完全没注意到，礼堂的门口，不知何时已经站满了人。有干部，有工人，有孩子……她们都静静地，看着我。\n直到我画完最后一笔，从板凳上跳下来，才发现她们。\n我的脸，刷的一下，又红了。\n“我……我不是故意的……我只是觉得……这幅画，太空了。只有我一个人，不好看。”我小声地解释着，紧张地搓着衣角。\n没有人说话。\n但那个为我画像的画师，慢慢地走了过来。她看着那幅被我“涂鸦”得乱七-八糟的画，眼睛里，却闪烁着一种前所未有的、明亮的光。\n“不。”她摇了摇头，声音里带着一丝颤抖的、激动的情绪，“现在……它才算真正完成了。”"
LHS.83.a:0"我们所有人都是主角" 

LHS.84.t:0"咸的，还是甜的？"
LHS.84.d:0"公社要为新落成的工人食堂，制定一份标准的午餐菜单。\n这件小事，却意外地，引发了我们成立以来，最激烈的一场大辩论。\n争论的焦点，是一道从我故乡传来的、最普通的食物——豆花。\n以钢铁厂的工人同志们为代表的‘甜党’，坚决认为，劳累了一上午，一碗甜丝丝、滑嫩嫩的豆花，是抚慰身心最好的东西。她们在黑板上写：‘甜，是胜利的味道，是幸福的颜色！’\n而以来自北部农垦区的农民同志们为代表的‘咸党’，则寸步不让。她们认为，豆花里，撒上葱花、淋上酱油，那才叫有滋有味，才能补充干活的力气。她们的口号是：‘咸，才是劳动者最坚实的力量！’\n她们吵得……比上一次讨论五年计划还要认真。从‘历史传统’辩论到‘营养构成’，谁也说服不了谁。\n最后，她们决定，把这个‘关乎公社未来’的重大议题，交给我来裁决。\n她们在食堂里，摆了两大碗豆花，让我品尝后，投出决定所有豆花命运的、‘神圣’的一票。\n我看着面前两碗截然不同的豆花，闻着空气里弥漫着的、仿佛永远无法调和的甜味与咸味，突然觉得……这个场景，好熟悉。\n这……不就是我们一直在讨论的那个问题吗？\n一个人的选择，和所有人的选择。\n我喜欢什么？和我们大家，需要什么？\n我真的……能替所有人，做出那个‘唯一的、正确的’选择吗？\n我看着所有人期盼的眼睛，想了很久。然后，我做出了我的决定。\n我没有去碰那两碗豆花。\n我站起来，走到打菜的窗口，对着负责的师傅，用我能想到的、最认真的语气说：\n‘师傅，能不能……从今天开始，在窗口放两个漂亮的小瓶子呀？一个装糖，一个装盐。让大家……每天都能自己决定，自己的豆花，是什么味道的，好不好？’\n整个食堂，瞬间安静了下来。\n然后，不知道是谁，第一个笑了出来。紧接着，掌声和笑声像潮水一样，响彻了整个食堂。无论是‘甜党’还是‘咸党’，此刻，都在为这个最简单的提议，用力地鼓着掌，笑得比吃了蜜还甜。"
LHS.84.a:0"原来……最好的味道，是自己选的味道。"

LHS.85.t:0"那位奇怪的客人"
LHS.85.d:0"他曾是旧世界里一个很有名的大商人，靠着和王室做生意，赚了很多很多的钱。战争开始时，他逃走了。现在，他又回来了，说是想用他的船队和财富，来帮助我们重建家园。\n干部们为了这件事，在黑板前吵翻了天。\n有人说，他是“资本家”，是“剥削者”，是我们曾经要打倒的对象，绝不能让他加入我们。\n也有人说，他现在愿意为公社服务，他的财富可以帮助我们盖更多的学校和医院，我们应该团结一切可以团结的力量。\n她们吵了三天，最后，还是把这个问题，推到了我这里。\n我决定……先见见他。\n我把他请到了我的办公室。他看起来很紧张，不停地用手帕擦着额头的汗。\n我没有像审问犯人一样问他话。我只是给他倒了杯热茶，然后，用我最好奇的语气，问了他一个问题。\n“那个……先生，”我问，“我听大家说，你以前……很有钱。那，你的钱，是怎么来的呀？”\n他愣了一下，然后开始滔滔不绝地讲他如何发现商机，如何组织生产，如何让工人们为他工作，最终创造出巨大的财富。\n我听得很认真，还在小本本上记着。\n等他说完，我又问了第二个问题。\n“那你……会把赚来的钱，分给那些为你工作的工人们吗？”\n他再次愣住了，额头的汗更多了。“我……我当然会给她们发工资啊。”\n“工资是一样的吗？还是说，你拿走的，会比她们所有人的总和，还要多很多很多？”我眨着眼睛，继续追问。\n他沉默了，再也说不出一句话。\n我好像……有点明白了。\n我合上本子，对他露出了一个笑容。\n“谢谢你，先生，你给我上了一堂很有趣的课。”我站起来，对他说道，“你当然可以留下来。你的船队，你的知识，我们都需要。但是，从今天起，你不再是‘老板’了。你也是我们公社的一员，一个光荣的劳动者。你将和所有水手、所有工人一起，决定船队要去向哪里，决定工厂要生产什么。而你们共同创造的所有财富，也将由你们所有人，共同来分配。你……愿意吗？”\n他看着我，眼神里充满了复杂的情绪，有震惊，有不解，但最终，好像……也有一丝释然。\n那天晚上，我在我的日记里这样写道：\n“我好像明白了。谁是‘人民’，谁是‘敌人’，不是由她们的身份决定的，也不是由她们过去做过什么决定的。\n而是由她们……是否愿意，将自己创造的果实，与所有一同劳动的人们，共同分享来决定的。\n只要她们愿意，那今天还是‘敌人’的人，明天，就可以成为我们新的‘人民’呀。”"
LHS.85.a:0"朋友，还是敌人，由你来选" 



LHS.86.t:0"一场“失败”的辩论会"
LHS.86.d:0"我们举办了第一届“公社大辩论会”。\n议题是关于一座新桥的修建方案。方案一，是工程师们提出的，用更少的材料和时间，建一座实用但不好看的石桥；方案二，是艺术家们提出的，用更多的资源和时间，建一座有漂亮雕花、能成为我们公社新地标的拱桥。\n大家吵得……非常非常厉害。\n工程师们说，我们现在百废待兴，每一块砖都要用在刀刃上，实用才是最重要的。艺术家们反驳说，革命，不仅仅是为了活着，更是为了有尊严地、美地活着，精神的需求和物质的需求同样重要。\n最后，投票开始了。\n结果是……石桥方案，以非常微弱的优势，赢了。\n我看到那些艺术家们，脸上露出了很失落、很失望的表情。我心里……也觉得有点难过。因为我也觉得，那座有雕花的桥，会更好看。\n会后，我找到了那位输掉辩论的、最主要的艺术家代表。她是一个很温柔的姐姐。\n我有点紧张地问她：“姐姐，对不起……我们最后，还是没有选你的方案。你……你是不是觉得，我们的民主，和那些资本家说的民主，也没什么区别？都是少数要听多数的，输了，就只能不开心。”\n她听了我的话，愣了一下，然后，她笑了。笑得特别好看。\n她摇了摇头，对我说：“不，禾果。完全不一样。”\n“在她们那里，”她指了指遥远的方向，“辩论的双方，是‘敌人’。赢了的人，拿走一切；输了的人，一无所有。她们争的，是‘利益’。”\n“可我们呢？我们刚才，是在吵架吗？”她拉着我的手，走向正在散场的人群。我看到，刚才还在拍着桌子争论的工程师和艺术家，现在正凑在一起，分享着同一袋烟草，还在继续讨论着什么。\n“你看，”她说，“我们不是敌人。我们只是……对‘如何把家变得更好’，有不同看法的家人。我们争的，是‘真理’。今天，你的方案可能更符合我们当下的需要，所以我听你的。但明天，当我们的家变得更好时，也许我的方案，就会成为大家新的选择。”\n她顿了顿，声音变得无比坚定。\n“我们真正的胜利，不是我的方案或者他的方案被通过。我们真正的胜利，是我们可以站在这里，自由地、大声地，为了一个更好的明天而争吵。这个权利，才是我们和她们，最根本的区别。”\n我好像……有点明白了。\n我们的民主，不在于每一次都选对。\n而在于，我们永远拥有，可以继续“吵下去”的自由。"
LHS.86.a:0"也许，过程，比结果更重要？" 

LHS.87.t:0"最重要的那堂课"
LHS.87.d:0"夜校，开学了。\n我坚持要和大家一起，从第一堂课开始上。那些干部们都劝我，说我应该去学更“重要”的东西，比如经济学，或者管理学。\n可我……就觉得，这个最重要呀。\n教室里，坐着好多好多人。有白发苍苍的、连手都伸不直的老奶奶，有白天在工厂里干了十几个小时活、眼睛都快睁不开的年轻叔叔，还有和我差不多大的、第一次有机会摸到课本的少女。\n老师在黑板上，教的第一个词，是“我们”。\n第二个词，是“家园”。\n第三个词，是“未来”。\n我学得……特别特别认真。因为我发现，这比我看过的任何一张海图，都要难。\n课间休息的时候，一个坐在我旁边的小女孩，怯生生地碰了碰我的胳膊。她把她那本已经卷了角的、宝贝得不得了的课本，递到我面前，指着上面的一行字，小声地问我：\n“禾果……姐姐，这个词，是什么意思呀？”\n我凑过去看。\n那一行字，写的是：“当所有人都拿起笔时，我们的国家，就拥有了世界上最强大的武器。”\n我看着那个词，想了很久。\n然后，我抬起头，对那个小女孩，也对自己说：\n“我……我也还不是很懂。但是我想，它的意思大概是……以后，我们再也不用只靠一个人，去想所有的问题了。对不对？”\n小女孩似懂非懂地点了点头，但她的眼睛里，亮晶晶的，像装满了天上的星星。"
LHS.87.a:0"这堂课我也要好好学" 

LHS.88.t:0"一颗没有温度的糖"
LHS.88.d:0"我去看她们了。\n那些……在战场上，曾让我们付出巨大代价的魔法少女们。\n我以为我会看到仇恨，或者至少是警惕。\n可我……什么都没看到。\n她们只是静静地坐在那里，像一群做工精致、却没有灵魂的人偶。她们的眼睛很大，很漂亮，但里面空空荡荡,什么都没有。既没有光，也没有黑暗。只是……一片虚无。\n我走到一个看起来和我年纪差不多的女孩面前。她有一头很漂亮的、银色的长发，但发梢已经有些枯萎了。\n我不知道该说什么。\n于是，我做了我唯一会做的事。\n我从口袋里，掏出了一颗糖。那是我最喜欢的水果糖，外面包着亮晶晶的糖纸。\n我把糖递到她面前，小声地说：“那个……你，要吃吗？很甜的。”\n她没有任何反应。她甚至……没有看我一眼。她只是继续凝视着自己胸前那枚已经完全变成了灰黑色的、宝石一样的饰品，仿佛那个小小的石头，就是她的整个世界。\n我的手，就那样尴尬地，停在了半空中。\n糖果的甜味，好像也无法穿透她身边那层无形的、冰冷的墙壁。\n我忽然觉得，我面对的，不是一个战俘，也不是一个敌人。\n而是一个……已经把自己所有的灵魂，都锁进了那块小石头里的、孤独的……空壳。"
LHS.88.a:0"（把糖，轻轻地放在她的床边）" 

LHS.89.t:0"流泪的画"
LHS.89.d:0"斥候们的报告，在公社内部，引起了一场不大不小的骚动。\n“她们在和幻觉战斗。”\n“那只是一群疯了的可怜女孩。”\n这样的声音，开始在干部和群众之间流传。大家看她们的眼神，也从最初的警惕，变成了怜悯和不解。我们为她们提供了最好的食物和住所，但禁止她们再进入那种“不存在的”战场。\n可她们……好像越来越不对劲了。\n她们开始拒绝进食，整天整天地，只是沉默地擦拭着她们那枚暗淡的灵魂宝石。有好几次，我看到她们中的一些人，会突然对着空无一物的墙角，露出极度恐惧的表情。\n今天，那个负责记录她们行为的、胆子最小的心理学研究员，连滚带爬地跑来找我。\n“总……总指挥官！”她脸色惨白，手里的记录本都拿不稳了，“出……出事了！您快去看看吧！”\n我跟着她，来到了那间专门用来给魔法少女们做治疗的房间。\n房间里，空无一人。\n但房间中央的一块画板上，立着一幅刚刚完成的、色彩浓烈到几乎要滴下来的油画。\n画的作者，是那个最安静、也最擅长画画的魔法少女。\n画上，是一个阳光明媚的、我们公社的广场。孩子们在嬉戏，工人们在交谈，一切都显得那么和平，那么美好。\n但是……\n画面的天空，被撕开了一道巨大的、如同深渊般的裂口。从裂口里，无数双沾满了黑色粘液的、巨大而扭曲的眼睛，正贪婪地、冰冷地，凝视着下方那片对此毫无察觉的、幸福的土地。\n而整幅画，最让我感到毛骨悚然的是...\n那些从眼睛里流淌下来的、颜料尚未干透的黑色“泪水”，正散发着一股……和那晚，在火地岛的浓雾中，我闻到过的、一模一样的、甜腻的腐臭。"
LHS.89.a:0"有什么东西……是我们没有看见的？" 


LHS.90.t:0"……原来，是这样啊"
LHS.90.d:0"医疗室的门被死死地锁上了。\n外面，是干部们惊慌的呼喊和砸门声。\n但我的耳朵里，什么都听不见。\n我只是……跪在地上，抱着她。\n那个总是在角落里安静画画的、有着一头漂亮银发的女孩。\n就在刚才，就在所有人的面前，她胸口那颗灰黑色的灵魂宝石，彻底碎了。没有预兆，就像一颗被捏碎的玻璃珠。\n然后……那个“东西”，就从她的身体里，涌了出来。\n我终于看清了。\n那不是什么凭空出现的怪物。那就是……她自己。是她所有的痛苦、她所有的绝望、她所有的悲伤……是她被那份实现愿望的沉重契约，反复碾压、榨干了所有光芒之后，所剩下的、最纯粹的、扭曲的诅咒。\n她变成了……她一直在与之战斗的、那个“不存在的敌人”。\n我们派出的斥候没有错。她们的仪器，捕捉不到这种……源于灵魂本身的崩塌。\n那个由诅咒形成的巨大黑影，在房间里疯狂地咆哮、破坏，可它的目标，只有一个——就是我们这些，曾试图“拯救”它、却最终只是眼睁睁看着它走向毁灭的、“幸福”的人。\n我们所有的武器，都对它无效。\n就在它即将撕裂整个房间时，怀里的她，那个已经失去了形体的、只剩下一团微弱光芒的“灵魂”，用尽了最后的力量，从内部，引爆了那团巨大的诅咒。\n光芒与黑暗，同时湮灭了。\n现在，房间里又恢复了平静。只剩下我，和怀里这团……正在一点点、变得更暗淡的光。\n“……对不起。”\n一个微弱的、几乎听不见的声音，从光团里传来。\n“……没能……守护好你们……”\n“……好冷啊……”\n“……我只是……只是想……再画一幅……有太阳的画……”\n光，彻底熄灭了。\n我的手上，只剩下了一捧冰冷的、什么也没有的空气。\n我终于明白了。\n我们从来……都不是在和一群疯了的女孩打交道。\n我们是在和一群……从一开始，就背负着整个世界的绝望，独自走向刑场的、小小的……英雄们，打交道。\n而我们……却把她们当成了病人。"
LHS.90.a:0"（缓缓地、将手掌握紧）" 

LHS.91.t:0"摇篮曲"
LHS.91.d:0"矿井里，很安静。安静得，能听到水滴从岩壁上渗出、落下的声音。滴答，滴答。\n一切都和记忆里一模一样，好像我们……昨天才刚刚离开。\n我把那把口琴，和那枚袖标，并排着，轻轻地放在了那张她们曾彻夜不眠、研究着未来的旧地图前。\n我把她们的嘱托，她们的梦想，她们没能走完的路……都走完了。\n可我……却觉得比任何时候，都更像一个迷路的孩子。\n我蜷缩在那个小小的木箱上，把脸深深地埋进膝盖里。\n就在这时……我听到了一个声音。一个很久很久没有听到的、带着一点点笑意的、温柔的声音。\n“……傻丫头，你怎么……又把自己弄得这么狼狈呀？”\n我猛地抬起头。\n空无一人。只有马灯的光，在轻轻摇晃。\n“哼，慢慢吞吞的，等你打完仗，花都谢了。”\n又一个声音。是那种我熟悉得刻在骨子里的、嘴上不饶人、却比谁都担心的声音。\n是幻觉吗？是我……太累了吗？\n我看着那两件小小的遗物，眼泪，终于无声地，滑了下来。\n“晓枫姐……雪伊姐……”\n“嗯，我们在呢。”\n“……我，我把家夺回来了。可是……可是……它变得好大，好安静……我，我不知道……我不知道下一步该做什么了……”\n“你不是做得很好吗？”那个温柔的声音，像是在揉着我的头发，“你看，你让所有人都吃饱了饭，让孩子们都能读书了。你比我们……做得还要好。”\n“……可我，把好多人都弄丢了。我……我把你们，也弄丢了……”\n“我们没有怪你。”那个有点凶的声音，此刻却异常地柔和，“我们只是……心疼你。你看你，都瘦成什么样了。”\n我再也说不出话来，只能任由眼泪，打湿整个衣襟。\n“好啦，不哭了。”那个温柔的声音，像是在唱一首摇篮曲，“战争，已经结束了，禾果。你不用再当那个无所不能的指挥官了。从现在起，你可以……只是当你自己了。\n那么...我们的小果子啊，给我们讲讲最近发生了什么，怎么样？”\n我缓缓地，擦干了眼泪。\n我看着面前那两件静静躺在地图上的遗物，看着它们在灯光下，仿佛还带着她们体温的柔和光晕。\n我终于……露出了一个发自内心的、带着泪痕的、无比灿烂的笑容。\n“嗯。”"
LHS.91.a:0"“我慢慢讲，你们……要仔细听哦。”" 

LHS.92.t:0"海风里的香气"
LHS.92.d:0"今天，一个负责巡逻的年轻士兵，有些紧张地，交给了我一个东西。\n那是一个被海浪冲上岸的、用软木塞和蜡封得很好的玻璃瓶。瓶身长满了青苔，像是在海里漂了很久很久。\n我小心翼翼地打开了它。\n里面，是一张叠得整整齐齐的、已经泛黄的信纸。纸上的字，很娟秀，很漂亮，像一群小小的、停在电线上的黑色的鸟。我……一个字也看不懂。\n信纸的旁边，还躺着一个小小的、用红绳串起来的、已经看不出原来颜色的虎头香包。\n我把它拿了出来，放在手心。一股很淡、很淡的、混合着草药和阳光的味道，轻轻地飘进了我的鼻子里。\n就在那一瞬间。我的心脏，好像……突然被什么东西，很轻很轻地，撞了一下。\n那不是一段记忆。\n它更像……一段记忆的影子。像一首早就忘了歌词的摇篮曲，又像一个早就忘了情节的、温暖的梦。\n我不知道自己是怎么了。我只是坐在那里，一遍又一遍地，闻着那个小小的香包。好像只要一直闻下去，就能想起什么……很重要很重要的事情。\n可我……什么也想不起来。\n我的心里，只是变得又空，又满。"
LHS.92.a:0"（把香包，紧紧地攥在手心）"

LHS.93.t:0"那扇没有打开的门"
LHS.93.d:0"老学者说……她就在这里。\n那个……写信的人。\n我就站在这扇普通的、甚至有些破旧的门前。周围，是难民营里嘈杂的人声和孩子们追逐打闹的嬉笑声。可我……什么都听不见。\n我的耳朵里，只剩下自己越来越快的心跳声。\n我的手，好像有千斤重，怎么也抬不起来，去敲响那扇门。\n我在害怕什么呢？\n我害怕……门后面的人，不是她吗？\n还是……我更害怕，门后面的人，就是她？\n我害怕……她会和我想象中的不一样吗？\n还是……我更害怕，我，和她想象中的，完全不一样？\n我不再是那个，会追着萤火虫跑的小女孩了。我的手上，沾过血，沾过机油，也……签过让很多人死去的命令。\n如果……如果她知道了这些，她还会……用信里那种温柔的语气，给我讲故事吗？\n门里，传来了一阵轻轻的咳嗽声。很虚弱，像风中摇曳的烛火。\n我的心，一下子就揪紧了。\n然后，我听到了一个很轻、很温柔的声音，从门缝里飘了出来。\n她在……哼着一首歌。\n那首歌，没有歌词，只有一个很简单的、反反复复的调子。\n可我……却好像，在世界的另一个角落，在另一个久远到已经模糊的梦里……\n听过这个调子。"
LHS.93.a:0"（深吸一口气，终于……敲响了门）"
LHS_xiaoguomuqinjiaru:"§Y禾果的母亲§!(@LHS) §Y加入南十字星公社§!"

LHS.94.t:0"不再颤抖的手"
LHS.94.d:0"我好像……多了一个影子。\n无论我去哪里，去视察工厂，去田埂边和老农聊天，甚至……是去开那些让我头疼的会议，她都会远远地、安静地，跟在我身后。\n她不说话，也不打扰我。她只是……看着我。\n然后，在我回到那个我们临时称之为“家”的小房间时，她会像变魔术一样，拿出一些东西。\n今天，是一碗热乎乎的、放了糖的甜汤，她说，我开会皱着眉头的样子，和我的父亲一模一样，需要补充点甜的东西。\n昨天，是一双用柔软的旧布料纳好的新鞋垫，她说，我走路太多，鞋子肯定磨脚。\n前天……是一块干净的手帕，因为她看到，我在工厂里，又用袖子去擦脸上的油污了。\n她从来不问我，关于战争，关于命令，关于那些沉重的事情。她也从来不提，关于过去，关于故乡，关于那些她不愿再想起的往事。\n我们之间，好像有一道无形的、温柔的墙。我们谁，都没有试着去推开它。\n直到今天晚上。\n我正在看一份关于“渔业生产指标”的报告，上面密密麻麻的数字，看得我头都大了。\n她就坐在我的旁边，借着同一盏灯的光，为我缝补着军装的袖口。她的手指，不再像我第一次见到她时那样，因为紧张和虚弱而微微颤抖了。现在，那双手，很稳，很巧。针线在她的指尖穿梭，像一只安静的、正在飞舞的蝴蝶。\n“……小时候，”她突然，用一种很轻、很自然的语气，开口了，“你最讨厌的，就是穿有补丁的衣服了。每次，都要哭鼻子。”\n我拿着笔的手，停在了半空中。\n“……是吗？”我小声地问，“我……不记得了。”\n“嗯。”她没有抬头，只是继续着手里的活计，“你总说，那是‘穷人的记号’。你说，你长大了，要赚好多好多的钱，穿世界上最漂亮的、没有一个补丁的裙子。”\n她的声音里，没有嘲笑，也没有感慨，只有一种……在讲述一个别人的故事时，才会有的、淡淡的温柔。\n我看着她，看着她正专注地、一针一线地，将一块新的、干净的补丁，缝在我这件象征着“权力”与“战争”的、磨破了的军装上。那一刻，我突然觉得，这块小小的补丁，比我见过的任何一件华丽的裙子，都要……好看。"
LHS.94.a:0"……现在，我觉得它很好看"

LHS.95.t:0"紧闭的门"
LHS.95.d:0"那份档案，就放在我的桌上，像一块冰。\n我盯着那张黑白照片，看了一整个下午。\n照片上的她，很年轻。穿着那身笔挺的、蓝色的制服，眼神里没有现在的温柔，只有一种……我看不懂的、属于旧时代的麻木和冰冷。\n档案说……她是一个“优秀”的税务官。\n在饥荒最严重的那几年，她负责的区域，上缴的粮食，是所有区域里，最多的。\n档案的最后，还附了一份她亲笔签名的嘉奖令。那签名，和我母亲写给我信上的字迹，一模一样。\n……\n雨，不知什么时候开始下了。\n我又一次，走到了那扇门前。\n这一次，我没有犹豫。我抬起手，用力地，敲响了那扇门。\n一下，两下，三下……\n门里，没有任何回应。\n我能听到里面有声音。有她压抑着的、痛苦的咳嗽声，还有……东西被打翻在地的声音。\n可她……就是不开门。\n我把额头，抵在那扇冰冷的、被雨水打湿的木门上。\n我没有质问，也没有哭喊。\n我只是，用一种连我自己都觉得陌生的、平静到可怕的声音，对着那扇紧闭的门，一遍又一遍地，轻轻地问：\n“……妈妈。”\n“……那些萤火虫的故事，是真的吗？”\n“……你给我熬的红豆粥，是真的吗？”\n“……你，是真的吗？”\n门里，传来的，只有一阵……撕心裂肺的、却又被死死压抑着的、如同困兽般的呜咽。\n雨，越下越大了。"
LHS.95.a:0"（雨水，模糊了视线）"

LHS.96.t:0"世界上最温柔的萤火"
LHS.96.d:0"她走了。\n在我收到那本账本的第二天夜里，她就走了。走得很安详。\n医生说，她早就耗尽了自己。支撑她活到今天的，只是那份……必须亲手完成“赎罪”的、最后的执念。\n我们把她，葬在了那片能看到最多星星的山坡上。没有葬礼，也没有悼词。\n那天晚上，我一个人，在那里坐了很久很久。我把那本账本，一页一页地，全部撕了下来，放进了一个小小的火盆里。\n火焰跳动着，映着我的脸。\n我看着那些名字，那些数字，那些记录着无数罪恶与悲剧的墨迹，在火焰中，一点一点地，蜷缩，变黑，最后，化成了灰烬。\n我……还是无法原谅她。\n为了那些因她而死去的、无辜的人们。\n可是……\n我看着那盆小小的、温暖的火焰，突然，又想起了她为我熬的那碗红豆粥，想起了她为我缝补袖口的、那双不再颤抖的手。\n我好像……有点明白了。\n她从来……没有请求过我的原谅。因为她知道，她犯下的罪，是永远无法得到宽恕的。\n她只是……用她最后、也是唯一能做的方式，去弥补，去偿还。\n她只是……一个和我一样，犯过很多很多错，伤害过很多人，却依然……拼尽全力，想要在最后，做一点点对的事情的、笨拙的……坏人。\n火焰，渐渐熄灭了。\n就在这时，一只小小的、发着光的萤火虫，从草丛里飞起来，落在了我的指尖。它那么小，那么脆弱，可它的光……却好像，能照亮整个夜空。\n我伸出手，看着那点微弱的光。\n然后，我对着那座无名的墓碑，用只有我自己能听到的声音，轻轻地说：\n“……妈妈。”\n“……我不会原谅你。”\n“……但是，谢谢你。”\n“……欢迎回家。”"
LHS.96.a:0"晚安，我的妈妈"
LHS_sjyh:"§7世界上最温柔的萤火§!"

LHS.97.t:0"血迹下的……名字"
LHS.97.d:0"公社最好的档案修复专家，来看过了这本日记。\n她们用尽了所有办法。用化学试剂，用放大镜，甚至用上了缴获来的、最精密的仪器。\n可她们……还是失败了。\n她们说，那块血迹，渗得太深了。已经和纸张的纤维，彻底融在了一起。下面的墨迹，被完全破坏了。\n她们说，那块血迹下的名字，可能……永远也无法知道了。\n我一个人，坐在房间里，看着那本被还回来的日记。\n“真想让……”\n让谁看呢？\n是想让“我”看吗？想让我这个……她最疼爱的、最小的妹妹，也看看那片……她生命中最后的美景吗？\n还是……想让雪伊看？想让那个，一直和她并肩作战、和她吵吵闹闹的、最亲密的战友，也看一眼那片……诡异的晚霞？\n又或者……是某个我根本不认识的、对她来说很重要的人的名字？\n我不知道。\n我可能……永远也不会知道了。\n这个小小的、无法被解开的谜团，就像一根最细的针，轻轻地、却又无比清晰地，扎在了我的心上。\n我突然觉得……\n那场战争，好像……从来就没有真正结束过。\n它只是，换了一种方式，变成了无数个这样的小小的、黑色的谜团，永远地，留在了我们这些……活下来的人的心里。"
LHS.97.a:0"（我们……真的胜利了吗？）"

LHS.98.t:0"她记得"
LHS.98.d:0"我去看她们了。\n那些……被我们从地狱里，找回来的“幸存者”。\n疗养院很安静，也很干净。可这里……却比我见过的任何一处战场，都更让我感到……窒息。\n她们就像一群被抽走了灵魂的娃娃。有的，会坐在窗边，对着空无一物的天空，一看就是一整天；有的，会像我面前的这个姐姐一样，把自己的武器当成唯一的亲人，死死地抱在怀里，不让任何人靠近。\n我试着和她们说话。我给她们讲外面的故事，讲公社的新变化，讲我们……胜利了。\n可她们……没有任何反应。她们的眼睛里，好像……只剩下了那个紫色的黄昏。\n就在我准备放弃，准备离开的时候。\n那个一直抱着枪的姐姐，突然，动了一下。\n她的嘴唇，微微地翕动着，发出了一点……我听不清的、含糊的声音。\n我赶紧蹲下身，把耳朵凑了过去。\n“……小……小果子……”\n她的声音，干涩得像两块砂纸在摩擦。\n“……快……快跑……”\n“……晓枫指挥官……她……她让……让你……快跑……”\n那一瞬间，我的整个世界，都安静了下来。\n我的眼泪，再也控制不住地，涌了出来。\n我一直以为……记得那个黄昏的，只有我一个人了。\n可我错了。\n她还记得。\n她把自己的一切都忘记了，她忘记了回家的路，忘记了太阳的温度，甚至……忘记了她自己的名字。\n可是，她还记得。\n记得晓枫姐……最后的命令。\n我没有再说话。我只是伸出手，轻轻地、轻轻地，握住了她那只因为用力而指节发白的手。\n“不用再跑了。”"
LHS.98.a:0"“我们已经有家了”"

LHS.99.t:0"新的一页日记"
LHS.99.d:0"葬礼结束了。\n可我……还不想走。\n我只是，坐在这片金色的花海里，靠着那座冰冷的石碑，晒着太阳。\n阳光，暖洋洋的。风，轻轻的。\n我从怀里，拿出了那本……晓枫的日记。\n我翻到了那最后一页。\n那句被血迹中断了的话，还静静地，躺在那里。\n“……我好像，看到了一种从未见过的、很漂亮的紫色晚霞。真想让……”\n我看着那块已经变成了暗褐色的血迹，看着那个……我可能永远也不会知道的名字。\n然后，我笑了。\n笑得……特别特别开心。\n我突然觉得……那个名字是谁，好像……已经不重要了。\n重要的是……她看到了。\n在她生命的最后一刻，在那片地狱般的景象里，她看到的，不是怪物，不是绝望，也不是死亡。\n而是一片……她觉得很漂亮的、想和自己最重要的人一起分享的、美丽的晚霞。\n我从口袋里，掏出了一支铅笔。\n在那句话的下面，在那块血迹的旁边，我用我能写出的、最认真、也最笨拙的字迹，一笔一划地，续写了下去。\n我写道：\n“……嗯。我们都看到了。很漂亮哦。”\n我写完，合上了日记本。\n然后，我靠着那座被向日葵包围的、温暖的石碑，在这片……终于没有了怪物的、和平的阳光下，安安稳稳地，睡着了。”"
LHS.99.a:0"做一个……充满向日葵的梦吧"

LHS.100.t:0"禾果的日记"
LHS.100.d:0"今天，是我……第一次，写日记。\n这本日记本，是那个很会画画的姐姐送给我的。她说，人，是需要记录的。\n我不知道该写些什么。\n公社今天又有了新的变化。农业部长的土豆增产计划成功了，大家都说今年的冬天不会再挨饿了；广场的黑板上，大家为了“要不要在河边建一个公园”吵得不可开交，最后决定，每个人都去种一棵树，把整个河岸，都变成公园。\n这些，好像都应该写下来。\n可是……我最想写的，还有另外一件事。\n是关于……我昨晚做的那个梦。\n我梦见，我又回到了那个……被紫色晚霞笼罩的黄昏。\n可这一次，没有怪物，也没有尖叫。\n晓枫和雪伊，就站在我的身边。我们一起，看着那片很漂亮的、就要落下去的晚霞。\n晓枫笑着揉了揉我的头发，说：“看，禾果，多美的晚霞啊。”\n雪伊还是那副凶巴巴的样子，她把一件厚厚的外套，披在了我的身上，然后说：“天黑了，会冷。该回家了。”\n我记得，在梦里，我拉着她们两个人的手，然后，对她们说了一句话。\n我说：\n“……嗯。我们回家吧。”\n然后……我就醒了。\n窗外，天已经亮了。阳光照在我的脸上，暖洋洋的。\n我好像……终于，从那个很长很长的、关于战争和废墟的噩梦里，醒过来了。\n那么……\n日记的第一页，该写什么呢？\n就写这个吧。\n“今天，天气很好。\n晚安，晓枫姐。\n晚安，雪伊姐。\n……”"
LHS.100.a:0"早安，禾果"

