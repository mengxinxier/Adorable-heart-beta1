LHS.33.t:0"我们的士兵投靠了[FROM.GetName]！"
LHS.33.d:0"据军营报告，近期我们的一些部队投靠了[FROM.GetName]，并窃取了我们的部分武器装备。毫无疑问的是，这一切的幕后黑手又是该死的赤匪。"
LHS.33.a:0"该死的野火！！！" 
LHS.36.t:0"我们的民众发起了暴乱"
LHS.36.d:0"我们的民众在野火的不断煽动下发起了各种暴乱，她们声称我们的亡灵要把国民吃干抹净，对我们的治安造成了严重的影响。"
LHS.36.a:0"一派胡言！把闹事的全喂给那些亡灵去"
LHS.34.t:0"王室士兵投诚！"
LHS.34.d:0"一些王室的士兵在我们的鼓动之下认清了索拉娜的嘴脸，已经弃暗投明，向我军投诚。"
LHS.34.a:0"好极了" 
LHS.37.t:0"王室政府受到了来自当地民众的剧烈抗议"
LHS.37.d:0"一些王室当地民众在听闻了王室的恶行之后十分愤怒，在当地组织了大规模的游行对索拉娜的统治发起抗议。"
LHS.37.a:0"好极了" 
LHS.35.t:0"我们失败了"
LHS.35.d:0"王室的人民早已被索拉娜蒙骗至深，对我们的宣传视若无睹。"
LHS.35.a:0"她们会明白的"  
