LHS_shh:0 "沈红红"
LHS_shh_desc:0 "§Y派系§!：§t中共-毛派§!\n§Y生平§!：§L在江南水乡的淤泥里，沈红红从小就尝透了饥饿的滋味。地主的皮鞭与沉重的租子，教会了她把苦水和着血水往肚子里咽。当那支头戴红星的队伍路过村庄，把半块温热的杂粮饼和几个写在沙地上的汉字递到她面前时，她做出了这辈子最果决的抉择。她抓起生锈的剪刀，伴着刺耳的摩擦声，齐根绞断了自己及腰的长发。随着黑发散落进泥水里，那个低头讨生活的佃农丫头彻底蜕变了，站起来的，是一个扛起步枪、眼神亮得灼人的年轻战士。\n\n漫长的转移之路，是一场绞肉般的试炼。她瘦小的身躯跋涉过吞噬人命的草地，渗血的脚底板一步步踏碎了雪山的冰棱。她亲眼看着沿途的老兵倒在冻土里，于是她捡起他们留下的干粮袋和子弹带，咬着冻裂的嘴唇继续向前走。她的指挥才能，全是在一次次夜间突围、一次次在泥潭里躲避轰炸时，用伤疤和求生直觉硬生生磨砺出来的。她的觉悟很纯粹——就是要把指导员临终前塞进她怀里的那份火种，哪怕用胸膛死死护着，也要安稳地带到终点。抵达陕北窑洞时，她瘦得仅剩一把骨头，但那双眼睛，却透着经历过地狱洗礼后的澄澈与锋利。\n\n正是这份从死人堆里爬出来的、纯粹至极的坚韧，让她接过了横跨大洋的重任。如今，她带着东方窑洞里那盏熬过寒冬的灯火，双脚重重地踩在了南美洲湿润的红泥上。她要用那双长满老茧、布满冻疮痕迹的手，紧握住这片大陆上所有受苦之人的手，把那条走过万里风雪的道路，一直铺到世界的尽头。§!"

LHS_mumian: "木棉"
LHS_mumian_Desc:"§L木棉并未生来就是那个令敌人闻风丧胆的“老军团长”。她曾是边境线上一个只会在这冰冷的世道里寻找温暖角落打盹的普通士兵。她比任何人都更早看透了军团的本质：那不再是一群为了守护而战的狼，而是一群被索拉娜用丝绸和红酒喂得脑满肠肥、只会对着穷人龇牙的看门狗。这种清醒让她痛苦，也让她学会了用那副滑稽的眼罩和永远吃不完的苹果来伪装自己锋利的眼神。\n在那些漫长的、看着军团日益腐烂的日子里，她没有选择像传统的英雄那样振臂高呼然后壮烈牺牲。她选择了沉默地播种。她选中了晓枫这颗理性的种子，也庇护了雪伊这团暴烈的火苗。她用那种看似慵懒实则通透的“懒人哲学”，在年轻一代的心中埋下了唯物主义的根基——“别谈空洞的荣誉，先谈谈这一枪下去能不能换回今晚的面包。”\n1935年那场荒诞的“暗杀”，是她军旅生涯中最幽默的注脚。那个不识字的文盲女王索拉娜，将一瓶足以让人睡上一整年的强效安神剂当成了剧毒灌进了她的喉咙。木棉将计就计，在这场漫长的“假死”中，她躲在王宫最深的地窖里，一边啃着看守塞进来的烂苹果，一边在黑暗中冷眼旁观着这个世界的疯狂。她在等，等她的学生们学会如何不靠她的庇护也能把天捅个窟窿，等那锅名为革命的汤彻底沸腾。\n如今，地窖的门被踹开了。那个总是披着旧军大衣、眼神半梦半醒的女人伸了个懒腰，重新走回了阳光下。她不打算当什么受人膜拜的神像，她只是觉得这群孩子把仗打得太累了，她得回来……帮她们省点力气，顺便，把那些喝醉了的旧部下，一个个踹醒。§!"
LHS_Nymph: "晓枫"
LHS_Nymph_desc: "§L晓枫的童年，是在莉兰迪亚迷宫般的贫民窟里，伴随着饥饿和冰冷的器械零件度过的。她十二岁那年，父亲——一位工会组织者——在一次和平示威中，倒在了王室军警的枪口下。这段记忆，成为了她心中永不熄灭的火焰与无法摆脱的阴影。\n为了生存，也为了寻找足以改变世界的力量，她凭借着过人的天赋，考入了帝国最精锐的军事学院，并最终加入了那支令所有反抗者闻风丧胆的铁拳——“军团”。在军团中，她将贫民窟赋予她的、对地形和人心的敏锐洞察，与最严酷的军事理论相结合，迅速成长为一名无可匹敌的战术家。她能仅凭一张地图和风向，就推演出最完美的伏击方案。然而，她越是功勋卓著，内心的割裂感就越是强烈。\n1934年，当军团的履带碾过莉兰迪亚的石板街道，去镇压那场由雪伊领导的工人起义时，这场割裂达到了顶点。她站在指挥车上，看着那些手持简陋武器、脸上却写满不屈的工人们——像极了当年的父亲。军团的炮火精准而高效，将起义者们的血肉之躯连同她们手缝的旗帜一同撕碎。这场“胜利”，彻底击碎了晓枫的灵魂。那一刻，她与同样心怀不忍的老军团长交换了一个绝望而坚定的眼神——这支沦为屠夫的军队，必须被改变。\n此后，她们在军团内部，开始了一场沉默的“人民战争”。晓枫利用她的职权，无数次在“清剿”任务中故意“延误”，为无辜的村庄争取撤离时间；她设计的巡逻路线，总能“恰好”避开工人们的秘密集会点。这份发自骨髓的良知，是她对自己双手沾染鲜血的唯一救赎。\n但这微弱的抗争之光，终究无法照亮整个黑暗。当老军团长在一场“意外”中被王室毒杀，当指向所有心怀异议军官的清洗名单摆在她面前时，晓枫知道，最后的时刻到来了。§!"
