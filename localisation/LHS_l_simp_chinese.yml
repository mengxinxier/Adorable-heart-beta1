LHS_pbrm: "疲惫不堪的人民"
LHS_pbrm_desc: "“战争结束了，但它的声音，依然在每个人的梦里回响。我们对抗的，不仅是人类的军队，还有那些来自噩梦的亡灵与怪物。每一个家庭，都有一段关于失去的故事；每一个老兵，都带着一身无法痊愈的伤疤。孩子们在废墟中玩耍，眼神里却有着与年龄不符的沧桑。这片土地上的人民太累了，她们需要时间，来抚平那些刻在灵魂深处的伤口。”"
