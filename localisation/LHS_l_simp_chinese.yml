#晓枫
LHS.30.t: "代价沉重的“胜利”"
LHS.30.d: "破晓的阳光穿透硝烟，照亮了满目疮痍的山谷。昨夜震天的炮火和喊杀声终于沉寂，留下的只有焦黑的土地、扭曲的钢铁碎片和堆积如山的战士遗体，红色与灰色交织。\n\n晓枫站在指挥所残破的沙盘前，她的军装布满血污和尘土，脸上凝固着疲惫与前所未有的凝重。\n“报告总参谋长，”一名满脸烟灰、手臂缠着绷带的通讯兵声音嘶哑，“军团…军团残部已经开始全面溃退！我们…我们守住了！”\n指挥所内响起几声微弱的欢呼，但迅速被沉重的寂静取代。所有人都清楚这场“胜利”的代价。"
LHS.30.a: "原计划…必须放弃了。"

LHS.31.t: "腐臭的货物"
LHS.31.d: "沉重的迷雾缠绕着沼泽丛生的林地，令人窒息的潮气中混杂着一股难以言喻的、甜腻的腐臭，这气味让久经战阵的战士们也阵阵作呕。转移的队伍在一个罕有人迹的隐秘水道旁发现了几艘被刻意掩盖的运输货物。本以为是王室的秘密补给，但当战士们冒险撬开货舱……\n\n一名有经验的卫生员捂着嘴惊呼：“这不是粮食！这…这是给那种东西吃的！它们还没来，王室已经在偷偷喂它们了！”\n雪伊阴沉着脸拿起一张沾满粘液的清单残片，看着上面王室专用的加密印章和安息之国提供的接收回执签名，她的手在微微颤抖，并非恐惧，而是被冰冷的愤怒充斥。\n“哼…！好一个瓦伦蒂娜！勾结亡灵来对付自己的子民？真是一群披着人皮的怪物！我们找到的不是补给，是她们出卖整个洛维尼亚的证据！”"
LHS.31.a: "天大的发现"

LHS.32.t: "破碎的阴谋"
LHS.32.d: "在沼泽深处一个临时搭建的隐蔽营地，晓枫和雪伊在昏暗的煤油灯下研究那些令人毛骨悚然的证据。营地外，战士们都在低声讨论着这惊人的发现，沉闷的气氛被愤怒所取代。\n“它们一直在等待，”晓枫的声音低沉而危险，她的手指重重敲在那些文件上，“等待我们和王室两败俱伤，或者被彻底剿灭。那时，这些‘安息的礼物’就会畅通无阻地进入洛维尼亚，用瘟疫和死亡取代洛维尼亚的人民百姓。”\n雪伊猛地站起来，眼中燃烧着复仇之火，却比以往更锐利、更清晰：“但这群蛆虫的算盘打错了！晓枫，这场该死的迟滞战…也许冥冥之中是命运在给我们警示！军团消耗了我们，却阴差阳错地把我们送到了魔鬼交易的门前！我们看清了它们那张腐烂的嘴脸！”她将一份印有王室印章的文件狠狠拍在桌上，\n\n“我们要让整个洛维尼亚，让南美洲，让所有还在卑鄙的王室谎言中沉睡的人看清！”"
LHS.32.a: "绝不姑息"

LHS.38.t:0"无声的动员"
LHS.38.d:0"公社秘密军主力在山谷集结待命，雪伊正在检查情报部的最新地图。\n“贵族老爷们还以为我们只会从沼泽方向进攻，”她冷笑着用刺刀划过防线弱点，“明天黎明就让那些……”\n传令兵突然撞入帐篷：“东北…东北方！王都方向出现不明军队！”\n晓枫率先抓起望远镜冲出。\n当雪伊登上山丘时，晨雾刚好被初阳撕裂——展露的是整片山岭般起伏的白。\n\n没有军鼓，没有旗号。\n\n骸骨战马拖着腐朽的攻城车，腐烂的步兵阵列如同移动的巨大伤口覆盖整片大地。\n雪伊的指甲掐进岩石：“安息之国的尸潮...王室真的没有底线了。”\n晓枫没有放下望远镜，声音低得像雪片：“计划泡汤了。”"
LHS.38.a:0"咔嗒" 

LHS.39.t:0"风雪的裂痕"
LHS.39.d:0"腐臭的气息冻结了山谷。雪伊一脚踹开指挥所的破门，卷进的风裹着作战地图重重砸在火盆边缘。\n“等？”她指着地图上猩红的标记，“亡灵每天拖走几十个孩子！你能用‘等’字喂饱山下的亡灵吗？”血丝在她眼里蛛网般裂开。\n晓枫背对呼啸的狂风，凝视窗外惨白的尸潮。“扑火就是自焚。”她转身，指关节叩在地图陈旧的标记线上，“不是不战。是扯散它们的骨架。它们爬得越远，骨头缝里的腐肉消耗就越快。”声音冷得像冰河深处。\n一声闷雷般的爆炸震落屋梁积尘。晓枫眼神纹丝未动：“传令：三、七兵团，即刻放弃奇拉山口伏击点。执行撤退计划，南移。”\n“放弃奇拉山口？”雪伊一把攥住她胳膊，指甲陷进军装，“山口后有多少没跑出来的村子，你难道不清楚？！你撤兵，就是把她们献祭给亡灵的骨头刀！”\n晓枫手臂硬如铁砧：“死守山口？我们就是插在铁板上的钉子！撤，保的是主力！给乡亲挣时间！得让那些骨头架子爬到散架...”\n“时间？乡亲们抱着崽缩在山洞里等的是你敲碎亡灵的脊梁骨！不是等它们啃干净了再来啃我们的心！”她抓起桌上那张签了一半的撤退令，“你来签！签给那些洞里的娘们孩子看看她们的总参谋多会‘算计’！”\n\n纸张像死去的鸟拍在桌上。雪伊撞门而出。\n\n门外，她揪住浑身冰霜的传令兵：“……通知山脚。放弃山口……转移。就说……”喉结艰难滚动，“用空间……换胜机。”每一个音节都渗着血气。门缝里死寂无声，晓枫的剪影凝固在墙上。雪伊摊开掌心，指甲在皮肉里抠出了血槽。"
LHS.39.a:0"立刻撤退！" 

LHS.40.t:0"奇拉山口的爆炸声"
LHS.40.d:0"旱季的山风卷着沙砾抽打岩壁，空气里弥漫着焦土和尸骸的腐臭。雪伊蹲在嶙峋的巨石后，扯开沾满泥灰的绷带重新勒紧手臂。撤退令像块烙铁烫在胸口，但更烫的是山下隐约传来的哭喊，那是被遗弃在撤退计划外的村庄方向。\n\n“头儿，”满脸烟尘的小果子匍匐靠近，哑着嗓子，“主力已按参谋长的命令往南撤进优谭。亡灵的大队追过去了，可…可奇拉山口那边还有支骸骨骑兵，正朝老磨坊村兜过去！”那里挤满了没来得及撤走的妇孺。\n雪伊没说话，牙齿咬断绷带，猛地一勒。剧痛让她眼底的血丝更密。“晓枫的‘大胜’里，不该有磨坊村的血。”她抓起脚边捆好的炸药管，粗粝的麻绳磨着掌心，“小果子，带着你的队伍，去南边优谭。”\n小果子愣住：“那您？”\n\n“我？”雪伊把引信捻子叼在嘴里，含糊地嗤笑，“我去给那群骨头架子放个‘响炮’，让它们记住谁才是该追的肉！”她扯下肩章扔给小果子，“告诉晓枫，她算计她的胜仗，我抢我的人。磨坊村的账，不能算在她身上。”\n\n枯草在狂风中伏倒。雪伊的身影消失在一块巨岩后。很快，远处山口方向传来一连串沉闷的爆炸，腾起的烟尘里夹杂着骨骼碎裂的刺耳锐响，接着是亡灵骑兵特有的、如同生锈齿轮摩擦的嘶鸣，狂暴地转向声源。一支骸骨骑兵脱离了追击主力的洪流，扑向爆炸点。\优谭狭窄的入口处，晓枫举着望远镜。她看见那股本该咬住主力侧翼的骸骨骑兵突然转向，被北面山口的动静疯狂吸引过去。镜片后的眼神骤然一缩，那爆炸点的位置，精准地卡在磨坊村退路上游！\n\n“参谋长？”副官疑惑地看着突然停步的主力前锋。\n\n晓枫放下望远镜，指关节捏得发白。空气里飘来一丝劣质炸药特有的、刺鼻的硫磺焦糊味。“……计划不变。”声音冷硬，目光却死死钉在北方腾起的烟柱上。\n\n风掠过枯草，卷起几片烧焦的布条，像破碎的信标。她认得那布料的颜色，雪伊早上撕下来裹伤口的。"
LHS.40.a:0"继续执行作战计划" 

LHS.41.t:0"躁动的亡潮"
LHS.41.d:0"浑浊的雨点砸在油布上，闷雷碾过优谭峡谷。晓枫浸透的军装紧贴脊背，寒意刺骨。她盯着峡谷入口，水流裹着泥沙冲下陡坡。\n“参谋长！”观察哨兵的声音劈开雨幕，“山口…奇拉山谷方向！亡灵主力分兵了！近半骸骨骑兵突然转向北，直扑奇拉！”\n奇拉？晓枫的指尖瞬间掐进掌心。那不是计划里的饵！那方向只有……\n\n雪伊带着零散小队在干草崖虚张声势的爆响！是为了引开扑向磨坊村的散兵！怎么会扯动整个骸骨骑兵集群？\n\n她的望远镜猛地抬起。越过雨幕，穿过谷口弥漫的水汽。奇拉山谷低矮的隘口处，腾起的黑烟格外浓烈，在雨中顽固地扭成巨大的、不祥的蘑菇云。雨声似乎吞没了一切，但亡灵骑兵那锈铁摩擦般的嘶吼仿佛穿透了空间，带着一种发现活人血肉的、纯粹疯狂的饥饿！\n\n糟了！晓枫的心脏骤缩如铁，那不是寻常的炸药！雪伊动用了库存的腥油燃烧弹！那种用腐烂的动物油脂和矿物炼制的玩意儿烧起来，其裹挟的浓烈污浊血气，对亡灵是足以点燃灵魂深处吞噬本能的毒饵！\n\n“头儿…搞太大了……” 小果子趴在晓枫脚边的泥水里，牙齿打颤，“雪伊姐…把奇拉当灶台点了？这种味…骨头渣子隔着几座山都闻得到！”\n\n晓枫猛地回头，雨水顺着她绷紧的下颌线砸落。峡谷深处的河流开始反常暴涨，浑浊的浪头冲击着她们预设渡口的地桩。“机会！”这个词几乎是挤出牙缝。亡灵主力的侧翼被这致命的香气凶猛地拽向奇拉，就像贪食的饿鬼扑向唯一的血肉祭坛，露出了通往优谭上游渡口那条窄得几乎无法容大军通过的绝路！\n\n“命令！”晓枫的声音撕裂雨幕，冰冷中烧着熔岩，“一兵团重火力，咬住正面骸骨步兵！给我钉死在原地！工兵爆破组，在优谭下游预设渡口……执行原定预案，就现在！主力！渡河！抢上游干河道！快！”\n\n洪水般的部队扑向狭窄石道。雨声、浪声、吼声震天动地。晓枫最后瞥了一眼北方奇拉山谷那遮天蔽日的腥臭烟柱，喉咙滚动了一下。\n\n雪伊……你这个疯子，干得好啊！"
LHS.41.a:0"随我向前！" 

LHS.42.t:0"在火焰尽头"
LHS.42.d:0"浊浪拍击着裸露的河床石壁。部队像疲惫的伤兽，沿着雨谭上游骤然显露的干涸旧道，手脚并用地向上挣扎。雨点砸落，水汽蒸腾，盖不住浑身散发的焦土汗腥气。\n\n晓枫立在泥泞的河床边缘，靴底碾着滑腻的青苔石。浑浊的水流在脚下几十米深的谷底咆哮。最后一批战士终于踉跄着踩上对岸，扑倒在湿漉漉的草坡上，像散了架。\n\n“参谋长……”小果子挤到她身边，浑身泥猴似的，手指痉挛地攥着自己湿透的衣角，声音被雨泡得发抖，“刚才奇拉山谷的烟…那火油的味道太冲……安息亡灵像疯狗扑过去……雪伊姐她们…守得住吗？”\n\n晓枫没回答。她的视线越过脚下幽深的河谷，死死攫住北方。奇拉方向那片被暴雨洗刷过的天空，灰沉沉的，只有一缕微弱的、扭曲的黑烟，被强风撕扯得几乎看不见，像垂死者最后一口浊气。之前那直冲云霄的浓重腥云，没了。嘶吼声也沉入雨幕，只剩下空洞的风啸。\n\n冷。比河底的冻水更冷的寒意，从她的脊椎缝隙里钻出来。雪伊……把整个奇拉点成个活人烽燧，用烧焦尸油的血腥味引得亡灵大军彻底癫狂。那烟熄了，只意味着……要么饵被吞尽了，要么骨头架子连那点燃烧余烬都啃光了。她甚至不敢深想雪伊留在那的目的是撤退……还是把自己烧成最后一束光。\n\n河水奔涌撞击石壁的闷响，撞得人耳膜发疼。旁边草坡上传出压抑的、后怕的呕吐声，分不清是雨水还是泪水糊了战士们的脸。这是生路？还是把她们亲手点燃的同志，亲手喂进了更深的深渊？\n\n晓枫的喉结剧烈地滚动了一下，像吞下块棱角分明的碎石。攥着望远镜的指尖压得雪白，指骨似乎要透过皮肤刺出来。她猛地一扯身上湿透的军装领口，布料发出一声不堪重负的撕裂声。\n\n“全体！隐蔽休整！”声音劈开雨幕，铁片刮过骨头般冷硬，压下了所有抽气声。下一句，一个字一个字地砸进泥水里，凿进每一个魂还没归位的战士耳朵里：\n\n“盯着北面奇拉的方向。火熄了，烟散了，”她的声音淬着火，也淬着冰，“骨头渣子们该饿了。它们迟早会找到这条干涸的血槽……在它们舔到河岸的烂泥之前......”她抬起满是泥泞水痕的脸，目光像两把淬了寒霜的刺刀，扫过每一张惊魂未定的脸，钉进谷口更深的黑暗中："
LHS.42.a:0"“给我把喘气的力气，全憋回刀刃上！”" 

LHS.43.t:0"逆流的援手"
LHS.43.d:0"暴雨鞭笞着裸露的河床。部队沉默如石，压抑在优谭上游的拐弯处。每一张被雨水冲刷的脸上，都烙着奇拉山谷熄灭火焰后的死寂。\n\n“东南坡！”观察哨的嘶喊撕破雨幕，带着难以置信的颤抖，“奇拉对岸！有人！”\n\n晓枫的望远镜瞬间锁死。翻滚的浊浪边缘，一片狼藉的泥石流崩塌带上，几个渺小的黑点正死死扒住湿滑的岩缝！领头的那个，褴褛的军装撕掉了左袖，整个左肩缠着浸透血泥的布带，右臂爆出青筋，竟硬将一个昏迷的战士死死顶在塌方上方一块半悬的巨石边缘。\n\n是雪伊！洪水咆哮着，裹挟巨石疯狂撞击她脚下的岩体，每一次碰撞都让那块立足之地剧震摇晃！\n\n“洪水冲垮了山壁！塌方区暂时阻断了亡灵绕后包抄的爪子！”晓枫的声音像淬火的铁，瞬间穿透绝望，“它们的主力被这血腥气钉死在西北坡啃噬废墟！这就是给我们留的口子！”\n\n她猛地转身，雨水从军帽帽檐串珠般砸落：“一兵团！急行！绕穿克纳尔，抢占西北方,洪水掏空的石台就是我们的炮位！”\n\n目光锐利地刺向小果子：“海军突击队！索降装备！带上所有钩索，跟我走！顺着上游干河道滑下去！抢在她们被泥流吞掉前，给我接回来！一个也不能少！”每一个字都斩钉截铁。\n\n洪水如怒龙。雪伊将最后一个战士拖上巨石，自己脚下的石块却在洪水持续的冲撞下轰然崩裂！身体不由自主地向后倒去，脚下是翻滚着断木和巨石的死亡旋涡！\n\n“头儿——！”几道绳索带着锐利的破空声，如灵蛇般从上方陡峭的干河岸甩下！冰冷的合金挂钩精准地钉在雪伊身侧的岩缝里！一只强有力的手几乎在她滑落的瞬间狠狠抓住了她的右腕，硬生生将下坠之势顿住！\n\n小果子倒挂在绳索上，雨水顺着她的长发流进脖颈，咬着牙吼：“抓紧！参谋长命令，一个同志都不能少！”\n\n对岸，西北方向峭壁之上，隐约的黑点正在急速移动、布防。洪水的轰鸣声中，晓枫的身影似乎站在最高处，望远镜正死死盯着这片生死悬索的塌方区。\n\n雪伊抬起头，雨水冲刷掉糊眼的泥浆，血丝密布的眼睛望向对岸峭壁上那个模糊却无比坚定的剪影，嘴角扯出一丝近乎狰狞却支撑了她整个坠落的力量。她反手，死死握住了绳索上冰冷的手。"
LHS.43.a:0"全军急行，包围敌军" 

LHS.44.t:0"风沙裂谷"
LHS.44.d:0"风像裹着沙砾的鞭子，抽打着干涸的地壳。雪伊伏在龟裂的裂缝里，手指勾着信号枪的扳机，冰冷的金属触感传递着蓄势待发的力量。她身后，赤色部队紧紧贴地，风霜染白她们的眉毛，每双眼睛都穿透呼啸的灰黄沙幕，死死锁住远方地平线上那片涌动的不死浪潮，\n\n“等那些骨头架子把骨腿都陷进烂泥里！” 雪伊的声音被风撕扯得断断续续，却字字钉进风里，“就打信！”\n\n望远镜筒被沙砾敲打着。视野里，庞大的骨象队列在黄土中特有的、看似硬壳实则稀软的泥地越陷越深，象骨沉重地插进泥里，每一次拔起都带出大团腥臭的黑泥，拖拽的“骸棺”炮管倾斜得像要折断。整支左翼如同陷进巨大胶水的虫群，发出无声的挣扎。更远处，密集的亡灵步兵方阵在那片相对“坚实”的高地上越挤越密，像一片惨白的骸骨丛林。\n\n突然！三发刺目的红色信号弹撕裂浑浊的沙尘天幕！\n\n仿佛沉睡的巨兽被惊醒！\n\n轰隆——！\n\n泥地深处！几处被伪装覆盖、精心测算的薄弱稀泥地瞬间连环崩塌！浓稠如墨的深层盐卤泥浆冲天而起！那几头拖在最前面的骨象连同沉重的“骸棺”炮瞬间被翻涌上来的黑泥裹挟、吞没！泥浆带着强烈的腐蚀性，所过之处白骨冒出青烟，滋滋作响！骷髅部队结构性的脆弱暴露无遗，前排的陷落与泥浆的冲击引发了后面方阵大范围的、混乱的连锁崩溃！\n\n“撤！”雪伊果断收枪，受伤右臂爆发出惊人的力量，拉扯身旁的战士，“让它们挤！挤得越多，烂泥坑吃得越撑！”部队如退潮般滑下沟壑，迅速隐没在狂舞的沙墙之后。留下那片骸骨深陷、泥浆沸腾的地狱景象。空中弥漫着骨头被腐蚀的刺鼻焦糊和浓重的卤腥味。\n\n数十里外，王都西南侧的灰色秃岩山脉沉默如山。晓枫立在一处风蚀出的岩柱高处，望远镜牢牢锁定那片本应“开阔无敌”的方向，王室自以为牢不可破的前庭！此刻正被它倾注期望的不死军团自身陷入泥潭和连环崩溃彻底锁死！\n\n远方天空，那三颗红色信号弹的光芒被沙尘彻底吞没。\n\n没有丝毫犹豫。\n\n晓枫右手向下，猛地一劈！"
LHS.44.a:0"杀！" 

LHS.45.t:0"直到那一天到来"
LHS.45.d:0"硝烟在暮光中低垂。王宫广场成了死寂的坟场。战士们如同石化的伤兵，倚着破碎的石柱或焦黑的武器。军装浸透血泥，靴底黏着粘稠的褐色残渣。空气凝固着铁锈和焦肉味，沉重得压垮了脊梁。唯一的声响是远处余火舔舐雕花廊柱的毕剥微响，像在为倒下的战友计数。牺牲的重量碾碎了所有声响。\n晓枫踏过满地碎裂的武器残骸，黏稠血浆在她靴底拉出暗红的丝。沉寂的灰色人墙无声裂开缝隙，露出空洞的眼神。\n她望见雪伊，她的半边脸却凝固着一块狰狞黑褐的血痂，如同烙印，呆滞地看向脚下那镶金王座崩塌的碎片。疲惫如寒冰从脚底向上蔓延。\n\n她站上扭曲的黄金王座基座。目光扫过一张张被硝烟涂抹得模糊的脸，眼中唯余火烬般的残光。\n\n死寂粘稠，如同墓土封棺。\n\n“——为什么不庆祝呢？！同志们？！”\n\n清冽的诘问如冰锥击穿铅幕！\n\n所有凝固的瞳孔骤然收缩！巨大的惊愕如无声爆炸在胸腔闷响！雪伊血痂下的眼睛瞬间燃起锐芒！\n\n晓枫的双臂猛然向上张扬，仿佛要拥抱血染的暮色与废墟！\n“庆典！”声音撕裂暮云，炸裂如雷，“就在此刻！就踩碎这吃人的王座残骸！”她的手如刀劈下，“为黎明前倒下的血肉！为洛维尼亚撕破的第一道铁幕！为此刻握在你们手中、永不拱手相让的一切——”\n\n“吼出来！！”她昂首向血色天际咆哮，“让旧世界的幽灵在你们的狂歌里颤抖！”\n\n死寂轰然炸碎！\n一个沙哑如锉刀的破音撞开沉默！是那首浸透镣铐与暗血的歌：\n\n“起来，歌唱，我们走向胜利——！！”\n\n硝烟映亮晓枫立于废墟之顶的剪影，光芒同样点燃了下方无数张泪血交织、向着崭新破晓呐喊的人民们！"
LHS.45.a:0"团结的人民永远不会被击溃"  
LHS.46.t:0"废纸上的新墨"
LHS.46.d:0"焦黑的王宫办公室，墙面上还嵌着子弹头。雪伊把最后几本印着王室纹章的文件扔进铁皮桶，火焰舔上来，映着她平静到凝滞的脸。她没看对面的晓枫，声音干得像烧尽的灰：“今后，你带着大伙走。”擦净一把缴获的贵族手镜，“啪”地扣在还沾着灰的办公桌上。“我……不适合。”她手指关节发白。\n\n镜面映出晓枫的轮廓，未愈的额角伤口刚结痂。她没有碰那面镜子。\n\n“这栋楼里飘的都是旧魂。”晓枫从焦糊的窗帘后面拖出一个没坏的木质文件箱，尘土扑簌簌落。“她们怕的不是枪炮。”她从箱底抽出沓空白硬纸，是贵族们用来封装礼物的厚卡纸，空白、挺括、没有印记。“怕的是这个。”她把纸按在桌面，发出闷响。\n\n雪伊停下手中动作。\n\n“她们怕新秩序在废纸上写新规矩。怕你，你那双能把镀金谎言从皮上剥下来的手。”晓枫直视她，眼神锐利如刺刀，“雪伊，没人比你更懂哪里藏着蛀洞。重建？新楼谁都能画。可我需要的，是那幢烂房子怎么才不会再塌的图纸。”她手指用力划过卡纸，像在切开什么。“谁竖牌坊，谁掏门柱，谁在地基下偷偷塞烂木……你一眼就能挖出来。”\n\n“以后打仗不一样……”雪伊皱眉，那半边脸颊的血痂随动作绷紧。\n\n“战场？”晓枫突然截断，声音陡然拔高，“你仔细听听！楼道里！那些争抢办公室的脚步声！算军功排座次的吵嚷！废墟上还没清干净呢！她们就像旧王室的耗子换了个窟窿！没有你那双钉死蛆虫的眼盯着……”她猛地抄起那面冰冷的贵族手镜，镜柄硬生生扎进木桌一角立着。“没有你替我拆穿那层新粉刷的脸皮！这个新名头，”她指了指自己，“‘新领袖’也好，‘总指挥’也罢，跟这破镜子有什么两样？不过是个好点的摆设！”\n\n硬卡纸被风卷起一角。雪伊看着那镜子里扭曲晃动的焦黑屋顶，沉默良久。终于，她的手按上那叠空白厚卡纸，压在晓枫的手背上。没有交情，像安放一块基石。两双沾过无数血与灰的手，叠在空白的纸上方。文件桶里最后一点王室纹章化作红亮的火星，倏忽灭在黑暗里。窗外嘈杂的人声远远传来，像地底涌动着模糊的新声浪。桌上，那叠厚实的空白卡纸沉稳地压住了一缕穿堂风扬起的贵族名册残片——它们皱巴巴蜷缩着，等待变成垫桌角或包干粮的废纸。"
LHS.46.a:0"一切都只是开始"  
LHS.47.t:0"铁证烙骨"
LHS.47.d:0"录音机在桌面上嗡嗡颤动，电流声带着一种坟墓里的嘶鸣。磁带是雪伊的人昨晚从东部边境带回来的——裹在塑料布里，印着干涸的棕色手印。\n\n“我儿…背上…有烙铁印…” 一个嘶哑的女声穿透电流杂音，每个字都像碎石碾磨着齿缝，“安息狗说…这矿是它们的了…我儿…就成矿机上的一个关节…死了也拆不下来…跟链条焊在一起了……” 她声音被突然爆发的、尖锐如骨头摩擦金属的刺耳音啸打断几秒，接着是更沉的、仿佛用尽全力吐出的肺音：“昨夜里…我摸过去…只摸到…他半张脸…冰凉…眼窝是黑窟窿…还穿着…开洞的汗衫……照片？呵…” 那声音猛地爆出某种扭曲的抽气，像哭，也像笑，“……骨臂矿场深处…死掉的链条…挂满那样的‘人零件’…都认不出原来的爹娘了……” 录音在一声仿佛脖颈被骤然勒断的窒息音中结束。\n\n会议桌死寂。煤油灯在铁皮墙壁上投下颤抖的、放大的拳头影子。雪伊的手指压着停止键，关节发白。晓枫盯着那老式录音机匣子上还在轻轻震颤的铁皮壳子，像在看一尊盛着无边血污和人骨碎渣的棺椁。\n\n窗外雨后的泥地泛着黑亮的光。桌子尽头，一个刚从前线调回的兵团政委，猛地用拳头砸散了灯影，声音干哑如崩裂的弦：\n\n“烙铁…打在孩子脊背上…铁链…焊在骨头上……” 她抬起头，浑浊的眼珠里烧着两点骇人的火星，“安息狗……它们不光要国土！它们要剥下南美每一个活人的皮，铺路！钉在它们的轮子上！”\n\n一股冰冷粘稠的意志，如同矿洞深处凝结的铁锈冰棱，第一次沉甸甸地扎进公社的心脏：不是解放一个国家。是砸断每一根钉着活人血肉与骸骨的链条——属于整个南美的自由，或者彻底燃烧成灰烬。没有退路。"
LHS.47.a:0"安息..."  
LHS.48.t:0"蛹壳里的呼吸声"
LHS.48.d:0"暴雨砸在废弃糖厂龟裂的混凝土屋顶上，声如擂鼓。风卷进破窗，带着铁锈和一种甜腻到令人作呕的腐烂甘蔗味。晓枫伏在锈蚀的送料斗边缘，望远镜片被雨水模糊又擦干。她不是来看厂房的。是三天前消失的那个侦查小队最后信号源指向这里——爱空尼亚唯一的制高点。\n一股冰冷的直觉顺着脊椎爬上来，比雨水更刺骨。不是血味，不是尸臭。是生命腐烂发酵出的某种过度饱和的粘稠气息，带着甜腥的窒息感。\n\n镜头猛地定在沉淀池上！巨大的水泥池壁爬满了扭曲虬结的、藤蔓般的东西！不是植物！在雨水的冲刷下，那些“藤蔓”泛着湿滑油腻的暗紫色光泽，缓慢地起伏搏动着，像巨大而污秽的血管！黏连的丝状物像菌网般覆盖了整个池口！其中一个半埋在紫色肉藤和胶质物里的凸起物……\n\n晓枫的手指几乎捏碎镜筒！那被粘液半包裹的、几乎看不出轮廓的——是一件撕烂的、沾满黑褐色污迹的公社侦察兵外套！更令人头皮炸裂的是，那外套裹着的人形轮廓，胸腔位置竟在极其微弱地、规律性地……起伏！像沉入深海的溺水者在做无意识的垂死抽动！\n\n下一秒，那搏动猛地一顿！\n\n噗嗤——！\n\n一根拇指粗细、湿滑惨白半透明的管状物，猛地从那裹着泥污外套的“人”的左肩胛位置刺了出来！顶端没有口器，只是一个不断开合扩大的孔洞！惨白色的粘液顺着管壁渗出！接着，第二根！刺破了大腿外侧的衣料！第三根！从颈部侧面贯穿而出！所有惨白的肉管都在暴雨中剧烈收缩、膨胀……像是在汲取，又像是在注入！那件原本代表生命的浸血军装，此刻成了一个蠕动变形的、正在被未知生命形式从内部彻底占据的……蛹！\n\n雨水顺着她冰冷的脸颊滑下。一个全新的、远比安息之国的白骨恐怖更深沉的地狱维度，在她视网膜上灼刻出冰冷的图腾：不砸碎虫巢，南美每一寸土地，终将沦为活人的养料田。每一个幸存者，都可能成为下一个蠕动的……蛹。没有妥协。只有彻底的焚烧，或者被同化。"
LHS.48.a:0"虫巢..." 
LHS.49.t:0"来自洛维尼亚公社的补偿清单"
LHS.49.d:0"午后的瓦尔哈拉社接待室，阳光透过彩色琉璃窗，在打磨光滑的石砖上投下温暖光斑。几位身着红色边饰礼服的神社干部正襟危坐，眼神却忍不住飘向门口，指尖无意识地敲打着桌面。\n一位自称“晓枫”的东方革命者，带着覆灭安息魔女虫巢的余威，要求面谈。\n\n门开了。进来的年轻女子让习惯了华丽圣遗物与精妙言辞的干部们微微一怔。她只穿着磨损的野战服，一头略显凌乱的短发，脸颊还有未擦净的烟尘，唯一显眼的是腰间挎着的、漆皮剥落大半的老旧皮包。笑容却像窗外的阳光一样，毫无阴霾。\n\n没有冗长的外交辞令，晓枫直接将一份写满斯塔人民诉求的本子拍在桌上。“虫巢啃噬的是血肉，巧取豪夺一样是剥削。”她说话带着某种跳跃的节奏感，仿佛不是在谈判，而是在分享某个即将启程的冒险计划。“斯塔王国属于斯塔人民。吃了人家的米粮，拿走了人家的珍宝——”她指了指公社展示柜里几件明显源自斯塔的武器，“总该补回来，给个说得过去的交代吧？”\n\n干部们交换着眼神，脸上是掩饰不住的意外和被直白戳破的尴尬。预想中的对峙场面并未发生，这个看似风尘仆仆的女子，几句话就把神社的“索取”钉在了耻辱柱上。\n\n“当然，贵社帮助了斯塔人民很多。补偿清单在这儿，不多不少。”她拿出一本同样磨损的小册子，红色涂装封面简单印着联合的标志。“然后，欢迎加入。”她眨眨眼，笑容爽朗，“解放一个世界是开始，联手改变所有世界才是归宿嘛。”\n\n当晓枫告辞的身影消失在门外，干部们才从她直刺本质的“补偿清单”和那句云淡风轻的邀请中缓过神来。空气中仿佛还残留着泥土和硝烟的气息，以及一种比圣遗物光芒更锐利的平等。她的要求如此直接，姿态却轻松得像在谈论明天的天气，让那些精心修饰的辞藻瞬间失重。瓦尔哈拉社的干部们望着桌上那份朴素却沉甸甸的补偿清单，第一次感到自家精美的圣遗物光芒，在那个破旧皮包的反衬下，显得有些过于自说自话了。"
LHS.49.a:0"为了世界革命，加入她们！" 
LHS.49.b:0"我们有着自己的理想。" 
LHS.50.t:0"委员会首映礼"
LHS.50.d:0"崭新的总仓库临时充作会场，四处堆着还没来得及归类的弹药箱和军毯。首届“世界革命委员会”成立仪式正严肃进行，直到主席台侧面的晓枫突然打了个喷嚏，手里刚装订好的《临时管理条例初稿》如同被轰炸机编队击中，哗啦一声天女散花！\n“晓！枫！”雪伊的怒喝如同防空警报撕裂会场。她像猎豹般蹿下台，几乎在水泥地上踩出火星。袖章上崭新的委员长徽记和此刻扭曲的杀气形成残酷对比。“昨晚文件归档训话全喂狗了？！这是革命纲领！不是草纸！编号文件第几页跟武器清单贴一起了？！”她捏着一张写满潦草符号、还沾着机油印的武器库记录纸，声音气得发颤。\n\n“报告雪伊同志！”晓枫笑嘻嘻地蹲在地上拢着纸页，没一点悔意，“武器清单背面记着今早巡逻路线呢！这叫效率！双面利用！”她顺手从旁边弹药箱上抠下半截粉笔头，“后勤部说笔墨限量，理解一下嘛～哦对！”她忽然从军装内袋掏出张折成豆腐块、边缘焦糊的纸，像变魔术，“差点忘了！重要机密！缴获的王室宫廷画师素描稿！”唰地展开，赫然是雪伊昨天在指挥部抓狂训人的速写，夸张的Q版怒容活灵活现！\n\n“晓！枫！同！志！”雪伊耳根瞬间通红，头顶几乎具象化喷出蒸汽。她劈手去夺，晓枫敏捷地一个战术翻滚躲开，边跑边嚷：“委员长阁下请注意仪态！这是历史文物！代表官僚主义的可笑消亡！”纸片在两人间飞舞。后排一个娃娃脸技术员终于憋不住，“噗嗤”一声，像点燃了引信，整仓库哄堂大笑！连黑着脸追捕的雪伊都差点被这洪流般的笑声掀得踉跄，只能撑着膝盖咬牙宣布：“休会十分钟！还有，晓枫！今天之内按编号理清文件！否则明天你的配给军毯就给这堆文件当垫子！”角落传来弱弱的声音：“报告…晓枫同志的军毯昨天捐给野战医院了…”\n\n窗外阳光正好，照亮了散落一地的文件和追逐的身影，还有整个南美洲在战火尘埃里第一次自由呼吸的、欢畅的笑声。"
LHS.50.a:0"一切安好" 
LHS.51.t:0"“最高”指示？"
LHS.51.d:0"夜幕降临，兵工厂白天的喧嚣沉淀下来，只有角落里巨大的锻造炉还燃烧着橘红色的余火，权当是今晚的“篝火”。\n雪伊清了清嗓子，将一张崭新的步枪设计图摊在油腻腻的工作台上，表情严肃得像是在宣布作战总动员。“同志们，根据参谋部对现有武器耗损率和人体工学数据的综合研判，我们决定对下一批次的步枪进行如下三点优化……”\n她话音未落，底下几个满身机油的老技工已经露出了和听天书没两样的迷茫神情。\n“咳咳！”晓枫突然从一个老师傅身后探出脑袋，笑嘻嘻地抢过那张图纸，“雪伊同志的指示翻译一下就是：咱们这新枪，得让它像咱们食堂大厨烤的肉串一样！”\n“晓！枫！”雪伊的眉毛拧成了麻花。\n晓枫把图纸往工作台上一拍，用粉笔在旁边画了个歪歪扭扭的肉串。“你看啊，这枪管不能太重，不然战士们端着跑几步就累了，就像肉串的签子，太粗了硌牙，对吧？”\n工人们顿时哄笑起来，气氛立刻松快了。\n“还有这个供弹结构，”晓枫又指着图纸上一个复杂的部分，“现在太折腾，得改成一插就完事儿的，就像撒调料，唰一下，齐活！简单！痛快！”\n“我懂了！”一个满脸油污、被称为“扳手李”的老师傅一拍大腿，“晓枫同志的意思是，这卡榫得加个导向槽，一摸就知道正反，闭着眼都能换弹匣！就像撒孜然，闻着味儿就不会撒成辣椒粉！”\n“对对！”旁边一个年轻的女工也举手，“那枪托的弧度也得改，现在的太直，顶在肩膀上不舒服，硌得慌！得像咱们坐的这条长凳，有点弧度才贴身！”\n雪伊看着瞬间变成“新型步枪吐槽大会”的现场，一张张兴奋的脸在炉火的映照下闪闪发光，图纸上很快被各种粗糙的粉笔标记和油乎乎的指印占满。她原本紧绷的脸不自觉地柔和下来，抱起手臂，靠在冰冷的机床上，小声嘀咕：“……胡闹。但好像……确实比我讲得明白。”\n最终，那份“最高指示”被彻底“篡改”，变得面目全非，却无疑会成为一把更好用、更受战士们喜爱的步枪。炉火旁，不知是谁从热灰里扒拉出几个烤得香喷喷的红薯，笑声、讨论声和红薯的甜香混着机油味，飘散在温暖的夜色里。"
LHS.51.a:0"这才是我们的委员会" 
LHS.52.t:0"南风中的低语"
LHS.52.d:0"今日的神社，空气中弥漫着与平日不同的气息。并非圣遗物共鸣时那种纯粹的能量波动，而是一种……更复杂的、混杂着硝烟、泥土与某种炽热理想的味道。\n通报官的声音还带着一丝未散去的惊奇：“洛维尼亚联盟，晓枫同志，请求会面。”\n当她走进正殿时，所有人的目光都不由自主地被吸引过去。没有华丽的礼服，没有繁复的纹章，她只穿着一身洗得发白的、略显宽大的衣裳，肩上斜挎着一个磨损的皮质挎包，里面鼓鼓囊囊地塞满了卷轴和书本。她的短发被风吹得有些凌乱，脸上还带着旅途的风尘，但那双眼睛，却像暗夜里最亮的星辰，清澈、专注，又带着一丝难以言喻的、仿佛看透了无数故事的沧桑。\n她没有像其他使节那样，先行礼，再呈上复杂的国书。她只是微笑着，从那个旧挎包里掏出了一样东西——不是什么稀有的魔法宝石，也不是什么威力强大的武器图纸，而是一捧用粗糙麻布包裹着的、还带着湿润泥土的深红色豆种。\n“这是‘洛维尼亚之心’，”她开口，声音不高，却异常清晰，如同山涧清泉，“在我们最艰难的时候，就是靠着它，让战士们在冻土里吃上了第一口热汤。它很普通，需要阳光、水和勤劳的双手，但只要种下去，就能在最贫瘠的土地上结出果实。”\n她将那包豆种轻轻放在铺着天鹅绒的会议桌上，那朴素的麻布与周围华丽的陈设形成了强烈的对比。\n“我听说，瓦尔哈拉社的同志们拥有守护世界的力量，”她环视着我们，目光真诚而坦然，“但再强大的守护，也需要根植于大地，需要被守护的人民能够安居乐业。我来此，并非请求军事同盟，也不是来炫耀我们的武力。我只是想问一句......”\n她的笑容里，带着一丝俏皮，又有一种触及灵魂的认真：\n“同志们，你们想不想尝一尝，我们用这豆子做出的、带着点烤红薯甜味的炖肉汤？顺便……聊一聊如何让整个世界的土地上，都能开出这样能填饱肚子的花？”\n那一刻，正殿内庄严肃穆的气氛仿佛被一股温暖的南风悄然吹散。我们看着桌上那包沾着泥土的豆种，仿佛看到了在遥远的大陆上，无数人民围着篝火，分享着一碗热汤的场景。那是一种与圣遗物光辉截然不同，却同样强大、同样温暖人心的力量。"
LHS.52.a:0"这……或许是另一种形式的“圣遗物”" 

LHS.53.t:0"一张烧焦的地图"
LHS.53.d:0"总书记同志的办公室里，气氛庄重而热烈。我们刚刚完成了工业建设计划的最终报告，钢产量和电力输出的曲线图令人振奋，象征着北方革命的坚实步伐。当通报官说洛维尼亚的晓枫同志已经抵达时，我们都整理了一下衣领，准备以最严谨、最同志式的姿态，迎接这位来自南方战火中的传奇英雄。\n门开了，她走了进来，带来了雨林深处潮湿的风和硝烟的余烬气息。她比照片上更显清瘦，衣装的肘部和膝盖处磨得发亮，但那双眼睛，却比我们见过的任何探照灯都更明亮。\n她微笑着与我们每一个人握手，手心有常年握枪留下的薄茧，温暖而有力。\n我们向她展示了我们的成就：一排排新建的工人公寓模型、自动化工厂的蓝图、以及覆盖全国的铁路网规划。我们为这一切感到自豪，这是我们北方同志献给革命的、沉甸甸的工业化答卷。\n她认真地倾听着，眼中闪烁着赞许与钦佩。轮到她时，她没有从挎包里拿出任何报告或是数据。她展开的，是一张地图。\n一张用油布包裹着、边缘被火焰烧得焦黑卷曲的旧地图。\n地图上没有清晰的等高线和行政区划，取而代代的是无数用不同颜色炭笔画下的、密密麻麻的箭头、标记和符号。\n“这是我们穿越卡卡罗姆山脉的撤退路线图，”她的指尖轻轻划过一条几乎被磨损得看不清的虚线，声音里带着回忆的温度，“这个记号，是一个瀑布，我们在那里取过水；这个叉，代表一个塌方的矿洞，有三位同志永远留在了那里；而这个小小的、像太阳一样的符号……是一个老乡偷偷塞给我们半袋土豆的地方。”\n她抬起头，目光中没有悲伤，只有一种历经淬炼后的澄澈。\n“同志们，你们建造的宏伟工厂和铁路，是革命强壮的骨骼，我为你们感到骄傲。而我们从南方的泥泞与战火中带来的，或许就是革命跳动的、柔软的心脏。我们学会了如何在最绝望的黑夜里，从人民手中传递的一点微光中找到方向；我们学会了如何将每一次牺牲，都变成刻在心上、绝不会迷路的星辰。”\n她将那张烧焦的地图，轻轻地放在我们厚重的工业建设计划报告旁边。崭新的蓝图与古老的伤痕，工业的轰鸣与无声的牺牲，在此刻形成了一种奇妙而深刻的共鸣。\n我们忽然明白，真正的革命，既需要能改天换地的钢铁臂膀，也需要一颗能感知每一滴眼泪、铭记每一份温暖的、永远与人民一同跳动的心。"
LHS.53.a:0"让我们把两张地图，合二为一" 
LHS_yuanjiangongchang:0"美洲每有一个§R社会主义§!国家，我们都会互相援建两座§Y民用工厂§!。" 

LHS.54.t:0"一只风筝的重量"
LHS.54.d:0"会议室里的空气冰冷而昂贵，从防弹玻璃窗可以俯瞰整座钢铁丛林的灰色轮廓。我们早已审阅过关于她的所有情报：一个从战火中崛起的、危险的红色幽灵，一个能用言语煽动千军万马的理想主义者。我们准备好了应对一切——慷慨激昂的演说、不切实际的要求，甚至是隐藏在微笑下的威胁。\n然而，当门打开时，走进来的身影却让所有预案都显得有些可笑。她穿着一件旧衣服，洗得已经看不出原本的颜色，脚上是一双沾着泥土的行军靴。她看起来更像一个刚结束长途旅行的背包客，而不是一个颠覆了半片大陆的革命领袖。\n会议开始了。在几轮枯燥乏味的外交辞令后，轮到她发言。我们都做好了准备，迎接一场意识形态的风暴。\n但她没有发言。她只是从那个磨损的皮包里，小心翼翼地取出了一个东西，轻轻放在光洁如镜的会议桌上。\n那是一只风筝。\n一只用最普通的报纸和竹条扎成的、有些歪歪扭扭的风筝。报纸的油墨还清晰可见，上面甚至还有个修补过的破洞，用的是一块印着面包广告的彩色糖纸。\n在我们困惑的目光中，她微笑着开口，声音平静得如同讲述一个睡前故事：\n“在洛维尼亚，每当一场战斗结束，孩子们做的第一件事，就是跑到被炮火犁过的空地上，放起这样的风筝。我们判断一场胜利是否真正属于人民，不看缴获了多少武器，也不看占领了多少城市，只看一件事——天空中，有没有孩子们自由飞翔的风筝。”\n她伸出手指，轻轻拂过风筝上那片彩色的补丁。\n“我站在这里，能看到你们宏伟的摩天大楼，它们直插云霄，令人惊叹。但我有一个小小的问题，”她抬起头，清澈的目光扫过我们每一个人，“生活在这些高楼阴影里的孩子们，她们的天空，还足够放飞一只风筝吗？”\n整个会议室陷入了死一般的寂静。\n我们准备了无数的论据来反驳她的主义，准备了无数的数据来证明我们的强大与繁荣。但此刻，面对这只简陋的风筝和它背后那个简单至极的问题，我们却发现自己竟如此词穷。\n我们意识到，这个来自南方的革命者，她带来的最危险的武器，不是藏在皮包里的炸弹，而是这个在我们心头投下千钧之重的、无声的诘问。"
LHS.54.a:0"……我们该如何回答" 

LHS.55.t:0"我们的十字路口"
LHS.55.d:0"会议室的寂静比窗外市中心传来的瓦斯爆炸声还要沉重。大屏幕上，实时航拍画面显示着燃烧的车辆和汹涌的人潮——她们挥舞的不是我们熟悉的旗帜，而是一面面粗制滥造的、印着一簇跳动火焰的红旗。那是她的标志，洛维尼亚的晓枫的标志。\n一切都始于她的那次访问。她没有带来威胁，也没有提出交易。她只是平静地讲述着南方的故事，讲述矿工们如何在绝境中分享最后的面包，讲述工人们如何用自己的双手重建工厂，讲述一场建立在“公平”这个简单词汇上的革命。\n我们向人民承诺了繁荣和秩序，用复杂的经济数据和法律条款构筑了一个看似坚不可摧的帝国。而她，只向我们的人民提出了几个简单的问题：“你的劳动，换来了应有的尊严吗？你的孩子，能拥有一个不必为生计而恐惧的未来吗？”\n这些问题，像野火的种子，在我们社会的裂缝中生了根——在那些被自动化淘汰的工业城镇，在被债务压垮的农场，在城市里拥挤却孤独的公寓楼里。\n现在，种子发芽了。\n“总统，”国家安全顾问的声音沙哑而疲惫，“军队已经准备就绪。我们可以清场，可以逮捕领袖，可以用铁腕恢复秩序。但这无异于向洛维尼亚，以及她背后那股席卷大陆的红色浪潮宣战。更重要的是，我们将向自己的人民开枪。”\n她停顿了一下，切换了屏幕画面，显示出起义者领袖——一个前钢铁厂的工会主席——正在向人群发表演说，她身后是晓枫的巨大画像。\n“或者，”顾问的声音低了下去，“我们可以派人去谈判。不是去镇压，而是去倾听。去承认我们的繁荣之下，确实有被遗忘的角落和被牺牲的声音。但这等于承认我们的失败，承认这场起义的正当性。它将不可逆转地改变这个国家的航向，甚至……意味着向洛维尼亚的理想屈服。”\n沉默再次降临。窗外，更多的人群汇入了广场，她们开始高唱那首从南方传来的、关于自由和斗争的歌谣。歌声穿透了厚重的防弹玻璃，回荡在我们每一个人的耳中，拷问着整个国家的灵魂。"
LHS.55.a:0"以钢铁与烈火捍卫秩序。绝不退让！" 
LHS.55.b:0"打开大门。她们的声音，必须被听见。" 


LHS.54_tt: "§t一月之后，她们的人民将会重新拿起自己的武器，到了那时...§!"
LHS.54_TT: "§t一月之后，我们的人民将会重新拿起自己的武器，到了那时...§!"

LHS.56.t:0" 一封来自南风的信"
LHS.56.d:0"夜深了，窑洞里的空气像凝固了一样。情报员带回来的这个小油布包，比前线最紧急的战报还要让人心跳加速。打开层层包裹，里面没有我们预想中的密码电报，只是一张质地柔软、带着点烟草和海风咸味的信纸。字迹清秀而洒脱，完全不是官方公文的刻板模样。\n我们围在灯下，一字一句地读着这封来自世界另一端的信：\n\n“致歌声另一端的同志们：你们好。请原谅我的冒昧，这封信是托一个勇敢的水手藏在朗姆酒桶里送来的。他说你们那里的酒一定很烈，和你们的歌声一样。\n前几天，我们缴获了一台属于殖民老爷的收音机，调试频道时，在巨大的杂音里，我捕捉到了一段旋律，你们的歌。那歌声，和我们当年躲在矿井里点燃第一支火把时，大家围在一起唱的调子惊人地相似。我身边的战友雪伊，一个总板着脸但内心火热的家伙，听了都难得地没出声。\n我们这里的王室和压迫者，和你们那里的侵略者，想必是同一个模子刻出来的吧？她们的皮靴擦得再亮，也掩盖不住上面沾着的、我们同胞的血。\n我们这里刚刚打赢了一场小仗，缴获了一些药品和罐头。不多，但足够温暖一个寒夜。不知你们那边，冬天是否也一样寒冷？\n这封信写得有点乱。我只是想告诉你们，你们的歌声，我们听到了。它很美，很有力量。如果可以的话，下次能不能……把剩下的歌词也教给我们？\n\n——晓枫”\n信读完了。窑洞里一片寂静，只有油灯里灯芯燃烧的“毕剥”声。我们互相看着对方，从彼此眼中都看到了一种难以言喻的、混杂着震惊与巨大暖流的情绪。\n这不是一封来自所谓“共产国际”的、高高在上的指示信。\n这更像……一个在遥远的、同一个战壕里并肩战斗的姐妹，在战斗间隙，探过头来，微笑着递过来的一块黑面包。"
LHS.56.a:0"回信。告诉她，我们的歌，才刚刚开始。" 

LHS.57.t:0"一盏油灯的回响"
LHS.57.d:0"回信是随着下一批药品，被巧妙地藏在一个密封的茶叶罐里送达的。当晓枫小心翼翼地展开那张薄薄的、带着淡淡墨香的草纸时，雪伊也难得地凑了过来，脸上带着一丝不情愿的好奇。\n信上的字，是用毛笔写的，笔锋沉稳而有力，仿佛能透过纸背看到一个在万千风浪中依旧从容的身影。\n“晓枫同志，以及那位想必在我写信时，正皱着眉头、用火焰般的目光盯着你的雪伊同志：\n你们的信，跨过高山与大海，平安地送到了我们这片正在发烧的土地上。你们说听到了我们的歌声，我们很高兴。因为这首歌，不是写在纸上的，它的每一个音符，都来自千万个不愿再沉默的喉咙，它的旋律，是在炮火中淬炼，在血泊里定音的。你们能听到，说明我们的心跳，已经穿透了敌人的封锁线。\n你们问剩下的歌词？不必着急，同志。等你们的土地上，孩子们可以无忧无虑地在田野里歌唱时，你们会发现，你们自己已经谱写出了属于南美洲的、同样雄壮的后半章。\n你们那里的王室，我们这里的侵略者，名字不同，但病根是同一个。她们看似强大，有数不尽的枪炮，但那不过是外强中干的铁皮老虎。她们真正的恐惧，是当一个农民、一个工人，挺直了自己被压弯了百年的脊梁时，眼中所迸发出的光。这种光，她们扑不灭。\n你说要送给我们药品和罐头，我们心领了。但请务必先照顾好你们自己和你们的人民。革命不是请客吃饭，保存自己，就是保存了火种。至于我们，山里的野菜，河里的鱼虾，地里只要还能长庄稼，就饿不死我们。我们的人民，就是我们最广袤的土地和最丰饶的粮仓。\n告诉雪伊同志，愤怒是宝贵的，那是被压迫者最纯粹的力量。但一团火，既可以烧掉敌人的堡垒，也可以用来点亮一盏为夜行人引路的灯，温暖一锅为同志们熬煮的汤。我们相信，你们会用好这团火。\n你们在南方的矿井里点亮了灯塔，我们也在东方的窑洞里点亮了灯塔。一盏灯的光是微弱的，但两盏灯的光遥相呼-应，就能让整个黑夜无处遁形。\n期待我们共同看到太阳升起的那一天。\n\n——一个东方的、同样在为理想而战的老兵”\n信读完了，指挥部里一片安静。晓枫的眼眶有些湿润，她小心翼翼地将信纸折好，贴身收起，仿佛那不是一张纸，而是一枚温暖的、跳动着的心脏。\n一旁的雪伊，一直紧握的拳头不知何时松开了。她沉默地走到窗边，望着远方卡卡罗姆山脉漆黑的轮廓，许久，才用几不可闻的声音说：\n“……告诉后勤，把最好的那批压缩饼干，想办法……给她们送过去。”"
LHS.57.a:0"这一轮太阳，将照亮整个世界。" 

LHS.58.t:0"[FROM.GetName]向我们送来了大批装备"
LHS.58.d:0""
LHS.58.a:0"我们的好同志" 

LHS.59.t:0"她们的血，不能白流！"
LHS.59.d:0"指挥部的空气凝固了，只剩下电台里传来的、混杂着巨大电流声的沙哑哭喊。最新的情报，如同一块烧红的烙铁，烫在每一个人的心上。\n“……南京陷落了。樱花国的那帮畜生……她们……她们……”情报员的声音因为巨大的悲愤而哽咽，再也说不下去。\n雪伊猛地一拳砸在沙盘上，木屑四溅。她的眼睛红得像要滴出血来，每一个字都像是从牙缝里挤出来的：“屠城……三十万手无寸铁的百姓！她们连孩子都不放过！这帮披着人皮的恶鬼！！”\n她一把抓起桌上的配枪，转身就要往外走：“我现在就去集结部队！把我们所有的炮弹都装上船！我要让那片岛屿，为我们每一个死去的同胞陪葬！”\n“站住！”\n晓枫的声音不大，却带着一种不容置疑的、冰冷的重量。她缓缓地从地图前抬起头，脸色苍白，但眼神却锐利如刀。\n“雪伊，这不是复仇。”她走到雪伊面前，直视着她燃烧着怒火的眼睛，“这是战争。是我们与全人类所有压迫者、所有反动派、所有法西斯之间的，一场你死我活的战争。东方同志的牺牲，不应该仅仅换来我们的怒火，它应该成为我们彻底埋葬旧世界的号角！”\n她转身，目光扫过指挥部里每一个因悲愤而颤抖的同志。\n“她们在孤军奋战，她们在用胸膛抵挡着最凶残的敌人。而我们，不能再隔岸观火！”晓枫的声音陡然拔高，充满了决绝的意志，“传我的命令！以洛维尼亚公社、以世界革命委员会的名义，向樱花国，宣战！立刻动员我们的革命军、我们的舰队、我们的一切！从今天起，这不再是东方同志的卫国战争，这是我们的战争！”"
LHS.59.a:0"告诉东方同志，我们这就过去。" 

LHS.60.t:0"同志,天儿又亮了"
LHS.60.d:0"窑洞里的油灯，已经燃烧了三天三夜。前线的战报，一份比一份沉重。我们的人民在流血，我们的战士在牺牲，可放眼望去，整个世界似乎都只是冷漠的看客。\n就在这时，通讯员几乎是连滚带爬地冲了进来，她的脸上分不清是泪水还是汗水，声音嘶哑地喊道：“电报！洛维尼亚…洛维尼亚公社的加急电报！”\n窑洞里死一般的寂静。所有人都停下了手中的工作，目光齐刷刷地投了过来。\n一位年轻的参谋接过电报，只看了一眼，便再也控制不住情绪，声音颤抖地念了出来：“……洛维尼亚公社，已向樱花国正式宣战。其革命军第一兵团，已于今晨登船，正向我们驶来……”\n一时间，无人言语。我们这些从枪林弹雨中走出来、早已见惯生死的战士，此刻眼眶却都红了。\n润芝同志沉默地从参谋手中接过那份薄薄的电报，反复看了几遍。她缓缓走到窑洞口，望着外面那片被战火蹂躏的、多灾多难的土地，许久，才用一种无比深沉，却又带着巨大暖流的声音说：\n“……我们不是孤军奋战了。”\n她转过身，目光如炬，扫过在场的每一个人。\n“有些同志，我们素未谋面，却愿意为我们流血。有些国家，远在世界另一端，却愿意把她们的命运，和我们的命运绑在一起。这不是什么援助，也不是什么施舍。这是信仰！是全世界被压迫者之间，最牢不可破的血肉联系！”\n她将电报高高举起。\n“去！去告诉前线的战士们！告诉后方的老百姓！从南美洲升起的那面红旗，要来和我们的红旗，汇合了！”"
LHS.60.a:0"星星之火，终将燎原！" 

LHS.61.t:0"我来晚了"
LHS.61.d:0"当我们接到通知，说晓枫同志的飞机已经降落时，润芝同志只是平静地带我们来到了这里——这座埋葬了我们无数好兄弟、好姐妹的山岗。\n她来的时候很安静，只带了一名随行的翻译。她从颠簸的吉普车上下来，军装洗得干净，却掩不住眉宇间那份战争留下的、深深的疲惫。她走到我们面前，没有先开口说话，而是从挎包里，小心翼翼地捧出了一小束风干的、南美洲特有的红色小花，轻轻地放在了纪念碑的基座上。\n我们所有人都沉默地向纪念碑鞠躬。\n许久，润芝同志才缓缓开口，她的声音里带着一种历经风霜的温和：“你来了。晓枫同志。这座碑下，还有山里的每一寸土里，都睡着我们的同志。她们，等了你很久了。”\n晓枫抬起头，眼眶微微泛红。她凝视着那块冰冷的石碑，摇了摇头，声音轻得像一阵叹息：\n“不，是我来晚了。”\n短短五个字，让在场所有久经沙场的战士，都感到喉头一阵哽咽。\n她转过身，看着润芝同志，目光坦诚而清澈：“在我们的土地上，我也见过太多这样的墓碑。我总在想，如果我们的火把能早一点汇合，是不是，就会有更多的同志，能亲眼看到今天？”\n润芝同志沉默了片刻，她指着山下那片广袤而宁静的田野，远处炊烟袅袅，有孩子们在追逐嬉戏。\n“这片土地，被血洗过，也被泪浸过。”她的声音深沉而有力，“但它现在是干净的。因为它是我们人民自己的了。那些牺牲，换来了今天这一切，就是值得的。你看......”\n晓枫顺着他手指的方向望去，正好看到一个穿着小棉袄的女孩，正踮着脚，从母亲手里接过一小块晶莹的麦芽糖，笑得眼睛弯成了月牙。\n晓枫脸上的那份沉郁，在那一刻悄然融化了。她露出了一个发自内心的、无比灿烂的笑容。\n“我看到了。”她说，“我看到一个孩子的糖，比我们打仗缴来的所有大炮都更甜。”\n润芝同志也笑了，那是一种欣慰而温暖的笑容。\n“是啊。我们打了半辈子仗，不就是为了能让天底下的娃娃们，都能有糖吃，有书读，能在阳光下自由地奔跑吗？”"
LHS.61.a:0"这片土地上，终于开出了最美的花"

LHS.62.t:0"喇叭的烦恼"
LHS.62.d:0"兵工厂新设立的阅览角总是人头攒动。刚下工的师傅们，有的捧着最新的《机械维修图解》看得入神，有的则挤在一起，对着一本从旧世界收缴来的、讲述骑士与公主的通俗小说指指点点，不时爆发出哄笑。\n刚从大学加入革命的年轻知识分子陈墨，看到这番“混乱”的景象，眉头紧锁地找到了正在和工人们一起研究改良扳手的晓枫。\n“晓枫同志，”他忧心忡忡地压低声音，“您看，我们提供了宝贵的纸张和油墨，可大家似乎更沉迷于那些庸俗的故事，而不是去学习理论，去进行您所说的‘独立思考’。这样放任自流，信息是自由了，可人们会不会变得越来越懒于思考，越来越愚笨？”\n他的话音未落，旁边一位擦着满手油污的老工人李师傅就直起了腰，他浑浊但明亮的眼睛看向陈墨：“小同志，俺问你，啥叫‘独立思考’？”\n陈墨一时语塞：“就是…就是不人云亦云，有自己的判断和见解。”\n李师傅笑了，露出被烟草熏黄的牙齿：“俺不懂那些大道理。俺的‘独立思考’，就是琢磨怎么让这台旧车床少出点废品；是琢磨配给的这点布料，怎么给家里的大小子和二闺女一人做一身过冬的棉衣还能剩下块尿布；是琢磨雪伊同志昨天开会说的话，哪句是真要俺们拼命干，哪句是怕俺们太累了故意说的反话。”\n他拿起那本骑士小说，翻了翻：“俺不识几个字，就爱听大伙儿念这个。听完了，俺们几个凑一起骂那个国王又蠢又坏，讨论那个公主为啥不自己拿起剑。这算不算‘有自己的判断’？你读的那些深奥文章，俺们看不懂，可你要是能用它帮俺们把车床的精度再提高一丝，那它就比俺手里的扳手还宝贵。”\n陈墨的脸涨得通红，正要辩解，晓枫却笑着按住了他的肩膀。\n“听，这多有意思，”她眼角弯弯，像两道新月，“陈墨，你担心我们会在信息的海洋里迷航，这是警惕，是好事。李师傅，您告诉我们，任何思考都不能离开这双沾着机油的手和滚烫的生活，这是根本，是我们的根。你们为什么要争个对错呢？这本身就是最生动的辩证法呀。”\n她拿起那本艰深的理论书，又拿起那本通俗小说，将它们并排放在一起。\n“一个告诉我们向何处去，一个让我们在路上不至疲惫。陈墨，你要学的是如何让你的知识像李师傅的扳手一样好用。李师傅，或许陈墨的书里，就藏着能让扳手更好用的新道理。我们的广播站，我们的阅览角，从来不是为了宣布一个标准答案，而是为了让你们这样的对话，能在南美的每一个角落里发生。这，比任何一个人的‘独立思考’，都更接近真理。”"
LHS.62.a:0"真理在争论中，也在每个人的手中。"

LHS.63.t:0"管道的辩证法"
LHS.63.d:0"大学哲学系高材生，林文，正经历着他革命生涯中最大的挫败。\n他被派到兵工厂参与“理论下基层”活动，满怀激情地想向工人们普及辩证唯物主义。此刻，他正站在一个巨大的车床前，对着一群满身油污、眼神疲惫的工人，滔滔不绝。\n“同志们，我们必须认识到，矛盾是事物发展的根本动力！生产关系必须适应生产力的发展，这是历史的必然规律！旧的、僵化的生产模式，就是我们当前要克服的主要矛盾……”\n他讲得口干舌燥，但工人们的反应却让他心凉了半截。有人在打哈欠，有人在交头接耳，更多的人则是一脸“虽然听不懂，但好像很厉害”的茫然。\n“林同志，”工厂的老班长，王师傅，终于忍不住打断了他，他指着车床旁一根滴滴答答漏水的老旧蒸汽管道，“你说的那些‘矛盾’、‘规律’，俺们这些粗人听不明白。俺们只晓得，这管子天天漏水，蒸汽跑了，机器就没劲儿，咱们的活儿就干不完。这就是俺们眼前最大的‘矛盾’。”\n林文的脸一下涨红了，他试图解释：“王师傅，我说的不是这个意思，这是一个更宏大的哲学概念……”\n“可饭要一口口吃，活要一件件干啊。”王师傅拧了拧管道上一个锈死的阀门，水漏得更欢了。“你跟我们讲天上的道理，可我们的脚还踩在漏水的地上。你要是能跟我们讲讲，这‘辩证法’能不能帮我们把这根破管子修好，那俺们肯定搬着板凳，熬夜都听！”\n一旁的晓枫不知何时走了过来，她笑着拍了拍林文的肩膀。“林同志，你的理论是好东西，就像一本精准的地图。但你不能站在山顶上，把地图直接摊给山脚下迷路的同志，她们看不清上面的小字。”\n她弯下腰，捡起一个扳手，递给林文，然后转向王师傅：“王师傅，这管子为什么会漏？”\n“老了呗！接口的垫片都脆了，换了新的也不顶用，因为管道本身的热胀冷缩太厉害，新的垫片用不了多久又会裂！”王师傅答道。\n“看，”晓枫对林文说，“‘旧的生产工具（老化的管道）’和‘新的生产需求（持续稳定的蒸汽供给）’之间产生了矛盾，而矛盾的主要方面是‘材料的老化’。这就是你说的理论，对吗？”\n林文恍然大悟地点了点头。\n“那怎么解决？”晓枫又问王师傅。\n“俺们琢磨着，光换垫片是治标不治本。得在管道中间加一段波纹补偿器，让它能自己伸缩，这样接口的压力就小了，垫片也就能用住了！”\n“非常好！”晓枫赞许道，“这就是‘抓住主要矛盾，找到解决问题的关键’。王师傅，你没学过哲学，但你每天都在实践着最深刻的辩证法。”\n她把扳手塞进林文手里，“去吧，林同志。理论的价值，不在于它在书本里有多完美，而在于它能拧紧几颗松动的螺丝，能解决几根漏水的管道。当你和同志们一起把手弄脏，听懂了机器的‘语言’时，你再说出的理论，他们就一定能听懂了。”\n夕阳下，年轻的学者第一次拿起扳手，和工人们一起，向那根“充满矛盾”的管道发起了进攻。"
LHS.63.a:0"从群众中来，到群众中去"

LHS.64.t:0" 纯洁性的审判"
LHS.64.d:0"革命的胜利像醇酒，让一些人沉醉，也让一些人变得狂热。\n在首都最大的广场上，一场自发的“大辩论”已经演变成了危险的对峙。一边，是以青年学者陈康为首的“红色纯洁阵线”，他们高举着标语，慷慨激昂地控诉着。\n“同志们！革命的肌体里绝不容许一丝杂质！”陈康挥舞着手臂，声音因激动而尖锐，“工程部的总工程师罗伯特，他曾为王室设计过桥梁！这样的人，怎能负责我们新铁路的枢纽？这是对牺牲同志的背叛！我们怀疑，委员会内部是否已经有人忘记了鲜血的颜色！”一位在艾瑞波拉血战中失去左臂的独臂老兵沙哑地吼了回去：“放屁！罗伯特那老头子，是为了保住几百个工人的饭碗才留下来的！现在，我们修铁路的图纸，一半都是他熬了三个通宵画出来的！你们这群除了喊口号什么都不会的娃娃，懂个什么！”\n广场的气氛一触即发，双方的支持者开始互相推搡。\n就在这时，人群自动分开了一条通道。雪伊走了进来，她没有走向任何一方，只是静静地站在这场风暴的中心。\n“都很热闹。”她开口了，声音不大，却瞬间压过了所有的嘈杂。\n她首先看向陈康。“你叫陈康？读过很多书。”她语气平淡，“那你来告诉我，革命是什么？”\n陈康一挺胸膛：“革命是彻底的、纯粹的，是为了建立一个完美无瑕的新世界！”\n“说得好。”雪伊点点头，然后她转向那位独臂老兵，“老班长，你来告诉我，革命是什么？”\n老兵看着自己空荡荡的袖管，沉声说：“报告头儿。革命，就是让娃娃们，冬天能有煤烧，出门能走上平坦的路，不用再跟我一样，为了一口饭把命丢在战场上。”\n雪伊的目光回到了陈康身上，那目光像手术刀一样冰冷而锐利。\n“听到了吗？学者同志。当你在讨论一本字典里‘纯洁’这个词的完美定义时，这位同志，和千千万万的同志们，正在用一只手，为这个国家铺设能让孩子们不再挨冻的铁路。”\n她向前走了两步，逼视着陈康：“我问你，你为这条铁路，拧过一颗螺丝吗？搬过一根枕木吗？画过一张能用的图纸吗？没有！你和你的追随者，除了用最革命的词藻去攻击那些正在建设革命的人之外，什么都没做！”\n她的声音陡然拔高，带着不容置疑的威严：“真正的背叛，不是使用一个有技术但历史复杂的工程师！真正的背叛，是在人民需要团结建设的时候，煽动内部分裂！是躲在‘纯粹’的口号背后，享受着别人流血牺牲换来的和平，却对那些辛勤劳动的人横加指责！你们的‘纯洁’，一文不值！”\n雪伊指着广场外正在施工的工地：“从明天起，‘红色纯洁阵线’全体成员，到铁路建设工地报到。你们的岗位，就是搬运石料。什么时候你们的双手磨出的血泡，能让你理解老班长手臂的价值了，什么时候你们再来跟我谈‘革命的纯洁性’。”\n“这是对我们的侮辱！”陈康脸色煞白。\n“不，”雪伊的声音冷得像冰，“这是救赎。是让你们从空洞的口号里，重新变回一个‘人’的机会。至于罗伯特工程师，”她扫视全场，“他的工作由人民委员会担保。谁再敢用谣言干扰工程进度，以反革命破坏罪论处。”\n说罢，她转身离去，留下寂静的广场和一群在狂风中幡然醒悟，或是不知所措的人们。"
LHS.64.a:0"革命的意义是什么"

LHS.65.t:0"日落卡卡罗姆"
LHS.65.d:0"卡卡罗姆山区的拉锯战，终于以野火革命军的惨胜告终。军团的最后一支建制部队在付出巨大代价后被我们全歼。指挥部里，疲惫的战士们刚刚爆发出劫后余生的微弱欢呼，晓枫却猛地推开了地图室的窗户，一股混杂着铁锈和墓土的、令人作呕的甜腻腥气灌了进来。\n“不对劲……”她喃喃自语，脸色瞬间变得煞白，“这味道……太安静了。”\n战场上，本应是尸横遍野，此刻却空无一人。无论是敌我双方的尸体，都消失得无影无踪，只在地上留下一滩滩暗红色的、仿佛被什么东西舔舐过的印记。\n雪伊也察觉到了异样，她冲到瞭望口，举起望远镜。远方的地平线上，洛维尼亚王都的方向，升起了一片不祥的、沥青般粘稠的黑雾。那黑雾并非静止，而是在以一种超越常理的速度，向着我们的阵地翻涌而来！\n“全军戒备！！”晓枫嘶哑的吼声被一阵非人的、仿佛来自地狱深处的尖啸所淹没。\n黑雾瞬间吞没了我们的前沿阵地。雾中，无数扭曲的身影浮现——那些本该死去的军团士兵，此刻双眼冒着幽绿的磷火，腐烂的身体上穿着破损的军装，机械地举起了手中的武器；更有一些闻所未闻的可怕生物，由无数骸骨与血肉缝合而成的巨兽，咆哮着冲入我们的防线。\n我们的子弹穿过它们的身体，却无法造成任何伤害。而它们的利爪和腐蚀性的唾液，却能轻易地撕开我们的血肉与工事。这是一场彻头彻尾的屠杀。我们的防线在几分钟内就土崩瓦解，英勇的战士们被那些不死的怪物淹没、撕碎。\n指挥部被一头骸骨巨兽撞塌，晓枫为了推开雪伊，被掉落的房梁砸中。雪伊拖着重伤的晓枫，在最后几名亲卫的掩护下，向着最深处的备用矿道撤退。\n“小果子！！”雪伊回头，用尽最后的力气，将怀里那份记录着所有革命火种和未来计划的机密文件，塞进了小果子怀里，“从通风管道走！别回头！活下去！告诉……告诉还活着的人……王室，出卖了整个世界！”\n巨大的爆炸声从身后传来，是亲卫们引爆了最后的弹药库，用生命为她们争取了最后的几秒钟。坍塌的碎石，彻底封死了她们身后的道路，也隔绝了那片人间地狱。"
LHS.65.a:0"革命……失败了吗？"

LHS.66.t:0"最后的信标"
LHS.66.d:0"好黑。\n管道里，除了自己剧烈的心跳和粗重的呼吸声，就只剩下外面隐约传来的、如同噩梦般的咀嚼声和尖啸。\n铁锈和血的味道，还有那股甜得发腻的腐臭，死死地堵在鼻腔里。眼泪早就流干了，现在顺着脸颊滑下来的，是冰冷的、混着灰尘的汗水。\n怀里的这份文件，好重。\n重得像压着两座山。一座叫晓枫姐，一座叫雪伊姐。\n晓枫姐最后看我的眼神，还是那么温柔。她说：“小果子，你是我们最快的风，替我们……去看看黎明吧。”\n雪伊姐……她总是那么凶，可她塞给我文件的时候，那双手，抖得比我还厉害。她吼着让我走，可那声音里，全是哭腔。\n最后的爆炸声，像一把巨锤，砸碎了身后的一切，也砸碎了心。\n为什么……为什么会变成这样？\n我们明明打赢了啊。明明只要再前进一步，就能看到大家一起笑着分面包的场景了。为什么……\n以前在佣兵队里，开着快艇躲避海军炮火的时候，也从没这么害怕过。那时候，就算船要沉了，也知道该往哪个方向游。可现在……四周都是黑暗，没有方向，没有灯塔，什么都没有。\n“……活下去。”\n是啊，活下去。\n可……然后呢？\n这小小的管道，就是革命最后的世界了吗？\n外面是吞噬一切的怪物，身后是两位姐姐用生命封死的墓碑。\n好想……好想再听晓枫姐讲那些星星的故事，再被雪伊姐凶巴巴地塞一个烤红薯啊……\n打火机的火苗，“噗”地一下，灭了。\n彻底的黑暗，降临了。"  
LHS.66.a:0"…天，还会亮吗？"

LHS.67.t:0"微弱的信号！"
LHS.67.d:0"发现了一个有回应的信号源！"  
LHS.67.a:0"向信号源派出信使"

LHS.68.t:0"只有静默"
LHS.68.d:0"没有收到任何回应。"  
LHS.68.a:0"至少我们排除了一个错误的方向"

LHS.69.t:0"意外的发现"
LHS.69.d:0"不仅找到了信号，对方还保留了一部分旧野火的物资！并愿意加入我们。"  
LHS.69.a:0"太好了"

LHS.70.t:0"同志，我们找到你了！"
LHS.70.d:0"我们成功与失散的同志取得了联系！"  
LHS.70.a:0"太好了"

LHS.71.t:0"那她们呢？"
LHS.71.d:0"船舱随着海浪轻轻摇晃。\n刚刚从白城地下抵抗组织里被我们救出来的几位老同志，正狼吞虎咽地吃着热汤和黑面包。为首的老奶奶，曾是公社磨坊的负责人，她布满皱纹的手，紧紧抓着我的手，像是抓住了最后一根救命稻草。\n“好孩子…好孩子…”她浑浊的眼睛里，重新燃起了光，“我就知道，我就知道你们会回来的！”\n大家的情绪都很激动，七嘴八舌地诉说着白城在亡灵统治下的恐怖，以及她们是如何艰难地组织起抵抗。\n“有了你们在海上接应，我们就有底气了！”一位断了条胳膊的老工人激动地说，“只要我们里应外合，把那帮不死的怪物赶出洛维尼亚，就有希望了！”\n气氛越来越热烈，仿佛胜利的曙光已经照进了这小小的船舱。\n突然，那位一直握着我手的老奶奶，用一种充满期盼的、小心翼翼的眼神看着我，轻声问道：\n“那……晓枫同志和雪伊同志呢？她们还好吗？等我们夺回了白城，她们是不是……就会回来了？”\n一瞬间，船舱里所有的声音都消失了。所有人的目光，都聚焦在了我的身上。那目光里，有期盼，有信任，有她们坚持至今的所有理由。\n我看到她们眼中闪烁的星光，那些都是绝不能熄灭的火焰。\n我笑了。不是那种悲伤的、勉强的笑，而是像当年在甲板上看到鱼儿跃出水面时，那种发自内心的、灿烂的笑。\n“奶奶，”我用一种轻松得近乎调皮的口吻，凑到她的耳边，悄悄说道：\n“她们当然会回来。不过……晓枫姐嫌我们动静太小，说要等我们闹得够大，才肯出来收拾残局。雪伊姐嘛……她大概是觉得，只有把瓦伦蒂娜的王座搬到船上来，才配得上她亲自出场吧？”\n老奶奶愣住了，随即，她那布满皱纹的脸上，绽开了一个比哭还难看、却无比真实的笑容。船舱里，重新响起了充满希望的、压抑的笑声和啜泣声。\n没有人再问了。"  
LHS.71.a:0"是啊，会回来的"

LHS.72.t:0"涟漪的颜色"
LHS.72.d:0"计划成功了。\n瓦伦蒂娜被彻底激怒，就像我预想的那样。她派出了最精锐的搜捕舰队，在南方的海域上疯狂地寻找着我们这群“海盗”的踪迹。\n而我们，则早已像幽灵一样，悄然转移到了另一处隐秘的峡湾。那艘承载着所有希望的救援船，就静静地停泊在湾内。船上，是从故土逃出来的、我们第一批救下的同志。那位老婆婆，还笑着说等靠岸了，要教我怎么用海带编好看的绳结。\n一切，都在我的计算之中。\n直到那阵雾，毫无征兆地从海面上涌来。\n那不是普通的海雾。它带着一股能让灵魂都冻结的、甜腻的腐臭，粘稠得化不开。通讯器里瞬间充满了刺耳的杂音，视野里的一切都变得模糊。\n然后，是尖叫声。\n不是从岸上，而是从那艘船上传来的。\n我疯了一样举起望远镜，透过那片死灰色的浓雾，我看到了……我看到了那些湿滑的、扭曲的黑影，如同从海底爬出的噩梦，无声地攀上了船舷。它们没有武器，它们的爪牙和身体，就是最可怖的武器。\n灯光一盏盏熄灭，惨叫声被浓雾和海浪声迅速吞没。我的队员们嘶吼着向浓雾中的船只开火，可子弹打在那些影子上，就像泥牛入海。而那些怪物，它们甚至懒得理会岸上的我们，它们的目标，只有船上那些手无寸铁的活人。\n在望远镜的视野里，我最后一次看到了那位老婆婆。她正被一个黑影拖拽着，脸上没有恐惧，只有一种深深的、看着我的、无法理解的困惑。仿佛在问，为什么？\n然后，那片燃烧的残骸上，就再也没有了任何生命的气息。\n雾散了。我的身边，倒下了十几个最勇敢的战友，她们是为了掩护我，被从雾中扑出的零星怪物杀死的。\n海风吹来，带着烧焦的木头和血的味道。我缓缓走到水边，冰冷的海水漫过我的脚踝。一块烧得焦黑的、船上的木板，漂到了我的脚边。\n我的计划……成功了。\n瓦伦蒂娜的注意力，被我成功地吸引到了海上。内陆的同志们，或许真的因此得到了喘息之机。\n我扔下的那块石头，在死水般的湖面上，确实惊起了涟漪。\n……原来，是红色的。\n我听见自己在对身边幸存的队员下达命令，声音很平静，很清晰，像在谈论一块与我毫不相干的石头。\n“打扫战场，收敛同志们的遗体。统计损失，我们……继续。”"  
LHS.72.a:0"……我们，继续"

LHS.73.t:0"逐渐灰暗的心"
LHS.73.d:0"自从那次……惨剧之后，一些东西好像在我身体里坏掉了。\n我不再做梦了。睡觉变得像关闭一个开关，醒来又是另一个。我的队员们看我的眼神也变了，带着一种……我看不懂的，混合着敬畏与恐惧的情绪。她们说，我的命令越来越简短，越来越精准，也越来越……冷。\n我只是觉得，多余的情感，是会害死人的。\n就像现在，我们成功了。我们炸毁了亡灵在三个州的沿海通讯枢纽，她们的海岸巡逻队现在乱成了一锅粥。这是一个巨大的胜利，按照晓枫姐的风格，现在应该和大家一起喝一杯庆祝。\n可我……什么都感觉不到。\n我的脑子里，只有一张更大的、布满了更多红点的海图。下一个目标，下一个弱点，下一个……可以付出的代价。"  
LHS.73.a:0"……这样，就不会再痛了"

LHS.74.t:0"回音"
LHS.74.d:0"内陆的同志们，忠实地执行了我的命令。\n在白尘界，她们炸毁了亡灵的骸骨仓库。\n在艾瑞波拉，她们袭击了瓦伦蒂娜的巡逻队。\n在每一个我指定的坐标，她们都准时地点燃了自己。\n我的海图上，敌人的主力部队疲于奔命，巨大的防御空洞如我所料地出现了。战术上，我取得了前所未有的成功。\n电台里，曾传来她们最后的声音。\n“禾果同志……我们……可能等不到你们了。但是，能让那帮怪物付出代价……值得了！”\n“告诉活着的人，我们是笑着冲锋的！”\n“……野火，永存。”\n然后，就是一片死寂。\n我静静地听着那一片滋滋作响的、永恒的杂音，脸上没有任何表情。身后的队员想走过来安慰我，却在我冰冷的注视下，默默地退了出去。\n我成功了。\n我用她们的生命，换来了胜利的方程式。\n我……亲手，扑灭了那些我曾拼命想要守护的火焰。\n原来，这就是胜利的味道。\n像嘴里塞满了冰冷的铁砂。"  
LHS.74.a:0"……下一个目标"

LHS.75.t:0"盛宴的开幕"
LHS.75.d:0"大陆在震动。\n潜望镜的视野里，整个天空都变成了一种肮脏的紫色。我的斥候用加密频道传来了最后的报告——那些被我唤醒的、更古老的怪物，正像一片无可阻挡的怒潮，从地底，从废墟，从每一个被遗忘的角落里涌出，与瓦伦蒂娜的亡灵军团，疯狂地撕咬在一起。\n我的计划……成功了。\n我成功地，将这片我曾发誓要夺回的土地，变成了一座献给所有死者的、巨大而华丽的舞台。\n晓枫姐曾对我说，我们战斗，是为了有一天，这片土地上再也不会有“必要的牺牲”。\n可我……却把所有能牺牲的东西，都当作筹码，扔上了赌桌。\n我看见，瓦伦蒂娜的军队，那些曾经屠戮我们同志的刽子手，如今正被更深沉的黑暗所吞噬；我看见，她最精锐的禁卫军，正被迫从王都的城墙上撤下，去填补那永无止境的、由我亲手撕开的防线缺口。\n她所有的注意力，都被这场由我导演的、盛大的死亡盛宴所吸引。\n她最空虚的时刻，到来了。\n我缓缓地，从潜望镜后抬起头，指挥舱里只有仪器发出的、单调的嗡嗡声。周围的队员们都在看着我，等待着我的下一个命令。她们的眼神里，没有狂热，只有一种追随着我、一同沉入深渊的、平静的觉悟。\n我没有去看她们，只是拿起通讯器，声音平静得连我自己都感到陌生。\n“航向……正前方。”\n“目标，瓦伦蒂娜的王宫。”\n我看见潜望镜的十字准星，已经牢牢地套住了那座在混乱与毁灭中，显得格外孤单的、最高的尖塔。\n“宴会的前菜已经上完了。现在……该请今晚的主角，登场了。”"  
LHS.75.a:0"这是……我们唯一的机会"
