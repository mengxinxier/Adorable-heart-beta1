LHS_guoji_desc: "§W我们曾并肩作战，曾为同一个理想流血。现在，压迫者被打倒了。但解放的意义，并非是用一面新的旗帜，去取代旧的旗帜。真正的解放，是让这片土地，能重新发出它自己的声音。\n同志们，你们的命运，该由你们自己来决定了。§!"
