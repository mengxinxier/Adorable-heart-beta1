LHS_heguozhandou4_desc: "“她们都说我是领袖了。可我……我只是个还记得怎么在没有补给的时候活下去的士兵。在‘野火’的日子里，我们没有那么多大道理。战争，就是一把还能用的枪，一双不会磨破脚的靴子，和在天亮前找到下一个藏身之处的本能。我们得把这些找回来。这是我们唯一赢过的战斗方式，也是……我唯一真正懂得的东西。”"
LHS_heguozhandou5: "我们曾是这样战斗的"
LHS_heguozhandou5_desc: "“她们都说我是领袖了。可我……我只是个还记得怎么在没有补给的时候活下去的士兵。在‘野火’的日子里，我们没有那么多大道理。战争，就是一把还能用的枪，一双不会磨破脚的靴子，和在天亮前找到下一个藏身之处的本能。我们得把这些找回来。这是我们唯一赢过的战斗方式，也是……我唯一真正懂得的东西。”"
LHS_wmwl: "我们的哨声在雾里"
LHS_wmwl_desc: "“大海上，最可怕的不是炮火，是寂静。是那种你明知道敌人就在附近，却看不见、听不到的寂静。我们也要成为那样的寂静。我们的陆战队，不再需要嘹亮的冲锋号。一个口哨，一声鸟鸣，甚至是一块被风吹落的石子，都将是我们进攻的信号。我们要学会在浓雾中、在暴雨里、在敌人最放松的黎明前，无声地出现在她们的咽喉旁。”"
LHS_ykzd: "每一颗子弹都有名字"
LHS_ykzd_desc: "“我记得老军团长说过，我们没有资格浪费任何一颗子弹。因为每一颗子弹背后，都是同志们加班加点从废铜烂铁里提炼出的心血。所以，我们的战斗，拒绝无谓的火力覆盖。我们要让每一声枪响，都有一个明确的目的——要么是敌人的指挥官，要么是她们的弹药库。让她们在恐慌中，永远不知道下一颗子弹会从哪里飞来。”"

LHS_yshj: "跟着雨水的痕迹"
LHS_yshj_desc: "“我们的人很多，但我们不能像他们那样，在平原上排成一排，等待着被炮火覆盖。\n我们的士兵，要学会在雨中行军。因为雨水，会洗掉我们的脚印，会掩盖我们的气味，会让敌人的追踪犬，闻到一片潮湿的迷茫。\n我们将在雨中集结，在雨中前进，在雨中，悄然出现在她们最意想不到的地方。”"

LHS_mlkq: "在她们的梦里开枪"
LHS_mlkq_desc: "“战斗，总是在夜晚开始。\n当敌人围着篝火，以为我们还在数十里之外时，我们最好的姑娘们，已经像猫一样，摸到了她们的哨塔之下。\n我们的枪声，就是她们的起床号，也是她们的安眠曲。\n这一枪之后，她们会做一个很长很长的、关于家乡的梦。”"

LHS_jqq: "静悄悄"
LHS_jqq_desc: "“我不需要能撞沉岛屿的巨舰。那些是给大人物在阅兵式上炫耀的。我只需要……能比敌人的炮弹更快、比海上的晨雾更安静的船。我一辈子都在和这样的船打交道。我们要把所有能找到的引擎都装在最小的船壳上，我们要让每一艘船都能在风浪里跳舞。我们不只是海军，我们还是这片海岸线上，静悄悄的幽灵。”"
LHS_jqq2: "静悄悄"
LHS_jqq2_desc: "“我不需要能撞沉岛屿的巨舰。那些是给大人物在阅兵式上炫耀的。我只需要……能比敌人的炮弹更快、比海上的晨雾更安静的船。我一辈子都在和这样的船打交道。我们要把所有能找到的引擎都装在最小的船壳上，我们要让每一艘船都能在风浪里跳舞。我们不只是海军，我们还是这片海岸线上，静悄悄的幽灵。”"
