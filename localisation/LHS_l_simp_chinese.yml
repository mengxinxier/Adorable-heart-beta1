LHS_tjzx: "人民团结阵线"
LHS_tjzx_desc: "人民的团结不仅限于一个国家的团结，而是要让全世界的人民都团结在红旗之下，我们才能共同迈向新的未来。\n为此，我们必须走向世界的舞台，去联系或拯救我们的同志！"
LHS_hhmy: "资源互助协会"
LHS_hhmy_desc: "同志们，仅仅是靠一国的独大是难以实现真正的社会主义的，哪怕资源再多也无济于事。\n因此，我们必须互相帮助，分享彼此之间的资源，才能共同迈向真正的共产主义社会。"

#木棉民族精神
LHS_help_PAO: "泥中夜莺"
LHS_help_PAO_desc: "泥泞的农田里，缔结了最坚固的盟约。"
LHS_idea_hongnidejieqi: "红泥的节气"
LHS_idea_hongnidejieqi_desc: "§Y种下的种子：§! [?red_soil_seeds|Y0]\n§G堆积的肥料：§! [?red_soil_fertilizer|Y0]\n§R滋生的杂草：§! [?red_soil_weeds|Y0]\n§S丰收的果实：§! [?red_soil_harvest_points|Y0]\n§W--------------§!\n§L咱们的家底，就像这片刚翻过的红土地。种子已经撒下，但能不能长出好庄稼，还得看咱们的汗水和智慧。眼下，田里的苗儿看着还算精神。§!"

LHS_idea_hongnidejieqi_tt: "“同志们，又到了开镰的时候。咱们脚下这片红土地，最是公道。你流了多少汗，它就结多少穗。咱们这一季的收成，全看大伙儿过去九十天里，是把劲儿使在了锅碗瓢盆上，还是刀枪剑戟上。”\n\n§H当前的田地状况：§!\n- 咱们脚下的根基（§Y£civ_factory 民用工厂§!）： §G[?num_of_civilian_factories|Y0]§! 座\n- 咱们手里的枪炮（§Y£mil_factory 军用工厂§!）： §G[?num_of_military_factories|Y0]§! 座\n\n§H木棉的丰收算法：§!\n“地种得再好，缺了护院的枪炮，也是给路过的豺狼收庄稼；枪擦得再亮，家里饿得揭锅，战士也扣不动扳机。木桶能装多少水，全看最短的那块板。”\n\n“所以，咱们最终的§S【丰收果实】§!，取决于民生与国防中，§R数量较少的那一方§!，再乘以二，作为咱们稳扎稳打的奖赏。”\n\n“而那多出来的工厂，无论是造锄头的还是造子弹的，只要另一边跟上了，那股子多余的劲儿就有了去处；若是跟上，就全变成了地里疯长的§R【杂草】§!，啃食咱们的收成。”\n\n§O最终入仓的§S【果实】§!，是§G【根基】§!与§Y【枪炮】§!减去§R【杂草】§!。这笔账，得由咱们亲手算清楚。§!\n\n§H基于当前状况，预估收成如下：§!\n§R预计【滋生的杂草】§! = | §G[?num_of_civilian_factories|Y0]§! - §G[?num_of_military_factories|Y0]§! |\n§Y预计§S【丰收果实】§!§! = ( §G[?num_of_civilian_factories|Y0]§! 与 §G[?num_of_military_factories|Y0]§! 中的§R较小值§! ) × 2 = §S[GetLHS_sow_next_springtxt]§!\n\n§H最终的祝福：§!\n每§Y1§!份§S【丰收果实】§!（净值）将转化为§G0.5%§!的永久国家祝福，体现在§Y【赤土的丰收】§!民族精神上，全面提升工业产出、建造速度与人力。\n\n§S同志，你准备好开镰了吗？§!"

LHS_SEEDS_ADD_10_tt:0 "§Y播下希望：§!咱们亲手把§G10§!捧饱满的种子，按进了带着温度的红泥地里。"
LHS_SEEDS_ADD_5_tt:0 "§Y追加播种：§!又有§G5§!捧承载着未来的种子，被种进了咱们的田地。"
LHS_FERTILIZER_ADD_10_tt:0 "§G滋养土地：§!公社的仓库里，堆起了§Y10§!车沤熟的草木灰与鱼骨肥。那是咱们从牙缝里省下来、用来喂养这片土地的口粮。"
LHS_FERTILIZER_ADD_5_tt:0 "§G追加施肥：§!§Y5§!车新的养料被均匀地撒进田地，庄稼的长势更喜人了。"
LHS_WEEDS_ADD_5_tt:0 "§R杂草滋生：§!权力的算盘交到了新手中，田埂上长出了§Y5§!片代表着迷茫与争吵的野草。这是成长必然要付出的代价。"
LHS_WEEDS_ADD_10_tt:0 "§R杂草蔓延：§!内部的矛盾正在激化，又有§Y10§!片遮挡阳光的杂草从地里钻了出来。"
LHS_WEEDS_SUB_10_tt:0 "§G拔除杂草：§!广场上的辩论声与车间里的实践，化作了最锋利的镰刀。咱们合力割去了§Y10§!片杂草，田里的庄稼又能畅快呼吸了。"
LHS_GREAT_RAIN_tt:0 "§3倾盆大雨：§!群众的怒火与觉醒，像一场史无前例的暴雨，浇灌了整片红土地！所有的种子、肥料和杂草都开始疯长！"
LHS_HARVEST_SEASON_tt:0 "§S开镰收割的季节到了！§!\n所有的种子与肥料都已化作沉甸甸的果实，咱们的汗水迎来了最盛大的回报！"

LHS_HARVEST_SEASON_tt2:0 "田埂上，咱们的会计同志兴奋地报上了最终的收成：\n\n咱们辛勤播下了 §Y[?red_soil_seeds|0]§! 份【种子】……\n咱们精心堆积了 §G[?red_soil_fertilizer|0]§! 份【肥料】……\n\n但那些深植于旧日泥土里的 §R[?red_soil_weeds|0]§! 株§R【杂草】§!，\n依旧夺走了它们那份带血的养分……\n\n最终入仓的，是……\n\n§S[?red_soil_harvest_points|0]§!份沉甸甸的§S§S【丰收果实】§!§!！\n\n这些带着伤疤的果实，将化作咱们公社最坚实的底气，为我们带来永恒的祝福。\n\n§H最终加成换算如下：§!\n每§Y1§!份§S【丰收果实】§!将转化为§G0.5%§!的核心工业与人口红利。\n\n§O（去国家精神界面，看看咱们用汗水浇灌出的奇迹吧！）§!"

LHS_idea_chitudefengshou:0 "赤土的丰收"
LHS_idea_chitudefengshou_desc:0 "咱们流过的血，流过的汗，都化作了这沉甸甸的果实。这片土地，终于用最慷慨的方式，回报了所有辛勤耕耘的儿女。咱们的粮仓满了，腰杆子也彻底硬了！"

LHS_aid_from_red_soil:0 "来自红泥的援助"
LHS_aid_from_red_soil_desc:0 "红泥公社的同志们送来了宝贵的物资与经验，他们的慷慨让我们倍感温暖。"
####联合国策####
LHS_Iron_Bones_Crystal_Hearts: "铁骨晶心"
LHS_Iron_Bones_Crystal_Hearts_desc: "我们在战壕的泥泞中相遇了。\n\n对于我们（魔法少女）而言，这些凡人曾是被保护的对象。但当我们因那扭曲的恐怖而感到灵魂战栗时，我们看到身边的战士们——那些没有魔法、没有契约、甚至连稍微完整一点的防弹衣都没有的凡人——拉动了枪栓。她们的眼中没有光芒，只有一种比钢铁还要坚硬的、名为不屈的灰烬。\n\n对于我们（野火）而言，这些女孩曾是传说中易碎的瓷器。但当那不可名状的肉块与疯癫的笑声像潮水般涌来时，我们看到那些纤细的身影张开了屏障，没有后退一步。她们的灵魂宝石在颤抖，但她们的脚跟死死地钉在我们的阵地上。\n\n我们不知道对面那涌动的疯狂究竟是什么，但我们知道，身边的战友，有着和我们一样坚硬的脊梁。"
LHS_Kindling_The_Long_Night: "点燃长夜"
LHS_Kindling_The_Long_Night_desc: "这不再是一场常规的战争。敌人的血是黑色的，敌人的笑声能让最勇敢的政委发疯。常规的弹药似乎很难穿透那些扭曲的皮肉。\n\n于是，一种奇妙的默契在工坊与前线诞生了。野火的工匠们日夜不休地打磨着弹壳，将愤怒与仇恨压入枪膛；而魔法少女们则将她们那份名为希望的光芒，轻轻附着在冰冷的钢铁之上。\n\n既然那黑暗试图吞噬理智，那我们就用这世上最炽热的两样东西回敬它：凡人为了生存而爆发的怒火，与少女为了守护而燃烧的奇迹。\n\n这光虽微弱，却足以点燃这漫长的永夜。开火！把那些噩梦烧成灰！"

LHS_Flowers_On_The_Barricade: "街垒繁花"
LHS_Flowers_On_The_Barricade_desc: "薇莉安的军队推进到了最后的防线。那里没有神明，也没有救世主，只有堆积如山的废墟和我们。\n\n在短暂的停火间隙，一位满脸烟灰的游击队员从怀里掏出半块压扁的面包，分给了身旁魔力即将耗尽的魔法少女。魔法少女接过面包，在那粗糙的手掌里放了一朵用魔力凝结的、永不凋谢的小花。\n\n我们依然不知道那终极的“混沌”究竟意欲何为，也许它是想证明世界的无意义，也许它是想嘲笑我们的挣扎。但此刻，看着这废墟上并肩而坐的身影，我们找到了答案。\n\n我们战斗，不是为了向虚空证明什么。\n我们战斗，只是为了让这块面包能被吃下去，为了让这朵花能开在孩子的窗台。\n\n哪怕世界下一秒就会崩塌，我们也要在这最后的街垒上，种满属于我们所有人的繁花。"
LHS_joint.001.t: "奇迹的温度"
LHS_joint.001.d: "硝烟暂时散去，那不可名状的尖啸声退回了地平线之外。在这片被薇莉安的疯狂反复犁过的焦土上，我们——握着步枪的游击队员，和握着宝石的魔法少女——挤在同一个漏风的掩体里，分享着同一壶浑浊的热水。\n\n我看着她。那个平日里在天上飞翔的女孩，此刻正蜷缩在弹药箱旁，她那身华丽的裙摆沾满了泥浆和黑色的血污。她胸前那颗曾像星星一样耀眼的宝石，现在黯淡得像一块烧尽的煤炭。她太累了，累得手都在发抖。那一刻，我突然明白，所谓的“魔法”，并不是什么神明的恩赐，那也是一种劳动，一种和我们在工厂里拧螺丝、在田地里挥锄头一样，会流汗、会力竭、会透支生命的沉重劳动。她不是神，她是我们之中最拼命的那个妹妹。\n\n我看着他。那个没有任何魔力的凡人，正用那双布满老茧和冻疮的手，笨拙地将最后一块干粮掰成两半，递到我面前。面对那些连我也感到战栗的混沌怪物，他没有屏障，没有光翼，甚至没有哪怕一件完整的防弹衣。他只有那根脆弱的脊梁，却硬生生地扛住了天塌下来的重量。那一刻，我突然懂得，真正的“奇迹”，并不是扭转因果的光芒，而是这具凡胎肉体里，明知会死却依然扣动扳机的勇气。\n\n我们靠在一起。我的体温温暖着她冰冷的宝石，她的光芒照亮我生锈的枪管。在这虚无主义的狂潮面前，薇莉安嘲笑一切意义，她想把世界变成一个荒谬的玩笑。但她错了。\n\n因为手中的这半块面包是热的。\n因为伤口愈合时的痛痒是真实的。\n因为我们为了让彼此活下去而交换的眼神，是这漫漫长夜里任何混沌都无法吞噬的、最坚硬的真理。\n\n这不是两个世界的结盟，这是同一个战壕里的血肉相连。我们不再分彼此，我们是泥土里长出的根，是废墟上开出的花。\n\n天快亮了。我们将一起，去迎接下一轮冲锋。"
LHS_joint.001.a: "为了这热气腾腾的人间，开火！"

MGU_Red_Resonance_Of_Soul_Gems: "灵魂宝石的红色共鸣"
MGU_Red_Resonance_Of_Soul_Gems_desc: "我们曾被教导，灵魂宝石会因绝望而浑浊，最终将被名为“魔女”的诅咒吞噬。但在与野火并肩作战的日子里，我们发现了一种新的净化方式。\n\n那不是来自悲叹之种，而是来自……身边的她。当那位只有一支步枪的游击队员，面对着薇莉安麾下那些扭曲的血肉傀儡，依然高唱着战歌发起冲锋时，她眼中迸发出的那种名为“信念”的烈火，竟然神奇地驱散了我们要塞中的阴霾。\n\n这种红色的光芒比任何魔法都更炽热。它告诉我们：绝望源于孤独的受难，而当我们为了千万人共同的明天而流血时，灵魂……是不会浑浊的。"
 
MGU_Stars_Falling_To_Earth: "坠入凡间的星辰"
MGU_Stars_Falling_To_Earth_desc: "曾几何时，我们是漂浮在云端之上的“魔法少女”，是被人们仰望的、易碎的星辰。但薇莉安的浩劫让我们明白，高高在上的光芒无法照亮最深邃的黑夜。\n\n于是，星辰选择了坠落。我们收起了裙摆上的蕾丝，换上了沾满泥土的绑腿；我们不再在舞台上变身，而是在战壕里与姐妹们分享同一块发硬的黑面包。我们不再是“神”，我们是拥有特长技术的“战士”，是人民军队中的一员。\n\n这一刻，魔法不再是恩赐，而是我们为了守护这片土地所付出的劳动。当我们与她——那位凡人战士的手紧紧相握时，地上的星光，比天上的更美。"
LHS_joint.002.t: "不再孤独的祈祷"
LHS_joint.002.d: "薇莉安的笑声在云端回荡，那些扭曲的怪物如同黑色的潮水般退去，留下一片狼藉的焦土。在防御工事的角落里，我们——手持魔杖的少女，和手持步枪的战士——紧紧地靠在了一起。\n\n我（魔法少女）看着她。那个年轻的女战士，她的半边脸颊被硝烟熏得漆黑，缠着绷带的手还在微微颤抖，试图用最后一根火柴点燃口中的劣质卷烟。她没有魔力，没有奇迹，面对那些连我都感到灵魂冻结的不可名状之物，她是用什么站在这里的？我伸出手，指尖点亮一簇小小的火苗，凑到了她的烟前。她愣了一下，看着我，露出了一个混着血丝的、疲惫却灿烂的笑。\n\n我（游击队员）看着她。那个平日里像瓷娃娃一样的女孩，此刻她的裙摆已经破碎，那是为了替我挡下致命一击而被腐蚀的痕迹。她那颗总是闪闪发光的宝石此刻黯淡无光，她累得几乎连眼睛都睁不开了，却还强撑着为我点烟。那一刻，我不再觉得她是高不可攀的“魔法师”，她是我的妹妹，是我在战壕里过命的姐妹。\n\n“谢谢。”她说，声音很轻。\n“该说谢谢的是我。”她回答，声音沙哑。\n\n在这片被虚无主义笼罩的废墟上，薇莉安嘲笑一切努力都是徒劳，声称世界只是一个坏掉的玩具。但此刻，我们交换的眼神击碎了那个谎言。魔力与火药，理想与面包，神性与人性，在这一刻彻底交融。\n\n只要她的手还握着我的手，只要她的体温还能传导给我，那么无论面对怎样的深渊，我们都不再是向虚空祈祷的孤儿。\n\n我们是彼此的奇迹。"
LHS_joint.002.a: "为了她，也为了我，绝不后退！"

LHS_To_The_Survivors: "致幸存者"
LHS_To_The_Survivors_desc: "那疯狂的笑声终于停止了，南美洲的天空不再滴落恶臭的血雨。我们活下来了。\n\n我（野火）摘下了满是灰尘的军帽，看向身旁的她（魔法少女）。她的裙摆破碎，她的光芒暗淡，但她的眼神依然温柔。在这片甚至连悲伤都显得多余的废墟上，我们没有时间庆祝。擦干脸上的血污，给身旁精疲力竭的姐妹递上一口水吧。无论过去受过多少苦，只要还有一口气在，我们就要重新站起来。"

LHS_Smash_The_Altar: "把神坛砸碎"
LHS_Smash_The_Altar_desc: "战争结束了，那些旧有的隔阂也该随着薇莉安的灰烬一起埋葬。\n\n她曾是高高在上的“奇迹”，受人顶礼膜拜；我们曾是泥潭里打滚的“贱民”，无人问津。但那场浩劫证明了，神明的叹息救不了世界，凡人的眼泪也洗不净深渊。只有当我们肩并着肩，把魔力当成焊枪，把步枪当成犁铧时，黑暗才会退却。\n\n所以，推倒那些孤立的魔法高塔吧。从今天起，没有神明，没有救世主，只有拥有不同分工、却同样光荣的——同志。"

LHS_Wheat_And_Flowers: "麦穗与繁花"
LHS_Wheat_And_Flowers_desc: "焦土无法凭空长出面包，但我们可以用双手去创造。\n\n我们的工兵和她的魔法交织在一起。那原本用来消灭怪物的魔力光辉，现在被用来催化冻土里的小麦种子；那曾握着手榴弹长满老茧的手，现在正小心翼翼地为新生的花朵松土。工业的齿轮在奇迹的润滑下重新转动，烟囱里冒出的是希望的白烟。这是属于劳动者的魔法，这是能填饱肚子的奇迹。"

LHS_For_Those_Who_Could_Not_Return: "为了没能回家的人"
LHS_For_Those_Who_Could_Not_Return_desc: "在胜利的欢呼声背后，是长久的沉默。因为我们都知道，身边的这片土地下，埋葬了多少熟悉的面孔。\n\n有那个为了掩护战友燃尽灵魂化为碎片的少女，也有那个握着半截刺刀流尽最后一滴血的游击队大姐。我们没有为她们修建冰冷的石碑，因为她们的生命已经化作了这片土地的一部分。\n\n我们活下来的人，必须带着她们那份未活完的生命，去把这个世界，建设得更好一点。这是我们对逝者唯一的承诺。"

LHS_Starlight_In_The_Mud: "落入泥土的星光"
LHS_Starlight_In_The_Mud_desc: "她曾告诉我，使用魔法的代价是积攒名为“诅咒”的黑泥。但现在，她不用再独自承担这份重压。\n\n当她把星光般的力量注入我们共同研究的机床，当我们用集体的智慧帮她分担那份灵魂的消耗时，星光终于落入了泥土。它不再是易碎的奇迹，而变成了实实在在的科学与生产力。泥土包裹了星光，星光温暖了泥土，我们不再需要牺牲谁来换取明天。"

LHS_This_Is_Our_Home: "这里是我们的家"
LHS_This_Is_Our_Home_desc: "看啊，这片不再流血的大陆。\n\n在这里，魔法少女不必在孤独中走向毁灭，凡人不必在压迫下像野草一样死去。我们一起用血肉和理想，在疯狂的废墟上，拼出了一个真正的家。风暴已经过去，但我们的故事才刚刚开始。我们要让这片大陆上亮起万家灯火，让世界上每一个还在黑暗中哭泣的姐妹知道——这里，有她们的家。"
####国策####
LHS_WOMENG: "为我们，也为后来者"
LHS_WOMENG_desc: "同志们，听。\n她们以为这矿车轨道，只能把我们拉进更深的黑暗，把我们的骨头，一根根碾碎在这片不见天日的土地上。但从今天起，它将由我们亲手铺设，通往我们自己的黎明。\n我知道，我们中间，有人的双手曾沾满过莉兰迪亚的血；也有人的亲人，就倒在那片血泊之中。仇恨与悔恨，像两条毒蛇，缠绕在我们每一个人的脖子上。\n但现在，王室和军团，给了我们所有人，同一条路：要么像牲口一样，沉默地死在这片黑土地上；要么，就成为点燃这片黑土地的、第一簇野火。\n那么，就让她们看看吧。\n让她们看看，一群背负着罪孽的士兵，和一群不愿再被屠杀的人民，是如何站在一起，为自己，也为所有后来者，争来一个能彼此原谅、能好好活下去的明天！"
LHS_zhahui: "炸毁通道"
LHS_zhahui_desc: "她们以为，这些幽深的矿道，是通往我们心脏的捷径。\n她们忘了，这每一寸岩壁，都曾是我们父辈的血汗，也是我们撤退时，唯一的生路。\n今天，我们将亲手，为她们关上这扇门。\n用山石的崩塌，为我们身后每一个熟睡的孩子，换来一个不会被惊扰的黎明。"
LHS_zhulei: "口袋战术"
LHS_zhulei_desc: "对付她们的战术其实很简单：\n在堡垒里原地驻守，故意放敌军挤进我们刻意制造的狭窄通道里，营造出我们只能被迫防御的假象;\n待她们愣神之际主动出击，断其退路，堵住出口，关门打狗;\n将她们一口一口吃干抹净！"
LHS_caiji: "打碎障壁"
LHS_caiji_desc: "卡卡罗姆矿井的寒风，裹挟着孩子们的咳嗽声，刀子般剐蹭着我的神经。我知道几十里外，雪伊的公社仓库里有救命的存粮。我也更清楚，她的名字，就代表着1934年莉兰迪亚那场被军团炮火淹没的起义。\n军团的污名，像矿道里的瓦斯，缠绕在我这个“前刽子手”的身上。我太明白她的顾虑了：那些穿着军装、说着漂亮话的人，转过头就把枪口对准了她们。言语，是这世界上最廉价的东西。\n我不能，也不配，只靠一封信去融化那道由鲜血和仇恨凝固成的冰墙。\n我们必须用行动，用我们手中仅有的这几支枪，去为她们，也为我们自己，凿开一条通往信任的、唯一的道路。"
LHS_yuanjun: "北方的同志"
LHS_yuanjun_desc: "情报员带回了她的消息。\n“……接管了磨坊……分发了土豆种……”\n寥寥几个词，却像几颗滚烫的炭火，落在我冰冷的掌心。我好像……能看见她了。看见在另一座同样寒冷的山头，她正固执地，把希望的种子，一颗一颗地，按进那片曾被我们的炮火烧焦的冻土里。\n原来，在这片漫长的黑夜里，点着灯的，不只我们。\n原来，在我们亲手制造的废墟之上，已经有人，在重新播种希望。\n这让我感到温暖，也让我……感到灼痛。\n但我们不能再犹豫了。如果注定要背负着罪孽前行，那至少，让我们的脚步，能为那些正在播种的人，扫清一些路上的荆棘。\n那么，就让我们把手伸过去吧。哪怕只是试探。\n看看两簇曾彼此敌视的微光，能不能凑成一团，足以熬过这个冬天的火。"
LHS_gsyj: "来自公社的援建"
LHS_gsyj_desc: "弹药箱底板空了之后的回响，越来越响。\n绷带上的血迹，每一次清洗，都变得更淡，也变得更深。\n军团的算盘，打得很清楚。她们想把我们，连同我们背负的罪孽，一同困死在这片冰冷的石头里。\n可她们忘了。\n当年，我们曾用血，为别人，也为我们自己，在这里撕开过一条生路。今天，在那条路的尽头，我听到了她们机器的轰鸣，闻到了她们药品的味道。\n当公社的运输队，沿着那条浸透着仇恨与希望的旧路，把第一箱物资送到我们面前时，所有人都沉默了。\n她们送来的，不只是补给。那是一个回答。\n一个“我们暂时放下过去，因为我们有着共同的明天”的，无声的回答。"
LHS_yuanbing: "来自公社的援兵"
LHS_yuanbing_desc: "绝境中，来自莉兰迪亚公社的电报，如同滚烫的炭火，烙在每一个前军团士兵的心上：“援兵在路上。守住。”\n她们顶风冒雪，沿着当年被我们追击过的、那条浸满鲜血的险峻小道，强行穿插而来。\n当前线阵地上传来第一声不属于我们的枪响时，所有人都愣住了。当第一支戴着简陋红星帽徽、肩扛弹药箱的莉兰迪亚分队，浑身泥泞地出现在我们面前时，冻僵的战壕里，没有欢呼，只有一片死寂。\n空气中，弥漫着一种难以言喻的、混杂着愧疚、感激与仇恨的复杂气息。\n带队的那个公社指挥官，脸上有一道陈年的伤疤——我知道，那是在莉兰迪亚巷战中，被我们的榴弹所伤。\n她走到我面前，眼神像淬了火的冰。她没有敬礼，也没有说任何客套话。她只是将一排滚烫的子弹，重重地按进我的手里，然后沙哑地问：\n“同志，哪个方向，压力最大？”"
LHS_jiemeng: "春雷破晓"
LHS_jiemeng_desc: "卡卡罗姆的严冬，终于被我们踩在了脚下。积雪消融，露出焦黑的土地，和战士们冻裂的双手。\n这个冬天，我们啃着冻硬的根茎，用雪水冷却过热的枪管。我们与公社的同志们，背靠着背，在同一个战壕里，抵挡着我们共同的敌人——军团，一波又一波疯狂的围剿。\n起初，我们之间只有沉默。我们分享着同一块黑面包，包扎着彼此的伤口，却从不提及过去。但当公社的战士为了掩护我们的侧翼而倒下，当我们的老兵为了保护她们的补给线而牺牲时，那堵由鲜血和仇恨砌成的墙，终于在无声中，悄然崩塌。\n现在，电台里传来雪伊清晰而坚定的声音，不再是隔着封锁线传递物资时的沙哑电波。她们北方的战事，也稳住了阵脚。\n我们终于明白，我们不再是两支独立的部队，我们也不再是“前刽子手”和“幸存者”。\n我们是同志。\n此刻，共同的敌人就在眼前，共同的信念在我们胸中燃烧。那根拧成一股的绳，终于要化作绞索，套向王室的咽喉。\n“同志们！进攻！！！”"
LHS_dongyuan: "紧急动员"
LHS_dongyuan_desc: "广场上，人影在黎明前的寒风中快速聚集。不再有激昂的演说，只有急促的口令和金属碰撞的铿锵。新领到的步枪冰冷沉重，旧军装上还带着硝烟和汗味。一张张或年轻或沧桑的脸上，没有恐惧，只有一种被逼到绝境的、近乎岩石般的沉静。时间在飞沙走石的寒风中流逝，每一秒都意味着敌人逼近一尺。集结！快！再快！用我们的血肉，在敌人砸下的铁锤前，筑起第一道墙！顶上去！"
LHS_xianjin: "围炉战术"
LHS_xianjin_desc: "敌军指挥官的脸上，最初的轻蔑逐渐被焦躁取代。她们看到的是一支“溃不成军”、只会“骚扰”的部队，不断“败退”，诱使她们深入这片看似唾手可得、实则沟壑纵横的山地腹地。她们推进的路线，正不知不觉地被我们预设的“迟滞点”引导着，像一股狂暴的洪水，被无形的堤坝约束着，最终涌入那片致命的洼地——那里，提前数日潜伏的、饱经风雪磨砺的主力，正沉默地蜷伏在冻土掩体下，枪口冰冷，呼吸在严寒中凝成白霜。"
LHS_hebing: "胜利就在前方"
LHS_hebing_desc: "我们追，她们跑！\n\n我们联合在一起！！\n\n    我们的胜利就在前方！！！"
##雪伊
LHS_zuizhong: "最终一击"
LHS_zuizhong_desc: "无数火种在灼热的口腔结籽\n无数铁矛已钉进更深的寒夜，\n呼喊的风暴勒紧残冬的咽喉\n旗帜——举着晨曦淌遍了旷野。"
LHS_kaixuan: "王朝的陨落"
LHS_kaixuan_desc: "我们终于推翻了王室待人如猪狗般得统治，\n工人在歌唱、孩子在嬉戏，\n现在，是该庆祝胜利了！"
LHS_qingsuan: "清算与审判"
LHS_qingsuan_desc: "昔日王室的堡垒深处，公社的审计员点着油灯，手指划过堆积如山的账簿。\n被囤积的粮食仓库位置、被强征的工厂设备清单、以及那些签署过镇压令的官员档案。每一笔记录，都指向一个亟待填补的窟窿或一个需要审判的名字。冰冷的数字在纸上跳动，带着未散尽的火药味。"
LHS_jieguan: "重建工厂"
LHS_jieguan_desc: "锈迹斑斑的工厂大门被工人自己推开，不再是监工的鞭子驱赶。\n晓枫带着她的工兵小队，仔细检查着那些曾为军团生产武器的流水线。扳手敲击着冰冷的钢铁，评估哪些齿轮还能转动，哪些车床可以改装成生产农具。\n空气中弥漫的不再是机油和恐惧，而是铁锈和一种小心翼翼的、重建的希望。"
LHS_bozhong: "播下希望"
LHS_bozhong_desc: "磨坊的石磨终于重新转动，碾磨着从王室粮仓清出的、带着陈腐气味的存粮，混合着公社自己省下的最后一点新豆种。雪伊蹲在田垄边，和公社的老农一起，捏碎一块板结的土块，查看墒情。分发下去的不仅仅是豆种，还有简单的、油印的轮作指南，上面画着歪歪扭扭的幼苗和太阳。"
LHS_yaopin: "分发药品"
LHS_yaopin_desc: "临时医院从阴暗的矿洞搬进了征用的贵族宅邸，窗户大开，驱散霉味。药品依然短缺，但绷带是干净的。\n疲惫不堪的医护兵终于能稍微直起腰，给伤员换上最后一批相对充足的敷料。\n角落里，一个失去右臂的年轻战士，正笨拙地用左手练习在分发清单上打勾（✓）。"
LHS_taiyang: "太阳照常升起"
LHS_taiyang_desc: "夜潮退尽嶙峋的山脊，风撕开残星织就的寒衣。\n荒原上马蹄踏碎霜痕，一杆孤旗卷起血色晨曦。\n\n我问沉睡的河川与谷地：“谁在深渊埋下火的种子？”\n岩缝间迸出金芒的箭镞——\n\n是太阳！撞破天穹的囚篱！"
LHS_shengxia: "我们还剩下什么？"
LHS_shengxia_desc: "“我们从一开始，就没给自己留后路！背后是万丈深渊，退一步就是粉身碎骨！前面没路了怎么办？那就用敌人的尸体，给老娘硬生生堆出一条路来！她们的骨头，就是我们最好的铺路石！听明白了吗？！\n现在，都给我滚去擦你们的枪！”"

LHS_zuoshen: "我们还能做什么？"
LHS_zuoshen_desc: "“收起你们那些小布尔乔亚式的伤感！怕死？怕被随便埋在哪个山沟里，连个墓碑都没有？那就给我打起精神来！我们的命，早就不属于自己了。我们的目标，从来不是为了让我们自己活得多好，而是要让这面红旗，插遍这个世界的每一个角落！只要那面旗子还在飘，我们就算是死在阴沟里，也比那些躺在黄金棺材里的国王，要伟大一万倍！”"

LHS_dedao: "我们能得到什么？"
LHS_dedao_desc: "“我们革命，我们反抗，不是为了让她们像柴火一样被烧掉。我们把自己的骨头当成武器，把血当成燃料，就是要打出个结果来！结果是什么？就是不能再让我们的同志，像没人要的野狗一样，死在冰冷的荒郊野外！”"

LHS_qilai: "全都给我站起来！"
LHS_qilai_desc: "“我们把剑指向那顶吃人的王冠，不是因为我想戴上它，不是为了让我们中的某个人，去当新的老爷。我们是为了把它彻底砸烂！是为了把这个颠倒黑白、人不像人鬼不像鬼的旧世界，彻底翻过来！我们要让天上的太阳和月亮，都为我们这些曾经在泥地里打滚的人，换上一个崭新的、光明的容颜！”\n“都听明白了吗？明白了，就好好睡觉，明天准时给我爬起来、站起来！我们还有一场硬仗要打呢。”"

LHS_zhachang: "爆破袭击"
LHS_zhachang_desc: "索拉娜把血肉工厂建在各大矿区之上，在她眼里我们已经被亡灵啃得一干二净了。晓枫在岩壁后凿了无数通往莉兰迪亚各处的暗道，亡灵军嗅不到腐液排污口的人气，巡逻队更懒得查已经连入口都塌陷了的废弃矿道。今夜，我们就从废水里爬进去，炸了她们熔炉，让她的血肉燃料淹了自家老巢！"

LHS_kongju: "煽动恐惧"
LHS_kongju_desc: "索拉娜的狗腿子怕亡灵怕得要死,把传单塞进她们偷运的面粉袋里，内容就写“你老婆的骨头正给亡灵当马桶！”\n再抓几个穿金戴银的监工，剁碎了扔进她制作血肉傀儡的炉子...让那群活蛆闻闻，主子拿人肉喂的机器...下一个是不是轮到她们！"

LHS_budui: "别当累赘"
LHS_budui_desc: "都爬起来！枪管给我擦到能照见你们饿瘪的蠢脸！烂布条绑紧伤口，别等会冲锋半道肠子漏出来拖累人！\n...后勤组！把那几箱裹脚布似的绷带发了！再让我看见谁用黑泥糊伤口...老娘亲手给你浇沸水消毒！"

LHS_qiru: "楔入黎明"
LHS_qiru_desc: "爆破组的手指缠紧了引信，矿道里只剩下锈铁摩擦的嘶声。\n通风口外，亡灵哨塔的磷火在飘——索拉娜的宫殿轮廓像坨发霉的巨兽。\n我抹了把枪托上的露水，冰得扎手。\n晓枫刻在希斯兰地下矿道岩壁上的最后一道箭头，正指着那畜生的心脏。\n全体上刺刀！\n把这血债...\n给老娘钉进她们的眼珠子！"

LHS_zhuiji: "清算亡灵"
LHS_zhuiji_desc: "“尸体堆里爬出来的姐妹们！夜莺之国的东西几个月前怎么对我们的？它们在东边边境又集结了，像蛆虫围着死肉！\n喘口气？我们倒是想喘！可它们会等着我们收完这季粮食？等着我们母亲熬过冬天？ \n\n它们不会！它们只记得我们捅穿了索拉娜！\n现在，它们的亡灵军队早已被我们折腾得七零八碎了。\n没人能够阻拦我们，现在正是我们打断它们脊梁的最后机会！”"

LHS_zhuijiwangling: "直捣夜莺之心"
LHS_zhuijiwangling_desc: "\n那帮亡灵的矿工比腐肉还臃肿，哨位就是狗屎做的！\n\n从矿脉炸穿她们的粮仓！从洞窟捅烂她们的兵营！\n把夜莺的国本砸碎在它们自己的地底粪坑里！"

LHS_jiaomie: "亡灵与走狗"
LHS_jiaomie_desc: "我没兴趣去评判那些小姑娘的正义，也没功夫去理解那些长耳朵的所谓古老智慧。\n我只知道，当我们在为了所有人的明天而流血时，她们，正躲在自己那可笑的结界和森林里，假装什么都没看见。\n她们说，她们要守护平衡，要对抗绝望。\n可当亡灵的军队，把活人变成她们脚下的白骨时，她们的平衡在哪里？当我们的战士，饿着肚子去冲锋时，她们的希望又在哪里？\n这片土地上，没有中间地带。所有不站在我们这边的，就是在帮助敌人。所有挡在我们前进道路上的石头，不管它看起来有多漂亮，或者有多无辜……\n都只有一种下场。\n——被碾碎。"

LHS_guitu: "归土还乡"
LHS_guitu_desc: "现在，该轮到那些吸着我们人民的血液的外来者了，她们以为自己是历史的主人？错了。她们只是即将被扫进垃圾堆的、一具具会走路的尸体罢了。而我们，就是亲手为她们挖好坟墓，再把她们一脚踹进去，最后再填上土、踩结实了的那个人。\n让她们归土还乡，让她们滚回海对岸去！"

LHS_sita: "艾尔孚利登之誓"
LHS_sita_desc: "兄弟姐妹们，你们的苦日子到头了。\n从今天起，没有人再能欺压你们，就像我们刚刚赶跑那群吸血的秃鹫一样。\n至于那些被守护下来的工厂...\n瓦尔哈拉社的姐妹们，伸出手接好！这是你们应得的补偿！"

LHS_jiefangsita: "解放到来"
LHS_jiefangsita_desc: "兄弟姐妹们，知道你们在敌人手底下熬得苦。别怕，我们来了！\n那些抢了你们家园、压在你们头上的狗东西，老娘今天就替你们把她们的爪子碾碎！"
##木棉民族精神
##木棉政治线
LHS_No_Gentle_Township: "此处并非温柔乡"
LHS_No_Gentle_Township_desc: "“晓枫，把那张画满了红蓝箭头的地图收起来吧，看着让人眼晕。也别在那儿算计什么包抄和穿插了，别让那些死板的教条扰了这午后的清净。\n你把对面想得太硬了，丫头。隔着这几里地的冻土，我都能闻到那股子从她们阵地上飘过来的、发霉的脂粉气。\n那是索拉娜养出来的‘富贵病’。她是个慷慨的饲养员，用丝绸裹住了刀柄，用红酒泡软了战士的骨头。那帮曾经跟我一起在雪窝子里敢嚼生肉的狼，现在……怕是连靴子踩进泥坑里都要皱眉头了。她们不再敬畏死亡，她们只是舍不得口袋里的金币。\n对于这群还在做着富贵梦的醉鬼，最管用的手段不是轰轰烈烈的炮火覆盖——那是给英雄准备的葬礼，她们不配。\n对付她们，只需要把她们头顶那层遮风挡雨的屋顶掀了，让凛冽的狂风灌进她们的衣领里。\n传我的话下去：把我的那件旧军大衣，挂到阵地最高的旗杆上去。\n然后告诉炮兵，别盯着人打，太浪费。专门给我盯着她们的酒窖、金库和暖房打。\n等到她们发现手里的金条买不来命，身上的丝绸挡不住寒风的时候……这碗夹着冰渣子、苦得要命的醒酒汤，她们就算不想喝，也得捏着鼻子，给我一口一口地咽下去。”"

LHS_Open_The_Windows: "把门窗都敞开"
LHS_Open_The_Windows_desc: "“晓枫拿来新办公厅的图纸，把墙砌得厚厚的，说是为了安全。我倒是觉得，比起挡子弹的墙，我们更缺穿堂的风。\n索拉娜喜欢坐在高塔上，那是为了让人仰视；我们坐在泥地上，是为了能听见脚步声。\n把那些围墙的砖头搬去铺路吧，把大门卸下来当柴烧。我就在那棵大榕树底下办公，风吹得进来，大家伙儿路过也能顺便聊上两句。\n椅子硬一点没关系，能让人随时站起来就好。让空气流通起来，人心里的那股霉味儿，自然就散了。”"

LHS_Calluses_Tell_Truth: "手上的茧子最诚实"
LHS_Calluses_Tell_Truth_desc: "“雪伊这孩子，看着那群被俘的士兵总是咬牙切齿。其实，那些孩子手里的枪是别人塞的，但肚子饿的感觉是自己的。\n与其关着她们费粮食，不如带她们去咖啡园，去矿坑。把那身紧绷的军装脱了，换上透气的工装，让她们试试亲手种出一季粮食，或者亲手挖出一车矿石。\n当她们看着麦苗从土里钻出来，或者接过老乡递来的一碗热汤时，心里那杆秤自然就平了。\n道理讲一千遍，不如手心里磨出一个茧子实在。汗水流多了，眼睛也就被洗亮了。”"


LHS_Keep_The_Wolf: "留着那头狼"
LHS_Keep_The_Wolf_desc: "“大家都在讨论怎么处置索拉娜。她确实是头贪吃的狼，差点把咱们都吞了。但杀了她，不过是多了一捧灰；留着她，却是一面镜子。\n给她个有窗户的房间，给她书看，给她饭吃。让她好好看着，这片被她视作猎场的土地，是怎么在我们手里变成家园的。\n我们也得常去看看她。看着她，我们就能想起来：一旦脱离了土地，一旦开始把人当成数字，我们离变成下一个‘狼王’，也就只有一步之遥。\n她是个好教员，时刻提醒着我们，权力的味道闻久了，可是会让人发疯的。”"

LHS_Rotten_Leaves_Nutrients: "腐叶也是养分"
LHS_Rotten_Leaves_Nutrients_desc: "“那些旧贵族和买办，现在缩在角落里，像是被霜打过的叶子。\n以前她们高高在上，确实挺碍眼。但现在她们落下来了，落到泥里了，那就让她们变成养分吧。\n她们懂算术，就让她们去帮公社记账；她们懂外语，就让她们去翻译那些大部头的书。\n只要愿意把腰弯下来，把根扎进土里，这片林子就大得没边，哪里容不下一棵草呢？\n把腐烂的东西翻进土里，明年的花反而开得更艳。咱们气量大一点，日子才能过得宽一点。”"

LHS_Bonfire_Wisdom: "围着篝火聊一聊"
LHS_Bonfire_Wisdom_desc: "“专家们的图纸画得很直，但地上的路往往是弯的。\n怎么修水渠，与其在办公室里争论，不如去河边问问那个捕了一辈子鱼的老人；怎么改土质，书本上的道理，未必有种了一辈子地的老农说得透。\n以后遇到难事，咱们就点起篝火，大家围坐一圈。让每个人都说说，让每种声音都飘出来。\n智慧这东西，就像这火里的火星子，大家凑在一起，才能烧得旺。\n只要我们肯听，办法总比困难多。”"

LHS_Hand_On_The_Plough: "握枪的手也能扶犁"
LHS_Hand_On_The_Plough_desc: "“咱们的队伍，以前叫‘野火’，是为了烧荒；现在火势过去了，咱们得做‘春雨’，得润物。\n枪要擦亮，但锄头也得磨快。闲下来的时候，咱们就是垦荒队，是建筑工。去帮着修修桥，补补路。\n咱们吃的是大家种的粮，穿的是大家织的布，出力干活是天经地义的事。\n要让老百姓觉得，咱们不仅能挡风雨，还能帮着过日子。\n这样，咱们的根系就和这片土地长在一起了，谁想拔都拔不出来。”"

LHS_Over_The_Next_Mountain: "翻过这座山"
LHS_Over_The_Next_Mountain_desc: "“胜利了，大家都想松口气，喝杯酒庆祝一下，这很正常。\n不过，我得提醒一句。赶跑了狼群，并不代表森林就安全了。前面还有沼泽，还有更陡的山。\n我们现在搭起来的这个棚子，还要加固，还要防风。这时候要是太贪图软床垫，腿脚可是会变软的。\n把那双沾满泥巴的靴子留着吧，放在门口显眼的地方。\n路还长着呢，同志们。咱们这才刚走到哪儿啊。\n收拾收拾，把行囊系紧点，咱们……去看看山那边的风景。”"

LHS_Bones_And_Rabid_Dogs:0 "看看白骨上的规矩"
LHS_Bones_And_Rabid_Dogs_desc:0 "“大家伙儿现在看到白骨头就吓得发抖，拿锄头乱砸。这怪不得乡亲们。索拉娜留下的那些亡灵，眼冒红光，见肉就咬，确实是个大祸害。\n但隔壁那位夜莺公主，最近派了些穿着制服的骷髅在边境晃悠。它们咔哒咔哒地走，不伤人，只是盯着咱们的方向。\n告诉民兵，把枪口压低一点。\n分清楚，什么是饿疯了的野狗，什么是邻居家来找人的保安。只要它们没跨过界碑，咱们就端个板凳看着。恐惧往往源于闭着眼睛乱挥拳头，咱们得把眼睛睁开。”"

LHS_Uninvited_Cold_Wind:0 "且让冷风刮进来"
LHS_Uninvited_Cold_Wind_desc:0 "“信看了。莉莉安娜那小丫头，脾气挺冲。她觉得咱们把索拉娜关在暗无天日的地牢里虐待，扬言要带兵踏平咱们的首都。\n她的大军已经越过边境了，气温都跟着降了十几度。\n别急着派大部队顶上去。\n索拉娜的亡灵正把咱们的防线搅得焦头烂额。莉莉安娜要来首都，就必须穿过那片怪物横行的封锁区。\n让前线部队收缩防线，把大路让开。\n既然她急着来找人，那就让她这股冷风，先去刮一刮那些发臭的疯狗。”"

LHS_Show_Her_The_Mud:0 "请她踩踩这烂泥"
LHS_Show_Her_The_Mud_desc:0 "“莉莉安娜带着她的卫队，停在了首都城外。她要我交出索拉娜。\n这小姑娘脑子里，大概还在放着恶龙囚禁公主的戏码。\n行吧，我亲自去见她。就带个向导，然后直接出发。\n我带她去城郊的国营农场。\n我要让她亲眼看看，她心心念念的那个暴君，现在是个什么德行。\n事实胜于雄辩。那些冰冷的魔法和执念，遇到这片热气腾腾的烂泥地，总会化成水的。”"

LHS_Check_The_Glass:0 "凑近看看那琉璃"
LHS_Check_The_Glass_desc:0 "“东边的那些魔法少女，身上发着五颜六色的光。\n有人说她们是天使，有人说那是被诅咒的怪物。\n咱们别听别人瞎嚷嚷。派雪伊带人去接触一下。\n这些小姑娘，有的心还是红的，愿意为了老百姓拼命；有的心却黑了，把普通人当草芥；还有的，嫌咱们这儿脏，跑去给圣杯的殖民者当打手。\n眼睛擦亮透，看清她们灵魂宝石的颜色。\n是同志，咱们砸锅卖铁也得护着；是敌人，咱们就抡起铁锤，把那漂亮的琉璃砸个粉碎。”"

LHS_Smash_The_Black_Glass:0 "听，那琉璃碎了"
LHS_Smash_The_Black_Glass_desc:0 "“那些灵魂彻底黑掉的。\n她们已经不是小姑娘了，她们是披着人皮的压迫者。\n她们用那种吸血换来的力量，在我们的人民头上作威作福。\n既然心烂透了，就没救了。\n通知炮兵营，把坐标定好。别管那光看着多漂亮，只要是用来晃咱们眼睛的，就给我轰碎它。\n打碎琉璃会扎手，但这活儿，咱们必须干。”"

LHS_Disease_Not_God:0 "那是病，不是神"
LHS_Disease_Not_God_desc:0 "“北边的阿德莱希，传得神乎其神。说信了她们的神，就能极乐飞升。\n前线的娃娃们吓坏了，说对面的兵杀不死，说听到了神的声音。\n我把她们骂了一顿。\n只要是碳基生物，就没有不怕火烧的。恐惧是因为看不懂。把那些神神鬼鬼的皮扒了，里面也不过是烂肉。\n告诉大家，那不是赐福，那是病毒。\n咱们不信神，所以神吓不倒咱们。\n带上喷火器和生石灰，咱们去给北边做一次彻底的大扫除。”"

LHS_Unite_All_Breathing:0 "攥紧所有发烫的手"
LHS_Unite_All_Breathing_desc:0 "“阿德莱希那势头太猛，那是一群要把整个世界都拖进烂泥塘里的疯子。\n这时候就别挑剔队友了。\n给莉莉安娜发个电报，问问她的夜莺卫队怕不怕触手；给那些愿意悔改的魔法少女送封信，问问她们想不想报仇。\n告诉大家：先别管以后谁当老大，先把这个想把大家都变成怪物的家伙干掉再说。\n只要不想变成触手怪的，咱们都在一个锅里吃饭。”"

LHS_Landlord_Collects_Rent:0 "走，咱们收租去"
LHS_Landlord_Collects_Rent_desc:0 "“疯子赶跑了，咱们还得回头看看自个儿的屋子。\n海边那几个港口，还插着圣杯的旗子呢。\n那些老爷们，赖在咱们这儿一百多年了，喝咱们的血，吃咱们的肉，还嫌咱们身上有泥味儿。\n以前咱们弱，忍了。现在咱们手里有枪，这事儿就不能忍了。\n把账本翻出来，一笔一笔地算。\n告诉他们：租期到了，房东要收房了。滚回你们的岛上去喝下午茶吧。”"

LHS_Drag_Them_Into_Mud:0 "拽进这吃人的泥潭"
LHS_Drag_Them_Into_Mud_desc:0 "“那些老爷们的船坚炮利，咱们硬拼那是拿鸡蛋碰石头。\n那就主动出击，把他们放进来。\n放进咱们最熟悉的雨林里，放进咱们的烂泥塘里。这里的每一棵树，每一只蚊子，每一寸烂泥，都是咱们的亲戚。\n把路挖断，把井填了，把粮食藏起来。\n让他们穿着蹭亮的皮靴在泥里打滚，让他们喝着脏水拉肚子。\n得让他们知道：这块地儿虽然软，但也吃人。”"

LHS_Back_To_The_Sea:0 "海风吹散了香水味"
LHS_Back_To_The_Sea_desc:0 "“看，他们退了。\n那些高高在上的老爷们，终于扔下了他们的礼帽和手杖，像落水狗一样爬上了他们的船。那些跟他们混在一起的叛徒，也低下了高贵的头。\n别追了，让他们走。\n咱们要的不是他们的命，是咱们自己的家。只要他们滚蛋了，这片土地就算干净了。\n站在海边，看着他们的船消失在海平线上。\n深吸一口气。现在的空气里，终于没有那股子令人作呕的香水味了，只有咱们自己的泥土香。”"

LHS_Red_Clay_Commune:0 "红泥公社"
LHS_Red_Clay_Commune_desc:0 "“南美这块地儿，终于算是咱们自己当家了。\n有人说要改个霸气的国名，叫什么帝国、联邦。我说，算了吧。\n咱们就是一群在红泥地里刨食的人。\n就叫‘红泥公社’吧。\n红色的，是因为流过血；泥做的，是因为咱们命贱但好养活；公社嘛……就是不管谁家揭不开锅了，都能来这儿盛碗饭。\n这名字不神圣，但亲切。就像你脚底下的路，踏实。”"

LHS_Barefoot_On_Scorched_Earth:0 "光着脚，踩下去"
LHS_Barefoot_On_Scorched_Earth_desc:0 "“皮靴踩在铺满弹壳的泥潭里，总容易打滑。咱们得把鞋脱掉，光着脚，用脚心去感受这片被炮火翻耕过的红土。\n战争留下的烂摊子，单靠几张图纸和几条指令填不平。把指挥部的桌子搬到甘蔗林里去。咱们得和那些刚放下枪的乡亲们站在一起，把地里的铁疙瘩刨出来，换上新买的咖啡豆种。\n咱们的脚底板会磨出血泡，会结出厚厚的茧子。唯有长满老茧的脚，才能在这片湿热的土地上站得稳当。”"

LHS_Hand_Over_The_Ledger:0 "把账本交给车间"
LHS_Hand_Over_The_Ledger_desc:0 "“从前咱们只管打烂旧世界，现在得学着经营新家当。打江山靠枪杆子，守江山得靠算盘珠子。\n把各级委员会的账本复印几百份，发到每一个车间、每一个村公所。让工人们自己去算，一台车床需要多少煤，一亩地需要多少水。\n习惯了握榔头的手去拨算盘，起初肯定会算错，会造成物资卡壳。这阵痛，咱们得受着。只有等他们把这笔账算明白了，这天下才算真正交到了他们手里。”"


LHS_Measuring_Suffering:0 "先塞满最饿的嘴"
LHS_Measuring_Suffering_desc:0 "“重建的物资总是不够分，各地的申请报告像雪片一样飞进中央。\n晓枫是个明白人，她知道那些冰冷的数字背后，是几万个家庭的饭碗。\n她拿着那把看不见的尺子，在深夜里一笔一笔地丈量着这片大陆的伤痕。\n把最多的药送到曾经的重灾区，把最好的种子送到被焦土过的荒原。这叫雪中送炭。至于那些吵着要多拿份额的富裕大区，让他们学会勒紧裤腰带，去拉兄弟一把。”"

LHS_Tearing_The_Scab:0 "撕开这发黑的血痂"
LHS_Tearing_The_Scab_desc:0 "“安逸的日子过久了，有些人就开始长肉，脑子也跟着发昏。\n我发现，有些新提拔的干部，开始学着旧贵族的做派，出门要坐小汽车，吃饭要讲究排场。他们拿着晓枫批下去的救命物资，在基层搞起了‘特殊分配’。\n伤口刚结痂，里面的脓包还在化脓。\n必须把这层痂撕开，让血流出来。带上宪兵和老百姓选出来的代表，下去查账。\n咱们流了那么多血换来的天下，绝容不得这帮蛀虫啃噬。”"


LHS_Muddy_Abacus:0 "听这泥腿子的算盘"
LHS_Muddy_Abacus_desc:0 "“贪官清除了，但留下来的空缺得有人补。\n我们开办了夜校，晓枫主动提出要去当校长。她要把那些识字不多、但心眼实在的工人和老农招进来。\n教他们打算盘，教他们看报表。告诉他们，管理一个工厂，就跟种一亩地一样，得算节气，得算肥料。\n是啊，咱们得让这些泥腿子真正掌握管理这门手艺。只有当满手老茧的人拨响了算盘，这政权才算真正在土里扎了根。”"

LHS_Boiling_Amazon_Water:0 "沸腾的河水"
LHS_Boiling_Amazon_Water_desc:0 "“整个公社都在超负荷运转。大家伙儿学习当家作主的热情，像沸腾的河水。\n但这沸腾的表面下，我察觉到了一丝不对劲。\n物资的调配异常精准，各地的纠纷被迅速平息。这种完美，在咱们这个刚起步的穷底子上，显得极不真实。\n所有的压力，似乎都被引导到了一个汇聚点。\n我要亲自去查。去看看，到底是谁，在用什么样的燃料，维持着这台看似完美的庞大机器运转。”"

LHS_Chalk_And_Calluses:0 "握牢这半截粉笔"
LHS_Chalk_And_Calluses_desc:0 "“晓枫倒下了，就在给工人夜校上课的讲台上。\n她手里的粉笔断成了两截，人也陷入了深度的昏迷。医生说，她这是心血耗尽。\n咱们不能再让她一个人把天扛下来了。\n停下那些需要她去平衡调配的高压项目。把真相公布出去。\n告诉所有人，他们手里的这本工人手册，是用什么换来的。\n我要让这片大陆上所有的人都明白，重量，必须由大家的肩膀一起扛。\n谁也别想一个人当英雄。”"

LHS_Thousands_Of_Red_Handprints:0 "万人的红手印"
LHS_Thousands_Of_Red_Handprints_desc:0 "“晓枫醒了，但她需要在轮椅上休养很长一段时间。\n她空出来的那个位置，那个庞大的调配系统，竟然奇迹般地没有塌。\n把所有的账本搬到广场上去。发动各级工会、农会、村委会。\n让基层的群众自己来算账，自己来决定物资的去向。谁家多拿一口，谁家少拿一口，大家伙儿围着篝火，自己商量着办。\n把这把象征权力的、沉重的算盘，彻底拆散，分发给每一个劳动者。\n咱们的公社，从今天起，真正由大家伙儿自己来当家。”"

LHS_Suturing_The_Broken_Clay:0 "咱们，又活过来了"
LHS_Suturing_The_Broken_Clay_desc:0 "“阵痛熬过去了，伤疤长出了新肉，比原来的皮肤更硬。\n咱们的公社，现在才算真正活明白了。\n把那些停滞的工程重新启动，把被搁置的对外援助重新连线。\n咱们不再追求那种完美的、不切实际的账面数据。咱们踏踏实实地，修好每一座桥，种好每一亩地。\n用这种带着泥土味的、真实的温度，去缝合这片大陆上所有的裂痕。\n让所有的老百姓都知道，红泥公社，是一个允许你犯错、并给你力量去改正的地方。”"

LHS_Sunken_Iron_Crown:0 "把昨天埋得深一些"
LHS_Sunken_Iron_Crown_desc:0 "“那些象征着旧时代痛苦与耻辱的东西，咱们不能留着过节。\n把缴获的旧王冠、殖民者的权杖、甚至是那些用来束缚魔法少女的契约文书，统统装进船里。\n把它们运到大洋的最深处。\n这可不是为了祭奠，这是为了彻底的告别。\n咱们要把这些带着血腥味的旧幽灵，永远地埋葬在不见天日的海底。\n让这片大陆，干干净净地，迎接明天的太阳。”"

LHS_Facing_Equatorial_Sun:0 "迎着太阳，齐步走！"
LHS_Facing_Equatorial_Sun_desc:0 "“路还长着呢，同志们。\n咱们把烂摊子收拾干净了，把伤口缝好了，把旧骨头沉进了海里。\n现在，咱们这群泥腿子，终于可以挺直腰杆，堂堂正正地站在这片赤土上了。\n把衣服上的灰弹干净，把鞋上的泥洗掉。\n抬头，看前面。\n那是属于咱们自己的太阳。\n它毒辣，它刺眼，但它真实地照在咱们每一个人的身上。\n走吧，去过咱们热气腾腾的日子去。”"

LHS_The_Velvet_Chokehold:0 "剪断那条天鹅绒"
LHS_The_Velvet_Chokehold_desc:0 "“海对面的圣杯王国，正向全世界展示着他们那套文质彬彬的规矩。\n他们的议会全票通过了一项贸易保护法案。几百艘涂着雪白漆面的远洋战舰，死死封锁了公海的边缘。那些穿着笔挺制服的绅士们，端着高脚杯，微笑着掐断了运往咱们红泥公社的所有抗生素和重型机床。\n在他们的账本里，咱们这片新生的土地只配出产廉价的咖啡豆，然后乖乖购买他们标着天价的绷带。\n这般杀人见血的手段，透着一股子令人发指的体面。他们企图让咱们在这片红泥地上慢性窒息。\n咱们必须倾尽所有的船坞，把刚刚焊好的钢铁战舰开出去。迎着风暴，撕开这条名为自由贸易的绞索。”"

LHS_Steel_Seagulls_Path:0 "放飞小海鸥"
LHS_Steel_Seagulls_Path_desc:0 "“咱们的船坞里，第一批真正意义上的钢铁驱逐舰终于下水了。\n它们舍弃了圣杯舰队那种流线型的优雅外观，满身皆是粗犷的铆钉和厚重的防弹钢板，透着一股子属于红泥大地的倔强。\n小果子给每一艘船都亲手漆上了咱们的火焰标志。她带着那些由矿工和农民转职来的水手，日夜钻研着暗礁与洋流的脾气。\n圣杯王国的雷达眼观六路，咱们就专挑浪头最高、海雾最浓的黑夜出航。\n把引擎的轰鸣压到最低，用海浪的咆哮掩盖咱们的行踪。大海向来偏爱勇敢的孩子，这片深蓝色的水域，全都是咱们最坚固的屏障。”"

LHS_The_Silver_Net_Closes:0 "然后，星星坠入了大海"
LHS_The_Silver_Net_Closes_desc:0 "“情报室里的红灯闪得刺眼。\n敌人的远征舰队摸透了咱们的航线，他们倾巢而出。庞大的无畏舰群在最狭窄的出海口拉开了一道密不透风的封锁线。\n天空被他们的舰载机彻底遮蔽，海面被密集的探照灯照得亮如白昼。\n小果子的运输编队被死死地逼进了死角。满载着救命药品的货船，全暴露在对方的碾压射程内。这完全是一场实力悬殊的猎杀。\n为了保障物资船安然撤回浅水区，必须留下一块足够巨大的诱饵，填满那头钢铁巨兽的胃口，\n用绝对的吸引力，强行撕开一个足以逃生的缺口。”"

LHS_The_Empires_Condolence:0 "撕碎一切傲慢"
LHS_The_Empires_Condolence_desc:0 "“圣杯王国的外交官，乘坐着白色的快艇，送来了一份特别考究的公函。\n信纸上喷着昂贵的香水，用最优雅的花体字书写着他们的‘文明与宽容’。\n他们对‘海上执法中意外殉职的一名非法武装人员’表示‘遗憾’。作为人道主义的补偿，只要咱们肯出让东部矿区的开采权，他们愿意支付一笔惊人的黄金汇票，作为对死者家属的抚恤金。\n在这帮殖民者的眼里，热腾腾的生命、坚贞的誓言、流尽的鲜血，全都是可以用表格和金钱来等价交换的商品。\n把这封信原封不动地翻译出来，贴到红泥广场的告示板上。\n让全大陆的人民用自己的眼睛看清楚，这帮自诩为文明灯塔的老爷们，骨子里流淌着怎样冰冷恶臭的毒液。”"

LHS_Igniting_The_World_Fire:0 "跨海，敲门去"
LHS_Igniting_The_World_Fire_desc:0 "“晓枫拿起那份被民众撕碎的吊唁信，走到司令部的沙盘前。\n‘头儿，’她声音沉静，却透着股惊心动魄的力量，‘老乡们的眼睛彻底亮了。民气可用，军心已成。’\n我拿起桌上的红铅笔，在地图上整个殖民体系的咽喉要塞上，画了重重的红叉。\n这场仗，跨越了单纯的复仇。这是为了争一个人活在世上该有的体面，证实这世上的人命唯有纯粹的尊严，断然拒绝拿钱来衡量分毫。\n下达总动员令。让所有的远洋渔船换上装甲，让所有的铁管填满烈药。\n咱们要跨过大洋，去把全天下的锁链统统砸碎。”"

LHS_Shattering_The_Glaze:0 "我们不会再见了，老爷们"
LHS_Shattering_The_Glaze_desc:0 "“他们的战线拉得太长，殖民地的吸血管道一旦被斩断，那具庞大的身躯立刻陷入了虚弱。\n咱们的主力舰队就像一柄滚烫的尖刀，直直地插进了这帮高高在上的老爷本土的海域。\n越过雷区，突破港口防波堤。让我们的炮火，点亮他们那些奢华的议会大厦和股票交易所。\n把他们用来遮羞的玻璃罩子全部砸碎，让里面的恐惧和懦弱彻底暴露在烈阳下。\n旧时代的黄昏，将由咱们亲自来送终。”"

LHS_Sunflowers_On_Ruins:0 "你看，向日葵开了"
LHS_Sunflowers_On_Ruins_desc:0 "“老爷们的舰队投降了。那面高贵的旗帜，沾满了污泥，落在了咱们士兵的靴子旁。\n全世界的殖民地，迎来了渴望已久的解放。欢呼声响彻地球的每一寸角落。\n仗打完了，可心口的伤疤依然刺痛。\n咱们把装火药的箱子腾出来，装满南美的向日葵种子和药品，分发给那些刚刚获得新生的人民。\n在废墟上重建家园，需要漫长的时间。咱们得带着大家，一步一个脚印地把日子过出个奔头来。”"

LHS_Goodnight_Tomorrow:0 "晚安，大伙儿"
LHS_Goodnight_Tomorrow_desc:0 "“故事讲到这里，迎来了最浓墨重彩的一笔。\n咱们流了那么多的血，吃了那么多的苦，硬生生把那个吃人的旧世界掀了个底朝天。\n那些长眠在冬天底下的同志，那些用命换来今天这口热饭的英雄。\n咱们把他们的名字深深地刻在碑上，种下满山的向日葵。\n今天晚上，给大家放个假。不论是将军、书记，还是工厂里的女工、地里的老农。\n咱们围在篝火边，好好吃顿饭，好好睡个觉。\n天亮之后，这属于所有人的崭新大门，正等着咱们去亲手推开。”"

#木棉外交线
LHS_Brew_Caramel_Across_Ocean:0 "越洋斟满焦糖浆"
LHS_Brew_Caramel_Across_Ocean_desc:0 "“听闻瓦尔哈拉那个叫希亚的姑娘，日夜端着武器奔走救人，眼底熬满猩红血丝。\n咱们这群在烂泥里打过滚的老兵深知，紧绷的弓弦迟早折断。拯救世界这种劈山填海的重活儿，全压在一个小女孩肩上，实在残忍至极。\n吩咐后厨，用最烈的火，煮一壶最浓的红泥咖啡，多加两勺甘蔗糖。再拿几张棕榈叶编织的结实吊床，打包寄过去。\n按我的原话照写：‘累极了就躺下歇息。放平肩膀，喝口甜汤。天塌下来，有咱们这群泥腿子帮你顶着。’”"

LHS_Cleave_Arrogant_Bones:0 "钝刀劈开傲慢骨"
LHS_Cleave_Arrogant_Bones_desc:0 "“中美洲那边有个叫伊莉丝的家伙，把人命当成供她取乐的玻璃珠子。\n咱们这里的农人，流血流汗才换来一口饱饭，断然拒绝这种把别人踩在脚底下的傲慢。\n去仓库里挑一把砍柴用的生锈砍刀。刀刃上保留咱们砍甘蔗留下的泥巴和树汁。\n用一件浸透汗水的旧工装把它包裹起来，送给她。\n捎句话：‘收起你戏弄人的把戏。这把刀钝得很，砍人的时候极疼。咱们的泥巴，专门用来埋葬你们这些自命不凡的怪物。’”"

LHS_Muddy_Boots_Trample_Velvet:0 "泥靴践踏天鹅绒"
LHS_Muddy_Boots_Trample_Velvet_desc:0 "“北边的那些老爷，穿着燕尾服，端着高脚杯，用几张轻飘飘纸片，就卷走咱们大半年口粮。\n他们把这种吸血行径，包装成体面文明。\n去咱们的烂泥塘里，找一双矿工穿破的、沾满黑泥的胶鞋。\n装进最华丽礼盒里，寄给他们的最高长官。\n附上一封信：‘你们喝的咖啡，全是这种靴子在泥里踩出来的。脱下你们的皮鞋，穿上它去矿里走两圈。体会一下这靴子里的血水，再来跟咱们谈文明。’”"

LHS_Plump_Grains_Fill_Stomachs:0 "饱满金粒填空腹"
LHS_Plump_Grains_Fill_Stomachs_desc:0 "“听闻北边的同志们，天天在广场上喊着震天响的口号。\n热情高涨，锅里的饭却少得可怜。光靠嗓门大，填饱肚子可谓天方夜谭。饿着肚子搞革命，纯粹拿乡亲们的命开玩笑。\n给他们送去十船咱们这儿最高产的玉米种子，外加几本咱们老农自己总结的种地手册。\n告诉他们：‘先让大伙儿吃上一顿饱饭，再教他们怎么挥舞拳头。把脚踩进泥里，踏踏实实种出粮食，这才是咱们穷人最硬气的底牌。’”"

LHS_Rough_Thread_Drives_Cold:0 "粗纺红线驱极寒"
LHS_Rough_Thread_Drives_Cold_desc:0 "“那个叫小樱的姑娘，一个人坐在那么大的冰原上当家。冰天雪地里，周围全是一群板着脸的老头子。\n那么小的年纪，成天被规矩和机器压着，冻得人骨头发疼。\n停止给她寄送枪炮图纸，她那儿最充裕的就是铁疙瘩。\n让咱们村里手最巧的织女，用新采棉花，纺出最软丝线，染成最亮堂红色，亲手织一条长长围巾。\n这围巾里织进去了咱们南美的太阳。告诉她：‘累了就把围巾裹紧点。在这条红色路上，你只管往前走，有咱们这群大姐在后面替你挡风。’”"

LHS_Hold_Up_Red_Soil:0 "捧起赤土祭同袍"
LHS_Hold_Up_Red_Soil_desc:0 "“东边那片土地上的同志们，跟咱们一样，都在敌人炮火下，靠着嚼草根、啃树皮挺过来。\n他们懂得泥土重量，懂得老百姓眼泪。\n把咱们这儿被先烈鲜血染红的红泥土，装满一个小小的陶罐。\n派最可靠信使，漂洋过海送过去。\n附上一封信：‘这罐土里，装满了咱们南美几代人的命。咱们脚下道路是一样的。攥紧这把泥土，咱们一起，把这世上苦难彻底终结。’”"



#木棉个人线
LHS_Golden_Foil_Relic:0 "金衣包裹的旧伤"
LHS_Golden_Foil_Relic_desc:0 "“清扫旧王室地下储藏室时，后勤同志搬出了一堆杂物。那只贴着金箔、画着骷髅头的精致玻璃瓶，安静地躺在灰尘里。正是当年索拉娜强行灌进我喉咙的‘安神剂’。\n大家伙儿全拿这事当做茶余饭后的笑谈，嘲弄那个暴君连说明书都读错的文盲行径。\n把这只瓶子送到我的桌上。阳光穿透这层深紫色的玻璃，折射出的光斑，透着地窖深处那种湿冷的腐朽味。\n我留着它。权当是一枚纪念勋章，时刻提醒着我那场把骨髓都泡软的长眠。”"

LHS_Phantom_Of_The_Cellar:0 "这里的黎明静悄悄"
LHS_Phantom_Of_The_Cellar_desc:0 "“新修的广场上，工人们喊着号子夯实地基。这种夹杂着汗水与热浪的声音，是最悦耳的催眠曲。\n把我的藤椅搬到广场边缘的树荫下。\n文件审批的工作全权移交给晓枫。雪伊负责防务，小果子管理航运。她们的羽翼已然丰满，足以撑起这片天空。\n我只需要坐在这里，看着她们把图纸变成砖瓦。偶尔闭上眼睛，听着那些推车碾过石板的声响，让这些充满生机的噪音，把脑子里那些阴冷的回音硬生生挤出去。”"

LHS_Wolfs_Snarl_And_Silence:0 "那头挑水的狼"
LHS_Wolfs_Snarl_And_Silence_desc:0 "“索拉娜那家伙，最近学着种地，脾气倒是一点未改。她带着莉莉安娜，扛着两筐刚挖出来的红薯，大摇大摆地闯进了我的院子。\n她显然是想来炫耀她的‘劳动成果’，顺便嘲笑我这个整天瘫在椅子上的‘废人’。\n把茶具摆好。莉莉安娜懂礼数，咱们必须尽地主之谊。\n至于那头狼，给她一把最钝的刀，让她自己去削苹果。让她坐在这儿，好好体会一下，收起爪子、安静削皮的时光，到底有多金贵。”"

LHS_Carving_The_Legacy:0 "木屑里的传承"
LHS_Carving_The_Legacy_desc:0 "“手抖得越发厉害。拿枪纯属奢望，拿刻刀倒是勉强。\n找一块最硬的红木。我要坐在阳光底下，一点一点地把它雕出来。\n给小果子雕一条乘风破浪的帆船；给雪伊雕一头呲牙咧嘴的黑狼；给晓枫……雕一副最精密的算盘。\n这木头硬，刻出来的东西能存放许久。\n把这些小玩意儿打磨光滑，涂上防腐的清漆。等我这双手彻底罢工那天，就把它们发下去。这算是我这个老兵，给这片新土地留下的最后一点念想。”"

LHS_Final_Taste_Of_Apple:0 "尝尝，这果子真酸"
LHS_Final_Taste_Of_Apple_desc:0 "“味觉退化得特别严重。厨房炖的红烧肉，吃在嘴里全成了木渣的滋味。\n去村口的果园里，摘几个生涩的青苹果。\n这种苹果酸得能让人掉眼泪。唯有这种极致的酸涩，才能刺激我那即将坏死的味蕾，让我真切地感觉到，自己还在这热气腾腾的人间喘着气。\n摆一盘在桌上。\n我要就着这股子酸劲儿，把最后几份关于教育普及的公文批完。字得写得用力点，力透纸背，让他们知道，我还死死盯着他们呢。”"

LHS_The_Long_Slumber:0 "睡吧，天快黑了"
LHS_The_Long_Slumber_desc:0 "“太阳要下山了。今天的晚霞烧得特别红，像极了咱们当年在山沟里点起的那堆篝火。\n把藤椅搬到院子里去，正对着夕阳。\n告诉晓枫，那份农业改革的草案我看了，批注写在背面；告诉雪伊，枪栓要经常擦油；告诉小果子，海上的风浪再大，也得多看看星星。\n我累了。这几年的硬撑，耗干了最后一滴油。\n这满院子的喧嚣，\n这热气腾腾的日子，\n真好听。\n把毯子给我盖上。\n我终于可以，安安稳稳睡一觉了。”"

#索拉娜改造线

LHS_Reckoning_Old_Scores:0 "旧账该怎么算"
LHS_Reckoning_Old_Scores_desc:0 "“大字报贴满了首都的墙根，群众的火气越烧越旺。\n他们清算完了旧贵族，现在，眼睛盯上了农场里那个正在挖土的‘前女王’索拉娜。\n有人说，她手上沾着起义工人的血，得拉出来公审；也有人说，她抢了富人的粮仓分给过穷人，算是一半的恩人。\n这笔账，糊涂得很。\n如果捂着盖着，群众心里的疙瘩解不开；如果完全放任，这帮饿红了眼的人能把她撕成碎片。\n派几个老成持重的纠察队员去农场。\n把索拉娜带到广场上，给她搬个条凳。\n让她自己去听听，那些她自以为‘赏了饭吃’的人，心里到底是怎么骂她的。”"

LHS_Smash_The_Hard_Shell:0 "砸碎那层硬壳"
LHS_Smash_The_Hard_Shell_desc:0 "“索拉娜那家伙，骨头比石头还硬。\n就算被老百姓指着鼻子骂，她那股子‘老子天下第一’的劲儿还是没散。\n她心里还端着那副‘我受苦受难是为了你们好’的架子。\n这种毒瘤思想，光靠开大会是骂不醒的。\n得让她知道，什么叫作真正的‘人民的力量’。\n增加批斗的强度，让她去干最苦最累的活儿——去清理下水道，去化粪池挑大粪。\n剥夺她所有的特殊待遇。\n只有当她那层名为‘孤胆英雄’的硬壳被现实的粪水彻底泡软、砸碎了，她才能真正看清自己是个什么东西。”"

LHS_Hand_Before_The_Stick:0 "拦在木棍前的手"
LHS_Hand_Before_The_Stick_desc:0 "“火候差不多了。再烧下去，连锅都要炸了。\n群众的怒火是个好东西，能烧尽旧世界的污垢；但一旦失去理智，它就会变成一头吞噬一切的怪物。\n我看到有些人，眼睛里的光已经变了味，从‘讨回公道’变成了‘欺凌弱者的快感’。\n这可不行。咱们是革命者，不是暴徒。\n带上宪兵队，去把会场围起来。\n告诉大伙儿：‘账算清楚了，气也出了。索拉娜犯了罪，但她现在的身份是咱们公社的劳动者，不是给你们发泄私愤的沙袋。’\n在这个节骨眼上，谁敢再动私刑，我就处分谁。\n保住索拉娜的命，也是保住咱们这群人最后的底线。”"

LHS_Teach_Princess_About_Mud:0 "教公主认识泥巴"
LHS_Teach_Princess_About_Mud_desc:0 "“莉莉安娜那个小丫头，受了不小的惊吓。\n她以前只知道爱和保护，不知道这人世间的恨和怨是怎么回事。\n她觉得群众都是暴徒，觉得咱们不可理喻。\n找几个人，带着她去咱们的矿区看看，去那些被索拉娜旧部烧毁的村子里走走。\n让她亲眼看看，那些扔泥巴的手，是因为常年挖不到煤而变形的；那些骂人的嘴，是因为吃树皮而溃疡的。\n告诉她：‘咱们这儿的人不完美，脾气也臭。但这都是被这世道逼出来的。你想留在人间，就得先认识人间的泥巴。’”"

LHS_Plant_The_Weeds_Back:0 "把野草种回去"
LHS_Plant_The_Weeds_Back_desc:0 "“经过这一场大闹，好多人都明白了点道理。\n群众明白了，发泄私愤不能当饭吃；索拉娜明白了，她那套狼王的规矩，在这片新土地上行不通。\n既然都受了教训，日子就还得接着过。\n给索拉娜和莉莉安娜在城郊的农场分一间小茅屋，发两把锄头。\n让她们去种红薯，去挑水。\n咱们不养闲神，也不养废王。\n只要她们肯低头干活，这红泥公社，就永远有她们的一口热饭。”"

LHS_This_Is_Called_Living:0 "这就叫日子"
LHS_This_Is_Called_Living_desc:0 "“风波平息了。\n有些伤疤留在了人们的心里，也留在了索拉娜的背上。\n但这不全是坏事。\n没有经过火烧的泥巴，捏不成结实的陶罐；没有经历过撕裂的公社，经不起外面的大风大浪。\n咱们用一场近乎残酷的对抗，教会了高高在上的去平视，教会了满怀仇恨的去宽恕，也教会了天真无邪的去沾染泥土。\n虽然这过程难看得要命，虽然大家都弄得灰头土脸。\n但这……就是这片赤土上，最真实的活法。”"


#木棉经济线
LHS_Patch_The_Economic_Leaks:0 "先补锅，再添柴"
LHS_Patch_The_Economic_Leaks_desc:0 "“看着这一堆赤字报表，晓枫急得掉头发，想还要去哪儿借贷。我把她的笔夺了下来。\n咱们现在的家当就像个破锅，底下全是洞——贪污的洞、浪费的洞、物流不通烂在路上的洞。这时候往里倒再多的米也是白搭。\n先别急着起新灶。把修路队派进雨林，把审计员派进仓库。先把路修通，把账算平。\n过日子不是变戏法。锅补好了，攒下的每一粒米才是咱们自己的。”"

LHS_Grid_Over_The_Andes:0 "让大河翻山"
LHS_Grid_Over_The_Andes_desc:0 "“这大山像堵墙，把咱们这块地界劈成了两半。一边是老天爷赏饭吃的矿山，可惜没动力，死气沉沉；另一边是奔腾的大河，电多得没处使，白白流进海里。\n有些会算账的人说，在高山上拉线是赔本买卖，电费还没修路钱多，不如就在矿山边上烧油。\n我说，那是小账。如果咱们只靠烧油开矿，赚的那点钱全填了油费，咱们一辈子就是给别人打工的苦力。\n把线缆背上雪山去！这网拉通了，南边的水就能点亮北边的火。哪怕前期修网多花几倍钱，只要能源的主权握在自己手里，这片金山银山才真正姓‘咱们’。”"

LHS_Tropical_Preservation:0 "锁住我们的夏日"
LHS_Tropical_Preservation_desc:0 "“咱们南美啥都有，就是存不住。香蕉烂在地里，鱼臭在船上。\n以前咱们只能贱卖原材料，去换人家昂贵的罐头。这买卖做得太窝囊。\n建冷库，建罐头厂，建脱水车间。把咱们的热带水果、深海鱼都锁住鲜味。\n让咱们的工人能吃上肉，让咱们的出口货能挺直腰杆。\n别小看这一个个铁皮罐头，那是咱们跟世界讨价还价的本钱。”"


LHS_Standard_Of_The_Red_Clay:0 "自家扳手拧自家螺丝"
LHS_Standard_Of_The_Red_Clay_desc:0 "“以前咱们用的螺丝是圣杯的，扳手是德国的，稍微坏个零件，整条流水线就得趴窝等进口。\n这是被人家卡着脖子过日子。\n晓枫，带着你的技术员，把所有的尺寸都统一下来。咱们要定自己的标准。\n也许它没那么精密，但它得通用，得皮实，得让村口铁匠铺也能敲得出来。\n谁掌握了标准，谁就掌握了工业的命门。”"

LHS_Cotton_And_Dignity:0 "先织衣，再铸剑"
LHS_Cotton_And_Dignity_desc:0 "“有人建议把所有的棉花都出口换外汇。我拒绝了。\n看看咱们的工人，还穿着旧势力留下的破衣裳。一个人如果连件体面的衣服都没有，你指望他能造出精密的仪器？\n把棉花留下来，开纺织厂。让姑娘们穿上花裙子，让小伙子穿上挺括的工装。\n轻工业不是浪费，它是工业化的第一所学校。它能教会农民什么是纪律，什么是协作，什么是工人的尊严。\n先把人‘造’出来，人才能造出机器。”"

LHS_Sugar_Is_Fuel:0 "人是铁，饭是钢"
LHS_Sugar_Is_Fuel_desc:0 "“数据不会撒谎。自从我们强制给工人的午餐里加了糖和肉，事故率下降了三成，废品率下降了一半。\n这世上没有又让马儿跑、又让马儿不吃草的道理。\n加大食品加工业的投入。我要让每一个红泥公社的工人，摄入的热量比对面的圣杯士兵还要高。\n那种吃饱了饭、浑身使不完劲儿的状态，才是咱们生产力爆发的源头。\n这是生物学，也是最硬的经济学。”"

LHS_Clinic_In_Jungle:0 "在蚊虫堆里抢人命"
LHS_Clinic_In_Jungle_desc:0 "“疟疾、黄热病……这些丛林里的鬼东西，每年都要带走咱们多少壮劳力？\n这是一场没有硝烟的战争。\n把制药厂建起来，把奎宁和青霉素的价格打下来。把卫生员派到每一个伐木场和矿点。\n一个健康的工人能为国家工作三十年，一个病倒的工人是家庭的塌天大祸。\n在这个问题上花钱，是咱们这本账上回报率最高的投资。”"

LHS_Schools_Before_Foundries:0 "先磨人，再炼钢"
LHS_Schools_Before_Foundries_desc:0 "“很多干部急着要建大炼钢厂。我问他们：说明书是德文的，图纸是英文的，谁看得懂？\n靠文盲是炼不出特种钢的。\n把建高炉的钱先挪一部分出来，建技校，建夜校，扫盲。\n这过程很慢，很熬人。但如果不做，咱们永远只能给外国佬打下手。\n咱们得沉住气。等咱们培养出第一批能读懂微积分的工人，那就是咱们钢铁工业真正起飞的时候。”"

LHS_Nationalize_The_Veins:0 "把大地攥紧"
LHS_Nationalize_The_Veins_desc:0 "“咱们脚下的铜矿、硝石、稀土，那是地球给南美的礼物，却被殖民者当成了自家的提款机。\n这日子到头了。\n宣布矿产国有化。我知道这会惹恼很多大人物，他们会封锁，会撤资，会撤走专家。\n让他们撤！\n咱们已经攒下了底子，有了自己的技工。哪怕一开始咱们只能用手挖，这矿也是咱们自己的。\n只有把大地的血脉握在自己手里，咱们的腰杆子才算真正硬了起来。”"

LHS_Refining_Not_Selling:0 "卖金子不如卖首饰"
LHS_Refining_Not_Selling_desc:0 "“别再一船船地往外运矿石了，那是卖血。\n把冶炼厂立起来，把化工厂建起来。\n我们要卖精铜，卖合金，卖加工好的橡胶制品。\n这中间的差价，就是咱们公社的未来。\n晓枫，把图纸拿来。咱们要在这个充满鸟叫的雨林里，敲出一套完整的工业体系。这很难，但我相信咱们被糖水喂饱了的小伙子们，有力气干成这事儿。”"

LHS_Oil_Independence:0 "不再看人脸色的油箱"
LHS_Oil_Independence_desc:0 "“咱们的坦克和飞机，不能喝别人的油。一旦被人卡了脖子，那就是一堆废铁。\n别处的油我们要合作开发，咱们自己的页岩油也要试着炼。\n甚至……试试用咱们这儿泛滥的甘蔗做酒精燃料。\n能源独立，是咱们在这个狼群环伺的世界里，说话大声的底气。”"


LHS_The_Shipyard_In_Bay:0 "教铁龙下海"
LHS_The_Shipyard_In_Bay_desc:0 "“小果子说，没有大船，咱们的海岸线就是敞开的大门。\n造船是工业的皇冠，咱们以前不敢想。\n但现在，咱们有了钢，有了电，有了懂数学的工人。\n那就造！\n先造渔船，再造商船，最后造军舰。\n我要让那龙骨在咱们的船坞里合拢。当第一艘挂着红泥旗帜的万吨轮下水的时候，咱们才算真正跨过了那道落后的门槛。”"

LHS_Letters_To_Stars:0 "我们有权仰望星空"
LHS_Letters_To_Stars_desc:0 "“小果子拿着一份天文学观测站的申请书，怯生生地来找我，说以前的专家都骂这是不务正业。\n我直接签了字，拨了款。\n咱们这群人，前半辈子一直低着头在烂泥里找食吃，后来又在互相猜忌的深渊里滚了一圈。\n现在总算站稳了，怎么就不能抬头看看天了？\n哪怕满身泥巴，咱们也有做梦的权利。”"

LHS_Dual_Use_Tractors:0 "闲时耕地，战时披甲"
LHS_Dual_Use_Tractors_desc:0 "“咱们的拖拉机厂，平时生产农机，帮老乡们耕地，让大家吃得更饱。\n但那条流水线是特制的。\n一旦号角吹响，换个模具，挂上装甲，它就能生产坦克和装甲车。\n这就是咱们学到的智慧——寓军于民。\n咱们不养闲置的战争机器，咱们的每一颗螺丝钉，在和平时造福生活，在战时保卫生活。”"


LHS_Market_Of_The_South:0 "南风知暖意"
LHS_Market_Of_The_South_desc:0 "“现在，周围的国家都看着咱们眼红。\n咱们的布好看，咱们的药便宜，咱们的机器皮实耐用。\n把大门打开，建立咱们自己的共同市场。\n用咱们的商品去换他们的资源，用咱们的标准去统一他们的规格。\n咱们不搞掠夺，咱们搞共赢。\n当他们离不开咱们的商品时，比任何驻军都更安全。这也是一种‘围猎’，不过是温柔的。”"

LHS_Wealth_In_People:0 "把钱塞回大伙儿的兜里"
LHS_Wealth_In_People_desc:0 "“国库里有点钱了，有人建议修个金碧辉煌的宫殿。\n我骂了他们一顿。\n把钱发下去！发给退休的工人，发给多生孩子的母亲，发给搞发明的学生。\n国家有钱不算富，老百姓兜里有钱才叫富。\n当咱们的人民手里有了闲钱，他们就会去买更多的东西，工厂就会更忙，税收就会更多。\n这叫活水养鱼。把水蓄在百姓的池子里，咱们永远不愁没鱼吃。”"

LHS_The_Unbreakable_Logistics:0 "心连着心，血融着血"
LHS_The_Unbreakable_Logistics_desc:0 "“咱们的路是修给独轮车走的，也是修给重卡走的。\n咱们的仓库遍布每一个村庄。\n这意味着，就算敌人炸断了咱们的主动脉，咱们还有千万条毛细血管在输血。\n每一个村公所都是补给站，每一个卡车司机都是运输兵。\n这种深入泥土的后勤网，是任何轰炸都切不断的。”"

LHS_When_Kapok_Burns_Red:0 "当木棉烧红了半边天"
LHS_When_Kapok_Burns_Red_desc:0 "“那些傲慢的外国佬曾预言我们会崩溃，说我们把太多的资源浪费在了‘吃喝玩乐’上。\n现在，让他们睁大眼睛看看吧。\n看看这满山的木棉花，那是咱们用好日子浇灌出来的颜色。\n因为吃得饱，咱们的工人力大无穷；因为穿得暖，咱们的士兵在雪线也不退缩；因为有尊严，我们的科学家没日没夜地追赶世界。\n当敌人以为我们沉溺于温柔乡时，我们将向他们展示——\n这由幸福铸造的钢铁，比仇恨铸造的，要坚硬一万倍！”"

LHS_Carnival_Never_Ends:0 "今天不干活啦，放假！"
LHS_Carnival_Never_Ends_desc:0 "“行了，家底厚实了，腰杆硬了。\n今天，全公社放假！\n把仓库打开，把酒拿出来，把灯都点亮。\n不管你是将军还是锅炉工，今天没有身份，只有快乐。\n咱们要用最盛大的狂欢，告诉这个世界：\n我们不仅活下来了，而且活得比谁都漂亮！\n来吧，咱们……给这世界一点小小的、红色的震撼。”"

#木棉军事线
LHS_Machete_And_Rifle:0 "钢铁生于尘土"
LHS_Machete_And_Rifle_desc:0 "“我看晓枫带来的新步枪图纸，精密得像钟表。好是好，但那是给在操场上阅兵用的。\n咱们这儿是雨林，是烂泥塘。枪掉进泥里，捡起来得还能响；藤蔓缠住了，拔出刀得能砍断。\n告诉兵工厂，把枪机的间隙留大点，别怕进沙子。把枪管锯短一截，方便在林子里转身。\n再给每个战士发一把最好的开山刀。子弹打光了，咱们还有铁，还有牙齿。”"

LHS_The_Invisible_Cloak:0 "学着做一截枯木"
LHS_The_Invisible_Cloak_desc:0 "“雪伊训练新兵，总让他们练正步。我把她拉到了林子里。\n我说：‘你看那只豹子，它走路有声音吗？它排队吗？’\n在这片土地上，只有学会消失的人，才能活得长久。\n给战士们发那种染着草汁、挂着布条的伪装网。教他们怎么像树桩一样站着，像蛇一样爬行。\n咱们不跟敌人比谁的阵列整齐，咱们比谁能更晚被看见，然后更早开枪。”"

LHS_Molotov_Cocktail_Party:0 "玻璃瓶里的野火"
LHS_Molotov_Cocktail_Party_desc:0 "“敌人的坦克看起来像铁王八，硬得很。咱们的反坦克炮寥寥无几，战士们看着发愁。\n愁什么？铁王八也是要呼吸的，也是怕烫的。\n把咱们酿的烈酒，掺上橡胶树的生胶，装进玻璃瓶里。\n这玩意儿一旦砸上去，就会像附骨之蛆一样烧个不停，怎么甩都甩不掉。\n虽然土了点，但看着那些铁罐头冒黑烟的样子，这可是咱们特有的‘烟花’。”"

LHS_Ants_Move_Mountain:0 "让群山为我们开路"
LHS_Ants_Move_Mountain_desc:0 "“卡车进不了深山，骡马也怕陡坡。有人说这仗没法打，补给送不上去。\n我说，你们太小看人的肩膀了。\n咱们没有那么多汽车，但咱们有千千万万双脚板，有无数根扁担和独轮车。\n发动群众吧。每个人背一点，每个人推一点。\n就像蚂蚁搬家一样，把炮弹、大米、药品，一点点流淌到前线去。\n这就是我们切不断的血管。”"

LHS_Iron_Plate_On_Trucks:0 "给我们的骡子披上甲"
LHS_Iron_Plate_On_Trucks_desc:0 "“咱们的卡车皮太薄，一梭子子弹过去，车斗里全是血。我看着心疼。\n别管什么载重限制了，把工厂里剩下的钢板，甚至是废旧的锅炉皮，都给我焊上去。\n特别是驾驶室，得焊双层。\n这车跑不快？费油？没关系。\n只要它能把咱们的娃娃，全须全尾地送到前线，哪怕它爬得像乌龟，那也是好车。”"

LHS_Big_Foot_Tank:0 "沼泽里的鳄鱼"
LHS_Big_Foot_Tank_desc:0 "“以前缴获的坦克，一进雨林就趴窝，像陷在泥里的死猪。\n那是鞋太小了，受力面积不够。\n晓枫，让设计师把履带加宽，越宽越好，像鸭蹼一样。\n虽然这样改出来的坦克丑得要命，走起路来晃晃悠悠的。\n但它能从烂泥塘里爬出来开炮，这就够了。\n咱们不需要在公路上飙车，咱们需要的是一头能在沼泽里咬人的鳄鱼。”"

LHS_Mobile_Fortress:0 "会走路的城墙"
LHS_Mobile_Fortress_desc:0 "“咱们钢不够，造不出那么多坦克。但步兵冲锋的时候，总得有个掩护。\n把拖拉机改改，罩上水泥板和沙袋，架上重机枪。\n这玩意儿慢吞吞的，看着笨拙。\n但当它挡在冲锋的战士前面，替他们吃下子弹的时候，它就是最让人安心的移动城墙。\n别嫌它土，能救命的东西，从来不嫌土。”"

LHS_Ventilation_Window:0 "给铁壳子开个透气孔"
LHS_Ventilation_Window_desc:0 "“我坐过一次咱们的坦克，里面热得像蒸笼，全是废气，还没打仗人就先晕了。\n这怎么行？人要是闷坏了，怎么打胜仗？\n在侧装甲上割个通风口，装上最响、劲最大的排风扇。座椅弄软点，把那些尖锐的棱角包起来。\n那些专家说这会降低防护性。我让他们滚去坦克里待一天再说。\n咱们造的是战车，不是烤箱。让小伙子们在里面坐得舒服点，才有精神头去瞄准。”"

LHS_Portable_Thunder:0 "把雷暴背上悬崖"
LHS_Portable_Thunder_desc:0 "“山那么高，炮拉不上去，战士们只能干瞪眼。\n告诉兵工厂，把迫击炮和轻型山炮的图纸改了。\n炮管、底座、轮轴，全给我设计成能快速拆卸的零件。\n卡车上不去的地方，咱们用骡子驮；骡子走不了的地方，咱们战士用肩膀扛。\n咱们像蚂蚁搬家一样，把零件背上悬崖。等天亮的时候，在敌人头顶上给他们拼出一场雷暴来。”"

LHS_Screaming_Pipes:0 "南美的野蜂"
LHS_Screaming_Pipes_desc:0 "“雪伊嫌大炮射速太慢，不够解气。可咱们拉不出合格的膛线，造炮管太慢了。\n那就造火箭炮。这玩意儿简单，甚至可以用无缝钢管焊。\n把几十根管子焊在卡车后斗上，塞进咱们自制的火箭弹。\n这东西打得不准？没关系，咱们不需要打得准，咱们只需要覆盖得广。\n一按电钮，几十发火箭带着撕裂空气的尖啸声砸过去，能把半个山头都犁平。\n那声音就像一群愤怒的野蜂，这可是咱们给那些殖民老爷们准备的‘南美特产’。”"

LHS_Anti_Air_Scythe:0 "镰刀也能割飞鸟"
LHS_Anti_Air_Scythe_desc:0 "“天上的飞机嗡嗡叫，烦人得很。咱们的高射炮少得可怜。\n那就把重机枪架高点，把咱们的牵引车改改，装上四联装的枪管。\n虽然够不着高空的老鹰，但那些敢飞低了吓唬人的麻雀，咱们一打一个准。\n告诉大家，只要手里有家伙，这天上的鸟，也得给咱们让路。\n把这把镰刀竖起来，不仅能割地上的草，也能割天上的云。”"

LHS_Swallow_Tactics:0 "贴着树梢的利爪"
LHS_Swallow_Tactics_desc:0 "“高空轰炸那是富人玩的扔骰子游戏，炸得准不准全看天意。咱们没那么多炸弹可以浪费。\n咱们的飞机，要像雨燕一样，贴着树梢飞。\n给飞机的肚子焊上厚装甲，装上最猛的机炮。\n看到敌人的车队，看到他们的机枪阵地，就俯冲下去，用机炮把树冠和敌人一起剃平！\n咱们的空军，不是用来表演的，它是步兵头顶上那把最锋利、最及时的保护伞。”"

LHS_Mosquito_Fleet:0 "咬一口就跑"
LHS_Mosquito_Fleet_desc:0 "“小果子说，咱们造不出战列舰，跟人家的铁甲舰硬拼是送死。\n那就不拼。咱们拼灵气。\n造那种小快艇，装上鱼雷，装上机炮。平时藏在芦苇荡里，藏在礁石后面。\n等敌人的大船来了，咱们就像蚊子群一样冲出去，咬一口就跑。\n这片水域咱们熟，哪里有暗礁，哪里有漩涡，咱们闭着眼都知道。\n让那些巨舰大炮在咱们的迷魂阵里打转吧，咱们慢慢陪他们玩。”"

LHS_Eyes_In_Clouds:0 "看得清，才能打得准"
LHS_Eyes_In_Clouds_desc:0 "“咱们打仗不能当瞎子。\n把那种飞得慢、但是飞得稳的老式飞机改改，装上照相机，装上无线电。\n让它们整天在天上转悠。\n我不指望它们能打下什么来，我只要它们告诉我：敌人在哪儿？有多少人？在干什么？\n只要看清楚了，这仗就赢了一半。\n这叫‘知己知彼，百战不殆’”"


LHS_Amphibious_Assault:0 "水鬼爬上岸"
LHS_Amphibious_Assault_desc:0 "“小果子那丫头，最近把她的水手们都赶下船，去泥地里练越野。\n她说，咱们这儿河多、海岸线长，只会开船不行，得学会怎么从水里直接跳到岸上咬人。\n给她最好的装备，那种防水的枪，那种能浮起来的背囊。\n让这支两栖部队成为咱们手里的奇兵。\n当敌人以为河水是屏障的时候，咱们要让他们看看，这水里藏着老虎。”"

LHS_Muddy_Water_Flow:0 "聚则为浪，散则为溪"
LHS_Muddy_Water_Flow_desc:0 "“咱们现在有枪、有炮、有车、有船了。但别把它们当成一块块死板的积木。\n要把它们当成水。\n步兵是水流，坦克是浪头，火炮是推着水走的风。让它们混在一起，流动起来。\n别硬顶，要从敌人的缝隙里钻过去，然后把他们淹没。\n晓枫总结了一套新战法，叫‘多兵种协同’。大伙可能听不太懂那些术语，但我知道，这就叫——大家伙儿一块儿上，劲儿往一处使。”"

LHS_Steel_With_Heartbeat:0 "同志们，仗打完了吗？"
LHS_Steel_With_Heartbeat_desc:0 "“这些年，咱们造了这么多大家伙，把好好的拖拉机变成了战车，把水管变成了火箭炮。\n武器越造越狠，但我心里这根弦，却始终不敢松。\n今天我去兵工厂，看到一个年轻女工在给炮弹刻引信。她眼神那么亮，本该是拿去绣花的。\n发个通告吧。告诉所有拿枪的孩子：\n这手里的钢铁之所以沉重，是因为里面装了多少火药吗？是因为它承载了咱们身后那些不能拿枪的人的命。\n咱们把刀磨得这么快，扣扳机扣得这么狠，是为了杀戮的快感吗？\n是为了总有一天，能亲手把这些破铜烂铁全都扔进熔炉里，烧成铁水，铸成拖拉机，铸成游乐场里的旋转木马。\n为了那一天，今天这枪，咱们必须握稳了，打准了。”"

##晓枫政治线
LHS_zhuanyi: "迫降与转移"
LHS_zhuanyi_desc: "战士们需要休整，革命的火种不能熄灭。通知各纵队，放弃原定进攻路线，向王室更难察觉的迷雾深处转移。"
LHS_miwu: "深入迷雾"
LHS_miwu_desc: "为了更好的利用这里的地形，我们必须深入迷雾之中，摸清这里每一片将会成为敌人的坟墓的伏击地点。"
LHS_jielu: "揭露罪行"
LHS_jielu_desc: "营地外，战士们都在低声讨论着这惊人的发现，沉闷的气氛被愤怒所取代。"
LHS_qingyuan: "请愿？不，是审判！"
LHS_qingyuan_desc: "那些跪在王座前的蛆虫，把人民的血肉喂给了腐烂的亡灵！\n不需要再递陈情书了…\n用子弹和火把，告诉那些贵族，该上绞架的是她们！"
LHS_houqing: "保障后勤"
LHS_houqing_desc: "后勤同志，哪怕只有土豆和粗粮，也要保证战士们能吃上热饭。"
LHS_qiyi: "在饥肠辘辘的寒夜中"
LHS_qiyi_desc: "在伪王统治下挨饿受冻的兄弟姐妹们！\n今晚你们锅里只有稀汤冷水了吗？抬头看看王宫彻夜不息的灯光吧！那里面正用着我们种出的麦子、养出的牛羊，大摆宴席！\n这还不够！在你们看不见的角落，那些戴着金冠的“贵人”们，正把你们，莉兰迪亚的子民，当作饲料，塞给沼泽另一头爬出来的、散发着尸臭的魔物！"
LHS_zhengzhuang: "整装待发"
LHS_zhengzhuang_desc: "我们必须比它们更了解它们自己。积蓄力量，静待号角。"
LHS_chetui: "紧急撤退"
LHS_chetui_desc: "王室的亡灵军队无论是在数量上还是质量上都是我们的几倍有余，绝对不能硬上，我们必须向南边紧急撤退！"
LHS_shangu: "在遗弃的山谷中"
LHS_shangu_desc: "我们是撤退了，村子里的人呢？"
LHS_fanxiang: "反向阻击"
LHS_fanxiang_desc: "雪伊制造的爆炸为我们创造了千载难逢的战机，就是现在，钉死那帮亡灵！"
LHS_jiliu: "在奔腾的激流中"
LHS_jiliu_desc: "管它什么亡灵，必将被我们冲散击溃。"
LHS_zonggong: "燎原总攻"
LHS_zonggong_desc: "以血洗沙！砸碎王冠，焚尽骸骨！"
LHS_xiaofengshengli: "直到那一天到来"
LHS_xiaofengshengli_desc: "“等我们胜利的那一天，等我们的红旗插遍王宫的每一个角落，我们该怎么庆祝？开宴会？分战利品？不。我跟你们说，我们要做的第一件事，就是把缴获的所有粮食和药品，都送到人民的手里，送到那些在战争里受尽苦难的、最普通的百姓家里。我们要先敬这片土地上的人民，是她们养育了我们，支持了我们。等她们都吃饱了、穿暖了、脸上都有了笑容，我们再回来，坐在一起，为我们自己，为所有活下来的和牺牲的同志们，好好地喝上一杯！记住，人民，永远在咱们前头。”"
LHS_whyq: "往后的一切"
LHS_whyq_desc: "“忘了那些贵族老爷们的家谱和头衔吧。我们是谁？我们是矿工的儿子，是农夫的女儿，是被遗忘在贫民窟里的无名之辈。我们拿起枪，不是为了让自己成为新的将军或领主，而是因为我们身后，有千千万万和我们一样没有名字的、被压迫的同胞。我们的刀，只为她们而挥。当革命成功的那天，我们的名字，就是‘人民’。”"
LHS_jqsc: "加强物资审查"
LHS_jqsc_desc: "“仓库，\n封存的那批军用罐头，少了两百箱。\n登记是‘战场耗损’。\n耗损在哪个战场？耗进谁家地窖了？\n前线战士啃着硬饼，你跟我谈耗损？\n耗损的不是罐头，耗损的是你的良心！\n明天天亮前，两百箱罐头，一颗不少给我吐出来！”"
LHS_fpzf: "重新分配住房"
LHS_fpzf_desc: "同志们，我们的革命，不仅仅是为了推翻战壕另一头的敌人，更是为了推倒那些将人们隔绝在阴暗与潮湿里的、无形的墙。\n我们曾见过那些贫民窟，那里的孩子，从未见过完整的阳光。现在，那些压迫者留下的、空荡荡的宫殿，它们的每一扇窗户，都应该朝向一个充满希望的家庭。\n我们分配的，不是冰冷的砖瓦，而是每一个孩子能在温暖灯光下读书的权利，是每一个家庭能在没有漏雨的屋檐下安然入睡的尊严。一个家，是新世界的第一块基石。"
LHS_nmwl: "南美的未来"
LHS_nmwl_desc: "妖精..亡灵...南美的未来该走向何方？"
LHS_kbzl: "看那可悲的殖民者"
LHS_kbzl_desc: "所谓殖民者，归根结底是可悲的，\n她们唯一能做到的只有在别人的土地上掠夺，\n她们的未来注定是黑暗的，\n因为她们永远无法拥有自己的家园。"
LHS_klsn: "瞧这可怜的魔法少女"
LHS_klsn_desc: "她们曾是光辉的象征，\n如今却沦为他人的工具。\n在这场斗争中，她们失去了自我，\n只剩下无尽的悲伤与绝望。"
LHS_cgc: "尘归尘，土归土"
LHS_cgc_desc: "“看着它们，同志们。请不要仅仅把它们当作怪物，也不要让恐惧占据了你们的心。仔细看看……它们其实很累了。那些原本应该在泥土里安睡的骨头，那些原本应该化作春泥滋养花朵的血肉，却被索拉娜那贪婪的野心，强行从温暖的大地怀抱里拽了出来。她把枷锁套在了死者的脖子上，逼迫它们在寒风中进行这场永无止境的行军。这对生者是残忍的，对死者……更是莫大的亵渎。所以，举起你们的枪吧。不要带着仇恨，而是带着一种不得不为之的慈悲。我们要把这份本不该属于人间喧嚣的宁静，还给它们。让疲惫的旅人停下脚步，让流浪的骸骨回归大地。睡吧……这一次，再也没有人能吵醒你们了。”"
LHS_gmdl: "§R昨日悲歌昨日死，\n今朝血色染战旗。§!"
LHS_gmdl_desc: "我们失去了太多同志，多到我们不敢去回忆每一个人的脸。悲伤的歌，我们昨天唱过了，也就够了。我们不能沉溺在悲伤里，因为战斗还在继续。牺牲同志们的血，没有白流。你看，它已经染在了我们的旗帜上，成为了我们前进的力量。我们每向前一步，都是带着她们未竟的意志。\n所以，一起走吧，一起去拯救所有还处于深渊之中的无辜人民们。\n一起，让野火燃遍整个南美！！！"
LHS_yjst: "游击渗透"
LHS_yjst_desc: "我们不必在正面战场上与她们的钢铁壁垒硬碰。我们的脚步，将像风一样，穿过她们自以为固若金汤的防线；我们的身影，将像影子一样，融入她们灯火通明的城市与乡村。\n我们要让每一个压迫者，在享受晚宴时，都能听到窗外远处传来的、我们战士的歌声。\n我们要让她们明白，这片土地，没有一寸是安全的。人民的怒火，无处不在。"
LHS_yjzz: "敌后游击作战"
LHS_yjzz_desc: "敌人以为战争只发生在地图上被标记出的前线。但我们要告诉她们，在这片土地上，每一片丛林，每一条河流，每一座村庄，都是我们的战场。\n我们将化整为零，成为她们无法捕捉的影子。在她们意想不到的时间，从她们意想不到的地点发起攻击。\n我们的目标不是摧毁她们的军队，而是摧毁她们的意志。让她们在无尽的骚扰与恐惧中，意识到自己才是真正的入侵者，而我们，是这片土地永不屈服的灵魂。"
LHS_gkqy: "港口起义"
LHS_gkqy_desc: "我们的游击作战已经取得了初步的胜利，在[PGM.GetName]的殖民老爷们已经被我们吓破了胆，\n现在，我们要趁机召集当地的人民，彻底将压迫同志们的殖民者驱逐出境。"
LHS_stzy: "艾尔孚利登之约"
LHS_stzy_desc: "情报员带回了她们的消息，还带来了一面她们亲手缝制的旗帜——银色的星辰与弯月，绣在深蓝色的夜幕之上。她们说，这代表着她们在最漫长的黑夜里，也从未放弃仰望星空。\n现在，这些曾经被视为奴隶的人民，已经拿起了武器，成为了为自己尊严而战的战士。她们的歌声，跨越山海，与我们的战歌遥相呼喊。\n那么，就让我们回应她们的呼唤吧。这不仅是军事上的联合，更是一个约定——一个在艾尔孚利登之下，两支在黑夜里并肩前行的队伍，共同走向同一个黎明的约定。"
LHS_qsjz: "清算旧账"
LHS_qsjz_desc: "在完成了整个南美的解放之后，我们的革命势力得到了前所未有的强大，因此，是时候让还在我们土地上撒野的殖民者们回家了。"
LHS_gmwy: "革命委员会"
LHS_gmwy_desc: "群众不光是革命的主体，还是革命的领导者。我们要建立一个真正代表人民利益的革命委员会，让广大群众都能参与到革命中来。"
LHS_gmwy2: "革命委员会"
LHS_gmwy2_desc: "群众不光是革命的主体，还是革命的领导者。我们要建立一个真正代表人民利益的革命委员会，让广大群众都能参与到革命中来。"
LHS_gmwy3: "革命委员会"
LHS_gmwy3_desc: "群众不光是革命的主体，还是革命的领导者。我们要建立一个真正代表人民利益的革命委员会，让广大群众都能参与到革命中来。"
LHS_gmwy4: "革命委员会"
LHS_gmwy4_desc: "群众不光是革命的主体，还是革命的领导者。我们要建立一个真正代表人民利益的革命委员会，让广大群众都能参与到革命中来。"
LHS_fxyl: "废墟上的摇篮"
LHS_fxyl_desc: "那些曾属于亡灵与妖精的土地在经历了无数次的战火摧残后，\n已然变成了一片废墟。\n但在这片废墟上,我们要建立起新的家园，\n让其成为真正属于人民的乐土。"
LHS_dqzq: "到群众中去"
LHS_dqzq_desc: "我们为了一个不再有战争的世界，却必须拿起武器，去打一场最残酷的战争。我们拿起这冰冷如雪的刺刀，让自己的双手沾满血污，归根结底，就是为了能亲手缔造一个让我们的后代，再也用不着拿起刀枪的未来。\n我们的战斗，就是为了终结一切战斗。如果我们的牺牲，能换来一个孩子们只需要在博物馆里才能看到‘枪’这个字的世界。\n那么，我们手中这三尺锋刃，\n便重于千钧，\n也亮于星辰。”"
LHS_gmyy: "革命的意义"
LHS_gmyy_desc: "同志们，我们终于把王室的旗帜从那高高的旗杆上扯了下来。但我要问，这之后呢？革命的意义，不在于我们占领了多少宫殿，而在于是否有人能住进不再漏雨的屋子；不在于我们缴获了多少黄金，而在于孩子的午餐里是否多了一块烤土豆。旧的秩序打碎了，新的秩序绝不能是在办公室里用图纸画出来的。它必须，也只能，从田埂上、车间里、教室中，一点一点地长出来。"
LHS_dtzwh: "大字报与委员会"
LHS_dtzwh_desc: "我听说有些同志开始抱怨文件审批流程太慢。很好嘛！这说明我们的革命还没有僵化！为什么一个农具改良的申请要盖好几个章？为什么一个村子的灌溉问题要开好几个星期的会？把木板和炭笔发下去！让工厂的墙壁、村公所的门口都成为我们的会议室。谁的决策好，谁的提议蠢，让所有路过的人都能看到、都能评判。我们不需要那些藏在文件柜里的秘密，我们要的是晒在太阳底下的透明。"
LHS_gbxd: "干部下地"
LHS_gbxd_desc: "最近总有些同志穿着崭新的制服，在办公室里研究地图，告诉我哪个地区的生产指标“理论上”可以翻倍。理论？让她们自己去田里扶着犁走上一天，看看理论能不能填饱肚子！从今天起，所有委员会的干部，每个月必须有不少于一周的时间，脱下制服，到工厂拧螺丝，到田里收麦子，到医院帮护士换绷带。这不是惩罚，这是提醒——提醒我们，我们的权力来自哪里，我们的双脚应该站在哪片土地上。哦对了，我听说雪伊同志已经报名去学开收割机了？很好嘛！让她知道，方向盘可比指挥棒要重得多！"
LHS_gmsp: "革命诗篇"
LHS_gmsp_desc: "谁说革命只有枪炮和口号？那些在战斗间隙为牺牲的战友谱写歌曲的士兵，那些在工厂墙壁上用煤块画出丰收景象的工人，那些在扫盲班里第一次写下自己名字时眼含热泪的母亲——她们，都是我们革命的诗人。我们要鼓励她们！我们要让每一个村庄都有自己的剧团，让每一座工厂都有自己的乐队。我们的革命不应只被记录在冰冷的历史档案里，它应该被传唱、被描绘、被起舞。这才是鲜活的，属于人民的文化。"
LHS_ghwy: "篝火旁的大会"
LHS_ghwy_desc: "同志们，我见过太多革命在坐进气派的办公室后，就忘记了泥土的味道。当文件堆得比弹药箱还高，当同志的称呼变成了冰冷的头衔，那革命的火焰也就快熄灭了。我提议，我们最重要的会议，不应该在铺着地毯的会议室里开，而应该在工厂的车间里、在刚收割完的田垄上、在每一个临时搭建的野战医院旁，围着篝火开！让工人的机油味、农民的汗水味、伤员的药水味，成为我们每一项决议的背景音。我们的规章，要能让识字不多的老农听懂；我们的计划，要能被每一个握着扳手和锄头的同志所理解和质询。革命的权力，必须永远沐浴在人民的目光和体温之中，否则，它就会变得比王室的权杖更加冰冷。"
LHS_fxwb: "莫愁青史留名姓"
LHS_fxwb_desc: "“打仗嘛，总有人要牺牲，总有人会被忘记。我倒觉得，咱们自己的名字，就别费那个劲儿往历史上刻了。咱们闹革命，打了半辈子仗，流了那么多血，图个啥？不就是为了让大伙儿都能安安稳稳地过日子，让孩子们能吃饱饭吗？等哪天，我看到咱们的田里，稻穗沉甸甸地弯下了腰，比所有人的腰都弯得低，那比把我的名字刻在金子做的纪念碑上，都让我高兴。”"
LHS_sghx: "莫愁前路无知己"
LHS_sghx_desc: "“我们刚开始闹革命的时候，人少得可怜，感觉全世界都是我们的敌人，孤单得不行。后来我们才慢慢明白，这压根就不是我们几个人的事。只要这世界上还有一个地方有人在受苦，还有一个工厂里有工人在挨饿，那她们就是我们的同志，就是我们的亲人，哪怕我们隔着千山万水，说着不一样的语言。所以啊，别怕，咱们这条路，看着难走，其实一点儿也不孤单。你往前看，路上全是咱们的兄弟姐妹，她们都在等着我们呢。”"
LHS_mtzh: "为明天种下一朵花"
LHS_mtzh_desc: "“打仗，总会死人的。我知道，大家看到战友倒下，心里都难受。可我们得想明白，我们为啥要死？不是为了让自己的名字刻在冰冷的墓碑上。我们的牺牲就像秋天的落叶一样，不是毫无意义的消亡。我们会腐烂，会化进这片我们深爱着的土地里，变成最肥沃的春泥。然后，在这片土地上，就会开出我们从未见过的、最鲜艳、最自由的花朵。我们的孩子，就能生活在那样的花海里。这么一想，死，又有什么好怕的呢？”"
LHS_mtzh2: "为明天种下一朵花"
LHS_mtzh2_desc: "“打仗，总会死人的。我知道，大家看到战友倒下，心里都难受。可我们得想明白，我们为啥要死？不是为了让自己的名字刻在冰冷的墓碑上。我们的牺牲，就像秋天的落叶一样，不是毫无意义的消亡。我们会腐烂，会化进这片我们深爱着的土地里，变成最肥沃的春泥。然后，在这片土地上，就会开出我们从未见过的、最鲜艳、最自由的花朵。我们的孩子，就能生活在那样的花海里。这么一想，死，又有什么好怕的呢？”"
LHS_hspg: "红色的蒲公英"
LHS_hspg_desc: "“我希望，我们的孩子，还有孩子的孩子，她们能在一个清晨醒来，听到的不是炮声，而是鸟叫；她们能自由地在田野里奔跑，而不是在废墟里躲藏；她们甚至可以…可以什么都不用想，就只是懒洋洋地晒半天太阳。\n我们现在吃的所有苦，背负的所有重担，就是为了能换来她们那半天的、无忧无虑的安宁。哪怕只有半天，也值得我们付出一生。”"
LHS_dpx: "地平线，而非终点"
LHS_dpx_desc: "我亲爱的同志们，革命最危险的时刻，不是在枪林弹雨中，而是在我们宣布“胜利”，并认为一切已经尘埃落定的时候。那意味着停滞，意味着新的围墙正在悄然筑起。不！我们奋斗至今，不是为了建立一个完美的、一成不变的天堂，而是为了赢得一种权利——一种人民可以永远质疑、永远参与、永远去创造一个更好明天的权利！革命不是一座需要抵达的丰碑，而是一条永远在我们脚下延伸的地平线。我们永远在路上，永远在探索，永远在向着更远方的、更光明的地平线前进。这，才是我们革命永不褪色的浪漫，也是我们绝不会背叛人民的承诺。"
LHS_dpxtt: "§G解锁当前选择的§!§Y陆军学说§!§G下的所有§!§R互斥§!§G分支。§!"
#晓枫外交线
LHS_wmbf: "§Y风中传来我们的歌谣§!"
LHS_wmbf_desc: "我们的歌，不应只回荡在莉兰迪亚的山谷。这世上还有无数角落，风中裹挟着镣铐的哀鸣与抗争的低语。我们应侧耳倾听，然后唱出我们的回答。我们将派出手中的笔和吉他，去记录、去交流、去分享。我们带去的并非命令，而是一颗火种，一篇乐章，一个关于人民如何站起来决定自己命运的故事。"
LHS_bfbg: "同志，你还好吗？"
LHS_bfbg_desc: "我们的胜利，不应是故事的终章。当我摊开这片大陆的地图，我看到的不是国境线，而是被群山与河流分割的、无数仍在叹息的灵魂。北方的风吹过那些陌生的城市与原野，它带来的，是同志的战歌，是暴君的铁蹄声，还是在虚假繁荣中迷失的彷徨？我们必须去倾听，去理解，在将我们的火把递过去之前，先看清她们那里的黑夜，究竟有多深沉。"
LHS_tznh: "同志，你那里暖和吗？"
LHS_tznh_desc: "我们听到了，在遥远的山脉回响中，有着与我们同样的歌声。她们点燃了属于自己的篝火，尽管微弱，却同样倔强地在寒夜中燃烧。我们不应是彼此孤立的光点，而应汇成燎原的烈焰。我们将派出满载着种子、药品与革命理论的船队，不是去指导，而是去分享。让我们把手握在一起，让两簇火焰的热量彼此交融，共同迎接一个真正属于人民的黎明。"
LHS_mbtm: "自由的歌，为何如此悲伤？"
LHS_mbtm_desc: "她们的土地上传唱着自由的歌谣，但人民的脸上却挂着无形的锁链。那些藏在选票和金钱背后的主人，让自由变成了最动听的谎言。我们不必与她们的人民为敌，她们同样渴望着真正的解放。我们要做的，是让我们的歌声飘过她们的窗台，让她们听见，除了悲伤的自由，还有一种属于所有人的、欢畅的旋律。"
LHS_txag: "铁靴之下，岂能尽是哀歌？"
LHS_txag_desc: "在一些地方，人民的歌声被法西斯的军靴碾碎在泥土里，她们的旗帜被撕裂，她们的脊梁被打断。我们不能对此视而不见。我们的坦克与枪炮，将越过国境，但我们的目标不是土地，而是那些套在人民脖子上的锁链。我们将告诉那里的暴君，革命的火焰一旦燃起，就绝不会因为一道国境线而熄灭。我们将与那里的反抗者并肩作战，直到自由的歌声重新在那片土地上空回响。"
LHS_lmhc: "在黎明中合唱"
LHS_lmhc_desc: "我们听到了同一首歌。旧的界碑已在革命的洪流中化为尘土，新的旗帜将在同一阵风中飘扬。不再有莉兰迪亚人、瓦尔哈拉人或是其他，我们只有一个名字——美洲人民。我们将共同建设，共同劳动，共同将红旗插遍世界上的每一个角落。这是我们对所有牺牲者的承诺，也是我们赠予未来所有孩子的礼物。"

LHS_gldg: "我听到了，那首古老的歌"
LHS_gldg_desc: "“雪伊，你来听这张唱片。是一个途经我们港口的老水手留下来的，她说这是从一片饱受战火蹂躏的古老土地上，冒死带出来的。没有华丽的配器，只有一个沙哑的嗓音，唱着‘起来，不愿做奴隶的人们’……那歌声里有长城的风沙，有黄河的波涛，更有一种我们无比熟悉的、宁愿站着死也绝不跪着生的倔强。我仿佛看见，在另一片大陆上，一位同样伟大的革命者，正带领着她的人民，用血肉筑成新的长城。我们必须找到她们，告诉她们，这首歌，我们在南美也听见了。”"

LHS_cxgc: "你们的草鞋，还够穿吗？"
LHS_cxgc_desc: "“她们的回信，藏在茶叶罐的夹层里，字迹是用稀释的墨水写的，纸是劣质的草纸。信里没有提一句苦，只说她们的战士穿着草鞋，在冰天雪地里追击着装备精良的侵略者；她们的‘兵工厂’，是在山洞里用土法冶炼，叮叮当当地敲打着每一颗珍贵的子弹。这让我想起了我们……想起了在卡卡罗姆分食一颗土豆的日子。不，她们比我们更难。历史的遗憾，不应由后来者全部背负。我们必须行动起来，至少，要让她们的战士在冲锋时，脚下能有一双结实的军靴。”"

LHS_xcz: "这本小册子，也请你读一读"
LHS_xcz_desc: "“我们送去了物资，而她们寄回来的，是她们最宝贵的财富——思想。这些薄薄的小册子，没有深奥的理论，记录的却是她们如何在最贫瘠的土地上，教会农民识字；如何组织妇女们，一边纺纱一边学习新思想；如何将古老的民间艺术，变成唤醒大众最有力的武器。她们的领袖，那位伟大的无产阶级革命家与战略家，将革命的真理，巧妙地融进了人民最朴素的生活里。雪伊，这才是真正的人民战争。她们在教我们，如何让革命的火焰，不仅燃烧在战场，更能温暖每一个家庭的灶台。”"
LHS_bkb: "将我们的后背交给彼此"
LHS_bkb_desc: "“从今天起，我们的血，将流在同一片焦土之上；我们的呼吸，将交织在同一个战壕之中；我们的旗帜，将倒映在彼此的眼眸里。我们不再是遥远大陆上的两支孤军，我们是一个拳头的两根指骨，是同一道洪流的两股巨浪。我们将共同面对这个世界上最残暴的敌人，我们将把后背完全交给彼此，直至将法西斯的黑日，彻底从地平线上抹去！”"
LHS_tysq: "看，太阳升起在同一片天空"
LHS_tysq_desc: "当那面熟悉的、染着我们共同信仰的红旗，终于插上古老城墙时，整个莉兰迪亚都沸腾了。雪伊拉着我在广场上，看着我们的人民与那些东方面孔的使节相拥而泣。那一刻，我分不清哪是我们的胜利，哪是她们的胜利。或许，从来就没有“我们”和“她们”。我们只是在世界的不同角落，为了同一个日出而战。那些曾经的遗憾、那些倒在黎明前的牺牲，都化作了此刻的满天朝霞。看啊，同志，太阳升起来了，照亮的，是属于我们所有人的、一个崭新的世界。"

LHS_sjkq: "可世界还在哭泣"
LHS_sjkq_desc: "我们胜利了，但我们的庆典上，为何总回荡着远方的哭声？我听见，在白骨堆砌的王座下，有无数灵魂在无声哀嚎；我看见，在褪色的狮子旗下，有亿万同胞被奴役的锁链紧紧捆绑；我望见，在法西斯的铁靴下，有数不尽的人民在哭泣。我们脚下的和平，是建立在一座即将喷发的火山之上的。同志们，擦干脸上的泪水和血污吧。这不是结束，这只是另一场更宏大战争的序幕。我们的战场，是整个世界。"

LHS_sishen: "刺破长夜"
LHS_sishen_desc: "“不要用‘国家’或‘君主’来称呼它。那是一个以死亡为外交、以绝望为秩序、以奴役整个世界生灵为最终目标的终极黑暗。它的王座由哀嚎的骸骨铸成，它的臣民是没有灵魂的傀儡。与它的战争，并非为了土地或资源，而是为了‘活着’这个最基本的权利。我们，以及这个世界上所有尚存的生灵，都已无路可退。今天，我们必须成为那把刺穿永恒黑夜的唯一利剑。”"

LHS_zmtz: "同志！请不要灰心"
LHS_zmtz_desc: "“在我们刚刚结束的联合参谋会议上，润芝同志带来了一个令人心碎的消息——我们共同的北方同志，那个最早将红旗插遍冰原的伟大联盟，可能已经在‘黑日’的阴影下彻底熄灭了，或是正在进行着一场毫无希望的抵抗。\n会议室里一片死寂。我看见那些久经沙场的东方同志们，眼眶都红了。我们能理解那份痛楚，因为我们也曾站在绝望的悬崖边缘。\n但我们决不相信，那片曾经诞生了十月革命的土地，会就此沉寂！润芝同志说得对，只要还有一寸土地没有被亡灵玷污，只要还有一个红星徽章没有被腐蚀，那革命的炉火就并未熄灭！\n现在，不再是我们单方面的寻找。我们将与东方同志一起，派出我们最精锐的联合特遣队，向着那片冰封的废墟前进。我们必须去找到她们。即便是废墟，我们也要并肩从里面刨出幸存的火种！”"

LHS_wmdz: "同志！我们都还在"
LHS_wmdz_desc: "“她们还在！\n在我们刚刚结束的联合参谋会议上，润芝同志带来了一个……足以让所有人心跳都为之停滞的、振奋人心的消息——我们共同的北方同志，那个最早将红旗插遍冰原的伟大联盟，她们还在！她们顶住了‘黑日’最疯狂的进攻，像一块顽强的、烧红的烙铁，死死地钉在那片冰封的废墟之上！\n会议室里，瞬间爆发出了我们从未有过的欢呼声。我看见那些久经沙场的东方同志们，激动得拥抱在了一起。我们能理解那份喜悦，因为我们也曾品尝过在绝望中看到第一缕曙光的滋味。\n现在，不再是遥远的守望了。润芝同志的提议，得到了我们所有人的赞同。我们将与东方同志一起，派出我们最盛大的联合使团，带着我们最好的药品、最充足的物资、和我们最坚定的支持，向着那座饱经战火的红色堡垒前进。\n我们要去告诉她们，她们的战斗，从来都未曾孤单。我们要让全世界的敌人，都听见这来自世界两端的、汇合在一起的、革命的回响！”"

LHS_sztc: "亡灵已灭，狮子该退场了"
LHS_sztc_desc: "“我们战胜了死神，但世界的伤口仍在流血。那头象征着贪婪与殖民的衰老雄狮，还在舔舐着亚非大陆的血肉。或许它曾在对抗亡灵时与我们并肩，但这并不能洗刷它几个世纪以来的罪恶。现在，是时候让这些旧时代的帝国，将它们从全世界掠夺的一切，连本带利地还回来了。革命的交响乐，不能在清除一个暴君后，就容忍另一个压迫者的存在。”"
LHS_warjiefang: "§t这意味着我们将打响最终的世界革命战争。§!"
LHS_warjap: "§t我们将向§Y([JAP.GetNameWithFlag])§!宣战。§!"
LHS_gsjw: "那么，故事讲完了吗？"
LHS_gsjw_desc: "“当最后一支枪被小心翼翼地放进博物馆，当我们的孩子再也听不见炮火的轰鸣，我们很容易会以为，故事已经讲到了结局。\n不，同志们。\n我们浴血奋战，走过漫漫长夜，并非为了抵达一个终点，而是为了赢得一个崭新的、无限可能的起点。我们推翻了旧世界，仅仅是为了一块干净的、能让我们自由书写的画板。\n我们的敌人，不再是拿着武器的暴君，而是宇宙的未知，是疾病的困扰，是创造力枯竭的荒原。我们的战斗，将从战壕转向实验室，从堡垒转向课堂，从指挥部转向每一个能够迸发思想火花的角落。\n让我们的孩子，不仅拥有面包，更拥有去探索星辰的梦想。\n这，才是我们故事，真正伟大的开篇。”"
LHS_kaiduan: "\n\n§O我们正共同迈向一个崭新的未来...§!"
LHS_yhkp: "永恒的开篇"
##禾果政治线
LHS_zhutuo: "最后的嘱托"
LHS_zhutuo_desc: "“……活下去。”\n这是雪伊姐留下的最后一句话。那份揉皱的文件，还带着她手心的温度和血的铁锈味。海风好冷，吹在脸上，像刀子一样。我不是什么小果子了，我是禾果。是“野火”的残部，是这片破碎黎明下，唯一还握着火炬的人。我答应过她们，要替她们……看到真正的日出。所以，哭也哭过了，怕也怕过了，现在，该站起来了。"

LHS_wmzb: "无名的石碑"
LHS_wmzb_desc: "在这座岛屿的最南端，我找到了一片能望见大陆的悬崖。我没有刻上晓枫姐和雪伊姐，亦或是所有牺牲的同志们的名字。因为她们说过，真正的纪念，并非是记住某一个英雄，而是不忘记所有为之牺牲的人。我用礁石堆起了一座小小的、没有任何标记的石堆。每当海雾升起时，我就觉得，她们正坐在石堆上，和我一起，静静地看着远方那片被黑暗笼罩的故土。"

LHS_sjjt: "来自世界尽头的呼唤"
LHS_sjjt_desc: "今天，一只信鸽……不，是一只绑着油布小包的海鸥，落在了我的窗台。是奇迹吗？油布包里，是一张破旧的海图，上面用熟悉的暗号，标记了几个零散的红点，散布在南美南端的各个小岛和港口。是她们……是野火被打散的其他同志！我们没有全军覆没！我对着海图，用无线电发出了有生以来最长的一段讯息：“……这里是..是小果子，听到请回答。我们，还在。”"

LHS_fshc: "风声中的合唱"
LHS_fshc_desc: "回应，像雨后的春笋，从各个意想不到的角落冒了出来。有躲在渔村里的老兵，有潜伏在码头的工会成员……甚至，还有几个当年和我们一起并肩作战过的、军团里的老伙计。我们用约定好的暗语，在深夜的短波频道里，交换着情报。虽然看不见彼此，但听着收音机里传来的、熟悉的口音和黑话，感觉就像回到了当年围着篝火夜谈的时候。真好,我们不再是孤零零的了。"

LHS_yljd: "幽灵舰队计划"
LHS_yljd_desc: "我翻出了当年在佣兵队里学到的所有本事。我们不能硬碰硬，但亡灵的弱点也很明显——它们不懂得海洋。它们或许能腐化陆地，但无法诅咒每一寸变幻莫测的洋流。我的计划很简单：我们将成为这片海域的幽灵。利用废弃的渔船、走私犯的快艇，组建一支打了就跑的幽灵舰队。我们将是她们补给线上的噩梦，是她们海岸线上永不消散的迷雾。"

LHS_yljd2: "幽灵舰队计划"
LHS_yljd2_desc: "我翻出了当年在佣兵队里学到的所有本事。我们不能硬碰硬，但亡灵的弱点也很明显——它们不懂得海洋。它们或许能腐化陆地，但无法诅咒每一寸变幻莫测的洋流。我的计划很简单：我们将成为这片海域的幽灵。利用废弃的渔船、走私犯的快艇，组建一支打了就跑的幽灵舰队。我们将是她们补给线上的噩梦，是她们海岸线上永不消散的迷雾。"

LHS_dywh: "第一次问候"
LHS_dywh_desc: "我研究了王室的海运日志，她们每周都会有一支船队，把从各地搜刮来的物资，从莉兰迪亚南部的白城的港口运到她们在大陆的主力军港。这条航线，就是她们的喉咙。而我的舰队，要做扼住这喉咙的手指。我们像一群真正的海盗，在暴风雨的掩护下，撕开了她们薄弱的护航。我们没有击沉她们，只是抢走了所有货物，并在她们的船身上，用红色的油漆，重新画上了野火的标志。我要让索拉娜知道，我们回来了。"

LHS_bcxh: "当我们回到白城"
LHS_bcxh_desc: "行动成功了！我们的问候，像一颗投入死水的石子，激起了意想不到的涟漪！我们收到了来自白城地下的、断断续续的回应！是公社的旧部，是那些幸存下来的、不愿屈服的人民！她们通过我们留在运输船上的秘密频道，联系上了我们。她们说，我们的行动让城里的人们第一次知道，在黑暗之外，还有同志在战斗。星星之火，正在那座被恐怖笼罩的城市里，重新燃起。夺回白城，似乎不再是一个遥不可及的梦了。"

LHS_jqol: "惊起一滩鸥鹭"
LHS_jqol_desc: "“她们都在问我，为什么要那么早就暴露自己，为什么要在一片漆黑的湖面上，主动扔下一块石头。因为……我们需要涟漪。\n湖面太静了，静得像一潭死水。内陆的同志们以为她们是最后的幸存者，绝望地蜷缩在黑暗里。而湖底的怪物——索拉娜，则傲慢地以为她已经掌控了一切。\n我扔下的这块石头，抢走的这船货物，画上的这片野火，就是要惊动她，就是要让她愤怒，让她把目光从内陆移开，调动她最精锐的爪牙，来扑向我们这只小小的‘海盗’。当她的注意力全在海上时，内陆的压力就会出现一丝裂缝。而那一丝裂缝，就是我们所有同志，唯一的机会。\n晓枫姐教过我，有时候，最响亮的声音，是说给最远的人听的。”"

LHS_bcxz: "让她们变成瞎子"
LHS_bcxz_desc: "“我错了。\n我不该……不该妄想能把她们安全地带出那片地狱。希望，不是用船能运出来的。是需要用刀，从怪物的骨头缝里，一点点剜出来的。\n我们的舰队不再是诺亚方舟。从现在起，它们是手术刀。我们要精准、冷酷地，切断她们沿海所有的通讯塔、补给站和指挥哨所。我们要切断她们的眼睛，割掉她们的耳朵。\n只有当敌人变成了聋子和瞎子，内陆的同志们，才有可能……在我下一次犯错前，活得久一点。”"

LHS_drtm: "点燃她们"
LHS_drtm_desc: "“我们……联系上了内陆的同志们。她们是火种，是的，是火种。\n但火种，不应该只在黑暗里默默地燃烧，等待着被扑灭。它的光太微弱了。\n我要她们……主动发光。在敌人最意想不到的地方，制造骚乱，点燃爆炸，成为最耀眼的信号。即使那光芒，只能闪烁一瞬。\n敌人的大军会被这些光吸引，会被调动，会被拖入泥潭，疲于奔命。而我，就能在她们暴露出的巨大空隙里，找到那根真正的主动脉。\n这是……最高效的战术。是用最小的代价，换取最大胜利的……唯一方法。情感会让人犹豫，我不会了。”"

LHS_jsgs: "走吧，结束这个故事"
LHS_jsgs_desc: "“海图上，再也没有可以标记的坐标了。电台里，再也没有可以回应的信号了。\n每一个熄灭的火种，每一段沉寂的通讯……它们像无数条无形的丝线，从大陆的四面八方汇集而来，最终，都指向了同一个人——索拉娜。\n这和复仇无关。复仇是滚烫的，而我的心脏早已冰冷。\n这也和希望无关。希望，在那艘燃烧的船上，就已经烧成了灰。\n这只是……为了让一切都停下来。为了让尖叫声彻底消失。无论是她们的，还是……我脑海里的。\n棋盘上，只剩下最后一步了。\n我们出发，去结束这个……该死的故事。”"

LHS_wldn: "你还记得她们的名字吗，索拉娜？"
LHS_wldn_desc: "“白城，只是个开始。\n我曾以为，只要夺回我们失去的故土，这一切就会结束。可我错了。只要索拉娜还坐在那座用谎言和骸骨堆砌的王座上，这片大陆，就永远不会有安宁。\n我们的人太少了。是的，少得可怜。与她那数以百万计的、不知疲倦的亡灵大军相比，我们就像是风暴里的一叶小舟。\n所以，我们不能去攻击她的军队。\n我们要直接去攻击她，攻击她的心脏，攻击她最恐惧的东西。\n她曾是‘夜莺之国’的统治者之一，她抛弃了那个死亡的国度，来到这里，是为了追求什么？是力量？是永生？还是……她在害怕被她曾经的‘臣民’所吞噬？\n我们将在大陆各地，同时点燃信号。不止是为了进攻，同时也是为了‘呼唤’。我们将用缴获的夜莺仪式，用从白尘界得到的知识，向那些在地下沉睡的、更古老的亡灵，发出一个清晰的信号：\n你们的女王，在这里。\n我们将把整个莉兰迪亚，变成一个巨大的祭品，一场吸引所有死亡视线的盛大仪式。索拉娜将不得不调动她所有的军队，来镇压那些被惊醒的、不受她控制的古老恐怖。\n到那时，在她所有的力量都被自己引来的风暴所牵制时，在她最空虚、最脆弱的那一刻。\n我，会亲自去敲响她王宫的大门。”"

LHS_wsfx: "在那无声的废墟上"
LHS_wsfx_desc: "“怪物消失了。王座是空的。\n这片土地，终于安静了下来。安静得……我听不到风声，也听不到海浪声，只能听到自己空洞的心跳。\n到处都是灰烬，到处都是残骸。那些被我当作信号点燃的火焰，如今只剩下冰冷的余温。\n我们赢了。\n然后呢？\n这条路，走到终点了。可我……好像把自己也走丢了。我不知道，下一步，该走向哪里。”"

LHS_sgjb: "将这片灰烬清扫干净"
LHS_sgjb_desc: "“晓枫姐让我休息……可看着这满地的狼藉，又怎么睡得着呢。我们从废墟里，把还能用的一砖一瓦都搬出来，搭成临时的庇护所；把还能吃的一粒米，分给每一个找到的孩子。我不知道明天会怎样，也不知道未来在哪里。我只知道，要先把脚下的这片灰烬，扫干净。烟囱里，终于又升起了炊烟。那味道……比任何胜利的勋章都好闻。”"

LHS_qscy: "驱散残夜"
LHS_qscy_desc: "那个女人，已经不在了。\n可笼罩在这片土地上的雾，还没有散。\n那些失去了女王牵引的亡灵，那些被我亲手拽出来的、古老的恐怖，正像一摊摊死水一样，淤积在山谷里，徘徊在废墟间。它们黏稠、冰冷，赖在太阳底下，不肯干涸。\n它们在找什么呢？是在找那片永恒的黑夜吗？\n可惜，这里是人间。这里……太吵，也太亮了。\n看着它们，我就觉得……很累。就像看着甲板上永远擦不干净的锈迹，看着那场噩梦留下的、洗不掉的污渍。\n既然这里不是大海，没法让它们沉底……那就把它们埋起来吧。\n把它们赶回那些不见天日的地缝里，填进那些深不见底的矿坑中。既然它们那么喜欢寂静……那就让它们在厚厚的泥土下面，永远地、安静地待着。\n别再……出来吓唬还活着的人了。"

LHS_syjk: "收音机里的哭声"
LHS_syjk_desc: "“家园有了点样子，我修好了那台旧电台。只是想听听，这片安静的大陆上，还有没有人在唱歌。\n结果……我听到的，却是哭声。\n断断续续的信号里，有女人在说……她们的孩子，被从艾瑞多利亚来的妖精，拖进了它们的部落；有男人在低吼……说一群自称来自阿德莱希的‘文明人’，抢走了她们的土地和收成；还有一个女孩，声音空洞得像风……在讲她们的同伴，如何因为绝望，变成了只会散播诅咒的、破碎的人偶。\n原来……索拉娜的倒下，只是让更巨大的牢笼，露出了它的栏杆。”"

LHS_bywt: "暴雨从未停歇"
LHS_bywt_desc: "“我关掉了收音机。可那些嘈杂绝望的声音，关不掉。它们像雨一样，淋在我的心上，冰冷，密集。\n晓枫姐的信，让我学会了怎么为自己哭。\n现在，我好像……要学着，怎么为她们哭了。\n这片大陆的雨，还没有停。我想……我的休息，也该结束了。我们的船，还能出海。我们的枪，还能擦亮。\n这一次……我们要做的事很简单。去找到那些在暴雨里哭泣的人，然后，为她们撑起一把伞。”"

LHS_xzdt: "寻找那座灯塔"
LHS_xzdt_desc: "“收音机里的哭声有很多，像一片望不到边的、下着雨的海洋。我不知道该先去哪里。\n但在所有求救的信号里，有一个声音，最让我无法忽视。那是艾尔孚利登，一个被阿德莱希的殖民者死死掐住喉咙的、古老的王国。它在大陆的最北端，靠近那片我们曾寄予希望、却久无音信的、名为‘瓦尔哈拉’的土地。\n我记得晓枫姐说过，瓦尔哈拉社，曾是我们在北方最坚定的同志，是另一座与我们遥相呼应的灯塔。\n如今，我们不知道那座灯塔是暂时熄灭了，还是仍在风雨中顽强地闪烁。而艾尔孚利登，就在它曾经照耀，或者仍在照耀的地方，独自哭泣。\n也许，帮助艾尔孚利登，就是我们重新找到那座灯塔的唯一航路。\n也许，当我们为艾尔孚利登的人民撑起伞时，就能再次看到，来自北方的、熟悉的光芒。”"

LHS_zfzl: "我认得这副嘴脸"
LHS_zfzl_desc: "“所有哭声里，有一种，最让我熟悉。\n妖精只是可怜无知，它们不懂得何为残忍。堕落的魔法少女是迷了路的孩子，她们的悲伤，甚至比她们造成的伤害更深。\n但她们……那些自称‘阿德莱希’以及‘露斯契亚’的殖民者，她们是清醒的。她们的旗帜不一样，说的话也不一样，但那副高高在上的、把人当成财产和数字的嘴脸……我认得。和当年莉兰迪亚王宫里的那些贵族，一模一样。\n她们清醒地，将锁链套在别人的脖子上，清醒地，享用着别人用血汗换来的食粮，然后，将其称之为‘文明’与‘秩序’。\n在所有敌人中，她们的罪，是最冰冷，也是最傲慢的。\n所以，就从她们开始吧。把这片大陆上，最‘体面’的强盗，先请出去。”"

LHS_qpdy: "现在，大雨倾盆而下"
LHS_qpdy_desc: "“我们为艾尔孚利登的人民撑了伞，我们把殖民者的阴影驱散。我看到她们在阳光下露出了久违的笑容。\n可这只是零星的晴天。\n在大陆更深、更黑暗的地方，雨，正下得更大了。那不是普通的雨。那是艾尔芙联盟古老森林里，那些被奴役的半妖精们，无声滴落的泪水；是那些迷路的魔法少女们，化作酸雨的悲伤；是夜莺之国留下的、让土地结霜的永恒严寒。\n我们手中的伞，太小了。一把一把地送，永远也送不完。\n所以，这一次，我们不再去追逐那些在雨中哭泣的影子了。\n我们要直接走向风暴的中心，走向那片……\n下着倾盆大雨的地方！！！”"



LHS_cgyl: "擦干最后的眼泪"
LHS_cgyl_desc: "“怪物消失了，大陆安静了下来。\n可我还是能听到哭声。很轻，很远。它来自那些被挂着狮子旗的船只所包围的港口，来自那些被‘主人’用契约和皮鞭统治的土地。\n我曾以为，最可怕的雨，是那些怪物带来的腥风血雨。现在我明白了，那种用礼帽和手杖送来的、冰冷的、永不停歇的毛毛细雨，同样能将人的骨头都淋透。\n我们为这片大陆清除了噩梦。\n现在，该把那些还躲在屋檐下、制造着阴影的旧日幽灵，也一并请出去了。\n然后，这片天空，才算是真正地，彻底地，放晴了。”"

LHS_xmdh: "从未熄灭的灯火"
LHS_xmdh_desc: "“晓枫姐的笔记里，总是反复提到她们——瓦尔哈拉，那座在北方，与我们遥相呼应的灯塔。\n在我最孤独的时候，我总会抬头，望着北方的夜空。我看不见她们的光，但我总觉得……她们一定还在那里。\n现在，我终于，亲眼看到了。\n原来，她们也一样。她们也在漫长的黑夜里，固执地，守护着自己的那盏灯，也同样，在遥望着南方的我们。\n我们就像是，被一场巨大的风暴，吹散在世界两端的、同一个篝火里迸发出的、两颗小小的火星。\n现在，风暴过去了。\n我们也该……重新回到一起，再次燃烧成，足以照亮整个夜空的那团、温暖的火焰了。”"

LHS_qptz: "\n§9她们的舰队在世界另一端。只要我们足够快，在她们反应过来之前，把她们在这片大陆上的爪牙全部拔掉……她们就再也没有理由，也没有落脚点，跨过半个世界来找我们麻烦了。§!"


LHS_jiefangbudui: "§Y每§R解放§!一个国家，我们都将获得§Y4§!支§!§t解放志愿军部队§!§Y。§!"
LHS_sitabudui: "§Y我们将在§R解放§!胜利后获得§Y4§!支§!§4海军陆战队部队§!§Y。§!"
LHS_alxobudui: "§Y我们将在§R解放§!胜利后获得§Y2§!支§!§O装甲部队§!§Y。§!"
LHS_buji: "补给线被毁"
LHS_buji_desc: "我们的补给线遭到了敌人的破坏，大量的物资都被叛匪夺走了。"
LHS_buji2: "补给线被毁"
LHS_buji2_desc: "我们的补给线遭到了敌人的破坏，大量的物资都被叛匪夺走了。"
LHS_buji3: "补给线被毁"
LHS_buji3_desc: "我们的补给线遭到了敌人的破坏，大量的物资都被叛匪夺走了。"
LHS_buji4: "补给线严重被毁"
LHS_buji4_desc: "我们的补给线遭到了敌人的严重破坏，可恶的老鼠！"

LHS_xkgh: "那么……先开个会？"
LHS_xkgh_desc: "“仗打完了。可……然后呢？\n之前，我只需要盯着海图，找到敌人的位置，然后制定计划。可现在，桌上摆满了我不认识的东西——农业报告、工厂蓝图、还有……一份长长的、关于‘如何分配住房’的讨论草案。\n每一个字我都认识，但它们凑在一起，我就完全不明白了。\n我想，晓枫姐在这种时候，大概会召集大家，开一个又长又重要的会议吧。\n那……我们就先从这里开始试试看？”"

LHS_ssyx: "那……谁是英雄？"
LHS_ssyx_desc: "“她们……开始给我写诗，给我画像。\n她们叫我‘黎明的船长’，叫我‘风暴的女儿’，叫我……英雄。\n可我……不是啊。\n我只是一个……被海浪推上岸的、运气比较好的普通女孩。\n真正的英雄，是那个在黑夜里为我们缝补旗帜的老奶奶，是那个用身体堵住枪眼、让我们先撤退的无名战士，是每一个在自己的岗位上，努力让这个世界变得好一点点的、普通的你们。\n是你们，才让我成为了英雄。是我需要你们，从来都……不是你们需要我。”"

LHS_ssyx2: "那……谁是英雄？"
LHS_ssyx2_desc: "“她们……开始给我写诗，给我画像。\n她们叫我‘黎明的船长’，叫我‘风暴的女儿’，叫我……英雄。\n可我……不是啊。\n我只是一个……被海浪推上岸的、运气比较好的普通女孩。\n真正的英雄，是那个在黑夜里为我们缝补旗帜的老奶奶，是那个用身体堵住枪眼、让我们先撤退的无名战士，是每一个在自己的岗位上，努力让这个世界变得好一点点的、普通的你们。\n是你们，才让我成为了英雄。是我需要你们，从来都……不是你们需要我。”"

LHS_nyp: "我的那一票，和我们的一票"
LHS_nyp_desc: "“大家在广场的黑板上，吵得很厉害。\n有人说，投票，就该只想着自己，想要什么，就投什么。\n有人说，不对，投票，应该为大家着想，要选那个对公社最好的选项。\n我坐在小板凳上，想了很久。\n我觉得……她们说的，好像都对，又好像都……不完全对。\n为自己着想，没有错呀，因为每个人都过得好了，我们这个大家庭，才会真的好。\n可只想着自己，也好像不行，因为如果你的好，是建立在别人的不开心上，那……那样的好，是不对的。\n所以，我们可不可以……找到一条让‘我’和‘我们’，都能开心的路呢？”"

LHS_nyp2: "我的那一票，和我们的一票"
LHS_nyp2_desc: "“大家在广场的黑板上，吵得很厉害。\n有人说，投票，就该只想着自己，想要什么，就投什么。\n有人说，不对，投票，应该为大家着想，要选那个对公社最好的选项。\n我坐在小板凳上，想了很久。\n我觉得……她们说的，好像都对，又好像都……不完全对。\n为自己着想，没有错呀，因为每个人都过得好了，我们这个大家庭，才会真的好。\n可只想着自己，也好像不行，因为如果你的好，是建立在别人的不开心上，那……那样的好，是不对的。\n所以，我们可不可以……找到一条让‘我’和‘我们’，都能开心的路呢？”"


LHS_wmss: "那么……我们是谁？"
LHS_wmss_desc: "“最近，总有人问我，我们到底是谁？\n是那些拿着武器的战士吗？是那些在工厂里劳作的工人吗？还是那些在田野里耕种的农民？\n都不是。\n或者说……都是。\n是那个在夜校里，努力辨认第一个字母的老爷爷。\n是那个在球场上，为了一次进球而欢呼的孩子。\n是那个在黑板前，认真写下自己不同意见的年轻人。\n是每一个，在这片土地上，哭着、笑着、爱着、努力生活着的、活生生的你。\n把所有这些‘你’加在一起，才是……我们。”"

LHS_cjmz: "会吵架的民主"
LHS_cjmz_desc: "“那些从旧世界来的商人说，她们那里也有民主，也有投票。\n可她们的民主，是写在昂贵的报纸上的，是用钱能买到的。\n她们的投票，是在吵完架以后，少数人必须听多数人的。可那些少数人，就真的错了吗？她们的不开心，就不重要了吗？\n我觉得，我们的民主，不应该是这样的。\n我们的民主，应该……是能让所有人都坐下来，好好吵一架的民主。吵完了，就算最后没有听你的，我也会认真地告诉你，为什么。然后，下一次，你还有权利，继续和我吵。\n它不保证每一次都正确，它只保证，我们永远有……可以犯错和改正的权利。”"

LHS_wshg: "我只是……禾果"
LHS_wshg_desc: "“她们说，我是公社的奠基人，是南十字星的领航员。\n可我……真的不是。\n我只是一个……很想很想回家的孩子。\n只是我的家，在半路上，被风吹散了。\n于是，我只好试着，用捡到的那些碎片，和所有和我一样无家可归的人，一起，重新盖一个……能让所有人都不会再迷路、不会再害怕的，新的家。\n我不是什么领袖，也不是什么英雄。\n我只是……禾果。一个碰巧，被大家需要了的，普通的女孩。\n这就……很好了。”"

LHS_jwkk: "那本书可以借我看看吗？"
LHS_jwkk_desc: "“大家都在忙着重建家园。只有我，好像什么都帮不上。那天，我看到农业部长在读一本很厚很厚的、关于‘土壤改良’的书。我……只是有点好奇，就凑过去问了问。结果她特别高兴，把那本书借给了我，还说要是有不懂的，随时都可以去田里找她。书上的字很难，但我好像……找到了一点点，能和大家一起努力的方向了。”"

LHS_cqsw: "我的成千上万个老师"
LHS_cqsw_desc: "“我发现，我好像是这个国家里，唯一一个什么都不懂的学生。农民大婶教我怎么看麦子的颜色，老兵叔叔教我怎么用最省的料砌墙，就连小孩子，都教我哪里的野果子最甜。我每天都带着一个小本子，把她们说的话，歪歪扭扭地记下来。原来，我的老师，有成千上万个呢。”"


LHS_cqsw2: "我的成千上万个老师"
LHS_cqsw2_desc: "“我发现，我好像是这个国家里，唯一一个什么都不懂的学生。农民大婶教我怎么看麦子的颜色，老兵叔叔教我怎么用最省的料砌墙，就连小孩子，都教我哪里的野果子最甜。我每天都带着一个小本子，把她们说的话，歪歪扭扭地记下来。原来，我的老师，有成千上万个呢。”"

LHS_lddl: "把灯点亮好吗？"
LHS_lddl_desc: "“我收到了一个小女孩的来信。\n她在信里问我：‘禾果姐姐，你能不能把我们镇上通往学校的那条路上的路灯，都点亮呀？因为……天黑了，一个人走路，会有点害怕。’\n我把这封信，贴在了我的办公室里。\n我告诉所有的干部，我们现在所有工作的最终目标，就是这个。就是让每一个走在回家路上的孩子，都不要再感到害怕。\n所以，把路灯点亮吧。用我们能做到的一切，先把这一盏灯，点亮。”"

LHS_cylq: "给土地唱首摇篮曲"
LHS_cylq_desc: "“那些被妖精和亡灵踩过的土地，好可怜。它们像生了病的孩子，长不出庄稼，也开不出花。\n我问了公社里最有经验的老农，她说，土地也需要休息和安慰。\n于是，我们组织了好多好多人，我们不急着在上面盖房子，也不急着播种。我们就只是……轻轻地，把里面的石头和骸骨都捡出来，然后种上最好看的苜蓿草，让它们像绿色的被子一样，盖住土地的伤疤。\n我每天都会去那里走一走，对着那片绿色的田野，轻轻地哼着晓枫姐教我的那首摇篮曲。\n我相信，土地听得懂。”"

LHS_nkxm: "今天，你开心吗？"
LHS_nkxm_desc: "“最近，我总是在想一个问题。\n我们有了粮食，有了房子，也有了学校。可是……大家真的开心吗？\n开心的标准是什么呢？是每天都能吃饱饭吗？还是口袋里有花不完的钱？我想不明白。\n于是，我在信箱旁边，又立了一块新的小黑板。我在上面写：‘今天，你开心吗？如果不开心，能告诉我为什么吗？’\n我不知道这样做有没有用。\n我只是觉得，一个让人民感到不开心的公社，就算再强大，再富有，那也是……不行的。\n我要我们的人民，是全世界最开心的那群人。”"

LHS_cyjb: "那……吵一架吧？"
LHS_cyjb_desc: "“在读了晓枫姐留下的、更多更多的笔记后，我好像……有点明白了。\n她说，革命最怕的，不是犯错，而是安静。是所有人都说着同样的话，是所有人都觉得‘领袖的决定总是对的’。\n可我……明明就犯了很多错呀。\n所以，我决定在公社的广场上，立一块巨大的黑板。我告诉大家，以后我们所有的重要决定，都会提前写在上面。如果谁觉得我说的不对，或者有更好的想法，就可以直接在黑板上，用粉笔写出来，甚至……可以和我吵一架。\n因为，真理，不应该是我一个人的声音。它应该是……我们所有人吵吵闹闹的声音，汇合在一起时，才发出的、最响亮的回响。”"
#禾果二阶段政治线
LHS_cbkq: "从不哭泣的女孩"
LHS_cbkq_desc: "“战争结束后，我们找到了她们。\n一群……很奇怪的女孩。她们的眼神，和我见过的任何人都不一样。既没有经历苦难后的悲伤，也没有迎来和平后的喜悦。\n就像一尊尊漂亮的、但没有灵魂的人偶。\n她们说，她们是‘魔法少女’。她们说，她们的战斗，还远远没有结束。\n我不知道她们在和什么战斗，也不知道她们经历了什么。我只知道……她们的眼睛里，那种比深海还要寂静的绝望，让我……无法移开视线。”"

LHS_bcdr: "不存在的敌人"
LHS_bcdr_desc: "“她们终于……愿意和我们沟通了。\n她们带我去看她们的‘战场’。那是一片……我无法理解的空间。瑰丽、怪诞、充满了疯狂的几何图形和甜美的色彩。\n她们说，她们的敌人，叫‘魔女’，是由诅咒和绝望化成的怪物。\n我派出我们最好的斥候，使用最先进的设备，去探查那些空间。可斥候们回来告诉我，那里……什么都没有。没有敌人，没有怪物，只有一片……荒诞的、会自我变化的空洞。\n她们……在和空气战斗吗？”"

LHS_lhbs: "灵魂宝石的裂痕"
LHS_lhbs_desc: "“一个魔法少女，倒下了。\n就在我的面前。她没有受伤，也没有被任何东西击中。她只是……在一次战斗结束后，突然跪倒在地，发出了不似人类的、痛苦的悲鸣。\n她胸口那颗闪闪发光的、被称为‘灵魂宝石’的东西，光芒迅速变得浑浊、暗淡，然后……咔嚓一声，碎裂了。\n在它碎裂的瞬间，我看到了。我真的看到了。\n从那破碎的宝石里，涌出了一团巨大的、由无数哭泣的脸庞和尖叫的嘴唇组成的、黑色的绝望集合体。那就是……她们口中的‘魔女’。\n原来……她们的敌人，从来都不在外面。”"

LHS_xsxz: "为她们的战争，献上我们的心脏"
LHS_xsxz_desc: "“我们错了。\n错得……离谱。\n我们以为自己是医生，在试图治愈一群可怜的病人。可我们……其实是一群站在岸边的傻瓜，眼睁睁地看着她们，独自一人，在名为‘绝望’的深海里，挣扎，下沉。\n她们的战争，是真实的。比我们经历过的任何一场战争，都更孤独，也更残酷。\n她们的敌人，就是她们自己燃烧过后的灰烬。\n从现在起，我们不再是观察者，不再是施救者。\n我们要成为她们的战友。\n用我们的血肉之躯，用我们能造出的所有武器，去为她们，对抗那份本不该由她们独自承担的、来自整个世界的恶意。”"

LHS_xxyw: "许下最终的愿望"
LHS_xxyw_desc: "“她们说，她们是为了实现某个‘奇迹’，才签下了那份无法回头的契约。\n她们用自己的灵魂作为代价，换来了守护世界的力量，然后，在耗尽所有光芒后，变成新的诅咒。\n这……算什么奇迹？这根本就是一场最残酷、最不公平的骗局。\n我不同意。\n我决不同意，这样的‘规则’，继续下去。\n如果，成为魔法少女，需要许下一个愿望。\n那么，这一次，就换我们，来为她们许一个愿。\n我许愿……\n——‘我希望，所有善良的女孩，都不必再独自哭泣。’\n这个愿望，我们不用去求什么看不见的神秘生物。\n就由我们自己，用我们的双手，用我们的意志，去亲手实现它！”"

LHS_wckq: "§0献给所有未曾哭泣的你§!"
LHS_wckq_desc: "“它来了。\n那个被称为‘瓦尔普吉斯之夜’的、\n所有魔女的集合体，所有绝望的终点。\n我看着它，那巨大到足以遮蔽天空的、由无数悲伤与诅咒构成的身影。\n它没有眼睛，可我却觉得，有亿万双哭泣的眼睛，正在凝视着我们。\n我身后的魔法少女们，在颤抖。她们知道，这是她们无论如何也无法战胜的、最终的宿命。\n我身后的人民，也在颤抖。她们知道，这是超越了所有战争的、足以毁灭整个大陆的天灾。\n可我……没有颤抖。\n因为我突然明白了。我们这一路走来，我们为哭泣者撑伞，我们为迷路者点灯……我们所做的一切，都是在为了这一刻。\n我们不是要去战胜一个敌人。\n我们是要去，拥抱一份巨大而无助的悲伤。\n我们是要告诉那些，在漫长的、孤独的战斗中，耗尽了所有眼泪，连哭泣都无法做到，最终变成了怪物的……那些好姑娘们。\n——辛苦了。\n——已经……可以停下来了。\n——这一次，换我们，来接你们回家。”"

LHS_jhj: "把你们接回家！"
LHS_jhj_desc: "“天空，终于放晴了。\n世界，也终于安静了。\n可我的心里……还是空落落的。\n我决定，要回去一趟。回到一切开始的地方。回到卡卡罗姆那座又冷又黑的矿井。\n那里，曾是‘野火’的摇篮，也是……她们最后的家。\n我带上了晓枫姐的那把旧口琴，还有雪伊姐那枚已经磨掉了颜色的、旧的袖章。\n我把你们想要的那个世界，带回来了。\n却……没能把你们，一起带回来。\n所以，这一次，换我来接你们了。\n从今往后，你们不用再战斗了。也不用再担心我了。\n就在这里，好好地，睡一觉吧。”"

LHS_plp: "来自大海的漂流瓶"
LHS_plp_desc: "“今天，我们在清理港口时，发现了一个从东方漂来的、密封得很好的瓶子。\n里面，只有一张用我看不懂的文字写满的、陈旧的信纸。还有一个小小的、用红绳串起来的、已经褪了色的虎头香包。\n我不知道为什么……闻到那个香包的味道时，我的心，突然跳得好快。好像……那是我在很久很久以前，就应该记住的味道。”"

LHS_sgs: "说故事的人"
LHS_sgs_desc: "“我们找到了能读懂那封信的人。一个在战争中，从神州帝国逃难过来的老学者。\n她说，信上写的，不是什么国家大事。只是一个母亲，在给她失散多年的女儿，讲一些睡前故事。\n故事里，那个小女孩，喜欢在夏天追逐萤火虫，喜欢吃甜甜的麦芽糖，害怕打雷……\n我听着听着，就好像……那也是我的故事一样。\n老学者说，写信的人，可能就在最近一批从东方来的难民船上。我……我想去见见她。”"

LHS_yhc: "萤火虫的夏天"
LHS_yhc_desc: "“我……见到她了。\n她和我想象的完全不一样。她很憔悴，很瘦弱，穿着洗得发白的旧衣服，就像我们公社里，任何一个普通的阿姨。\n她拉着我的手，给我讲了好多好多，我完全不记得的故事。\n她说，我的真名，叫禾果，是一个温暖的名字。\n她说，我小时候，最喜欢在夏天的夜晚，看萤火虫。一看，就是一整个晚上。\n和她在一起的时候，我感觉……我心里那个一直空着的地方，好像，被什么东西，填满了。暖暖的。”"

LHS_lszf: "蓝色的制服"
LHS_lszf_desc: "“公社的档案部，在核对新来的难民身份时，发现了一个问题。\n她们把一份旧档案，放在了我的桌上。那是一份……神州帝国旧政权的、税务部门的官员名册。\n在名册的最后一页，我看到了一个熟悉的名字。\n还有一张……褪色的、黑白的照片。\n照片上，她穿着一身笔挺的、蓝色的税务官制服，表情严肃。和现在这个，只会对我温柔微笑的她，完全是两个人。\n档案记录说……她负责的区域，是当年饥荒最严重的地方。而她的工作，是确保那里的每一粒粮食，都被‘合理合法’地，征收上去。”"

LHS_sjjl: "世界上最遥远的距离"
LHS_sjjl_desc: "“那扇门，再也没有打开过。\n我每天都会去。站在雨里，或者站在阳光下。我不再敲门，也不再说话。我只是……站在那里。\n屋里的人，也从不发出一点声音。我们之间，只隔着这层薄薄的木板，却好像……隔着一个永远也无法跨越的、由无数饿死的冤魂堆积而成的深渊。\n我无法原谅她。我也……不知道该如何去恨她。\n我只是……失去了我的妈妈。在一个……我刚刚以为自己，终于找到了她的午后。”"

LHS_zhsd: "§7最后的税单§!"
LHS_zhsd_desc: "“她快不行了。\n医生说，她拒绝了所有的治疗和食物。她只是……在耗尽自己。\n就在我以为，这个故事，会以这样一种……最残酷的沉默收场时，公社的老书记，交给了我一样东西。\n那是一本……用油布包得整整齐齐的、旧帝国的秘密账本。\n是她……托人送出来的。\n她说，这是她……作为一名旧帝国的‘税务官’，收上来的、最后一笔‘税’。也是……她作为一名母亲，留给我的、唯一的‘遗产’。\n那上面，记录了所有被贪墨的粮食的去向，记录了所有参与这场罪恶的人的名字，记录了……一个母亲，为了让自己的孩子活下去，到底……出卖了多少灵魂。\n账本的最后一页，是空白的。只在最下面，用血，写了三个字：\n\n‘对不起。’”"

LHS_zhyy: "日记的最后一页"
LHS_zhyy_desc: "“公社的生活，一天比一天好起来了。可我的心里，总像缺了一块。\n今天，那位一直照顾我的老书记，把他珍藏了很久的一样东西，交给了我。\n那是一本……晓枫姐的日记。\n他说，这是当年从卡卡罗姆的废墟里，找到的。日记的大部分内容，都已经被血污和雨水浸透，无法辨认了。\n只有……最后一页，还勉强能看清几个字。”"

LHS_wfbr: "无法辨认的日记"
LHS_wfbr_desc: "“日记的最后一页，停在了那个……我们全军覆没的、黄昏的前一刻。\n上面，只有一句话，字迹很潦草，像是匆忙中写下的：\n‘……我好像，看到了一种从未见过的、很漂亮的紫色晚霞。真想让……’\n后面的名字，被一大块干涸的、暗红色的血迹，彻底盖住了。我看不清。\n是我的名字吗？还是……别人的名字？\n我看着那块血迹，就好像……又回到了那个被火光和尖叫声淹没的、地狱般的黄昏。”"

LHS_hzfm: "活着的坟墓"
LHS_hzfm_desc: "“我们……在调查中，找到了她们。\n一些……在那场灾难中，活下来的人。\n她们没有死，也没有变成亡灵。她们只是……被那场巨大的、无法理解的恐怖，彻底击碎了。她们的灵魂，像是被困在了那个黄昏，永远也走不出来了。\n她们会突然对着空气尖叫，会把所有靠近的人都当成怪物。\n医生说，她们的身体还活着，可她们的心……已经死了。\n看着她们空洞的眼神，我好像……看到了我自己。”"

LHS_ttgs: "听听她们真正的故事"
LHS_ttgs_desc: "“我决定，要为晓枫姐和雪伊姐，办一场……迟到了很久很久的葬礼。\n可我发现……我记忆里的她们，都是作为‘指挥官’和‘领袖’的、冰冷的符号。\n于是，我走遍了整个公社，去寻找那些，还记得她们的人。去问……那些很小很小的事情。\n我听那个老兵说，雪伊姐曾经因为他弄丢了一颗子弹，罚他抄了一百遍条例，但第二天夜里，又悄悄把自己的口粮，多分了一半给他。\n我听那个厨师说，晓枫姐最喜欢偷偷跑到厨房，在土豆汤里多加一勺糖。\n她们的故事，像一块块小小的拼图，在我心里，慢慢地，拼出了两个……会生气，会调皮，会疼的、活生生的人。”"

LHS_xrk: "一束……向日葵"
LHS_xrk_desc: "“葬礼那天，天气很好。\n我们在她们那座无名的石碑前，放满了整个公社最好看的、开得最灿烂的向日葵。\n我站在碑前，把我从大家那里听来的、所有关于她们的故事，都轻轻地，又讲了一遍。\n讲给她们听，也讲给……我自己听。\n我说，‘你们看，你们守护的这个世界，现在，很漂亮哦。’”"

LHS_wanan: "§9晚安，晓枫姐。晚安，雪伊姐。§!"
LHS_wanan_desc: "“那天晚上，我做了一个梦。\n我梦见，我又回到了那个……被紫色晚霞笼罩的黄昏。\n可这一次，没有怪物，也没有尖叫。\n晓枫和雪伊，就站在我的身边。我们一起，看着那片很漂亮的、就要落下去的晚霞。\n晓枫笑着揉了揉我的头发，说：‘看，禾果，多美的晚霞啊。’\n雪伊还是那副凶巴巴的样子，她把一件厚厚的外套，披在了我的身上，然后说：‘天黑了，会冷。该回家了。’\n然后……我就醒了。\n窗外，天已经亮了。\n原来……葬礼，不是为了告别。是为了……能再一次，好好地说一声，晚安。”"

LHS_wtgg: "没有地址的家书"
LHS_wtgg_desc: "“公社的生活越来越好，可我……还是会时常，望向东方。那里，是我的故乡。一个……我早已记不清模样的、遥远的家。\n最近，我们截获了一封来自那片土地的、很奇怪的电报。它没有收件人，也没有密码。上面写的，都是一些很普通的话，像是一个远行的孩子，在给家里报平安。\n电报说：‘妈妈，我们翻过了雪山，虽然很冷，但我们看到了前所未有的风景。’\n电报说：‘妈妈，我们正在学习自己种粮食，味道……没有您做的好，但能吃饱。’\n我不知道这是谁写的。但我……好像能听懂，那些没有说出口的话。”"

LHS_bnae: "多一份口粮，\n少一个孤儿。"
LHS_bnae_desc: "“我把那封电报，读给了我们公社所有的人听。\n我问大家，我们该怎么办。\n那个总是在食堂抱怨饭菜太淡的老兵，第一个站了出来。他说，他愿意，把他这个月的口粮，分一半出来。\n他说：‘……我打了一辈子仗，最不想看到的，就是再有孩子，因为战争，变成和我一样的孤儿。’\n我看着他，突然，就想起了很久很久以前……那个，在船舱里，把自己的黑面包，分了一半给我的、不知名的老水手。”"

LHS_jgtm: "把我们的船派过去"
LHS_jgtm_desc: "“她们……被封锁了。像一座被海水包围的、孤独的岛屿。来自[JAP.Getname]的舰队，切断了她们所有的海上补给线。\n这种感觉……我太熟悉了。\n我召集了我们舰队所有的老伙计。我告诉她们，我们又要出海了。但这一次，我们不再是为了复仇，也不再是为了我们自己。\n我们要去，为那些，被困在‘孤岛’上的同志们，送去她们最需要的武器和药品。\n我们要用我们最熟悉的、海盗的方式，去告诉那些[JAP.Getname]的将军们——\n——这片大海，不是你们一家的后花园。”"

LHS_zzsm: "再也没有下一个“小果子”"
LHS_zzsm_desc: "“她们的感谢信，一封一封地，传了回来。\n信上说，我们的援助，让她们守住了一座又一座城市，拯救了一个又一个生命。\n可我……却在她们另一份战报里，看到了另一段话。\n战报说，在那些被[JAP.Getname]占领的城市里，有成千上万的孩子，因为饥饿和战乱，正在被卖往世界各地……\n……就像，很多很多年前，那个……攥着半个青苹果的、小小的我一样。\n……\n我不想再看到这样的故事了。一个，都不想了。\n那么，开战吧。\n为了……这片土地上，再也不会有下一个，需要漂洋过海，才能找到家的、孤独的‘小果子’。”"

LHS_skxrk: "§9盛开的向日葵§!"
LHS_skxrk_desc:"§9她们走了，但她们把太阳，留了下来。§!\n那场迟到了太久的葬礼，最终，变成了一场最盛大的迎接\n我们迎接回了她们真正的、完整的灵魂——那两个会调皮，会生气，会为了半块口粮而斤斤计较的、活生生的女孩。\n从此，悲伤不再是午夜梦回时的黑色梦魇，而是在阳光下，可以被坦然说出口的、温暖的思念。\n她们的墓碑上，开满了金色的向日葵。而在这片土地上，每一个幸存者的心里，也都开出了一朵……永不凋零的、永远向着太阳的、小小的向日葵。\n我们，就是她们生命的延续。我们，就是她们曾梦想看到的、那个最美的未来！！！"

#禾果军事线
LHS_wmcs: "我们曾是这样战斗的"
LHS_wmcs_desc: "“她们都说我是领袖了。可我……我只是个还记得怎么在没有补给的时候活下去的士兵。在‘野火’的日子里，我们没有那么多大道理。战争，就是一把还能用的枪，一双不会磨破脚的靴子，和在天亮前找到下一个藏身之处的本能。我们得把这些找回来。这是我们唯一赢过的战斗方式，也是……我唯一真正懂得的东西。”"
