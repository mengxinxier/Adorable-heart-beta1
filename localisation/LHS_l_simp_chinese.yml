LHS_zhxb: "最后的火光\n§9“我是她们最后的希望...”§!\n§W--------------§!"
LHS_xrsh: "§g逐渐麻木...§!\n§L“她将所有的情感都埋葬了。她的决策变得无比理智，她的心，也变得像冰冷的死灰。\n这让她在指挥上更加高效，但也正在让她……失去作为“人”的一部分。”§!\n§W--------------§!"
LHS_xrsh2: "§g逐渐空洞...§!\n§L“她已经完全说服了自己，所有的牺牲都是通往胜利的必要‘成本’。她不再试图理解那些数字背后是一个个鲜活的生命。她的心中没有了希望，也没有了绝望，只剩下一条通往终点的、用坐标和概率铺成的冰冷道路。她正在成为一个完美的战争工具，也正在……彻底死去。”§!\n§W--------------§!"
LHS_bzlh: "§9笨拙的领航员...§!\n§L“她正用自己最熟悉的方式，去理解这个崭新的、和平的世界。虽然她的“战略指示”总会引来大家善意的笑声，但正是这份真诚与笨拙，让所有人都心甘情愿地追随着她，共同探索着前方的道路。人们爱戴的，并非一个无所不能的神，而是一个会脸红、会犯错、却愿意和大家一起学习的……我们的禾果。”§!\n§W--------------§!"
LHS_wzshg: "§9在南十字星下§!\n§L她终于，与自己和解了。她不再是背负着过去的亡魂，不再是冰冷的战争机器，也不再是笨拙的和平领袖。她就是她自己。而正是这样的她，才成为了这片大陆上，所有人心中，那颗最温柔、也最明亮的，永不坠落的南十字星。§!\n§W--------------§!"
