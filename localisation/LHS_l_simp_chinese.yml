#晓枫
LHS.30.t:0 "代价沉重的“胜利”"
LHS.30.d:0 "破晓的惨白光线像一把生锈的手术刀，剖开了夜色，将这条被炮火犁过无数遍的山谷赤裸裸地暴露出来。\n昨夜如同沸腾锅炉般的厮杀声已经冷却，空气中不再有呐喊，只剩下令人作呕的铁锈味和硝烟未散的焦糊。焦黑的弹坑里，扭曲的钢铁与破碎的肢体纠缠在一起，早已分不清哪些属于“军团”的精锐，哪些属于我们年轻的战士。红色浸透了灰色的冻土，那是这片死寂世界里唯一的色彩。\n晓枫双手死死撑在满是裂纹的沙盘边缘，指尖因过度用力而泛白。她的军装硬得像铠甲，那是血浆混合泥土风干后的触感。她盯着沙盘上那些代表己方部队的旗帜——大半已经倒下，或者根本找不到了。\n“报告……总参谋长。”通讯兵的声音像是含着一口沙砾，他抹了一把脸上的黑灰，露出一双布满血丝、却空洞无比的眼睛，“军团……撤了。那是全面溃退。我们……守住了。”\n指挥所角落里响起几声零星的、嘶哑的欢呼，但就像被掐断脖子的鸟鸣，瞬间就被这死一般的清晨吞没。没有人拥抱，没有人流泪。晓枫看着那些摇摇欲坠的身影，心脏像被一只冰冷的手狠狠攥紧。所谓的“胜利”，不过是用无数条命填平了这道山谷。"
LHS.30.a:0 "原计划……必须放弃了。"

LHS.31.t:0 "腐臭的货物"
LHS.31.d:0 "沼泽深处的迷雾像是一层发霉的裹尸布，死死缠绕着这片林地。空气中没有硝烟味，却弥漫着一股令人胃液翻涌的、混杂着甜腻香气与陈腐烂肉的怪味。\n\n转移的队伍在一段废弃的水道旁，发现了几艘被刻意伪装的驳船。起初，饥肠辘辘的战士们以为截获了王室的秘密粮草，欢呼着撬开了货舱的铅封。\n\n然而，当舱门洞开的那一刻，欢呼变成了死寂的干呕。那不是粮食，那是……成吨的、经过特殊处理的“肉”。\n\n“这不是给活人吃的……”一名老兵捂着口鼻，声音发颤，“这是饲料。给那些……地底下的东西的。”\n\n晓枫推开人群，走上前去。她从那一堆令人作呕的货物缝隙中，抽出了一份沾着粘液的运输清单。借着昏暗的马灯，鲜红的王室火漆印显得格外刺眼——这是王室在供养怪物的铁证。\n\n但就在她准备合上清单的瞬间，她的目光凝固了。在清单的一处货物重量统计栏旁，有人用炭笔随手画了一个几乎看不清的、用来修正误差的“√”。\n\n那个勾的尾端，带着一个极不起眼的、向右上角挑起的锐利折角。\n\n晓枫的手指猛地收紧，心脏在胸腔里漏跳了一拍。那是……一种只有在无数次沙盘推演中，某个人习惯性用来表示关键节点的独特笔触。那个本该已经被埋葬在艾瑞波拉乱石之下的人……\n\n“参谋长？”旁边的警卫员看她脸色苍白。\n\n“……没什么。”晓枫迅速将那张清单折叠，贴身收好，声音恢复了往日的冷静，只是指尖仍在微微发颤，“把这批货烧了。这是王室出卖我们的罪证。”"
LHS.31.a: "天大的发现"

LHS.32.t:0 "破碎的阴谋"
LHS.32.d:0 "临时营地里的煤油灯芯发出噼啪的爆裂声，将两个被拉长的影子投射在满是霉斑的帐篷壁上。外面，那是压抑不住的、如同潮水般蔓延的低语——战士们在传阅那些沾着粘液的证据，恐惧正在发酵，但更多的，是某种正在被点燃的、狂暴的怒火。\n“这是一场‘清仓’。”晓枫的手指在那份清单上缓缓划过，指尖若有若无地摩挲着那个不起眼的角落，“王室并不打算赢得内战。她们是在拖延，是在等待我们和军团互相把血流干。等到这片土地上再没有能举枪的手……”\n“她们就把大门敞开，把这里变成那群怪物的食堂。”雪伊接过了话头，声音冷得像是从牙缝里挤出来的碎冰。她猛地站起身，那一瞬间爆发出的杀气让灯火都剧烈摇曳。\n“但那群坐在金马桶上的蛆虫算错了一件事。”雪伊一把抓起那份盖着鲜红火漆印的文件，就像抓住了索拉娜的咽喉，“这场把我们逼入绝境的撤退，没能埋葬我们，反而让我们撞破了地狱的大门！”\n她大步走向帐篷口，一把掀开门帘，让外面的冷风灌入。\n“恐惧？不，不需要恐惧。我们要把这份恐惧，加倍地还给她们！我们要把这些烂肉、这些清单、这些肮脏的交易，贴在每一座工厂的墙上，塞进每一户人家的门缝里！我们要让整个莉兰迪亚看清楚——那个高高在上的王座底下，到底藏着怎样一副吃人的獠牙！”"
LHS.32.a:0 "把真相，钉进她们的骨头里！"

LHS.38.t:0 "无声的动员"
LHS.38.d:0 "黎明前的山谷死寂得令人心慌，只有雪伊手中的刺刀刮擦地图的沙沙声。\n“那群蠢猪还在梦里数金币，”她冷笑着，刀尖在地图上的王都位置狠狠一扎，“等太阳升起，我们就从沼泽杀出去，把她们的脑袋挂在……”\n\n帐篷帘被猛然掀开，冷风裹着传令兵跌了进来。她脸上没有血色，只有一种目睹了绝对恐怖后的空白。\n“东北……满……满了……”\n\n晓枫没有问，她抓起望远镜冲出了指挥所，靴子踩碎了清晨的薄冰。\n当两人登上瞭望哨时，初阳的第一缕光刚好撕裂晨雾——\n\n那一刻，世界失去了声音。\n\n没有军鼓，没有呐喊，没有活物的喘息。\n视野尽头，是一片漫无边际的、惨白的浪潮。骸骨战马拖拽着由腐朽棺木拼凑的攻城车，密密麻麻的腐尸步兵排成整齐得令人作呕的方阵，像一道移动的巨大伤疤，正在无声地吞噬着大地。它们在行军，却只有骨骼摩擦发出的、如同无数只白蚁啃噬木头的细碎声响。\n\n那是比死亡更冰冷的纪律。\n\n“夜莺之国……”雪伊的指甲深深嵌入了冻土，鲜血渗出染红了岩石，“索拉娜……她为了赢，真的把地狱的大门打开了。”\n\n晓枫缓缓放下望远镜，镜片上映照着那片死寂的白色海洋。她的声音很轻，像是一片落下的雪花，却瞬间冻结了周围的空气。\n\n“不用埋伏了。”她转过头，眼神里最后一点侥幸彻底熄灭，“……猎人，变成了猎物。”"
LHS.38.a:0 "咔嗒。"

LHS.39.t:0 "雨幕下的裂痕"
LHS.39.d:0 "湿热的山谷像一口发酵的巨锅，腐肉的甜腥味混杂着雨前的土腥气，浓稠得令人窒息。雪伊一脚踹开指挥所的破门，狂风裹挟着暴雨，将作战地图打得哗哗作响，重重贴在满是水渍的桌面上。\n“等？”她指着地图上猩红的标记，浑身蒸腾着雨水与怒气，“外面的亡灵不需要休息，可咱们的人在泥水里泡烂了脚！你能用‘等’字把那些怪物喂饱吗？”\n晓枫背对着门口，望着窗外那片在雨幕中若隐若现、如同白色霉菌般蔓延的尸潮。“在这片林子里扑火，烧死的是我们自己。”她转身，指关节叩在地图受潮的标记线上，声音平静得像一潭死水，“不是不战。是拖垮它们的关节，烂掉它们的皮肉。它们在泥沼里爬得越远，崩溃得就越快。”\n一声闷雷滚过天际，震得屋顶漏下的雨水连成线。晓枫眼神纹丝未动：“传令：三、七兵团，即刻放弃奇拉山口伏击点。执行撤退计划，南移。”\n“放弃奇拉山口？”雪伊一把攥住她胳膊，指甲陷进湿透的军装，“山口后有多少没跑出来的村子，你难道不清楚？！你撤兵，就是把她们扔进绞肉机！”\n晓枫的手臂硬如铁砧，任由雨水顺着脸颊滑落：“死守山口？我们就是烂泥里的那根稻草，一压就断！撤，保的是主力！给乡亲挣的是活命的空间！得让那些骨头架子陷进烂泥里……”\n“空间？乡亲们抱着崽缩在雨里，等的是你敲碎亡灵的脊梁骨！不是等它们啃干净了再来啃我们的心！”她抓起桌上那张签了一半的撤退令，“你来签！签给那些在泥水里挣扎的娘们孩子看，看看她们的总参谋多会算计！”\n湿漉漉的纸张像死鱼一样拍在桌上。雪伊撞门而出，冲进滂沱大雨。\n门外，她揪住浑身泥浆的传令兵：“……通知山脚。放弃山口……转移。就说……”喉结艰难滚动，雨水流进嘴里，咸涩得像血，“用空间……换胜机。”每一个音节都像是从肺里撕扯出来的。雨声吞没了一切，门缝里，晓枫的剪影在昏暗的灯光下凝固。雪伊摊开掌心，指甲在皮肉里抠出了血槽。"
LHS.39.a:0 "立刻撤退！"

LHS.40.t:0 "奇拉山口的爆响"
LHS.40.d:0 "暴雨如注，冲刷着滑腻的岩壁，空气中弥漫着烂泥与尸骸的腥气。雪伊蹲在雨幕后的巨石下，用牙齿撕开被泥水浸透的绷带，勒紧手臂上的伤口。撤退令像块冰冷的石头压在胸口，但山下隐约传来的哭喊声更烫人——那是被遗忘在计划之外的老磨坊村。\n“头儿，”小果子抹了一把脸上的泥浆，匍匐过来，“主力已经按参谋长的命令撤进优谭了。亡灵的大队追过去了，可……奇拉山口那边还有支骸骨骑兵，正朝老磨坊村兜过去！”\n雪伊没说话，猛地勒紧绷带，剧痛让她的眼神更加清明。“晓枫的‘大胜’里，不该有磨坊村的血。”她抓起脚边用油布包裹严实的炸药管，粗糙的引信磨着掌心，“小果子，带着你的队伍，去南边优谭。”\n“那您？”\n“我？”雪伊把引信捻子叼在嘴里，在那张满是雨水的脸上扯出一个狰狞的笑，“我去给那群怕火的骨头架子……点个‘篝火’，让它们看清楚谁才是该追的肉！”她一把扯下袖章塞进小果子怀里，“告诉晓枫，她算她的账，我救我的人。磨坊村的命，不能算在她那张地图上。”\n雨水在狂风中乱舞。雪伊的身影消失在雨幕深处。片刻后，奇拉山口方向传来一连串沉闷却剧烈的爆炸，火光在雨夜中撕开一道猩红的口子，腾起的黑烟混杂着骨骼碎裂的锐响。那股活人生气的挑衅，瞬间激怒了亡灵，一支骸骨骑兵嘶鸣着脱离了追击主力的洪流，疯狂扑向爆炸点。\n优谭狭窄的入口处，晓枫举着望远镜。她看见那股本该咬住主力侧翼的骸骨骑兵突然转向，被北面山口的火光死死吸引。镜片后的瞳孔骤然收缩，那个爆炸点，精准地卡在磨坊村退路的上游，像一颗钉子楔进了敌人的咽喉。\n“参谋长？”副官疑惑地看着突然在暴雨中停步的主力前锋。\n晓枫放下望远镜，指关节捏得发白，雨水顺着她苍白的脸颊滑落。湿润的空气里飘来一丝劣质炸药特有的、刺鼻的硫磺焦糊味，混杂着令人心悸的血腥气。“……计划不变。”声音冷硬得像被雨水淋透的铁，目光却死死钉在北方那团在雨中挣扎的火光上。\n河流卷着浑浊的浪花奔腾而下，一段烧焦的、染血的绷带在漩涡中一闪而过。那是雪伊早上刚撕下来裹伤口的布料。"
LHS.40.a:0 "继续执行作战计划"

LHS.41.t:0 "躁动的亡潮"
LHS.41.d:0 "浑浊的雨点砸在油布上，闷雷碾过优谭峡谷。晓枫浸透的军装紧贴脊背，寒意刺骨。她盯着峡谷入口，水流裹着泥沙冲下陡坡。\n“参谋长！”观察哨兵的声音劈开雨幕，“山口……奇拉山谷方向！亡灵主力分兵了！近半骸骨骑兵突然转向北，直扑奇拉！”\n“奇拉？”晓枫的指尖瞬间掐进掌心。“那不是计划里的饵！那方向只有……”\n“雪伊带着零散小队在干草崖虚张声势的爆响！是为了引开扑向磨坊村的散兵！怎么会扯动整个骸骨骑兵集群？”\n她的望远镜猛地抬起。越过雨幕，穿过谷口弥漫的水汽。奇拉山谷低矮的隘口处，腾起的黑烟格外浓烈，在雨中顽固地扭成巨大的、不祥的蘑菇云。雨声似乎吞没了一切，但亡灵骑兵那锈铁摩擦般的嘶吼仿佛穿透了空间，带着一种发现活人血肉的、纯粹疯狂的饥饿！\n糟了！晓枫的心脏骤缩如铁，那不是寻常的炸药！雪伊动用了库存的腥油燃烧弹！那种用腐烂的动物油脂和矿物炼制的玩意儿烧起来，其裹挟的浓烈污浊血气，对亡灵是足以点燃灵魂深处吞噬本能的毒饵！\n“头儿……搞太大了……” 小果子趴在晓枫脚边的泥水里，牙齿打颤，“雪伊姐……把奇拉当灶台点了？这种味……骨头渣子隔着几座山都闻得到！”\n晓枫猛地回头，雨水顺着她绷紧的下颌线砸落。峡谷深处的河流开始反常暴涨，浑浊的浪头冲击着她们预设渡口的地桩。“机会！”这个词几乎是挤出牙缝。亡灵主力的侧翼被这致命的香气凶猛地拽向奇拉，就像贪食的饿鬼扑向唯一的血肉祭坛，露出了通往优谭上游渡口那条窄得几乎无法容大军通过的绝路！\n“命令！”晓枫的声音撕裂雨幕，冰冷中烧着熔岩，“一兵团重火力，咬住正面骸骨步兵！给我钉死在原地！工兵爆破组，在优谭下游预设渡口……执行原定预案，就现在！主力！渡河！抢上游干河道！快！”\n洪水般的部队扑向狭窄石道。雨声、浪声、吼声震天动地。晓枫最后瞥了一眼北方奇拉山谷那遮天蔽日的腥臭烟柱，喉咙滚动了一下。\n雪伊……你这个疯子，干得好啊！"
LHS.41.a:0 "随我向前！"

LHS.42.t:0 "在火焰尽头"
LHS.42.d:0 "浊浪拍击着裸露的河床石壁。部队像疲惫的伤兽，沿着优谭上游骤然显露的干涸旧道，手脚并用地向上挣扎。雨点砸落，水汽蒸腾，盖不住浑身散发的焦土汗腥气。\n晓枫立在泥泞的河床边缘，靴底碾着滑腻的青苔石。浑浊的水流在脚下几十米深的谷底咆哮。最后一批战士终于踉跄着踩上对岸，扑倒在湿漉漉的草坡上，像散了架。\n“参谋长……”小果子挤到她身边，浑身泥猴似的，手指痉挛地攥着自己湿透的衣角，声音被雨泡得发抖，“刚才奇拉山谷的烟……那火油的味道太冲……夜莺亡灵像疯狗扑过去……雪伊姐她们……守得住吗？”\n晓枫没回答。她的视线越过脚下幽深的河谷，死死攫住北方。奇拉方向那片被暴雨洗刷过的天空，灰沉沉的，只有一缕微弱的、扭曲的黑烟，被强风撕扯得几乎看不见，像垂死者最后一口浊气。之前那直冲云霄的浓重腥云，没了。嘶吼声也沉入雨幕，只剩下空洞的风啸。\n冷。比河底的冻水更冷的寒意，从她的脊椎缝隙里钻出来。雪伊……把整个奇拉点成个活人烽燧，用烧焦尸油的血腥味引得亡灵大军彻底癫狂。那烟熄了，只意味着……要么饵被吞尽了，要么骨头架子连那点燃烧余烬都啃光了。她甚至不敢深想雪伊留在那的目的是撤退……还是把自己烧成最后一束光。\n河水奔涌撞击石壁的闷响，撞得人耳膜发疼。旁边草坡上传出压抑的、后怕的呕吐声，分不清是雨水还是泪水糊了战士们的脸。这是生路？还是把她们亲手点燃的同志，亲手喂进了更深的深渊？\n晓枫的喉结剧烈地滚动了一下，像吞下块棱角分明的碎石。攥着望远镜的指尖压得雪白，指骨似乎要透过皮肤刺出来。她猛地一扯身上湿透的军装领口，布料发出一声不堪重负的撕裂声。\n“全体！隐蔽休整！”声音劈开雨幕，铁片刮过骨头般冷硬，压下了所有抽气声。下一句，一个字一个字地砸进泥水里，凿进每一个魂还没归位的战士耳朵里：\n“盯着北面奇拉的方向。火熄了，烟散了，”她的声音淬着火，也淬着冰，“骨头渣子们该饿了。它们迟早会找到这条干涸的血槽……在它们舔到河岸的烂泥之前……”她抬起满是泥泞水痕的脸，目光像两把淬了寒霜的刺刀，扫过每一张惊魂未定的脸，钉进谷口更深的黑暗中："
LHS.42.a:0 "给我把喘气的力气，全憋回刀刃上！"

LHS.43.t:0 "逆流的援手"
LHS.43.d:0 "暴雨鞭笞着裸露的河床。部队沉默如石，压抑在优谭上游的拐弯处。每一张被雨水冲刷的脸上，都烙着奇拉山谷熄灭火焰后的死寂。\n“东南坡！”观察哨的嘶喊撕破雨幕，带着难以置信的颤抖，“奇拉对岸！有人！”\n晓枫的望远镜瞬间锁死。翻滚的浊浪边缘，一片狼藉的泥石流崩塌带上，几个渺小的黑点正死死扒住湿滑的岩缝！领头的那个，褴褛的军装撕掉了左袖，整个左肩缠着浸透血泥的布带，右臂爆出青筋，竟硬将一个昏迷的战士死死顶在塌方上方一块半悬的巨石边缘。\n是雪伊！洪水咆哮着，裹挟巨石疯狂撞击她脚下的岩体，每一次碰撞都让那块立足之地剧震摇晃！\n“洪水冲垮了山壁！塌方区暂时阻断了亡灵绕后包抄的爪子！”晓枫的声音像淬火的铁，瞬间穿透绝望，“它们的主力被这血腥气钉死在西北坡啃噬废墟！这就是给我们留的口子！”\n她猛地转身，雨水从军帽帽檐串珠般砸落：“一兵团！急行！绕穿克纳尔，抢占西北方，洪水掏空的石台就是我们的炮位！”\n目光锐利地刺向小果子：“海军突击队！索降装备！带上所有钩索，跟我走！顺着上游干河道滑下去！抢在她们被泥流吞掉前，给我接回来！一个也不能少！”每一个字都斩钉截铁。\n洪水如怒龙。雪伊将最后一个战士拖上巨石，自己脚下的石块却在洪水持续的冲撞下轰然崩裂！身体不由自主地向后倒去，脚下是翻滚着断木和巨石的死亡旋涡！\n“头儿——！”几道绳索带着锐利的破空声，如灵蛇般从上方陡峭的干河岸甩下！冰冷的合金挂钩精准地钉在雪伊身侧的岩缝里！一只强有力的手几乎在她滑落的瞬间狠狠抓住了她的右腕，硬生生将下坠之势顿住！\n小果子倒挂在绳索上，雨水顺着她的长发流进脖颈，咬着牙吼：“抓紧！参谋长命令，一个同志都不能少！”\n对岸，西北方向峭壁之上，隐约的黑点正在急速移动、布防。洪水的轰鸣声中，晓枫的身影似乎站在最高处，望远镜正死死盯着这片生死悬索的塌方区。\n雪伊抬起头，雨水冲刷掉糊眼的泥浆，血丝密布的眼睛望向对岸峭壁上那个模糊却无比坚定的剪影，嘴角扯出一丝近乎狰狞却支撑了她整个坠落的力量。她反手，死死握住了绳索上冰冷的手。"
LHS.43.a:0 "全军急行，包围敌军！"

LHS.44.t:0 "风沙裂谷"
LHS.44.d:0 "风像裹着沙砾的鞭子，抽打着干涸的地壳。雪伊伏在龟裂的裂缝里，手指勾着信号枪的扳机，冰冷的金属触感传递着蓄势待发的力量。她身后，赤色部队紧紧贴地，风霜染白她们的眉毛，每双眼睛都穿透呼啸的灰黄沙幕，死死锁住远方地平线上那片涌动的不死浪潮。\n“等那些骨头架子把骨腿都陷进烂泥里！” 雪伊的声音被风撕扯得断断续续，却字字钉进风里，“就打信！”\n望远镜筒被沙砾敲打着。视野里，庞大的骨象队列在黄土中特有的、看似硬壳实则稀软的泥地越陷越深，象骨沉重地插进泥里，每一次拔起都带出大团腥臭的黑泥，拖拽的炮管倾斜得像要折断。整支左翼如同陷进巨大胶水的虫群，发出无声的挣扎。更远处，密集的亡灵步兵方阵在那片相对坚实的高地上越挤越密，像一片惨白的骸骨丛林。\n突然！三发刺目的红色信号弹撕裂浑浊的沙尘天幕！仿佛沉睡的巨兽被惊醒！轰隆——！\n泥地深处！几处被伪装覆盖、精心测算的薄弱稀泥地瞬间连环崩塌！浓稠如墨的深层盐卤泥浆冲天而起！那几头拖在最前面的骨象连同沉重的骨炮瞬间被翻涌上来的黑泥裹挟、吞没！泥浆带着强烈的腐蚀性，所过之处白骨冒出青烟，滋滋作响！骷髅部队结构性的脆弱暴露无遗，前排的陷落与泥浆的冲击引发了后面方阵大范围的、混乱的连锁崩溃！\n“撤！”雪伊果断收枪，受伤右臂爆发出惊人的力量，拉扯身旁的战士，“让它们挤！挤得越多，烂泥坑吃得越撑！”部队如退潮般滑下沟壑，迅速隐没在狂舞的沙墙之后。留下那片骸骨深陷、泥浆沸腾的地狱景象。空中弥漫着骨头被腐蚀的刺鼻焦糊和浓重的卤腥味。\n数里外，王都西南侧的灰色秃岩山脉沉默如山。晓枫立在一处风蚀出的岩柱高处，望远镜牢牢锁定那片本应“开阔无敌”的方向，王室自以为牢不可破的前庭！此刻正被它倾注期望的不死军团自身陷入泥潭和连环崩溃彻底锁死！\n远方天空，那三颗红色信号弹的光芒被沙尘彻底吞没。\n没有丝毫犹豫。晓枫右手向下，猛地一劈！"
LHS.44.a:0 "杀！"

LHS.45.t:0 "直到那一天到来"
LHS.45.d:0 "黄昏像一块吸饱了陈血的脏抹布，沉甸甸地盖在王宫广场的废墟上。\n这里没有欢呼。甚至连呼吸声都微不可闻。数万名野火战士伫立在硝烟未散的余烬中，像是一群被高温烧结成陶俑的亡灵。她们的军装早已看不出本色，那是泥浆、机油与战友，空气黏稠得令人窒息，充斥着焦糊的蛋白质味和刺鼻的铁锈腥气。\n雪伊靠在一根断裂的大理石柱旁，半张脸被一块狰狞的黑褐血痂覆盖，像是一道将她劈开的裂痕。她的瞳孔涣散，目光死死地、却又毫无焦距地盯着脚下——那里有一块镶嵌着红宝石的王座碎片，正浸泡在污浊的血水里。\n赢了吗？这种念头在所有人脑海中仅仅闪过一瞬，便被巨大的、空洞的疲惫吞噬。这一刻，活着似乎比死去更沉重。\n直到那个身影动了。\n晓枫拖着沉重的军靴，一步，一步，踩着黏腻的血浆，走向那座坍塌的权力巅峰。靴底与血泥的摩擦声，在死寂中竟如雷鸣般刺耳。她站上了那座扭曲变形的黄金基座，孤身一人，却仿佛背负着身后万千亡魂的注视。\n她俯视着这片灰色的死海，眼底最后一簇未熄的余烬，在这一刻爆燃成燎原的烈火！\n“——哑巴了吗？！同志们！！！”\n所有人麻木的神经被猛然通过的电流击穿！雪伊浑身一震，那只剩下眼白的瞳孔骤然聚焦，死死锁定了那个站在废墟之巅的身影。\n晓枫猛地张开双臂，那是拥抱死亡的姿势，更是拥抱新生的姿势！她指着脚下的废墟，指着天边的残阳，声音嘶哑到破裂，却震撼着每一个细胞：\n“看看你们脚下！看看这堆破铜烂铁！那是吃人的王座！那是压了我们千年的大山！现在——它碎了！”\n“你们为什么不叫？为什么不笑？你们要把这口气憋到什么时候？憋到我们也变成那群不会说话的亡灵吗？！”\n她的手如同一把劈开黑暗的利剑，狠狠挥下：\n“庆典！就在此时！就在此地！用你们还热着的血，去冲刷这冰冷的石头！告诉那些黎明前倒下的兄弟，告诉这该死的老天爷——我们，活下来了！！”\n“吼出来啊！！让那些旧世界的幽灵，在活人的狂歌里颤抖至灰飞烟灭！！”\n死寂，在这一秒崩塌。\n最初是一声压抑到极点的、类似野兽的呜咽。紧接着，第二个，第三个……那是从胸腔最深处被硬生生挤出来的咆哮，是泪水冲刷过满脸烟灰后的纵情宣泄！\n“起来——！！”\n沙哑的破音汇聚成洪流，那是复仇者的凯歌，更是幸存者的哭嚎！\n“……歌唱！！我们走向胜利！！！”\n硝烟在声浪中战栗，暮光被泪水折射成金红。晓枫站在废墟之巅，看着下方那片沸腾的、哭泣着、咆哮着的人海。\n那是莉兰迪亚的脉搏，终于重新跳动了。"
LHS.45.a:0 "团结的人民永远不会被击溃！"
LHS.46.t:0 "废纸上的新墨"
LHS.46.d:0 "焦黑的王宫办公室，墙面上还嵌着子弹头。雪伊把最后几本印着王室纹章的文件扔进铁皮桶，火焰舔上来，映着她平静到凝滞的脸。她没看对面的晓枫，声音干得像烧尽的灰：“今后，你带着大伙走。”她擦净一把缴获的贵族手镜，“啪”地扣在还沾着灰的办公桌上。“我……不适合。”她手指关节发白。\n镜面映出晓枫的轮廓，额角未愈的伤口刚结痂。她没有碰那面镜子，只是从焦糊的窗帘后面拖出一个没坏的木质文件箱，尘土扑簌簌落。“这栋楼里飘的都是旧魂，她们怕的不是枪炮。”她从箱底抽出沓空白硬纸，是贵族们用来封装礼物的厚卡纸，空白、挺括、没有印记。“怕的是这个。”她把纸按在桌面，发出闷响。\n“她们怕新秩序在废纸上写新规矩。怕你，你那双能把镀金谎言从皮上剥下来的手。”晓枫直视她，眼神锐利如刺刀，“雪伊，没人比你更懂哪里藏着蛀洞。重建？新楼谁都能画。可我需要的，是那幢烂房子怎么才不会再塌的图纸。”她手指用力划过卡纸，像在切开什么。“谁竖牌坊，谁掏门柱，谁在地基下偷偷塞烂木……你一眼就能挖出来。”\n“以后打仗不一样……”雪伊皱眉，那半边脸颊的血痂随动作绷紧。\n“战场？”晓枫突然截断，声音陡然拔高，“你仔细听听！楼道里！那些争抢办公室的脚步声！算军功排座次的吵嚷！废墟上还没清干净呢！她们就像旧王室的耗子换了个窟窿！没有你那双钉死蛆虫的眼盯着……”她猛地抄起那面冰冷的贵族手镜，镜柄硬生生扎进木桌一角立着。“没有你替我拆穿那层新粉刷的脸皮！这个新名头，”她指了指自己，“‘新领袖’也好，‘总指挥’也罢，跟这破镜子有什么两样？不过是个好点的摆设！”\n硬卡纸被风卷起一角。雪伊看着那镜子里扭曲晃动的焦黑屋顶，沉默良久。终于，她的手按上那叠空白厚卡纸，压在晓枫的手背上。没有交情，像安放一块基石。两双沾过无数血与灰的手，叠在空白的纸上方。文件桶里最后一点王室纹章化作红亮的火星，倏忽灭在黑暗里。窗外嘈杂的人声远远传来，像地底涌动着模糊的新声浪。桌上，那叠厚实的空白卡纸沉稳地压住了一缕穿堂风扬起的贵族名册残片——它们皱巴巴蜷缩着，等待变成垫桌角或包干粮的废纸。"
LHS.46.a:0 "一切都只是开始"
LHS.47.t:0"铁证烙骨"
LHS.47.d:0"录音机在桌面上嗡嗡颤动。电流的嘶鸣，像是从一座刚刚封死的坟墓深处，艰难挤出的一丝残响。\n磁带是雪伊的人昨晚从东部边境带回来的。裹在冰冷的塑料布里，上面还印着一个已经干涸发黑的、小小的手印。\n“……我儿……背上……”一个嘶哑的女声，像碎石碾过生锈的铁轨，从喇叭里传出。\n”……有烙铁印……夜莺狗说……这矿，是它们的了……我儿……就成了矿机上的一个……关节……死了，也拆不下来……跟链条……焊在一起了……”\n声音被一阵尖锐的、如同骨头摩擦金属的啸叫打断。\n几秒钟后，是更沉的、仿佛用尽最后一口气吐出的肺音。\n”……昨夜里……我摸过去……只摸到……他半张脸……冰凉……眼窝是黑的……还穿着……那件破了洞的汗衫……照片？”\n那声音，突然爆发出一种扭曲的、分不清是哭是笑的抽气声。\n“……呵……骨臂矿场深处……那些死掉的链条上……挂满了那样的‘人零件’……都……认不出原来的爹娘了……”\n录音，在一声仿佛脖颈被骤然勒断的、窒息般的闷响中，戛然而止。\n死寂。\n会议桌上，煤油灯的火苗在颤抖，将墙壁上每一个沉默的身影，都拉扯成巨大而扭曲的怪物。\n雪伊的手指，死死地按着停止键，指关节因为过度用力而失去了所有血色。\n晓枫没有看任何人。她只是盯着那台老式录音机还在微微震颤的铁皮外壳，仿佛那不是一台机器，而是一尊……盛满了无边血污和人骨碎渣的、滚烫的棺椁。\n窗外，雨后的泥地泛着黑亮的光，像一片凝固的血。\n桌子尽头，一个刚从前线调回的兵团政委，猛地抬起头。她浑浊的眼珠里，烧着两点骇人的火星。她缓缓地，用拳头，将桌上那盏灯投下的、摇曳不定的影子，砸得粉碎。\n声音干哑，如同崩裂的岩石。\n“……铁链，焊在骨头上。”\n她抬起头，环视着每一个沉默的同志。\n“夜莺……它们想要的，不是我们的土地。它们想要的，是把我们每一个人，都变成它们那台巨大机器上，一个可以随时替换的、会痛，但不会说话的零件。”\n一股冰冷、粘稠，却又无比清晰的意志，如同从矿洞最深处凝结而成的、淬了火的冰棱，第一次，沉甸甸地，扎进了公社的心脏。\n——这不是一场关于解放或征服的战争了。\n这是一场……关于“人”与“非人”的战争。\n要么，砸碎那台将血肉与钢铁焊在一起的、名为“夜莺”的机器。\n要么，我们所有人，都心甘情愿地，成为它永恒转动的齿轮。\n没有第三条路。"
LHS.47.a:0"夜莺..."
LHS.48.t:0"藤蔓下的低语"
LHS.48.d:0"暴雨砸在废弃糖厂龟裂的混凝土屋顶上，声如擂鼓。风卷进破窗，带着铁锈和一股陈旧的、略带草药味的甜香。晓枫伏在锈蚀的送料斗边缘，望远镜片被雨水模糊又擦干。她来此地，是为了寻找三天前失去联络的那个侦察兵小队。一股冰冷的直觉顺着脊椎爬上来，比雨水更刺骨。这里的气息，是一种古老的、与这片大陆格格不入的肃穆感。\n镜头猛地定在工厂下方的巨大沉淀池上。池子早已干涸，池壁上爬满了粗壮的、带着荆棘的藤蔓。池底中央，一群身影正围着一座用石头和藤蔓临时搭建的祭坛，进行着某种仪式。她们的身影在摇曳的火光下显得格外清晰。\n一部分，是身形高挑、耳朵尖长的纯种妖精。她们身着朴素的亚麻长袍，神情庄重，如同祭司，监督着仪式的进行。\n而另一部分，则是跪在地上、负责所有粗重劳作的身影。她们的身材更接近人类，耳朵略尖，眼神里充满了麻木与疲惫。是半妖精。她们正将一筐筐散发着怪异香气的草药投入火中，口中低声吟诵着单调的祷文。\n晓枫的手指，几乎捏碎了望远镜的镜筒。\n在那些被迫劳作的半妖精之中，她看到了一个熟悉的身影。那件撕烂的、沾满泥污的公社侦察兵外套，在此刻显得无比刺眼。她的侦察兵，正被两个纯血妖精卫兵按着肩膀，被迫跪在地上。她的脸上，带着屈辱和愤怒。\n就在这时，一个负责搬运草药的年轻半妖精，因为体力不支，踉跄了一下，将筐里的草药洒了一些在地上。\n一个负责监视的纯血妖精祭司，缓缓地走了过去。她没有斥责，也未举起武器。她只是，伸出一根苍白的手指，轻轻地点在了那个半妖精的额头上。\n一圈微弱的、仿佛能吸走生命的惨绿色光环，在指尖亮起。\n那个年轻的半妖精，连一声惨叫都未能发出，身体便剧烈地抽搐起来，整个人迅速地变得干瘪、枯萎，仿佛体内的所有水分和生命力，都在瞬间被抽干了。几秒钟后，她就化作了一具干尸，倒在了泥水之中。\n而那个祭司，则像做了一件再也平常不过的事情，收回了手指，转身走开。\n雨水顺着晓枫冰冷的脸颊滑下。一个全新的、比夜莺之国的白骨更令人不寒而栗的、安静的恐怖，永远得烙印在了她的眼睛里。"
LHS.48.a:0"妖精..."
LHS.49.t:0"来自莉兰迪亚公社的补偿清单"
LHS.49.d:0"午后的瓦尔哈拉社接待室，阳光透过彩色琉璃窗，在打磨光滑的石砖上投下温暖光斑。空气里，弥漫着古老圣遗物和陈年卷宗的、宁静而庄重的气息。几位身着红色边饰礼服的神社干部正襟危坐，等待着那位传说中的、覆灭了南美诸多怪物的南美革命者——晓枫。\n门开了。进来的年轻女子，让习惯了繁复礼节与华丽辞藻的干部们微微一怔。她只穿着磨损的野战服，一头略显凌乱的短发，脸颊还有未擦净的烟尘。她只是微笑着，对她们点了点头，仿佛不是来外交谈判，而是来拜访一位许久未见的老朋友。\n她将那个漆皮剥落大半的老旧皮包，轻轻地放在了光洁的会议桌上，发出了一声沉闷的、属于皮革与实木的碰撞声。\n“抱歉打扰了，同志们。”她没有坐下，只是拉开椅子，站着说，笑容像窗外的阳光一样，毫无阴霾。“在喝茶之前，我们先把一些旧账，算清楚，怎么样？”\n她从那个破旧的皮包里，拿出了两本同样磨损的小册子，并排推到了桌子中央。\n“这一本，”她指了指左边那本，“是艾尔孚利登的人民，一笔一笔记下的，在她们最困难的时候，贵社所援助的所有物资清单。这份恩情，我们永远铭记在心。”\n干部们的神情，稍微舒缓了一些。\n“而这一本……”她的手指，轻轻地，敲了敲右边那本册子，“是贵社的战士们，从艾尔孚利登的宫殿和神庙里，‘保管’走的文物清单。”她特意在“保管”两个字上，加重了语气，眼神里闪过一丝狡黠，“吃了人家的米粮，总不能……再把人家的碗也一起端走吧？”\n接待室里，一片死寂。预想中的唇枪舌剑并未发生。这个看似风尘仆仆的女子，用一种最简单、最直接，甚至有些俏皮的方式，将她们置于了一个无法辩驳的、尴尬的境地。\n晓枫收起了那两本册子，又从包里，拿出了第三本、崭新的、封面印着红色星辰与野火标志的手册。\n“账算清了，现在，我们可以谈谈未来了。”她眨了眨眼，笑容依旧爽朗，“比起守着那些旧世界的宝藏，去亲手创造一个崭新的世界，不是……更有趣吗？”\n当晓枫告辞的身影消失在门外，干部们才从那份直刺本质的“补偿清单”和那句云淡风轻的邀请中缓过神来。空气中，仿佛还残留着泥土和硝烟的气息。她们望着桌上那份崭新的、关于世界革命的邀请手册，第一次感到，自家那些散发着神圣光芒的圣遗物，在那个破旧的皮包面前，显得有些……过于安静了。"
LHS.49.a:0"为了世界革命，加入她们！"
LHS.49.b:0"我们有着自己的理想。"
LHS.50.t:0 "委员会首映礼"
LHS.50.d:0 "崭新的总仓库被临时征用为会场，四处堆叠着尚未归类的弹药箱与军毯。首届“世界革命委员会”成立仪式正肃穆进行，直到主席台侧面的晓枫突然打了个响亮的喷嚏，手里刚装订好的《临时管理条例初稿》仿佛被轰炸机编队精准命中，哗啦一声，天女散花般漫天飞舞！\n“晓！枫！”雪伊的怒吼如同防空警报撕裂了会场。她像猎豹般蹿下主席台，军靴几乎在水泥地上踩出火星。袖章上崭新的委员长徽记与此刻扭曲的杀气形成了残酷的对比。“昨晚的文件归档训话全喂狗了？！这是革命纲领！不是草纸！编号文件第几页跟武器清单贴一起了？！”她捏着一张写满潦草符号、还沾着机油印的武器库记录纸，气得声音发颤。\n“报告雪伊同志！”晓枫笑嘻嘻地蹲在地上拢着纸页，毫无悔意，“武器清单背面记着今早的巡逻路线呢！这叫效率！双面利用！”她顺手从旁边的弹药箱上抠下半截粉笔头，“后勤部说笔墨限量，理解一下嘛～哦对！”她忽然从军装内袋掏出一张折成豆腐块、边缘焦糊的纸，像变魔术般炫耀道，“差点忘了！重要机密！缴获的王室宫廷画师素描稿！”唰地展开，赫然是雪伊昨天在指挥部抓狂训人的速写，夸张的Q版怒容活灵活现！\n“晓！枫！同！志！”雪伊耳根瞬间通红，头顶几乎具象化地喷出蒸汽。她劈手去夺，晓枫敏捷地一个战术翻滚躲开，边跑边嚷：“委员长阁下请注意仪态！这是历史文物！代表官僚主义的可笑消亡！”纸片在两人间飞舞。后排一个娃娃脸技术员终于憋不住，“噗嗤”一声，像点燃了引信，整个仓库瞬间爆发出一阵哄堂大笑！连黑着脸追捕的雪伊都差点被这洪流般的笑声掀得踉跄，只能撑着膝盖咬牙宣布：“休会十分钟！还有，晓枫！今天之内按编号理清文件！否则明天你的配给军毯就给这堆文件当垫子！”角落里传来弱弱的声音：“报告……晓枫同志的军毯昨天捐给野战医院了……”\n窗外阳光正好，照亮了散落一地的文件和追逐的身影，还有整个南美洲在战火尘埃里第一次自由呼吸的、欢畅的笑声。"
LHS.50.a:0 "一切安好"
##
LHS.501.t:0"铁骨铮铮向太阳"
LHS.501.d:0"隐蔽的修械所里，焊枪喷吐着耀眼的蓝火，空气中弥漫着焦糊的橡胶味和刺鼻的铁锈气。\n\n晓枫站在一辆刚刚“改装”完毕的怪兽面前。那原本是一辆负责拉煤的旧卡车，现在，它的驾驶室被厚重的锅炉钢板死死焊住，车斗里架起了缴获的重机枪，轮胎外侧甚至挂上了几层防弹用的旧履带片。\n\n“它很丑，参谋长。”一位满脸油污的老技工有些局促地搓着手，“转弯费劲，跑起来像头喘气的老牛，而且里面的温度能把人蒸熟。”\n\n晓枫走上前，伸手抚摸着那道粗糙狰狞的焊缝。那是从被炸毁的工厂废墟里扒出来的钢板，上面还残留着上一场战斗的弹痕。\n\n“不，它很美。”晓枫轻声说道，眼神里闪烁着一种只有在看着战友时才会有的温柔，“它意味着我们的侦察兵不用再骑着马去撞敌人的机枪阵地；意味着我们的伤员在撤退时，能有一层铁皮替她们挡住背后的冷枪。”\n\n雪伊从车顶跳了下来，用力拍了拍那厚实的装甲，发出“哐”的一声闷响。\n\n“管它像拖拉机还是像移动的棺材！”雪伊大笑着，眼里却泛着泪光，“只要能把我的兵活着带回来，这就是咱们的‘铁骑’！传令下去，把所有的废铁都给我收集起来！既然没有坦克，我们就自己焊出一支钢铁洪流！”\n\n在这个物资匮乏的寒冬，野火的战士们用废料和意志，为自己锻造出了第一副……粗糙却坚硬的铠甲。"
LHS.501.a:0"我们有更好的选择。" 
LHS.501.b:0"让敌人在我们的“废铁”面前崩掉牙齿！" 
##
LHS.51.t:0"“最高”指示？"
LHS.51.d:0"夜幕降临，兵工厂白天的喧嚣沉淀下来，只有角落里巨大的锻造炉还燃烧着橘红色的余火，权当是今晚的篝火。\n雪伊清了清嗓子，将一张崭新的步枪设计图摊在油腻腻的工作台上，表情严肃得像是在宣布作战总动员。“同志们，根据参谋部对现有武器耗损率和人体工学数据的综合研判，我们决定对下一批次的步枪进行如下三点优化……”\n她话音未落，底下几个满身机油的老技工已经露出了和听天书没两样的迷茫神情。\n“咳咳！”晓枫突然从一个老师傅身后探出脑袋，笑嘻嘻地抢过那张图纸，“雪伊同志的指示翻译一下就是：咱们这新枪，得让它像咱们食堂大厨烤的肉串一样！”\n“晓！枫！”雪伊的眉毛拧成了麻花。\n晓枫把图纸往工作台上一拍，用粉笔在旁边画了个歪歪扭扭的肉串。“你看啊，这枪管不能太重，不然战士们端着跑几步就累了，就像肉串的签子，太粗了硌牙，对吧？”\n工人们顿时哄笑起来，气氛立刻松快了。\n“还有这个供弹结构，”晓枫又指着图纸上一个复杂的部分，“现在太折腾，得改成一插就完事儿的，就像撒调料，唰一下，齐活！简单！痛快！”\n“我懂了！”一个满脸油污、被称为扳手李的老师傅一拍大腿，“晓枫同志的意思是，这卡榫得加个导向槽，一摸就知道正反，闭着眼都能换弹匣！就像撒孜然，闻着味儿就不会撒成辣椒粉！”\n“对对！”旁边一个年轻的女工也举手，“那枪托的弧度也得改，现在的太直，顶在肩膀上不舒服，硌得慌！得像咱们坐的这条长凳，有点弧度才贴身！”\n雪伊看着瞬间变成“新型步枪吐槽大会”的现场，一张张兴奋的脸在炉火的映照下闪闪发光，图纸上很快被各种粗糙的粉笔标记和油乎乎的指印占满。她原本紧绷的脸不自觉地柔和下来，抱起手臂，靠在冰冷的机床上，小声嘀咕：“……胡闹。但好像……确实比我讲得明白。”\n最终，那份最高指示被彻底篡改，变得面目全非，却无疑会成为一把更好用、更受战士们喜爱的步枪。炉火旁，不知是谁从热灰里扒拉出几个烤得香喷喷的红薯，笑声、讨论声和红薯的甜香混着机油味，飘散在温暖的夜色里。"
LHS.51.a:0"这才是我们的委员会" 
LHS.52.t:0"南风中的低语"
LHS.52.d:0"今日的神社，空气中弥漫着与平日不同的气息。并非圣遗物共鸣时那种纯粹的能量波动，而是一种……更复杂的、混杂着硝烟、泥土与某种炽热理想的味道。\n通报官的声音还带着一丝未散去的惊奇：“莉兰迪亚联盟，晓枫同志，请求会面。”\n当她走进正殿时，所有人的目光都不由自主地被吸引过去。她只穿着一身洗得发白的、略显宽大的衣裳，肩上斜挎着一个磨损的皮质挎包，里面鼓鼓囊囊地塞满了卷轴和书本。她的短发被风吹得有些凌乱，脸上还带着旅途的风尘，但那双眼睛，却像暗夜里最亮的星辰，清澈、专注，又带着一丝难以言喻的、仿佛看透了无数故事的沧桑。\n她没有像其他使节那样，先行礼，再呈上复杂的国书。她只是微笑着，从那个旧挎包里掏出了一样东西——是一捧用粗糙麻布包裹着的、还带着湿润泥土的深红色豆种。\n“这是‘莉兰迪亚之心’，”她似玩笑般得开口道，声音不高，却异常清晰，如同山涧清泉，“在我们最艰难的时候，就是靠着它，让战士们在冻土里吃上了第一口热汤。它很普通，需要阳光、水和勤劳的双手，但只要种下去，就能在最贫瘠的土地上结出果实。”\n她将那包豆种轻轻放在铺着天鹅绒的会议桌上，那朴素的麻布与周围华丽的陈设形成了强烈的对比。\n“我听说，瓦尔哈拉社的同志们拥有守护世界的力量，”她环视着我们，目光真诚而坦然，“但再强大的守护，也需要根植于大地，需要被守护的人民能够安居乐业。我来此，并非请求军事同盟，也不是来炫耀我们的武力的。我只是想问一句......”\n她的笑容里，带着一丝俏皮，又有一种触及灵魂的认真：\n“同志们，你们想不想尝一尝，我们用这豆子做出的、带着点烤红薯甜味的炖肉汤？顺便……聊一聊如何让整个世界的土地上，都能开出这样能填饱肚子的花？”\n那一刻，正殿内庄严肃穆的气氛仿佛被一股温暖的南风悄然吹散。我们看着桌上那包沾着泥土的豆种，仿佛看到了在遥远的大陆上，无数人民围着篝火，分享着一碗热汤的场景。那是一种与圣遗物光辉截然不同，却同样强大、同样温暖人心的力量。"
LHS.52.a:0"这……或许是另一种形式的“圣遗物”" 

LHS.53.t:0"一张烧焦的地图"
LHS.53.d:0"总书记同志的办公室里，气氛庄重而热烈。我们刚刚完成了工业建设计划的最终报告，钢产量和电力输出的曲线图令人振奋，象征着北方革命的坚实步伐。当通报官说莉兰迪亚的晓枫同志已经抵达时，我们都整理了一下衣领，准备以最严谨、最同志式的姿态，迎接这位来自南方战火中的传奇英雄。\n门开了，她走了进来，带来了雨林深处潮湿的风和硝烟的余烬气息。她比照片上更显清瘦，衣装的肘部和膝盖处磨得发亮，但那双眼睛，却比我们见过的任何探照灯都更明亮。\n她微笑着与我们每一个人握手，手心有常年握枪留下的薄茧，温暖而有力。\n我们向她展示了我们的成就：一排排新建的工人公寓模型、自动化工厂的蓝图、以及覆盖全国的铁路网规划。我们为这一切感到自豪，这是我们北方同志献给革命的、沉甸甸的工业化答卷。\n她认真地倾听着，眼中闪烁着赞许与钦佩。轮到她时，她没有从挎包里拿出任何报告或是数据。她展开的，是一张地图。\n一张用油布包裹着、边缘被火焰烧得焦黑卷曲的旧地图。\n地图上没有清晰的等高线和行政区划，取而代代的是无数用不同颜色炭笔画下的、密密麻麻的箭头、标记和符号。\n“这是我们穿越卡卡罗姆山脉的撤退路线图，”她的指尖轻轻划过一条几乎被磨损得看不清的虚线，声音里带着回忆的温度，“这个记号，是一个瀑布，我们在那里取过水；这个叉，代表一个塌方的矿洞，有三位同志永远留在了那里；而这个小小的、像太阳一样的符号……是一个老乡偷偷塞给我们半袋土豆的地方。”\n她抬起头，目光中没有悲伤，只有一种历经淬炼后的澄澈。\n“同志们，你们建造的宏伟工厂和铁路，是革命强壮的骨骼，我为你们感到骄傲。而我们从南方的泥泞与战火中带来的，或许就是革命跳动的、柔软的心脏。我们学会了如何在最绝望的黑夜里，从人民手中传递的一点微光中找到方向；我们学会了如何将每一次牺牲，都变成刻在心上、绝不会迷路的星辰。”\n她将那张烧焦的地图，轻轻地放在我们厚重的工业建设计划报告旁边。崭新的蓝图与古老的伤痕，工业的轰鸣与无声的牺牲，在此刻形成了一种奇妙而深刻的共鸣。\n我们忽然明白，真正的革命，既需要能改天换地的钢铁臂膀，也需要一颗能感知每一滴眼泪、铭记每一份温暖的、永远与人民一同跳动的心。"
LHS.53.a:0"让我们把两张地图，合二为一" 
LHS_yuanjiangongchang:0"美洲每有一个§R社会主义§!国家，我们都会互相援建两座§Y民用工厂§!。" 

LHS.54.t:0"一只风筝的重量"
LHS.54.d:0"会议室里的空气冰冷而昂贵，从防弹玻璃窗可以俯瞰整座钢铁丛林的灰色轮廓。我们早已审阅过关于她的所有情报：一个从战火中崛起的、危险的红色幽灵，一个能用言语煽动千军万马的理想主义者。我们准备好了应对一切——慷慨激昂的演说、不切实际的要求，甚至是隐藏在微笑下的威胁。\n然而，当门打开时，走进来的身影却让所有预案都显得有些可笑。她穿着一件旧衣服，洗得已经看不出原本的颜色，脚上是一双沾着泥土的行军靴。她看起来更像一个刚结束长途旅行的背包客，而不是一个颠覆了半片大陆的革命领袖。\n会议开始了。在几轮枯燥乏味的外交辞令后，轮到她发言。我们都做好了准备，迎接一场意识形态的风暴。\n但她没有发言。她只是从那个磨损的皮包里，小心翼翼地取出了一个东西，轻轻放在光洁如镜的会议桌上。\n那是一只风筝。\n一只用最普通的报纸和竹条扎成的、有些歪歪扭扭的风筝。报纸的油墨还清晰可见，上面甚至还有个修补过的破洞，用的是一块印着面包广告的彩色糖纸。\n在我们困惑的目光中，她微笑着开口，声音平静得如同讲述一个睡前故事：\n“在莉兰迪亚，每当一场战斗结束，孩子们做的第一件事，就是跑到被炮火犁过的空地上，放起这样的风筝。我们判断一场胜利是否真正属于人民，不看缴获了多少武器，也不看占领了多少城市，只看一件事——天空中，有没有孩子们自由飞翔的风筝。”\n她伸出手指，轻轻拂过风筝上那片彩色的补丁。\n“我站在这里，能看到你们宏伟的摩天大楼，它们直插云霄，令人惊叹。但我有一个小小的问题，”她抬起头，清澈的目光扫过我们每一个人，“生活在这些高楼阴影里的孩子们，她们的天空，还足够放飞一只风筝吗？”\n整个会议室陷入了死一般的寂静。\n我们准备了无数的论据来反驳她的主义，准备了无数的数据来证明我们的强大与繁荣。但此刻，面对这只简陋的风筝和它背后那个简单至极的问题，我们却发现自己竟如此词穷。\n我们意识到，这个来自南方的革命者，她带来的最危险的武器，不是藏在皮包里的炸弹，而是这个在我们心头投下千钧之重的、无声的诘问。"
LHS.54.a:0"……我们该如何回答" 

LHS.55.t:0"我们的十字路口"
LHS.55.d:0"会议室的寂静比窗外市中心传来的瓦斯爆炸声还要沉重。大屏幕上，实时航拍画面显示着燃烧的车辆和汹涌的人潮——她们挥舞的不是我们熟悉的旗帜，而是一面面粗制滥造的、印着一簇跳动火焰的红旗。那是她的标志，莉兰迪亚的晓枫的标志。\n一切都始于她的那次访问。她没有带来威胁，也没有提出交易。她只是平静地讲述着南方的故事，讲述矿工们如何在绝境中分享最后的面包，讲述工人们如何用自己的双手重建工厂，讲述一场建立在“公平”这个简单词汇上的革命。\n我们向人民承诺了繁荣和秩序，用复杂的经济数据和法律条款构筑了一个看似坚不可摧的帝国。而她，只向我们的人民提出了几个简单的问题：“你的劳动，换来了应有的尊严吗？你的孩子，能拥有一个不必为生计而恐惧的未来吗？”\n这些问题，像野火的种子，在我们社会的裂缝中生了根——在那些被自动化淘汰的工业城镇，在被债务压垮的农场，在城市里拥挤却孤独的公寓楼里。\n现在，种子发芽了。\n“总统，”国家安全顾问的声音沙哑而疲惫，“军队已经准备就绪。我们可以清场，可以逮捕领袖，可以用铁腕恢复秩序。但这无异于向莉兰迪亚，以及她背后那股席卷大陆的红色浪潮宣战。更重要的是，我们将向自己的人民开枪。”\n她停顿了一下，切换了屏幕画面，显示出起义者领袖——一个前钢铁厂的工会主席——正在向人群发表演说，她身后是晓枫的巨大画像。\n“或者，”顾问的声音低了下去，“我们可以派人去谈判。不是去镇压，而是去倾听。去承认我们的繁荣之下，确实有被遗忘的角落和被牺牲的声音。但这等于承认我们的失败，承认这场起义的正当性。它将不可逆转地改变这个国家的航向，甚至……意味着向莉兰迪亚的理想屈服。”\n沉默再次降临。窗外，更多的人群汇入了广场，她们开始高唱那首从南方传来的、关于自由和斗争的歌谣。歌声穿透了厚重的防弹玻璃，回荡在我们每一个人的耳中，拷问着整个国家的灵魂。"
LHS.55.a:0"以钢铁与烈火捍卫秩序。绝不退让！" 
LHS.55.b:0"打开大门。她们的声音，必须被听见。" 


