LHS_xiaofeng_Desc: "§L晓枫十二岁那年，目睹军警弹压学生运动，冰冷的子弹撕裂了和平的游行队伍，也击碎了她的童年。父亲为保护同伴倒下，她被迫遁入贫民窟，在困顿中以维修零星器械求生。\n\n为逃避政府搜捕，她隐姓埋名辗转加入一支弱小的游击队伍。一次雨林绝境中，她凭借对地理与病理学的独到理解，利用暴雨间隙穿越被视为绝地的沼泽，带领队员奇袭了傲慢轻敌的政府军哨所。满身泥泞，唯余一双亮得惊人的眼睛燃烧着决心。此役奠定她成为小队的核心谋划者。然而，丛林中的战斗未能泯灭她为穷苦而战的初心：她屡次“冒险”，转移火力让无辜村民得以撤离，精确引导有限的火力使无谓的破坏降到最低。\n\n这份刻骨的良知，让她与坚持人民战争理念的老军团长成为寒夜中相互倚靠的火种。她们竭力重塑这支队伍：严令禁止侵扰百姓，缴获物资用于接济山民，夺取的装甲列车被改造成疾驰在铁路上的流动宣传站。但这抗争之光如同暗夜中的火炬，招致了反动当局的疯狂反扑。老军团长在一次“事故”中被毒杀，遗物里冰冷的清洗名单与蓄势待发驶向游击根据地的凝固汽油弹军列，宣告着毁灭性清洗降临。\n\n寒夜，晓枫兵变！在艾瑞波拉陡峭的山岭间，面对王室精锐装甲部队的残酷追击，她将枕木撬为铁轨路障，指挥唯一缴获的野炮猛轰峭壁。震天炮响引发山崩，巨石瀑布般倾泻而下，死死扼住了峡谷咽喉。三天三夜的浴血肉搏，为万千被追捕的工农兄弟和学生们撕开了一条通往卡卡罗姆群山的狭窄生路。\n\n退入废弃矿井深处，矿灯昏黄如豆。死寂的黑暗里，她猛地撕下臂膀上旧政权的军徽标记，高高举起老军团长生前磨亮的怀表，那破碎的玻璃反射着矿灯与无数双望向她的眼睛，光芒倔强而灼热：\n\n“站起来吧同志们！反抗她们，推翻她们！！”§!"

