LHS_hongni_jueyi_cate_desc:0 "“打仗的时候，咱们盯着地图上的箭头。过日子嘛，就得盯着天上的云彩和地里的节气。\n这片土地，你用心伺候它，它就给你结出沉甸甸的穗子；你要是瞎折腾，它就给你长一地的荒草。\n咱们都是这片红土地上的长工。这手里的活儿，得干得精细，干得踏实。\n每一步都算数，每一次的收成，都是咱们自己给自己的交代。”"
