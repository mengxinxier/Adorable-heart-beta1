LHS_xueyi_Desc: "§L1925年，爱空尼亚的咖啡园里，烈日将她父亲的脊背炙烤得通红。十岁的雪伊记得那股混杂着汗水、泥土和发霉豆子的酸腐气味——那是她童年唯一的味道。几年后，这味道变成了罐头厂里沙丁鱼的腥臭和铁皮割开少女手指后，监工撒上盐巴的刺痛。她学会了将自己的那份食物分给更年幼的工友，也学会了在账本上将“意外死亡”的姐妹名字，与“报废”的货物数量冷冷地对应起来。\n愤怒的种子，在沉默中生根发芽。1932年，在教堂的地下室里，她将咖啡园的头巾、罐头厂的围裙、码头的麻袋片缝合成一面巨大的百衲旗。两年后，这面旗帜在莉兰迪亚上空飘扬。雪伊领导了那场震撼王国的工人武装起义，她们一度占领了整个工业区，高炉的火焰第一次为自己的人民而燃烧。那七十二小时，是她一生中最灿烂的梦。\n梦醒时分，是王室“军团”冰冷的履带和无情的炮火。巷战中，缺乏训练的工人们用血肉之躯对抗钢铁，最终溃败。雪伊在同志们的掩护下，带着残部退入乡野，建立了最后一个庇护所——一个短暂的、脆弱的公社。\n1935年冬，她蹲在父亲坟前，将一枚起义时佩戴的、已辨不清图案的铜徽章埋入土里。身后，幸存的同志们正为公社的第一批“合格”收成而欢呼。然而，黎明前的黑暗最为致命。那夜，军团的骑兵寻踪而至，将这最后的希望之地，变成了一片火海与屠场。\n雪伊光着脚，站在打谷场上堆积如山的尸体前。她看见了那个曾笑着告诉她“再也不用藏坏豆子了”的年轻工头，他的胸膛被马刀劈开；她看见了那个缝制旗帜的、总爱哼歌的姑娘，她的手至死还攥着一角烧焦的旗布。\n晨雾中，军团的集合号再次吹响，那是胜利者在清点他们的猎物。雪伊站在冒着烟的粮仓前，指甲深深地掐进了掌心，直到鲜血渗出。那不是结束的号角，那是对她一个人，发出的、不死不休的战书。\n她知道，她会回应的。§!"

