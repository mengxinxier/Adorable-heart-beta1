LHS_xueyi_Desc: "§L1925年，爱空尼亚的咖啡园里，烈日把雪伊父亲的背脊晒得发红。十岁的她趴在茅屋前，看着父亲把发霉的咖啡豆偷偷塞进裤兜。"这些不能交，"父亲抹着汗说，"庄园主要扣工钱。"母亲蹲在田埂边，用蒲公英汁给中暑的工友擦额头。地头躺着匹累死的骡子，苍蝇围着打转。\n1931年，罐头厂的铁皮屋顶烫得能煎鸡蛋。十六岁的雪伊站在流水线前，铁皮边沿把姑娘们的手指割得满是口子。监工拎着盐袋走过来，抓起一把就往流血的手上按。"消毒。"他咧着嘴笑。雪伊每天偷藏半条沙丁鱼，夜里分给饿得直哭的孩子，有天暴雨淋湿了账本，她看见纸上写着"烂鱼五十筐"，可那天明明死了十个姑娘。\n1932年，教堂地下室的缝纫机咯吱咯吱响。雪伊把工装裤剪成布条，罐头厂的围裙、咖啡园的头巾、货运站的麻袋片，全都缝在一起。旗子展开有五米长，每块补丁都带着血渍或汗碱。修女望着这面百衲旗叹气："孩子，这要惹祸的。"\n1935年冬,雪伊蹲在父亲坟前，把工人联合会的铜徽章埋进土里。身后突然传来脚步声——十几个咖啡工抱着发霉的豆子走来。"现在不用藏了，"年轻工头笑着说，"公社新规，霉豆超过5%整批报废。"雪伊抓起一把豆子，霉味里混着泥土的腥气。\n也就是那天夜里，枪声惊醒了整个公社。雪伊光着脚跑出去时，火光已经吞没了磨坊。军团的骑兵冲进公社，见人就砍。她眼睁睁看着白天的年轻工头被马刀劈倒，怀里还死死抱着那袋霉豆。天亮时，上百具尸体摆在打谷场上，其中就有那个总爱哼歌的缝纫姑娘——她至死还攥着一截没缝完的旗角。\n雪伊站在冒着烟的粮仓前，手指深深掐进掌心。晨雾中，隐约传来军团吹集合号的声响。她知道，新一轮的围剿就要来了。§!"


