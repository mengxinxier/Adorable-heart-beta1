LHS_xiaoguomuqin: "禾果的母亲"
LHS_heguogaiming: "§Y小果子§!将改名为§Y禾果§!"
LHS_heguo_desc: "§L“禾果”这个名字，是她在上海的孤儿院里被随便起的，因为她刚被捡到时，正攥着半个吃剩的青苹果，又瘦又小。她真正的故乡在遥远的东方，一个被战火与贫穷反复蹂躏的国度。十岁那年，饥荒带走了她最后的亲人，她成了一名流浪儿，被人口贩子辗转卖到了一艘前往南美的走私货船上，当起了最底层的杂役。\n\n那艘船，就是她的整个童年。在充满了咸腥味和机油味的船舱里，她学会了如何在风浪中保持平衡，如何听声辨别发动机的故障，如何在各国海军的巡逻缝隙中，找到最安全的航线。船上的老水手们看她机灵，便半开玩笑半认真地教了她一套“海上生存法则”——从驾驶快艇到修理简易的无线电，从躲避炮击到利用洋流。大海没有给她温柔的怀抱，却将她磨砺成了一块坚韧的礁石。\n十五岁时，在一次躲避王室海军的追捕中，货船被击沉。抱着一块浮木在海上漂流了两天后，她被当时还在为各方势力效力的“野火”雇佣兵团救起。老军团长看中了她与生俱来的航海天赋和那股子野草般的韧劲，便将她编入了军团为数不多的海上渗透小队。\n在“野火”军团里，她第一次感受到了“同志”这个词的温度。她不再是那个随时可以被抛弃的杂役，而是被托付后背的战友。她驾驶着冲锋舟，一次次为登陆部队开辟道路，用她神出鬼没的航行技巧，在王室海军的眼皮子底下完成了无数次不可能的渗透与运输任务。她成了“野火”军团里最可靠的“小果子”。\n当老军团长牺牲、军团分裂的噩变传来时，她毫不犹豫地选择跟随晓枫。对她而言，这并非复杂的政治抉择，而是最简单的知恩图报，是老军团长和晓枫她们，让她第一次活得像个人。§!"
