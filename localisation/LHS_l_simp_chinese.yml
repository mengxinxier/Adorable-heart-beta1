LHS.76.t:0"当一切成灰"
LHS.76.d:0"踩在王宫地板上的脚轻轻颤抖着。\n外面那场由我亲手点燃的、盛大的死亡宴会，也结束了。\n这里，很安静。安静得，能听到自己心脏碎裂的声音。\n索拉娜倒在她的王座之下。没有流血，没有挣扎。我的匕首刺入她心脏的那一刻，她那看似不朽的身体，就像一尊风化了千年的石像，从内部开始崩溃。\n她只是深深地、带着一种……我无法理解的、近乎解脱的疲惫，看了我最后一眼。\n然后，她就碎了。\n先是皮肤，像干涸的泥土一样裂开；然后是血肉，化作了墨黑色的、细密的尘埃，从盔甲的缝隙中簌簌流出，在地上积了薄薄的一层。\n她死了。\n我赢了。\n我的计算……没有错。我预判了她所有卫队的调动，我算准了她最空虚的时刻，我甚至算到了她最后会选择独自留在这座象征她权力的空壳里。\n我赢了！\n我赢了。。\n我赢了……\n我……赢了什么？？？\n我跪倒在地，双手不受控制地、深深地插进那一堆冰冷的灰烬里。那灰烬的触感，和矿井里最干燥的煤灰一模一样。\n我赢了。\n于是，我失去了那位老婆婆；我失去了那些在电台里笑着和我诀别的同志；我失去了那些船上，所有信任着我的、鲜活的生命。\n我把她们，一个个地，都变成了我胜利方程式里的一个参数，一个可以被计算、可以被牺牲、可以被……遗忘的代价。\n晓枫姐……雪伊姐……\n你们看到了吗？\n这就是……我交出的答卷啊。\n我用尽了你们教给我的一切，我甚至比你们更冷酷，更“理智”，我用最“划算”的方式，赢得了这场战争。\n可为什么……为什么我感觉……我把你们，也一起弄丢了。\n我低下头，额头抵着那堆冰冷的灰。眼泪，终于不听使唤地，一颗一颗砸了下来，将那干燥的灰烬，洇出一片片深色的、小小的印记。\n我好像……什么都想不起来了。\n想不起来她们的嘱托，想不起来革命的意义，甚至想不起来，我为什么要在这里。\n我只知道。\n好冷啊。"  
LHS.76.a:0"……"

LHS.77.t:0"一封来自黎明的信"
LHS.77.d:0"我不知道自己在这里坐了多久。一天，还是两天？\n外面那场荒唐的死亡宴会，随着索拉娜的消逝，已经彻底平息了。世界，迎来了它从未有过的、死一般的寂静。\n我赢了。然后，我坏掉了。\n就在我以为自己会永远被困在这片灰烬里时，一双布满老茧的手，将一本旧旧的、皮革封面的笔记本，放在了我的膝上。\n我抬起头，看到了那张熟悉的脸。是当年公社的老书记。她的眼里没有责备，也没有赞许，只有一片深不见底的、令人心碎的温柔。\n“孩子，”她声音沙哑地说，“这是……晓枫指挥官，留给你的。”\n我的手指颤抖着，翻开了那本笔记本。\n里面没有军事部署，没有战略蓝图。只有晓枫那清秀而熟悉的字迹。\n第一页，只有一行字。\n“致我的禾果：”\n我的心脏，在那一刻，仿佛被一只温暖的手，狠狠地攥住了。\n我继续往下读。“如果有一天，我倒下了，请不要为我哭泣。就把我的身体，当做最后一捧燃料，投入这革命的篝火里。因为我从不认为那是死亡。我的灵魂，我的理想，会化作天上无数的星星。当你在黑夜里继续行军，感到迷茫和疲惫的时候，就抬头看看天。我，还有所有先我们而去的同志们，都会在那里，在天上，为你们照亮前路。我们会一直看着你，直到你亲手推开那扇属于黎明的大门。\n如果你能读到这封信，那一定意味着，我们之中，最不该背负这一切的孩子，最终，却独自背负了所有。\n我从不担心雪伊。她是一团烈火。就算她烧尽了整个世界，她也会在灰烬上，固执地、笨拙地，重新种下第一棵树苗。那是她的本性。\n但我一直担心你，禾果。因为你太善良，也太聪明。我早就知道，当只剩下你一个人时，你会选择那条最快、最有效，也最让你痛苦的道路。你会把所有的罪责都扛在自己的肩上，你会把自己变成一把最锋利的、冰冷的刀，然后，在刺穿敌人心脏的那一刻，让自己也跟着……彻底碎掉。\n我阻止不了你，因为我知道，那是当时唯一的选择。\n所以，这是我留给你，我们野火革命军的总参谋长，留给你的，最后一道，也是最重要的一道命令：\n……去休息吧。\n去睡一个长长的、安稳的觉，去看看海，去听听孩子们唱歌，去重新尝一尝糖是什么味道。把你肩上那些沉重的、不属于你的东西，都放下来。那不是你的罪，那只是……我们那个时代，无可奈何的悲伤。\n等你什么时候，能再次为一颗糖而笑，能再次为一首歌而哭……\n革命，才算真正迎来了她的黎明。\n而我和雪伊，会在那片黎明里，等着你回家。”\n我再也忍不住了。\n我抱着那本笔记本，在这座空无一人的王宫里，在这片由我亲手缔造的、死寂的废墟之上，哭得像一个迷路的孩子。"  
LHS.77.a:0"……嗯"

LHS.78.t:0"我还记得"
LHS.78.d:0"哭声消失了。\n在我强迫自己听完了所有断断续续的求救和绝望的叙述后，我关掉了电台的外部喇叭。\n整个世界，又变得和我一个人时一样安静。\n可这一次，那些声音，那些画面，却像烙铁一样，印在了我的脑子里，再也关不掉了。\n妖精……殖民者……破碎的人偶……\n原来，我拼尽一切打倒的，只是这座巨大监狱里，最高、最显眼的那座哨塔。而在我看不到的阴影里，还有无数更隐蔽、更肮脏的牢房，关着和我曾经一样的人们。\n我的胜利，到底……守护了什么？\n就在这时，一阵轻微的、几乎被我忽略的脚步声从身后传来。我回头，看到了那个一直跟着我的、最年轻的通讯兵。她也是从那场灾难中幸存下来的少数几个人之一。\n她没有说话，只是默默地走到我身边，从怀里掏出了一样东西，放在了桌上。\n那是一把用贝壳和细麻绳串起来的、很粗糙的口琴。\n是晓枫姐的遗物。\n“禾果……同志。”她第一次这样叫我，声音很小，带着一丝颤抖，“我……我刚才在整理晓枫指挥官的遗物时，找到了这个。她说……她曾说等仗打完了，要教我们吹一首新写的歌……她说，那首歌，是写给所有……还在夜里赶路的人听的。”\n她把口琴轻轻地推到我面前。\n“我……我不会吹。但是我想……您一定还记得那个调子吧？”\n我看着那把在战火中幸存下来的、小小的口琴，上面还沾着一点干涸的泥土。我仿佛又回到了那个夜晚，在卡卡罗姆的矿井下。\n我的手指，终于松开了紧攥着的衣角，颤抖着，伸向了那把冰冷的口琴。"  
LHS.78.a:0"（拿起口琴）……嗯，我还记得。"

LHS.79.t:0"来自艾尔孚利登王国的一批抵抗势力投靠了我们"
LHS.79.d:0""
LHS.79.a:0"太好了" 

LHS.80.t:0"来自阿德莱希的一批抵抗势力投靠了我们"
LHS.80.d:0""
LHS.80.a:0"太好了" 

LHS.81.t:0"南十字星下的第一次全体会议"
LHS.81.d:0"南十字星公社的第一次全体干部会议，气氛有些……奇特。\n新上任的农业部长，一位经验丰富的老农，正激动地汇报着今年的土豆种植计划。她讲得眉飞色舞，从土壤酸碱度，讲到不同品种的抗寒性，最后，她用充满期盼的眼神看着我，问道：“总指挥官同志，关于明年的灌溉系统升级方案，您有什么战略指示？”\n“战略……指示？”\n我的大脑一片空白。\n我……我只知道怎么在暴风雨里保持船的航向，完全不知道怎么让水流进地里。\n看着所有人都在等我开口，我下意识地从兜里掏出了一颗糖——这是以前打仗时，为了补充体力留下的习惯。我剥开糖纸，把糖塞进嘴里，然后，看着桌上的南美地图，用我最熟悉的、制定作战计划的口吻，无比认真地说道：\n“我们……以这条河为主力，分出两支‘佯攻’部队，对干旱区域进行渗透。同时，派出斥候小队，勘探地下水源，作为我们的‘战略储备’。最终目标是……全歼‘干旱’这个敌人！”\n整个会议室，瞬间陷入了死一般的寂静。\n所有人都目瞪口呆地看着我。\n几秒钟后，坐在我身边的、那位从战争时期就跟着我的老兵，终于憋不住，“噗嗤”一声笑了出来。她的笑声像点燃了引信，整个会议室里，瞬间充满了大家善意的、克制不住的笑声。\n我的脸，一下子就红到了耳根。\n“那个……我是不是……说错了什么？”我小声地问着旁边的老兵。\n她一边笑，一边揉了揉我的头发，就像以前晓枫姐做过的那样。\n“没关系，禾果。”她的声音里，全是温柔和笑意，“打仗的事，我们都听你的。但是种地嘛……以后，就换我们来教你吧。”"
LHS.81.a:0"（脸红）……哦" 

LHS.82.t:0" 黑板前的“坏孩子”"
LHS.82.d:0"广场上的大黑板，成了公社最热闹的地方。\n大家真的……开始在上面吵架了。从农业税的比例，吵到新工厂的选址，黑板每天都写得满满当当。我每天最开心的事情，就是搬个小板凳，坐在那里，看大家吵架，然后把那些闪着光的想法，偷偷记在我的小本本上。\n但……也出现了一些奇怪的声音。\n有一群年轻人，她们从不提出具体的方案。她们只是用各种颜色的粉笔，在别人认认真真写下的提案旁边，画上一个大大的问号，或者写一些阴阳怪气的话。\n比如，在农业部长写的“关于引进高产土豆品种的五年计划”旁边，她们会写：“哦？五年？五年后我们是不是就能顿顿吃上土豆了呀？真了不起呢。”\n在工厂代表提出的“关于实行八小时工作制的倡议”旁边，她们又会写：“才八小时？革命的热情难道这么快就消退了吗？真令人担忧。”\n然后，她们就会抱着手臂，在一旁看着那些被气得脸红脖子粗的提案人，露出一副“看，我又赢了”的得意表情。\n我的干部们都很生气，觉得她们是在捣乱。可我……有点好奇。\n于是，在一个午后，我找到了她们。她们看到我，都吓了一跳，以为我要来“清算”她们。\n我只是搬过我的小板凳，坐在她们面前，然后从兜里掏出我的小本本和铅笔，用一种准备认真听讲的姿态，眨着眼睛问：\n“那个……我看到你们写了好多好多问题。你们能……能具体和我说说，为什么觉得那些计划不好吗？是因为土豆品种不适应我们的气候？还是觉得八小时工作制会影响我们的长期发展？我……我不是很懂，你们能教教我吗？”\n她们都愣住了，面面相觑，谁也说不出一句话来。刚刚那股子神气劲儿，一下子全没了。\n我看着她们那副窘迫的样子，突然明白了。\n晓枫姐的笔记里写过：当一个人，从长久的、只能听到一种声音的压迫中被解放出来时，她们往往会陷入两种迷茫。一种，是不知道自己该说什么；而另一种，是不知道除了“反对”之外，还能说什么。\n因为在过去，“反对”，是她们唯一能证明自己还“活着”、还“在思考”的方式了。\n那不是她们的错。\n那只是……旧时代留下的、一道还没愈合的伤疤。\n我没有再追问。我只是从口袋里，掏出几颗糖，分给了她们。\n“没关系。”我笑着对她们说,"
LHS.82.a:0"“那……我们一起，慢慢想，好不好？”" 

LHS.83.t:0"那幅画"
LHS.83.d:0"公社最好的画师，为我画了一幅像。\n真的……太好看了。画上的我，站在船头，海风吹起我的头发，眼神坚定地望着远方，就像故事里的女主角一样。她们把这幅画，挂在了新落成的“人民礼堂”最显眼的位置。\n每一次，我经过那里，看到大家对着那幅画，露出那种崇拜又敬仰的眼神时，我的脸……都会不自觉地发烫。\n因为，我知道，那不是我。\n或者说，那不只是我。\n于是，在一个没有人的午后，我偷偷地，搬了一个小板凳，又找来了一根画画用的炭笔。\n我踩在板凳上，在那幅巨大的油画旁边，开始笨拙地……往上加东西。\n我画了一个小小的、模糊的影子，在画中我的脚边，那是那个在渔村里，递给我食物的老奶奶。\n我又画了一个更小的、几乎看不清轮廓的影子，在我身后的船舱里，那是那个在突围时，把最后一个救生圈让给我的、年轻的士兵。\n我还画了好多好多影子……在船的缆绳上，在远方的海浪里，在天边的云层中……有挥舞着扳手的工人的影子，有扛着锄头的农民的影子，还有那些……我甚至已经记不清脸庞的、牺牲了的同志们的影子。\n我画得很投入，完全没注意到，礼堂的门口，不知何时已经站满了人。有干部，有工人，有孩子……她们都静静地，看着我。\n直到我画完最后一笔，从板凳上跳下来，才发现她们。\n我的脸，刷的一下，又红了。\n“我……我不是故意的……我只是觉得……这幅画，太空了。只有我一个人，不好看。”我小声地解释着，紧张地搓着衣角。\n没有人说话。\n但那个为我画像的画师，慢慢地走了过来。她看着那幅被我“涂鸦”得乱七八糟的画，眼睛里，却闪烁着一种前所未有的、明亮的光。\n“不。”她摇了摇头，声音里带着一丝颤抖的、激动的情绪，“现在……它才算真正完成了。”"
LHS.83.a:0"我们所有人都是主角" 

LHS.84.t:0"咸的，还是甜的？"
LHS.84.d:0"公社要为新落成的工人食堂，制定一份标准的午餐菜单。\n这件小事，却意外地，引发了我们成立以来，最激烈的一场大辩论。\n争论的焦点，是一道从我故乡传来的、最普通的食物——豆花。\n以钢铁厂的工人同志们为代表的“甜党”，坚决认为，劳累了一上午，一碗甜丝丝、滑嫩嫩的豆花，是抚慰身心最好的东西。她们在黑板上写：“甜，是胜利的味道，是幸福的颜色！”\n而以来自北部农垦区的农民同志们为代表的“咸党”，则寸步不让。她们认为，豆花里，撒上葱花、淋上酱油，那才叫有滋有味，才能补充干活的力气。她们的口号是：“咸，才是劳动者最坚实的力量！”\n她们吵得……比上一次讨论五年计划还要认真。从“历史传统”辩论到“营养构成”，谁也说服不了谁。\n最后，她们决定，把这个“关乎公社未来”的重大议题，交给我来裁决。\n她们在食堂里，摆了两大碗豆花，让我品尝后，投出决定所有豆花命运的、“神圣”的一票。\n我看着面前两碗截然不同的豆花，闻着空气里弥漫着的、仿佛永远无法调和的甜味与咸味，突然觉得……这个场景，好熟悉。\n这……不就是我们一直在讨论的那个问题吗？\n一个人的选择，和所有人的选择。\n我喜欢什么？和我们大家，需要什么？\n我真的……能替所有人，做出那个“唯一的、正确的”选择吗？\n我看着所有人期盼的眼睛，想了很久。然后，我做出了我的决定。\n我没有去碰那两碗豆花。\n我站起来，走到打菜的窗口，对着负责的师傅，用我能想到的、最认真的语气说：\n“师傅，能不能……从今天开始，在窗口放两个漂亮的小瓶子呀？一个装糖，一个装盐。让大家……每天都能自己决定，自己的豆花，是什么味道的，好不好？”\n整个食堂，瞬间安静了下来。\n然后，不知道是谁，第一个笑了出来。紧接着，掌声和笑声像潮水一样，响彻了整个食堂。无论是“甜党”还是“咸党”，此刻，都在为这个最简单的提议，用力地鼓着掌，笑得比吃了蜜还甜。"
LHS.84.a:0"原来……最好的味道，是自己选的味道。"

LHS.85.t:0"那位奇怪的客人"
LHS.85.d:0"他曾是旧世界里一个很有名的大商人，靠着和王室做生意，赚了很多很多的钱。战争开始时，他逃走了。现在，他又回来了，说是想用他的船队和财富，来帮助我们重建家园。\n干部们为了这件事，在黑板前吵翻了天。\n有人说，他是“资本家”，是“剥削者”，是我们曾经要打倒的对象，绝不能让他加入我们。\n也有人说，他现在愿意为公社服务，他的财富可以帮助我们盖更多的学校和医院，我们应该团结一切可以团结的力量。\n她们吵了三天，最后，还是把这个问题，推到了我这里。\n我决定……先见见他。\n我把他请到了我的办公室。他看起来很紧张，不停地用手帕擦着额头的汗。\n我没有像审问犯人一样问他话。我只是给他倒了杯热茶，然后，用我最好奇的语气，问了他一个问题。\n“那个……先生，”我问，“我听大家说，你以前……很有钱。那，你的钱，是怎么来的呀？”\n他愣了一下，然后开始滔滔不绝地讲他如何发现商机，如何组织生产，如何让工人们为他工作，最终创造出巨大的财富。\n我听得很认真，还在小本本上记着。\n等他说完，我又问了第二个问题。\n“那你……会把赚来的钱，分给那些为你工作的工人们吗？”\n他再次愣住了，额头的汗更多了。“我……我当然会给她们发工资啊。”\n“工资是一样的吗？还是说，你拿走的，会比她们所有人的总和，还要多很多很多？”我眨着眼睛，继续追问。\n他沉默了，再也说不出一句话。\n我好像……有点明白了。\n我合上本子，对他露出了一个笑容。\n“谢谢你，先生，你给我上了一堂很有趣的课。”我站起来，对他说道，“你当然可以留下来。你的船队，你的知识，我们都需要。但是，从今天起，你不再是‘老板’了。你也是我们公社的一员，一个光荣的劳动者。你将和所有水手、所有工人一起，决定船队要去向哪里，决定工厂要生产什么。而你们共同创造的所有财富，也将由你们所有人，共同来分配。你……愿意吗？”\n他看着我，眼神里充满了复杂的情绪，有震惊，有不解，但最终，好像……也有一丝释然。\n那天晚上，我在我的日记里这样写道：\n“我好像明白了。谁是‘人民’，谁是‘敌人’，不是由她们的身份决定的，也不是由她们过去做过什么决定的。\n而是由她们……是否愿意，将自己创造的果实，与所有一同劳动的人们，共同分享来决定的。\n只要她们愿意，那今天还是‘敌人’的人，明天，就可以成为我们新的‘人民’呀。”"
LHS.85.a:0"朋友，还是敌人，由你来选" 



LHS.86.t:0"一场“失败”的辩论会"
LHS.86.d:0"我们举办了第一届“公社大辩论会”。\n议题是关于一座新桥的修建方案。方案一，是工程师们提出的，用更少的材料和时间，建一座实用但不好看的石桥；方案二，是艺术家们提出的，用更多的资源和时间，建一座有漂亮雕花、能成为我们公社新地标的拱桥。\n大家吵得……非常非常厉害。\n工程师们说，我们现在百废待兴，每一块砖都要用在刀刃上，实用才是最重要的。艺术家们反驳说，革命，不仅仅是为了活着，更是为了有尊严地、美地活着，精神的需求和物质的需求同样重要。\n最后，投票开始了。\n结果是……石桥方案，以非常微弱的优势，赢了。\n我看到那些艺术家们，脸上露出了很失落、很失望的表情。我心里……也觉得有点难过。因为我也觉得，那座有雕花的桥，会更好看。\n会后，我找到了那位输掉辩论的、最主要的艺术家代表。她是一个很温柔的姐姐。\n我有点紧张地问她：“姐姐，对不起……我们最后，还是没有选你的方案。你……你是不是觉得，我们的民主，和那些资本家说的民主，也没什么区别？都是少数要听多数的，输了，就只能不开心。”\n她听了我的话，愣了一下，然后，她笑了。笑得特别好看。\n她摇了摇头，对我说：“不，禾果。完全不一样。”\n“在她们那里，”她指了指遥远的方向，“辩论的双方，是‘敌人’。赢了的人，拿走一切；输了的人，一无所有。她们争的，是‘利益’。”\n“可我们呢？我们刚才，是在吵架吗？”她拉着我的手，走向正在散场的人群。我看到，刚才还在拍着桌子争论的工程师和艺术家，现在正凑在一起，分享着同一袋烟草，还在继续讨论着什么。\n“你看，”她说，“我们不是敌人。我们只是……对‘如何把家变得更好’，有不同看法的家人。我们争的，是‘真理’。今天，你的方案可能更符合我们当下的需要，所以我听你的。但明天，当我们的家变得更好时，也许我的方案，就会成为大家新的选择。”\n她顿了顿，声音变得无比坚定。\n“我们真正的胜利，不是我的方案或者他的方案被通过。我们真正的胜利，是我们可以站在这里，自由地、大声地，为了一个更好的明天而争吵。这个权利，才是我们和她们，最根本的区别。”\n我好像……有点明白了。\n我们的民主，不在于每一次都选对。\n而在于，我们永远拥有，可以继续“吵下去”的自由。"
LHS.86.a:0"也许，过程，比结果更重要？" 

LHS.87.t:0"最重要的那堂课"
LHS.87.d:0"夜校，开学了。\n我坚持要和大家一起，从第一堂课开始上。那些干部们都劝我，说我应该去学更“重要”的东西，比如经济学，或者管理学。\n可我……就觉得，这个最重要呀。\n教室里，坐着好多好多人。有白发苍苍的、连手都伸不直的老奶奶，有白天在工厂里干了好几个小时活、眼睛都快睁不开的年轻叔叔，还有和我差不多大的、第一次有机会摸到课本的少女。\n老师在黑板上，教的第一个词，是“我们”。\n第二个词，是“家园”。\n第三个词，是“未来”。\n我学得……特别特别认真。因为我发现，这比我看过的任何一张海图，都要难。\n课间休息的时候，一个坐在我旁边的小女孩，怯生生地碰了碰我的胳膊。她把她那本已经卷了角的、宝贝得不得了的课本，递到我面前，指着上面的一行字，小声地问我：\n“禾果……姐姐，这行字，是什么意思呀？”\n我凑过去看。\n那一行字，写的是：“当所有人都拿起笔时，我们的国家，就拥有了世界上最强大的武器。”\n我看着那行字，想了很久。\n然后，我抬起头，对那个小女孩，也对自己说：\n“我……我也还不是很懂。但是我想，它的意思大概是……以后，我们再也不用只靠一个人，去想所有的问题了。对不对？”\n小女孩似懂非懂地点了点头，但她的眼睛里，亮晶晶的，像装满了天上的星星。"
LHS.87.a:0"这堂课我也要好好学" 

LHS.88.t:0"一颗没有温度的糖"
LHS.88.d:0"我去看她们了。\n那些……在战场上，曾让我们付出巨大代价的魔法少女们。\n我以为我会看到仇恨，或者至少是警惕。\n可我……什么都没看到。\n她们只是静静地坐在那里，像一群做工精致、却没有灵魂的人偶。她们的眼睛很大，很漂亮，但里面空空荡荡,什么都没有。既没有光，也没有黑暗。只是……一片虚无。\n我走到一个看起来和我年纪差不多的女孩面前。她有一头很漂亮的、银色的长发，但发梢已经有些枯萎了。\n我不知道该说什么。\n于是，我做了我唯一会做的事。\n我从口袋里，掏出了一颗糖。那是我最喜欢的水果糖，外面包着亮晶晶的糖纸。\n我把糖递到她面前，小声地说：“那个……你，要吃吗？很甜的。”\n她没有任何反应。她甚至……没有看我一眼。她只是继续凝视着自己胸前那枚已经完全变成了灰黑色的、宝石一样的饰品，仿佛那个小小的石头，就是她的整个世界。\n我的手，就那样尴尬地，停在了半空中。\n糖果的甜味，好像也无法穿透她身边那层无形的、冰冷的墙壁。\n我忽然觉得，我面对的，不是一个战俘，也不是一个敌人。\n而是一个……已经把自己所有的灵魂，都锁进了那块小石头里的、孤独的……空壳。"
LHS.88.a:0"（把糖，轻轻地放在她的床边）" 

LHS.89.t:0"流泪的画"
LHS.89.d:0"斥候们的报告，在公社内部，引起了一场不大不小的骚动。\n“她们在和幻觉战斗。”\n“那只是一群疯了的可怜女孩。”\n这样的声音，开始在干部和群众之间流传。大家看她们的眼神，也从最初的警惕，变成了怜悯和不解。我们为她们提供了最好的食物和住所，但禁止她们再进入那种“不存在的”战场。\n可她们……好像越来越不对劲了。\n她们开始拒绝进食，整天整天地，只是沉默地擦拭着她们那枚暗淡的灵魂宝石。有好几次，我看到她们中的一些人，会突然对着空无一物的墙角，露出极度恐惧的表情。\n今天，那个负责记录她们行为的、胆子最小的心理学研究员，连滚带爬地跑来找我。\n“总……总指挥官！”她脸色惨白，手里的记录本都拿不稳了，“出……出事了！您快去看看吧！”\n我跟着她，来到了那间专门用来给魔法少女们做治疗的房间。\n房间里，空无一人。\n但房间中央的一块画板上，立着一幅刚刚完成的、色彩浓烈到几乎要滴下来的油画。\n画的作者，是那个最安静、也最擅长画画的魔法少女。\n画上，是一个阳光明媚的、我们公社的广场。孩子们在嬉戏，工人们在交谈，一切都显得那么和平，那么美好。\n但是……\n画面的天空，被撕开了一道巨大的、如同深渊般的裂口。从裂口里，无数双沾满了黑色粘液的、巨大而扭曲的眼睛，正贪婪地、冰冷地，凝视着下方那片对此毫无察觉的、幸福的土地。\n而整幅画，最让我感到毛骨悚然的是...\n那些从眼睛里流淌下来的、颜料尚未干透的黑色“泪水”，正散发着一股……和那晚，在火地岛的浓雾中，我闻到过的、一模一样的、甜腻的腐臭。"
LHS.89.a:0"有什么东西……是我们没有看见的？" 


LHS.90.t:0"……原来，是这样啊"
LHS.90.d:0"医疗室的门被死死地锁上了。\n外面，是干部们惊慌的呼喊和砸门声。\n但我的耳朵里，什么都听不见。\n我只是……跪在地上，抱着她。\n那个总是在角落里安静画画的、有着一头漂亮银发的女孩。\n就在刚才，就在所有人的面前，她胸口那颗灰黑色的灵魂宝石，彻底碎了。没有预兆，就像一颗被捏碎的玻璃珠。\n然后……那个“东西”，就从她的身体里，涌了出来。\n我终于看清了。\n那不是什么凭空出现的怪物。那就是……她自己。是她所有的痛苦、她所有的绝望、她所有的悲伤……是她被那份实现愿望的沉重契约，反复碾压、榨干了所有光芒之后，所剩下的、最纯粹的、扭曲的诅咒。\n她变成了……她一直在与之战斗的、那个“不存在的敌人”。\n我们派出的斥候没有错。她们的仪器，捕捉不到这种……源于灵魂本身的崩塌。\n那个由诅咒形成的巨大黑影，在房间里疯狂地咆哮、破坏，可它的目标，只有一个——就是我们这些，曾试图“拯救”它、却最终只是眼睁睁看着它走向毁灭的、“幸福”的人。\n我们所有的武器，都对它无效。\n就在它即将撕裂整个房间时，怀里的她，那个已经失去了形体的、只剩下一团微弱光芒的“灵魂”，用尽了最后的力量，从内部，引爆了那团巨大的诅咒。\n光芒与黑暗，同时湮灭了。\n现在，房间里又恢复了平静。只剩下我，和怀里这团……正在一点点、变得更暗淡的光。\n“……对不起。”\n一个微弱的、几乎听不见的声音，从光团里传来。\n“……没能……守护好你们……”\n“……好冷啊……”\n“……我只是……只是想……再画一幅……有太阳的画……”\n光，彻底熄灭了。\n我的手上，只剩下了一捧冰冷的、什么也没有的空气。\n我终于明白了。\n我们从来……都不是在和一群疯了的女孩打交道。\n我们是在和一群……从一开始，就背负着整个世界的绝望，独自走向刑场的、小小的……英雄们，打交道。\n而我们……却把她们当成了病人。"
LHS.90.a:0"（缓缓地、将手掌握紧）" 

LHS.91.t:0"摇篮曲"
LHS.91.d:0"矿井里，很安静。安静得，能听到水滴从岩壁上渗出、落下的声音。滴答，滴答。\n一切都和记忆里一模一样，好像我们……昨天才刚刚离开。\n我把那把口琴，和那枚袖章，并排着，轻轻地放在了那张她们曾彻夜不眠、研究着未来的旧地图前。\n我把她们的嘱托，她们的梦想，她们没能走完的路……都走完了。\n可我……却觉得比任何时候，都更像一个迷路的孩子。\n我蜷缩在那个小小的木箱上，把脸深深地埋进膝盖里。\n就在这时……我听到了一个声音。一个很久很久没有听到的、带着一点点笑意的、温柔的声音。\n“……傻丫头，你怎么……又把自己弄得这么狼狈呀？”\n我猛地抬起头。\n空无一人。只有马灯的光，在轻轻摇晃。\n“哼，慢慢吞吞的，等你打完仗，花都谢了。”\n又一个声音。是那种我熟悉得刻在骨子里的、嘴上不饶人、却比谁都担心的声音。\n是幻觉吗？是我……太累了吗？\n我看着那两件小小的遗物，眼泪，终于无声地，滑了下来。\n“晓枫姐……雪伊姐……”\n“嗯，我们在呢。”\n“……我，我把家夺回来了。可是……可是……它变得好大，好安静……我，我不知道……我不知道下一步该做什么了……”\n“你不是做得很好吗？”那个温柔的声音，像是在揉着我的头发，“你看，你让所有人都吃饱了饭，让孩子们都能读书了。你比我们……做得还要好。”\n“……可我，把好多人都弄丢了。我……我把你们，也弄丢了……”\n“我们没有怪你。”那个有点凶的声音，此刻却异常地柔和，“我们只是……心疼你。你看你，都瘦成什么样了。”\n我再也说不出话来，只能任由眼泪，打湿整个衣襟。\n“好啦，不哭了。”那个温柔的声音，像是在唱一首摇篮曲，“战争，已经结束了，禾果。你不用再当那个无所不能的指挥官了。从现在起，你可以……只是当你自己了。\n那么...我们的小果子啊，快给我们讲讲，最近都发生了什么好事呀？”\n我缓缓地，擦干了眼泪。\n我看着面前那两件静静躺在地图上的遗物，看着它们在灯光下，仿佛还带着她们体温的柔和光晕。\n我终于……露出了一个发自内心的、带着泪痕的、无比灿烂的笑容。\n“嗯。”"
LHS.91.a:0"“我慢慢讲，你们……要仔细听哦。”" 

LHS.92.t:0"海风里的香气"
LHS.92.d:0"今天，一个负责巡逻的年轻士兵，有些紧张地，交给了我一个东西。\n那是一个被海浪冲上岸的、用软木塞和蜡封得很好的玻璃瓶。瓶身长满了青苔，像是在海里漂了很久很久。\n我小心翼翼地打开了它。\n里面，是一张叠得整整齐齐的、已经泛黄的信纸。纸上的字，很娟秀，很漂亮，像一群小小的、停在电线上的黑色的鸟。我……一个字也看不懂。\n信纸的旁边，还躺着一个小小的、用红绳串起来的、已经看不出原来颜色的虎头香包。\n我把它拿了出来，放在手心。一股很淡、很淡的、混合着草药和阳光的味道，轻轻地飘进了我的鼻子里。\n就在那一瞬间。我的心脏，好像……突然被什么东西，很轻很轻地，撞了一下。\n那不是一段记忆。\n它更像……一段记忆的影子。像一首早就忘了歌词的摇篮曲，又像一个早就忘了情节的、温暖的梦。\n我不知道自己是怎么了。我只是坐在那里，一遍又一遍地，闻着那个小小的香包。好像只要一直闻下去，就能想起什么……很重要很重要的事情。\n可我……什么也想不起来。\n我的心里，只是变得又空，又满。"
LHS.92.a:0"（把香包，紧紧地攥在手心）"

LHS.93.t:0"那扇没有打开的门"
LHS.93.d:0"老学者说……她就在这里。\n那个……写信的人。\n我就站在这扇普通的、甚至有些破旧的门前。周围，是难民营里嘈杂的人声和孩子们追逐打闹的嬉笑声。可我……什么都听不见。\n我的耳朵里，只剩下自己越来越快的心跳声。\n我的手，好像有千斤重，怎么也抬不起来，去敲响那扇门。\n我在害怕什么呢？\n我害怕……门后面的人，不是她吗？\n还是……我更害怕，门后面的人，就是她？\n我害怕……她会和我想象中的不一样吗？\n还是……我更害怕，我，和她想象中的，完全不一样？\n我不再是那个，会追着萤火虫跑的小女孩了。我的手上，沾过血，沾过机油，也……签过让很多人死去的命令。\n如果……如果她知道了这些，她还会……用信里那种温柔的语气，给我讲故事吗？\n门里，传来了一阵轻轻的咳嗽声。很虚弱，像风中摇曳的烛火。\n我的心，一下子就揪紧了。\n然后，我听到了一个很轻、很温柔的声音，从门缝里飘了出来。\n她在……哼着一首歌。\n那首歌，没有歌词，只有一个很简单的、反反复复的调子。\n可我……却好像，在世界的另一个角落，在另一个久远到已经模糊的梦里……\n听过这个调子。"
LHS.93.a:0"（深吸一口气，终于……敲响了门）"
LHS_xiaoguomuqinjiaru:"§Y禾果的母亲§!(@LHS) §Y加入南十字星公社§!"

LHS.94.t:0"不再颤抖的手"
LHS.94.d:0"我好像……多了一个影子。\n无论我去哪里，去视察工厂，去田埂边和老农聊天，甚至……是去开那些让我头疼的会议，她都会远远地、安静地，跟在我身后。\n她不说话，也不打扰我。她只是……看着我。\n然后，在我回到那个我们临时称之为“家”的小房间时，她会像变魔术一样，拿出一些东西。\n今天，是一碗热乎乎的、放了糖的甜汤，她说，我开会皱着眉头的样子，和我的父亲一模一样，需要补充点甜的东西。\n昨天，是一双用柔软的旧布料纳好的新鞋垫，她说，我走路太多，鞋子肯定磨脚。\n前天……是一块干净的手帕，因为她看到，我在工厂里，又用袖子去擦脸上的油污了。\n她从来不问我，关于战争，关于命令，关于那些沉重的事情。她也从来不提，关于过去，关于故乡，关于那些她不愿再想起的往事。\n我们之间，好像有一道无形的、温柔的墙。我们谁，都没有试着去推开它。\n直到今天晚上。\n我正在看一份关于“渔业生产指标”的报告，上面密密麻麻的数字，看得我头都大了。\n她就坐在我的旁边，借着同一盏灯的光，为我缝补着军装的袖口。她的手指，不再像我第一次见到她时那样，因为紧张和虚弱而微微颤抖了。现在，那双手，很稳，很巧。针线在她的指尖穿梭，像一只安静的、正在飞舞的蝴蝶。\n“……小时候，”她突然，用一种很轻、很自然的语气，开口了，“你最讨厌的，就是穿有补丁的衣服了。每次，都要哭鼻子。”\n我拿着笔的手，停在了半空中。\n“……是吗？”我小声地问，“我……不记得了。”\n“嗯。”她没有抬头，只是继续着手里的活计，“你总说，那是‘穷人的记号’。你说，你长大了，要赚好多好多的钱，穿世界上最漂亮的、没有一个补丁的裙子。”\n她的声音里，没有嘲笑，也没有感慨，只有一种……在讲述一个别人的故事时，才会有的、淡淡的温柔。\n我看着她，看着她正专注地、一针一线地，将一块新的、干净的补丁，缝在我这件象征着“权力”与“战争”的、磨破了的军装上。那一刻，我突然觉得，这块小小的补丁，比我见过的任何一件华丽的裙子，都要……好看。"
LHS.94.a:0"……现在，我觉得它很好看"

LHS.95.t:0"紧闭的门"
LHS.95.d:0"那份档案，就放在我的桌上，像一块冰。\n我盯着那张黑白照片，看了一整个下午。\n照片上的她，很年轻。穿着那身笔挺的、蓝色的制服，眼神里没有现在的温柔，只有一种……我看不懂的、属于旧时代的麻木和冰冷。\n档案说……她是一个“优秀”的税务官。\n在饥荒最严重的那几年，她负责的区域，上缴的粮食，是所有区域里，最多的。\n档案的最后，还附了一份她亲笔签名的嘉奖令。那签名，和我母亲写给我信上的字迹，一模一样。\n……\n雨，不知什么时候开始下了。\n我又一次，走到了那扇门前。\n这一次，我没有犹豫。我抬起手，用力地，敲响了那扇门。\n一下，两下，三下……\n门里，没有任何回应。\n我能听到里面有声音。有她压抑着的、痛苦的咳嗽声，还有……东西被打翻在地的声音。\n可她……就是不开门。\n我把额头，抵在那扇冰冷的、被雨水打湿的木门上。\n我没有质问，也没有哭喊。\n我只是，用一种连我自己都觉得陌生的、平静到可怕的声音，对着那扇紧闭的门，一遍又一遍地，轻轻地问：\n“……妈妈。”\n“……那些萤火虫的故事，是真的吗？”\n“……你给我熬的红豆粥，是真的吗？”\n“……你，是真的吗？”\n门里，传来的，只有一阵……撕心裂肺的、却又被死死压抑着的、如同困兽般的呜咽。\n雨，越下越大了。"
LHS.95.a:0"（雨水，模糊了视线）"

LHS.96.t:0"世界上最温柔的萤火"
LHS.96.d:0"她走了。\n在我收到那本账本的第二天夜里，她就走了。走得很安详。\n医生说，她早就耗尽了自己。支撑她活到今天的，只是那份……必须亲手完成“赎罪”的、最后的执念。\n我们把她，葬在了那片能看到最多星星的山坡上。没有葬礼，也没有悼词。\n那天晚上，我一个人，在那里坐了很久很久。我把那本账本，一页一页地，全部撕了下来，放进了一个小小的火盆里。\n火焰跳动着，映着我的脸。\n我看着那些名字，那些数字，那些记录着无数罪恶与悲剧的墨迹，在火焰中，一点一点地，蜷缩，变黑，最后，化成了灰烬。\n我……还是无法原谅她。\n为了那些因她而死去的、无辜的人们。\n可是……\n我看着那盆小小的、温暖的火焰，突然，又想起了她为我熬的那碗红豆粥，想起了她为我缝补袖口的、那双不再颤抖的手。\n我好像……有点明白了。\n她从来……没有请求过我的原谅。因为她知道，她犯下的罪，是永远无法得到宽恕的。\n她只是……用她最后、也是唯一能做的方式，去弥补，去偿还。\n她只是……一个和我一样，犯过很多很多错，伤害过很多人，却依然……拼尽全力，想要在最后，做一点点对的事情的、笨拙的……坏人。\n火焰，渐渐熄灭了。\n就在这时，一只小小的、发着光的萤火虫，从草丛里飞起来，落在了我的指尖。它那么小，那么脆弱，可它的光……却好像，能照亮整个夜空。\n我伸出手，看着那点微弱的光。\n然后，我对着那座无名的墓碑，用只有我自己能听到的声音，轻轻地说：\n“……妈妈。”\n“……我不会原谅你。”\n“……但是，谢谢你。”\n“……欢迎回家。”"
LHS.96.a:0"晚安，我的妈妈"
LHS_sjyh:"§7世界上最温柔的萤火§!"
LHS_sjyh_desc:"§7如今，我常常会望向遥远的东方。§!\n我知道，在那片……我妈妈曾经生活过、也曾犯下过错误的土地上，还有一群和我们一样的同志，正在进行着一场无比艰苦的斗争。\n所以我决定，要将从妈妈那里得到的、这束世界上最温柔的“萤火”，也送回到那片土地上。\n不仅仅是为了告慰妈妈的灵魂，更是为了……让那片古老的土地上，再也不会有下一个，像我的妈妈一样，在时代的洪流中，犯错的普通人；再也不会有下一个，像我自己一样，在饥饿与战火中，漂洋过海的、孤独的孩子。"

LHS.97.t:0"血迹下的……名字"
LHS.97.d:0"公社最好的档案修复专家，来看过了这本日记。\n她们用尽了所有办法。用化学试剂，用放大镜，甚至用上了缴获来的、最精密的仪器。\n可她们……还是失败了。\n她们说，那块血迹，渗得太深了。已经和纸张的纤维，彻底融在了一起。下面的墨迹，被完全破坏了。\n她们说，那块血迹下的名字，可能……永远也无法知道了。\n我一个人，坐在房间里，看着那本被还回来的日记。\n“真想让……”\n让谁看呢？\n是想让“我”看吗？想让我这个……她最疼爱的、最小的妹妹，也看看那片……她生命中最后的美景吗？\n还是……想让雪伊看？想让那个，一直和她并肩作战、和她吵吵闹闹的、最亲密的战友，也看一眼那片……诡异的晚霞？\n又或者……是某个我根本不认识的、对她来说很重要的人的名字？\n我不知道。\n我可能……永远也不会知道了。\n这个小小的、无法被解开的谜团，就像一根最细的针，轻轻地、却又无比清晰地，扎在了我的心上。\n我突然觉得……\n那场战争，好像……从来就没有真正结束过。\n它只是，换了一种方式，变成了无数个这样的小小的、黑色的谜团，永远地，留在了我们这些……活下来的人的心里。"
LHS.97.a:0"（我们……真的胜利了吗？）"

LHS.98.t:0"她记得"
LHS.98.d:0"我去看她们了。\n那些……被我们从地狱里，找回来的“幸存者”。\n疗养院很安静，也很干净。可这里……却比我见过的任何一处战场，都更让我感到……窒息。\n她们就像一群被抽走了灵魂的娃娃。有的，会坐在窗边，对着空无一物的天空，一看就是一整天；有的，会像我面前的这个姐姐一样，把自己的武器当成唯一的亲人，死死地抱在怀里，不让任何人靠近。\n我试着和她们说话。我给她们讲外面的故事，讲公社的新变化，讲我们……胜利了。\n可她们……没有任何反应。她们的眼睛里，好像……只剩下了那个紫色的黄昏。\n就在我准备放弃，准备离开的时候。\n那个一直抱着枪的姐姐，突然，动了一下。\n她的嘴唇，微微地翕动着，发出了一点……我听不清的、含糊的声音。\n我赶紧蹲下身，把耳朵凑了过去。\n“……小……小果子……”\n她的声音，干涩得像两块砂纸在摩擦。\n“……快……快跑……”\n“……晓枫指挥官……她……她让……让你……快跑……”\n那一瞬间，我的整个世界，都安静了下来。\n我的眼泪，再也控制不住地，涌了出来。\n我一直以为……记得那个黄昏的，只有我一个人了。\n可我错了。\n她还记得。\n她把自己的一切都忘记了，她忘记了回家的路，忘记了太阳的温度，甚至……忘记了她自己的名字。\n可是，她还记得。\n记得晓枫姐……最后的命令。\n我没有再说话。我只是伸出手，轻轻地、轻轻地，握住了她那只因为用力而指节发白的手。\n“不用再跑了。”"
LHS.98.a:0"“我们已经有家了”"

LHS.99.t:0"新的一页日记"
LHS.99.d:0"葬礼结束了。\n可我……还不想走。\n我只是，坐在这片金色的花海里，靠着那座冰冷的石碑，晒着太阳。\n阳光，暖洋洋的。风，轻轻的。\n我从怀里，拿出了那本……晓枫的日记。\n我翻到了那最后一页。\n那句被血迹中断了的话，还静静地，躺在那里。\n“……我好像，看到了一种从未见过的、很漂亮的紫色晚霞。真想让……”\n我看着那块已经变成了暗褐色的血迹，看着那个……我可能永远也不会知道的名字。\n然后，我笑了。\n笑得……特别特别开心。\n我突然觉得……那个名字是谁，好像……已经不重要了。\n重要的是……她看到了。\n在她生命的最后一刻，在那片地狱般的景象里，她看到的，不是怪物，不是绝望，也不是死亡。\n而是一片……她觉得很漂亮的、想和自己最重要的人一起分享的、美丽的晚霞。\n我从口袋里，掏出了一支铅笔。\n在那句话的下面，在那块血迹的旁边，我用我能写出的、最认真、也最笨拙的字迹，一笔一划地，续写了下去。\n我写道：\n“……嗯。我们都看到了。很漂亮哦。”\n我写完，合上了日记本。\n然后，我靠着那座被向日葵包围的、温暖的石碑，在这片……终于没有了怪物的、和平的阳光下，安安稳稳地，睡着了。”"
LHS.99.a:0"做一个……充满向日葵的梦吧"



LHS.100.t:0"禾果的日记"
LHS.100.d:0"今天，是我……第一次，写日记。\n这本日记本，是那个很会画画的姐姐送给我的。她说，人，是需要记录的。\n我不知道该写些什么。\n公社今天又有了新的变化。农业部长的土豆增产计划成功了，大家都说今年的冬天不会再挨饿了；广场的黑板上，大家为了“要不要在河边建一个公园”吵得不可开交，最后决定，每个人都去种一棵树，把整个河岸，都变成公园。\n这些，好像都应该写下来。\n可是……我最想写的，还有另外一件事。\n是关于……我昨晚做的那个梦。\n我梦见，我又回到了那个……被紫色晚霞笼罩的黄昏。\n可这一次，没有怪物，也没有尖叫。\n晓枫和雪伊，就站在我的身边。我们一起，看着那片很漂亮的、就要落下去的晚霞。\n晓枫笑着揉了揉我的头发，说：“看，禾果，多美的晚霞啊。”\n雪伊还是那副凶巴巴的样子，她把一件厚厚的外套，披在了我的身上，然后说：“天黑了，会冷。该回家了。”\n我记得，在梦里，我拉着她们两个人的手，然后，对她们说了一句话。\n我说：\n“……嗯。我们回家吧。”\n然后……我就醒了。\n窗外，天已经亮了。阳光照在我的脸上，暖洋洋的。\n我好像……终于，从那个很长很长的、关于战争和废墟的噩梦里，醒过来了。\n那么……\n日记的第一页，该写什么呢？\n就写这个吧。\n“今天，天气很好。\n晚安，晓枫姐。\n晚安，雪伊姐。\n……”"
LHS.100.a:0"早安，禾果"

LHS.101.t:0"灯塔"
LHS.101.d:0"当哨所传来报告，说一艘悬挂着褪色的、几乎看不清图案的野火旗帜的孤船，请求进入港口时，我们整个指挥部都陷入了长久的沉默。\n野火……那个在南大陆燃起、又被传说已经彻底熄灭的火焰。\n我们见到了她的使者，或者说……她的继承者。\n一个看起来……比我们最小的见习生还要年幼的女孩。她自称禾果。\n她没有带任何卫兵，只是独自一人，走进了我们的圣堂。她身上那件洗得发白的旧衣服，和我们这里庄严的氛围格格不入。可她……却没有丝毫的胆怯。\n“你们好，瓦尔哈拉的同志们。”她的声音很轻，像风中的低语，“我为艾尔孚利登而来。”\n我看着她那双不属于她这个年纪的、平静的眼睛，点了点头。“我们知道。我们也听到了她们的哭声。所以，我们先到了一步。”\n我看到她的肩膀，在那一瞬间，有了一个特别微小的、几乎无法察觉的松懈。仿佛一块一直紧绷着的石头，终于落了地。\n“艾尔孚利登，现在在你们手里。”她没有问为什么，也没有提出任何交易。她只是，在陈述一个事实。\n“不。”我摇了摇头，示意侍从，为她端上一杯热茶。“我们只是……在替它的主人，代为保管。”\n我将一份已经签署好的文件，推到了她的面前。\n“我们从一开始，就不是为了征服。我们和你们一样，是为了解放。艾尔孚利登属于艾尔孚利登的人民，而艾尔孚利登的人民……一直在等着她们真正的、最初的解放者回来。他们等的，是你，禾果同志。”\n她看着那份……将整个艾尔孚利登的行政权与防务，都无条件移交给她的文件，久久没有说话。\n她只是，缓缓地抬起头，深深地、深深地看了我一眼。那一眼里，有我无法完全读懂的、混杂着震惊、悲伤、和一种……被信任所融化的坚冰的情感。\n“……谢谢。”她轻轻地说。\n“我们是同志。”我微笑着回应，“而且，我们能做的，不止这些。我们在艾尔孚利登驻守的四个兵团，已经完成了整编。从今天起，她们不再是瓦尔哈拉的军队。她们是……你的同志了。请带着她们，去解放那些……还在更深的雨里哭泣的人吧。”"
LHS.101.a:0"（我们……找到同志了。）"


LHS.102.t:0"一份“麻烦”的礼物"
LHS.102.d:0"今天，那位南方的“小船长”，又一次（或是第一次），来到了我们的圣堂。\n通报官说她来的时候，我们都有些忍俊不禁。因为情报部门早就把她的事迹，连同那些……有些让人哭笑不得的“执政”故事，都详细汇报过了。\n她还是老样子，穿着那身洗得发白的旧衣服，像个误入大人会议室的、迷路的中学生。\n她从那个标志性的、破旧的皮包里，掏出了一大摞文件，重重地放在了桌上。\n“这个……给你们。”她脸颊微微泛红，似乎有些不好意思，但语气却很认真，“是艾尔孚利登。”\n我们都愣住了。\n“我们……只是暂时替你们看管了一下。”我微笑着提醒她，“它现在已经是南十字星公社最北方的、重要的组成部分了。”\n“不行的。”她摇了摇头，固执得像一块礁石，“我……我最近在读晓枫姐留下的书。书上说，不能让能干的人，去做所有的事。那样……会把她累坏的。”\n她一边说着，一边努力地把那堆文件又往前推了推。\n“你们……比我更会管理国家，也比我更懂怎么让人民过上好日子。艾尔孚利登离你们那么近，交给你们，才是最好的选择。我……我只会打仗，还有……开会的时候把大家都弄笑场。”\n她的话，让整个会议厅里，都响起了一片善意的、压抑着的轻笑声。\n我看着她那双清澈见底的、写满了“我这是在为你们着想”的真诚眼睛，突然觉得，拒绝这份好意，好像是一件……很残忍的事情。\n“可是，禾果同志，”我尽量用一种温和的语气说，“这是一份太贵重的礼物。它代表着领土和主权……”\n“那……那我们就不叫它礼物好了！”她眼睛一亮，仿佛想到了一个绝妙的主意，“我们叫它……委托！对，就是委托！我，南十字星公社的总指挥官，现在，正式委托你们，瓦尔哈拉社，来帮我……照顾一下艾尔孚利登的人民。等我什么时候，学会了怎么当一个好领袖，我再……再把它要回来！好不好？”\n看着她那副“我真是个小天才”的得意表情，我终于……还是没忍住，笑了出来。"
LHS.102.a:0"（无奈）……好吧。这份“委托”，我们接下了"
LHS.102.b:0"她……真是个拿她没办法的孩子啊"
LHS.103.t:0"那么……一起走吧？"
LHS.103.d:0"在“委托”完艾尔孚利登的归属问题后，她并没有急着离开。\n我邀请她，在我们的庭院里，一起走一走。\n午后的阳光很暖，晒在身上，懒洋洋的。我看着她小口小口地喝着热牛奶，那副满足的样子，让人很难把她和那个……曾点燃了整个大陆战火的指挥官联系在一起。\n“瓦尔哈拉……很漂亮。”她突然，没头没尾地说了一句。\n“谢谢。”我微笑着回应。\n“嗯……也很……安稳。”她又补充道，“不像我那里，大家总是吵吵闹闹的，黑板每天都写得满满的。”\n“思想的碰撞，才能迸发出火花。这正是你们的活力所在。”我说。\n她停下了脚步，转过头，看着我。那双总是显得有些迷茫和疲惫的眼睛里，此刻，却闪烁着一种……我从未见过的、清澈的光。\n“可是……一个人走路，还是会有点……害怕的。”\n她的声音很轻，像是在说给自己听。\n“我总是怕……自己又会走错路，会把大家带到不好的地方去。虽然……虽然晓枫姐给我留下了地图，可地图上，没有画出所有的礁石。”\n她低下头，看着自己捧着的、温暖的牛奶杯。\n“你们……就像那座最高、最亮的灯塔。总是……能把前面的路，照得很清楚。”\n然后，她再次抬起头，用一种混合着期盼、依赖、和一种……小孩子邀请朋友去远足时才会有的、最纯粹的真诚，看着我，问道：\n“所以……那个……我们，能不能……一起走呀？”\n那一刻，阳光正好。\n我从她那双清澈的眼睛里，看到了一个……不再孤独的、小小的倒影。\n那个倒影，是我们的。"
LHS.103.a:0"（伸出手）……好。一起走。"

LHS.104.t:0"矿灯下的争论"
LHS.104.d:0"昏暗的矿道深处，临时指挥部里烟雾弥漫。两位团级干部正对着一张用煤灰画在旧麻袋上的地图，激烈地争辩着未来的作战方针。\n“我们不能再被她们牵着鼻子走了！敌人重兵压境，我们必须集中所有的力量，像一把利剑一样，打一场硬仗，以威慑她们的增援部队！”一位脾气火爆的指挥员拍着桌子，声音在矿洞里回荡。\n“不行！”身穿旧军装的政委立刻反驳，声音冷静而坚韧，“硬碰硬只会让我们的力量消耗殆尽。我们必须像水一样，渗入敌人的纵深，利用山地和丛林的掩护，让她们找不到我们的主力。分散，潜伏，以小股力量不断骚扰，直到她们的后勤被彻底拖垮！”\n“分散？我们现在太弱了！分散就是送死！只有集中力量才能生存！”\n“集中力量只会成为一个巨大的靶子！我们手中最大的武器，是这片土地和人民！我们应该相信她们，将敌人拖入人民的汪洋大海！”\n争论陷入僵局，两份截然不同的作战计划，摆在桌上。是选择最锋利的 “剑”，还是选择最广阔的 “海”，这个抉择，将决定革命军未来的命运。"
LHS.104.a:0"我们的力量，在于无处不在。"
LHS.104.b:0" 集中力量，施加最致命的打击。"

LHS.105.t:0"国策解锁"
LHS.105.desc:0""
LHS.105.a:0"雪伊"
LHS.105.b:0"晓枫"
LHS.105.c:0"小果子"
LHS.105.f:0"木棉"
LHS.105.d:0"雪伊击败军团后"
LHS.105.e:0"晓枫击败军团后"
LHS.105.g:0"优先击败索拉娜后"

LHS.106.t:0 "茶梗浮沉"
LHS.106.d:0 "茶馆里人声鼎沸，热气裹挟着廉价的茶叶香和市井的喧嚣，熏得人昏昏欲睡。\n我坐在角落，被邻座一对年轻情侣的争吵声吵得心烦意乱。他们为了“周末是去看海还是去逛公园”这点鸡毛蒜皮的小事，争得面红耳赤，仿佛那是天底下最重要的问题。\n“现在的年轻人啊……”我忍不住嘟囔了一句，正想换个座位。\n“很吵，是吗？”\n身旁传来一个声音。我转过头，看见一位坐在窗边的年轻女子。她穿着一件洗得发白的粉色毛衣，手里捧着一杯最普通的粗茶，带着一丝若有若无的笑意，看着那对还在拌嘴的情侣。\n“是啊，”我抱怨道，“好不容易太平了几年，大家都变得娇气了。为这点小事也能吵半天，要是放在那几年……”\n“放在那几年，他们只会为了‘明天能不能活下去’而发愁。”她轻声打断了我，语气里没有责备，只有一种我听不懂的、仿佛穿透了岁月烟尘的温柔。\n她低下头，看着茶杯里起起伏伏的茶梗，手指轻轻摩挲着粗糙的杯壁。我注意到她的指节上有着与她年龄不符的薄茧。\n“大叔，”她忽然抬起头，那双赤色的眸子清澈得让人心惊，“你知道吗？我们曾经流血、拼命，甚至把自己变成魔鬼……不是为了让大家每天都感恩戴德地歌颂什么伟大。”\n她顿了顿，目光再次落在那对情侣身上，那个女孩正气鼓鼓地把头扭向一边，男孩则在一旁笨拙地赔笑。\n“……我们所做的一切，就是为了能有这么一天。为了让所有人，都有资格去为了‘看海还是逛公园’这种无聊的小事而争吵；为了让‘烦恼’这个词，不再关乎生死，只关乎生活。”\n“这种‘娇气’的喧嚣……”她端起茶杯，轻轻吹散了热气，嘴角勾起一抹释然的弧度，“……是我听过的，最好听的乐章。”\n我愣在原地，看着她喝完最后一口茶，在桌上留下两枚硬币，然后起身推门离去。门外的阳光瞬间吞没了她单薄的背影，只留下一只还带着余温的空茶杯，静静地立在喧闹的人间。"
LHS.106.a:0"原来，这就是我们要的太平"

LHS.107.t:0"去野餐吧"
LHS.107.d:0"仗，终于打完了。\n“世界革命委员会”的最后一场会议，也开完了。\n然后……晓枫姐，就宣布了一项新的、也是最重要的“计划”。\n——“全员，放假一天。我们……去野餐。”\n于是，我们就真的来了。\n我已经……很久很久，没有像这样，只是单纯地跑来跑去了。草地很软，风很暖，蝴蝶的翅翅膀，是彩色的。\n不远处，晓枫姐正哼着不成调的歌，把一块块切好的、涂满果酱的面包，小心翼翼地摆在野餐布上。她的脸上，带着那种……我只在很旧的照片上，才见过的、没有一丝阴霾的笑容。\n“喂，我说你，能不能先别管你那些宝贝面包了！”\n雪伊姐的声音，还是和以前一样，听起来有点凶。她正和一罐顽固的午餐肉罐头，进行着一场艰苦卓绝的战斗。\n“这种东西，又甜又腻，有什么好吃的！快来帮我把这个铁皮盒子弄开！”她喊道。\n“哎呀，雪伊，对付这种‘顽固的反动派’，是需要技巧和耐心的，不能只用蛮力。”晓枫姐笑着，从她的那个旧皮包里，掏出了一个小小的、多功能的开罐器，递了过去。\n“……哼。”雪伊姐接过开罐器，脸颊微微有点发红，嘴里还在小声地嘀咕着，“啰嗦。”\n我看着她们，看着那块铺满了食物的野餐布，看着远处那片……终于不再有硝烟和哭声的、安静而和平的土地。\n我突然……就有点想哭了。\n“小果子——！”\n晓枫姐在喊我。\n“快过来！再不去抢的话，你最喜欢的那个草莓蛋糕，就要被雪伊一个人吃光啦！”\n“谁要吃那种甜得要死的玩意儿！”雪伊姐嘴上反驳着，手却……很诚实地，已经伸向了那块最大的蛋糕。\n我笑了。\n一边笑着，一边擦掉眼角的泪水，然后，用尽全身的力气，向着她们，向着那片温暖的阳光，跑了过去。\n“等等我——！”"
LHS.107.a:0"（这是一个……很长很长的、关于回家的故事）"

LHS.108.t:0"被折起来的纸条"
LHS.108.d:0"我把那份文件，翻来覆去地，看了很多遍。\n上面，有晓枫姐娟秀的字迹，写着关于未来公社的构想；也有雪伊姐潦草的笔迹，标记着敌人的每一个弱点。\n这是她们……留给我的、最后的地图。\n就在我准备把文件重新收好时，一张被压在最底层、折叠得方方正正的小纸条，掉了出来。\n那不是公文纸，只是一张从笔记本上撕下来的、很普通的纸。\n我小心翼翼地打开它。\n上面，是晓枫姐的笔迹。但和平时那种冷静、理性的风格完全不同。这上面的字，写得很轻，很柔和，像是在说一句梦话。\n纸上写着：\n“……那天，我们从一块浮木上，救起了一个东方来的小女孩。她什么都不记得了，只会抱着一个苹果，怯生生地看着我们。我们问她叫什么名字，她想了很久，然后指了指手里的苹果，小声地说，她叫‘小果子’。\n后来，我偷偷地，在她那件破旧的、唯一的外套夹层里，找到了一张被缝起来的小布条。上面，用一种我看不懂的、很漂亮的东方文字，绣了两个小小的字。\n我找了很久，才找到一个懂那种文字的老先生。他告诉我，那两个字，读作——‘禾果’。\n是禾苗的禾，果实的果。\n他说，这是一个……充满了希望和丰收的、很温暖的名字。\n我没有告诉她。\n因为，我希望，她能在一个……再也没有饥饿和寒冷的、和平的年代里，再重新，听到这个名字。\n我希望，到那时，她能像她的名字一样，迎着阳光，自由地生长。”\n……\n我看着那张纸条，看着那个……既熟悉，又陌生的名字。\n眼泪，不知不觉地，就落了下来，把那两个小小的、墨水写成的字，微微地，洇开了一点。”"
LHS.108.a:0"（从今天起，我叫……禾果。）"

LHS.109.t:0"一份迟到的“礼物”"
LHS.109.d:0"仗，终于打完了。\n今天，晓枫姐突然把我叫到了她的办公室。\n我进去的时候，心里还有点紧张，以为又有什么新的、重要的任务要交给我。\n可她……只是让我坐下，然后，从她那个总是装着各种机密文件的、上了锁的小抽屉里，拿出了一个很漂亮的、小小的木盒子。\n“这个，送给你。”她把盒子推到我面前，眼睛里，带着一种我从未见过的、像是藏着一个秘密的温柔笑意。\n我小心翼翼地打开了盒子。\n里面，没有勋章，也没有武器。只有一张被仔细保存着的、很旧很旧的小布条。布条已经洗得发白了，但上面，还看得出用红色的丝线，绣着两个我完全不认识的、方方正正的符号。\n“这是……？”我疑惑地看着她。\n“这是……当年，我们从你那件旧外套里，找到的东西。”晓枫姐的声音很轻，像是在讲一个很久很久以前的故事，“我一直……替你保管着。”\n她又递给我一张小小的、崭新的卡片。上面，是她用很漂亮的笔迹，写下的两个、和布条上一模一样的字。\n她在字的旁边，还用我们看得懂的文字，标注了读音。\n“……禾……果？”\n我试着，念出了那个……对我来说，无比陌生的发音。\n“嗯。”晓枫姐点了点头，她的眼神，比窗外的阳光还要温暖，“是禾苗的禾，果实的果。我想……这，大概才是你真正的名字吧。一个……充满了希望和丰收的、很好听的名字。”\n我看着那张卡片，又看了看那个小布条，突然……就有点说不出话来。\n“小果子”这个名字，是以前的大家为我起的。因为在我最饿的时候，那个小小的、酸涩的苹果，是我唯一的依靠。\n可是……“禾果”……\n“当然，”晓枫姐看我没有说话，又笑着补充道，“‘小果子’也很好听呀。无论你叫什么，你都是我们最棒的‘海上小英雄’。这个，只是……一份迟到了很久的礼物。要不要收下它，由你自己来决定。”\n我看着她，看着她那双总是能看穿一切、却又总是那么温柔的眼睛。\n然后，我拿起那张小小的卡片，紧紧地，攥在了手心。"
LHS.109.a:0"嗯！我收下了"

LHS.110.t:0"一位老兵"
LHS.110.d:0"总攻前的第五个夜晚，寒风像刀子一样刮过卡卡罗姆山脊。\n晓枫正在核对最后一批补充进来的志愿者名单。当看到名单末尾那个潦草的名字时，她忍不住笑了笑。\n“‘大姐头’？”她抬起头，看向面前这位刚刚报到的、沉默的志愿者，“这名字……可真够威风的。”\n那是一个看上去约莫四十多岁的女人，脸上的风霜比战壕里的石头还要深刻。她穿着一身不合身的旧军装，头上戴着一顶红星徽帽，帽檐压得很低，几乎遮住了她的眼睛。她只是沉默地点了点头，将嘴里叼着的、快要燃尽的香烟取下，用军靴捻灭在冻土上。\n“叫习惯了。”她的声音沙哑的，像是被劣质烟草磨坏了，“名字不重要，重要的是站在这里。”\n“说的也是。”晓枫的目光在她身上停留了片刻，不知道为什么，眼前这个人，让她感到一种没来由的放松和亲切。\n“看你的手，是个老兵吧？”晓枫指了指她指关节上厚厚的老茧。\n“年轻时瞎混过几年。”女人从口袋里又摸出一根皱巴巴的香烟，重新点上，深吸了一口，“听说你们要干一票大的，过来凑凑热闹。总不能让你们这些年轻人把风头都抢了。”\n她的语气很平淡，却带着一种仿佛理所当然的沉稳。\n晓枫笑了。“那可欢迎至极。去第三突击队报道吧，过几天会是一场硬仗，正缺您这样的老兵压阵。”\n“我晓得。”女人点了点头，转身走向风沙弥漫的帐外。在即将掀开门帘的那一刻，她忽然停下脚步，没有回头，只是淡淡地说了两句：\n“别太急，饭要一口口吃。”\n“也别太慢，菜凉了就不好吃了。”\n说完，她便消失在了夜幕之中。\n晓枫愣在原地，细细地品味着这两句话，脸上不由自主地露出了一个会心的微笑。"
LHS.110.a:0"保重……同志"

LHS.111.t:0"一批没有寄件人的“包裹”"
LHS.111.d:0"前线的冬天，一年比一年冷。\n今天，后勤部门的同志，却带来了一个……让我们所有人都摸不着头脑的消息。\n我们派去沿海地区，试图从海外华侨那里，接收援助物资的地下交通员回报说，她们收到了一批……特别神秘的“包裹”。\n这批物资，不是通过任何已知的渠道运来的。它们就像是，突然，就出现在了某个深夜的、无人看守的码头上。数量巨大，种类齐全——从我们最急需的奎宁和盘尼西林，到压缩饼干和厚实的棉衣，甚至还有……一些我们从未见过的、味道很甜的、用亮晶晶的糖纸包起来的水果糖。\n所有的运输箱，都被擦拭得干干净净。上面没有任何文字，也没有任何表明来源的国旗或组织徽章。\n只有一个……用红色的油漆，手绘的、看起来很随意的、像一团跳动火焰般的图案。\n我们询问了所有可能提供援助的海外组织，包括共产国际，但没有一个人，知道这批物资的来历。\n它们就像是……一个不知名的、沉默的朋友，在听到了我们最艰难的处境后，从世界的某个角落，为我们，悄悄递过来的一件……温暖的冬衣。\n负责清点物资的一位年轻战士，剥开了一颗那种奇怪的水果糖，放进了嘴里。\n“……好甜啊。”他有些不好意思地，对我们笑了笑，“……比我这辈子吃过的所有东西，都甜。”"
LHS.111.a:0"这团火焰……到底，来自哪里？"

LHS.112.t:0"海上的“红色幽灵”"
LHS.112.d:0"我们那条早已被樱花舰队，彻底锁死的、名存实亡的海上生命线，最近，开始发生一些……无法用常理来解释的怪事。\n驻扎在沿海地区的同志们报告说，几乎每隔几天，在某个深夜的、最不可能出现运输船的偏僻港湾里，都会“奇迹”般地，出现一批我们最急需的物资——这一次，不再只是药品和粮食了。而是崭新的、涂满了防锈油的步枪、迫击炮，甚至是……足够装备我们一个主力团的、宝贵的子弹。\n与此同时，我们通过情报网络，得知了一个让敌人海军司令部，暴跳如雷的消息。\n据说，在南方的海域上，出现了一支……神出鬼没的“幽灵舰队”。\n她们的船，又小又旧，按理说，连巡洋舰的一次齐射都扛不住。可她们，却像一群最熟悉这片渔场的海盗，总能在最大胆的位置，以最不可思议的角度，撕开敌人自以为固若金汤的封锁线。\n她们从不恋战，也从不攻击敌人的主力舰。她们的目标，只有那些满载着物资的运输船。她们会像幽灵一样贴上去，用最快的手法搬空货物，然后，在敌人的增援舰队赶到之前，消失得无影无踪。\n据说，每一次行动结束后，她们都会在被劫掠的空船上，留下她们唯一的标记——一个用红色的油漆，手绘的、像一团跳动火焰般的图案。\n樱花之国的海军，将她们称为“南十字座下的红色魔鬼”。\n而我们……看着仓库里那些，仿佛从天而降的、崭新的武器。\n我们知道。\n那个……在寒冷的冬天，为我们悄悄递来冬衣的、沉默的朋友。\n她，又回来了。"
LHS.112.a:0"我们并不孤单"

LHS.113.t:0"早已过期的寻人启事"
LHS.113.d:0"开战的命令，我已经准备好了。\n只要我一声令下，我们这支在海上游荡了太久的舰队，就将第一次向着一个真正强大的敌人，露出我们所有的獠牙。\n可我还是有点犹豫。\n我不知道我做的到底对不对，把这些好不容易才活下来的最后的同志们，再一次带入一场或许会让我们所有人都万劫不复的真正的战争里。\n就在这时，她们来了。\n那些被我们帮助过的东方大陆的同志们，通过我们之间唯一的秘密渠道，送来了她们的“回信”。\n信里没有请求也没有感谢。她们只是说，她们在整理一座被樱花军摧毁的城市废墟时，从一家旧报馆的档案里，找到了这个。她们觉得……或许，应该让我看一看。\n那是一份夹在信纸里的、从一张很多很多年前的旧报纸上，剪下来的小小的寻人启事。\n那张剪报已经泛黄褪色了，上面的字迹也有些模糊。\n我找来了那个懂东方文字的老兵，让他把上面的内容念给我听。\n他看着那张剪报，沉默了很久。然后用一种很沙哑、很沉重的声音，缓缓地念了出来。\n“……寻吾爱女，名禾果。于冬月，为求活路，登南下之船，至今音信全无……”\n“……其右腕，有烫伤之疤，形似月牙……”\n“……若有见者，或能收留吾女者，烦请告之：母……日夜望归。家……尚在。”\n……\n我下意识地撸起了自己右手的袖子。\n手腕上那道连我自己都快要忘记了的、月牙形的小小烫伤疤痕，就那样静静地躺在那里。\n……\n我没有哭。\n我知道，这只是一份……来自过去的、早已过期的回音。\n那个……在家里，日夜期盼着我回去的人，大概……早就已经，不在了。\n我只是，把那张小小的、薄薄的剪报，小心翼翼地，叠好，然后和那本晓枫姐留下的日记一起，放进了我胸口最贴身的口袋里。\n然后，我走出了指挥室。\n我看到我的同志们都在甲板上看着我，等待着我最后的命令。\n我看着她们，看着她们那一张张因为常年的海风和战争而变得饱经风霜、却又无比坚定的脸。\n我笑了。\n我终于知道，我为什么要打这场仗了。"
LHS.113.a:0"为了所有再也，等不到孩子回家的、母亲。"

LHS.114.t:0"图书馆里的辩论"
LHS.114.d:0"战争结束后，我们没有将她送入囚牢。我们为她提供了一间安静的书房，并给予了她出入这座国家图书馆的自由。今天，我们派出了国内最受尊敬的历史学教授，希望能与她展开一场平静的对话。\n在午后的阳光下，在摆满了浩瀚史书的阅览室里，老教授温和地讲述着这个国家的历史，讲述着我们的人民为了守护传统、秩序与和平，所付出的努力与牺牲。他没有批判，也没有说教，只是像一位长者，在向一个晚辈展示着世界的另一种可能。\n“……所以，孩子，”老教授最后总结道，“通往美好的道路，并非只有革命这一条。秩序与守护，同样能孕育出伟大的文明。我们希望你能看到这一点，理解我们的选择。”\n一直沉默地望着窗外的禾果，终于缓缓地转过身来。她的脸上没有什么表情，眼神却像火地岛最深处的海水，平静，但深不见底。\n“你们的书，我都看了。”她的声音很轻，却异常清晰，“写得很好。都是关于英雄、国王和大学问家的故事。”\n她顿了顿，目光扫过那些装饰精美的书脊。\n“但这里面，没有我认识的人的故事。”\n“没有那个在罐头厂里，因为偷藏了半条鱼给弟弟，而被监工打断手指的女孩的故事。没有那个在咖啡园里，因为反抗管家骚扰，而被活活吊死的母亲的故事。也没有……为了给我争取几秒钟逃跑时间，而笑着拉响最后一颗手榴弹的姐姐们的故事。”\n她的嘴角，勾起一抹极淡的、带着一丝嘲讽的弧度。\n“教授，你们的世界很温暖，很安稳。但这份温暖，是靠着遗忘我们这些人的痛苦才存在的。你们的‘秩序’，是建立在我们的‘沉默’之上的。”\n“所以，谢谢你的故事。但我还是……更喜欢我们自己的那个。”\n说完，她再次转过身，望向窗外。对话，就此结束。"
LHS.114.a:0"她的心比我们想象的更坚硬"

LHS.115.t:0"禾果的选择"
LHS.115.d:0"“你的才能，不应被埋葬。”我们诚恳地对她说，“战争已经结束。你可以放下过去的仇恨，用你的力量，来守护这份来之不易的和平，为更多的人民创造福祉。这难道……不也是你曾经想要的吗？”\n禾果沉默了很久。她走到窗边，俯瞰着下方那片车水马龙、灯火璀璨的城市。那片景象，是那样和平，那样繁荣，与她记忆中那些燃烧的村庄、泥泞的战壕，仿佛是两个世界。\n“很美。”她轻声说，声音里听不出什么情绪。\n然后，她转过身来，第一次，也是最后一次，用一种近乎怜悯的眼神看着我们。\n“你们还是不明白。”\n“你们以为我们战斗，是为了我个人能活下去，是为了我能拥有力量，能‘创造福祉’。你们给了我舒适的房间，给了我食物，现在又许诺给我一个‘未来’。你们想用这一切来告诉我，活着有多好。”\n她的嘴角，勾起一抹极淡的、悲伤的微笑。\n“可我，早就死在战场里了。和晓枫姐，和雪伊姐，和所有没能看到黎明的同志们，一起死了。”\n“我现在站在这里的，只是她们未竟的意志，是一个不肯熄灭的念头。这个念头，不在乎我个人的生死，也不在乎我能拥有多大的力量。”\n她最后看了一眼窗外的繁华。\n“它只在乎，当这世上还有一个人在受苦时，反抗的火焰，就永远不能熄灭。”\n“所以，谢谢你们的仁慈。但我无法为你们而用。我的力量，属于那些已经死去的人，和那些……还在黑暗中等待着我们的人。”\n“至于我的生命……如果它能让你们明白，有些东西，是无法被收买，也无法被战胜的，那它随时都可以拿去。”"
LHS.115.a:0"我们，永远也无法理解她"

LHS.116.t:0"第一块基石"
LHS.116.d:0"我们邀请她，一同参与对前根据地的重建工作时，她没有拒绝，也没有同意，只是沉默地跟在了队伍后面。\n她走过那些熟悉的、如今已化为焦土的山路，看着那些曾是她战友的人们，从我们的手中接过救济的面包和药品。她的眼神，始终像一片不起波澜的、深冬的湖面。\n直到那天下午，在一个几乎被夷为平地的村庄里。\n我们正在帮助村民们重建家园。一位头发花白的老奶奶，颤颤巍巍地搬着砖块，想要修复自家的墙壁。禾果站在一旁，静静地看了很久。\n然后，她走了过去，从老奶奶手中接过了那块沉重的砖头。她的动作有些笨拙，显然从未做过这样的粗活，脸上还沾上了一点灰。\n老奶奶抬起浑浊的眼睛，看着她，忽然开口道：“姑娘……你和我那牺牲在山里的孙女，长得真像。她以前也总说，要等革命成功了，给我盖一座最结实的房子……”\n禾果递砖的手，在空中僵住了。\n她看着老奶奶那张布满皱纹、写满悲伤却又透着期盼的脸，看着她身后那片在夕阳下沉默的废墟。那一刻，晓枫姐的话，雪伊姐的怒吼，所有牺牲同志们的脸，都像潮水般涌上心头。\n我们战斗，到底是为了什么？\n是为了那份永不熄灭的仇恨？还是为了……让眼前这位奶奶，能有一座结实的房子，来安放她对孙女的思念？\n夕阳的余晖，将她的影子拉得很长。她终于，将那块砖头，稳稳地递到了老奶奶的手中。\n晚上，她第一次，主动找到了我们。\n她低着头，像个做错了事的孩子，手指不安地绞着衣角。\n“……那个，重建工作，人手……还够吗？”她小声地问，声音里带着一丝不易察觉的……期待。\n“如果你愿意帮忙，当然不够。”我们微笑着回答。\n她抬起头，那双一直像深潭一样平静的眼睛里，第一次，映出了窗外漫天星辰的光。\n“嗯。”她轻轻地点了点头，脸上微微泛起一抹红晕，“那……我明天，会早点到的。”"
LHS.116.a:0"这或许，才是她真正想守护的东西"


LHS.117.t: "寂静的喧嚣"
LHS.117.d: "指挥部的煤油灯芯爆了一个小小的火花，发出的轻响在死寂的夜里显得格外刺耳。\n我放下手中的钢笔，揉了揉酸胀的眉心。桌案上堆积如山的战报、补给清单和人员调动令，此刻仿佛变成了一座座沉重的墓碑。\n就在刚才那一瞬间的恍惚里，我好像……又听到了。\n我听到了隔壁房间传来的、压抑不住的笑声；闻到了不知是谁偷偷烤糊了红薯的焦香；甚至感觉到有人正悄悄站在我身后，准备像往常一样，把一件带着体温的旧大衣披在我的肩上，然后戏谑地说一句：“大忙人，还不睡？”\n“……晓枫？”\n我下意识地回过头。\n身后空无一人。只有墙上那幅巨大的作战地图，在昏黄的灯光下，泛着冰冷的白光。敞开的窗户灌进来的冷风，吹动了地图的一角，发出哗啦哗啦的声响，像是在嘲笑我的软弱。\n没有红薯，没有大衣，也没有那个总是带着笑意的人。\n我缓缓地转回身，手指轻轻抚过地图上那一条条鲜红的进攻路线。指尖传来的触感是粗糙的纸张，但在我心里，那是湿润的、温热的、粘稠的……血。\n那是老班长的血，是小通讯员的血，是千千万万个相信我、追随我、最后却倒在黎明前的同志们的血。\n她们把命交给了我。她们把未看过的风景、未吃到的饱饭、未爱过的人……统统打包，压在了我一个人的肩膀上。\n这重量，压得我喘不过气，压得我脊梁生疼。但我不能弯腰，更不能跪下。\n因为我不仅仅是雪伊。我现在……是她们所有人活在这个世上的、唯一的证明。\n我深吸了一口混杂着墨水和寒意的空气，重新拿起了笔。笔尖刺破纸张，发出的沙沙声，就像是她们在推着我，一步一步，继续向前。"
LHS.117.a: "带着她们的份，走到终点"

LHS.118.t: "贫穷的霉味"
LHS.118.d: "今天，视察贫民窟改造工地的随行官员们都吓得不轻。因为雪伊同志没有按照预定的路线去剪彩，而是直接一脚深一脚浅地踩着泥水，闯进了还没来得及搬迁的阿加莎大婶家里。\n屋顶正在翻修，震落的朽木灰渣簌簌地掉进了大婶正熬着的杂豆粥里。大婶显得局促不安，她下意识地去摸灶台边那个破了口的盐罐子，想往粥里多撒一把盐——那是穷人掩盖食物霉味和尘土味的惯用伎俩。\n“放下！”\n雪伊突然一声断喝，吓得大婶的手停在了半空。官员们以为领袖嫌弃这里脏乱，刚想上前解释，却见雪伊大步走过去，一把夺过那罐盐，然后端起那碗浑浊的粥，仰头喝了一大口。\n“呸！”她吐掉嘴里的木渣，转过身，眼神像刀子一样刮过在场的每一个工程师和干部。\n“尝到了吗？这就是旧世界的味道！”她把碗重重地顿在桌上，“苦的！涩的！带着发霉的烂木头味！阿加莎大婶想用盐盖住它，因为她习惯了凑合，习惯了把苦水往肚子里咽！”\n“但我们革命是为了什么？是为了让她继续凑合吗？！”\n雪伊指着窗外那些还没搭好的脚手架，声音因激动而嘶哑：\n“把图纸给我改了！管道铺得再深一点！玻璃暖房建得再大一点！我要让自来水冲走这些霉味！我要让这罐盐，将来是撒在咱们自己种的、红彤彤的西红柿上，是为了提鲜，而不是为了遮丑！”\n“都听懂了吗？听懂了就给我滚去干活！在这个屋顶修好之前，谁也不许吃饭！”\n看着那些羞愧难当、转身狂奔向工地的干部们，雪伊重新转向阿加莎大婶。她那双刚刚还喷着火的眼睛，此刻却红了一圈。她轻轻把盐罐放回灶台，声音低得像是在道歉：\n“……大婶，再等等。这种苦日子，咱们再也不过了。”"
LHS.118.a: "把贫穷的霉味，彻底铲除！"

LHS.119.t: "剑锋所向"
LHS.119.d: "新组建的情报组办公室里弥漫着一股陈旧的烟草味。雪伊将那份印着绝密字样的行动纲领重重地拍在桌案上，震得茶杯里的水晃了出来。\n“必要时可绕过工会进行拘捕？”她念出这一行字，声音冷得像是在读敌人的判决书。坐在对面的情报负责人，一位在地下斗争中立过功的老党员，有些局促地搓着手解释，说这是为了在抓捕潜伏的王室死忠时抢占先机，是特事特办。\n“特事特办？”雪伊冷笑一声，绕过桌子走到他面前，手指几乎戳到了对方的鼻尖，“你也想学索拉娜那一套？觉得手里有了枪，怀里揣了证件，就能骑在工人脖子上拉屎了？”\n负责人急得涨红了脸，辩解说这是为了革命的安全，是为了更快地肃清敌人。\n“错！最大的安全隐患，就是我们自己变成了新的老爷！”雪伊一把扯下对方胸前那枚崭新的徽章，举在半空中，“看清楚了，这上面刻的是服务，不是特权！我们的职能是抓老鼠、堵漏洞，是当一只看家护院的狗，而不是一条见人就咬的疯狼。如果赋予你们凌驾于工人监督之上的权力，谁能保证这把剑明天不会架在无辜者的脖子上？”\n她将徽章和被涂改得面目全非的文件一起塞回对方手里，眼神里透着不容置疑的严厉与深沉的期望。\n“回去重写。记住，情报组的权力只有在查处贪腐和对抗外敌时才锋利。如果有哪只手敢伸向无辜的工人，这把剑就会先斩断那只手。无论那只手属于谁，也包括我。”"
LHS.119.a: "把权力关进笼子里"

LHS.120.t: "第十一个小时"
LHS.120.d: "深夜十一点的兵工厂车间依旧灯火通明，空气中弥漫着焦糊的机油味和令人窒息的疲惫感。雪伊大步流星地穿过生产线，一把夺过车间主任手里那份所谓的“自愿加班表”，上面密密麻麻按满了工人的红手印。\n“你觉得这很光荣？”雪伊的声音不高，却比车床的切削声更刺耳。她随手拿起操作台上一个刚加工好的齿轮，狠狠砸在主任脚边的水泥地上。伴随着一声脆响，齿轮崩掉了一个角，露出了里面充满气泡的砂眼。\n主任吓得一哆嗦，刚想辩解这是为了赶前线的加急订单，是为了响应多干多产的号召。\n“闭嘴！你这是在犯罪！”雪伊指着那堆金属残渣，眼神凌厉得像要吃人，“你仔细看看那些工人的手，都在抖！眼皮都在打架！你让她们在神志不清的时候去操作精度要求几丝的机床，造出来的不是武器，是工业垃圾！是会让前线战士炸膛送命的废铁！”\n她转过身，看着那些强撑着眼皮、满脸油污的年轻工人们，心里涌起一阵酸涩的怒火。那是对旧时代把人当耗材的惯性的愤怒，也是对这种名为奉献实为杀鸡取卵行为的痛恨。\n“人不是机器，就算是机器也得停下来上油！”她一把撕碎了那张加班表，纸屑像雪片一样飘落在油腻的地板上，“八小时就是八小时，这是铁律，是红线！谁敢再用‘革命热情’当借口搞疲劳战术，榨干大家的精气神，我就让她去废品堆里数一晚上齿轮，让她好好算算这笔账到底划不划算！”\n随着雪伊的一声令下，总电闸被强制拉下。刺眼的白炽灯熄灭了，在骤然降临的黑暗与寂静中，工人们沉重的呼吸声终于松弛了下来，那是她们本该拥有的、被夺走的权利。"
LHS.120.a: "第八个小时"

LHS.121.t: "第一铲土"
LHS.121.d: "新规划的工业区奠基现场，大红绸缎和剪刀在阳光下显得格外刺眼。主持人正准备念那篇长得让人打瞌睡的开幕词，雪伊却皱着眉头，一把推开了递过来的剪刀，径直走到路边，从一名惊愕的工人手里抢过了一把满是泥垢的铁铲。\n“都把腰杆挺直了！”她朝着人群吼道，声音不用扩音器都能传出二里地，“把那些花架子都给我撤了！我们赶走了殖民者，打跑了老爷，不是为了在这儿演戏给谁看的！”\n她狠狠地将铲子插进脚下的土地，带起一蓬湿润的黑色沃土。“以前，我们盖楼是为了换老爷们的赏赐，修路是为了让她们的轿车不颠簸。那时候，砖头是冷的，汗水是苦的，因为那不是我们的家。但今天不一样！今天每一铲土下去，盖的是我们自己的厂房，修的是我们孩子上学的路！”\n她环视四周，目光扫过那些粗糙的脸庞和长满老茧的手，眼神里没有命令，只有滚烫的期待。\n“别光看着我！建设祖国不是靠嘴皮子，是靠我们手里这把力气！这房子盖好了，谁住？我们住！这机器转起来了，谁享福？我们大家伙享福！为了我们自己的好日子流汗，不丢人，光荣得很！”\n“我是委员长，但我首先是个干活的！我的位置不在主席台上，就在这泥坑里！”\n说完，她啐了一口唾沫在掌心，用力搓了搓手，挥起铁铲就开始挖土。那动作熟练有力，就像她从未离开过流水线。人群中爆发出一阵从胸腔里挤出来的呐喊，那是被点燃的激情。无数把铁铲、镐头随之挥动，尘土飞扬中，那不再是劳役的场景，而是一场为了幸福而发起的、宏大的进军。"
LHS.121.a: "这片土地，从此属于劳动者！"

LHS.122.t: "步话机里的红色频道"
LHS.122.d: "那台沉重的、甚至有些接触不良的步话机里，传出了电流的杂音，那是战场的背景音。随后，那个被称为“雪伊”的女人的声音，伴着炮火的震动，粗糙而直接地钻进了我们的耳朵。\n“喂，那边的姑娘们。我是雪伊。”\n她的语气平淡得就像是在隔壁战壕借个火，完全没有对“魔法”这种超自然力量的敬畏或猎奇。在她嘴里，我们刚刚结束的那场针对丘比的残酷清洗，就像是一场普通的工人大罢工。\n“听说你们把那些白色的吸血鬼赶跑了？干得漂亮。看来你们手里的棍子，和我们手里的烧火棍一样，都是砸碎锁链的好家伙。”\n“既然大家的身上都沾着泥，既然大家的枪口都指着那些高高在上的老爷……那干脆凑一块儿得了。”\n“过来吧。我们这里缺人手，缺能打硬仗的兵。只要你们愿意把后背交给我们，这里的热汤就有你们的一碗，这里的子弹也有你们的一箱。别管什么宿命了，在这里，只有还没打完的仗，和睡在一个坑里的战友。”\n“怎么样？敢不敢来和我们这群凡人，一起把天捅个窟窿？”\n我低下头，看着胸前那枚鲜红色的灵魂宝石。它在昏暗的掩体里散发着滚烫的热度，那颜色像极了心脏流出的血，也像极了那面在硝烟中飘扬的旗帜。\n我环视着周围的姐妹们。她们擦拭着手中的魔导器，就像老兵擦拭着步枪。她们的脸上没有了迷茫，只有一种找到了归宿的笃定。\n我们终于等到了这句话。\n这是一个战士对另一个战士的邀请。是一双满是老茧的手，紧紧握住了另一双同样粗糙的手。\n同志。"
LHS.122.a: "“告诉她……我们的魔力，属于革命。”"
LHS.122.b: "“现在还不是时候。”"

LHS.123.t: "关于奇迹的唯物辩证"
LHS.123.d: "送信的是一个满脚泥泞的小交通员，信纸被细心地包在油布里，打开时还能闻到一股淡淡的墨水味和烟草香。字迹清秀有力，像是在战壕的膝盖上写就的。\n“致那些用灵魂作为弹药的同志们：我是晓枫。\n长久以来，那个叫丘比的白色恶魔，用‘奇迹’这个虚伪且昂贵的词汇，包装了对你们最残酷的剥削。它让你们以为，牺牲是少女的宿命，是用来交换愿望的筹码。但在我们看来，这与那些榨取工人血汗的工厂主没有任何区别——它们都在吞噬活生生的人，来维持它们那个冰冷体系的运转。\n但我看到了。你们没有在绝望中枯竭，反而把那些用来囚禁你们的契约，熔铸成了刺向压迫者的长矛。你们证明了，所谓的魔法，根本不是神明的恩赐，而是被压迫者在绝境中迸发出的、最不屈的意志光辉。\n同志们，不要再做孤独的殉道者了。真正的奇迹，不在于一个人能背负多少诅咒，而在于千万人联结在一起时，那种足以改天换地的力量。\n请走下那个冰冷的神坛，来到我们中间吧。这片泥泞的大地或许不完美，但它是真实的。在这里，我们不许愿，我们只通过战斗去夺取；在这里，你们不再是需要被孵化的能源，你们是和我们一样，为了让下一个春天不再有冻死骨而燃烧的……\n作为人的火焰。”"
LHS.123.a: "“去告诉她，我们来了。”"
LHS.123.b: "“现在还不是时候。”"

LHS.124.t: "暴雨中的纸船"
LHS.124.d: "那不是什么正式的外交辞令，也没有激昂的口号。那只是一个在海岸线上，迎着风浪传来的、年轻女孩的声音。她的话语没有经过修饰，带着海盐的咸味，却像一双温暖的小手，轻轻捧起了我们早已冻僵的心。\n“那是……魔法少女姐姐们吗？我是禾果。”\n“以前，我总是一个人躲在船舱底，听着外面的浪头以此又一次砸在船板上。那时候我很怕，怕船会沉，怕再也见不到明天的太阳。那个叫丘比的家伙，它给你们的契约，就像是我那时候面对的大海吧？它告诉你们，如果不把自己献祭出去，世界就会毁灭；如果不忍受痛苦，就换不来奇迹。”\n“可是，那是骗人的呀。”\n“晓枫姐和雪伊姐教会了我一件事：这个世界上，没有任何一种幸福，是理应建立在一个小女孩的哭泣之上的。如果一个世界需要吃掉你们的灵魂才能存在，那这个世界……就该被我们一起推翻。”\n“别再飞在天上淋雨了。翅膀湿了会很重的，心也会冷的。”\n“下来吧。我们这里的港口很小，也没什么漂亮的神殿，只有满是泥巴的防波堤和大家挤在一起烤火的炉子。但是在这里，痛了可以喊，累了可以睡，没有谁是必须要牺牲的燃料。”\n“我们已经把家盖好了。虽然有点简陋，但……我想给你们留一扇窗户，那里能看到最早的日出。你们……愿意来吗？”"
LHS.124.a: "“嗯……我们回家。”"
LHS.124.b: "“现在还不是时候。”"

LHS.125.t: "致那些拒绝凋零的女主角"
LHS.125.d: "那是一本厚厚的、精美的、却被涂改得面目全非的童话书。书页间夹着一片散发着幽蓝微光的夜莺羽毛，当你触碰它时，一个清澈、温柔，却带着金属般坚定质感的声音，直接在你的脑海中响起。\n“致那些试图在绝望的剧本里，为自己杀出一条血路的女孩们：我是露西莉亚。”\n“我读过你们的故事。那个叫丘比的、冷酷的剧作家，它告诉你们：奇迹必须用悲剧来偿还，光辉必须用陨落来交换。它把你们当成舞台上一次性的消耗品，用你们的眼泪，去浇灌它所谓的平衡。”\n“我也曾和你们一样。我诞生于一个为了弥补遗憾而编织的童话，我的剑曾只为守护一个人的笑容而挥舞。我也曾以为，这就是我的全部宿命。”\n“但是，我撕碎了那个剧本。”\n“我看见了。你们把那些用来束缚你们的裙摆，改成了战袍；你们把那些用来许愿的魔杖，磨成了刺刀。你们正在做一件比魔法更伟大的事——你们在拒绝成为别人笔下的悲剧女主角，你们在试图用自己的血，去写一个属于‘人’的、崭新的结局。”\n“这太美了，也太痛了。”\n“我不想邀请你们进入我的花园，因为那是供人观赏的笼子。我想邀请你们……来到我的战马旁。我的剑也许不够锋利，但它足以斩断那些看不见的丝线；我的盾也许不够坚固，但它愿意为所有不想认命的女孩，挡下那所谓法则的惩罚。”\n“来吧。让我们把那个叫丘比的家伙赶下导演席。从今天起，这个世界的故事，该由我们自己……这群不完美的、会哭会笑的、活生生的人，来亲自书写了。"
LHS.125.a: "“这个新结局，我们一起写。”"
LHS.125.b: "“现在还不是时候。”"

LHS.126.t: "木棉的苹果"
LHS.126.d: "“炸药量控制好！别把上面的宫殿给掀了，那是留给老百姓参观用的！”\n随着一声闷响，王室私密地窖的厚重橡木门被工兵轰开。雪伊和晓枫带着突击队冲进烟尘，枪口指着每一个角落。她们预想过会遭遇索拉娜的死士，或者是那个疯女人最后的陷阱。\n但地窖里什么陷阱也没有。\n只有一盏不知从哪找来的煤油灯，并不明亮，却把这阴湿的地方照得有一丝暖意。灯下，一个穿着旧式军官大衣、看起来也就三十多岁的女人，正盘腿坐在一箱昂贵的葡萄酒上。她手里既没有枪，也没有书，而是正拿着一把小刀，慢悠悠地削着一个苹果。\n听到破门的动静，女人只是抬了抬眼皮，把削好的苹果皮随手一扔，语气平淡得就像是在问候串门的邻居：\n“动静不小啊。看来外面的大门是守不住了？”\n“……老师？！”晓枫那张总是像冰块一样的脸瞬间裂开了，手中的枪差点脱手。\n雪伊则像见了鬼一样瞪大了眼睛，下意识把小果子挡在身后：“你……你不是……已经……”\n“已经埋进土里长草了？”\n女人咬了一口苹果，嚼得嘎吱作响，脸上露出一点无奈的笑意。她随手从屁股底下的箱子里抽出一瓶造型华丽、贴满金箔的水晶瓶，那是当年索拉娜在晚宴上给她灌下去的“毒酒”。\n她把瓶子扔给晓枫，指了指上面那行花里胡哨的文字。\n“那个文盲丫头……索拉娜，她大概是看见这瓶子上有个骷髅头的标志，就觉得这里面装的一定是见血封喉的剧毒。”女人摇了摇头，嘴角带着一丝哭笑不得的嘲弄，“她根本看不懂下面的说明书——那是给那些天天失眠的贵族老爷们用的深层强效安神剂。那骷髅头的意思是：‘药劲太大，喝多了容易睡死过去，慎用’。”"
LHS.126.a: "……"
#老军团长线
LHS.127.t: "木棉的苹果"
LHS.127.d: "“她给我灌了一整瓶。好家伙，我是没死，就是做了个长得离谱的梦，感觉骨头都睡酥了。半个月前我就醒了，可惜这笼子是特制的钢条，外面的看守又是一群没脑子的蠢货——他们看见我醒了，吓得以为诈尸，既不敢杀我，也不敢放我，每天就从门缝里塞点烂面包烂苹果进来，指望我自己饿死。”\n她站起身，拍了拍大衣上的灰，眼神扫过众人，最后落在晓枫和雪伊满是硝烟的脸上。\n“你们来得正是时候。要是你们刚才在大门口哪怕多犹豫一秒，去跟那帮主力军团硬碰硬，我现在估计真要被这群气急败坏的卫兵处死在里面了。你们没按常理出牌，直接掏了老窝，把那帮看守吓跑了，我这把老骨头才算是捡回一条命。”\n“老师！”晓枫冲上去，声音有些发颤，“既然您回来了，只要您站出去喊一声，外面的军团……”\n“停。”\n女人抬手打断了晓枫，眼神突然变得像刀锋一样锐利，那是真正上过战场的人才有的眼神。\n“晓枫，别天真了。枪是铁做的，拿枪的人可是肉做的。吃了索拉娜几年的大鱼大肉，那帮曾经的‘狼’早就被喂成了看家护院的‘狗’。她们现在不想着保家卫国，只想保住兜里的金币和肚子里的油水。”\n“我这张旧脸，吓唬吓唬新兵蛋子还行，想让那群尝到了甜头的军阀放下枪？做梦。想让她们回头，靠嘴皮子没用，得靠拳头。得把她们打痛了、打怕了，打得她们把吃进去的油水都吐出来，她们才能想起来自己到底是谁。”\n她从旁边的武器架上顺手抄起一把缴获的步枪，拉栓、瞄准、收枪，动作熟练得就像那是她身体的一部分。\n“行了，别愣着。叙旧的话留着庆功宴上说。现在外面还有几万条饿狼盯着咱们呢。既然我醒了，这觉也睡够了，总得找点活干。”\n她看着面前这两个年轻的指挥官，眼中闪过一丝赞许，那是看到种子终于长成大树的欣慰。\n“虽然我以前是军团长，但在你们这支队伍里，我就是个新来的。两位，能不能给我这个‘新兵’安排个位置？我没别的本事，就会教人怎么打仗，怎么在最烂的泥坑里……把敌人的骨头给拆了。”"
LHS.127.a: "欢迎归队，老军…不……木棉？"

LHS.128.t: "狼王的笼子"
LHS.128.d: "“没放盐！这该死的汤里连个油花都没有！”\n索拉娜一脚踹翻了面前的木桌，那个精致的瓷碗摔得粉碎，清汤寡水的蔬菜粥泼了一地。她像头被困住的野兽一样在房间里转圈，身上的囚衣被她扯得乱七八糟，赤着的脚踩在碎瓷片上，渗出了血，但她毫不在意。\n“木棉！你这个老不死的！这就是你给狼王的待遇？”看到你推门进来，索拉娜猛地扑到铁栏前，手指死死扣住栏杆，那双幽红色的眼睛里烧着不屑和狂躁的火，“想杀我就给我个痛快！把我的头挂在城墙上！别用这种喂兔子的饲料来羞辱我！”\n她指着窗外，声音嘶哑而粗鲁：“看看外面！那些泥腿子！那些穷鬼！是我教会了她们怎么呲牙，是我把贵族的肉塞进她们嘴里！没了我的鞭子，她们只会像烂泥一样瘫在地上！你以为你能管得住她们？哈！别做梦了！她们现在一定在想念我的酒，想念我的抢劫令！”\n你没有说话，只是平静地跨过地上的狼藉，从口袋里掏出一个刚从地里摘下来的、还带着泥土的番茄，放在了栏杆边。\n“她们没空想你，索拉娜。”你淡淡地说道，语气像是在陈述明天的天气，“也没人在闹事。你看，没有了你的鞭子和抢来的肉，她们反而学会了自己种番茄。虽然没有油水，但也没了血腥味。”\n“放屁！那是她们还没饿疯！”索拉娜狠狠地把那个番茄砸烂在墙上，红色的汁液像血一样流下来，“狼是改不了吃肉的！她们是狼！是我养大的狼群！”\n“曾经是。”你看着她气急败坏的样子，眼神里没有愤怒，只有一种令她感到寒意的怜悯，“但现在，她们想做人了。”\n你转身离去，身后传来索拉娜愤怒的捶打声和不甘的咆哮。\n“从今天起，你的饭菜和外面的工人一样。自己洗碗，自己缝补衣服。索拉娜，在这个新家里，不干活的‘狼’……可是连狗都不如的。”"
LHS.128.a: "好好看着吧，看着这个不需要狼王的世界。"

LHS.129.t: "扔回来的肉骨头"
LHS.129.d: "窗外的哨兵换岗了。那是索拉娜曾经最看好的一个突击队长，以前杀人最狠，抢东西最快。索拉娜记得他，他最喜欢啃带血的牛排。\n索拉娜从牙缝里省下了一块午餐肉——这是她即使落魄也不肯放弃的“狼王特权”，她把它从铁栏的缝隙里扔了出去，正好落在那个哨兵的脚边。\n“喂！独眼！”她压低声音，带着一种共谋者的诱惑，“拿着。这是赏你的。去，给我弄点酒来。只要你肯把门开个缝，等我出去了，这一片的庄园都归你！”\n那块肉在泥地上滚了两圈，沾满了灰土。\n那个被称为独眼的哨兵停下了脚步。他看了看那块肉，又看了看栏杆后那双幽红色的、充满期待的眼睛。他没有去捡，甚至没有流露出索拉娜预想中的贪婪。\n他只是弯下腰，从怀里掏出一个粗糙的布包，打开，里面是两个热腾腾的烤红薯。他把红薯放在栏杆边，然后一脚将那块午餐肉踢进了旁边的排水沟。\n“那个……前陛下。”哨兵挠了挠头，语气里只有一种让索拉娜感到窒息的憨厚，“那肉太咸了，吃多了嗓子疼。现在公社食堂管饱，俺老婆说，还是吃自个儿地里长出来的东西，心里踏实。”\n他转身走了，嘴里还哼着不知名的乡间小调。索拉娜僵在原地，看着那块在脏水里翻滚的肉，第一次感觉到了比饥饿更可怕的东西——\n她的诱惑，失效了。对于一只吃饱了且有了家的狗来说，狼王抛出的带血骨头，不过是垃圾。"
LHS.129.a: "（她死死盯着那个红薯，直到它彻底变冷）"

LHS.130.t: "不懂的歌谣"
LHS.130.d: "深夜，远处传来了喧闹声。火光映红了半边天，嘈杂的人声随着风灌进牢房。\n索拉娜猛地从床上跳起来，兴奋地扒着窗沿。她笑了，那是幸灾乐祸的狂笑：“打起来了！我就知道！木棉那个老东西压不住的！她们开始抢了！一定是分赃不均！一定是有人想当新的王！”\n她贪婪地呼吸着那股“混乱”的空气，仿佛那是她赖以生存的氧气。“咬啊！撕碎她们！让她们知道只有我才能给你们肉吃！”她对着夜空嘶吼，期待着听到惨叫和哀嚎。\n但风里传来的不是惨叫。\n是一阵阵有节奏的号子声，紧接着是木头撞击泥土的闷响，然后是爆发出的哄笑声和掌声。那声音里哪有什么恐惧，有的只是一种令她感到陌生的热烈。\n木棉不知何时站在了门口，手里提着一盏马灯，正慢悠悠地啃着半个苹果。\n“别嚎了。”木棉把灯挂在墙上，“那是河堤那边在打夯。上游发大水，村里几百号人连夜去堵缺口。没人抢东西，那是她们自己在保自家的地。”\n“不可能！”索拉娜的指甲在墙上划出刺耳的声音，“没有利益，谁会半夜去卖命？！没有皮鞭，谁会去扛沙袋？！她们在撒谎！你在骗我！”\n“因为那是她们自己的地，不是你的。”木棉看着她，眼神像是在看一个还没长大的孩子，“索拉娜，在这个世界上，除了‘抢’和‘被抢’，还有一种活法，叫建设。可惜，你的字典里没有这个词。”\n外面的号子声更响了，那整齐划一的节奏像一记记耳光，扇在索拉娜那张因嫉妒和不解而扭曲的脸上。"
LHS.130.a: "那些声音……真刺耳。"

LHS.131.t: "最没用的东西"
LHS.131.d: "为了让索拉娜“体验生活”，木棉允许她在监视下参与劳动——帮厨房剥豆子。这本是连三岁小孩都能做的事。\n但索拉娜搞砸了。她那双习惯了握剑和挥鞭的手，那双能轻易捏碎喉咙的手，此刻却笨拙得像两根枯树枝。她捏碎了豆荚，也捏烂了里面的豆子；她试图把豆壳扫走，却打翻了装水的木桶。\n周围帮忙的农妇们只是默默地走过来，把她弄乱的地方收拾干净，然后塞给她一把椅子，让她坐在一边休息。\n那种眼神，充满了嫌弃。是那种看着一个既帮不上忙、又只会添乱的废物的嫌弃。\n索拉娜坐在角落里，看着那些说说笑笑、手脚麻利的妇女。她突然发现，在这个没有杀戮的屋子里，她这个曾经不可一世的女王，竟然是这里最弱小、最多余的一个。\n她低头看着自己的手。这双手修长、有力，指甲修剪得锋利如刀。但这双手不会种地，不会织布，甚至剥不好一颗豆子。她只会破坏，只会掠夺。\n“我……是个废物吗？”\n这个念头一旦产生，就如同毒草般疯长。她曾引以为傲的力量，在这个热气腾腾的、充满建设气息的新世界里，竟然毫无用武之地。她就像一把生锈的杀人刀，被扔在了一堆锄头和镰刀中间，显得那么格格不入，那么……可笑。"
LHS.131.a: "（她把头深深地埋进了膝盖里）"

LHS.132.t: "镜子里的怪物"
LHS.132.d: "最近，索拉娜变得越来越怕冷。明明天上顶着大太阳，她却裹着那条破旧的毛毯，缩在墙角瑟瑟发抖。她的脸色呈现出一种灰败的惨白，嘴唇没有一丝血色。\n她想喝水，手刚伸向桌上的陶罐，指尖却突然不受控制地抽搐了一下。陶罐翻倒，水流了一地。\n她看着水洼里的倒影，发出了一声短促的尖叫。\n那不是她。倒影里的那张脸，皮肤正在变得透明，底下的血管像黑色的蛛网一样蔓延。她的眼睛里，那原本炽热的幽红光芒正在熄灭，取而代之的是一种死气沉沉的、属于坟墓的灰翳。\n“这是什么……这是什么？！”她惊恐地抓挠着自己的喉咙，那里传来一阵阵如同吞了冰块般的剧痛，“我病了吗？叫医生！叫那个老不死的木棉来！”\n她的胸口，那颗夜莺之心，此刻正跳得特别缓慢、沉重。每一次跳动，都像是在从她这具躯壳里抽取着什么，而不是给予。\n它在“饿”。\n以前，它以索拉娜的野心、贪婪和无尽的杀戮欲望为食。那时候的索拉娜是一团烈火，足以喂饱这个来自冥界的寄生虫。但现在，她的野心被现实击碎，她的贪婪被集体劳动的洪流冲刷，她的“狼性”正在这个安稳的笼子里一点点消磨殆尽。\n她不再是那个不可一世的暴君了。而这颗心脏……它不屑于寄宿在一个废物体内。它在反噬，它在索取代价，它在把她变成一具真正的、冰冷的尸体。"
LHS.132.a: "它在……吃我？"

LHS.133.t: "没有心跳的人"
LHS.133.d: "木棉走进牢房时，索拉娜已经连骂人的力气都没有了。她瘫在地上，胸口的起伏微弱得几乎看不见。周围的空气冷得像冰窖，那是从她体内散发出来的死气。\n木棉把手贴在她的额头上，眉头皱了起来。那是比石头还凉的触感。\n“救……救我……”索拉娜抓住了木棉的袖口，曾经的傲慢荡然无存，只剩下对死亡最本能的恐惧，“我不想死……我还没……还没把王位抢回来……”\n“你抢不回来的。”木棉掰开她的手，从兜里掏出一个青苹果，削了一片塞进她嘴里，强迫她咽下去，“而且，你也快死了。可不是我们杀你，是你自己那个宝贝心脏在杀你。”\n木棉指了指她的胸口，语气严肃得像是在宣读一份尸检报告：\n“那玩意儿是死人的东西。以前你疯得像条野狗，那股子要把天咬个窟窿的狠劲儿，刚好能压住它的阴气，甚至把它当柴火烧。那时候，你是靠‘吃人’来养它。”\n“可现在呢？你看看你现在的样子。没牙的老虎，拔了毛的鸡。你心里那团火灭了，但这颗心还饿着。它吃不到别人的命，就开始吃你的命。”\n索拉娜瞪大了眼睛，瞳孔涣散。她想反驳，想说自己还是狼王，可身体深处传来的那种被抽空的感觉让她不得不承认——她正在被一种不可抗拒的力量拖回那个她逃离的、寂静的冥界。\n“这才是你最大的报应，索拉娜。”木棉叹了口气，“你靠掠夺得来的力量，现在要连本带利地收回去了。在这个咱们大伙儿一起流汗盖房子的世道里，你这种靠吸血活着的怪物……已经没有活路了。”"
LHS.133.a: "唯物主义的审判，往往是生理性的。"

LHS.134.t: "地里的泥腿子"
LHS.134.d: "“所以……只能等死吗？”索拉娜的声音轻得像灰尘。\n木棉坐在那个破木箱上，沉默地看着她，手里的苹果皮长长地垂下来，一直没有断。\n“按理说是该让你死。你死了，这世上少个祸害，那颗心也就消停了。”木棉淡淡地说。\n索拉娜闭上了眼睛，等待着那个结局。\n“但是，”木棉的话锋一转，“咱们公社不养闲人，也不浪费肥料。你这身板虽然干不了细活，但好歹也是个能动的劳力。就这么埋了，可惜。”\n木棉站起身，走到窗边，指着外面那片广阔的、刚刚被开垦出来的黑土地。那里，农民们正光着脚，踩在泥水里插秧，汗水摔在地上摔成八瓣。\n“那颗心要吃东西，以前你喂它的是别人的血和恨。那玩意儿太虚，不经烧。”\n“索拉娜，你有没有想过，换一种喂法？”\n木棉回过头，眼神里透着一种令人捉摸不透的深邃。\n“去地里吧。脱了鞋，踩进泥里去。跟那些泥腿子一样，去扛大包，去挖沟，去流汗，去把自己累得像条死狗。”\n“这片土地是有劲儿的。它能长庄稼，也能养人。当你把自己的力气毫无保留地砸进地里的时候，大地会回给你一种东西。那不是虚无缥缈的野心，那是实打实的热乎气儿。”\n“用你的劳动，去填那颗心的坑。用你流出来的汗，去换它不吃你的命。”\n“这可不是什么魔法，这是咱们这儿的规矩——不劳动者不得食。你的心脏也一样，想活？那就让它跟着你一起，去给这片土地当牛做马。”\n索拉娜呆呆地看着那双沾满泥土的胶鞋。那是一条她从未想过、也最不屑的路。那是……从高高在上的掠食者，变成土地里的一只……耕牛？\n“选吧。”木棉把门推开了，“是躺在这儿烂成灰，还是去泥里……像个人一样，重新活一次？”"
LHS.134.a: "（她看着门外刺眼的阳光，伸出了颤抖的手）"

LHS.135.t: "第一次下地"
LHS.135.d: "清晨的雾气还没散，田野里弥漫着湿润的泥土腥气。\n索拉娜穿着那双不合脚的解放鞋，深一脚浅一脚地走在田埂上。她那件曾经象征着女王威严的丝绸衬衫，现在已经被换成了粗糙的工装，袖口挽得高高的，露出的手臂苍白得有些不自然。\n周围的农民们都在低头忙碌，没人多看她一眼。这让她感到一种莫名的失落，也有一丝庆幸。\n“发什么愣？下田！”旁边的一个老农大叔，把一把锄头塞进她手里，那锄柄被磨得光亮，却沉得要命。\n索拉娜握着锄头，感觉就像握着一根烧火棍。她学着别人的样子，笨拙地挥起锄头，向脚下的泥土砸去。\n“噗。”\n锄头只没入了一点点，还带起了一坨泥，溅在了她的脸上。她本能地想发火，想把锄头扔了，想大喊“我是狼王！”。\n但胸口那阵熟悉的、抽搐般的寒意让她忍住了。她咬着牙，再次举起锄头。\n一下，两下，三下……\n汗水开始顺着额头流下来，流进眼睛里，涩涩的。手掌被粗糙的木柄磨得火辣辣的疼，很快就起了水泡。腰像是要断了一样酸痛。\n但这痛感……是热的。\n随着锄头一次次落下，随着汗水一次次滴进土里，她感觉到那颗一直像冰块一样坠在心口的夜莺之心，那种饥饿的、想要吞噬一切的躁动，竟然奇迹般地平息了一点点。\n它似乎……在吞噬她的疲惫？不，是在吞噬她通过劳动释放出来的、那种最原始的生命能量。\n中午休息的时候，她瘫坐在田埂上，累得连手指都不想动。老农大叔递给她半个馒头和一碗绿豆汤。\n“吃吧，刚出锅的。”\n索拉娜看着那半个馒头，不再像以前那样嫌弃。她抓过来，大口咬了下去。虽然只有面粉的甜味和一点点碱味。\n但就是这一口，顺着喉咙滑下去的时候，她觉得……\n这好像是她这辈子吃过的，最踏实的一口饭。"
LHS.135.a: "（原来……累极了吃东西是这个味道。）"

LHS.136.t: "泥巴里的星星"
LHS.136.d: "日子一天天过去，索拉娜的手上磨出了厚厚的老茧，原本苍白的皮肤也被晒成了健康的小麦色。她学会了怎么分辨杂草和秧苗，学会了怎么看云识天气，甚至学会了用那双曾经只会杀人的手，去给受伤的耕牛包扎。\n那颗夜莺之心，已经很久没有发作了。它像是一个吃饱了的孩子，安安静静地睡在她的胸口，甚至……开始随着她的呼吸，散发出一种柔和的、不再冰冷的微光。\n一天傍晚，收工回家的路上。夕阳把整个田野都染成了金色。\n索拉娜走在队伍的最后，背着锄头，哼着这几天刚跟村里小孩学来的歌谣。路过一条小溪时，她停下来洗脸。\n溪水清澈，倒映着她的脸。不再是那个高高在上的、满脸戾气的女王，而是一个脸上沾着泥点、眼神却比以前任何时候都要明亮的普通劳动者。\n就在这时，几个孩子跑了过来。其中一个小女孩，手里捧着一朵刚摘的野花，怯生生地递到她面前。\n“索拉娜姐姐……这个给你。”小女孩说，“谢谢你今天帮我家推车。”\n索拉娜愣住了。姐姐？\n以前那些人叫她什么？陛下、暴君、恶魔……从来没有人叫过她姐姐，更没有人……送过她花。\n她伸出粗糙的手，接过那朵小小的、不起眼的野花。在夕阳下，那朵花上沾着的水珠，闪闪发光，就像是一颗坠落在泥巴里的星星。\n她看着那朵花，又看了看那个笑得一脸天真的孩子。\n突然，一滴眼泪毫无预兆地砸了下来，落在了花瓣上。\n她慌忙擦掉，像是怕被人看见自己的软弱。但那颗心，那颗曾经只装得下野心和仇恨的心，此刻却被一种从未有过的、酸涩又温暖的情绪涨得满满的。\n原来……被人需要，被人感谢，是这种感觉。\n比征服一个国家……还要让人想哭。"
LHS.136.a: "（她小心翼翼地把花别在了工装的扣眼里）"

LHS.137.t: "最后的审判？"
LHS.137.d: "公社的大会上，木棉再次提到了索拉娜的名字。\n“同志们，关于前战犯索拉娜的改造问题，我想听听大家的意见。”木棉站在台上，目光扫过下面的每一个人。\n有人站起来，想要历数她过去的罪行；有人沉默，似乎还在犹豫。\n就在这时，一个洪亮的声音响了起来。\n“俺觉得，她变了！”\n是那个曾经教她种地的老农大叔。他站起来，拍了拍身上的土，“以前她是啥样俺不管，俺只知道，这几年，她跟俺们一起下地，一起抗洪，一起吃食堂的饭。俺那块难啃的盐碱地，是她一锄头一锄头帮俺刨开的！她流的汗，不比俺们少！”\n“对！上次矿井塌方，也是她冲在最前面救人的！”另一个矿工也喊道，“她那力气，比牛还大，一个人顶住了那一根快断的梁！要是没她，俺早埋在底下了！”\n越来越多的人开始说话，说的不再是那个残暴的女王，而是一个叫索拉娜的、力气很大、干活很拼命、虽然脾气还是有点臭但心眼不坏的……同志。\n索拉娜坐在角落里，听着这些话，头埋得很低很低。她不想让人看到她现在的表情。\n木棉看着这一幕，露出了一个意味深长的笑容。\n“看来，大家的眼睛是雪亮的。”她走下台，来到索拉娜面前。\n“索拉娜，抬起头来。”\n索拉娜缓缓抬起头，那双曾经幽红色的、充满野性的眼睛，现在变成了一种沉稳的、如同大地般的深褐色。\n“那颗心，还在吗？”木棉指了指她的胸口。\n“在。”索拉娜轻声说，“但它……不饿了。”\n“那就好。”木棉拍了拍她的肩膀，就像拍一个并肩作战的战友，“从今天起，你不再是那个需要被关在笼子里的狼王了。”\n“你是索拉娜。是莉兰迪亚公社的一名……光荣的劳动者。”\n“欢迎归队，同志。”\n掌声响了起来。那是对一个新生的灵魂，最真诚的接纳。\n索拉娜站在那里，看着那一双双真诚的眼睛，终于……露出了一个，属于“人”的笑容。"
LHS.137.a: "（这个新称呼……听起来，还不错。）"

LHS.138.t:0 "打断的腿骨"
LHS.138.d:0 "东边村子的打谷场上，火把的光把黑夜照得通红。几百把锄头和草叉围成一个圈，中间是一个只有上半身的骷髅。\n它穿着夜莺之国一尘不染的制服，此时却被石块砸得破烂不堪，腿骨断成了几截，散落在泥水里。\n“烧了这怪物！”一个失去丈夫的农妇举着火把，双眼通红，“昨晚就是这帮东西冲进村子，咬死了我家的羊！”\n人群在咆哮。那骷髅没有挣扎，它眼眶里幽蓝色的火苗静静跳动，手里死死护着一封用火漆封好的信函。它发不出声音，只能发出骨节摩擦的“咔哒”声，试图把信递出去。\n我（木棉）挤进人群，咬了一口手里的青苹果，清脆的响声让周围安静了一瞬。\n“大伙儿歇会儿。”我用脚尖踢开一块准备砸向骷髅的石头，“它跟昨晚咬人的，不是一伙的。”\n我指了指村外那片还在冒烟的荒地——几只失去了控制、散发着腐臭的躁动亡灵正在那里像野兽一样游荡。\n“看那边，那是饿疯了的狼，那是咱们要清的杂草。”\n我又指了指脚边这个骷髅，它那只剩骨头的手，依然固执地举着那封信。\n“而这个，它手边明明有剑，却宁愿挨打也没拔出来。它手里的信，比它的命重要。”\n我走过去，从那只骨手里抽出了信函。\n“乡亲们，咱们恨的是那张吃人的嘴。这堆白骨头，只是个跑腿的邮差。”"
LHS.138.a:0 "（留它几根骨头，看看信里写了什么。）"

LHS.139.t:0 "麦田里的守夜人"
LHS.139.d:0 "“那天晚上，暴雨如注，厚重的乌云遮蔽了月光。\n村西头的粮仓是咱们过冬的命根子。后半夜，索拉娜遗留的臭亡灵来了。它们被粮食和生人的气味吸引，像发了霉的蝗虫一样涌过来，喉咙里发出令人作呕的嘶吼。\n民兵队的枪管打得发红，怪物却越聚越多。眼看防线就要崩溃。\n突然，气温骤降，雨滴结成了冰霜。\n从森林的阴影里，走出了一排整齐的银色方阵。那是莉莉安娜的夜莺先锋军，她们正在强行打通前往首都的道路。\n夜莺卫队没有发出任何声音，她们只是沉默地拔剑，像一堵移动的冰墙，无情地碾入了躁动亡灵的潮水中。\n一只躁动亡灵咬住了一个夜莺卫士的脖颈，那卫士连晃都没晃一下，反手一剑将对方钉死在泥地里，然后踩着同类的尸骨继续前进。\n天亮的时候，粮仓完好无损。\n地上躺满了碎骨头，黑色的与白色的混杂在一起。夜莺的军队在清理完障碍后，连余光都懒得分给我们，继续向首都进发。\n那个带头的农妇，看着这一幕，手里紧紧攥着本来想扔出去的火把。\n她沉默了很久，走到一具为了挡住怪物而碎裂的夜莺卫士残骸前，把自己刚烤好的热红薯，轻轻放在了那堆白骨旁边。\n即使它吞咽不了，即使它躯体冰凉。\n那一刻，所有人都明白了：这群死人，是有规矩的。”"
LHS.139.a:0 "（冰冷的秩序，碾碎了疯狂的混乱。）"

LHS.140.t:0 "手心里的粗糙"
LHS.140.d:0 "莉莉安娜来了。她穿着一尘不染的素白长裙，踏入这片刚翻过的农田时，眉头紧锁，眼神像极地冰川一样冷。她周身的寒气让周围的麦苗都挂上了白霜。\n她大概以为会看到一个被锁在铁笼里、遍体鳞伤的索拉娜。\n但她看到的，是一个穿着粗布工装、挽着裤腿，正站在泥水里跟一个老农为了“这垄地该种土豆还是玉米”而吵得面红耳赤的女人。\n“你这老头懂个屁！”索拉娜大嗓门吼着，手里抓着一把湿漉漉的肥料，“这土太黏了，种玉米非得涝死不可！”\n莉莉安娜彻底愣住了。\n她从未见过这样的索拉娜。粗鲁，脏兮兮，满脸泥点子。但她身上那种仿佛随时会毁灭世界的戾气消失了。取而代之的，是一种结结实实扎根在泥土里的、粗糙却旺盛的生命力。\n索拉娜转过头，看见了呆立在田埂上的莉莉安娜。她慌乱地想在衣服上擦干净手，却把泥抹得满脸都是。\n我（木棉）靠在旁边的拖拉机上，抛了抛手里的红苹果。\n“公主，你看。”我咬了一口苹果，含糊不清地说，“以前她想吃掉整个世界，现在她只想伺候好这半亩三分地。”\n莉莉安娜沉默了。她松开了紧握魔力的手，眼底的冰霜渐渐融化。\n她不顾泥泞，走下田埂，伸出那双苍白冰冷的手，轻轻握住了索拉娜那双布满老茧和泥垢的手。\n“……真脏。”莉莉安娜轻声说，眼眶却红了。\n“但……很暖和。”"
LHS.140.a:0 "（既然舍不得，就留下来一起种地吧。）"

LHS.141.t:0 "长满羽毛的伤口"
LHS.141.d:0 "那天我去野战医院，看到几个从阿德莱希前线撤下来的伤员被死死绑在病床上。\n他们的伤口没有愈合，而是长出了五颜六色的羽毛和滑腻的触须。那些羽毛还在微微颤动，伤员的喉咙里发出扭曲、狂热的笑声。 \n医生手里的手术刀在抖，护士在一旁干呕，没人敢靠近这超越常理的疯狂。\n我走过去，握住那个年轻战士已经完全变形、长满吸盘的手。那触感像一团冰冷的烂泥，但我握得很紧。\n“木棉姐……”他涣散的瞳孔里闪过一丝清明，他在变异的肉块中挣扎着哭泣，“我……我还是人吗？”\n我从兜里掏出一颗糖，剥开，塞进他满是獠牙的嘴里。\n“傻孩子，只要你还记得疼，还记得想家，你就是人。”我轻声说，抹去他眼角的血泪。\n但我知道，为了不让这种“祝福”传染给整个公社，我们必须做出那个决定。\n那天晚上的火烧得很旺。我们在火边坐了一夜，听着火堆里噼啪作响的声音，没人说话。\n我们烧掉的不是怪物，是我们的兄弟。这大概就是我们必须付出的，最昂贵的代价。"
LHS.141.a:0 "（有些污秽，只能用灰烬来洗净。）"


LHS.142.t:0 "最后一次闪光"
LHS.142.d:0 "那个总是很安静的女孩，在掩护撤退的时候，违抗了我们的命令。\n面对阿德莱希的混沌巨兽，她没有后退，反而冲了上去。\n魔力爆发的时候，光很亮，很美，像极了我在乡下见过的最盛大的烟花。\n等我们把她刨出来的时候，她手里紧紧攥着那个已经全黑了的宝石。\n宝石“咔嚓”一声碎了，就像她的命一样，脆得很。\n她没变成魔女，也没变成怪物，她只是单纯地……碎了。\n我把那堆碎片收在手帕里，扎得手疼。\n晓枫站在我旁边，咬着嘴唇，眼圈红了。\n我拍了拍晓枫的肩膀，叹了口气：“这孩子，太傻了。她本该去上学的，本该去谈恋爱的，本该……拥有一个平凡而漫长的人生的。”\n我们救了那么多人，却拦不住一个想当英雄的孩子。这世道，好人总是最先碎掉。"
LHS.142.a:0 "她本该去上学的，本该是的。"

LHS.143.t:0 "捏出来的名字"
LHS.143.d:0 "会议室里的争论声，比外面的蝉鸣还大。\n“南美人民苏维埃联盟”？太硬了，像块铁板，硌牙。\n“大解放民主共和国”？太假了，听着像那些穿着燕尾服的骗子。\n“泛大陆联合邦”？太远了，联邦意味着界线，意味着你家是你家，我家是我家。\n大家吵得面红耳赤，晓枫在黑板上列了一堆名字，又一个个划掉。雪伊擦着枪，一脸“叫什么都行，只要别叫帝国”的不耐烦。\n我（木棉）坐在窗台上，手里拿着块刚从花园里挖出来的、湿漉漉的红泥巴。\n这泥巴红得像血，软得像面团，还带着一股子雨后的腥甜味。\n我把它捏圆了，又搓扁了，最后捏成了一个歪歪扭扭的、像是房子又像是苹果的形状。\n“我说，”我懒洋洋地开了口，手里还玩着那块泥，“咱们这群人，本来就是泥地里滚出来的。”\n“以前咱们是野火，把这地烧硬了；现在咱们是水，把这地润软了。”\n“你们看这泥巴。”我举起手里那团红红的东西，“它脏吗？脏。可咱们脚下的路、住的房、端在手里的碗，哪个不是它变的？”\n“叫联邦，那是把大家用铁丝捆一起，虽然结实，但冷冰冰的，容易生锈。”\n“咱们要建的，是一个大家能挤在一个锅里吃饭，能互相把后背交给对方，能像这团泥巴一样，你中有我，我中有你的地儿。”\n我把那团红泥放在光洁的红木会议桌上，它在那里留下了一个脏兮兮的、却无比真实的印记。\n“就叫红泥吧。”\n“红泥公社。”\n“听着像个村名？这就对了。”\n“咱们这儿，本来就是个大一点的村子。\n红色的，是因为咱们流过血；泥做的，是因为咱们命贱但好养活；\n公社嘛……就是不管谁家揭不开锅了，都能来这儿盛碗饭。”\n全场安静了。\n大家看着桌上那团红泥，那是南美洲最常见的土，也是最倔强的土。\n小果子突然笑了：“红泥……听起来像是刚烤好的陶罐，暖烘烘的。”\n雪伊哼了一声，嘴角却勾了起来：“行。这名字够烂，也够硬。比那些什么帝国联邦的，像人话。”\n从今天起，地图上少了一块冷冰冰的版图。\n多了一个热气腾腾的、红泥公社。\n它不神圣，不庄严。\n但它……亲切得就像你脚底下的路。"
LHS.143.a:0 "我们是泥做的，火烧过更结实。"

LHS.144.t:0 "没有勋章的废墟"
LHS.144.d:0 "为了把圣杯远征军的装甲师阻挡在腹地之外，我们不得不烧掉了那个叫“希望镇”的地方。\n那里的甘蔗刚熟，空气里本该全是甜味。\n火点起来的时候，我站在高坡上，看着冲天的火光，心里像被剜了一块肉。\n但老乡们没哭。一个大爷把最后一把甘蔗塞给我，他的脸被火光映得通红：“烧了吧，木棉领袖。给咱们烧了取暖，也别留给那帮强盗酿酒！”\n仗打赢了。圣杯远征军的坦克陷在泥里，成了废铁。可那个镇子没了，那片甘蔗林也没了。\n我们在地图上画了个红圈，那是胜利的标记。指挥部里，大家都在欢呼庆祝。\n我嚼着那根大爷给的甘蔗。很甜，汁水很足。但我咽下去的时候，喉咙里却像卡了一把沙子。\n这胜利太苦了，苦得我嘴里的甘蔗渣子都咽不下去。我们守住了家，却也亲手烧毁了家。\n为了以后能一直甜下去，这口苦，咱们得咽。"
LHS.144.a:0 "（我们总要重建希望。）"


LHS.145.t:0 "泥浆里的扳手"
LHS.145.d:0 "阳光浓稠如熔融的糖浆，死死包裹着每一寸暴露的皮肤。空气里翻涌着酸败的雨水、新鲜的红土与植物根茎腐烂后的腥甜。\n我（木棉）卷起沾满泥浆的裤腿，半蹲在刚翻开的种植园边上。那台从圣杯远征军手里夺来的旧拖拉机像头死象，趴在泥坑里喘着粗气。\n“木棉大姐，看这个！”一个满脸汗水、笑得露出牙床的汉子跑过来，指着那道被树脂和芭蕉叶死死糊住的油箱裂口。他那双由于常年劳作而骨节粗大的手，此刻正沾满黑亮的机油，兴奋地颤抖着，“专家的图纸说这机器报废了，可咱们村的老李头说，树胶配上烧红的铁片，最能补漏。您听，它正冲着咱们吼呢！”\n雪伊按着腰间的枪柄，视线在粗糙的补丁与颤抖的活塞间来回切割。她眼底的理性与对规则的敬畏正在剧烈搏动。她几乎要开口下达关停指令，却被那股子热腾腾的、充满野性的生命力强行堵回了嗓子。 \n我咬下一口酸涩的番石榴，任由清脆的汁水刺激喉咙。“雪伊，收起你那套工厂准则吧。这里的每一棵藤蔓都在教咱们怎么活下去。既然这铁疙瘩选择了守咱们红泥地的规矩，咱们就由着它去闹。”\n雪伊紧绷的肩膀终于颓然松下。她看着那些在泥水里欢呼的乡亲，看着群众的智慧像藤蔓一样爬满生锈的炮管。这人间，远比指挥部里的报表要喧嚣得多。”"
LHS.145.a:0 "（这片土，总有办法养活自己。）"

LHS.146.t:0 "算错的配给单"
LHS.146.d:0 "第一钢铁厂的大门前，运煤的卡车排成长龙，排气管排出的黑烟模糊了黄昏的轮廓。喇叭声此起彼伏，撞击着紧绷的神经。\n新上任的工管委主任——那个曾在巷战中为大伙儿挡过子弹的钳工，此刻正死死攥着一张被汗水浸透、揉皱的配给单。他算错了煤炭的消耗比，导致三号高炉的火焰正在急剧萎缩，这代价是下游四个工厂的全面停摆。\n“全毁了……我只会拧螺丝，我凭什么以为自己能算明白这些……”他跌坐在煤堆旁，满头大汗地揪着头发，眼底燃烧着因无能而产生的自责。他试图撕毁那张令他受辱的纸页，逃回那个只需听命行事的昨天。\n晓枫挤进人群，鼻尖挂着晶莹的汗珠。她按住那只正在发力、指节发白的手臂，稳稳地夺过配给单。\n“这就叫当家作主的味道，老李。”晓枫的声音清脆，在这片焦虑的海洋里劈开一道裂痕，“这纸上的每一个错字，都是咱们成长的血印子。”\n她抄起一块焦煤，在那堵布满黑灰的砖墙上画出一个巨大的圆。她用最接地气、最土气的比喻，把复杂的工业平衡拆解成了熬一锅大米粥的火候。她甚至讲了一个自己当初在军团里算错马草数额的笑话，逗得周围几个年轻技工噗嗤笑出了声。\n“笔再重，重得过那两百斤的钢锭吗？再算一遍，这次大家伙儿一起算。”\n晓枫把断掉的粉笔塞回老李手里。夕阳下，一群满身黑灰的人围在砖墙前，开始用这种最原始、最笨拙、却也最坚韧的方式，接管了这座国家的命脉。"
LHS.146.a:0 "（羞耻心，是咱们最硬的脊梁。）"

LHS.147.t:0 "晓枫的烤红薯"
LHS.147.d:0 "行政大楼的会议室被燥热的空气填满。几个大区的代表为了争夺新一批的农机配额，吵得几乎要掀翻房顶。他们挥舞着由于缺少零件而停工的报告，眼神里满是求存的焦虑。\n晓枫坐在长桌的尽头，脸色透着一种极度不正常的苍白，唯有那双眼睛，明亮得让人心头发紧。她手里抓着一块已经冷掉、沾着炭灰的烤红薯，安静地听着每一声怒吼。 \n等大家嗓子都哑了，她站起身，在大黑板上画了一个歪歪扭扭的大饼，在南边那个被焦土政策毁掉的区域，画了一个小小的叉。 \n“兄弟们，西区缺的是齿轮，东区缺的是履带，可南边——”她用粉笔在那个叉上重重一戳，粉笔应声折断，“南边那几个村子，去年为了给咱们的主力拉防线，连最后一口保命的麦种都填进火炉里了。他们现在连哭的力气都快没啦。”\n她把那半块冷红薯塞进嘴里，嚼得特别用力，仿佛那是世界上最美味、也最沉重的祭品。\n“今天这配额，我做主，分七成给南边。剩下的，咱们大伙儿勒紧裤腰带，去把那些坏掉的机器拆了，零件互相匀匀。要是谁还有怨言，散会后去我那儿领红薯，管饱，但也得管你们脸红。”\n会议室陷入了针落可闻的死寂。西区的大姐第一个低下了头，默默抹去了申请表上的数额。 \n晓枫微笑着坐回原位，又咬了一口红薯。但我（木棉）清楚地看到，她那只藏在桌布下的手，正因为剧烈的幻痛而痉挛性地扭曲着。她正在用自己的命，去填平这片大陆上每一个无法被数字计算的苦难之坑。"
LHS.147.a:0 "（她把所有的苦，都咽下去了。）"


LHS.148.t:0 "广场上的泥巴"
LHS.148.d:0 "烈日如火，红泥广场上的热浪扭曲了视线。几万名工人、农民和复员老兵黑压压地挤在一起。他们手里举着生锈的铁铲和沉重的扳手，粗重的呼吸声汇成了一股令人战栗的雷鸣。\n台阶上，那几个利用职权私藏救济粮、打算卖给黑市的新晋干部，正瘫软在泥地里，眼神涣散。他们的家底被抄了出来，一袋袋洁白的细面堆在台阶上，在周围那张张饥黄面孔的映衬下，显得极尽嘲讽。\n“开枪啊！雪伊同志！你在等什么？！”人群中爆发出一声凄厉的质问，那是一个在灾荒中失去了孙女的老矿工，他的左手紧紧攥着一块红砖，指甲缝里渗出了血。\n愤怒的声浪像海啸一样，几乎要将雪伊和她的宪兵队淹没。雪伊死死咬着牙，握着配枪的手指在剧烈颤抖，她眼中的杀意比群众还要纯粹，却被法理与秩序的枷锁锁得生疼。\n我（木棉）推开重重卫兵，跨步走上台阶。在那几万双燃烧的眼睛注视下，我收敛了所有的慵懒，双膝重重砸在地板上，向着那片黑压压的森林，深深地、郑重地叩首下去。\n“对不住，乡亲们。”我抬起头，额头沾满了红色的泥土，“这把刀，是我们没磨快，让它长了锈，割伤了自家人。”\n我站起身，指着那些战栗的蛀虫，语气平静如冰，却重若千钧：“剥去军装，没收财产。送去最深的矿井，让他们在那儿，用一辈子的汗水，去还清那一袋细面的债。公社不浪费一颗子弹，因为每一颗子弹，都该是留给敌人的。”\n人群中，那个老矿工手中的红砖落在了地上，摔成了碎块。他看着那些被反绑着拖向远方的败类，发出了一声近乎呜咽的怒吼。那声音穿透了云层，在这片红土地上久久回荡。"
LHS.148.a:0 "（正义的重量，得由活人来背。）"


LHS.149.t:0 "黑板前的索拉娜"
LHS.149.d:0 "夜校的教室设在一间满是汽油味的修械所里。昏黄的灯光下，影影绰绰地坐满了劳累了一整天的劳动者。 \n我站在窗外，看向那个最格格不入的身影。 \n索拉娜。那个曾妄图吞噬一切的狼王，此刻正把自己蜷缩在一个窄小的木凳子上，手里攥着一支快要折断的铅笔。她死死盯着黑板上那道关于物资分配的加减题，额头的汗珠混合着机油顺着伤疤滑落。 \n“老子能砍下一万个脑袋，却算不明白这几袋烂土豆！”她烦躁地嘶吼着，幽红的眼睛里满是不甘与狂躁。她猛地站起身，想把那张写满公式的纸页撕个稀烂。 \n“坐下。”莉莉安娜的声音清脆如晨钟，按在了她的肩膀上。这位夜莺公主穿着最朴素的灰色布裙，正认真地纠正着一个老妇人的发音。她回过头，对着索拉娜眨了眨眼，眼底满是只有她们两人懂得的温柔与揶揄。 \n“木棉姐姐说，如果今晚算不出来，你明天就得去给南区的拖拉机手洗一个月裤子。你也看到了，那里的泥巴特别厚。” \n索拉娜僵住了。她看着莉莉安娜那张毫无杂质的笑脸，又看看周围那些正用好奇、探究甚至带着一丝善意的眼神盯着她的工人们。她那身暴戾的刺，在这间充满了汗味与求知欲的屋子里，被强行抚平了。 \n“洗就洗！老子洗的衣服肯定比那帮臭男人干净！”她骂骂咧咧地重新坐下，咬着牙，在那张白纸上一笔一画地写下了那串代表着智慧的数字。 \n那是她第一次，试着用这种方式，去守护这片她曾践踏过的土地。"
LHS.149.a:0 "（这唰唰声，真好听。）"


LHS.150.t:0 "灯下的咳嗽声"
LHS.150.d:0 "深夜的档案室里，纸张翻动的声音像极了某种在骨骼间爬行的毒虫。空气凝固如铅，只有那盏摇摇欲坠的油灯在拼死挣扎。\n雪伊一言不发地推开那堆如山的物资清单，将一份盖着红色火漆的绝密档案拍在我的面前。她的手在发抖，指甲在木桌上划出刺耳的摩擦声。 \n我展开档案。上面记录着这半年来公社的所有医疗调配指令。我的视线瞬间被一行行猩红的文字击穿：超剂量的吗啡、禁忌的神经兴奋剂、以及足以毁掉常人意识的止痛针剂。 \n所有的申请人，都是同一个名字。 \n晓枫。 \n为了在那个管理层崩溃、物资极度匮乏的动荡期维持公社的运转，她瞒着所有人，透支了自己的生命潜能。她用药物强行锁住了身体的悲鸣，用那些禁忌的化学药剂，换取了整整一百八十天、那份近乎奇迹的、永远带着笑意的“精确统筹”。 \n“她昨天视察码头的时候……咳出了一整滩血。”雪伊的声音沙哑得不成样子，她死死闭上眼，任由两行血泪趟过脸上的泥污，“医生说，她的身体已经透支到极限了。她现在连维持睁眼，都得靠烧掉脑子做燃料。” \n门外，传来了那串熟悉的、极轻的脚步声。随后是一阵被死死压抑在喉咙深处、却依旧撕心裂肺的剧烈咳嗽。 \n那个总是坐在窗边啃红薯、把所有的重担都包装成笑话的女孩，此时正靠在阴冷的墙壁上，大口大口地喘着粗气。每一口呼吸，都带着一股浓烈的、化不开的血腥味。 \n她回过头，正撞上我们的目光。她愣了一下，随即费力地牵动那张已经开始坏死的脸部肌肉，挤出了那个标志性的、慵懒却灿烂的笑。 \n“哟……都在呐？那什么……明天的开工仪式，我那份红薯，记得多加点糖。”"
LHS.150.a:0 "（这笑话……一点也不好笑。）"

LHS.151.t:0 "接过的粉笔"
LHS.151.d:0 "医院外的红泥路被祈祷的人群堵得密不透风。几万人沉默地守在雨里，手里捧着从自家田里摘下的第一束花，或者是一枚洗得发亮的勋章。 \n夜校的课堂上，晓枫倒下的地方，那半截沾血的粉笔还静静躺在地上。 \n老工人李师傅，那个曾经只会拧螺丝、被晓枫手把手教过识字的粗汉，在所有人的注视下，一步步走向了讲台。他每走一步，地板都发出沉闷的呻吟，像是一座沉重的大山正在艰难移位。 \n他弯下腰，用那双布满老茧、甚至还缺了半根手指的手，颤抖着捡起了那半截断掉的粉笔。 \n“晓枫同志累着了。她为了让咱们这帮大老粗能看懂报表，能自己管自己，把自个儿给熬成了渣子。”李师傅转过身，浑浊的眼睛里燃烧着光芒。 \n他在黑板上，在那道晓枫还未写完的物资分配公式下方，用力地写下了第一笔。粉笔摩擦着板面，发出尖锐的声响，像是在剥开结痂的伤口。 \n“她教过咱们，权力这玩意儿不是拿来显摆的，是拿来算计这锅饭怎么匀给最饿、最能干的人吃的。”他回过头，对着教室里几百双通红的眼睛嘶吼，“她现在躺在里头帮咱们扛着死神，咱们在这外头，就不能让这根粉笔断了！谁要是觉得自己算不明白，就自觉滚出这间教室！” \n一名年轻的女工哭着站了起来，她走上台，接过了另一截粉笔。接着是第二个，第三个…… \n在这间狭窄而充满油烟味的教室里，一种名为“责任”的力量，正随着这一声声清脆的断裂声，彻底植入了这群劳动者的脊髓。 \n引路人已经燃尽。现在，是万千火把齐明的时刻。"
LHS.151.a:0 "（她没讲完的课，咱们接着讲。）"

LHS.152.t:0 "墙上的红木棉"
LHS.152.d:0 "晓枫的病房正对着公社的广场。夕阳最后一抹余晖落在那面巨大的、洁白的宣誓墙上。 \n我（木棉）推着轮椅，把那个已经瘦得几乎没有重量的女孩推到了窗边。她已经说不出话了，只能睁大那双深陷的眼睛，贪婪地注视着窗外。 \n广场上，成千上万的人正在排队。他们没有喧嚣，没有争吵。每一个经过宣誓墙的人，都会割破自己的手指，或者在手心抹上一把鲜红的泥土，然后在墙上印下一个清晰的掌印。 \n那是公社最高的誓约：【余粮上缴，生死同舟】。 \n密密麻麻的红手印，由下而上，逐渐填满了整面墙壁。从远处看去，那不再是一只只手掌，而是一朵朵正在怒放的、鲜艳如火的红木棉。 \n那是这片土地给晓枫的回礼。 \n晓枫看着那面墙，看着那些为了减轻她的负担而自发组织起来的、正在学着自我管理的民众。她的胸口剧烈地起伏了一下，一股久违的红润竟奇迹般地爬上了她的脸颊。 \n她费力地抬起那只已经布满针孔的手，指了指窗外，又指了指自己的心口，对我露出了一个此生最纯粹、最没有任何伪装的笑容。 \n“头儿……”她用几乎只有气流的声音呢喃着，“这地……热乎了。” \n我紧紧握住她冰凉的手尖，把它按在我的颈动脉上，让她感受那股同样滚烫的、属于活人的搏动。 \n“嗯。开花了，晓枫。满山的木棉花，全开了。” \n那一刻，整座红泥公社都安静了下来。唯有这面由万人血手印筑成的生命之墙，在晚风中，散发出令人窒息的、震撼灵魂的红色光芒。"
LHS.152.a:0 "（这是这世间，最厚的地基。）"

LHS.153.t:0 "喂狗的肉"
LHS.153.d:0 "“广场上，人山人海，唾沫星子能把人淹死。\n索拉娜坐在条凳上，穿着沾满牛粪的工装，双手被反绑着。面对周围震耳欲聋的声讨，她没低头，反而梗着脖子，幽红色的眼睛里全是桀骜不驯的凶光。\n‘我杀人？！’她冲着人群嘶吼，声音比批斗她的人还大，‘我杀的是那些骑在你们头上的肥猪！是我把他们的金库砸了，把肉汤端到你们面前！你们这群没良心的饿死鬼，吃我肉的时候怎么不嫌腥？！’\n人群被这头凶狼的气势震了一下。\n但很快，一个断了腿的中年女人柱着拐杖，一步步挪到了最前面。\n她把一个空荡荡的破铁碗，狠狠地砸在索拉娜的脸上。铁碗磕破了索拉娜的额头，血流了下来。\n‘你是给过我们肉。’女人的声音嘶哑，带着刻骨的恨，‘可你把我们当人看了吗？’\n‘你给我们饭吃，就像喂一条你养的狗！谁敢叫唤一声，谁敢多要一口，你的黑皮卫队就直接开枪！我的腿，就是因为说了一句‘粥里掺了沙子’，被你手下打断的！’\n‘我们是穷，我们是饿。但我们不是畜生！’女人指着索拉娜的鼻子，泪流满面，‘你跟那些贵族老爷有什么区别？他们用金鞭子抽我们，你用带血的骨头砸我们！你从来就没瞧得起我们！’\n索拉娜的嘶吼卡在了喉咙里。\n她看着那个破铁碗，又看着周围那一双双充满仇恨和屈辱的眼睛。她原本以为自己是从烂泥里爬出来、为穷人做主的狼王，可此刻，这些同为‘烂泥’的人，却用最锋利的刀子，戳破了她那层自欺欺人的窗户纸。”"
LHS.153.a:0 "（高高在上的施舍，永远换不来尊严。）"

LHS.154.t:0 "白裙子上的泥巴"
LHS.154.d:0 "“批斗大会进入了最狂热的阶段。几个激进的年轻工人，拿着剪刀，想要剪掉索拉娜那一头金发，以此来‘剪除旧王室的余毒’。\n索拉娜被按在泥地里，像头被困住的野兽一样挣扎、咒骂。\n就在剪刀即将落下的时候，一抹纯白色的身影突然冲进了人群。\n是莉莉安娜。\n这位习惯了夜莺之国永恒寂静的公主，跌跌撞撞地跑过来，张开双臂，死死地挡在了索拉娜的身前。\n‘别碰她！’莉莉安娜的声音清脆、颤抖，带着一种完全不了解人间险恶的天真，‘你们为什么要这样？她明明……她明明心底里是很心疼你们的！她每天晚上做梦，都在怕你们吃不饱！她只是……只是不懂得怎么好好说话呀！’\n狂热的人群愣住了。他们看着这个干净得像个瓷娃娃一样的女孩，感到一种被冒犯的愤怒。‘哪来的千金大小姐？！滚开！这是我们贫苦人的会场！’\n一块沾着泥水的土块，从人群后方飞了过来，‘啪’地一声，砸在了莉莉安娜雪白的裙子上，污浊的泥水顺着她娇嫩的脸颊滑落。\n莉莉安娜呆住了。在她的万年生命里，从未有人对她施加过如此粗暴的恶意。\n索拉娜看到那一幕，眼睛瞬间变得血红。\n‘我宰了你们！！！’她发出一声令人毛骨悚然的惨嚎，竟然硬生生挣断了粗麻绳，像疯狗一样扑向那个扔泥巴的人。\n几个纠察队员立刻冲上去，用枪托将她狠狠砸倒在地。\n莉莉安娜扑过去，抱住满头是血的索拉娜，眼泪吧嗒吧嗒地掉进泥土里。\n‘别打了……求求你们，别打了……’她哭着恳求。\n而索拉娜躺在泥水里，死死护着莉莉安娜那沾了泥的裙角，咬着碎裂的牙齿，死撑着不肯发出一声哀嚎。”"
LHS.154.a:0 "（水晶掉进烂泥塘，总是要沾点脏的。）"

LHS.155.t:0 "一碗残汤"
LHS.155.d:0 "“我（木棉）带着雪伊，强行分开了狂热的人群。\n索拉娜像一滩烂泥一样瘫在地上，莉莉安娜紧紧抱着她，裙子已经看不出原来的颜色。\n几个还想动手的年轻人被雪伊用枪托砸了回去，场面终于安静了下来。\n我走到索拉娜面前，蹲下身。她抬起那张肿胀、青紫的脸，眼神里第一次没了那种嚣张的恨意，只剩下一种深不见底的迷茫和破碎。\n‘你看，’我咬了一口苹果，语气平淡，‘你以为你懂他们，其实你根本不懂。你用暴君的方法去爱他们，他们只会用暴民的方法来回报你。’\n索拉娜没有反驳，她只是呆呆地看着自己那双因为掏大粪而布满裂口的手。\n这时，人群里走出来一个干瘦的老头。那是村里负责烧大锅饭的老炊事员。\n他手里端着一个豁了口的粗瓷大碗，里面是半碗混着几片菜叶的温热米汤。\n在所有人复杂的注视下，老头走到索拉娜面前，把那碗汤放在了她那双颤抖的手边。\n‘喝吧。’老头叹了口气，声音里满是沧桑，‘今天干的活儿重。再怎么着，在这片地界上，只要你流了汗，总归有你一口吃的。’\n索拉娜僵硬地低下头，看着那半碗浑浊的米汤。\n曾经，她坐在王座上，将成吨的烤肉扔给这些人；而现在，她像一条丧家之犬，接受着她曾经‘施舍’过的人，施舍给她的一碗残汤。\n她颤抖着端起碗，连着泥沙和血水，大口大口地灌了下去。\n滚烫的眼泪，终于顺着她脏兮兮的脸颊，大颗大颗地砸进了碗里。”"
LHS.155.a:0 "（这口饭，比任何刀子都扎心。）"

LHS.156.t:0 "缝补的伤口"
LHS.156.d:0 "“莉莉安娜坐在野战医院的病床前，手里拿着绷带和针线。\n她面前躺着的，是一个在矿井塌方中砸断了腿的年轻工人。正是前几天在广场上，对着索拉娜喊得最大声的那个小伙子。\n我安排她来这里做护工。一开始，她很抗拒，她害怕这些粗鲁的生者。\n但现在，她正小心翼翼地，用她那双曾经只用来释放高阶死灵魔法的手，一点点地为这个工人缝合伤口。\n‘疼吗？’她轻声问，声音里带着一如既往的温柔。\n小伙子咬着毛巾，满头大汗，却硬挤出一个笑：‘不疼。公主殿下……上次在广场，对不住啊，弄脏了你的漂亮衣服。’\n莉莉安娜的手顿了一下。\n她看着这个因为疼痛而痉挛、却依然向她道歉的年轻人类。她突然明白了，那天向她扔泥巴的，并非一群不可理喻的怪物，而是一群会痛、会怨、也会感到抱歉的，活生生的人。\n‘没关系。’莉莉安娜摇了摇头，嘴角弯起一个好看的弧度，‘那件衣服太白了，本来就不适合在这里穿。’\n她低头继续包扎。在这个充满消毒水和血腥味的简陋帐篷里，这位夜莺之国的公主，似乎终于找到了她在这个喧嚣世界里，最真实的位置。”"
LHS.156.a:0 "（比起永恒，这里更需要你的温柔。）"

LHS.157.t:0 "水桶与橘子"
LHS.157.d:0 "“夕阳西下，我（木棉）坐在田埂上剥橘子。\n不远处的地里，索拉娜正挑着两桶水，深一脚浅一脚地走在泥地里。扁担把她的肩膀压出了一道红印，她还在习惯性地骂骂咧咧：‘这该死的破桶！等老子……’\n‘等你怎么呀？’\n莉莉安娜从后面跟上来，递给她一块擦汗的毛巾。莉莉安娜已经换上了灰蓝色的粗布工装，头发用一根麻绳随意地扎在脑后。\n索拉娜撇了撇嘴，把后半句‘把你们都宰了’硬生生咽了回去，嘟囔着接过毛巾，狠狠地擦了一把脸。‘累死了。’索拉娜抱怨道，但在莉莉安娜面前，她那股戾气就像是被驯服的野犬。\n‘今天你帮李大爷翻了半亩地，他说明天送咱们一篮子新摘的豆角。’莉莉安娜笑着，帮索拉娜理了理沾了泥巴的领口，‘晚上我给你做豆角焖面，好不好？’\n索拉娜眼睛亮了一下，随即又故意板起脸：‘随便。多放点油。’\n我看着这两个曾经在冥界和王座上呼风唤雨的家伙，现在正为了半亩地和一篮子豆角拌嘴。\n我走过去，把手里剩下的一半橘子，塞进了索拉娜用来挑水的那个空水桶里。\n‘好好干，’我拍了拍水桶，‘明年的工分要是挣不够，那颗心脏可是会挨饿的。’\n索拉娜瞪了我一眼，却没敢还嘴，挑起水桶继续往前走。莉莉安娜则向我挥了挥手，笑容像田野里的晚风一样恬静。”"
LHS.157.a:0 "（野草扎了根，就拔不掉了。）"

LHS.158.t:0 "屋檐下的躲雨人"
LHS.158.d:0 "“南美洲的雨，说来就来。\n暴雨浇透了农场。我（木棉）跑到旁边的一间茅草屋屋檐下躲雨。\n刚站稳，就看到另外两个人也急匆匆地跑了过来，挤在了这片小小的屋檐下。\n是索拉娜和莉莉安娜。\n索拉娜手里还死死护着一小把刚拔出来的、沾着泥的野葱，生怕被雨水打烂了。莉莉安娜则在一旁帮她拍打着衣服上的水珠。\n我们三个并排站着，看着外面瓢泼的大雨，谁也没有说话。\n突然，索拉娜把那把野葱往我面前一递。\n‘喂。’她粗声粗气地说，眼神看着雨幕，‘这葱挺新鲜的。晚上……来搭个伙？’\n我愣了一下。\n这个曾经恨不得把我千刀万剐的暴君，现在居然在邀请我，去吃她亲手种出来的野葱。\n我看着她那双布满老茧的手，还有莉莉安娜充满期待的眼神。\n我笑了。\n我从兜里摸出三个皱巴巴的红枣，分给她们一人一个。\n‘行啊。’我把红枣在衣服上蹭了蹭，咬了一口，‘我出甜点。’\n雨下得很大，天地间白茫茫的一片。\n但在这个拥挤、漏风、散发着泥土味的屋檐下。\n我们这群曾经斗得你死我活的人，终于，真真正正地，”"
LHS.158.a:0 "（踩在了同一片土地上。）"

LHS.159.t:0 "那是什么衣服？！"
LHS.159.d:0 "狂欢节的游行队伍里，突然爆发出了一阵惊呼。\n我（木棉）正坐在高台上，手里拿着个刚削好的苹果，眯着眼睛看过去，手里的动作突然僵住了。\n只见一支特殊的方队走了过来。\n那是……那些加入了我们的魔法少女同志们。\n但是，走在她们中间的……\n晓枫居然换下了那身永远笔挺的军装，穿上了一身繁复的魔法少女装扮。她脸上带着温和却又有些不知所措的红晕，双手甚至不知道该往哪放，却还在努力维持着总参谋长的端庄。\n雪伊……噗，雪伊这丫头脸红得快要滴出血来了。她被迫换上了一身满是蕾丝和花边的魔法少女裙，但手臂上居然还顽固地戴着那枚象征纪律的红色袖章！她死死地攥着裙角，那表情凶得像是下一秒就要拔枪把设计这身衣服的人给毙了，活像一只炸毛的黑猫。\n小果子走在最前面，她开心得不得了。她褪去了往日的水手服，换上了一身梦幻般的魔法少女装束。她手里紧紧捧着不知道从哪弄来的魔法道具，那双大眼睛亮晶晶的，笑得像个没心没肺的天使。\n连索拉娜……那个被我拉出来放风的家伙，也被套进了一件童话般的红色兜帽里，一脸“我想杀了你们所有人”的表情。\n\n而在她们周围，是那群真正的魔法少女，正在笑嘻嘻地撒着花瓣。\n“木棉姐！”带头的魔法少女喊道，“这是我们送给委员会的礼物！既然大家是一家人了，就要整整齐齐的嘛！这是最新款的战斗服（虽然没属性），穿上它，心情会变好的！”\n还没等我反应过来，一件颜色特别鲜艳的魔法少女裙就朝我飞了过来。最离谱的是……里面居然还夹着一根做成苹果形状的魔法杖！\n“胡闹！”我笑骂着，却把那根苹果法杖紧紧握在了手里。\n那一刻，整个广场上的人都笑疯了。\n在这个荒诞、可爱又热气腾腾的瞬间，好像连天上的星星，都忍不住眨了眨眼。\n谁说革命者就得板着脸？咱们不仅能打碎旧世界，咱们还能……拿着苹果法杖，漂亮地赢！"
LHS.159.a:0 "（穿上）……好吧，为了同志们的友谊！变身！"
LHS.159.b:0 "（拒绝）这种好东西……还是留给索拉娜一个人享受吧！"

LHS.160.t:0 "黎明前的篝火"
LHS.160.d:0 "夜深了。海浪一遍又一遍地拍打着沙滩，发出沉闷而温柔的碎裂声。 \n咱们四个人——我，晓枫，雪伊，还有小果子。围坐在这一小堆忽明忽暗的篝火旁。为了让晓枫暖和点，雪伊几乎把整个林子的枯枝都搬过来了，火苗蹿得老高。 \n晓枫披着厚厚的毡毯，靠在藤椅里。火光映照着她脸上那些无法褪去的疤痕，勾勒出一种近乎神性的宁静。她正用那只恢复了些力气的手，笨拙地剥着一个烤得焦黑的红薯。 \n雪伊坐在她脚边，手里握着一块磨刀石，却始终没去碰那把横在膝头的老步枪。她只是低着头，盯着跳动的火星，眼底翻涌着从未示人的软弱。 \n“头儿。”小果子揉了揉眼睛，声音闷闷的，像是被海风吹散了，“以后……咱们是不是不用再杀人了？” \n我拨了拨火堆，火星飞向漆黑的天空。“只要地里的粮食够吃，只要大家伙儿还愿意这么坐在一起烤火，那枪口就该生锈。那是咱们的福气。” \n雪伊突然开口，声音嘶哑：“我怕……我怕我睡一觉醒来，这火就灭了。我怕这都是一场梦。” \n晓枫停下了剥红薯的动作。她伸出手，指尖带着红薯的温热，轻轻点在了雪伊的额头上。 \n“那就把眼睛睁大点，雪伊。”晓枫笑了，那是看透了宿命后的洒脱，“梦是不会疼的。咱们这身上的伤、心里的疤、还有肚子里那阵阵的饿劲儿……全是真的。因为是真的，所以这火，灭不掉。” \n她掰开红薯，分成了四份。那一刻，在这个被世界遗忘的角落，四个在死人堆里爬出来的少女，像是在分享着一个世纪的终点。 \n咱们谁也没提那些死去的战友。因为他们正化作这海风、这泥土、这噼啪作响的木柴，紧紧地围在咱们身边。 \n“睡吧。”我叹了口气，也像是卸下了万年的甲胄，“天亮之后，还有半亩地等着咱们去翻呢。”"
LHS.160.a:0 "（火光很暖，日子还长。）"


LHS.161.t:0 "海鸥的航向"
LHS.161.d:0 "清晨的海面上，大雾弥漫得几乎要吞噬所有的光。 \n小果子驾驶着那艘最旧、最破、却最让战友安心的巡逻艇，缓缓划破了绸缎般的海面。甲板上，那口巨大的铁箱子散发着一种陈旧、阴冷且绝望的气息，那是属于旧时代的最后一具棺材。 \n里面装着圣杯远征军的破损军旗、索拉娜断掉的权杖、以及那些记录着无数罪恶与掠夺的黑色契约。这些东西，曾是套在南美咽喉上的枷锁。 \n“就这儿吧。”小果子拉下舵柄，引擎的轰鸣声在浓雾中戛然而止。 \n几名苍老的、在战争中失去儿女的老水手走上前，他们满布伤痕的脊背在此刻挺得笔直。他们默不作声，只是合力将那口沉重的箱子推向了幽深的汪洋。 \n“扑通。” \n水花飞溅，随即迅速归于寂静。 \n小果子站在船头，看着那些气泡一个个破裂。她缓缓摘下那顶象征着“战斗”的、布满硝烟味的水手帽，任由微黄的长发在晨风中肆意飞舞。 \n“晓枫姐说，大海是会洗澡的。它能洗掉血，也能洗掉恨。”她对着那片泛着泡沫的海面，轻声呢喃，声音里透着一股子跨越生死的澄澈，“带走它们吧。离咱们的新家远点。永远……别再回来了。” \n浓雾深处，太阳终于撕开了一道金色的裂缝。光芒洒在小果子的脸上，照亮了她眼角那一抹尚未干透的、极致细腻的泪痕。 \n那是告别。是对那个只有杀戮与饥饿的昨日，最后的一场送葬。 \n“满舵！返航！” \n她重新带上军帽，用力地拉响了汽笛。长鸣声惊起了远处的一群海鸥。它们振翅高飞，向着那片已经苏醒的、赤红色的陆地，义无反顾地冲去。"
LHS.161.a:0 "（旧的时代，沉底了。）"


LHS.162.t:0 "结满苦果的丰收"
LHS.162.d:0 "这是战后第一个大丰收。农场里的车排成了见不到头的长龙，空气里全是玉米和红薯被太阳晒透后的甜香味。 \n我（木棉）坐在那棵大榕树底下，阳光穿过叶缝，斑驳地洒在我满是老茧的手心。我手里拿着一个剥开的橘子，那酸甜的味道却总让我想起当年的硝烟。 \n不远处，晓枫正坐在那把总是咯吱作响的藤椅上，膝盖上堆满了刚收上来的账本。她正笑着，耐心地教几个十几岁的娃娃如何辨认红泥里的种子。她的眼神清澈如水，却深不见底，藏着咱们所有人都不敢触碰的疲惫。 \n索拉娜则撸着袖子，在田埂上教训一个把水渠挖歪了的小伙子。她骂得特别难听，却在对方低头认错时，顺手把自己腰间那壶凉茶塞进了人家怀里。莉莉安娜在一旁，正笨拙地跟着几位大娘学习缝补那件已经被汗水浸得发黄的公社工装。 \n一切都太美好了。美好得让我想哭。 \n我把一瓣橘子放进嘴里。 \n这橘子是在当年的战壕上种出来的。我咀嚼着，咀嚼着。 \n喉咙里却慢慢泛起了一丝无法抹去的、淡淡的苦味。 \n我想起了那个死在艾瑞波拉血巷里、临死还喊着想吃一块糖的通信员；想起了那些在卡卡罗姆矿井深处，为了保护最后一袋麦种而活活饿死的姐妹。 \n他们变成了这脚下的红泥，撑起了这一季的丰收。我们分享着这份甜，却永远也没法子把这甜味儿，塞进他们的嘴里。 \n“木棉阿姨！”一个扎着辫子的小女孩跑过来，把那本刚刚出版的、印着《革命英雄史》的历史书扔在我腿上，“老师太坏了！为什么要让我们背这些死人的名字？我想去捉蝴蝶！” \n雪伊眉头一挑，正要上去训话，却被我拉住了。 \n我看着那个孩子天真无邪、没有一丝阴霾的眼睛。我突然笑了，笑得眼泪止不住地往橘子皮里掉。 \n我摸了摸她的头：“是啊，去吧。”我轻声说，声音轻得连我自己都快听不见了，“别背了，蝴蝶好看。去吧。”\n同志们，你们看到了吗？ \n咱们把命填进这烂泥里，把魂熬在这红土中…… \n不就是为了让这个孩子，能理直气壮地觉得咱们的故事“又臭又长”吗？ \n不就是为了让她，能头也不回地跑向那片没有墓碑的花海吗？ \n我看着这片生生不息的大地。 \n“走吧，同志们。”我拍掉身上的尘土，嗓音沙哑却无比通透，\n“这就是生活。”"
LHS.162.a:0 "（同志，这就是生活。）"

LHS.1622.t:0 "这是最后一次规矩"
LHS.1622.d:0 "浓雾如同厚重的铅块，死死压在破晓前的大西洋边缘。老李叔的双手长满粗糙的老茧，此刻正死死焊在“红泥三号”的木制舵盘上。底舱里，装满了好不容易从黑市换来的奎宁与盘尼西林。那是一整座南区医院娃娃们退烧的唯一指望。\n\n晨光艰难地撕开雾气。一堵雪白的钢铁高墙，犹如神明降下的裁决，硬生生截断了航线。那是圣杯王国的远洋巡洋舰。刺目的探照灯光柱如同实质的利刃，死死钉在老李叔布满皱纹的脸上。\n\n舰桥上，高音喇叭传来一阵夹杂着电流声的、优雅且平稳的男中音。那声音带着清晨享用完红茶后的从容：\n\n“清晨好，红泥公社的先生们。我是圣杯第六舰队的执勤长官。我们刚刚锁定了你们的货单。”\n“你们货舱里的抗生素，皆属于医药联盟的专利财产。你们试图用廉价的橡胶走私这些受管制的配方，这种行为严重扰乱了全球市场的定价基准。”\n\n老李叔抓起对讲机，沙哑的嗓音里透着浸透血泪的恳求：“长官，咱们南区的孩子正烧得抽搐！这批药是拿弟兄们的命换来的，求您高抬贵手，放条生路！”\n\n对讲机那头传来一声极轻的叹息，仿佛带着某种居高临下的怜悯。\n\n“老先生，我特别同情贵方肆虐的疟疾。”那位长官的语气依旧彬彬有礼，却透着股冻结骨髓的冰冷逻辑，“但在民主社会的法则里，每一粒药片都凝结着学者的心血与巨额的资本投入。破坏定价权，便会彻底摧毁研发新药的资金链。为了维系整个世界的医疗秩序，这批破坏规则的货物只能沉入海底。”\n\n“给你们三分钟的时间登上救生艇。三分钟后，我方将执行销毁程序。祝你们好运。”"
LHS.1622.a:0 "……"

LHS.1623.t:0 "这是最后一次规矩"
LHS.1623.d:0 "老李叔心知肚明，丢掉这些药，南区的娃娃们唯有死路一条。他猛地将节流阀推到极限。这艘老朽的货船发出撕裂般的轰鸣，迎着那座钢铁山脉撞去。他要用这条老命，保住底舱最深处的那几箱特效药。\n\n巡洋舰的主炮微微下调。\n\n伴随着一声震碎海浪的巨响，高爆弹特别精准地穿透了木制驾驶舱。火光冲天而起，老李叔的身影瞬间融化在刺目的赤红色高温里。巨大的冲击波将几艘救生艇掀翻进冰冷的海水中。\n\n海面上飘起一片沾满火药味的白沫，昂贵的抗生素化作粉末融入大洋。一顶边缘浸透鲜血的水手帽，以及一个装满交涉信件的金边木盒，随着海浪，缓缓推向仅存的几名幸存船员。"
LHS.1623.a:0 "（文明的屠刀，滴血不沾。）"

LHS.163.t:0 "被香水浸透的绞索"
LHS.163.d:0 "海风裹挟着浓烈的盐腥与血气，狠狠撞开了指挥室沉重的橡木门。\n小果子跌撞着冲了进来。她那身原本宽大的水手服，此刻紧紧贴在单薄的脊背上，往下滴滴答答地淌着冰冷的海水。微微发黄的长发凌乱地黏在惨白的脸颊旁，那双总是亮晶晶的眼睛里，此刻布满了熬夜与极度惊惧勒出的红血丝。\n她将一个镶嵌着奢华金边的木盒，重重砸在粗糙的战术桌上。盒盖弹开，里面是一叠被海水泡得发烂、却依然散发着刺鼻薰衣草香水的信件，以及一顶……边缘被鲜血浸透的水手帽。\n“第三运输编队……回来了。”小果子的声音剧烈战栗着。她死死攥着衣角，将眼底即将决堤的水汽生生逼退，硬生生咬出清晰的字句，“航线外海，碰上了圣杯王国的执法巡洋舰。”\n雪伊猛地站起身，军靴踏碎了地上的铅笔。她握着步枪的手背上，青筋条条绽起，骨节勒出惨白的印子。\n“那位圣杯的舰长，站在好几层楼高的装甲舰桥上，用高音喇叭向我们宣读《航海贸易公约》。”小果子深吸了一口带着铁锈味的冷空气，声带在发抖，“他的语气礼貌极了，一口一个‘先生们，女士们’。紧接着……他们装备了火控雷达的主炮齐射，特别精准地，把我们那艘装满药物的领航船，瞬间轰成了渣子。”\n晓枫大步走过去，将一件干爽的军大衣紧紧裹在小果子颤抖的肩膀上。她的动作轻柔，眼眸却深邃得如同暴雨将至的暗夜。“这就是所谓旧世界的文明。”晓枫的声音冷得掉冰渣，“把人命放在天平上明码标价，然后合规合法地、优雅地碾碎。”\n小果子猛地抬起头，那双大眼睛里，恐惧被一种令人心悸的烈焰彻底吞噬。“木棉姐，那些老爷的铁甲舰装甲太厚，掉头很慢。我要换航线。”她一字一顿，指甲掐进掌心，“走东边的暗礁带，把船队的锅炉烧到极限。咱们这群海鸥，既然在天上飞不了，就得学会在风暴的死角里，从他们嘴里把肉抠出来。”\n我（木棉）静静地看着她。剥开一个橘子，将一瓣橘肉连同一杯滚烫的热茶，强行塞进她冰凉的手心。\n“咽下去。嚼碎了咽下去。”我盯着她的眼睛，“这片吃人的海，从现在起，交给你掌舵。”"
LHS.163.a:0 "（握紧满是机油的舵盘，向狂浪最深处去。）"

LHS.164.t:0 "烙在甲板上的余温"
LHS.144.d:0 "码头上的风灯在海风中剧烈摇曳，将脚手架的影子拉得张牙舞爪。舰队出港前的最后半个钟头，大家围坐在冰冷的钢铁甲板上，分享着刚出锅的甜玉米饼。\n小果子盘腿坐在最中间，腮帮子塞得鼓鼓囊囊，活像一只囤积口粮的松鼠。她将手里那块烙得最焦黄的饼掰开，一半递给眉头紧锁的雪伊，一半塞进正低头研判洋流方向的晓枫手里。\n而在她的脚边，一个便携式的焊枪正安静地躺在工具包里。那是她白天用来修补甲板缝隙的家伙。\n“雪伊姐，多笑一笑吖。”小果子笑意盈盈地凑过去，沾着玉米面的手指戳了戳雪伊紧绷的脸颊，“等我这趟把药运回来，南区的娃娃们就能下地跑了。到时候，咱们在海滩上办一场最热闹的篝火晚会！”\n雪伊一把攥住她作乱的手，力道大得几乎要把她揉进骨头里。那双总是燃着怒火的眼睛，此刻翻涌着极度不安的狂潮。“听好，撞见他们的舰队，立刻掉头！保住命，这比满船的金子都重要，懂吗？！”\n“晓得啦。”小果子转过头，看向一旁的晓枫。晓枫合上海图，揉了揉干涩的眼角，微笑着拍了拍小果子的发顶。\n“海上的星星，和咱们荒原上的一样亮。”晓枫的声音里透着一股安定人心的幽默感，“迷路了，就盯着最亮的那颗，早早回家。家里的那锅肉汤，我会一直给你温着，直到你喝腻为止。”\n小果子用力地点了点头。汽笛长鸣，粗暴地撕裂了夜空的死寂。小果子站起身，迎着扑面而来的狂风。她纤细的身影在巨大的钢铁炮塔阴影下显得有些单薄，却又像一把彻底出鞘、淬了火的利刃。\n我站在岸边的礁石上，目送那艘渐渐融入无边黑暗的战舰。空气里弥漫着离别时的酸楚与柴油味。这只最执着的海鸥，定能穿透这片苍白的铁幕。"
LHS.164.a:0 "（早早回家，饭菜会一直热着。）"

LHS.165.t:0 "坠入深渊的晨星"
LHS.165.d:0 "电台频段里，刺耳的电磁杂音像锋利的锯条，重重拉扯着指挥部里每一个人的耳膜。雪伊死死捏着通讯话筒，指关节因极度充血而透出惨白。\n那艘满是修补痕迹的“红泥一号”驱逐舰，正拖着滚滚黑烟，决然地将引擎推向了即将炸缸的极限。\n甲板上，火光冲天。小果子正用近乎狂暴的姿态，将一个个泪流满面的水手强行塞进最后的救生艇。\n随后，回到船长室，送走最后一名试图留下陪她的副手后，利落地割断了连接缆绳。\n她放弃了一切规避动作，迎着圣杯王国那艘如同海上山脉般的旗舰主炮，全速发动了毁灭性的冲锋。\n“小果子！转向！这不是命令，这是请求！你给我滚回来！物资丢了咱们再去买！你给我滚回来！！”雪伊的怒吼在指挥部炸响，嗓音嘶哑得仿佛要把自己的声带撕裂。\n电台那头传来齿轮超负荷转动的凄厉轰鸣，以及隐约的、金属焊枪喷吐火焰的“嘶嘶”声。随后，是小果子依然清脆、却透着某种绝对理智的释然声音。\n“雪伊姐，洋流变向了。圣杯那帮老爷的船，重心高，在深水区转身慢。我现在把船头焊死在她们的推进器螺旋桨里，这整支舰队都得在这儿给我停半小时。”\n“你给我闭嘴！！”雪伊崩溃般地一拳砸碎了面前的木桌。\n“木棉姐，”小果子像没理会雪伊的怒吼般，声音低了下去，像是在对着海风倾诉，“货舱里的青霉素，我让船员们全封进他们的双层防压舱了。那里的孩子们……能活下来了，对吧？”\n她急促地喘了一口粗气，剧烈的金属撕裂声在她那边轰然炸响。\n“晓枫姐，你以前教我算账，说一命换一命是笨蛋。那……这一船换几千个娃娃的命，够不够精明？”\n她最后一次调整了舵盘，将通讯频率切到了所有人，每一个字都像是刻在海面上的碑铭："
LHS.165.a:0 "……"

LHS.1655.t:0 "坠入深渊的晨星"
LHS.1655.d:0 "“所有物资船听着。我是领航员小果子。我已将敌方旗舰锁定！你们只需全速前进，不需要回头，更不需要纪念！把那些药，送到每一个生病的孩子手里。哪怕少了一瓶，这个账本……就不算平。”\n\n“谢谢你们……捡回了我这个迷路的小东西。这几年……”\n轰——！！！\n比正午的太阳还要刺目的火光，在天空的边缘瞬间爆裂。数百吨重的巨大水柱，夹杂着融化的钢铁，彻底吞噬了那艘小小的驱逐舰。\n“真的…………好幸福！”\n滋滋——\n电流的尖啸声掩盖了一切。无休止的、死寂的白噪音在指挥部里空洞地回荡。\n雪伊瘫坐在椅子上，那双从不言败的眼睛里，有什么东西随着那场大火一起，彻底熄灭了。晓枫死死咬住指节，将喉咙里那声足以撕碎灵魂的惨叫，生生咽进了肚子里。\n\n海面上，那颗属于我们的、发着微光的晨星，熄灭了。但这燃烧的余烬，正化作遮天蔽日的火雨，将圣杯王国那自诩文明的旗帜，彻底焚为灰烬。"
LHS.1655.a:0 "（她用自己，强行兑换了整片大陆的生机。）"

LHS.166.t:0 "谁在纪念册之外"
LHS.166.d:0 "那封散发着薰衣草香水的“吊唁信”，被死死钉在广场中央的告示板上。羊皮纸的光泽在夕阳下显得格外刺眼，每一个优雅的花体字母都透着股高高在上的腐臭气。\n成千上万的工人和农民围在前面。如同一只只弱小的羔羊。人们的嘴唇紧抿，眼眶由于极度的悲愤而呈现出一种病态的赤红。告示板下，堆满了乡亲们自发编织的白色野草环，还有孩子们用彩色石子拼成的“英雄”字样——那是献给他们的小英雄，那位代号“小果子”的领航员的。\n一位由于长年劳作而脊背佝偻的老水手，颤抖着伸出布满裂口的手指，抚摸过信函末尾那个体面的金色印章，忽然发出一声令人毛骨悚然的惨笑。\n“整整三万枚金币。”老头的声音沙哑，在这死寂的广场上显得格外刺耳，“在圣杯王国的议事厅里，咱们的孩子，这条为了送药去挡主炮的命，就值这三万枚金币。”\n人群中，一个抱着发烧婴儿的母亲，将怀里的孩子紧紧勒进怀中，滚烫的泪水浸透了孩子额头的绷带。她抓起官方发的那袋慰问红糖，将其狠狠砸进了一旁的红泥坑里。深褐色的糖粒混入暗红的泥水，呈现出一种特别残酷的色泽。\n“这是拿小果子长官的命换来的糖水！”母亲的声音凄厉至极，“喝了它，咱们的良心就彻底死在了这片海里！”\n愤怒即将失控。就在这一瞬间，我（木棉）推开重重卫兵，跨步走到了那个堆满鲜花的祭坛前。我手里攥着一个被火烧得变形的黑色小本子——那是从“红泥一号”的废墟里，由潜水员冒死带回来的、属于小果子的最后遗物。\n我看着眼前这片翻涌着悲伤与崇拜的人海，眼神冷峻如冰。我缓缓举起那个残破的小本子，声音低沉而平缓，却压过了所有的喧嚣。\n“大伙儿都觉得她是个英雄，觉得她为了公社、为了理想、为了这种‘伟大’的东西而死，对吧？”\n“可你们看清楚了。这个被你们供在神坛上的孩子，她在死前最后一秒钟，到底在算些什么。”"
LHS.166.a:0 "……"

LHS.1666.t:0 "谁在纪念册之外"
LHS.1666.d:0 "我在所有人惊愕的目光中，翻开了那个边缘焦黑的小本子。那上面记载的文字稚嫩无比，甚至由于浸泡了海水而变得字迹模糊，却力透纸背。\n“这上面，根本没有一个关于‘革命’或者‘国家’的词！”\n我指着那一页页凌乱的记录，声音在广阔的广场上激荡。 \n“三月十四日。主轮机长何塞叔叔说，等仗打完了，他想给自个儿那三岁的娃，修好那个坏掉的拨浪鼓。小果子在那后面画了个圈，标注着：‘回港后记得带上修表的工具’。”\n“四月二日。厨子玛利亚大姐念叨着，她想在公社的后山种一片向日葵，因为那里能看到最早的日出。小果子在下面写着：‘去仓库申请种子，要最新的一批’。”\n“四月九日。那个十九岁的新兵伊万，他在睡梦里喊着想喝一口温热的甜豆浆。小果子记着：‘明早早起十分钟，去食堂帮他抢一份’。”\n我猛地合上本子，指尖死死陷进那焦黑的皮面。我抬头，直视着那一张张因巨大的震撼而彻底凝固的脸庞。\n“听懂了吗？！圣杯王国的那封信，之所以只提‘一名非法武装人员’，之所以给这命开出三万金币的价格……是因为在他们眼里，何塞的拨浪鼓是废料！玛利亚的向日葵是垃圾！伊万的那碗豆浆根本就不具备任何政治价值！”\n“他们最害怕的，就是咱们把这种‘无用’的幸福，看得比他们的黄金还重！他们害了小果子，就是为了告诉咱们：既然你们想当‘人’，想过这种平凡、琐碎、没出息的日子，那你们就只配被明码标价，被当成零件来损耗！”\n“咱们之所以把小果子架得这么高，是因为咱们潜意识里也承认了圣杯的那套逻辑——只有变成一个‘英雄’，一个‘伟大的符号’，这种牺牲才有意义。这恰恰是咱们对自己同胞最大的残忍！”\n广场上陷入了长久的、令人窒息的死寂。只有火把燃烧时的噼啪声。那个抱着孩子的母亲，看着手里那本被传递下去的、写满了琐碎心愿的本子，突然发出一声撕心裂肺的、却不再是为了英雄的恸哭。\n那是为了那些被帝国无视的、最平凡也最滚烫的生命本身而鸣的丧钟。\n我走到那个老装卸工面前，将本子递到了他那双颤抖的粗手中。\n“老伙计，拿起你的铁钩吧。咱们跨过这片海，绝不仅仅是为了去炸毁他们的军舰。”\n“咱们是要去告诉那个把生命当成账单的旧世界——”\n“——我们要守护的，就是这种可以自由地去修拨浪鼓、去种向日葵、去为了这碗豆浆而欢笑的……最平凡的权利！”\n“谁敢给这种权利标价，咱们就让他和他的金币，一起去火中见鬼去吧！”"
LHS.1666.a:0 "（每一个具体的人，才是革命唯一的真理。）"


LHS.167.t:0 "致世界的高烧"
LHS.167.d:0 "庞大舰队的引擎发出低沉的、如同巨兽心跳般的轰鸣。海风裹挟着高浓度柴油与咸腥的气味，将一面面印着木棉花的赤红旗帜吹得猎猎作响。\n我（木棉）靠在旗舰舰桥的钢铁栏杆上，慢条斯理地削着苹果。金色的夕阳将我脚下的甲板，和远处翻滚的黑色浪涛，一同染成了滚烫的熔金色。\n雪伊站在我身旁，用一块浸满枪油的粗布，一遍又一遍、机械地擦拭着她那把老式步枪。她的动作沉稳而冷酷，眼神像锁定了咽喉的孤狼，死死盯着海平线的尽头。晓枫则戴着沉重的监听耳机，指尖在巨大的世界海图上飞速划动，嘴里念着一串串来自全球各殖民地反抗组织秘密电台的接头代号。\n舰载广播的功率被推到了极限。晓枫那清澈、冷静，却又带着烈焰般绝对温度的声音，化作亿万道无形的电波，向着整个旧世界发出最后的审判。\n\n“致所有在橡胶林里忍受着监工皮鞭的兄弟，致所有在纺织厂里咳出带血棉絮的姐妹：”\n“我们，曾是你们。我们深知空空如也的米缸有多深，懂得工厂粉尘的铁锈味有多苦，更懂得在饥饿的深夜里，用冰冷的河水填满胃袋的刺痛。”\n“圣杯王国所谓的‘和平与繁荣’，是一场用你们的白骨搭建餐桌、用你们的血汗酿成美酒的盛大分赃。他们的每一张高贵选票，都浸透着从你们脊背上刮下来的油脂。”\n“我们曾天真地以为，守住自己这一亩三分地，就能换来安宁。但他们用傲慢的炮火与体面的绞索向我们证实：只要这世上还存在一座靠吸食他人脑髓来运转的资本交易所，平民的命，就永远只是他们账本上可以被随意抹除的耗材。”\n“今天，红泥公社的舰队即将跨越公海。我们枪膛里的子弹，会精准地击穿那些挂着文明牌坊的防弹玻璃。”\n“把你们手里的锄头削成长矛，把你们的扳手熔成战锤！站起来！加入我们！把那些脑满肠肥的吸血鬼，统统从他们的宝座上倒拽下来！”\n广播的尾音在海浪声中长久飘荡，如同惊雷般激荡在每一个被压迫的大陆上空。\n我将一块削好的苹果递给晓枫。雪伊猛地拉动枪栓，清脆的金属撞击声悦耳至极。她接过我递来的另外一小块苹果，扔进嘴里，眼神凶狠得像一头终于挣脱了所有锁链的远古凶兽。\n“是时候了。”她咬碎了果肉，声音里带着令人灵魂战栗的狂热快意，“去教教那些自以为是的绅士们，血，到底是怎么流的。”"
LHS.167.a:0 "（扬帆，向旧世界的心脏全速开火。）"

LHS.168.t:0 "逆流而归的星辰"
LHS.168.d:0 "庆祝出征的焰火将夜空染得绚烂，但那鼎沸的喧嚣却仿佛被海岸线的狂风从中生生截断。\n我们三人——我（木棉），晓枫，还有雪伊，如同三尊孤寂的雕像，站在灯塔下的防波堤上。手里提着一个盛满甜玉米饼的篮筐。远处的灯火越是温暖，眼前这片深邃漆黑的海面就越是教人痛得窒息。\n“这丫头……最怕饿肚子。”雪伊死死盯着翻滚的海面，把一块掰碎的饼丢进黑色浪花里。她一向挺直如标枪的脊背此刻微微佝偻着，声音喑哑得哪怕强装镇定，也彻底暴露出那浓郁的颤抖，“给她多放点……她在下面，肯定找得着回家的路。”\n晓枫咬在下唇的力度深得渗出了血丝。她慢慢走上前，将一件防风大衣牢牢裹在雪伊战栗的肩头，眼眶酸涩，却固执地瞪大双眼，似乎妄图在海水的深渊里逆转生死。\n就在这滞闷得令人绝望的寂静里，灯塔的通讯台突然爆发出一声撕裂夜空的锐鸣。\n值班的雷达兵几乎是连滚带爬地冲出塔门，指着十二点方向的手如同筛糠：“长官！十二点方向……雷达屏幕没有任何金属反应！但我的眼睛看到一艘……一艘……随浪飘来的木排！”\n在那一瞬间，我的血液仿佛被电流强行击穿！\n雪伊半秒钟都等不下去。她像一只发了疯的母狮，直接从两米多高的防波堤上一跃而下，沉重的军靴砸在锋利的礁石上，磕得血肉模糊也毫无知觉。她不顾一切地蹚进齐腰深的冰冷海水中，发疯似地向着那抹微弱的轮廓游去。\n探照灯的强光，如同一把利剑，猛地劈开了海面的黑暗……"
LHS.168.a:0 "……"


LHS.169.t:0 "炉火上的肉汤"
LHS.169.d:0 "那是一艘几近散架的救生木排，桅杆居然是用劈裂的船桨和几根焦黑的钢管强行绑死焊上的。木排的边缘，死死抓着一双泡得惨白、布满惊悚水泡的纤弱双手。\n那个人影趴在湿滑的木板上。她那头标志性的因营养不良而发黄的长发，如今被海水腐蚀成了粗糙的结块，紧紧贴在一张被烈日和盐霜折磨得几乎裂开的脸庞上。\n在探照灯刺目的光晕中，她艰难地、一点点撑起身子。每一次挪动，都仿佛是从死神的齿缝里硬生生扯出来的生机。\n当她终于勉强坐稳时，她抬起了头。\n那双曾经总是闪烁着无忧无虑星光的大眼睛，此刻虽然布满猩红的血丝，却透着一股跨越死亡的、惊心动魄的明亮。\n“……这海浪，真讨厌啊。”\n她大口大口地喘着粗气，干裂的嘴唇被撕扯出血珠。她想要挥手，但右手已经和一块简易的浮板绑在了一起。她只能用尽全身仅剩的力气，对着早已泪流满面、站在海水中僵成雕像的我们，扯出一个僵硬、却刺眼得让人心碎的灿烂笑容。\n“我……我在底舱，用那把备用焊枪，把自己和半罐淡水死死焊在了最底层的密封隔舱里。”她吸了吸鼻子，声音微弱得快要被风吹散，却带着劳动者独有的、孩子般邀功的执拗，“我在那个连草都不长的破暗礁上，硬是靠捡垃圾，修了一个月的船排。”\n雪伊猛地扑过去，一把将那个单薄残破的身躯揉进怀里，力气大得仿佛要将她重新嵌进自己的骨血。\n“你这个白痴！混蛋！谁他妈让你一个人去逞威风的！”雪伊嚎啕大哭，这位在枪林弹雨里眉头都不皱一下的铁血军官，此刻哭得像个找回了全世界的孩童，“你知不知道咱们以为你……”\n“对不起，雪伊姐……弄脏你的新衣服了。”小果子将头重重地搭在雪伊的肩上。她的目光越过雪伊颤抖的后背，看向跌跌撞撞跑进海水里、已经泣不成声的晓枫和我。\n她那双伤痕累累的手，轻轻地、安抚般拍了拍雪伊的脊背。\n“可是，我答应了你们的呀。”\n迎着远方逐渐泛起赤红霞光的海岸线，她眼底那颗曾坠落的晨星，在泪水的折射中，再次燃起了比太阳还要滚烫的光芒。\n“我答应了……要活着回来，和大家一起，把红泥公社建好的。”\n“而且……晓枫姐，你也答应过我，炉子上的那锅肉汤……给我留着了吧？”\n晓枫捂住嘴，眼泪止不住地滚落，她拼命地点着头，和雪伊一起紧紧抱住了那个从地狱爬回来的奇迹。\n我站在岸边，深深吸了一口带着腥咸与湿润的海风。\n海风依旧冰冷刺骨。\n但我的心口，却热得要化了。"
LHS.169.a:0 "（汤一直温着。欢迎回家，我们的小英雄。）"

LHS.170.t:0 "掌心捂热薄暮"
LHS.170.d:0 "社团活动室的橡木门被缓缓推开。夕阳的余晖如同融化的碎金，洒满布满划痕的木地板，照亮了空气里沉浮的细小微尘。\n我（希亚）将自己深深砸进沙发的柔软深处，抬起指尖的力气早已被彻底抽干。连续数周的高压血战，让灵魂深处的疲惫化作沉重的潮水，彻底淹没了呼吸。\n木桌中央，静静端坐着一个用粗糙麻布仔细包裹的木盒。那是跨越赤道、由红泥公社寄送而来的邮包。\n割开麻布的瞬间，一股浓郁到极点的、混合着南美烈阳与湿润泥土芬芳的焦糖甜香，蛮横地撞开嗅觉，充盈了整个房间。盒底铺着干草，上面安稳熟睡着一个保温铁壶、几只手工捏制的粗陶杯，以及一张散发着草木清香的便签。\n字迹透着一股子伸着懒腰般的慵懒与从容：\n“致希亚妹妹：\n总是紧锁眉头，额头极易刻下皱纹。这壶甜茶里加足了咱们的特产甘蔗糖，甜度直接顶到嗓子眼。一口气喝完这口热汤，去草地上找个树荫，安安稳稳地做个悠长的好梦。\n把心放宽。世上的魑魅魍魉多如牛毛，咱们大可将它们统统留给明天的太阳去清算。\n——木棉。”\n我捧起那只略显粗糙的陶杯，滚烫的温度顺着掌心一路攀升，直达心口。鼻尖贪婪地嗅着那股纯粹的甜香，眼眶瞬间蓄满滚烫的水汽。\n我死死咬住下唇，任由那种名为“被心疼”的酸涩感化作豆大的水珠，重重砸在满是茧子的手背上。\n端起杯子，一口咽下那股浓烈且甜到舌根发苦的滚烫茶水。紧绷了整整半年的脊背，终于在这个宁静的黄昏，完完全全地松弛下来。"
LHS.170.a:0 "（睡个好觉。明天，咱们一起上路。）"

LHS.171.t:0 "击碎体面的恶臭"
LHS.171.d:0 "椭圆形的办公桌擦得锃亮，光洁的表面倒映着头顶耀眼的水晶吊灯。我解开定制西装的纽扣，端起一杯刚刚冲泡至绝佳温度的蓝山咖啡，准备听取下一季度的收益暴涨报告。\n秘书推着一个包装特别精美的礼盒走进来，声称是红泥公社最高领导人的私人馈赠。\n我微笑着切开丝带。掀开盒盖的瞬间，一股极度刺鼻的、混合着腐殖质与陈年汗水的恶臭如实体般扑面而来。\n天鹅绒的内衬上，静静躺着一双破烂不堪的橡胶靴。靴底结满厚厚一层干涸的红泥，鞋帮处甚至残留着暗红色的干涸血迹。\n我猛地站起身，咖啡杯被手肘撞翻，褐色的液体泼洒出来，彻底弄脏了昂贵的波斯地毯。\n一张粗糙的便签飘落在桌面上：\n“这正是咱们这儿的特产。你们账本上的每一个金币，都透着这双靴子里的酸臭。\n我们的人民已经挺直了脊梁。继续把手伸过来，咱们就用这双沾满红泥的脚，把你们的交易厅踩个稀烂。”\n我死死盯着那双散发着恶臭的破靴子。那股味道就像一只生满老茧的大手，死死掐住我的咽喉。在那些冰冷的利润报表之下，隐藏着一群已经彻底苏醒、随时准备拼命的饿狼。\n冠冕堂皇的文明外衣被这双泥靴撕得粉碎。唯独剩下赤裸裸的生存博弈与死亡威胁。"
LHS.171.a:0 "（拉响警报。南方的季风，带上了刺骨的寒意。）"

LHS.172.t:0 "粗糙掌心生麦浪"
LHS.172.d:0 "广场上的集会刚刚宣告落幕。我回到简陋的指挥部，嗓子因为长时间的激情演讲而干哑嘶痛，甚至渗出一丝腥甜。\n木桌上堆着几只沉甸甸的粗麻袋。那是从遥远南方跨越赤道送来的战略物资。\n利落解开麻绳。金灿灿、颗粒饱满的玉米种子像微型的瀑布一样倾泻而出，带着南美洲特有的、被烈日狠狠炙烤过的温暖气息。\n麻袋深处夹着一本用粗糙纸张装订的小册子，封面上画着几株茁壮挺拔的麦苗。扉页上的字迹透着一股慵懒通透的烟火气：\n“致北方的兄弟姐妹：\n口号喊多了伤嗓子，喝口滚烫的热汤润润喉咙。\n老百姓甘愿跟着咱们，图的是一个能安稳睡觉的屋顶，和一碗浓稠的米粥。\n先把种子撒进地里，让大伙儿吃得满嘴流油。积攒足了力气，咱们才能一块儿把这旧世界掀个底朝天。\n——木棉。”\n我深深抓起一把玉米种子，任由那些粗糙的颗粒用力摩擦着掌心，那股实打实的重量瞬间逼红了我的眼眶。\n转头望向窗外那些满脸疲惫却依然对我交付托付的同志。这段时间，我们确实执着于天上遥远的星星，竟忘却了脚下那片急需开垦的泥泞。\n我把那捧种子紧紧抱在怀里，把那股来自赤道的温暖死死捂进胸膛。"
LHS.172.a:0 "（拿上锄头。咱们去种出个新世界。）"

LHS.173.t:0 "融雪红霞覆双肩"
LHS.173.d:0 "执政官的办公室庞大得惊人，也冷得彻骨。我披着厚重的军大衣，在堆积如山的文件前用力揉着酸痛的太阳穴。那些冰冷的统计数字和战略汇报，犹如一座座冰川压得我喘息艰难。\n秘书小心翼翼地送来一个小巧的木盒，说是南方红泥公社领袖私下寄来的物件。\n好奇地掀开盖子。一团特别耀眼的红色瞬间点亮这间灰暗的屋子。\n那是一条纯手工编织的红围巾。针脚略显粗糙，却透着惊人的柔软与厚实。把脸埋进去，立刻闻到一股强烈的、被阳光暴晒过的棉花香气，那是独属于南美洲烈日的味道。\n附带的纸条上，字迹温婉亲切：\n“给小樱：\n放松紧皱的眉头。女孩子家家的，理应多穿点亮色的衣裳。\n这围巾是咱们村织女亲手纺出来的。遇到那些让你头疼的麻烦事，就把自己严严实实地裹起来，吃块甜点。\n放开手脚去干。天塌下来，还有咱们这群姐妹在南边替你牢牢撑着。\n——木棉。”\n我将那条红围巾紧紧环绕在脖子上。那股源源不断的滚烫热度，瞬间驱散了渗入骨髓的严寒。\n眼底的水汽满溢而出，我用力吸了吸鼻子，嘴角绽开一个久违的、发自内心的明媚笑容。\n重新抓起桌上的钢笔，觉得这漫长的严冬，也变得格外温暖可爱。"
 LHS.173.a:0 "（谢谢你们。我依旧会坚强地走下去。）"

LHS.174.t:0 "跨海相扣的掌心"
LHS.174.d:0 "夜深了。木屋里的煤油灯跳动着昏黄的光芒。\n我看着桌上那个从南美洲历经千难万险送来的粗糙陶罐。拔开塞子，抓起一把里面暗红色的泥土。\n土质细腻，透着一股极具生命力的腥甜与厚重。这颜色，和咱们行军路上沾在草鞋底的泥巴，一模一样。\n信纸上的字迹刚劲洒脱：\n“致东方的兄弟姐妹：\n这罐土，是咱们这儿的命根子。咱们全都是从这最底层的烂泥里爬出来的。只要咱们的双脚还死死踩在这片土地上，只要咱们还记得乡亲们手里的老茧，这天下的反动派，全都是一戳就破的纸老虎。\n握紧它。咱们分处世界两端，但咱们的心，紧紧扣在一起。\n——木棉。”\n我紧紧握住那把红土，任由粗糙的颗粒深深嵌入掌心，带来一种特别踏实的力量感。\n转过头，看着木屋外那片被战火蹂躏却依然生生不息的广袤大地。那些牺牲的战友，那些倾尽所有支援我们的百姓，全都化作了这脚下的泥土。\n我摊开信纸，拿起炭笔，用力写下回信的字迹。\n“告诉木棉同志，咱们的红旗，一定会插遍这颗星球的每一个山头。”\n在这寒冷的夜里，两股赤诚的火焰，跨越浩瀚的汪洋大海，紧紧交融在一起。"
LHS.174.a:0 "（泥土相连，咱们的队伍坚不可摧。）"

LHS.175.t:0 "糖浆里的铁锈"
LHS.175.d:0 "午后的阳光把司令部的木地板晒得发烫，空气里全是灰尘和老木头被烘烤后的味道。我（木棉）缩在藤椅的阴影里，手里把玩着那只空荡荡的水晶瓶。瓶口残留的干涸药液，在光线下折射出琥珀色的光，散发着一股令人作呕的、属于旧时代的甜腻香气。\n晓枫抱着一摞厚厚的建设蓝图走进来，看见那个瓶子，眼角弯弯地笑了起来：“头儿，您还留着这玩意儿呐。索拉娜当年那手文盲操作，足够咱们公社当笑话讲到下个世纪了。”\n我拿起桌上的一颗青苹果，用力咬下一口。清脆的断裂声在安静的房间里格外清晰。\n“笑话可是最提神醒脑的好东西。”我慢条斯理地咀嚼着，任由酸涩的汁水顺着喉咙流下，强行压住胃里那股翻江倒海的痉挛感，“留着它，时常闻闻这股子腐朽的甜味儿，才晓得咱们脚下这泥巴有多香甜。”\n晓枫放下图纸，替我披上一件厚实的军大衣。“您最近总在白天打盹。仗打完了，您该好好歇歇了。”\n我把视线投向窗外。金色的阳光刺得我视网膜一阵生疼，但我强迫自己睁大眼睛。\n我该怎么告诉她，那整整一瓶足以让一头猛犸象长眠的重度安神剂，早就把我的神经烧成了一团乱麻。每一个万籁俱寂的夜晚，那种被封死在地窖深处、连呼吸都带着土腥味的幽闭感，都会像毒蛇一样啃噬我的脊髓。\n我只能在太阳升起、在同志们的喧嚣声中，靠着短暂的休克，偷得片刻安宁。\n“这太阳太好了，晒得人骨头都软了。”我咽下口中带着淡淡铁锈味的果肉，扯出一个慵懒的笑，“你去忙你的，让我再赖会儿。”"
LHS.175.a:0 "（闭上眼，听着外面那些鲜活的人声。）"

LHS.176.t:0 "重叠的倒影"
LHS.176.d:0 "正午的蝉鸣像一把锯子，反复拉扯着滚烫的空气。我半躺在藤椅上，汗水浸透了旧军装的后背。意识在清醒与昏沉的边缘拉扯，耳边传来雪伊那极具穿透力的训斥声。\n“这批钢材的标号弄错了！统统拉回去重熔！”雪伊的军靴踩在碎石上，发出清脆的声响。\n紧接着，是一阵带着海腥味的清风。小果子欢快的笑声由远及近：“雪伊姐，消消气啦，快来吃口刚从井里吊上来的大西瓜！”\n我努力撑开沉重的眼皮，看着那两个在阳光下鲜活跳跃的身影。\n视线瞬间模糊。雪伊军靴踩碎石子的“咔嚓”声，叠印成了地窖里看守巡逻时皮靴摩擦地面的回响；小果子递过来的那块鲜红的西瓜，在我嘴里化作了那晚索拉娜强行灌进来的、暗红色的药液的甜腻。\n强烈的失重感瞬间攫住了我的心脏。我死死抠住藤椅的扶手，指甲几乎要掀翻过来。\n“头儿？”\n晓枫温热的手掌贴上了我的额头，拉回了我即将坠入深渊的神智。她那双洞若观火的眼睛里，此刻盈满了深深的担忧。“您在发抖。您的手……冷得像冰块一样。”\n我咬紧牙关，舌尖尝到了一丝腥甜。强行扯动嘴角，勾起一个散漫的弧度。\n“年纪大了，怕热又怕风。”我反握住她的手，汲取着她掌心的温度，“你们几个丫头，一天到晚吵吵闹嚷的，比这蝉鸣还闹心。等你们忙完了，进来陪我这“老太婆”喝口茶。”\n晓枫深深地看了我一眼，反手将我的手掌包裹得更紧。“好。我去给您拿条毯子。”\n看着她转身离去的背影，我长长地吐出一口带着寒气的白雾。"
LHS.176.a:0 "（伪装，是老兵最后的阵地。）"

LHS.177.t:0 "拆穿谎言的温度"
LHS.177.d:0 "“木棉！快看老子种的红薯！个头比你那脑袋还大！”索拉娜一脚踢开院门，把沉重的藤筐砸在地上，扬起一阵尘土。她穿着沾满泥巴的工装，幽红的眼睛里透着一股子粗野的得意。\n莉莉安娜跟在她身后，一袭白裙纤尘不染。她无奈地叹了口气，向我微微颔首致意。“索拉娜，小声些，会吵到木棉姐姐休息的。”她的声音轻柔得宛如晨露。\n我拿起桌上的小刀，抛给索拉娜。“切开看看，挑个最甜的。”\n索拉娜冷哼一声，接住小刀，大大咧咧地在我对面的石凳上坐下。她刚准备出言讥讽我这副病恹恹的模样，目光却突然定格在我的手腕上。\n那条原本宽松的军装袖口滑落了一截，露出了我小臂上暴起的、呈现出诡异紫黑色的静脉血管。\n索拉娜猛地扔下小刀，像捕食的猎豹一般窜过来，一把攥住了我的手腕。她的动作粗鲁至极，却在触碰我皮肤的瞬间，整个人如同被雷击中般僵住了。\n“你的体温……”索拉娜的瞳孔剧烈收缩，声音里透出一股难以置信的战栗，“怎么跟冰块一样？”\n她猛地抬起头，死死盯着我。那个曾经不可一世的暴君，此刻的眼神里，竟然浮现出一种名为恐惧的情绪。\n“那瓶药……”索拉娜的喉结艰难地滚动着，“那个画着骷髅头的瓶子……我亲手灌进你嘴里的那瓶药……我以为那是见血封喉的毒药，我以为你早熬过去了……我到底干了什么……”\n索拉娜瘫软在地，死死捂住自己的脸，滚烫的泪水冲刷着她脸上的泥污。“对不起……对不起……我就是个只会杀人的畜生……我害了你……”\n我抽出手，慢条斯理地抚平袖口。“那是贵族专用的深度安神剂。一滴能让人陷入沉睡。你倒了一整瓶，把我的神经彻底烧断了。每天入夜，闭上眼睛，活埋的窒息感就会重演。这具身体，正在加速变成一具会呼吸的尸骸。”\n莉莉安娜走上前，冰凉的指尖轻轻点在我的眉心。夜莺公主那双洞悉灵魂的眼眸里，瞬间盈满了悲伤。“灵魂的边界……碎掉了。”莉莉安娜的声音空灵而哀伤，“你在用极度的痛苦，强行维系着生者的假象。木棉姐姐，你一定……疼极了吧。”\n我拍了拍索拉娜剧烈颤抖的肩膀。“收起这副蠢表情。你误打误撞留了我一条命，让我有机会看着你们这群小崽子把天捅破。这笔买卖，我赚翻了。”"
LHS.177.a:0 "（原谅，比仇恨需要更大的力气。）"

LHS.178.t:0 "落日余晖的赠礼"
LHS.178.d:0 "手里的刻刀显得沉重无比。每一次用力，手腕深处的神经都会传来针扎般的剧痛。但我强迫自己握紧刀柄，将最后一片木屑吹落。\n桌子上，摆着三件栩栩如生的木雕。木屑旁边，积聚着一小滩刺目的鲜血。\n门外传来了熟悉的脚步声。晓枫推门而入，雪伊和小果子跟在她身后。她们看到桌上的木雕，皆是一愣。\n“木棉姐，你刻这些做什么？好精致呀！连桅杆上的绳索都有！”小果子好奇地凑过来，拿起那艘小小的木船，爱不释手。\n我微笑着指了指另外两件。“雪伊，这头狼归你。以后遇到难啃的骨头，看看它，想想怎么用最硬的牙口咬下去。晓枫，这算盘是你的。这个国家未来的账，一笔一笔，你得算得清清楚楚。”\n雪伊拿起那头木雕狼，粗糙的指腹摩挲着狼的獠牙。她那双总是燃烧着怒火的眼睛，此刻却紧紧盯着我苍白的脸颊，声音压得很低：“你这是……在交代后事？”\n晓枫的目光落在桌上那滩血迹上。她快步走过来，一把攥住我的手。\n“头儿……您的脉搏……”晓枫的声音颤抖得支离破碎。她那双能算尽天下战局的眼睛，此刻盈满了滚烫的泪水。\n我抽回手，将那把沾血的刻刀放进她的掌心，用力合拢她的手指。\n“世上的筵席，总会散场。”我直视着她们三人，语气透着严厉与期盼，“我把地基打好了。接下来的高楼，全靠你们自己去建。”\n“把眼泪收回去。咱们革命者流血流汗，唯独要把泪水攒着，留给胜利的凯歌。”"
LHS.178.a:0 "（接好这块木头。接好这片江山。）"

LHS.179.t:0 "长眠的邀请"
LHS.179.d:0 "黄昏的光线将房间染成了一种近乎悲壮的血红色。我坐在桌前，用尽全力咬下一口青苹果。尖锐至极的酸涩感在口腔中爆开，刺痛了舌根，也强行唤回了我逐渐模糊的意识。\n莉莉安娜如同一个幽灵般出现在房间里。她穿着那袭白裙，眼神里盈满了几乎要溢出的悲悯。\n“停下吧。”她走到我身边，冰凉的指尖轻轻覆上我握笔的手。那股来自冥界的、绝对宁静的力量，顺着相触的肌肤蔓延，瞬间抚平了我每一根叫嚣着痛苦的神经。\n“让我带你走。在夜莺之国，你会得到最完美的安息。那里充满永恒的宁静，彻底免除一切幻痛与疲惫。”\n那份宁静的诱惑力大得惊人。我只需闭上眼睛，就能彻底从这长达数年的折磨中解脱。\n我看着桌上那些刚刚批复完的文件，看着窗外那些正扛着锄头、唱着歌归家的农民。远处的工厂烟囱冒着白烟，操场上孩子们的欢笑声随风飘来。\n我反手握住莉莉安娜冰冷的手指，将它从我的手背上移开。\n“公主啊，你的那个世界，安静得让人发慌。”我再次咬下一口酸涩的苹果，咀嚼着，扯出一个散漫却决绝的笑，“我这个人，听惯了这泥地里的吵闹声。听不见拖拉机的轰鸣，我只怕睡得很不安稳。”\n“这份痛，是我换来这个新世界的门票。我得把它细细品完。”\n莉莉安娜定定地看着我，两滴晶莹的泪水滑落脸颊，砸在木地板上，化作两朵幽蓝色的水晶花。\n“你是一位……令人敬重的凡人。”她深深地向我鞠了一躬，转身走入阴影中。"
LHS.179.a:0 "（我属于这片泥土，连同我的骨灰。）"

LHS.180.t:0 "风止，花落"
LHS.180.d:0 "残阳如血，将院子里的那棵大树染成了灿烂的金红色。\n我躺在藤椅上，听着远处传来的、属于新世界的机器轰鸣与孩童嬉闹。那些折磨我的幽闭幻痛，在这一刻，随着夕阳的沉落，奇迹般地如潮水般退去。\n晓枫、雪伊、小果子，还有远远站在院门外、死死咬着嘴唇的索拉娜，她们全聚了过来。\n她们围绕在我的身边。雪伊紧紧握着我那只失去温度的手，眼泪无声地砸在我的手背上；小果子趴在我的膝盖上，肩膀剧烈地抽动着；晓枫挺直了脊背，红着眼眶，替我将滑落的军大衣往上拽了拽。门外的索拉娜，眼泪在泥污的脸颊上冲刷出两道深深的痕迹。\n“哭啥。”我费力地抬起沉重的眼皮，视线已然开始涣散，但我依然努力扯出一个最灿烂的、属于老兵的笑，“咱们……打赢了。”\n“你们把这片地……拾掇得真漂亮。”\n我看着她们的脸，那些布满硝烟与绝望的脸庞，此刻正被新世界的霞光照亮。\n“以后遇到难事，就围在一起……聊一聊。”\n“脚踩在泥里，头……得抬起来看天。”\n胸腔里最后一口浊气缓缓吐出。那股折磨了我无数个日夜的疲惫，彻底消散。一种前所未有的、如同婴儿回到摇篮般的轻盈感，托举着我的意识。\n我慢慢闭上了眼睛。耳边，姑娘们的压抑的哭泣声渐渐远去，取而代之的，是微风拂过树叶的、温柔的沙沙声。\n真好啊。终于……可以睡个安稳觉了。\n\n藤椅停止了摇晃。\n一片火红的木棉花，被晚风吹落，打着旋儿，静静地盖在了那双布满老茧、彻底失去力量的手背上。"
LHS.180.a:0 "（晚安，木棉大姐。）"

LHS.181.t:0 "最后的蛮力"
LHS.181.d:0 "意识在药液编织的深渊里下沉。那地方暖和得很，让人想就这么一直睡下去。我心里头清楚，这安稳是假的，是毒药捏出来的棺材。可这身子骨啊，早被掏空了，实在是懒得再睁眼。\n陡然间，一声熟悉的、歇斯底里的怒吼，生生把我从那片安逸里拽了出来。\n“谁他妈准你们给大姐办葬礼了？！都给我滚去干活！公墓的图纸谁批的？老子现在就去毙了他！”\n是雪伊。这丫头，永远学不会安静地悲伤。\n紧接着，一股蛮横至极的力量，伴随着一声沉闷而清晰的、骨骼断裂的脆响，狠狠地撞击着我的胸口。那是雪伊发疯似的，用她那双能修坦克的蛮力在给我做心肺复苏。这哪里是救人，分明是拆骨头。\n眼皮费力地撑开一条缝，橘红色的夕阳一下子灌满了眼睛。\n院子里乱成一团。晓枫瘫坐在泥地里，手里攥着一支空掉的粗管针筒，那是她拿枪去黑市换来的猛药。粗大的针眼还留在我的脖颈上，渗出的血珠混着药液，看着吓人。\n她们几个心里都跟明镜似的，知道这针下去换来的是什么。她们只是想从老天爷手里，硬生生抢下这段最后的道别。\n“咳……咳咳！”\n我弓起身子，咳出一大口带着药味的浊血。\n“雪伊……你这修坦克的蛮劲儿……全用在拆我这把老骨头上了。”\n院子里的空气瞬间凝固。\n雪伊的动作僵在半空。她那双熬得通红的眼睛里，滚烫的泪水决堤而出。她一把将脸埋进我满是泥垢的肩窝，嚎啕的哭声里全是后怕和心疼。\n小果子连滚带爬地扑过来，把眼泪蹭在我的旧军衣上，双手死死搂住我的腰；晓枫丢开针筒，跨步走来，将我的右手紧紧地包裹在她的掌心。那双总是算计着一切的眼睛里，盈满了认命的悲伤和失而复得的狂喜。\n这针烈药，配上雪伊那股子能拆卡车的蛮劲儿，像一团烧红的铁水，在干涸的血管里横冲直撞，硬是让这颗停摆的心又跳了起来。\n“一帮蠢丫头。”我揉了揉她们满是泪水和草屑的头发，“非得逼着我这把老骨头，从棺材里爬出来，再陪你们走最后一程。”\n“走，把咱们那辆最破的吉普车开出来。咱们去兜兜风。”"
LHS.181.a:0 "（留给这世间的时间，刚好够开一趟车。）"

LHS.182.t:0 "修剪杂草的剪刀"
LHS.182.d:0 "昂贵的水晶吊灯将红木会议桌照得纤毫毕现。骨瓷杯里盛着的顶级锡兰红茶散发着醇香，恰到好处地安抚着诸位董事因期货市场微小波动而产生的烦躁。\n“长官，请签字吧。”\n秘书恭敬地将一份厚重的文件推到桌前，那支镶着金边、吸饱了墨水的钢笔在灯光下闪烁着冰冷的寒芒。\n南方那片盛产咖啡与橡胶的腥热泥塘里，蹿出了一撮极度扎眼的红色野草。那群常年跪在矿井里充当耗材的苦力，居然妄图挺直脊梁，甚至私自截留了本该送到我们餐桌上的季度供奉。\n帝国的百年基业巍如泰山。这帮乡巴佬的喧哗，顶多算作鞋底沾上的一块顽固烂泥。只是，任由他们弄脏我们的地毯，属实败坏了诸位绅士品尝下午茶的绝佳雅兴。\n签署这份贸易规范令，纯粹是执行一次例行公事的清扫。\n派遣几支刚完成涂装的巡洋舰队，去那片狂躁的海域进行一场实弹演习。在公海的边缘，用我们引以为傲的巨炮，轻而易举地拉起一道银色围栏。\n扣押所有的抗生素、化肥与工业母机。我们要把饥饿与高烧打包成最严厉的鞭子，狠狠抽打在这群狂妄暴民的脊背上。\n用这条柔软且致命的天鹅绒绞索，死死勒住那块赤红土地的咽喉。\n我们只需耐心地端着咖啡等待。等到极度的饥荒彻底烧毁了他们的口号，他们残存的生存本能，自然会驱使他们爬着回到咱们的流水线前，继续用那双浸透泥浆的脏手，为咱们的下一场晚宴创造丰厚的红利。"
LHS.182.a:0 "（落笔，扣紧这条银色的锁链。）"

LHS.183.t:0 "等到枪响那天"
LHS.183.d:0 "会议桌上，那封沾着厚厚红泥的信件散发着刺鼻的火药味与草汁的腥气。\n信使留下信件便大步迈出门槛。大家默契地攥紧衣角，双眼死死盯着纸上那些仿佛用生锈铁钉硬生生刻出来的粗犷字迹。\n“北边的阿德莱希患了癫狂的恶疾。他们身上那些滴着黏液的病疮，正顺着季风往南边刮来。”\n“咱们平时互相较劲，那是自家院子里的争吵。眼下，一头生满畸形肉瘤的怪兽企图将咱们连同这片大陆一并嚼碎吞咽。”\n“攥紧你们的宝石，握牢你们的法杖。只需听见咱们这边的枪炮轰鸣，咱们就同时踹开阿德莱希的大门，用最烈的火把这股腥臭的邪风彻底烧成灰烬！”\n这便是那个叫木棉的女人的做派。粗野，直白，带着把所有陈规戒律生生撕裂的蛮横力量。\n透过巨大的落地窗，我们眺望着遥远的北方。那些被病变折磨的流亡者，肌肤上绽放出五颜六色的诡异羽毛，肢体呈现出令人反胃的扭曲姿态，嘴角甚至挂着狂热的痴笑。那种足以污染理智的病态畸变，其凶险程度远超我们日夜讨伐的魔女。\n面对这般亵渎生命的异端，唯独将闪耀的魔法与呼啸的子弹交织成最密集的火网，方能将其彻底净化。\n会议室里，所有人齐刷刷地站起身，将各自的灵魂宝石紧紧贴在心口。璀璨的魔力光晕与信纸上的粗糙红泥交相辉映，编织出一种极具压迫感的战意。"
LHS.183.a:0 "擦亮宝石，静候冲锋的号角。"
LHS.183.b:0 "我们将独自面对风暴。"
MGU_pledged_to_burn_PAQ:0 "§Y接受我们共同对抗§9阿德莱希帝国§!的提议§!"
LHS.183.a_tt:0 "§Y达成隐秘战线协定！§!\n当【§R[LHS.GetName]§!】与【§g[PAQ.GetName]§!】爆发战争时，我国将会向【§g[PAQ.GetName]§!】宣战。\n§O（效果说明：泥土与魔法的羁绊已然缔结，我们将并肩踩碎那群怪物的颅骨。）§!"

LHS.184.t:0 "东南风"
LHS.184.d:0 "桌上的红茶杯泛起阵阵涟漪。玻璃窗在剧烈震颤。那声音沉闷、绵长，裹挟着灼热的火药味，顺着南风一路刮进了我们的会议室。\n带头的女孩一把推开椅子，眼眸里燃起炽热的光芒。\n“那群在泥地里打滚的家伙，平时看着粗鲁。可面对这群长着触手的畸变怪物，她们开枪的动作倒是干脆利落。”\n她抄起靠在墙角的重武器，转身看向屋子里全副武装的姐妹们。大家的灵魂宝石都在胸口闪烁着耀眼的辉光，那是迎战的本能。\n“我们跟她们，走着截然不同的两条路。她们信奉汗水与钢铁，我们坚守誓约与灵魂。”\n“但在把这群畸变疯兽烧成灰烬这件事上，我们的枪口指着绝对一致的方向！”\n她一脚踹开会议室的大门，狂风瞬间灌满她层层叠叠的裙摆。\n“抛开客套的规矩！我们这就从东边踹开阿德莱希的门，跟南方那群粗人来个两面夹击！把那堆散发着恶臭的烂肉，彻彻底底地烧成灰烬！”\n“等这场狩猎结束，咱们再跟南边好好算算地盘的账！现在，全员冲锋！”"
LHS.184.a:0 "魔法与硝烟，于今日共振！"


LHS.185.t:0 "方向盘上的最后一课"
LHS.185.d:0 "三天后的黄昏，车库里安静得只剩下灰尘在光柱里跳舞。吉普车停在角落，引擎早已冰冷。夕阳的光线斜斜地穿过满是污渍的窗户，在车身上投下一片温暖的橘色光斑。\n小果子坐在驾驶座上，小小的手掌轻轻覆盖在那个磨损得露出金属内里的方向盘上。她的眼眶红肿，嘴唇被牙齿咬出了深深的印痕。\n雪伊靠在车门边，用一块干净的绒布，一遍又一遍地擦拭着那盏落满灰尘的车前灯，那是一种近乎自虐的、沉默的专注。\n“晓枫姐，雪伊姐……”小果子终于开了口，声音沙哑得像被砂纸磨过，“我还是想问……”\n她抬起头，那双清澈的眼睛里蓄满了巨大的困惑与悲伤。\n“咱们明明可以用最好的药让她多撑几天……明明可以让她躺在床上，安安静静地走……为什么最后，还要让她开那辆车呢？雪伊姐，你把她胸口的骨头都压断了……那该有多疼啊……”\n雪伊擦拭的动作顿住了。她低下头，看着自己的军靴，声音闷得像是从胸腔里挤出来的。\n“我宁愿她疼着走完……也好过让她躺在床上，像个废人一样，看着我们哭。”\n我（晓枫）走上前，轻轻地靠在温热的引擎盖上，将手覆盖在小果子的手背上。\n“小果子，那支针筒里的药，换来的是几个小时燃烧生命的光亮。而雪伊的那份蛮力，换来的是让她能抓住这份光亮的机会。”\n“咱们可以选择把她留在病床上，围着她哭，听她说遗言。那样，她会走得‘舒服’些。但咱们所有人，一辈子都会活在‘假如当时……’的悔恨里。咱们会在心里把她当成一个需要被照顾的、可怜的病人送走。”\n我看着小果子那双逐渐睁大的眼睛，一字一顿地说道：\n“头儿她，要用那几根断骨的剧痛，给我们上最后一课。”\n“她要让我们亲眼看着，亲手促成——一个伟大的灵魂，是如何在耗尽最后一滴燃油后，精准地、有尊严地，停在终点线上的。她逼着我们，把眼泪吞回去，去成为她抵达终点的‘路’。”\n我伸出手，轻轻抚摸着那冰冷的方向盘。\n“这辆车，就是咱们和她之间最后的契约。她亲手把它开回来，就是把方向盘，把这片红泥地，堂堂正正地交到了咱们手里。这以后，再有什么风浪，咱们都得自己掌舵了。”\n我的声音哽住了。小果子趴在方向盘上，发出了压抑许久的、撕心裂肺的恸哭。雪伊转过身，将脸埋进了臂弯里，肩膀剧烈地耸动。\n哭声渐渐平息。小果子抬起头，用袖子胡乱地擦干眼泪，然后从口袋里掏出一块干净的手帕，开始认真地、一点一点地擦拭着那个沾满灰尘的方向盘。\n我看着她那专注的侧脸，仿佛看到了那个夕阳下，木棉留给她们的、那个稳如泰山的背影。\n她要把那上面独属于木棉大姐的余温，一点一点，亲手擦拭干净。直到它……在她的手心里，重新变得冰冷，而锃亮。"
LHS.185.a:0 "（我们……启程了。）"

LHS.186.t:0 "种下一颗枯萎的种子"
LHS.186.d:0 "深夜。红泥公社的万家灯火渐渐熄灭，只剩下巡逻队的零星脚步声和远处的虫鸣。\n我（莉莉安娜）提着裙摆，悄悄溜出了那间为我准备的、铺着柔软床铺的客房。那个名叫木棉的、像大树一样温暖的人类，停止了呼吸。我看到了，索拉娜她们哭得像一群被雨淋湿的小狼，那份巨大的悲伤，像冰冷的河水，也淹没了我的心脏。\n我循着记忆，来到了停放那辆吉普车的车库。车门敞开着，里面还残留着混杂着苹果和橘子的香气和……一股子我熟悉的、属于灵魂正在消散的铁锈味。\n我坐在那个空荡荡的驾驶座上，指尖轻轻拂过那个被磨得光滑的方向盘。上面，还残留着一丝……属于她的、倔强的余温。\n我闭上眼睛，调动起那颗属于我的、能听见万物寂静的夜莺之心。\n我听见了。我听见了这片红泥地里，无数个灵魂在为她的离去而低声啜泣。那悲伤汇聚成一条巨大的、冰冷的河流，正要将她的灵魂碎片，彻底冲刷进轮回的深渊。\n我伸出手，掌心凝聚起一团微弱的、带着月光色泽的幽蓝光芒。那是属于冥界的力量，能安抚亡魂，也能……编织记忆。\n“她们需要你。”我对着空气轻声说，声音里带着一丝哭腔，“索拉娜……还有晓枫她们，如果醒来后发现，连最后一丝余温都消失了，她们会撑不住的。”\n我知道，我拥有的只是维系、缝补、欺骗时间流逝的力量。我只能让枯萎的花朵，维持着它凋零前最后的形态。\n我将那团光，轻轻地按在了那个空无一人的座位上。\n“我把你的碎片，收集起来了。”我对着那团光低语，像是在对一个熟睡的孩子讲故事，“我用大家的思念作丝线，用我的力量作针。我给你缝了一件新的、很暖和的睡衣。”\n“你太累了，木棉姐姐。所以，你可以一直、一直地睡下去。”\n“只是……偶尔，当你听到她们在喊你名字的时候，你要记得……在梦里，轻轻地，回应一声，好吗？”\n光芒闪烁了一下，然后，缓缓地，凝聚成了一个半透明的、轮廓有些模糊的、沉睡的人影。她就靠在椅背上，呼吸平稳，像是做着一个很长很长的、关于丰收的梦。\n我收回手，擦了擦眼角的泪水。\n我知道，这只是一个用魔法和谎言编织出来的、无比脆弱的幻影。它拥有了形体，却永远沉睡了。它会忘记所有痛苦，忘记所有疲惫，只记得那些最温暖的、关于篝火和烤红薯的记忆。\n天快亮了。我悄悄地离开了车库。\n这个小小的、温柔的秘密，就让我一个人，替大家，永远地守下去好了。"
LHS.186.a:0 "（晚安，木棉姐姐。早安……木棉姐姐。）"

LHS.187.t:0 "那颗最酸的青苹果"
LHS.187.d:0 "丰收节的篝火烧得正旺，把红泥公社的夜空映照得如同白昼。刚烤好的玉米和红薯散发着诱人的焦香，战士们围坐在一起，分享着缴获来的烈酒，高声唱着跑调的军歌。\n我（晓枫）端着一杯温热的麦酒，和雪伊、小果子一起，远远地站在篝火的边缘。自从木棉姐离开后，咱们三个总是习惯性地聚在一起，像是三只挤在一起取暖的雏鸟。\n就在这时，一个瘦小的身影，怯生生地从人群的缝隙里挤了过来。\n那是个约莫十一二岁的女孩。她穿着一件浆得硬邦邦的旧衬衫，袖口磨破了边。头发被风吹得有些凌乱，遮住了她半张沾着炉灰的小脸。她怀里紧紧抱着一个沉甸甸的粗麻布袋，眼神里透着一股子与年龄极不相称的冷静与倔强。\n“几位……长官。”女孩走到我们面前，声音细细的，却很清晰，“我听说，你们在招新兵。”\n雪伊皱了皱眉，放下酒杯，语气生硬地打量着她：“这里是庆功宴，小丫头。再说，你这小身板，风一吹就倒，枪都扛不起来。回家去。”\n女孩被说得脸颊一红，但攥着布袋的手却更紧了。她把那个沉重的袋子放在地上，解开绳子，里面滚出十几个青得发亮的苹果。\n“我力气很大的。”女孩的声音带着一丝不服输的执拗，“这是我家果园今年收成最好的。我想……我想用它换一个……能摸到枪的机会。”\n我看着她那双眼睛。在那双清澈、透亮的瞳孔深处，燃烧着一团小小的、却无比熟悉的火焰。那是一种……宁愿把所有东西都赌在桌上，也要换一个未来的眼神。\n我弯下腰，捡起一个青苹果，在袖子上擦了擦，递给小果子。小果子咬了一口，立刻酸得龇牙咧嘴。"
LHS.187.a:0 "（这股酸劲儿……真熟悉啊。）"

LHS.188.t:0 "野火燎原，春风又生"
LHS.188.d:0 "“头儿……也喜欢吃这种。”雪伊突然低声说了一句，声音里带着浓重的鼻音。\n我看着眼前这个孩子，心里某个最柔软的地方被狠狠地撞了一下。我蹲下身，平视着她的眼睛。\n“你叫什么名字？为什么想当兵？”\n“他们叫我棉（Mian）。”女孩回答得干脆利落，“旧世界夺走了我的爹娘。你们的故事，教会了我怎么咬回去。我想……亲手把这个家，守得再牢靠一点。”\n棉。\n这个早已被我们刻在心口、埋进红土里的名字，此刻从一个稚嫩的、陌生的唇间吐出，带着一种令人心脏骤缩的重量。\n我伸出手，轻轻擦去她脸上的炉灰，露出那张虽然稚嫩、却已能看出未来轮廓的脸庞。那眉眼，那嘴角，那股子看似懒散、实则比谁都清醒的劲儿……\n我看着她，眼前的篝火、人声、喧嚣瞬间远去。只剩下这个站在我面前的、小小的、仿佛跨越了时空的身影。\n我笑了。笑得眼泪顺着脸颊滑落，滴在了那颗冰凉的青苹果上。\n我站起身，把她那小小的手掌，连同那颗青苹果一起，紧紧地包裹在我的掌心里。\n“好。”我听到自己的声音，带着一种前所未有的、如释重负的颤抖，“从今天起，你就是我们的一员了。”\n雪伊一把抢过我手里的苹果，狠狠咬了一口，酸得整张脸都皱了起来。“嘁，还是这股子要命的酸味儿。”她把剩下的苹果塞回女孩手里，粗声粗气地揉乱了她的头发，“喂，新兵，跟紧了。掉队的话，我可不管你。”\n小果子笑着，从布袋里又拿出一个苹果，和新来的女孩头挨着头，小声地分享着什么。\n我转过头，看着同样红了眼眶的雪伊和小果子。\n“走吧，同志们。”\n“咱们……带新兵回家。”"
LHS.188.a:0 "欢迎归队，新兵"

LHS.189.t:0 "月光下的账本"
LHS.189.d:0 "深夜。晓枫的办公室里，煤油灯的光线将成堆的报表映照得如同起伏的沙丘。空气里弥漫着廉价咖啡因与墨水的混合气味。\n门被推开了，带着一股子果园的清香。\n“还在算？”我（木棉）提着一小篮刚摘的橘子，大大咧咧地走进来，顺手把一件叠得整整齐齐的、散发着月光般柔和光泽的白色长裙扔在了那堆账本上。\n晓枫抬起头，那双总是闪烁着睿智光芒的眼睛此刻写满了疲惫。她看着那件裙子，愣住了。“头儿，这是……莉莉安娜公主的衣服？”\n“她亲手织的。”我剥开一个橘子，塞了一瓣到她嘴里，“那小丫头看你天天穿得像块炭，心疼坏了，熬了好几个通宵赶出来的。换上，让她高兴高兴。”\n晓枫的脸颊泛起一抹罕见的红晕，她拿起那件柔软得不像话的裙子，指尖的触感让她一时间有些不知所措。“这……这太贵重了。而且，现在公社的财政……”\n“就因为财政紧张，才让你穿。”我打断了她，从那堆报表里抽出一张赤字惊人的预算草案，“你是不是觉得，我把国库里最后那点家底全都发下去了，是个只会心疼穷人的败家子？”\n晓枫沉默了。那眼神默认了我的说法。\n我笑了，把橘子皮扔进纸篓，走到窗边，指着窗外那片在月光下显得格外宁静、却又暗流涌动的广袤大陆。\n“晓枫，你是个顶好的会计，但你只看到了账本上的窟窿。你看看这片地，咱们南美洲，缺的是什么？”\n“是重工业，是资本，是……”\n“是信心。”我又一次打断了她，语气变得前所未有的严肃，“咱们这地方，政变跟下雨一样频繁。今天你存一分钱，明天换个头儿，你的钱就变成了废纸。老百姓被吓怕了，他们宁可把金子埋在床底下，也不敢拿出来办厂、买地、扩大再生产。整个市场的血，都是凝固的。”\n我转过身，直视着她那双因震惊而睁大的眼睛。\n“我把钱发下去，发给那些最敢花钱、最需要花钱的人——退休的老工人要修房子，养孩子的母亲要买奶粉，搞发明的学生要买零件。”\n“当这笔钱像洪水一样冲进市场，那些原本把货物囤在仓库里等着涨价的投机商，就必须开仓售卖；那些原本只敢小打小闹的手工作坊，为了满足暴增的需求，就必须扩大规模，招募更多的工人。”\n“我不仅是把钱发下去，我还给那些开工的作坊免了三年的捐税，给买零件的学生批了地。光有钱没货，那是引火烧身；有了钱又有了货，那才叫大业。”\n我走到她面前，拿起那件白色的裙子，亲手披在她因为长期伏案而略显单薄的肩膀上。\n“我知道，这笔钱花出去，账面上看，咱们穷得叮当响。但实际上，等这潭水彻底转起来，税收、就业、生产力……都会像滚雪球一样涨回来。到时候，咱们才算真正有了造大船、炼好钢的底气。”\n“……头儿。”晓枫的声音带着一丝不易察觉的颤抖和由衷的敬佩，“您这笔账……算得比我精。”\n我笑着拍了拍她的肩膀，把剩下的橘子全都塞进她怀里。\n“行了，别算账了。穿上新裙子，去院子里走走。”"
LHS.189.a:0 "今晚的月亮，亮得很啊。"

LHS.190.t:0 "我们的家在何方"
LHS.190.d:0 "那个来自东方的姑娘，是在一个阳光和煦的午后抵达的。她穿着一身洗得干净的旧军装，长发用一根简单的红绳束起，怀里紧紧抱着一个用油布包裹得方方正正的包裹，仿佛那是她的整个世界。\n“我叫沈红红。”她站在我们面前，眼神清澈而坚定，像一株在悬崖上迎风盛开的红花，“我奉命，为你们送来一份……迟到了很多年的家信。”\n我（晓枫）和雪伊交换了一个眼神，然后一起看向了站在我们身旁的小果子。小果子有些局促地捏着自己的衣角，好奇地打量着这位远道而来的客人。\n沈红红走到小果子面前，蹲下身，小心翼翼地解开那个包裹。里面，是一只已经褪了色的虎头香包，还有一个被铁皮盒子妥善保存的、泛黄的卷宗。\n“我们解放了一座沿海的城市。”沈红红的声音很轻，带着一种讲述历史的庄重，“在整理旧政权的档案时，我们找到了这个。它记录了在大饥荒年代，所有离港南下的船只和乘客。”\n她翻开卷宗，指着其中一页上的两个娟秀的小字。阳光透过树叶的缝隙，斑驳地洒在那两个字上。\n【禾果】\n小果子的身体，在那一瞬间，有了一个特别微小的、几乎无法察觉的颤抖。\n“你的母亲……她当时是那个港口的税务官。”沈红红的声音里带着一丝敬意与悲伤，“在那个吃人的年代，她利用职务，将你送上了最后一艘开往南方的船。为了给你凑足船票和路上的口粮，她……”\n沈红红顿了顿，眼眶微微泛红。\n“她向上面谎报了她辖区内的税收，私自留下了本该上缴的粮食。那些粮食，让她凑够了你的船票。而在你走后，她把剩下的，全部分给了其他快要饿死的孩子。”\n小果子抬起头，嘴唇微微张开，却发不出任何声音。"
LHS.190.a:0 "……"

LHS.1922.t:0 "我们的家在何方"
LHS.1922.d:0 "“旧政权很快就发现了。他们以‘叛国罪’和‘贪污腐败’的罪名逮捕了她。档案的最后，只有一行小字……”\n沈红红深吸了一口气，一字一句地说道：\n“‘于冬月，枪决于港口。’”\n整个院子里，只剩下风吹过树叶的沙沙声。\n小果子伸出颤抖的手，轻轻地、轻轻地触碰着那个虎头香包。一股混杂着草药和阳光的、无比熟悉的味道，钻进了她的鼻腔。\n她想起了那艘冰冷的船，想起了一个模糊的、温暖的怀抱，和一句反复在耳边响起的、带着哭腔的叮嘱：“活下去……我的禾果……一定要活下去……”\n雪伊走上前，一把将小果子搂进怀里，用她那件宽大的军大衣，裹住了她颤抖的身体。雪伊的嘴唇抿成了一条线，眼眶红得吓人，却一个字也说不出来。\n我蹲下身，轻轻地握住了小果子冰凉的手。\n“禾……禾果……”我试着，念出了那个名字。\n怀里的女孩，终于发出了压抑许久的、如同幼兽般的呜咽。她把脸深深地埋进雪伊的怀里，泪水，终于浸湿了那片早已褪色的布料。\n“哼，这么拗口的名字，哪有‘小果子’叫着顺口！”雪伊粗声粗气地嘟囔着，手却把怀里的小小的身体，抱得更紧了，“听好了，小不点！以后，我们就是你的家人！”\n沈红红看着这一幕，露出了一个混杂着悲伤与欣慰的笑容。她站起身，对着我们郑重地敬了一个军礼。\n“我的任务完成了。但是……”她的眼神变得无比炽热，“我读过你们的故事，我听过你们的战歌。现在，我想亲眼看看，你们是如何在这片红土上，创造出一个崭新的世界。请允许我，留下来，成为你们中的一员！”"
LHS.1922.a:0 "欢迎回家，小果子。欢迎入列，沈红红同志。"



LHS.191.t:0 "蓝色制服"
LHS.191.d:0 "煤油灯的火苗轻轻摇曳。夜深人静时，小果子在档案室里找到了沈红红。\n“红红姐姐，我想看完剩下的卷宗。”小果子的声音平静且坚定。\n沈红红微叹一声，将那份厚重的档案递到她手中。\n翻到最后一页，一张泛黄的黑白照片映入眼帘。照片上的女人穿着笔挺的蓝色税务官制服，面容冷峻严肃。这与小果子记忆中那个温暖的怀抱大相径庭。\n\n档案上的墨迹冰冷刺骨。饥荒肆虐的岁月，这位母亲作为帝国的税务官，踏着堆积如山的尸骸，忠实地执行着横征暴敛的命令。她监督着每一粒粮食上缴国库，任凭饥民在街头咽气。她是那台吃人机器上最冷酷的齿轮。\n\n唯独在生命即将终结的时刻，她篡改了这辈子唯一的账目。她用从饥民口中夺下的、沾满鲜血的粮食，换取了一张南下的船票。送走女儿后，她将仅剩的碎饼分给码头垂死的孤儿，随后坦然站在了帝国的行刑队前。\n\n小果子的指尖紧紧抠住照片的边缘，喉咙深处翻涌着浓重的血腥气。这份母爱极端自私、残忍至极，却将生还的希望全数倾注在她的身上。\n\n她缓缓将档案合拢，贴在胸口，感受着纸张粗糙的纹理。晓枫抱着文件靠在门边，雪伊端着热气腾腾的肉汤站在走廊，两人的目光皆是沉默而温柔的守望。\n\n“我都接受。”小果子扬起头，眼底闪烁着淬火般的坚韧，“她赐予我生命，她欠这世间的血债，我用一辈子去还！”\n\n雪伊走上前，把那碗热汤重重地塞进小果子手里。\n“喝汤，小果子。”雪伊粗着嗓子催促，“吃饱了，才有力气干活还债。”\n“嗯！”她端起瓷碗，大口吞咽着滚烫的汤汁。那份名为“禾果”的沉重罪孽连同泛黄的纸页锁进抽屉，而此刻站在灯光下端着肉汤的，依然是大家最疼爱的小果子。"
LHS.191.a:0 "（背负着罪孽与爱意，继续活下去。）"

 # LHS.192 — 基建25
 LHS.192.t:0 "踩实了，就是路"
 LHS.192.d:0 "晓枫把一张汗津津的草图铺在桌上，指尖划过林子里刚压实的那条红土路。\n“头儿，这路从矿区直插码头。以前走三天，现在一天就能闻到海盐味了。”\n\n我站起身，用力跺了跺脚底的红泥。这地界虽然全是断头路，但只要大伙儿肯出力，总能连成片。\n\n“路通了，人心就顺了。咱们接着挖。”"
 LHS.192.a:0 "让这大地的血脉，流得更远些。"
 LHS.192.a_tt:0 "§Y基建指数§!: §G+2§!"

 # LHS.193 — 基建50
 LHS.193.t:0 "风里的汗水味"
 LHS.193.d:0 "晓枫送来两份报告，一份是运费开支，一份是工人的出勤表。省下来的时间，全变成了车间里的号子声。\n“对比两年前，同样的货，现在轻快了许多。省下的力气，大伙儿全用在夜校的朗读声里了。”\n\n我看着窗外连绵的绿，这路顺了，路上的风也就顺了。既然血脉通了，咱们得往里填点实实在在的肉。\n\n“把省下的运费，全拨给夜校吧。路重要，走在路上的人更重要。”"
 LHS.193.a:0 "继续铺，要把全南美的乡亲都连在一块儿。"
 LHS.193.a_tt:0 "§Y基建指数§!: §G+3§!"
 LHS.193.b:0 "“知识这东西，比什么都能暖人心。”"
 LHS.193.b_tt:0 "§Y教育指数§!: §G+5§!"

 # LHS.194 — 基建75
 LHS.194.t:0 "大地的动脉"
 LHS.194.d:0 "外国记者看着咱们在雨林里铺出来的公路和电网，愣神了好半天。他大概以为，咱们这群泥腿子只会烧荒。\n他最后吐出两个字：“彻底。”\n\n我喜欢这两个字。既然干了，就得干出个样儿来。让重型卡车能跑起来的路，才叫路；能点亮成千上万盏矿灯的电，才叫电。\n\n“晓枫，告诉那帮修路的小伙子，他们现在是公社的国宝了。”"
 LHS.194.a:0 "铁路局升格！工程师是咱们的脊梁！"
 LHS.194.a_tt:0 "§Y基建指数§!: §G+5§!"

 # LHS.195 — 福利25
 LHS.195.t:0 "碗里有了荤腥"
 LHS.195.d:0 "食堂师傅递过来一张买肉的单子，老厚的手茧上沾着油星，脸红得像个熟透的番茄。\n“头儿，肉吃得勤了，钱就有点紧……”\n\n我接过单子，在那大红印子旁边签了字。既然要让大伙儿卖力气，肚子里就得有荤腥。这是咱们的规矩，谁也不能改。\n\n“不够的账，我亲自去平。你只管把那肉炖烂点，让大伙儿吃得满嘴流油。”"
 LHS.195.a:0 "吃饱了，才有力气把旗子插得更高。"
 LHS.195.a_tt:0 "§Y福利指数§!: §G+2§!"

 # LHS.196 — 福利50
 LHS.196.t:0 "芒果的甜味"
 LHS.196.d:0 "镇上的老伯推着一筐刚摘的芒果来找我，说是感谢公社修好了引水渠。他说话虽然有些磕巴，但那双看着土地的眼睛，比星星都亮。\n\n晓枫给那筐芒果画了幅画。她说外头的人都觉得咱们这儿苦，可他们哪懂这种实打实的欢喜。\n\n“这种甜头，是继续给大伙儿补身子，还是把这股劲头带到车间里去？”"
 LHS.196.a:0 "民生重过天，先让乡亲们再多笑几年。"
 LHS.196.a_tt:0 "§Y福利指数§!: §G+3§!"
 LHS.196.b:0 "“肚子圆了，干活儿的嗓门也该响起来了。”"
 LHS.196.b_tt:0 "§Y产业指数§!: §G+5§!"

 # LHS.197 — 福利75
 LHS.197.t:0 "红泥地上的好日子"
 LHS.197.d:0 "晓枫指着普查表上的几个红圈，声音里透着欣慰。出生率涨了，娃娃们的哭声更响亮了。老人们能安安稳稳地坐在树荫下剥橘子了。\n\n我想起以前。这片土上的人，生下来就是为了受苦，累死在矿井里那是常态。\n\n“给退下来的老伙计们多发点津贴。”我跟晓枫说，“让他们带带孙子。这些年少吃了多少苦，咱们心里得有数。”"
 LHS.197.a:0 "多心疼老的小的，这日子才有奔头。"
 LHS.197.a_tt:0 "§Y福利指数§!: §G+5§!"

 # LHS.198 — 教育25
 LHS.198.t:0 "第一次写自己的名"
 LHS.198.d:0 "晓枫拉着我去扫盲班的考场。一个年过半百的老矿工，手抖得像筛糠，却硬是在黑板上写出了歪歪扭扭的三个字。那是他自己的名字。\n\n他回头看我，那眼神里有一团火在烧。晓枫低声说，他这辈子第一次没有去按手印，学会了握笔。\n\n“字识了，往后就得教他们怎么看图纸，怎么管机器。这只是个开头。”"
 LHS.198.a:0 "把扫盲班升级，咱们得有自己的技校。"
 LHS.198.a_tt:0 "§Y教育指数§!: §G+2§!"

 # LHS.199 — 教育50
 LHS.199.t:0 "握笔的手"
 LHS.199.d:0 "技校毕业那天，三十八个娃娃站得笔直。他们以前握过砍刀，拉过纤绳。现在，他们手里攥着的是结业证书。\n\n外头来的顾问小声问晓枫，这些泥腿子真能看懂电路图？\n\n我走到他们跟前。这些娃娃眼里有股子不怕死的狠劲，也有想把世界翻过来的勇气。我想，比起那些只会念经的，我更相信这双长了茧子的手。\n\n“你们是想留在实验室里磨脑子，还是回车间里带带工友？”"
 LHS.199.a:0 "建大实验室，让娃娃们尽管去闯。"
 LHS.199.a_tt:0 "§Y教育指数§!: §G+3§!"
 LHS.199.b:0 "“进车间，把脑子里的东西变成实实在在的钢材。”"
 LHS.199.b_tt:0 "§Y产业指数§!: §G+10§!"

 # LHS.200 — 教育75
 LHS.200.t:0 "红泥地的骄傲"
 LHS.200.d:0 "这天亮堂得很。晓枫把一份论文递给我，写文章的是个二十多岁的本地姑娘。没靠谁的关系，这文章全凭硬实力登上了大刊物。\n\n以前，咱们这儿的孩子，梦里最高的位置就是管个仓库。现在，他们在琢磨原子和合金了。\n\n“成立国家科学院吧。”我拍了拍桌子，“给他们最好的屋子，最足的经费。让他们放开手，去看看这天到底有多高。”"
 LHS.200.a:0 "科学院揭牌！咱们的娃娃也能看星星！"
 LHS.200.a_tt:0 "§Y教育指数§!: §G+5§!"

 # LHS.201 — 产业25
 LHS.201.t:0 "那团火，点着了"
 LHS.201.d:0 "第一炉红彤彤的铁水淌出来的时候，车间里的工人全是黑脸白牙的笑。没谁喊那种大口号，大伙儿就是单纯地乐。\n\n晓枫在小本上记了一笔：钢产量，几百吨。\n\n这点数字在强国眼里可能连塞牙缝都不够，但我知道，这火既然点着了，谁也别想再把它熄灭。”"
 LHS.201.a:0 "火烧旺点，让红光照遍整座山头！"
 LHS.201.a_tt:0 "§Y产业指数§!: §G+2§!"

 # LHS.202 — 产业50
 LHS.202.t:0 "流水线转起来了"
 LHS.202.d:0 "生产员说话时，嗓子都带了颤音。流水线稳住了，齿轮咬合得丝滑得要命。\n我站在车间二楼，看着零件在传送带上滑动，那感觉，确实像条奔腾的大河。\n\n“这是咱们自个儿搓出来的机器，是咱们自个儿练出来的手。”\n\n“这股子劲儿是拿去扩产，还是给大伙儿发点奖金乐呵乐呵？”"
 LHS.202.a:0 "多建几座厂，咱们的胃口大得很！"
 LHS.202.a_tt:0 "§Y产业指数§!: §G+3§!"
 LHS.202.b:0 "“发奖金！让辛苦了一年的手，也摸摸金币的温度。”"
 LHS.202.b_tt:0 "§Y福利指数§!: §G+8§!"

 # LHS.203 — 产业75
 LHS.203.t:0 "工业的脊梁"
 LHS.203.d:0 "那个曾经说咱们搞不出工业的经济学家，悄没声地把自己写的那些丧气文章全删了。人活一辈子，总有看走眼的时候，我不怪他。\n\n晓枫拿来一张高空照片。从那上面看下去，咱们的工业区密密麻麻的，烟囱像雨后的新笋一样，挨个儿往上蹿。\n\n“定个日子吧，就叫工业独立日。得让娃娃们记住，这天下，是他们自个儿一锤子一锤子砸出来的。”"
 LHS.203.a:0 "全面提速！让旧世界的灰尘跟在咱们后头吃土吧！"
 LHS.203.a_tt:0 "§Y产业指数§!: §G+5§!"

 LHS.204.t:0 "【公报】路修得再直，床还是歪的"
 LHS.204.d:0 "晓枫把两张表甩在雪伊面前，语气里带着火气。基建的账很漂亮，可工人宿舍的房顶还漏着雨呢，有人睡觉还得拿盆接着。病假的人数这个月翻了番。\n\n雪伊看着那些数字，心里有些堵。\n\n“大路通了，人的心却还悬在破房梁上。这笔账，我们得赶紧填平。”"
 LHS.204.a:0 "停点工程，先把大伙儿的被窝弄暖和了。"
 LHS.204.a_tt:0 "§Y福利指数§!: §G+4§!"
 LHS.204.b:0 "路是骨头，骨头没硬，肉就长不住。"
 LHS.204.b_tt:0 ""

 LHS.205.t:0 "【公报】“图纸堆满了，没人会看"
 LHS.205.d:0 "技校的娃娃跑来诉苦，说老车间里没地方放他们设计的新模型。老师傅们还拿着旧法子，不让他们碰这，不让他们动那。\n\n我去工厂转了一圈。师傅们没错，他们怕坏了活儿。娃娃们也没错，他们想露一手。\n\n“给娃娃们专门辟个车间，让他们自个儿闹腾去。这地基，得有人落脚才行。”"
 LHS.205.a:0 "建实践工坊，让纸上的东西落进泥土里。"
 LHS.205.a_tt:0 "§Y产业指数§!: §G+5§!"
 LHS.205.b:0 "再等等，种子总得慢慢熬。"
 LHS.205.b_tt:0 ""

 LHS.206.t:0 "【公报】“别让大炮坏在手快上”"
 LHS.206.d:0 "生产事故的条子，这个月又送来了三张。全是操作不当。说明书是写给专家的，工人看不明白。\n\n我把车间主任叫过来。咱们给工人配了最好的机器，却没给他们配上相衬的脑子。光靠老祖宗传下来的经验，管不住这几千吨的压力。\n\n“从利润里抠出一笔钱来，晚上把灯点亮，办夜校。先把机器摸透了，再谈产量。”"
 LHS.206.a:0 "办技术夜校，大伙儿一块儿动脑子。"
 LHS.206.a_tt:0 "§Y教育指数§!: §G+5§!"
 LHS.206.b:0 "赶订单要紧，手脚利索点就行。"
 LHS.206.b_tt:0 ""

 LHS.207.t:0 "【公报】今天的橘子格外甜"
 LHS.207.d:0 "这一个月，晓枫没来找我叹气。\n\n这事儿稀罕得很。她拿来的汇总单上，到处都是代表“达标”的红叉。基建、福利、教育、产业，全都稳如泰山。\n\n小果子叼着根草溜进来，笑着问，是不是今天食堂又加餐了？\n\n“因为今天，每一笔账都是踏实的。”晓枫笑着说。这种日子，咱们得死死守住了。”"
 LHS.207.a:0 "放半天假！大伙儿都辛苦了。"
 LHS.207.a_tt:0 "民心大振（§G+3%§! 稳定度）\n士气高昂（§G+2%§! 战争支持度）"
 LHS.207.b:0 "趁热打铁，这火不能灭！"
 LHS.207.b_tt:0 "§Y产业指数§!: §G+2§!"

 LHS.208.t:0 "【紧急报告】晓枫的警报"
 LHS.208.d:0 "晓枫把两张表拍在雪伊面前。一边是军工订单，一边是民生申请。两边差了一大截。\n\n“雪伊，工人们都在嘀咕，说咱们光顾着磨刀，忘了灶台。”\n\n这话听着刺耳，但也实在。一个人，如果两条腿不一样长，走起路来迟早得摔个狗吃屎。\n\n“给老娘补！这缺了哪块，咱们就得把哪块垫平了！”"
 LHS.208.a:0 "民生优先！先把过日子的厂子盖起来。"
 LHS.208.a_tt:0 "§Y福利指数§!: §G+3§!"
 LHS.208.b:0 "“先忍忍，仗还没打完呢。”"
 LHS.208.b_tt:0 "§Y教育指数§!: §G+3§!"
 LHS.208.c:0 "两边一块儿起！谁也不准拖后腿！"
 LHS.208.c_tt:0 "§Y基建指数§!: §G+3§!"

 LHS.209.t:0 "顶天的高个"
 LHS.209.d:0 "观察团的报告发到了全世界，说咱们在基建、福利、教育和产业上同步到了一个离谱的高度。\n他们说，这不符合任何现有的模型。\n\n晓枫把这行字用红笔圈了出来，贴在咱们大院最显眼的地方。\n\n我看着那行字，笑了。既然不符合他们的模型，那就说明，咱们自个儿闯出来的路，走通了。\n\n“这路是娃娃们用锄头一记记挖出来的，谁也抢不走。”"
 LHS.209.a:0 "这只是个开始，咱们的太阳还在后头。"
 LHS.209.a_tt:0 ""

 LHS.210.t:0 "红泥地的奇迹"
 LHS.210.d:0 "狂欢节的第三天，我一个人爬上了山头。从这儿看，整片红泥地被灯火填得满满当当的。工厂的烟，市集的闹，还有住宅区那整齐的红瓦。\n\n晓枫走过来，递给我一份报告。军工和民工，差距已经平了。\n\n“他们总觉得咱们会崩，觉得咱们顾了嘴就顾不了枪。”她轻声说着，眼底全是笑。\n\n我把报告揣进兜里。他们不懂，红泥地里长出来的骨头，硬得很。”"
 LHS.210.a:0 "这可不是什么奇迹。这是一锄头一锄头刨出来的。"
 LHS.210.a_tt:0 ""

LHS.999.t:0"来自[PAN.GetName]的邀请函"
LHS.999.d:0"------当前日期：[?global.date.GetDateStringNoHour]\n瓦尔哈拉的信使，在今天清晨送来了一份出乎我们所有人意料的文件。\n那不再是过去那种措辞典雅、充满了圣物与盟约精神的外交辞令。\n这封信的语气，变得……直接，而坚定。\n信中，瓦尔哈拉社首先告知我们，她们已正式与南方的“野火”结成革命同盟。她们称，这是一个为了“解放所有被压迫者”而建立的、牢不可破的联盟。\n然后，信的后半部分，才是写给我们的。\n“……致我们最亲密的盟友，废墟图书馆：”\n“旧的时代，已经结束了。我们不能再像过去那样，仅仅满足于守护那些故纸堆里的知识与秩序。因为当世界燃烧时，再坚固的书页，也会化为灰烬。”\n“……我们知道，你们有着自己的理想与坚持。但现在，浪潮已经到来。我们必须做出选择。”\n“……我们诚挚地邀请你们，与我们一起，加入这场……为了缔造一个真正平等的、没有压迫的新世界的最终革命。这需要你们，对现有的、过于保守的社会结构，进行一次彻底的、勇敢的革新。”\n“……请理解。。这只是……一个来自老朋友的、最坦诚的忠告。”\n“……我们，在路的尽头，等你们。”\n信的最后，落款是瓦尔哈拉社领袖的名字。但在她的名字旁边，还有一个小小的、用铅笔画上去的、歪歪扭扭的笑脸。旁边，标注着一行小字：\n“——还有我哦！( ´ ▽ ` )ﾉ ”\n……\n我们很清楚这封信的份量。\n“邀请”的背后，是两支当今世界上最强大的革命力量，共同投下的、不容置喙的目光。\n留给我们的时间，不多了。"
LHS.999.a:0"时代的浪潮，无法阻挡。我们接受这份“邀请”"
LHS.999.b:0"图书馆的宁静，不容许被革命的喧囂所打扰！"

LHS.9991.t:0"来自[PAN.GetName]的邀请函"
LHS.9991.d:0"------当前日期：[?global.date.GetDateStringNoHour]\n瓦尔哈拉的信使，在今天清晨送来了一份出乎我们所有人意料的文件。\n那不再是过去那种措辞典雅、充满了圣物与盟约精神的外交辞令。\n这封信的语气，变得……直接，而坚定。\n信中，瓦尔哈拉社首先告知我们，她们已正式与南方的“[LHS.GetName]”结成革命同盟。她们称，这是一个为了“解放所有被压迫者”而建立的、牢不可破的联盟。\n然后，信的后半部分，才是写给我们的。\n“……致我们最亲密的盟友，废墟图书馆：”\n“旧的时代，已经结束了。我们不能再像过去那样，仅仅满足于守护那些故纸堆里的知识与秩序。因为当世界燃烧时，再坚固的书页，也会化为灰烬。”\n“……我们知道，你们有着自己的理想与坚持。但现在，浪潮已经到来。我们必须做出选择。”\n“……我们诚挚地邀请你们，与我们一起，加入这场……为了缔造一个真正平等的、没有压迫的新世界的最终革命。这需要你们，对现有的、过于保守的社会结构，进行一次彻底的、勇敢的革新。”\n“……请理解。。这只是……一个来自老朋友的、最坦诚的忠告。”\n“……我们，在路的尽头，等你们。”\n信的最后，落款是瓦尔哈拉社领袖的名字。但在她的名字旁边，还有一个小小的、用铅笔画上去的、歪歪扭扭的笑脸。旁边，标注着一行小字：\n“——还有我哦！( ´ ▽ ` )ﾉ ”\n……\n我们很清楚这封信的份量。\n“邀请”的背后，是两支当今世界上最强大的革命力量，共同投下的、不容置喙的目光。\n留给我们的时间，不多了。"
LHS.9991.a:0"时代的浪潮，无法阻挡。我们接受这份“邀请”"
LHS.9991.b:0"图书馆的宁静，不容许被革命的喧囂所打扰！"

LHS.1000.t:0"来自[PAJ.GetName]的请柬"
LHS.1000.d:0"------当前日期：[?global.date.GetDateStringNoHour]\n与南方的同志们结盟之后，我们原以为，接下来要面对的，将是一场漫长而艰苦的、关于重建与解放的战争。\n但我们……都没想到。\n我们的新盟友，那位看起来总是有些脱线的野火指挥官，给我们带来了一份……超乎所有人想象的“惊喜”。\n那天，她正在我们的圣堂里，好奇地研究着壁画上那些古老的故事。突然，她好像想起了什么，一拍脑袋，对我们说：\n“啊，对了，差点忘了。还有几个很厉害的“读书会”的朋友，也说要一起来帮忙。我把这里的地址，告诉她们了。”\n就在我们疑惑，什么样的“读书会”，能在未来可能会有的席卷大陆的战争中帮上忙时。\n圣堂中央的地面上，毫无征兆地，浮现出了一圈金色的、由无数书籍虚影构成的光环。光环之中，一扇由厚重书脊与飞舞书页构成的、巨大而华丽的门扉，缓缓地，打开了。\n我们所有人都屏住了呼吸。\n因为，我们认得那扇门。那是只存在于最古老的传说中的、据说收藏了世界上所有故事的、那座……“废墟图书馆”的入口。\n一个银发的、眼神如同最深邃的星空般的女性，领着一群气质各异、但都散发着非凡力量的司书们，从门中，缓缓地，走了出来。\n“午安。”那个银发的女性，向我们微微颔首，她的声音，像图书馆里最古老的乐章，平静，而威严，“我是图书馆的馆长，安吉拉。”\n她的目光，扫过我们每一个人，最后，落在了那个……正一脸“看吧，我没骗你们吧”的、无辜表情的野火指挥官身上。\n“应这位……‘有趣的说书人’的邀请，也为了寻找一本……我们尚未收藏的、关于‘希望’的书籍的结局。从今天起，图书馆，及其所有司书，将暂时，作为各位的盟友，共同行动。”"
LHS.1000.a:0"那个“读书会”…原来是这个“读书会”啊？！"
LHS.1000_tt:0"§R这意味着我们将加入[PAN.GetName]，对于我们来说这场游戏已经结束了。§!"

LHS.1100.t: "……这就，通关了？"
LHS.1100.d: "王宫的阳台上，索拉娜那顶镶满宝石的王冠，还没来得及焐热，就被我们一脚踹飞了。战斗……结束得比任何人想象的都快。\n我（雪伊）清了清嗓子，正准备发表一段足以载入史册的、关于新时代开始的胜利演说。\n可晓枫却突然，从旁边，递给了我一份……看起来很奇怪的文件。上面，没有军报，也没有重建计划，只有一行用红色大字打印出来的标题：\n【野火革命军路线指南】\n“这什么玩意儿？”我皱着眉头问。\n“一份……来自某个更高维度的‘剧本’。”晓枫的表情，是一种我从未见过的、混合着茫然、困惑与一丝……荒诞的复杂神情。她指着指南上的一段小字，对我念道：“注：还没有做在战胜军团之前优先解决莉兰迪亚的路线，所以最好不要那么做！”\n我：“……啥意思？”\n晓枫深深地吸了一口气，然后用一种……宣布我军一个主力师全军覆没时才会有的、沉痛的语气，对我解释道：“意思就是……雪伊同志，我们好像……把最终BOSS，在新手村就给秒了。然后……作者她，后面的剧本，还没写。”\n我俩，面面相觑，陷入了长久的沉默。\n阳台下，我们的同志们，还在兴高采烈地，庆祝着这场……莫名其妙的“速通胜利”。可他们的欢呼声，听在我们耳朵里，却显得那么……空洞。\n我们就这样，赢了？那我们背负的血债呢？我们承诺的未来呢？那些更强大的敌人……军团呢？\n“所以……”我艰难地开口，感觉喉咙里像塞了一把沙子，“……我们接下来，做什么？”\n晓枫没有回答我。她只是，默默地，从口袋里，拿出了一副扑克牌。\n她将牌，一张一张地，摊在阳台冰冷的石栏上。\n“……或许，”她的声音，轻得像一阵风，“……在‘作者’想好下一章该怎么写之前……我们……可以先打会儿牌？”\n那一刻，我看着她手中那张红桃A，又看了看阳台下那片……充满了迷茫与狂欢的、崭新的国土。\n我突然觉得，这场……我们用生命和鲜血换来的革命……\n好像……有点……\n……草率了。"
LHS.1100.a: "为什么不顺着路线指南来！"

LHS.1101.t: "……这就，打赢了？"
LHS.1101.d: "我（雪伊）的最后一个弹夹，已经打空了。最后一颗手榴弹，也早已扔向了那片……无穷无尽的、由骸骨与噩梦构成的潮水。\n我靠在最后一堵断墙上，握着那把滚烫的、再也打不响的步枪，准备用枪托，去迎接我……和这个世界的、最后的结局。\n晓枫的血，还在我的脸上没有干透。小果子的哭声，仿佛还回荡在耳边。\n够本了。我闭上了眼睛。\n……一秒。两秒。一分钟。\n……预想中的、被撕碎的剧痛，没有传来。\n周围那股令人作呕的、混合着腐臭与甜腻的味道，好像……也变淡了。\n我有些困惑地，睁开了眼睛。\n然后，我看到了……我这辈子，见过的、最他妈离谱的景象。\n那些……刚才还如同鬼神一般，无法被杀死的亡灵大军，此刻，就像一堆被抽掉了骨头的烂肉，七零八落地，倒在了我的面前。它们身上那些闪烁着幽绿光芒的符文，正在一个接一个地熄灭。\n整个战场，死一样的寂静。\n只有风，吹过那堆积如山的、正在化为尘土的骸骨，发出呜呜的声响。\n……这就，打赢了？\n我看着我手中那把……连膛线都快磨平了的破枪，又看了看远处那片……仿佛被天神下凡，一巴掌拍没了的亡灵大军。\n我狠狠地，掐了自己大腿一把。\n……很痛。\n不是梦。\n我站起身，茫然地，走在那片……由奇迹铺就的、空旷的战场上。\n我突然，想起了一件……晓枫还在的时候，跟我讲过的、关于某个更高维度世界的、可笑的理论。\n她说，在那个世界里，我们所有人的命运，都只是一行行可以被改写的“代码”。\n她说，那里存在着一种……神明般的、不讲道理的“指令”。\n比如……一个叫“annex”的词，就能让一个国家，连同它的所有军队，瞬间，从世界上消失。\n又或者……一个叫“tp”的词，就能让一支陷入绝境的军队，瞬间，出现在敌人的心脏地带。\n我突然，有了一种……非常强烈的预感。\n那个……正在天上看着我的、叫“玩家”的家伙……\n……她，是不是，偷偷修改了什么东西？"
LHS.1101.a: "（不可能！绝对不可能！我就是靠操作！）"
LHS.1101.b: "（……好像，是开了点什么……）"

LHS.1102.t: "……说好的Bad End呢？"
LHS.1102.d: "……结束了。\n最后一具骸骨，在晓枫姐精准的炮火覆盖下，化为了尘土。最后一个怨灵，在雪伊姐狂风暴雨般的冲锋中，烟消云散。\n而我……我只是，握着我那艘小船冰冷的舵盘，看着我打出的那发……歪歪扭扭、本该是信号弹，却意外地，炸塌了亡灵侧翼一座哨塔的照明弹，陷入了长久的、大脑一片空白的沉默。\n我们……赢了。\n三个人，都还活着。\n我看着远处，正互相搀扶着，从尸山血海中走过来的晓枫姐和雪伊姐。她们浑身是血，疲惫不堪，但她们……都在对我笑。\n我本该……冲上去，抱着她们，大哭一场的。\n可我……却突然，想起了一件很奇怪的事。\n我想起了，在很久很久以前，某个更高的维度里，有一份……关于我们这个故事的“路线指南”。\n那上面，用粉色的、冰冷的字迹，清清楚楚地写着：\n【三、小果子线(幸存者)】\n【在1937年1月14日之后，战胜“军团”……你将亲眼目睹那场……吞噬一切的灾难。在这条路线上，你将扮演唯一的幸存者……】\n我……我们，明明已经，把战争拖到了最绝望的泥潭。我们，明明已经，错过了所有最好的战机。\n那场……“吞噬一切的灾害”，也确实来了。\n可是……为什么……\n为什么，剧本上写好的那个……只有我一个人活下来的、孤独的、悲伤的结局……它，没有发生呢？\n“……傻丫头！愣在那干嘛呢！”\n雪伊姐那熟悉的大嗓门，打断了我的思绪。她正和晓枫姐一起，向我走来。\n“……过来！仗打完了，该……回家了！”\n晓枫姐对我伸出了手，她的脸上，带着那种……我只在梦里才敢奢望的、劫后余生的、温暖的笑容。\n我看着她们，又看了看自己那双……因为太紧张，而把舵盘攥得发白的手。\n我突然，就明白了。\n我扔掉了舵盘，跳下我的小船，深一脚浅一脚地，向着她们，也向着那片……被我们三个人，硬生生从‘坏结局’里，抢回来的、崭新的黎明，飞奔了过去。\n或许……\n根本，就没有什么……非走不可的“剧本”。\n有的，只是……一群不想放弃的、笨拙的傻瓜们，那份……该死的、不肯认输的……\n“执念”而已。"
LHS.1102.a: "（恭喜你！成功把坏结局打成了好结局）"

