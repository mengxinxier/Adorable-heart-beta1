LHS_ycns: "云层上的凝视"
LHS_ycns_desc: "“我们的燕子，是我们的眼睛。\n它们要在云层之上，静静地凝视着大地。\n她们要记下每一条小路，每一座桥梁，每一个敌人的营地。\n她们要像画师一样，把这片广阔的战场，清晰地，画在我的脑子里。\n胜利，往往在子弹上膛之前，就已经决定了。”"

LHS_sslz: "掠过树梢的利爪"
LHS_sslz_desc: "“看清楚了之后……就要动手了。\n我不要她们在高空投弹。\n我要她们，像真正的燕子捕食那样，掠过树梢，掠过敌人的头顶。\n用机炮，精准地，拔掉她们的机枪阵地，撕开她们的补给卡车。\n让每一个在地上的敌人，都活在一种‘不知道什么时候，头顶上就会伸下利爪’的恐惧里。”"

LHS_bxdx: "不许你们掉下来"
LHS_bxdx_desc: "“我的每一只小燕子，都很宝贵。\n我告诉地勤的同志们，每一次起飞前，都要像照顾自己的孩子一样，检查她们的每一个零件。\n我宁愿少执行一次任务，也不要听到她们任何一架，没能回家的消息。\n我需要她们活着，和我一起，看到这场战争的结局。”"

LHS_tkaj: "当天空安静时"
LHS_tkaj_desc: "“最终，我们的燕群，将遮蔽整个天空。\n用她们带来的……绝对的安静。\n当敌人的飞机再也不敢起飞，当她们的士兵一听到引擎声就瑟瑟发抖时……天空，就真正属于我们了。\n到那时，我的姑娘们，就可以像真正的燕子一样，在和平的、蔚蓝的、安静的天空下，自由地滑翔了。”"

#禾果经济线
LHS_lkkz: "海的冷酷馈赠"
LHS_lkkz_desc: "“我们活下来了。可活人，是要吃饭的。这片岛屿的土地又冷又硬，种不出故乡的麦子。但大海……大海是公平的。它吞噬过我们的同志，也用冰冷的鱼群和海带养活着我们这些幸存者。我们派出小船，在风浪里撒下渔网。每一次收获，都像是在从那片带走一切的深渊里，把我们的明天，一点一点地，重新捞回来。”"

LHS_jszc: "在礁石间筑巢"
LHS_jszc_desc: "“我们不能住在露天。这里的风能把人的骨头都吹透。我带着大家，找到了海岸线上那些被海浪掏空的巨大礁石和洞穴。我们用沉船的木板堵住风口，用捡来的油布铺在地上。这里不像家，更像是一个临时的巢穴，像海鸟为了躲避风暴，暂时收拢翅膀的地方。很冷，很挤，但……至少，我们在一起。”"

LHS_pslz: "记住她们的温度"
LHS_pslz_desc: "“我们带来的武器不多了。每一支枪，都曾有它自己的主人。这支，是一个笑起来很傻的妹妹的；那一把，是一个总爱哼歌的姐姐的。我不能让它们，和她们的主人一样，在海水的侵蚀下，慢慢变成一堆无用的废铁。我建起了一个小小的工坊，把还能用的零件都拆下来，拼凑、打磨、上油。我们要让这些冰冷的钢铁，继续记住她们的温度。”"

LHS_pslz2: "记住她们的温度"
LHS_pslz2_desc: "“我们带来的武器不多了。每一支枪，都曾有它自己的主人。这支，是一个笑起来很傻的妹妹的；那一把，是一个总爱哼歌的姐姐的。我不能让它们，和她们的主人一样，在海水的侵蚀下，慢慢变成一堆无用的废铁。我建起了一个小小的工坊，把还能用的零件都拆下来，拼凑、打磨、上油。我们要让这些冰冷的钢铁，继续记住她们的温度。”"

LHS_pslz3: "记住她们的温度"
LHS_pslz3_desc: "“我们带来的武器不多了。每一支枪，都曾有它自己的主人。这支，是一个笑起来很傻的妹妹的；那一把，是一个总爱哼歌的姐姐的。我不能让它们，和她们的主人一样，在海水的侵蚀下，慢慢变成一堆无用的废铁。我建起了一个小小的工坊，把还能用的零件都拆下来，拼凑、打磨、上油。我们要让这些冰冷的钢铁，继续记住她们的温度。”"

LHS_thz: "带她们回家的铁盒子"
LHS_thz_desc: "“工程师们给了我两种新的坦克设计图。一种，装甲更厚，炮管更粗，她们说，这能撕开敌人的任何防线。\n另一种，生产更快，也更容易修理，她们说，这能让我们的战士，更加安全得在打完一场仗。\n我……选了第二种。进攻很重要。胜利也很重要。\n可是，我不想再看到，有谁因为坦克坏在了半路上，而再也回不来了。\n我希望我们造的每一个铁盒子，它的第一个、也是最重要的任务，不是去摧毁敌人。\n而是要，把坐在里面的那些好姑娘们，一个不少地，安全地，带回家。”"

LHS_bhkq: "不会哭泣的船"
LHS_bhkq_desc: "“我们又要造新的船了。\n她们问我，想要什么样的船。是能带更多补给的运输船，还是能装更多火炮的战列舰？\n我看着海，想了很久。\n我想起那艘在火光里沉没的船，想起那些被海水吞没的哭声。\n我告诉她们，我想要的船，只有两个要求。\n第一，它要足够坚固，坚固到能替我们挡住最多的炮弹，能承受最汹涌的风浪。\n第二，它要足够快，快到……能把我们从任何一场噩梦里，带出来。\n我再也不想，把希望寄托在一艘会哭泣的船上了。”"

LHS_dtdy: "小小的灯塔"
LHS_dtdy_desc: "“晓枫姐的笔记本是我唯一的灯塔了。可我一个人，读不懂所有的内容。夜里，我把所有还识字的同志都召集起来，围在唯一一盏还能亮的马灯下。我们一起，辨认着那些被水渍浸染的字迹，学习她留下的战术，和那些关于未来的构想。她不在了，可她的思想，必须像火种一样，在我们之间，继续传递下去。我们每个人，都要成为一座新的、小小的灯塔。”"

LHS_dtdy2: "小小的灯塔"
LHS_dtdy2_desc: "“晓枫姐的笔记本是我唯一的灯塔了。可我一个人，读不懂所有的内容。夜里，我把所有还识字的同志都召集起来，围在唯一一盏还能亮的马灯下。我们一起，辨认着那些被水渍浸染的字迹，学习她留下的战术，和那些关于未来的构想。她不在了，可她的思想，必须像火种一样，在我们之间，继续传递下去。我们每个人，都要成为一座新的、小小的灯塔。”"

LHS_dtdy3: "小小的灯塔"
LHS_dtdy3_desc: "“晓枫姐的笔记本是我唯一的灯塔了。可我一个人，读不懂所有的内容。夜里，我把所有还识字的同志都召集起来，围在唯一一盏还能亮的马灯下。我们一起，辨认着那些被水渍浸染的字迹，学习她留下的战术，和那些关于未来的构想。她不在了，可她的思想，必须像火种一样，在我们之间，继续传递下去。我们每个人，都要成为一座新的、小小的灯塔。”"

LHS_chyc: "船骸的遗产"
LHS_chyc_desc: "“这片海域是船的坟场。无数在风暴中沉没的商船和战舰，静静地躺在海底。我带上最好的潜水员，去探寻这些水下的遗迹。我们捞上来的，是还能用的引擎零件，是密封完好的燃料桶，是那些被遗忘在船舱里的工具和罐头。每一次下潜，都像是一场与过去的对话。我们从那些死去的钢铁巨兽身上，汲取着能让我们活到明天的、微不足道的力量。”"

LHS_bzxy: "当我们不再需要祈祷"
LHS_bzxy_desc: "“我们终于，能在这座岛上，自己生产出干净的绷带和还能击发的子弹了。我们终于，在下一次出航前，不用再向着大海祈祷，祈祷风平浪静，祈祷能找到足够的食物和燃料。我们靠着自己的双手，在这片世界的尽头，拥有了可以依靠的基石。虽然它很小，很脆弱。但……它属于我们自己。从现在起，我们不再是幸存者了。我们是……风暴的种子。”"

LHS_ddsc: "大地深处的脉搏"
LHS_ddsc_desc: "“那些冰冷的矿石和钢铁，它们自己是不会说话的。是同志们的汗水，才让它们变成了能保护我们的武器，能温暖我们的炉火。\n我听一些干部说，我们要制定‘五年计划’，要‘最大化开采效率’。这些词，我听不懂。\n我只知道，我们不能像过去的监工那样，只盯着数字，却忘了那些在矿井深处、在熔炉旁边、活生生的人。\n所以，我决定，每一个矿区和工厂的生产计划，都要由在那里工作的同志们，自己开会来决定。她们最清楚，哪里的矿脉最安全，哪台机器需要休息。\n公社的心跳，不应该由几张图纸来规定。它应该……和大地深处的、我们每一个同志的脉搏，一起跳动。”"

LHS_wmyq: "我们一起盖房子"
LHS_wmyq_desc: "“我看到一份宏伟的建设计划，要在首都建一座新的、很大很大的行政大楼。\n我把它……划掉了。\n我问大家，现在最需要房子的，是谁？是那些还住在临时帐篷里的家庭，是那些需要一个干净教室的孩子。\n我们当然需要建设。但建设的顺序，不应该由一份蓝图的重要性来决定。它应该由……人民的需要来决定。\n所以，我们不盖行政大楼了。我们把所有的砖块和水泥，都先拿去盖学校和住宅。而且，不是由专业的工程队来盖。我要让所有机关的干部，包括我自己，都去和工人们一起，搬砖，和泥。\n因为，只有亲手盖起来的房子，住进去，才会觉得……那是自己的家。”"

LHS_zbyg: "把账本摊在阳光下"
LHS_zbyg_desc: "“晓枫姐的笔记里说，最大的危险，是当人民再也看不懂我们的账本。\n我不太懂那些复杂的数字，但我知道，公社的每一粒米，每一颗子弹，都是同志们用汗水和鲜血换来的。所以，这些东西花在了哪里，就应该让每一个人都知道得清清楚楚。\n我们把所有工厂和农场的账本，都用最大号的字，抄写在大黑板上，就立在食堂门口。谁都可以去看，谁都可以去问。\n我们的公社，要像一本摊开的书，对所有人民，没有秘密。”"

LHS_jqth: "工厂是大家的，对吧？"
LHS_jqth_desc: "“有一天，一个年轻的工人来找我。她小声地对我说，她觉得车间里的一道工序可以改进，能省下不少时间和力气。可她不敢和厂长说，怕被当成是挑战权威。我听了，心里很难过。\n我们打倒了旧的厂主，不是为了换上一批新的、穿着公社制服的‘老板’。\n我宣布，在每个工厂里，都成立一个由工人们自己选举出来的‘工人委员会’。生产计划怎么定，工作流程怎么改，甚至……厂长干得好不好，都由她们自己讨论，自己决定。\n因为，工厂，从一开始，就是大家的呀。”"

LHS_jqth2: "工厂是大家的，对吧？"
LHS_jqth2_desc: "“有一天，一个年轻的工人来找我。她小声地对我说，她觉得车间里的一道工序可以改进，能省下不少时间和力气。可她不敢和厂长说，怕被当成是挑战权威。我听了，心里很难过。\n我们打倒了旧的厂主，不是为了换上一批新的、穿着公社制服的‘老板’。\n我宣布，在每个工厂里，都成立一个由工人们自己选举出来的‘工人委员会’。生产计划怎么定，工作流程怎么改，甚至……厂长干得好不好，都由她们自己讨论，自己决定。\n因为，工厂，从一开始，就是大家的呀。”"



LHS_tdzy: "土地的自由呼吸"
LHS_tdzy_desc: "“我们把土地分给了农民。可后来，一些地方的干部，为了追求产量，又开始规定大家必须种什么，什么时候种，什么时候收。\n我看到，一些农民的眼睛里，又出现了那种我熟悉的、无奈的表情。\n不行。这样不行。\n我们推翻了地主，不是为了让自己变成一个新的、穿着革命制服的‘地主’。土地是农民的，就应该让土地和农民一起，自由地呼吸。\n我们成立了农业合作社，但它的作用，是帮助大家交换种子和经验，是组织大家一起修建水渠，而不是去命令任何一个农民，该在她的土地上，种下什么。”"

LHS_bgyx: "当罢工是被允许的"
LHS_bgyx_desc: "“我的一个干部很困惑地来问我：‘禾果同志，现在工厂都是我们人民自己的了，为什么……我们还要允许工人罢工呢？这不是在反对我们自己吗？’\n我告诉她：正是因为工厂是人民的，所以，当人民觉得，我们这些‘管理者’犯了错误，当她们觉得自己的声音没有被听到时，她们就必须拥有最后、也是最响亮的反对权利。\n一场为了让家变得更好的、理性的罢工，不是公社的敌人。\n恰恰相反，它证明了，我们的公社，还健康地、充满活力地，活着。”"

LHS_cgxw: "为了一个可以唱歌的下午"
LHS_cgxw_desc: "“我们为什么要努力工作呢？\n是为了造出更多的东西？还是为了让仓库堆得满满的？\n我想……都不是。\n我们打仗，我们流血，我们重建。我们做这一切，只是为了……能拥有一个属于我们自己的、安宁的下午。\n在那个下午，我们可以放下工具，放下工作，可以去海边散步，可以给孩子们讲故事，可以和喜欢的人，一起靠在长椅上，唱一首跑调的歌。\n让劳动，成为获得幸福的手段，而不是目的。\n这，就是我们公社，全部的意义。”"

#雪伊统一后
LHS_genchu: "根除疥癣"
LHS_genchu_desc: "旧势力留下的毒草烂疮，必须连根拔掉！现在不是温吞的时候！\n所有勾结殖民者的买办、剥削雇工的工厂主、鱼肉乡里的恶霸地主。\n只要证据扎实,没收一切产业归公，土地立刻分给农工！\n我亲自督办名单进度，哪个区域敢拖延、包庇，责任人就地撤职查办！"
LHS_minshen: "严保民生"
LHS_minshen_desc: "民生保障是根基，容不得半点马虎！各城市、村镇的粮食、燃料、药品、基础建材。\n主要生活必需品的储备库必须在下个月初填满！统一调配，足量供应。统计不准、仓库有亏空、敢伸手的，我亲自把她送上刑场！"
LHS_ningshi: "红色凝视"
LHS_ningshi_desc: "都听好了！我们砸烂旧监牢，不是为了让蛀虫在新屋檐下打洞！规矩定了，那就是铁，谁碰，烫谁的手！\n但有一样！谁敢让我雪伊的鞭子打错了人，害了好同志，\n我第一个撕了她！\n监督员下去，不是当老爷！查厂账本要工友小组在场，量农家分田得请老把式跟着。举报信满天飞，更要筛！匿名的没证据、胡咧咧的，当纸糊灯笼点了！有名有姓、有理有据，这才是我们大家所要的公正！"
LHS_anning: "社会安宁工程"
LHS_anning_desc: "同志们，建设需要稳定的土地，如同丰收需要平静的季节。扰乱播种、毒害根基的蛀虫，必须被识别、被隔离。社会安宁工程进入新阶段：清除潜藏的腐坏，保护劳动的果实。"
LHS_yaoyan: "遏制谣言"
LHS_yaoyan_desc: "嚼烂舌头传瞎话，跟风搅乱人心思的，逮住了没二话！查出来源送工地义务劳动，领头起哄的大喇叭念检讨！心思正，嚼舌根的力气拿去搞建设嘛！再乱传？下一个工地轮到你！"
LHS_minjian: "加强民间监督"
LHS_minjian_desc: "让写字的和被告的当面对数——你数豆子，她们数良心。"
LHS_anquan: "国家安全情报组"
LHS_anquan_desc: "其职能为反间谍渗透、预警军事威胁、肃清贪腐网络，不授权任何凌驾于工人之上的权利。"
LHS_lingdao: "背负一切"
LHS_lingdao_desc: "我的目标只有三个：\n确保每一个拼死打赢这场仗的兄弟姐妹，\n第二天醒来有粮吃，有屋顶遮风挡雨,\n干活不被克扣，\n看病不用求神拜佛。\n做不到？那就是我雪伊无能！"
LHS_gengzhe: "大家的土地"
LHS_gengzhe_desc: "仗打赢了，地该归谁？归那些在田里流汗、被地主老财踩在脚下的兄弟姐妹！旧账，终于可以清算了！\n谁敢克扣一粒种子、一把锄头，或者在新分的地上搞破坏，工作队手里的枪，就是给这种人准备的！"
LHS_gongshi: "狠抓工时"
LHS_gongshi_desc: "记住咯！工人休息好了，脑筋清醒，手上稳当，才能造出更多更好的东西！那点盯着钟点挤牙膏压榨出来的破烂活，顶不上次品报废的损失！\n八小时五天是根基，是给咱计划这棵大树浇的水！谁想动摇这根基、榨干咱工人的气血，雪伊的铁拳等着你！"
LHS_keyan: "保护科研人员"
LHS_keyan_desc: "科研所烟囱冒烟时，雪伊总会揣着热饭闯进车间。"再趴着通宵就砸你显微镜！"她凶巴巴把土豆塞给熬红眼的学者，自己却蹲在墙角啃冷玉米,嘴里嘟囔着：\n"脑子金贵的手，得由拿惯镰刀的手来护"。\n话音刚落，又站起转身对着随行的人叮嘱到：以后所有研究纪要末页都要印着两行小字，"雪伊同志说：吃饱睡足了再干活/活下来再搞革命"。"
LHS_yiliao: "医疗系统改革"
LHS_yiliao_desc: "整箱磺胺原封不动堆在角落。"谁定的规矩？等文件？"她声音压着冰，指甲掐进木箱裂缝嘶啦撕开包装，"现在听我的规矩：见伤就治，见血就止！"护士颤抖着递登记簿，她却抽走对方口袋里啃剩的硬饼："先把你胃填满，才有力气填别人的伤。"当夜所有绷带蒸汽沸腾，她抱着膝盖坐在消毒锅旁，直到最后一名护士被赶去睡觉。"
LHS_gongcheng: "大型民生工程"
LHS_gongcheng_desc: "同志们总嫌我催工程像赶着火收麦，可你们难道没闻见？贫民窟的霉味早就渗进革命制服的扣眼了！昨天翻修寡妇阿加莎的屋顶，朽木渣掉进了她的粥锅，她的第一反应却是撒盐盖味？​我们推翻了饿死人的粮商，现在却让子民吃霉？​\n盐不该遮丑，该腌存夏天的西红柿。钢架撑起的玻璃暖房下，孩子光脚踩水泥地也不哆嗦；输水管通到家门口，兄弟姐妹们就能省下挑水的腰力去学农机修理。\n革命得治好每道老伤才能甩臂往前跑！"
LHS_chengai: "尘埃已散"
LHS_chengai_desc: "旧时的尘埃都已散去，我们的人民终将迎来真正的幸福。\n而后，继续朝着前方不断前进！"
LHS_minshengjihua: "民生计划"
LHS_minshengjihua_desc: "吃饱穿暖，才有更多力气搞建设。"
LHS_guofangjihua: "国防计划"
LHS_guofangjihua_desc: "今日多淬火，明日少硝烟。"
LHS_haiyangjihua: "海洋计划"
LHS_haiyangjihua_desc: "阿爷阿娘看这蓝脊梁，等它梨开浪，\n咱们的小崽子就能摸着海平线长大啦。"
LHS_renminxueyi: "人民的雪伊"
LHS_renminxueyi_desc: "莫要赞我肩披霞，\n不过替众擎檐瓦。\n冻土封河我举镐，\n却说“碰巧想砸冰花”。\n\n休道英名刻青崖，\n碑石当铺百姓家。\n待到千门炊烟直，\n笑骂：“谁还记雪伊呀！”\n\n忽见童稚追纸鹞，\n急把奖状叠成它。\n“看！天上飘的都是奖状啊！”"
#雪伊外交线
LHS_renmintuanjie: "人民团结阵线"
LHS_renmintuanjie_desc: "人民的团结不仅限于一个国家的团结，而是要让全世界的人民都团结在红旗之下，我们才能共同迈向新的未来。\n为此，我们必须走向世界的舞台，去联系或拯救我们的同志！"
LHS_tuanjiexibian: "美洲的朋友"
LHS_tuanjiexibian_desc: "在整片美洲大陆，同样有着一群怀揣着一片赤心的同志。"
LHS_tuanjieshenshe: "联系瓦尔哈拉社"
LHS_tuanjieshenshe_desc: "瓦尔哈拉社是与我们最接近也是最友好的同志，我们必须与她们取得联合。\n亦或者，我们必须拯救她们！"
LHS_tuanjiebeimei: "联系北美"
LHS_tuanjiebeimei_desc: "在北美，同样有一批与我们志同道合的同志，她们也是值得联合的。"
LHS_tuanjiemeizhou: "美洲的大家，快团结起来！"
LHS_tuanjiemeizhou_desc: "美洲的同志们，我们理应团结在一起，共同面对充满理想的未来！"
LHS_xiaomiewailaizhe: "消灭外来者"
LHS_xiaomiewailaizhe_desc: "它们的铁蹄和安息之国的腐尸是一路货，把活人钉进牲口栏，把婴儿碾成肉渣滓。我见过矿井里饿成骨架的手扒泥土，见过万人坑里睁着眼的头盖骨堆成山，现在轮到那帮不知死活的欧洲外来侵略者了。\n\n§R要么跪着当鬼，要么站着受死！§!"
LHS_tuanjiesulian: "拜访苏联"
LHS_tuanjiesulian_desc: "苏维埃，是当今全世界共产主义事业的先锋，毫无疑问是值得我们所有人尊敬的。"
LHS_quzhushengbei: "驱逐殖民者"
LHS_quzhushengbei_desc: "圣杯那帮迂腐不堪的老爷还是改不掉她们喜欢乱拉殖民地的习惯，这是我们最后一次将她们驱逐回老家了，若是她们不同意的话..."
LHS_lianhesulian: "紧跟苏维埃的步伐"
LHS_lianhesulian_desc: "跟着老大哥，就能有肉吃。"
LHS_tuanjieyazhou: "亚洲的同志"
LHS_tuanjieyazhou_desc: "我们注意到在遥远的亚洲也有着跟我们境遇相同的同志。"
LHS_tuanjieprc: "支援中国共产党"
LHS_tuanjieprc_desc: "她们和我们是一样的，她们此时的处境也同样不够乐观。\n所以，身为同志，我们必须团结在一起，不留余力得支援她们完成革命。"
LHS_tuanjieyuanjun: "洛维尼亚国际红军"
LHS_tuanjieyuanjun_desc: "为了帮助更多的包括中国在内的同志，仅仅只靠装备上的支援是远远不够的，我们必须建立起自己的国际志愿部队，帮助所有的同志共同抵抗殖民者与法西斯！"
LHS_tuanjiezhongguo: "东方红，太阳升"
LHS_tuanjiezhongguo_desc: "伴随着中国革命同志取得的成功，我们的友谊也将更加坚不可摧！"
 ##经济
LHS_kuangwu: "发掘矿物"
LHS_kuangwu_desc: "为了面对外来之敌，我们必须竭尽可能得发掘我们所处环境下的一切资源。"
LHS_shengchan: "与时间赛跑"
LHS_shengchan_desc: "留给我们的时间从来就没有宽裕过，我们必须把精力放在生产我们能用到的所有武器上面，抢在敌人的子弹到来之前。"
#晓枫经济线
LHS_xiaofengjianshe: "晓枫的劳动"
LHS_xiaofengjianshe_desc: "劳动从不分高低贵贱，无论是工人还是农民，亦或是我们的人民干部，都要为了人民的幸福而参与劳动。"
LHS_gongrenweiyuan: "工人自治委员会"
LHS_gongrenweiyuan_desc: "工厂怎么管，事怎么定，不光是领导干部说了算，更要听听大家的意才对。\n“工人自治委员会”，就是我们工人的话筒，带着我们大家的想法与智慧参与到管理决策中去。"
LHS_ldgr: "劳动的人民最光荣"
LHS_ldgr_desc: "劳动是最光荣的事，工人们的双手创造了这个世界，工人们的双手也将创造出更美好的未来。\n劳动者是最伟大的！"
LHS_tdfp: "土地再分配"
LHS_tdfp_desc: "土地是劳动者的命根子，必须要合理分配，确保每一个劳动者都能拥有一块属于自己的土地。"
LHS_qmsm: "全民扫盲"
LHS_qmsm_desc: "扫盲工作是非常重要的，只有让每一个人都能读懂字，才能更好地参与到社会主义建设中来。"
LHS_rmyl: "人民的医院"
LHS_rmyl_desc: "人人有病治，人人有药吃，人人有医看。\n必须要让每一个人都能享受到同等的医疗服务。"
LHS_gyjs: "国有化经济建设"
LHS_gyjs_desc: "随着王室的覆灭，我们必须要将所有的经济都国有化，只有这样才能更好地保障人民的利益。\n我们要让所有人都知道，经济建设是为了人民，而不是为了少数人的私利。"
LHS_msgz: "没收贵族财产"
LHS_msgz_desc: "王室的贵族们在我们面前跪下了，她们的财产也必须归公。\n我们要没收她们的财产，将其用于人民的福祉。"
LHS_rmbg: "人民兵工厂计划"
LHS_rmbg_desc: "为了更好地保障人民的利益，我们必须要建立起自己的兵工厂。\n只有这样才能更好地保障人民的安全与利益。"
LHS_dpsc: "大规模武器生产"
LHS_dpsc_desc: "要想更好得发挥游击战争的优势，充足的武器供应是必不可少的。\n我们必须要大批量生产武器，确保每一个战士都能拥有一把枪。"
LHS_hpgg: "火炮产线改革"
LHS_hpgg_desc: "火炮是战场上不可或缺的武器。\n我们要想办法火炮的生产效率更高，质量更好，以便在战场上发挥出更大的作用。"

#雪伊经济线
LHS_xueyijianshe: "雪伊的建设"
LHS_xueyijianshe_desc: "能吃饱、能穿暖，若不能先建立在如何从敌人的枪口下活下来的基础上，都只是空口说大话而已。"
LHS_jianzao: "战时建设计划"
LHS_jianzao_desc: "战火与硝烟随时都在空气中弥漫着，衣食温饱在敌人指在脑门的枪口面前显得微不足道。\n至少等先解决了敌人，才能决定自己会不会饿死。\n§R大不了，大不了就吃她们的肉！喝她们的血！§!"
LHS_chanxian: "特殊产线改造"
LHS_chanxian_desc: "战场是随时都在变化的，为了应对不同的战况，战士们所使用的武器也应该要做到灵活变换。\n因此，我们必须要将生产线时刻保持在一种灵活多变的状态下。"
LHS_buqianggaizao: "步枪产线整改"
LHS_buqianggaizao_desc: "我们的步枪供应还有很多缺口，甚至可以说大多数的枪都是从敌人手里缴获而来的，根据战局作出相应的步枪产线整改是很有必要的。"
LHS_qinghuopao: "轻型火炮"
LHS_qinghuopao_desc: "火炮的好处有很多，可它过于笨拙了，带上它我们将很难执行如晓枫说得包围穿插战术，所以，必须想办法改造出更轻便，更迅捷的火炮。\n哪怕这意味着要牺牲掉它的火力与可靠性。"
LHS_niaoer: "空中的鸟儿"
LHS_niaoer_desc: "“如鹰击长空”"
LHS_yuer: "水中的鱼儿"
LHS_yuer_desc: "“如鱼翔浅底”"
LHS_tank: "钢铁之师"
LHS_tank_desc: "很好，只要有了这群大铁疙瘩，管她什么王室亡灵殖民者，冲过去碾死她们就完事了！"
LHS_tielu: "我们的铁路"
LHS_tielu_desc: "跟晓枫钻了几年矿道，公社的人闭着眼都能摸清岩层走向，要说铺铁路，我们再擅长不过了。"
LHS_gonglu: "公路建设"
LHS_gonglu_desc: "好的行军离不开好的路，人民百姓的生活亦是如此。"
LHS_chuanwu: "船坞大建"
LHS_chuanwu_desc: "我们能造船的地方实在是太少了，少得要命，为了能与世界接轨，能保卫我们的海域不受殖民者侵犯，必须大力建设我们的船厂。"
LHS_sheshi: "紧急特殊研究计划"
LHS_sheshi_desc: "光有大炮肯定不够，我们要的目的彻底根除一切敌人，要把她们轰得连渣都不剩！\n所以，必须用尽一切办法加快我们的地面武器的研究！"
LHS_quanminjianshe: "全民建设热潮"
LHS_quanminjianshe_desc: "战火终于平息，我们从殖民老爷们手里拿回了我们该有的一切。\n现在，终于可以把心放在建设祖国的事业上了，来，为了你我的幸福，为了大家的幸福。\n工人们，行动起来！包括你，也包括我。"
LHS_ziyuan: "矿道里有什么？"
LHS_ziyuan_desc: "当然是矿物啦，我们在矿道里摸爬滚打了这么久，太熟悉了。"
LHS_zuiduo: "我们拥有什么？"
LHS_zuiduo_desc: "毫无疑问，依旧是矿物，哪怕放眼整个世界。"
LHS_shiyou: "我们缺少什么？"
LHS_shiyou_desc: "是石油，很多的石油，数不清的石油。"
LHS_hhjj: "资源互助协会"
LHS_hhjj_desc: "同志们，仅仅是靠一国的独大是难以实现真正的社会主义的，哪怕资源再多也无济于事。\n因此，我们必须互相帮助，分享彼此之间的资源，才能共同迈向真正的共产主义社会。"
LHS_zyyj: "关注资源研究"
LHS_zyyj_desc: "哪怕拥有再多资源，不知道如何开采发掘它们的话就都是虚的。\n所以，我们必须更进一步关注合成资源发掘的研究项目。"
LHS_jssy: "建设炼油厂"
LHS_jssy_desc: "经过长时间的石油采购，我们的石油供应终于略显充裕了。\n为此，是时候建设起我们自己的炼油厂了。"
 #军事
LHS_zhihui: "再次指挥"
LHS_zhihui_desc: "好的军队离不开好的领导与指挥，简单的道理。"
LHS_youji: "野火游击队"
LHS_youji_desc: "敌人的实力相比我们强大很多。\n对此，我们必须组建一批能够不断骚扰敌人又能快速全身而退的队伍。"
#晓枫军事线
LHS_xiaofengzhanshu: "晓枫的指挥"
LHS_xiaofengzhanshu_desc: "\n别问火把能照多远，先问我们是否一同举起。"
LHS_lwnyyouji: "革命游击队"
LHS_lwnyyouji_desc: "她们害怕的不是我们的枪声，而是回荡在贫民窟、矿区、村庄上空，那比枪声更嘹亮的，千万人同声呐喊的意志！"
LHS_xiaobuwu: "“小步舞”战术"
LHS_xiaobuwu_desc: "通过持续不断的、低强度的多方向袭扰，以最小的自身代价牵制、消耗和瓦解优势敌人，\n这种战术就像迈开小步的舞蹈，却能给予敌人的士气当头一棒。"
LHS_yjzs: "夜间作战"
LHS_yjzs_desc: "夜间运动是游击队另一个重要的特点，这可以使游击队进入攻击位置，并在一个有可能存在遭出卖危险的新区域把队伍组织起来。"
LHS_zxdy: "战士的遗志"
LHS_zxdy_desc: "游击队战士死后，决不能把武器弹药留在他们身边。每当有伙伴倒下了，每个游击战士都有责任马上捡回这些极度珍贵的斗争物资。"
LHS_lhzz: "灵活作战"
LHS_lhzz_desc: "游击战士的另一个基本特点是灵活性，即适应任何环境，变行动中的所有意外为有利条件的能力。"
LHS_cqby: "出其不意得进攻"
LHS_cqby_desc: "游击部队进攻的形式也是与众不同的。发起攻击时要出其不意，势头猛烈，毫不留情，然后突然间偃旗息鼓。\n残余之敌惊魂稍定后，以为进攻者已经离开了，于是开始放松，在其被围困的地点内恢复平常生活，这时一轮新的进攻突然又在另一个地方打响。"
LHS_pohuai: "破坏行动"
LHS_pohuai_desc: "破坏行动是非常重要的。在破坏和恐怖主义之间必须要作出明确的区分，前者是一种革命的和富有效率的战术手段，而后者一般而言并不奏效，对其结果也不加选择，它往往使无辜的人民成为牺牲品，而且它所毁灭的许多生命对于革命来说是很有价值的。"
LHS_dilei: "预设埋伏"
LHS_dilei_desc: "在公路边设埋伏，引爆地雷并消灭幸存者的战术对于获取武器弹药是最划得来的。惊慌失措的敌人无法使用他们的弹药，也没有时间逃跑。因此，只要付出一小部分弹药就能取得极为可观的结果。"
LHS_zhtl: "炸毁铁路"
LHS_zhtl_desc: "敌人最弱的地方在于公路和铁路交通。要想守卫住一条交通线——公路或铁路——的每一米几乎是不可能的。在任何一个点上都可以放置大量的炸药，使道路无法通行。除了切断道路之外，在交通工具经过时引爆炸药，会给敌人造成很大的生命与物质上的损失。"
LHS_yinni: "隐匿行军"
LHS_yinni_desc: "空军在一支现代的正规军中是最受青睐的兵种，被认为是一支具有决定意义的力量。然而，在游击战争的早期它是没有用武之地的，因为游击队活动在地势崎岖的地区，而且很少会有大的集结。空军只有在对可见的、有组织的防御进行系统打击时才有效，这就要求必须有大量的人集结在一起修建防御工事才行，而这在游击战中是根本不存在的。飞机也只有对付在平地或没有遮蔽的地方排着整齐的队伍行军的部队时方显其强大。不过，这一弱点可以轻易地回避掉，只要在夜里行军就行了。"
LHS_xjzz: "游击行军准则"
LHS_xjzz_desc: "如何对待游击队活动区域内的人民是游击战术的一个重要部分。如何对待敌人也很重要。在进攻的时候，定下的准则必须要不折不扣地执行，对于所有诸如告密和暗杀等可耻行径要严惩不贷，而对那些为了履行她们的军事职责——或以为她们是在履行职责——而投入战斗的敌方士兵则务必要展现最大可能的仁慈。"
LHS_qhdd: "强化军队道德水平"
LHS_qhdd_desc: "在尚未取得重要的活动根据地并且没有攻不破的防御阵地时，不留俘虏是一个很好的政策。对战斗中幸存的敌方士兵应当予以释放。对伤员要按行动时所有能得到的资源予以照顾。和老百姓打交道要尊重当地的风俗和传统，要通过实际行动让她们清楚地感到，游击战士的道德水准是高于压迫者政府的士兵的。"
LHS_qzzc: "从群众中来"
LHS_qzzc_desc: "游击战争是群众的战争、人民的战争，对这一点加以强调是很重要的。游击队作为一个武装的核心，是人民的战斗先锋。它的伟大力量正是来自于人民大众本身。不能仅仅因为武器装备处于劣势，就认为游击队逊于其对手。虽然使用游击战争的一方用于抵抗压迫的武器装备非常有限，但却得到了大多数人的支持。"
LHS_rmzd: "为人民而战"
LHS_rmzd_desc: "正如在一场现代战争中指挥一个师的将军不用死在士兵们面前一样，游击战士作为他自己的将军也不用非得在每场战役中死去。游击队员随时愿意付出生命，游击战的一个优点就是，虽然每个游击战士都愿意去死，但他或她的死决不仅仅是为了捍卫一个想法，而是要使那个想法变成现实。这就是游击斗争的精髓。"
LHS_rmwz: "人民的武装"
LHS_rmwz_desc: "同志们，我们不能总让最勇敢的人用胸膛去迎接子弹。我们从人民中来，获得了无穷的力量，现在，我们也要用这股力量，为人民锻造出最坚固的盾和最锋利的剑。这些钢铁、引擎和炮管，它们不是冰冷的战争机器，它们是我们意志的延伸，是保护每一个村庄、每一座工厂、每一个家庭的誓言。"
LHS_lddb: "流动的堡垒"
LHS_lddb_desc: "我们的革命根植于每一寸解放的土地，我们必须守护好她。这支重型装甲部队将成为人民最坚实的移动防线。她们或许不追求极致的速度，但她们的正面坚不可摧。每一辆坦克都是一座堡垒，她们将稳步推进，巩固战线，在我们身后构建起一片绝对安全的后方，让工厂的烟囱安心地冒烟，让田野的麦苗茁壮地生长。"
LHS_tjhl: "铁甲的洪流"
LHS_tjhl_desc: "进攻是最好的防御。 如果说游击队是刺入敌人肌体的无数根针，那这支铁甲洪流就是撕开敌人主动脉的利刃。我们要将游击战的精髓注入到坦克的履带中，以闪电般的速度席卷平原与山谷，穿插、分割、包围，在敌人反应过来之前，将革命的旗帜插遍她们的指挥部。让敌人永远在我们的身后疲于奔命！ "
LHS_rmtq: "人民的铁拳"
LHS_rmtq_desc: "为何要做出选择？人民的需要是全方位的。我们将组建一支由中型坦克为核心的混成装甲部队，既要有攻坚的重量，也要有穿插的速度。她们是多面手，是能应对任何复杂战况的铁拳。在城市，她们能提供精准的步兵支援；在野外，她们能展开迅猛的突击。这支部队的战术手册将由前线的战士们亲自书写，因为最了解战场的人，永远是人民自己。"
LHS_tkyh: "人民的援护"
LHS_tkyh_desc: "我们的飞行员，不是为了空战的荣誉，而是为了保护地面的每一个同志。每一架盘旋的战机，都是地面部队抬起的眼睛和伸出的臂膀。我们要专注于对地攻击，像外科手术一样精准地拔除敌人的碉堡与炮群，为冲锋的步兵扫清障碍。 天空将不再是威胁，而是我们最可靠的掩护，是人民军队战斗序列中不可或缺的一环。 "
LHS_rmys: "天空的鹰隼"
LHS_rmys_desc: "我们不能总在阴影中行军和建设。 人民需要看到没有恐惧的、清澈的蓝天。我们要成为天空的猎手，打造一支强大的战斗机部队。 我们的任务只有一个：将所有敌人的铁鸟从我们的领空彻底清扫出去！我们要夺取制空权，让阳光毫无遮拦地洒在我们新生的共和国之上，让敌人的侦察机和轰炸机成为废铁。 "
LHS_hsxg: "红色信鸽"
LHS_hsxg_desc: "天空的价值，不仅在于战斗。我们将发展一支以运输机和侦察机为主的战略空军。 她们是“红色的信鸽”，能将我们的精锐部队和宝贵物资，跨越山脉与河流，直接投送到最需要的地区。她们能带回最准确的情报，让敌人无所遁形。 战争的胜利，不仅取决于谁的拳头更硬，也取决于谁能更快、更准地将力量投送到决定性的地点。 "
LHS_haws: "海岸卫士"
LHS_haws_desc: "我们的海岸线漫长而富饶，人民的劳动果实决不能再被海上的强盗肆意劫掠。我们将组建一支由潜艇、驱逐舰的近海防御舰队。她们是“海岸的卫士”，是潜伏在波涛之下的海上游击队。她们将用鱼雷和深水炸弹，为我们的海上贸易线织成一道无形的钢铁屏障，让任何胆敢侵犯我们海疆的敌人有来无回。"
LHS_hsjd: "红色舰队"
LHS_hsjd_desc: "革命的浪潮不应被海洋阻隔。在世界的另一端，还有无数同志在黑暗中战斗，她们的呼声我们必须回应。我们将着眼于未来，建造一支能够远涉重洋的“红色舰队”。战列舰乃至航空母舰，将成为我们连接世界革命的桥梁，是承载着解放意志的方舟。我们要让这抹红色，成为全世界被压迫民族眼中希望的颜色。"
LHS_rmdh: "人民的海"
LHS_rmdh_desc: "大海本身，就是人民力量的延伸。我们将发动沿海的渔民、工程师和水手，将无数艘民用船只改造、武装起来，形成一片汪洋大海般的人民海军。主力战舰作为核心，无数武装渔船、快速炮艇作为血肉，我们将用属于人民的汪洋大海，淹没一切来犯之敌。敌人的舰队再强大，也终将被这片无穷无尽的“人民之海”所吞噬。"
#雪伊军事线
LHS_xueyizhanshu: "雪伊的领导"
LHS_xueyizhanshu_desc: "\n战士，本就该不畏险阻，夺回本该属于她的一切。"
LHS_youqi: "赤色骑兵"
LHS_youqi_desc: "晓枫的骚扰战术帮助了我们很多，但仅仅停留于此是不够的。\n在此基础上，深入敌后，主动出击，在敌人还未察觉时，与前线部队一起快速包夹敌人，从根本上剿灭她们，才能彻底消灭她们的有生力量。"
LHS_mofashaonv: "接纳魔法少女"
LHS_mofashaonv_desc: "魔法少女们！听着！\n你们过去被迫当刀子，为该死的愿望，砍杀、流血！今天，那把悬在你们脖子上的镰刀，我们砸烂了它！\n这里，没有哄骗你们的外星兔子，只有等着开垦的盐碱地和需要盾牌保护的同胞！愿意的，留下！\n干好了，奖励红星徽章！干砸了，老娘亲自带你们加练！但记住，从归队这天起，你们不再是消耗品，是扛起未来的同志！"
LHS_zongjie: "延续晓枫战术"
LHS_zongjie_desc: "记得矿道里晓枫总举着油灯，手指划过岩壁上的标记：“这处薄，声音传得远；那裂缝通着旧风井，能绕后。“她那些磨破边的地图，教会我用矿脉当耳朵，把废巷道变成绞索。现在她画的每条虚线都刻在我脑子里，洛维尼亚的石头就是我们的刀。别辜负她。活着，继续前进。"
LHS_zhengming: "为前佣兵正名"
LHS_zhengming_desc: "当年艾瑞波拉血巷，是这群佣兵用身体堵住隘口。\n卡卡罗姆断粮时，是她们饿着肚子把缴获罐头全分给工人孩子。现在谁再骂'走狗'，就让她去翻战报，野火革命军的第一把火，就是这群'叛徒'用命点着的！"
LHS_hongguozhihai: "红果开海"
LHS_hongguozhihai_desc: "有了这片‘红果之海’，我们的家园才能像熟透的果子一样，不再被觊觎和掠夺，安稳地挂在枝头。"
LHS_haijun: "洛维尼亚红海军"
LHS_haijun_desc: "若再有海上强盗来犯，呼唤我们的名字。"
LHS_haijunchuji: "主动出击"
LHS_haijunchuji_desc: "要想让敌人沉入海底，最高效的方法就是先一步主动出击。"
LHS_haijunjingzhun: "精准打击"
LHS_haijunjingzhun_desc: "哪怕威力再大的舰炮也得打得准才行。"
LHS_haijunbubai: "永不言败的红海军"
LHS_haijunbubai_desc: "我们背负了很多，于是我们永不言败。"
LHS_fengxuetieqi: "枫雪铁骑"
LHS_fengxuetieqi_desc: "说什么蠢话！建坦克厂明明是因为晓枫那混蛋的战术手册还在我枕头底下发烫，有了坦克当然什么战术都好说。以及，现在那群臭要饭的殖民者还躲在城墙后面笑我们没坦克没重炮呢。\n笑啊！等老娘的履带碾塌她们的石头城堡的时候，有她们哭的。"
LHS_hongjun: "洛维尼亚红军"
LHS_hongjun_desc: "我们捍卫的是人民，我们的枪口指向人民的敌人。"
LHS_hongjunsudu: "疾速行军"
LHS_hongjunsudu_desc: "快！再快！\n快在敌人还未反应过来之前！\n包围她们,\n追赶她们,\n剿灭她们！"
LHS_hongjuntuanjie: "团结的人民永远不会被击溃"
LHS_hongjuntuanjie_desc: "起来，战斗，人民走向胜利！"
LHS_xueyinghangkong: "雪莺展翅"
LHS_xueyinghangkong_desc: "小东西，飞得快，叫声好听，啄人可疼。"
LHS_xueyingxiaodui: "雪莺小队"
LHS_xueyingxiaodui_desc: "雪莺一号同志，雪莺二号同志！你问我为什么我们的航空队会叫这种名字？因为我喜欢，啊不对，是大家都喜欢。\n连一个站出来对这个名字提出过意见的人都没有，这跟我一贯强硬的态度有很大关系，或许...该轻点声跟同志们说话了。"
LHS_xueyingkuobian: "扩大飞行编队"
LHS_xueyingkuobian_desc: "你见过飞机吗？\n没有？\n谁见过飞机？\n见过飞机的都过来,见过飞机就行。"
LHS_xueyingxunlian: "加强飞行训练"
LHS_xueyingxunlian_desc: "学会了怎么让飞机飞上天之后，就该考虑怎么让飞机把敌人全都轰烂了。"
LHS_xueyingtiankong: "莺之天空"
LHS_xueyingtiankong_desc: "天空从不属于某个人，亦从不属于任何一个国家，它一直在那里，在那里等着所有的一切像雪夜中的莺群一样展翅高飞。"
####事件####
LHS.1.t: "秘密来信？"
LHS.1.d: "雪伊同志：\n\n我是卡卡罗姆矿井下的晓枫。我们的篝火快熄了，孩子们围在余烬旁搓着手。王室的铁靴堵死了所有出口，风像刀子一样刮进来。\n听说你的工人们，能让冻土里长出救命的土豆。我们这里的老矿工常说，地底最深的煤层挨在一起时，连石头都会暖和一点。\n\n我的父亲死在罢工路上，他最后一句话是‘别让炉膛冷掉’。你的父亲呢？他一定也希望你灶台的火，能暖到那些快冻僵的手吧？\n\n卡卡罗姆的矿道深处，还有几千个不肯低头的魂。她们饿着肚子，却把最后一点玉米糊让给伤员。雪伊同志，借我们一捧火吧——不是施舍，是让两座山头的微光，凑成足以熬过寒冬的太阳。\n\n你送来的每一袋粮，每一捆柴，都会变成我们多挖一寸通往春天的坑道。让炉火和灶火，在地下连成一片。\n\n                                                                                                 ——————晓枫"
LHS.1.a: "必须帮助我们的同志"

LHS.2.t: "雪伊的回信"
LHS.2.d: "晓枫同志：\n\n你的信，是裹着卡卡罗姆的煤灰和寒气到的。磨坊里正连夜赶工，麦粒在石磨下唱着歌，面粉的细雪落在姑娘们冻红的脚背上。我念着你写的字，手心里那块你信里带来的、冰冷的煤渣，竟慢慢被焐热了。\n\n父亲咽气前画在地上的断锄头，我这辈子忘不了。你父亲那句“别让炉膛冷掉”，像烧红的烙铁，烫在我心口那块旧疤上。是啊，哪座山头的穷骨头，不是被同一场风雪抽打着？ 磨坊的姑娘们听了卡卡罗姆孩子舔岩盐的事，默默把刚领的玉米饼又掰下一半，塞进运粮袋。她们说：“给山肚子里那些小地鼠，她们挖的坑道，也是给咱春天蹚路呢。”\n\n粮车已经上路了。公社的老乔叔套上了他拉了一辈子咖啡豆的骡子“铁蹄”。车斗里是晒得干透的橡子面、磨坊头茬最细的玉米粉，还有用火炕烘得焦香的土豆片——嚼一块能顶半天饿。压在最底下的，是几麻袋咖啡园新收的豆子，当然,一颗霉豆也没有。 \n\n路，你放心。赶车的姑娘叫小雀儿，她爹当年在卡卡罗姆背过矿。哪条废矿道藏着野蜂窝能取蜜，哪片背阴坡的冻土下还埋着秋收时慌慌张张藏下的红薯，她爹的旧地图上，画得比军团的布防图还清楚。她们的眼睛亮得很，专挑地缝钻。 雪再大，也盖不住穷人认路的本事。\n对了！你说“借一捧火”？晓枫，你错了。看看你信纸背面透出来的、那些孩子们用炭笔画歪歪扭扭的炉子——那火苗，你们自己就没让它灭过！ 我们送去的不是火种，是添把柴，是让卡卡罗姆和洛维尼亚两处灶膛的烟，在风雪里拧成一股绳，呛死那些骑在咱们脖子上的人！\n\n我晒了满满一布袋的蒲公英的根给你，这是母亲当年教我的土方子，揉碎了敷伤口，好得很快。熬过这个冬天。等开春，磨坊的石磨要碾新麦，卡卡罗姆的废矿坑里，也该开出我们自己的、不怕霜的花来。\n\n                                                                                                 ——————雪伊"
LHS.2.a: "我们是一样的"
LHS.3.t: "无声的信任"
LHS.3.d: "“本叔。”晓枫的声音在狭窄的空间里显得突兀，“你上次说，洛维尼亚磨坊边上…雪伊她们建了新仓库？存土豆？”\n本叔抹了把脸上的煤灰：“是啊！那些姑娘，有点本事。听说用了新法子，硬是从冻地里刨出了吃的！仓库？磨坊东边，老谷仓加固而成的，听说塞得满满当当。隔着半个战区呢，看得人眼馋，够不着啊。”他叹了口气，声音里混着饥饿的咕噜声。\n\n就在两天后，一次针对落单军团运输队的伏击，除了缴获几箱劣质弹药，晓枫还在一个军官僵硬的手指下抽出一份被血浸透边缘的密令。借着摇曳的火光，她辨认出潦草的字迹：\n“……洛维尼亚磨坊东侧加固谷仓确认为新储粮点。行动代号：清野。三日后午夜，执行彻底焚毁。目标：断绝其越冬根基……”\n篝火旁的气氛瞬间凝固。队员们盯着那行字，脸色比矿道里的岩石还灰暗。毁了那些土豆…她们都知道挨饿的滋味，知道那意味着什么。有人低声咒骂：“报应！让她们上次…”话没说完，就被更沉重的沉默吞没。\n晓枫盯着“清野行动”那几个字，胃里像塞满了冰渣。军团的手段从未改变，毁灭是她们的本能。她沉默地将密令仔细折好，塞进一个防水油纸包。接着，在所有人困惑的目光中，她从贴身口袋里掏出那枚早已摘下、边缘被磨得光滑冰冷的佣兵鹰徽——一个她以为早已丢弃的过去印记——也塞了进去。\n“本叔,把这个，送到洛维尼亚公社雪伊手上。然后立刻回来。不要说话。”\n本叔粗糙的手指捏着那薄薄的油纸包，感觉到里面硬物的轮廓，又看看晓枫毫无表情的脸，浑浊的眼睛里充满了惊疑：“头儿？这…太冒险了。那徽章…”\n“让她看，”晓枫打断他，头灯的光在她下颌投下坚硬的线条，“让她自己判断。”\n\n三天后，本叔带着一身疲惫和深夜的寒气回来了。没有信件，没有口信。他只带回一个沾满新鲜泥土、沉甸甸的小麻布袋。解开粗糙的系绳，里面是十几个大小不一、但个个结实饱满的土豆，表皮湿润，带着地窖的凉气和泥土的腥甜。袋子内侧，用烧过的木炭，潦草地画了一个简单的对勾（✓）。\n本叔搓着冻僵的手：“就…塞给我这个。没说话。不过…回来路上，天快亮时，好像看见公社的人连夜在磨坊东边搬东西…”\n晓枫拿起一个土豆，掂量着它沉甸甸的分量，冰凉坚硬的外壳下，似乎能感觉到蕴藏的生命力。\n“明白了。”她把土豆轻轻放回袋子，声音轻得像矿道深处渗出的水滴，却带着一种尘埃落定的笃定。"
LHS.3.a: "又多了一群战友"
#雪伊
LHS.4.t: "放眼当下"
LHS.4.d: "“王室的旗帜在硝烟未散的广场上被扯下，踩进泥泞。短暂的、嘶哑的欢呼声在洛维尼亚的街头巷尾爆发，随即被更深的疲惫和亟待解决的生存问题淹没。破碎的窗户灌着冷风，空荡的粮仓张着大口，铁轨像被巨兽撕扯过的肠子扭曲在地。\n雪伊站在临时搭起的讲台边缘，看着下方相拥而泣、疲惫却狂喜的面孔——矿工、前佣兵、磨坊女工、衣衫褴褛的农会成员...此刻都融化在同一片胜利的微光中。\n\n晓枫走到她身边，递过一个还沾着庆典彩屑的搪瓷杯，里面是温热的、兑了水的稀粥。“怎么了，一副闷闷不乐的样子”晓枫的声音不高，带着昨夜指挥战斗后的沙哑，目光扫过广场边缘几个蜷缩在毯子里的孤儿，“她们会有一个家的。”\n\n“等找到能养得起她们的人再说吧。”雪伊轻声说，更像是对自己，她深吸一口气，那混杂着硝烟、灰烬和稀粥味道的空气，是新时代第一口真实的滋味——沉重，但不容回避。”"
LHS.4.a: "该考虑今后的事了"
LHS.5.t: "黎明"
LHS.5.d: "第一缕光刺穿群山的轮廓，熔金般泼洒在洛维尼亚新翻的田垄上。\n\n晓枫推开指挥所吱呀作响的木窗，风卷着晨雾灌进来，混着远处磨坊转动的低鸣、广播站试音的电流嘶响，还有公社晒场上孩子们追逐的清脆笑声。铁轨在霞光里向地平线延伸，锃亮的轨道反射出细碎金芒。\n\n雪伊赤脚站在刚解冻的泥地里，弯腰捏碎一块板结的土块。湿润的黑色沃土从她指缝簌簌落下，裹着几颗饱满的、等待破壳的豆种。她抬起头，眯眼望向那轮挣脱山脊的巨大火球——\n\n万丈金辉正撕裂最后一丝夜寒，像亿万支灼热的箭镞，钉满整个苏醒的原野。"
LHS.5.a: "太阳照常升起"
LHS.6.t: "躁动的亡者" 
LHS.6.d: "庆典的烟火§R尚未散尽§!，卡卡罗姆群山的晚霞却凝固成一片§R污浊的脓黄§!。\n\n晓枫猛地推开指挥所窗户，刺鼻的§R铁锈混合着墓土§!的腥气灌入肺腑。远处，洛维尼亚公社新翻的田垄上，雪伊正弯腰查看麦苗——她指尖触碰的嫩叶瞬间§R蜷曲发黑§!，渗出§R粘稠的暗红汁液§!，如同腐败的伤口。\n\n'怎么回事？！'雪伊惊骇的声音被一阵§R非自然的死寂§!吞没。磨坊巨大的水轮发出指甲刮过玻璃般的§R尖利摩擦§!，奔流的河水诡异地§R平静§!下来，表面浮起一层§R蠕动的人形泡沫§!，空洞的五官在夕阳下§R融化§!。\n\n'看东边！'瞭望哨的嘶吼撕破了寂静。晓枫的望远镜循声转向——地平线被翻涌的、§R沥青般粘稠的雾霭§!吞噬，雾中隐约可见§O深黑色§!的安息之国旗帜猎猎作响。旗帜之下：\n\n§R缝合巨尸§!背负着由§R哭嚎人骨§!组成的管风琴，每一个音符落下都化作啃噬光线的§R黑蝶§!；\n§R身着华服的王室贵妇腐尸§!提着§R滴血的镶金茶具§!，裙摆下伸出§R百只沾满胎脂的婴儿骨手§!，在泥地上抓挠出刺耳声响；\n§R空洞的骑士盔甲§!胸腔内塞满§R仍在转动的浑浊眼球§!，马蹄踏过之处，焦土竟绽放出§R不断开合利齿的肉色蔷薇§!。\n\n一个声音，既非通过空气传播，也非通过电波，而是像§R冰冷的蠕虫§!直接钻入每个人的脑髓，带着腐朽下午茶般的§R甜蜜恶意§!：\n\n“亲爱的革命者们...\n真抱歉打扰了你们§R短暂的小憩§!。\n让我们继续那场§R未尽的茶会§!吧？\n永恒的安息...\n才是§R最终的革命§!。”"
LHS.6.a: "她们究竟是...什么？"
LHS.7.t: "噩梦具现"
LHS.7.d: "§R眼球爆裂§!的侦察兵艰难得爬回指挥部，手指深陷自己§R撕裂的脸皮§!：\n“子弹...穿过她们的身体...\n却从§R我的内脏里穿出来§!...\n\n火焰点燃雾霭...\n反而烧焦了§R我们的记忆§!...”\n\n话音未落，她的脊椎突然§R破背而出§!，化作§R晶红骨鞭§!抽碎窗户。浓雾中浮现曾经的王室成员§R半融的笑脸§!，声音直接碾进脑髓：\n\n\“欢迎来到真实世界\n这里§R死亡只是开始§!\n而痛苦...\n是§R永恒的牢笼。§!”"
LHS.7.a: "全军备战！"
LHS.8.t: "尖啸与哀嚎"
LHS.8.d: "§R刺耳的警报§!撕裂了洛维尼亚山脉的黎明。东线第三矿道防御阵地传来§R疯狂的无线电呼叫§!，信号被强烈的静电干扰撕扯得支离破碎：\n\n“...它们进来了！§R墙壁在流血§!... §R石头在尖叫§!...“\n\n”...开火！开火！... §R子弹穿过去了§!... §R小若的胳膊...她的胳膊自己扭断了§!... §R啊啊啊——§!”\n\n”...别碰那影子！§R影子在吃人§!... §R它钻进李的眼睛里了§!... §R她在笑！她在笑啊！”§!\n\n信号最终被一阵§R非人的、仿佛千百个喉咙同时被撕裂的尖啸§!淹没，随后是§R死寂§!。\n\n晓枫抓起望远镜冲向观察口。曾经熟悉的矿道入口，此刻弥漫着§R粘稠如血浆的雾气§!。雾气中，几个跌跌撞撞的身影逃了出来——是第三矿道的幸存者。但她们的状态让所有人§R血液冻结§!：\n\n一名士兵抱着自己§R反向扭曲成麻花状的步枪§!，枪管如同§R融化的蜡§!般滴落；\n另一人疯狂抓挠着自己的脸，她的§R眼球在眼眶里高速旋转§!，瞳孔深处闪烁着§R不属于人类的磷火§!；\n最后一人似乎相对“完整”，但她每走一步，脚下的影子就§R扭曲膨胀§!一分，那影子伸出§R漆黑的触须§!，贪婪地吮吸着地面上渗出的、§R散发着铁锈与腐肉气味的暗红液体§!。\n\n就在她们即将逃出雾气的瞬间，那粘稠的血雾中猛地伸出§R数十条由凝固阴影构成的巨蟒般触手§!，以§R超越物理法则的速度§!缠住了逃亡者。士兵们连惨叫都来不及发出，就被§R拖回那片蠕动的、吞噬一切的猩红黑暗§!之中。矿道入口处，只留下几滩迅速干涸的§R污黑印记§!，以及空气中挥之不去的、令人作呕的§R甜腻腐臭§!。"
LHS.8.a: "§R离那里远点！§!"
LHS.9.t: "熄灭的灯"
LHS.9.d: "雪伊倚靠着冰冷的岩壁，手里紧攥着§R最后一盏完好的矿灯§!。昏黄的光晕勉强照亮她脚下一小圈湿漉漉的地面，以及对面晓枫布满血丝、深陷阴影的眼窝。\n\n“§R灯油只够烧到午夜了§!。”雪伊的声音嘶哑得像砂纸摩擦。“§R备用油脂库...被‘它们’浸透了§!。连空气都带着那股... §R甜腻的腐味§!。”\n\n晓枫没说话。她只是盯着那圈摇摇欲坠的光。矿道深处，远远传来几声§R非人的呜咽§!，随后是某种沉重物体在§R粘稠液体§!中拖行的声音，越来越近，越来越清晰。\n\n“§R通讯断绝前...§!”雪伊突然急促地开口，像是怕被那声音吞噬，“§R白城最后的消息说... 说那里的太阳... §R再也没升起来过§!。永远是... §R污浊的黄昏§!。”\n\n话音未落，§R噗——§! \n\n灯芯爆出一朵绝望的火花，骤然熄灭！\n\n彻底的、§R吞噬一切的黑暗§!瞬间淹没了两人。\n\n只剩下那拖行声，§R就在她们背后§!，混合着一种新的声音——仿佛是§R无数细小牙齿在啃噬岩石§!... 和§R骨头§!。"
LHS.9.a: "§R“别动...屏住呼吸...”§!"
LHS.10.t: "熄灭的火"
LHS.10.d: "洛维尼亚边境，一座被苍白冰晶覆盖的废弃教堂内。晓枫背靠着布满了诡异霜纹的圣坛残骸，艰难地喘息。她的队员们倒在通往出口的路上，保持着奔逃的姿势，却已被彻底冻结成剔透的冰雕，脸上凝固着最后的惊恐。\n这种寒冷并非来自外界。即使破损的彩窗漏进春日暖阳，即使她裹紧了所有能裹的衣物，那股刺穿骨髓的冰冷仍从她体内不断渗出。她的皮肤并未结冰，但每一次心跳都像在泵送液氮，每一次呼吸都让肺叶如同被冰刃切割。\n\n“任务...完成了...”她对着空旷的教堂喃喃，声音因寒冷而断断续续。\n\n晓枫感觉自己的思维正在凝固。她低头看着自己微微颤抖的手——指尖已经呈现出一种非自然的半透明。她试图扯出一个惯常的、嘲讽的笑，却发现脸颊的肌肉僵硬得无法动弹。\n\n“有够冷的。”她嘶哑地开口，声音在死寂的教堂里显得格外清晰，带着浓得化不开的荒诞感。”"
LHS.10.a: "报告，任务完成。晓枫队长..和她的队员...未能返回。§!"
LHS.11.t: "死寂"
LHS.11.d: "啃噬声消失了。\n拖行声消失了。\n甚至那永不疲倦的低语... 也消失了。\n\n雪伊背靠着一台锈蚀的矿车残骸，手中只剩下半截崩了口的长柄镐。她身边，仅存的几名战士或蜷缩、或瘫倒，浸透污血的绷带下是缓慢渗着黑液的伤口。她们曾浴血撕开的最后防线，如今只剩这片堆满扭曲金属和焦骨的狭窄矿台。\n\n就在几分钟前，那粘稠如血浆的雾霭还翻滚着扑向她们，其中扭曲的轮廓清晰可见。雪伊甚至能闻到那甜腻腐臭喷在自己脸上——然后，一切骤然凝固。\n\n雾气如同被无形的闸门截断，瞬间退潮。那些可怖的轮廓、蠕动的阴影、乃至弥漫在空气中的亵渎感，如同被橡皮擦抹去，消失得干干净净。\n\n死寂。\n\n不是战斗后的喘息，而是仿佛整个世界被抽干了所有声音的绝对真空。连岩壁渗水的滴答声都消失了。\n\n雪伊踉跄着，拖着一条几乎失去知觉的腿，挪到矿台边缘。她脚下那条被血和油浸透的废弃铁轨——正是当年晓枫撕下佣兵徽章、高举染血怀表，对着万千矿工喊出'站起来！'的地方。\n\n而现在，矿道入口早已坍塌，这里只剩下她和几个濒死的同胞，以及... 脚下这片被更深的、不祥的寂静笼罩的焦土。安息之国的大军，如同从未存在过。只留下她们... 和这片突然降临的、令人窒息的死寂。"
LHS.11.a: "我们失去了太多...太多了"
LHS.12.t: "我们还剩下什么？"
LHS.12.d: "“冷。矿洞深处那种能渗进骨头的冷，让我有点发抖。晓枫走了...那些喊着口号冲出去的同志们，也没了声响。就剩下这些了？\n\n我盯着手里这张破纸片：仓库角落里翻出来的最后三箱炸药；发霉到能砸死人的土豆；绷带？呵，早就用完了，现在只有沾着黑血的破布条。\n\n我扯着嗓子喊过，喊到嗓子都哑了，想让她们看见希望...现在呢？希望？连篝火的火星都快灭了。\n\n她们看着我...那些还活着的、眼睛像死水一样的几个人。她们在等。\n\n等什么？等谁来告诉她们，我们还剩下什么？\n\n...\n\n那就数吧。一粒米、一颗子弹、一条命。都收起来。别再丢了。\n\n什么都行...只要是还能点着的、还能咬人的...都给我数清楚。”"
LHS.12.a: "一个也不能漏掉"
LHS.13.t: "我们还能做什么？"
LHS.13.d: "“顺着新挖的通道出去探路的小果子爬回来了。她说王宫顶上...挂起了熟悉的旗子。..是瓦伦蒂娜的记号。呵。\n\n安息之国那帮杂碎...到底还是把那条断了脊梁的疯狗...又牵回了她心心念念的粪坑王座上。\n\n晓枫的血...同志们的骨头...还有矿井里熬干的灯油...就为了这个？就为了让那帮吃尸体的东西...再给死人套上锁链？！\n\n行。那就好好算算账。\n\n一颗霉土豆...两条破布...三颗还能咬人的子弹...\n\n还有...\n\n我这双...还没挖够她们坟的手。\n\n都给我记下来。一粒灰都别落下。\n\n从今往后——\n\n我们吃的每一口，都得是瓦伦蒂娜的肉。\n\n我们烧的每一把火，都得是安息之国的棺材板！\n\n从这矿坑里爬出去的...\n\n是钉进她们眼窝里的...最后一颗钉子！”"
LHS.13.a: "撕烂王室的嘴脸"
LHS.14.t: "我们能得到什么？"
LHS.14.d: "“矿道顶上在渗血。是瓦伦蒂娜新造的绞刑架...又浸透了吧？\n小果子缩在墙角啃自己的指甲。饿。我们都饿。\n可饿不死人的子弹喂不饱枪膛。\n...\n\n那群穿金戴银的蛆虫能踩着我们骨头坐稳位子...凭的什么？\n凭她们敢从死人嘴里抠金牙！\n\n行啊。\n我们呢？这破坑里还剩什么能抠的？\n\n听好：\n-溜进坟场的...去翻！裹尸布拆了当绷带...烂肉里的铅弹头...抠出来！\n废铁堆给我熔了！锈掉的齿轮...磨成刀尖...断掉的镐头...捶成箭头！\n谁还有力气哭？眼泪收起来...汗也收起来...血更不许流到泥里！全他妈...\n去给我浇种子！一粒霉土豆切片埋下去...长不出根？\n...就用血浇！血不够就拿汗凑！\n\n从今天起——\n一粒铁渣...一口唾沫...半截烂指甲...\n都给我当军粮屯着！\n瓦伦蒂娜啃我们的骨头活...\n我们就在她坟头上...吃她的肉！”"
LHS.14.a: "喝她的血,吃她的肉"
LHS.15.t: "枫与雪"
LHS.15.d: "雨滴从厂房屋顶的破洞飘进来，落在雪伊摊开的笔记本上。她猛地合拢泛黄的书页，像藏起偷来的糖果。\n封面褪色的烫金字《机动战术精要》硌着她的掌心。这本从晓枫行军箱里顺来的手册，如今在枕头底下日夜发烫，书角都被她无意识捏得卷了边。\n\n\"臭铁皮盒子！" \n\n她踹了脚车间中央的铸铁骨架，回音惊飞屋梁上的寒雀。"明明当年那家伙用三轮车都能端掉装甲连！" 可指尖划过笔记本上勾勒的履带结构图时，声音却低了下来，"但要是晓枫那家伙还在...肯定早就搞出能压得敌人喘不过气的坦克了。"\n\n门外传来学徒的吆喝。她抓起扳手钻进底盘，油污顺着辫子滑进衣领。铆钉枪撞击声填满厂房时，她突然从车底探出头喊："炮管再加十毫米！" 见学徒发愣，她捏着颗生锈螺帽砸过去："殖民佬的城墙有十二米厚！等着用指甲抠吗？"\n\n更漏指向三更时，她蜷在图纸堆里咬铅笔头。油灯在颧骨投下晃动的光晕，笔记本摊在膝头，晓枫用红笔批注的侧翼穿插战术正浸在斑驳的茶渍里。"笑我们没重炮...没坦克..." 她突然踹翻工具箱，金属零件瀑布般倾泻，惊醒了打盹的工程师。\n\n众人屏息中，她踩着满地轴承爬上坦克骨架，军靴在钢板上敲出笃笃脆响："等老娘的履带碾塌她们石头城堡的时候，准让轴承转得比她们哭声还响！"晨光刺破屋顶时，新图纸已钉满板墙。雪伊裹着晓枫的旧大衣蜷在炮塔模型里，冻红的手指攥着战术手册睡熟了。摊开的扉页上，晓枫潇洒的签名留言正压着她歪扭的铅笔字：\n\n"等到了哪天，你也该教教我你的战术了吧，我的雪伊同志。"
LHS.15.a: "活过来再说吧"
LHS.16.t: "红果之海"
LHS.16.d: "雨雾黏在码头木桩上发酵出咸腥时，小果子正蹲在生锈的绞盘边数着弹孔，辫梢还系着用炮弹铜壳磨的小铃铛，一动就叮当响，像给这死气沉沉的渔港招魂。\n“又挨打了？”雪伊提着扳手从机修棚钻出来，油手印在工装裤上开出灰花。她顺手抛来个烤马铃薯，被小果子凌空叼住。\n“三艘！”小果子腮帮鼓起，含糊地指向海平面残留的黑烟，“殖民者的炮艇，跟赶鸭子似的掀翻咱们的运输船。”她喉咙吞咽着，忽然拽起雪伊往礁石堆跑。两个姑娘像野山羊般跳跃，水花溅湿了裤脚。\n褪潮的浅滩里躺满被炮弹犁过的渔船残骸。小果子跪在船板裂口处，指甲抠下一片黏糊的藻绿色油漆的火.\n她忽然抓起沙地里的半截船桨：“看见没？咱们造内河船像编花篮，海船却脆得像鸡蛋壳！”那截烂木头被她重重插进沙地，惊起几只沙蟹。\n雪伊擦亮火柴点了支皱巴巴的烟，把烟塞进小果子发颤的唇间：“说重点，小特务。”她知道这姑娘的佣兵档案里，藏着一堆横跨海域的偷渡记录。\n烟雾从海风里蛇形升起时，小果子掏出了个防水的油布包。摊开的军事地图被红蓝铅笔戳满小洞：“佣兵队的快艇……十二节以上的铁肋船体，吃水都很浅……”她沾着海水的指头划过图纸，“我们拆了走私犯的锅炉装在正经军舰上！再让我们的渔工学会用探鱼声呐找潜艇，海也得是我们的果园！”\n\n雪伊突然噗嗤一笑：“想拿渔船围猎铁甲舰？”她弹飞烟头，火点坠入浪中倏忽熄灭。\n\n“笨蛋！”小果子跳起来踩地图，“要造更大的！能撞碎她们炮艇的大铁鱼！”她冲着海平面残留的烟迹跺脚，“等着！等我的船队开到时——”尾音戛然而止。她从怀里摸出半块压扁的麦饼，恶狠狠掰开：“等她们泡咸水澡哭爹喊娘，请你吃真正的海鱼宴！”\n\n翌日晨光刺破海雾时，雪伊在车间角落发现张涂鸦：歪扭的军舰侧影旁，小果子用炭笔写满锅炉参数。她笑着把图纸钉上木板，掏出个铁罐，昨夜溜进殖民者仓库抠来的航海饼干正泛着黄油的香味。而礁石滩上，小果子赤脚坐在潮汐里，她在沙地上画的舰船草图正被浪花温柔吞噬，只留下她系在脚踝的铜铃铛，在咸涩的风里叮当作响。雪伊啃着从她那偷来的饼干，指腹摩挲图纸上干燥的墨迹，忽然舔了舔沾着盐粒的手指。"
LHS.16.a: "扬帆！"
LHS.17.t: "雪莺"
LHS.17.d: "雪伊舔掉嘴角的糖霜，俯身趴在铺满等高线图的桌案上，铅笔尖在敌我态势图之间来回游移。前线传回的泥污信笺字迹模糊，她却反复描摹着那几个关键的坐标点。\n己方精心布置的炮兵阵地，被敌人空中的铁鸟轻易啄成齑粉。焦灼爬上了她拧紧的眉心。\n这不是第一次了。战报里那些“低空掠过”、“精确投弹”、“我方无有效反击手段”的字眼，刺得她眼底发涩。她习惯性地想摸扳手，指尖碰到桌面才记起：这次她需要的不再是拧紧某个零件的力气，而是另一种更缙薄、更锐利的力量，一种能撕裂空气的力量。\n夜深时分，指挥部帐篷静得只闻火炉里炭火的微响。铅笔芯在粗糙的纸上激烈摩擦，勾勒出第一份大胆的草图：\n\n简洁的车间布局图——选址定在一片隐蔽的山谷缓坡。旁边密密麻麻罗列着几近贪婪的物资清单：最轻质的木材、最纯净的航空燃油、最敏锐的年轻人……每一个条目旁边都用不同颜色的笔画了圈圈叉叉，像小孩子定下的决心章。\n\n几天后，薄雾弥漫的清晨，一纸墨迹未干的正式文件飘落在指挥部那张伤痕累累的案头。文件抬头赫然写着《雪莺航空筹备令》，批准机关处盖着她那枚小巧而清晰的星形指挥印章。\n起草时的心头一热成了此刻油墨间清晰的痕迹。她盯着那“雪莺”二字，忽然想起某日掠过山野的一小群白色鸟影，轻盈迅疾。唇边不由自主向上提了一下，旋又被她正色压下。代号而已，重点在后面“航空”二字。她拿起命令书，指腹蹭了一下那新鲜的墨印，像触摸一只亟待振翅的雏鸟的绒毛。窗外天色渐亮，属于天空的战争序幕，在她笔下的“雪莺”二字中，悄然拉开了第一道缝隙。"
LHS.17.a: "尚未离巢的鸟翼在煽动"
LHS.18.t: "红薯"
LHS.18.d: "新发的制服刚染上油墨香，雪伊就踏进了村公所。她没碰账本，只把一筐炭条倒在光洁的水磨石地上。"喏，"脚尖轻踢散开的炭块，"谁家田亩数不对，谁家抚恤金没发，往这墙上写。"办事员盯着她刚钉上墙的松木板发怔，她却突然蹲下，捉住缩在墙角的小学徒的手，把最粗的炭条塞进孩子掌心："你娘领的种子袋，是不是比村东王家少半勺？"\n\n木板渐渐被歪扭的字迹爬满。当某个会计的名字第三次出现时，雪伊正剥着烤红薯，突然把滚烫的薯肉按进对方嘴里。"慌什么？"她舔掉指尖糖汁，眼睛却像淬火的刀尖钉住发抖的贪官，"让写字的和被告的当面对数——你数豆子，她们数良心。"月光爬上窗棂时，沾满炭灰的木板成了流动的告示栏，由老农们扛向下一个村庄。雪伊的影子被火把拉长在田埂上，衣兜里还揣着半块留给守夜人的红薯，微微发烫。"
LHS.18.a: "遭受苦难时，群众的眼睛必然是雪亮的"

LHS.19.t: "丰收的喜悦"
LHS.19.d: "晒谷场的风卷起新麦的碎屑，雪伊站在粮仓铁梯上核对最后一组数据，白色毛衣袖口沾着钢笔水渍。老会计突然把账簿拍在粮堆顶：“整整三万斤盈余！当年你说‘要让粮仓顶破天’，咱们都当是饿昏头的疯话...”她皱眉抽回账本，耳根却泛起不易察觉的绯色。\n缝纫厂女工们捧着亚麻布涌来。“您毛衣肘部磨薄了，”领班姑娘抖开月光般润泽的粉色布料，“大伙儿轮班织了件新的。”雪伊指尖抚过细密针脚，忽然揪住自己起球的旧衣下摆：“这件还能穿五年。”可姑娘们执意将新衣套在她身上，羊毛暖意裹住脖颈时，仓库深处传来敲击声——孩子们正把麦粒排成字：”大英雄雪伊“。\n\n“胡闹。”她扯下新衣丢进粮筐，转身走向河岸。夕照将白色毛衣染成蜜糖色，麦茬地里传来压低的笑语：“瞧见没？她偷摸捡了根最长的麦穗插在毛衣口袋里呢！”雪伊脚步一顿，从衣袋掏出麦穗掷向声音来处，金芒在空中划出流畅的弧线。河面倒影里，那件被珍重对待的旧毛衣袖口，一缕白线头正悄悄钩住一粒麦芒。"
LHS.19.a: "幸福不过如此"
LHS.20.t: "[FROM.GetName]邀请我们与其进入资源互助协会"
LHS.20.d: "同志们，仅仅是靠一国的独大是难以实现真正的社会主义的，哪怕资源再多也无济于事。\n因此，我们必须互相帮助，分享彼此之间的资源，才能共同迈向真正的共产主义社会。"
LHS.20.a: "这完全是件好事"
LHS.20.b: "我们不能做出承诺"
LHS.21.t: "南方的神秘来客？"
LHS.21.d: "那自称来自南美的使者，就在这温软的季节里突兀地出现。我们的部门收到通报时，只提及一位来访者：名字是雪伊，外貌，据说是个矮小、黑发披散、看着年纪甚轻的少女。当真实的身影由卫兵引进来时，大家都短暂地怔了怔，比传言更娇小，沉默得像个误入庭院的邻家女孩，瘦弱的双肩几乎被敞开的窗外垂落的一大枝叶子淹没。若非她眉宇间凝聚着某种不合年龄的沉静，几乎要疑心是通报有误。陌生的革命者？她稚气的外表与这头衔实在难以相称。\n\n“日安，尊敬的神社同志们，”少女开口，声音不高，却奇异地穿透了花瓣拂过窗台的簌簌声，“我叫雪伊。”目光环视我们一周，并无怯意，“我来，是为递上洛维尼亚公社伸出的枝。我们同样在追求人民福祉的道路上前行……独立的技术、宝贵的生产经验，以及建设新生活的智慧——都应当在彼此需要的人们之间共享、流动。”"
LHS.21.a: "共享？"
LHS.22.t: "脏雪糕"
LHS.22.d: "季风灌满制服裙摆，正慌忙按头发，却见那个黑发及肩的小个子已抱膝坐在堤坝上啃甜筒，外交文件随意压在手肘下。她背后晾晒的蓝白棉被铺满半条堤岸，海风一吹就如浪涌来，差点把我们刚飘起的头发裹进被角里。\n\n“晾霉味呐，”她忽然仰头，奶霜沾在鼻尖，“贵国会晒被子吗？我们这儿的军港条例第一条：每季须把船帆铺在沙滩暴晒六小时。”她拍净身边水泥台示意我们坐下，“发霉的旗帜和霉变的信任一样，得靠太阳杀菌。”\n\n远处孩童尖叫着追逐滚落的甜筒蛋卷，她起身三两步截住，把沾沙的蛋卷掰成两截，带奶油那段塞进哭泣的孩子手心。“看，”耳语随海鸥翅膀拂过我们耳畔，“能让俩小东西分吃脏雪糕的主义，总坏不到哪去。”阳光透过被单缝隙落在她肩章，碎金跳动如融化的焦糖。"
LHS.22.a: "她来自南美洲？"
LHS.23.t: "南美洲来了个小同志"
LHS.23.d: "莫斯科的空气里有雪沫的味道。我们握着外交使团厚实的手掌时，瞥见了后头跟着个黑发的影子。约莫二十出头的姑娘，裹在灰呢大衣里像只矮墩墩的麻雀，头顶还翘着一根不服管的头发。\n“这是我们的小同志。”带队的同志笑着推她上前。姑娘突然从兜里掏出油纸包，直愣愣往我们掌心里塞。剥开是四块压碎的糖，糖霜沾在她冻红的指尖上。\n“自己炒的。”她声音比个头更细，眼睛却亮得灼人，“省了三个月的糖票呢。”我们剥开糖纸咔嚓一咬，焦香混着冰碴子在齿间迸开。那个总皱眉的老布尔什维克忽然笑了，掏出珍藏在怀的古巴雪茄盒，郑重地分给她半根。\n甜味儿弥散在喉咙里的时候，窗外的克里姆林宫正被薄雪覆盖。姑娘踮着脚把雪茄架在耳朵上，活像长了根滑稽的黑色犄角。我们知道，苦日子里种出的甜最值得分享了。"
LHS.23.a: "看来南美洲也有了不少同志呢"
LHS.27.t: "分享甜点"
LHS.27.d: "厨房的玻璃窗蒙着层白雾，我们揉着面团抬头时，正撞见那团黑发从门框探进来。她鼻尖冻得通红，怀里抱着个粗陶瓮，像揣着颗晒暖的土豆：“听说你们烤甜饼给孩子们？”\n\n瓮盖掀开时，甜香裹着玉米叶的青气涌出来。她踮脚要帮忙，袖口扫过我们手背，痒得人缩了下：“这是我母亲教的甜玉米粽，用新收的黄玉米磨的浆。”我们教她搓玉米团，她的手指总沾着浆，像捧了把碎金，却把每团都按得圆滚滚。\n\n蒸笼“咕嘟”冒气时，她忽然凑近，发梢扫过我们耳垂：“你们的甜饼，和我家乡的玉米粽很像。”\n\n我们掰了半块热乎的递过去，她咬下去，眼睛弯成月牙：“更软些。”\n\n“下次，”我们用围裙角擦她沾浆的手指，“带你的玉米浆来。我们一起蒸，让更多孩子尝到。”\n\n她用力点头，发顶翘起的呆毛晃了晃：“好呀。不过……能叫上大家一起吗？我想学做你们的列巴，也想让她们尝尝我的玉米粽。”\n\n我们望着她发亮的眼睛，忽然想起桌角那份草案。\n\n“好。”我们捏了捏她冻红的耳垂，“等你带玉米浆来，我们就把桌子摆得更宽些。”"
LHS.27.a: "同志之间要相互分享"
LHS.28.t: "意想不到的来客"
LHS.28.d: "窑前的槐树下飘着炊烟，我们蹲在石凳上补军鞋，忽闻马蹄声碎。转脸便见个黑发姑娘，裹着褪了色的毛衫，怀里抱着个粗布包，发梢沾着草屑，像只急着啄米的雀儿。\n\n“同志！”她喘着气，布包往石桌上一放，“我从洛维尼亚带了点东西。”手指抠开布结，滚出三支油布裹着的步枪，枪托上还刻着歪歪扭扭的花纹，“我们自己打的，可能不太利索，但子弹和枪都管够！”\n\n我们捡起一支端详，木柄磨得发亮。她搓着冻红的手解释：“我叫雪伊，是南美公社那边来的。”话音未落，远处传来孩子们的笑，是隔壁嬉戏的娃跑过来，扒着她裤脚要糖。她愣了愣，从衣袋摸出把樱桃，“就剩这些，甜的。”\n\n我们摘了颗塞嘴里，樱桃香混着草木从里的酸甜味。山风掀起她的衣角，露出里面缝着的补丁，倒和我们军装上的针脚像得很。\n\n“这些枪，我们收了。”我们拍拍她手背，“等打完仗，教你种南瓜。咱们的地儿，瓜秧子爬得比枪杆子还高。”\n她眼睛亮起来，发顶翘起的呆毛晃了晃：“说话算话？”\n“算话。”我们指了指窑里挂的地图，“等你下次来，这儿要添好多新标记——都是和同志们一起打下来的。”\n\n她用力点头，粗布包敞在石桌上，步枪闪着朴素的光，像几截晒暖的树根。”"
LHS.28.a: "她是从洛维尼亚过来的？"
LHS.29.t: "南风带来的春天"
LHS.29.d: "天安门的红灯笼还挂着，胡同口的老槐树上拴着串红绸子。我们蹲在青石板上剥糖炒栗子，忽闻一阵混合着柑橘香的南风，雪伊抱着个花布包裹站在影壁前，发梢还沾着点没掸净的海盐。\n“北京的糖炒栗子，比我们那儿的火山岩烤栗子甜。”她把包裹搁在石桌上，解开三层蓝布，露出叠得方方正正的彩色织毯，“织金线的，我阿婆说，像你们国旗的颜色。”毯子摊开，是红、金的条纹，针脚密得像星子。\n\n隔壁王婶端来碗热豆浆，雪伊捧起来吹了吹，突然从兜里摸出把晒干的酸角：“给你们尝尝，我翻了好几座山采的，泡水喝能解腻。”孩子们围过来，攥着酸角跑远时，她悄悄拽我们袖子：“能教我写‘中国’二字吗？我要在织毯背面绣上。”\n\n风掀起她的衣角，露出里面别着的红布徽章，是开国大典那天我们在城楼上发的纪念章。我们指着她发顶翘起的呆毛笑：“先学会系中国结吧，你这头发，扎个小辫儿肯定精神。”\n\n她抿着嘴点头，织毯角沾了点栗子壳的金粉，在夕阳里闪，像撒了把星星。”"
LHS.29.a: "明年她会带火山岩烤栗子过来吗"
LHS.baicheng.t: "白城陷落"
LHS.baicheng.d: "“无线电在午夜彻底静默。\n\n清晨的侦察照片显示白城城墙布满裂痕。街道上没有活人移动。只有排列整齐的身影站在广场，面朝南方。\n\n侦察队带回最后的消息：防线的士兵突然停止射击。她们放下武器，排着队走进敌军阵地。老人和孩子跟在后面，没人反抗。\n\n一天后，第一支队伍出现在地平线上。她们保持生前的衣着，但步伐精确一致。白城的面包师傅走在最前面，手里还握着没送出的面包。当风吹开她的围裙，我们看到胸腔里空无一物。\n\n她们沉默地前进。没有呼吸，没有疲惫。”"
LHS.baicheng.a: "不...."
LHS.24.t: "[From.GetName]要求归还租界"
LHS.24.d: "南美近几年的变化使得[From.GetLeader]变得愈加膨胀，她们竟然将目光又一次放到了我们的殖民地上面，企图收回我们在南美大陆的利益，"
LHS.24.a: "殖民地承受不起与南美人的战争" 
LHS.24.b: "伟大的殖民地永不低头！" 
LHS.25.t: "租界回归"
LHS.25.d: "我们的强大令西方殖民者感到惧怕，[From.GetName]完整归还了所有租界以求于我们的和平"
LHS.25.a: "值得纪念的日子" 
LHS.26.t: "[From.GetName]拒绝归还"
LHS.26.d: "西方的殖民老爷们依旧如百年前一样丑恶，她们拒绝归还我们的领土，并做好了于我们决一死战的准备"
LHS.26.a: "找死！"
LHS.1122.t: "[FROM.GetName]想要和我们团结在一起"
LHS.1122.d: "[FROM.GetName]提议所有美洲的社会主义国家团结起来，互相帮助、共同进步、让鲜艳的红旗在全世界飘荡!"
LHS.1122.a: "团结的人民永远不会被击溃"
LHS.1122_tt: "这意味着我们将获得共同的民族精神，并彼此分享§t10%§!的工厂。"
LHS.1122.b: "[FROM.GetName]是不是傻了..."
LHS.1123.t: "[FROM.GetName]的回复"
LHS.1123.d1: "[FROM.GetName]是我们最友好的同志，在接到我们的通讯后，[FROM.GetName]很快表示愿意加入人民团结阵线。"
LHS.1123.d2: "[FROM.GetName]并不愿意加入我们，[FROM.GetName]对于世界革命充斥着消极的情绪，不愿意和我们合作。我们没有其他办法，但是，革命事业是必须要实现的！"
LHS.1123.a1: "我们团结一致！"
LHS.1123.a2: "可惜。"
LHS.1133.t: "[FROM.GetName]想要和我们一起发动世界革命"
LHS.1133.d: "[FROM.GetName]提议全世界的社会主义国家团结起来，互相帮助、共同进步、让鲜艳的红旗在全世界飘荡!"
LHS.1133.a: "全世界无产者联合起来！"

LHS.1133.b: "[FROM.GetName]是不是傻了..."
