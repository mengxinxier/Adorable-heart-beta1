LHS.33.t:0"我们的士兵投靠了[FROM.GetName]！"
LHS.33.d:0"据军营报告，近期我们的一些部队投靠了[FROM.GetName]，并窃取了我们的部分武器装备。毫无疑问的是，这一切的幕后黑手又是该死的赤匪。"
LHS.33.a:0"这对我们来说无关紧要" 
LHS.36.t:0"我们的民众发起了暴乱"
LHS.36.d:0"我们的民众在洛维尼亚公社的不断煽动下发起了各种暴乱，对我们的治安造成了严重的影响。"
LHS.36.a:0"把闹事的全喂给那些亡灵去"  
LHS.34.t:0"王室士兵投诚！"
LHS.34.d:0"一些王室的士兵在我们的鼓动之下认清了瓦伦蒂娜的嘴脸，已经弃暗投明，向我军投诚。"
LHS.34.a:0"好极了" 
LHS.37.t:0"王室政府受到了来自当地民众的剧烈抗议"
LHS.37.d:0"一些王室当地民众在听闻了王室的恶行之后十分愤怒，在当地组织了大规模的游行对瓦伦提娜的统治发起抗议。"
LHS.37.a:0"好极了" 
LHS.35.t:0"我们失败了"
LHS.35.d:0"王室的人民早已被瓦伦蒂娜蒙骗至深，对我们的宣传视若无睹。"
LHS.35.a:0"她们会明白的"  
###意识形态###
popular_front_subtype: "人民阵线"
popular_front_subtype_desc: "§P人民阵线§!\n\n\n\n\n£GFX_popular_front_subtype_bg\n\n\n\n\n没有哪种意识形态比“人民阵线”更能阐明这句话了。人民阵线通常涵盖了极为广泛的左翼意识形态，从强硬激进的革新人士到民主自由主义者无所不包。尽管十分罕见，但在极端情况下，人民阵线还会吸纳保守派。这种临时的合作往往是在现状发生剧变或者出现可能诱发剧变的威胁时形成的，在此条件下，反对派会搁置分歧，通过选举、武装冲突以及其他方式加以抗衡。\n“人民阵线”这一概念的应用同其构成一样宽泛。阵线通常首先要找到一些最起码的理由，一般是各种各样的道德理由，来反对长期存在、或者是新出现的威胁。又或者，存在相同的方针或意识形态将偏向革新主义或自由主义的人民阵线粘合在一起。而后，人民阵线的方针就是团结一致——无论是投票时保持一致，还是在直接行动、街头冲突中相互支持。\n“人民阵线”的应用过于广泛，导致它很难被准确定义。就其本身，它可能根本无法被视作一种意识形态，而更像是政党和政党集团推进其意识形态主张的行动策略。"
####新闻####
LHS_news_event_background: "£LHS_news"
LHS_news.1.t: "$news_event_background$洛维尼亚的黎明"
LHS_news.1.d: "黎明前，洛维尼亚公社临时指挥部外，晓枫借马灯光核对地图。雪伊站在一旁，脸色苍白，手指残留消毒水味，眼神紧随着晓枫。“都安排好了？”晓枫没抬头。\n“嗯。药品…只够三天。”雪伊声音微颤，“重伤员通道的加固…可能已经来不及了。”\n晓枫合上地图，抬头。灯光映出她眼中雪伊强忍的忧虑。她走近，指腹轻拂去雪伊颊边一点灰土。“怕了？”声音沙哑却稳。\n雪伊垂眼，盯着药渍指尖：“…怕来不及，怕…不够。”\n晓枫侧身，指向远处营地的灯火：医院帐篷、分发点、工兵叮当加固的掩体。“你看，”她声音轻却清晰，“她们在动。每个人都在动…知道为什么吗？”雪伊不解。\n晓枫嘴角缓慢弯起，沉重中撬开一丝光亮：“因为明天太阳会照常升起，而我们，要活着看到它。还要让更多人看到它。”\n她的手轻落雪伊肩头，传递稳定：“所以，雪伊，等会儿出发…”她声音柔和却恳切，“替我、替那些等着你救治的伤员、也替你自己…笑一下。好吗？”\n她喉头哽了一下，避开晓枫的目光，声音低得几乎被蒸汽的嘶鸣淹没：“我…我笑不出来。” 她的视线再次落回自己沾着药渍,那沉甸甸的重量，压得她连牵动嘴角的力气都没有。“我怕…怕我笑了，反而辜负了她们现在的痛，辜负了那些…可能等不到明天太阳的人。” \n晓枫凝视着雪伊低垂的、写满沉重却异常诚实的侧脸。她放在雪伊肩头的手没有收回，反而轻轻捏了捏。那无声的动作里，没有责备，只有更深的理解和托付。\n\n“那就背着这份痛楚，再让我们紧跟着你出发。”"
LHS_news.1.a: "太阳要在南美洲再次升起了"
LHS_news.1.b: "又是一群叛匪"
LHS_news.2.t: "$news_event_background$亡灵在洛维尼亚再次复苏"
