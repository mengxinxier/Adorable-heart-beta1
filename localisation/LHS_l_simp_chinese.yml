LHS_Return_To_Deep_Blue:0 "让海鸥飞回浪尖"
LHS_Return_To_Deep_Blue_desc:0 "“我昨儿路过港口，瞧见小果子那丫头正对着那只生锈的船锚发呆呢。她虽然穿着陆军的制服，但这嘴唇上，分明还噙着一股子洗不掉的海盐味儿。”\n\n“既然家门口已经安稳了，既然咱们的骨头已经硬到了天上去……那就让这孩子回海里去吧。她天生就该在那片最野、最狂的浪尖上掌舵。那里有她的星星，有她的风，还有咱们红泥公社最新的一批钢铁战舰。”\n\n“去吧，把那身泥腥味儿洗了，换回你最爱的蓝白领子。在这片属于咱们自己的大海上，你尽管撒欢儿地开，谁敢挡道，就给我咬碎了沉海里去。”"
LHS_Return_To_Deep_Blue_tt:0 "§2【航向变更】：§9小果子§!放下了陆军的指挥权，重新执掌红泥海军。§!"

LHS_Return_To_Red_Earth:0 "让海鸥落回红泥地"
LHS_Return_To_Red_Earth_desc:0 "“刚把船靠稳，这小海鸥就眼巴巴地盯着岸上的坦克瞧个没完。她说海上的风固然清爽，她却执意寻找踩在红土地上的那份踏实感。既然她留恋这股子泥腥味，向往跟雪伊她们在大太阳底下并肩流汗的滋味，那就随她的性子。脱掉那身漂亮的白制服，换回咱们耐造的旧军装，把皮靴扎得紧紧的。这一脚踩进泥里，定要溅起半人高的红泥才算痛快。大地的脉搏，正等着她去合拍呢。”"

LHS_Return_To_Red_Earth_tt:0 "§t【航向变更】：§9小果子§!再次扎根赤土，接管公社的铁流。§!"
LHS_Return_To_Red_Earth2_tt:0 "§t【航向变更】：§9小果子§!现在可以担任陆军将领了。§!"




