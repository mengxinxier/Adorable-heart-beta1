PAM_royal_co_op:0 "妥协的王室"
PAM_royal_co_op_desc:0 "看着那群喷着香水的老东西在我面前瑟瑟发抖，真是一种享受。\n他们以为向我下跪是政治投机？是为了躲避那些喊着要挂路灯的赤色疯子？错，大错特错。\n我留下他们的狗命，不是因为我需要他们的忠诚——那种东西比烂泥还不值钱。我留下他们，仅仅是因为这群肥猪肚子里还没榨干的油水，还有他们手里那些我看不懂的账本。\n只要他们还能像只会下金蛋的鸡一样，乖乖地把钱吐出来给我造大炮，我就允许他们在我的猪圈里再多哼哼几天。但记住了，狼群不养闲人。哪天若是吐不出金子了……那就直接扔进锅里，给我的孩子们加个餐。"
PAM_Flesh_golem:0 "血肉傀儡"
PAM_Flesh_golem_desc:0 "别用那种看怪物的眼神盯着它们。在我眼里，这只是一笔最划算的买卖。\n活人是要吃饭的，是要穿衣的，受伤了是会疼得大叫的。我的狼崽子们也是血肉做的，凭什么让她们去顶敌人的第一轮机枪？但这些东西？它们不需要面包，不需要军饷，更不需要抚恤金。把那些战场上没人要的烂肉缝起来，再塞进一点莉莉那边的魔法，它们就是最完美的肉盾。\n让它们冲在前面吃子弹，我的狼崽子们就能在后面少流点血，多吃口肉。这笔账，傻子都会算。\n呃……至于材料不够了怎么办？\n去对面“借”点。反正死人留着那一身肉也没用，不如贡献出来，替活人挡两枪。"
PAU_borderless_army:0 "无国界之军"
PAU_borderless_army_desc:0 "我们没有祖国，战场就是我们的故乡。契约是我们的信条，黄金是我们的旗帜。长久以来，我们作为南美大陆上最精锐的职业武装，为出价最高者献上胜利。莉兰迪亚王室曾是我们的雇主，镇压那些所谓的“赤匪”，是我们冰冷任务清单上的一行。\n直到老军团长的出现。她从那些衣衫褴褛的革命者眼中，看到了比黄金更耀眼的东西。她开始质疑，我们这支最锋利的剑，是否应该永远只为腐朽的王权服务。她秘密地向我们中的一些人——包括她最器重的参谋晓枫——描绘了另一幅蓝图：一支为人民而战的、真正荣耀的军队。\n那一刻，许多人心中那早已被金钱和硝烟掩盖的火焰，被重新点燃了。我们以为，我们即将迎来新生。\n\n然后……§R老军团长……消失了。§!\n在随之而来的混乱与猜忌中，军团内部务实的声音压倒了一切。她们说，理想主义的狂热已经结束，我们必须回归“现实”。于是，我们将枪口，对准了昨天还与我们分享最后一根香烟的同志。在莉兰迪亚，在艾瑞波拉，我们亲手将那刚刚燃起的革命火焰，重新踩入血泊之中。\n如今，我们重归旧主麾下，但信任的链条一旦断裂，便再也无法复原。王室利用我们，也提防我们。而我们，则像一群背负着双重背叛的幽灵，在昔日战友的尸骸上执行着新的契约。鹰徽依旧闪亮，但许多人的眼神，却永远留在了那片被我们亲手制造的废墟里。我们是谁？是忠于契约的无情利刃，还是……一群迷失在理想与现实之间的亡魂？"
LHS_Commune_Red_Army:0 "公社红军"
LHS_Commune_Red_Army_desc:0 "我们的军队，诞生于1934年莉兰迪亚工业区的废墟之上。我们的第一批战士，是那场大屠杀的幸存者，是烈士的子女，是每一个亲眼见过“军团”的鹰徽，如何在同胞的血泊中闪耀的人。那道伤疤，刻在我们每一个人的灵魂深处。\n如今，我们听说，那支曾经碾碎我们的钢铁巨兽，内部分裂了。一支由前军团参谋长领导的部队，自称为“野火”，在卡卡罗姆山区举起了反叛的旗帜。\n我们听到了她们的口号，也看到了她们与昔日同袍的厮杀。但信任，不能仅靠这点来建立。我们永远无法忘记，1934年的炮火，曾来自于整个军团。我们必须警惕，这究竟是一场真正的决裂，还是一场旨在迷惑我们的苦肉计。\n因此，我们将保持审慎的观望。我们的首要敌人，永远是盘踞在王都的索拉娜，以及那些至今仍在为她效命的、双手沾满鲜血的军团刽子手。至于“野火”……我们将用最严苛的目光，去观察她们的行动。\n她们的枪口，究竟是指向人民，还是指向真正的压迫者？时间，会给出唯一的答案。"
LHS_walks_alone:0 "§R禹禹独行§!"
LHS_walks_alone_desc:0 "瓦尔哈拉社§R战败了......§!。\n但这不会是§R结束§!！她们的遗志将由我们§R继承§!！\n如果南美洲的国际共运的烈焰注定熄灭，那么至少，就让莉兰迪亚公社，成为§R最后的薪柴！§!"


LHS_start_game_text: "§t直至太阳升起§!"

LHS_his_page_01_title: "折翼的鹰徽"
LHS_Country_History_Page_01: "在南美洲这片被咖啡香与血腥味浸透的土地上，莉兰迪亚王室的统治依赖于一支名为“军团”的铁拳。这支部队由前帝国最精锐的士兵与战术家组成，以其冷酷而高效的执行力而闻名，是王室用以碾碎一切反抗声音的利剑。她们的鹰徽，是这片土地上所有反抗者心中挥之不去的噩梦。1934年，正是这支军团，以压倒性的力量血腥镇压了雪伊领导的“莉兰迪亚工人起义”，将那场革命的火苗无情地踩灭在工业区的废墟之中。然而，这场屠杀式的胜利，却在军团内部埋下了分裂的种子。思想开明的老军团长，以及她最为器重的年轻参谋晓枫，亲眼目睹了军团的炮火如何对准手无寸铁的同胞。这场胜利的残酷与不义，深深烙印在她们的心中，动摇了她们曾经的忠诚。在接下来的时间里，老军团长开始秘密联络军中尚存良知的同袍，试图为这支迷失方向的武装力量寻找新的出路。然而，就在她们的计划即将成形之际，王室的秘密警察嗅到了背叛的气息。1935年，一场精心策划的“意外”，夺走了老军团长的生命。王室以为，除掉了首脑便能瓦解叛乱。但她们错了。老军团长的死，成为了点燃火药桶的最后一颗火星。晓枫继承了导师的遗志，毅然将计划提前，发动了震惊王国的兵变。她率领着一部分觉醒的官兵，在付出惨重代价后，杀出重围，退入了卡卡罗姆山区。从那一刻起，她们抛弃了旧的名号与沾满同胞鲜血的鹰徽。她们为自己取了一个全新的名字——“野火革命军”。如今，这支由前“屠夫”组成的革命武装，正被她们昔日的战友——依然忠于王室的军团主力，作为头号叛徒，进行着不死不休的围剿。南美的革命星火，以一种最具讽刺意味的方式，从最不可能的地方，重新燃起。"

LHS_his_page_02_title: "艾瑞波拉的血路"
LHS_Country_History_Page_02:"在背叛的阴影与屠杀的烈火中，并非所有人都选择了屈服。时任“野火”军团参谋长的晓枫，这位在贫民窟长大、亲眼目睹过王室暴行的年轻的战术天才，在清洗开始的最后一刻，做出了一个足以改变历史的决定。她联络了军中尚存良知的旧部，以及那些忠于老军团长革命理想的战士，毅然发动兵变。最后十支步兵联队，在她的号召下，于艾瑞波拉城那条狭窄而陡峭的山谷隘口，打响了反抗的第一枪。她们面对的是三倍于己的、由昔日战友组成的王室镇压部队。这是一场注定载入史册的惨烈战斗。晓枫指挥着起义部队，用血肉之躯死死顶住了精锐装甲部队的轮番冲锋。战斗进行到最危急的时刻，晓枫做出了一个疯狂而大胆的决定。她集结了起义军手中仅有的寥寥几门老式野战炮，放弃了所有常规炮击目标，将炮口对准了峡谷两侧脆弱的岩壁。震耳欲聋的炮火引发了剧烈的山崩，滚落的巨石如瀑布般倾泻而下，彻底扼住了艾瑞波拉的咽喉，也为数千名被追捕的工人、学生和赤卫队残部，撕开了一条通往卡卡罗姆山脉的、唯一的生路。"

LHS_his_page_03_title: "矿井下的火种"
LHS_Country_History_Page_03:"卡卡罗姆山脉，这里曾是帝国流放犯人的地方，如今，却成为了革命最后的避难所。退入这片绝地的起义者们，在废弃的矿井深处找到了临时的栖身之地。空气里弥漫着潮湿的霉味和绝望的气息，但比这更浓烈的，是复仇的怒火与不屈的意志。在这里，晓枫召集了所有幸存的战士和群众。在一盏昏黄的矿灯下，她摘下了自己臂章上那枚沾着血污的、属于旧军团的鹰徽标记，将其与老军团长生前佩戴的一枚简陋的镰锤皮带扣，并排挂在了一根支撑矿道的粗大枕木上。“从今天起，我们不再是任何人的雇佣兵，我们只为自己，为所有被压迫的人民而战！”在无数双被矿灯照亮的、闪烁着火焰的眼睛注视下，“野火革命军”正式宣告成立。卡卡罗姆的矿井，成为了这支新生革命队伍的摇篮与熔炉。然而，挑战才刚刚开始——王室已将“野火”军团的残部收编为“剿匪特遣队”，正摩拳擦掌，准备对这群躲在“老鼠洞”里的叛军，发动下一次致命的围剿。而矿井中仅存的粮食，只够维持数月之久。革命的火种能否熬过这个寒冬，无人知晓。"

LHS_Local_History_Title: "§Y南美§!地区"
LHS_loca_his_t_01: "公社的雏形"
LHS_loca_his_t_02: "腐朽的王冠"
LHS_loca_his_t_03: "破碎的宝石"

LHS_Local_History_Page_01: "在卡卡罗姆山脉的阴影之外，莉兰迪亚的平原与城市，是另一片燃烧着不同火焰的战场。这里的革命，爆发于工厂高炉的火光与码头工人的怒吼之中。雪伊，这个名字在工人群体中，早已不是一个传说，而是一道刻在王室心脏上的伤疤。早在1934年的“莉兰迪亚工人起义”中，她就曾领导着数万工人，发动了震惊全国的总罢工，并一度武装夺取了王国最重要的工业区。在那些燃烧的七十二小时里，王室的经济命脉被彻底切断，这是腐朽的统治阶级第一次尝到来自人民的、钢铁般的还击。然而，这次起义也让革命者们付出了血的代价。王室的爪牙——被称为“军团”的私人武装，对工业区进行了毁灭性的反扑。在巷战中，缺乏重武器和统一指挥的工人们虽然英勇，却终究不敌装备精良的正规军。起义被血腥镇压，街道被染成红色，无数优秀的同志倒在了黎明之前。惨痛的失败，并未浇灭火焰，反而将其淬炼得更加坚韧。在那之后的一夜，雪伊召集了所有幸存的骨干，在一间废弃的教堂地下室里，她们没有祈祷，而是用那场战斗的鲜血盟誓。她们宣布成立“南美工人联合会”，一个比以往任何时候都更严密、更坚定的地下组织。她们的目标，不再仅仅是活下去和反抗，而是要积蓄力量，以彼之道还施彼身。她们的武器，是藏在面粉袋里的传单，是夜间被精准爆破的铁轨，更是那份在烈火中淬炼出的、绝不妥协的革命意志。她们的力量潜藏在城市的阴影之下，顽强地侵蚀着王室的根基。她们深知，下一次从黑暗中亮出的利剑，必将一击致命。"

LHS_Local_History_Page_02: "莉兰迪亚王室，一个早已烂到根里的名号。她们的祖先曾是这片大陆的征服者，而如今，她们只是寄生在这片土地上的巨大毒瘤。她们的宫殿用黄金装饰，她们的晚宴挥霍无度，而这一切都建立在对人民敲骨吸髓般的剥削之上。对于王室而言，人民只是数字，是维持她们奢华生活的燃料。现任的统治者，索拉娜，这个名字本身就带着一股不祥的气息。在登上莉兰迪亚王座之前，她曾是邻国“夜莺之国”的统治者之一——一个以神秘的亡灵魔法和残酷统治而闻名的国度。没有人知道她是如何，又为何放弃了那个死亡的国度，来到了莉兰迪亚。但她带来了“夜莺之国”的作风：冷酷、高效，以及对生命毫无敬畏的漠视。在索拉娜的统治下，莉兰迪亚的压迫变本加厉，她用最残酷的手段镇压着一切反抗的声音。更令人不寒而栗的是，有传言称，她正秘密地与她过去的国度进行着某种可怕的交易，试图将亡灵的力量，引入到这片生者的土地上。王室的王冠，如今已沾满了活人的鲜血与死者的气息。"

LHS_Local_History_Page_03: "在这片混乱的大陆上，还存在着一股游离于所有政治势力之外的力量——魔法少女联盟。她们曾是希望与奇迹的象征，每一个成员都曾为了某个纯粹的愿望，与神秘的生物签订契约，获得了超越凡人的力量。她们游走于城市与乡野，对抗着名为“魔女”的、由绝望化成的怪物，默默守护着这个世界。然而，当人类自身的矛盾激化到极致时，这群守护者发现自己陷入了前所未有的迷茫。王室将她们视为可以拉拢或利用的强大“武器”，试图用金钱和地位诱惑她们；而底层的革命者，则对她们这种超然的、不介入凡间纷争的姿态抱持着深深的不信任。联盟内部也因此产生了巨大的分歧。一部分魔法少女认为，她们的职责仅限于对抗魔女，不应卷入人类的战争；另一部分则认为，当人类的暴政本身就在制造着比魔女更深沉的绝望时，她们无法再袖手旁观。更糟糕的是，一些魔法少女在无尽的战斗中，灵魂宝石逐渐被污染，心智受到侵蚀，变得偏激而危险。这个曾经团结的联盟，如今已是裂痕遍布。她们像一颗颗美丽的、却濒临破碎的宝石，在时代的洪流中，不知该去向何方，最终又将折射出怎样的光芒。"

LHS_route_guide_desc: "§R野火革命军§!路线指南\n注：§O还没有做在战胜军团之前优先解决莉兰迪亚的路线，所以最好不要那么做！§!\n\n同志，想知道怎么走出不同的革命道路吗？看这里！\n\n一、§Y雪伊个人线（种田路线）§!\n\n在§Y1936年11月14日§!§G之前§!，战胜“§t@PAU军团§!”。\n\n说明：这是一条比较考验操作的“速通”路线。如果你动作够快，在前期就猛猛点政治线国策，然后一路平推“军团”，那么在后续的剧情中，晓枫将会为了掩护大部队而英勇牺牲，之后将由雪伊一人扛起革命的大旗。§L（代价是沉重的，同志，请三思！）§!\n\n二、§G晓枫与雪伊双人线（世界革命）§!\n\n在§G1936年11月13日§!§t之后§!，战胜“§t@PAU军团§!”。\n\n说明：稳扎稳打，慢慢积蓄力量，不用急着和军团决一死战。只要把和军团的最终的决战往后稍微拖一会，两位好同志就能并肩作战，一起迎来最终的胜利！§L（对于第一次玩的同志来说，这是最稳妥的选择，可以体验到比较完整的剧情！）§!\n\n三、§9小果子线(幸存者)§!\n\n在§91937年1月14日§!§t之后§!，战胜“§t@PAU军团§!”。\n\n说明: 这是一条……截然不同的道路。如果你因为种种原因，错过了所有最好的战机，将战争拖入了最绝望的泥潭……那么，你将亲眼目睹那场……吞噬一切的灾难。在这条路线上，你将扮演唯一的幸存者，背负着所有人的遗志，从世界的尽头，开始一场孤独而漫长的、关于赎罪与希望的旅程。§L（这是一条充满悲剧的路线，推荐给已经熟悉游戏、并想体验一个……更深刻故事的同志。）§!"
LHS_tishi_tt: "注：§O还没有做在战胜军团之前优先解决莉兰迪亚的路线，所以最好不要那么做！§!"

