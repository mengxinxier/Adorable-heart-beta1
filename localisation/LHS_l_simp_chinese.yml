LHS_luhuoweiji: "我们的生存危机"
LHS_luhuoweiji_desc: "卡卡罗姆的寒风像裹着冰碴的鞭子，抽打着蜷缩在矿洞深处的革命军。\n粮袋彻底空了，最后几块掺着木屑的黑面包渣，在冻僵的手指间碎成粉末。绷带早已用尽，伤口在冰冷的空气中渗出黏腻的液体，散发出绝望的气息。\n洞口覆盖的伪装网外，敌人巡逻队的皮靴声和军犬压抑的低吠，如同收紧的铁索，死死勒在每个人的咽喉上。"
