LHS_xjzz2: "游击行军准则"
LHS_xjzz2_desc: "如何对待游击队活动区域内的人民是游击战术的一个重要部分。如何对待敌人也很重要。在进攻的时候，定下的准则必须要不折不扣地执行，对于所有诸如告密和暗杀等可耻行径要严惩不贷，而对那些为了履行她们的军事职责——或以为她们是在履行职责——而投入战斗的敌方士兵则务必要展现最大可能的仁慈。"
LHS_xjzz3: "游击行军准则"
LHS_xjzz3_desc: "如何对待游击队活动区域内的人民是游击战术的一个重要部分。如何对待敌人也很重要。在进攻的时候，定下的准则必须要不折不扣地执行，对于所有诸如告密和暗杀等可耻行径要严惩不贷，而对那些为了履行她们的军事职责——或以为她们是在履行职责——而投入战斗的敌方士兵则务必要展现最大可能的仁慈。"
LHS_pohuai2: "破坏行动"
LHS_pohuai2_desc: "破坏行动是非常重要的。在破坏和恐怖主义之间必须要作出明确的区分，前者是一种革命的和富有效率的战术手段，而后者一般而言并不奏效，对其结果也不加选择，它往往使无辜的人民成为牺牲品，而且它所毁灭的许多生命对于革命来说是很有价值的。"
LHS_pohuai3: "破坏行动"
LHS_pohuai3_desc: "破坏行动是非常重要的。在破坏和恐怖主义之间必须要作出明确的区分，前者是一种革命的和富有效率的战术手段，而后者一般而言并不奏效，对其结果也不加选择，它往往使无辜的人民成为牺牲品，而且它所毁灭的许多生命对于革命来说是很有价值的。"
