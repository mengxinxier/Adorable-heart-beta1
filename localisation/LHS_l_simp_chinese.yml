 LHS_kapok_economic_miracle:0 "§O木棉的红泥账本§!"
 LHS_kapok_economic_miracle_desc:0 "“搬个马扎坐下。咱们这红泥地上的日子，全凭这四本账撑着：”\n§Y 【基建指数】§!§W：§![?kapok_infrastructure|Y0]\n“铺桥修路打地基。每攒下 §G1§! 点基建，盖房速度和地皮槽位双双拉升 §G0.2%§!，前线送干粮的路上损耗也跟着削减 §G0.2%§!。大路通畅，国家的血脉就彻底活了。”\n§Y 【福利指数】§!§W：§![?kapok_welfare|Y0]\n“给乡亲们的碗里添肉。每攒 §G1§! 点福利，固然要多占 §R0.2%§! 的消费品，但换来的是人民的期望（顺从度）上升 §G0.005%§!，\n人心稳固度攀升 §G0.2%§!，\n车间出活儿的提速也能拔高 §G0.3%§!。吃饱肚子，抡起铁锤才带劲。”\n§Y 【教育指数】§!§W：§![?kapok_education|Y0]\n“教娃娃们拨算盘。每攒 §G1§! 点教育，搞研究的速度加快 §G0.3%§!，机器的产能顶峰拔高 §G0.2%§!。脑子灵光，废铁疙瘩照样能开出花。”\n§Y 【产业指数】§!§W：§![?kapok_industry|Y0]\n“扎实的铁炉子。每攒 §G1§! 点产业，厂里的纯产出增加 §G0.3%§!，切换流水线时留住的熟练手艺提升 §G0.5%§!。这全是咱们挺直腰杆的硬通货。”\n§R【当前工厂差额】§!§W：§![?kapok_balance_penalty|Y0] 座\n“最后这条，大伙儿死死刻在骨头里。咱们手里§G‘造子弹的军工’§!和§Y‘做面包的民工’§!，数量务必齐头并进！这碗水端得越平，老天爷赏的红利就越厚。两边数量完全相等时，咱们每日额外斩获 §G0.6§! 政治点数，附带高达 §G20%§! 的建厂加速！此后差额每拉开一座，这碗热汤就跟着洒掉一勺。直到这道裂纹扩至 §R20§! 座，这份犒赏便彻底化作灰烬。两条腿保持一般长短，咱们奔向好日子的脚步才生风。”"
