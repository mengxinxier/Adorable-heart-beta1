 #结算事件
LHS_end_title: "§9然后，她做了一个很长很长的梦§!"
LHS_end_tip: "矿井深处，禾果蜷缩在晓枫曾坐过的旧木箱上，怀中抱着那本写满了故事的崭新日记。她靠着那根曾挂着镰锤与鹰徽的枕木，在摇曳的马灯光晕中，沉沉睡去。长达数年的孤独远征后，她第一次，睡得如此安稳。\n\n“……傻丫头，你看，我们的小果子，睡着了都还在笑呢。”\n\n“哼，肯定是梦到好吃的了。口水都快流出来了。”\n\n在梦里，禾果回到了那个夏天的夜晚。晓枫正坐在草地上，为她吹着那首不成调的摇篮曲；而雪伊，则一脸不耐烦地，把一件带着体温的外套，披在了她的身上。无数的萤火虫，在她们身边，汇成了一条……通往黎明的、温暖的银河。"
LHS_end_tip_2: "感谢您对钢铁萌心与野火革命军内容的喜爱与支持！\n愿每一个在黑夜里迷路的孩子，最终都能找到回家的路。"
LHS_end_close_button: "§9晚安，禾果§!"
LHS_end_close_button_TT: "§L所以……只要我还看着星星，\n她们就……还在看着我，对不对？§!"

LHS_end_title2: "§t然后，故事迎来了最温柔的结局§!"
LHS_end_tip2: "玩累了的禾果，不知道什么时候，已经靠在晓枫的身边，沉沉地睡着了。她的嘴角，还带着一点点草莓蛋糕的甜味，脸上，是那种……没有任何负担的、孩子气的安稳睡颜。\n“喂，天快黑了。”雪伊的声音压得很低，她一边收拾着野餐布的角落，一边小声地抱怨着，“这丫头……就这么睡着了？真拿她没办法。”\n“嘘……让她再睡一会儿吧。”晓枫微笑着，轻轻地，把禾果额前的一缕乱发，拨到了耳后。她的动作，温柔得像是在触碰一件世界上最珍贵的宝物。\n“你看她的表情，雪伊。”晓枫抬头，望着那片被晚霞染红的天空，轻声说，“她有多久……没有睡得这么安稳了？”\n雪伊没有再说话。她只是，默默地，脱下了自己的外套，然后，小心翼翼地，盖在了禾果小小的身上。\n“……别着凉了，小傻瓜。”\n晓枫看着她，又看了看怀里睡得正香的禾果，看着远处那片沐浴在晚霞中的、宁静的家园。\n那场漫长的、冰冷的雨，终于，彻底地，停了。"
LHS_end_tip2_2: "感谢您对钢铁萌心与野火革命军内容的喜爱与支持！\n愿每一个在黑夜里迷路的孩子，最终都能找到回家的路。"
LHS_end_close_button2: "§t那么……明天见吧§!"
LHS_end_close_button2_TT: "§L明天的计划？嗯……大概是……再下一次的野餐吧？§!"

LHS_end_title3: "§R然后，太阳落进了晚霞§!"
LHS_end_tip3: "不知过了多少天之后，我回到了这个……空旷得只剩下回声的办公室。“你看，晓枫。我们……做到了。”我走到那张……我们曾一起在矿井的灯下铺开过无数次的、已经磨破了边的旧地图前。我的手指轻轻地划过上面那些，你曾画下的一道道代表着未来的路线。我记得那时候你总是皱着眉头，一边画，一边对我说：“你看这里，雪伊，等打完仗，我们就在这里建一所最大的学校。”“还有这里，这里的水土好，我们要建一个种满了向日葵的农场，小果子肯定喜欢。”“还有……”我沿着你画下的路线走到了窗边。外面，夕阳正把整个城市都染上了一层暖洋洋的红色。学校建起来了。里面传来了孩子们琅琅的读书声。农场也建起来了。风吹过的时候，能看到一片金色的海洋。所有……所有你画在地图上的东西，我都……一个一个地，把它们都变成了现实！我靠在冰冷的窗边，点燃了今天的第二支烟。烟雾里，我好像又看到了你。你还是那副爱操心的样子，对着我无奈地笑着，然后轻轻地，摇了摇头。是啊。你说过的，你不喜欢烟味。我笑了笑，把那支只吸了一口的烟,\n掐灭了。"
LHS_end_tip3_2: "感谢您对钢铁萌心与野火革命军内容的喜爱与支持！\n愿每一个在黑夜里迷路的孩子，最终都能找到回家的路。"
LHS_end_close_button3: "§R……天，要黑了§!"
LHS_end_close_button3_TT: "§L……我还有没做完的工作§!"

LHS_end_title4: "§t然后，驶向花开的尽头§!"
LHS_end_tip4: "喉咙里那股子压不住的腥甜，正一寸一寸地剥夺我的声音。肋骨的断裂处每跳动一下，都在大口吞噬着我仅存的力气。我必须咬紧牙关，把这辆车开得再稳一些，再稳一些。\n我从后视镜里偷偷瞧着她们。看着这三个总算卸下担子、挤在一起打呼噜的小家伙。\n“真想再赖着一会儿啊。哪怕再多一分钟也好。”\n我想听晓枫再讲一个漏洞百出的冷笑话，想看雪伊为了那把破枪跟我吹胡子瞪眼。甚至，我还想在回港的时候，理直气壮地让小果子去帮我抢一个刚出炉的草莓蛋糕。\n我这一辈子啊，强悍了太久，也矜持了太久。直到这会儿才发现，原来那些最寻常、最琐碎的烟火气，才是这世间最珍贵的宝贝。\n烟囱里的炊烟已经招手了，家的味道正顺着风扑进车窗。我这具破破烂烂的身体，总算完成了它在这世上的最后一趟差事。\n夕阳把影子拉得老长老长。我感受着指尖残留的一点点温度，心满意足地叹了最后一口气。\n§t这人间……我来过，我爱过，我守住了。这就值了。§!"
LHS_end_tip4_2: "感谢您对钢铁萌心与野火革命军内容的喜爱与支持！\n愿每一个在废墟里并肩同行的战士，终能抵达有烤红薯与热汤的家门。"
LHS_end_close_button4: "§t到家了，姑娘们§!"
LHS_end_close_button4_TT: "§L咱们……全都在车上。§!"
