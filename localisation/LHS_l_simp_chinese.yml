LHS_his_page_01_title: "折翼的鹰徽"
LHS_Country_History_Page_01: "在南美洲这片被咖啡香与血腥味浸透的土地上，洛维尼亚王室的奢靡与贫民窟的挣扎形成了鲜明的对比。1927年，一支由前帝国精英组成的、名为“野火”的雇佣兵军团，厌倦了为腐朽的王室卖命，在思想开明的老军团长带领下，毅然倒戈，成为了南美左翼革命浪潮中一支战力强悍的武装力量。她们的鹰徽，一度是王室军队的噩梦。然而，革命的道路从不平坦。1935年，就在革命形势一片大好之际，一场精心策划的阴谋降临了。老军团长在一场“意外”中毒身亡，王室特工迅速渗透并掌控了“野火”军团的高层。她们将这支曾经的革命利剑，重组为直属于王室的“国防军团”，调转枪口，以“清除激进毒瘤”为名，对昔日的革命同志——赤卫队及工人运动组织，展开了惨绝人寰的血腥清洗。曾经象征着荣耀与反抗的鹰徽，就此折翼。南美的革命星火，似乎即将被这突如其来的背叛与镇压彻底扑灭。"

LHS_his_page_02_title: "艾瑞波拉的血路"
LHS_Country_History_Page_02:"在背叛的阴影与屠杀的烈火中，并非所有人都选择了屈服。时任“野火”军团参谋长的晓枫，这位在贫民窟长大、亲眼目睹过王室暴行的年轻的战术天才，在清洗开始的最后一刻，做出了一个足以改变历史的决定。她联络了军中尚存良知的旧部，以及那些忠于老军团长革命理想的战士，毅然发动兵变。二十三个步兵联队，在她的号召下，于艾瑞波拉城那条狭窄而陡峭的山谷隘口，打响了反抗的第一枪。她们面对的是三倍于己的、由昔日战友组成的王室镇压部队。这是一场注定载入史册的惨烈战斗。晓枫指挥着起义部队，用血肉之躯死死顶住了精锐装甲部队的轮番冲锋。战斗进行到最危急的时刻，晓枫做出了一个疯狂而大胆的决定。她集结了起义军手中仅有的十门老式野战炮，放弃了所有常规炮击目标，将炮口对准了峡谷两侧脆弱的岩壁。震耳欲聋的炮火引发了剧烈的山崩，滚落的巨石如瀑布般倾泻而下，彻底扼住了艾瑞波拉的咽喉，也为数千名被追捕的工人、学生和赤卫队残部，撕开了一条通往卡卡罗姆山脉的、唯一的生路。"

LHS_his_page_03_title: "矿井下的火种"
LHS_Country_History_Page_03:"卡卡罗姆山脉，这里曾是帝国流放犯人的地方，如今，却成为了革命最后的避难所。退入这片绝地的起义者们，在废弃的矿井深处找到了临时的栖身之地。空气里弥漫着潮湿的霉味和绝望的气息，但比这更浓烈的，是复仇的怒火与不屈的意志。在这里，晓枫召集了所有幸存的战士和群众。在一盏昏黄的矿灯下，她摘下了自己臂章上那枚沾着血污的、属于旧军团的鹰徽标记，将其与老军团长生前佩戴的一枚简陋的镰锤皮带扣，并排挂在了一根支撑矿道的粗大枕木上。“从今天起，我们不再是任何人的雇佣兵，我们只为自己，为所有被压迫的人民而战！”在无数双被矿灯照亮的、闪烁着火焰的眼睛注视下，“野火革命军”正式宣告成立。卡卡罗姆的矿井，成为了这支新生革命队伍的摇篮与熔炉。然而，挑战才刚刚开始——王室已将“野火”军团的残部收编为“剿匪特遣队”，正摩拳擦掌，准备对这群躲在“老鼠洞”里的叛军，发动下一次致命的围剿。而矿井中仅存的粮食，只够维持数月之久。革命的火种能否熬过这个寒冬，无人知晓。"

LHS_Local_History_Title: "§Y南美§!地区"
LHS_loca_his_t_01: "公社的雏形"
LHS_loca_his_t_02: "腐朽的王冠"
LHS_loca_his_t_03: "破碎的宝石"

LHS_Local_History_Page_01: "在卡卡罗姆山脉的阴影之外，洛维尼亚的平原与城市，是另一片截然不同的战场。这里没有成建制的革命武装，只有在工厂、码头和咖啡种植园里，被压迫到极限的工人们无声的怒火。雪伊，这个名字在工人群体中，起初只是一个传说。她们说她是从罐头厂的血汗流水线上走出来的，说她曾用一把生锈的扳手，就撬动了整个码头的罢工浪潮。1932年，当王室的爪牙——那些被称为“军团”的私人武装，残酷镇压了一场磨坊工人的和平请愿后，雪伊意识到，温和的抗争只会换来更猛烈的镇压。那夜，她召集了所有幸存的工会骨干和农会代表，在一间废弃的教堂地下室里，她们没有祈祷，而是用血盟誓。她们宣布成立“南美工人联合会”，这是一个松散但坚韧的地下组织。她们的目标很简单：活下去，反抗，并等待着能将所有反抗力量拧成一股绳的那一天的到来。她们的武器，是藏在面粉袋里的传单，是夜间被悄悄破坏的铁轨，是工人们口耳相传的、关于一个更好世界的低语。她们的力量微弱，却像地下的根系，顽强地在王室统治的基石下蔓延。她们不知道远方的卡卡罗姆山区还有另一支武装在战斗，她们只知道，在这片土地上，她们决不能沉默。"

LHS_Local_History_Page_02: "洛维尼亚王室，一个早已烂到根里的名号。她们的祖先曾是这片大陆的征服者，而如今，她们只是寄生在这片土地上的巨大毒瘤。她们的宫殿用黄金装饰，她们的晚宴挥霍无度，而这一切都建立在对人民敲骨吸髓般的剥削之上。对于王室而言，人民只是数字，是维持她们奢华生活的燃料。现任的统治者，瓦伦蒂娜，这个名字本身就带着一股不祥的气息。在登上洛维尼亚王座之前，她曾是邻国“安息之国”的统治者——一个以神秘的亡灵魔法和残酷统治而闻名的国度。没有人知道她是如何，又为何放弃了那个死亡的国度，来到了洛维尼亚。但她带来了“安息之国”的作风：冷酷、高效，以及对生命毫无敬畏的漠视。在瓦伦蒂娜的统治下，洛维尼亚的压迫变本加厉。她组建了名为“军团”的私人武装，用最残酷的手段镇压一切反抗的声音。更令人不寒而栗的是，有传言称，她正秘密地与她过去的国度进行着某种可怕的交易，试图将亡灵的力量，引入到这片生者的土地上。王室的王冠，如今已沾满了活人的鲜血与死者的气息。"

LHS_Local_History_Page_03: "在这片混乱的大陆上，还存在着一股游离于所有政治势力之外的力量——魔法少女联盟。她们曾是希望与奇迹的象征，每一个成员都曾为了某个纯粹的愿望，与神秘的生物签订契约，获得了超越凡人的力量。她们游走于城市与乡野，对抗着名为“魔女”的、由绝望化成的怪物，默默守护着这个世界。然而，当人类自身的矛盾激化到极致时，这群守护者发现自己陷入了前所未有的迷茫。王室将她们视为可以拉拢或利用的强大“武器”，试图用金钱和地位诱惑她们；而底层的革命者，则对她们这种超然的、不介入凡间纷争的姿态抱持着深深的不信任。联盟内部也因此产生了巨大的分歧。一部分魔法少女认为，她们的职责仅限于对抗魔女，不应卷入人类的战争；另一部分则认为，当人类的暴政本身就在制造着比魔女更深沉的绝望时，她们无法再袖手旁观。更糟糕的是，一些魔法少女在无尽的战斗中，灵魂宝石逐渐被污染，心智受到侵蚀，变得偏激而危险。这个曾经团结的联盟，如今已是裂痕遍布。她们像一颗颗美丽的、却濒临破碎的宝石，在时代的洪流中，不知该去向何方，最终又将折射出怎样的光芒。"

LHS_route_guide_desc: "§R野火革命军§!路线指南\n\n同志，想知道怎么走出不同的革命道路吗？看这里！\n\n一、§Y雪伊个人线（种田路线）§!\n\n在§Y1937年1月1日之前§!，就彻底消灭掉“军团”。\n\n说明：这是一条比较考验操作的“速通”路线。如果你动作够快，在前期就猛猛点政治线国策，然后一路平推“军团”，那么在后续的剧情中，晓枫将会为了掩护大部队而英勇牺牲，之后将由雪伊一人扛起革命的大旗。§L（代价是沉重的，同志，请三思！）§!\n\n二、§G晓枫与雪伊双人线（世界革命）§!\n\n§G在1937年1月1日之后§!，再消灭“军团”。\n\n说明：这是比较推荐的路线！稳扎稳打，慢慢积蓄力量，不用急着和军团决一死战。只要把最终的决战拖到1937年之后，两位好同志就能并肩作战，一起迎来最终的胜利！§L（对于第一次玩的兄弟来说，这是最稳妥的选择，可以体验到比较完整的剧情！）§!\n\n三、§t小果子线§!\n\n在§R1937年3月1日之后§!，惨胜“军团”。\n\n§L（目前只做了一半，不要玩）§!\n\n注：§O还没有做在消灭军团之前优先解决洛维尼亚的路线，所以最好不要那么做！"
