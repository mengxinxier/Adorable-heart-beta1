LHS_xuanchuan: "揭露真相"
LHS_xuanchuan_desc: "当王室与亡灵的交易在泥沼中腐烂时，迟滞的春雷终化作焚毁旧世界的野火。\n为了揭露和粉碎一场毁灭整个种族的阴谋，我们必须团结起所有能够团结的人们！"
LHS_gudong: "鼓动王室士兵"
LHS_jiefa: "煽动民众"
LHS_souxun: "风中的呼唤"
LHS_souxun_desc: "我们的通讯录早已在撤退中遗失，但野火内部曾有一些约定俗成的紧急联络频率。现在，我们只能像大海捞针一样，彻夜不停地在这些充满了杂音的频道里，一遍遍地呼唤。但愿，有人能听到。"
LHS_jiuri: "搜寻旧日的频率"
LHS_pcxs: "派出信使"
LHS_PRISON_RUNNING: "正在安抚"
adorable_heart_prisoner_LHS: "禾果的未来"
adorable_heart_prisoner_LHS_desc: "战争结束了。我们俘获了[LHS.Getname]的最后一位领袖，那个名字叫做“禾果”的年轻女孩。将她投入冰冷的地牢，或是送上审判席，是最简单的做法。但……或许还有另一种选择。她并非天生的敌人，而是被那个残酷时代所塑造的战士。我们决定，给予她作为一名战败指挥官应有的尊重。为她提供一间安静、舒适的房间，里面有充足的书籍、温暖的食物和干净的衣物。我们不审问她，也不强迫她。我们只是想让她知道，在这里，她首先被当作一个“人”来对待。"
LHS_heguo_lishi: "历史的另一面"
LHS_heguo_lishi_desc: "“她似乎已经接受了战败的现实，但沉默是她唯一的回答。仅仅提供物质上的优待，无法触及她那颗被革命火焰淬炼过的心。我们决定，派出我们最优秀的学者和历史学家，与她进行平等的对话。我们不辩论主义的优劣，也不批判她过去的选择。我们只是向她展示，我们是如何建设这个国家的，我们的人民是如何生活的，我们所珍视的文化与传统是什么。我们想让她看到，历史，并非只有她所坚信的那一个版本。”"
LHS_heguo_fxhd: "废墟上的花朵"
LHS_heguo_fxhd_desc: "“她心中最深的结，依然是那些在战争中牺牲的同志和破碎的家园。空谈理想无法抚平真实的伤痛。我们决定，邀请她一同参与到对前[LHS.Getname]根据地的战后重建工作中来。让她亲眼看到，我们是如何安置那些流离失所的平民，如何重建被战火摧毁的村庄，如何为那些曾是她战友的人们，提供医疗和工作。我们要用行动证明，我们并非毁灭者，我们同样渴望在这片土地上，重新种出希望的花朵。”"
LHS_heguo_wsey: "力量为谁而用"
LHS_heguo_wsey_desc: "“我们找到她，不再是以胜利者对战俘的姿态，而是以一个国家的领导者，对一位拥有卓越才能的年轻人的身份。我们告诉她，她那份在绝境中求生的坚韧，那份足以凝聚人心的领袖魅力，那份对海洋的深刻理解，不应该随着战争的结束而被埋葬。这个国家，这个世界，依然面临着无数的挑战。她的力量，可以用来守护更多的人，创造一个她或许也曾梦想过的、和平而繁荣的未来。”"
####民族精神###
LHS_slnyc: "索拉娜的遗产"
LHS_slnyc_desc: "“屏幕前的你们知道吗？在那位女王大人的脑子里，她肯定觉得自己是个不折不扣的大慈善家。\n瞧瞧她这套神经兮兮的逻辑：不给饭吃是怕大伙吃撑了不消化；派宪兵拿枪指着工人的脑袋，那是为了根治大家的拖延症；至于把反对者都变成哑巴，那绝对是嫌吵，为了大伙耳根子清净！\n她管这叫为了你们好的高效统治。\n虽然她人是凉透了，但这股把人折腾得死去活来的劲儿还在。毕竟哪怕到现在，只要提起她的名字，大家干活的速度都能快上好几倍。别误会，那纯粹是被吓出来的。”"
LHS_materialism_of_miracles: "属于奇迹的唯物主义"
LHS_materialism_of_miracles_desc: "曾经，她们被称为“奇迹”，是神明的恩赐，是命运的诅咒，是凡人只能仰望或怜悯的异类。\n但在我们的战壕里，在联合阵线的旗帜下，我们剥去了那层神秘的金粉，还原了它最朴素、也最刚硬的本质。\n对我们而言，魔杖尖端的闪光与枪口的喷焰并无不同——那都是被压迫者的愤怒化作的烈火；灵魂宝石的辉光与高炉铁水的赤红并无不同——那都是意志与劳动凝结的结晶。\n我们将“魔法”从云端拽入泥土，塞进枪膛，填入锅炉。在这里，它不再是少女用来许愿的代价，它是工人手中的锤，是士兵手中的剑，是客观存在的、可以被掌握用来砸碎旧世界的——力量。\n世界上从来就没有什么救世主。我们依靠的，只有钢铁、意志，以及……握在同志手中的那束光。"
