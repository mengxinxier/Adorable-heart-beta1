LHS_liangshi_desc: "矿井深处的炊烟日渐稀薄，工人们用爆破后震落的岩盐腌制蕨类植物根茎。妇女们将最后几袋玉米粉混入碎矿石充当增重剂，孩子在通风管道里寻找硝化菌群滋生的苍白蘑菇。此时此刻,我们比任何人都清楚不能坐以待毙的道理。"
LHS_tongji: "赤色叛军"
LHS_tongji_desc: "她们对国际声称我们是“躲在老鼠洞里的军团叛徒。”无妨，那就让王室老爷们好好见识下我们这群“老鼠”到底是多么得令人难缠。"
LHS_huozhong: "地下火种"
