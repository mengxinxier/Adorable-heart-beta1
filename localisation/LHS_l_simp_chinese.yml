 youji_on_end_revolutionary_base_area:0 "只有把根扎进烂泥里"
  youji_on_end_destruction_over_land_gains:0 "别死守那几寸土疙瘩"
  youji_on_end_quick_decision_offensive_warfare:0 "哪有压迫，哪就有我们"
  youji_on_end_people_not_things:0 "决定胜负的是握枪的手"
  youji_on_end_people_war:0 "每个人都是自己的将军"
  LHS_GUERILLA_WAR:0 "非对称运动战"
  LHS_GUERILLA_WAR_DESC:0 "正规战是富人的特权，阵地战是死人的浪漫。咱们不玩那个。我们要搞的是一场基于唯物主义的战争：承认敌强我弱的客观事实，然后发挥主观能动性去扭转它。没有防线，因为每一寸土地都是防线；没有后方，因为敌人的脚下就是后方。这不叫卑鄙，同志，这叫在资源极度匮乏条件下的战术最优解。"
  LHS_guerilla_war_catch_and_seize:0 "最好的授勋官在对面"
  LHS_guerilla_war_galvanize_support:0 "腿长在身上是用来跑的"
  LHS_guerilla_war_scorched_earth:0 "连这里的耗子都会替我们报信"
  LHS_guerilla_war_urban_assaults:0 "傻瓜才走大路"
  LHS_guerilla_war_defense_of_gained_power:0 "枪是用来革老爷们的命的"
 youji_WAR:0 "人民游击队"
 youji_on_me:0 "以我之肩"
 youji_on_me_desc:0 "我们的武器，是我们的肩膀；我们的工事，是我们的胸膛。在最关键的战线上，我们将用密集的人墙，抵住敌人最锋利的矛。每一次倒下，都只会让身后的人，站得更直。\n\n"
 youji_on_me_tt:0 "£GFX_PAO_youjibudui 革命游击队: -战场宽度：§G-0.4§!"
 youji_on_me2:0 "不懈压迫-§t@LHS莉兰迪亚革命§!"
 youji_on_me2_desc:0 "“胜利并非取决于第一声枪响，而是取决于最后一声。我们将训练战士们进行不间断的战斗，施加永不休止的压力，直到敌人的抵抗意志，在我们不懈的攻势下被彻底碾碎。”\n\n"
 youji_on_me2_tt:0 "£GFX_PAO_youjibudui 革命游击队: -组织度：§G+5.0§!"
 youji_on_me3:0 "留住青山-§L@PAU军团§!"
 youji_on_me3_desc:0 "“她们总想把我们困死在某一座山头，某一条战线。可我们，就是那片连绵不绝的青山。一时的退却，是为了让森林长得更茂密。暂时的潜伏，是为了等待春天的第一场雨。只要我们的同志还在，只要我们的火种还在，这片土地上，就永远有燃起燎原大火的希望。”\n\n"
 youji_on_me3_tt:0 "£GFX_PAO_youjibudui 革命游击队: -最大速度：§G+10%§!"
 youji_on_me4:0 "以静制动"
 youji_on_me4_desc:0 "“有时候，最好的进攻，是安静地等待。我们要学会像耐心的猎人一样，在敌人最意想不到的地方，挖掘我们的陷阱，然后，用最少的口粮，等待那个最疲惫的猎物，自己走进我们的射程。让时间，成为我们最锋利的武器。”\n\n"
 youji_on_me5:0 "人民的战争-§O@PAM莉兰迪亚王国§!"
 youji_on_me5_desc:0 "“战争，终究是残酷的。当所有灵巧的战术都已用尽时，胜利的天平，将由最简单的东西来决定——勇气，和数量。我们最不缺少的，就是这两样东西。我们将用我们的胸膛，去填平战壕；用我们的呐喊，去压倒炮火。因为，在这片土地上，我们，即是战争本身。”\n\n"
 youji_on_me5_tt:0 "£GFX_PAO_youjibudui 革命游击队: §W-战场宽度：§!§G-0.3§!\n-不再需求§Y支援装备§!"
 youji_on_me6:0 "为了明天的战斗-§1@PAO夜莺之国§!"
 youji_on_me6_desc:0 "“她们总以为，击溃我们一次，就等于胜利了。她们不懂。我们的力量，源于这片土地，源于身后的人民。只要我们还站在这片土地上，每一次倒下，我们都能重新站起来，并且，比上一次更加强大。因为，我们不是一支军队。我们是……一种信念。”\n\n"
 youji_on_me6_tt:0 "陆军: -恢复速度：§G+0.10§!\n§W-组织度：§!§G+3.0§!"
 youji_on_me7:0 "剔骨之刃-§O@PAM莉兰迪亚王国§!"
 youji_on_me7_desc:0 "“浪费时间和子弹，去清理那些无关紧要的血肉，是懦夫的行为。真正的战士，应该像最高明的屠夫，用最精准的一刀，将骨头从肉里剔出来。我们将把我们的军队，磨砺成最锋利的刀。我们的目标，永远只有一个——敌人的心脏”\n\n"
 youji_on_me7_tt:0 "徒步步兵: -对人员杀伤：§G+10%§!\n-§Y步兵装备§!需求：§G-10§!\n-最大速度：§G+5%§!"
 youji_on_me8:0 "绝不停歇的进攻-§1@PAO夜莺之国§!"
 youji_on_me8_desc:0 "“喘息，是留给死人的。对敌人最大的仁慈，就是用最快的速度，送她们去见她们的神。我们将不分昼夜地发起攻击，用一次又一次的冲锋，去碾碎她们的阵地，和她们的意志。让恐惧，成为她们唯一的睡眠。”\n\n"
 youji_on_me8_tt:0 "陆军: -突破：§G+10%§!\n§W-最大速度：§!§G+5%§!"
 youji_on_me9:0 "从战争中学习战争-§G@ELF艾尔芙联盟§!"
 youji_on_me9_desc:0 "“每一场战斗，都是我们最好的老师。我们从失败中学到的，远比从胜利中更多。我们学会了如何依靠人民，也学会了如何集中力量。现在，是时候，把我们所有用血和汗换来的经验，都变成我们军队骨子里的一部分了。让我们的每一次前进，都比上一次，更稳，也更坚定。”\n\n"
 youji_on_me9_tt:0 "£GFX_PAO_youjibudui 革命游击队: -补给使用：§G-0.01%§!\n§W-组织度：§!§G+10.0§!"
 youji_on_me10:0 "处处皆是战场-§g@PAQ阿德莱希§!"
 youji_on_me10_desc:0 "“谁说战线只在地图上那条红色的细线？对于我们的敌人来说，只要她们还踏在我们的土地上，那她们的每一寸土地，都是危机四伏的前线。我们将教会人民，如何用她们自己的方式去战斗。而我们的军队，则会在自己的家门口，以逸待劳，等待那个被后方烽火搅得精疲力竭的敌人，自己送上门来。”\n\n"
 #youji_on_me10_tt:0 "£GFX_PAO_youjibudui 革命游击队: -主动性：§G+1.5%§!"
 youji_on_me11:0 "江河入海"
 youji_on_me11_desc:0 "“当革命的号角吹响时，每一条山间的溪流，每一片田野的雨水，都会汇聚而来，最终，形成无可阻挡的江河，奔向大海。我们将敞开怀抱，迎接每一位愿意为这片土地而战的同志。同时，我们会给予每一位战士最大的信任，让她们在战场上，能用自己的智慧，去寻找胜利的道路。因为，真正伟大的战术，从来都不是写在纸上，而是诞生于人民的心中。”\n\n"
 youji_on_me12:0 "从群众中来，到群众中去-§0@MGU魔法少女联盟§!"
 youji_on_me12_desc:0 "“战争打到最后，我们所依靠的，还是那些最简单的东西。是人民为我们藏起的一袋粮食，是她们为我们指引的一条小路，是她们在我们最疲惫时，投来的那一个充满希望的眼神。我们的军队，将彻底融入人民之中，如鱼得水。因为，我们本就从她们中来，最终，也必将回到她们中去。”\n\n"
 youji_on_me12_tt:0 "£GFX_PAO_youjibudui 革命游击队: -HP：§G+2.5§!\n§W-防御：§!§G+10%§!\n-§Y步兵装备§!需求：§G-10§!"
 youji_on_tt:0 "§Y步兵装备§!需求：§G-10§!"
 youji_on_me13:0 "喂养饿狼-§G@ELF艾尔芙联盟§!"
 youji_on_me13_desc:0 "“我们的军队，是一群永远不会满足的饿狼。而敌人的血肉，就是喂养她们最好的食粮。每一次撕咬，只会让她们的獠牙变得更锋利；每一次吞噬，只会让她们的饥渴变得更强烈。我们将用敌人的尸骨，铺就一条通往绝对胜利的道路。”\n\n"
 youji_on_me13_tt:0 "£GFX_PAO_youjibudui 革命游击队: -对人员杀伤：§G+10%§!\n§W-对装甲杀伤：§!§G+10%§!\n§W-防御：§!§G+10%§!"
 youji_on_me14:0 "活到最后-§g@PAQ阿德莱希§!"
 youji_on_me14_desc:0 "“战场上，只有两种人：死人，和活下来的人。我们要做的，就是确保我们的姑娘们，永远是后一种。我们会让她们在战斗中学会一切，学会如何开枪，如何躲藏，如何……让敌人，变成她们通往更强的、冰冷的垫脚石。”\n\n"
 youji_on_me14_tt:0 "£GFX_PAO_youjibudui 革命游击队: -突破：§G+10%§!\n§W-组织度：§!§G+10§!"
 youji_on_me15:0 "灭绝理论"
 youji_on_me15_desc:0 "“战争打到最后，比拼的，是效率。分散的力量，等于没有力量。从现在起，我军所有的枪口，都将学会指向同一个目标。我们将像一群训练有素的猎手，精准地，找到并撕碎敌人阵线中最关键的那一块血肉。然后，静静地，欣赏她们的整个身躯，是如何因为这一处小小的伤口，而轰然倒塌的。”\n\n"
 youji_on_me16:0 "决定性攻势-§0@MGU魔法少女联盟§!"
 youji_on_me16_desc:0 "“我厌倦了这场无休止的消耗。是时候，用一场决定性的攻势，来终结这一切了。我们将集结我们最强大的力量，赋予她们持续进攻的能力，然后，像一把烧红的匕首，直插敌人的心脏。这一战……将是最后一战。”\n\n"
 youji_on_me16_tt:0 "£GFX_PAO_youjibudui 革命游击队: -对人员杀伤：§G+10%§!\n§W-防御：§!§G+10%§!"
 youji_on_me_DOCTRINE_LABEL:1 "游击革命学说"
 youji_on_me_DOCTRINE_DESC:0 "“我们是种子，也是风暴。在每一个角落里扎根，在最深的夜里燃烧。”\n\n"
 youji_on_me1_LABEL:0 "融于血色"
 youji_on_me1_LABEL_TT:0 "§R战争的慈悲，就是用最锋利的刀，在最短的时间里，终结一切痛苦。§!\n\n"
