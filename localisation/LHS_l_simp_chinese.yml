LHS_news.2.b: "绝不能后退！"
LHS_news.3.t: "$news_event_background$南美革命战争"
LHS_news.3.d: "夜莺的尸潮已化为尘土，那些曾以此为傲的亡灵怪物，如今已被我们的枪炮轰作齑粉。我们用钢铁回敬了死亡，但这绝非终点！放眼这片大陆，殖民者的鞭子仍在挥舞，旧日权贵的吸血还在继续。她们以为我们会因刚刚结束的恶战而停下喘息？那是她们最大的错觉！\n\n此时此刻，莉兰迪亚公社正式宣告：南美解放战争正式打响！我们要清算的不仅仅是死者，更是那些骑在活人头上的寄生虫！\n\n哪怕烧尽这片大陆的每一寸荒草，我们也誓要将红旗插遍南美的尽头！"
LHS_news.3.a: "已经没有什么能够压垮她们了"
LHS_news.3.b: "一群坏孩子"
LHS_news.3.c: "杀！"
LHS_news.4.t: "$news_event_background$南美统一"
LHS_news.4.d: "在经历了一年又一年的战争之后，南美州的战事总算落下了帷幕,南美洲的敌对势力已经被[FROM.Getname]剿灭，南美洲正式宣告统一。\n现在[FROM.Getname]掌握了前所未有的实力，她们终于可以踏上世界的舞台了......"
LHS_news.4.a: "团结的人民永不被击溃"
LHS_news.8.t: "$news_event_background$南美统一"
LHS_news.8.d: "在经历了一年又一年的战争之后，南美州的战事总算落下了帷幕,南美洲的敌对势力已经被[FROM.Getname]剿灭，南美洲正式宣告统一。\n现在[FROM.Getname]掌握了前所未有的实力，她们终于可以踏上世界的舞台了......"
LHS_news.8.a: "你好，世界"
LHS_news.5.t: "$news_event_background$雪伊对魔导国的战前宣言"
LHS_news.5.d: "听好了胆小鬼们！你们见过活人被当成柴火棒子塞进炉膛吗？\n\n魔导国那帮骨头架子干得可欢！\n\n把活人肠子扯出来当裹脚布，把婴儿哭嚎当催眠曲！\n\n我呸！什么狗屁魔导王，就是一窝穿着袍子的活尸！看人就像看案板上的蛆,捏死你还嫌脏了手！\n\n喂喂，那边假装听不见的肥猪贵族，装瞎的岛国皇家老爷，\n\n等这帮骨头渣子把人类全熬成灯油，下一个就轮到你们跪着舔它们脚趾缝里的骨灰了！\n\n不管你身处何方，都给我支棱起来啊！\n\n要么抄家伙干翻这群死变态，要么等着被碾成灰砌她们厕所墙！\n\n还用选吗！？"
LHS_news.5.a: "干死那帮贱骨头！"
LHS_news.5.b: "吵死了" 

LHS_news.6.t: "$news_event_background$美洲人民大团结！"
LHS_news.6.d: "全美州的人民终于迎来了真正的社会主义大团结，不分你我，不分国家，不分种族，所有的人民都团结在一起，打破了殖民者的枷锁，打破了资本主义的统治！\n\n现在我们将迎来一个新的时代，一个属于美洲人民的时代！\n\n我们将用自己的双手创造出一个崭新的世界！"
LHS_news.6.a: "那么，接下来..."

LHS_news.7.t: "$news_event_background$南美革命战争"
LHS_news.7.d: "莉兰迪亚公社宣称要解放整个南美洲，并且已经开始了革命战争。她们的目标是推翻所有的殖民者和压迫者，建立一个真正属于人民的南美洲。\n\n南美洲将不再有绝望，南美洲将不再有被压迫，南美洲将不再有殖民者的奴隶！"
LHS_news.7.a: "我们战无不胜！"
LHS_news.7.b: "不能让她们得逞！"
LHS_news.7.c: "南美洲的人民们，团结起来！"
LHS_news.7.e: "她们疯了！？"
LHS_news.9.t: "$news_event_background$ “自由灯塔”的转向"
LHS_news.9.d: "今日，曾经被视为“自由世界”最坚固堡垒、拥有最强大工业机器和军事储备的[FROM.Getname]，发生了一场史无前例的政治地震。面对国内风起云涌的、受莉兰迪亚革命思潮影响的民众运动，其领导层并未选择铁腕镇压，而是做出了一个令所有旧世界君主、总理和独裁者都无法理解的决定，她们打开了权力的大门，宣布将与起义的民众代表进行全面谈判，并正式邀请莉兰迪亚公社协助进行社会改革...\n\n\n“一百多年前，我们的先辈为了一个‘人人生而平等’的理想，在这片土地上点燃了革命的火焰。今天，我们只是擦去了覆盖在这份理想之上的、一个半世纪的灰尘。我们没有背叛这个国家，我们只是让她回归了最初的承诺。自由的钟声，今日为所有劳动者而鸣！”"
LHS_news.9.a: "自由世界最黑暗的一天"
LHS_news.9.b: "腐朽的民主，终将自我埋葬！"
LHS_news.9.c: "全世界的无产者，联合起来！"
LHS_news.9.e: "历史的航向，已彻底改变"

LHS_news.10.t: "$news_event_background$为生者而战"
LHS_news.10.d: "今日，一个声音从南美大陆传遍世界。[FROM.Getname]，这支在战火中淬炼而成的红色力量，正式向盘踞在欧洲大陆的魔导国宣战。\n“致所有尚存呼吸的生灵：\n我们脚下的世界，正被一个以死亡为信条的黑暗帝国所威胁。它的存在，是对生命本身最极致的亵渎。\n此刻，我们必须团结起来。我们呼吁所有民族，所有国家，所有信仰的人们，将枪口一致对准那座白骨的王座。\n这已是一场关乎存续的战争。我们为我们共同的家园而战，为我们孩子的未来而战，为每一个日出的权利而战。\n拿起你们的武器，站到我们身边来。让我们用血肉筑成一道长城，共同捍卫这个属于生者的世界！”"
LHS_news.10.a: "消灭一切外来邪祟！"

LHS_news.11.t: "$news_event_background$旧世界的落幕"
LHS_news.11.d: "当最后一具亡灵的骸骨化为尘土，世界本应迎来久违的和平。然而，在刚刚于莉兰迪亚首都召开的“世界联合会议”上，晓枫向所有与会国，发表了被后世称为“最后通牒”的演说。\n“朋友们，同志们，”她的声音通过广播，传向了地球的每一个角落，“我们曾并肩站在深渊的边缘，我们共同战胜了那吞噬一切的黑暗。我们拯救了世界。但我们必须扪心自问——我们拯救的，是一个怎样的世界？”\n她的目光，缓缓投向了圣杯王国的代表席。\n“当我们的人民在用生命捍卫家园时，在世界的另一端，在广袤的亚非大陆和星罗棋布的岛屿上，还有亿万兄弟姐妹，在名为‘殖民地’的牢笼里，被饥饿、压迫和无尽的劳役所折磨。她们的汗水和鲜血，仍在滋养着一个古老而腐朽的帝国。”\n“我们击退死神，不是为了让世界重新戴上古老的镣铐。我们流尽鲜血，是为了缔造一个真正自由、平等的未来。”\n她顿了顿，声音变得如钢铁般决绝。\n“我在此，代表所有渴望解放的人民，向圣杯王国提出最后的要求：请立刻、无条件地，解放你们所有的殖民地，废除一切不平等的条约，将主权归还给当地的人民。请和平地交出锁链，或者，我们将用炮火将其熔断。”\n整个世界陷入了死寂。圣杯王国的代表当场发表声明，怒斥这是“赤色暴徒对文明世界的无耻勒索”，并宣布进入最高战备状态。\n最后的幻想破灭了。席卷全球的最终革命，已无可避免。"
LHS_news.11.a: "这份火焰终将烧到每一个人身上…"

LHS_news.12.t: "$news_event_background$第一道日出"
LHS_news.12.d: "枪声沉寂了。\n\n当旧世界的最后一面旗帜落下，和平的晨光终于普照这颗星球的每一个角落。\n\n从南美洲的雨林到东方的江河，从北方的冰原到南方的群岛，人们放下了武器，走出了废墟，拥抱彼此。旧的疆界与壁垒已成为历史，一个属于全体人类的共同体，正在地平线上诞生。\n\n这是一个由工人、农民、学者和所有劳动者亲手塑造的世界。在这里，劳动的果实为所有人共享，知识的火炬为所有人点亮，每一个孩子都能在阳光下尽情欢笑与歌唱。\n\n我们永远铭记，那些为了这一天而献出生命的英雄。她们的牺牲，最终化作了这道普照大地的、永恒的晨光。"
LHS_news.12.a: "我们正生活在一个崭新的纪元"

LHS_news.13.t: "$news_event_background$燃烧的南美大陆"
LHS_news.13.d: "一个疯狂的计划，正在南美大陆上演。\n自称“野火”的革命军残部，并没有像任何人预料的那样，向王室的防线发起自杀性的总攻。\n她们……点燃了整片大陆。\n从沿海的废弃灯塔，到内陆的古老遗迹，再到白尘界的深处，一场场规模不大但亵渎神明的仪式，被同时举行。她们似乎在呼唤着什么，在惊扰着什么。报告显示，在那片土地之下，有无数股强大的、充满怨念的古老能量正在苏醒。\n索拉娜的亡灵大军，陷入了前所未有的混乱。她们不再向边境集结，而是被迫转向内陆，去镇压那些从坟墓和废墟中爬出来的、连她们也感到恐惧的、不属于她们掌控的“同类”。\n整个莉兰迪亚，变成了一片由亡灵与更古老的亡灵互相厮杀的、巨大的战场。\n而那支点燃了这一切的、小小的“野火”，则完全消失在了所有人的视野里。她们像一群完成了恶作剧的孩子，静静地，等待着大火将森林烧成平地的那一刻。"
LHS_news.13.a: "这……这是何等疯狂的阳谋！"
LHS_news.13.b: "只需等待..."

LHS_news.14.t: "$news_event_background$南美洲的暴雨"
LHS_news.14.d: "在解放了艾尔孚利登王国并驱逐了阿德莱希与露斯契亚的殖民者后，世界曾以为“野火”会选择休养生息。\n但她们没有。\n今日，以“野火革命军”残部为核心的南美解放阵线，在指挥官禾果的领导下，向盘踞在大陆上的所有非人势力同时宣战。\n在战前宣言中，禾果通过电台，向整片大陆发出了她简短而清晰的声音：\n“我们曾为那些在雨中哭泣的人送去雨伞。现在，我们要去往风暴的源头。我们要让这场下了太久的雨，永远地停下来。”\n所有人都知道，这将是决定这片土地最终命运的、最后的战争。"
LHS_news.14.a: "这将会是……一场噩梦"
LHS_news.14.b: "就是现在"

LHS_news.15.t: "$news_event_background$南方大陆的寂静"
LHS_news.15.d: "战争结束了。\n在“野火”的旗帜下，那片被亡灵、魔女和殖民者反复蹂躏的南方大陆，终于迎来了统一。世界各国的观察家和情报机构，都陷入了一种前所未有的困惑之中。\n领导这场奇迹般战争的，是一个名叫“禾果”的、有着东方面孔的年轻女孩。关于她的情报少得可怜，只知道她曾是革命军与莉兰迪亚公社的传奇领袖——晓枫和雪伊的部下，一位天才的舰队指挥官。\n在她的领导下，“野火”的残部以一种匪夷所思的、近乎于艺术的战争方式，清扫了大陆上所有的威胁。然后……她就沉默了。\n外交照会？阅兵仪式？这些都没有...整个南美大陆，仿佛变成了一座与世隔绝的孤岛。从零星的商船和冒险家口中传出的消息，都描绘了一幅奇怪的图景：港口在重建，田地在开垦，人们在劳动，一切都在井然有序地恢复。但整个大陆，都笼罩在一种安静到近乎压抑的氛围里。\n她们的领袖，那位神秘的禾果，据说大部分时间都独自待在火地岛的一座白色灯塔里，凝望着北方的大陆。\n没有人知道她在想什么。\n这个刚刚从地狱归来的新生政权，这位亲手埋葬了神话的年轻领袖，她究竟会成为世界和平的基石，还是……下一个更不可预测的风暴之源？\n整个世界，都在这片南方的寂静中，屏息以待。"
LHS_news.15.a: "南美洲的未来，何去何从？"

LHS_news.16.t: "$news_event_background$南十字星下的决战"
LHS_news.16.d: "一个超越了人类理解范畴的灾难，降临在了南美大陆。\n被魔法少女们称为“瓦尔普吉斯之夜”的终极魔女，一个由纯粹的绝望和诅咒构成的、移动的天灾，正在缓缓地，碾过这片刚刚迎来和平的土地。\n全世界的目光，都聚焦在了这里。所有人都认为，“南十字星公社”完了。她们刚刚结束了漫长的解放战争，百废待兴，根本无法对抗这种神话级别的灾难。甚至，许多曾与她们为敌的旧势力，都在幸灾乐祸地等待着这个红色国度的覆灭。\n但，她们没有撤退。\n她们非但没有撤退，反而集结了所有能动员的力量，开赴前线。她们的坦克，停在了魔女前进的道路上；她们的士兵，与那些曾被她们视为“异类”的魔法少女，并肩站立。\n“南十字星公社”的指挥官禾果，通过紧急频道，向全世界，也向她身后的所有战士和魔法少女，发表了最后的演说：“我们曾向全世界许诺，要建立一个不再需要奇迹的世界。现在，就是我们兑现承诺的时候。\n那是……我们所有人的悲伤。\n今天，我们不为胜利而战，不为仇恨而战。\n我们，为那些早已无法哭泣的灵魂而战。\n以凡人之躯，我们将向神明证明——这个世界上，再也没有什么命运，是无法被改写的！”\n全世界，都陷入了沉默。所有人都没想到，这个刚刚诞生的公社，会选择用自己脆弱的身躯，去守护那些……甚至曾与她们为敌的魔法少女，去对抗一个……所有人都认为无法战胜的绝望。"
LHS_news.16.a: "……这，才是真正的革命者吗？"
LHS_news.17.t: "$news_event_background$南美洲的野火"
LHS_news.17.d: "据报道，一支自称为“野火革命军”的小规模武装，在莉兰迪亚南部的卡卡罗姆山区发动叛乱。该组织由前“野火”雇佣兵团的残部与本地激进工人组成，公开宣布将以武力推翻索拉娜女王的统治。\n莉兰迪亚王室发言人对此表示，这只是一场由“心怀不满的前雇佣兵与被煽动的暴民”发起的、小规模的“骚乱”，并宣称王室的“军团”将很快“恢复山区的秩序与安宁”。\n大家普遍认为，这只是南美大陆上又一次司空见惯的武装冲突，这簇在世界角落里燃起的、微不足道的“野火”，在王室的正规军面前，似乎很快就会被轻易地踩灭。"
LHS_news.17.a: "又是一群恐怖的红色暴徒。南美的混乱，永无宁日。"
LHS_news.17.b: "在世界的另一端，也有人点燃了火把。"
LHS_news.17.c: "南美州的混乱，永无宁日。"
LHS_news.18.t: "$news_event_background$“南十字星”的战书"
LHS_news.18.d: "世界，再次将目光，投向了那个刚刚从废墟上建立起来的、南方的孤星——南十字星公社。\n今日，这个由“野火革命军”残部建立的、一直保持着孤立与和平的国家，通过公共频道，向强大的樱花帝国，发出了正式的战争通牒。\n她们的宣言，没有经过任何外交辞令的修饰，简短，而充满了最原始的愤怒。\n“……致所有还在助纣为虐的帮凶：”\n“……你们的军舰，可以封锁她们的港口；你们的士兵，可以占领她们的城市。”\n“……但只要，这片大地上，还有一个孩子，因为你们的暴行，而被迫离开自己的母亲；只要，这片海洋上，还有一个孤儿，因为你们的贪婪，而在异乡的船舱里哭泣……”\n“……我们，就会像你们永远无法摆脱的噩梦一样，跨过整片海洋，前来敲响你们的大门。”\n“……战争，开始了。”\n国际社会对此一片哗然。无人能理解，这个刚刚经历了惨痛战争、百废待兴的小小公社，为何敢于向一个庞大的、与她们远隔重洋的帝国，发起一场……看似毫无胜算的、自杀式的战争。"
LHS_news.18.a: "她们到底想做什么？"
LHS_news.18.b: "可笑的飞蛾扑火"
LHS_news.18.c: "迎接我们最勇敢的同志"

LHS_news.19.t: "$news_event_background$在这荒原之上"
LHS_news.19.d: "南美洲大陆的界碑，正被一双双沾满红土的草鞋与军靴齐刷刷地踏碎。\n\n莉兰迪亚公社的工农们放下了手中刚刚端起的饭碗，重新扛起擦得透亮的步枪，迎着边境线外的迷雾大步挺进。这阵席卷大陆的红色狂潮，透着一股令人眼眶发酸的温情与决绝。\n\n高墙之外，还萦绕着被虚假奇迹榨干灵魂的哀嚎，还盘踞着被癫狂梦魇死死绞住脖颈的血腥气。那些在风雨中瑟瑟发抖的生灵，正经受着这群红土拓荒者们曾经切身体会过、且深入骨髓的剧痛。\n\n刚刚在废墟上建起家园、喝上热汤的劳动者们，完全听懂了那些随风飘来的、撕心裂肺的求救声。\n\n她们带上矿洞里最旺盛的炭火，带上沾满机油与麦香的粗糙手掌，誓要将那些深陷绝望与疯癫的邻居，硬生生地拽回这热气腾腾、饭香四溢的人间。\n\n燎原的星火，正带着洗涤一切痛苦的滚烫温度，烧向整片荒原。"
LHS_news.19.a: "点燃篝火，照亮世界！"
LHS_news.19.b: "疯子！肮脏的疯子！"

LHS_news.20.t: "$news_event_background$南美统一"
LHS_news.20.d: "晨风彻底吹散了遮蔽大陆的硝烟。南美洲的版图，在战火的淬炼中，呈现出一种极致的、震撼人心的赤红。\n那些握着扳手的工人、端着猎枪的农夫，彻底熔断了旧时代的锁链。红泥公社的旗帜迎风招展，发出猎猎声响。\n\n这群在烂泥里翻滚过的劳动者，用最刚硬的铁拳，把傲慢的殖民者赶进了深海，把啃噬生灵的怪物深埋进地底。伴随着拖拉机的震天轰鸣与田里的高亢战歌，一片全权归属人民的广袤家园，正散发着浓郁的泥土芬芳，向着全世界宣告她的苏醒。"
LHS_news.20.a: "风暴的中心，转移了。"
