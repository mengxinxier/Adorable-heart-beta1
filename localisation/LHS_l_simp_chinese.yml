LHS.56.t:0" 一封来自南风的信"
LHS.56.d:0"夜深了，窑洞里的空气像凝固了一样。情报员带回来的这个小油布包，比前线最紧急的战报还要让人心跳加速。打开层层包裹，里面没有我们预想中的密码电报，只是一张质地柔软、带着点烟草和海风咸味的信纸。字迹清秀而洒脱，完全不是官方公文的刻板模样。\n我们围在灯下，一字一句地读着这封来自世界另一端的信：\n\n“致歌声另一端的同志们：你们好。请原谅我的冒昧，这封信是托一个勇敢的水手藏在朗姆酒桶里送来的。他说你们那里的酒一定很烈，和你们的歌声一样。\n前几天，我们缴获了一台属于殖民老爷的收音机，调试频道时，在巨大的杂音里，我捕捉到了一段旋律，你们的歌。那歌声，和我们当年躲在矿井里点燃第一支火把时，大家围在一起唱的调子惊人地相似。我身边的战友雪伊，一个总板着脸但内心火热的家伙，听了都难得地没出声。\n我们这里的王室和压迫者，和你们那里的侵略者，想必是同一个模子刻出来的吧？她们的皮靴擦得再亮，也掩盖不住上面沾着的、我们同胞的血。\n我们这里刚刚打赢了一场小仗，缴获了一些药品和罐头。不多，但足够温暖一个寒夜。不知你们那边，冬天是否也一样寒冷？\n这封信写得有点乱。我只是想告诉你们，你们的歌声，我们听到了。它很美，很有力量。如果可以的话，下次能不能……把剩下的歌词也教给我们？\n\n——晓枫”\n信读完了。窑洞里一片寂静，只有油灯里灯芯燃烧的“毕剥”声。我们互相看着对方，从彼此眼中都看到了一种难以言喻的、混杂着震惊与巨大暖流的情绪。\n这不是一封来自所谓“共产国际”的、高高在上的指示信。\n这更像……一个在遥远的、同一个战壕里并肩战斗的姐妹，在战斗间隙，探过头来，微笑着递过来的一块黑面包。"
LHS.56.a:0"回信。告诉她，我们的歌，才刚刚开始。" 

LHS.57.t:0"一盏油灯的回响"
LHS.57.d:0"回信是随着下一批药品，被巧妙地藏在一个密封的茶叶罐里送达的。当晓枫小心翼翼地展开那张薄薄的、带着淡淡墨香的草纸时，雪伊也难得地凑了过来，脸上带着一丝不情愿的好奇。\n信上的字，是用毛笔写的，笔锋沉稳而有力，仿佛能透过纸背看到一个在万千风浪中依旧从容的身影。\n“晓枫同志，以及那位想必在我写信时，正皱着眉头、用火焰般的目光盯着你的雪伊同志：\n你们的信，跨过高山与大海，平安地送到了我们这片正在发烧的土地上。你们说听到了我们的歌声，我们很高兴。因为这首歌，不是写在纸上的，它的每一个音符，都来自千万个不愿再沉默的喉咙，它的旋律，是在炮火中淬炼，在血泊里定音的。你们能听到，说明我们的心跳，已经穿透了敌人的封锁线。\n你们问剩下的歌词？不必着急，同志。等你们的土地上，孩子们可以无忧无虑地在田野里歌唱时，你们会发现，你们自己已经谱写出了属于南美洲的、同样雄壮的后半章。\n你们那里的王室，我们这里的侵略者，名字不同，但病根是同一个。她们看似强大，有数不尽的枪炮，但那不过是外强中干的铁皮老虎。她们真正的恐惧，是当一个农民、一个工人，挺直了自己被压弯了百年的脊梁时，眼中所迸发出的光。这种光，她们扑不灭。\n你说要送给我们药品和罐头，我们心领了。但请务必先照顾好你们自己和你们的人民。革命不是请客吃饭，保存自己，就是保存了火种。至于我们，山里的野菜，河里的鱼虾，地里只要还能长庄稼，就饿不死我们。我们的人民，就是我们最广袤的土地和最丰饶的粮仓。\n告诉雪伊同志，愤怒是宝贵的，那是被压迫者最纯粹的力量。但一团火，既可以烧掉敌人的堡垒，也可以用来点亮一盏为夜行人引路的灯，温暖一锅为同志们熬煮的汤。我们相信，你们会用好这团火。\n你们在南方的矿井里点亮了灯塔，我们也在东方的窑洞里点亮了灯塔。一盏灯的光是微弱的，但两盏灯的光遥相呼应，就能让整个黑夜无处遁形。\n期待我们共同看到太阳升起的那一天。\n\n——一个东方的、同样在为理想而战的老兵”\n信读完了，指挥部里一片安静。晓枫的眼眶有些湿润，她小心翼翼地将信纸折好，贴身收起，仿佛那不是一张纸，而是一枚温暖的、跳动着的心脏。\n一旁的雪伊，一直紧握的拳头不知何时松开了。她沉默地走到窗边，望着远方卡卡罗姆山脉漆黑的轮廓，许久，才用几不可闻的声音说：\n“……告诉后勤，把最好的那批压缩饼干，想办法……给她们送过去。”"
LHS.57.a:0"这一轮太阳，将照亮整个世界。" 

LHS.58.t:0"[FROM.GetName]向我们送来了大批装备"
LHS.58.d:0""
LHS.58.a:0"我们的好同志" 

LHS.59.t:0"她们的血不能白流！"
LHS.59.d:0"指挥部的空气凝固了，只剩下电台里传来的、混杂着巨大电流声的沙哑哭喊。最新的情报，如同一块烧红的烙铁，烫在每一个人的心上。\n“……又一座城市陷落了。樱花国的那帮畜生……她们……她们……”情报员的声音因为巨大的悲愤而哽咽，再也说不下去。\n雪伊猛地一拳砸在沙盘上，木屑四溅。她的眼睛红得像要滴出血来，每一个字都像是从牙缝里挤出来的：“屠城……三十万手无寸铁的百姓！她们连孩子都不放过！这帮披着人皮的恶鬼！！”\n她一把抓起桌上的配枪，转身就要往外走：“我现在就去集结部队！把我们所有的炮弹都装上船！我要让那片岛屿，为我们每一个死去的同胞陪葬！”\n“站住！”\n晓枫的声音不大，却带着一种不容置疑的、冰冷的重量。她缓缓地从地图前抬起头，脸色苍白，但眼神却锐利如刀。\n“雪伊，这不是复仇。”她走到雪伊面前，直视着她燃烧着怒火的眼睛，“这是战争。是我们与全人类所有压迫者、所有反动派、所有法西斯之间的，一场你死我活的战争。东方同志的牺牲，不应该仅仅换来我们的怒火，它应该成为我们彻底埋葬旧世界的号角！”\n她转身，目光扫过指挥部里每一个因悲愤而颤抖的同志。\n“她们在孤军奋战，她们在用胸膛抵挡着最凶残的敌人。而我们，不能再隔岸观火！”晓枫的声音陡然拔高，充满了决绝的意志，“传我的命令！以莉兰迪亚公社、以世界革命委员会的名义，向樱花国，宣战！立刻动员我们的革命军、我们的舰队、我们的一切！从今天起，这不再是东方同志的卫国战争，这是我们的战争！”"
LHS.59.a:0"告诉东方同志，我们这就过去。" 

LHS.60.t:0"同志,天儿又亮了"
LHS.60.d:0"窑洞里的油灯，已经燃烧了三天三夜。前线的战报，一份比一份沉重。我们的人民在流血，我们的战士在牺牲，可放眼望去，整个世界似乎都只是冷漠的看客。\n就在这时，通讯员几乎是连滚带爬地冲了进来，她的脸上分不清是泪水还是汗水，声音嘶哑地喊道：“电报！莉兰迪亚…莉兰迪亚公社的加急电报！”\n窑洞里死一般的寂静。所有人都停下了手中的工作，目光齐刷刷地投了过来。\n一位年轻的参谋接过电报，只看了一眼，便再也控制不住情绪，声音颤抖地念了出来：“……莉兰迪亚公社，已向樱花国正式宣战。其革命军第一兵团，已于今晨登船，正向我们驶来……”\n一时间，无人言语。我们这些从枪林弹雨中走出来、早已见惯生死的战士，此刻眼眶却都红了。\n润芝同志沉默地从参谋手中接过那份薄薄的电报，反复看了几遍。她缓缓走到窑洞口，望着外面那片被战火蹂躏的、多灾多难的土地，许久，才用一种无比深沉，却又带着巨大暖流的声音说：\n“……我们不是孤军奋战了。”\n她转过身，目光如炬，扫过在场的每一个人。\n“有些同志，我们素未谋面，却愿意为我们流血。有些国家，远在世界另一端，却愿意把她们的命运，和我们的命运绑在一起。这可不是什么援助，也不是什么施舍。这是信仰！是全世界被压迫者之间，最牢不可破的血肉联系！”\n她将电报高高举起。\n“去！去告诉前线的战士们！告诉后方的老百姓！从南美洲升起的那面红旗，要来和我们的红旗，汇合了！”"
LHS.60.a:0"星星之火，终将燎原！" 

LHS.61.t:0"我来晚了"
LHS.61.d:0"当我们接到通知，说晓枫同志的飞机已经降落时，润芝同志只是平静地带我们来到了这里——这座埋葬了我们无数好兄弟、好姐妹的山岗。\n她来的时候很安静，只带了一名随行的翻译。她从颠簸的吉普车上下来，军装洗得干净，却掩不住眉宇间那份战争留下的、深深的疲惫。她走到我们面前，没有先开口说话，而是从挎包里，小心翼翼地捧出了一小束风干的、南美洲特有的红色小花，轻轻地放在了纪念碑的基座上。\n我们所有人都沉默地向纪念碑鞠躬。\n许久，润芝同志才缓缓开口，她的声音里带着一种历经风霜的温和：“你来了。晓枫同志。这座碑下，还有山里的每一寸土里，都睡着我们的同志。她们，等了你很久了。”\n晓枫抬起头，眼眶微微泛红。她凝视着那块冰冷的石碑，摇了摇头，声音轻得像一阵叹息：\n“不，是我来晚了。”\n短短五个字，让在场所有久经沙场的战士，都感到喉头一阵哽咽。\n她转过身，看着润芝同志，目光坦诚而清澈：“在我们的土地上，我也见过太多这样的墓碑。我总在想，如果我们的火把能早一点汇合，是不是，就会有更多的同志，能亲眼看到今天？”\n润芝同志沉默了片刻，她指着山下那片广袤而宁静的田野，远处炊烟袅袅，有孩子们在追逐嬉戏。\n“这片土地，被血洗过，也被泪浸过。”她的声音深沉而有力，“但它现在是干净的。因为它是我们人民自己的了。那些牺牲，换来了今天这一切，就是值得的。你看......”\n晓枫顺着他手指的方向望去，正好看到一个穿着小棉袄的女孩，正踮着脚，从母亲手里接过一小块晶莹的麦芽糖，笑得眼睛弯成了月牙。\n晓枫脸上的那份沉郁，在那一刻悄然融化了。她露出了一个发自内心的、无比灿烂的笑容。\n“我看到了。”她说，“我看到一个孩子的糖，比我们打仗缴来的所有大炮都更甜。”\n润芝同志也笑了，那是一种欣慰而温暖的笑容。\n“是啊。我们打了半辈子仗，不就是为了能让天底下的娃娃们，都能有糖吃，有书读，能在阳光下自由地奔跑吗？”"
LHS.61.a:0"这片土地上，终于开出了最美的花"

LHS.62.t:0"喇叭的烦恼"
LHS.62.d:0"兵工厂新设立的阅览角总是人头攒动。刚下工的师傅们，有的捧着最新的《机械维修图解》看得入神，有的则挤在一起，对着一本从旧世界收缴来的、讲述骑士与公主的通俗小说指指点点，不时爆发出哄笑。\n刚从大学加入革命的年轻知识分子陈墨，看到这番“混乱”的景象，眉头紧锁地找到了正在和工人们一起研究改良扳手的晓枫。\n“晓枫同志，”他忧心忡忡地压低声音，“您看，我们提供了宝贵的纸张和油墨，可大家似乎更沉迷于那些庸俗的故事，而不是去学习理论，去进行您所说的‘独立思考’。这样放任自流，信息是自由了，可人们会不会变得越来越懒于思考，越来越愚笨？”\n他的话音未落，旁边一位擦着满手油污的老工人李师傅就直起了腰，他浑浊但明亮的眼睛看向陈墨：“小同志，俺问你，啥叫‘独立思考’？”\n陈墨一时语塞：“就是…就是不人云亦云，有自己的判断和见解。”\n李师傅笑了，露出被烟草熏黄的牙齿：“俺不懂那些大道理。俺的‘独立思考’，就是琢磨怎么让这台旧车床少出点废品；是琢磨配给的这点布料，怎么给家里的大小子和二闺女一人做一身过冬的棉衣还能剩下块尿布；是琢磨雪伊同志昨天开会说的话，哪句是真要俺们拼命干，哪句是怕俺们太累了故意说的反话。”\n他拿起那本骑士小说，翻了翻：“俺不识几个字，就爱听大伙儿念这个。听完了，俺们几个凑一起骂那个国王又蠢又坏，讨论那个公主为啥不自己拿起剑。这算不算‘有自己的判断’？你读的那些深奥文章，俺们看不懂，可你要是能用它帮俺们把车床的精度再提高一丝，那它就比俺手里的扳手还宝贵。”\n陈墨的脸涨得通红，正要辩解，晓枫却笑着按住了他的肩膀。\n“听，这多有意思，”她眼角弯弯，像两轮新月，“陈墨，你担心我们会在信息的海洋里迷航，这是警惕，是好事。李师傅，您告诉我们，任何思考都不能离开这双沾着机油的手和滚烫的生活，这是根本，是我们的根。你们为什么要争个对错呢？这本身就是最生动的辩证法呀。”\n她拿起那本艰深的理论书，又拿起那本通俗小说，将它们并排放在一起。\n“一个告诉我们向何处去，一个让我们在路上不至疲惫。陈墨，你要学的是如何让你的知识像李师傅的扳手一样好用。李师傅，或许陈墨的书里，就藏着能让扳手更好用的新道理。我们的广播站，我们的阅览角，从来不是为了宣布一个标准答案，而是为了让你们这样的对话，能在南美的每一个角落里发生。这，比任何一个人的‘独立思考’，都更接近真理。”"
LHS.62.a:0"真理在争论中，也在每个人的手中。"

LHS.63.t:0"管道的辩证法"
LHS.63.d:0"大学哲学系高材生，林文，正经历着他革命生涯中最大的挫败。\n他被派到兵工厂参与“理论下基层”活动，满怀激情地想向工人们普及辩证唯物主义。此刻，他正站在一个巨大的车床前，对着一群满身油污、眼神疲惫的工人，滔滔不绝。\n“同志们，我们必须认识到，矛盾是事物发展的根本动力！生产关系必须适应生产力的发展，这是历史的必然规律！旧的、僵化的生产模式，就是我们当前要克服的主要矛盾……”\n他讲得口干舌燥，但工人们的反应却让他心凉了半截。有人在打哈欠，有人在交头接耳，更多的人则是一脸“虽然听不懂，但好像很厉害”的茫然。\n“林同志，”工厂的老班长，王师傅，终于忍不住打断了他，他指着车床旁一根滴滴答答漏水的老旧蒸汽管道，“你说的那些‘矛盾’、‘规律’，俺们这些粗人听不明白。俺们只晓得，这管子天天漏水，蒸汽跑了，机器就没劲儿，咱们的活儿就干不完。这就是俺们眼前最大的‘矛盾’。”\n林文的脸一下涨红了，他试图解释：“王师傅，我说的不是这个意思，这是一个更宏大的哲学概念……”\n“可饭要一口口吃，活要一件件干啊。”王师傅拧了拧管道上一个锈死的阀门，水漏得更欢了。“你跟我们讲天上的道理，可我们的脚还踩在漏水的地上。你要是能跟我们讲讲，这‘辩证法’能不能帮我们把这根破管子修好，那俺们肯定搬着板凳，熬夜都听！”\n一旁的晓枫不知何时走了过来，她笑着拍了拍林文的肩膀。“林同志，你的理论是好东西，就像一本精准的地图。但你不能站在山顶上，把地图直接摊给山脚下迷路的同志，她们看不清上面的小字。”\n她弯下腰，捡起一个扳手，递给林文，然后转向王师傅：“王师傅，这管子为什么会漏？”\n“老了呗！接口的垫片都脆了，换了新的也不顶用，因为管道本身的热胀冷缩太厉害，新的垫片用不了多久又会裂！”王师傅答道。\n“看，”晓枫对林文说，“‘旧的生产工具（老化的管道）’和‘新的生产需求（持续稳定的蒸汽供给）’之间产生了矛盾，而矛盾的主要方面是‘材料的老化’。这就是你说的理论，对吗？”\n林文恍然大悟地点了点头。\n“那怎么解决？”晓枫又问王师傅。\n“俺们琢磨着，光换垫片是治标不治本。得在管道中间加一段波纹补偿器，让它能自己伸缩，这样接口的压力就小了，垫片也就能用住了！”\n“非常好！”晓枫赞许道，“这就是‘抓住主要矛盾，找到解决问题的关键’。王师傅，你没学过哲学，但你每天都在实践着最深刻的辩证法。”\n她把扳手塞进林文手里，“去吧，林同志。理论的价值，不在于它在书本里有多完美，而在于它能拧紧几颗松动的螺丝，能解决几根漏水的管道。当你和同志们一起把手弄脏，听懂了机器的语言时，你再说出的理论，他们就一定能听懂了。”\n夕阳下，年轻的学者第一次拿起扳手，和工人们一起，向那根“充满矛盾”的管道发起了进攻。"
LHS.63.a:0"从群众中来，到群众中去"

LHS.64.t:0" 纯洁性的审判"
LHS.64.d:0"革命的胜利像醇酒，让一些人沉醉，也让一些人变得狂热。\n在首都最大的广场上，一场自发的“大辩论”已经演变成了危险的对峙。一边，是以青年学者陈康为首的“红色纯洁阵线”，他们高举着标语，慷慨激昂地控诉着。\n“同志们！革命的肌体里绝不容许一丝杂质！”陈康挥舞着手臂，声音因激动而尖锐，“工程部的总工程师罗伯特，他曾为王室设计过桥梁！这样的人，怎能负责我们新铁路的枢纽？这是对牺牲同志的背叛！我们怀疑，委员会内部是否已经有人忘记了鲜血的颜色！”一位在艾瑞波拉血战中失去左臂的独臂老兵沙哑地吼了回去：“放屁！罗伯特那老头子，是为了保住几百个工人的饭碗才留下来的！现在，我们修铁路的图纸，一半都是他熬了三个通宵画出来的！你们这群除了喊口号什么都不会的娃娃，懂个什么！”\n广场的气氛一触即发，双方的支持者开始互相推搡。\n就在这时，人群自动分开了一条通道。雪伊走了进来，她没有走向任何一方，只是静静地站在这场风暴的中心。\n“都很热闹。”她开口了，声音不大，却瞬间压过了所有的嘈杂。\n她首先看向陈康。“你叫陈康？读过很多书。”她语气平淡，“那你来告诉我，革命是什么？”\n陈康一挺胸膛：“革命是彻底的、纯粹的，是为了建立一个完美无瑕的新世界！”\n“说得好。”雪伊点点头，然后她转向那位独臂老兵，“老班长，你来告诉我，革命是什么？”\n老兵看着自己空荡荡的袖管，沉声说：“报告头儿。革命，就是让娃娃们，冬天能有煤烧，出门能走上平坦的路，不用再跟我一样，为了一口饭把命丢在战场上。”\n雪伊的目光回到了陈康身上，那目光像手术刀一样冰冷而锐利。\n“听到了吗？学者同志。当你在讨论一本字典里‘纯洁’这个词的完美定义时，这位同志，和千千万万的同志们，正在用一只手，为这个国家铺设能让孩子们不再挨冻的铁路。”\n她向前走了两步，逼视着陈康：“我问你，你为这条铁路，拧过一颗螺丝吗？搬过一根枕木吗？画过一张能用的图纸吗？没有！你和你的追随者，除了用最革命的词藻去攻击那些正在建设革命的人之外，什么都没做！”\n她的声音陡然拔高，带着不容置疑的威严：“真正的背叛，不是使用一个有技术但历史复杂的工程师！真正的背叛，是在人民需要团结建设的时候，煽动内部分裂！是躲在‘纯粹’的口号背后，享受着别人流血牺牲换来的和平，却对那些辛勤劳动的人横加指责！你们的‘纯洁’，一文不值！”\n雪伊指着广场外正在施工的工地：“从明天起，‘红色纯洁阵线’全体成员，到铁路建设工地报到。你们的岗位，就是搬运石料。什么时候你们的双手磨出的血泡，能让你理解老班长手臂的价值了，什么时候你们再来跟我谈‘革命的纯洁性’。”\n“这是对我们的侮辱！”陈康脸色煞白。\n“不，”雪伊的声音冷得像冰，“这是救赎。是让你们从空洞的口号里，重新变回一个人的机会。至于罗伯特工程师，”她扫视全场，“他的工作由人民委员会担保。谁再敢用谣言干扰工程进度，以反革命破坏罪论处。”\n说罢，她转身离去，留下寂静的广场和一群在狂风中幡然醒悟，或是不知所措的人们。"
LHS.64.a:0"革命的意义是什么"

LHS.65.t:0"日落卡卡罗姆"
LHS.65.d:0"卡卡罗姆山区的拉锯战，终于以野火革命军的惨胜告终。军团的最后一支建制部队在付出巨大代价后被我们全歼。指挥部里，疲惫的战士们刚刚爆发出劫后余生的微弱欢呼，晓枫却猛地推开了地图室的窗户，一股混杂着铁锈和墓土的、令人作呕的甜腻腥气灌了进来。\n“不对劲……”她喃喃自语，脸色瞬间变得煞白，“这味道……太安静了。”\n战场上，本应是尸横遍野，此刻却空无一人。无论是敌我双方的尸体，都消失得无影无踪，只在地上留下一滩滩暗红色的、仿佛被什么东西舔舐过的印记。\n雪伊也察觉到了异样，她冲到瞭望口，举起望远镜。远方的地平线上，莉兰迪亚王都的方向，升起了一片不祥的、沥青般粘稠的黑雾。那黑雾并非静止，而是在以一种超越常理的速度，向着我们的阵地翻涌而来！\n“全军戒备！！”晓枫嘶哑的吼声被一阵非人的、仿佛来自地狱深处的尖啸所淹没。\n黑雾瞬间吞没了我们的前沿阵地。雾中，无数扭曲的身影浮现——那些本该死去的军团士兵，此刻双眼冒着幽绿的磷火，腐烂的身体上穿着破损的军装，机械地举起了手中的武器；更有一些闻所未闻的可怕生物，由无数骸骨与血肉缝合而成的巨兽，咆哮着冲入我们的防线。\n我们的子弹穿过它们的身体，却无法造成任何伤害。而它们的利爪和腐蚀性的唾液，却能轻易地撕开我们的血肉与工事。这是一场彻头彻尾的屠杀。我们的防线在几分钟内就土崩瓦解，英勇的战士们被那些不死的怪物淹没、撕碎。\n指挥部被一头骸骨巨兽撞塌，晓枫为了推开雪伊，被掉落的房梁砸中。雪伊拖着重伤的晓枫，在最后几名亲卫的掩护下，向着最深处的备用矿道撤退。\n“小果子！！”雪伊回头，用尽最后的力气，将怀里那份记录着所有革命火种和未来计划的机密文件，塞进了小果子怀里，“从通风管道走！别回头！活下去！告诉……告诉还活着的人……王室，出卖了整个世界！”\n巨大的爆炸声从身后传来，是亲卫们引爆了最后的弹药库，用生命为她们争取了最后的几秒钟。坍塌的碎石，彻底封死了她们身后的道路，也隔绝了那片人间地狱。"
LHS.65.a:0"革命……失败了吗？"

LHS.66.t:0"最后的信标"
LHS.66.d:0"好黑。\n管道里，除了自己剧烈的心跳和粗重的呼吸声，就只剩下外面隐约传来的、如同噩梦般的咀嚼声和尖啸。\n铁锈和血的味道，还有那股甜得发腻的腐臭，死死地堵在鼻腔里。眼泪早就流干了，现在顺着脸颊滑下来的，是冰冷的、混着灰尘的汗水。\n怀里的这份文件，好重。\n重得像压着两座山。一座叫晓枫姐，一座叫雪伊姐。\n晓枫姐最后看我的眼神，还是那么温柔。她说：“小果子，你是我们最快的风，替我们……去看看黎明吧。”\n雪伊姐……她总是那么凶，可她塞给我文件的时候，那双手，抖得比我还厉害。她吼着让我走，可那声音里，全是哭腔。\n最后的爆炸声，像一把巨锤，砸碎了身后的一切，也砸碎了心。\n为什么……为什么会变成这样？\n我们明明打赢了啊。明明只要再前进一步，就能看到大家一起笑着分面包的场景了。为什么……\n以前在佣兵队里，开着快艇躲避海军炮火的时候，也从没这么害怕过。那时候，就算船要沉了，也知道该往哪个方向游。可现在……四周都是黑暗，没有方向，没有灯塔，什么都没有。\n“……活下去。”\n是啊，活下去。\n可……然后呢？\n这小小的管道，就是革命最后的世界了吗？\n外面是吞噬一切的怪物，身后是两位姐姐用生命封死的墓碑。\n好想……好想再听晓枫姐讲那些星星的故事，再被雪伊姐凶巴巴地塞一个烤红薯啊……\n打火机的火苗，“噗”地一下，灭了。\n彻底的黑暗，降临了。"  
LHS.66.a:0"…天，还会亮吗？"

LHS.67.t:0"微弱的信号！"
LHS.67.d:0"发现了一个有回应的信号源！"  
LHS.67.a:0"向信号源派出信使"

LHS.68.t:0"只有静默"
LHS.68.d:0"没有收到任何回应。"  
LHS.68.a:0"至少我们排除了一个错误的方向"

LHS.69.t:0"意外的发现"
LHS.69.d:0"不仅找到了信号，对方还保留了一部分旧野火的物资！并愿意加入我们。"  
LHS.69.a:0"太好了"

LHS.70.t:0"同志，我们找到你了！"
LHS.70.d:0"我们成功与失散的同志取得了联系！"  
LHS.70.a:0"太好了"

LHS.71.t:0"那她们呢？"
LHS.71.d:0"船舱随着海浪轻轻摇晃。\n刚刚从白城地下抵抗组织里被我们救出来的几位老同志，正狼吞虎咽地吃着热汤和黑面包。为首的老奶奶，曾是公社磨坊的负责人，她布满皱纹的手，紧紧抓着我的手，像是抓住了最后一根救命稻草。\n“好孩子…好孩子…”她浑浊的眼睛里，重新燃起了光，“我就知道，我就知道你们会回来的！”\n大家的情绪都很激动，七嘴八舌地诉说着白城在亡灵统治下的恐怖，以及她们是如何艰难地组织起抵抗。\n“有了你们在海上接应，我们就有底气了！”一位断了条胳膊的老工人激动地说，“只要我们里应外合，把那帮不死的怪物赶出莉兰迪亚，就有希望了！”\n气氛越来越热烈，仿佛胜利的曙光已经照进了这小小的船舱。\n突然，那位一直握着我手的老奶奶，用一种充满期盼的、小心翼翼的眼神看着我，轻声问道：\n“那……晓枫同志和雪伊同志呢？她们还好吗？等我们夺回了白城，她们是不是……就会回来了？”\n一瞬间，船舱里所有的声音都消失了。所有人的目光，都聚焦在了我的身上。那目光里，有期盼，有信任，有她们坚持至今的所有理由。\n我看到她们眼中闪烁的星光，那些都是绝不能熄灭的火焰。\n我笑了。不是那种悲伤的、勉强的笑，而是像当年在甲板上看到鱼儿跃出水面时，那种发自内心的、灿烂的笑。\n“奶奶，”我用一种轻松得近乎调皮的口吻，凑到她的耳边，悄悄说道：\n“她们当然会回来。不过……晓枫姐嫌我们动静太小，说要等我们闹得够大，才肯出来收拾残局。雪伊姐嘛……她大概是觉得，只有把索拉娜的王座搬到船上来，才配得上她亲自出场吧？”\n老奶奶愣住了，随即，她那布满皱纹的脸上，绽开了一个比哭还难看、却无比真实的笑容。船舱里，重新响起了充满希望的、压抑的笑声和啜泣声。\n没有人再问了。"  
LHS.71.a:0"是啊，会回来的"

LHS.72.t:0"涟漪的颜色"
LHS.72.d:0"计划成功了。\n索拉娜被彻底激怒，就像我预想的那样。她派出了最精锐的搜捕舰队，在南方的海域上疯狂地寻找着我们这群“海盗”的踪迹。\n而我们，则早已像幽灵一样，悄然转移到了另一处隐秘的峡湾。那艘承载着所有希望的救援船，就静静地停泊在湾内。船上，是从故土逃出来的、我们第一批救下的同志。那位老婆婆，还笑着说等靠岸了，要教我怎么用海带编好看的绳结。\n一切，都在我的计算之中。\n直到那阵雾，毫无征兆地从海面上涌来。\n那不是普通的海雾。它带着一股能让灵魂都冻结的、甜腻的腐臭，粘稠得化不开。通讯器里瞬间充满了刺耳的杂音，视野里的一切都变得模糊。\n然后，是尖叫声。\n不是从岸上，而是从那艘船上传来的。\n我疯了一样举起望远镜，透过那片死灰色的浓雾，我看到了……我看到了那些湿滑的、扭曲的黑影，如同从海底爬出的噩梦，无声地攀上了船舷。它们没有武器，它们的爪牙和身体，就是最可怖的武器。\n灯光一盏盏熄灭，惨叫声被浓雾和海浪声迅速吞没。我的队员们嘶吼着向浓雾中的船只开火，可子弹打在那些影子上，就像泥牛入海。而那些怪物，它们甚至懒得理会岸上的我们，它们的目标，只有船上那些手无寸铁的活人。\n在望远镜的视野里，我最后一次看到了那位老婆婆。她正被一个黑影拖拽着，脸上没有恐惧，只有一种深深的、看着我的、无法理解的困惑。仿佛在问，为什么？\n然后，那片燃烧的残骸上，就再也没有了任何生命的气息。\n雾散了。我的身边，倒下了十几个最勇敢的战友，她们是为了掩护我，被从雾中扑出的零星怪物杀死的。\n海风吹来，带着烧焦的木头和血的味道。我缓缓走到水边，冰冷的海水漫过我的脚踝。一块烧得焦黑的、船上的木板，漂到了我的脚边。\n我的计划……成功了。\n索拉娜的注意力，被我成功地吸引到了海上。内陆的同志们，或许真的因此得到了喘息之机。\n我扔下的那块石头，在死水般的湖面上，确实惊起了涟漪。\n……原来，是红色的。\n我听见自己在对身边幸存的队员下达命令，声音很平静，很清晰，像在谈论一块与我毫不相干的石头。\n“打扫战场，收敛同志们的遗体。统计损失，我们……继续。”"  
LHS.72.a:0"……我们，继续"

LHS.73.t:0"逐渐灰暗的心"
LHS.73.d:0"自从那次……惨剧之后，一些东西好像在我身体里坏掉了。\n我不再做梦了。睡觉变得像关闭一个开关，醒来又是另一个。我的队员们看我的眼神也变了，带着一种……我看不懂的，混合着敬畏与恐惧的情绪。她们说，我的命令越来越简短，越来越精准，也越来越……冷。\n我只是觉得，多余的情感，是会害死人的。\n就像现在，我们成功了。我们炸毁了亡灵在三个州的沿海通讯枢纽，她们的海岸巡逻队现在乱成了一锅粥。这是一个巨大的胜利，按照晓枫姐的风格，现在应该和大家一起喝一杯庆祝。\n可我……什么都感觉不到。\n我的脑子里，只有一张更大的、布满了更多红点的海图。下一个目标，下一个弱点，下一个……可以付出的代价。"  
LHS.73.a:0"……这样，就不会再痛了"

LHS.74.t:0"回音"
LHS.74.d:0"内陆的同志们，忠实地执行了我的命令。\n在白尘界，她们炸毁了亡灵的骸骨仓库。\n在艾瑞波拉，她们袭击了索拉娜的巡逻队。\n在每一个我指定的坐标，她们都准时地点燃了自己。\n我的海图上，敌人的主力部队疲于奔命，巨大的防御空洞如我所料地出现了。战术上，我取得了前所未有的成功。\n电台里，曾传来她们最后的声音。\n“禾果同志……我们……可能等不到你们了。但是，能让那帮怪物付出代价……值得了！”\n“告诉活着的人，我们是笑着冲锋的！”\n“……野火，永存。”\n然后，就是一片死寂。\n我静静地听着那一片滋滋作响的、永恒的杂音，脸上没有任何表情。身后的队员想走过来安慰我，却在我冰冷的注视下，默默地退了出去。\n我成功了。\n我用她们的生命，换来了胜利的方程式。\n我……亲手，扑灭了那些我曾拼命想要守护的火焰。\n原来，这就是胜利的味道。\n像嘴里塞满了冰冷的铁砂。"  
LHS.74.a:0"……下一个目标"

LHS.75.t:0"盛宴的开幕"
LHS.75.d:0"大陆在震动。\n潜望镜的视野里，整个天空都变成了一种肮脏的紫色。我的斥候用加密频道传来了最后的报告——那些被我唤醒的、更古老的怪物，正像一片无可阻挡的怒潮，从地底，从废墟，从每一个被遗忘的角落里涌出，与索拉娜的亡灵军团，疯狂地撕咬在一起。\n我的计划……成功了。\n我成功地，将这片我曾发誓要夺回的土地，变成了一座献给所有死者的、巨大而华丽的舞台。\n晓枫姐曾对我说，我们战斗，是为了有一天，这片土地上再也不会有“必要的牺牲”。\n可我……却把所有能牺牲的东西，都当作筹码，扔上了赌桌。\n我看见，索拉娜的军队，那些曾经屠戮我们同志的刽子手，如今正被更深沉的黑暗所吞噬；我看见，她最精锐的禁卫军，正被迫从王都的城墙上撤下，去填补那永无止境的、由我亲手撕开的防线缺口。\n她所有的注意力，都被这场由我导演的、盛大的死亡盛宴所吸引。\n她最空虚的时刻，到来了。\n我缓缓地，从潜望镜后抬起头，指挥舱里只有仪器发出的、单调的嗡嗡声。周围的队员们都在看着我，等待着我的下一个命令。她们的眼神里，没有狂热，只有一种追随着我、一同沉入深渊的、平静的觉悟。\n我没有去看她们，只是拿起通讯器，声音平静得连我自己都感到陌生。\n“航向……正前方。”\n“目标，索拉娜的王宫。”\n我看见潜望镜的十字准星，已经牢牢地套住了那座在混乱与毁灭中，显得格外孤单的、最高的尖塔。\n“宴会的前菜已经上完了。现在……该请今晚的主角，登场了。”"  
LHS.75.a:0"这是……我们唯一的机会"
