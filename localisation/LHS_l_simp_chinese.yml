###设定
LHS_GATHERING_STORM_DESC:"当洛维尼亚王室用黄金与谎言腐蚀整片大陆时，卡卡罗姆山脉的冻土却深埋着革命的尸骸。1927年，前任军团长率领佣兵团倒戈支援南美革命，却在1935年中遭到王室特工毒杀。佣兵团高层被重组为“洛维尼亚国防委员会”直属武装，以清除“失控的左翼毒瘤”为名，向赤卫队据点发动了惨绝人寰的灭绝行动。\n\n时任参谋长的晓枫在最后一刻率领二十三个步兵联队发动兵变。她们在艾瑞波拉血巷顶住三倍于己的镇压部队冲锋，用缴获的十门野战炮炸塌峡谷隘口，为撤入卡卡罗姆山脉的数千名工人争取到了大量时间。\n\n残存的起义者在废弃矿井中宣布成立“野火革命军”，晓枫将前任军团长染血的皮带扣挂在矿井支柱上，镰锤标志第一次与军团鹰徽并列。\n\n卡卡罗姆的矿井成为革命熔炉，但危机始终如影随形——佣兵团残部被王室收编为“剿匪特遣队”，准备在三个月后进行下一次的围剿,而矿井中的粮食储备仅能维持数月..."
