LHS_nanmeiziyuan_desc: "这片大陆，古老而慷慨。在安第斯山脉的崇山峻岭之中，在亚马逊雨林潮湿的土壤之下，沉睡着足以驱动整个国家未来的宝藏。我们不能再满足于开采那些祖辈留下的、唾手可得的矿脉了。现在，是时候派出我们最勇敢的地质学家和工程师，深入那些未曾被现代文明踏足的腹地，去倾听大地深处的低语，去寻找那些隐藏在岩石与密林中的、沉睡的财富了。"
