LHS_liangshi: "断粮危机"
LHS_Comintern_appropriations: "共产国际的援助"
LHS_Comintern_appropriations_desc: "§g“那天的雾，很大。大到……分不清哪里是海，哪里是天。§!\n我们的小船，像一片孤独的叶子，在灰色的、没有尽头的迷茫里，飘着。晓枫姐她们……刚刚退进那片冰冷的大山，生死未卜。而我的任务，是去寻找一条……根本不存在的、能为她们带回希望的航路。\n无线电里，只有一片死寂的、沙沙的杂音。\n就在我快要连最后一丝力气都失去的时候……我看到了它。\n§9一盏灯。§!\n一盏……在浓雾中，顽强地、透出一点点微弱的红色光芒的灯。\n我以为，是幻觉。是人在绝望的时候，自己骗自己的东西。\n可那盏灯，越来越近，越来越清晰。然后，我看到了……一艘巨大的、我从未见过的钢铁巨轮，像一座沉默的山，从雾中，缓缓地，向我驶来。\n它的旗杆上，飘着一面……我从未见过的、却又无比熟悉的旗帜。那上面，有镰刀，有锤子，还有一颗……比我见过的任何一颗星星，都要明亮的、红色的星星。\n她们用探照灯，打出了我看不懂的信号。可她们的船员，在看到我船舷上那面被海风吹得破破烂爛的、小小的野火旗时，都脱下了帽子，向我，这个……又瘦又小的、异国的‘小海盗’，致以了最庄严的、同志的敬礼。\n我不知道她们是谁，也不知道她们从哪里来。\n我只知道……\n§9在这片无边无际的、冰冷的浓雾里，我们，不再是……一个人了。”§!"
LHS_liangshi2: "北方的援助"
LHS_liangshi2_desc: "得益于莉兰迪亚公社的援助，我们的粮食危机问题缓和了不少！"
