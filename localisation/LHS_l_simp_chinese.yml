#雪伊经济线
LHS_xueyijianshe: "雪伊的建设"
LHS_xueyijianshe_desc: "能吃饱、能穿暖，若不能先建立在如何从敌人的枪口下活下来的基础上，都只是空口说大话而已。"
LHS_jianzao: "战时建设计划"
LHS_jianzao_desc: "战火与硝烟随时都在空气中弥漫着，衣食温饱在敌人指在脑门的枪口面前显得微不足道。\n至少等先解决了敌人，才能决定自己会不会饿死。\n§R大不了，大不了就吃她们的肉！喝她们的血！§!"
LHS_chanxian: "特殊产线改造"
LHS_chanxian_desc: "战场是随时都在变化的，为了应对不同的战况，战士们所使用的武器也应该要做到灵活变换。\n因此，我们必须要将生产线时刻保持在一种灵活多变的状态下。"
LHS_buqianggaizao: "步枪产线整改"
LHS_buqianggaizao_desc: "我们的步枪供应还有很多缺口，甚至可以说大多数的枪都是从敌人手里缴获而来的，根据战局作出相应的步枪产线整改是很有必要的。"
LHS_qinghuopao: "轻型火炮"
LHS_qinghuopao_desc: "火炮的好处有很多，可它过于笨拙了，带上它我们将很难执行如晓枫说得包围穿插战术，所以，必须想办法改造出更轻便，更迅捷的火炮。\n哪怕这意味着要牺牲掉它的火力与可靠性。"
LHS_niaoer: "空中的鸟儿"
LHS_niaoer_desc: "“如鹰击长空”"
LHS_yuer: "水中的鱼儿"
LHS_yuer_desc: "“如鱼翔浅底”"
LHS_tank: "钢铁之师"
LHS_tank_desc: "很好，只要有了这群大铁疙瘩，管她什么王室亡灵殖民者，冲过去碾死她们就完事了！"
LHS_tielu: "我们的铁路"
LHS_tielu_desc: "跟晓枫钻了几年矿道，公社的人闭着眼都能摸清岩层走向，要说铺铁路，我们再擅长不过了。"
LHS_gonglu: "公路建设"
LHS_gonglu_desc: "好的行军离不开好的路，人民百姓的生活亦是如此。"
LHS_chuanwu: "船坞大建"
LHS_chuanwu_desc: "我们能造船的地方实在是太少了，少得要命，为了能与世界接轨，能保卫我们的海域不受殖民者侵犯，必须大力建设我们的船厂。"
LHS_sheshi: "紧急特殊研究计划"
LHS_sheshi_desc: "光有大炮肯定不够，我们要的目的彻底根除一切敌人，要把她们轰得连渣都不剩！\n所以，必须用尽一切办法加快我们的地面武器的研究！"
LHS_quanminjianshe: "全民建设热潮"
LHS_quanminjianshe_desc: "战火终于平息，我们从殖民老爷们手里拿回了我们该有的一切。\n现在，终于可以把心放在建设祖国的事业上了，来，为了你我的幸福，为了大家的幸福。\n工人们，行动起来！包括你，也包括我。"
LHS_ziyuan: "矿道里有什么？"
LHS_ziyuan_desc: "当然是矿物啦，我们在矿道里摸爬滚打了这么久，太熟悉了。"
LHS_ziyuan2: "矿道里有什么？"
LHS_ziyuan2_desc: "当然是矿物啦，我们在矿道里摸爬滚打了这么久，太熟悉了。"
LHS_zuiduo: "我们拥有什么？"
LHS_zuiduo_desc: "毫无疑问，依旧是矿物，哪怕放眼整个世界。"
LHS_shiyou: "我们缺少什么？"
LHS_shiyou_desc: "是石油，很多的石油，数不清的石油。"
LHS_hhjj: "资源互助协会"
LHS_hhjj_desc: "同志们，仅仅是靠一国的独大是难以实现真正的社会主义的，哪怕资源再多也无济于事。\n因此，我们必须互相帮助，分享彼此之间的资源，才能共同迈向真正的共产主义社会。"
LHS_zyyj: "关注资源研究"
LHS_zyyj_desc: "哪怕拥有再多资源，不知道如何开采发掘它们的话就都是虚的。\n所以，我们必须更进一步关注合成资源发掘的研究项目。"
LHS_jssy: "建设炼油厂"
LHS_jssy_desc: "经过长时间的石油采购，我们的石油供应终于略显充裕了。\n为此，是时候建设起我们自己的炼油厂了。"
 #军事
LHS_zhihui: "再次指挥"
LHS_zhihui_desc: "好的军队离不开好的领导与指挥，简单的道理。"
LHS_youji: "野火游击队"
LHS_youji_desc: "敌人的实力相比我们强大很多。\n对此，我们必须组建一批能够不断骚扰敌人又能快速全身而退的队伍。"
#晓枫军事线
LHS_xiaofengzhanshu: "晓枫的指挥"
LHS_xiaofengzhanshu_desc: "\n别问火把能照多远，先问我们是否一同举起。"
LHS_lwnyyouji: "革命游击队"
LHS_lwnyyouji_desc: "她们害怕的不是我们的枪声，而是回荡在贫民窟、矿区、村庄上空，那比枪声更嘹亮的，千万人同声呐喊的意志！"
LHS_xiaobuwu: "“小步舞”战术"
LHS_xiaobuwu_desc: "通过持续不断的、低强度的多方向袭扰，以最小的自身代价牵制、消耗和瓦解优势敌人，\n这种战术就像迈开小步的舞蹈，却能给予敌人的士气当头一棒。"
LHS_yjzs: "夜间作战"
LHS_yjzs_desc: "夜间运动是游击队另一个重要的特点，这可以使游击队进入攻击位置，并在一个有可能存在遭出卖危险的新区域把队伍组织起来。"
LHS_zxdy: "战士的遗志"
LHS_zxdy_desc: "游击队战士死后，决不能把武器弹药留在他们身边。每当有伙伴倒下了，每个游击战士都有责任马上捡回这些极度珍贵的斗争物资。"
LHS_lhzz: "灵活作战"
LHS_lhzz_desc: "游击战士的另一个基本特点是灵活性，即适应任何环境，变行动中的所有意外为有利条件的能力。"
LHS_cqby: "出其不意地进攻"
LHS_cqby_desc: "游击部队进攻的形式也是与众不同的。发起攻击时要出其不意，势头猛烈，毫不留情，然后突然间偃旗息鼓。\n残余之敌惊魂稍定后，以为进攻者已经离开了，于是开始放松，在其被围困的地点内恢复平常生活，这时一轮新的进攻突然又在另一个地方打响。"
LHS_pohuai: "破坏行动"
LHS_pohuai_desc: "破坏行动是非常重要的。在破坏和恐怖主义之间必须要作出明确的区分，前者是一种革命的和富有效率的战术手段，而后者一般而言并不奏效，对其结果也不加选择，它往往使无辜的人民成为牺牲品，而且它所毁灭的许多生命对于革命来说是很有价值的。"
LHS_dilei: "预设埋伏"
LHS_dilei_desc: "在公路边设埋伏，引爆地雷并消灭幸存者的战术对于获取武器弹药是最划得来的。惊慌失措的敌人无法使用他们的弹药，也没有时间逃跑。因此，只要付出一小部分弹药就能取得极为可观的结果。"
LHS_zhtl: "炸毁铁路"
LHS_zhtl_desc: "敌人最弱的地方在于公路和铁路交通。要想守卫住一条交通线——公路或铁路——的每一米几乎是不可能的。在任何一个点上都可以放置大量的炸药，使道路无法通行。除了切断道路之外，在交通工具经过时引爆炸药，会给敌人造成很大的生命与物质上的损失。"
LHS_yinni: "隐匿行军"
LHS_yinni_desc: "空军在一支现代的正规军中是最受青睐的兵种，被认为是一支具有决定意义的力量。然而，在游击战争的早期它是没有用武之地的，因为游击队活动在地势崎岖的地区，而且很少会有大的集结。空军只有在对可见的、有组织的防御进行系统打击时才有效，这就要求必须有大量的人集结在一起修建防御工事才行，而这在游击战中是根本不存在的。飞机也只有对付在平地或没有遮蔽的地方排着整齐的队伍行军的部队时方显其强大。不过，这一弱点可以轻易地回避掉，只要在夜里行军就行了。"
LHS_xjzz: "游击行军准则"
LHS_xjzz_desc: "如何对待游击队活动区域内的人民是游击战术的一个重要部分。如何对待敌人也很重要。在进攻的时候，定下的准则必须要不折不扣地执行，对于所有诸如告密和暗杀等可耻行径要严惩不贷，而对那些为了履行她们的军事职责——或以为她们是在履行职责——而投入战斗的敌方士兵则务必要展现最大可能的仁慈。"
LHS_qhdd: "强化军队道德水平"
LHS_qhdd_desc: "在尚未取得重要的活动根据地并且没有攻不破的防御阵地时，不留俘虏是一个很好的政策。对战斗中幸存的敌方士兵应当予以释放。对伤员要按行动时所有能得到的资源予以照顾。和老百姓打交道要尊重当地的风俗和传统，要通过实际行动让她们清楚地感到，游击战士的道德水准是高于压迫者政府的士兵的。"
LHS_qzzc: "从群众中来"
LHS_qzzc_desc: "游击战争是群众的战争、人民的战争，对这一点加以强调是很重要的。游击队作为一个武装的核心，是人民的战斗先锋。它的伟大力量正是来自于人民大众本身。不能仅仅因为武器装备处于劣势，就认为游击队逊于其对手。虽然使用游击战争的一方用于抵抗压迫的武器装备非常有限，但却得到了大多数人的支持。"
LHS_rmzd: "为人民而战"
LHS_rmzd_desc: "正如在一场现代战争中指挥一个师的将军不用死在士兵们面前一样，游击战士作为他自己的将军也不用非得在每场战役中死去。游击队员随时愿意付出生命，游击战的一个优点就是，虽然每个游击战士都愿意去死，但他或她的死决不仅仅是为了捍卫一个想法，而是要使那个想法变成现实。这就是游击斗争的精髓。"
LHS_rmwz: "人民的武装"
LHS_rmwz_desc: "同志们，我们不能总让最勇敢的人用胸膛去迎接子弹。我们从人民中来，获得了无穷的力量，现在，我们也要用这股力量，为人民锻造出最坚固的盾和最锋利的剑。这些钢铁、引擎和炮管，它们不是冰冷的战争机器，它们是我们意志的延伸，是保护每一个村庄、每一座工厂、每一个家庭的誓言。"
LHS_lddb: "流动的堡垒"
LHS_lddb_desc: "我们的革命根植于每一寸解放的土地，我们必须守护好她。这支重型装甲部队将成为人民最坚实的移动防线。她们或许不追求极致的速度，但她们的正面坚不可摧。每一辆坦克都是一座堡垒，她们将稳步推进，巩固战线，在我们身后构建起一片绝对安全的后方，让工厂的烟囱安心地冒烟，让田野的麦苗茁壮地生长。"
LHS_tjhl: "铁甲的洪流"
LHS_tjhl_desc: "进攻是最好的防御。 如果说游击队是刺入敌人肌体的无数根针，那这支铁甲洪流就是撕开敌人主动脉的利刃。我们要将游击战的精髓注入到坦克的履带中，以闪电般的速度席卷平原与山谷，穿插、分割、包围，在敌人反应过来之前，将革命的旗帜插遍她们的指挥部。让敌人永远在我们的身后疲于奔命！ "
LHS_rmtq: "人民的铁拳"
LHS_rmtq_desc: "为何要做出选择？人民的需要是全方位的。我们将组建一支由中型坦克为核心的混成装甲部队，既要有攻坚的重量，也要有穿插的速度。她们是多面手，是能应对任何复杂战况的铁拳。在城市，她们能提供精准的步兵支援；在野外，她们能展开迅猛的突击。这支部队的战术手册将由前线的战士们亲自书写，因为最了解战场的人，永远是人民自己。"
LHS_tkyh: "人民的援护"
LHS_tkyh_desc: "我们的飞行员，不是为了空战的荣誉，而是为了保护地面的每一个同志。每一架盘旋的战机，都是地面部队抬起的眼睛和伸出的臂膀。我们要专注于对地攻击，像外科手术一样精准地拔除敌人的碉堡与炮群，为冲锋的步兵扫清障碍。 天空将不再是威胁，而是我们最可靠的掩护，是人民军队战斗序列中不可或缺的一环。 "
LHS_rmys: "天空的鹰隼"
LHS_rmys_desc: "我们不能总在阴影中行军和建设。 人民需要看到没有恐惧的、清澈的蓝天。我们要成为天空的猎手，打造一支强大的战斗机部队。 我们的任务只有一个：将所有敌人的铁鸟从我们的领空彻底清扫出去！我们要夺取制空权，让阳光毫无遮拦地洒在我们新生的共和国之上，让敌人的侦察机和轰炸机成为废铁。 "
LHS_hsxg: "红色信鸽"
LHS_hsxg_desc: "天空的价值，不仅在于战斗。我们将发展一支以运输机和侦察机为主的战略空军。 她们是“红色的信鸽”，能将我们的精锐部队和宝贵物资，跨越山脉与河流，直接投送到最需要的地区。她们能带回最准确的情报，让敌人无所遁形。 战争的胜利，不仅取决于谁的拳头更硬，也取决于谁能更快、更准地将力量投送到决定性的地点。 "
LHS_haws: "海岸卫士"
LHS_haws_desc: "我们的海岸线漫长而富饶，人民的劳动果实决不能再被海上的强盗肆意劫掠。我们将组建一支由潜艇、驱逐舰的近海防御舰队。她们是“海岸的卫士”，是潜伏在波涛之下的海上游击队。她们将用鱼雷和深水炸弹，为我们的海上贸易线织成一道无形的钢铁屏障，让任何胆敢侵犯我们海疆的敌人有来无回。"
LHS_hsjd: "红色舰队"
LHS_hsjd_desc: "革命的浪潮不应被海洋阻隔。在世界的另一端，还有无数同志在黑暗中战斗，她们的呼声我们必须回应。我们将着眼于未来，建造一支能够远涉重洋的“红色舰队”。战列舰乃至航空母舰，将成为我们连接世界革命的桥梁，是承载着解放意志的方舟。我们要让这抹红色，成为全世界被压迫民族眼中希望的颜色。"
LHS_rmdh: "人民的海"
LHS_rmdh_desc: "大海本身，就是人民力量的延伸。我们将发动沿海的渔民、工程师和水手，将无数艘民用船只改造、武装起来，形成一片汪洋大海般的人民海军。主力战舰作为核心，无数武装渔船、快速炮艇作为血肉，我们将用属于人民的汪洋大海，淹没一切来犯之敌。敌人的舰队再强大，也终将被这片无穷无尽的“人民之海”所吞噬。"
#雪伊军事线
LHS_xueyizhanshu: "雪伊的领导"
LHS_xueyizhanshu_desc: "\n战士，本就该不畏险阻，夺回本该属于她的一切。"
LHS_youqi: "赤色骑兵"
modifier_unit_youjibudui_design_cost_factor:"£GFX_PAO_youjibudui 革命游击队单位编成花费"
LHS_youqi_desc: "晓枫的骚扰战术帮助了我们很多，但仅仅停留于此是不够的。\n在此基础上，深入敌后，主动出击，在敌人还未察觉时，与前线部队一起快速包夹敌人，从根本上剿灭她们，才能彻底消灭她们的有生力量。"
LHS_mofashaonv: "接纳魔法少女"
LHS_mofashaonv_desc: "魔法少女们！听着！\n你们过去被迫当刀子，为该死的愿望，砍杀、流血！今天，那把悬在你们脖子上的镰刀，我们砸烂了它！\n这里，没有哄骗你们的外星兔子，只有等着开垦的盐碱地和需要盾牌保护的同胞！愿意的，留下！\n干好了，奖励红星徽章！干砸了，老娘亲自带你们加练！但记住，从归队这天起，你们不再是消耗品，是扛起未来的同志！"
LHS_zongjie: "延续晓枫战术"
LHS_zongjie_desc: "记得矿道里晓枫总举着油灯，手指划过岩壁上的标记：“这处薄，声音传得远；那裂缝通着旧风井，能绕后。“她那些磨破边的地图，教会我用矿脉当耳朵，把废巷道变成绞索。现在她画的每条虚线都刻在我脑子里，莉兰迪亚的石头就是我们的刀。别辜负她。活着，继续前进。"
LHS_zhengming: "为前佣兵正名"
LHS_zhengming_desc: "当年艾瑞波拉血巷，是这群佣兵用身体堵住隘口。\n卡卡罗姆断粮时，是她们饿着肚子把缴获罐头全分给工人孩子。现在谁再骂“走狗”，就让她去翻战报，野火革命军的第一把火，就是这群“叛徒”用命点着的！"
LHS_hongguozhihai: "红果开海"
LHS_hongguozhihai_desc: "有了这片“红果之海”，我们的家园才能像熟透的果子一样，不再被觊觎和掠夺，安稳地挂在枝头。"
LHS_haijun: "莉兰迪亚红海军"
LHS_haijun_desc: "若再有海上强盗来犯，呼唤我们的名字。"
LHS_haijunchuji: "主动出击"
LHS_haijunchuji_desc: "要想让敌人沉入海底，最高效的方法就是先一步主动出击。"
LHS_haijunjingzhun: "精准打击"
LHS_haijunjingzhun_desc: "哪怕威力再大的舰炮也得打得准才行。"
LHS_haijunbubai: "永不言败的红海军"
LHS_haijunbubai_desc: "我们背负了很多，于是我们永不言败。"
LHS_fengxuetieqi: "枫雪铁骑"
LHS_fengxuetieqi_desc: "说什么蠢话！建坦克厂明明是因为晓枫那混蛋的战术手册还在我枕头底下发烫，有了坦克当然什么战术都好说。以及，现在那群臭要饭的殖民者还躲在城墙后面笑我们没坦克没重炮呢。\n笑啊！等老娘的履带碾塌她们的石头城堡的时候，有她们哭的。"
LHS_hongjun: "莉兰迪亚红军"
LHS_hongjun_desc: "我们捍卫的是人民，我们的枪口指向人民的敌人。"
LHS_hongjunsudu: "疾速行军"
LHS_hongjunsudu_desc: "快！再快！\n快在敌人还未反应过来之前！\n包围她们,\n追赶她们,\n剿灭她们！"
LHS_hongjuntuanjie: "团结的人民永远不会被击溃"
LHS_hongjuntuanjie_desc: "起来，战斗，人民走向胜利！"
LHS_xueyinghangkong: "雪莺展翅"
LHS_xueyinghangkong_desc: "小东西，飞得快，叫声好听，啄人可疼。"
LHS_xueyingxiaodui: "雪莺小队"
LHS_xueyingxiaodui_desc: "雪莺一号同志，雪莺二号同志！你问我为什么我们的航空队会叫这种名字？因为我喜欢，啊不对，是大家都喜欢。\n连一个站出来对这个名字提出过意见的人都没有，这跟我一贯强硬的态度有很大关系，或许...该轻点声跟同志们说话了。"
LHS_xueyingkuobian: "扩大飞行编队"
LHS_xueyingkuobian_desc: "你见过飞机吗？\n没有？\n谁见过飞机？\n见过飞机的都过来,见过飞机就行。"
LHS_xueyingxunlian: "加强飞行训练"
LHS_xueyingxunlian_desc: "学会了怎么让飞机飞上天之后，就该考虑怎么让飞机把敌人全都轰烂了。"
LHS_xueyingtiankong: "莺之天空"
LHS_xueyingtiankong_desc: "天空从不属于某个人，亦从不属于任何一个国家，它一直在那里，在那里等着所有的一切像雪夜中的莺群一样展翅高飞。"
####事件####
LHS.1.t: "秘密来信？"
LHS.1.d: "雪伊同志：\n\n你看到我的名字时，或许已经把这封信揉成一团，准备丢进火里了。请先别这么做。\n我叫晓枫。1934年，莉兰迪亚，我曾是“军团”的一名参谋。我看见过你和你的同志们，看见过那面由工人的围裙和头巾缝成的旗帜。我也看见了……军团的炮火，是如何将它，连同举着它的那些勇敢的人，一同撕碎的。\n那场“胜利”，是我发动兵变的开始，也是我们如今被困在这座冰冷矿井里的原因。\n现在，当初碾碎你们的同一支“军团”，正在我们头顶巡逻。我们仅存的粮食，快要见底了。我手下的士兵——那些同样无法忍受将枪口对准同胞的战士们，正把最后一点玉米糊，省给队伍里的伤员和孩子。\n我写这封信，不是在请求你的原谅，那是我永远不配得到的东西。我只是想告诉你，我们有着同一个敌人，也怀着同一个梦想——一个不再有孩子挨饿、不再有工人被屠杀的世界。\n我们这里的老矿工常说，地底最深处的两簇煤火，如果能靠在一起，就能烧得更旺，足以熬过最漫长的寒夜。\n雪伊，我不是以一个同志的身份在请求。我是以一个…同样在黑夜里挣扎、不愿让火焰熄灭的人的身份，向你借一捧火。你送来的每一粒米，都会变成我们砸向旧世界的一块石头。\n\n                                                                                                 ——————晓枫\n[?global.date.GetDateStringNoHour]"
LHS.1.a: "军团？同志？"

LHS.2.t: "雪伊的回信"
LHS.2.d: "晓枫：\n\n你的信，我收到了。每个字，都像一块烧红的烙铁，烫在我留下的旧伤疤上。\n你提到了莉兰迪亚。很好。这至少证明你不是一个懦夫。你还记得那面旗帜，记得那些倒在军团炮火下的同志们。她们的名字，我都还刻在心里，一个也没忘。\n你向我借火？你凭什么认为，我会把我们仅有的柴火，分给一个手上沾着我们同志鲜血的人？就凭你现在也被同一群恶狗追咬？\n我把你的信，读给了磨坊里幸存下来的姐妹们听。她们沉默了很久。然后，一个在那场巷战中失去了丈夫的姑娘，站了起来。她走到粮仓前，默默地开始装袋。\n她说：“我们不能让卡卡罗姆的孩子，也尝到我们孩子当年尝过的滋味。”\n粮车，已经上路了。车上装的，是我们从牙缝里省下来的粮食。每一粒米，都混着我们对军团的仇恨，和对这该死世界的诅咒。\n我不是在原谅你。永远也不会。\n我只是，不想让那些同样不愿屈服的孩子和战士们，死在我们共同的敌人手里。我只是，不想让那些屠夫们，在清剿完你们之后，能笑着说，革命者，只会互相仇视。\n包里，有些草药。是当年我们在废墟里，用来给伤员吊命的东西。\n别死了，晓枫。\n你的命，现在不只属于你自己。它还欠着莉兰迪亚几百条冤魂。你得活着，活着把你的枪口，对准我们共同的敌人，直到将她们彻底埋葬。\n到那时，我们再来清算我们之间的账。\n\n ——雪伊\n[?global.date.GetDateStringNoHour]"
LHS.2.a: "……嗯。不会死的"
LHS.3.t: "无声的信任"
LHS.3.d: "“头儿，”小果子的声音在狭窄的矿道里显得格外压抑，“雪伊她们…在莉兰迪亚磨坊边上，建了个新的粮仓。听说…是她们今年唯一的指望了。”\n晓枫点了点头，没有说话。1934年的那场巷战，那座磨坊，是她心中永远无法愈合的伤口。\n就在两天后，一次针对落单军团运输队的伏击，除了缴获几箱劣质弹药，晓枫还在一个军官僵硬的手指下，抽出一份被血浸透边缘的密令。借着摇曳的火光，她辨认出那熟悉的、冷酷的字迹：\n“……莉兰迪亚磨坊东侧谷仓确认为叛军新储粮点。行动代号：清野。三日后午夜，执行彻底焚毁。目标：根除其越冬之可能……”\n篝火旁的气氛瞬间冻结。一名曾参与过莉兰迪亚镇压、后来跟随晓枫兵变的年轻士兵，下意识地低声咒骂：“报应！让她们上次…”话音未落，就被身边老兵狠狠的一肘顶得闭上了嘴。所有人的目光，都投向了沉默的晓枫。\n晓枫盯着那“清野行动”几个字，胃里像塞满了冰冷的碎玻璃。军团的手段从未改变，一如当年。她沉默地将密令仔细折好，塞进一个防水油纸包。接着，在所有人困惑的目光中，她从贴身口袋里，掏出那枚冰冷的、伤疤一般的军团鹰徽——那个代表着她所有罪孽与悔恨的印记——也一并塞了进去。\n“本叔，”她对一名最年长的信使说，“把这个，送到莉兰迪亚雪伊手上。立刻回来。她们问什么，都不要说。”\n本叔粗糙的手指捏着那薄薄的油纸包，感觉到里面硬物的轮廓，脸色瞬间惨白：“头儿？！这…这徽章…她们会杀了我的！这是屠夫的标记！”\n“让她看。”晓枫的声音平静得可怕，头灯的光在她下颌投下坚硬的线条，“让她自己判断，送来这份警告的，究竟是昔日的刽子手，还是……一个背负着同样伤疤的人。”\n三天后，本叔回来了。他浑身湿透，疲惫不堪，脸上却带着一种劫后余生的恍惚。他说，他一到公社的地界就被绑了起来，刀就架在脖子上。直到她们派人核实了情报的真伪，才在天亮前放了他。\n没有信件，没有口信。她们只塞给他一个沾满新鲜泥土、沉甸甸的小麻布袋。解开粗糙的系绳，里面是十几个大小不一、但个个结实饱满的土豆。在袋子的内侧，用烧过的木炭，潦草地画着一个被圈起来的、打着叉的军团鹰徽。\n晓枫拿起一个土豆，掂量着它沉甸甸的分量。那冰凉坚硬的外壳下，似乎蕴藏着一种超越了仇恨的、顽强求生的力量。\n“明白了。”她把土豆轻轻放回袋子，声音轻得像矿道深处渗出的水滴，却带着一种尘埃落定的笃定。"
LHS.3.a: "这份信任比山还重"
#雪伊
LHS.4.t: "放眼当下"
LHS.4.d: "王室的旗帜在硝烟未散的广场上被扯下，踩进泥泞。短暂的、嘶哑的欢呼声在莉兰迪亚的街头巷尾爆发，随即被更深的疲惫和亟待解决的生存问题淹没。破碎的窗户灌着冷风，空荡的粮仓张着大口，铁轨像被巨兽撕扯过的肠子扭曲在地。\n雪伊站在临时搭起的讲台边缘，看着下方相拥而泣、疲惫却狂喜的面孔——矿工、前佣兵、磨坊女工、衣衫褴褛的农会成员...此刻都融化在同一片胜利的微光中。\n\n晓枫走到她身边，递过一个还沾着庆典彩屑的搪瓷杯，里面是温热的、兑了水的稀粥。“怎么了，一副闷闷不乐的样子”晓枫的声音不高，带着昨夜指挥战斗后的沙哑，目光扫过广场边缘几个蜷缩在毯子里的孤儿，“她们会有一个家的。”\n\n“等找到能养得起她们的人再说吧。”雪伊轻声说，更像是对自己，她深吸一口气，那混杂着硝烟、灰烬和稀粥味道的空气，是新时代第一口真实的滋味——沉重，但不容回避。"
LHS.4.a: "该考虑今后的事了"
LHS.5.t: "黎明"
LHS.5.d: "第一缕光刺穿群山的轮廓，熔金般泼洒在莉兰迪亚新翻的田垄上。\n\n晓枫推开指挥所吱呀作响的木窗，风卷着晨雾灌进来，混着远处磨坊转动的低鸣、广播站试音的电流嘶响，还有公社晒场上孩子们追逐的清脆笑声。铁轨在霞光里向地平线延伸，锃亮的轨道反射出细碎金芒。\n\n雪伊赤脚站在刚解冻的泥地里，弯腰捏碎一块板结的土块。湿润的黑色沃土从她指缝簌簌落下，裹着几颗饱满的、等待破壳的豆种。她抬起头，眯眼望向那轮挣脱山脊的巨大火球——\n\n万丈金辉正撕裂最后一丝夜寒，像亿万支灼热的箭镞，钉满整个苏醒的原野。"
LHS.5.a: "太阳照常升起"
LHS.6.t: "躁动的亡者" 
LHS.6.d: "庆典的烟火§R尚未散尽§!，卡卡罗姆群山的晚霞却凝固成一片§R污浊的脓黄§!。\n\n晓枫猛地推开指挥所窗户，刺鼻的§R铁锈混合着墓土§!的腥气灌入肺腑。远处，莉兰迪亚公社新翻的田垄上，雪伊正弯腰查看麦苗——她指尖触碰的嫩叶瞬间§R蜷曲发黑§!，渗出§R粘稠的暗红汁液§!，如同腐败的伤口。\n\n“怎么回事？！”雪伊惊骇的声音被一阵§R非自然的死寂§!吞没。磨坊巨大的水轮发出指甲刮过玻璃般的§R尖利摩擦§!，奔流的河水诡异地§R平静§!下来，表面浮起一层§R蠕动的人形泡沫§!，空洞的五官在夕阳下§R融化§!。\n\n“看东边！”瞭望哨的嘶吼撕破了寂静。晓枫的望远镜循声转向——地平线被翻涌的、§R沥青般粘稠的雾霭§!吞噬，雾中隐约可见§O深黑色§!的夜莺之国旗帜猎猎作响。\n旗帜之下：\n\n§R缝合巨尸§!背负着由§R哭嚎人骨§!组成的管风琴，每一个音符落下都化作啃噬光线的§R黑蝶§!；\n§R身着华服的王室贵妇腐尸§!提着§R滴血的镶金茶具§!，裙摆下伸出§R百只沾满胎脂的婴儿骨手§!，在泥地上抓挠出刺耳声响；\n§R空洞的骑士盔甲§!胸腔内塞满§R仍在转动的浑浊眼球§!，马蹄踏过之处，焦土竟绽放出§R不断开合利齿的肉色蔷薇§!。\n\n一个声音，既非通过空气传播，也非通过电波，而是像§R冰冷的蠕虫§!直接钻入每个人的脑髓，带着腐朽下午茶般的§R甜蜜恶意§!：\n\n“亲爱的革命者们...\n真抱歉打扰了你们§R短暂的小憩§!。\n让我们继续那场§R未尽的茶会§!吧？\n永恒的安息...\n才是§R最终的革命§!。”"
LHS.6.a: "她们究竟是...什么？"
LHS.7.t: "噩梦具现"
LHS.7.d: "侦察兵，回来了。\n或者说……是§R“它”§!，回来了。\n§R“它”§!艰难地，爬回了指挥部。§R“它”§!的眼球，像两颗被过度挤压的浆果，§R早已爆裂§!，只剩下两个不断流淌着浑浊液体的空洞。§R“它”§!的手指，深深地，陷进了自己那张……像湿透了的纸一样、被轻易§R撕裂开来的脸皮§!里。\n§R‘它’§!的嘴巴，在一张一合，却发不出任何声音。\n声音，是从§R“它”§!的肚子里，传出来的。\n“……子弹……穿过了她们的身体……”\n那声音，像是无数湿滑的虫子，在§R内脏里蠕动、摩擦§!。\n“……然后……从我的……§R眼睛里……长了出来§!……”\n“……火焰……点燃了雾霭……反而……§R煮沸了……我们的骨髓§!……”\n话音未落。\n§R“它”§!的脊椎，突然，发出了一连串令人牙酸的、骨骼错位的脆响。然后，像一根被唤醒的、活着的、鲜红的蜈蚣，猛地，§R破开了“它”后背的皮肤§!，带着淋漓的血肉，化作一根§R晶红色的骨鞭§!，狠狠地，抽碎了指挥部的窗户。\n浓雾，瞬间涌了进来。\n雾中，浮现出无数张、曾经属于王室成员的、正在§R缓缓融化的笑脸§!。\n她们的声音，不是通过耳朵听见的。而是像一根根冰冷的、生了锈的钢针，直接，扎进了每一个人的§R脑髓§!里。\n“……欢迎来到……§R真实的世界§!。”\n“这里，§R死亡，只是一扇门§!。”\n“而痛苦……”\n“……是门后面的，§R全部风景§!。"
LHS.7.a: "全军备战！"
LHS.8.t: "尖啸与哀嚎"
LHS.8.d: "§R刺耳的警报§!撕裂了莉兰迪亚山脉的黎明。东线第三矿道防御阵地传来§R疯狂的无线电呼叫§!，信号被强烈的静电干扰撕扯得支离破碎：\n\n“...它们进来了！§R墙壁在流血§!... §R石头在尖叫§!...”\n\n“...开火！开火！... §R子弹穿过去了§!... §R小若的胳膊...她的胳膊自己扭断了§!... §R啊啊啊——§!”\n\n“...别碰那影子！§R影子在吃人§!... §R它钻进李的眼睛里了§!... §R她在笑！她在笑啊！”§!\n\n信号最终被一阵§R非人的、仿佛千百个喉咙同时被撕裂的尖啸§!淹没，随后是§R死寂§!。\n\n晓枫抓起望远镜冲向观察口。曾经熟悉的矿道入口，此刻弥漫着§R粘稠如血浆的雾气§!。雾气中，几个跌跌撞撞的身影逃了出来——是第三矿道的幸存者。但她们的状态让所有人§R血液冻结§!：\n\n一名士兵抱着自己§R反向扭曲成麻花状的步枪§!，枪管如同§R融化的蜡§!般滴落；\n另一人疯狂抓挠着自己的脸，她的§R眼球在眼眶里高速旋转§!，瞳孔深处闪烁着§R不属于人类的磷火§!；\n最后一人似乎相对“完整”，但她每走一步，脚下的影子就§R扭曲膨胀§!一分，那影子伸出§R漆黑的触须§!，贪婪地吮吸着地面上渗出的、§R散发着铁锈与腐肉气味的暗红液体§!。\n\n就在她们即将逃出雾气的瞬间，那粘稠的血雾中猛地伸出§R数十条由凝固阴影构成的巨蟒般触手§!，以§R超越物理法则的速度§!缠住了逃亡者。士兵们连惨叫都来不及发出，就被§R拖回那片蠕动的、吞噬一切的猩红黑暗§!之中。矿道入口处，只留下几滩迅速干涸的§R污黑印记§!，以及空气中挥之不去的、令人作呕的§R甜腻腐臭§!。"
LHS.8.a: "§R离那里远点！§!"
LHS.9.t: "熄灭的灯"
LHS.9.d: "雪伊倚靠着冰冷的岩壁，手里紧攥着§R最后一盏完好的矿灯§!。昏黄的光晕勉强照亮她脚下一小圈湿漉漉的地面，以及对面晓枫布满血丝、深陷阴影的眼窝。\n\n“§R灯油只够烧到午夜了§!。”雪伊的声音嘶哑得像砂纸摩擦。“§R备用油脂库...被‘它们’浸透了§!。连空气都带着那股... §R甜腻的腐味§!。”\n\n晓枫没说话。她只是盯着那圈摇摇欲坠的光。矿道深处，远远传来几声§R非人的呜咽§!，随后是某种沉重物体在§R粘稠液体§!中拖行的声音，越来越近，越来越清晰。\n\n“§R通讯断绝前...§!”雪伊突然急促地开口，像是怕被那声音吞噬，“§R白城最后的消息说... 说那里的太阳... §R再也没升起来过§!。永远是... §R污浊的黄昏§!。”\n\n话音未落，§R噗——§! \n\n灯芯爆出一朵绝望的火花，骤然熄灭！\n\n彻底的、§R吞噬一切的黑暗§!瞬间淹没了两人。\n\n只剩下那拖行声，§R就在她们背后§!，混合着一种新的声音——仿佛是§R无数细小牙齿在啃噬岩石§!... 和§R骨头§!。"
LHS.9.a: "§R“别动...屏住呼吸...”§!"
LHS.10.t: "熄灭的火"
LHS.10.d: "通讯器里，雪伊的吼声，几乎要撕裂我的耳膜。\n“……晓枫！你在干什么？！快撤回来！！”\n我没有回答。\n我只是，静静地，透过望远镜，看着那片……我从未见过的、正从地平线上漫过来的、紫色的晚霞。\n很漂亮。\n漂亮得……像一场不真实的梦。\n我也看到了，在那片晚霞之下，那些……正从地里爬出来的、数也数不清的、扭曲的影子。\n来不及了。\n我早就知道，来不及了。\n在我们决定，要用最快的速度，去换取那场“完美胜利”的时候，我们就已经……错过了最后的机会了。\n雪伊，那个傻瓜。她现在，一定还以为，这只是一场普通的溃败吧。\n也好。\n这样，她才能……头也不回地，带着大家，跑得更快一点。\n我放下了望远镜，从怀里，拿出了那把……她前几天，硬塞给我的、崭新的信号枪。她说，等我们胜利了，要由我，来亲手打响那第一发庆祝的信号弹。\n我笑了笑，将枪口，对准了天空。\n那么……就让我，为你们的撤退，放出最后一朵……最灿烂的烟花吧。\n“……傻瓜。”\n我轻轻地，对着通讯器，说出了最后一句话。\n\n然后，扣动扳机。\n……\n……\n这场烟花是紫色的。\n……\n真想让禾果也看看。"
LHS.10.a: "报告，任务完成。晓枫队长..和她的队员...未能返回。§!"
LHS.11.t: "晚霞之后"
LHS.11.d: "矿洞的闸门在我身后发出了“轰隆”一声巨响，然后就彻底关上了。\n外面，是那片吞噬了一切的、紫色的黄昏，和晓枫……最后的那声“傻瓜”。\n洞里，死一样的寂静。\n\n幸存下来的同志们，一个个都像被抽走了魂一样，靠在冰冷的岩壁上。她们的眼神里，没有了光。\n“……雪伊姐。”\n一个浑身是血的年轻士兵，声音颤抖地，打破了这片死寂。\n“我们……我们是不是……输了？”\n我没有回答。\n我只是，一步一步地，走到了矿洞的最深处。走到了那根……曾经挂着镰锤与鹰徽的、我们开始的地方的枕木前。\n我伸出手，用指甲在那根浸透了我们所有人记忆的木头上，狠狠地刻下了一道新的痕迹。\n然后，我转过身。\n我看着所有人的眼睛，看着那些空洞的、绝望的、破碎的眼神。\n我用一种……连我自己都觉得陌生的、平静到可怕的声音，对她们说：\n“把眼泪，都给我擦干净。”\n“……”\n“然后，去把你们的枪，都给我拿出来。”\n“……”\n“听到了没有？”\n“……雪伊姐，可是……我们，我们还能做什么？晓枫指挥官她……”\n\n“她死了。”\n\n我打断了她的话，每一个字，都像一块冰，砸在地上。\n“她为了让我们活下来，死了。所以……我们没有权利在这里哭！！！”\n\n我走到那个年轻的士兵面前，从她颤抖的手里，拿过了那把……她已经没有力气再举起来的步枪。\n我将枪口，对准了那扇……已经彻底封死的、厚重的闸门。\n“现在，我们要做的，只有一件事。”\n我看着那扇门，就好像……在看着我们所有人的、唯一的敌人。\n“把这扇门，重新给我……凿开。"
LHS.11.a: "……"
LHS.12.t: "点名"
LHS.12.d: "洞里很暗，只有几盏矿灯照亮了一张张苍白又疲惫的脸。\n我手里拿着一份名册，是行动之前晓枫亲手写的，上面有我们每一个人的名字。\n“现在开始点名。”我的声音在寂静的矿洞里显得格外清晰。\n“安娜。”\n“……到。”一个断了手臂的老兵靠在墙边低声应道。\n“卡捷琳娜。”\n“到……”一个脸上还带着血污的女兵坐在地上举了一下手。\n“索菲亚。”\n……\n一片死寂。\n我抬起头扫视了一圈，没有她。\n我低下头在她的名字旁边用炭笔轻轻画了一个圈。\n“伊琳娜。”\n……\n又是一片死寂。\n我又在她的名字旁边画了一个圈。\n“玛利亚。”\n“奥克萨娜。”\n“达莉娅。”\n……\n圈一个接一个地出现在了那份名册上。我的手开始有点抖。\n“……雪伊姐。”\n一个声音带着哭腔从队伍里传来。\n“……别念了。”\n我没有理她。\n我只是翻到了名册的最后一页，看着那上面写的最后一个名字。\n我深吸了一口气。\n“晓枫。”\n……\n整个矿洞安静得能听到每个人心碎的声音。\n我静静地看着那个我再也熟悉不过的名字，许久才缓缓地在那两个字的旁边用尽了全身的力气画下了……最后一个圈。\n然后我合上了那本名册。\n“报告总指挥官同志。”\n我抬起头看着面前那些为数不多的还活着的身影。\n“应到全员。”\n“实到……”\n我顿了顿，然后用一种不容置疑的声音一字一句地说道：\n“……全员。”"
LHS.12.a: "……一个，都不能少"
LHS.13.t: "我们还能做什么？"
LHS.13.d: "“我们派出去探路的斥候回来了。\n她几乎是连滚带爬地冲进洞里的，脸上没有一丝血色。\n“……是旗子。”她喘着粗气，声音抖得不成样子，“王都的城墙上……挂起了王室的旗子。”\n我心里咯噔一下。\n“……还有呢？”我的声音很冷。\n“……还有，还有一股味道。”斥候的眼神里充满了恐惧，“一股……很甜的、铁锈的味道。和那天地平线上漫过来的黑雾里，一模一样的味道。”\n我明白了。\n索拉娜回来了。\n那个女人，那个曾经的夜莺之国女王，那个把亡灵当成宠物的疯子，回来了。\n她不仅回来了，她还……彻底地，和那些怪物，融为了一体。\n洞里，死一样的寂静。刚刚燃起的一点点希望，瞬间被浇灭了。\n我听到了压抑着的、绝望的抽泣声。\n我猛地一脚，踹翻了身边的一个空弹药箱，发出了刺耳的巨响。\n所有人都吓了一跳，看着我。\n“哭什么？”\n我看着她们，看着那些和我一样，从死人堆里爬出来的脸。\n“晓枫的血白流了吗？”\n“同志们的命白送了吗？”\n“我们从那片地狱里爬回来，就是为了在这里，等着被那帮不人不鬼的东西，当成晚餐吃掉的吗？！”\n我走到洞口，看着那扇封死的闸门。\n“听好了。”\n“从今天起，我们吃的每一口饭，都要想着她们的肉。”\n“我们喝的每一口水，都要想着她们的血。”\n“我们要把这该死的矿山挖穿，我们要把所有的石头都磨成刀，然后……爬出去，把那面恶心的旗子，连同那个女人的脑袋，一起，给我扯下来！”"
LHS.13.a: "撕烂她的嘴脸"
LHS.14.t: "我们能得到什么？"
LHS.14.d: "“冷。\n矿井深处的冷，能渗进骨头缝里。\n可比这更冷的，是人心。\n我已经……记不清我们在这里躲了多久了。一个月？还是一年？时间在这里，早就没了意义。\n外面，是那些怪物的世界。我们只能像老鼠一样，躲在这片不见天日的地下。\n我们啃光了最后一袋发霉的土豆，喝干了最后一捧岩壁上渗出的污水。然后……我们就开始啃自己的指甲，啃皮带，啃一切能塞进嘴里的东西。\n可饥饿，还是像一只看不见的怪物，每天，都在吞噬着我们。吞噬我们的力气，我们的理智，和我们……最后的、那一点点可怜的希望。\n今天，一位小丫头死了。那个总爱跟在我身后，叽叽喳喳的、最小的丫头。\n她不是被怪物杀死的。她是……饿死的。\n我找到她的时候，她就蜷缩在一个小小的角落里，身体已经冰冷了。她的手里，还死死地攥着半块……从岩壁上抠下来的、带着点咸味的石头。\n我抱着她，就像抱着一捆冰冷的、没有重量的柴火。\n我突然……就笑了。笑得眼泪都流了出来。\n我站起来，爬上了那块最高的岩石。我看着下面那些……和我一样，已经饿得只剩下一双双发着绿光的眼睛的、我的同志们。\n我举起手里那半截，一直被我当成武器的钢镐。\n我用尽了全身的力气，对着她们，嘶吼道：\n“饿吗？！”\n“想吃东西吗？！”\n“那就……跟我走！”\n“外面，有的是粮食！有的是……会走路的、热乎乎的肉！”\n“王宫里，索拉娜的餐桌上，还摆着我们种出来的面包！她们的酒窖里，还藏着我们酿出来的美酒！”\n“去！去把她们的肠子掏出来！去喝干她们的血！去啃碎她们的骨头！”\n“吃！饱！她！妈！的！”"
LHS.14.a: "喝她的血,吃她的肉"
LHS.15.t: "枫与雪"
LHS.15.d: "雨滴从厂房屋顶的破洞砸下，落在雪伊摊开的笔记本上。\n她猛地合拢泛黄的书页，像在藏匿偷来的糖果。\n封面是褪色的烫金字——《机动战术精要》。\n这本从晓枫行军箱里顺来的手册，像一块滚烫的烙铁，日夜灼烧着她的梦。\n她狠狠一脚踹在车间中央的坦克骨架上，回音惊飞了寒雀。\n“明明那个家伙，靠几辆破三轮车都能端掉一整个装甲连！”\n可当指尖划过自己画的履带结构图时，声音却又低了下去，像在对自己耳语。\n“……但要是那个混蛋还在……肯定早就搞出能把敌人碾成铁饼的大家伙了。”\n门外传来学徒的吆喝。\n她抓起扳手钻进底盘，冰冷的油污顺着辫子滑进衣领。\n铆钉枪的撞击声填满了厂房，她突然从车底探出头喊：“炮管！再加十毫米！”\n见到学徒发愣，她抓起一颗生锈的螺帽砸了过去。\n“看什么看！殖民佬的城墙有十二米厚！等着用你们的指甲去抠吗！”\n夜深了。\n她蜷缩在一堆废图纸里，油灯在她的颧骨上投下疲惫的光晕。那本战术手册就摊在膝头，晓枫用红笔写下的潇洒批注，浸在一片斑驳的茶渍里。\n“……笑我们没重炮……没坦克……”\n她突然猛地踹翻工具箱，无数金属零件瀑布般倾泻，惊醒了打盹的工程师。\n在所有人的屏息中，她踩着满地轴承爬上冰冷的坦克骨架，军靴在钢板上敲出清脆的笃笃声。\n“等老娘的履带碾塌她们那座石头城堡的时候，”她的声音在空旷的厂房里回荡，“我要让她们的哭声，听起来都没我们的轴承转得响！”\n晨光刺破屋顶时，新图纸已钉满整面木板墙。\n雪伊裹着一件不合身的、晓枫的旧大衣，蜷缩在坦克的炮塔模型里睡着了。她冻得通红的手指，还死死攥着那本起了毛边的战术手册。\n摊开的扉页上，晓枫那潇洒的签名和留言，正静静压着一行她后来用铅笔歪歪扭扭写上去的小字："
LHS.15.a: "等着"
LHS.16.t: "红果之海"
LHS.16.d: "雨雾黏在码头木桩上，发酵出咸腥和铁锈的味道。\n小果子蹲在生锈的绞盘边数着新增的弹孔，辫梢上那个用炮弹铜壳磨成的小铃铛，随着她的动作，发出清脆的、叮当的响声。\n“又挨打了？”\n雪伊提着扳手从机修棚钻出来，满身油污。她随手抛来一个滚烫的烤马铃薯，被小果子稳稳接住。\n“三艘！”小果子的腮帮子被烫得鼓起，她含糊不清地指向海平面上正在散去的黑烟，“殖民者的炮艇，把咱们的运输船，全都掀翻了。”她用力咽下薯肉，突然拽起雪伊的手就往礁石堆跑。\n褪潮的浅滩里，躺满了被炮弹犁碎的渔船残骸。小果子跪在一块破船板前，指甲深深抠进那黏糊糊的裂口里。\n她忽然抓起半截烧焦的船桨，狠狠插进沙地，惊起一群沙蟹。\n“看见没！我们的船，脆得像鸡蛋壳！”\n雪伊没有说话。她只是点燃一支烟，塞进了小果子还在微微发颤的唇间。\n“说重点。”她的声音很平静，“我没时间听你哭鼻子。”\n小果子猛吸一口烟，被呛得咳了两声，眼神却重新变得锐利。她从怀里掏出一个油布包，摊开来，是一张画满红蓝标记的军事海图。\n“佣兵队的快艇，吃水都很浅……”她沾着海水的指头用力划过图纸，“我们可以拆了走私犯的锅炉装船！让我们的渔民在夜里，听着声音，去给那些铁甲舰送份‘大礼’！”\n雪伊嗤笑一声。\n“想拿你那些破渔船去拼命？”她弹飞烟头，火星坠入浪花中，倏忽熄灭。\n“不是拼命！”小果子跳了起来，一脚踩在地图上，“是去收账！是一笔一笔地，把她们欠我们的，都讨回来！等我把她们的炮艇都变成海里的铁垃圾时——”\n她从口袋里摸出半块压扁的麦饼，恶狠狠掰开。\n“——我就请你，吃一顿真正的、用她们的船骸当柴火烤出来的海鱼宴！”\n翌日晨光刺破海雾，雪伊在机修棚的角落里，发现了一张新的图纸。上面用炭笔画着一个歪扭却充满杀气的舰船侧影，旁边密密麻麻写满了锅炉压力和装甲厚度的参数。\n她笑着，把图纸小心翼翼地钉在木板墙上，然后掏出一个铁皮罐头——那是她昨夜亲自带人，从殖民者仓库里“拿”回来的航海饼干。\n雪伊啃着饼干，指腹轻轻摩挲着墙上那张图纸干燥的墨迹。\n她忽然，舔了舔自己沾着盐粒的手指。\n味道，还不错。\n礁石滩上，小果子正赤脚坐在冰冷的潮汐里。她在沙地上画的那些“大铁鱼”草图，正被温柔的浪花一点点吞噬。只有那个系在她脚踝的铜铃铛，在咸涩的风里，固执地，叮当作响。"
LHS.16.a: "扬帆！"
LHS.17.t: "雪夜下的莺"
LHS.17.d: "指挥部桌案上的铅笔尖断了。\n雪伊烦躁地将断芯扫开，目光再次落在那份沾着泥污的信笺上。\n上面的字迹模糊不清，但“炮兵阵地”、“损失惨重”、“无有效反击手段”这几个词，却像烧红的针一样，刺着她的眼睛。\n天空。\n这个词现在像一座巨大的、无形的牢笼，将她们死死地困在了这片土地上。\n这不是第一次了。\n她习惯性地想去摸索那把沉重的扳手，指尖却只碰到桌面冰冷的木纹。她这才记起，这是一个无法靠拧紧一颗螺-丝就能解决的问题。这一次，她需要的是一种能撕裂这片天空的力量。\n夜深了，指挥部里静得只剩下炭火微弱的爆裂声。\n雪伊俯在桌案上，用铅笔激烈地摩擦着粗糙的纸张。一张大胆到近乎疯狂的草图正在她的笔下成形：一片隐蔽的山谷被圈定为厂址，旁边是密密麻麻的物资清单，每一个条目旁边，都用红色的笔，画下了一个像是誓言般用力的叉。\n几天后的清晨，一纸墨迹未干的正式文件，飘落在了那张伤痕累累的案头上——“《雪莺航空筹备令》”。\n批准机关处，盖着她那枚小巧而清晰的星形指挥印章。\n她盯着“雪莺”那两个字，有些出神。她突然想起，在某个最寒冷的冬天，在那片被大雪覆盖的、了无生机的山野里，她曾见过的那一小群白色的鸟。它们那么小，那么不起眼，却能在最严酷的风雪里，固执地活下去。\n“……小东西，飞得快，叫声好听，啄人可疼。”\n\n她无意识地，低声念出了当时，晓枫对她说过的那句半开玩笑的话。\n唇边不由自主地向上提了一下，旋又被她用一种近乎严厉的神情压了下去。\n“……代号而已。”她对自己说。\n她拿起那份命令书，指腹轻轻蹭了一下那新鲜湿润的墨印，像是在触摸一只尚未离巢的、倔强的雏鸟的绒毛。\n窗外，天色渐亮。\n属于天空的战争序幕，将在她笔下的这些“雪夜里的莺”的第一次振翅中，悄然拉开。"
LHS.17.a: "尚未离巢的鸟翼在煽动"
LHS.18.t: "红薯"
LHS.18.d: "新成立的村公所，地板擦得比镜子还亮。雪伊踏进来的时候，靴底的泥，在光洁的水磨石地上，印出了一串清晰的脚印。\n她没有去看那些堆积如山的、写得工工整整的账本。她只是，把一筐黑色的炭条，哗啦一下，倒在了地上。\n“喏。”她用靴尖，踢了踢散落的炭块，声音不大，却让整个房间的空气都凝固了。“墙，是白的。炭，是黑的。谁家田亩数不对，谁家抚恤金没发，或者……谁家的屋顶，还漏着雨，就自己，拿根炭条，往那面最干净的墙上写。”\n办事员们都愣住了。雪伊没理会她们。她突然蹲下，捉住一个缩在墙角、正在偷看她的、脸上还带着墨水印的小学徒的手。她挑了一根最粗的炭条，塞进孩子那小小的、因为紧张而冰凉的掌心里。\n“你告诉姐姐，”她的声音，第一次变得有些柔和，“你娘领的种子袋，是不是……比村东王家的，要瘪一点点？”\n那面雪白的墙，很快，就爬满了各种歪歪扭扭的、带着愤怒的字迹。\n当某个会计的名字，第三次出现在墙上时，雪伊正靠在门口，慢条斯理地，剥着一个烤红薯。她走到那个已经吓得面无人色的会计面前，掰下一块滚烫的、流着蜜糖汁的薯肉，粗暴地，塞进了对方的嘴里。\n“慌什么？”她舔掉自己指尖的糖汁，眼睛里，却没有一丝笑意，只有一片淬了火的、冰冷的寒光。“群众的字，不好看，是吧？没关系。一会儿，就让她们，一个字一个字地，念给你听。你数着她们的字，她们……数着你的良心。”\n月光爬上窗棂时，那面写满了“罪证”的墙，已经被小心翼翼地拆了下来，由老农们扛着，像一面流动的、无声的战旗，走向了下一个村庄。\n雪伊的影子被火把拉长在田埂上。她的衣兜里，还揣着半块没吃完的、留给守夜人的红薯。\n微微发烫。"
LHS.18.a: "遭受苦难时，群众的眼睛必然是雪亮的"
LHS.19.t: "丰收的喜悦"
LHS.19.d: "晒谷场的风卷起新麦的碎屑，雪伊站在粮仓铁梯上核对最后一组数据，白色毛衣袖口沾着钢笔水渍。老会计突然把账簿拍在粮堆顶：“整整三万斤盈余！当年你说要让粮仓顶破天，咱们都当是饿昏头的疯话...”她皱眉抽回账本，耳根却泛起不易察觉的绯色。\n缝纫厂女工们捧着亚麻布涌来。“您毛衣肘部磨薄了，”领班姑娘抖开月光般润泽的粉色布料，“大伙儿轮班织了件新的。”雪伊指尖抚过细密针脚，忽然揪住自己起球的旧衣下摆：“这件还能穿五年。”可姑娘们执意将新衣套在她身上，羊毛暖意裹住脖颈时，仓库深处传来敲击声——孩子们正把麦粒排成字：”大英雄雪伊“。\n\n“胡闹。”她扯下新衣丢进粮筐，转身走向河岸。夕照将白色毛衣染成蜜糖色，麦茬地里传来压低的笑语：“瞧见没？她偷摸捡了根最长的麦穗插在毛衣口袋里呢！”雪伊脚步一顿，从衣袋掏出麦穗掷向声音来处，金芒在空中划出流畅的弧线。河面倒影里，那件被珍重对待的旧毛衣袖口，一缕白线头正悄悄钩住一粒麦芒。"
LHS.19.a: "幸福不过如此"
LHS.20.t: "[FROM.GetName]邀请我们与其进入资源互助协会"
LHS.20.d: "同志们，仅仅是靠一国的独大是难以实现真正的社会主义的，哪怕资源再多也无济于事。\n因此，我们必须互相帮助，分享彼此之间的资源，才能共同迈向真正的共产主义社会。"
LHS.20.a: "这完全是件好事"
LHS.20.b: "我们不能做出承诺"
LHS.21.t: "南方的神秘来客？"
LHS.21.d: "那自称来自南美的使者，就在这温软的季节里，再次出现了。\n我们的部门收到通报时，大家都短暂地怔了怔。名字是雪伊——那个曾在南大陆掀起红色风暴的、以强硬和决绝著称的革命领袖。\n当真实的身影由卫兵引进来时，却和我们记忆中那个锋芒毕露的形象，有些许不同。她依然是那个黑发披散、身形娇小的少女，眉宇间那股不合年龄的沉静与坚毅，也分毫未减。但她的眼神里，少了几分过去的、咄咄逼人的锐气，多了几分……历经风雨后的深沉与疲惫。\n“日安，瓦尔哈拉的同志们。”她开口，声音不高，却奇异地穿透了花瓣拂过窗台的簌簌声。“好久不见。”\n她将一份用油布包裹得很好的地图，和一本厚厚的、封皮上印着野火标志的册子，并排放在了我们的面前。\n‘这，是艾尔孚利登的土地。’她指着那份地图，语气平静，却带着一种不容置疑的郑重。“过去，因为战争的需要，因为我的……傲慢与短视，我曾强行将它纳入公社的管辖。现在，战争结束了。我来，是把它……物归原主。”\n她顿了顿，目光扫过我们每个人的脸，没有丝毫的怯意，却带着一种……坦诚的自省。\n“我曾经以为，只要红旗插到哪里，哪里就是解放。但晓枫教给我，真正的解放，是尊重，是理解，是让每一片土地，都能发出自己的声音。这件事，我做错了。我向你们，也向艾尔孚利登的人民，道歉。”\n接着，她又轻轻地，推了推旁边那本厚厚的册子。\n“而这个……是我为我的错误，献上的、唯一的补偿。这里面，是我们这些年，在重建家园时，走过的所有弯路，犯过的所有错误，和总结出的、一点点微不足道的经验。从如何净化被亡灵污染的土地，到如何建立工人自己的管理委员会……”她的嘴角，终于露出了一丝属于她这个年纪的、略带自嘲的微笑。“……我想，这些东西，或许比几门大炮，或者几船粮食，对你们来说，更有用一些。”"
LHS.21.a: "……这，是一份无比厚重的礼物"
LHS_yyql: "情深至极的友谊"
LHS_yyql2: "情深至极的友谊"
PAN_goodfriend_tt: "§9我们会将艾尔孚利登的土地给予瓦尔哈拉社。§!"
PAN_goodfriend_tt2: "§9我们会将艾尔孚利登的土地给予瓦尔哈拉社，并会邀请其加入我们的阵营，获得共同的民族精神。§!"
LHS.22.t: "脏雪糕"
LHS.22.d: "季风灌满制服裙摆，正慌忙按头发，却见那个黑发及肩的小个子已抱膝坐在堤坝上啃甜筒，外交文件随意压在手肘下。她背后晾晒的蓝白棉被铺满半条堤岸，海风一吹就如浪涌来，差点把我们刚飘起的头发裹进被角里。\n\n“晾霉味呐，”她忽然仰头，奶霜沾在鼻尖，“贵国会晒被子吗？我们这儿的军港条例第一条：每季须把船帆铺在沙滩暴晒六小时。”她拍净身边水泥台示意我们坐下，“发霉的旗帜和霉变的信任一样，得靠太阳杀菌。”\n\n远处孩童尖叫着追逐滚落的甜筒蛋卷，她起身三两步截住，把沾沙的蛋卷掰成两截，带奶油那段塞进哭泣的孩子手心。“看，”耳语随海鸥翅膀拂过我们耳畔，“能让俩小东西分吃脏雪糕的主义，总坏不到哪去。”阳光透过被单缝隙落在她肩章，碎金跳动如融化的焦糖。"
LHS.22.a: "她来自南美洲？"
LHS.23.t: "南美洲来了个小同志"
LHS.23.d: "莫斯科的空气里，有雪沫的味道。\n我们握着外交使团厚实的手掌时，瞥见了她们身后，跟着一个……小小的、黑发的影子。\n那是个约莫二十出头的姑娘，穿着一件针脚细密的粉色毛衣。在这冰天雪地里，她显得……有些格格不入，像一只……从温暖的南方，误入了这片冰原的、倔强的麻雀。她的头顶，还固执地，翘着一根不服管的头发。\n“这是我们的小同志。”带队的同志，笑着，将她轻轻地，推到了我们面前。\n姑娘的脸，一下子就红了。她有些慌乱地，从大衣的口袋里，掏出了一个用油纸包得整整齐齐的小包，然后，直愣愣地，塞进了我们的掌心里。\n我们有些疑惑地，剥开了那层油纸。里面，是四块已经有些压碎了的、手工切成的小糖块。糖霜，还沾在她那冻得通红的指尖上。\n“……自己炒的。”\n她的声音，比她的个头，还要细小。但她的眼睛，却亮得，像两颗在黑夜里燃烧的、小小的星星。\n“……省了……三个月的糖票呢。”\n我们剥开糖纸，将那块其貌不扬的糖，放进了嘴里。咔嚓一声，焦香，混着口腔里冰冷的空气，在齿间，瞬间迸开。那是一种……无比纯粹的、带着一点点烟火气的、质朴的甜。\n那个总是皱着眉头的、最严肃的老布尔什维克，突然，笑了。他从怀里，掏出了那个他珍藏了许久、连我们都舍不得分的、从古巴来的雪茄盒，郑重地，抽出了半根，递给了她。\n甜味儿，在喉咙里，慢慢地，弥散开来的时候，窗外的克里-姆林宫，正被一层薄薄的、宁静的白雪，所覆盖。\n那个南美来的小姑娘，踮着脚，有些笨拙地，把那半根雪茄，架在了自己的耳朵上，活像……长了一根滑稽的、黑色的犄角。\n我们都知道。\n在最苦的日子里，种出来的那一点点甜，才是……最值得分享的。"
LHS.23.a:"看来，南美的同志们，和我们一样啊"
LHS.27.t: "分享甜点"
LHS.27.d: "厨房的玻璃窗，蒙上了一层厚厚的、温暖的白雾。\n我们正揉着面团，准备给孩子们烤下午茶的甜饼，一抬头，正撞见一团黑色的头发，从门框边，悄悄地，探了进来。\n是她。那个来自南方的、名叫雪伊的小同志。\n她穿着一件……与这冰天雪地格格不入的、柔软的粉色毛衣，鼻尖冻得通红。她的怀里，紧紧地，抱着一个粗陶瓮，像揣着一颗……刚刚从地里刨出来的、晒得暖烘烘的土豆。\n“……听说……你们在烤甜饼，给孩子们吃？”她有些不好意思地问。\n不等我们回答，她就把怀里的陶瓮，放在了撒满面粉的案板上。瓮盖掀开的瞬间，一股浓郁的、混杂着玉米清香和植物甜味的暖气，涌了出来。\n“这是……我母亲教我做的，甜玉米粽。”她踮起脚，想来帮忙，毛衣柔软的袖口，轻轻扫过我们的手背，痒得人忍不住缩了一下。“用……用今年新收的黄玉米，磨的浆。”\n我们笑着，教她怎么把面团搓成圆滚滚的小球。她的手指，很巧，但总沾满了面粉和玉米浆，像捧了一把细碎的、湿漉漉的碎金。\n蒸笼，‘咕嘟咕嘟’地，冒着热气。她忽然，凑到我的耳边，发梢，轻轻扫过我的耳垂。\n“……你们的甜饼，和我家乡的玉米粽，闻起来……很像。”\n我们从蒸笼里，拿出第一块烤好的、热乎乎的甜饼，掰了半块，递给了她。\n她小心翼翼地，咬了一小口，然后，眼睛，一下子就弯成了两道好看的、小小的月牙。\n“……更软一些。”\n“下次，”我们用围裙的一角，擦掉她沾在指尖上的面粉，“带你的玉米浆来。我们一起蒸，让所有的孩子，都能尝到。”\n她用力地点了点头，头顶那根总是翘着的、不服管的呆毛，也跟着晃了晃。\n“好呀！”她的声音里，充满了期待，“不过……能，能叫上大家一起吗？我想……我想学做你们的列巴，也想让她们，都尝尝我的玉米粽。”\n我们望着她那双……在蒸腾的热气里，显得格外明亮、格外清澈的眼睛，忽然，就想起了桌角那份……关于互助条约的草案。\n“好。”我们忍不住，伸出手，轻轻地，捏了捏她那冻得通红的、柔软的耳垂。\n“等你下次，带玉米浆来的时候，我们就把桌子，摆得更宽，更大一些。”"
LHS.27.a: "同志之间要相互分享"
LHS.28.t: "意想不到的来客"
LHS.28.d: "窑前的槐树下飘着炊烟，我们蹲在石凳上补军鞋，忽闻马蹄声碎。转脸便见个黑发姑娘，裹着褪了色的毛衫，怀里抱着个粗布包，发梢沾着草屑，像只急着啄米的雀儿。\n\n“同志！”她喘着气，布包往石桌上一放，“我从莉兰迪亚带了点东西。”手指抠开布结，滚出几支油布裹着的步枪，枪托上还刻着歪歪扭扭的花纹，“我们自己打的，可能不太利索，但子弹和枪都管够！”\n\n我们捡起一支端详，木柄磨得发亮。她搓着冻红的手解释：“我叫雪伊，是南美公社那边来的。”话音未落，远处传来孩子们的笑，是隔壁嬉戏的娃跑过来，扒着她裤脚要糖。她愣了愣，从衣袋摸出把樱桃，“就剩这些，甜的。”\n\n我们摘了颗塞嘴里，樱桃香混着草木从里的酸甜味。山风掀起她的衣角，露出里面缝着的补丁，倒和我们军装上的针脚像得很。\n\n“这些枪，我们收了。”我们拍拍她手背，“等打完仗，教你种南瓜。咱们的地儿，瓜秧子爬得比枪杆子还高。”\n她眼睛亮起来，发顶翘起的呆毛晃了晃：“说话算话？”\n“算话。”我们指了指窑里挂的地图，“等你下次来，这儿要添好多新标记——都是和同志们一起打下来的。”\n\n她用力点头，粗布包敞在石桌上，步枪闪着朴素的光，像几截晒暖的树根。”"
LHS.28.a: "她是从莉兰迪亚过来的？"
LHS.29.t: "南风带来的春天"
LHS.29.d: "天安门的红灯笼还挂着，胡同口的老槐树上拴着串红绸子。我们蹲在青石板上剥糖炒栗子，忽闻一阵混合着柑橘香的南风，雪伊抱着个花布包裹站在影壁前，发梢还沾着点没掸净的海盐。\n“北京的糖炒栗子，比我们那儿的火山岩烤栗子甜。”她把包裹搁在石桌上，解开几层蓝布，露出叠得方方正正的彩色织毯，“织金线的，我阿婆说，像你们国旗的颜色。”毯子摊开，是红、金的条纹，针脚密得像星子。\n\n隔壁王婶端来碗热豆浆，雪伊捧起来吹了吹，突然从兜里摸出把晒干的酸角：“给你们尝尝，我翻了好几座山采的，泡水喝能解腻。”孩子们围过来，攥着酸角跑远时，她悄悄拽我们袖子：“能教我写‘中国’二字吗？我要在织毯背面绣上。”\n\n风掀起她的衣角，露出里面别着的红布徽章，是开国大典那天我们在城楼上发的纪念章。我们指着她发顶翘起的呆毛笑：“先学会系中国结吧，你这头发，扎个小辫儿肯定精神。”\n\n她抿着嘴点头，织毯角沾了点栗子壳的金粉，在夕阳里闪，像撒了把星星。”"
LHS.29.a: "明年她会带火山岩烤栗子过来吗"
LHS.baicheng.t: "白城陷落"
LHS.baicheng.d: "“无线电在午夜彻底静默。\n\n清晨的侦察照片显示白城城墙布满裂痕。街道上没有活人移动。只有排列整齐的身影站在广场，面朝南方。\n\n侦察队带回最后的消息：防线的士兵突然停止射击。她们放下武器，排着队走进敌军阵地。老人和孩子跟在后面，没人反抗。\n\n一天后，第一支队伍出现在地平线上。她们保持生前的衣着，但步伐精确一致。白城的面包师傅走在最前面，手里还握着没送出的面包。当风吹开她的围裙，我们看到胸腔里空无一物。\n\n她们沉默地前进。没有呼吸，没有疲惫。”"
LHS.baicheng.a: "不...."
LHS.24.t: "[From.GetName]要求归还租界"
LHS.24.d: "南美近几年的变化使得[From.GetLeader]变得愈加膨胀，她们竟然将目光又一次放到了我们的殖民地上面，企图收回我们在南美大陆的利益，"
LHS.24.a: "殖民地承受不起与南美人的战争" 
LHS.24.b: "伟大的殖民地永不低头！" 
