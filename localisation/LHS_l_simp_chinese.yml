LHS.1143.d2: "[FROM.GetName]并不愿意加入我们，[FROM.GetName]对于世界革命充斥着消极的情绪，不愿意和我们合作。我们没有其他办法，但是，革命事业是必须要实现的！"
LHS.1143.d3: "[FROM.GetName]是我们最友好的同志，在接到我们的通讯后，[FROM.GetName]很快表示愿意与我们一同进行世界解放。"
LHS.1143.d4: "[FROM.GetName]是我们最友好的同志，在接到我们的通讯后，[FROM.GetName]很快表示愿意与我们一同进行世界解放。"
LHS.1143.a1: "我们团结一致！"
