LHS_xiaofengshengchan2: "干部参与劳动"
LHS_xiaofengshengchan2_desc: "劳动从不分高低贵贱，无论是工人还是农民，亦或是我们的人民干部，都要为了人民的幸福而参与劳动。"
LHS_gongrenweiyuan2: "工人自治委员会"
LHS_gongrenweiyuan2_desc: "工厂怎么管，事怎么定，不光是领导干部说了算，更要听听大家的意才对。\n“工人自治委员会”，就是我们工人的话筒，带着我们大家的想法与智慧参与到管理决策中去。"
LHS_gongrenweiyuan3: "工人自治委员会"
LHS_gongrenweiyuan3_desc: "工厂怎么管，事怎么定，不光是领导干部说了算，更要听听大家的意才对。\n“工人自治委员会”，就是我们工人的话筒，带着我们大家的想法与智慧参与到管理决策中去。"
LHS_ningshi2: "红色凝视"
LHS_ningshi2_desc: "都听好了！我们砸烂旧监牢，不是为了让蛀虫在新屋檐下打洞！规矩定了，那就是铁，谁碰，烫谁的手！\n但有一样！谁敢让我雪伊的鞭子打错了人，害了好同志，\n我第一个撕了她！\n监督员下去，不是当老爷！查厂账本要工友小组在场，量农家分田得请老把式跟着。举报信满天飞，更要筛！匿名的没证据、胡咧咧的，当纸糊灯笼点了！有名有姓、有理有据，这才是我们大家所要的公正！"
LHS_ningshi3: "红色凝视"
LHS_ningshi3_desc: "遭受苦难时，群众的眼睛必然是雪亮的。"
LHS_zhuiji2: "亡灵与走狗"
LHS_zhuiji2_desc: "我没兴趣去评判那些小姑娘的正义，也没功夫去理解那些长耳朵的所谓古老智慧。\n我只知道，当我们在为了所有人的明天而流血时，她们，正躲在自己那可笑的结界和森林里，假装什么都没看见。\n她们说，她们要守护平衡，要对抗绝望。\n可当亡灵的军队，把活人变成她们脚下的白骨时，她们的平衡在哪里？当我们的战士，饿着肚子去冲锋时，她们的希望又在哪里？\n这片土地上，没有中间地带。所有不站在我们这边的，就是在帮助敌人。所有挡在我们前进道路上的石头，不管它看起来有多漂亮，或者有多无辜……\n都只有一种下场。\n——被碾碎。"
LHS_zhuiji3: "亡灵与走狗"
LHS_zhuiji3_desc: "我没兴趣去评判那些小姑娘的正义，也没功夫去理解那些长耳朵的所谓古老智慧。\n我只知道，当我们在为了所有人的明天而流血时，她们，正躲在自己那可笑的结界和森林里，假装什么都没看见。\n她们说，她们要守护平衡，要对抗绝望。\n可当亡灵的军队，把活人变成她们脚下的白骨时，她们的平衡在哪里？当我们的战士，饿着肚子去冲锋时，她们的希望又在哪里？\n这片土地上，没有中间地带。所有不站在我们这边的，就是在帮助敌人。所有挡在我们前进道路上的石头，不管它看起来有多漂亮，或者有多无辜……\n都只有一种下场。\n——被碾碎。"
