LHS_news.1.t: "$news_event_background$莉兰迪亚的黎明"
LHS_news.1.d: "黎明前，卡卡罗姆前线联合指挥部外，寒气刺骨。晓枫借着马灯的光，在地图上画下最后一道进攻的箭头。\n雪伊站在她身后，身上还带着硝烟和消毒水的混合气味。一夜的激战，让她的脸色苍白如纸，但眼神却像燃烧的炭火。\n“都安排好了？”晓枫没有回头，声音因彻夜未眠而有些沙哑。\n“嗯。”雪伊的声音很低，“药品…只够冲锋一次了。我的人，和…你的人，都已编入同一个突击队。”她顿了顿，补充道：“没有分开。”\n晓枫画下箭头的手，微微停顿了一下。她合上地图，转过身来。灯光下，她看到雪伊紧握的双拳，指节因为用力而发白。\n“雪伊，”晓枫走近，目光平静而深邃，“你在害怕。”\n雪伊猛地抬起头，眼神像被触怒的野兽：“我没有！”\n“你在怕。”晓枫的声音依旧平静，“你不是怕死，也不是怕输。你怕的是……天亮之后，当你回头看时，这片土地上，只剩下我们两个。”\n雪伊的呼吸一滞，身体微不可察地颤抖了一下。\n晓枫没有再多说。她只是伸出手，将自己胸前那枚老军团长留下的、象征着“野火”军魂的镰锤徽章摘了下来，然后，轻轻地别在了雪伊胸前。\n“我的命，是我自己的。”晓枫看着她的眼睛，一字一句地说，“但我的后背，从今天起，是你的。”\n雪伊低头，看着那枚冰冷却沉重的徽章，久久没有说话。当她再抬起头时，眼中的火焰已经不再是单纯的仇恨，而是某种更复杂、更坚韧的东西。\n她伸出手，用力地、紧紧地握住了晓枫的手。\n“那就一起。”她的声音嘶哑，却无比坚定，“要么一起看到太阳升起，要么，就一起化作黎明前的灰烬。”"
LHS_news.1.a: "太阳，将在南美洲再次升起！"
LHS_news.1.b: "又是一群叛匪"
