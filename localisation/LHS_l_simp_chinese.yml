 # 游击火箭队超人
youji_hjp:0 "背上飞箭"
removeyouji_hjp:0 "重归轻装"
youji_hjp_tt:0 "£GFX_PAO_youjibudui 革命游击队：\n让林子里的娃娃们带上这种飞箭。重炮拉不进深山老林，我们就把炮管和弹药拆开背在肩上。在他们以为咱们没重火力的地界，给敌人一个响亮的惊喜。\n- §Y火箭炮§!需求：§G+40§!"
removeyouji_hjp_tt:0 "革命游击队：\n娃娃们应当保持滑溜的本色。背着铁管子在泥地里钻不动。把这些沉重的家伙收回仓库，留着守卫进山的村口吧。\n- §Y火箭炮§!需求：§G-40§!"

LHS_a1:0 "满手厚茧"
LHS_a1_desc:0 "“这是咱们最好的防滑纹。握稳了锄头，自然也就握稳了枪杆子。”"

LHS_a2:0 "火烧瓶子"
LHS_a2_desc:0 "“既然铁罐头砸不开，就给它添把火，让它烧得更旺些。”"

LHS_a3:0 "给车焊皮"
LHS_a3_desc:0 "“虽然慢了点，但只要皮够厚，就能护着大伙儿平平安安过草地。”"

LHS_a4:0 "背炮上山"
LHS_a4_desc:0 "“既然卡车上不去，咱们就用骨头当支架。等天亮了，给他们听听山里的声音。”"

LHS_a5:0 "随行铁棚"
LHS_a5_desc:0 "“这种慢吞吞的铁盒子，就是咱们在平原上唯一的遮雨棚。”"

LHS_a6:0 "阔步泥潭"
LHS_a6_desc:0 "“加宽了履带，咱们就是沼泽里最凶的鳄鱼。”"

LHS_a7:0 "专门打鸟"
LHS_a7_desc:0 "“天上的鸟儿要是敢飞低了，咱们就得像收割麦子一样利索。”"

LHS_a8:0 "铁盒换气"
LHS_a8_desc:0 "“给孩子们留点喘气的空当，汗水干得快，眼神才更亮。”"

LHS_a9:0 "云上盯着"
LHS_a9_desc:0 "“站得高些，方能看个真切。咱们的眼睛得飞在云彩上，才能盯紧脚下的路。”"
youji_removehjp_dec:0 "取舍背上的飞箭"
youji_removehjp_dec_desc:0 "“关于那批火箭炮的分配，咱们得听听前线娃娃们的反馈。是带上它去拆碉堡，还是腾出手来多拿两袋口粮？全由咱们自己定夺。”"

