LHS_GATHERING_STORM_DESC:"在南美洲这片被咖啡香与血腥味浸透的土地上，莉兰迪亚王室的统治依赖于一支名为“军团”的铁拳。这支部队以其冷酷高效的执行力而闻名，是王室用以碾碎一切反抗声音的利剑。1934年，正是这支军团，以压倒性的力量血腥镇压了雪伊领导的“莉兰迪亚工人起义”，将那场革命的火苗无情地踩灭在工业区的废墟之中。\n这场屠杀式的“胜利”，却在军团内部埋下了分裂的种子。思想开明的老军团长与她最为器重的参谋长晓枫，亲眼目睹了军团的炮火如何对准手无寸铁的同胞。这场胜利的残酷与不义，彻底动摇了她们曾经的忠诚。\n然而，就在她们秘密联络军中尚存良知的同袍，试图为这支迷失方向的武装力量寻找新的出路时，王室的秘密警察嗅到了背叛的气息。1935年，一场精心策划的“意外”，夺走了老军团长的生命。\n老军团长的死，成为了点燃火药桶的最后一颗火星。晓枫继承了导师的遗志，毅然发动兵变。她率领着军中最后十支忠于革命理想的步兵联队，在艾瑞波拉血巷，用血肉之躯顶住了三倍于己的、由昔日战友组成的镇压部队。在战斗的最后，她用缴获的寥寥几门野战炮炸塌峡谷隘口，为数千名被追捕的工农群众，撕开了一条通往卡卡罗姆山脉的生路。\n在废弃的矿井深处，残存的起义者们宣布成立“野火革命军”。晓枫将老军团长染血的皮带扣，与一枚简陋的镰锤标志，并排挂在了矿井的支柱上。这是一个宣言：军人的纪律与革命的灵魂，将在此地融合。\n卡卡罗姆的矿井成为了革命的熔炉，但危机如影随形——依然忠于王室的军团主力，已将她们视为头号叛徒，正准备发动下一次围剿。而矿井中的粮食储备，已不足三月……"
