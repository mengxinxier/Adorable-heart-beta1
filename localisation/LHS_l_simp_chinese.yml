LHS_crhd: "唱着歌沉入海底"
LHS_crhd_desc: "“我们中的每一个人，从登上这艘船开始，就知道自己可能再也回不来了。但这并不可怕。可怕的是，死去的时候，没有人记得你的名字，没有人知道你为何而战。所以，我给每艘船都定了一个规矩：如果到了最后一刻，被敌人包围，无法逃脱，那就把船上所有的机密文件烧掉，\n然后……大家一起，唱起那首我们都熟悉的歌，迎着敌人的炮火，冲过去。\n我们要让她们知道，即使是沉没，我们也要溅起最高、最美的浪花。”"
LHS_chsl: "她们从海上来"
LHS_chsl_desc: "“敌人总以为，危险来自陆地。她们会修筑高墙，挖好战壕，把炮口对准我们曾经的方向。但她们忘了……这片漫长的海岸线，就是我们的高速公路。我的战士们不需要在泥泞里行军数周。她们会在船上擦拭武器，在甲板上看着月亮，然后在某个清晨，像海上的雾一样，悄然出现在敌人最空虚的后方。等敌人的援军赶到时，能看到的，只会是燃尽的灰烬和我们留下的、指向下一个方向的记号。”"
LHS_cspg: "在月光下擦拭炮管"
LHS_cspg_desc: "“巨大的战舰会引来窥探的目光。\n我们的船不一样。她们在白天，会伪装成最普通的渔船或货轮，静静地停泊在任何一个不起眼的峡湾里。\n只有当月亮升起时，我们才会揭开炮衣，在无声中，擦拭每一根冰冷的炮管。\n大海，会为我们保守秘密。”"
LHS_dhsy: "大海，会吞掉一切声音"
LHS_dhsy_desc: "“我们不开火则已。\n一旦开火，就要在敌人发出求救信号之前，让她们和她们的声音，一起沉入那片最深、最冷的海底。\n我们的战斗，要像一场从未发生过的梦魇。\n天亮之后，海面上只会剩下平静的波涛，和那些无家可归的海鸟。”"
LHS_xyz: "我想要一群小燕子"
LHS_xyz_desc: "“她们问我，想要什么样的飞机。\n是能把城市炸成平地的轰炸机，还是能撞碎一切的攻击机？\n我摇了摇头。\n我想要的，是一群小小的、灵活的、能像燕子一样，在云层和山谷间自由穿梭的飞机。\n它们不需要扔下最重的炸弹，只需要……能看清地面上的一切。”"
LHS_xyz2: "我想要一群小燕子"
LHS_xyz2_desc: "“她们问我，想要什么样的飞机。\n是能把城市炸成平地的轰炸机，还是能撞碎一切的攻击机？\n我摇了摇头。\n我想要的，是一群小小的、灵活的、能像燕子一样，在云层和山谷间自由穿梭的飞机。\n它们不需要扔下最重的炸弹，只需要……能看清地面上的一切。”"
