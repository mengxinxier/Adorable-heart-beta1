LHS_xueyingxiaodui2_desc: "雪莺一号同志，雪莺二号同志！你问我为什么我们的航空队会叫这种名字？因为我喜欢，啊不对，是大家都喜欢。\n连一个站出来对这个名字提出过意见的人都没有，这跟我一贯强硬的态度有很大关系，或许...该轻点声跟同志们说话了。"
