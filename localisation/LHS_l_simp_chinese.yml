LHS_youjitiancai_desc: "§L战斗的态度，是永不气馁的态度，是在直面最终目标提出的巨大挑战时所展现出的决心，是游击战士高贵品性的缩影。§!"
LHS_sczm: "以生存之名"
LHS_sczm_desc: "§L或许一切本不至于此。或许你还有机会带她回到那座橘子园。§!"
LHS_zxljs: "杂学炼金术"
LHS_zxljs_desc: "§L不多不少的运气，现学现卖的知识，缺一不可。§!"
