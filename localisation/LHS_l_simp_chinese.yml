LHS.beimei.e: "交给[NFA.GetName]的同志" 
LHS.beimei.f: "我们会带领她们走向世界的" 
LHS.25.t: "租界回归"
LHS.25.d: "我们的强大令欧洲殖民者感到惧怕，[From.GetName]完整归还了所有租界以求于我们的和平"
LHS.25.a: "值得纪念的日子" 
LHS.26.t: "[From.GetName]拒绝归还"
LHS.26.d: "欧洲的殖民老爷们依旧如百年前一样丑恶，她们拒绝归还我们的领土，并做好了于我们决一死战的准备"
LHS.26.a: "找死！"
