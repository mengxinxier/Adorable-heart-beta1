LHS_xiaoguo: "小果子"
LHS_xiaoguo_desc: "§L大海给了她第一个名字：小果子。\n因为被那支名为“军团”的佣兵部队从海里捞起来时，这个来自遥远东方的女孩怀里，还死死抱着一个被海水泡得发白、却舍不得松手的青苹果。\n她遗忘的故乡，是一个被饥荒与战火吞噬的古老帝国。在那个人人相食的年岁，她“意外”坐上了一艘“安全”的船。\n那艘船，成了她冰冷的摇篮，大海则成了她严苛而沉默的养母。她学会了阅读浪涛的脾性，听懂了引擎的低吼，将自己活成了一尾在王室海军炮火阴影下穿梭的、没有归宿的鱼。\n老军团长和晓枫，是第一个透过她满身的盐霜与戒备，看到她灵魂深处那份航海天赋的人。她们给了她一把枪，一个目标，和一个被尊重地称呼的名字。她们让她明白，船只不仅可以用来逃亡，更可以用来冲锋。\n所以，当军团的鹰徽被同胞的鲜血玷污，当晓枫毅然举起反叛的火把时，她的选择，从未有过一丝一毫的犹豫。这并非复杂的政治抉择，而是最纯粹的回报——她要守护的，是第一个将她当作“人”而不是“货物”来看待的归宿。\n她也常常在梦里，回到一片被阳光照耀的、长满了稻禾与草药的田野。那温暖而芬芳的气味，总让她在醒来时感到一阵空洞的悲伤。§!"
LHS_xiaoguo2: "小果子"
LHS_xiaoguo2_desc: "§L大海给了她第一个名字：小果子。\n因为被那支名为“军团”的佣兵部队从海里捞起来时，这个来自遥远东方的女孩怀里，还死死抱着一个被海水泡得发白、却舍不得松手的青苹果。\n她遗忘的故乡，是一个被饥荒与战火吞噬的古老帝国。在那个人人相食的年岁，她“意外”坐上了一艘“安全”的船。\n那艘船，成了她冰冷的摇篮，大海则成了她严苛而沉默的养母。她学会了阅读浪涛的脾性，听懂了引擎的低吼，将自己活成了一尾在王室海军炮火阴影下穿梭的、没有归宿的鱼。\n老军团长和晓枫，是第一个透过她满身的盐霜与戒备，看到她灵魂深处那份航海天赋的人。她们给了她一把枪，一个目标，和一个被尊重地称呼的名字。她们让她明白，船只不仅可以用来逃亡，更可以用来冲锋。\n所以，当军团的鹰徽被同胞的鲜血玷污，当晓枫毅然举起反叛的火把时，她的选择，从未有过一丝一毫的犹豫。这并非复杂的政治抉择，而是最纯粹的回报——她要守护的，是第一个将她当作“人”而不是“货物”来看待的归宿。\n她也常常在梦里，回到一片被阳光照耀的、长满了稻禾与草药的田野。那温暖而芬芳的气味，总让她在醒来时感到一阵空洞的悲伤。§!"
